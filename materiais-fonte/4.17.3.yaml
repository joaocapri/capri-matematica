# Aula 4.17.3 — Geometria espacial: inscrição e circunscrição I (esfera e poliedros)
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: esfera e cubo (inscrita a/2, tangente às arestas a√2/2, circunscrita a√3/2); cubo inscrito numa esfera;
# paralelepípedo inscrito (diagonal = diâmetro) e por que só o cubo admite esfera inscrita; prismas regulares (triangular
# circunscrito à esfera, hexagonal inscrito); octaedro regular (circunscrita a√2/2, inscrita a√6/6). Cilindro, cone e
# tetraedro ficam para a 4.17.4.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Em toda inscrição, desenhe o centro comum e procure o triângulo retângulo que liga o centro a um ponto de contato. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Um cubo tem aresta 12. Complete.'
      itens:
      - 'Raio da esfera inscrita (tangente às faces): {{6}}'
      - 'Raio da esfera tangente às 12 arestas: {{6\sqrt{2}}}'
      - 'Raio da esfera circunscrita (pelos vértices): {{6\sqrt{3}}}'
      - 'Volume da esfera inscrita: {{288\pi}}'
      espaco_item: 8
      resolucao: |
        Do centro: à face, $\tfrac{a}{2}$; ao meio de uma aresta, metade da diagonal da face, $\tfrac{a\sqrt{2}}{2}$; ao vértice, metade da diagonal do cubo, $\tfrac{a\sqrt{3}}{2}$. Volume $\tfrac{4\pi \cdot 216}{3}$.
      resposta: '6; $6\sqrt{2}$; $6\sqrt{3}$; $288\pi$'
    - enunciado: 'Associe cada situação ao raio ou à aresta pedida.'
      esquerda:
      - 'raio da esfera inscrita num cubo de aresta $a$'
      - 'raio da esfera tangente às arestas de um cubo de aresta $a$'
      - 'raio da esfera circunscrita a um cubo de aresta $a$'
      - 'raio da esfera circunscrita a um paralelepípedo $a \times b \times c$'
      - 'aresta do cubo inscrito numa esfera de raio $R$'
      direita:
      - '$\frac{a\sqrt{3}}{2}$'
      - '$\frac{2R\sqrt{3}}{3}$'
      - '$\frac{a}{2}$'
      - '$\frac{\sqrt{a^2 + b^2 + c^2}}{2}$'
      - '$\frac{a\sqrt{2}}{2}$'
      resolucao: |
        O cubo inscrito tem diagonal $2R$: $a\sqrt{3} = 2R$.
      resposta: 'De cima para baixo: 3, 5, 1, 4, 2'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'A esfera inscrita num cubo toca cada face no seu centro.'
      - 'O raio da esfera circunscrita a um cubo de aresta $a$ é $\frac{a\sqrt{2}}{2}$.'
      - 'O diâmetro da esfera circunscrita a um paralelepípedo retângulo é a diagonal do paralelepípedo.'
      - 'Todo paralelepípedo retângulo admite uma esfera inscrita, tangente às seis faces.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) (F) Esse é o raio da esfera tangente às arestas; a circunscrita tem $\tfrac{a\sqrt{3}}{2}$. (V) (F) As três dimensões teriam de ser iguais ao diâmetro: só o cubo.
      resposta: V, F, V, F
    - enunciado: 'Complete para cubos de aresta $a$.'
      tabela:
        cabecalho: ['$a$', 'Raio da inscrita', 'Raio da circunscrita']
        linhas:
        - ['$4$', '${{2}}$', '${{2\sqrt{3}}}$']
        - ['$14$', '${{7}}$', '${{7\sqrt{3}}}$']
        - ['$2\sqrt{3}$', '${{\sqrt{3}}}$', '${{3}}$']
        - ['${{10}}$', '${{5}}$', '$5\sqrt{3}$']
      resolucao: |
        $r = \tfrac{a}{2}$ e $R = \tfrac{a\sqrt{3}}{2}$. Com $R = 5\sqrt{3}$: $a = 10$.
      resposta: '2, $2\sqrt{3}$; 7, $7\sqrt{3}$; $\sqrt{3}$, 3; 10, 5'
    - enunciado: 'O paralelepípedo da figura, de dimensões 3, 4 e 12, está inscrito numa esfera. Calcule o raio e a área da esfera.'
      figura:
        tikz: |
          \begin{scope}[scale=.35]
          \draw[ink, line width=1pt] (0,0) rectangle (4,12) (0,12) -- (1.5,13.2) -- (5.5,13.2) -- (4,12) (4,0) -- (5.5,1.2) -- (5.5,13.2);
          \draw[ink, dashed] (0,0) -- (1.5,1.2) -- (5.5,1.2) (1.5,1.2) -- (1.5,13.2);
          \draw[roxo, dashed] (0,0) -- (5.5,13.2);
          \node[below, font=\scriptsize] at (2,0) {$4$};
          \node[left, font=\scriptsize] at (0,6) {$12$};
          \node[below right, font=\scriptsize] at (4.7,0.6) {$3$};
          \end{scope}
      espaco: 8
      resolucao: |
        Diagonal $\sqrt{9 + 16 + 144} = 13$: $R = 6{,}5$. Área $4\pi \cdot 42{,}25 = 169\pi$.
      resposta: '6,5; $169\pi$'
    - enunciado: 'Um cubo está inscrito numa esfera de raio 6. Calcule a aresta e o volume do cubo.'
      espaco: 8
      resolucao: |
        $a\sqrt{3} = 12$: $a = 4\sqrt{3}$. $V = (4\sqrt{3})^3 = 192\sqrt{3}$.
      resposta: '$4\sqrt{3}$; $192\sqrt{3}$'
    - enunciado: 'Calcule a razão entre o volume da esfera inscrita num cubo e o volume do cubo.'
      espaco: 8
      resolucao: |
        $\tfrac{\tfrac{4\pi}{3}\left(\tfrac{a}{2}\right)^3}{a^3} = \tfrac{\pi}{6}$.
      resposta: '$\frac{\pi}{6}$'
  - nome: Nível 2
    questoes:
    - texto: |
        Para achar o raio da esfera circunscrita a um cubo de aresta 4, Téo usou a diagonal da face: $R = \frac{4\sqrt{2}}{2} = 2\sqrt{2}$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 10
      resolucao: |
        A esfera circunscrita passa por vértices opostos do cubo, ligados pela diagonal do cubo, $4\sqrt{3}$: $R = 2\sqrt{3}$.
      resposta: '$2\sqrt{3}$'
    - enunciado: 'Uma bola de 20 cm de diâmetro é guardada numa caixa cúbica de 20 cm de aresta. Calcule o volume vazio da caixa, com $\pi \approx 3{,}14$.'
      espaco: 10
      resolucao: |
        Caixa $8000$ cm³; bola $\tfrac{4 \cdot 3{,}14 \cdot 1000}{3} \approx 4186{,}7$ cm³. Vazio $\approx 3813{,}3$ cm³.
      resposta: '$\approx 3813{,}3$ cm³'
    - enunciado: 'Uma esfera de raio $R$ está inscrita num cubo e circunscrita a outro. Complete.'
      itens:
      - 'Aresta do cubo maior: {{2R}}'
      - 'Aresta do cubo menor: {{\frac{2R\sqrt{3}}{3}}}'
      - 'Razão entre os volumes do maior e do menor: {{3\sqrt{3}}}'
      espaco_item: 8
      resolucao: |
        O cubo maior tem aresta igual ao diâmetro; o menor tem diagonal igual ao diâmetro. Razão das arestas $\sqrt{3}$; dos volumes $(\sqrt{3})^3 = 3\sqrt{3}$.
      resposta: '$2R$; $\frac{2R\sqrt{3}}{3}$; $3\sqrt{3}$'
    - enunciado: 'Um prisma triangular regular está circunscrito a uma esfera de raio 2 (a esfera toca as duas bases e as três faces laterais). Calcule a altura, o lado da base e o volume do prisma.'
      espaco: 12
      resolucao: |
        Altura $2r = 4$. A base é um triângulo equilátero de raio inscrito 2: $\tfrac{\ell\sqrt{3}}{6} = 2$, $\ell = 4\sqrt{3}$. Base $\tfrac{48\sqrt{3}}{4} = 12\sqrt{3}$; volume $48\sqrt{3}$.
      resposta: '4; $4\sqrt{3}$; $48\sqrt{3}$'
    - enunciado: 'Um prisma hexagonal regular de aresta da base 3 e altura 8 está inscrito numa esfera. Calcule o raio da esfera.'
      espaco: 10
      resolucao: |
        O centro da esfera é o ponto médio do eixo do prisma. Um vértice está a 3 do eixo (raio do hexágono) e a 4 do plano do meio: $R = \sqrt{9 + 16} = 5$.
      resposta: '5'
    - enunciado: 'A esfera inscrita num cubo tem área $100\pi$. Calcule a aresta e o volume do cubo e o raio da esfera circunscrita.'
      espaco: 10
      resolucao: |
        $4\pi r^2 = 100\pi$: $r = 5$, $a = 10$, $V = 1000$, $R = 5\sqrt{3}$.
      resposta: '10; 1000; $5\sqrt{3}$'
    - enunciado: 'Num cubo, calcule a razão entre as áreas e entre os volumes das esferas circunscrita e inscrita.'
      espaco: 8
      resolucao: |
        Razão dos raios $\tfrac{a\sqrt{3}/2}{a/2} = \sqrt{3}$: áreas $3$, volumes $3\sqrt{3}$.
      resposta: '3 e $3\sqrt{3}$'
    - enunciado: 'Um octaedro regular tem aresta 6. Calcule o raio e o volume da esfera circunscrita a ele.'
      espaco: 10
      resolucao: |
        Os seis vértices estão nos extremos de três diagonais perpendiculares, de medida $6\sqrt{2}$ (diagonal do quadrado central): $R = 3\sqrt{2}$. $V = \tfrac{4\pi \cdot 54\sqrt{2}}{3} = 72\sqrt{2}\,\pi$.
      resposta: '$3\sqrt{2}$; $72\sqrt{2}\,\pi$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que o raio da esfera circunscrita a um cubo de aresta $a$ é $\frac{a\sqrt{3}}{2}$.'
      espaco: 10
      resolucao: |
        O centro do cubo está à mesma distância dos oito vértices: metade da diagonal. A diagonal da face é $a\sqrt{2}$, e a do cubo, $\sqrt{2a^2 + a^2} = a\sqrt{3}$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que existe uma esfera tangente às 12 arestas de um cubo de aresta $a$ e que o seu raio é $\frac{a\sqrt{2}}{2}$.'
      espaco: 10
      resolucao: |
        O centro do cubo está à mesma distância dos pontos médios das 12 arestas: metade da diagonal de uma face, $\tfrac{a\sqrt{2}}{2}$. Nesses pontos, o raio é perpendicular à aresta, logo a esfera de centro no centro do cubo e esse raio toca cada aresta no ponto médio.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que um paralelepípedo retângulo de dimensões $a$, $b$ e $c$ está inscrito numa esfera de raio $\frac{\sqrt{a^2 + b^2 + c^2}}{2}$.'
      espaco: 10
      resolucao: |
        As quatro diagonais se cortam no ponto médio de cada uma (o centro), e todas medem $\sqrt{a^2 + b^2 + c^2}$. Logo o centro está a meia diagonal dos oito vértices.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que, num cubo, o volume da esfera circunscrita é $3\sqrt{3}$ vezes o da esfera inscrita.'
      espaco: 8
      resolucao: |
        A razão dos raios é $\sqrt{3}$, e a dos volumes, $(\sqrt{3})^3 = 3\sqrt{3}$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que um paralelepípedo retângulo só admite uma esfera tangente às seis faces se for um cubo.'
      espaco: 10
      resolucao: |
        A esfera teria de tocar duas faces opostas, distantes $a$, e o seu diâmetro seria $a$. O mesmo vale para $b$ e $c$: $a = b = c$.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Uma loja embala bolas de futebol de 22 cm de diâmetro em caixas cúbicas de papelão com a menor aresta possível, como na figura. O espaço vazio da caixa é preenchido com papel picado para proteger a bola durante a entrega. Use 3 como aproximação para $\pi$.
    figura:
      tikz: |
        \begin{scope}[scale=.8]
        \draw[ink, line width=1pt] (0,0) rectangle (2,2) (0,2) -- (0.7,2.5) -- (2.7,2.5) -- (2,2) (2,0) -- (2.7,0.5) -- (2.7,2.5);
        \draw[ink, dashed] (0,0) -- (0.7,0.5) -- (2.7,0.5) (0.7,0.5) -- (0.7,2.5);
        \shade[ball color=lilas!50] (1.35,1.25) circle (0.98);
        \end{scope}
    enunciado: |
      O volume de papel picado necessário é, aproximadamente,
    opcoes: ['$5324$ cm³', '$10\,648$ cm³', '$2662$ cm³', '$15\,972$ cm³', '$4000$ cm³']
    correta: A
    resolucao: |
      Caixa $22^3 = 10\,648$ cm³; bola $\tfrac{4 \cdot 3 \cdot 11^3}{3} = 5324$ cm³. Vazio $5324$ cm³.

  - estilo: Fuvest
    enunciado: |
      O raio da esfera circunscrita a um cubo de aresta 4 é
    opcoes: ['$2\sqrt{2}$', '$2\sqrt{3}$', '$4\sqrt{3}$', '$2$', '$\sqrt{3}$']
    correta: B
    resolucao: |
      $\tfrac{4\sqrt{3}}{2} = 2\sqrt{3}$.

  - estilo: Unicamp
    enunciado: |
      Um paralelepípedo retângulo de dimensões 2, 3 e 6 está inscrito numa esfera. A área da superfície da esfera é
    opcoes: ['$\frac{49\pi}{4}$.', '$196\pi$.', '$49\pi$.', '$98\pi$.']
    correta: C
    resolucao: |
      Diagonal $\sqrt{4 + 9 + 36} = 7$: $R = \tfrac{7}{2}$, área $4\pi \cdot \tfrac{49}{4} = 49\pi$.

  - estilo: UEM
    enunciado: |
      Considere um cubo de aresta 10. Assinale o que for correto.
    proposicoes:
    - 'A esfera inscrita tem raio 5.'
    - 'A esfera circunscrita tem raio $5\sqrt{3}$.'
    - 'A esfera tangente às 12 arestas tem raio $5\sqrt{2}$.'
    - 'A área da esfera circunscrita é o triplo da área da inscrita.'
    - 'O volume da esfera inscrita é metade do volume do cubo.'
    - 'O volume da esfera circunscrita é $3\sqrt{3}$ vezes o da inscrita.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) $\tfrac{10}{2}$. 02) $\tfrac{10\sqrt{3}}{2}$. 04) $\tfrac{10\sqrt{2}}{2}$. 08) $(\sqrt{3})^2$. 16) Incorreta: é $\tfrac{\pi}{6} \approx 0{,}52$ do cubo. 32) $(\sqrt{3})^3$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      Um enfeite de Natal é formado por um cubo maciço de vidro, com 4 cm de aresta, colocado dentro de uma esfera oca e transparente, de modo que os oito vértices do cubo toquem a superfície interna da esfera. O fabricante quer saber o diâmetro interno da esfera. Use 1,73 como aproximação para $\sqrt{3}$.
    enunciado: |
      O diâmetro interno da esfera é, aproximadamente,
    opcoes: ['$4{,}0$ cm', '$5{,}7$ cm', '$8{,}0$ cm', '$6{,}9$ cm', '$12{,}0$ cm']
    correta: D
    resolucao: |
      O diâmetro é a diagonal do cubo: $4\sqrt{3} \approx 6{,}9$ cm.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir, sobre um cubo de aresta $a$.
    afirmativas:
    - 'A esfera inscrita tem raio $\frac{a}{2}$.'
    - 'A esfera circunscrita tem raio $\frac{a\sqrt{2}}{2}$.'
    - 'O diâmetro da esfera circunscrita é a diagonal do cubo.'
    - 'A esfera tangente às 12 arestas tem raio $\frac{a\sqrt{2}}{2}$.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'I e III, apenas.', 'II e IV, apenas.', 'II, III e IV, apenas.', 'I, III e IV, apenas.']
    correta: E
    resolucao: |
      I. Correta. II. Incorreta: $\tfrac{a\sqrt{3}}{2}$. III. Correta. IV. Correta.

  - estilo: Unesp
    enunciado: |
      O maior cubo que cabe dentro de uma esfera de raio $5\sqrt{3}$ tem aresta
    opcoes: ['$10$', '$5$', '$5\sqrt{2}$', '$10\sqrt{3}$', '$15$']
    correta: A
    resolucao: |
      Cubo inscrito: $a\sqrt{3} = 10\sqrt{3}$, $a = 10$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      Um prisma triangular regular está circunscrito a uma esfera de raio 3. A figura mostra a vista de cima: a base do prisma e o círculo máximo da esfera.
    figura:
      tikz: |
        \begin{scope}[scale=1.1]
        \draw[ink, line width=1pt, fill=lilas!15] (-1.039,-0.6) -- (1.039,-0.6) -- (0,1.2) -- cycle;
        \draw[roxo, line width=1pt, fill=lilas!40] (0,0) circle (0.6);
        \fill[ink] (0,0) circle (1pt);
        \draw[mudo] (0,0) -- (0,-0.6);
        \node[right, font=\scriptsize] at (0,-0.3) {$3$};
        \end{scope}
    enunciado: |
      O volume do prisma é
    opcoes: ['$54\sqrt{3}$.', '$162\sqrt{3}$.', '$108\sqrt{3}$.', '$81\sqrt{3}$.']
    correta: B
    resolucao: |
      Altura $6$. A base tem raio inscrito 3: lado $6\sqrt{3}$, área $\tfrac{108\sqrt{3}}{4} = 27\sqrt{3}$. Volume $162\sqrt{3}$.

  - estilo: Fuvest
    enunciado: |
      A razão entre o volume da esfera inscrita num cubo e o volume do cubo é
    opcoes: ['$\frac{\pi}{3}$', '$\frac{\pi}{4}$', '$\frac{\pi}{6}$', '$\frac{2\pi}{3}$', '$\frac{\pi}{8}$']
    correta: C
    resolucao: |
      $\tfrac{\tfrac{4\pi}{3} \cdot \tfrac{a^3}{8}}{a^3}$.

  - estilo: UFSC
    enunciado: |
      Um paralelepípedo retângulo de dimensões 4, 4 e 7 está inscrito numa esfera. Assinale o que for correto.
    proposicoes:
    - 'O raio da esfera é 4,5.'
    - 'A área da esfera é $81\pi$.'
    - 'O volume da esfera é $121{,}5\pi$.'
    - 'Não existe esfera tangente às seis faces desse paralelepípedo.'
    - 'A diagonal da face de lados 4 e 4 mede $4\sqrt{2}$.'
    - 'O raio da esfera é metade da diagonal da maior face.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      Diagonal $\sqrt{16 + 16 + 49} = 9$. 01) $\tfrac{9}{2}$. 02) $4\pi \cdot 20{,}25$. 04) $\tfrac{4\pi}{3} \cdot 91{,}125$. 08) Não é cubo. 16) Correta. 32) Incorreta: é metade da diagonal do paralelepípedo.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      Uma fábrica embala 8 bolinhas de raio 3 cm numa caixa cúbica, arrumadas em duas camadas de 2 por 2, cada bolinha tocando as faces vizinhas e as bolinhas ao lado. O setor de logística quer saber que porcentagem do volume da caixa é ocupada pelas bolinhas. Use 3 como aproximação para $\pi$.
    enunciado: |
      A porcentagem ocupada é, aproximadamente,
    opcoes: ['$50\%$', '$25\%$', '$75\%$', '$12{,}5\%$', '$66\%$']
    correta: A
    resolucao: |
      Caixa de aresta 12: $1728$ cm³. Bolinhas $8 \cdot \tfrac{4 \cdot 3 \cdot 27}{3} = 864$ cm³. $\tfrac{864}{1728} = 50\%$.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'A esfera inscrita num cubo de aresta 2 tem raio 1.'
    - 'O cubo inscrito numa esfera de raio 3 tem aresta 3.'
    - 'Num cubo, a área da esfera circunscrita é o triplo da área da inscrita.'
    - 'A esfera circunscrita a um octaedro regular de aresta 2 tem raio $\sqrt{2}$.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – F – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – V – F.', 'V – F – V – V.']
    correta: E
    resolucao: |
      (V) (F) $a\sqrt{3} = 6$: $a = 2\sqrt{3}$. (V) Raios na razão $\sqrt{3}$. (V) Metade da diagonal do quadrado central, $\tfrac{2\sqrt{2}}{2}$.

  - estilo: Enem
    texto: |
      Um artesão quer guardar uma caixa de joias dentro de uma bola oca de enfeite, que tem 13 cm de diâmetro interno. Uma caixa só cabe se a sua diagonal não ultrapassar o diâmetro da bola. O quadro mostra as dimensões de cinco caixas, em centímetros.
    tabela:
      cabecalho: ['Caixa', 'Dimensões']
      linhas:
      - ['C1', '$5 \times 5 \times 12$']
      - ['C2', '$6 \times 6 \times 10$']
      - ['C3', '$4 \times 8 \times 10$']
      - ['C4', '$3 \times 4 \times 12$']
      - ['C5', '$7 \times 7 \times 9$']
    enunciado: |
      A única caixa que cabe na bola é a
    opcoes: ['C1.', 'C2.', 'C3.', 'C4.', 'C5.']
    correta: D
    resolucao: |
      Quadrados das diagonais: C1 194; C2 172; C3 180; C4 169; C5 179. Só C4 tem diagonal $\sqrt{169} = 13$.

  - estilo: Unesp
    enunciado: |
      A esfera circunscrita a um cubo tem área $48\pi$. A aresta do cubo é
    opcoes: ['$2$', '$4$', '$2\sqrt{3}$', '$4\sqrt{3}$', '$8$']
    correta: B
    resolucao: |
      $4\pi R^2 = 48\pi$: $R = 2\sqrt{3}$. $\tfrac{a\sqrt{3}}{2} = 2\sqrt{3}$: $a = 4$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Um prisma hexagonal regular de aresta da base 3 e altura 8 está inscrito numa esfera. Assinale o que for correto.
    proposicoes:
    - 'O raio da esfera é 5.'
    - 'A área da esfera é $100\pi$.'
    - 'O volume do prisma é $108\sqrt{3}$.'
    - 'O segmento que une dois vértices opostos do prisma, passando pelo centro, mede 10.'
    - 'A esfera é tangente às faces laterais do prisma.'
    - 'O raio da circunferência circunscrita à base é 3.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) $\sqrt{3^2 + 4^2}$. 02) $4\pi \cdot 25$. 04) Base $6 \cdot \tfrac{9\sqrt{3}}{4}$, vezes 8. 08) É um diâmetro. 16) Incorreta: a esfera passa pelos vértices. 32) No hexágono regular, o raio é o lado.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Unicamp
    enunciado: |
      Num cubo, a razão entre o raio da esfera circunscrita e o raio da esfera inscrita é
    opcoes: ['$\sqrt{3}$.', '$\sqrt{2}$.', '$3$.', '$2$.']
    correta: A
    resolucao: |
      $\tfrac{a\sqrt{3}/2}{a/2}$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Um aquário cúbico de vidro, com 30 cm de aresta interna, tem dentro uma bola de vidro decorativa, oca e fechada, que toca as quatro paredes, o fundo e a tampa. O restante do aquário está cheio de água. O dono quer saber o volume de água e a área da superfície da bola. Use 3 como aproximação para $\pi$.
    enunciado: |
      O volume de água no aquário é
    opcoes: ['$27$ L', '$4{,}5$ L', '$13{,}5$ L', '$9$ L', '$18$ L']
    correta: C
    resolucao: |
      Bola de raio 15: $\tfrac{4 \cdot 3 \cdot 3375}{3} = 13\,500$ cm³. Água $27\,000 - 13\,500 = 13\,500$ cm³ $= 13{,}5$ L.

  - estilo: Unesp
    enunciado: |
      A área da superfície da bola é
    opcoes: ['$900$ cm²', '$5400$ cm²', '$675$ cm²', '$2700$ cm²', '$1350$ cm²']
    correta: D
    resolucao: |
      $4 \cdot 3 \cdot 225 = 2700$ cm².

  - estilo: Fuvest
    enunciado: |
      Um cubo está inscrito numa esfera de volume $36\pi$. O volume do cubo é
    opcoes: ['$27$', '$8\sqrt{3}$', '$12\sqrt{3}$', '$36$', '$24\sqrt{3}$']
    correta: E
    resolucao: |
      $R = 3$: $a\sqrt{3} = 6$, $a = 2\sqrt{3}$, $V = 24\sqrt{3}$.

  - estilo: Unesp
    texto: |
      Uma esfera é tangente às 12 arestas de um cubo de aresta 4. A figura mostra a secção do cubo e da esfera pelo plano que passa pelo centro, paralelo a duas faces: os pontos de tangência com quatro arestas são os vértices do quadrado.
    figura:
      tikz: |
        \begin{scope}[scale=.6]
        \draw[roxo, line width=1pt, fill=lilas!25] (1,1) circle (1.414);
        \draw[ink, line width=1pt] (0,0) rectangle (2,2);
        \fill[ink] (1,1) circle (1.2pt);
        \draw[mudo] (1,1) -- (2,2);
        \node[below, font=\scriptsize] at (1,0) {$4$};
        \end{scope}
    enunciado: |
      O volume da esfera é
    opcoes: ['$\frac{32\pi}{3}$', '$\frac{64\sqrt{2}\,\pi}{3}$', '$32\sqrt{3}\,\pi$', '$\frac{256\pi}{3}$', '$16\sqrt{2}\,\pi$']
    correta: B
    resolucao: |
      Raio: metade da diagonal da face, $2\sqrt{2}$. $V = \tfrac{4\pi \cdot 16\sqrt{2}}{3} = \tfrac{64\sqrt{2}\,\pi}{3}$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere um cubo de aresta $a$ e as esferas de mesmo centro que ele: a inscrita (raio $r_1$), a tangente às arestas ($r_2$) e a circunscrita ($r_3$).'
    itens:
    - 'Calcule $r_1$, $r_2$ e $r_3$, justificando.'
    - 'Prove que $r_1^2$, $r_2^2$ e $r_3^2$ estão em progressão aritmética.'
    - 'Para $a = 2$, calcule as áreas das três esferas.'
    espaco: 62
    resolucao: |
      a) Distâncias do centro à face, ao meio da aresta e ao vértice: $\tfrac{a}{2}$, $\tfrac{a\sqrt{2}}{2}$, $\tfrac{a\sqrt{3}}{2}$.
      b) $\tfrac{a^2}{4}$, $\tfrac{2a^2}{4}$, $\tfrac{3a^2}{4}$: razão $\tfrac{a^2}{4}$.
      c) Raios 1, $\sqrt{2}$, $\sqrt{3}$: áreas $4\pi$, $8\pi$, $12\pi$.
    resposta: 'c) $4\pi$, $8\pi$ e $12\pi$'

  - estilo: Unicamp
    enunciado: 'Um paralelepípedo retângulo de dimensões $a$, $b$ e $c$ está inscrito numa esfera de raio $R$.'
    itens:
    - 'Prove que $a^2 + b^2 + c^2 = 4R^2$.'
    - 'Uma caixa de base quadrada de lado 4 está inscrita numa esfera de raio 3. Calcule a altura e o volume da caixa.'
    - 'Compare esse volume com o do cubo inscrito na mesma esfera.'
    espaco: 62
    resolucao: |
      a) A diagonal é o diâmetro: $\sqrt{a^2 + b^2 + c^2} = 2R$.
      b) $16 + 16 + h^2 = 36$: $h = 2$; volume $32$.
      c) Cubo: $a\sqrt{3} = 6$, $a = 2\sqrt{3}$, volume $24\sqrt{3} \approx 41{,}6 > 32$.
    resposta: 'b) 2 e 32; c) o cubo tem volume maior ($24\sqrt{3}$)'

  - estilo: ITA
    enunciado: |
      O raio da esfera tangente às 12 arestas de um octaedro regular de aresta $a$ é
    opcoes: ['$\frac{a}{2}$', '$\frac{a\sqrt{2}}{2}$', '$\frac{a\sqrt{6}}{6}$', '$\frac{a\sqrt{3}}{2}$', '$\frac{a\sqrt{2}}{4}$']
    correta: A
    espaco: 22
    resolucao: |
      O ponto médio de uma aresta do quadrado central está a $\tfrac{a}{2}$ do centro, e todas as arestas são equivalentes por simetria.
    resposta: 'A'

  - estilo: Unesp
    texto: |
      Uma fábrica embala bolas de 20 cm de diâmetro em caixas cúbicas de papelão com a menor aresta possível.
    enunciado: ''
    itens:
    - 'Calcule a área de papelão de uma caixa para uma bola.'
    - 'Se as bolas forem embaladas de 8 em 8, em caixas cúbicas com duas camadas de 2 por 2, calcule a área de papelão por bola.'
    - 'Mostre que, nas duas embalagens, a fração do volume ocupada pelas bolas é a mesma.'
    espaco: 62
    resolucao: |
      a) Aresta 20: $6 \cdot 400 = 2400$ cm².
      b) Aresta 40: $6 \cdot 1600 = 9600$ cm², ou seja, $1200$ cm² por bola.
      c) Uma bola: $\tfrac{\pi}{6}$. Oito bolas de raio 10 em $40^3$: $\tfrac{8 \cdot \tfrac{4\pi}{3} \cdot 1000}{64\,000} = \tfrac{\pi}{6}$.
    resposta: 'a) 2400 cm²; b) 1200 cm² por bola; c) $\frac{\pi}{6}$ nos dois casos'

  - estilo: UFSC
    enunciado: |
      Considere inscrições e circunscrições de esferas em poliedros. Assinale o que for correto.
    proposicoes:
    - 'A esfera inscrita num cubo de aresta $a$ tem raio $\frac{a}{2}$.'
    - 'A esfera circunscrita a um cubo passa pelos seus oito vértices.'
    - 'O cubo inscrito numa esfera de raio $R$ tem aresta $R$.'
    - 'Um paralelepípedo de dimensões 1, 2 e 2 está inscrito numa esfera de raio 1,5.'
    - 'Num cubo, o volume da esfera circunscrita é $3\sqrt{3}$ vezes o da inscrita.'
    - 'A esfera circunscrita a um octaedro regular de aresta $a$ tem raio $\frac{a\sqrt{2}}{2}$.'
    corretas: [1, 2, 4, 5, 6]
    espaco: 22
    resolucao: |
      01) Correta. 02) Correta. 04) Incorreta: $\tfrac{2R\sqrt{3}}{3}$. 08) Diagonal $\sqrt{1 + 4 + 4} = 3$. 16) $(\sqrt{3})^3$. 32) Metade da diagonal do quadrado central.
    resposta: 'Soma 59 (01 + 02 + 08 + 16 + 32)'

  - estilo: Fuvest
    enunciado: 'Um prisma triangular regular está circunscrito a uma esfera de raio $r$.'
    itens:
    - 'Prove que a altura do prisma é $2r$ e que o lado da base é $2r\sqrt{3}$.'
    - 'Calcule o volume do prisma em função de $r$.'
    - 'Calcule a razão entre o volume da esfera e o do prisma.'
    espaco: 62
    resolucao: |
      a) A esfera toca as duas bases: altura igual ao diâmetro. O plano do meio corta a esfera no círculo máximo, inscrito no triângulo da secção: raio inscrito $r = \tfrac{\ell\sqrt{3}}{6}$, $\ell = 2r\sqrt{3}$.
      b) Base $\tfrac{\sqrt{3}}{4} \cdot 12r^2 = 3\sqrt{3}\,r^2$; volume $6\sqrt{3}\,r^3$.
      c) $\tfrac{4\pi r^3/3}{6\sqrt{3}\,r^3} = \tfrac{2\pi}{9\sqrt{3}} = \tfrac{2\sqrt{3}\,\pi}{27}$.
    resposta: 'b) $6\sqrt{3}\,r^3$; c) $\frac{2\sqrt{3}\,\pi}{27}$'

  - estilo: Unicamp
    enunciado: 'Considere um octaedro regular de aresta $a$, formado por duas pirâmides quadrangulares coladas pela base.'
    itens:
    - 'Prove que o raio da esfera circunscrita é $\frac{a\sqrt{2}}{2}$.'
    - 'Usando o volume do octaedro, $\frac{a^3\sqrt{2}}{3}$, e dividindo-o em 8 pirâmides com vértice no centro, prove que o raio da esfera inscrita é $\frac{a\sqrt{6}}{6}$.'
    - 'Para $a = 6$, calcule os dois raios.'
    espaco: 62
    resolucao: |
      a) Os vértices estão nos extremos de três segmentos perpendiculares que se cortam no centro, cada um com a medida da diagonal do quadrado central, $a\sqrt{2}$.
      b) $8 \cdot \tfrac{1}{3} \cdot \tfrac{a^2\sqrt{3}}{4} \cdot r = \tfrac{a^3\sqrt{2}}{3}$: $r = \tfrac{a\sqrt{2}}{2\sqrt{3}} = \tfrac{a\sqrt{6}}{6}$.
      c) $3\sqrt{2}$ e $\sqrt{6}$.
    resposta: 'c) $3\sqrt{2}$ e $\sqrt{6}$'

  - estilo: Fuvest
    enunciado: |
      Um paralelepípedo retângulo de dimensões 1, 2 e $x$ está inscrito numa esfera de raio 2. Então $x$ vale
    opcoes: ['$3$', '$\sqrt{5}$', '$\sqrt{13}$', '$\sqrt{11}$', '$2\sqrt{2}$']
    correta: D
    espaco: 22
    resolucao: |
      $1 + 4 + x^2 = 16$: $x = \sqrt{11}$.
    resposta: 'D'

  - estilo: Unesp
    enunciado: 'Uma caixa tem dimensões internas de 6 cm, 8 cm e 10 cm.'
    itens:
    - 'Qual o raio da maior esfera que cabe dentro da caixa? Justifique.'
    - 'Que porcentagem do volume da caixa essa esfera ocupa? Use $\pi \approx 3{,}14$.'
    - 'Calcule o raio da esfera circunscrita à caixa.'
    espaco: 62
    resolucao: |
      a) A esfera não pode ultrapassar a menor dimensão: raio 3 (diâmetro 6).
      b) $\tfrac{36\pi}{480} \approx \tfrac{113{,}04}{480} \approx 23{,}6\%$.
      c) $\tfrac{\sqrt{36 + 64 + 100}}{2} = \tfrac{\sqrt{200}}{2} = 5\sqrt{2}$.
    resposta: 'a) 3 cm; b) $\approx 23{,}6\%$; c) $5\sqrt{2}$ cm'

  - estilo: Fuvest
    enunciado: 'Considere um cubo de aresta $a$ e a esfera circunscrita a ele.'
    itens:
    - 'Calcule a área da esfera em função de $a$.'
    - 'Calcule a razão entre a área do cubo e a área da esfera.'
    - 'Calcule a razão entre o volume do cubo e o volume da esfera.'
    espaco: 62
    resolucao: |
      a) $4\pi \cdot \tfrac{3a^2}{4} = 3\pi a^2$.
      b) $\tfrac{6a^2}{3\pi a^2} = \tfrac{2}{\pi}$.
      c) Esfera $\tfrac{4\pi}{3} \cdot \tfrac{3\sqrt{3}\,a^3}{8} = \tfrac{\sqrt{3}\,\pi a^3}{2}$; razão $\tfrac{2}{\sqrt{3}\,\pi} = \tfrac{2\sqrt{3}}{3\pi}$.
    resposta: 'a) $3\pi a^2$; b) $\frac{2}{\pi}$; c) $\frac{2\sqrt{3}}{3\pi}$'
