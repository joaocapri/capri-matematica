# Fonte das listas em PDF da aula 2.9.1 — Propriedades operatórias
aula: '2.9.1'

fixacao:
  intro: Resolva na ordem — do fácil ao difícil. Use, quando necessário, $\log2=0{,}301$ e $\log3=0{,}477$. Produto vira soma, quociente vira diferença e o expoente "dá um peteleco" para a frente.
  secoes:
    - nome: Aquecimento
      questoes:
        - enunciado: Usando $\log2=0{,}301$ e $\log3=0{,}477$, calcule.
          itens:
            - $\log6$
            - $\log12$
            - $\log1{,}5$
          resolucao: |
            (a) $\log2+\log3=0{,}778$. (b) $2\log2+\log3=1{,}079$. (c) $\log\tfrac32=0{,}477-0{,}301=0{,}176$.
          resposta: '(a) $0{,}778$ \quad (b) $1{,}079$ \quad (c) $0{,}176$'

        - enunciado: Usando os mesmos valores, calcule.
          itens:
            - $\log5$
            - $\log8$
            - $\log\sqrt3$
          resolucao: |
            (a) $\log\tfrac{10}2=1-0{,}301=0{,}699$. (b) $3\log2=0{,}903$. (c) $\tfrac12\log3\approx0{,}2385$.
          resposta: '(a) $0{,}699$ \quad (b) $0{,}903$ \quad (c) $0{,}2385$'

        - enunciado: Calcule.
          itens:
            - $\log_2 12+\log_2\tfrac23$
            - $\log_3 54-\log_3 2$
          resolucao: |
            (a) $\log_2\left(12\cdot\tfrac23\right)=\log_2 8=3$. (b) $\log_3\tfrac{54}2=\log_3 27=3$.
          resposta: '(a) $3$ \quad (b) $3$'

        - enunciado: Calcule $\log25+\log4$.
          resolucao: |
            $\log(25\cdot4)=\log100=2$.
          resposta: '$2$'

        - enunciado: Calcule $2\log_5 10-\log_5 4$.
          resolucao: |
            $\log_5 100-\log_5 4=\log_5 25=2$.
          resposta: '$2$'

        - enunciado: Calcule $\log_2\sqrt8$.
          resolucao: |
            $\log_2 2^{3/2}=\tfrac32$.
          resposta: '$\tfrac32$'

        - enunciado: Sabendo que $\log_a x=2$ e $\log_a y=3$, calcule
          itens:
            - $\log_a(x^2y)$
            - $\log_a\dfrac x{y^3}$
            - $\log_a\sqrt{xy}$
          resolucao: |
            (a) $2\cdot2+3=7$. (b) $2-3\cdot3=-7$. (c) $\tfrac12(2+3)=\tfrac52$.
          resposta: '(a) $7$ \quad (b) $-7$ \quad (c) $\tfrac52$'

    - nome: Treino
      questoes:
        - enunciado: Usando $\log2=0{,}301$ e $\log3=0{,}477$, calcule $\log18$ e $\log72$.
          resolucao: |
            $\log18=\log2+2\log3=1{,}255$. \ $\log72=3\log2+2\log3=1{,}857$.
          resposta: '$1{,}255$ e $1{,}857$'

        - enunciado: Calcule $\log0{,}6$ e $\log2{,}4$.
          resolucao: |
            $\log0{,}6=\log6-\log10=0{,}778-1=-0{,}222$.
            $\log2{,}4=\log24-1=(3\log2+\log3)-1=0{,}380$.
          resposta: '$-0{,}222$ e $0{,}380$'

        - enunciado: Escreva como um único logaritmo $2\log x+\log y-\tfrac12\log z$.
          resolucao: |
            $\log x^2+\log y-\log\sqrt z=\log\dfrac{x^2y}{\sqrt z}$.
          resposta: '$\log\dfrac{x^2y}{\sqrt z}$'

        - enunciado: Desenvolva $\log\dfrac{100a^3}{b}$ em função de $\log a$ e $\log b$.
          resolucao: |
            $\log100+3\log a-\log b=2+3\log a-\log b$.
          resposta: '$2+3\log a-\log b$'

        - enunciado: Resolva $\log_2 x+\log_2(x-2)=3$.
          resolucao: |
            Condições: $x>2$. \ $\log_2[x(x-2)]=3\Rightarrow x^2-2x-8=0\Rightarrow x=4$ ou $x=-2$ (não serve).
          resposta: '$x=4$'

        - enunciado: Resolva $\log(x+1)-\log(x-1)=\log3$.
          resolucao: |
            Condição: $x>1$. \ $\dfrac{x+1}{x-1}=3\Rightarrow x+1=3x-3\Rightarrow x=2$.
          resposta: '$x=2$'

        - enunciado: Resolva $\log_3 x+\log_3(x+6)=3$.
          resolucao: |
            $x(x+6)=27\Rightarrow x^2+6x-27=0\Rightarrow x=3$ ou $x=-9$ (não serve, pois $x>0$).
          resposta: '$x=3$'

        - enunciado: Sendo $a=\log2$, escreva $\log12{,}5$ em função de $a$.
          resolucao: |
            $12{,}5=\dfrac{100}8$: $\log100-\log8=2-3a$.
          resposta: '$2-3a$'

    - nome: Desafio
      questoes:
        - enunciado: Quantos algarismos tem o número $2^{50}$? (Use $\log2=0{,}301$.)
          resolucao: |
            $\log2^{50}=50\cdot0{,}301=15{,}05$, então $10^{15}<2^{50}<10^{16}$: o número tem $16$ algarismos.
          resposta: '$16$'

        - enunciado: Calcule $\log_2 3\cdot\log_3 4\cdot\log_4 8$ escrevendo cada fator como quociente de logaritmos decimais.
          resolucao: |
            $\dfrac{\log3}{\log2}\cdot\dfrac{\log4}{\log3}\cdot\dfrac{\log8}{\log4}=\dfrac{\log8}{\log2}=\dfrac{3\log2}{\log2}=3$.
          resposta: '$3$'

        - enunciado: Resolva $\log(x-3)+\log x=1$.
          resolucao: |
            Condição $x>3$. \ $x(x-3)=10\Rightarrow x^2-3x-10=0\Rightarrow x=5$ ou $x=-2$ (não serve).
          resposta: '$x=5$'

        - enunciado: Sabendo que $\log a=0{,}4$ e $\log b=0{,}3$, calcule $\log\dfrac{a^2}{\sqrt b}$ e $\log(10ab)$.
          resolucao: |
            $2\cdot0{,}4-\tfrac12\cdot0{,}3=0{,}65$. \ $1+0{,}4+0{,}3=1{,}7$.
          resposta: '$0{,}65$ e $1{,}7$'

        - enunciado: Simplifique $\log_2 4+\log_2 8+\log_2 16+\cdots+\log_2 1024$.
          resolucao: |
            $2+3+4+\cdots+10=\dfrac{(2+10)\cdot9}{2}=54$.
          resposta: '$54$'

vestibular:
  intro: Questões autorais no estilo dos principais vestibulares. Quando necessário, use $\log2=0{,}301$ e $\log3=0{,}477$.
  questoes:
    - enunciado: O valor de $\log20$ é
      opcoes: ['$0{,}602$', '$1{,}301$', '$2{,}301$', '$3{,}01$', '$0{,}699$']
      correta: B
      resolucao: |
        $\log(2\cdot10)=0{,}301+1=1{,}301$.

    - enunciado: O valor de $\log0{,}5$ é
      opcoes: ['$-0{,}301$', '$0{,}699$', '$-0{,}699$', '$0{,}301$', '$0{,}150$']
      correta: A
      resolucao: |
        $\log\tfrac12=-\log2=-0{,}301$.

    - enunciado: O valor de $\log60$ é
      opcoes: ['$0{,}778$', '$1{,}477$', '$7{,}78$', '$1{,}903$', '$1{,}778$']
      correta: E
      resolucao: |
        $\log6+\log10=0{,}778+1=1{,}778$.

    - enunciado: O valor de $\log_2 40-\log_2 5$ é
      opcoes: ['$2$', '$8$', '$35$', '$3$', '$\log_2 35$']
      correta: D
      resolucao: |
        $\log_2\tfrac{40}5=\log_2 8=3$.

    - enunciado: O valor de $\log_3 18+\log_3\tfrac12$ é
      opcoes: ['$1$', '$9$', '$3$', '$\log_3 18{,}5$', '$2$']
      correta: E
      resolucao: |
        $\log_3 9=2$.

    - enunciado: O valor de $\log50+\log2$ é
      opcoes: ['$1$', '$\log52$', '$2$', '$10$', '$100$']
      correta: C
      resolucao: |
        $\log100=2$.

    - enunciado: Se $\log x=2\log3-\log2$, então $x$ vale
      opcoes: ['$4$', '$\dfrac92$', '$6$', '$\dfrac32$', '$3$']
      correta: B
      resolucao: |
        $\log x=\log9-\log2=\log\tfrac92$.

    - enunciado: O valor de $\log\sqrt{1000}$ é
      opcoes: ['$\sqrt3$', '$3$', '$1{,}5$', '$30$', '$0{,}5$']
      correta: C
      resolucao: |
        $\tfrac12\log1000=\tfrac32$.

    - enunciado: O valor de $\log_a\left(a^3\sqrt a\right)$ é
      opcoes: ['$3$', '$1{,}5$', '$4$', '$3{,}5$', '$a^{3{,}5}$']
      correta: D
      resolucao: |
        $a^3\cdot a^{1/2}=a^{7/2}$: $\tfrac72=3{,}5$.

    - enunciado: Se $\log a=0{,}4$ e $\log b=0{,}3$, então $\log(a^2b)$ vale
      opcoes: ['$0{,}7$', '$0{,}048$', '$1{,}1$', '$0{,}11$', '$1{,}4$']
      correta: C
      resolucao: |
        $2\cdot0{,}4+0{,}3=1{,}1$.

    - enunciado: O número $3^{20}$ tem
      opcoes: ['$9$ algarismos', '$10$ algarismos', '$11$ algarismos', '$20$ algarismos', '$60$ algarismos']
      correta: B
      resolucao: |
        $\log3^{20}=20\cdot0{,}477=9{,}54$: o número está entre $10^9$ e $10^{10}$, com $10$ algarismos.

    - enunciado: A solução de $\log_2 x+\log_2 x^2=6$ é
      opcoes: ['$2$', '$\sqrt2$', '$8$', '$64$', '$4$']
      correta: E
      resolucao: |
        $3\log_2 x=6\Rightarrow\log_2 x=2\Rightarrow x=4$.

    - enunciado: O valor de $\log\tfrac18$ é
      opcoes: ['$-0{,}903$', '$0{,}903$', '$-0{,}125$', '$-0{,}301$', '$0{,}097$']
      correta: A
      resolucao: |
        $-\log8=-3\log2=-0{,}903$.

    - enunciado: A solução de $\log(x-3)+\log x=1$ é
      opcoes: ['$-2$', '$5$', '$-2$ e $5$', '$10$', '$13$']
      correta: B
      resolucao: |
        $x^2-3x-10=0\Rightarrow x=5$ ou $x=-2$; só $x=5$ satisfaz $x>3$.

    - enunciado: Sendo $a=\log2$, o valor de $\log12{,}5$ é
      opcoes: ['$1+a$', '$2a-3$', '$3a-2$', '$2-3a$', '$\dfrac{12}{5}a$']
      correta: D
      resolucao: |
        $12{,}5=\tfrac{100}8$: $2-3a$.

    - enunciado: A solução de $\log_2(x+2)-\log_2(x-1)=2$ é
      opcoes: ['$1$', '$3$', '$2$', '$4$', '$6$']
      correta: C
      resolucao: |
        $\dfrac{x+2}{x-1}=4\Rightarrow x+2=4x-4\Rightarrow x=2$.

    - enunciado: O valor de $\log2+\log3+\log5$ é, aproximadamente,
      opcoes: ['$1{,}076$', '$1{,}301$', '$1{,}000$', '$1{,}477$', '$0{,}301$']
      correta: D
      resolucao: |
        $\log(2\cdot3\cdot5)=\log30=\log3+1=1{,}477$.

    - enunciado: O valor de $\log72$ é
      opcoes: ['$1{,}857$', '$1{,}556$', '$1{,}954$', '$0{,}857$', '$2{,}857$']
      correta: A
      resolucao: |
        $72=2^3\cdot3^2$: $0{,}903+0{,}954=1{,}857$.

    - enunciado: Se $\log_a x=2$ e $\log_a y=3$, então $\log_a\dfrac{x^3}{y^2}$ vale
      opcoes: ['$0$', '$12$', '$1$', '$\dfrac23$', '$-1$']
      correta: A
      resolucao: |
        $3\cdot2-2\cdot3=0$.

    - enunciado: O valor de $\log4+\log25-\log10$ é
      opcoes: ['$0$', '$2$', '$10$', '$\log19$', '$1$']
      correta: E
      resolucao: |
        $\log\dfrac{4\cdot25}{10}=\log10=1$.
