# Aula 3.7.1 — Geometria analítica: distância entre dois pontos
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: plano cartesiano e quadrantes; fórmula da distância (Pitágoras); distância à origem;
# classificar triângulos e quadriláteros por lados; pontos equidistantes; distância com parâmetro.
# Ponto médio (3.7.2), alinhamento e área (3.7.3) e equação da reta (3.8) ficam para as próximas aulas.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Complete o quadro com o quadrante de cada ponto (ou com o eixo, se ele estiver sobre um eixo).'
      tabela:
        cabecalho: ['Ponto', 'Localização']
        linhas:
        - ['$A(3, -2)$', '{{4º quadrante}}']
        - ['$B(-1, 5)$', '{{2º quadrante}}']
        - ['$C(-4, -3)$', '{{3º quadrante}}']
        - ['$D(0, 7)$', '{{eixo das ordenadas}}']
      resolucao: |
        1º quadrante: $x > 0$ e $y > 0$; 2º: $x < 0$ e $y > 0$; 3º: $x < 0$ e $y < 0$; 4º: $x > 0$ e $y < 0$. Com $x = 0$, o ponto está no eixo $y$.
      resposta: '4º, 2º, 3º; eixo $y$'
    - enunciado: 'Calcule a distância entre $A(1, 2)$ e $B(4, 6)$, completando.'
      figura:
        tikz: |
          \begin{scope}[scale=.55]
          \draw[step=1, gray!25, very thin] (0,0) grid (6,7);
          \draw[-latex, ink!60] (-0.3,0) -- (6.4,0) node[right, font=\scriptsize] {$x$};
          \draw[-latex, ink!60] (0,-0.3) -- (0,7.4) node[above, font=\scriptsize] {$y$};
          \draw[roxo, line width=1pt] (1,2) -- (4,6);
          \draw[ink!60, dashed] (1,2) -- (4,2) -- (4,6);
          \fill[roxo] (1,2) circle (3pt) node[left, font=\scriptsize] {$A$};
          \fill[roxo] (4,6) circle (3pt) node[above left, font=\scriptsize] {$B$};
          \end{scope}
      itens:
      - 'Diferença das abscissas: $4 - 1 = {{3}}$.'
      - 'Diferença das ordenadas: $6 - 2 = {{4}}$.'
      - 'Por Pitágoras: $d_{AB} = \sqrt{3^2 + 4^2} = {{5}}$.'
      resolucao: |
        As diferenças são os catetos do triângulo tracejado, e $AB$ é a hipotenusa: $d = \sqrt{9 + 16} = 5$.
      resposta: '$3$, $4$ e $5$'
    - enunciado: 'Calcule a distância entre os pontos.'
      itens:
      - '$(0, 0)$ e $(5, 12)$'
      - '$(-2, 3)$ e $(4, -5)$'
      - '$(1, 1)$ e $(3, 4)$'
      - '$(2, -1)$ e $(2, 6)$'
      espaco_item: 12
      resolucao: |
        (a) $\sqrt{25 + 144} = 13$. (b) $\sqrt{6^2 + (-8)^2} = \sqrt{100} = 10$.
        (c) $\sqrt{4 + 9} = \sqrt{13}$. (d) Mesma abscissa: $|6 - (-1)| = 7$.
      resposta: '(a) $13$ (b) $10$ (c) $\sqrt{13}$ (d) $7$'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - '$d_{AB} = d_{BA}$ para quaisquer pontos $A$ e $B$.'
      - 'A distância entre $(a, 0)$ e $(b, 0)$ é sempre $b - a$.'
      - 'A distância de $P(x, y)$ à origem é $\sqrt{x^2 + y^2}$.'
      - 'A distância entre $(1, 2)$ e $(4, 6)$ é $3 + 4 = 7$.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) As diferenças só trocam de sinal, e os quadrados são iguais. (F) É $|b - a|$: se $b < a$, $b - a$ é negativo.
        (V) É a fórmula com $(0, 0)$. (F) Os catetos não se somam; a distância é $\sqrt{9 + 16} = 5$.
      resposta: V, F, V, F
    - enunciado: 'Associe cada par de pontos à distância entre eles (uma distância pode ser usada mais de uma vez).'
      esquerda:
      - '$5$'
      - '$10$'
      - '$\sqrt{2}$'
      direita:
      - '$(0, 0)$ e $(3, 4)$'
      - '$(1, 1)$ e $(2, 2)$'
      - '$(-3, -4)$ e $(3, 4)$'
      - '$(2, 5)$ e $(-1, 1)$'
      - '$(6, 0)$ e $(0, 8)$'
      resolucao: |
        Diferenças: $(3, 4)$: 5. $(1, 1)$: $\sqrt{2}$. $(6, 8)$: 10. $(-3, -4)$: 5. $(-6, 8)$: 10.
      resposta: 'De cima para baixo: 1, 3, 2, 1, 2'
    - enunciado: 'Calcule o perímetro do triângulo de vértices $A(0, 0)$, $B(6, 0)$ e $C(0, 8)$.'
      espaco: 14
      resolucao: |
        $AB = 6$, $AC = 8$ e $BC = \sqrt{36 + 64} = 10$. Perímetro: $24$.
      resposta: '$24$'
    - enunciado: 'Calcule a distância de cada ponto à origem.'
      itens:
      - '$P(-5, 12)$'
      - '$Q(0, -7)$'
      - '$R(1, -1)$'
      espaco_item: 10
      resolucao: |
        (a) $\sqrt{25 + 144} = 13$. (b) $7$. (c) $\sqrt{1 + 1} = \sqrt{2}$.
      resposta: '(a) $13$ (b) $7$ (c) $\sqrt{2}$'
  - nome: Nível 2
    questoes:
    - texto: |
        Para calcular a distância entre $A(-2, 1)$ e $B(4, -7)$, Davi escreveu: $d = \sqrt{(4 - 2)^2 + (-7 - 1)^2} = \sqrt{4 + 64} = \sqrt{68}$.
      enunciado: 'Encontre o erro de Davi e calcule a distância correta.'
      espaco: 14
      resolucao: |
        A diferença das abscissas é $4 - (-2) = 6$, e não $4 - 2$. Correto: $d = \sqrt{36 + 64} = \sqrt{100} = 10$.
      resposta: '$10$'
    - enunciado: 'Classifique cada triângulo quanto aos lados e diga se ele é retângulo.'
      itens:
      - '$A(0, 0)$, $B(4, 0)$ e $C(2, 5)$'
      - '$A(1, 1)$, $B(4, 5)$ e $C(4, 1)$'
      espaco_item: 18
      resolucao: |
        (a) $AB = 4$, $AC = \sqrt{4 + 25} = \sqrt{29}$, $BC = \sqrt{4 + 25} = \sqrt{29}$: isósceles. Não é retângulo: $16 + 29 \neq 29$ e $29 + 29 \neq 16$.
        (b) $AC = 3$, $BC = 4$, $AB = 5$: escaleno e retângulo em $C$, pois $9 + 16 = 25$.
      resposta: '(a) isósceles, não retângulo (b) escaleno, retângulo em $C$'
    - enunciado: 'Determine o ponto $P$ do eixo $x$ que é equidistante de $A(1, 3)$ e $B(5, 1)$.'
      espaco: 18
      resolucao: |
        $P(x, 0)$: $(x - 1)^2 + 9 = (x - 5)^2 + 1$. Desenvolvendo: $-2x + 10 = -10x + 26$, $8x = 16$, $x = 2$.
        $P(2, 0)$. Conferência: $PA = PB = \sqrt{10}$.
      resposta: '$P(2, 0)$'
    - enunciado: 'Determine os valores de $k$ para os quais a distância entre $A(1, k)$ e $B(4, 1)$ é 5.'
      espaco: 16
      resolucao: |
        $9 + (k - 1)^2 = 25$, $(k - 1)^2 = 16$, $k - 1 = \pm 4$: $k = 5$ ou $k = -3$.
      resposta: '$k = 5$ ou $k = -3$'
    - texto: |
        No mapa quadriculado, cada lado de quadradinho representa 100 m. A casa de Lia está em $C$ e a escola, em $E$.
      figura:
        tikz: |
          \begin{scope}[scale=.42]
          \draw[step=1, gray!30, very thin] (0,0) grid (8,11);
          \draw[-latex, ink!60] (-0.3,0) -- (8.4,0) node[right, font=\scriptsize] {$x$};
          \draw[-latex, ink!60] (0,-0.3) -- (0,11.4) node[above, font=\scriptsize] {$y$};
          \fill[roxo] (1,2) circle (4pt) node[left, font=\scriptsize] {$C$};
          \fill[ink] (7,10) circle (4pt) node[right, font=\scriptsize] {$E$};
          \end{scope}
      enunciado: 'Qual é a distância, em linha reta, da casa à escola? E quanto Lia anda se só puder seguir as linhas do quadriculado?'
      espaco: 16
      resolucao: |
        $C(1, 2)$ e $E(7, 10)$: $d = \sqrt{6^2 + 8^2} = 10$ unidades, isto é, 1000 m.
        Pelas linhas: $6 + 8 = 14$ unidades, isto é, 1400 m.
      resposta: '1000 m em linha reta; 1400 m pelas linhas'
    - enunciado: 'Complete o quadro com a distância de $P(2, 3)$ a cada ponto.'
      tabela:
        cabecalho: ['Ponto', 'Distância a $P$']
        linhas:
        - ['$A(5, 7)$', '${{5}}$']
        - ['$B(-4, 11)$', '${{10}}$']
        - ['$C(2, -2)$', '${{5}}$']
        - ['$D(14, 8)$', '${{13}}$']
      resolucao: |
        $A$: $(3, 4)$, 5. $B$: $(-6, 8)$, 10. $C$: $(0, -5)$, 5. $D$: $(12, 5)$, 13.
      resposta: '$5$, $10$, $5$, $13$'
    - enunciado: 'Considere o quadrilátero de vértices $A(0, 0)$, $B(4, 3)$, $C(4, 8)$ e $D(0, 5)$.'
      itens:
      - 'Mostre que os quatro lados têm a mesma medida.'
      - 'Calcule as diagonais $AC$ e $BD$.'
      - 'Calcule a área, sabendo que num losango ela é o produto das diagonais dividido por 2.'
      espaco_item: 16
      resolucao: |
        (a) $AB = \sqrt{16 + 9} = 5$, $BC = 5$, $CD = \sqrt{16 + 9} = 5$, $DA = 5$: é um losango.
        (b) $AC = \sqrt{16 + 64} = \sqrt{80} = 4\sqrt{5}$ e $BD = \sqrt{16 + 4} = \sqrt{20} = 2\sqrt{5}$.
        (c) $\tfrac{4\sqrt{5} \cdot 2\sqrt{5}}{2} = \tfrac{40}{2} = 20$.
      resposta: '(b) $4\sqrt{5}$ e $2\sqrt{5}$ (c) $20$'
    - enunciado: 'Determine $a$ para que a distância entre $A(a, 2)$ e $B(3, a)$ seja $\sqrt{5}$.'
      espaco: 18
      resolucao: |
        $(3 - a)^2 + (a - 2)^2 = 5$: $2a^2 - 10a + 13 = 5$, $a^2 - 5a + 4 = 0$, $a = 1$ ou $a = 4$.
      resposta: '$a = 1$ ou $a = 4$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Determine o ponto equidistante de $A(0, 0)$, $B(6, 0)$ e $C(0, 4)$ e a distância comum. Onde fica esse ponto em relação ao triângulo?'
      espaco: 24
      resolucao: |
        $P(x, y)$ com $PA = PB$: $x^2 = (x - 6)^2$, $x = 3$. Com $PA = PC$: $y^2 = (y - 4)^2$, $y = 2$.
        $P(3, 2)$, a $\sqrt{9 + 4} = \sqrt{13}$ dos três. O triângulo é retângulo em $A$, e $P$ fica sobre a hipotenusa $BC$ (no meio dela).
      resposta: '$P(3, 2)$; $\sqrt{13}$'
    - enunciado: 'Determine o ponto da reta $y = x$ que é equidistante de $A(1, 0)$ e $B(0, 3)$.'
      espaco: 18
      resolucao: |
        $P(t, t)$: $(t - 1)^2 + t^2 = t^2 + (t - 3)^2$. Então $-2t + 1 = -6t + 9$, $t = 2$. $P(2, 2)$, com $PA = PB = \sqrt{5}$.
      resposta: '$P(2, 2)$'
    - enunciado: 'Mostre que o triângulo de vértices $A(-1, 2)$, $B(2, 6)$ e $C(6, 3)$ é isósceles e retângulo, e calcule a sua área.'
      espaco: 20
      resolucao: |
        $AB = \sqrt{9 + 16} = 5$, $BC = \sqrt{16 + 9} = 5$ e $AC = \sqrt{49 + 1} = \sqrt{50}$. Isósceles ($AB = BC$) e retângulo em $B$ ($25 + 25 = 50$).
        Área: $\tfrac{5 \cdot 5}{2} = \tfrac{25}{2}$.
      resposta: 'Área $\frac{25}{2}$'
    - enunciado: 'Os pontos $P(x, y)$ que distam 5 de $A(3, 4)$ satisfazem uma equação.'
      itens:
      - 'Escreva essa equação.'
      - 'Determine os pontos desse conjunto que estão no eixo $x$.'
      espaco_item: 16
      resolucao: |
        (a) $\sqrt{(x - 3)^2 + (y - 4)^2} = 5$, ou $(x - 3)^2 + (y - 4)^2 = 25$.
        (b) Com $y = 0$: $(x - 3)^2 = 9$, $x = 0$ ou $x = 6$. Pontos $(0, 0)$ e $(6, 0)$.
      resposta: '(a) $(x - 3)^2 + (y - 4)^2 = 25$ (b) $(0, 0)$ e $(6, 0)$'
    - enunciado: 'Determine os pontos do eixo $y$ que distam 10 de $A(6, 1)$. Mostre que eles formam com $A$ um triângulo isósceles e calcule a área desse triângulo.'
      espaco: 24
      resolucao: |
        $P(0, y)$: $36 + (y - 1)^2 = 100$, $y - 1 = \pm 8$: $P(0, 9)$ e $Q(0, -7)$.
        $AP = AQ = 10$: isósceles. A base $PQ = 16$ está no eixo $y$, e a altura é a distância de $A$ ao eixo, 6. Área: $\tfrac{16 \cdot 6}{2} = 48$.
      resposta: '$(0, 9)$ e $(0, -7)$; área $48$'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      O mapa quadriculado mostra um posto de saúde, em $P$, e um hospital, em $H$. Cada lado de quadradinho corresponde a 50 m. Um drone de entregas de medicamentos voa em linha reta do posto ao hospital.
    figura:
      tikz: |
        \begin{scope}[scale=.36]
        \draw[step=1, gray!30, very thin] (0,0) grid (15,7);
        \draw[-latex, ink!60] (-0.3,0) -- (15.5,0) node[right, font=\scriptsize] {$x$};
        \draw[-latex, ink!60] (0,-0.3) -- (0,7.5) node[above, font=\scriptsize] {$y$};
        \fill[roxo] (2,1) circle (5pt) node[above left, font=\scriptsize] {$P$};
        \fill[ink] (14,6) circle (5pt) node[above right, font=\scriptsize] {$H$};
        \draw[roxo, dashed] (2,1) -- (14,6);
        \end{scope}
    enunciado: |
      A distância percorrida pelo drone é
    opcoes: ['550 m.', '600 m.', '650 m.', '850 m.', '900 m.']
    correta: C
    resolucao: |
      $P(2, 1)$ e $H(14, 6)$: $d = \sqrt{12^2 + 5^2} = 13$ quadradinhos, isto é, $13 \cdot 50 = 650$ m.
      850 m seria o caminho pelas linhas do quadriculado, $(12 + 5) \cdot 50$.

  - estilo: Fuvest
    enunciado: |
      A distância entre os pontos $(-3, 2)$ e $(5, -4)$ é
    opcoes: ['$2$', '$4$', '$6$', '$8$', '$10$']
    correta: E
    resolucao: |
      $\sqrt{8^2 + (-6)^2} = \sqrt{100} = 10$.

  - estilo: Unicamp
    enunciado: |
      A distância do ponto $P(-6, 8)$ à origem é
    opcoes: ['$10$.', '$14$.', '$2$.', '$\sqrt{28}$.']
    correta: A
    resolucao: |
      $\sqrt{36 + 64} = 10$. 14 é $6 + 8$, e 2 é $8 - 6$.

  - estilo: UEM
    enunciado: |
      Considere os pontos $A(1, 2)$, $B(4, 6)$ e $C(1, 6)$. Assinale o que for correto.
    proposicoes:
    - 'A distância entre $A$ e $B$ é 5.'
    - 'A distância entre $A$ e $C$ é 4.'
    - 'A distância entre $B$ e $C$ é 3.'
    - 'O triângulo $ABC$ é retângulo em $C$.'
    - 'O perímetro do triângulo $ABC$ é 13.'
    - 'A área do triângulo $ABC$ é 6.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) $\sqrt{9 + 16} = 5$. 02) Mesma abscissa: $6 - 2 = 4$. 04) Mesma ordenada: $4 - 1 = 3$.
      08) $AC$ é vertical e $BC$ é horizontal: ângulo reto em $C$. 16) Incorreta: $5 + 4 + 3 = 12$. 32) $\tfrac{3 \cdot 4}{2} = 6$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Unesp
    texto: |
      A figura mostra o triângulo de vértices $A(0, 0)$, $B(6, 0)$ e $C(3, 4)$.
    figura:
      tikz: |
        \begin{scope}[scale=.55]
        \draw[step=1, gray!25, very thin] (0,0) grid (7,5);
        \draw[-latex, ink!60] (-0.3,0) -- (7.4,0) node[right, font=\scriptsize] {$x$};
        \draw[-latex, ink!60] (0,-0.3) -- (0,5.4) node[above, font=\scriptsize] {$y$};
        \draw[roxo, line width=1pt, fill=roxo!10] (0,0) -- (6,0) -- (3,4) -- cycle;
        \node[below left, font=\scriptsize] at (0,0) {$A$};
        \node[below, font=\scriptsize] at (6,0) {$B$};
        \node[above, font=\scriptsize] at (3,4) {$C$};
        \end{scope}
    enunciado: |
      O perímetro desse triângulo é
    opcoes: ['$12$', '$13$', '$14$', '$15$', '$16$']
    correta: E
    resolucao: |
      $AB = 6$, $AC = \sqrt{9 + 16} = 5$ e $BC = \sqrt{9 + 16} = 5$. Perímetro: $16$ (o triângulo é isósceles).

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir sobre distância entre pontos do plano cartesiano.
    afirmativas:
    - 'A distância entre $(a, b)$ e $(b, a)$ é $|a - b|\sqrt{2}$.'
    - 'A distância entre $(0, 0)$ e $(1, 1)$ é 2.'
    - 'Todo ponto da forma $(x, 0)$ dista $|x|$ da origem.'
    - 'Se a distância entre $A$ e $B$ é zero, então $A = B$.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'I, III e IV, apenas.', 'II e III, apenas.', 'III e IV, apenas.', 'I, II, III e IV.']
    correta: B
    resolucao: |
      I. Correta: $\sqrt{(b - a)^2 + (a - b)^2} = \sqrt{2(a - b)^2} = |a - b|\sqrt{2}$. II. Incorreta: é $\sqrt{2}$.
      III. Correta: $\sqrt{x^2} = |x|$. IV. Correta: a soma de dois quadrados só é zero se ambos forem zero.

  - estilo: Fuvest
    enunciado: |
      O ponto $P$ do eixo das abscissas que é equidistante de $A(2, 4)$ e $B(6, 2)$ tem abscissa
    opcoes: ['$2$', '$2{,}5$', '$3$', '$3{,}5$', '$4$']
    correta: B
    resolucao: |
      $(x - 2)^2 + 16 = (x - 6)^2 + 4$: $-4x + 20 = -12x + 40$, $8x = 20$, $x = 2{,}5$.

  # ---------------- Nível 2 ----------------
  - estilo: Enem
    texto: |
      Uma operadora vai instalar uma antena de celular que atende num raio de 5 km. O quadro mostra as coordenadas, em quilômetros, do centro de cinco bairros, num sistema de eixos com origem na antena. Um bairro é atendido se o seu centro está a, no máximo, 5 km da antena.
    tabela:
      cabecalho: ['Bairro', 'Coordenadas (km)']
      linhas:
      - ['Alto', '$(3, 4)$']
      - ['Bosque', '$(-4, 4)$']
      - ['Centro', '$(0, -5)$']
      - ['Lago', '$(4, -3)$']
      - ['Vila', '$(-3, -3)$']
    enunciado: |
      O número de bairros atendidos pela antena é
    opcoes: ['$1$', '$2$', '$3$', '$4$', '$5$']
    correta: D
    resolucao: |
      Distâncias: Alto 5; Bosque $\sqrt{32} \approx 5{,}7$; Centro 5; Lago 5; Vila $\sqrt{18} \approx 4{,}2$. Só o Bosque fica fora: 4 bairros.

  - estilo: Unicamp
    enunciado: |
      O triângulo de vértices $A(1, 2)$, $B(5, 5)$ e $C(1, 8)$ é
    opcoes: ['equilátero.', 'isósceles e não retângulo.', 'retângulo e não isósceles.', 'escaleno.']
    correta: B
    resolucao: |
      $AB = \sqrt{16 + 9} = 5$, $BC = \sqrt{16 + 9} = 5$ e $AC = 6$. Isósceles; e $25 + 25 \neq 36$, então não é retângulo.

  - estilo: UFPR
    enunciado: |
      Considere os pontos $P(2, -1)$, $Q(-2, 2)$ e $R(5, 3)$. Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'A distância entre $P$ e $Q$ é 5.'
    - 'O triângulo $PQR$ é isósceles.'
    - 'O triângulo $PQR$ é retângulo em $P$.'
    - 'O perímetro do triângulo $PQR$ é 15.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – V – F.', 'V – F – V – F.', 'F – V – V – V.', 'V – V – F – F.', 'V – V – V – V.']
    correta: A
    resolucao: |
      $PQ = \sqrt{16 + 9} = 5$, $PR = \sqrt{9 + 16} = 5$ e $QR = \sqrt{49 + 1} = 5\sqrt{2}$.
      (V) (V) $PQ = PR$. (V) $25 + 25 = 50$. (F) O perímetro é $10 + 5\sqrt{2}$.

  - estilo: UFSC
    enunciado: |
      Considere os pontos $A(k, 3)$ e $B(1, -1)$, em que $k$ é real. Assinale o que for correto.
    proposicoes:
    - 'Para $k = 4$, a distância entre $A$ e $B$ é 5.'
    - 'Para $k = -2$, a distância entre $A$ e $B$ é 5.'
    - 'Para todo $k$, a distância entre $A$ e $B$ é maior ou igual a 4.'
    - 'A distância entre $A$ e $B$ é 4 para exatamente dois valores de $k$.'
    - 'Se a distância entre $A$ e $B$ é $\sqrt{17}$, então $k = 0$ ou $k = 2$.'
    corretas: [1, 2, 3, 5]
    resolucao: |
      $d^2 = (k - 1)^2 + 16$. 01) $9 + 16 = 25$. 02) $9 + 16 = 25$. 04) $d^2 \ge 16$.
      08) Incorreta: $d = 4$ só se $k = 1$. 16) $(k - 1)^2 = 1$, $k = 0$ ou $k = 2$.
      Soma: $01 + 02 + 04 + 16 = 23$.

  - estilo: Fuvest
    enunciado: |
      O ponto do eixo das ordenadas equidistante de $A(-3, 1)$ e $B(5, 3)$ tem ordenada
    opcoes: ['$2$', '$4$', '$5$', '$6$', '$8$']
    correta: D
    resolucao: |
      $P(0, y)$: $9 + (y - 1)^2 = 25 + (y - 3)^2$. Então $10 - 2y = 34 - 6y$, $4y = 24$, $y = 6$.

  - estilo: Unesp
    texto: |
      Um robô parte da origem de um sistema de eixos, em um piso plano, e se move apenas nas direções leste (sentido positivo de $x$) e norte (sentido positivo de $y$). Ele anda 3 m para leste, 4 m para norte, 6 m para leste e, por fim, 8 m para norte.
    enunciado: |
      Ao final, a distância em linha reta entre o robô e o ponto de partida é
    opcoes: ['15 m.', '21 m.', '12 m.', '9 m.', '25 m.']
    correta: A
    resolucao: |
      Posição final: $(3 + 6, 4 + 8) = (9, 12)$. Distância: $\sqrt{81 + 144} = 15$ m. 21 m é o caminho percorrido.

  - estilo: Enem
    texto: |
      Um drone de filmagem voa em linha reta, a 5 m/s, do ponto $A$ ao ponto $B$ de um estádio. Num sistema de eixos sobre a planta do estádio, com unidades em metros, as coordenadas são $A(10, 20)$ e $B(70, 100)$, e o drone mantém a mesma altura durante todo o percurso.
    enunciado: |
      O tempo do percurso de $A$ até $B$ é
    opcoes: ['5 s.', '10 s.', '14 s.', '20 s.', '28 s.']
    correta: D
    resolucao: |
      $d = \sqrt{60^2 + 80^2} = 100$ m. Tempo: $\tfrac{100}{5} = 20$ s. 28 s corresponde a $60 + 80 = 140$ m.

  # ---------------- Nível 3 ----------------
  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Três cidades, A, B e C, estão representadas num mapa com eixos cartesianos, em quilômetros: $A(0, 0)$, $B(12, 5)$ e $C(12, -9)$. As cidades serão ligadas, duas a duas, por estradas retas, e o governo precisa estimar o comprimento total das obras e a maior distância entre duas delas.
    enunciado: |
      O comprimento total das três estradas, em km, é
    opcoes: ['$38$', '$40$', '$42$', '$45$', '$48$']
    correta: C
    resolucao: |
      $AB = \sqrt{144 + 25} = 13$, $AC = \sqrt{144 + 81} = 15$ e $BC = 5 - (-9) = 14$. Total: $42$ km.

  - estilo: Unicamp
    enunciado: |
      A maior distância entre duas dessas cidades é
    opcoes: ['$12$ km.', '$13$ km.', '$14$ km.', '$15$ km.']
    correta: D
    resolucao: |
      As distâncias são 13, 14 e 15 km. A maior é $AC = 15$ km.

  - estilo: UEM
    enunciado: |
      Considere pontos do plano cartesiano. Assinale o que for correto.
    proposicoes:
    - 'A distância entre dois pontos de mesma ordenada é o módulo da diferença das abscissas.'
    - 'Para quaisquer pontos $A$, $B$ e $C$, vale $d_{AB} + d_{BC} \ge d_{AC}$.'
    - 'Se $d_{AB} = d_{AC}$, então $A$ é o ponto médio de $BC$.'
    - 'Os pontos que distam 3 da origem formam uma circunferência.'
    - 'A distância entre $(1, 1)$ e $(-1, -1)$ é 2.'
    corretas: [1, 2, 4]
    resolucao: |
      01) Correta. 02) Correta: num triângulo, um lado é menor que a soma dos outros dois (igualdade se $B$ está entre $A$ e $C$).
      04) Incorreta: $A$ só precisa estar equidistante; por exemplo, $A(0, 5)$, $B(-1, 0)$, $C(1, 0)$. 08) Correta: centro na origem, raio 3.
      16) Incorreta: é $\sqrt{4 + 4} = 2\sqrt{2}$.
      Soma: $01 + 02 + 08 = 11$.

  - estilo: Fuvest
    enunciado: |
      Os pontos do eixo das abscissas que distam 5 de $A(1, 3)$ têm abscissas cuja soma é
    opcoes: ['$0$', '$2$', '$4$', '$6$', '$8$']
    correta: B
    resolucao: |
      $(x - 1)^2 + 9 = 25$, $x - 1 = \pm 4$: $x = 5$ ou $x = -3$. Soma: $2$.

  - estilo: Enem
    texto: |
      A planta de uma sala retangular de 8 m por 6 m está representada com eixos cartesianos, em metros, como na figura. Uma lâmpada será instalada no teto, exatamente sobre o ponto $L$, centro da sala. O fabricante informa o alcance da lâmpada, isto é, a maior distância horizontal até a qual ela ilumina bem o piso.
    figura:
      tikz: |
        \begin{scope}[scale=.45]
        \draw[step=1, gray!25, very thin] (0,0) grid (8,6);
        \draw[-latex, ink!60] (-0.3,0) -- (8.6,0) node[right, font=\scriptsize] {$x$};
        \draw[-latex, ink!60] (0,-0.3) -- (0,6.6) node[above, font=\scriptsize] {$y$};
        \draw[ink, line width=1pt] (0,0) rectangle (8,6);
        \fill[roxo] (4,3) circle (4pt) node[above right, font=\scriptsize] {$L$};
        \draw[roxo, dashed] (4,3) -- (8,6);
        \end{scope}
    enunciado: |
      Para que toda a sala seja bem iluminada, o alcance mínimo da lâmpada deve ser
    opcoes: ['4 m.', '4,5 m.', '5 m.', '6 m.', '10 m.']
    correta: C
    resolucao: |
      $L(4, 3)$. Os pontos mais distantes são os cantos, como $(8, 6)$: $\sqrt{16 + 9} = 5$ m. 10 m é a diagonal inteira da sala.

  - estilo: Fuvest
    enunciado: |
      O número real $a > 0$ para o qual a distância entre $(a, 2a)$ e a origem é $5\sqrt{5}$ é
    opcoes: ['$\sqrt{5}$', '$5$', '$5\sqrt{5}$', '$10$', '$25$']
    correta: B
    resolucao: |
      $\sqrt{a^2 + 4a^2} = a\sqrt{5} = 5\sqrt{5}$, logo $a = 5$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere o triângulo de vértices $A(1, 1)$, $B(7, 1)$ e $C(1, 9)$.'
    itens:
    - 'Mostre, usando distâncias, que o triângulo é retângulo.'
    - 'Determine o ponto $P$ equidistante dos três vértices.'
    - 'Calcule a distância de $P$ aos vértices e verifique que ela é a metade da hipotenusa.'
    espaco: 62
    resolucao: |
      a) $AB = 6$, $AC = 8$, $BC = \sqrt{36 + 64} = 10$; $36 + 64 = 100$: retângulo em $A$.
      b) $PA = PB$: $(x - 1)^2 = (x - 7)^2$, $x = 4$. $PA = PC$: $(y - 1)^2 = (y - 9)^2$, $y = 5$. $P(4, 5)$.
      c) $PA = \sqrt{9 + 16} = 5 = \tfrac{10}{2}$.
    resposta: 'a) Ver resolução; b) $P(4, 5)$; c) $5$'

  - estilo: Unicamp
    texto: |
      Duas antenas estão nos pontos $A(0, 0)$ e $B(10, 0)$, em quilômetros. A antena A atende até 6 km de distância, e a antena B, até 8 km.
    enunciado: ''
    itens:
    - 'O ponto $P(5, 3)$ é atendido pelas duas antenas? Justifique.'
    - 'Determine os pontos que estão a exatamente 6 km de A e 8 km de B.'
    - 'Mostre que cada um desses pontos forma com A e B um triângulo retângulo.'
    espaco: 62
    resolucao: |
      a) $PA = \sqrt{25 + 9} = \sqrt{34} \approx 5{,}8 \le 6$ e $PB = \sqrt{25 + 9} = \sqrt{34} \le 8$. Sim.
      b) $x^2 + y^2 = 36$ e $(x - 10)^2 + y^2 = 64$. Subtraindo: $-20x + 100 = 28$, $x = 3{,}6$. Então $y^2 = 36 - 12{,}96 = 23{,}04$, $y = \pm 4{,}8$. Pontos $(3{,}6;\ 4{,}8)$ e $(3{,}6;\ -4{,}8)$.
      c) Os lados são 6, 8 e 10, e $36 + 64 = 100$: o ângulo reto fica no ponto encontrado.
    resposta: 'a) Sim; b) $(3{,}6;\ \pm 4{,}8)$; c) Ver resolução'

  - estilo: ITA
    enunciado: |
      O número de pontos de coordenadas inteiras cuja distância à origem é 5 é
    opcoes: ['$4$', '$8$', '$10$', '$12$', '$16$']
    correta: D
    espaco: 22
    resolucao: |
      $x^2 + y^2 = 25$ com inteiros: $(\pm 5, 0)$, $(0, \pm 5)$, $(\pm 3, \pm 4)$ e $(\pm 4, \pm 3)$. São $4 + 4 + 4 = 12$.
      Quem esquece os pontos dos eixos conta 8.
    resposta: 'D'

  - estilo: Unesp
    enunciado: 'Os pontos $A(0, 0)$ e $B(4, 0)$ são vértices de um triângulo equilátero $ABC$, com $C$ acima do eixo $x$.'
    itens:
    - 'Mostre que $C$ tem abscissa 2.'
    - 'Determine as coordenadas de $C$.'
    - 'Calcule a área do triângulo.'
    espaco: 62
    resolucao: |
      a) $CA = CB$: $x^2 + y^2 = (x - 4)^2 + y^2$, $0 = -8x + 16$, $x = 2$.
      b) $CA = 4$: $4 + y^2 = 16$, $y = 2\sqrt{3}$ (positivo). $C(2, 2\sqrt{3})$.
      c) Base 4 e altura $2\sqrt{3}$: área $\tfrac{4 \cdot 2\sqrt{3}}{2} = 4\sqrt{3}$.
    resposta: 'a) Ver resolução; b) $C(2, 2\sqrt{3})$; c) $4\sqrt{3}$'

  - estilo: UFSC
    enunciado: |
      Considere os pontos $A(1, 2)$ e $B(5, 6)$ e os pontos $P(x, y)$ equidistantes de $A$ e $B$. Assinale o que for correto.
    proposicoes:
    - 'O ponto $(3, 4)$ é equidistante de $A$ e $B$.'
    - 'Todo ponto equidistante de $A$ e $B$ satisfaz $x + y = 7$.'
    - 'O ponto $(0, 7)$ dista $\sqrt{34}$ de $A$.'
    - 'O ponto do eixo $x$ equidistante de $A$ e $B$ é $(7, 0)$.'
    - 'A distância entre $A$ e $B$ é $4\sqrt{2}$.'
    - 'O ponto $(7, 7)$ é equidistante de $A$ e $B$.'
    corretas: [1, 2, 4, 5]
    espaco: 22
    resolucao: |
      $(x - 1)^2 + (y - 2)^2 = (x - 5)^2 + (y - 6)^2 \iff 8x + 8y = 56 \iff x + y = 7$ (02 correta).
      01) $3 + 4 = 7$. 04) Incorreta: $\sqrt{1 + 25} = \sqrt{26}$. 08) $y = 0$ dá $x = 7$. 16) $\sqrt{16 + 16} = 4\sqrt{2}$. 32) Incorreta: $7 + 7 \neq 7$.
    resposta: 'Soma 27 (01 + 02 + 08 + 16)'

  - estilo: Fuvest
    enunciado: 'Considere os pontos $A(1, 1)$, $B(3, 5)$ e $C(4, 7)$.'
    itens:
    - 'Calcule $AB$, $BC$ e $AC$, na forma $k\sqrt{5}$.'
    - 'Mostre que $AB + BC = AC$ e conclua que os três pontos estão alinhados, com $B$ entre $A$ e $C$.'
    - 'Determine o ponto $E$, na mesma reta, além de $C$, tal que $CE = AB$.'
    espaco: 62
    resolucao: |
      a) $AB = \sqrt{4 + 16} = 2\sqrt{5}$, $BC = \sqrt{1 + 4} = \sqrt{5}$, $AC = \sqrt{9 + 36} = 3\sqrt{5}$.
      b) $2\sqrt{5} + \sqrt{5} = 3\sqrt{5}$. Se $B$ não estivesse no segmento $AC$, o triângulo $ABC$ teria $AB + BC > AC$. Então $A$, $B$ e $C$ estão alinhados, com $B$ entre eles.
      c) De $A$ para $B$, anda-se $(+2, +4)$, um trecho de comprimento $2\sqrt{5}$. Repetindo a partir de $C$: $E(6, 11)$, com $CE = \sqrt{4 + 16} = 2\sqrt{5}$.
    resposta: 'a) $2\sqrt{5}$, $\sqrt{5}$, $3\sqrt{5}$; b) Ver resolução; c) $E(6, 11)$'

  - estilo: Unicamp
    texto: |
      Um rio retilíneo é representado pelo eixo $x$, com unidades em quilômetros. Uma pessoa sai de casa, em $A(1, 3)$, vai até um ponto $P$ da margem buscar água e leva a água até a horta, em $B(7, 5)$. Ela quer escolher $P$ de modo que o percurso $AP + PB$ seja o menor possível.
    enunciado: ''
    itens:
    - 'Calcule $AP + PB$ para $P(4, 0)$.'
    - 'Seja $A''(1, -3)$ o simétrico de $A$ em relação ao eixo $x$. Mostre que $AP = A''P$ para todo ponto $P$ do eixo.'
    - 'Conclua que o menor percurso tem o comprimento de $A''B$ e calcule-o.'
    espaco: 62
    resolucao: |
      a) $AP = \sqrt{9 + 9} = 3\sqrt{2} \approx 4{,}24$ e $PB = \sqrt{9 + 25} = \sqrt{34} \approx 5{,}83$. Total $\approx 10{,}07$ km.
      b) Para $P(x, 0)$: $AP = \sqrt{(x - 1)^2 + 9} = A'P$, pois $(0 - 3)^2 = (0 + 3)^2$.
      c) $AP + PB = A'P + PB \ge A'B$, com igualdade quando $P$ está no segmento $A'B$. $A'B = \sqrt{36 + 64} = 10$ km.
    resposta: 'a) $3\sqrt{2} + \sqrt{34} \approx 10{,}07$; b) Ver resolução; c) $10$ km'

  - estilo: Fuvest
    enunciado: |
      Os pontos $A(0, 0)$ e $B(6, 8)$ são vértices consecutivos de um quadrado. A diagonal desse quadrado mede
    opcoes: ['$10$', '$10\sqrt{2}$', '$14$', '$20$', '$20\sqrt{2}$']
    correta: B
    espaco: 22
    resolucao: |
      O lado é $AB = \sqrt{36 + 64} = 10$, e a diagonal de um quadrado de lado 10 é $10\sqrt{2}$.
      Quem toma $AB$ como diagonal marca 10.
    resposta: 'B'

  - estilo: Unesp
    enunciado: 'Considere o ponto $A(1, -3)$ e os pontos $P$ da reta $y = 2x$.'
    itens:
    - 'Escrevendo $P(t, 2t)$, monte a equação que expressa $PA = 5$.'
    - 'Determine os pontos $P$ da reta que distam 5 de $A$.'
    - 'Calcule a distância entre os dois pontos encontrados.'
    espaco: 62
    resolucao: |
      a) $(t - 1)^2 + (2t + 3)^2 = 25$.
      b) $5t^2 + 10t + 10 = 25$, $t^2 + 2t - 3 = 0$, $t = 1$ ou $t = -3$. Pontos $(1, 2)$ e $(-3, -6)$.
      c) $\sqrt{16 + 64} = \sqrt{80} = 4\sqrt{5}$.
    resposta: 'a) Ver resolução; b) $(1, 2)$ e $(-3, -6)$; c) $4\sqrt{5}$'

  - estilo: Fuvest
    enunciado: 'Considere os pontos $A(0, 0)$ e $B(3, 0)$ e os pontos $P(x, y)$ tais que $PA = 2 \cdot PB$.'
    itens:
    - 'Verifique que $(2, 0)$ e $(6, 0)$ satisfazem a condição.'
    - 'Mostre que a condição equivale a $(x - 4)^2 + y^2 = 4$.'
    - 'Conclua que todos esses pontos estão à mesma distância de $C(4, 0)$ e diga qual é essa distância.'
    espaco: 62
    resolucao: |
      a) $(2, 0)$: $PA = 2$ e $PB = 1$. $(6, 0)$: $PA = 6$ e $PB = 3$.
      b) $x^2 + y^2 = 4[(x - 3)^2 + y^2]$, ou $3x^2 + 3y^2 - 24x + 36 = 0$, isto é, $x^2 - 8x + y^2 + 12 = 0$, ou $(x - 4)^2 + y^2 = 4$.
      c) $(x - 4)^2 + y^2 = 4$ diz que a distância de $P$ a $C(4, 0)$ é $\sqrt{4} = 2$.
    resposta: 'a) Ver resolução; b) Ver resolução; c) $2$'
