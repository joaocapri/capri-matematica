# Fonte das listas em PDF da aula A17 — Raízes e Fórmula Resolutiva
# Matemática em LaTeX. Todas as respostas foram conferidas por cálculo independente.
aula: A17

fixacao:
  intro: Resolva na ordem — do aquecimento ao desafio. O gabarito resolvido está no final.
  secoes:
    - nome: Aquecimento
      questoes:
        - enunciado: Identifique os coeficientes $a$, $b$ e $c$ de cada equação.
          itens:
            - $3x^2-5x+2=0$
            - $-x^2+4=0$
            - $2x^2=7x$
          resolucao: |
            Escreva cada equação na forma $ax^2+bx+c=0$.
            (a) $a=3,\ b=-5,\ c=2$.
            (b) $a=-1,\ b=0,\ c=4$.
            (c) $2x^2-7x=0$, logo $a=2,\ b=-7,\ c=0$.
          resposta: '(a) $3,\,-5,\,2$ \quad (b) $-1,\,0,\,4$ \quad (c) $2,\,-7,\,0$'
        - enunciado: Calcule o discriminante $\Delta=b^2-4ac$ de cada equação.
          itens:
            - $x^2-4x+3=0$
            - $x^2+2x+5=0$
            - $4x^2-12x+9=0$
          resolucao: |
            (a) $\Delta=(-4)^2-4\cdot1\cdot3=16-12=4$.
            (b) $\Delta=2^2-4\cdot1\cdot5=4-20=-16$.
            (c) $\Delta=(-12)^2-4\cdot4\cdot9=144-144=0$.
          resposta: '(a) $4$ \quad (b) $-16$ \quad (c) $0$'
        - enunciado: Resolva, em $\mathbb{R}$, as equações incompletas (sem usar Bhaskara).
          itens:
            - $x^2-49=0$
            - $5x^2-20x=0$
            - $2x^2+18=0$
          resolucao: |
            (a) $x^2=49\Rightarrow x=\pm 7$.
            (b) $5x(x-4)=0\Rightarrow x=0$ ou $x=4$.
            (c) $x^2=-9$: nenhum número real ao quadrado é negativo.
          resposta: '(a) $\{-7,\,7\}$ \quad (b) $\{0,\,4\}$ \quad (c) $\varnothing$'
        - enunciado: Resolva $x^2-5x+6=0$ usando a fórmula resolutiva.
          resolucao: |
            $\Delta=25-24=1$, então $x=\dfrac{5\pm1}{2}$, isto é, $x=3$ ou $x=2$.
          resposta: '$S=\{2,\,3\}$'
        - enunciado: Resolva $2x^2+3x-2=0$.
          resolucao: |
            $\Delta=9+16=25$ e $x=\dfrac{-3\pm5}{4}$, ou seja, $x=\dfrac{1}{2}$ ou $x=-2$.
          resposta: '$S=\left\{-2,\,\tfrac{1}{2}\right\}$'
        - enunciado: Sem resolver, diga quantas raízes reais tem cada equação.
          itens:
            - $x^2-6x+10=0$
            - $9x^2+6x+1=0$
            - $-2x^2+x+3=0$
          resolucao: |
            (a) $\Delta=36-40=-4<0$: nenhuma raiz real.
            (b) $\Delta=36-36=0$: uma raiz real (dupla).
            (c) $\Delta=1+24=25>0$: duas raízes reais distintas.
          resposta: '(a) nenhuma \quad (b) uma (dupla) \quad (c) duas'
        - enunciado: Determine a soma $S$ e o produto $P$ das raízes de cada equação.
          itens:
            - $x^2-9x+14=0$
            - $3x^2+6x-12=0$
            - $2x^2-5=0$
          resolucao: |
            Use $S=-\dfrac{b}{a}$ e $P=\dfrac{c}{a}$.
            (a) $S=9,\ P=14$.
            (b) $S=-\dfrac{6}{3}=-2,\ P=-\dfrac{12}{3}=-4$.
            (c) $S=0,\ P=-\dfrac{5}{2}$.
          resposta: '(a) $9;\,14$ \quad (b) $-2;\,-4$ \quad (c) $0;\,-\tfrac52$'
    - nome: Treino
      questoes:
        - enunciado: Encontre as raízes por soma e produto, de cabeça.
          itens:
            - $x^2-8x+15=0$
            - $x^2+x-12=0$
            - $x^2+10x+21=0$
          resolucao: |
            (a) $S=8,\ P=15$: os números são $3$ e $5$.
            (b) $S=-1,\ P=-12$: os números são $3$ e $-4$.
            (c) $S=-10,\ P=21$: os números são $-3$ e $-7$.
          resposta: '(a) $3;\,5$ \quad (b) $3;\,-4$ \quad (c) $-3;\,-7$'
        - enunciado: Resolva $x^2-2x-1=0$ e simplifique as raízes.
          resolucao: |
            $\Delta=4+4=8$ e $\sqrt8=2\sqrt2$. Então
            $x=\dfrac{2\pm2\sqrt2}{2}=1\pm\sqrt2$.
          resposta: '$S=\{1-\sqrt2,\,1+\sqrt2\}$'
        - enunciado: Resolva $4x^2-4x+1=0$.
          resolucao: |
            $\Delta=16-16=0$, logo $x=\dfrac{4}{8}=\dfrac12$.
            Repare: $4x^2-4x+1=(2x-1)^2$.
          resposta: '$S=\left\{\tfrac12\right\}$'
        - enunciado: Resolva $(x-3)(x+1)=5$.
          resolucao: |
            Cuidado: o produto não é zero! Desenvolva primeiro.
            $x^2-2x-3=5\Rightarrow x^2-2x-8=0$.
            $S=2,\ P=-8$: raízes $4$ e $-2$.
          resposta: '$S=\{-2,\,4\}$'
        - enunciado: Resolva $x(x+4)=2x+15$.
          resolucao: |
            $x^2+4x=2x+15\Rightarrow x^2+2x-15=0$.
            $S=-2,\ P=-15$: raízes $3$ e $-5$.
          resposta: '$S=\{-5,\,3\}$'
        - enunciado: Escreva uma equação do 2º grau, com coeficientes inteiros, cujas raízes sejam
          itens:
            - $-4$ e $7$;
            - $\tfrac12$ e $3$.
          resolucao: |
            Use $x^2-Sx+P=0$.
            (a) $S=3,\ P=-28$: $x^2-3x-28=0$.
            (b) $S=\dfrac72,\ P=\dfrac32$: $x^2-\dfrac72x+\dfrac32=0$; multiplicando por $2$, $2x^2-7x+3=0$.
          resposta: '(a) $x^2-3x-28=0$ \quad (b) $2x^2-7x+3=0$'
        - enunciado: Determine $k$ para que $x^2-6x+k=0$ tenha raiz dupla. Qual é essa raiz?
          resolucao: |
            Raiz dupla $\Leftrightarrow \Delta=0$: $36-4k=0\Rightarrow k=9$.
            A raiz é $x=\dfrac{6}{2}=3$.
          resposta: '$k=9$; raiz $x=3$'
        - enunciado: Para quais valores de $m$ a equação $x^2+4x+m=0$ tem duas raízes reais distintas?
          resolucao: |
            Precisamos de $\Delta>0$: $16-4m>0\Rightarrow m<4$.
          resposta: '$m<4$'
    - nome: Desafio
      questoes:
        - enunciado: O número $2$ é raiz de $x^2-7x+c=0$. Determine $c$ e a outra raiz.
          resolucao: |
            Substituindo $x=2$: $4-14+c=0\Rightarrow c=10$.
            Pela soma, $2+r=7\Rightarrow r=5$.
          resposta: '$c=10$; outra raiz $5$'
        - enunciado: Sendo $r$ e $s$ as raízes de $x^2-5x+3=0$, calcule sem encontrar as raízes
          itens:
            - $\dfrac1r+\dfrac1s$
            - $r^2+s^2$
          resolucao: |
            Temos $r+s=5$ e $rs=3$.
            (a) $\dfrac1r+\dfrac1s=\dfrac{r+s}{rs}=\dfrac53$.
            (b) $r^2+s^2=(r+s)^2-2rs=25-6=19$.
          resposta: '(a) $\tfrac53$ \quad (b) $19$'
        - enunciado: Um retângulo tem $40\ \text{m}^2$ de área, e seu comprimento excede a largura em $3\ \text{m}$. Determine suas dimensões.
          resolucao: |
            Largura $x$, comprimento $x+3$: $x(x+3)=40\Rightarrow x^2+3x-40=0$.
            Raízes $5$ e $-8$; como é medida, $x=5$.
          resposta: '$5\ \text{m}$ por $8\ \text{m}$'
        - enunciado: O produto de dois números inteiros positivos e consecutivos é $156$. Quais são esses números?
          resolucao: |
            $n(n+1)=156\Rightarrow n^2+n-156=0$.
            $\Delta=1+624=625$ e $n=\dfrac{-1\pm25}{2}$, isto é, $n=12$ ou $n=-13$.
            Como são positivos, $n=12$.
          resposta: '$12$ e $13$'
        - enunciado: As raízes de $x^2-px+12=0$ são números inteiros consecutivos. Determine os possíveis valores de $p$.
          resolucao: |
            Sejam as raízes $r$ e $r+1$. Pelo produto, $r(r+1)=12\Rightarrow r^2+r-12=0$, logo $r=3$ ou $r=-4$.
            Raízes $3$ e $4$: $p=S=7$. Raízes $-4$ e $-3$: $p=S=-7$.
          resposta: '$p=7$ ou $p=-7$'
vestibular:
  intro: Questões autorais no estilo dos principais vestibulares. Assinale uma única alternativa.
  questoes:
    - enunciado: O conjunto solução, em $\mathbb{R}$, da equação $x^2-3x-10=0$ é
      opcoes: ['$\{-5,\,2\}$', '$\{-2,\,5\}$', '$\{2,\,5\}$', '$\{-5,\,-2\}$', '$\{-10,\,1\}$']
      correta: B
      resolucao: |
        $S=3$ e $P=-10$: os números são $5$ e $-2$.

    - enunciado: A soma dos quadrados das raízes da equação $x^2-4x+1=0$ é igual a
      opcoes: ['$4$', '$8$', '$10$', '$12$', '$14$']
      correta: E
      resolucao: |
        $r^2+s^2=(r+s)^2-2rs=4^2-2\cdot1=14$.

    - enunciado: Uma bola é chutada verticalmente para cima, e sua altura, em metros, $t$ segundos após o chute é $h(t)=-5t^2+20t$. A bola volta ao chão após
      opcoes: ['$2$ s', '$3$ s', '$4$ s', '$5$ s', '$10$ s']
      correta: C
      resolucao: |
        $h(t)=0\Rightarrow -5t(t-4)=0\Rightarrow t=0$ (chute) ou $t=4$ (chegada ao chão).

    - enunciado: O valor de $k$ para o qual a equação $2x^2-8x+k=0$ admite duas raízes reais iguais é
      opcoes: ['$8$', '$12$', '$16$', '$24$', '$32$']
      correta: A
      resolucao: |
        $\Delta=0\Rightarrow 64-8k=0\Rightarrow k=8$.

    - enunciado: Uma equação do 2º grau cujas raízes são $3-\sqrt2$ e $3+\sqrt2$ é
      opcoes: ['$x^2+6x+7=0$', '$x^2-6x-7=0$', '$x^2+6x-7=0$', '$x^2-6x+7=0$', '$x^2-6x+11=0$']
      correta: D
      resolucao: |
        $S=6$ e $P=(3-\sqrt2)(3+\sqrt2)=9-2=7$. Logo, $x^2-6x+7=0$.

    - enunciado: Um grupo de amigos dividiu igualmente uma conta de R\$\,360,00. Se houvesse $2$ pessoas a menos no grupo, cada uma pagaria R\$\,6,00 a mais. O número de amigos é
      opcoes: ['$8$', '$10$', '$12$', '$15$', '$18$']
      correta: C
      resolucao: |
        Com $n$ amigos: $\dfrac{360}{n-2}-\dfrac{360}{n}=6\Rightarrow 720=6n(n-2)$, ou seja, $n^2-2n-120=0$.
        Raízes $12$ e $-10$; logo $n=12$.

    - enunciado: Sendo $x_1$ e $x_2$ as raízes de $2x^2-6x-5=0$, o valor de $x_1^2x_2+x_1x_2^2$ é
      opcoes: ['$-\dfrac{15}{2}$', '$-\dfrac{5}{2}$', '$-\dfrac{3}{2}$', '$\dfrac{5}{2}$', '$\dfrac{15}{2}$']
      correta: A
      resolucao: |
        Fatorando, $x_1x_2(x_1+x_2)=P\cdot S=\left(-\dfrac52\right)\cdot 3=-\dfrac{15}{2}$.

    - enunciado: A equação $mx^2+2x+1=0$, na incógnita $x$, é do 2º grau e tem duas raízes reais distintas se, e somente se,
      opcoes: ['$m>1$', '$m\ge1$', '$m\le1$', '$m<1$', '$m<1$ e $m\neq0$']
      correta: E
      resolucao: |
        É preciso $m\neq0$ (para ser do 2º grau) e $\Delta=4-4m>0$, isto é, $m<1$.
        A alternativa D esquece a condição $m\neq0$.

    - enunciado: Um terreno retangular tem perímetro $46$ m e área $120\ \text{m}^2$. A diagonal desse terreno mede
      opcoes: ['$13$ m', '$15$ m', '$16$ m', '$17$ m', '$19$ m']
      correta: D
      resolucao: |
        Os lados somam $23$ e têm produto $120$: são raízes de $x^2-23x+120=0$, isto é, $8$ e $15$.
        Diagonal: $\sqrt{8^2+15^2}=\sqrt{289}=17$.

    - enunciado: Na equação $x^2-bx+12=0$, com $b>0$, uma das raízes é o triplo da outra. O valor de $b$ é
      opcoes: ['$6$', '$8$', '$9$', '$12$', '$15$']
      correta: B
      resolucao: |
        Raízes $r$ e $3r$: $3r^2=12\Rightarrow r=\pm2$. Como $b=4r>0$, $r=2$ e as raízes são $2$ e $6$; logo $b=8$.

    - enunciado: O lucro mensal de uma pequena fábrica, em milhares de reais, é $L(x)=-x^2+14x-40$, em que $x$ é a quantidade produzida, em centenas de unidades. O lucro é nulo quando $x$ vale
      opcoes: ['$2$ ou $20$', '$-4$ ou $-10$', '$5$ ou $8$', '$4$ ou $14$', '$4$ ou $10$']
      correta: E
      resolucao: |
        $L(x)=0\Leftrightarrow x^2-14x+40=0$: $S=14$ e $P=40$, logo $x=4$ ou $x=10$.

    - enunciado: A equação $x^2+(m-2)x+1=0$ admite raiz dupla. A soma dos possíveis valores de $m$ é
      opcoes: ['$0$', '$2$', '$4$', '$6$', '$8$']
      correta: C
      resolucao: |
        $\Delta=(m-2)^2-4=0\Rightarrow m-2=\pm2\Rightarrow m=0$ ou $m=4$. Soma: $4$.

    - enunciado: Se $r$ e $s$ são as raízes de $x^2-7x+3=0$, então $\frac rs+\frac sr$ vale
      opcoes: ['$\dfrac{43}{3}$', '$\dfrac{46}{3}$', '$\dfrac{49}{3}$', '$\dfrac{52}{3}$', '$\dfrac{55}{3}$']
      correta: A
      resolucao: |
        $\dfrac rs+\dfrac sr=\dfrac{r^2+s^2}{rs}=\dfrac{(r+s)^2-2rs}{rs}$
        $=\dfrac{49-6}{3}=\dfrac{43}{3}$.

    - enunciado: Assinale o conjunto solução, em $\mathbb{R}$, da equação \[\dfrac{1}{x-1}+\dfrac{2}{x+1}=1\]
      opcoes: ['$\{3\}$', '$\{-3,\,0\}$', '$\{1,\,3\}$', '$\{0,\,3\}$', '$\{-1,\,3\}$']
      correta: D
      resolucao: |
        Para $x\neq\pm1$, multiplique por $(x-1)(x+1)$: $(x+1)+2(x-1)=x^2-1$.
        Então $x^2-3x=0\Rightarrow x=0$ ou $x=3$, ambos válidos.

    - enunciado: O produto da idade atual de Ana pela idade que ela terá daqui a $4$ anos é $192$. Hoje, Ana tem
      opcoes: ['$10$ anos', '$12$ anos', '$14$ anos', '$16$ anos', '$18$ anos']
      correta: B
      resolucao: |
        $x(x+4)=192\Rightarrow x^2+4x-192=0$. $\Delta=784$, $\sqrt{784}=28$ e $x=\dfrac{-4+28}{2}=12$ (a outra raiz, $-16$, não serve).

    - enunciado: As raízes da equação $x^2-10x+c=0$ diferem em $4$ unidades. O valor de $c$ é
      opcoes: ['$6$', '$9$', '$16$', '$19$', '$21$']
      correta: E
      resolucao: |
        $r+s=10$ e $r-s=4$ dão $r=7$ e $s=3$. Logo, $c=rs=21$.

    - enunciado: O produto das raízes reais da equação $x^4-13x^2+36=0$ é
      opcoes: ['$-36$', '$0$', '$13$', '$36$', '$72$']
      correta: D
      resolucao: |
        Com $y=x^2$: $y^2-13y+36=0\Rightarrow y=4$ ou $y=9$. Assim, $x=\pm2$ ou $x=\pm3$.
        Produto: $(2)(-2)(3)(-3)=36$.

    - enunciado: A soma de todas as raízes reais da equação $(x^2-5x)^2-2(x^2-5x)-24=0$ é
      opcoes: ['$5$', '$8$', '$10$', '$12$', '$20$']
      correta: C
      resolucao: |
        Com $y=x^2-5x$: $y^2-2y-24=0\Rightarrow y=6$ ou $y=-4$.
        $x^2-5x-6=0$ dá $6$ e $-1$; $x^2-5x+4=0$ dá $1$ e $4$. Soma: $6-1+1+4=10$.

    - enunciado: De uma folha quadrada de papelão, recortam-se quadrados de $3$ cm de lado nos quatro cantos e dobram-se as abas, formando uma caixa sem tampa com volume $300\ \text{cm}^3$. O lado da folha original mede
      opcoes: ['$16$ cm', '$18$ cm', '$20$ cm', '$22$ cm', '$26$ cm']
      correta: A
      resolucao: |
        Lado $L$: a base da caixa tem lado $L-6$ e a altura é $3$.
        $3(L-6)^2=300\Rightarrow (L-6)^2=100\Rightarrow L-6=10\Rightarrow L=16$.

    - enunciado: Na equação $x^2-(k+3)x+2k+2=0$, uma das raízes é o dobro da outra. A soma dos possíveis valores de $k$ é
      opcoes: ['$0$', '$3$', '$6$', '$9$', '$12$']
      correta: B
      resolucao: |
        Raízes $r$ e $2r$: $3r=k+3$ e $2r^2=2k+2$, ou seja, $r^2=k+1$.
        Então $\dfrac{(k+3)^2}{9}=k+1\Rightarrow k^2-3k=0\Rightarrow k=0$ ou $k=3$. Soma: $3$.
        (Confira: $k=0$ dá raízes $1$ e $2$; $k=3$ dá $2$ e $4$.)
