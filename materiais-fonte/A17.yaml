# Fonte das listas em PDF da aula A17 — Raízes, discriminante, soma e produto
# Matemática em LaTeX. Todas as respostas foram conferidas por cálculo independente.
# Padrão v2 (out/2026): vestibular com pelo menos 10 questões contextualizadas e 3 com tabela ou figura.
aula: A17

fixacao:
  intro: Resolva na ordem — do aquecimento ao desafio. O gabarito resolvido está no final.
  secoes:
    - nome: Aquecimento
      questoes:
        - enunciado: Identifique os coeficientes $a$, $b$ e $c$ de cada equação.
          itens:
            - $3x^2-5x+2=0$
            - $-x^2+4=0$
            - $2x^2=7x$
          resolucao: |
            Escreva cada equação na forma $ax^2+bx+c=0$.
            (a) $a=3,\ b=-5,\ c=2$.
            (b) $a=-1,\ b=0,\ c=4$.
            (c) $2x^2-7x=0$, logo $a=2,\ b=-7,\ c=0$.
          resposta: '(a) $3,\,-5,\,2$ \quad (b) $-1,\,0,\,4$ \quad (c) $2,\,-7,\,0$'
        - enunciado: Calcule o discriminante $\Delta=b^2-4ac$ de cada equação.
          itens:
            - $x^2-4x+3=0$
            - $x^2+2x+5=0$
            - $4x^2-12x+9=0$
          resolucao: |
            (a) $\Delta=(-4)^2-4\cdot1\cdot3=16-12=4$.
            (b) $\Delta=2^2-4\cdot1\cdot5=4-20=-16$.
            (c) $\Delta=(-12)^2-4\cdot4\cdot9=144-144=0$.
          resposta: '(a) $4$ \quad (b) $-16$ \quad (c) $0$'
        - enunciado: Resolva, em $\mathbb{R}$, as equações incompletas (sem usar Bhaskara).
          itens:
            - $x^2-49=0$
            - $5x^2-20x=0$
            - $2x^2+18=0$
          resolucao: |
            (a) $x^2=49\Rightarrow x=\pm 7$.
            (b) $5x(x-4)=0\Rightarrow x=0$ ou $x=4$.
            (c) $x^2=-9$: nenhum número real ao quadrado é negativo.
          resposta: '(a) $\{-7,\,7\}$ \quad (b) $\{0,\,4\}$ \quad (c) $\varnothing$'
        - enunciado: Resolva $x^2-5x+6=0$ usando a fórmula resolutiva.
          resolucao: |
            $\Delta=25-24=1$, então $x=\dfrac{5\pm1}{2}$, isto é, $x=3$ ou $x=2$.
          resposta: '$S=\{2,\,3\}$'
        - enunciado: Resolva $2x^2+3x-2=0$.
          resolucao: |
            $\Delta=9+16=25$ e $x=\dfrac{-3\pm5}{4}$, ou seja, $x=\dfrac{1}{2}$ ou $x=-2$.
          resposta: '$S=\left\{-2,\,\tfrac{1}{2}\right\}$'
        - enunciado: Sem resolver, diga quantas raízes reais tem cada equação.
          itens:
            - $x^2-6x+10=0$
            - $9x^2+6x+1=0$
            - $-2x^2+x+3=0$
          resolucao: |
            (a) $\Delta=36-40=-4<0$: nenhuma raiz real.
            (b) $\Delta=36-36=0$: uma raiz real (dupla).
            (c) $\Delta=1+24=25>0$: duas raízes reais distintas.
          resposta: '(a) nenhuma \quad (b) uma (dupla) \quad (c) duas'
        - enunciado: Determine a soma $S$ e o produto $P$ das raízes de cada equação.
          itens:
            - $x^2-9x+14=0$
            - $3x^2+6x-12=0$
            - $2x^2-5=0$
          resolucao: |
            Use $S=-\dfrac{b}{a}$ e $P=\dfrac{c}{a}$.
            (a) $S=9,\ P=14$.
            (b) $S=-\dfrac{6}{3}=-2,\ P=-\dfrac{12}{3}=-4$.
            (c) $S=0,\ P=-\dfrac{5}{2}$.
          resposta: '(a) $9;\,14$ \quad (b) $-2;\,-4$ \quad (c) $0;\,-\tfrac52$'
    - nome: Treino
      questoes:
        - enunciado: Encontre as raízes por soma e produto, de cabeça.
          itens:
            - $x^2-8x+15=0$
            - $x^2+x-12=0$
            - $x^2+10x+21=0$
          resolucao: |
            (a) $S=8,\ P=15$: os números são $3$ e $5$.
            (b) $S=-1,\ P=-12$: os números são $3$ e $-4$.
            (c) $S=-10,\ P=21$: os números são $-3$ e $-7$.
          resposta: '(a) $3;\,5$ \quad (b) $3;\,-4$ \quad (c) $-3;\,-7$'
        - enunciado: Resolva $x^2-2x-1=0$ e simplifique as raízes.
          resolucao: |
            $\Delta=4+4=8$ e $\sqrt8=2\sqrt2$. Então
            $x=\dfrac{2\pm2\sqrt2}{2}=1\pm\sqrt2$.
          resposta: '$S=\{1-\sqrt2,\,1+\sqrt2\}$'
        - enunciado: Resolva $4x^2-4x+1=0$.
          resolucao: |
            $\Delta=16-16=0$, logo $x=\dfrac{4}{8}=\dfrac12$.
            Repare: $4x^2-4x+1=(2x-1)^2$.
          resposta: '$S=\left\{\tfrac12\right\}$'
        - enunciado: Resolva $(x-3)(x+1)=5$.
          resolucao: |
            Cuidado: o produto não é zero! Desenvolva primeiro.
            $x^2-2x-3=5\Rightarrow x^2-2x-8=0$.
            $S=2,\ P=-8$: raízes $4$ e $-2$.
          resposta: '$S=\{-2,\,4\}$'
        - enunciado: Resolva $x(x+4)=2x+15$.
          resolucao: |
            $x^2+4x=2x+15\Rightarrow x^2+2x-15=0$.
            $S=-2,\ P=-15$: raízes $3$ e $-5$.
          resposta: '$S=\{-5,\,3\}$'
        - enunciado: Escreva uma equação do 2º grau, com coeficientes inteiros, cujas raízes sejam
          itens:
            - $-4$ e $7$;
            - $\tfrac12$ e $3$.
          resolucao: |
            Use $x^2-Sx+P=0$.
            (a) $S=3,\ P=-28$: $x^2-3x-28=0$.
            (b) $S=\dfrac72,\ P=\dfrac32$: $x^2-\dfrac72x+\dfrac32=0$; multiplicando por $2$, $2x^2-7x+3=0$.
          resposta: '(a) $x^2-3x-28=0$ \quad (b) $2x^2-7x+3=0$'
        - enunciado: Determine $k$ para que $x^2-6x+k=0$ tenha raiz dupla. Qual é essa raiz?
          resolucao: |
            Raiz dupla $\Leftrightarrow \Delta=0$: $36-4k=0\Rightarrow k=9$.
            A raiz é $x=\dfrac{6}{2}=3$.
          resposta: '$k=9$; raiz $x=3$'
        - enunciado: Para quais valores de $m$ a equação $x^2+4x+m=0$ tem duas raízes reais distintas?
          resolucao: |
            Precisamos de $\Delta>0$: $16-4m>0\Rightarrow m<4$.
          resposta: '$m<4$'
    - nome: Desafio
      questoes:
        - enunciado: O número $2$ é raiz de $x^2-7x+c=0$. Determine $c$ e a outra raiz.
          resolucao: |
            Substituindo $x=2$: $4-14+c=0\Rightarrow c=10$.
            Pela soma, $2+r=7\Rightarrow r=5$.
          resposta: '$c=10$; outra raiz $5$'
        - enunciado: Sendo $r$ e $s$ as raízes de $x^2-5x+3=0$, calcule sem encontrar as raízes
          itens:
            - $\dfrac1r+\dfrac1s$
            - $r^2+s^2$
          resolucao: |
            Temos $r+s=5$ e $rs=3$.
            (a) $\dfrac1r+\dfrac1s=\dfrac{r+s}{rs}=\dfrac53$.
            (b) $r^2+s^2=(r+s)^2-2rs=25-6=19$.
          resposta: '(a) $\tfrac53$ \quad (b) $19$'
        - enunciado: Um retângulo tem $40\ \text{m}^2$ de área, e seu comprimento excede a largura em $3\ \text{m}$. Determine suas dimensões.
          resolucao: |
            Largura $x$, comprimento $x+3$: $x(x+3)=40\Rightarrow x^2+3x-40=0$.
            Raízes $5$ e $-8$; como é medida, $x=5$.
          resposta: '$5\ \text{m}$ por $8\ \text{m}$'
        - enunciado: O produto de dois números inteiros positivos e consecutivos é $156$. Quais são esses números?
          resolucao: |
            $n(n+1)=156\Rightarrow n^2+n-156=0$.
            $\Delta=1+624=625$ e $n=\dfrac{-1\pm25}{2}$, isto é, $n=12$ ou $n=-13$.
            Como são positivos, $n=12$.
          resposta: '$12$ e $13$'
        - enunciado: As raízes de $x^2-px+12=0$ são números inteiros consecutivos. Determine os possíveis valores de $p$.
          resolucao: |
            Sejam as raízes $r$ e $r+1$. Pelo produto, $r(r+1)=12\Rightarrow r^2+r-12=0$, logo $r=3$ ou $r=-4$.
            Raízes $3$ e $4$: $p=S=7$. Raízes $-4$ e $-3$: $p=S=-7$.
          resposta: '$p=7$ ou $p=-7$'
vestibular:
  intro: Questões autorais no estilo dos principais vestibulares e do Enem, das mais diretas às mais contextualizadas. Assinale uma única alternativa.
  questoes:
    - enunciado: O conjunto solução, em $\mathbb{R}$, da equação $x^2-3x-10=0$ é
      opcoes: ['$\{-5,\,2\}$', '$\{-2,\,5\}$', '$\{2,\,5\}$', '$\{-5,\,-2\}$', '$\{-10,\,1\}$']
      correta: B
      resolucao: |
        Procuramos dois números com soma $3$ e produto $-10$: $5$ e $-2$.
        Logo, $S=\{-2,\,5\}$.

    - texto: |
        Em uma aula sobre funções, o professor projetou o gráfico de uma função quadrática $f(x)=x^2+bx+c$ e destacou os pontos em que a curva cruza os eixos coordenados.
      figura:
        tikz: |
          \begin{axis}[width=5.6cm,height=4.8cm,xmin=-2.6,xmax=4.6,ymin=-4.9,ymax=5.4,xtick={-1,3},ytick={-3},xlabel={$x$},ylabel={$y$}]
          \addplot[roxo,thick,domain=-2.2:4.2,samples=80]{x^2-2*x-3};
          \addplot[only marks,mark=*,mark size=1.7pt,ink] coordinates {(-1,0)(3,0)(0,-3)};
          \end{axis}
      enunciado: A lei da função representada é
      opcoes: ['$f(x)=x^2+2x-3$', '$f(x)=x^2-3x-2$', '$f(x)=x^2+3x+2$', '$f(x)=x^2-2x+3$', '$f(x)=x^2-2x-3$']
      correta: E
      resolucao: |
        Os zeros são $-1$ e $3$, então $f(x)=(x+1)(x-3)=x^2-2x-3$.
        Conferindo o corte no eixo $y$: $f(0)=-3$.

    - texto: |
        Em um treino de goleiros, uma máquina lança bolas verticalmente para cima. Um sensor registra que a altura $h$ da bola, em metros, $t$ segundos após o lançamento, é dada por $h(t)=-5t^2+20t$, até a bola tocar o gramado.
      enunciado: A bola volta a tocar o gramado após
      opcoes: ['$2$ s', '$3$ s', '$4$ s', '$5$ s', '$10$ s']
      correta: C
      resolucao: |
        A bola está no gramado quando $h(t)=0$: $-5t(t-4)=0$, logo $t=0$ (lançamento) ou $t=4$.
        Ela volta ao gramado após $4$ segundos.

    - enunciado: O valor de $k$ para o qual a equação $2x^2-8x+k=0$ admite duas raízes reais iguais é
      opcoes: ['$8$', '$12$', '$16$', '$24$', '$32$']
      correta: A
      resolucao: |
        Raiz dupla exige $\Delta=0$: $64-8k=0$, logo $k=8$.

    - texto: |
        Uma estudante testou uma função quadrática $f(x)=ax^2+bx+c$ em uma planilha e anotou alguns valores, mas esqueceu de registrar a lei da função.
      tabela:
        cabecalho: ['$x$', '$0$', '$1$', '$4$']
        linhas:
          - ['$f(x)$', '$6$', '$2$', '$2$']
      enunciado: Os zeros dessa função são
      opcoes: ['$-3$ e $-2$', '$-1$ e $6$', '$1$ e $6$', '$2$ e $3$', '$3$ e $4$']
      correta: D
      resolucao: |
        $f(0)=c=6$. Com $f(1)=2$ e $f(4)=2$: $a+b=-4$ e $16a+4b=-4$, ou seja, $4a+b=-1$.
        Subtraindo, $3a=3$: $a=1$ e $b=-5$. Então $f(x)=x^2-5x+6$, com zeros $2$ e $3$.

    - texto: |
        Um grupo de amigos alugou uma chácara para um fim de semana por R\$\,360,00, valor que seria dividido igualmente. Na véspera, duas pessoas desistiram, e cada um dos que foram precisou pagar R\$\,6,00 a mais.
      enunciado: Quantos amigos havia no grupo inicialmente?
      opcoes: ['$8$', '$10$', '$12$', '$15$', '$18$']
      correta: C
      resolucao: |
        Com $n$ amigos: $\dfrac{360}{n-2}=\dfrac{360}{n}+6$.
        Multiplicando por $n(n-2)$: $360n=360(n-2)+6n(n-2)$, isto é, $n^2-2n-120=0$.
        Logo, $n=12$ (a outra raiz, $-10$, não serve).

    - enunciado: A soma dos quadrados das raízes da equação $x^2-4x+1=0$ é igual a
      opcoes: ['$4$', '$8$', '$10$', '$12$', '$14$']
      correta: E
      resolucao: |
        $S=4$ e $P=1$. Como $x_1^2+x_2^2=S^2-2P$, temos $16-2=14$.

    - texto: |
        Uma pequena fábrica de bonés estima que, produzindo $x$ centenas de unidades por mês, seu lucro mensal, em milhares de reais, é $L(x)=-x^2+14x-40$. O gerente quer saber em que níveis de produção a fábrica não tem lucro nem prejuízo.
      enunciado: O lucro é nulo quando a produção mensal é de
      opcoes: ['$200$ ou $2000$ bonés', '$400$ ou $1000$ bonés', '$500$ ou $800$ bonés', '$400$ ou $1400$ bonés', '$1000$ ou $1400$ bonés']
      correta: B
      resolucao: |
        $-x^2+14x-40=0\iff x^2-14x+40=0$: soma $14$ e produto $40$, logo $x=4$ ou $x=10$.
        Como $x$ está em centenas, são $400$ ou $1000$ bonés.

    - texto: |
        Um terreno retangular será cercado com $46$ m de tela, exatamente o seu perímetro. A prefeitura informou que a área do terreno é de $120\ \text{m}^2$, e o dono quer instalar um cano reto ligando dois cantos opostos.
      enunciado: O comprimento desse cano, igual à diagonal do terreno, é
      opcoes: ['$13$ m', '$15$ m', '$16$ m', '$17$ m', '$19$ m']
      correta: D
      resolucao: |
        Os lados têm soma $23$ e produto $120$: são $8$ e $15$.
        A diagonal é $\sqrt{8^2+15^2}=\sqrt{289}=17$ m.

    - enunciado: Na equação $x^2-bx+12=0$, com $b>0$, uma das raízes é o triplo da outra. O valor de $b$ é
      opcoes: ['$6$', '$8$', '$9$', '$12$', '$15$']
      correta: B
      resolucao: |
        Raízes $r$ e $3r$: produto $3r^2=12$, logo $r=2$ (com $b>0$, as raízes são positivas).
        As raízes são $2$ e $6$, e $b$ é a soma: $8$.

    - texto: |
        A entrada de um túnel tem o formato de um arco de parábola. Com o eixo $x$ sobre o chão e o eixo $y$ passando pelo ponto mais alto do arco, o contorno da entrada é descrito por $y=-\tfrac{x^2}{4}+4$, com $x$ e $y$ em metros.
      figura:
        tikz: |
          \begin{axis}[width=6cm,height=4.2cm,xmin=-5.6,xmax=5.6,ymin=-0.6,ymax=5.3,xtick=\empty,ytick={4},yticklabels={$4$},xlabel={$x$},ylabel={$y$}]
          \addplot[roxo,thick,fill=suave,domain=-4:4,samples=80]{-x^2/4+4} \closedcycle;
          \end{axis}
      enunciado: A largura da entrada do túnel, medida no chão, é
      opcoes: ['$4$ m', '$6$ m', '$8$ m', '$10$ m', '$16$ m']
      correta: C
      resolucao: |
        No chão, $y=0$: $\dfrac{x^2}{4}=4\Rightarrow x=\pm4$.
        A largura é a distância entre os zeros: $4-(-4)=8$ m.

    - texto: |
        Em uma cobrança de falta, a bola sai do chão e descreve uma trajetória parabólica. Tomando o ponto do chute como origem, a altura da bola, em metros, em função da distância horizontal $x$ percorrida, também em metros, é $y=-0{,}02x^2+0{,}6x$. Nenhum jogador toca a bola até que ela volte ao gramado.
      enunciado: A bola toca o gramado a que distância horizontal do ponto do chute?
      opcoes: ['$15$ m', '$20$ m', '$25$ m', '$30$ m', '$60$ m']
      correta: D
      resolucao: |
        $y=0\iff x(-0{,}02x+0{,}6)=0$, logo $x=0$ ou $x=\dfrac{0{,}6}{0{,}02}=30$.
        A bola toca o gramado a $30$ m do ponto do chute.

    - enunciado: Se $r$ e $s$ são as raízes de $x^2-7x+3=0$, então $\dfrac{r}{s}+\dfrac{s}{r}$ vale
      opcoes: ['$\dfrac{43}{3}$', '$\dfrac{46}{3}$', '$\dfrac{49}{3}$', '$\dfrac{52}{3}$', '$\dfrac{55}{3}$']
      correta: A
      resolucao: |
        $\dfrac rs+\dfrac sr=\dfrac{r^2+s^2}{rs}=\dfrac{S^2-2P}{P}=\dfrac{49-6}{3}=\dfrac{43}{3}$.

    - texto: |
        Ana gosta de propor desafios aos amigos. Perguntada sobre a própria idade, respondeu: “Se você multiplicar a idade que eu tenho hoje pela idade que terei daqui a $4$ anos, vai obter $192$”.
      enunciado: Hoje, Ana tem
      opcoes: ['$10$ anos', '$12$ anos', '$14$ anos', '$16$ anos', '$18$ anos']
      correta: B
      resolucao: |
        $x(x+4)=192\iff x^2+4x-192=0$, com raízes $12$ e $-16$.
        Como idade é positiva, Ana tem $12$ anos.

    - texto: |
        Uma gráfica produz caixas sem tampa a partir de folhas quadradas de papelão: de cada canto da folha recorta-se um quadrado de $3$ cm de lado e, em seguida, dobram-se as abas para cima. Um cliente encomendou caixas com volume de $300\ \text{cm}^3$.
      enunciado: O lado da folha quadrada usada deve medir
      opcoes: ['$16$ cm', '$18$ cm', '$20$ cm', '$22$ cm', '$26$ cm']
      correta: A
      resolucao: |
        Com folha de lado $L$, a base da caixa é um quadrado de lado $L-6$ e a altura é $3$.
        $3(L-6)^2=300\Rightarrow (L-6)^2=100\Rightarrow L-6=10$, logo $L=16$ cm.

    - enunciado: As raízes da equação $x^2-10x+c=0$ diferem em $4$ unidades. O valor de $c$ é
      opcoes: ['$6$', '$9$', '$16$', '$19$', '$21$']
      correta: E
      resolucao: |
        Raízes $r$ e $r+4$ com soma $10$: $r=3$. As raízes são $3$ e $7$, e $c=3\cdot7=21$.

    - texto: |
        O dono de uma lanchonete percebeu que o número de lanches vendidos por dia depende do preço $p$, em reais. Ele anotou os dados abaixo e concluiu que as vendas seguem a lei $V(p)=100-5p$.
      tabela:
        cabecalho: ['Preço (R\$)', '$4$', '$8$', '$12$']
        linhas:
          - ['Lanches vendidos', '$80$', '$60$', '$40$']
      enunciado: A receita diária é o produto do preço pelo número de lanches vendidos. A receita é de R\$\,480,00 quando o preço do lanche é de
      opcoes: ['R\$\,4,00 ou R\$\,16,00', 'R\$\,6,00 ou R\$\,14,00', 'R\$\,8,00 ou R\$\,12,00', 'R\$\,10,00, apenas', 'R\$\,12,00 ou R\$\,20,00']
      correta: C
      resolucao: |
        $p(100-5p)=480\iff 5p^2-100p+480=0\iff p^2-20p+96=0$.
        Soma $20$ e produto $96$: $p=8$ ou $p=12$.

    - texto: |
        O número $d$ de diagonais de um polígono convexo de $n$ lados é dado por $d=\tfrac{n(n-3)}{2}$. Um arquiteto projetou um piso em forma de polígono convexo e contou $35$ diagonais no desenho.
      enunciado: O número de lados desse polígono é
      opcoes: ['$5$', '$7$', '$9$', '$10$', '$14$']
      correta: D
      resolucao: |
        $\dfrac{n(n-3)}{2}=35\iff n^2-3n-70=0$, com raízes $10$ e $-7$.
        O polígono tem $10$ lados.

    - enunciado: A soma de todas as raízes reais da equação $(x^2-5x)^2-2(x^2-5x)-24=0$ é
      opcoes: ['$5$', '$8$', '$10$', '$12$', '$20$']
      correta: C
      resolucao: |
        Com $y=x^2-5x$: $y^2-2y-24=0$, logo $y=6$ ou $y=-4$.
        $x^2-5x-6=0$ dá $x=6$ ou $x=-1$; $x^2-5x+4=0$ dá $x=1$ ou $x=4$.
        Soma: $6-1+1+4=10$.

    - enunciado: Na equação $x^2-(k+3)x+2k+2=0$, uma das raízes é o dobro da outra. A soma dos possíveis valores de $k$ é
      opcoes: ['$0$', '$3$', '$6$', '$9$', '$12$']
      correta: B
      resolucao: |
        Raízes $r$ e $2r$: soma $3r=k+3$ e produto $2r^2=2k+2$, ou seja, $r^2=k+1$.
        Com $r=\dfrac{k+3}{3}$: $\dfrac{(k+3)^2}{9}=k+1\iff k^2-3k=0$, logo $k=0$ ou $k=3$.
        A soma dos valores é $3$.
