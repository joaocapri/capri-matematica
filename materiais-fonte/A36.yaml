# Fonte das listas em PDF da aula A36 — Mudança de Base
aula: A36

fixacao:
  intro: Resolva na ordem — do aquecimento ao desafio. $\log_a b=\dfrac{\log_c b}{\log_c a}$ para qualquer base $c$ válida. Quando necessário, use $\log2=0{,}301$ e $\log3=0{,}477$.
  secoes:
    - nome: Aquecimento
      questoes:
        - enunciado: Calcule, passando para uma base comum.
          itens:
            - $\log_4 8$
            - $\log_9 27$
            - $\log_8 32$
          resolucao: |
            Na base $2$ ou $3$: (a) $\tfrac{\log_2 8}{\log_2 4}=\tfrac32$. (b) $\tfrac{\log_3 27}{\log_3 9}=\tfrac32$. (c) $\tfrac{\log_2 32}{\log_2 8}=\tfrac53$.
          resposta: '(a) $\tfrac32$ \quad (b) $\tfrac32$ \quad (c) $\tfrac53$'

        - enunciado: Usando $\log2=0{,}301$ e $\log3=0{,}477$, calcule aproximadamente.
          itens:
            - $\log_2 3$
            - $\log_3 2$
          resolucao: |
            (a) $\tfrac{0{,}477}{0{,}301}\approx1{,}585$. (b) $\tfrac{0{,}301}{0{,}477}\approx0{,}631$.
            Repare: um é o inverso do outro.
          resposta: '(a) $\approx1{,}585$ \quad (b) $\approx0{,}631$'

        - enunciado: Calcule $\log_5 2$, usando $\log2=0{,}301$.
          resolucao: |
            $\log5=1-0{,}301=0{,}699$. Então $\log_5 2=\tfrac{0{,}301}{0{,}699}\approx0{,}431$.
          resposta: '$\approx0{,}431$'

        - enunciado: Calcule $\log_3 2\cdot\log_2 9$.
          resolucao: |
            $\dfrac{\log2}{\log3}\cdot\dfrac{\log9}{\log2}=\dfrac{2\log3}{\log3}=2$.
          resposta: '$2$'

        - enunciado: Calcule $\log_{25}125$.
          resolucao: |
            Na base $5$: $\dfrac{3}{2}$.
          resposta: '$\tfrac32$'

        - enunciado: Mostre que $\log_a b\cdot\log_b a=1$ e use isso para calcular $\log_7 10\cdot\log 7$.
          resolucao: |
            $\dfrac{\log b}{\log a}\cdot\dfrac{\log a}{\log b}=1$. \ Como $\log7=\log_{10}7$, o produto vale $1$.
          resposta: '$1$'

        - enunciado: Escreva $\log_{1/2}5$ usando um logaritmo de base $2$.
          resolucao: |
            $\dfrac{\log_2 5}{\log_2\frac12}=\dfrac{\log_2 5}{-1}=-\log_2 5$.
          resposta: '$-\log_2 5$'

    - nome: Treino
      questoes:
        - enunciado: Calcule $\log_2 3\cdot\log_3 4\cdot\log_4 8$.
          resolucao: |
            Os logaritmos intermediários se cancelam: $\dfrac{\log8}{\log2}=3$.
          resposta: '$3$'

        - enunciado: Sabendo que $\log_2 3=a$, escreva em função de $a$.
          itens:
            - $\log_4 9$
            - $\log_8 27$
            - $\log_3 2$
          resolucao: |
            (a) $\tfrac{2\log_2 3}{2}=a$. (b) $\tfrac{3\log_2 3}{3}=a$. (c) $\tfrac1a$.
          resposta: '(a) $a$ \quad (b) $a$ \quad (c) $\tfrac1a$'

        - enunciado: Sabendo que $\log_2 3=a$, escreva $\log_6 2$ em função de $a$.
          resolucao: |
            $\log_6 2=\dfrac{\log_2 2}{\log_2 6}=\dfrac1{1+\log_2 3}=\dfrac1{1+a}$.
          resposta: '$\tfrac1{1+a}$'

        - enunciado: Sabendo que $\log_3 5=m$, escreva $\log_9 5$ e $\log_{25}9$ em função de $m$.
          resolucao: |
            $\log_9 5=\dfrac{\log_3 5}{\log_3 9}=\dfrac m2$. \ $\log_{25}9=\dfrac{\log_3 9}{\log_3 25}=\dfrac{2}{2m}=\dfrac1m$.
          resposta: '$\tfrac m2$ e $\tfrac1m$'

        - enunciado: Resolva $\log_2 x+\log_4 x=6$.
          resolucao: |
            $\log_4 x=\tfrac12\log_2 x$. Então $\tfrac32\log_2 x=6\Rightarrow\log_2 x=4\Rightarrow x=16$.
          resposta: '$x=16$'

        - enunciado: Calcule $\dfrac1{\log_2 6}+\dfrac1{\log_3 6}$.
          resolucao: |
            $\dfrac1{\log_a b}=\log_b a$: $\log_6 2+\log_6 3=\log_6 6=1$.
          resposta: '$1$'

        - enunciado: Calcule $\log_{\sqrt3}27$.
          resolucao: |
            $\dfrac{\log_3 27}{\log_3\sqrt3}=\dfrac3{1/2}=6$.
          resposta: '$6$'

        - enunciado: Calcule $(\log_2 9)\cdot(\log_3 8)$.
          resolucao: |
            $\dfrac{2\log3}{\log2}\cdot\dfrac{3\log2}{\log3}=6$.
          resposta: '$6$'

    - nome: Desafio
      questoes:
        - enunciado: Resolva $\log_3 x=\log_9(x+6)$.
          resolucao: |
            $\log_9(x+6)=\tfrac12\log_3(x+6)$. Então $2\log_3 x=\log_3(x+6)\Rightarrow x^2=x+6\Rightarrow x=3$ ou $x=-2$ (não serve).
          resposta: '$x=3$'

        - enunciado: Um capital aplicado a $10\%$ ao ano, a juros compostos, dobra quando $1{,}1^t=2$. Usando $\log1{,}1\approx0{,}0414$ e $\log2=0{,}301$, estime $t$.
          resolucao: |
            $t=\log_{1{,}1}2=\dfrac{\log2}{\log1{,}1}\approx\dfrac{0{,}301}{0{,}0414}\approx7{,}3$ anos.
          resposta: '$\approx7{,}3$ anos'

        - enunciado: Sabendo que $\log2=a$ e $\log3=b$, escreva $\log_6 12$ em função de $a$ e $b$.
          resolucao: |
            $\dfrac{\log12}{\log6}=\dfrac{2a+b}{a+b}$.
          resposta: '$\dfrac{2a+b}{a+b}$'

        - enunciado: Calcule $\log_2 3\cdot\log_3 4\cdot\log_4 5\cdots\log_{63}64$.
          resolucao: |
            Em cascata, sobra $\dfrac{\log64}{\log2}=\log_2 64=6$.
          resposta: '$6$'

        - enunciado: Resolva $\log_x 2\cdot\log_2 x^3=3$ e explique o resultado.
          resolucao: |
            $\log_x 2\cdot3\log_2 x=3\cdot1=3$ para todo $x$ válido. A igualdade vale para qualquer $x>0$ com $x\neq1$.
          resposta: 'todo $x>0$, $x\neq1$'

vestibular:
  intro: Questões autorais no estilo dos principais vestibulares. Quando necessário, use $\log2=0{,}301$ e $\log3=0{,}477$.
  questoes:
    - enunciado: O valor de $\log_4 32$ é
      opcoes: ['$\dfrac52$', '$8$', '$\dfrac25$', '$2$', '$\dfrac54$']
      correta: A
      resolucao: |
        $\dfrac{\log_2 32}{\log_2 4}=\dfrac52$.

    - enunciado: O valor de $\log_3 2\cdot\log_2 27$ é
      opcoes: ['$2$', '$9$', '$3$', '$6$', '$\dfrac32$']
      correta: C
      resolucao: |
        $\dfrac{\log2}{\log3}\cdot\dfrac{3\log3}{\log2}=3$.

    - enunciado: O valor aproximado de $\log_2 3$ é
      opcoes: ['$0{,}63$', '$1{,}50$', '$0{,}18$', '$1{,}58$', '$2{,}00$']
      correta: D
      resolucao: |
        $\tfrac{0{,}477}{0{,}301}\approx1{,}58$.

    - enunciado: Se $\log_2 3=a$, então $\log_8 9$ vale
      opcoes: ['$\dfrac{2a}3$', '$\dfrac{3a}2$', '$6a$', '$\dfrac a6$', '$a$']
      correta: A
      resolucao: |
        $\dfrac{2\log_2 3}{3}=\dfrac{2a}3$.

    - enunciado: O valor de $\log_{1/2}16$ é
      opcoes: ['$4$', '$-\dfrac14$', '$8$', '$\dfrac14$', '$-4$']
      correta: E
      resolucao: |
        $\dfrac{\log_2 16}{\log_2\frac12}=\dfrac4{-1}=-4$.

    - enunciado: O valor de $\log_2 3\cdot\log_3 5\cdot\log_5 8$ é
      opcoes: ['$1$', '$3$', '$8$', '$15$', '$\log_2 15$']
      correta: B
      resolucao: |
        Em cascata: $\log_2 8=3$.

    - enunciado: Se $\log_a b=4$, então $\log_b a$ vale
      opcoes: ['$4$', '$-4$', '$\dfrac14$', '$16$', '$-\dfrac14$']
      correta: C
      resolucao: |
        $\log_b a=\dfrac1{\log_a b}=\dfrac14$.

    - enunciado: A solução de $\log_2 x+\log_4 x=6$ é
      opcoes: ['$4$', '$8$', '$12$', '$16$', '$64$']
      correta: D
      resolucao: |
        $\tfrac32\log_2 x=6\Rightarrow\log_2 x=4\Rightarrow x=16$.

    - enunciado: O valor de $\dfrac1{\log_2 6}+\dfrac1{\log_3 6}$ é
      opcoes: ['$\dfrac16$', '$1$', '$5$', '$6$', '$\log_6 5$']
      correta: B
      resolucao: |
        $\log_6 2+\log_6 3=\log_6 6=1$.

    - enunciado: Se $\log_3 5=m$, então $\log_{25}3$ vale
      opcoes: ['$2m$', '$\dfrac m2$', '$\dfrac1{2m}$', '$\dfrac2m$', '$m^2$']
      correta: C
      resolucao: |
        $\log_{25}3=\dfrac1{\log_3 25}=\dfrac1{2m}$.

    - enunciado: O valor de $\log_{25}125$ é
      opcoes: ['$5$', '$\dfrac23$', '$\dfrac35$', '$\dfrac53$', '$\dfrac32$']
      correta: E
      resolucao: |
        $\dfrac{\log_5 125}{\log_5 25}=\dfrac32$.

    - enunciado: O valor aproximado de $\log_5 2$ é
      opcoes: ['$0{,}43$', '$0{,}30$', '$0{,}70$', '$2{,}32$', '$0{,}50$']
      correta: A
      resolucao: |
        $\dfrac{0{,}301}{1-0{,}301}=\dfrac{0{,}301}{0{,}699}\approx0{,}43$.

    - enunciado: Se $\log_2 3=a$, então $\log_6 2$ vale
      opcoes: ['$1+a$', '$\dfrac a{1+a}$', '$\dfrac1a$', '$\dfrac1{1+a}$', '$\dfrac{1+a}a$']
      correta: D
      resolucao: |
        $\dfrac1{\log_2 6}=\dfrac1{1+a}$.

    - enunciado: O valor de $\log_{\sqrt2}32$ é
      opcoes: ['$5$', '$10$', '$\dfrac52$', '$16$', '$5\sqrt2$']
      correta: B
      resolucao: |
        $\dfrac{\log_2 32}{\log_2\sqrt2}=\dfrac5{1/2}=10$.

    - enunciado: A solução de $\log_3 x=\log_9(x+6)$ é
      opcoes: ['$-2$', '$3$', '$-2$ e $3$', '$6$', '$9$']
      correta: B
      resolucao: |
        $x^2=x+6\Rightarrow x=3$ ou $x=-2$; só $x=3$ está no domínio.

    - enunciado: Um investimento a $10\%$ ao ano, a juros compostos, dobra de valor em aproximadamente (use $\log1{,}1\approx0{,}0414$)
      opcoes: ['$5$ anos', '$6{,}2$ anos', '$7{,}3$ anos', '$10$ anos', '$20$ anos']
      correta: C
      resolucao: |
        $t=\dfrac{\log2}{\log1{,}1}\approx\dfrac{0{,}301}{0{,}0414}\approx7{,}3$. (A alternativa D seria com juros simples.)

    - enunciado: Sendo $\log2=a$ e $\log3=b$, o valor de $\log_6 12$ é
      opcoes: ['$\dfrac{2a+b}{a+b}$', '$\dfrac{a+b}{2a+b}$', '$2$', '$a+b$', '$\dfrac{2ab}{a+b}$']
      correta: A
      resolucao: |
        $\dfrac{\log12}{\log6}=\dfrac{2a+b}{a+b}$.

    - enunciado: O valor de $\log_2 9\cdot\log_3 8$ é
      opcoes: ['$1$', '$\dfrac32$', '$\dfrac23$', '$72$', '$6$']
      correta: E
      resolucao: |
        $\dfrac{2\log3}{\log2}\cdot\dfrac{3\log2}{\log3}=6$.

    - enunciado: O valor de $\log_9 27+\log_8 4$ é
      opcoes: ['$\dfrac{13}6$', '$\dfrac{5}{2}$', '$2$', '$\dfrac{7}{3}$', '$\dfrac{11}{6}$']
      correta: A
      resolucao: |
        $\tfrac32+\tfrac23=\tfrac{9+4}6=\tfrac{13}6$.

    - enunciado: O valor de $\log_2 3\cdot\log_3 4\cdot\log_4 5\cdots\log_{31}32$ é
      opcoes: ['$4$', '$16$', '$31$', '$5$', '$32$']
      correta: D
      resolucao: |
        Em cascata: $\log_2 32=5$.
