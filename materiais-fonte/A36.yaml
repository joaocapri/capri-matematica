# Fonte das listas em PDF da aula A36 — Progressão Geométrica (P.G.) - Termo Geral
# Matemática em LaTeX. Todas as respostas foram conferidas por cálculo independente.
aula: A36

fixacao:
  intro: Resolva na ordem — do aquecimento ao desafio. Na P.G. multiplicamos sempre pela mesma razão $q$; do $1^\circ$ ao $n$-ésimo termo são $n-1$ multiplicações, por isso $a_n=a_1\cdot q^{n-1}$.
  secoes:
    - nome: Aquecimento
      questoes:
        - enunciado: Dê a razão de cada P.G. e classifique-a em crescente, decrescente, constante ou alternante.
          itens:
            - $(2,\ 6,\ 18,\ 54,\ \dots)$
            - $(64,\ 32,\ 16,\ 8,\ \dots)$
            - $(3,\ -6,\ 12,\ -24,\ \dots)$
            - $(5,\ 5,\ 5,\ \dots)$
          resolucao: |
            A razão é o quociente entre um termo e o anterior.
            (a) $q=3$, crescente. \ (b) $q=\tfrac12$, decrescente.
            (c) $q=-2$, alternante (os sinais se alternam). \ (d) $q=1$, constante.
          resposta: '(a) $3$, cresc. \quad (b) $\tfrac12$, decresc. \quad (c) $-2$, altern. \quad (d) $1$, const.'

        - enunciado: Calcule o $8^\circ$ termo da P.G. $(3,\ 6,\ 12,\ \dots)$.
          resolucao: |
            $a_8=3\cdot2^7=3\cdot128=384$.
          resposta: '$a_8=384$'

        - enunciado: Em uma P.G., $a_1=1000$ e $q=\tfrac1{10}$. Calcule $a_5$.
          resolucao: |
            $a_5=1000\cdot\left(\tfrac1{10}\right)^4=\tfrac{1000}{10\,000}=0{,}1$.
          resposta: '$a_5=0{,}1$'

        - enunciado: Escreva o termo geral da P.G. $(5,\ 15,\ 45,\ \dots)$.
          resolucao: |
            $a_1=5$ e $q=3$: $a_n=5\cdot3^{n-1}$.
          resposta: '$a_n=5\cdot3^{n-1}$'

        - enunciado: Em uma P.G., $a_1=2$ e $a_4=54$. Calcule a razão.
          resolucao: |
            $2q^3=54\Rightarrow q^3=27\Rightarrow q=3$.
          resposta: '$q=3$'

        - enunciado: Determine $x$ para que $(x-1,\ x+1,\ x+7)$ seja uma P.G. e escreva seus termos.
          resolucao: |
            Na P.G., o quadrado do termo do meio é o produto dos vizinhos: $(x+1)^2=(x-1)(x+7)$.
            $x^2+2x+1=x^2+6x-7\Rightarrow 4x=8\Rightarrow x=2$. A P.G. é $(1,\ 3,\ 9)$.
          resposta: '$x=2$; \ $(1,\ 3,\ 9)$'

        - enunciado: Qual é a posição do termo $1458$ na P.G. $(2,\ 6,\ 18,\ \dots)$?
          resolucao: |
            $2\cdot3^{n-1}=1458\Rightarrow 3^{n-1}=729=3^6\Rightarrow n=7$.
          resposta: '$7^\circ$ termo'

    - nome: Treino
      questoes:
        - enunciado: Em uma P.G., $a_3=12$ e $a_6=96$. Calcule a razão e o primeiro termo.
          resolucao: |
            Do $3^\circ$ ao $6^\circ$ termo são $3$ multiplicações: $q^3=\tfrac{96}{12}=8\Rightarrow q=2$.
            $a_1=\tfrac{a_3}{q^2}=\tfrac{12}{4}=3$.
          resposta: '$q=2$; \ $a_1=3$'

        - enunciado: Interpole $3$ meios geométricos reais e positivos entre $2$ e $162$.
          resolucao: |
            A P.G. terá $5$ termos: $2q^4=162\Rightarrow q^4=81\Rightarrow q=3$.
            $(2,\ 6,\ 18,\ 54,\ 162)$.
          resposta: '$6,\ 18,\ 54$'

        - enunciado: Três números em P.G. têm produto $216$ e soma $21$. Determine esses números.
          resolucao: |
            Escreva-os como $\tfrac xq$, $x$, $xq$. Produto: $x^3=216\Rightarrow x=6$.
            Soma: $\tfrac6q+6+6q=21\Rightarrow 2q^2-5q+2=0\Rightarrow q=2$ ou $q=\tfrac12$.
            Em ambos os casos os números são $3$, $6$ e $12$.
          resposta: '$3,\ 6$ e $12$'

        - enunciado: Uma cidade tem $50\,000$ habitantes e a população cresce $10\%$ ao ano.
          itens:
            - Escreva a população $P_n$ daqui a $n$ anos.
            - Quantos habitantes haverá daqui a $3$ anos?
          resolucao: |
            (a) Crescer $10\%$ é multiplicar por $1{,}1$: $P_n=50\,000\cdot1{,}1^n$.
            (b) $P_3=50\,000\cdot1{,}331=66\,550$.
          resposta: '(a) $P_n=50\,000\cdot1{,}1^n$ \quad (b) $66\,550$'

        - enunciado: Um carro de R\$ 80.000,00 perde $15\%$ do valor a cada ano. Quanto ele valerá daqui a $2$ anos?
          resolucao: |
            Perder $15\%$ é multiplicar por $0{,}85$: $80\,000\cdot0{,}85^2=80\,000\cdot0{,}7225=57\,800$.
          resposta: 'R\$ 57.800,00'

        - enunciado: Uma colônia de bactérias dobra a cada $20$ minutos. Começando com $500$ bactérias, quantas haverá depois de $2$ horas?
          resolucao: |
            Em $2$ horas há $6$ períodos de $20$ minutos: $500\cdot2^6=32\,000$.
          resposta: '$32\,000$ bactérias'

        - enunciado: Calcule o $9^\circ$ termo da P.G. $\left(1,\ \sqrt2,\ 2,\ 2\sqrt2,\ \dots\right)$.
          resolucao: |
            $q=\sqrt2$: $a_9=1\cdot(\sqrt2)^8=2^4=16$.
          resposta: '$a_9=16$'

        - enunciado: Em uma P.G. de termos positivos, $a_2=6$ e $a_4=24$. Calcule $a_3$ e $a_1$.
          resolucao: |
            O termo do meio é a média geométrica dos vizinhos: $a_3=\sqrt{6\cdot24}=12$.
            $q=\tfrac{12}6=2$ e $a_1=\tfrac{6}{2}=3$.
          resposta: '$a_3=12$; \ $a_1=3$'

    - nome: Desafio
      questoes:
        - enunciado: Quantos termos da P.G. $(3,\ 6,\ 12,\ \dots)$ são menores que $10\,000$?
          resolucao: |
            $3\cdot2^{n-1}<10\,000\Rightarrow 2^{n-1}<3333{,}\overline{3}$.
            Como $2^{11}=2048$ e $2^{12}=4096$, vale para $n-1\le11$, isto é, $n\le12$.
          resposta: '$12$ termos'

        - enunciado: Um capital é aplicado a juros compostos de $10\%$ ao ano. Use $\log2=0{,}301$ e $\log1{,}1=0{,}041$ para descobrir em que ano o montante passa a ser o dobro do capital.
          resolucao: |
            $1{,}1^n\ge2\Rightarrow n\ge\tfrac{\log2}{\log1{,}1}=\tfrac{0{,}301}{0{,}041}\approx7{,}3$.
            O montante passa do dobro durante o $8^\circ$ ano.
          resposta: 'no $8^\circ$ ano'

        - enunciado: Os números $x$, $x+9$ e $x+45$ formam, nessa ordem, uma P.G. Calcule $x$ e a razão.
          resolucao: |
            $(x+9)^2=x(x+45)\Rightarrow x^2+18x+81=x^2+45x\Rightarrow 27x=81\Rightarrow x=3$.
            A P.G. é $(3,\ 12,\ 48)$, de razão $4$.
          resposta: '$x=3$; \ $q=4$'

        - enunciado: Um quadrado tem lado $16$ cm. Unindo os pontos médios de seus lados, obtém-se um novo quadrado; repete-se o processo indefinidamente. Calcule a área do $6^\circ$ quadrado.
          resolucao: |
            O quadrado interno tem metade da área do anterior: P.G. de $a_1=256$ e $q=\tfrac12$.
            $a_6=256\cdot\left(\tfrac12\right)^5=8$ cm$^2$.
          resposta: '$8$ cm$^2$'

        - enunciado: Uma folha de papel com $0{,}1$ mm de espessura é dobrada ao meio sucessivas vezes. A partir de quantas dobras a espessura passa de $1$ metro?
          resolucao: |
            Após $n$ dobras, a espessura é $0{,}1\cdot2^n$ mm. Queremos $0{,}1\cdot2^n>1000$, isto é, $2^n>10\,000$.
            $2^{13}=8192$ não basta; $2^{14}=16\,384$ basta.
          resposta: '$14$ dobras'

vestibular:
  intro: Questões autorais no estilo dos principais vestibulares. Assinale uma única alternativa.
  questoes:
    - enunciado: O $7^\circ$ termo da P.G. $(2,\ 6,\ 18,\ \dots)$ é
      opcoes: ['$486$', '$729$', '$1296$', '$1458$', '$4374$']
      correta: D
      resolucao: |
        $a_7=2\cdot3^6=2\cdot729=1458$.

    - enunciado: A razão da P.G. em que $a_1=5$ e $a_4=625$ é
      opcoes: ['$3$', '$4$', '$5$', '$25$', '$125$']
      correta: C
      resolucao: |
        $5q^3=625\Rightarrow q^3=125\Rightarrow q=5$.

    - enunciado: O termo geral da P.G. $(3,\ 12,\ 48,\ \dots)$ é
      opcoes: ['$a_n=3\cdot4^{n-1}$', '$a_n=3\cdot4^{n}$', '$a_n=4\cdot3^{n-1}$', '$a_n=12^{n-1}$', '$a_n=3+9(n-1)$']
      correta: A
      resolucao: |
        $a_1=3$ e $q=4$: $a_n=3\cdot4^{n-1}$.

    - enunciado: Se $(x,\ x+3,\ x+9)$ é uma P.G., então $x$ vale
      opcoes: ['$1$', '$3$', '$6$', '$9$', '$12$']
      correta: B
      resolucao: |
        $(x+3)^2=x(x+9)\Rightarrow x^2+6x+9=x^2+9x\Rightarrow x=3$.

    - enunciado: Em uma P.G., $a_2=10$ e $a_5=80$. O primeiro termo é
      opcoes: ['$1$', '$2$', '$\tfrac52$', '$4$', '$5$']
      correta: E
      resolucao: |
        $q^3=\tfrac{80}{10}=8\Rightarrow q=2$; \ $a_1=\tfrac{10}{2}=5$.

    - enunciado: Interpolando $4$ meios geométricos entre $1$ e $243$, o maior dos meios é
      opcoes: ['$9$', '$27$', '$54$', '$81$', '$243$']
      correta: D
      resolucao: |
        $q^5=243\Rightarrow q=3$: $(1,\ 3,\ 9,\ 27,\ 81,\ 243)$. O maior meio é $81$.

    - enunciado: Uma cultura com $20\,000$ bactérias cresce $50\%$ a cada hora. Depois de $3$ horas, o número de bactérias será
      opcoes: ['$67\,500$', '$80\,000$', '$90\,000$', '$101\,250$', '$135\,000$']
      correta: A
      resolucao: |
        $20\,000\cdot1{,}5^3=20\,000\cdot3{,}375=67\,500$.

    - enunciado: Um carro de R\$ 60.000,00 perde $20\%$ do valor a cada ano. Depois de $3$ anos, ele valerá
      opcoes: ['R\$ 24.000,00', 'R\$ 28.800,00', 'R\$ 30.720,00', 'R\$ 36.000,00', 'R\$ 38.400,00']
      correta: C
      resolucao: |
        $60\,000\cdot0{,}8^3=60\,000\cdot0{,}512=30\,720$.

    - enunciado: O $8^\circ$ termo da P.G. $(81,\ 27,\ 9,\ \dots)$ é
      opcoes: ['$\tfrac1{81}$', '$\tfrac1{27}$', '$\tfrac19$', '$\tfrac13$', '$3$']
      correta: B
      resolucao: |
        $a_8=81\cdot\left(\tfrac13\right)^7=\tfrac{3^4}{3^7}=\tfrac1{27}$.

    - enunciado: Três números em P.G. têm produto $1000$ e soma $35$. O maior deles é
      opcoes: ['$5$', '$10$', '$12$', '$15$', '$20$']
      correta: E
      resolucao: |
        $\tfrac xq\cdot x\cdot xq=x^3=1000\Rightarrow x=10$; \ $\tfrac{10}q+10+10q=35\Rightarrow q=2$ ou $q=\tfrac12$.
        Os números são $5$, $10$ e $20$.

    - enunciado: Na P.G. $(3,\ 6,\ 12,\ \dots)$, o termo $3072$ ocupa a posição
      opcoes: ['$9$', '$10$', '$11$', '$12$', '$1024$']
      correta: C
      resolucao: |
        $3\cdot2^{n-1}=3072\Rightarrow 2^{n-1}=1024=2^{10}\Rightarrow n=11$.

    - enunciado: Quantos termos da P.G. $(1,\ 3,\ 9,\ \dots)$ são menores que $1000$?
      opcoes: ['$6$', '$7$', '$8$', '$9$', '$10$']
      correta: B
      resolucao: |
        $3^{n-1}<1000$. Como $3^6=729$ e $3^7=2187$, vale para $n=1,\dots,7$.

    - enunciado: Em uma P.G., $a_1=2$ e $q=-3$. O sexto termo é
      opcoes: ['$-486$', '$-162$', '$162$', '$486$', '$1458$']
      correta: A
      resolucao: |
        $a_6=2\cdot(-3)^5=2\cdot(-243)=-486$.

    - enunciado: Um quadrado tem lado $8$ cm. Unindo os pontos médios de seus lados obtém-se outro quadrado, e o processo se repete. A área do $5^\circ$ quadrado, em cm$^2$, é
      opcoes: ['$1$', '$2$', '$3$', '$4$', '$8$']
      correta: D
      resolucao: |
        As áreas formam uma P.G. de $a_1=64$ e $q=\tfrac12$: $a_5=64\cdot\tfrac1{16}=4$.

    - enunciado: Sabendo que $x$ é positivo e que $(x-2,\ x+1,\ 2x+2)$ é uma P.G., o valor de $x$ é
      opcoes: ['$1$', '$2$', '$3$', '$4$', '$5$']
      correta: E
      resolucao: |
        $(x+1)^2=(x-2)(2x+2)\Rightarrow x^2-4x-5=0\Rightarrow x=5$ ou $x=-1$.
        Com $x$ positivo, $x=5$: a P.G. é $(3,\ 6,\ 12)$.

    - enunciado: Uma folha de papel de $0{,}1$ mm de espessura é dobrada ao meio $10$ vezes seguidas. A espessura final é de aproximadamente
      opcoes: ['$1{,}024$ cm', '$10{,}24$ cm', '$20{,}48$ cm', '$102{,}4$ cm', '$1024$ cm']
      correta: B
      resolucao: |
        $0{,}1\cdot2^{10}=102{,}4$ mm $=10{,}24$ cm.

    - enunciado: R\$ 1.000,00 são aplicados a juros compostos de $2\%$ ao mês. Ao fim de $2$ meses, o montante é
      opcoes: ['R\$ 1.020,00', 'R\$ 1.040,00', 'R\$ 1.040,40', 'R\$ 1.041,20', 'R\$ 1.060,40']
      correta: C
      resolucao: |
        $1000\cdot1{,}02^2=1000\cdot1{,}0404=1040{,}40$.

    - enunciado: Em uma P.G. de termos positivos, $a_1\cdot a_5=144$. O termo $a_3$ é
      opcoes: ['$12$', '$24$', '$36$', '$72$', '$144$']
      correta: A
      resolucao: |
        $a_1\cdot a_5=a_1\cdot a_1q^4=(a_1q^2)^2=a_3^2=144\Rightarrow a_3=12$.

    - enunciado: Uma mensagem é enviada a $3$ pessoas na $1^{\text{a}}$ hora. Na hora seguinte, cada pessoa que a recebeu a repassa para $3$ novas pessoas, e assim por diante. O número de pessoas que recebem a mensagem na $6^{\text{a}}$ hora é
      opcoes: ['$18$', '$216$', '$243$', '$486$', '$729$']
      correta: E
      resolucao: |
        P.G. de $a_1=3$ e $q=3$: $a_6=3\cdot3^5=729$.

    - enunciado: Uma população cresce $20\%$ ao ano. Usando $\log2=0{,}30$ e $\log1{,}2=0{,}08$, o tempo para essa população dobrar é de aproximadamente
      opcoes: ['$2{,}4$ anos', '$3{,}0$ anos', '$3{,}5$ anos', '$3{,}75$ anos', '$5{,}0$ anos']
      correta: D
      resolucao: |
        $1{,}2^t=2\Rightarrow t=\tfrac{\log2}{\log1{,}2}=\tfrac{0{,}30}{0{,}08}=3{,}75$ anos.
