# Aula 3.9.3 — Geometria analítica: ângulo entre retas
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: tg θ = |(m₁ − m₂)/(1 + m₁m₂)| para o ângulo agudo; casos especiais (paralelas, perpendiculares,
# reta vertical: θ = 90° − α); ângulos internos de triângulos; retas que formam ângulo dado com outra.
# Distância de ponto a reta (3.9.4) e regiões do plano (3.9.5) ficam para outras aulas.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Calcule o ângulo agudo $\theta$ entre as retas $r$: $y = 3x + 1$ e $s$: $y = \frac{x}{2} - 2$, completando.'
      itens:
      - '$m_r - m_s = {{\frac{5}{2}}}$ e $1 + m_r m_s = {{\frac{5}{2}}}$'
      - '$\operatorname{tg} \theta = {{1}}$, logo $\theta = {{45}}°$'
      resolucao: |
        $3 - \tfrac{1}{2} = \tfrac{5}{2}$ e $1 + \tfrac{3}{2} = \tfrac{5}{2}$. $\operatorname{tg} \theta = \left|\tfrac{5/2}{5/2}\right| = 1$: $\theta = 45°$.
      resposta: '$\frac{5}{2}$ e $\frac{5}{2}$; $\operatorname{tg} \theta = 1$; $45°$'
    - enunciado: 'Complete o quadro com o ângulo agudo (ou reto) entre retas com os coeficientes angulares dados.'
      tabela:
        cabecalho: ['$m_1$', '$m_2$', '$\theta$']
        linhas:
        - ['$2$', '$\frac{1}{3}$', '${{45}}°$']
        - ['$\sqrt{3}$', '$0$', '${{60}}°$']
        - ['$\sqrt{3}$', '$\frac{\sqrt{3}}{3}$', '${{30}}°$']
        - ['$1$', '$-1$', '${{90}}°$']
      resolucao: |
        1º: $\tfrac{5/3}{5/3} = 1$. 2º: $\operatorname{tg} \theta = \sqrt{3}$. 3º: $\tfrac{2\sqrt{3}/3}{2} = \tfrac{\sqrt{3}}{3}$. 4º: $1 + m_1 m_2 = 0$: perpendiculares.
      resposta: '$45°$, $60°$, $30°$, $90°$'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Com o módulo, a fórmula $\operatorname{tg} \theta = \left|\frac{m_1 - m_2}{1 + m_1 m_2}\right|$ dá o ângulo agudo entre as retas.'
      - 'Se $m_1 = m_2$, o ângulo entre as retas é $0°$.'
      - 'Se $1 + m_1 m_2 = 0$, as retas são perpendiculares.'
      - 'O ângulo entre as retas $y = 2x$ e $y = -2x$ é $90°$.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) O módulo torna a tangente positiva, e o ângulo, agudo. (V) São paralelas ou coincidentes.
        (V) $m_1 m_2 = -1$. (F) $\operatorname{tg} \theta = \left|\tfrac{4}{1 - 4}\right| = \tfrac{4}{3}$: o ângulo não é reto.
      resposta: V, V, V, F
    - enunciado: 'Determine o ângulo agudo entre as retas.'
      itens:
      - '$y = 2x$ e $y = \frac{x}{3} + 5$'
      - '$y = \sqrt{3}\,x$ e o eixo $x$'
      - '$y = -x + 2$ e $y = 0$'
      espaco_item: 10
      resolucao: |
        (a) $\tfrac{2 - 1/3}{1 + 2/3} = 1$: $45°$. (b) $\operatorname{tg} \alpha = \sqrt{3}$: $60°$. (c) A inclinação é $135°$; o ângulo agudo com o eixo é $45°$.
      resposta: '(a) $45°$ (b) $60°$ (c) $45°$'
    - enunciado: 'Quando uma das retas é vertical, o ângulo agudo é $90° - \alpha$, em que $\alpha$ é o ângulo agudo da outra reta com o eixo $x$. Determine o ângulo agudo entre as retas.'
      itens:
      - '$y = x$ e $x = 3$'
      - '$y = \sqrt{3}\,x + 1$ e $x = 0$'
      - '$y = \frac{\sqrt{3}}{3}x$ e o eixo $y$'
      espaco_item: 10
      resolucao: |
        (a) $90° - 45° = 45°$. (b) $90° - 60° = 30°$. (c) $90° - 30° = 60°$.
      resposta: '(a) $45°$ (b) $30°$ (c) $60°$'
    - enunciado: 'Associe cada par de retas ao ângulo agudo (ou reto) entre elas (um ângulo pode ser usado mais de uma vez).'
      esquerda:
      - '$30°$'
      - '$45°$'
      - '$60°$'
      - '$90°$'
      direita:
      - '$y = \sqrt{3}\,x$ e $y = \frac{\sqrt{3}}{3}x$'
      - '$y = 3x$ e $y = \frac{x}{2}$'
      - '$y = \sqrt{3}\,x$ e $y = -\sqrt{3}\,x$'
      - '$y = 2x$ e $y = -\frac{x}{2}$'
      - '$y = -x$ e o eixo $x$'
      resolucao: |
        1º: inclinações $60°$ e $30°$. 2º: $\tfrac{5/2}{5/2} = 1$. 3º: $\tfrac{2\sqrt{3}}{|1 - 3|} = \sqrt{3}$. 4º: produto $-1$. 5º: inclinação $135°$.
      resposta: 'De cima para baixo: 1, 2, 3, 4, 2'
    - enunciado: 'Calcule a tangente do ângulo agudo entre as retas $y = 2x$ e $y = x$. Esse ângulo é maior ou menor que $45°$?'
      espaco: 12
      resolucao: |
        $\operatorname{tg} \theta = \left|\tfrac{2 - 1}{1 + 2}\right| = \tfrac{1}{3}$. Como $\tfrac{1}{3} < 1 = \operatorname{tg} 45°$, o ângulo é menor que $45°$.
      resposta: '$\frac{1}{3}$; menor'
  - nome: Nível 2
    questoes:
    - texto: |
        Para o ângulo entre $y = \frac{x}{2}$ e $y = 3x$, Caio fez $\frac{\frac{1}{2} - 3}{1 + \frac{3}{2}} = -1$ e concluiu que “o ângulo é $-45°$”.
      enunciado: 'Corrija Caio.'
      espaco: 12
      resolucao: |
        Faltou o módulo: a ordem de $m_1$ e $m_2$ só muda o sinal. $\operatorname{tg} \theta = |-1| = 1$: o ângulo agudo é $45°$ (o outro ângulo entre as retas é $135°$).
      resposta: '$45°$'
    - enunciado: 'Considere o triângulo de vértices $A(0, 0)$, $B(4, 0)$ e $C(1, 3)$.'
      itens:
      - 'Calcule o ângulo interno em $B$.'
      - 'Calcule a tangente do ângulo interno em $A$.'
      - 'Calcule a tangente do ângulo interno em $C$.'
      espaco_item: 12
      resolucao: |
        (a) $AB$ é horizontal e $m_{BC} = \tfrac{3}{-3} = -1$: $45°$. (b) $m_{AC} = 3$ e $AB$ horizontal: $\operatorname{tg} A = 3$.
        (c) $m_{CA} = 3$ e $m_{CB} = -1$: $\left|\tfrac{3 + 1}{1 - 3}\right| = 2$. (O ângulo $C$ é agudo: $A + B < 135°$.)
      resposta: '(a) $45°$ (b) $3$ (c) $2$'
    - enunciado: 'Determine as retas que passam pela origem e formam $45°$ com a reta $y = x$.'
      espaco: 14
      resolucao: |
        $\left|\tfrac{m - 1}{1 + m}\right| = 1$. $m - 1 = 1 + m$ é impossível; $m - 1 = -1 - m$ dá $m = 0$: a reta $y = 0$.
        A reta vertical $x = 0$ também serve ($90° - 45° = 45°$), mas não aparece na fórmula, porque não tem $m$.
      resposta: '$y = 0$ e $x = 0$'
    - enunciado: 'Determine as retas que passam por $(1, 2)$ e formam $45°$ com a reta $y = 2x$.'
      espaco: 16
      resolucao: |
        $\left|\tfrac{m - 2}{1 + 2m}\right| = 1$. $m - 2 = 1 + 2m$: $m = -3$. $m - 2 = -1 - 2m$: $m = \tfrac{1}{3}$.
        Retas: $y - 2 = -3(x - 1)$, ou $y = -3x + 5$; e $y - 2 = \tfrac{1}{3}(x - 1)$, ou $y = \tfrac{x}{3} + \tfrac{5}{3}$.
      resposta: '$y = -3x + 5$ e $y = \frac{x}{3} + \frac{5}{3}$'
    - enunciado: 'Complete o quadro com o ângulo agudo que cada reta forma com o eixo $x$ e com o eixo $y$.'
      tabela:
        cabecalho: ['Reta', 'Com o eixo $x$', 'Com o eixo $y$']
        linhas:
        - ['$y = x$', '${{45}}°$', '${{45}}°$']
        - ['$y = \sqrt{3}\,x$', '${{60}}°$', '${{30}}°$']
        - ['$y = \frac{\sqrt{3}}{3}x$', '${{30}}°$', '${{60}}°$']
        - ['$y = -x$', '${{45}}°$', '${{45}}°$']
      resolucao: |
        Os dois ângulos somam $90°$. Para $y = -x$, a inclinação é $135°$, e o ângulo agudo com o eixo $x$ é $45°$.
      resposta: '$45°$ e $45°$; $60°$ e $30°$; $30°$ e $60°$; $45°$ e $45°$'
    - enunciado: 'Duas ruas retas de uma cidade são representadas pelas retas $y = 2x$ e $y = -3x + 10$. Qual é o ângulo agudo do cruzamento?'
      espaco: 12
      resolucao: |
        $\operatorname{tg} \theta = \left|\tfrac{2 + 3}{1 - 6}\right| = 1$: $45°$.
      resposta: '$45°$'
    - enunciado: 'Determine o ângulo agudo entre as diagonais do retângulo de vértices $(0, 0)$, $(3, 0)$, $(3, \sqrt{3})$ e $(0, \sqrt{3})$.'
      espaco: 14
      resolucao: |
        As diagonais têm $m = \tfrac{\sqrt{3}}{3}$ e $m = -\tfrac{\sqrt{3}}{3}$. $\operatorname{tg} \theta = \left|\tfrac{2\sqrt{3}/3}{1 - 1/3}\right| = \sqrt{3}$: $60°$.
      resposta: '$60°$'
    - enunciado: 'Determine $m$ para que a tangente do ângulo agudo entre $y = 3x$ e $y = mx$ seja $\frac{1}{2}$.'
      espaco: 14
      resolucao: |
        $\left|\tfrac{m - 3}{1 + 3m}\right| = \tfrac{1}{2}$. $2m - 6 = 1 + 3m$: $m = -7$. $2m - 6 = -1 - 3m$: $m = 1$.
      resposta: '$m = 1$ ou $m = -7$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Duas retas têm inclinações $\alpha_1$ e $\alpha_2$, com $\operatorname{tg} \alpha_1 = m_1$ e $\operatorname{tg} \alpha_2 = m_2$. Usando a fórmula da tangente da diferença, explique de onde vem $\operatorname{tg} \theta = \left|\frac{m_1 - m_2}{1 + m_1 m_2}\right|$ e por que se usa o módulo.'
      espaco: 18
      resolucao: |
        Um dos ângulos entre as retas é $\alpha_1 - \alpha_2$ (ou o seu oposto), e $\operatorname{tg}(\alpha_1 - \alpha_2) = \tfrac{m_1 - m_2}{1 + m_1 m_2}$.
        Duas retas formam dois ângulos suplementares, com tangentes opostas. O módulo escolhe a positiva, que corresponde ao ângulo agudo.
      resposta: 'Ver resolução'
    - enunciado: 'As retas $y = \sqrt{3}\,x$, $y = -\sqrt{3}(x - 2)$ e $y = 0$ formam um triângulo. Mostre que ele é equilátero usando ângulos e determine os seus vértices.'
      espaco: 18
      resolucao: |
        Com o eixo $x$, as duas primeiras formam $60°$ (tangentes $\sqrt{3}$ e $-\sqrt{3}$). Entre si: $\left|\tfrac{2\sqrt{3}}{1 - 3}\right| = \sqrt{3}$, $60°$. Três ângulos de $60°$: equilátero.
        Vértices: $(0, 0)$, $(2, 0)$ e $(1, \sqrt{3})$.
      resposta: '$(0, 0)$, $(2, 0)$, $(1, \sqrt{3})$'
    - enunciado: 'No triângulo de vértices $A(0, 0)$, $B(6, 0)$ e $C(2, 4)$, calcule $\operatorname{tg} A$, $\operatorname{tg} B$ e $\operatorname{tg} C$ e verifique que $\operatorname{tg} C = -\operatorname{tg}(A + B)$.'
      espaco: 20
      resolucao: |
        $\operatorname{tg} A = m_{AC} = 2$. $m_{BC} = -1$: $B = 45°$, $\operatorname{tg} B = 1$. Em $C$: $\left|\tfrac{2 + 1}{1 - 2}\right| = 3$.
        $\operatorname{tg}(A + B) = \tfrac{2 + 1}{1 - 2} = -3$, e $C = 180° - (A + B)$ tem tangente $3$.
      resposta: '$2$, $1$ e $3$'
    - enunciado: 'A reta $r$ passa por $(0, 1)$ e forma $30°$ com o eixo $y$. Determine as possíveis equações de $r$.'
      espaco: 14
      resolucao: |
        Com o eixo $y$, $30°$; com o eixo $x$, $60°$ (inclinação $60°$ ou $120°$). $m = \sqrt{3}$ ou $m = -\sqrt{3}$: $y = \sqrt{3}\,x + 1$ ou $y = -\sqrt{3}\,x + 1$.
      resposta: '$y = \pm\sqrt{3}\,x + 1$'
    - enunciado: 'Para que valores de $a$ as retas $ax + y = 0$ e $x + y = 0$ formam um ângulo de $45°$? Explique por que uma das retas esperadas não aparece.'
      espaco: 16
      resolucao: |
        $m_1 = -a$ e $m_2 = -1$: $\left|\tfrac{1 - a}{1 + a}\right| = 1$. $1 - a = 1 + a$ dá $a = 0$ ($y = 0$); $1 - a = -1 - a$ é impossível.
        A reta vertical $x = 0$ também forma $45°$ com $y = -x$, mas não pode ser escrita como $ax + y = 0$ (o coeficiente de $y$ é 1).
      resposta: '$a = 0$'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Num mapa com eixos em quilômetros, duas estradas retas partem de um mesmo trevo, na origem, e são representadas pelas retas da figura, de equações $y = 3x$ e $y = \frac{x}{2}$. O engenheiro de trânsito quer a tangente do ângulo agudo entre as estradas para dimensionar a curva de acesso.
    figura:
      tikz: |
        \begin{scope}[scale=.5]
        \draw[step=1, gray!25, very thin] (0,0) grid (8,7);
        \draw[-latex, ink!60] (-0.3,0) -- (8.4,0) node[right, font=\scriptsize] {$x$};
        \draw[-latex, ink!60] (0,-0.3) -- (0,7.4) node[above, font=\scriptsize] {$y$};
        \draw[roxo, line width=1pt] (0,0) -- (2.3,6.9) node[right, font=\scriptsize] {$y = 3x$};
        \draw[ink, line width=1pt] (0,0) -- (8,4) node[above, font=\scriptsize] {$y = \frac{x}{2}$};
        \end{scope}
    enunciado: |
      A tangente do ângulo agudo entre as estradas é
    opcoes: ['$\frac{1}{3}$', '$\frac{1}{2}$', '$\frac{2}{3}$', '$\frac{3}{4}$', '$1$']
    correta: E
    resolucao: |
      $\operatorname{tg} \theta = \left|\tfrac{3 - 1/2}{1 + 3/2}\right| = \tfrac{5/2}{5/2} = 1$: as estradas formam $45°$.

  - estilo: Fuvest
    enunciado: |
      O ângulo agudo entre as retas $y = \sqrt{3}\,x + 1$ e $y = -\sqrt{3}\,x + 4$ mede
    opcoes: ['$15°$', '$30°$', '$45°$', '$50°$', '$60°$']
    correta: E
    resolucao: |
      $\left|\tfrac{2\sqrt{3}}{1 - 3}\right| = \sqrt{3}$: $60°$. (As inclinações são $60°$ e $120°$.)

  - estilo: Unicamp
    enunciado: |
      A tangente do ângulo agudo entre as retas $y = 2x$ e $y = x$ é
    opcoes: ['$\frac{1}{3}$.', '$1$.', '$3$.', '$\frac{1}{2}$.']
    correta: A
    resolucao: |
      $\left|\tfrac{2 - 1}{1 + 2}\right| = \tfrac{1}{3}$. Quem esquece o denominador marca 1.

  - estilo: UEM
    enunciado: |
      Considere as retas $r$: $y = 3x$, $s$: $y = \frac{x}{2}$ e $t$: $x = 2$. Assinale o que for correto.
    proposicoes:
    - 'A tangente do ângulo agudo entre $r$ e $s$ é 1.'
    - 'O ângulo agudo entre $r$ e $s$ mede $45°$.'
    - 'A tangente do ângulo agudo entre $s$ e $t$ é 2.'
    - 'O ângulo agudo entre $r$ e o eixo $x$ mede $60°$.'
    - 'As retas $r$ e $s$ se cortam na origem.'
    corretas: [1, 2, 3, 5]
    resolucao: |
      01), 02) $\tfrac{5/2}{5/2} = 1$. 04) $s$ forma com o eixo $x$ um ângulo $\alpha$ com $\operatorname{tg} \alpha = \tfrac{1}{2}$; com a vertical, $90° - \alpha$, de tangente $\tfrac{1}{\operatorname{tg} \alpha} = 2$.
      08) Incorreta: $\operatorname{tg} = 3 \neq \sqrt{3}$. 16) Correta.
      Soma: $01 + 02 + 04 + 16 = 23$.

  - estilo: Unesp
    texto: |
      A figura mostra o triângulo de vértices $A(0, 0)$, $B(4, 0)$ e $C(1, 3)$.
    figura:
      tikz: |
        \begin{scope}[scale=.6]
        \draw[step=1, gray!25, very thin] (0,0) grid (5,4);
        \draw[-latex, ink!60] (-0.3,0) -- (5.4,0) node[right, font=\scriptsize] {$x$};
        \draw[-latex, ink!60] (0,-0.3) -- (0,4.4) node[above, font=\scriptsize] {$y$};
        \draw[roxo, line width=1pt, fill=roxo!10] (0,0) -- (4,0) -- (1,3) -- cycle;
        \node[below left, font=\scriptsize] at (0,0) {$A$};
        \node[below, font=\scriptsize] at (4,0) {$B$};
        \node[above, font=\scriptsize] at (1,3) {$C$};
        \end{scope}
    enunciado: |
      O ângulo interno do triângulo no vértice $B$ mede
    opcoes: ['$22{,}5°$', '$30°$', '$36°$', '$45°$', '$60°$']
    correta: D
    resolucao: |
      $AB$ está no eixo $x$ e $m_{BC} = \tfrac{3 - 0}{1 - 4} = -1$: a reta $BC$ forma $45°$ com o eixo.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir sobre ângulos entre retas.
    afirmativas:
    - 'Duas retas paralelas formam ângulo de $0°$.'
    - 'Se $m_1 \cdot m_2 = -1$, o ângulo entre as retas é $90°$.'
    - 'O ângulo agudo entre as retas $y = x$ e $x = 0$ mede $45°$.'
    - 'O ângulo agudo entre a reta $y = \sqrt{3}\,x$ e o eixo $y$ mede $60°$.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'II e IV, apenas.', 'I, II e III, apenas.', 'III e IV, apenas.', 'I, II, III e IV.']
    correta: C
    resolucao: |
      I, II, III. Corretas. IV. Incorreta: a reta forma $60°$ com o eixo $x$ e $90° - 60° = 30°$ com o eixo $y$.

  - estilo: Fuvest
    enunciado: |
      O ângulo agudo entre as retas $y = \sqrt{3}\,x$ e $y = \frac{\sqrt{3}}{3}x$ mede
    opcoes: ['$30°$', '$45°$', '$60°$', '$75°$', '$90°$']
    correta: A
    resolucao: |
      As inclinações são $60°$ e $30°$: diferença $30°$. Pela fórmula: $\tfrac{2\sqrt{3}/3}{1 + 1} = \tfrac{\sqrt{3}}{3}$.

  # ---------------- Nível 2 ----------------
  - estilo: Enem
    texto: |
      O quadro mostra as equações de três estradas retas de uma região, num mapa com eixos em quilômetros. Pelas normas de segurança, um cruzamento em ângulo reto pode receber uma rotatória simples, enquanto os demais exigem projeto especial. O engenheiro quer saber quais estradas se cruzam em ângulo reto.
    tabela:
      cabecalho: ['Estrada', 'Equação']
      linhas:
      - ['A', '$y = 2x$']
      - ['B', '$y = -3x + 10$']
      - ['C', '$y = \frac{x}{3} + 1$']
    enunciado: |
      As estradas que se cruzam em ângulo reto são
    opcoes: ['A e B.', 'A e C.', 'B e C.', 'todas, duas a duas.', 'nenhum par.']
    correta: C
    resolucao: |
      B e C: $(-3) \cdot \tfrac{1}{3} = -1$. A e B: $\left|\tfrac{5}{1 - 6}\right| = 1$, $45°$. A e C: $\left|\tfrac{5/3}{5/3}\right| = 1$, $45°$.

  - estilo: Unicamp
    enunciado: |
      Uma reta que passa pela origem forma $45°$ com a reta $y = 2x$. Um possível valor do seu coeficiente angular é
    opcoes: ['$\frac{1}{3}$.', '$-\frac{1}{3}$.', '$3$.', '$\frac{1}{2}$.']
    correta: A
    resolucao: |
      $\left|\tfrac{m - 2}{1 + 2m}\right| = 1$: $m = -3$ ou $m = \tfrac{1}{3}$.

  - estilo: UFPR
    enunciado: |
      Considere as retas $r$: $y = 2x + 1$, $s$: $y = -\frac{x}{2} + 3$ e $t$: $y = 3x$. Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'As retas $r$ e $s$ são perpendiculares.'
    - 'A tangente do ângulo agudo entre $r$ e $t$ é $\frac{1}{7}$.'
    - 'O ângulo agudo entre $s$ e $t$ mede $45°$.'
    - 'As retas $r$ e $t$ se cortam no ponto $(1, 3)$.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – F – V – F.', 'F – V – F – V.', 'V – V – V – F.', 'V – V – F – V.', 'V – V – V – V.']
    correta: D
    resolucao: |
      (V) $2 \cdot \left(-\tfrac{1}{2}\right) = -1$. (V) $\left|\tfrac{2 - 3}{1 + 6}\right| = \tfrac{1}{7}$.
      (F) $\left|\tfrac{-1/2 - 3}{1 - 3/2}\right| = 7$. (V) $2 + 1 = 3$ e $3 \cdot 1 = 3$.

  - estilo: UFSC
    enunciado: |
      Seja $\theta$ o ângulo agudo entre a reta $y = mx$ e o eixo $x$, com $m \neq 0$. Assinale o que for correto.
    proposicoes:
    - 'Se $m = 1$, então $\theta = 45°$.'
    - 'Se $m = -\sqrt{3}$, então $\theta = 60°$.'
    - 'Se $m = \frac{\sqrt{3}}{3}$, então $\theta = 30°$.'
    - 'Se $m = 2$, então $\theta > 60°$.'
    - 'Se $m = \frac{1}{2}$, então $\theta > 30°$.'
    corretas: [1, 2, 3, 4]
    resolucao: |
      $\operatorname{tg} \theta = |m|$. 01), 02), 04) Corretas. 08) $2 > \sqrt{3} \approx 1{,}73$. 16) Incorreta: $\tfrac{1}{2} < \tfrac{\sqrt{3}}{3} \approx 0{,}58$, então $\theta < 30°$.
      Soma: $01 + 02 + 04 + 08 = 15$.

  - estilo: Fuvest
    enunciado: |
      As retas $y = mx$ que formam $45°$ com a reta $y = 3x$ têm coeficientes angulares cuja soma é
    opcoes: ['$-\frac{3}{2}$', '$-1$', '$\frac{1}{2}$', '$\frac{3}{2}$', '$\frac{5}{2}$']
    correta: A
    resolucao: |
      $\left|\tfrac{m - 3}{1 + 3m}\right| = 1$: $m - 3 = 1 + 3m$, $m = -2$; ou $m - 3 = -1 - 3m$, $m = \tfrac{1}{2}$. Soma $-\tfrac{3}{2}$.

  - estilo: Unesp
    texto: |
      O corte transversal de um telhado de duas águas é representado num sistema de eixos, em metros. Um lado do telhado está na reta $y = \frac{\sqrt{3}}{3}x$, e o outro, na reta $y = -\sqrt{3}(x - 4)$. O carpinteiro precisa do ângulo entre as duas águas, no topo, para cortar a peça de encaixe.
    enunciado: |
      O ângulo entre os dois lados do telhado, no topo, mede
    opcoes: ['$60°$', '$75°$', '$90°$', '$120°$', '$150°$']
    correta: C
    resolucao: |
      $\tfrac{\sqrt{3}}{3} \cdot (-\sqrt{3}) = -1$: as retas são perpendiculares. (As águas têm inclinações $30°$ e $60°$, e o topo forma $180° - 30° - 60° = 90°$.)

  - estilo: Enem
    texto: |
      Uma norma de segurança limita a inclinação de escadas rolantes a, no máximo, $30°$ com o piso. Num projeto, desenhado com eixos em metros e com o piso sobre o eixo $x$, a escada está sobre a reta $y = \frac{\sqrt{3}}{3}x$. O engenheiro quer conferir se o projeto respeita a norma.
    enunciado: |
      O ângulo entre a escada e o piso mede
    opcoes: ['$10°$', '$15°$', '$20°$', '$25°$', '$30°$']
    correta: E
    resolucao: |
      $\operatorname{tg} \alpha = \tfrac{\sqrt{3}}{3}$: $\alpha = 30°$, exatamente o limite da norma.

  # ---------------- Nível 3 ----------------
  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Um terreno triangular tem vértices $A(0, 0)$, $B(6, 0)$ e $C(2, 4)$, num mapa com eixos em dezenas de metros. Para cercá-lo, o serralheiro precisa dos ângulos internos do terreno, que ele calcula pelos coeficientes angulares dos lados.
    enunciado: |
      O ângulo interno no vértice $B$ mede
    opcoes: ['$30°$', '$45°$', '$60°$', '$75°$', '$90°$']
    correta: B
    resolucao: |
      $AB$ é horizontal e $m_{BC} = \tfrac{4}{-4} = -1$: $45°$.

  - estilo: Unicamp
    enunciado: |
      A tangente do ângulo interno no vértice $C$ é
    opcoes: ['$1$.', '$2$.', '$3$.', '$\frac{1}{3}$.']
    correta: C
    resolucao: |
      $m_{CA} = 2$ e $m_{CB} = -1$: $\left|\tfrac{2 + 1}{1 - 2}\right| = 3$.

  - estilo: UEM
    enunciado: |
      Considere a fórmula $\operatorname{tg} \theta = \left|\frac{m_1 - m_2}{1 + m_1 m_2}\right|$ para o ângulo agudo entre duas retas. Assinale o que for correto.
    proposicoes:
    - 'O resultado não depende da ordem em que $m_1$ e $m_2$ são colocados.'
    - 'Se uma das retas é vertical e a outra forma ângulo agudo $\alpha$ com o eixo $x$, o ângulo entre elas é $90° - \alpha$.'
    - 'A fórmula pode ser usada também quando $1 + m_1 m_2 = 0$.'
    - 'Duas retas que formam $0°$ com uma terceira são paralelas entre si ou coincidentes.'
    - 'A tangente do ângulo agudo entre $y = 2x$ e $y = -2x$ é $\frac{4}{3}$.'
    corretas: [1, 2, 4, 5]
    resolucao: |
      01) Correta: trocar a ordem só troca o sinal. 02) Correta. 04) Incorreta: o denominador se anula (é o caso das perpendiculares).
      08) Correta. 16) $\left|\tfrac{4}{1 - 4}\right| = \tfrac{4}{3}$.
      Soma: $01 + 02 + 08 + 16 = 27$.

  - estilo: Fuvest
    enunciado: |
      A reta $r$ passa pelo ponto $(0, 1)$ e forma $60°$ com o eixo $y$. Uma possível equação de $r$ é
    opcoes: ['$y = \sqrt{3}\,x + 1$', '$y = \frac{\sqrt{3}}{3}x + 1$', '$y = x + 1$', '$y = -\sqrt{3}\,x + 1$', '$y = 2x + 1$']
    correta: B
    resolucao: |
      $60°$ com o eixo $y$ é $30°$ com o eixo $x$: $m = \pm\tfrac{\sqrt{3}}{3}$. As alternativas A e D formam $30°$ com o eixo $y$.

  - estilo: Enem
    texto: |
      A figura mostra duas pistas retas de um pequeno aeroporto, representadas num sistema de eixos com origem no cruzamento: uma está sobre o eixo $x$, e a outra, sobre a reta $y = \sqrt{3}\,x$. O controlador de voo precisa informar aos pilotos o ângulo agudo entre as pistas.
    figura:
      tikz: |
        \begin{scope}[scale=.5]
        \draw[step=1, gray!25, very thin] (-1,-1) grid (6,6);
        \draw[ink, line width=3pt] (-1,0) -- (6,0);
        \draw[roxo, line width=3pt] (-0.5,-0.866) -- (3.3,5.716);
        \node[below, font=\scriptsize] at (5.4,0) {pista 1};
        \node[right, font=\scriptsize] at (3.3,5.5) {pista 2};
        \end{scope}
    enunciado: |
      O ângulo agudo entre as pistas mede
    opcoes: ['$30°$', '$45°$', '$50°$', '$60°$', '$90°$']
    correta: D
    resolucao: |
      $\operatorname{tg} \alpha = \sqrt{3}$: $60°$.

  - estilo: Fuvest
    enunciado: |
      O ângulo agudo entre as retas $x = 5$ e $y = x + 3$ mede
    opcoes: ['$15°$', '$30°$', '$40°$', '$45°$', '$60°$']
    correta: D
    resolucao: |
      $y = x + 3$ forma $45°$ com o eixo $x$; com a vertical, $90° - 45° = 45°$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere o triângulo de vértices $A(0, 0)$, $B(5, 0)$ e $C(1, 2)$.'
    itens:
    - 'Calcule $\operatorname{tg} A$ e $\operatorname{tg} B$.'
    - 'Mostre que o ângulo em $C$ é reto.'
    - 'Verifique que $\operatorname{tg} A \cdot \operatorname{tg} B = 1$ e explique por que isso é coerente com o item anterior.'
    espaco: 62
    resolucao: |
      a) $m_{AC} = 2$: $\operatorname{tg} A = 2$. $m_{BC} = \tfrac{2}{-4} = -\tfrac{1}{2}$: $\operatorname{tg} B = \tfrac{1}{2}$.
      b) $m_{CA} \cdot m_{CB} = 2 \cdot \left(-\tfrac{1}{2}\right) = -1$: $CA \perp CB$.
      c) $2 \cdot \tfrac{1}{2} = 1$. Se $C = 90°$, então $A + B = 90°$, e ângulos complementares têm tangentes inversas: $\operatorname{tg} B = \tfrac{1}{\operatorname{tg} A}$.
    resposta: 'a) $2$ e $\frac{1}{2}$; b) e c) Ver resolução'

  - estilo: Unicamp
    texto: |
      Um raio de luz desce pela reta $y = -2x + 8$ e atinge um espelho plano colocado sobre o eixo $x$. Na reflexão, o raio refletido forma com o espelho o mesmo ângulo que o raio incidente.
    enunciado: ''
    itens:
    - 'Determine o ponto em que o raio atinge o espelho.'
    - 'Escreva a equação do raio refletido.'
    - 'Calcule a tangente do ângulo agudo entre o raio incidente e o raio refletido.'
    espaco: 62
    resolucao: |
      a) $y = 0$: $x = 4$. Ponto $(4, 0)$.
      b) O incidente tem $m = -2$; o refletido, simétrico em relação ao espelho, tem $m = 2$: $y = 2(x - 4)$.
      c) $\left|\tfrac{-2 - 2}{1 - 4}\right| = \tfrac{4}{3}$.
    resposta: 'a) $(4, 0)$; b) $y = 2x - 8$; c) $\frac{4}{3}$'

  - estilo: ITA
    enunciado: |
      O ângulo agudo entre as retas $3x - y = 0$ e $x - 2y = 0$ mede
    opcoes: ['$30°$', '$45°$', '$60°$', '$75°$', '$90°$']
    correta: B
    espaco: 22
    resolucao: |
      $m_1 = 3$ e $m_2 = \tfrac{1}{2}$: $\left|\tfrac{5/2}{5/2}\right| = 1$, $45°$.
    resposta: 'B'

  - estilo: Unesp
    enunciado: 'Considere a reta $r$: $y = x$ e o ponto $P(2, 3)$.'
    itens:
    - 'Determine a reta não vertical que passa por $P$ e forma $45°$ com $r$.'
    - 'Mostre que a reta vertical que passa por $P$ também forma $45°$ com $r$.'
    - 'Calcule a área do triângulo formado por $r$ e pelas duas retas encontradas.'
    espaco: 62
    resolucao: |
      a) $\left|\tfrac{m - 1}{1 + m}\right| = 1$ só tem a solução $m = 0$: $y = 3$.
      b) $x = 2$ forma $90° - 45° = 45°$ com $r$.
      c) Vértices: $r \cap (y = 3)$: $(3, 3)$; $r \cap (x = 2)$: $(2, 2)$; e $P(2, 3)$. Catetos 1 e 1: área $\tfrac{1}{2}$.
    resposta: 'a) $y = 3$; b) Ver resolução; c) $\frac{1}{2}$'

  - estilo: UFSC
    enunciado: |
      Considere as retas $r$: $y = 2x$, $s$: $y = -x + 6$ e $t$: $y = \frac{x}{2}$. Assinale o que for correto.
    proposicoes:
    - 'A tangente do ângulo agudo entre $r$ e $t$ é $\frac{3}{4}$.'
    - 'A tangente do ângulo agudo entre $r$ e $s$ é 3.'
    - 'A tangente do ângulo agudo entre $s$ e $t$ é 3.'
    - 'O triângulo formado por $r$, $s$ e $t$ é isósceles.'
    - 'As retas $r$ e $s$ se cortam no ponto $(2, 4)$.'
    - 'As retas $t$ e $s$ se cortam no ponto $(3, 3)$.'
    corretas: [1, 2, 3, 4, 5]
    espaco: 22
    resolucao: |
      01) $\left|\tfrac{2 - 1/2}{1 + 1}\right| = \tfrac{3}{4}$. 02) $\left|\tfrac{3}{1 - 2}\right| = 3$. 04) $\left|\tfrac{-3/2}{1 - 1/2}\right| = 3$.
      08) Dois ângulos com a mesma tangente são iguais. 16) $2x = -x + 6$: $(2, 4)$. 32) Incorreta: $\tfrac{x}{2} = -x + 6$ dá $(4, 2)$.
    resposta: 'Soma 31 (01 + 02 + 04 + 08 + 16)'

  - estilo: Fuvest
    enunciado: 'As retas $y = 0$ e $y = \sqrt{3}\,x$ formam um ângulo de $60°$. Procura-se a reta $y = mx$ que forma ângulos iguais com essas duas retas.'
    itens:
    - 'Escreva a equação que $m$ deve satisfazer.'
    - 'Resolva e encontre os dois valores de $m$.'
    - 'Interprete as duas soluções e mostre que elas são perpendiculares.'
    espaco: 62
    resolucao: |
      a) $|m| = \left|\tfrac{m - \sqrt{3}}{1 + \sqrt{3}\,m}\right|$.
      b) $m(1 + \sqrt{3}\,m) = \sqrt{3} - m$ dá $\sqrt{3}\,m^2 + 2m - \sqrt{3} = 0$, com raízes $m = \tfrac{-2 \pm 4}{2\sqrt{3}}$: $m = \tfrac{\sqrt{3}}{3}$ ou $m = -\sqrt{3}$. (A outra possibilidade, $m(1 + \sqrt{3}\,m) = m - \sqrt{3}$, dá $m^2 = -1$, sem solução real.)
      c) $m = \tfrac{\sqrt{3}}{3}$ ($30°$) divide o ângulo de $60°$ ao meio: é a bissetriz interna. $m = -\sqrt{3}$ ($120°$) é a bissetriz do ângulo suplementar, de $120°$. Produto $\tfrac{\sqrt{3}}{3} \cdot (-\sqrt{3}) = -1$.
    resposta: 'a) Ver resolução; b) $\frac{\sqrt{3}}{3}$ e $-\sqrt{3}$; c) bissetrizes, perpendiculares'

  - estilo: Unicamp
    texto: |
      Uma estrada nova, representada pela reta $y = \frac{x}{2}$ num mapa com eixos em quilômetros, vai cruzar uma ferrovia. Por segurança, o ângulo agudo do cruzamento deve ser de pelo menos $60°$.
    enunciado: ''
    itens:
    - 'Se a ferrovia estiver na reta $y = -3x + 20$, calcule a tangente do ângulo do cruzamento.'
    - 'Esse cruzamento atende a norma? Justifique.'
    - 'Se a ferrovia fosse $y = mx + 20$, com $m > 0$, para que valor de $m$ o ângulo seria exatamente $45°$?'
    espaco: 62
    resolucao: |
      a) $\left|\tfrac{1/2 + 3}{1 - 3/2}\right| = \tfrac{7/2}{1/2} = 7$.
      b) Sim: $\operatorname{tg} 60° = \sqrt{3} \approx 1{,}73$, e $7 > \sqrt{3}$; como a tangente cresce com o ângulo, o cruzamento tem mais de $60°$ (cerca de $82°$).
      c) $\left|\tfrac{m - 1/2}{1 + m/2}\right| = 1$: $m - \tfrac{1}{2} = 1 + \tfrac{m}{2}$ dá $m = 3$; a outra equação dá $m = -\tfrac{1}{3}$, negativo. Então $m = 3$.
    resposta: 'a) $7$; b) sim; c) $m = 3$'

  - estilo: Fuvest
    enunciado: |
      A tangente do ângulo agudo entre a reta $2x + 3y - 6 = 0$ e o eixo $y$ é
    opcoes: ['$\frac{2}{3}$', '$\frac{3}{2}$', '$-\frac{2}{3}$', '$1$', '$\frac{13}{6}$']
    correta: B
    espaco: 22
    resolucao: |
      $m = -\tfrac{2}{3}$: o ângulo agudo com o eixo $x$ tem tangente $\tfrac{2}{3}$. Com o eixo $y$, o ângulo é o complementar, de tangente $\tfrac{3}{2}$.
    resposta: 'B'

  - estilo: Unesp
    texto: |
      Para o ângulo entre $y = 2x$ e $y = -3x + 1$, um aluno calculou $\frac{2 - (-3)}{1 + 2 \cdot (-3)} = -1$ e escreveu: “como a tangente é negativa, o ângulo é $135°$ e as retas não formam ângulo agudo”.
    enunciado: ''
    itens:
    - 'Calcule o ângulo agudo entre as retas.'
    - 'Explique a relação entre $45°$ e $135°$ nesse cruzamento.'
    - 'Calcule as inclinações aproximadas das duas retas (use $\operatorname{tg} 63{,}4° \approx 2$ e $\operatorname{tg} 71{,}6° \approx 3$) e confira o resultado.'
    espaco: 62
    resolucao: |
      a) Com o módulo: $\operatorname{tg} \theta = 1$, $\theta = 45°$.
      b) Duas retas concorrentes formam quatro ângulos: dois de $45°$ e dois de $135°$, suplementares. O aluno achou o obtuso; o agudo sempre existe (a não ser que as retas sejam perpendiculares).
      c) $y = 2x$: cerca de $63{,}4°$. $y = -3x + 1$: cerca de $180° - 71{,}6° = 108{,}4°$. Diferença: $45°$.
    resposta: 'a) $45°$; b) e c) Ver resolução'

  - estilo: Fuvest
    enunciado: 'Os pontos $A(0, 0)$ e $B(4, 0)$ são dados. Pelas extremidades, traçam-se, acima do eixo $x$, retas que formam $60°$ com $AB$.'
    itens:
    - 'Escreva as equações das duas retas.'
    - 'Determine o ponto $C$ em que elas se cortam e mostre que $ABC$ é equilátero.'
    - 'Calcule a área do triângulo $ABC$.'
    espaco: 62
    resolucao: |
      a) Por $A$: $y = \sqrt{3}\,x$ (inclinação $60°$). Por $B$: $y = -\sqrt{3}(x - 4)$ (inclinação $120°$).
      b) $\sqrt{3}\,x = -\sqrt{3}\,x + 4\sqrt{3}$: $x = 2$, $C(2, 2\sqrt{3})$. Os ângulos em $A$ e $B$ medem $60°$, e o terceiro também: equilátero (lados 4).
      c) Base 4 e altura $2\sqrt{3}$: $4\sqrt{3}$.
    resposta: 'a) $y = \sqrt{3}\,x$ e $y = -\sqrt{3}(x - 4)$; b) $C(2, 2\sqrt{3})$; c) $4\sqrt{3}$'
