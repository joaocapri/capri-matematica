# Fonte das listas em PDF da aula A32 — Função Exponencial
aula: A32

fixacao:
  intro: Resolva na ordem — do aquecimento ao desafio. Em $f(x)=a^x$, a base é positiva e diferente de $1$; com $a>1$ a função cresce, com $0<a<1$ decresce.
  secoes:
    - nome: Aquecimento
      questoes:
        - enunciado: Dada $f(x)=2^x$, calcule $f(0)$, $f(3)$, $f(-2)$ e $f\!\left(\tfrac12\right)$.
          resolucao: |
            $f(0)=1$; \ $f(3)=8$; \ $f(-2)=\tfrac1{2^2}=\tfrac14$; \ $f\!\left(\tfrac12\right)=\sqrt2$.
          resposta: '$1$; \ $8$; \ $\tfrac14$; \ $\sqrt2$'

        - enunciado: Quais leis definem uma função exponencial?
          itens:
            - $f(x)=3^x$
            - $f(x)=\left(\tfrac12\right)^x$
            - $f(x)=1^x$
            - $f(x)=(-2)^x$
            - $f(x)=x^2$
          resolucao: |
            A base deve ser positiva e diferente de $1$, e a variável fica no expoente.
            (a) Sim. (b) Sim. (c) Não: é a constante $1$. (d) Não: base negativa ($(-2)^{1/2}$ não é real). (e) Não: é quadrática.
          resposta: '(a) sim \quad (b) sim \quad (c) não \quad (d) não \quad (e) não'

        - enunciado: Classifique cada função como crescente ou decrescente.
          itens:
            - $f(x)=5^x$
            - $f(x)=(0{,}3)^x$
            - $f(x)=(\sqrt2)^x$
            - $f(x)=\left(\tfrac23\right)^x$
          resolucao: |
            Base maior que $1$: crescente; entre $0$ e $1$: decrescente.
            (a) Cresc. (b) Decresc. (c) Cresc. ($\sqrt2\approx1{,}41$). (d) Decresc.
          resposta: '(a) cresc. \quad (b) decresc. \quad (c) cresc. \quad (d) decresc.'

        - enunciado: Dê o domínio e a imagem de $f(x)=3^x$.
          resolucao: |
            O expoente pode ser qualquer real; já $3^x$ é sempre positivo e nunca vale zero.
          resposta: '$D=\mathbb{R}$; \ $Im=\,]0,\,+\infty[$'

        - enunciado: Para $f(x)=2^x+1$, determine $f(0)$, a imagem e a assíntota horizontal do gráfico.
          resolucao: |
            $f(0)=1+1=2$. Como $2^x>0$, temos $f(x)>1$: $Im=\,]1,+\infty[$.
            O gráfico se aproxima da reta $y=1$ sem tocá-la.
          resposta: '$f(0)=2$; \ $Im=\,]1,+\infty[$; \ assíntota $y=1$'

        - enunciado: Complete com $>$ ou $<$.
          itens:
            - $2^{0{,}5}\ \_\_\ 2^{0{,}7}$
            - $\left(\tfrac13\right)^2\ \_\_\ \left(\tfrac13\right)^5$
          resolucao: |
            (a) Base $>1$: maior expoente, maior valor. $2^{0{,}5}<2^{0{,}7}$.
            (b) Base entre $0$ e $1$: maior expoente, menor valor. $\left(\tfrac13\right)^2>\left(\tfrac13\right)^5$.
          resposta: '(a) $<$ \quad (b) $>$'

        - enunciado: A função $f(x)=a\cdot b^x$ satisfaz $f(0)=3$ e $f(1)=6$. Determine $a$, $b$ e $f(4)$.
          resolucao: |
            $f(0)=a=3$ e $f(1)=3b=6\Rightarrow b=2$. Então $f(4)=3\cdot16=48$.
          resposta: '$a=3$, $b=2$; \ $f(4)=48$'

    - nome: Treino
      questoes:
        - enunciado: Uma cultura tem $N(t)=500\cdot2^t$ bactérias após $t$ horas.
          itens:
            - Quantas bactérias haverá após $5$ horas?
            - Em quanto tempo a população chega a $8\,000$?
          resolucao: |
            (a) $500\cdot32=16\,000$.
            (b) $500\cdot2^t=8000\Rightarrow 2^t=16\Rightarrow t=4$ h.
          resposta: '(a) $16\,000$ \quad (b) $4$ h'

        - enunciado: O gráfico de $f(x)=k\cdot3^x$ passa pelo ponto $(2,\,18)$. Determine $k$ e $f(0)$.
          resolucao: |
            $9k=18\Rightarrow k=2$. Então $f(0)=2$.
          resposta: '$k=2$; \ $f(0)=2$'

        - enunciado: Um carro de R\$\,50\,000{,}00 perde $20\%$ do valor por ano, ou seja, $V(t)=50\,000\cdot0{,}8^t$. Quanto valerá após $2$ anos?
          resolucao: |
            $50\,000\cdot0{,}64=32\,000$.
          resposta: 'R\$\,32\,000{,}00'

        - enunciado: Para $f(x)=2^{x-1}+3$, calcule $f(1)$ e $f(0)$ e determine a imagem.
          resolucao: |
            $f(1)=2^0+3=4$; \ $f(0)=\tfrac12+3=3{,}5$. Como $2^{x-1}>0$: $f(x)>3$.
          resposta: '$4$; \ $3{,}5$; \ $Im=\,]3,+\infty[$'

        - enunciado: Para quais valores de $a$ a função $f(x)=(a-2)^x$ é exponencial decrescente?
          resolucao: |
            É preciso $0<a-2<1\Rightarrow 2<a<3$.
          resposta: '$2<a<3$'

        - enunciado: 'Compare o crescimento linear e o exponencial: calcule $L(n)=3+2n$ e $E(n)=3\cdot2^n$ para $n=1,3,5$.'
          resolucao: |
            $L$: $5$, $9$, $13$ (soma $2$ a cada passo). \ $E$: $6$, $24$, $96$ (dobra a cada passo).
          resposta: '$L$: $5,9,13$; \ $E$: $6,24,96$'

        - enunciado: Um capital de R\$\,1\,000{,}00 rende juros compostos de $10\%$ ao ano, ou seja, $M(t)=1000\cdot1{,}1^t$. Qual é o montante após $3$ anos?
          resolucao: |
            $1{,}1^3=1{,}331$. Montante: R\$\,1\,331{,}00.
          resposta: 'R\$\,1\,331{,}00'

        - enunciado: Uma amostra radioativa de $80$ g tem meia-vida de $5$ anos. Que massa resta após $20$ anos?
          resolucao: |
            $20$ anos são $4$ meias-vidas: $80\cdot\left(\tfrac12\right)^4=5$ g.
          resposta: '$5$ g'

    - nome: Desafio
      questoes:
        - enunciado: Uma função $f(x)=a\cdot b^x$, com $b>0$, satisfaz $f(1)=6$ e $f(3)=54$. Determine $a$, $b$ e $f(0)$.
          resolucao: |
            $\dfrac{f(3)}{f(1)}=b^2=9\Rightarrow b=3$. Então $3a=6\Rightarrow a=2$, e $f(0)=2$.
          resposta: '$a=2$, \ $b=3$; \ $f(0)=2$'

        - enunciado: Uma cultura de $200$ bactérias dobra a cada $3$ horas. Em quanto tempo chega a $6\,400$?
          resolucao: |
            $200\cdot2^{t/3}=6400\Rightarrow 2^{t/3}=32=2^5\Rightarrow t=15$ h.
          resposta: '$15$ h'

        - enunciado: Para $f(x)=5\cdot3^x$, mostre que $\dfrac{f(x+1)}{f(x)}$ é constante e calcule esse valor.
          resolucao: |
            $\dfrac{5\cdot3^{x+1}}{5\cdot3^x}=3$. Na exponencial, cada passo de $1$ em $x$ multiplica o valor pela base.
          resposta: '$3$'

        - enunciado: Determine a imagem de $f(x)=3-2^x$.
          resolucao: |
            $2^x>0\Rightarrow -2^x<0\Rightarrow 3-2^x<3$, e $2^x$ assume todos os valores positivos.
          resposta: '$Im=\,]-\infty,\,3[$'

        - enunciado: Sendo $f(x)=2^x$, mostre que $f(a+b)=f(a)\cdot f(b)$ e calcule $f(3)\cdot f(-3)$.
          resolucao: |
            $2^{a+b}=2^a\cdot2^b$. \ $f(3)\cdot f(-3)=f(0)=1$ (de fato, $8\cdot\tfrac18=1$).
          resposta: '$f(3)\cdot f(-3)=1$'

vestibular:
  intro: Questões autorais no estilo dos principais vestibulares. Assinale uma única alternativa.
  questoes:
    - enunciado: Se $f(x)=3^x$, então $f(2)+f(-1)$ vale
      opcoes: ['$\dfrac{17}3$', '$\dfrac{26}3$', '$\dfrac{28}3$', '$9$', '$6$']
      correta: C
      resolucao: |
        $9+\tfrac13=\tfrac{28}3$.

    - enunciado: Das funções abaixo, a única exponencial decrescente é
      opcoes: ['$f(x)=2^x$', '$f(x)=(0{,}5)^x$', '$f(x)=(\sqrt3)^x$', '$f(x)=\left(\tfrac32\right)^x$', '$f(x)=1^x$']
      correta: B
      resolucao: |
        Base entre $0$ e $1$. A alternativa E é constante (e não é exponencial).

    - enunciado: A imagem da função $f(x)=2^x-3$ é
      opcoes: ['$\mathbb{R}$', '$]0,\,+\infty[$', '$]3,\,+\infty[$', '$]-3,\,+\infty[$', '$[-3,\,+\infty[$']
      correta: D
      resolucao: |
        $2^x>0\Rightarrow 2^x-3>-3$; o valor $-3$ nunca é atingido.

    - enunciado: Uma cultura começa com $300$ bactérias e a população dobra a cada hora. Após $6$ horas, haverá
      opcoes: ['$1\,800$', '$3\,600$', '$9\,600$', '$19\,200$', '$38\,400$']
      correta: D
      resolucao: |
        $300\cdot2^6=300\cdot64=19\,200$.

    - enunciado: A função $f(x)=a\cdot2^x$ satisfaz $f(3)=40$. O valor de $f(0)$ é
      opcoes: ['$5$', '$8$', '$10$', '$20$', '$40$']
      correta: A
      resolucao: |
        $8a=40\Rightarrow a=5=f(0)$.

    - enunciado: Um equipamento de R\$\,20\,000{,}00 desvaloriza $10\%$ ao ano, a cada ano sobre o valor do ano anterior. Após $2$ anos, valerá
      opcoes: ['R\$\,16\,000{,}00', 'R\$\,16\,200{,}00', 'R\$\,18\,000{,}00', 'R\$\,18\,200{,}00', 'R\$\,19\,800{,}00']
      correta: B
      resolucao: |
        $20\,000\cdot0{,}9^2=16\,200$. (A alternativa A seria a perda linear de R\$\,2\,000 por ano.)

    - enunciado: A assíntota horizontal do gráfico de $y=5^x+2$ é a reta
      opcoes: ['$y=0$', '$y=5$', '$x=2$', '$y=-2$', '$y=2$']
      correta: E
      resolucao: |
        $5^x\to0$ quando $x\to-\infty$, então $y\to2$, sem atingir esse valor.

    - enunciado: A função $f(x)=(m-1)^x$ é exponencial crescente se, e somente se,
      opcoes: ['$m>1$', '$m>0$', '$m>2$', '$1<m<2$', '$m\neq2$']
      correta: C
      resolucao: |
        É preciso base maior que $1$: $m-1>1\Rightarrow m>2$.

    - enunciado: Um medicamento tem meia-vida de $8$ dias. De uma dose de $64$ mg, após $24$ dias restarão
      opcoes: ['$4$ mg', '$8$ mg', '$16$ mg', '$21{,}3$ mg', '$32$ mg']
      correta: B
      resolucao: |
        São $3$ meias-vidas: $64\cdot\left(\tfrac12\right)^3=8$ mg.

    - enunciado: O gráfico de $f(x)=a\cdot b^x$, com $b>0$, passa por $(0,\,4)$ e $(2,\,36)$. O valor de $f(1)$ é
      opcoes: ['$12$', '$16$', '$18$', '$20$', '$24$']
      correta: A
      resolucao: |
        $a=4$ e $4b^2=36\Rightarrow b=3$. Então $f(1)=12$.

    - enunciado: 'Sendo $a=2^{1/2}$, $b=4^{1/3}$ e $c=8^{1/5}$, a ordem correta é'
      opcoes: ['$a<b<c$', '$b<c<a$', '$c<a<b$', '$a<c<b$', '$c<b<a$']
      correta: D
      resolucao: |
        Na base $2$: expoentes $\tfrac12=0{,}5$, $\tfrac23\approx0{,}67$ e $\tfrac35=0{,}6$. Como $2^x$ é crescente: $a<c<b$.

    - enunciado: Um capital de R\$\,2\,000{,}00 é aplicado a juros compostos de $10\%$ ao ano. Após $2$ anos, o montante é
      opcoes: ['R\$\,2\,200{,}00', 'R\$\,2\,400{,}00', 'R\$\,2\,420{,}00', 'R\$\,2\,440{,}00', 'R\$\,4\,000{,}00']
      correta: C
      resolucao: |
        $2000\cdot1{,}1^2=2000\cdot1{,}21=2420$. (A alternativa B são juros simples.)

    - enunciado: Para toda base $a$, com $a>0$ e $a\neq1$, o gráfico de $f(x)=a^x$ passa pelo ponto
      opcoes: ['$(1,\,0)$', '$(0,\,0)$', '$(a,\,1)$', '$(1,\,1)$', '$(0,\,1)$']
      correta: E
      resolucao: |
        $a^0=1$ para toda base: o gráfico corta o eixo $y$ em $(0,1)$.

    - enunciado: Se $f(x)=2^x$, então $\dfrac{f(x+3)}{f(x)}$ vale
      opcoes: ['$3$', '$6$', '$2^x$', '$8$', '$2^{x+3}$']
      correta: D
      resolucao: |
        $\dfrac{2^{x+3}}{2^x}=2^3=8$.

    - enunciado: Uma cidade de $10\,000$ habitantes cresce $2\%$ ao ano, sempre sobre a população do ano anterior. Após $2$ anos, terá
      opcoes: ['$10\,200$ hab.', '$10\,400$ hab.', '$10\,404$ hab.', '$10\,440$ hab.', '$12\,000$ hab.']
      correta: C
      resolucao: |
        $10\,000\cdot1{,}02^2=10\,000\cdot1{,}0404=10\,404$.

    - enunciado: O gráfico de $y=3^x+k$ passa pelo ponto $(1,\,5)$. O valor de $k$ é
      opcoes: ['$2$', '$3$', '$4$', '$5$', '$8$']
      correta: A
      resolucao: |
        $3+k=5\Rightarrow k=2$.

    - enunciado: Sobre a função $f(x)=\left(\tfrac12\right)^x$, é correto afirmar que
      opcoes: ['é crescente e sua imagem é $\mathbb{R}$', 'é decrescente e sua imagem é $]0,\,+\infty[$', 'tem um zero em $x=0$', 'é decrescente e sua imagem é $\mathbb{R}$', 'passa pelo ponto $(1,\,2)$']
      correta: B
      resolucao: |
        Base entre $0$ e $1$: decrescente; os valores são sempre positivos. Ela passa por $(0,1)$ e por $\left(1,\tfrac12\right)$.

    - enunciado: Uma cultura de $100$ bactérias triplica a cada $2$ horas. Após $6$ horas, haverá
      opcoes: ['$600$', '$900$', '$1\,800$', '$8\,100$', '$2\,700$']
      correta: E
      resolucao: |
        Em $6$ h a população triplica $3$ vezes: $100\cdot3^3=2700$.

    - enunciado: Uma função $f(x)=k\cdot a^x$, com $a>0$, satisfaz $f(0)=5$ e $f(2)=20$. O valor de $f(3)$ é
      opcoes: ['$25$', '$30$', '$35$', '$40$', '$80$']
      correta: D
      resolucao: |
        $k=5$ e $5a^2=20\Rightarrow a=2$. Então $f(3)=5\cdot8=40$.

    - enunciado: O menor número natural $n$ para o qual $2^n>10n$ é
      opcoes: ['$4$', '$5$', '$6$', '$7$', '$10$']
      correta: C
      resolucao: |
        $n=5$: $32<50$. \ $n=6$: $64>60$. A partir daí, a exponencial nunca mais perde para a reta.
