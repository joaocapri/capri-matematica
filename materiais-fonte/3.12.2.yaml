# Aula 3.12.2 — Números complexos: plano de Argand-Gauss e módulo
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: afixo (a, b) de z = a + bi; quadrantes e eixos; módulo |z| = √(a² + b²); conjugado como reflexão no eixo real;
# distância entre afixos |z − w|; lugares geométricos simples (|z − z₀| = r, |z − z₁| = |z − z₂|, coroas); |z·w| = |z||w|, |z|² = z·z̄;
# argumento (cos θ = a/|z|, sen θ = b/|z|, em graus de 0° a 360°) de complexos com ângulos notáveis. A forma trigonométrica fica para a 3.12.3.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Complete o quadro com o afixo de cada número e a posição dele no plano de Argand-Gauss.'
      tabela:
        cabecalho: ['$z$', 'Afixo', 'Posição']
        linhas:
        - ['$3 + 2i$', '${{(3, 2)}}$', '{{1º quadrante}}']
        - ['$-4 + i$', '${{(-4, 1)}}$', '{{2º quadrante}}']
        - ['$-2 - 5i$', '${{(-2, -5)}}$', '{{3º quadrante}}']
        - ['$6i$', '${{(0, 6)}}$', '{{eixo imaginário}}']
      resolucao: |
        O afixo de $a + bi$ é o ponto $(a, b)$: a parte real no eixo horizontal e a imaginária no vertical. Em $6i$, $a = 0$: o ponto fica no eixo imaginário.
      resposta: '$(3, 2)$, 1º; $(-4, 1)$, 2º; $(-2, -5)$, 3º; $(0, 6)$, eixo imaginário'
    - enunciado: 'Escreva o número complexo que corresponde a cada ponto da figura.'
      figura:
        tikz: |
          \begin{scope}[scale=.55]
          \draw[step=1, gray!25, very thin] (-4,-3) grid (5,4);
          \draw[-latex, ink!60] (-4.4,0) -- (5.5,0) node[right, font=\scriptsize] {Re};
          \draw[-latex, ink!60] (0,-3.4) -- (0,4.5) node[above, font=\scriptsize] {Im};
          \fill[roxo] (2,3) circle (3pt) node[above right, font=\scriptsize] {$A$};
          \fill[roxo] (-3,1) circle (3pt) node[above left, font=\scriptsize] {$B$};
          \fill[roxo] (-1,-2) circle (3pt) node[below left, font=\scriptsize] {$C$};
          \fill[roxo] (4,0) circle (3pt) node[below, font=\scriptsize] {$D$};
          \end{scope}
      itens:
      - '$A$: {{2 + 3i}}'
      - '$B$: {{-3 + i}}'
      - '$C$: {{-1 - 2i}}'
      - '$D$: {{4}}'
      colunas: 2
      resolucao: |
        $A = (2, 3)$, $B = (-3, 1)$, $C = (-1, -2)$, $D = (4, 0)$.
      resposta: '$2 + 3i$; $-3 + i$; $-1 - 2i$; $4$'
    - enunciado: 'Calcule o módulo de cada número, completando.'
      itens:
      - '$|6 + 8i| = {{10}}$'
      - '$|-8 - 15i| = {{17}}$'
      - '$|1 + i| = {{\sqrt{2}}}$'
      - '$|-7i| = {{7}}$'
      - '$|2 - 3i| = {{\sqrt{13}}}$'
      - '$|-9| = {{9}}$'
      colunas: 2
      resolucao: |
        $|a + bi| = \sqrt{a^2 + b^2}$: $\sqrt{100}$; $\sqrt{64 + 225} = \sqrt{289}$; $\sqrt{2}$; $\sqrt{49}$; $\sqrt{13}$; $\sqrt{81}$.
      resposta: '$10$; $17$; $\sqrt{2}$; $7$; $\sqrt{13}$; $9$'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Para todo complexo $z$, $|z| \geq 0$.'
      - '$|3 + 4i| = 7$.'
      - 'Para todo complexo $z$, $|\bar z| = |z|$.'
      - 'O módulo de $z = -5$ é $-5$.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) É uma distância. (F) $\sqrt{9 + 16} = 5$. (V) $\sqrt{a^2 + (-b)^2} = \sqrt{a^2 + b^2}$. (F) $|-5| = 5$.
      resposta: V, F, V, F
    - enunciado: 'Calcule a distância entre os afixos de cada par de números.'
      itens:
      - '$1 + 2i$ e $4 + 6i$'
      - '$-2 + i$ e $3 - 11i$'
      espaco_item: 10
      resolucao: |
        A distância é $|z - w|$. (a) $|3 + 4i| = 5$. (b) $|5 - 12i| = 13$.
      resposta: '(a) $5$ (b) $13$'
    - enunciado: 'Para $z = 3 + 2i$, escreva $\bar z$ e $-z$ e descreva a posição dos afixos de $\bar z$ e de $-z$ em relação ao afixo de $z$.'
      espaco: 12
      resolucao: |
        $\bar z = 3 - 2i$: simétrico de $z$ em relação ao eixo real. $-z = -3 - 2i$: simétrico de $z$ em relação à origem.
      resposta: '$\bar z = 3 - 2i$ (eixo real); $-z = -3 - 2i$ (origem)'
    - enunciado: 'Determine $a > 0$ para que $|a + 3i| = 5$.'
      espaco: 10
      resolucao: |
        $a^2 + 9 = 25$, $a^2 = 16$, $a = 4$.
      resposta: '$a = 4$'
  - nome: Nível 2
    questoes:
    - texto: |
        Para calcular $|-6 + 8i|$, Lia escreveu $\sqrt{-6^2 + 8^2} = \sqrt{-36 + 64} = \sqrt{28}$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 10
      resolucao: |
        $-6^2$ vale $-36$; o certo é $(-6)^2 = 36$. $|-6 + 8i| = \sqrt{36 + 64} = 10$.
      resposta: '$10$'
    - enunciado: 'Considere $z = 3 + 4i$ e $w = -4 + 3i$. Mostre que $|z| = |w|$, que o triângulo de vértices na origem e nos afixos de $z$ e $w$ é retângulo na origem, e calcule a sua área.'
      espaco: 16
      resolucao: |
        $|z| = |w| = 5$. Os segmentos da origem a $(3, 4)$ e a $(-4, 3)$ têm coeficientes angulares $\tfrac{4}{3}$ e $-\tfrac{3}{4}$: perpendiculares. Área $\tfrac{5 \cdot 5}{2} = 12{,}5$.
      resposta: 'área $12{,}5$'
    - enunciado: 'Descreva o lugar geométrico dos afixos de $z$ em cada caso.'
      itens:
      - '$|z| = 3$'
      - '$|z - 2i| = 1$'
      espaco_item: 10
      resolucao: |
        (a) Pontos a distância 3 da origem: circunferência de centro $(0, 0)$ e raio 3.
        (b) Pontos a distância 1 do afixo de $2i$: circunferência de centro $(0, 2)$ e raio 1.
      resposta: '(a) circunferência de centro $(0, 0)$, raio 3 (b) circunferência de centro $(0, 2)$, raio 1'
    - enunciado: 'Para $z = 2 - 5i$, calcule $z \cdot \bar z$ e compare com $|z|^2$.'
      espaco: 10
      resolucao: |
        $(2 - 5i)(2 + 5i) = 4 - 25i^2 = 29$ e $|z|^2 = 4 + 25 = 29$. Sempre vale $z \cdot \bar z = |z|^2$.
      resposta: '$29 = 29$'
    - enunciado: 'Determine os valores reais de $k$ para os quais $|k + (k + 1)i| = 5$.'
      espaco: 12
      resolucao: |
        $k^2 + (k + 1)^2 = 25$: $2k^2 + 2k - 24 = 0$, $k^2 + k - 12 = 0$, $k = 3$ ou $k = -4$.
      resposta: '$k = 3$ ou $k = -4$'
    - enunciado: 'Complete o quadro.'
      tabela:
        cabecalho: ['$z$', '$|z|$', '$\bar z$']
        linhas:
        - ['$1 - i$', '${{\sqrt{2}}}$', '${{1 + i}}$']
        - ['$-3$', '${{3}}$', '${{-3}}$']
        - ['$2i$', '${{2}}$', '${{-2i}}$']
        - ['$-1 + 2\sqrt{2}\,i$', '${{3}}$', '${{-1 - 2\sqrt{2}\,i}}$']
      resolucao: |
        $\sqrt{1 + 1}$; $3$; $2$; $\sqrt{1 + 8} = 3$. O conjugado troca o sinal da parte imaginária.
      resposta: '$\sqrt{2}$, $1 + i$; $3$, $-3$; $2$, $-2i$; $3$, $-1 - 2\sqrt{2}\,i$'
    - enunciado: 'Para $z = 1 + 2i$ e $w = 2 - i$, calcule $z \cdot w$, $|z \cdot w|$ e $|z| \cdot |w|$.'
      espaco: 12
      resolucao: |
        $z \cdot w = 2 - i + 4i - 2i^2 = 4 + 3i$, $|zw| = 5$. $|z| \cdot |w| = \sqrt{5} \cdot \sqrt{5} = 5$. Vale sempre $|zw| = |z||w|$.
      resposta: '$4 + 3i$; $5$; $5$'
    - enunciado: 'Complete o quadro com o módulo e o argumento $\theta$ de cada número, com $0° \leq \theta < 360°$. Lembre: $\cos\theta = \frac{a}{|z|}$ e $\operatorname{sen}\theta = \frac{b}{|z|}$.'
      tabela:
        cabecalho: ['$z$', '$|z|$', '$\theta$']
        linhas:
        - ['$1 + i$', '${{\sqrt{2}}}$', '${{45°}}$']
        - ['$-1 + \sqrt{3}\,i$', '${{2}}$', '${{120°}}$']
        - ['$-3$', '${{3}}$', '${{180°}}$']
        - ['$-2i$', '${{2}}$', '${{270°}}$']
      resolucao: |
        $1 + i$: $\cos\theta = \operatorname{sen}\theta = \tfrac{\sqrt{2}}{2}$, $\theta = 45°$. $-1 + \sqrt{3}\,i$: $\cos\theta = -\tfrac{1}{2}$, $\operatorname{sen}\theta = \tfrac{\sqrt{3}}{2}$, $\theta = 120°$.
        $-3$ está no semieixo real negativo ($180°$); $-2i$, no semieixo imaginário negativo ($270°$).
      resposta: '$\sqrt{2}$, $45°$; $2$, $120°$; $3$, $180°$; $2$, $270°$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Determine os complexos $z$ tais que $|z| = 5$ e $\operatorname{Re}(z) = 3$.'
      espaco: 10
      resolucao: |
        $9 + b^2 = 25$, $b = \pm 4$: $z = 3 + 4i$ ou $z = 3 - 4i$.
      resposta: '$3 \pm 4i$'
    - enunciado: 'Determine os complexos $z$ tais que $|z| = |z - 4|$ e $|z| = \sqrt{13}$.'
      espaco: 14
      resolucao: |
        $|z| = |z - 4|$: o afixo está a igual distância de $(0, 0)$ e $(4, 0)$, ou seja, na reta $x = 2$. Com $4 + b^2 = 13$: $b = \pm 3$. $z = 2 \pm 3i$.
      resposta: '$2 \pm 3i$'
    - enunciado: 'Descreva a região dos afixos de $z$ tais que $1 \leq |z| \leq 3$ e calcule a sua área.'
      espaco: 12
      resolucao: |
        Coroa circular entre as circunferências de centro na origem e raios 1 e 3. Área $9\pi - \pi = 8\pi$.
      resposta: 'coroa circular; $8\pi$'
    - enunciado: 'Determine o módulo e o argumento de $z = \sqrt{3} - i$ e de $\bar z$. Que relação há entre os argumentos?'
      espaco: 14
      resolucao: |
        $|z| = 2$, $\cos\theta = \tfrac{\sqrt{3}}{2}$ e $\operatorname{sen}\theta = -\tfrac{1}{2}$: $\theta = 330°$. $\bar z = \sqrt{3} + i$: $|\bar z| = 2$ e argumento $30°$.
        Os afixos são simétricos em relação ao eixo real, então os argumentos somam $360°$ (para $z$ fora do eixo real).
      resposta: '$2$ e $330°$; $2$ e $30°$; somam $360°$'
    - enunciado: 'Entre os complexos $z$ com $\operatorname{Re}(z) + \operatorname{Im}(z) = 4$, determine o de menor módulo.'
      espaco: 14
      resolucao: |
        Os afixos estão na reta $x + y = 4$. O mais próximo da origem é o pé da perpendicular por $(0, 0)$, sobre $y = x$: $(2, 2)$. $z = 2 + 2i$, $|z| = 2\sqrt{2}$ (confere com a distância $\tfrac{4}{\sqrt{2}}$).
      resposta: '$z = 2 + 2i$'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Num jogo de caça ao tesouro, o mapa de um parque foi desenhado sobre o plano de Argand-Gauss, com a praça central na origem e cada unidade valendo 100 m. A pista final diz que o tesouro está no afixo do número $3 - 4i$. Os jogadores, que estão na praça, querem saber a distância em linha reta até o tesouro.
    figura:
      tikz: |
        \begin{scope}[scale=.5]
        \draw[step=1, gray!25, very thin] (-2,-5) grid (5,2);
        \draw[-latex, ink!60] (-2.4,0) -- (5.6,0) node[right, font=\scriptsize] {Re};
        \draw[-latex, ink!60] (0,-5.4) -- (0,2.5) node[above, font=\scriptsize] {Im};
        \fill[ink] (0,0) circle (4pt) node[above left, font=\scriptsize] {praça};
        \fill[roxo] (3,-4) circle (4pt) node[right, font=\scriptsize] {tesouro};
        \draw[roxo, dashed, line width=.9pt] (0,0) -- (3,-4);
        \end{scope}
    enunciado: |
      A distância da praça ao tesouro é
    opcoes: ['100 m.', '700 m.', '500 m.', '300 m.', '400 m.']
    correta: C
    resolucao: |
      $|3 - 4i| = \sqrt{9 + 16} = 5$ unidades, ou seja, 500 m. (700 m vem de somar $3 + 4$.)

  - estilo: Fuvest
    enunciado: |
      O módulo do número complexo $-8 + 6i$ é
    opcoes: ['$10$', '$14$', '$2$', '$\sqrt{28}$', '$100$']
    correta: A
    resolucao: |
      $\sqrt{64 + 36} = 10$.

  - estilo: Unicamp
    enunciado: |
      No plano de Argand-Gauss, o afixo de $z = -3 - 2i$ está no
    opcoes: ['1º quadrante.', '2º quadrante.', '3º quadrante.', '4º quadrante.']
    correta: C
    resolucao: |
      O afixo é $(-3, -2)$: as duas coordenadas são negativas.

  - estilo: UEM
    enunciado: |
      Considere o número complexo $z = 3 - 4i$. Assinale o que for correto.
    proposicoes:
    - 'O afixo de $z$ é o ponto $(3, -4)$.'
    - 'O afixo de $z$ está no 4º quadrante.'
    - '$|z| = 5$.'
    - '$\bar z = -3 + 4i$.'
    - '$|\bar z| = 5$.'
    corretas: [1, 2, 3, 5]
    resolucao: |
      01) Correta. 02) Correta: $x > 0$ e $y < 0$. 04) $\sqrt{9 + 16}$. 08) Incorreta: $\bar z = 3 + 4i$. 16) Correta.
      Soma: $01 + 02 + 04 + 16 = 23$.

  - estilo: Enem
    texto: |
      Quatro drones sobrevoam uma fazenda, e as suas posições são registradas como números complexos, com a base de controle na origem e unidades em quilômetros. O sinal do controle enfraquece com a distância, e o técnico precisa trazer de volta o drone que está mais longe da base. O quadro mostra as posições registradas.
    tabela:
      cabecalho: ['Drone', 'Posição']
      linhas:
      - ['1', '$6 + 2i$']
      - ['2', '$-5 + 4i$']
      - ['3', '$-6 - 3i$']
      - ['4', '$1 - 7i$']
    enunciado: |
      O drone mais distante da base é o
    opcoes: ['drone 1.', 'drone 2.', 'drone 3.', 'drone 4.', 'drone 2, empatado com o drone 3.']
    correta: D
    resolucao: |
      $|z|^2$: $40$, $41$, $45$ e $50$. O mais distante é o drone 4, a $\sqrt{50} \approx 7{,}1$ km. Somar $|a| + |b|$ daria um empate falso entre 2 e 3.

  - estilo: UEL
    enunciado: |
      Considere $z$ e $w$ números complexos. Considere as afirmativas a seguir.
    afirmativas:
    - '$|z| = 0$ se, e somente se, $z = 0$.'
    - '$|\bar z| = |z|$.'
    - '$|z + w| = |z| + |w|$, para quaisquer $z$ e $w$.'
    - 'Os afixos de $z$ e de $\bar z$ são simétricos em relação ao eixo real.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'I, II e IV, apenas.', 'II e III, apenas.', 'III e IV, apenas.', 'I, II, III e IV.']
    correta: B
    resolucao: |
      I. $a^2 + b^2 = 0$ só para $a = b = 0$. II. Correta. III. Incorreta: com $z = 1$ e $w = -1$, $|z + w| = 0 \neq 2$. IV. Correta.

  - estilo: Unesp
    enunciado: |
      O argumento do número complexo $z = -1 + i$, entre $0°$ e $360°$, é
    opcoes: ['$45°$', '$225°$', '$315°$', '$90°$', '$135°$']
    correta: E
    resolucao: |
      $|z| = \sqrt{2}$, $\cos\theta = -\tfrac{\sqrt{2}}{2}$ e $\operatorname{sen}\theta = \tfrac{\sqrt{2}}{2}$: 2º quadrante, $\theta = 135°$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      A figura mostra o triângulo cujos vértices são os afixos de $z_1 = 1 + i$, $z_2 = 5 + i$ e $z_3 = 5 + 4i$.
    figura:
      tikz: |
        \begin{scope}[scale=.55]
        \draw[step=1, gray!25, very thin] (-1,-1) grid (6,5);
        \draw[-latex, ink!60] (-1.4,0) -- (6.5,0) node[right, font=\scriptsize] {Re};
        \draw[-latex, ink!60] (0,-1.4) -- (0,5.5) node[above, font=\scriptsize] {Im};
        \draw[roxo, line width=1.1pt, fill=roxo!12] (1,1) -- (5,1) -- (5,4) -- cycle;
        \node[below left, font=\scriptsize] at (1,1) {$z_1$};
        \node[below right, font=\scriptsize] at (5,1) {$z_2$};
        \node[above right, font=\scriptsize] at (5,4) {$z_3$};
        \end{scope}
    enunciado: |
      O perímetro desse triângulo é
    opcoes: ['$12$.', '$7$.', '$10$.', '$15$.']
    correta: A
    resolucao: |
      $|z_2 - z_1| = |4| = 4$, $|z_3 - z_2| = |3i| = 3$, $|z_3 - z_1| = |4 + 3i| = 5$. Perímetro 12.

  - estilo: Fuvest
    enunciado: |
      No plano de Argand-Gauss, o conjunto dos afixos de $z$ tais que $|z - 3 + 2i| = 4$ é
    opcoes: ['a circunferência de centro $(-3, 2)$ e raio 4.', 'a circunferência de centro $(3, -2)$ e raio 4.', 'a circunferência de centro $(3, -2)$ e raio 16.', 'uma reta que passa por $(3, -2)$.', 'a circunferência de centro na origem e raio 4.']
    correta: B
    resolucao: |
      $|z - (3 - 2i)| = 4$: pontos a distância 4 do afixo de $3 - 2i$, que é $(3, -2)$.

  - estilo: UFSC
    enunciado: |
      Considere $z = 1 + i$ e $w = 2 - 2i$. Assinale o que for correto.
    proposicoes:
    - '$|z| = \sqrt{2}$.'
    - '$|w| = 2\sqrt{2}$.'
    - '$|z \cdot w| = 4$.'
    - '$|z + w| = |z| + |w|$.'
    - 'Os segmentos que ligam a origem aos afixos de $z$ e de $w$ são perpendiculares.'
    - 'A distância entre os afixos de $z$ e de $w$ é $\sqrt{10}$.'
    corretas: [1, 2, 3, 5, 6]
    resolucao: |
      01) $\sqrt{2}$. 02) $\sqrt{8}$. 04) $zw = 2 - 2i + 2i - 2i^2 = 4$. 08) Incorreta: $z + w = 3 - i$, $|z + w| = \sqrt{10} \approx 3{,}2$, e $|z| + |w| = 3\sqrt{2} \approx 4{,}2$.
      16) Coeficientes angulares $1$ e $-1$. 32) $|z - w| = |-1 + 3i| = \sqrt{10}$.
      Soma: $01 + 02 + 04 + 16 + 32 = 55$.

  - estilo: Enem
    texto: |
      Em circuitos de corrente alternada, a impedância de um aparelho é um número complexo $Z = R + Xj$, em ohms, em que $j$ faz o papel de $i$. A intensidade da corrente, em ampères, é o quociente entre a tensão, em volts, e o módulo da impedância, em ohms. Um aparelho com impedância $Z = 30 + 40j$ foi ligado numa tomada de 220 V.
    enunciado: |
      A intensidade da corrente nesse aparelho é
    opcoes: ['3,1 A.', '2,2 A.', '5,5 A.', '7,3 A.', '4,4 A.']
    correta: E
    resolucao: |
      $|Z| = \sqrt{900 + 1600} = 50$ ohms. Corrente $\tfrac{220}{50} = 4{,}4$ A. (3,1 A vem de usar $30 + 40 = 70$.)

  - estilo: UFPR
    enunciado: |
      Considere $z = a + bi$, com $a$ e $b$ reais. Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'Se $|z| = 1$ e $a = 0$, então $z = i$ ou $z = -i$.'
    - '$|z| = |a| + |b|$ para quaisquer $a$ e $b$.'
    - '$|2z| = 2|z|$.'
    - '$|z|^2 = z^2$ para todo $z$.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – V – F.', 'F – F – V – F.', 'V – F – F – V.', 'V – F – V – F.', 'V – F – V – V.']
    correta: D
    resolucao: |
      (V) $b^2 = 1$. (F) $|3 + 4i| = 5 \neq 7$. (V) $\sqrt{4a^2 + 4b^2} = 2\sqrt{a^2 + b^2}$. (F) Com $z = i$: $|z|^2 = 1$ e $z^2 = -1$.

  - estilo: Enem
    texto: |
      Um designer desenhou o logotipo de uma empresa sobre o plano de Argand-Gauss: um quadrado cujos vértices são os afixos de $0$, $3 + i$, $2 + 4i$ e $-1 + 3i$, como na figura, com medidas em centímetros. Para calcular a quantidade de tinta, ele precisa da área do quadrado.
    figura:
      tikz: |
        \begin{scope}[scale=.55]
        \draw[step=1, gray!25, very thin] (-2,-1) grid (4,5);
        \draw[-latex, ink!60] (-2.4,0) -- (4.5,0) node[right, font=\scriptsize] {Re};
        \draw[-latex, ink!60] (0,-1.4) -- (0,5.5) node[above, font=\scriptsize] {Im};
        \draw[roxo, line width=1.1pt, fill=roxo!15] (0,0) -- (3,1) -- (2,4) -- (-1,3) -- cycle;
        \end{scope}
    enunciado: |
      A área do quadrado, em centímetros quadrados, é
    opcoes: ['$9$', '$10$', '$16$', '$12$', '$\sqrt{10}$']
    correta: B
    resolucao: |
      O lado vai de $0$ a $3 + i$: $|3 + i| = \sqrt{10}$. Área $(\sqrt{10})^2 = 10$.

  - estilo: Fuvest
    enunciado: |
      O número de complexos $z$ com $|z| = 5$ cujas partes real e imaginária são números inteiros é
    opcoes: ['$4$', '$8$', '$10$', '$12$', '$16$']
    correta: D
    resolucao: |
      $a^2 + b^2 = 25$ com inteiros: $(\pm 5, 0)$, $(0, \pm 5)$, $(\pm 3, \pm 4)$, $(\pm 4, \pm 3)$. São $4 + 4 + 4 = 12$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Considere lugares geométricos no plano de Argand-Gauss. Assinale o que for correto.
    proposicoes:
    - 'Os afixos de $z$ com $|z| = 2$ formam a circunferência de centro na origem e raio 2.'
    - 'Os afixos de $z$ com $|z - i| = |z + i|$ formam o eixo imaginário.'
    - 'Os afixos de $z$ com $|z| \leq 1$ formam um círculo de área $\pi$.'
    - 'A circunferência $|z - 3| = 3$ passa pela origem.'
    - 'A circunferência $|z - 1 - i| = 1$ é tangente aos dois eixos.'
    corretas: [1, 3, 4, 5]
    resolucao: |
      01) Correta. 02) Incorreta: os pontos equidistantes de $(0, 1)$ e $(0, -1)$ formam a mediatriz desse segmento, que é o eixo real. 04) Correta.
      08) Correta: centro $(3, 0)$ e raio 3. 16) Correta: centro $(1, 1)$ e raio 1.
      Soma: $01 + 04 + 08 + 16 = 29$.

  - estilo: Fuvest
    enunciado: |
      O número complexo de módulo 4 e argumento $60°$ é
    opcoes: ['$2\sqrt{3} + 2i$', '$4 + 4\sqrt{3}\,i$', '$2 + 2\sqrt{3}\,i$', '$-2 + 2\sqrt{3}\,i$', '$2 + 4i$']
    correta: C
    resolucao: |
      $a = |z|\cos 60° = 4 \cdot \tfrac{1}{2} = 2$ e $b = |z|\operatorname{sen} 60° = 4 \cdot \tfrac{\sqrt{3}}{2} = 2\sqrt{3}$. ($2\sqrt{3} + 2i$ tem argumento $30°$.)

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Uma antena de internet foi instalada no afixo de $2 + i$, num mapa feito sobre o plano de Argand-Gauss com unidades em quilômetros. Ela atende todos os pontos a até 3 km de distância. O quadro mostra as posições de quatro bairros no mesmo mapa.
    tabela:
      cabecalho: ['Bairro', 'Posição']
      linhas:
      - ['Jardim', '$4 + 3i$']
      - ['Centro', '$-1 + 4i$']
      - ['Vila', '$5 - i$']
      - ['Lago', '$2 - 2i$']
    enunciado: |
      Os bairros atendidos pela antena são
    opcoes: ['apenas o Jardim.', 'Jardim e Centro.', 'Centro e Vila.', 'Vila e Lago.', 'Jardim e Lago.']
    correta: E
    resolucao: |
      Distâncias $|z - (2 + i)|$: Jardim $|2 + 2i| = 2\sqrt{2} \approx 2{,}8$; Centro $|-3 + 3i| \approx 4{,}2$; Vila $|3 - 2i| \approx 3{,}6$; Lago $|-3i| = 3$. Atendidos: Jardim e Lago.

  - estilo: Unicamp
    enunciado: |
      A região atendida pela antena é formada pelos afixos dos complexos $z$ tais que
    opcoes: ['$|z - (2 + i)| \leq 3$.', '$|z| \leq 3$.', '$|z - (2 + i)| = 3$.', '$|z + (2 + i)| \leq 3$.']
    correta: A
    resolucao: |
      Distância até o afixo de $2 + i$ no máximo 3: círculo (com o interior) de centro $(2, 1)$ e raio 3.

  - estilo: Unesp
    enunciado: |
      A área da região do plano de Argand-Gauss formada pelos afixos de $z$ tais que $2 \leq |z| \leq 4$ é
    opcoes: ['$4\pi$', '$16\pi$', '$12\pi$', '$2\pi$', '$20\pi$']
    correta: C
    resolucao: |
      Coroa circular: $16\pi - 4\pi = 12\pi$.

  - estilo: Fuvest
    enunciado: |
      Se $|z - (3 + 4i)| = 2$, o maior valor possível de $|z|$ é
    opcoes: ['$5$', '$7$', '$2$', '$9$', '$\sqrt{29}$']
    correta: B
    resolucao: |
      O afixo de $z$ está na circunferência de centro $(3, 4)$, a 5 da origem, e raio 2. O ponto mais distante da origem fica na reta que passa pela origem e pelo centro: $5 + 2 = 7$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere $z = 3 + 4i$ e $w = -4 + 3i$.'
    itens:
    - 'Calcule $|z|$, $|w|$ e $|z - w|$.'
    - 'Mostre que os afixos de $0$, $z$ e $w$ formam um triângulo retângulo isósceles.'
    - 'Determine o quarto vértice do quadrado que tem a origem, $z$ e $w$ como três vértices consecutivos ($w$, $0$, $z$) e calcule a sua distância à origem.'
    espaco: 62
    resolucao: |
      a) $|z| = |w| = 5$. $|z - w| = |7 + i| = \sqrt{50} = 5\sqrt{2}$.
      b) Lados 5, 5 e $5\sqrt{2}$: $25 + 25 = 50$, retângulo na origem (Pitágoras) e isósceles.
      c) O quarto vértice é $z + w = -1 + 7i$ (o paralelogramo de lados $0z$ e $0w$ é aqui um quadrado). Distância $|-1 + 7i| = \sqrt{50} = 5\sqrt{2}$, a diagonal.
    resposta: 'a) $5$, $5$, $5\sqrt{2}$; c) $-1 + 7i$; $5\sqrt{2}$'

  - estilo: Unicamp
    texto: |
      Duas antenas estão nos afixos de $2i$ e de $6$, num mapa sobre o plano de Argand-Gauss. Cada ponto do mapa é atendido pela antena mais próxima.
    enunciado: ''
    itens:
    - 'Explique por que os pontos a igual distância das duas antenas são os afixos de $z$ tais que $|z - 2i| = |z - 6|$ e que figura eles formam.'
    - 'Escrevendo $z = x + yi$, obtenha a equação dessa figura.'
    - 'Qual antena atende a origem? E o afixo de $5 + 5i$?'
    espaco: 62
    resolucao: |
      a) $|z - 2i|$ e $|z - 6|$ são as distâncias às antenas; os pontos equidistantes formam a mediatriz do segmento que liga $(0, 2)$ a $(6, 0)$, uma reta.
      b) $x^2 + (y - 2)^2 = (x - 6)^2 + y^2$: $-4y + 4 = -12x + 36$, ou $3x - y = 8$.
      c) Origem: distâncias 2 e 6, a antena em $2i$. Para $5 + 5i$: $|5 + 3i| = \sqrt{34}$ e $|-1 + 5i| = \sqrt{26}$: a antena em $6$.
    resposta: 'b) $3x - y = 8$; c) origem: antena em $2i$; $5 + 5i$: antena em $6$'

  - estilo: ITA
    enunciado: |
      O número de complexos $z$ tais que $|z - 1| = |z - i| = |z + 1|$ é
    opcoes: ['zero', 'exatamente um', 'exatamente dois', 'exatamente três', 'infinito']
    correta: B
    espaco: 22
    resolucao: |
      O afixo deve estar a igual distância de $(1, 0)$, $(0, 1)$ e $(-1, 0)$: é o centro da circunferência que passa por esses três pontos não alinhados, único. Das duas primeiras igualdades: $y = x$ e $x = 0$, logo $z = 0$.
    resposta: 'B'

  - estilo: Unesp
    enunciado: 'Considere a região $R$ formada pelos afixos de $z$ tais que $1 \leq |z - 2| \leq 3$ e $\operatorname{Im}(z) \geq 0$.'
    itens:
    - 'Descreva a região $R$ e faça um esboço.'
    - 'Calcule a área de $R$.'
    - 'Determine o maior valor de $|z|$ para $z$ em $R$ e o complexo em que ele ocorre. A origem pertence a $R$?'
    espaco: 62
    resolucao: |
      a) Metade superior da coroa circular de centro $(2, 0)$ entre os raios 1 e 3.
      b) $\tfrac{9\pi - \pi}{2} = 4\pi$.
      c) O ponto mais distante da origem fica no eixo real, do lado oposto: $z = 5$, $|z| = 5$. A origem pertence a $R$: $|0 - 2| = 2$, entre 1 e 3, e $\operatorname{Im}(0) = 0$.
    resposta: 'b) $4\pi$; c) $|z| = 5$ em $z = 5$; sim'

  - estilo: UFSC
    enunciado: |
      Considere $z$ e $w$ números complexos quaisquer. Assinale o que for correto.
    proposicoes:
    - '$|z \cdot w| = |z| \cdot |w|$.'
    - '$|z + w| \leq |z| + |w|$.'
    - '$|z|^2 = z \cdot \bar z$.'
    - '$|z - w|$ é a distância entre os afixos de $z$ e de $w$.'
    - '$|z + w| = |z| + |w|$.'
    - 'Se $|z| = |w|$, então $z = w$.'
    corretas: [1, 2, 3, 4]
    espaco: 22
    resolucao: |
      01) a 08) Corretas. 16) Incorreta: $|1 + (-1)| = 0 \neq 2$. 32) Incorreta: $|1| = |i|$, com $1 \neq i$.
    resposta: 'Soma 15 (01 + 02 + 04 + 08)'

  - estilo: Fuvest
    enunciado: 'Considere os complexos $z$ tais que $|z - 2| = |z - 4i|$.'
    itens:
    - 'Escrevendo $z = x + yi$, mostre que os afixos estão na reta $x - 2y + 3 = 0$.'
    - 'Determine, entre esses complexos, o de menor módulo.'
    - 'Calcule esse módulo mínimo.'
    espaco: 62
    resolucao: |
      a) $(x - 2)^2 + y^2 = x^2 + (y - 4)^2$: $-4x + 4 = -8y + 16$, ou $x - 2y + 3 = 0$.
      b) É o pé da perpendicular pela origem, na reta $y = -2x$: $x - 2(-2x) + 3 = 0$, $x = -\tfrac{3}{5}$, $y = \tfrac{6}{5}$. $z = -\tfrac{3}{5} + \tfrac{6}{5}i$.
      c) $\sqrt{\tfrac{9}{25} + \tfrac{36}{25}} = \tfrac{3}{\sqrt{5}} = \tfrac{3\sqrt{5}}{5}$, que é a distância da origem à reta.
    resposta: 'b) $-\frac{3}{5} + \frac{6}{5}i$; c) $\frac{3\sqrt{5}}{5}$'

  - estilo: Unicamp
    texto: |
      Dois aparelhos estão ligados em série, e a impedância total é a soma das impedâncias: $Z = Z_1 + Z_2$. As impedâncias, em ohms, são $Z_1 = 3 + 4j$ e $Z_2 = 5 - 2j$, em que $j$ faz o papel de $i$.
    enunciado: ''
    itens:
    - 'Calcule $|Z_1|$ e $|Z_2|$.'
    - 'Calcule $Z$ e $|Z|$ e compare com $|Z_1| + |Z_2|$.'
    - 'Explique, pelo plano de Argand-Gauss, por que sempre $|Z_1 + Z_2| \leq |Z_1| + |Z_2|$.'
    espaco: 62
    resolucao: |
      a) $|Z_1| = 5$ e $|Z_2| = \sqrt{29} \approx 5{,}39$.
      b) $Z = 8 + 2j$, $|Z| = \sqrt{68} = 2\sqrt{17} \approx 8{,}25$, menor que $5 + \sqrt{29} \approx 10{,}39$.
      c) Os afixos de $0$, $Z_1$ e $Z_1 + Z_2$ formam um triângulo de lados $|Z_1|$, $|Z_2|$ e $|Z_1 + Z_2|$ (o lado de $Z_1$ a $Z_1 + Z_2$ mede $|Z_2|$). Num triângulo, um lado é menor que a soma dos outros dois; a igualdade só ocorre com os pontos alinhados.
    resposta: 'a) $5$ e $\sqrt{29}$; b) $8 + 2j$; $2\sqrt{17}$'

  - estilo: Fuvest
    enunciado: |
      A área do polígono cujos vértices são os afixos das raízes complexas de $x^4 - 16 = 0$ é
    opcoes: ['$4$', '$8$', '$16$', '$2\sqrt{2}$', '$4\sqrt{2}$']
    correta: B
    espaco: 22
    resolucao: |
      As raízes são $\pm 2$ e $\pm 2i$: um quadrado de diagonais 4. Área $\tfrac{4 \cdot 4}{2} = 8$.
    resposta: 'B'

  - estilo: Unesp
    enunciado: 'Determine os complexos $z$ tais que $|z| = \sqrt{5}$ e $|z - 3| = \sqrt{2}$.'
    itens:
    - 'Escreva as duas condições em termos de $z = a + bi$ e resolva o sistema.'
    - 'Interprete geometricamente o problema.'
    - 'Calcule a distância entre os afixos das soluções.'
    espaco: 62
    resolucao: |
      a) $a^2 + b^2 = 5$ e $(a - 3)^2 + b^2 = 2$. Subtraindo: $6a - 9 = 3$, $a = 2$, $b = \pm 1$. $z = 2 \pm i$.
      b) São os pontos comuns das circunferências de centro $(0, 0)$ e raio $\sqrt{5}$ e de centro $(3, 0)$ e raio $\sqrt{2}$.
      c) $|(2 + i) - (2 - i)| = |2i| = 2$.
    resposta: 'a) $2 \pm i$; c) $2$'

  - estilo: Fuvest
    enunciado: 'Considere $z = -\sqrt{3} + i$.'
    itens:
    - 'Calcule $|z|$ e o argumento de $z$, entre $0°$ e $360°$.'
    - 'Determine os argumentos de $\bar z$ e de $-z$ e explique a relação deles com o argumento de $z$ pelo plano de Argand-Gauss.'
    - 'Calcule $i \cdot z$, o seu módulo e o seu argumento. Que efeito a multiplicação por $i$ teve sobre o afixo?'
    espaco: 62
    resolucao: |
      a) $|z| = \sqrt{3 + 1} = 2$; $\cos\theta = -\tfrac{\sqrt{3}}{2}$ e $\operatorname{sen}\theta = \tfrac{1}{2}$: $\theta = 150°$.
      b) $\bar z = -\sqrt{3} - i$: $210° = 360° - 150°$ (reflexão no eixo real). $-z = \sqrt{3} - i$: $330° = 150° + 180°$ (simetria em relação à origem).
      c) $iz = -\sqrt{3}\,i + i^2 = -1 - \sqrt{3}\,i$: módulo 2 e argumento $240° = 150° + 90°$. O afixo girou $90°$ em torno da origem, no sentido anti-horário, sem mudar a distância à origem.
    resposta: 'a) $2$ e $150°$; b) $210°$ e $330°$; c) $-1 - \sqrt{3}\,i$, módulo 2, argumento $240°$'
