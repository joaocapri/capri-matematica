# Fonte das listas em PDF da aula 1.13.1 — Conjuntos numéricos
aula: '1.13.1'

fixacao:
  intro: Resolva na ordem — do fácil ao difícil. Lembre-se de que, neste material, $0\in\mathbb{N}$.
  secoes:
    - nome: Aquecimento
      questoes:
        - enunciado: 'Indique o menor conjunto numérico ($\mathbb{N}$, $\mathbb{Z}$, $\mathbb{Q}$ ou $\mathbb{R}-\mathbb{Q}$) ao qual cada número pertence.'
          itens:
            - $-7$
            - $\tfrac34$
            - $\sqrt9$
            - $\sqrt5$
            - $0{,}333\ldots$
            - $\pi$
          resolucao: |
            (a) $\mathbb{Z}$: inteiro negativo. (b) $\mathbb{Q}$: fração de inteiros. (c) $\sqrt9=3\in\mathbb{N}$.
            (d) $5$ não é quadrado perfeito: irracional. (e) Dízima periódica, igual a $\tfrac13$: $\mathbb{Q}$. (f) Irracional.
          resposta: '(a) $\mathbb{Z}$ \quad (b) $\mathbb{Q}$ \quad (c) $\mathbb{N}$ \quad (d) $\mathbb{R}-\mathbb{Q}$ \quad (e) $\mathbb{Q}$ \quad (f) $\mathbb{R}-\mathbb{Q}$'

        - enunciado: Classifique em V ou F.
          itens:
            - $\mathbb{N}\subset\mathbb{Z}$
            - Todo número inteiro é racional.
            - $\sqrt2\in\mathbb{Q}$
            - $0\in\mathbb{N}$
            - $-3\in\mathbb{N}$
          resolucao: |
            (a) V. (b) V: todo inteiro $k$ pode ser escrito como $\tfrac{k}{1}$.
            (c) F: $\sqrt2$ é irracional. (d) V. (e) F: os naturais não têm negativos.
          resposta: '(a) V \quad (b) V \quad (c) F \quad (d) V \quad (e) F'

        - enunciado: Escreva cada decimal exato como fração irredutível.
          itens:
            - $0{,}25$
            - $1{,}2$
            - $-0{,}75$
          resolucao: |
            (a) $\tfrac{25}{100}=\tfrac14$. (b) $\tfrac{12}{10}=\tfrac65$. (c) $-\tfrac{75}{100}=-\tfrac34$.
          resposta: '(a) $\tfrac14$ \quad (b) $\tfrac65$ \quad (c) $-\tfrac34$'

        - enunciado: Determine a fração geratriz de cada dízima periódica.
          itens:
            - $0{,}444\ldots$
            - $0{,}3636\ldots$
            - $1{,}555\ldots$
          resolucao: |
            (a) Período $4$, com um algarismo: $\tfrac49$.
            (b) Período $36$, com dois algarismos: $\tfrac{36}{99}=\tfrac4{11}$.
            (c) $1+\tfrac59=\tfrac{14}9$.
          resposta: '(a) $\tfrac49$ \quad (b) $\tfrac4{11}$ \quad (c) $\tfrac{14}9$'

        - enunciado: 'Coloque em ordem crescente: $0{,}4$; \ $-\tfrac12$; \ $\tfrac13$; \ $-0{,}6$; \ $\tfrac32$.'
          resolucao: |
            Em decimal: $0{,}4$; $-0{,}5$; $0{,}333\ldots$; $-0{,}6$; $1{,}5$.
            Ordem: $-0{,}6<-\tfrac12<\tfrac13<0{,}4<\tfrac32$.
          resposta: '$-0{,}6<-\tfrac12<\tfrac13<0{,}4<\tfrac32$'

        - enunciado: Dê um exemplo de
          itens:
            - um número racional que não seja inteiro;
            - um número irracional entre $1$ e $2$;
            - um número inteiro que não seja natural.
          resolucao: |
            Há muitas respostas. Exemplos:
            (a) $\tfrac12$. (b) $\sqrt2\approx1{,}41$ (ou $\sqrt3$). (c) $-1$.
          resposta: 'exemplos: (a) $\tfrac12$ \quad (b) $\sqrt2$ \quad (c) $-1$'

        - enunciado: Calcule e diga se o resultado é racional ou irracional.
          itens:
            - $\sqrt2\cdot\sqrt8$
            - $\sqrt3+\sqrt3$
            - $(\sqrt5)^2$
          resolucao: |
            (a) $\sqrt{16}=4$: racional. (b) $2\sqrt3$: irracional. (c) $5$: racional.
          resposta: '(a) $4$, racional \quad (b) $2\sqrt3$, irracional \quad (c) $5$, racional'

    - nome: Treino
      questoes:
        - enunciado: Determine a fração geratriz.
          itens:
            - $0{,}1222\ldots$
            - $2{,}04545\ldots$
          resolucao: |
            (a) Dízima composta: $\tfrac{12-1}{90}=\tfrac{11}{90}$.
            (b) $0{,}04545\ldots=\tfrac{045-0}{990}=\tfrac{45}{990}=\tfrac1{22}$, então o número é $2+\tfrac1{22}=\tfrac{45}{22}$.
          resposta: '(a) $\tfrac{11}{90}$ \quad (b) $\tfrac{45}{22}$'

        - enunciado: Usando frações geratrizes, mostre que $0{,}999\ldots=1$.
          resolucao: |
            Período $9$, com um algarismo: $0{,}999\ldots=\tfrac99=1$.
            Outra forma: $\tfrac13=0{,}333\ldots$; multiplicando por $3$, $1=0{,}999\ldots$.
          resposta: '$\tfrac99=1$'

        - enunciado: 'Calcule e dê o resultado como fração irredutível: $0{,}5+\tfrac23-0{,}1$.'
          resolucao: |
            $\tfrac12+\tfrac23-\tfrac1{10}=\tfrac{15}{30}+\tfrac{20}{30}-\tfrac3{30}=\tfrac{32}{30}=\tfrac{16}{15}$.
          resposta: '$\tfrac{16}{15}$'

        - enunciado: 'Calcule $\left(0{,}222\ldots+\tfrac13\right)\cdot\tfrac95$.'
          resolucao: |
            $0{,}222\ldots=\tfrac29$ e $\tfrac13=\tfrac39$. Soma: $\tfrac59$. Então $\tfrac59\cdot\tfrac95=1$.
          resposta: '$1$'

        - enunciado: Quantos números inteiros estão entre $-\sqrt{10}$ e $\sqrt{20}$?
          resolucao: |
            $3<\sqrt{10}<4$, logo $-4<-\sqrt{10}<-3$. E $4<\sqrt{20}<5$.
            Inteiros: $-3,-2,-1,0,1,2,3,4$, ou seja, $8$ números.
          resposta: '$8$'

        - enunciado: 'Encontre dois números racionais entre $\tfrac25$ e $\tfrac35$.'
          resolucao: |
            Use frações equivalentes: $\tfrac25=\tfrac8{20}$ e $\tfrac35=\tfrac{12}{20}$.
            Entre elas, por exemplo, $\tfrac9{20}$ e $\tfrac{10}{20}=\tfrac12$. Há infinitas outras possibilidades.
          resposta: 'por exemplo, $\tfrac9{20}$ e $\tfrac12$'

        - enunciado: A soma de dois números irracionais é sempre irracional? E o produto? Justifique com exemplos.
          resolucao: |
            Não, em nenhum dos casos.
            Soma: $\sqrt2+(-\sqrt2)=0$. Produto: $\sqrt2\cdot\sqrt2=2$. Ambos os resultados são racionais.
          resposta: 'nenhum dos dois é sempre irracional'

        - enunciado: 'Qual é maior: $\tfrac79$ ou $0{,}77$? Justifique.'
          resolucao: |
            $\tfrac79=0{,}777\ldots$. Comparando com $0{,}770$: no terceiro algarismo decimal, $7>0$.
            Logo, $\tfrac79>0{,}77$.
          resposta: '$\tfrac79$'

    - nome: Desafio
      questoes:
        - enunciado: Determine a fração geratriz de $0{,}20101\ldots$ (o grupo $01$ se repete).
          resolucao: |
            Parte não periódica: $2$; período: $01$.
            $\dfrac{201-2}{990}=\dfrac{199}{990}$.
          resposta: '$\tfrac{199}{990}$'

        - enunciado: Sendo $x=0{,}1777\ldots$ e $y=0{,}0333\ldots$, calcule $\dfrac xy$.
          resolucao: |
            $x=\tfrac{17-1}{90}=\tfrac{16}{90}=\tfrac8{45}$ e $y=\tfrac3{90}=\tfrac1{30}$.
            $\dfrac xy=\dfrac8{45}\cdot30=\dfrac{240}{45}=\dfrac{16}3$.
          resposta: '$\tfrac{16}3$'

        - enunciado: Qual é o menor número natural $n\ge1$ para o qual $\sqrt{12n}$ é um número natural?
          resolucao: |
            $12n=2^2\cdot3\cdot n$. Para ser quadrado perfeito, o fator $3$ precisa de expoente par: $n=3$.
            Então $\sqrt{36}=6$.
          resposta: '$n=3$'

        - enunciado: Para quantos números naturais $n$, com $1\le n\le100$, o número $\sqrt n$ é racional?
          resolucao: |
            $\sqrt n$ é racional exatamente quando $n$ é quadrado perfeito: $1,4,9,\ldots,100$.
            São $10$ números.
          resposta: '$10$'

        - enunciado: Sendo $a=0{,}5$ e $b=0{,}4545\ldots$, escreva $a+b$ como fração irredutível.
          resolucao: |
            $a=\tfrac12$ e $b=\tfrac{45}{99}=\tfrac5{11}$.
            $a+b=\tfrac{11}{22}+\tfrac{10}{22}=\tfrac{21}{22}$.
          resposta: '$\tfrac{21}{22}$'

vestibular:
  intro: Questões autorais no estilo dos principais vestibulares. Assinale uma única alternativa.
  questoes:
    - enunciado: A fração geratriz da dízima $0{,}2727\ldots$ é
      opcoes: ['$\dfrac{3}{11}$', '$\dfrac{27}{100}$', '$\dfrac{27}{90}$', '$\dfrac{2}{7}$', '$\dfrac{27}{10}$']
      correta: A
      resolucao: |
        Período $27$, com dois algarismos: $\tfrac{27}{99}=\tfrac3{11}$.

    - enunciado: É irracional o número
      opcoes: ['$\sqrt{16}$', '$0{,}1212\ldots$', '$\sqrt{12}$', '$-\dfrac53$', '$\sqrt[3]{8}$']
      correta: C
      resolucao: |
        $12$ não é quadrado perfeito, então $\sqrt{12}=2\sqrt3$ é irracional. Os demais valem $4$, $\tfrac{12}{99}$, $-\tfrac53$ e $2$.

    - enunciado: A afirmação verdadeira é
      opcoes: ['$\mathbb{Q}\subset\mathbb{Z}$', '$\mathbb{R}-\mathbb{Q}\subset\mathbb{R}$', '$\mathbb{Z}\subset\mathbb{N}$', '$\sqrt4$ é irracional', '$0\notin\mathbb{Z}$']
      correta: B
      resolucao: |
        Os irracionais são parte dos reais. As outras invertem inclusões ($\tfrac12\notin\mathbb{Z}$, $-1\notin\mathbb{N}$) ou erram ($\sqrt4=2$; $0\in\mathbb{Z}$).

    - enunciado: O valor de $0{,}999\ldots+0{,}444\ldots$ é
      opcoes: ['$1$', '$\dfrac{11}9$', '$\dfrac54$', '$\dfrac43$', '$\dfrac{13}9$']
      correta: E
      resolucao: |
        $0{,}999\ldots=1$ e $0{,}444\ldots=\tfrac49$. Soma: $\tfrac{13}9$.

    - enunciado: A quantidade de números inteiros compreendidos entre $-2{,}5$ e $\sqrt{30}$ é
      opcoes: ['$5$', '$6$', '$7$', '$8$', '$9$']
      correta: D
      resolucao: |
        $5<\sqrt{30}<6$. Inteiros de $-2$ a $5$: $8$ números.

    - enunciado: Ao dividir $1$ por $7$ na calculadora, um aluno obteve $0{,}142857142857\ldots$ Sobre esse número, é correto afirmar que
      opcoes: ['é irracional, pois sua representação decimal não termina', 'é racional, uma dízima periódica de período $142857$', 'é inteiro', 'é irracional, pois tem muitos algarismos', 'não pode ser representado na reta real']
      correta: B
      resolucao: |
        Todo quociente de inteiros (com divisor não nulo) é racional: ou termina, ou é dízima periódica. Aqui o período é $142857$.

    - enunciado: O valor de $(\sqrt3-1)(\sqrt3+1)$ é
      opcoes: ['$2$', '$3$', '$2\sqrt3$', '$4$', '$4+2\sqrt3$']
      correta: A
      resolucao: |
        Produto da soma pela diferença: $(\sqrt3)^2-1^2=3-1=2$.

    - enunciado: 'Considere os números $a=\sqrt{0{,}09}$, $b=\sqrt{0{,}9}$, $c=0{,}333\ldots$ e $d=\tfrac\pi2$. São racionais'
      opcoes: ['apenas $a$', 'apenas $c$', '$a$, $b$ e $c$', '$a$ e $c$', '$b$ e $d$']
      correta: D
      resolucao: |
        $a=0{,}3$ e $c=\tfrac13$ são racionais. Já $b=\sqrt{\tfrac9{10}}=\tfrac3{\sqrt{10}}$ e $d$ são irracionais.

    - enunciado: O valor de $\dfrac{0{,}1666\ldots}{0{,}333\ldots}$ é
      opcoes: ['$\dfrac16$', '$\dfrac15$', '$\dfrac12$', '$2$', '$5$']
      correta: C
      resolucao: |
        $0{,}1666\ldots=\tfrac{16-1}{90}=\tfrac16$ e $0{,}333\ldots=\tfrac13$. Quociente: $\tfrac16\cdot3=\tfrac12$.

    - enunciado: A fração geratriz de $2{,}1555\ldots$ é
      opcoes: ['$\dfrac{194}{99}$', '$\dfrac{21}{10}$', '$\dfrac{211}{99}$', '$\dfrac{107}{50}$', '$\dfrac{97}{45}$']
      correta: E
      resolucao: |
        $0{,}1555\ldots=\tfrac{15-1}{90}=\tfrac7{45}$. Então $2+\tfrac7{45}=\tfrac{97}{45}$.

    - enunciado: 'Sendo $a=0{,}7$, $b=\tfrac79$, $c=\sqrt{0{,}5}$ e $d=0{,}77$, a ordem correta é'
      opcoes: ['$a<c<d<b$', '$a<d<c<b$', '$c<a<d<b$', '$a<c<b<d$', '$b<d<c<a$']
      correta: A
      resolucao: |
        $c=\sqrt{0{,}5}\approx0{,}707$ e $b=0{,}777\ldots$ Então $0{,}7<0{,}707<0{,}77<0{,}777\ldots$

    - enunciado: O valor de $\dfrac13+\dfrac16+\dfrac19$ é
      opcoes: ['$\dfrac16$', '$\dfrac12$', '$\dfrac{11}{18}$', '$\dfrac23$', '$\dfrac56$']
      correta: C
      resolucao: |
        Com denominador $18$: $\tfrac6{18}+\tfrac3{18}+\tfrac2{18}=\tfrac{11}{18}$.

    - enunciado: Se $n$ é um número natural e $\sqrt n$ é racional, então necessariamente
      opcoes: ['$n$ é par', '$n$ é primo', '$n$ é ímpar', '$n<100$', '$n$ é um quadrado perfeito']
      correta: E
      resolucao: |
        A raiz quadrada de um natural ou é natural (quadrado perfeito) ou é irracional. Exemplos: $\sqrt{16}=4$, $\sqrt{15}\notin\mathbb{Q}$.

    - enunciado: É correto afirmar que
      opcoes: ['a soma de dois irracionais é sempre irracional', 'a soma de um racional com um irracional é irracional', 'o produto de dois irracionais é sempre irracional', 'o quociente de dois inteiros não nulos é sempre inteiro', 'todo número decimal exato é irracional']
      correta: B
      resolucao: |
        Se $r+i=q$ fosse racional, então $i=q-r$ seria racional, o que é absurdo. Contraexemplos para as outras: $\sqrt2+(-\sqrt2)=0$, $\sqrt2\cdot\sqrt2=2$ e $\tfrac12$.

    - enunciado: Uma receita pede $0{,}333\ldots$ de xícara de açúcar mascavo e $0{,}1666\ldots$ de xícara de açúcar refinado. A quantidade total de açúcar, em xícaras, é
      opcoes: ['$\dfrac16$', '$\dfrac14$', '$\dfrac13$', '$\dfrac12$', '$\dfrac23$']
      correta: D
      resolucao: |
        $\tfrac13+\tfrac16=\tfrac26+\tfrac16=\tfrac36=\tfrac12$.

    - enunciado: A quantidade de números naturais $n$, com $1\le n\le 50$, para os quais $\sqrt{2n}$ é natural é
      opcoes: ['$1$', '$2$', '$3$', '$4$', '$5$']
      correta: E
      resolucao: |
        $2n$ deve ser um quadrado par, de $2$ a $100$: $4,16,36,64,100$. Logo, $n\in\{2,8,18,32,50\}$: $5$ valores.

    - enunciado: A fração geratriz de $0{,}01515\ldots$ (o grupo $15$ se repete) é
      opcoes: ['$\dfrac{1}{66}$', '$\dfrac{1}{60}$', '$\dfrac{3}{200}$', '$\dfrac{1}{33}$', '$\dfrac{15}{99}$']
      correta: A
      resolucao: |
        $\dfrac{015-0}{990}=\dfrac{15}{990}=\dfrac1{66}$.

    - enunciado: O número $x=0{,}101001000100001\ldots$, em que cada algarismo $1$ é seguido de uma quantidade crescente de zeros, é
      opcoes: ['racional, com período $10$', 'racional, por ser um número decimal', 'irracional', 'inteiro', 'natural']
      correta: C
      resolucao: |
        A representação decimal não termina e nenhum bloco se repete periodicamente (os grupos de zeros crescem). Logo, $x$ é irracional.

    - enunciado: 'Entre as frações $\tfrac13$, $\tfrac14$, $\tfrac15$, $\tfrac16$ e $\tfrac19$, quantas têm representação decimal exata (finita)?'
      opcoes: ['$1$', '$2$', '$3$', '$4$', '$5$']
      correta: B
      resolucao: |
        Apenas $\tfrac14=0{,}25$ e $\tfrac15=0{,}2$: denominadores só com fatores $2$ e $5$. As demais geram dízimas.

    - enunciado: 'Se a dízima $0{,}abab\ldots$ (em que $a$ e $b$ são algarismos) é igual a $\tfrac4{11}$, então $a+b$ vale'
      opcoes: ['$5$', '$6$', '$7$', '$9$', '$11$']
      correta: D
      resolucao: |
        $\tfrac4{11}=\tfrac{36}{99}=0{,}3636\ldots$ Então $a=3$, $b=6$ e $a+b=9$.
