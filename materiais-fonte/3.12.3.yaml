# Aula 3.12.3 — Números complexos: forma trigonométrica
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: z = r(cos θ + i sen θ), com r = |z| > 0; conversão algébrica ↔ trigonométrica com ângulos notáveis;
# argumento principal (0 ≤ θ < 2π) e argumentos que diferem de 2kπ; quadrante; conjugado e oposto na forma trigonométrica.
# Produto, quociente e potências na forma trigonométrica ficam para a 3.12.4.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Complete o quadro com o módulo $r$ e o argumento principal $\theta$ ($0 \leq \theta < 2\pi$) de cada número.'
      tabela:
        cabecalho: ['$z$', '$r$', '$\theta$']
        linhas:
        - ['$\sqrt{3} + i$', '${{2}}$', '${{\frac{\pi}{6}}}$']
        - ['$-2 + 2i$', '${{2\sqrt{2}}}$', '${{\frac{3\pi}{4}}}$']
        - ['$-5$', '${{5}}$', '${{\pi}}$']
        - ['$4i$', '${{4}}$', '${{\frac{\pi}{2}}}$']
        - ['$1 - \sqrt{3}\,i$', '${{2}}$', '${{\frac{5\pi}{3}}}$']
      resolucao: |
        $\cos\theta = \tfrac{a}{r}$ e $\operatorname{sen}\theta = \tfrac{b}{r}$. Ex.: $-2 + 2i$ tem $r = \sqrt{8} = 2\sqrt{2}$, $\cos\theta = -\tfrac{\sqrt{2}}{2}$, $\operatorname{sen}\theta = \tfrac{\sqrt{2}}{2}$: 2º quadrante, $\tfrac{3\pi}{4}$.
        $1 - \sqrt{3}\,i$: $\cos\theta = \tfrac{1}{2}$, $\operatorname{sen}\theta = -\tfrac{\sqrt{3}}{2}$: 4º quadrante, $\tfrac{5\pi}{3}$.
      resposta: '$2, \frac{\pi}{6}$; $2\sqrt{2}, \frac{3\pi}{4}$; $5, \pi$; $4, \frac{\pi}{2}$; $2, \frac{5\pi}{3}$'
    - enunciado: 'Escreva cada número na forma algébrica, completando.'
      itens:
      - '$2\left(\cos\frac{\pi}{3} + i\operatorname{sen}\frac{\pi}{3}\right) = {{1 + \sqrt{3}\,i}}$'
      - '$4\left(\cos\frac{\pi}{2} + i\operatorname{sen}\frac{\pi}{2}\right) = {{4i}}$'
      - '$\sqrt{2}\left(\cos\frac{5\pi}{4} + i\operatorname{sen}\frac{5\pi}{4}\right) = {{-1 - i}}$'
      - '$6(\cos\pi + i\operatorname{sen}\pi) = {{-6}}$'
      resolucao: |
        Distribua $r$: $2\left(\tfrac{1}{2} + \tfrac{\sqrt{3}}{2}i\right)$; $4(0 + i)$; $\sqrt{2}\left(-\tfrac{\sqrt{2}}{2} - \tfrac{\sqrt{2}}{2}i\right)$; $6(-1 + 0i)$.
      resposta: '$1 + \sqrt{3}\,i$; $4i$; $-1 - i$; $-6$'
    - enunciado: 'Escreva na forma trigonométrica.'
      itens:
      - '$3 + 3i$'
      - '$-\sqrt{3} + i$'
      - '$-7i$'
      colunas: 3
      espaco_item: 12
      resolucao: |
        (a) $r = 3\sqrt{2}$, $\theta = \tfrac{\pi}{4}$: $3\sqrt{2}\left(\cos\tfrac{\pi}{4} + i\operatorname{sen}\tfrac{\pi}{4}\right)$.
        (b) $r = 2$, $\cos\theta = -\tfrac{\sqrt{3}}{2}$, $\operatorname{sen}\theta = \tfrac{1}{2}$: $2\left(\cos\tfrac{5\pi}{6} + i\operatorname{sen}\tfrac{5\pi}{6}\right)$.
        (c) $r = 7$, $\theta = \tfrac{3\pi}{2}$: $7\left(\cos\tfrac{3\pi}{2} + i\operatorname{sen}\tfrac{3\pi}{2}\right)$.
      resposta: '(a) $3\sqrt{2}$ e $\frac{\pi}{4}$ (b) $2$ e $\frac{5\pi}{6}$ (c) $7$ e $\frac{3\pi}{2}$'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - '$5(\cos 0 + i\operatorname{sen} 0) = 5$.'
      - 'O argumento principal de $-1$ é $\pi$.'
      - '$2\left(\cos\frac{\pi}{6} + i\operatorname{sen}\frac{\pi}{6}\right)$ e $2\left(\cos\frac{13\pi}{6} + i\operatorname{sen}\frac{13\pi}{6}\right)$ são o mesmo número.'
      - '$-2\left(\cos\frac{\pi}{4} + i\operatorname{sen}\frac{\pi}{4}\right)$ está escrito na forma trigonométrica.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) (V) (V) $\tfrac{13\pi}{6} = \tfrac{\pi}{6} + 2\pi$: argumentos que diferem de $2\pi$ dão o mesmo número. (F) Na forma trigonométrica, $r = |z| > 0$; esse número é $2\left(\cos\tfrac{5\pi}{4} + i\operatorname{sen}\tfrac{5\pi}{4}\right)$.
      resposta: V, V, V, F
    - enunciado: 'Complete o quadro com o argumento principal de cada número, em graus e em radianos.'
      tabela:
        cabecalho: ['$z$', 'Graus', 'Radianos']
        linhas:
        - ['$1 + \sqrt{3}\,i$', '${{60°}}$', '${{\frac{\pi}{3}}}$']
        - ['$-1 - i$', '${{225°}}$', '${{\frac{5\pi}{4}}}$']
        - ['$\sqrt{3} - i$', '${{330°}}$', '${{\frac{11\pi}{6}}}$']
      resolucao: |
        $180° = \pi$. 1º quadrante com $\cos\theta = \tfrac{1}{2}$; 3º quadrante a $45°$ do semieixo negativo; 4º quadrante a $30°$ do semieixo positivo.
      resposta: '$60°$, $\frac{\pi}{3}$; $225°$, $\frac{5\pi}{4}$; $330°$, $\frac{11\pi}{6}$'
    - enunciado: 'Em que quadrante (ou semieixo) fica o afixo de $z = r(\cos\theta + i\operatorname{sen}\theta)$, com $r > 0$, em cada caso?'
      itens:
      - '$\theta = \frac{2\pi}{3}$'
      - '$\theta = \frac{7\pi}{4}$'
      - '$\theta = \frac{3\pi}{2}$'
      colunas: 3
      espaco_item: 8
      resolucao: |
        (a) $120°$: 2º quadrante. (b) $315°$: 4º quadrante. (c) $270°$: semieixo imaginário negativo.
      resposta: '(a) 2º quadrante (b) 4º quadrante (c) semieixo imaginário negativo'
    - enunciado: 'Determine o argumento principal ($0 \leq \theta < 2\pi$) de $z = 2\left(\cos\frac{9\pi}{4} + i\operatorname{sen}\frac{9\pi}{4}\right)$ e de $w = 3\left(\cos\left(-\frac{\pi}{3}\right) + i\operatorname{sen}\left(-\frac{\pi}{3}\right)\right)$.'
      espaco: 12
      resolucao: |
        Some ou subtraia $2\pi$ até cair no intervalo: $\tfrac{9\pi}{4} - 2\pi = \tfrac{\pi}{4}$ e $-\tfrac{\pi}{3} + 2\pi = \tfrac{5\pi}{3}$.
      resposta: '$\frac{\pi}{4}$ e $\frac{5\pi}{3}$'
  - nome: Nível 2
    questoes:
    - texto: |
        Para achar o argumento de $z = -1 - \sqrt{3}\,i$, Rui calculou $\operatorname{tg}\theta = \frac{-\sqrt{3}}{-1} = \sqrt{3}$ e respondeu $\theta = \frac{\pi}{3}$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 12
      resolucao: |
        A tangente não distingue quadrantes opostos. Como $a < 0$ e $b < 0$, o afixo está no 3º quadrante: $\theta = \pi + \tfrac{\pi}{3} = \tfrac{4\pi}{3}$. (Confere: $\cos\theta = -\tfrac{1}{2}$ e $\operatorname{sen}\theta = -\tfrac{\sqrt{3}}{2}$, com $r = 2$.)
      resposta: '$\frac{4\pi}{3}$'
    - texto: |
        Para $z = -\sqrt{2} - \sqrt{2}\,i$, Tati escreveu $z = -2\left(\cos\frac{\pi}{4} + i\operatorname{sen}\frac{\pi}{4}\right)$.
      enunciado: 'A igualdade está certa? A expressão está na forma trigonométrica? Escreva a forma correta.'
      espaco: 12
      resolucao: |
        A igualdade está certa ($-2 \cdot \tfrac{\sqrt{2}}{2} = -\sqrt{2}$), mas a forma trigonométrica exige $r = |z| = 2 > 0$. Correto: $z = 2\left(\cos\tfrac{5\pi}{4} + i\operatorname{sen}\tfrac{5\pi}{4}\right)$.
      resposta: '$2\left(\cos\frac{5\pi}{4} + i\operatorname{sen}\frac{5\pi}{4}\right)$'
    - enunciado: 'Escreva $z = -3\sqrt{3} + 3i$ na forma trigonométrica.'
      espaco: 12
      resolucao: |
        $r = \sqrt{27 + 9} = 6$; $\cos\theta = -\tfrac{\sqrt{3}}{2}$ e $\operatorname{sen}\theta = \tfrac{1}{2}$: $\theta = \tfrac{5\pi}{6}$. $z = 6\left(\cos\tfrac{5\pi}{6} + i\operatorname{sen}\tfrac{5\pi}{6}\right)$.
      resposta: '$6\left(\cos\frac{5\pi}{6} + i\operatorname{sen}\frac{5\pi}{6}\right)$'
    - enunciado: 'Escreva $z = 4\left(\cos\frac{7\pi}{6} + i\operatorname{sen}\frac{7\pi}{6}\right)$ na forma algébrica.'
      espaco: 10
      resolucao: |
        $\cos\tfrac{7\pi}{6} = -\tfrac{\sqrt{3}}{2}$ e $\operatorname{sen}\tfrac{7\pi}{6} = -\tfrac{1}{2}$: $z = -2\sqrt{3} - 2i$.
      resposta: '$-2\sqrt{3} - 2i$'
    - enunciado: 'Para $z = 2\left(\cos\frac{\pi}{3} + i\operatorname{sen}\frac{\pi}{3}\right)$, escreva $\bar z$ e $-z$ na forma trigonométrica, com argumentos entre $0$ e $2\pi$.'
      espaco: 14
      resolucao: |
        $\bar z$ é a reflexão no eixo real: mesmo módulo, argumento $2\pi - \tfrac{\pi}{3} = \tfrac{5\pi}{3}$. $-z$ é simétrico em relação à origem: argumento $\tfrac{\pi}{3} + \pi = \tfrac{4\pi}{3}$.
        $\bar z = 2\left(\cos\tfrac{5\pi}{3} + i\operatorname{sen}\tfrac{5\pi}{3}\right)$ e $-z = 2\left(\cos\tfrac{4\pi}{3} + i\operatorname{sen}\tfrac{4\pi}{3}\right)$.
      resposta: '$\bar z$: $2$ e $\frac{5\pi}{3}$; $-z$: $2$ e $\frac{4\pi}{3}$'
    - enunciado: 'Considere $z = (k - 1) + (k + 1)i$, com $k$ real.'
      itens:
      - 'Determine $k$ para que o argumento de $z$ seja $\frac{\pi}{2}$.'
      - 'Existe $k$ para o qual o argumento de $z$ seja $\frac{\pi}{4}$? Justifique.'
      espaco_item: 12
      resolucao: |
        (a) Parte real nula e imaginária positiva: $k = 1$ ($z = 2i$).
        (b) Seria preciso $k - 1 = k + 1 > 0$, o que é impossível. Não existe.
      resposta: '(a) $k = 1$ (b) não'
    - enunciado: 'Um radar localiza um barco a 10 km de distância, numa direção que forma $150°$ com o leste, medidos no sentido anti-horário. Tomando o radar na origem e o leste no semieixo real positivo, escreva a posição do barco como número complexo, nas formas trigonométrica e algébrica.'
      espaco: 12
      resolucao: |
        $z = 10(\cos 150° + i\operatorname{sen} 150°) = 10\left(-\tfrac{\sqrt{3}}{2} + \tfrac{1}{2}i\right) = -5\sqrt{3} + 5i$.
      resposta: '$-5\sqrt{3} + 5i$'
    - enunciado: 'Determine o complexo $z$, com afixo no 4º quadrante, tal que $|z| = 4$ e $\operatorname{Re}(z) = 2$, e escreva-o na forma trigonométrica.'
      espaco: 12
      resolucao: |
        $4 + b^2 = 16$ e $b < 0$: $b = -2\sqrt{3}$, $z = 2 - 2\sqrt{3}\,i$. $\cos\theta = \tfrac{1}{2}$, $\operatorname{sen}\theta = -\tfrac{\sqrt{3}}{2}$: $z = 4\left(\cos\tfrac{5\pi}{3} + i\operatorname{sen}\tfrac{5\pi}{3}\right)$.
      resposta: '$2 - 2\sqrt{3}\,i$; $4$ e $\frac{5\pi}{3}$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Mostre que, para $0 < \theta < \frac{\pi}{2}$, o número $z = \operatorname{sen}\theta + i\cos\theta$ tem módulo 1 e argumento $\frac{\pi}{2} - \theta$.'
      espaco: 14
      resolucao: |
        $|z| = \sqrt{\operatorname{sen}^2\theta + \cos^2\theta} = 1$. Como $\operatorname{sen}\theta = \cos\left(\tfrac{\pi}{2} - \theta\right)$ e $\cos\theta = \operatorname{sen}\left(\tfrac{\pi}{2} - \theta\right)$, $z = \cos\left(\tfrac{\pi}{2} - \theta\right) + i\operatorname{sen}\left(\tfrac{\pi}{2} - \theta\right)$, com $\tfrac{\pi}{2} - \theta$ entre $0$ e $\tfrac{\pi}{2}$.
      resposta: 'Ver resolução'
    - enunciado: 'Escreva $z = \cos\frac{\pi}{5} - i\operatorname{sen}\frac{\pi}{5}$ na forma trigonométrica, com argumento entre $0$ e $2\pi$.'
      espaco: 12
      resolucao: |
        $\cos\left(-\tfrac{\pi}{5}\right) = \cos\tfrac{\pi}{5}$ e $\operatorname{sen}\left(-\tfrac{\pi}{5}\right) = -\operatorname{sen}\tfrac{\pi}{5}$: $z = \cos\left(-\tfrac{\pi}{5}\right) + i\operatorname{sen}\left(-\tfrac{\pi}{5}\right)$. Somando $2\pi$: argumento $\tfrac{9\pi}{5}$.
      resposta: '$\cos\frac{9\pi}{5} + i\operatorname{sen}\frac{9\pi}{5}$'
    - enunciado: 'Determine $z$ tal que $|z| = 2$, $\operatorname{Re}(z) = -1$ e $\operatorname{Im}(z) > 0$, e escreva-o na forma trigonométrica.'
      espaco: 12
      resolucao: |
        $1 + b^2 = 4$, $b = \sqrt{3}$: $z = -1 + \sqrt{3}\,i = 2\left(\cos\tfrac{2\pi}{3} + i\operatorname{sen}\tfrac{2\pi}{3}\right)$.
      resposta: '$-1 + \sqrt{3}\,i$; $2$ e $\frac{2\pi}{3}$'
    - enunciado: 'Determine $m$ real para que $z = (m - 3) + (m^2 - 9)i$ tenha argumento principal $\pi$ e escreva $z$ na forma trigonométrica.'
      espaco: 12
      resolucao: |
        Argumento $\pi$: $z$ real negativo. $m^2 - 9 = 0$ dá $m = \pm 3$; $m - 3 < 0$ exige $m = -3$. $z = -6 = 6(\cos\pi + i\operatorname{sen}\pi)$.
      resposta: '$m = -3$; $z = 6(\cos\pi + i\operatorname{sen}\pi)$'
    - enunciado: 'Os afixos de $z_1 = 3\left(\cos\frac{\pi}{6} + i\operatorname{sen}\frac{\pi}{6}\right)$ e $z_2 = 3\left(\cos\frac{2\pi}{3} + i\operatorname{sen}\frac{2\pi}{3}\right)$ e a origem formam um triângulo. Classifique-o e calcule a sua área.'
      espaco: 14
      resolucao: |
        Os dois lados que partem da origem medem 3 e formam ângulo $\tfrac{2\pi}{3} - \tfrac{\pi}{6} = \tfrac{\pi}{2}$: triângulo retângulo isósceles. Área $\tfrac{3 \cdot 3}{2} = 4{,}5$.
      resposta: 'retângulo isósceles; $4{,}5$'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      A tela de um radar mostra a posição de um barco pela distância até o radar e pelo ângulo que a direção do barco forma com o leste, medido no sentido anti-horário. Na tela, os círculos estão espaçados de 2 km. Tomando o radar na origem do plano de Argand-Gauss e o leste no semieixo real positivo, a posição do barco pode ser escrita como um número complexo.
    figura:
      tikz: |
        \begin{scope}[scale=.42]
        \foreach \r in {2,4,6,8} \draw[gray!40] (0,0) circle (\r);
        \draw[-latex, ink!60] (-9,0) -- (9.4,0) node[right, font=\scriptsize] {leste};
        \draw[-latex, ink!60] (0,-9) -- (0,9.4) node[above, font=\scriptsize] {norte};
        \draw[roxo, line width=1pt] (0,0) -- (-4,6.928);
        \fill[roxo] (-4,6.928) circle (6pt) node[above left, font=\scriptsize] {barco};
        \draw[roxo, -latex] (1.6,0) arc (0:120:1.6) node[midway, above right, font=\scriptsize] {$120°$};
        \end{scope}
    enunciado: |
      O número complexo que representa a posição do barco, em quilômetros, é
    opcoes: ['$-4 + 4\sqrt{3}\,i$', '$4 + 4\sqrt{3}\,i$', '$-4\sqrt{3} + 4i$', '$4\sqrt{3} - 4i$', '$-4 - 4\sqrt{3}\,i$']
    correta: A
    resolucao: |
      O barco está no quarto círculo, a 8 km: $z = 8(\cos 120° + i\operatorname{sen} 120°) = 8\left(-\tfrac{1}{2} + \tfrac{\sqrt{3}}{2}i\right) = -4 + 4\sqrt{3}\,i$.

  - estilo: Fuvest
    enunciado: |
      A forma trigonométrica de $z = -2i$ é
    opcoes: ['$2\left(\cos\frac{\pi}{2} + i\operatorname{sen}\frac{\pi}{2}\right)$', '$2(\cos\pi + i\operatorname{sen}\pi)$', '$2\left(\cos\frac{3\pi}{2} + i\operatorname{sen}\frac{3\pi}{2}\right)$', '$2(\cos 0 + i\operatorname{sen} 0)$', '$\sqrt{2}\left(\cos\frac{3\pi}{2} + i\operatorname{sen}\frac{3\pi}{2}\right)$']
    correta: C
    resolucao: |
      $|z| = 2$ e o afixo $(0, -2)$ está no semieixo imaginário negativo: $\theta = \tfrac{3\pi}{2}$.

  - estilo: Unicamp
    enunciado: |
      O número complexo $2\left(\cos\frac{\pi}{6} + i\operatorname{sen}\frac{\pi}{6}\right)$ é igual a
    opcoes: ['$\sqrt{3} + i$.', '$1 + \sqrt{3}\,i$.', '$2 + i$.', '$\sqrt{3} - i$.']
    correta: A
    resolucao: |
      $2\left(\tfrac{\sqrt{3}}{2} + \tfrac{1}{2}i\right) = \sqrt{3} + i$.

  - estilo: UEM
    enunciado: |
      Considere o número complexo $z = -1 + i$. Assinale o que for correto.
    proposicoes:
    - '$|z| = \sqrt{2}$.'
    - 'O argumento principal de $z$ é $\frac{3\pi}{4}$.'
    - '$z = \sqrt{2}\left(\cos\frac{3\pi}{4} + i\operatorname{sen}\frac{3\pi}{4}\right)$.'
    - '$z = \sqrt{2}\left(\cos\frac{11\pi}{4} + i\operatorname{sen}\frac{11\pi}{4}\right)$.'
    - 'O argumento principal de $z$ é $\frac{\pi}{4}$.'
    corretas: [1, 2, 3, 4]
    resolucao: |
      01) Correta. 02) $\cos\theta = -\tfrac{\sqrt{2}}{2}$ e $\operatorname{sen}\theta = \tfrac{\sqrt{2}}{2}$. 04) Correta. 08) Correta: $\tfrac{11\pi}{4} = \tfrac{3\pi}{4} + 2\pi$. 16) Incorreta: $\tfrac{\pi}{4}$ corresponde a $1 + i$.
      Soma: $01 + 02 + 04 + 08 = 15$.

  - estilo: Enem
    texto: |
      O operador de um farol registra a posição dos pontos de interesse pela distância ao farol e pelo ângulo medido a partir do leste, no sentido anti-horário. Com o farol na origem do plano de Argand-Gauss e o leste no semieixo real positivo, cada posição corresponde a um número complexo. O quadro mostra alguns registros.
    tabela:
      cabecalho: ['Ponto', 'Distância (km)', 'Ângulo']
      linhas:
      - ['Boia', '$4$', '$30°$']
      - ['Ilha', '$6$', '$135°$']
      - ['Píer', '$5$', '$270°$']
      - ['Rocha', '$2$', '$300°$']
    enunciado: |
      O ponto cuja posição corresponde ao número complexo $1 - \sqrt{3}\,i$ é
    opcoes: ['a boia.', 'a ilha.', 'o píer.', 'a rocha.', 'nenhum deles.']
    correta: D
    resolucao: |
      $|1 - \sqrt{3}\,i| = 2$, com $\cos\theta = \tfrac{1}{2}$ e $\operatorname{sen}\theta = -\tfrac{\sqrt{3}}{2}$: $\theta = 300°$. É a rocha.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir sobre a forma trigonométrica dos números complexos.
    afirmativas:
    - 'O argumento principal de $5$ é $0$.'
    - 'O argumento principal de $-5$ é $\pi$.'
    - 'Se $z = r(\cos\theta + i\operatorname{sen}\theta)$, então $\bar z = r(\cos(-\theta) + i\operatorname{sen}(-\theta))$.'
    - 'Dois números complexos de mesmo módulo são iguais.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'I, II e III, apenas.', 'II e IV, apenas.', 'III e IV, apenas.', 'I, II, III e IV.']
    correta: B
    resolucao: |
      I e II. Corretas: semieixos real positivo e negativo. III. Correta: $\cos(-\theta) = \cos\theta$ e $\operatorname{sen}(-\theta) = -\operatorname{sen}\theta$. IV. Incorreta: $1$ e $i$ têm módulo 1.

  - estilo: Unesp
    enunciado: |
      O módulo e o argumento principal de $z = \sqrt{3} - i$ são, respectivamente,
    opcoes: ['$2$ e $\frac{\pi}{6}$', '$2$ e $\frac{5\pi}{6}$', '$4$ e $\frac{11\pi}{6}$', '$2$ e $\frac{7\pi}{6}$', '$2$ e $\frac{11\pi}{6}$']
    correta: E
    resolucao: |
      $r = 2$; $\cos\theta = \tfrac{\sqrt{3}}{2}$ e $\operatorname{sen}\theta = -\tfrac{1}{2}$: 4º quadrante, $\theta = 2\pi - \tfrac{\pi}{6} = \tfrac{11\pi}{6}$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    enunciado: |
      Se $z = 6\left(\cos\frac{5\pi}{6} + i\operatorname{sen}\frac{5\pi}{6}\right)$, então $\operatorname{Re}(z) + \operatorname{Im}(z)$ é igual a
    opcoes: ['$3 + 3\sqrt{3}$.', '$3 - 3\sqrt{3}$.', '$-3 - 3\sqrt{3}$.', '$3\sqrt{3} - 3$.']
    correta: B
    resolucao: |
      $z = 6\left(-\tfrac{\sqrt{3}}{2} + \tfrac{1}{2}i\right) = -3\sqrt{3} + 3i$. Soma $3 - 3\sqrt{3}$.

  - estilo: Fuvest
    enunciado: |
      O argumento principal de $z = -\sqrt{3} - 3i$ é
    opcoes: ['$\frac{\pi}{3}$', '$\frac{2\pi}{3}$', '$\frac{4\pi}{3}$', '$\frac{5\pi}{3}$', '$\frac{7\pi}{6}$']
    correta: C
    resolucao: |
      $r = \sqrt{3 + 9} = 2\sqrt{3}$; $\cos\theta = -\tfrac{1}{2}$ e $\operatorname{sen}\theta = -\tfrac{\sqrt{3}}{2}$: 3º quadrante, $\tfrac{4\pi}{3}$.

  - estilo: UFSC
    enunciado: |
      Considere $z = 4\left(\cos\frac{2\pi}{3} + i\operatorname{sen}\frac{2\pi}{3}\right)$. Assinale o que for correto.
    proposicoes:
    - '$\operatorname{Re}(z) = -2$.'
    - '$\operatorname{Im}(z) = 2\sqrt{3}$.'
    - 'O afixo de $z$ está no 2º quadrante.'
    - '$\bar z = 4\left(\cos\frac{4\pi}{3} + i\operatorname{sen}\frac{4\pi}{3}\right)$.'
    - '$-z = 4\left(\cos\frac{\pi}{3} + i\operatorname{sen}\frac{\pi}{3}\right)$.'
    - '$z = 4\left(\cos\left(-\frac{4\pi}{3}\right) + i\operatorname{sen}\left(-\frac{4\pi}{3}\right)\right)$.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      $z = -2 + 2\sqrt{3}\,i$. 01) e 02) Corretas. 04) Correta. 08) Correta: $2\pi - \tfrac{2\pi}{3} = \tfrac{4\pi}{3}$.
      16) Incorreta: $-z = 2 - 2\sqrt{3}\,i$, de argumento $\tfrac{2\pi}{3} + \pi = \tfrac{5\pi}{3}$. 32) Correta: $-\tfrac{4\pi}{3} + 2\pi = \tfrac{2\pi}{3}$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      O ponteiro das horas de um relógio de parede mede 10 cm. Um designer representou o relógio no plano de Argand-Gauss, com o centro na origem, o número 12 no semieixo imaginário positivo e o número 3 no semieixo real positivo. Ele quer calcular, para uma animação, a posição da ponta do ponteiro das horas quando o relógio marca exatamente 2 horas.
    enunciado: |
      Às 2 horas, a ponta do ponteiro das horas está no afixo de
    opcoes: ['$5 + 5\sqrt{3}\,i$', '$10i$', '$-5\sqrt{3} + 5i$', '$5\sqrt{3} + 5i$', '$5\sqrt{3} - 5i$']
    correta: D
    resolucao: |
      Cada hora corresponde a $30°$. O 12 está a $90°$ do semieixo real positivo, e o ponteiro anda no sentido horário: às 2 h, ele forma $90° - 60° = 30°$. $10(\cos 30° + i\operatorname{sen} 30°) = 5\sqrt{3} + 5i$. (A alternativa A usa $60°$.)

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'Para todo $\theta$ real, $|\cos\theta + i\operatorname{sen}\theta| = 1$.'
    - 'O argumento principal de $-1 - i$ é $\frac{\pi}{4}$.'
    - '$3(\cos\pi + i\operatorname{sen}\pi) = -3$.'
    - '$2\left(\cos\frac{\pi}{2} + i\operatorname{sen}\frac{\pi}{2}\right) = 2$.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – V – F.', 'F – F – V – F.', 'V – F – F – V.', 'V – F – V – V.', 'V – F – V – F.']
    correta: E
    resolucao: |
      (V) $\cos^2\theta + \operatorname{sen}^2\theta = 1$. (F) É $\tfrac{5\pi}{4}$, no 3º quadrante. (V) $3(-1 + 0i)$. (F) $2(0 + i) = 2i$.

  - estilo: Enem
    texto: |
      Na figura, o ponto $P$ é o afixo de um número complexo $z$ de módulo 4, e o ângulo indicado, de $60°$, é formado pelo segmento $OP$ com o semieixo real negativo. Um estudante precisa escrever $z$ na forma algébrica para usar num programa de desenho.
    figura:
      tikz: |
        \begin{scope}[scale=.62]
        \draw[step=1, gray!25, very thin] (-4,-1) grid (3,4);
        \draw[-latex, ink!60] (-4.4,0) -- (3.5,0) node[right, font=\scriptsize] {Re};
        \draw[-latex, ink!60] (0,-1.4) -- (0,4.5) node[above, font=\scriptsize] {Im};
        \draw[roxo, line width=1.1pt] (0,0) -- (-2,3.464);
        \fill[roxo] (-2,3.464) circle (3.5pt) node[above left, font=\scriptsize] {$P$};
        \draw[ink] (-1,0) arc (180:120:1);
        \node[font=\scriptsize] at (-1.25,0.55) {$60°$};
        \node[font=\scriptsize, roxo] at (-0.6,2.1) {$4$};
        \end{scope}
    enunciado: |
      O número $z$ é
    opcoes: ['$2 + 2\sqrt{3}\,i$', '$-2 + 2\sqrt{3}\,i$', '$-2\sqrt{3} + 2i$', '$2\sqrt{3} + 2i$', '$-2 - 2\sqrt{3}\,i$']
    correta: B
    resolucao: |
      O argumento é medido a partir do semieixo real positivo: $\theta = 180° - 60° = 120°$. $z = 4(\cos 120° + i\operatorname{sen} 120°) = -2 + 2\sqrt{3}\,i$.

  - estilo: Fuvest
    enunciado: |
      Os valores de $\theta$, com $0 \leq \theta < 2\pi$, para os quais $\cos\theta + i\operatorname{sen}\theta$ é imaginário puro são
    opcoes: ['apenas $\frac{\pi}{2}$', '$0$ e $\pi$', '$\frac{\pi}{4}$ e $\frac{3\pi}{4}$', '$\frac{\pi}{2}$ e $\frac{3\pi}{2}$', '$\pi$ e $\frac{3\pi}{2}$']
    correta: D
    resolucao: |
      Parte real nula: $\cos\theta = 0$, e então $\operatorname{sen}\theta = \pm 1 \neq 0$. $\theta = \tfrac{\pi}{2}$ ou $\tfrac{3\pi}{2}$ (os números $i$ e $-i$).

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Considere $r > 0$ e $\theta$ real. Assinale o que for correto.
    proposicoes:
    - '$\cos\theta + i\operatorname{sen}\theta = \cos(\theta + 2\pi) + i\operatorname{sen}(\theta + 2\pi)$.'
    - 'Todo número real negativo tem argumento principal $\pi$.'
    - 'Se $0 < \theta < \frac{\pi}{2}$, o afixo de $r(\cos\theta + i\operatorname{sen}\theta)$ está no 1º quadrante.'
    - 'O módulo de $-2\left(\cos\frac{\pi}{3} + i\operatorname{sen}\frac{\pi}{3}\right)$ é $-2$.'
    - '$\operatorname{sen}\theta + i\cos\theta = \cos\left(\frac{\pi}{2} - \theta\right) + i\operatorname{sen}\left(\frac{\pi}{2} - \theta\right)$.'
    corretas: [1, 2, 3, 5]
    resolucao: |
      01) Correta: seno e cosseno têm período $2\pi$. 02) Correta. 04) Correta: cosseno e seno positivos. 08) Incorreta: módulo nunca é negativo; vale 2.
      16) Correta: $\cos\left(\tfrac{\pi}{2} - \theta\right) = \operatorname{sen}\theta$ e $\operatorname{sen}\left(\tfrac{\pi}{2} - \theta\right) = \cos\theta$.
      Soma: $01 + 02 + 04 + 16 = 23$.

  - estilo: Fuvest
    enunciado: |
      O argumento principal de $z = \cos\frac{\pi}{7} - i\operatorname{sen}\frac{\pi}{7}$ é
    opcoes: ['$\frac{\pi}{7}$', '$\frac{6\pi}{7}$', '$\frac{8\pi}{7}$', '$\frac{15\pi}{7}$', '$\frac{13\pi}{7}$']
    correta: E
    resolucao: |
      $z = \cos\left(-\tfrac{\pi}{7}\right) + i\operatorname{sen}\left(-\tfrac{\pi}{7}\right)$. No intervalo $[0, 2\pi)$: $2\pi - \tfrac{\pi}{7} = \tfrac{13\pi}{7}$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Um braço robótico de 6 m gira em torno de um eixo fixo, que fica na origem do plano de Argand-Gauss. A ponta do braço fica no afixo de $6(\cos\theta + i\operatorname{sen}\theta)$, em que $\theta$ é o ângulo do braço com o semieixo real positivo. O quadro mostra os ângulos associados a quatro comandos do painel.
    tabela:
      cabecalho: ['Comando', 'Ângulo $\theta$']
      linhas:
      - ['Girar 1', '$45°$']
      - ['Girar 2', '$135°$']
      - ['Girar 3', '$225°$']
      - ['Girar 4', '$315°$']
    enunciado: |
      Com o comando Girar 3, a ponta do braço fica no afixo de
    opcoes: ['$3\sqrt{2} + 3\sqrt{2}\,i$', '$-3\sqrt{2} + 3\sqrt{2}\,i$', '$-3\sqrt{2} - 3\sqrt{2}\,i$', '$3\sqrt{2} - 3\sqrt{2}\,i$', '$-6 - 6i$']
    correta: C
    resolucao: |
      $6(\cos 225° + i\operatorname{sen} 225°) = 6\left(-\tfrac{\sqrt{2}}{2} - \tfrac{\sqrt{2}}{2}i\right) = -3\sqrt{2} - 3\sqrt{2}\,i$.

  - estilo: Unicamp
    enunciado: |
      Para que a ponta do braço fique no afixo de $-3 + 3\sqrt{3}\,i$, o ângulo $\theta$ deve ser
    opcoes: ['$60°$.', '$120°$.', '$150°$.', '$240°$.']
    correta: B
    resolucao: |
      $|-3 + 3\sqrt{3}\,i| = \sqrt{9 + 27} = 6$ (o ponto é alcançável). $\cos\theta = -\tfrac{1}{2}$ e $\operatorname{sen}\theta = \tfrac{\sqrt{3}}{2}$: $\theta = 120°$.

  - estilo: Unesp
    enunciado: |
      O número complexo de módulo 2 e argumento principal $\frac{7\pi}{4}$ é
    opcoes: ['$\sqrt{2} + \sqrt{2}\,i$', '$-\sqrt{2} - \sqrt{2}\,i$', '$-\sqrt{2} + \sqrt{2}\,i$', '$\sqrt{2} - \sqrt{2}\,i$', '$2 - 2i$']
    correta: D
    resolucao: |
      $2\left(\tfrac{\sqrt{2}}{2} - \tfrac{\sqrt{2}}{2}i\right) = \sqrt{2} - \sqrt{2}\,i$.

  - estilo: Fuvest
    enunciado: |
      Para quantos inteiros $k$, com $0 \leq k \leq 11$, o número $\cos\frac{k\pi}{6} + i\operatorname{sen}\frac{k\pi}{6}$ tem parte real e parte imaginária ambas não nulas?
    opcoes: ['$4$', '$6$', '$8$', '$10$', '$12$']
    correta: C
    resolucao: |
      Os ângulos são os múltiplos de $30°$ de $0°$ a $330°$. Uma das partes se anula só nos eixos: $k = 0, 3, 6, 9$. Sobram $12 - 4 = 8$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere $z = 1 + \cos\theta + i\operatorname{sen}\theta$, com $0 < \theta < \pi$.'
    itens:
    - 'Usando $1 + \cos\theta = 2\cos^2\frac{\theta}{2}$ e $\operatorname{sen}\theta = 2\operatorname{sen}\frac{\theta}{2}\cos\frac{\theta}{2}$, mostre que $z = 2\cos\frac{\theta}{2}\left(\cos\frac{\theta}{2} + i\operatorname{sen}\frac{\theta}{2}\right)$.'
    - 'Determine o módulo e o argumento de $z$ em função de $\theta$.'
    - 'Confira o resultado para $\theta = \frac{2\pi}{3}$, calculando $z$ diretamente.'
    espaco: 62
    resolucao: |
      a) $z = 2\cos^2\tfrac{\theta}{2} + 2i\operatorname{sen}\tfrac{\theta}{2}\cos\tfrac{\theta}{2} = 2\cos\tfrac{\theta}{2}\left(\cos\tfrac{\theta}{2} + i\operatorname{sen}\tfrac{\theta}{2}\right)$.
      b) Como $0 < \tfrac{\theta}{2} < \tfrac{\pi}{2}$, $2\cos\tfrac{\theta}{2} > 0$: é a forma trigonométrica, com $|z| = 2\cos\tfrac{\theta}{2}$ e argumento $\tfrac{\theta}{2}$.
      c) $z = 1 - \tfrac{1}{2} + \tfrac{\sqrt{3}}{2}i = \tfrac{1}{2} + \tfrac{\sqrt{3}}{2}i$: módulo 1 e argumento $\tfrac{\pi}{3}$. Pela fórmula: $2\cos\tfrac{\pi}{3} = 1$ e $\tfrac{\theta}{2} = \tfrac{\pi}{3}$.
    resposta: 'b) $|z| = 2\cos\frac{\theta}{2}$, argumento $\frac{\theta}{2}$'

  - estilo: Unicamp
    texto: |
      Um radar, na origem do plano de Argand-Gauss, registra dois barcos: $P = 10(\cos 30° + i\operatorname{sen} 30°)$ e $Q = 10(\cos 90° + i\operatorname{sen} 90°)$, em quilômetros.
    enunciado: ''
    itens:
    - 'Escreva $P$ e $Q$ na forma algébrica.'
    - 'Calcule a distância entre os barcos.'
    - 'Explique o resultado do item b) pelo triângulo formado pelo radar e pelos dois barcos.'
    espaco: 62
    resolucao: |
      a) $P = 5\sqrt{3} + 5i$ e $Q = 10i$.
      b) $|P - Q| = |5\sqrt{3} - 5i| = \sqrt{75 + 25} = 10$ km.
      c) O triângulo tem dois lados de 10 km que formam $90° - 30° = 60°$: é isósceles com ângulo de $60°$ entre os lados iguais, logo equilátero, e o terceiro lado também mede 10.
    resposta: 'a) $5\sqrt{3} + 5i$ e $10i$; b) 10 km'

  - estilo: ITA
    enunciado: |
      Seja $z = -1 + i\operatorname{tg}\alpha$, com $\frac{\pi}{2} < \alpha < \pi$. O argumento principal de $z$ é
    opcoes: ['$\alpha$', '$\pi - \alpha$', '$\pi + \alpha$', '$2\pi - \alpha$', '$\alpha - \frac{\pi}{2}$']
    correta: D
    espaco: 22
    resolucao: |
      $z = -1 + i\tfrac{\operatorname{sen}\alpha}{\cos\alpha} = \tfrac{1}{-\cos\alpha}(\cos\alpha - i\operatorname{sen}\alpha)$, com $-\cos\alpha > 0$. Então $z = \tfrac{1}{|\cos\alpha|}\left(\cos(-\alpha) + i\operatorname{sen}(-\alpha)\right)$, de argumento $-\alpha + 2\pi$, que está entre $\pi$ e $\tfrac{3\pi}{2}$. Teste: $\alpha = \tfrac{3\pi}{4}$ dá $z = -1 - i$, de argumento $\tfrac{5\pi}{4} = 2\pi - \tfrac{3\pi}{4}$.
    resposta: 'D'

  - estilo: Unesp
    enunciado: 'Um hexágono regular está inscrito na circunferência $|z| = 2$, com um vértice no afixo de $z = 2$.'
    itens:
    - 'Escreva os seis vértices na forma trigonométrica e na forma algébrica.'
    - 'Calcule o perímetro e a área do hexágono.'
    - 'Quais vértices têm afixo no 2º quadrante?'
    espaco: 62
    resolucao: |
      a) $2\left(\cos\tfrac{k\pi}{3} + i\operatorname{sen}\tfrac{k\pi}{3}\right)$, $k = 0, \ldots, 5$: $2$, $1 + \sqrt{3}\,i$, $-1 + \sqrt{3}\,i$, $-2$, $-1 - \sqrt{3}\,i$, $1 - \sqrt{3}\,i$.
      b) O lado do hexágono regular é igual ao raio: perímetro 12. Área de 6 triângulos equiláteros de lado 2: $6 \cdot \tfrac{4\sqrt{3}}{4} = 6\sqrt{3}$.
      c) Só $-1 + \sqrt{3}\,i$ (argumento $\tfrac{2\pi}{3}$); $-2$ está no eixo real.
    resposta: 'b) $12$ e $6\sqrt{3}$; c) $-1 + \sqrt{3}\,i$'

  - estilo: UFSC
    enunciado: |
      Considere $\theta$ real. Assinale o que for correto.
    proposicoes:
    - '$\cos\frac{\pi}{2} + i\operatorname{sen}\frac{\pi}{2} = i$.'
    - '$\cos\pi + i\operatorname{sen}\pi + 1 = 0$.'
    - '$|\cos\theta + i\operatorname{sen}\theta| = 1$.'
    - '$\cos\theta + i\operatorname{sen}\theta$ é imaginário puro quando $\theta = k\pi$, com $k$ inteiro.'
    - 'O conjugado de $\cos\theta + i\operatorname{sen}\theta$ é $\cos(\pi - \theta) + i\operatorname{sen}(\pi - \theta)$.'
    - '$-(\cos\theta + i\operatorname{sen}\theta) = \cos(\theta + \pi) + i\operatorname{sen}(\theta + \pi)$.'
    corretas: [1, 2, 3, 6]
    espaco: 22
    resolucao: |
      01) $0 + i$. 02) $-1 + 0 + 1$. 04) Correta. 08) Incorreta: para $\theta = k\pi$, o número é $\pm 1$, real.
      16) Incorreta: o conjugado é $\cos(-\theta) + i\operatorname{sen}(-\theta)$; $\cos(\pi - \theta) = -\cos\theta$ troca a parte real. 32) $\cos(\theta + \pi) = -\cos\theta$ e $\operatorname{sen}(\theta + \pi) = -\operatorname{sen}\theta$.
    resposta: 'Soma 39 (01 + 02 + 04 + 32)'

  - estilo: Fuvest
    enunciado: 'Considere $z = (m - 2) + (m + 2)i$, com $m$ real.'
    itens:
    - 'Determine $m$ para que o argumento principal de $z$ seja $\frac{3\pi}{4}$ e escreva $z$ na forma trigonométrica.'
    - 'Determine $m$ para que o argumento principal de $z$ seja $\frac{\pi}{2}$.'
    - 'Para que valores de $m$ o argumento principal de $z$ está entre $\frac{\pi}{2}$ e $\pi$?'
    espaco: 62
    resolucao: |
      a) Argumento $\tfrac{3\pi}{4}$: parte real negativa e $b = -a$. $m + 2 = -(m - 2)$ dá $m = 0$, e $z = -2 + 2i$ (de fato $a < 0$). $z = 2\sqrt{2}\left(\cos\tfrac{3\pi}{4} + i\operatorname{sen}\tfrac{3\pi}{4}\right)$.
      b) $m - 2 = 0$ e $m + 2 > 0$: $m = 2$ ($z = 4i$).
      c) 2º quadrante: $m - 2 < 0$ e $m + 2 > 0$, isto é, $-2 < m < 2$.
    resposta: 'a) $m = 0$; b) $m = 2$; c) $-2 < m < 2$'

  - estilo: Unicamp
    texto: |
      O ponteiro dos minutos de um relógio mede 12 cm. O relógio foi colocado no plano de Argand-Gauss com o centro na origem e o número 12 no semieixo imaginário positivo. Depois de $t$ minutos de uma hora cheia, o ponteiro forma com o semieixo real positivo o ângulo $\theta = \frac{\pi}{2} - \frac{2\pi t}{60}$.
    enunciado: ''
    itens:
    - 'Escreva, na forma algébrica, a posição da ponta do ponteiro aos 10 minutos.'
    - 'Faça o mesmo para 40 minutos.'
    - 'Em que minuto a ponta do ponteiro fica no afixo de $-12$?'
    espaco: 62
    resolucao: |
      a) $\theta = \tfrac{\pi}{2} - \tfrac{\pi}{3} = \tfrac{\pi}{6}$: $12\left(\tfrac{\sqrt{3}}{2} + \tfrac{1}{2}i\right) = 6\sqrt{3} + 6i$.
      b) $\theta = \tfrac{\pi}{2} - \tfrac{4\pi}{3} = -\tfrac{5\pi}{6}$, que equivale a $\tfrac{7\pi}{6}$: $12\left(-\tfrac{\sqrt{3}}{2} - \tfrac{1}{2}i\right) = -6\sqrt{3} - 6i$.
      c) $-12$ tem argumento $\pi$, que equivale a $-\pi$: $\tfrac{\pi}{2} - \tfrac{\pi t}{30} = -\pi$ dá $t = 45$ (o ponteiro aponta para o 9).
    resposta: 'a) $6\sqrt{3} + 6i$; b) $-6\sqrt{3} - 6i$; c) 45 minutos'

  - estilo: Fuvest
    enunciado: |
      A área do triângulo cujos vértices são a origem e os afixos de $4\left(\cos\frac{\pi}{6} + i\operatorname{sen}\frac{\pi}{6}\right)$ e $6\left(\cos\frac{\pi}{2} + i\operatorname{sen}\frac{\pi}{2}\right)$ é
    opcoes: ['$6$', '$12$', '$6\sqrt{3}$', '$12\sqrt{3}$', '$3\sqrt{3}$']
    correta: C
    espaco: 22
    resolucao: |
      Os lados que partem da origem medem 4 e 6 e formam $\tfrac{\pi}{2} - \tfrac{\pi}{6} = \tfrac{\pi}{3}$. Área $\tfrac{1}{2} \cdot 4 \cdot 6 \cdot \operatorname{sen}\tfrac{\pi}{3} = 6\sqrt{3}$.
    resposta: 'C'

  - estilo: Unesp
    enunciado: 'Considere $z = 2\left(\cos\frac{\pi}{3} + i\operatorname{sen}\frac{\pi}{3}\right)$ e $w = 2\left(\cos\frac{5\pi}{6} + i\operatorname{sen}\frac{5\pi}{6}\right)$.'
    itens:
    - 'Escreva $z$ e $w$ na forma algébrica.'
    - 'Mostre que os segmentos que ligam a origem aos afixos de $z$ e de $w$ são perpendiculares.'
    - 'Calcule a distância entre os afixos de $z$ e de $w$.'
    espaco: 62
    resolucao: |
      a) $z = 1 + \sqrt{3}\,i$ e $w = -\sqrt{3} + i$.
      b) Os argumentos diferem de $\tfrac{5\pi}{6} - \tfrac{\pi}{3} = \tfrac{\pi}{2}$. (Pelos coeficientes angulares: $\sqrt{3}$ e $-\tfrac{1}{\sqrt{3}}$, de produto $-1$.)
      c) $|z - w| = |(1 + \sqrt{3}) + (\sqrt{3} - 1)i| = \sqrt{(1 + \sqrt{3})^2 + (\sqrt{3} - 1)^2} = \sqrt{8} = 2\sqrt{2}$, a hipotenusa do triângulo retângulo de catetos 2 e 2.
    resposta: 'a) $1 + \sqrt{3}\,i$ e $-\sqrt{3} + i$; c) $2\sqrt{2}$'

  - estilo: Fuvest
    enunciado: 'Considere os números $z_k = 2\left(\cos\theta_k + i\operatorname{sen}\theta_k\right)$, com $\theta_1 = \frac{\pi}{2}$, $\theta_2 = \frac{7\pi}{6}$ e $\theta_3 = \frac{11\pi}{6}$.'
    itens:
    - 'Escreva $z_1$, $z_2$ e $z_3$ na forma algébrica.'
    - 'Mostre que os afixos formam um triângulo equilátero e calcule o lado.'
    - 'Calcule $z_1 + z_2 + z_3$ e a área do triângulo.'
    espaco: 62
    resolucao: |
      a) $z_1 = 2i$, $z_2 = -\sqrt{3} - i$, $z_3 = \sqrt{3} - i$.
      b) $|z_1 - z_2| = |\sqrt{3} + 3i| = \sqrt{12}$, $|z_1 - z_3| = |-\sqrt{3} + 3i| = \sqrt{12}$, $|z_2 - z_3| = |-2\sqrt{3}| = \sqrt{12}$. Lado $2\sqrt{3}$. (Os argumentos diferem de $\tfrac{2\pi}{3}$.)
      c) $z_1 + z_2 + z_3 = 0$ (o centro do triângulo é a origem). Área $\tfrac{\sqrt{3}}{4} \cdot 12 = 3\sqrt{3}$.
    resposta: 'b) $2\sqrt{3}$; c) $0$ e $3\sqrt{3}$'
