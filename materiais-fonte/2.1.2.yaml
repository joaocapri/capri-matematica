# Fonte das listas em PDF da aula 2.1.2 — O conceito de função
aula: '2.1.2'

fixacao:
  intro: Resolva na ordem — do fácil ao difícil. Função é a regra do "tiro único" — cada elemento do domínio tem exatamente uma imagem.
  secoes:
    - nome: Aquecimento
      questoes:
        - enunciado: 'Sendo $A=\{1,2,3\}$ e $B=\{4,5,6\}$, diga se cada relação de $A$ em $B$ é função. Justifique.'
          itens:
            - $\{(1,4),(2,5),(3,6)\}$
            - $\{(1,4),(2,4),(3,4)\}$
            - $\{(1,4),(1,5),(2,6),(3,6)\}$
            - $\{(1,5),(3,6)\}$
          resolucao: |
            (a) Sim: cada elemento de $A$ tem uma única imagem.
            (b) Sim: imagens repetidas são permitidas.
            (c) Não: o $1$ tem duas imagens.
            (d) Não: o $2$ não tem imagem.
          resposta: '(a) sim \quad (b) sim \quad (c) não \quad (d) não'

        - enunciado: Dada $f(x)=3x-2$, calcule
          itens:
            - $f(0)$
            - $f(2)$
            - $f(-1)$
            - $f\!\left(\tfrac13\right)$
          resolucao: |
            (a) $-2$. (b) $6-2=4$. (c) $-3-2=-5$. (d) $1-2=-1$.
          resposta: '(a) $-2$ \quad (b) $4$ \quad (c) $-5$ \quad (d) $-1$'

        - enunciado: Dada $f(x)=x^2-2x$, calcule $f(3)$, $f(-2)$ e $f(1)$.
          resolucao: |
            $f(3)=9-6=3$; \ $f(-2)=4+4=8$; \ $f(1)=1-2=-1$.
          resposta: '$3$; \ $8$; \ $-1$'

        - enunciado: Dada $f:\mathbb{R}\to\mathbb{R}$, $f(x)=2x+5$, determine $x$ tal que
          itens:
            - $f(x)=11$
            - $f(x)=0$
          resolucao: |
            (a) $2x+5=11\Rightarrow x=3$. (b) $2x+5=0\Rightarrow x=-\tfrac52$.
          resposta: '(a) $3$ \quad (b) $-\tfrac52$'

        - enunciado: 'Considere $f:A\to B$, com $A=\{-1,0,1,2\}$, $B=\{0,1,2,3,4\}$ e $f(x)=x^2$. Determine o domínio, o contradomínio e a imagem de $f$.'
          resolucao: |
            Domínio: $A$. Contradomínio: $B$.
            Imagens: $f(-1)=1$, $f(0)=0$, $f(1)=1$, $f(2)=4$. Logo, $Im=\{0,1,4\}\subset B$.
          resposta: '$D=A$; \ $CD=B$; \ $Im=\{0,1,4\}$'

        - enunciado: 'A tabela mostra valores de uma função do tipo $y=ax+b$: \ $x=1,2,3,4$ \ $\mapsto$ \ $y=5,7,9,11$. Determine a lei da função e calcule $f(10)$.'
          resolucao: |
            Quando $x$ aumenta $1$, $y$ aumenta $2$: $a=2$. Com $x=1$: $5=2+b\Rightarrow b=3$.
            $f(x)=2x+3$ e $f(10)=23$.
          resposta: '$f(x)=2x+3$; \ $f(10)=23$'

        - enunciado: Uma corrida de táxi custa $C(d)=4+2{,}5d$ reais, em que $d$ é a distância em km.
          itens:
            - Quanto custa uma corrida de $8$ km?
            - Qual a distância de uma corrida que custou R\$\,29{,}00?
          resolucao: |
            (a) $C(8)=4+20=24$ reais.
            (b) $4+2{,}5d=29\Rightarrow 2{,}5d=25\Rightarrow d=10$ km.
          resposta: '(a) R\$\,24{,}00 \quad (b) $10$ km'

    - nome: Treino
      questoes:
        - enunciado: Dada $f(x)=\dfrac{x+1}{x-2}$, calcule $f(3)$, $f(0)$ e $f(-1)$. Por que não existe $f(2)$?
          resolucao: |
            $f(3)=\tfrac41=4$; \ $f(0)=\tfrac{1}{-2}=-\tfrac12$; \ $f(-1)=\tfrac0{-3}=0$.
            Para $x=2$, o denominador é zero, e a divisão por zero não está definida.
          resposta: '$4$; \ $-\tfrac12$; \ $0$; \ $x=2$ zera o denominador'

        - enunciado: Sabendo que $f(2x+1)=6x-1$, calcule $f(7)$ e determine $f(x)$.
          resolucao: |
            $2x+1=7\Rightarrow x=3$, então $f(7)=18-1=17$.
            Com $t=2x+1$: $x=\tfrac{t-1}2$ e $f(t)=6\cdot\tfrac{t-1}2-1=3t-4$. Logo, $f(x)=3x-4$ (confira: $f(7)=17$).
          resposta: '$f(7)=17$; \ $f(x)=3x-4$'

        - enunciado: Uma função $f(x)=ax+b$ satisfaz $f(1)=5$ e $f(3)=11$. Determine $a$ e $b$.
          resolucao: |
            $a+b=5$ e $3a+b=11$. Subtraindo: $2a=6\Rightarrow a=3$; então $b=2$.
          resposta: '$a=3$, \ $b=2$'

        - enunciado: A circunferência $x^2+y^2=25$ é o gráfico de uma função $y=f(x)$? Use o teste da reta vertical.
          resolucao: |
            A reta vertical $x=3$ corta a circunferência em $(3,4)$ e $(3,-4)$.
            Um mesmo $x$ teria duas imagens, então não é gráfico de função.
          resposta: 'não'

        - enunciado: 'A função $f:\mathbb{N}\to\mathbb{N}$ associa a cada número o resto de sua divisão por $3$. Calcule $f(10)$, $f(17)$ e $f(21)$ e determine a imagem de $f$.'
          resolucao: |
            $10=3\cdot3+1$, $17=3\cdot5+2$ e $21=3\cdot7+0$: $f(10)=1$, $f(17)=2$ e $f(21)=0$.
            Os restos possíveis são $0$, $1$ e $2$: $Im=\{0,1,2\}$.
          resposta: '$1$, $2$, $0$; \ $Im=\{0,1,2\}$'

        - enunciado: 'Considere $f(x)=\begin{cases}x+1, & \text{se } x<0\\ x^2, & \text{se } x\ge0\end{cases}$. \ Calcule $f(-3)$, $f(0)$ e $f(2)$.'
          resolucao: |
            $-3<0$: $f(-3)=-2$. \ $0\ge0$: $f(0)=0$. \ $2\ge0$: $f(2)=4$.
          resposta: '$-2$; \ $0$; \ $4$'

        - enunciado: Dada $f(x)=5x-3$, calcule $f(a+1)-f(a)$.
          resolucao: |
            $f(a+1)=5a+2$. Então $f(a+1)-f(a)=5a+2-(5a-3)=5$.
          resposta: '$5$'

        - enunciado: Dada $f(x)=x^2-4x+3$, determine os valores de $x$ para os quais $f(x)=3$.
          resolucao: |
            $x^2-4x+3=3\Rightarrow x^2-4x=0\Rightarrow x(x-4)=0$. Logo, $x=0$ ou $x=4$.
          resposta: '$x=0$ ou $x=4$'

    - nome: Desafio
      questoes:
        - enunciado: Uma função satisfaz $f(x+y)=f(x)+f(y)$ para quaisquer reais $x$ e $y$, e $f(1)=3$. Calcule $f(2)$, $f(0)$ e $f(5)$.
          resolucao: |
            $f(2)=f(1+1)=3+3=6$.
            $f(0)=f(0+0)=2f(0)\Rightarrow f(0)=0$.
            $f(5)=f(2)+f(2)+f(1)=6+6+3=15$.
          resposta: '$6$; \ $0$; \ $15$'

        - enunciado: Dada $f(x)=\dfrac{2x+3}{x-1}$, determine $x$ tal que $f(x)=3$.
          resolucao: |
            $2x+3=3(x-1)\Rightarrow 2x+3=3x-3\Rightarrow x=6$ (e $6\neq1$, então vale).
          resposta: '$x=6$'

        - enunciado: Sendo $n(A)=3$ e $n(B)=2$, quantas funções de $A$ em $B$ existem? E quantas relações de $A$ em $B$?
          resolucao: |
            Funções: cada um dos $3$ elementos de $A$ escolhe $1$ de $2$ imagens, $2^3=8$.
            Relações: subconjuntos de $A\times B$, que tem $6$ pares, $2^6=64$.
          resposta: '$8$ funções; $64$ relações'

        - enunciado: Uma função é definida por $f(1)=2$ e $f(n+1)=2f(n)-1$. Calcule $f(2)$, $f(3)$, $f(4)$ e $f(5)$.
          resolucao: |
            $f(2)=3$, \ $f(3)=5$, \ $f(4)=9$, \ $f(5)=17$ (cada termo é o dobro do anterior menos $1$).
          resposta: '$3$, $5$, $9$, $17$'

        - enunciado: Um plano de telefonia cobra R\$\,40{,}00 fixos com $100$ minutos inclusos, mais R\$\,0{,}50 por minuto excedente. Escreva o custo $C(m)$ para $m>100$ e calcule $C(130)$.
          resolucao: |
            Para $m>100$: $C(m)=40+0{,}5(m-100)$.
            $C(130)=40+0{,}5\cdot30=55$ reais.
          resposta: '$C(m)=40+0{,}5(m-100)$; \ R\$\,55{,}00'

vestibular:
  intro: Questões autorais no estilo dos principais vestibulares. Assinale uma única alternativa.
  questoes:
    - enunciado: 'Sendo $A=\{1,2,3\}$ e $B=\{a,b\}$, a relação de $A$ em $B$ que é uma função é'
      opcoes: ['$\{(1,a),(2,b)\}$', '$\{(1,a),(1,b),(2,a),(3,b)\}$', '$\{(1,b),(2,b),(3,b)\}$', '$\{(1,a),(2,a),(2,b),(3,a)\}$', '$\{(2,a),(3,b)\}$']
      correta: C
      resolucao: |
        Todos os elementos de $A$ têm exatamente uma imagem (a mesma, o que é permitido). Em A e E falta imagem para algum elemento; em B e D há elemento com duas imagens.

    - enunciado: Se $f(x)=2x^2-3x+1$, então $f(-1)$ vale
      opcoes: ['$2$', '$6$', '$8$', '$10$', '$12$']
      correta: B
      resolucao: |
        $2(-1)^2-3(-1)+1=2+3+1=6$.

    - enunciado: Uma função $f(x)=ax+b$ satisfaz $f(0)=4$ e $f(2)=10$. O valor de $f(5)$ é
      opcoes: ['$19$', '$20$', '$21$', '$23$', '$25$']
      correta: A
      resolucao: |
        $b=4$ e $2a+4=10\Rightarrow a=3$. Então $f(5)=15+4=19$.

    - enunciado: Em uma cidade, a corrida de táxi custa R\$\,4{,}80 de bandeirada mais R\$\,2{,}40 por quilômetro. Uma corrida que custou R\$\,40{,}80 teve
      opcoes: ['$10$ km', '$12$ km', '$14$ km', '$15$ km', '$17$ km']
      correta: D
      resolucao: |
        $4{,}8+2{,}4d=40{,}8\Rightarrow 2{,}4d=36\Rightarrow d=15$ km.

    - enunciado: Dada $f(x)=\dfrac{x+3}{x-1}$, o valor de $x$ para o qual $f(x)=2$ é
      opcoes: ['$1$', '$2$', '$3$', '$4$', '$5$']
      correta: E
      resolucao: |
        $x+3=2(x-1)\Rightarrow x+3=2x-2\Rightarrow x=5$.

    - enunciado: Se $f(3x-1)=6x+4$ para todo $x$ real, então $f(5)$ vale
      opcoes: ['$10$', '$14$', '$16$', '$26$', '$34$']
      correta: C
      resolucao: |
        $3x-1=5\Rightarrow x=2$. Então $f(5)=6\cdot2+4=16$. (Calcular $6\cdot5+4$ é o erro clássico.)

    - enunciado: Das curvas abaixo, a única que NÃO é gráfico de uma função $y=f(x)$ é
      opcoes: ['$y=x^2$', '$y=2x+1$', '$y=\sqrt x$, com $x\ge0$', '$x=y^2$', '$y=3$']
      correta: D
      resolucao: |
        Em $x=y^2$, o valor $x=4$ corresponde a $y=2$ e a $y=-2$: a reta vertical $x=4$ corta a curva em dois pontos.

    - enunciado: 'O número de funções de $\{1,2,3\}$ em $\{0,1\}$ é'
      opcoes: ['$6$', '$8$', '$9$', '$16$', '$64$']
      correta: B
      resolucao: |
        Cada um dos $3$ elementos escolhe uma de $2$ imagens: $2^3=8$.

    - enunciado: 'Seja $f:\{-2,-1,0,1,2\}\to\mathbb{Z}$, $f(x)=x^2-1$. A imagem de $f$ é'
      opcoes: ['$\{0,1,4\}$', '$\{-1,0,1,3\}$', '$\{-1,3\}$', '$\{0,3\}$', '$\{-1,0,3\}$']
      correta: E
      resolucao: |
        $f(\pm2)=3$, $f(\pm1)=0$ e $f(0)=-1$. Logo, $Im=\{-1,0,3\}$.

    - enunciado: Se $f(x)=3x-7$ e $f(a)=8$, então $a$ vale
      opcoes: ['$5$', '$7$', '$8$', '$17$', '$31$']
      correta: A
      resolucao: |
        $3a-7=8\Rightarrow a=5$. A alternativa D é $f(8)$, outra coisa.

    - enunciado: 'Considere $f(x)=\begin{cases}2x, & \text{se } x\le1\\ x+5, & \text{se } x>1\end{cases}$. \ O valor de $f(1)+f(2)$ é'
      opcoes: ['$7$', '$9$', '$10$', '$11$', '$13$']
      correta: B
      resolucao: |
        $f(1)=2$ (pois $1\le1$) e $f(2)=7$. Soma: $9$.

    - enunciado: Uma função satisfaz $f(x+1)=f(x)+2$ para todo $x$ real, e $f(0)=3$. O valor de $f(10)$ é
      opcoes: ['$13$', '$15$', '$20$', '$21$', '$23$']
      correta: E
      resolucao: |
        Cada passo de $1$ em $x$ soma $2$: $f(10)=3+10\cdot2=23$.

    - enunciado: Uma escola aluga um ônibus por R\$\,600{,}00, valor dividido igualmente entre os $n$ alunos que vão ao passeio, ou seja, cada um paga $P(n)=\dfrac{600}{n}$. Se $40$ alunos forem, cada um pagará
      opcoes: ['R\$\,15{,}00', 'R\$\,20{,}00', 'R\$\,24{,}00', 'R\$\,30{,}00', 'R\$\,40{,}00']
      correta: A
      resolucao: |
        $P(40)=\tfrac{600}{40}=15$ reais.

    - enunciado: Se $f(x)=x^2$ e $f(a)=49$, os possíveis valores de $a$ são
      opcoes: ['apenas $7$', 'apenas $-7$', '$\pm\sqrt7$', '$\pm7$', '$49$']
      correta: D
      resolucao: |
        $a^2=49\Rightarrow a=7$ ou $a=-7$. Dois elementos do domínio com a mesma imagem não violam a definição de função.

    - enunciado: Uma função satisfaz $f(x+y)=f(x)\cdot f(y)$ para quaisquer reais $x$ e $y$, e $f(1)=2$. O valor de $f(3)$ é
      opcoes: ['$2$', '$6$', '$8$', '$9$', '$16$']
      correta: C
      resolucao: |
        $f(2)=f(1)f(1)=4$ e $f(3)=f(2)f(1)=8$.

    - enunciado: 'Uma função $f:\mathbb{R}\to\mathbb{R}$ satisfaz $f(2x)=4x+1$. Então $f(x)$ é igual a'
      opcoes: ['$4x+1$', '$8x+1$', '$2x+\tfrac12$', '$x+1$', '$2x+1$']
      correta: E
      resolucao: |
        Com $t=2x$: $f(t)=2t+1$. Confira: $f(2x)=2(2x)+1=4x+1$.

    - enunciado: 'Na tabela de uma função, para $x=1,2,3,4$ obtêm-se, respectivamente, $y=3,6,11,18$. Mantido o padrão $y=x^2+2$, o valor de $y$ para $x=5$ é'
      opcoes: ['$25$', '$27$', '$29$', '$30$', '$38$']
      correta: B
      resolucao: |
        $5^2+2=27$. As diferenças $3,5,7$ continuam com $9$: $18+9=27$.

    - enunciado: 'Das leis abaixo, a única que define corretamente uma função $f:\mathbb{R}\to\mathbb{R}$ é'
      opcoes: ['$f(x)=\dfrac1x$', '$f(x)=\sqrt x$', '$f(x)=\pm x$', '$f(x)=x^2-1$', '$f(x)=\dfrac1{x-1}$']
      correta: D
      resolucao: |
        Com domínio $\mathbb{R}$, todo real precisa ter uma única imagem. A e E falham em $0$ e em $1$; B falha nos negativos; C dá duas imagens.

    - enunciado: A função $f$ associa a cada natural $n\ge1$ o $n$-ésimo número ímpar positivo, ou seja, $f(n)=2n-1$. O valor de $f(50)$ é
      opcoes: ['$49$', '$98$', '$99$', '$100$', '$101$']
      correta: C
      resolucao: |
        $f(50)=2\cdot50-1=99$.

    - enunciado: Uma função $f(x)=ax^2+b$ satisfaz $f(1)=5$ e $f(2)=14$. O valor de $f(-3)$ é
      opcoes: ['$29$', '$31$', '$33$', '$35$', '$37$']
      correta: A
      resolucao: |
        $a+b=5$ e $4a+b=14\Rightarrow a=3$, $b=2$. Então $f(-3)=3\cdot9+2=29$.
