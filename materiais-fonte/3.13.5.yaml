# Aula 3.13.5 — Polinômios: teorema do resto e teorema de D'Alembert
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: resto da divisão por x − a é P(a); divisor x + a e ax − b (resto P(b/a)); D'Alembert: P(a) = 0 se e
# somente se x − a divide P; divisibilidade por (x − a)(x − b); parâmetros; resto da divisão por um produto de fatores
# (resto mx + n a partir de P(a) e P(b)); x^n − a^n e x^n + a^n; potências altas.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. O resto da divisão de $P(x)$ por $x - a$ é $P(a)$; se $P(a) = 0$, então $x - a$ divide $P(x)$. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Considere $P(x) = x^3 - 4x^2 + x + 6$. Complete com o resto da divisão de $P$ por cada divisor.'
      itens:
      - '$x - 1$: {{4}}'
      - '$x + 1$: {{0}}'
      - '$x - 2$: {{0}}'
      - '$x - 3$: {{0}}'
      espaco_item: 8
      resolucao: |
        $P(1) = 1 - 4 + 1 + 6 = 4$; $P(-1) = -1 - 4 - 1 + 6 = 0$; $P(2) = 8 - 16 + 2 + 6 = 0$; $P(3) = 27 - 36 + 3 + 6 = 0$. Logo $P(x) = (x + 1)(x - 2)(x - 3)$.
      resposta: '4; 0; 0; 0'
    - enunciado: 'Para $P(x) = x^2 + 2x - 3$, associe cada divisor ao resto da divisão.'
      esquerda:
      - '$x - 1$'
      - '$x + 1$'
      - '$x - 2$'
      - '$x + 2$'
      - '$x - 3$'
      direita:
      - '$5$'
      - '$0$'
      - '$-3$'
      - '$12$'
      - '$-4$'
      resolucao: |
        $P(1) = 0$; $P(-1) = -4$; $P(2) = 5$; $P(-2) = -3$; $P(3) = 12$.
      resposta: 'De cima para baixo: 3, 1, 4, 5, 2'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'O resto da divisão de $P(x)$ por $x - a$ é $P(a)$.'
      - 'O resto da divisão de $P(x)$ por $x + 3$ é $P(3)$.'
      - '$P(a) = 0$ se, e somente se, $x - a$ divide $P(x)$.'
      - 'O resto da divisão de $P(x)$ por $2x - 1$ é $P(2)$.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) (F) É $P(-3)$. (V) Teorema de D''Alembert. (F) É $P\left(\tfrac{1}{2}\right)$, a raiz do divisor.
      resposta: V, F, V, F
    - enunciado: 'Para $P(x) = 2x^3 - x^2 + 3$, complete com os restos.'
      tabela:
        cabecalho: ['Divisor', '$x - 1$', '$x + 1$', '$x - 2$', '$2x - 1$', '$x$']
        linhas:
        - ['Resto', '${{4}}$', '${{0}}$', '${{15}}$', '${{3}}$', '${{3}}$']
      resolucao: |
        $P(1) = 4$; $P(-1) = -2 - 1 + 3 = 0$; $P(2) = 16 - 4 + 3 = 15$; $P\left(\tfrac{1}{2}\right) = \tfrac{1}{4} - \tfrac{1}{4} + 3 = 3$; $P(0) = 3$.
      resposta: '4; 0; 15; 3; 3'
    - enunciado: 'Encontre $k$ para que $x^3 + kx - 6$ seja divisível por $x - 2$.'
      espaco: 8
      resolucao: |
        $P(2) = 8 + 2k - 6 = 0$: $k = -1$.
      resposta: '$k = -1$'
    - enunciado: 'Calcule os restos da divisão de $x^{50} - 2x + 1$ por $x - 1$ e por $x + 1$.'
      espaco: 8
      resolucao: |
        $P(1) = 1 - 2 + 1 = 0$; $P(-1) = 1 + 2 + 1 = 4$.
      resposta: '0 e 4'
    - enunciado: 'Use o teorema de D''Alembert para mostrar que $x - 3$ divide $x^3 - 27$ e que $x + 3$ divide $x^3 + 27$.'
      espaco: 8
      resolucao: |
        $3^3 - 27 = 0$ e $(-3)^3 + 27 = 0$.
      resposta: 'Ver resolução'
  - nome: Nível 2
    questoes:
    - texto: |
        Para achar o resto da divisão de $x^3 + 2x^2 - 5$ por $x + 2$, Léo calculou $P(2) = 8 + 8 - 5 = 11$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 8
      resolucao: |
        A raiz de $x + 2$ é $-2$: $P(-2) = -8 + 8 - 5 = -5$.
      resposta: '$-5$'
    - enunciado: 'Encontre $a$ e $b$ para que $x^3 + ax^2 + bx - 6$ seja divisível por $x - 1$ e por $x + 2$, e fatore o polinômio.'
      espaco: 12
      resolucao: |
        $P(1) = a + b - 5 = 0$ e $P(-2) = 4a - 2b - 14 = 0$: $a + b = 5$ e $2a - b = 7$, logo $a = 4$, $b = 1$. $x^3 + 4x^2 + x - 6 = (x - 1)(x + 2)(x + 3)$.
      resposta: '$a = 4$, $b = 1$; $(x - 1)(x + 2)(x + 3)$'
    - enunciado: 'Sabe-se que $P(1) = 2$ e $P(2) = 5$. Calcule o resto da divisão de $P$ por $x^2 - 3x + 2$.'
      espaco: 10
      resolucao: |
        $P(x) = (x - 1)(x - 2)Q(x) + mx + n$. Em $x = 1$: $m + n = 2$. Em $x = 2$: $2m + n = 5$. Logo $m = 3$, $n = -1$: resto $3x - 1$.
      resposta: '$3x - 1$'
    - enunciado: 'Calcule o resto da divisão de $3x^4 - 2x^2 + 5$ por $3x + 3$.'
      espaco: 8
      resolucao: |
        A raiz do divisor é $-1$: $P(-1) = 3 - 2 + 5 = 6$.
      resposta: '6'
    - enunciado: 'Um polinômio deixa resto 7 na divisão por $x - 2$ e resto $-2$ na divisão por $x + 1$. Complete.'
      itens:
      - '$P(2)$: {{7}}'
      - '$P(-1)$: {{-2}}'
      - 'Resto da divisão por $(x - 2)(x + 1)$: {{3x + 1}}'
      espaco_item: 8
      resolucao: |
        Resto $mx + n$: $2m + n = 7$ e $-m + n = -2$. Logo $m = 3$, $n = 1$.
      resposta: '7; $-2$; $3x + 1$'
    - enunciado: 'Para quais $n$ naturais o polinômio $x^n - 1$ é divisível por $x + 1$?'
      espaco: 8
      resolucao: |
        $(-1)^n - 1 = 0$ exatamente quando $n$ é par.
      resposta: '$n$ par'
    - enunciado: 'Encontre $m$ para que os restos das divisões de $x^2 + mx + 4$ por $x - 1$ e por $x + 1$ sejam iguais.'
      espaco: 8
      resolucao: |
        $5 + m = 5 - m$: $m = 0$.
      resposta: '$m = 0$'
    - enunciado: 'Encontre o polinômio $P$ de grau 2 com $P(1) = P(2) = 0$ e $P(0) = 4$.'
      espaco: 8
      resolucao: |
        Por D''Alembert, $P = a(x - 1)(x - 2)$. $P(0) = 2a = 4$: $a = 2$. $P(x) = 2x^2 - 6x + 4$.
      resposta: '$2x^2 - 6x + 4$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove o teorema do resto: o resto da divisão de $P(x)$ por $x - a$ é $P(a)$.'
      espaco: 10
      resolucao: |
        $P(x) = (x - a)Q(x) + R$, com $R$ constante (grau menor que 1). Em $x = a$: $P(a) = 0 \cdot Q(a) + R = R$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove o teorema de D''Alembert: $x - a$ divide $P(x)$ se, e somente se, $P(a) = 0$.'
      espaco: 10
      resolucao: |
        Pelo teorema do resto, o resto da divisão é $P(a)$. A divisão é exata exatamente quando esse resto é zero.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que o resto da divisão de $P(x)$ por $cx - d$ ($c \ne 0$) é $P\left(\frac{d}{c}\right)$.'
      espaco: 10
      resolucao: |
        $P(x) = (cx - d)Q(x) + R$, com $R$ constante. Em $x = \tfrac{d}{c}$, o divisor se anula: $R = P\left(\tfrac{d}{c}\right)$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que $x^n - a^n$ é divisível por $x - a$ para todo $n \ge 1$.'
      espaco: 8
      resolucao: |
        O polinômio vale $a^n - a^n = 0$ em $x = a$; por D''Alembert, $x - a$ o divide.
      resposta: 'Ver resolução'
    - enunciado: 'Sendo $a \ne b$, prove que $P$ é divisível por $(x - a)(x - b)$ se, e somente se, $P(a) = P(b) = 0$.'
      espaco: 12
      resolucao: |
        Se $P = (x - a)(x - b)Q$, então $P(a) = P(b) = 0$. Reciprocamente, $P(a) = 0$ dá $P = (x - a)Q_1$; então $0 = P(b) = (b - a)Q_1(b)$ e, como $b \ne a$, $Q_1(b) = 0$: $Q_1 = (x - b)Q_2$.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Num curso de programação, um professor explicou que, para saber se $x - 2$ é fator do polinômio $P(x) = x^3 - 3x^2 + 4$, não é preciso fazer a divisão inteira: basta calcular o resto pelo teorema do resto, substituindo $x$ pela raiz do divisor.
    enunciado: |
      O resto e a conclusão correta são
    opcoes: ['0, logo $x - 2$ é fator de $P$.', '4, logo $x - 2$ não é fator de $P$.', '$-4$, logo $x - 2$ não é fator de $P$.', '8, logo $x - 2$ não é fator de $P$.', '0, logo $x + 2$ é fator de $P$.']
    correta: A
    resolucao: |
      $P(2) = 8 - 12 + 4 = 0$: pelo teorema de D''Alembert, $x - 2$ divide $P$.

  - estilo: Fuvest
    enunciado: |
      O resto da divisão de $x^4 - 3x + 2$ por $x + 1$ é
    opcoes: ['$0$', '$6$', '$-2$', '$4$', '$2$']
    correta: B
    resolucao: |
      $P(-1) = 1 + 3 + 2 = 6$.

  - estilo: Unicamp
    enunciado: |
      O polinômio $x^3 - kx + 4$ é divisível por $x + 2$. O valor de $k$ é
    opcoes: ['$-2$.', '$4$.', '$2$.', '$6$.']
    correta: C
    resolucao: |
      $P(-2) = -8 + 2k + 4 = 0$: $k = 2$.

  - estilo: UEM
    enunciado: |
      Considere $P(x) = x^3 - 2x^2 - 5x + 6$. Assinale o que for correto.
    proposicoes:
    - '$P$ é divisível por $x - 1$.'
    - '$P$ é divisível por $x + 2$.'
    - '$P$ é divisível por $x - 3$.'
    - 'O resto da divisão de $P$ por $x - 2$ é $-4$.'
    - '$P$ é divisível por $x + 1$.'
    - '$P(x) = (x - 1)(x + 2)(x - 3)$.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) $P(1) = 0$. 02) $P(-2) = -8 - 8 + 10 + 6 = 0$. 04) $P(3) = 27 - 18 - 15 + 6 = 0$. 08) $P(2) = 8 - 8 - 10 + 6$. 16) Incorreta: $P(-1) = 8$. 32) Três raízes e coeficiente dominante 1.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      Um algoritmo de verificação de dados usa o polinômio $P(x) = x^{10} - x^5 + 1$. Em uma das etapas, o programa precisa do resto da divisão de $P(x)$ por $x + 1$, e o analista quer conferir o valor sem fazer a divisão completa, que seria longa.
    enunciado: |
      O resto dessa divisão é
    opcoes: ['$1$', '$-1$', '$0$', '$3$', '$2$']
    correta: D
    resolucao: |
      $P(-1) = 1 - (-1) + 1 = 3$.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir, sobre o resto da divisão de um polinômio $P(x)$.
    afirmativas:
    - 'O resto da divisão por $x - a$ é $P(a)$.'
    - 'O resto da divisão por $x + 2$ é $P(2)$.'
    - 'Se $P(3) = 0$, então $x - 3$ divide $P(x)$.'
    - 'O resto da divisão por $2x - 4$ é $P(2)$.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'I e III, apenas.', 'II e IV, apenas.', 'II, III e IV, apenas.', 'I, III e IV, apenas.']
    correta: E
    resolucao: |
      I. Correta. II. Incorreta: $P(-2)$. III. Correta. IV. Correta: a raiz de $2x - 4$ é 2.

  - estilo: Unesp
    enunciado: |
      O resto da divisão de $2x^3 - x + 5$ por $x - 1$ é
    opcoes: ['$6$', '$5$', '$4$', '$8$', '$2$']
    correta: A
    resolucao: |
      $2 - 1 + 5$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      O quadro mostra alguns valores de um polinômio $P$ de grau 3.
    tabela:
      cabecalho: ['$x$', '$-1$', '$0$', '$1$', '$2$']
      linhas:
      - ['$P(x)$', '$0$', '$3$', '$4$', '$0$']
    enunciado: |
      Pode-se afirmar que $P$ é divisível por
    opcoes: ['$x^2 - 1$.', '$x^2 - x - 2$.', '$x^2 + x - 2$.', '$x^2 - 2x$.']
    correta: B
    resolucao: |
      $P(-1) = P(2) = 0$: $P$ é divisível por $(x + 1)(x - 2) = x^2 - x - 2$.

  - estilo: Fuvest
    enunciado: |
      Um polinômio $P$ satisfaz $P(1) = 3$ e $P(-1) = 7$. O resto da divisão de $P$ por $x^2 - 1$ é
    opcoes: ['$2x + 5$', '$-2x - 5$', '$-2x + 5$', '$5x - 2$', '$3x + 7$']
    correta: C
    resolucao: |
      Resto $mx + n$: $m + n = 3$ e $-m + n = 7$. Logo $n = 5$, $m = -2$.

  - estilo: UFSC
    enunciado: |
      Considere divisibilidades de polinômios do tipo $x^n \pm 1$. Assinale o que for correto.
    proposicoes:
    - '$x^n - 1$ é divisível por $x - 1$ para todo $n \ge 1$.'
    - '$x^6 - 1$ é divisível por $x + 1$.'
    - '$x^5 + 1$ é divisível por $x + 1$.'
    - 'O resto da divisão de $x^4 + 1$ por $x + 1$ é 2.'
    - '$x^3 - 8$ é divisível por $x - 2$.'
    - '$x^4 + 1$ é divisível por $x + 1$.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) $1^n - 1 = 0$. 02) $(-1)^6 - 1 = 0$. 04) $(-1)^5 + 1 = 0$. 08) $(-1)^4 + 1$. 16) $8 - 8 = 0$. 32) Incorreta: o resto é 2.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      Um engenheiro modela uma grandeza pelo polinômio $P(x) = x^3 + ax - 10$, cujo gráfico aparece na figura. Ele sabe que o gráfico corta o eixo horizontal em $x = 2$ e precisa descobrir o coeficiente $a$ para completar o modelo.
    figura:
      tikz: |
        \begin{scope}[scale=.8]
        \draw[mudo, ->] (-1.4,0) -- (3,0) node[right, font=\scriptsize] {$x$};
        \draw[mudo, ->] (0,-1.6) -- (0,1.4) node[above, font=\scriptsize] {$y$};
        \draw[roxo, line width=1pt, domain=-1.2:2.6, samples=50] plot (\x, {0.1*(\x*\x*\x + \x - 10)});
        \fill[ink] (2,0) circle (1.5pt) node[below right, font=\scriptsize] {$2$};
        \end{scope}
    enunciado: |
      O valor de $a$ é
    opcoes: ['$1$', '$-1$', '$5$', '$2$', '$9$']
    correta: A
    resolucao: |
      $P(2) = 8 + 2a - 10 = 0$: $a = 1$.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'O resto da divisão de $x^2 + 5$ por $x - 1$ é 6.'
    - 'O resto da divisão de $x^3$ por $x + 1$ é 1.'
    - 'Se $P(-2) = 0$, então $x + 2$ divide $P(x)$.'
    - 'O resto da divisão de $P(x)$ por $3x - 1$ é $P\left(\frac{1}{3}\right)$.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – F – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – V – F.', 'V – F – V – V.']
    correta: E
    resolucao: |
      (V) (F) É $(-1)^3 = -1$. (V) (V)

  - estilo: Enem
    texto: |
      Um professor escreveu no quadro cinco polinômios e pediu aos alunos que descobrissem, sem fazer divisões, qual deles é divisível por $x - 2$. A turma lembrou que basta verificar qual polinômio se anula em $x = 2$.
    tabela:
      cabecalho: ['Nome', 'Polinômio']
      linhas:
      - ['T1', '$x^3 - 2x - 3$']
      - ['T2', '$x^3 - x^2 - 3$']
      - ['T3', '$x^3 - 4x + 1$']
      - ['T4', '$x^3 - 3x - 2$']
      - ['T5', '$x^3 + x^2 - 10$']
    enunciado: |
      O polinômio divisível por $x - 2$ é
    opcoes: ['T1.', 'T2.', 'T3.', 'T4.', 'T5.']
    correta: D
    resolucao: |
      Valores em 2: T1 1; T2 1; T3 1; T4 $8 - 6 - 2 = 0$; T5 2.

  - estilo: Unesp
    enunciado: |
      O polinômio $x^2 + mx + n$ deixa resto 3 na divisão por $x - 1$ e resto 7 na divisão por $x + 1$. O valor de $mn$ é
    opcoes: ['$8$', '$-8$', '$-2$', '$4$', '$6$']
    correta: B
    resolucao: |
      $1 + m + n = 3$ e $1 - m + n = 7$: $n = 4$, $m = -2$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      O polinômio $P(x) = x^3 + ax^2 + bx - 6$ é divisível por $x - 2$ e por $x - 3$. Assinale o que for correto.
    proposicoes:
    - '$a = -6$.'
    - '$b = 11$.'
    - '1 é raiz de $P$.'
    - '$P(0) = -6$.'
    - '$P$ é divisível por $x + 1$.'
    - 'O resto da divisão de $P$ por $x - 4$ é 6.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      $P(2) = 4a + 2b + 2 = 0$ e $P(3) = 9a + 3b + 21 = 0$: $2a + b = -1$ e $3a + b = -7$, logo $a = -6$, $b = 11$. $P = (x - 1)(x - 2)(x - 3)$. 16) Incorreta: $P(-1) = -24$. 32) $P(4) = 3 \cdot 2 \cdot 1$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Unicamp
    enunciado: |
      O resto da divisão de $x^{2025}$ por $x + 1$ é
    opcoes: ['$-1$.', '$1$.', '$0$.', '$2025$.']
    correta: A
    resolucao: |
      $(-1)^{2025} = -1$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Numa atividade, os alunos receberam o polinômio $P(x) = x^3 - 13x + 12$ e deviam encontrar as suas raízes testando alguns números com o teorema do resto: quando o resto da divisão por $x - a$ é zero, o número $a$ é raiz. Os números testados foram $-4$, $-1$, $1$, $2$, $3$ e $4$.
    enunciado: |
      O resto da divisão de $P$ por $x - 2$ é
    opcoes: ['$0$', '$6$', '$-6$', '$12$', '$-12$']
    correta: C
    resolucao: |
      $P(2) = 8 - 26 + 12 = -6$.

  - estilo: Unesp
    enunciado: |
      As raízes de $P$ são
    opcoes: ['$1$, $3$ e $4$.', '$-1$, $-3$ e $4$.', '$1$, $2$ e $-4$.', '$1$, $3$ e $-4$.', '$-1$, $3$ e $-4$.']
    correta: D
    resolucao: |
      $P(1) = 0$, $P(3) = 27 - 39 + 12 = 0$, $P(-4) = -64 + 52 + 12 = 0$; os outros testes dão resto não nulo.

  - estilo: Fuvest
    enunciado: |
      Dividindo $P$ por $x - 1$, obtém-se quociente $Q$ e resto 4; dividindo $Q$ por $x + 1$, obtém-se resto 3. O resto da divisão de $P$ por $x^2 - 1$ é
    opcoes: ['$4$', '$3x$', '$x + 3$', '$7$', '$3x + 1$']
    correta: E
    resolucao: |
      $P = (x - 1)[(x + 1)Q_2 + 3] + 4 = (x^2 - 1)Q_2 + 3x - 3 + 4$.

  - estilo: Unesp
    texto: |
      A figura mostra o gráfico de um polinômio $P$ de grau 3, que corta o eixo $x$ em $-1$, 2 e 4 e o eixo $y$ no ponto de ordenada 4.
    figura:
      tikz: |
        \begin{scope}[scale=.65]
        \draw[mudo, ->] (-1.8,0) -- (5,0) node[right, font=\scriptsize] {$x$};
        \draw[mudo, ->] (0,-1.2) -- (0,1.6) node[above, font=\scriptsize] {$y$};
        \draw[roxo, line width=1pt, domain=-1.3:4.4, samples=60] plot (\x, {0.15*(\x+1)*(\x-2)*(\x-4)});
        \foreach \t in {-1, 2, 4} \fill[ink] (\t,0) circle (1.5pt) node[below, font=\scriptsize] {$\t$};
        \fill[ink] (0,1.2) circle (1.5pt) node[right, font=\scriptsize] {$4$};
        \end{scope}
    enunciado: |
      O resto da divisão de $P$ por $x - 1$ é
    opcoes: ['$0$', '$3$', '$-3$', '$4$', '$6$']
    correta: B
    resolucao: |
      Por D''Alembert, $P(x) = c(x + 1)(x - 2)(x - 4)$; $P(0) = 8c = 4$, $c = \tfrac{1}{2}$. Resto $P(1) = \tfrac{1}{2} \cdot 2 \cdot (-1) \cdot (-3) = 3$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere um polinômio $P(x)$ e um número real $a$.'
    itens:
    - 'Prove que o resto da divisão de $P$ por $x - a$ é $P(a)$.'
    - 'Prove que $x - a$ divide $P$ se, e somente se, $P(a) = 0$.'
    - 'Use os itens para provar que $x^n - a^n$ é divisível por $x - a$ e calcule o resto da divisão de $x^n + a^n$ por $x - a$.'
    espaco: 62
    resolucao: |
      a) $P = (x - a)Q + R$, $R$ constante; em $x = a$: $R = P(a)$.
      b) A divisão é exata quando o resto, $P(a)$, é zero.
      c) $a^n - a^n = 0$. O resto de $x^n + a^n$ é $a^n + a^n = 2a^n$.
    resposta: 'c) $2a^n$'

  - estilo: Unicamp
    enunciado: 'O resto da divisão de um polinômio por $(x - 1)(x - 2)(x - 3)$ tem grau no máximo 2: $R(x) = ax^2 + bx + c$.'
    itens:
    - 'Prove que $R(1) = P(1)$, $R(2) = P(2)$ e $R(3) = P(3)$.'
    - 'Para $P(x) = x^5$, monte o sistema para $a$, $b$ e $c$.'
    - 'Resolva o sistema e escreva o resto.'
    espaco: 62
    resolucao: |
      a) $P = (x - 1)(x - 2)(x - 3)Q + R$; em $x = 1, 2, 3$ o primeiro termo se anula.
      b) $a + b + c = 1$; $4a + 2b + c = 32$; $9a + 3b + c = 243$.
      c) Subtraindo: $3a + b = 31$ e $5a + b = 211$, logo $a = 90$, $b = -239$, $c = 150$. $R = 90x^2 - 239x + 150$.
    resposta: 'c) $90x^2 - 239x + 150$'

  - estilo: ITA
    enunciado: |
      O resto da divisão de $x^{100} + x^{50} + 1$ por $x^2 + x$ é
    opcoes: ['$1$', '$3$', '$-2x + 1$', '$2x + 1$', '$x + 3$']
    correta: C
    espaco: 22
    resolucao: |
      $x^2 + x = x(x + 1)$. Resto $mx + n$: em $x = 0$, $n = 1$; em $x = -1$, $-m + 1 = 3$, $m = -2$.
    resposta: 'C'

  - estilo: Unesp
    enunciado: 'Um polinômio $P$ de grau 3 e coeficiente dominante 1 é divisível por $x^2 - 4$ e deixa resto 6 na divisão por $x - 1$.'
    itens:
    - 'Escreva $P$ na forma $(x^2 - 4)(x + c)$ e encontre $c$.'
    - 'Escreva $P$ desenvolvido e dê as suas raízes.'
    - 'Calcule o resto da divisão de $P$ por $x + 1$.'
    espaco: 62
    resolucao: |
      a) $P(1) = -3(1 + c) = 6$: $c = -3$.
      b) $x^3 - 3x^2 - 4x + 12$; raízes $2$, $-2$ e $3$.
      c) $P(-1) = -1 - 3 + 4 + 12 = 12$.
    resposta: 'a) $c = -3$; b) 2, $-2$ e 3; c) 12'

  - estilo: UFSC
    enunciado: |
      Considere o teorema do resto e o de D''Alembert. Assinale o que for correto.
    proposicoes:
    - 'O resto da divisão de $P(x)$ por $x - a$ é $P(a)$.'
    - 'O resto da divisão de $x^7$ por $x + 1$ é $-1$.'
    - 'Se $P(2) = 0$, então $x - 2$ divide $P(x)$.'
    - 'O resto da divisão de $P(x)$ por $2x + 1$ é $P\left(-\frac{1}{2}\right)$.'
    - '$x^3 + 8$ é divisível por $x - 2$.'
    - '$x^3 + 8$ é divisível por $x + 2$.'
    corretas: [1, 2, 3, 4, 6]
    espaco: 22
    resolucao: |
      01) Correta. 02) $(-1)^7$. 04) Correta. 08) Raiz do divisor. 16) Incorreta: $8 + 8 = 16$. 32) $-8 + 8 = 0$.
    resposta: 'Soma 47 (01 + 02 + 04 + 08 + 32)'

  - estilo: Fuvest
    enunciado: 'Considere os polinômios $x^n + 1$, com $n$ natural.'
    itens:
    - 'Prove que $x^n + 1$ é divisível por $x + 1$ se, e somente se, $n$ é ímpar.'
    - 'Qual é o resto da divisão de $x^n + 1$ por $x + 1$ quando $n$ é par?'
    - 'Use o item a para fatorar $x^3 + 1$ e $x^5 + 1$ com um fator $x + 1$.'
    espaco: 62
    resolucao: |
      a) O resto é $(-1)^n + 1$, que é 0 para $n$ ímpar e 2 para $n$ par.
      b) 2.
      c) $(x + 1)(x^2 - x + 1)$ e $(x + 1)(x^4 - x^3 + x^2 - x + 1)$.
    resposta: 'b) 2; c) $(x + 1)(x^2 - x + 1)$ e $(x + 1)(x^4 - x^3 + x^2 - x + 1)$'

  - estilo: Unicamp
    enunciado: 'Um polinômio $P$ deixa resto 4 na divisão por $x + 1$ e resto 10 na divisão por $x - 2$.'
    itens:
    - 'Escreva $P(-1)$ e $P(2)$.'
    - 'Calcule o resto da divisão de $P$ por $(x + 1)(x - 2)$.'
    - 'Dê um exemplo de polinômio de grau 2 com essas propriedades.'
    espaco: 62
    resolucao: |
      a) $P(-1) = 4$ e $P(2) = 10$.
      b) $mx + n$: $-m + n = 4$ e $2m + n = 10$: $m = 2$, $n = 6$. Resto $2x + 6$.
      c) $(x + 1)(x - 2) + 2x + 6 = x^2 + x + 4$.
    resposta: 'b) $2x + 6$; c) por exemplo, $x^2 + x + 4$'

  - estilo: Fuvest
    enunciado: |
      O polinômio $x^3 + mx^2 + nx + 2$ é divisível por $x^2 - 1$. O valor de $mn$ é
    opcoes: ['$-2$', '$1$', '$2$', '$-1$', '$3$']
    correta: C
    espaco: 22
    resolucao: |
      $P(1) = 3 + m + n = 0$ e $P(-1) = 1 + m - n = 0$: $m = -2$, $n = -1$.
    resposta: 'C'

  - estilo: Unesp
    enunciado: 'Considere $P(x) = (x - 1)^{10} + (x - 2)^{10}$.'
    itens:
    - 'Calcule $P(1)$ e $P(2)$.'
    - 'Calcule o resto da divisão de $P$ por $(x - 1)(x - 2)$.'
    - 'Calcule o resto da divisão de $P$ por $x$.'
    espaco: 62
    resolucao: |
      a) $P(1) = 0 + 1 = 1$; $P(2) = 1 + 0 = 1$.
      b) $mx + n$ com $m + n = 1$ e $2m + n = 1$: $m = 0$, $n = 1$. Resto 1.
      c) $P(0) = 1 + 1024 = 1025$.
    resposta: 'a) 1 e 1; b) 1; c) 1025'

  - estilo: Fuvest
    enunciado: 'Considere $P(x) = x^4 - 5x^2 + 4$.'
    itens:
    - 'Teste os números $\pm 1$ e $\pm 2$ com o teorema do resto.'
    - 'Use o teorema de D''Alembert para fatorar $P$.'
    - 'Calcule o resto da divisão de $P$ por $x - 3$ e confira com a fatoração.'
    espaco: 62
    resolucao: |
      a) $P(\pm 1) = 1 - 5 + 4 = 0$; $P(\pm 2) = 16 - 20 + 4 = 0$.
      b) Quatro raízes e coeficiente dominante 1: $(x - 1)(x + 1)(x - 2)(x + 2)$.
      c) $P(3) = 81 - 45 + 4 = 40 = 2 \cdot 4 \cdot 1 \cdot 5$.
    resposta: 'b) $(x - 1)(x + 1)(x - 2)(x + 2)$; c) 40'
