    enunciado: |
      A área do quadrado sombreado é
    opcoes: ['$49$', '$58$', '$42$', '$64$', '$50$']
    correta: B
    resolucao: |
      Lado sombreado: $\sqrt{3^2 + 7^2} = \sqrt{58}$, área $58$. (Ou: $100 - 4 \cdot \tfrac{3 \cdot 7}{2} = 58$.)

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Demonstre as fórmulas de área a seguir, a partir da área do retângulo.'
    itens:
    - 'Paralelogramo de base $b$ e altura $h$: $A = bh$.'
    - 'Trapézio de bases $B$ e $b$ e altura $h$: $A = \frac{(B + b)h}{2}$.'
    - 'Quadrilátero convexo de diagonais perpendiculares $D$ e $d$: $A = \frac{Dd}{2}$.'
    espaco: 62
    resolucao: |
      a) A altura por um vértice corta um triângulo retângulo numa ponta; levado para a outra ponta, ele encaixa e forma um retângulo $b \times h$.
      b) Duas cópias, uma girada de $180°$, formam um paralelogramo de base $B + b$ e altura $h$; o trapézio é metade dele.
      c) As paralelas às diagonais pelos vértices formam um retângulo $D \times d$, dividido em quatro retângulos; cada triângulo do quadrilátero é metade de um deles.
    resposta: 'Ver resolução'

  - estilo: Unicamp
    texto: |
      Um sitiante tem 60 m de tela para cercar um galinheiro retangular. Um dos lados do galinheiro ficará encostado num muro e não precisa de tela.
    enunciado: ''
    itens:
    - 'Sendo $x$ a medida de cada lado perpendicular ao muro, escreva a área em função de $x$.'
    - 'Determine as dimensões de área máxima e essa área.'
    - 'Compare com a área máxima que ele cercaria, com os mesmos 60 m de tela, sem usar o muro.'
    espaco: 62
    resolucao: |
      a) O lado paralelo ao muro mede $60 - 2x$: $A = x(60 - 2x) = 60x - 2x^2$.
      b) $A = 450 - 2(x - 15)^2$: máximo em $x = 15$; dimensões $15$ m e $30$ m, área $450$ m².
      c) Sem o muro, o melhor é um quadrado de lado 15: $225$ m². Com o muro, a área dobra.
    resposta: 'b) 15 m por 30 m, 450 m²; c) 225 m²'

  - estilo: ITA
    enunciado: |
      As diagonais de um quadrilátero convexo medem 10 e 16 e formam um ângulo de $30°$. A área do quadrilátero é
    opcoes: ['$80$', '$40\sqrt{3}$', '$40$', '$20$', '$80\sqrt{3}$']
    correta: C
    espaco: 22
    resolucao: |
      Pelas paralelas às diagonais, o quadrilátero é metade de um paralelogramo de lados 10 e 16 com ângulo de $30°$, cuja área é $16 \cdot (10 \cdot \tfrac{1}{2}) = 80$. Área $40$.
    resposta: 'C'

  - estilo: Unesp
    enunciado: 'Um trapézio isósceles tem bases 21 e 9 e laterais 10.'
    itens:
    - 'Calcule a altura.'
    - 'Calcule a área.'
    - 'Calcule a medida das diagonais.'
    espaco: 62
    resolucao: |
      a) Projeção $\tfrac{21 - 9}{2} = 6$; $h = \sqrt{100 - 36} = 8$.
      b) $\tfrac{30 \cdot 8}{2} = 120$.
      c) A projeção da diagonal sobre a base maior mede $21 - 6 = 15$: $\sqrt{225 + 64} = 17$.
    resposta: 'a) 8; b) 120; c) 17'

  - estilo: UFSC
    enunciado: |
      Assinale o que for correto.
    proposicoes:
    - 'Um quadrado de diagonal 8 tem área 32.'
    - 'Um losango de diagonais $2x$ e $3x$ tem área $3x^2$.'
    - 'Um paralelogramo de lados 6 e 4 tem área menor ou igual a 24.'
    - 'Um trapézio de base média 12 e altura 5 tem área 60.'
    - 'Triplicando todas as dimensões de um retângulo, a área triplica.'
    - '$1$ km² equivale a 100 ha.'
    corretas: [1, 2, 3, 4, 6]
    espaco: 22
    resolucao: |
      01) $\tfrac{64}{2}$. 02) $\tfrac{6x^2}{2}$. 04) A altura é no máximo 4. 08) A área é base média vezes altura. 16) Incorreta: fica 9 vezes maior. 32) $\tfrac{1\,000\,000}{10\,000}$.
    resposta: 'Soma 47 (01 + 02 + 04 + 08 + 32)'

  - estilo: Fuvest
    enunciado: 'No quadrado $ABCD$ de lado 12, $E$ é o ponto médio de $AB$ e $F$ é o ponto médio de $BC$.'
    itens:
    - 'Calcule a área do triângulo retângulo $EBF$.'
    - 'Calcule a área do pentágono $AEFCD$.'
    - 'Calcule a área do triângulo $DEF$.'
    espaco: 62
    resolucao: |
      a) Metade de um retângulo $6 \times 6$: $18$.
      b) $144 - 18 = 126$.
      c) Retirando de $144$ os triângulos retângulos $DAE$ ($36$), $EBF$ ($18$) e $FCD$ ($36$): $144 - 90 = 54$.
    resposta: 'a) 18; b) 126; c) 54'

  - estilo: Unicamp
    enunciado: 'Num quadrilátero convexo $ABCD$, os pontos $M$, $N$, $P$ e $Q$ são os pontos médios dos lados.'
    itens:
    - 'Mostre que o triângulo $AMQ$ tem área igual a $\frac{1}{4}$ da área do triângulo $ABD$.'
    - 'Conclua que a área de $MNPQ$ é metade da área de $ABCD$.'
    - 'Aplique a um losango de diagonais 12 e 16 e descreva $MNPQ$.'
    espaco: 62
    resolucao: |
      a) $MQ$ é base média de $ABD$: os triângulos $AMQ$ e $ABD$ têm a mesma forma, com lados pela metade; a base e a altura caem à metade, e a área, a um quarto.
      b) Os cantos $AMQ$ e $CNP$ somam $\tfrac{1}{4}$ de $ABD$ mais $\tfrac{1}{4}$ de $CBD$: $\tfrac{1}{4}$ de $ABCD$. Do mesmo modo, $BMN$ e $DPQ$ somam $\tfrac{1}{4}$. Sobra metade.
      c) Losango: $\tfrac{12 \cdot 16}{2} = 96$; $MNPQ$ é um retângulo $6 \times 8$, de área $48$.
    resposta: 'c) retângulo $6 \times 8$, área 48'

  - estilo: Fuvest
    enunciado: |
      Um retângulo tem área 48 e diagonal 10. O seu perímetro é
    opcoes: ['$28$', '$24$', '$32$', '$20$', '$14$']
    correta: A
    espaco: 22
    resolucao: |
      $(a + b)^2 = a^2 + b^2 + 2ab = 100 + 96 = 196$: $a + b = 14$, perímetro $28$.
    resposta: 'A'

  - estilo: Unesp
    texto: |
      Um sítio tem a forma de um trapézio retângulo, com bases de 300 m e 200 m e altura de 150 m.
    enunciado: ''
    itens:
    - 'Calcule a área em m² e em hectares.'
    - 'Se o hectare na região custa R\$\,20\,000,00, quanto vale o sítio?'
    - 'Um segmento perpendicular às bases divide o sítio num retângulo e num triângulo retângulo. Calcule a área de cada parte.'
    espaco: 62
    resolucao: |
      a) $\tfrac{500 \cdot 150}{2} = 37\,500$ m² $= 3{,}75$ ha.
      b) $3{,}75 \cdot 20\,000 = 75\,000$ reais.
      c) Retângulo $200 \times 150 = 30\,000$ m²; triângulo, metade de $100 \times 150$: $7\,500$ m².
    resposta: 'a) $37\,500$ m², 3,75 ha; b) R\$\,75\,000,00; c) $30\,000$ e $7\,500$ m²'

  - estilo: Fuvest
    enunciado: 'Seja $P$ um ponto interior de um paralelogramo $ABCD$ de área 60.'
    itens:
    - 'Mostre que as distâncias de $P$ às retas $AB$ e $CD$ somam a altura do paralelogramo relativa a $AB$.'
    - 'Prove que as áreas dos triângulos $PAB$ e $PCD$ somam metade da área do paralelogramo.'
    - 'Se $P$ é o centro, calcule a área de cada um dos quatro triângulos $PAB$, $PBC$, $PCD$ e $PDA$.'
    espaco: 62
    resolucao: |
      a) $AB$ e $CD$ são paralelas; a perpendicular a elas por $P$ é cortada por $P$ em duas partes, $h_1$ e $h_2$, que somam a distância $h$ entre as retas.
      b) $\tfrac{AB \cdot h_1}{2} + \tfrac{CD \cdot h_2}{2} = \tfrac{AB(h_1 + h_2)}{2} = \tfrac{AB \cdot h}{2} = 30$.
      c) Pelo item b), $PAB$ e $PCD$ somam 30 e, pela simetria do centro, são iguais: 15 cada. O mesmo vale para $PBC$ e $PDA$.
    resposta: 'b) 30; c) 15 cada'
