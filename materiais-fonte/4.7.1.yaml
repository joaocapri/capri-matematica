# Aula 4.7.1 — Geometria plana: áreas de quadriláteros
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: áreas do retângulo, do quadrado (também pela diagonal), do paralelogramo (bh), do trapézio, do losango e de
# quadriláteros com diagonais perpendiculares (Dd/2); unidades de área e hectare; retângulo de área máxima com perímetro fixo;
# quadrilátero dos pontos médios (metade da área). Áreas de triângulos ficam para a 4.7.2 (aqui, só metade de retângulo).
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Complete o quadro com a área de cada figura.'
      tabela:
        cabecalho: ['Figura', 'Dados', 'Área']
        linhas:
        - ['retângulo', 'lados 7 e 5', '${{35}}$']
        - ['quadrado', 'lado 9', '${{81}}$']
        - ['paralelogramo', 'base 12, altura 5', '${{60}}$']
        - ['losango', 'diagonais 14 e 8', '${{56}}$']
        - ['trapézio', 'bases 11 e 7, altura 6', '${{54}}$']
      resolucao: |
        $7 \cdot 5$; $9^2$; $12 \cdot 5$; $\tfrac{14 \cdot 8}{2}$; $\tfrac{(11 + 7) \cdot 6}{2}$.
      resposta: '35; 81; 60; 56; 54'
    - enunciado: 'Associe as medidas equivalentes.'
      esquerda:
      - '$1$ m²'
      - '$1$ km²'
      - '$1$ ha (hectare)'
      - '$1$ cm²'
      - '$1$ dm²'
      direita:
      - '$100$ mm²'
      - '$10\,000$ m²'
      - '$100$ cm²'
      - '$10\,000$ cm²'
      - '$1\,000\,000$ m²'
      resolucao: |
        Na área, cada troca de unidade vizinha multiplica por $100$: $1$ m² $= 100^2$ cm². O hectare é um quadrado de $100$ m de lado.
      resposta: 'De cima para baixo: 4, 3, 5, 1, 2'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Dobrando o lado de um quadrado, a área dobra.'
      - 'A área de um paralelogramo é o produto de dois lados consecutivos.'
      - 'A área de um losango é a metade do produto das diagonais.'
      - 'Um paralelogramo e um retângulo de mesma base e mesma altura têm a mesma área.'
      justificar: true
      espaco: 20
      resolucao: |
        (F) Quadruplica: $(2\ell)^2 = 4\ell^2$. (F) É base vezes altura; o lado inclinado não é a altura. (V) (V) Ambos medem $bh$.
      resposta: F, F, V, V
    - enunciado: 'Complete.'
      itens:
      - 'Quadrado de área 49: lado {{7}}'
      - 'Quadrado de diagonal 10: área {{50}}'
      - 'Retângulo de área 72 e base 9: altura {{8}}'
      espaco_item: 10
      resolucao: |
        (a) $\sqrt{49}$. (b) O quadrado é um losango de diagonais iguais: $\tfrac{10 \cdot 10}{2} = 50$. (c) $\tfrac{72}{9}$.
      resposta: '7; 50; 8'
    - enunciado: 'Calcule a área do paralelogramo da figura.'
      figura:
        tikz: |
          \begin{scope}[scale=.3]
          \draw[ink, line width=1pt, fill=lilas!25] (0,0) -- (10,0) -- (14.47,4) -- (4.47,4) -- cycle;
          \draw[roxo, dashed] (4.47,4) -- (4.47,0);
          \draw[mudo] (4.47,0.6) -- (5.07,0.6) -- (5.07,0);
          \node[below, font=\scriptsize] at (5,0) {$10$};
          \node[left, font=\scriptsize] at (1.9,2.4) {$6$};
          \node[right, font=\scriptsize] at (4.5,2) {$4$};
          \end{scope}
      espaco: 8
      resolucao: |
        Base 10 e altura 4: $A = 40$. O lado 6 não entra na conta.
      resposta: '40'
    - enunciado: 'Um trapézio tem bases 15 e 9 e altura 8. Calcule a área.'
      espaco: 8
      resolucao: |
        $\tfrac{(15 + 9) \cdot 8}{2} = 96$.
      resposta: '96'
    - enunciado: 'Uma sala retangular mede 4,5 m por 3,2 m. Cada caixa de piso cobre 2 m². Quantas caixas, no mínimo, devem ser compradas?'
      espaco: 8
      resolucao: |
        Área $4{,}5 \cdot 3{,}2 = 14{,}4$ m²; $\tfrac{14{,}4}{2} = 7{,}2$: são necessárias 8 caixas.
      resposta: '8 caixas'
  - nome: Nível 2
    questoes:
    - texto: |
        Para a área de um losango de lado 5 e diagonais 6 e 8, Bia fez $5 \cdot 5 = 25$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 10
      resolucao: |
        Lado vezes lado só vale para o quadrado. No losango, $A = \tfrac{Dd}{2} = \tfrac{6 \cdot 8}{2} = 24$.
      resposta: '24'
    - enunciado: 'Um trapézio isósceles tem bases 16 e 6 e laterais 13. Calcule a área.'
      espaco: 10
      resolucao: |
        Projeção da lateral: $\tfrac{16 - 6}{2} = 5$; altura $\sqrt{169 - 25} = 12$. $A = \tfrac{22 \cdot 12}{2} = 132$.
      resposta: '132'
    - enunciado: 'Um retângulo tem perímetro 34 e diagonal 13. Calcule a área.'
      espaco: 12
      resolucao: |
        $a + b = 17$ e $a^2 + b^2 = 169$: $2ab = 289 - 169 = 120$, $ab = 60$.
      resposta: '60'
    - enunciado: 'Um losango tem lado 13 e uma diagonal de 24. Calcule a área.'
      espaco: 10
      resolucao: |
        Metade da outra diagonal: $\sqrt{169 - 144} = 5$; diagonal 10. $A = \tfrac{24 \cdot 10}{2} = 120$.
      resposta: '120'
    - enunciado: 'Todos os retângulos do quadro têm perímetro 20. Complete as áreas.'
      tabela:
        cabecalho: ['Base', 'Altura', 'Área']
        linhas:
        - ['$1$', '$9$', '${{9}}$']
        - ['$2$', '$8$', '${{16}}$']
        - ['$3$', '$7$', '${{21}}$']
        - ['$4$', '$6$', '${{24}}$']
        - ['$5$', '$5$', '${{25}}$']
      resolucao: |
        A área cresce à medida que os lados se aproximam; a maior é a do quadrado.
      resposta: '9; 16; 21; 24; 25'
    - enunciado: 'Um paralelogramo tem lados 8 e 6, e o ângulo entre eles mede $30°$. Calcule a área.'
      espaco: 10
      resolucao: |
        A altura relativa ao lado 8 é o cateto oposto a $30°$ num triângulo de hipotenusa 6: $h = 3$. $A = 8 \cdot 3 = 24$.
      resposta: '24'
    - enunciado: 'Um terreno retangular mede 250 m por 120 m. Complete.'
      itens:
      - 'Área em m²: {{30\,000}}'
      - 'Área em hectares: {{3}}'
      - 'Área em km²: {{0{,}03}}'
      espaco_item: 8
      resolucao: |
        $250 \cdot 120 = 30\,000$ m². $1$ ha $= 10\,000$ m² e $1$ km² $= 1\,000\,000$ m².
      resposta: '$30\,000$; $3$; $0{,}03$'
    - enunciado: 'Uma pipa tem diagonais perpendiculares de 10 cm e 16 cm. Calcule a área da pipa e a do quadrilátero cujos vértices são os pontos médios dos lados dela.'
      espaco: 12
      resolucao: |
        $A = \tfrac{10 \cdot 16}{2} = 80$ cm². O quadrilátero dos pontos médios é um retângulo de lados $\tfrac{10}{2}$ e $\tfrac{16}{2}$: $40$ cm², metade da pipa.
      resposta: '80 cm² e 40 cm²'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que a área de um paralelogramo de base $b$ e altura $h$ é $bh$.'
      espaco: 12
      resolucao: |
        Trace a altura por um vértice da base de cima. Ela corta um triângulo retângulo numa ponta; transportado para a outra ponta, ele encaixa exatamente (é congruente ao triângulo que falta). O resultado é um retângulo de base $b$ e altura $h$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que a área de um trapézio de bases $B$ e $b$ e altura $h$ é $\frac{(B + b)h}{2}$.'
      espaco: 12
      resolucao: |
        Duas cópias do trapézio, uma delas girada de $180°$, juntas pela lateral, formam um paralelogramo de base $B + b$ e altura $h$. Cada trapézio é metade: $\tfrac{(B + b)h}{2}$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que um quadrilátero convexo de diagonais perpendiculares, $D$ e $d$, tem área $\frac{Dd}{2}$.'
      espaco: 12
      resolucao: |
        Por cada vértice, trace a paralela à diagonal que não passa por ele. Forma-se um retângulo de lados $D$ e $d$. Cada um dos quatro triângulos do quadrilátero é metade de um dos quatro retângulos menores; logo, o quadrilátero é metade do retângulo: $\tfrac{Dd}{2}$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que, entre os retângulos de perímetro $2p$, o de maior área é o quadrado.'
      espaco: 12
      resolucao: |
        Lados $x$ e $p - x$: $A = x(p - x) = \tfrac{p^2}{4} - \left(x - \tfrac{p}{2}\right)^2$. O máximo, $\tfrac{p^2}{4}$, ocorre para $x = \tfrac{p}{2}$: os dois lados iguais.
      resposta: 'Ver resolução'
    - enunciado: 'Um trapézio tem bases 20 e 12 e altura 10. A base média o divide em dois trapézios. Calcule a área de cada um e a razão entre elas.'
      espaco: 12
      resolucao: |
        Base média $16$, e cada parte tem altura 5. Áreas: $\tfrac{(20 + 16) \cdot 5}{2} = 90$ e $\tfrac{(16 + 12) \cdot 5}{2} = 70$. Razão $\tfrac{9}{7}$ (soma $160$, a área total).
      resposta: '90 e 70; $\frac{9}{7}$'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      O piso de uma sala retangular de 6 m por 4,5 m será revestido com placas quadradas de porcelanato de 60 cm de lado, assentadas sem espaços entre elas. Por causa dos recortes e das perdas, o pedreiro recomenda comprar 10\% a mais do que o número de placas que cobre exatamente o piso.
    enunciado: |
      O número mínimo de placas a comprar é
    opcoes: ['$75$', '$83$', '$82$', '$90$', '$68$']
    correta: B
    resolucao: |
      Área $27$ m²; cada placa tem $0{,}36$ m²: $\tfrac{27}{0{,}36} = 75$ placas. Com 10\% a mais, $82{,}5$: são 83 placas.

  - estilo: Fuvest
    enunciado: |
      A área de um losango cujas diagonais medem 12 e 9 é
    opcoes: ['$108$', '$42$', '$54$', '$21$', '$27$']
    correta: C
    resolucao: |
      $\tfrac{12 \cdot 9}{2} = 54$.

  - estilo: Unicamp
    enunciado: |
      A área de um quadrado cuja diagonal mede $6\sqrt{2}$ é
    opcoes: ['$36$.', '$72$.', '$18$.', '$6$.']
    correta: A
    resolucao: |
      Lado $6$, área $36$ (ou $\tfrac{d^2}{2} = \tfrac{72}{2}$).

  - estilo: UEM
    enunciado: |
      Considere as áreas de quadriláteros. Assinale o que for correto.
    proposicoes:
    - 'Um quadrado de perímetro 20 tem área 25.'
    - 'Um retângulo de lados 8 e 3 tem área 24.'
    - 'Um paralelogramo de lados 8 e 5 tem área 40.'
    - 'Um trapézio de bases 9 e 5 e altura 4 tem área 28.'
    - 'Um losango de diagonais 10 e 7 tem área 35.'
    corretas: [1, 2, 4, 5]
    resolucao: |
      01) Lado 5. 02) $8 \cdot 3$. 04) Incorreta: a área depende do ângulo; 40 só vale se ele for reto. 08) $\tfrac{14 \cdot 4}{2}$. 16) $\tfrac{70}{2}$.
      Soma: $01 + 02 + 08 + 16 = 27$.

  - estilo: Enem
    texto: |
      A planta de um terreno tem a forma de um trapézio retângulo, como na figura: a frente mede 20 m, o fundo mede 30 m, e a lateral perpendicular à frente e ao fundo mede 40 m. O metro quadrado de terreno na região custa R\$\,150,00, e o comprador quer estimar o valor do terreno.
    figura:
      tikz: |
        \begin{scope}[scale=.06]
        \draw[ink, line width=1pt, fill=lilas!25] (0,0) -- (30,0) -- (20,40) -- (0,40) -- cycle;
        \draw[mudo] (0,3) -- (3,3) -- (3,0) (0,37) -- (3,37) -- (3,40);
        \node[above, font=\scriptsize] at (10,40) {frente: 20 m};
        \node[below, font=\scriptsize] at (15,0) {fundo: 30 m};
        \node[left, font=\scriptsize] at (0,20) {40 m};
        \end{scope}
    enunciado: |
      O valor estimado do terreno é
    opcoes: ['R\$\,120\,000,00', 'R\$\,180\,000,00', 'R\$\,300\,000,00', 'R\$\,150\,000,00', 'R\$\,90\,000,00']
    correta: D
    resolucao: |
      Área $\tfrac{(30 + 20) \cdot 40}{2} = 1000$ m²; valor $1000 \cdot 150 = 150\,000$ reais.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir.
    afirmativas:
    - 'Dobrando as duas dimensões de um retângulo, a área dobra.'
    - 'A área de um losango de diagonais 8 e 6 é 24.'
    - 'Um quadrado de 10 cm de lado tem área de 1 dm².'
    - 'Um hectare equivale a 1000 m².'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'I e IV, apenas.', 'II, III e IV, apenas.', 'III, apenas.', 'II e III, apenas.']
    correta: E
    resolucao: |
      I. Incorreta: quadruplica. II. $\tfrac{48}{2}$. III. $10$ cm $= 1$ dm. IV. Incorreta: $10\,000$ m².

  - estilo: Unesp
    enunciado: |
      Um paralelogramo tem base 15, lado 5 e altura relativa à base 4. A sua área é
    opcoes: ['$60$', '$75$', '$20$', '$30$', '$150$']
    correta: A
    resolucao: |
      $15 \cdot 4 = 60$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      Na figura, $ABCD$ é um retângulo de lados 10 e 6, e os vértices do quadrilátero sombreado são os pontos médios dos lados do retângulo.
    figura:
      tikz: |
        \begin{scope}[scale=.25]
        \draw[ink, line width=1pt] (0,0) -- (10,0) -- (10,6) -- (0,6) -- cycle;
        \draw[roxo, line width=1pt, fill=lilas!35] (5,0) -- (10,3) -- (5,6) -- (0,3) -- cycle;
        \node[below left, font=\scriptsize] at (0,0) {$A$};
        \node[below right, font=\scriptsize] at (10,0) {$B$};
        \node[above right, font=\scriptsize] at (10,6) {$C$};
        \node[above left, font=\scriptsize] at (0,6) {$D$};
        \end{scope}
    enunciado: |
      A área do quadrilátero sombreado é
    opcoes: ['$60$.', '$30$.', '$15$.', '$45$.']
    correta: B
    resolucao: |
      É um losango de diagonais 10 e 6: $\tfrac{60}{2} = 30$ (metade do retângulo).

  - estilo: Fuvest
    enunciado: |
      Um trapézio isósceles tem bases 14 e 4 e laterais 13. A sua área é
    opcoes: ['$90$', '$117$', '$108$', '$216$', '$54$']
    correta: C
    resolucao: |
      Projeção $\tfrac{14 - 4}{2} = 5$, altura $12$: $\tfrac{18 \cdot 12}{2} = 108$.

  - estilo: UFSC
    enunciado: |
      No retângulo $ABCD$, $AB = 12$ e $BC = 5$. Assinale o que for correto.
    proposicoes:
    - 'A diagonal mede 13.'
    - 'A área é 60.'
    - 'O perímetro é 30.'
    - 'O triângulo $ABC$ tem área 30.'
    - 'Um quadrado de mesmo perímetro que o retângulo tem área maior que a dele.'
    - 'Um quadrado de mesma área que o retângulo tem lado $2\sqrt{15}$.'
    corretas: [1, 2, 4, 5, 6]
    resolucao: |
      01) $\sqrt{144 + 25}$. 02) $12 \cdot 5$. 04) Incorreta: $34$. 08) A diagonal divide o retângulo ao meio. 16) Lado $8{,}5$, área $72{,}25 > 60$. 32) $\sqrt{60} = 2\sqrt{15}$.
      Soma: $01 + 02 + 08 + 16 + 32 = 59$.

  - estilo: Enem
    texto: |
      Uma parede retangular de 5 m de comprimento por 2,8 m de altura será pintada. Nela há uma porta retangular de 0,8 m por 2,1 m e uma janela retangular de 1,5 m por 1,2 m, que não serão pintadas. Para calcular a quantidade de tinta, o pintor precisa saber a área a ser pintada.
    enunciado: |
      A área a ser pintada é
    opcoes: ['$10{,}52$ m²', '$14{,}00$ m²', '$12{,}32$ m²', '$12{,}20$ m²', '$8{,}72$ m²']
    correta: A
    resolucao: |
      $14 - 1{,}68 - 1{,}80 = 10{,}52$ m².

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'Um quadrado de diagonal $d$ tem área $\frac{d^2}{2}$.'
    - 'Se a base de um paralelogramo dobra e a altura se reduz à metade, a área não muda.'
    - 'Um trapézio de bases 6 e 4 e altura 5 tem área 50.'
    - 'Um losango de lado 5 com uma diagonal de 6 tem área 24.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – V – F.', 'F – V – F – V.', 'V – F – F – V.', 'V – V – F – V.', 'V – V – F – F.']
    correta: D
    resolucao: |
      (V) É um losango de diagonais $d$ e $d$. (V) $2b \cdot \tfrac{h}{2} = bh$. (F) $\tfrac{10 \cdot 5}{2} = 25$. (V) A outra diagonal mede $2\sqrt{25 - 9} = 8$: $\tfrac{48}{2} = 24$.

  - estilo: Enem
    texto: |
      Uma família quer comprar um terreno retangular num bairro e, para não se deixar levar só pelo preço total, decidiu comparar as cinco ofertas pelo preço do metro quadrado. O quadro mostra as dimensões e o preço total de cada terreno.
    tabela:
      cabecalho: ['Terreno', 'Dimensões (m)', 'Preço (R\$)']
      linhas:
      - ['T1', '$12 \times 30$', '$90\,000$']
      - ['T2', '$15 \times 25$', '$82\,500$']
      - ['T3', '$10 \times 40$', '$96\,000$']
      - ['T4', '$20 \times 20$', '$92\,000$']
      - ['T5', '$16 \times 25$', '$100\,000$']
    enunciado: |
      O terreno de menor preço por metro quadrado é o
    opcoes: ['T1.', 'T2.', 'T3.', 'T4.', 'T5.']
    correta: B
    resolucao: |
      Áreas: $360$, $375$, $400$, $400$, $400$ m². Preço por m²: $250$, $220$, $240$, $230$, $250$ reais. O menor é o de T2.

  - estilo: Unesp
    enunciado: |
      Um quadrilátero convexo tem área 80. O quadrilátero cujos vértices são os pontos médios dos lados dele tem área
    opcoes: ['$20$', '$60$', '$80$', '$30$', '$40$']
    correta: E
    resolucao: |
      Cada canto cortado é $\tfrac{1}{4}$ do triângulo determinado por uma diagonal; os quatro cantos somam metade da área. Sobra $40$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Considere os retângulos de perímetro 40. Assinale o que for correto.
    proposicoes:
    - 'O quadrado de lado 10 é o de maior área.'
    - 'O retângulo de lados 12 e 8 tem área 96.'
    - 'O retângulo de lados $x$ e $20 - x$ tem área $20x - x^2$.'
    - 'Existe um desses retângulos com área 120.'
    - 'O retângulo de área 75 tem lados 5 e 15.'
    corretas: [1, 2, 3, 5]
    resolucao: |
      01) $A = 100 - (x - 10)^2$, máxima em $x = 10$. 02) Correta. 04) Correta. 08) Incorreta: a área máxima é 100. 16) $x(20 - x) = 75$: $x = 5$ ou $15$.
      Soma: $01 + 02 + 04 + 16 = 23$.

  - estilo: Unicamp
    enunciado: |
      Um paralelogramo tem lados 10 e 8, e um dos seus ângulos mede $60°$. A sua área é
    opcoes: ['$80$.', '$40$.', '$40\sqrt{3}$.', '$20\sqrt{3}$.']
    correta: C
    resolucao: |
      Altura relativa ao lado 10: $8 \cdot \tfrac{\sqrt{3}}{2} = 4\sqrt{3}$. Área $40\sqrt{3}$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Um piso é montado com ladrilhos quadrados de 40 cm de lado, todos iguais ao da figura. Em cada ladrilho, o losango pintado tem os vértices nos pontos médios dos lados. Os ladrilhos são assentados lado a lado, sem espaços nem sobreposições.
    figura:
      tikz: |
        \begin{scope}[scale=.9]
        \draw[ink, line width=1pt, fill=white] (0,0) rectangle (2,2);
        \draw[roxo, line width=1pt, fill=lilas!45] (1,0) -- (2,1) -- (1,2) -- (0,1) -- cycle;
        \node[below, font=\scriptsize] at (1,0) {40 cm};
        \end{scope}
    enunciado: |
      A área pintada de cada ladrilho é
    opcoes: ['$1600$ cm²', '$400$ cm²', '$1200$ cm²', '$800$ cm²', '$640$ cm²']
    correta: D
    resolucao: |
      Losango de diagonais 40 e 40: $\tfrac{1600}{2} = 800$ cm², metade do ladrilho.

  - estilo: Unesp
    enunciado: |
      Num piso de 20 m² montado com esses ladrilhos, a área pintada total é
    opcoes: ['$5$ m²', '$20$ m²', '$12{,}5$ m²', '$8$ m²', '$10$ m²']
    correta: E
    resolucao: |
      Em cada ladrilho, metade é pintada: $\tfrac{20}{2} = 10$ m² (são $\tfrac{20}{0{,}16} = 125$ ladrilhos de $0{,}08$ m² pintados).

  - estilo: Fuvest
    enunciado: |
      Um trapézio tem área 84 e bases 16 e 8. A sua altura é
    opcoes: ['$7$', '$5{,}25$', '$10{,}5$', '$14$', '$3{,}5$']
    correta: A
    resolucao: |
      $\tfrac{24h}{2} = 84$: $h = 7$.

  - estilo: Unesp
    texto: |
      No quadrado $ABCD$ de lado 10 da figura, cada vértice do quadrado sombreado está sobre um lado de $ABCD$, a 3 unidades de um vértice, sempre no mesmo sentido.
    figura:
      tikz: |
        \begin{scope}[scale=.2]
        \draw[ink, line width=1pt] (0,0) -- (10,0) -- (10,10) -- (0,10) -- cycle;
        \draw[roxo, line width=1pt, fill=lilas!35] (3,0) -- (10,3) -- (7,10) -- (0,7) -- cycle;
        \node[below, font=\scriptsize] at (1.5,0) {$3$};
        \node[below, font=\scriptsize] at (6.5,0) {$7$};
