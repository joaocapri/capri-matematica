# Aula 4.8.3 — Geometria plana: potência de ponto
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: cordas que se cortam (PA·PB = PC·PD); duas secantes (segmento externo × secante inteira); tangente e
# secante (PT² = PA·PB); potência p = d² − r² (sinal e posição); corda por um ponto interior; arcos de pontes e janelas
# (vão e flecha); altura relativa à hipotenusa; pontos da reta da corda comum de duas circunferências; horizonte.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'As cordas $AB$ e $CD$ se cortam no ponto $P$. Complete o quadro.'
      tabela:
        cabecalho: ['$PA$', '$PB$', '$PC$', '$PD$']
        linhas:
        - ['$3$', '$8$', '$4$', '${{6}}$']
        - ['$5$', '$6$', '${{10}}$', '$3$']
        - ['${{2}}$', '$9$', '$3$', '$6$']
        - ['$7$', '${{4}}$', '$14$', '$2$']
      resolucao: |
        $PA \cdot PB = PC \cdot PD$: $24 = 4 \cdot 6$; $30 = 10 \cdot 3$; $2 \cdot 9 = 18$; $7 \cdot 4 = 28$.
      resposta: '6; 10; 2; 4'
    - enunciado: 'Marque V (verdadeiro) ou F (falso). Use a potência $p = d^2 - r^2$, em que $d$ é a distância do ponto ao centro.'
      afirmacoes:
      - 'A potência de um ponto interior à circunferência é negativa.'
      - 'O quadrado do segmento tangente é igual ao produto do segmento externo pela secante inteira.'
      - 'Para duas secantes traçadas de um ponto externo, os produtos das partes internas são iguais.'
      - 'A potência do centro é $-r^2$.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) $d < r$. (V) $PT^2 = PA \cdot PB$. (F) Multiplica-se o segmento externo pela secante inteira. (V) $d = 0$.
      resposta: V, V, F, V
    - enunciado: 'Associe cada situação à relação correspondente.'
      esquerda:
      - 'duas cordas que se cortam em $P$'
      - 'duas secantes traçadas de $P$ externo'
      - 'uma tangente e uma secante traçadas de $P$'
      - '$P$ a distância $d$ do centro'
      - '$P$ sobre a circunferência'
      direita:
      - 'quadrado do segmento tangente'
      - 'potência igual a zero'
      - 'produto dos dois pedaços de cada corda'
      - '$d^2 - r^2$'
      - 'produto do segmento externo pela secante inteira'
      resolucao: |
        Em todos os casos, o valor comum é a potência do ponto; ela vale zero quando $d = r$.
      resposta: 'De cima para baixo: 3, 5, 1, 4, 2'
    - enunciado: 'Complete.'
      itens:
      - 'Secantes $PAB$ e $PCD$, com $PA = 4$, $PB = 12$ e $PC = 6$: $PD =$ {{8}}'
      - 'Tangente $PT$ e secante $PAB$, com $PA = 5$ e $PB = 20$: $PT =$ {{10}}'
      - 'Potência de um ponto a 13 do centro de uma circunferência de raio 5: {{144}}'
      espaco_item: 10
      resolucao: |
        (a) $4 \cdot 12 = 6 \cdot PD$. (b) $PT^2 = 100$. (c) $169 - 25$.
      resposta: '8; 10; 144'
    - enunciado: 'Na figura, $AP = 6$, $PB = 4$ e $CP = 3$. Calcule $PD$.'
      figura:
        tikz: |
          \begin{scope}[scale=1]
          \draw[ink, line width=1pt] (0,0) circle (1.1);
          \draw[roxo, line width=1pt] (150:1.1) -- (10:1.1) (230:1.1) -- (80:1.1);
          \node[left, font=\scriptsize] at (150:1.1) {$A$};
          \node[right, font=\scriptsize] at (10:1.1) {$B$};
          \node[below left, font=\scriptsize] at (230:1.1) {$C$};
          \node[above, font=\scriptsize] at (80:1.1) {$D$};
          \end{scope}
      espaco: 8
      resolucao: |
        $6 \cdot 4 = 3 \cdot PD$: $PD = 8$.
      resposta: '8'
    - enunciado: 'De um ponto $P$ traçam-se a tangente $PT = 12$ e a secante $PAB$, com $PA = 8$. Calcule $PB$ e a corda $AB$.'
      espaco: 8
      resolucao: |
        $144 = 8 \cdot PB$: $PB = 18$ e $AB = 10$.
      resposta: '$PB = 18$; $AB = 10$'
    - enunciado: 'O ponto $P$ está a 3 do centro de uma circunferência de raio 5. Calcule o produto $PA \cdot PB$ para qualquer corda $AB$ que passe por $P$ e confira com a corda perpendicular a $OP$.'
      espaco: 10
      resolucao: |
        $|p| = r^2 - d^2 = 16$. A corda perpendicular a $OP$ é dividida ao meio por $P$, com metades $\sqrt{25 - 9} = 4$: $4 \cdot 4 = 16$.
      resposta: '16'
  - nome: Nível 2
    questoes:
    - texto: |
        Para as secantes $PAB$ e $PCD$, com $PA = 3$, $AB = 5$, $PC = 4$ e $CD = x$, Lucas escreveu $3 \cdot 5 = 4x$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 10
      resolucao: |
        O produto é do segmento externo pela secante inteira: $3 \cdot 8 = 4(4 + x)$, $24 = 16 + 4x$, $x = 2$.
      resposta: '$x = 2$'
    - enunciado: 'O arco de uma ponte é um arco de circunferência com vão (corda) de 24 m e flecha (altura máxima) de 4 m. Calcule o raio.'
      espaco: 12
      resolucao: |
        A flecha está no prolongamento de um diâmetro perpendicular ao vão. Pelas cordas: $12 \cdot 12 = 4(2r - 4)$, $144 = 8r - 16$, $r = 20$ m.
      resposta: '20 m'
    - enunciado: 'Numa circunferência de diâmetro $AB = 10$, a corda $CD$ é perpendicular a $AB$ no ponto $P$, com $AP = 2$. Calcule $CD$.'
      espaco: 10
      resolucao: |
        $PC = PD$ e $PC^2 = 2 \cdot 8 = 16$: $PC = 4$, $CD = 8$.
      resposta: '8'
    - enunciado: 'De $P$ traçam-se a tangente $PT = 20$ e a secante que passa pelo centro, cortando a circunferência em $A$ e $B$, com $PA = 10$. Calcule o raio.'
      espaco: 10
      resolucao: |
        $400 = 10 \cdot PB$: $PB = 40$. O diâmetro é $AB = 30$: $r = 15$.
      resposta: '15'
    - enunciado: 'Numa circunferência de raio 5, complete com a potência $p = d^2 - r^2$ e com a posição do ponto.'
      tabela:
        cabecalho: ['$d$', 'Potência', 'Posição']
        linhas:
        - ['$13$', '${{144}}$', '{{exterior}}']
        - ['$5$', '${{0}}$', '{{na circunferência}}']
        - ['$3$', '${{-16}}$', '{{interior}}']
        - ['$0$', '${{-25}}$', '{{centro}}']
      resolucao: |
        O sinal da potência indica a posição: positiva fora, zero na circunferência, negativa dentro.
      resposta: '144, exterior; 0, na circunferência; $-16$, interior; $-25$, centro'
    - enunciado: 'De $P$ traçam-se as secantes $PAB$ e $PCD$, com $PA = 5$, $PB = 12$ e $PC = 6$. Calcule $PD$ e $CD$.'
      espaco: 8
      resolucao: |
        $60 = 6 \cdot PD$: $PD = 10$ e $CD = 4$.
      resposta: '$PD = 10$; $CD = 4$'
    - enunciado: 'Numa circunferência de raio 7, uma corda passa pelo ponto $P$ e fica dividida por ele em segmentos de 2 e 12. Calcule a distância de $P$ ao centro.'
      espaco: 10
      resolucao: |
        $r^2 - d^2 = 2 \cdot 12$: $49 - d^2 = 24$, $d = 5$.
      resposta: '5'
    - enunciado: 'Num triângulo retângulo, a altura relativa à hipotenusa a divide em segmentos de 4 e 9. Use a potência de ponto, na circunferência que tem a hipotenusa como diâmetro, para calcular essa altura.'
      espaco: 12
      resolucao: |
        O vértice do ângulo reto está na circunferência de diâmetro igual à hipotenusa. Prolongando a altura, obtém-se uma corda perpendicular ao diâmetro, dividida ao meio pelo pé da altura: $h \cdot h = 4 \cdot 9$, $h = 6$.
      resposta: '6'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que, se as cordas $AB$ e $CD$ se cortam em $P$, então $PA \cdot PB = PC \cdot PD$.'
      espaco: 12
      resolucao: |
        Os triângulos $PAC$ e $PDB$ têm $P\hat{A}C = P\hat{D}B$ (inscritos no arco $CB$) e ângulos opostos pelo vértice em $P$: são semelhantes. $\tfrac{PA}{PD} = \tfrac{PC}{PB}$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que, para as secantes $PAB$ e $PCD$ traçadas de um ponto externo, $PA \cdot PB = PC \cdot PD$.'
      espaco: 12
      resolucao: |
        Os triângulos $PAD$ e $PCB$ têm o ângulo $\hat{P}$ comum e $P\hat{D}A = P\hat{B}C$ (inscritos no arco $AC$): são semelhantes. $\tfrac{PA}{PC} = \tfrac{PD}{PB}$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que, para a tangente $PT$ e a secante $PAB$, $PT^2 = PA \cdot PB$.'
      espaco: 12
      resolucao: |
        $P\hat{T}A$ (ângulo de segmento) e $P\hat{B}T$ (inscrito) determinam o arco $TA$: são iguais. Com $\hat{P}$ comum, $PTA \sim PBT$, e $\tfrac{PT}{PB} = \tfrac{PA}{PT}$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que, para um ponto $P$ a distância $d$ do centro de uma circunferência de raio $r$, o produto $PA \cdot PB$ (com $A$ e $B$ na circunferência, alinhados com $P$) é $|d^2 - r^2|$.'
      espaco: 12
      resolucao: |
        Como o produto não depende da reta, use a que passa pelo centro: $A$ e $B$ ficam a $d - r$ e $d + r$ de $P$ (se $P$ é exterior) ou a $r - d$ e $r + d$ (se é interior). O produto é $|d^2 - r^2|$.
      resposta: 'Ver resolução'
    - enunciado: 'Duas circunferências se cortam em $A$ e $B$, e $P$ é um ponto da reta $AB$, fora do segmento $AB$. Prove que os segmentos tangentes traçados de $P$ às duas circunferências são iguais.'
      espaco: 12
      resolucao: |
        A secante $PAB$ é comum às duas circunferências. Se $PT_1$ e $PT_2$ são as tangentes: $PT_1^2 = PA \cdot PB = PT_2^2$.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      O arco de uma ponte de pedra é um arco de circunferência, como na figura. O vão, distância entre as bases do arco, é de 40 m, e a flecha, altura do ponto mais alto do arco acima do vão, é de 8 m. Para restaurar a ponte, o engenheiro precisa do raio desse arco.
    figura:
      tikz: |
        \begin{scope}[scale=.06]
        \fill[lilas!25] (-20,0) arc (133.6:46.4:29) -- cycle;
        \draw[roxo, line width=1.2pt] (-20,0) arc (133.6:46.4:29);
        \draw[ink, line width=1pt] (-26,0) -- (26,0);
        \draw[mudo, dashed] (0,0) -- (0,8);
        \node[below, font=\scriptsize] at (0,0) {40 m};
        \node[right, font=\scriptsize] at (0,4) {8 m};
        \end{scope}
    enunciado: |
      O raio do arco é
    opcoes: ['$25$ m', '$29$ m', '$20$ m', '$32$ m', '$58$ m']
    correta: B
    resolucao: |
      Pelas cordas que se cortam no meio do vão: $20 \cdot 20 = 8(2r - 8)$, $400 = 16r - 64$, $r = 29$ m.

  - estilo: Fuvest
    enunciado: |
      Duas cordas de uma circunferência se cortam num ponto $P$. Uma delas fica dividida em segmentos de 9 e 4; a outra, em segmentos de 6 e $x$. O valor de $x$ é
    opcoes: ['$6$', '$8$', '$4$', '$9$', '$7$']
    correta: A
    resolucao: |
      $9 \cdot 4 = 6x$: $x = 6$.

  - estilo: Unicamp
    enunciado: |
      De um ponto $P$ traçam-se a tangente $PT$ e a secante $PAB$ a uma circunferência, com $PA = 2$ e $AB = 6$. A medida de $PT$ é
    opcoes: ['$4$.', '$16$.', '$2\sqrt{3}$.', '$8$.']
    correta: A
    resolucao: |
      $PT^2 = 2 \cdot 8 = 16$: $PT = 4$.

  - estilo: UEM
    enunciado: |
      Considere a potência $p = d^2 - r^2$ de um ponto $P$ a distância $d$ do centro de uma circunferência de raio $r$. Assinale o que for correto.
    proposicoes:
    - 'A potência de um ponto exterior é positiva.'
    - 'A potência de um ponto da circunferência é zero.'
    - 'A potência do centro é $-r^2$.'
    - 'Se duas cordas se cortam em $P$ e a primeira fica dividida em 5 e 6, e a segunda tem um segmento de 3, o outro mede 10.'
    - 'Se a tangente traçada de $P$ mede 8, então $PA \cdot PB = 16$ para qualquer secante $PAB$.'
    corretas: [1, 2, 3, 4]
    resolucao: |
      01) $d > r$. 02) $d = r$. 04) $d = 0$. 08) $30 = 3x$. 16) Incorreta: $8^2 = 64$.
      Soma: $01 + 02 + 04 + 08 = 15$.

  - estilo: Enem
    texto: |
      A entrada de um túnel tem a forma de um arco de circunferência maior que uma semicircunferência, apoiado no chão, como na figura. A largura no chão é de 12 m, e a altura máxima é de 9 m. A empresa que vai instalar a iluminação precisa do raio da circunferência do arco.
    figura:
      tikz: |
        \begin{scope}[scale=.12]
        \fill[lilas!25] (-6,0) arc (202.6:-22.6:6.5) -- cycle;
        \draw[roxo, line width=1.2pt] (-6,0) arc (202.6:-22.6:6.5);
        \draw[ink, line width=1pt] (-9,0) -- (9,0);
        \draw[mudo, dashed] (0,0) -- (0,9);
        \node[below, font=\scriptsize] at (0,0) {12 m};
        \node[right, font=\scriptsize] at (0,5) {9 m};
        \end{scope}
    enunciado: |
      O raio do arco é
    opcoes: ['$6$ m', '$7{,}5$ m', '$6{,}5$ m', '$9$ m', '$5{,}5$ m']
    correta: C
    resolucao: |
      Pelas cordas que se cortam no meio da largura: $6 \cdot 6 = 9(2r - 9)$, $36 = 18r - 81$, $r = 6{,}5$ m.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir.
    afirmativas:
    - 'Se as cordas $AB$ e $CD$ se cortam em $P$, com $PA = 2$, $PB = 10$ e $PC = 4$, então $PD = 5$.'
    - 'Se as secantes $PAB$ e $PCD$ têm $PA = 3$, $AB = 9$ e $PC = 4$, então $PD = 9$.'
    - 'Se a secante $PAB$ tem $PA = 4$ e $PB = 16$, o segmento tangente traçado de $P$ mede 64.'
    - 'A potência de um ponto a 10 do centro de uma circunferência de raio 6 é 64.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'II e III, apenas.', 'III e IV, apenas.', 'I, II e IV, apenas.', 'I, II, III e IV.']
    correta: D
    resolucao: |
      I. $20 = 4 \cdot 5$. II. $3 \cdot 12 = 4 \cdot 9$. III. Incorreta: $PT^2 = 64$, $PT = 8$. IV. $100 - 36$.

  - estilo: Unesp
    enunciado: |
      Numa circunferência de diâmetro $AB$, a corda $CD$ é perpendicular a $AB$ no ponto $P$, com $AP = 1$ e $PB = 9$. A corda $CD$ mede
    opcoes: ['$3$', '$9$', '$10$', '$4{,}5$', '$6$']
    correta: E
    resolucao: |
      $PC^2 = 1 \cdot 9$: $PC = 3$ e $CD = 6$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      Na figura, $PT$ é tangente à circunferência de centro $O$, e a secante $PAB$ passa por $O$, com $PT = 12$ e $PA = 8$.
    figura:
      tikz: |
        \begin{scope}[scale=.12]
        \draw[ink, line width=1pt] (0,0) circle (5);
        \fill[ink] (0,0) circle (8pt);
        \draw[roxo, line width=1pt] (13,0) -- (-5,0);
        \draw[roxo, line width=1pt] (13,0) -- (1.923,4.615);
        \node[below, font=\scriptsize] at (0,0) {$O$};
        \node[right, font=\scriptsize] at (13,0) {$P$};
        \node[below right, font=\scriptsize] at (5,0) {$A$};
        \node[left, font=\scriptsize] at (-5,0) {$B$};
        \node[above, font=\scriptsize] at (1.923,4.615) {$T$};
        \end{scope}
    enunciado: |
      O raio da circunferência é
    opcoes: ['$5$.', '$10$.', '$6$.', '$9$.']
    correta: A
    resolucao: |
      $144 = 8 \cdot PB$: $PB = 18$. O diâmetro é $AB = 10$: raio 5.

  - estilo: Fuvest
    enunciado: |
      A altura relativa à hipotenusa de um triângulo retângulo a divide em segmentos de 3 e 12. A altura mede
    opcoes: ['$4$', '$6$', '$7{,}5$', '$9$', '$36$']
    correta: B
    resolucao: |
      O pé da altura divide ao meio a corda perpendicular ao diâmetro (a hipotenusa): $h^2 = 3 \cdot 12 = 36$.

  - estilo: UFSC
    enunciado: |
      O ponto $P$ está a 6 do centro de uma circunferência de raio 10. Assinale o que for correto.
    proposicoes:
    - '$P$ é interior à circunferência.'
    - 'A potência de $P$ é $-64$.'
    - 'Para toda corda $AB$ que passa por $P$, $PA \cdot PB = 64$.'
    - 'A menor corda que passa por $P$ mede 16.'
    - 'A maior corda que passa por $P$ mede 20.'
    - 'Existe uma corda por $P$ dividida por ele em segmentos de 4 e 12.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) $6 < 10$. 02) $36 - 100$. 04) $r^2 - d^2$. 08) Perpendicular a $OP$: metades de $\sqrt{64} = 8$. 16) O diâmetro. 32) Incorreta: $4 \cdot 12 = 48 \ne 64$.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      Um arqueólogo encontrou um caco de um prato circular. Ele mediu a corda que une as duas pontas do arco da borda, 16 cm, e a flecha, distância do meio da corda até a borda, 4 cm. Com essas medidas, quer saber o diâmetro do prato original para reconstituí-lo.
    enunciado: |
      O diâmetro do prato era
    opcoes: ['$16$ cm', '$10$ cm', '$20$ cm', '$24$ cm', '$32$ cm']
    correta: C
    resolucao: |
      $8 \cdot 8 = 4(2r - 4)$: $64 = 8r - 16$, $r = 10$ cm. Diâmetro $20$ cm.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'Se duas cordas se cortam, o produto dos segmentos de uma é igual ao produto dos segmentos da outra.'
    - 'Se duas secantes partem de um ponto externo, os produtos das suas partes internas são iguais.'
    - 'Se $PT$ é tangente e $PAB$ é secante, então $PT^2 = PA \cdot PB$.'
    - 'A potência de um ponto interior, $d^2 - r^2$, é negativa.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – V – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – F – V – V.', 'V – V – F – V.']
    correta: D
    resolucao: |
      (V) (F) Usa-se o segmento externo vezes a secante inteira. (V) (V) $d < r$.

  - estilo: Enem
    texto: |
      Um arquiteto mediu o vão (corda na base) e a flecha (altura do arco acima do meio do vão) de três janelas com arcos de circunferência, para encomendar os vidros. O quadro mostra as medidas, em metros. Ele precisa saber qual janela tem o arco de maior raio.
    tabela:
      cabecalho: ['Janela', 'Vão (m)', 'Flecha (m)']
      linhas:
      - ['J1', '$2{,}0$', '$0{,}5$']
      - ['J2', '$1{,}6$', '$0{,}4$']
      - ['J3', '$1{,}2$', '$0{,}6$']
    enunciado: |
      A janela de maior raio e esse raio são
    opcoes: ['J1, com raio de 1,25 m.', 'J2, com raio de 1,00 m.', 'J3, com raio de 0,60 m.', 'J1, com raio de 1,00 m.', 'J2, com raio de 1,25 m.']
    correta: A
    resolucao: |
      $\left(\tfrac{v}{2}\right)^2 = f(2r - f)$. J1: $1 = 0{,}5(2r - 0{,}5)$, $r = 1{,}25$. J2: $0{,}64 = 0{,}4(2r - 0{,}4)$, $r = 1$. J3: $0{,}36 = 0{,}6(2r - 0{,}6)$, $r = 0{,}6$ (semicircunferência).

  - estilo: Unesp
    enunciado: |
      De um ponto $P$ traçam-se as secantes $PAB$ e $PCD$, com $PA = 4$, $AB = 6$ e $PC = 5$. A corda $CD$ mede
    opcoes: ['$8$', '$6$', '$5$', '$4$', '$3$']
    correta: E
    resolucao: |
      $4 \cdot 10 = 5 \cdot PD$: $PD = 8$ e $CD = 3$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      De um ponto $P$ traçam-se a tangente $PT$ e a secante $PAB$ a uma circunferência de raio 6, com $PA = 4$ e $AB = 12$. Assinale o que for correto.
    proposicoes:
    - '$PB = 16$.'
    - '$PT = 8$.'
    - 'A potência de $P$ é 8.'
    - 'A distância de $P$ ao centro é 10.'
    - 'Se outra secante $PCD$ tem $PC = 2$, então $PD = 32$.'
    corretas: [1, 2, 4, 5]
    resolucao: |
      01) $4 + 12$. 02) $PT^2 = 64$. 04) Incorreta: a potência é $PT^2 = 64$. 08) $d^2 = 64 + 36$. 16) $64 = 2 \cdot PD$.
      Soma: $01 + 02 + 08 + 16 = 27$.

  - estilo: Unicamp
    enunciado: |
      Duas circunferências se cortam em $A$ e $B$. Um ponto $P$ da reta $AB$, fora do segmento $AB$, tem $PA = 3$, e $AB = 9$. O segmento tangente traçado de $P$ a qualquer uma das circunferências mede
    opcoes: ['$3\sqrt{3}$.', '$6$.', '$12$.', '$36$.']
    correta: B
    resolucao: |
      Para as duas: $PT^2 = PA \cdot PB = 3 \cdot 12 = 36$, $PT = 6$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        A porta de uma capela tem a parte de cima em arco de circunferência, como na figura. A largura da porta (o vão do arco) é de 1,6 m, e a flecha do arco, isto é, a altura do ponto mais alto acima da linha horizontal onde o arco começa, é de 0,4 m.
    figura:
      tikz: |
        \begin{scope}[scale=1.3]
        \fill[lilas!25] (-0.8,-1.2) -- (-0.8,0) arc (143.13:36.87:1) -- (0.8,-1.2) -- cycle;
        \draw[ink, line width=1pt] (-0.8,-1.2) -- (-0.8,0) arc (143.13:36.87:1) -- (0.8,-1.2);
        \draw[mudo, dashed] (-0.8,0) -- (0.8,0) (0,0) -- (0,0.4);
        \end{scope}
    enunciado: |
      O raio do arco da porta é
    opcoes: ['$0{,}8$ m', '$1{,}2$ m', '$1{,}6$ m', '$0{,}5$ m', '$1{,}0$ m']
    correta: E
    resolucao: |
      $0{,}8 \cdot 0{,}8 = 0{,}4(2r - 0{,}4)$: $0{,}64 = 0{,}8r - 0{,}16$, $r = 1$ m.

  - estilo: Unicamp
    enunciado: |
      A altura do arco acima da linha horizontal, num ponto a 0,6 m do meio da porta, é
    opcoes: ['$0{,}3$ m.', '$0{,}1$ m.', '$0{,}25$ m.', '$0{,}2$ m.']
    correta: D
    resolucao: |
      O ponto da linha horizontal divide o vão em $1{,}4$ e $0{,}2$. A vertical por ele corta a circunferência acima, a altura $y$, e abaixo, a $y + 2 \cdot 0{,}6$ (o centro está $0{,}6$ m abaixo da linha). $y(y + 1{,}2) = 1{,}4 \cdot 0{,}2 = 0{,}28$: $y = 0{,}2$ m.

  - estilo: Fuvest
    enunciado: |
      Numa circunferência de raio 6, uma corda passa pelo ponto $P$ e fica dividida por ele em segmentos de 3 e 8. A distância de $P$ ao centro é
    opcoes: ['$2$', '$\sqrt{11}$', '$3$', '$\sqrt{24}$', '$2\sqrt{3}$']
    correta: E
    resolucao: |
      $36 - d^2 = 24$: $d = \sqrt{12} = 2\sqrt{3}$.

  - estilo: Unesp
    texto: |
      Na figura, as cordas $AB$ e $CD$ se cortam em $P$, com $AP = x$, $PB = x + 2$, $CP = 4$ e $PD = 6$.
    figura:
      tikz: |
        \begin{scope}[scale=1]
        \draw[ink, line width=1pt] (0,0) circle (1.1);
        \draw[roxo, line width=1pt] (160:1.1) -- (5:1.1) (240:1.1) -- (75:1.1);
        \node[left, font=\scriptsize] at (160:1.1) {$A$};
