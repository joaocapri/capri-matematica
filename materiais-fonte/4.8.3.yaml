aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Prove as relações métricas de potência de ponto.'
    itens:
    - 'Cordas $AB$ e $CD$ que se cortam em $P$: $PA \cdot PB = PC \cdot PD$.'
    - 'Secantes $PAB$ e $PCD$ traçadas de um ponto externo: $PA \cdot PB = PC \cdot PD$.'
    - 'Tangente $PT$ e secante $PAB$: $PT^2 = PA \cdot PB$.'
    espaco: 62
    resolucao: |
      a) $PAC \sim PDB$: ângulos inscritos no mesmo arco e opostos pelo vértice.
      b) $PAD \sim PCB$: ângulo $\hat{P}$ comum e $P\hat{D}A = P\hat{B}C$ (inscritos no arco $AC$).
      c) $PTA \sim PBT$: ângulo $\hat{P}$ comum e $P\hat{T}A = P\hat{B}T$ (de segmento e inscrito no arco $TA$).
    resposta: 'Ver resolução'

  - estilo: Unicamp
    enunciado: 'Seja $P$ um ponto a distância $d$ do centro $O$ de uma circunferência de raio $r$.'
    itens:
    - 'Usando a reta $PO$, mostre que, para toda reta por $P$ que corta a circunferência em $A$ e $B$, $PA \cdot PB = |d^2 - r^2|$.'
    - 'Mostre que, se $P$ é exterior, o segmento tangente mede $\sqrt{d^2 - r^2}$.'
    - 'Para $r = 13$ e $d = 5$, calcule a menor corda que passa por $P$.'
    espaco: 62
    resolucao: |
      a) O produto é o mesmo para todas as retas por $P$; na reta $PO$, os pedaços são $|d - r|$ e $d + r$.
      b) A tangente é o caso em que $A = B = T$: $PT^2 = d^2 - r^2$ (ou Pitágoras no triângulo $PTO$).
      c) A menor é perpendicular a $OP$, dividida ao meio: metades $\sqrt{169 - 25} = 12$; corda $24$.
    resposta: 'c) 24'

  - estilo: ITA
    enunciado: |
      De um ponto $P$ traçam-se a tangente $PT = 6$ e a secante que passa pelo centro, cortando a circunferência em $A$ e $B$, com $PA = 2$. O raio da circunferência é
    opcoes: ['$9$', '$6$', '$8$', '$16$', '$4$']
    correta: C
    espaco: 22
    resolucao: |
      $36 = 2 \cdot PB$: $PB = 18$. Diâmetro $AB = 16$: $r = 8$.
    resposta: 'C'

  - estilo: Unesp
    texto: |
      O arco de uma ponte é um arco de circunferência com vão de 30 m e flecha de 5 m.
    enunciado: ''
    itens:
    - 'Calcule o raio do arco.'
    - 'Calcule a altura do arco num ponto do vão a 7 m do meio.'
    - 'Um barco de 8 m de largura passa centralizado sob a ponte. Qual é a altura livre nas laterais do barco?'
    espaco: 62
    resolucao: |
      a) $15 \cdot 15 = 5(2r - 5)$: $r = 25$ m. O centro fica $20$ m abaixo do vão.
      b) O ponto divide o vão em 22 e 8. A vertical por ele: $y(y + 40) = 22 \cdot 8 = 176$, $y = 4$ m.
      c) A 4 m do meio: vão dividido em 19 e 11; $y(y + 40) = 209$: $y = -20 + \sqrt{609} \approx 4{,}68$ m.
    resposta: 'a) 25 m; b) 4 m; c) $\approx 4{,}7$ m'

  - estilo: UFSC
    enunciado: |
      Assinale o que for correto.
    proposicoes:
    - 'Se as cordas se cortam em $P$, com segmentos 3 e 8 numa e 4 e 6 na outra, a relação de potência é satisfeita.'
    - 'Se as secantes $PAB$ e $PCD$ têm $PA = 2$, $PB = 10$ e $PC = 4$, então $PD = 5$.'
    - 'Se a secante $PAB$ tem $PA = 3$ e $PB = 27$, a tangente traçada de $P$ mede 9.'
    - 'A potência de um ponto a 5 do centro de uma circunferência de raio 13 é $-144$.'
    - 'Se uma corda de uma circunferência de raio 5 é dividida por $P$ em dois segmentos de 4, então $P$ está a 3 do centro.'
    - 'A potência de um ponto exterior é igual a $-PT^2$, sendo $PT$ o segmento tangente.'
    corretas: [1, 2, 3, 4, 5]
    espaco: 22
    resolucao: |
      01) $24 = 24$. 02) $20 = 4 \cdot 5$. 04) $81$. 08) $25 - 169$. 16) $25 - d^2 = 16$. 32) Incorreta: é $+PT^2$.
    resposta: 'Soma 31 (01 + 02 + 04 + 08 + 16)'

  - estilo: Fuvest
    enunciado: 'Duas circunferências se cortam em $A$ e $B$.'
    itens:
    - 'Prove que todo ponto $P$ da reta $AB$, fora do segmento $AB$, tem a mesma potência em relação às duas circunferências.'
    - 'Conclua que os segmentos tangentes de $P$ às duas circunferências são iguais.'
    - 'Para $PA = 4$ e $AB = 5$, calcule esses segmentos.'
    espaco: 62
    resolucao: |
      a) Nas duas circunferências, a secante $PAB$ é a mesma: a potência é $PA \cdot PB$.
      b) $PT_1^2 = PA \cdot PB = PT_2^2$.
      c) $\sqrt{4 \cdot 9} = 6$.
    resposta: 'c) 6'

  - estilo: Unicamp
    texto: |
      Para reconstituir um objeto circular a partir de um fragmento da borda, mede-se a corda $c$ entre as pontas do fragmento e a flecha $f$, distância do meio da corda até a borda.
    enunciado: ''
    itens:
    - 'Mostre que o raio é $r = \frac{c^2}{8f} + \frac{f}{2}$.'
    - 'Calcule o raio para $c = 16$ cm e $f = 4$ cm.'
    - 'Calcule o raio para $c = 30$ cm e $f = 5$ cm.'
    espaco: 62
    resolucao: |
      a) A flecha está sobre um diâmetro perpendicular à corda: $\left(\tfrac{c}{2}\right)^2 = f(2r - f)$, logo $2r = \tfrac{c^2}{4f} + f$.
      b) $\tfrac{256}{32} + 2 = 10$ cm.
      c) $\tfrac{900}{40} + 2{,}5 = 25$ cm.
    resposta: 'b) 10 cm; c) 25 cm'

  - estilo: Fuvest
    enunciado: |
      Numa circunferência de raio 6, uma corda é dividida pelo ponto $P$ em segmentos de 5 e 7. A distância de $P$ ao centro é
    opcoes: ['$1$', '$2$', '$\sqrt{2}$', '$\sqrt{11}$', '$0$']
    correta: A
    espaco: 22
    resolucao: |
      $36 - d^2 = 35$: $d = 1$.
    resposta: 'A'

  - estilo: Unesp
    enunciado: 'No triângulo $ABC$, retângulo em $A$, a altura $AH$ divide a hipotenusa $BC$ em $BH = m$ e $HC = n$.'
    itens:
    - 'Usando a circunferência de diâmetro $BC$ e a potência de $H$, prove que $AH^2 = mn$.'
    - 'Calcule $AH$ para $m = 2$ e $n = 8$.'
    - 'Calcule a área do triângulo nesse caso.'
    espaco: 62
    resolucao: |
      a) $A$ está na circunferência de diâmetro $BC$ (ângulo reto inscrito). A reta $AH$ é perpendicular ao diâmetro e corta a circunferência em $A$ e $A^{\prime}$, com $HA = HA^{\prime}$. Potência de $H$: $HA \cdot HA^{\prime} = HB \cdot HC$, ou $AH^2 = mn$.
      b) $AH = 4$.
      c) $\tfrac{10 \cdot 4}{2} = 20$.
    resposta: 'b) 4; c) 20'

  - estilo: Fuvest
    texto: |
      Considere a Terra uma esfera de raio $R = 6400$ km e um observador com os olhos a altura $h$ acima do mar.
    enunciado: ''
    itens:
    - 'Use a potência do ponto onde estão os olhos para mostrar que a distância ao horizonte é $d = \sqrt{h(h + 2R)}$.'
    - 'Calcule $d$ para $h = 5$ m (despreze $h$ diante de $2R$).'
    - 'Dois faróis, com luzes a 5 m e a 20 m do mar, podem ser vistos um do outro a que distância máxima, aproximadamente?'
    espaco: 62
    resolucao: |
      a) A reta pelo olho e pelo centro corta a esfera a distâncias $h$ e $h + 2R$; a tangente até o horizonte tem $d^2 = h(h + 2R)$.
      b) $d \approx \sqrt{0{,}005 \cdot 12\,800} = \sqrt{64} = 8$ km.
      c) Os horizontes se somam: $8 + \sqrt{0{,}02 \cdot 12\,800} = 8 + 16 = 24$ km.
    resposta: 'b) 8 km; c) 24 km'
