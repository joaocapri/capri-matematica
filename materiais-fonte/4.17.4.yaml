# Aula 4.17.4 — Geometria espacial: inscrição e circunscrição II (esfera, cilindro, cone e tetraedro)
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: cilindro circunscrito à esfera (r = R, h = 2R, razão 2/3); cilindro inscrito numa esfera
# (r² + (h/2)² = R²; equilátero r = R√2/2); cone inscrito numa esfera (r² = h(2R − h); equilátero h = 3R/2);
# esfera inscrita num cone (secção meridiana, raio = Rh/(R + g); equilátero h/3 e 2h/3); tetraedro regular
# (r = h/4, R = 3h/4); esfera inscrita em pirâmide (r = 3V/A_T).
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Com corpos redondos, trabalhe na secção meridiana (o corte pelo eixo), onde esferas viram círculos, cilindros viram retângulos e cones viram triângulos. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Uma esfera de raio 6 está inscrita num cilindro (o cilindro está circunscrito a ela). Complete.'
      itens:
      - 'Raio do cilindro: {{6}}'
      - 'Altura do cilindro: {{12}}'
      - 'Volume do cilindro: {{432\pi}}'
      - 'Volume da esfera: {{288\pi}}'
      espaco_item: 8
      resolucao: |
        A esfera toca as bases e a superfície lateral: $r = 6$ e $h = 12$. $\pi \cdot 36 \cdot 12 = 432\pi$; esfera $288\pi$, que é $\tfrac{2}{3}$ do cilindro.
      resposta: '6; 12; $432\pi$; $288\pi$'
    - enunciado: 'Associe cada situação à medida pedida.'
      esquerda:
      - 'altura do cilindro circunscrito a uma esfera de raio $R$'
      - 'raio do cilindro equilátero inscrito numa esfera de raio $R$'
      - 'altura do cone equilátero inscrito numa esfera de raio $R$'
      - 'raio da esfera inscrita num cone equilátero de altura $h$'
      - 'raio da esfera inscrita num tetraedro regular de altura $h$'
      direita:
      - '$\frac{h}{4}$'
      - '$2R$'
      - '$\frac{3R}{2}$'
      - '$\frac{R\sqrt{2}}{2}$'
      - '$\frac{h}{3}$'
      resolucao: |
        No cone equilátero, a secção é um triângulo equilátero: o incentro está a $\tfrac{h}{3}$ da base, e o circuncentro, a $\tfrac{2h}{3}$ do vértice. No tetraedro regular, o centro está a $\tfrac{h}{4}$ de cada face.
      resposta: 'De cima para baixo: 5, 1, 3, 2, 4'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'O volume de uma esfera é $\frac{2}{3}$ do volume do cilindro circunscrito a ela.'
      - 'Todo cilindro reto admite uma esfera inscrita.'
      - 'Todo cone reto admite uma esfera inscrita.'
      - 'O raio da esfera inscrita num tetraedro regular é metade da altura do tetraedro.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) (F) Só se a altura for igual ao diâmetro da base (cilindro equilátero). (V) É o círculo inscrito no triângulo da secção meridiana, girado. (F) É $\tfrac{h}{4}$.
      resposta: V, F, V, F
    - enunciado: 'Cilindros de raio $r$ e altura $h$ estão inscritos numa esfera de raio 10, isto é, $r^2 + \left(\frac{h}{2}\right)^2 = 100$. Complete; na última linha, o cilindro é equilátero ($h = 2r$).'
      tabela:
        cabecalho: ['$r$', '$h$']
        linhas:
        - ['$6$', '${{16}}$']
        - ['$8$', '${{12}}$']
        - ['${{5\sqrt{3}}}$', '$10$']
        - ['${{5\sqrt{2}}}$', '${{10\sqrt{2}}}$']
      resolucao: |
        Na secção meridiana, o retângulo $2r \times h$ tem diagonal igual ao diâmetro 20. No equilátero, $h = 2r$: $2r^2 = 100$.
      resposta: '16; 12; $5\sqrt{3}$; $5\sqrt{2}$ e $10\sqrt{2}$'
    - enunciado: 'A figura mostra a secção meridiana de um cone de raio 5 e altura 12 e da esfera inscrita nele. Calcule o raio da esfera.'
      figura:
        tikz: |
          \begin{scope}[scale=1]
          \draw[ink, line width=1pt, fill=lilas!15] (-1,0) -- (1,0) -- (0,2.4) -- cycle;
          \draw[roxo, line width=1pt, fill=lilas!40] (0,0.667) circle (0.667);
          \draw[mudo, dashed] (0,0) -- (0,2.4);
          \node[below, font=\scriptsize] at (0.5,0) {$5$};
          \node[right, font=\scriptsize] at (0,1.7) {$12$};
          \end{scope}
      espaco: 10
      resolucao: |
        Geratriz 13. O raio é o do círculo inscrito no triângulo de lados 13, 13 e 10: área $60$, semiperímetro $18$, raio $\tfrac{60}{18} = \tfrac{10}{3}$.
      resposta: '$\frac{10}{3}$'
    - enunciado: 'Um tetraedro regular tem aresta 6. Calcule a altura e os raios das esferas inscrita e circunscrita.'
      espaco: 10
      resolucao: |
        $h = \tfrac{6\sqrt{6}}{3} = 2\sqrt{6}$; $r = \tfrac{h}{4} = \tfrac{\sqrt{6}}{2}$; $R = \tfrac{3h}{4} = \tfrac{3\sqrt{6}}{2}$.
      resposta: '$2\sqrt{6}$; $\frac{\sqrt{6}}{2}$; $\frac{3\sqrt{6}}{2}$'
    - enunciado: 'Um cone equilátero tem raio da base 3. Calcule a altura e os raios das esferas inscrita e circunscrita.'
      espaco: 10
      resolucao: |
        $g = 6$, $h = 3\sqrt{3}$. Inscrita $\tfrac{h}{3} = \sqrt{3}$; circunscrita $\tfrac{2h}{3} = 2\sqrt{3}$.
      resposta: '$3\sqrt{3}$; $\sqrt{3}$; $2\sqrt{3}$'
  - nome: Nível 2
    questoes:
    - texto: |
        Para achar o raio da esfera inscrita num cone de raio 5 e altura 12, Bruno disse: "a esfera ocupa metade da altura, então o raio é 6".
      enunciado: 'Encontre o erro e corrija.'
      espaco: 10
      resolucao: |
        A esfera toca a base e a superfície lateral, não o vértice. Na secção, é o círculo inscrito no triângulo de lados 13, 13, 10: $r = \tfrac{60}{18} = \tfrac{10}{3}$.
      resposta: '$\frac{10}{3}$'
    - enunciado: 'Um cilindro de altura 6 está inscrito numa esfera de raio 5. Calcule o raio e o volume do cilindro e a fração do volume da esfera que ele ocupa.'
      espaco: 12
      resolucao: |
        $r^2 + 9 = 25$: $r = 4$. $V = \pi \cdot 16 \cdot 6 = 96\pi$. Esfera $\tfrac{500\pi}{3}$: fração $\tfrac{288}{500} = 0{,}576$.
      resposta: '4; $96\pi$; 0,576'
    - enunciado: 'Um cone de altura 8 está inscrito numa esfera de raio 5 (vértice e circunferência da base sobre a esfera). Calcule o raio da base e o volume do cone.'
      espaco: 10
      resolucao: |
        O centro está a $8 - 5 = 3$ do plano da base: $r^2 = 25 - 9 = 16$, $r = 4$. $V = \tfrac{\pi \cdot 16 \cdot 8}{3} = \tfrac{128\pi}{3}$.
      resposta: '4; $\frac{128\pi}{3}$'
    - enunciado: 'Uma pirâmide quadrangular regular tem aresta da base 6 e altura 4. Calcule o raio da esfera inscrita, usando $V = \frac{r \cdot A_T}{3}$.'
      espaco: 12
      resolucao: |
        Apótema $\sqrt{16 + 9} = 5$. $A_T = 36 + 60 = 96$; $V = \tfrac{36 \cdot 4}{3} = 48$. $r = \tfrac{3 \cdot 48}{96} = 1{,}5$.
      resposta: '1,5'
    - enunciado: 'Uma bola de raio 2 está dentro de um copo cônico de abertura $60°$ (secção meridiana equilátera), tocando a parede. A que distância do vértice do cone está o centro da bola?'
      espaco: 10
      resolucao: |
        A geratriz forma $30°$ com o eixo: $\operatorname{sen}30° = \tfrac{2}{d}$, $d = 4$.
      resposta: '4'
    - enunciado: 'Três bolas iguais de raio $r$ são guardadas empilhadas num tubo cilíndrico ajustado a elas. Que fração do volume do tubo as bolas ocupam?'
      espaco: 10
      resolucao: |
        Tubo: raio $r$, altura $6r$, volume $6\pi r^3$. Bolas: $3 \cdot \tfrac{4\pi r^3}{3} = 4\pi r^3$. Fração $\tfrac{2}{3}$.
      resposta: '$\frac{2}{3}$'
    - enunciado: 'Um cilindro equilátero está inscrito numa esfera de raio 6. Complete.'
      itens:
      - 'Raio do cilindro: {{3\sqrt{2}}}'
      - 'Altura do cilindro: {{6\sqrt{2}}}'
      - 'Volume do cilindro: {{108\sqrt{2}\,\pi}}'
      espaco_item: 8
      resolucao: |
        $h = 2r$ e $r^2 + r^2 = 36$: $r = 3\sqrt{2}$. $V = \pi \cdot 18 \cdot 6\sqrt{2}$.
      resposta: '$3\sqrt{2}$; $6\sqrt{2}$; $108\sqrt{2}\,\pi$'
    - enunciado: 'Um cone de altura 4 está circunscrito a uma esfera de raio 1. Calcule o raio da base e o volume do cone.'
      espaco: 12
      resolucao: |
        O centro está a 1 da base, logo a 3 do vértice. Com $\alpha$ o ângulo entre geratriz e eixo: $\operatorname{sen}\alpha = \tfrac{1}{3}$, $\operatorname{tg}\alpha = \tfrac{1}{2\sqrt{2}}$. Raio $4\operatorname{tg}\alpha = \sqrt{2}$; $V = \tfrac{\pi \cdot 2 \cdot 4}{3} = \tfrac{8\pi}{3}$.
      resposta: '$\sqrt{2}$; $\frac{8\pi}{3}$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que um cilindro de raio $r$ e altura $h$ inscrito numa esfera de raio $R$ satisfaz $r^2 + \frac{h^2}{4} = R^2$.'
      espaco: 10
      resolucao: |
        Na secção meridiana, o retângulo $2r \times h$ está inscrito no círculo de raio $R$: a sua diagonal é um diâmetro. $(2r)^2 + h^2 = 4R^2$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que, num cone equilátero de altura $h$, a esfera inscrita tem raio $\frac{h}{3}$ e a circunscrita, $\frac{2h}{3}$.'
      espaco: 10
      resolucao: |
        A secção meridiana é um triângulo equilátero de altura $h$. Nele, incentro e circuncentro coincidem com o baricentro, que divide a altura na razão $2 : 1$.
      resposta: 'Ver resolução'
    - enunciado: 'Num tetraedro regular de altura $h$, prove que o raio da esfera inscrita é $\frac{h}{4}$, dividindo o tetraedro em quatro pirâmides com vértice no centro.'
      espaco: 12
      resolucao: |
        Sendo $S$ a área de uma face: $\tfrac{S h}{3} = 4 \cdot \tfrac{S r}{3}$, logo $r = \tfrac{h}{4}$. A circunscrita tem $R = h - r = \tfrac{3h}{4}$, pois o centro está sobre a altura.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que o raio da esfera inscrita num cone reto de raio $R$, altura $h$ e geratriz $g$ é $\frac{Rh}{R + g}$.'
      espaco: 12
      resolucao: |
        Na secção, o triângulo de lados $g$, $g$ e $2R$ tem área $Rh$ e semiperímetro $R + g$. O raio do círculo inscrito é área sobre semiperímetro.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que um cone de altura $h$ inscrito numa esfera de raio $R$ tem raio da base $r$ com $r^2 = h(2R - h)$.'
      espaco: 10
      resolucao: |
        O centro está sobre o eixo, a $|h - R|$ do plano da base. A circunferência da base está na esfera: $r^2 = R^2 - (h - R)^2 = 2Rh - h^2$.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Bolas de tênis de 3 cm de raio são vendidas em tubos cilíndricos com 3 bolas empilhadas, como na figura, e o tubo é ajustado às bolas (elas tocam a parede, o fundo e a tampa). O fabricante quer saber o volume de ar dentro do tubo fechado. Use 3 como aproximação para $\pi$.
    figura:
      tikz: |
        \begin{scope}[scale=.6]
        \draw[ink, line width=1pt] (-0.6,0) -- (-0.6,3.6) (0.6,0) -- (0.6,3.6);
        \draw[ink, line width=1pt] (0,3.6) ellipse (0.6 and 0.15);
        \draw[ink, line width=1pt] (-0.6,0) arc (180:360:0.6 and 0.15);
        \foreach \y in {0.6, 1.8, 3.0} \shade[ball color=lilas!60] (0,\y) circle (0.58);
        \end{scope}
    enunciado: |
      O volume de ar no tubo é
    opcoes: ['$162$ cm³', '$486$ cm³', '$324$ cm³', '$108$ cm³', '$54$ cm³']
    correta: A
    resolucao: |
      Tubo: raio 3, altura 18, $\pi \cdot 9 \cdot 18 = 162\pi$. Bolas: $3 \cdot 36\pi = 108\pi$. Ar $54\pi \approx 162$ cm³.

  - estilo: Fuvest
    enunciado: |
      O raio da esfera inscrita num tetraedro regular de aresta 12 é
    opcoes: ['$2\sqrt{6}$', '$\sqrt{6}$', '$3\sqrt{6}$', '$\frac{\sqrt{6}}{2}$', '$4\sqrt{6}$']
    correta: B
    resolucao: |
      $h = 4\sqrt{6}$ e $r = \tfrac{h}{4} = \sqrt{6}$.

  - estilo: Unicamp
    enunciado: |
      Um cilindro de raio 5 está inscrito numa esfera de raio 13. A altura do cilindro é
    opcoes: ['$12$.', '$18$.', '$24$.', '$26$.']
    correta: C
    resolucao: |
      $25 + \tfrac{h^2}{4} = 169$: $\tfrac{h}{2} = 12$, $h = 24$.

  - estilo: UEM
    enunciado: |
      Considere um cone equilátero de raio da base 6. Assinale o que for correto.
    proposicoes:
    - 'A geratriz mede 12.'
    - 'A esfera inscrita tem raio $2\sqrt{3}$.'
    - 'A esfera circunscrita tem raio $4\sqrt{3}$.'
    - 'O volume da esfera circunscrita é 8 vezes o da inscrita.'
    - 'O raio da esfera inscrita é metade do raio da base.'
    - 'A área da esfera inscrita é $48\pi$.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      $h = 6\sqrt{3}$. 01) $g = 2r$. 02) $\tfrac{h}{3}$. 04) $\tfrac{2h}{3}$. 08) Raios na razão 2. 16) Incorreta: $2\sqrt{3} \approx 3{,}46 \ne 3$. 32) $4\pi \cdot 12$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      Uma taça de sobremesa tem a parte interna em forma de cone com abertura de $60°$, isto é, a secção pelo eixo é um triângulo equilátero. Uma bola de sorvete de 3 cm de raio é colocada na taça e fica apoiada, tocando a parede em toda a volta. O confeiteiro quer saber a que altura, a partir do fundo (vértice), fica o centro da bola.
    enunciado: |
      Essa altura é
    opcoes: ['$3$ cm', '$4{,}5$ cm', '$9$ cm', '$6$ cm', '$3\sqrt{3}$ cm']
    correta: D
    resolucao: |
      A geratriz forma $30°$ com o eixo: $\operatorname{sen}30° = \tfrac{3}{d}$, $d = 6$ cm.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir, sobre inscrição e circunscrição de esferas em corpos redondos.
    afirmativas:
    - 'O cilindro circunscrito a uma esfera de raio $R$ tem altura $2R$.'
    - 'Todo cilindro reto admite uma esfera inscrita.'
    - 'O volume da esfera é $\frac{2}{3}$ do volume do cilindro circunscrito a ela.'
    - 'Todo cone reto admite uma esfera inscrita.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'I e III, apenas.', 'II e IV, apenas.', 'II, III e IV, apenas.', 'I, III e IV, apenas.']
    correta: E
    resolucao: |
      I. Correta. II. Incorreta: só o cilindro equilátero. III. Correta. IV. Correta.

  - estilo: Unesp
    enunciado: |
      O raio da esfera circunscrita a um tetraedro regular de aresta 4 é
    opcoes: ['$\sqrt{6}$', '$\frac{\sqrt{6}}{3}$', '$2\sqrt{6}$', '$\frac{\sqrt{6}}{2}$', '$\frac{4\sqrt{6}}{3}$']
    correta: A
    resolucao: |
      $h = \tfrac{4\sqrt{6}}{3}$ e $R = \tfrac{3h}{4} = \sqrt{6}$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      A figura mostra a secção meridiana de um cone de raio 6 e altura 8 e da esfera inscrita nele.
    figura:
      tikz: |
        \begin{scope}[scale=1]
        \draw[ink, line width=1pt, fill=lilas!15] (-1.2,0) -- (1.2,0) -- (0,1.6) -- cycle;
        \draw[roxo, line width=1pt, fill=lilas!40] (0,0.6) circle (0.6);
        \draw[mudo, dashed] (0,0) -- (0,1.6);
        \node[below, font=\scriptsize] at (0.6,0) {$6$};
        \node[right, font=\scriptsize] at (0,1.35) {$8$};
        \end{scope}
    enunciado: |
      O volume da esfera é
    opcoes: ['$27\pi$.', '$36\pi$.', '$48\pi$.', '$\frac{256\pi}{3}$.']
    correta: B
    resolucao: |
      $g = 10$; raio $\tfrac{Rh}{R + g} = \tfrac{48}{16} = 3$. Volume $36\pi$.

  - estilo: Fuvest
    enunciado: |
      Um cone de altura 9 está inscrito numa esfera de raio 6. O volume do cone é
    opcoes: ['$27\pi$', '$162\pi$', '$81\pi$', '$54\pi$', '$243\pi$']
    correta: C
    resolucao: |
      $r^2 = 9(12 - 9) = 27$. $V = \tfrac{\pi \cdot 27 \cdot 9}{3} = 81\pi$.

  - estilo: UFSC
    enunciado: |
      Um cilindro de altura 8 está inscrito numa esfera de raio 5. Assinale o que for correto.
    proposicoes:
    - 'O raio do cilindro é 3.'
    - 'O volume do cilindro é $72\pi$.'
    - 'A área lateral do cilindro é $48\pi$.'
    - 'O volume da esfera é $\frac{500\pi}{3}$.'
    - 'A secção meridiana do cilindro é um retângulo de diagonal 10.'
    - 'O cilindro ocupa mais da metade do volume da esfera.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) $r^2 + 16 = 25$. 02) $\pi \cdot 9 \cdot 8$. 04) $2\pi \cdot 3 \cdot 8$. 08) Correta. 16) A diagonal é um diâmetro. 32) Incorreta: $\tfrac{72}{500/3} = 0{,}432$.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      Uma bola de boliche é vendida numa caixa cilíndrica ajustada a ela: a bola toca a tampa, o fundo e a parede lateral. O fabricante da embalagem quer informar, no rótulo, que porcentagem do volume interno da caixa é ocupada pela bola, arredondando para o inteiro mais próximo.
    enunciado: |
      Essa porcentagem é
    opcoes: ['$67\%$', '$50\%$', '$75\%$', '$52\%$', '$33\%$']
    correta: A
    resolucao: |
      Cilindro circunscrito: $\tfrac{4\pi R^3/3}{2\pi R^3} = \tfrac{2}{3} \approx 67\%$.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'O cilindro equilátero inscrito numa esfera de raio 2 tem raio $\sqrt{2}$.'
    - 'O cone equilátero inscrito numa esfera de raio $R$ tem altura $2R$.'
    - 'Num tetraedro regular, o raio da esfera circunscrita é o triplo do raio da inscrita.'
    - 'Um cone de altura 2 inscrito numa esfera de raio 5 tem raio da base 4.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – F – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – V – F.', 'V – F – V – V.']
    correta: E
    resolucao: |
      (V) $2r^2 = 4$. (F) É $\tfrac{3R}{2}$. (V) $\tfrac{3h/4}{h/4}$. (V) $r^2 = 2(10 - 2) = 16$.

  - estilo: Enem
    texto: |
      Um designer quer uma luminária em que uma lâmpada cilíndrica fique inscrita num globo esférico de 10 cm de raio, com as bordas das bases tocando o vidro. O quadro mostra a altura de cinco lâmpadas possíveis, em centímetros; o raio de cada uma é o que a faz caber exatamente no globo. Ele quer a lâmpada de maior volume.
    tabela:
      cabecalho: ['Lâmpada', 'L1', 'L2', 'L3', 'L4', 'L5']
      linhas:
      - ['Altura', '$8$', '$10$', '$14$', '$12$', '$16$']
    enunciado: |
      A lâmpada escolhida é a
    opcoes: ['L1.', 'L2.', 'L3.', 'L4.', 'L5.']
    correta: D
    resolucao: |
      $r^2 = 100 - \tfrac{h^2}{4}$ e $V = \pi r^2 h$: L1 $84 \cdot 8 = 672$; L2 $75 \cdot 10 = 750$; L3 $51 \cdot 14 = 714$; L4 $64 \cdot 12 = 768$; L5 $36 \cdot 16 = 576$ (vezes $\pi$).

  - estilo: Unesp
    enunciado: |
      O cilindro circunscrito a uma esfera tem volume $686\pi$. A área da esfera é
    opcoes: ['$49\pi$', '$196\pi$', '$98\pi$', '$\frac{1372\pi}{3}$', '$343\pi$']
    correta: B
    resolucao: |
      $2\pi R^3 = 686\pi$: $R = 7$. Área $196\pi$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Uma pirâmide quadrangular regular tem aresta da base 12 e altura 8. Assinale o que for correto.
    proposicoes:
    - 'O apótema da pirâmide mede 10.'
    - 'O volume da pirâmide é 384.'
    - 'A área total da pirâmide é 384.'
    - 'A esfera inscrita na pirâmide tem raio 3.'
    - 'O centro da esfera inscrita está a 3 do plano da base.'
    - 'A esfera inscrita toca as arestas laterais da pirâmide.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) $\sqrt{64 + 36}$. 02) $\tfrac{144 \cdot 8}{3}$. 04) $144 + 4 \cdot 60$. 08) $r = \tfrac{3V}{A_T} = \tfrac{1152}{384}$. 16) Ela toca a base. 32) Incorreta: toca as faces, não as arestas.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Unicamp
    enunciado: |
      Num tetraedro regular, a razão entre o raio da esfera circunscrita e o raio da esfera inscrita é
    opcoes: ['$3$.', '$2$.', '$4$.', '$\sqrt{3}$.']
    correta: A
    resolucao: |
      $\tfrac{3h/4}{h/4} = 3$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Uma luminária decorativa é formada por um globo de vidro esférico de 10 cm de raio, dentro do qual há uma peça cilíndrica de acrílico com 12 cm de altura, inscrita no globo (as bordas das bases tocam o vidro). O fabricante quer saber o volume da peça e que parte do globo ela ocupa. Use 3 como aproximação para $\pi$.
    enunciado: |
      O volume da peça cilíndrica é
    opcoes: ['$1152$ cm³', '$4000$ cm³', '$2304$ cm³', '$768$ cm³', '$3072$ cm³']
    correta: C
    resolucao: |
      $r^2 = 100 - 36 = 64$: $V = \pi \cdot 64 \cdot 12 = 768\pi \approx 2304$ cm³.

  - estilo: Unesp
    enunciado: |
      A peça ocupa que porcentagem do volume do globo?
    opcoes: ['$76{,}8\%$', '$42{,}4\%$', '$66{,}7\%$', '$57{,}6\%$', '$50\%$']
    correta: D
    resolucao: |
      Globo $\tfrac{4000\pi}{3}$: $\tfrac{768\pi}{4000\pi/3} = 0{,}576$.

  - estilo: Fuvest
    enunciado: |
      Um cone equilátero está circunscrito a uma esfera. A razão entre o volume do cone e o volume da esfera é
    opcoes: ['$2$', '$\frac{3}{2}$', '$3$', '$\frac{4}{3}$', '$\frac{9}{4}$']
    correta: E
    resolucao: |
      Com esfera de raio $r$: altura do cone $3r$, raio da base $\tfrac{3r}{\sqrt{3}} = r\sqrt{3}$. $V_{\text{cone}} = \tfrac{\pi \cdot 3r^2 \cdot 3r}{3} = 3\pi r^3$; razão $\tfrac{3}{4/3} = \tfrac{9}{4}$.

  - estilo: Unesp
    texto: |
      A figura mostra a secção meridiana de um cone de altura 16 inscrito numa esfera de raio 10: o vértice e a circunferência da base estão na esfera.
    figura:
      tikz: |
        \begin{scope}[scale=1]
        \draw[roxo, line width=1pt, fill=lilas!15] (0,0) circle (1.2);
        \draw[ink, line width=1pt, fill=lilas!40] (-0.96,-0.72) -- (0.96,-0.72) -- (0,1.2) -- cycle;
        \fill[ink] (0,0) circle (1.2pt);
        \draw[mudo, dashed] (0,-0.72) -- (0,1.2);
        \draw[mudo] (0,0) -- (-1.2,0);
        \node[above, font=\scriptsize] at (-0.6,0) {$10$};
        \node[right, font=\scriptsize] at (0,0.5) {$16$};
        \end{scope}
    enunciado: |
      O raio da base do cone é
    opcoes: ['$6$', '$8$', '$10$', '$4\sqrt{5}$', '$12$']
    correta: B
    resolucao: |
      O centro está a $16 - 10 = 6$ da base: $r = \sqrt{100 - 36} = 8$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere um tetraedro regular de aresta $a$ e altura $h = \frac{a\sqrt{6}}{3}$.'
    itens:
    - 'Prove que o raio da esfera inscrita é $\frac{h}{4}$ e o da circunscrita é $\frac{3h}{4}$.'
    - 'Prove que o raio da esfera tangente às seis arestas é $\frac{a\sqrt{2}}{4}$, sabendo que a distância entre duas arestas opostas é $\frac{a\sqrt{2}}{2}$.'
    - 'Para $a = 6$, calcule os três raios.'
    espaco: 62
    resolucao: |
      a) Quatro pirâmides de vértice no centro: $\tfrac{Sh}{3} = 4 \cdot \tfrac{Sr}{3}$. O centro está na altura, a $r$ da base: $R = h - r$.
      b) Por simetria, o centro é o ponto médio do segmento que une os pontos médios de duas arestas opostas, perpendicular a ambas: está a metade dessa distância de cada aresta.
      c) $h = 2\sqrt{6}$: $\tfrac{\sqrt{6}}{2}$, $\tfrac{3\sqrt{6}}{2}$ e $\tfrac{3\sqrt{2}}{2}$.
    resposta: 'c) $\frac{\sqrt{6}}{2}$, $\frac{3\sqrt{6}}{2}$ e $\frac{3\sqrt{2}}{2}$'

  - estilo: Unicamp
    enunciado: 'Uma esfera está inscrita num cone reto de raio $R$, altura $h$ e geratriz $g$.'
    itens:
    - 'Prove que o raio da esfera é $\frac{Rh}{R + g}$.'
    - 'Verifique a fórmula para o cone equilátero, mostrando que ela dá $\frac{h}{3}$.'
    - 'Para $R = 9$ e $h = 12$, calcule o raio e o volume da esfera.'
    espaco: 62
    resolucao: |
      a) Na secção, o triângulo de lados $g$, $g$, $2R$ tem área $Rh$ e semiperímetro $R + g$; o raio do círculo inscrito é a razão.
      b) $g = 2R$: $\tfrac{Rh}{3R} = \tfrac{h}{3}$.
      c) $g = 15$: $r = \tfrac{108}{24} = 4{,}5$; $V = \tfrac{4\pi}{3} \cdot 91{,}125 = 121{,}5\pi$.
    resposta: 'c) 4,5 e $121{,}5\pi$'

  - estilo: ITA
    enunciado: |
      Uma esfera de raio 1 está inscrita num cone reto de altura 6. O raio da base do cone é
    opcoes: ['$\frac{\sqrt{6}}{2}$', '$\sqrt{2}$', '$\frac{\sqrt{3}}{2}$', '$\sqrt{6}$', '$\frac{6}{5}$']
    correta: A
    espaco: 22
    resolucao: |
      O centro está a 5 do vértice: $\operatorname{sen}\alpha = \tfrac{1}{5}$, $\operatorname{tg}\alpha = \tfrac{1}{\sqrt{24}}$. Raio $6\operatorname{tg}\alpha = \tfrac{6}{2\sqrt{6}} = \tfrac{\sqrt{6}}{2}$.
    resposta: 'A'

  - estilo: Unesp
    texto: |
      Bolas de tênis de 3,5 cm de raio são vendidas em tubos cilíndricos com 3 bolas, ajustados a elas.
    enunciado: ''
    itens:
    - 'Calcule as dimensões e o volume do tubo, com $\pi \approx 3{,}14$.'
    - 'Calcule o volume ocupado pelas bolas.'
    - 'Mostre que a fração ocupada não depende do raio das bolas.'
    espaco: 62
    resolucao: |
      a) Raio 3,5 cm e altura 21 cm: $\pi \cdot 12{,}25 \cdot 21 = 257{,}25\pi \approx 807{,}8$ cm³.
      b) $3 \cdot \tfrac{4\pi \cdot 42{,}875}{3} = 171{,}5\pi \approx 538{,}5$ cm³.
      c) $\tfrac{4\pi r^3}{\pi r^2 \cdot 6r} = \tfrac{2}{3}$, para qualquer $r$.
    resposta: 'a) $\approx 807{,}8$ cm³; b) $\approx 538{,}5$ cm³; c) $\frac{2}{3}$'

  - estilo: UFSC
    enunciado: |
      Considere inscrições e circunscrições envolvendo esferas. Assinale o que for correto.
    proposicoes:
    - 'O cilindro circunscrito a uma esfera de raio $R$ tem volume $2\pi R^3$.'
    - 'O cilindro equilátero inscrito numa esfera de raio $R$ tem raio $\frac{R\sqrt{2}}{2}$.'
    - 'A esfera inscrita num tetraedro regular de aresta $a$ tem raio $\frac{a\sqrt{6}}{12}$.'
    - 'O cone equilátero circunscrito a uma esfera de raio $r$ tem altura $2r$.'
    - 'O cone de altura 8 inscrito numa esfera de raio 5 tem raio da base 4.'
    - 'Todo cilindro equilátero admite uma esfera inscrita.'
    corretas: [1, 2, 3, 5, 6]
    espaco: 22
    resolucao: |
      01) $\pi R^2 \cdot 2R$. 02) $2r^2 = R^2$. 04) $\tfrac{h}{4}$ com $h = \tfrac{a\sqrt{6}}{3}$. 08) Incorreta: $3r$. 16) $r^2 = 8 \cdot 2$. 32) Altura igual ao diâmetro.
    resposta: 'Soma 55 (01 + 02 + 04 + 16 + 32)'

  - estilo: Fuvest
    enunciado: 'Um cone de altura $h$ está inscrito numa esfera de raio $R$.'
    itens:
    - 'Prove que o raio da base é dado por $r^2 = h(2R - h)$.'
    - 'Prove que, se o cone é equilátero, $h = \frac{3R}{2}$.'
    - 'Para $R = 4$ e cone equilátero, calcule o volume do cone e a fração do volume da esfera que ele ocupa.'
    espaco: 62
    resolucao: |
      a) A base está a $|h - R|$ do centro: $r^2 = R^2 - (h - R)^2$.
      b) No triângulo equilátero da secção, o circuncentro está a $\tfrac{2h}{3}$ do vértice: $R = \tfrac{2h}{3}$.
      c) $h = 6$, $r^2 = 6 \cdot 2 = 12$: $V = \tfrac{\pi \cdot 12 \cdot 6}{3} = 24\pi$. Esfera $\tfrac{256\pi}{3}$: fração $\tfrac{72}{256} = \tfrac{9}{32}$.
    resposta: 'c) $24\pi$ e $\frac{9}{32}$'

  - estilo: Unicamp
    enunciado: 'Um poliedro tem uma esfera inscrita de raio $r$ (tangente a todas as faces).'
    itens:
    - 'Dividindo o poliedro em pirâmides com vértice no centro da esfera e bases nas faces, prove que $V = \frac{r \cdot A_T}{3}$.'
    - 'Use a fórmula para obter o raio da esfera inscrita num cubo de aresta $a$.'
    - 'Calcule o raio da esfera inscrita numa pirâmide quadrangular regular de aresta da base 10 e altura 12.'
    espaco: 62
    resolucao: |
      a) Cada pirâmide tem altura $r$ e base numa face: $V = \sum \tfrac{r S_i}{3} = \tfrac{r A_T}{3}$.
      b) $a^3 = \tfrac{r \cdot 6a^2}{3}$: $r = \tfrac{a}{2}$.
      c) Apótema 13; $A_T = 100 + 260 = 360$; $V = 400$. $r = \tfrac{1200}{360} = \tfrac{10}{3}$.
    resposta: 'b) $\frac{a}{2}$; c) $\frac{10}{3}$'

  - estilo: Fuvest
    enunciado: |
      Um cilindro equilátero está inscrito numa esfera. A razão entre o volume do cilindro e o da esfera é
    opcoes: ['$\frac{2}{3}$', '$\frac{\sqrt{2}}{2}$', '$\frac{3\sqrt{2}}{8}$', '$\frac{1}{2}$', '$\frac{3}{8}$']
    correta: C
    espaco: 22
    resolucao: |
      $r = \tfrac{R}{\sqrt{2}}$, $h = R\sqrt{2}$: $V = \pi \tfrac{R^2}{2} R\sqrt{2} = \tfrac{\pi R^3\sqrt{2}}{2}$. Razão $\tfrac{\sqrt{2}/2}{4/3} = \tfrac{3\sqrt{2}}{8}$.
    resposta: 'C'

  - estilo: Unesp
    texto: |
      Uma taça tem a parte interna em forma de cone com abertura de $60°$ e 8 cm de altura. Uma bola de sorvete de 3 cm de raio é colocada nela, tocando a parede em toda a volta.
    enunciado: ''
    itens:
    - 'A que distância do vértice fica o centro da bola?'
    - 'A bola ultrapassa a borda da taça? Em quanto?'
    - 'Calcule o volume da parte da bola acima da borda.'
    espaco: 62
    resolucao: |
      a) $\operatorname{sen}30° = \tfrac{3}{d}$: $d = 6$ cm.
      b) O ponto mais alto da bola está a $6 + 3 = 9$ cm do vértice: ultrapassa 1 cm.
      c) Segmento esférico de altura 1: $\tfrac{\pi \cdot 1 \cdot (9 - 1)}{3} = \tfrac{8\pi}{3}$ cm³.
    resposta: 'a) 6 cm; b) sim, 1 cm; c) $\frac{8\pi}{3}$ cm³'

  - estilo: Fuvest
    enunciado: 'Cilindros de raio $r$ e altura $h$ estão inscritos numa esfera de raio 6.'
    itens:
    - 'Escreva a relação entre $r$ e $h$.'
    - 'Usando $xy \le \frac{x^2 + y^2}{2}$ com $x = r$ e $y = \frac{h}{2}$, prove que a área lateral do cilindro é no máximo $72\pi$.'
    - 'Para qual cilindro a área lateral é máxima? Calcule $r$ e $h$.'
    espaco: 62
    resolucao: |
      a) $r^2 + \tfrac{h^2}{4} = 36$.
      b) $r \cdot \tfrac{h}{2} \le \tfrac{36}{2} = 18$: $rh \le 36$ e $2\pi r h \le 72\pi$.
      c) Igualdade quando $r = \tfrac{h}{2}$ (cilindro equilátero): $r = 3\sqrt{2}$ e $h = 6\sqrt{2}$.
    resposta: 'b) $72\pi$; c) $r = 3\sqrt{2}$ e $h = 6\sqrt{2}$'
