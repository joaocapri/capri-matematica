# A13 — Estudo do Sinal e Inequações do 1º Grau
aula: A13

fixacao:
  intro: Resolva na ordem — do aquecimento ao desafio. Em inequações-produto e quociente, monte o quadro de sinais; no quociente, a raiz do denominador nunca entra na solução.
  secoes:
    - nome: Aquecimento
      questoes:
        - enunciado: Faça o estudo do sinal de $f(x)=2x-6$.
          resolucao: |
            Raiz: $x=3$. Como $a=2>0$, a função é negativa antes da raiz e positiva depois.
          resposta: '$f>0$ se $x>3$; \ $f=0$ se $x=3$; \ $f<0$ se $x<3$'

        - enunciado: Faça o estudo do sinal de $g(x)=-3x+12$.
          resolucao: |
            Raiz: $x=4$. Como $a=-3<0$, a função é positiva antes da raiz e negativa depois.
          resposta: '$g>0$ se $x<4$; \ $g<0$ se $x>4$'

        - enunciado: Resolva em $\mathbb{R}$.
          itens:
            - $4x-8\ge0$
            - $5-2x>0$
          resolucao: |
            (a) $x\ge2$. (b) $-2x>-5\Rightarrow x<\tfrac52$.
          resposta: '(a) $[2,+\infty[$ \quad (b) $]-\infty,\tfrac52[$'

        - enunciado: Resolva $(x-1)(x+2)>0$.
          resolucao: |
            Raízes: $1$ e $-2$. Quadro de sinais: os dois fatores são negativos para $x<-2$ e positivos para $x>1$.
            O produto é positivo quando os fatores têm o mesmo sinal.
          resposta: '$x<-2$ ou $x>1$'

        - enunciado: Resolva $(x-3)(x-5)\le0$.
          resolucao: |
            O produto é negativo entre as raízes e zero nelas.
          resposta: '$[3,\,5]$'

        - enunciado: Resolva $\dfrac{x-4}{x+1}\ge0$.
          resolucao: |
            Raízes: $4$ (numerador) e $-1$ (denominador). O quociente é positivo para $x<-1$ e para $x>4$.
            O $4$ entra (zera a fração); o $-1$ não (zera o denominador).
          resposta: '$x<-1$ ou $x\ge4$'

        - enunciado: Para quais valores de $x$ a função $f(x)=-x+7$ é não negativa?
          resolucao: |
            $-x+7\ge0\Rightarrow x\le7$.
          resposta: '$x\le7$'

    - nome: Treino
      questoes:
        - enunciado: Resolva $(2x-4)(3-x)>0$.
          resolucao: |
            $2x-4$: negativo antes de $2$, positivo depois. $3-x$: positivo antes de $3$, negativo depois.
            Os dois são positivos entre $2$ e $3$; fora dali, os sinais são opostos.
          resposta: '$]2,\,3[$'

        - enunciado: Resolva $\dfrac{x+1}{2-x}\le0$.
          resolucao: |
            Para $x<-1$: $\tfrac{(-)}{(+)}<0$. Para $-1<x<2$: $\tfrac{(+)}{(+)}>0$. Para $x>2$: $\tfrac{(+)}{(-)}<0$.
            Inclua $x=-1$ (zera o numerador) e exclua $x=2$.
          resposta: '$x\le-1$ ou $x>2$'

        - enunciado: Resolva $(x-1)(x-2)(x-3)<0$.
          resolucao: |
            Para $x>3$, os três fatores são positivos; a cada raiz que passamos para a esquerda, o sinal troca.
            Sinais: $-$ em $]-\infty,1[$, $+$ em $]1,2[$, $-$ em $]2,3[$ e $+$ em $]3,+\infty[$.
          resposta: '$x<1$ ou $2<x<3$'

        - enunciado: Resolva $x(x-4)\ge0$.
          resolucao: |
            Raízes $0$ e $4$; o produto é positivo fora do intervalo entre elas e zero nas raízes.
          resposta: '$x\le0$ ou $x\ge4$'

        - enunciado: Resolva $\dfrac{3x-6}{x-5}<0$.
          resolucao: |
            Raízes $2$ e $5$; o quociente é negativo entre elas.
          resposta: '$]2,\,5[$'

        - enunciado: Resolva $\dfrac{x+3}{x-1}\le2$.
          resolucao: |
            Não multiplique "em cruz"! Passe tudo para um lado: $\dfrac{x+3-2(x-1)}{x-1}\le0\Rightarrow\dfrac{5-x}{x-1}\le0$.
            Sinais: $-$ para $x<1$, $+$ para $1<x<5$, $-$ para $x>5$. Inclua $x=5$.
          resposta: '$x<1$ ou $x\ge5$'

        - enunciado: Determine o domínio real de $f(x)=\sqrt{\dfrac{x-2}{x+3}}$.
          resolucao: |
            É preciso $\dfrac{x-2}{x+3}\ge0$, com $x\neq-3$: positivo para $x<-3$ e para $x>2$, zero em $x=2$.
          resposta: '$]-\infty,\,-3[\ \cup\ [2,\,+\infty[$'

        - enunciado: Quantos números inteiros satisfazem $(x+2)(x-4)<0$?
          resolucao: |
            Solução: $-2<x<4$. Inteiros: $-1,0,1,2,3$, ou seja, $5$.
          resposta: '$5$'

    - nome: Desafio
      questoes:
        - enunciado: Resolva $(x-1)^2(x-3)>0$.
          resolucao: |
            $(x-1)^2\ge0$, e vale zero em $x=1$. Para o produto ser positivo, é preciso $x\neq1$ e $x-3>0$.
          resposta: '$x>3$'

        - enunciado: Resolva $\dfrac1x<1$.
          resolucao: |
            $\dfrac1x-1<0\Rightarrow\dfrac{1-x}{x}<0$.
            Sinais: $-$ para $x<0$, $+$ para $0<x<1$, $-$ para $x>1$.
          resposta: '$x<0$ ou $x>1$'

        - enunciado: Resolva $\dfrac{x^2-4}{x-1}\ge0$.
          resolucao: |
            $\dfrac{(x-2)(x+2)}{x-1}$: raízes $-2$, $2$ (numerador) e $1$ (denominador).
            Sinais: $-$ em $]-\infty,-2[$, $+$ em $]-2,1[$, $-$ em $]1,2[$ e $+$ em $]2,+\infty[$.
          resposta: '$[-2,\,1[\ \cup\ [2,\,+\infty[$'

        - enunciado: O lucro mensal de uma empresa, em milhares de reais, é $L(x)=(x-20)(80-x)$, em que $x$ é o número de unidades vendidas, com $0\le x\le100$. Para quais quantidades o lucro é positivo?
          resolucao: |
            $x-20>0$ para $x>20$ e $80-x>0$ para $x<80$. Ambos positivos entre $20$ e $80$; fora dali, o produto é negativo.
          resposta: '$20<x<80$'

        - enunciado: Determine $m$ para que o conjunto solução de $(m-1)x+4>0$ seja $]-\infty,\,2[$.
          resolucao: |
            Para obter "$x<\ldots$", o coeficiente precisa ser negativo: $m-1<0$. Então $x<\dfrac{-4}{m-1}$.
            $\dfrac{-4}{m-1}=2\Rightarrow m-1=-2\Rightarrow m=-1$.
          resposta: '$m=-1$'

vestibular:
  intro: Questões autorais no estilo dos principais vestibulares. Assinale uma única alternativa.
  questoes:
    - enunciado: A função $f(x)=3x-12$ é negativa para
      opcoes: ['$x>4$', '$x<4$', '$x<-4$', '$x>-4$', '$x<12$']
      correta: B
      resolucao: |
        $3x-12<0\Rightarrow x<4$.

    - enunciado: O conjunto solução de $(x-2)(x+5)<0$ é
      opcoes: ['$]-5,\,2[$', '$]-2,\,5[$', '$]-\infty,\,-5[\ \cup\ ]2,\,+\infty[$', '$[-5,\,2]$', '$]2,\,+\infty[$']
      correta: A
      resolucao: |
        Produto negativo entre as raízes $-5$ e $2$, sem incluí-las.

    - enunciado: O conjunto solução de $\dfrac{x+1}{x-3}\ge0$ é
      opcoes: ['$[-1,\,3]$', '$]-1,\,3[$', '$]-\infty,\,-1[\ \cup\ ]3,\,+\infty[$', '$]-\infty,\,-1]\ \cup\ ]3,\,+\infty[$', '$]-\infty,\,-1]\ \cup\ [3,\,+\infty[$']
      correta: D
      resolucao: |
        Positivo fora de $]-1,3[$. O $-1$ entra (zera a fração); o $3$ não (zera o denominador). A alternativa E inclui o $3$.

    - enunciado: A quantidade de números inteiros que satisfazem $(x-1)(6-x)>0$ é
      opcoes: ['$2$', '$3$', '$4$', '$5$', '$6$']
      correta: C
      resolucao: |
        Solução: $1<x<6$. Inteiros: $2,3,4,5$.

    - enunciado: O conjunto solução de $\dfrac{2-x}{x+4}>0$ é formado pelos $x$ tais que
      opcoes: ['$x<-4$', '$x>2$', '$x<2$', '$-2<x<4$', '$-4<x<2$']
      correta: E
      resolucao: |
        Numerador positivo para $x<2$; denominador positivo para $x>-4$. Mesmo sinal (ambos positivos) entre $-4$ e $2$.

    - enunciado: O domínio real de $f(x)=\sqrt{(x+2)(5-x)}$ é
      opcoes: ['$]-2,\,5[$', '$[-5,\,2]$', '$]-\infty,\,-2]\ \cup\ [5,\,+\infty[$', '$[-2,\,5]$', '$\mathbb{R}$']
      correta: D
      resolucao: |
        $(x+2)(5-x)\ge0$: os dois fatores são positivos entre $-2$ e $5$; nos extremos, o produto vale zero.

    - enunciado: O conjunto solução de $(x-3)^2(x+1)\le0$ é
      opcoes: ['$x\le-1$', '$x\le-1$ ou $x=3$', '$-1\le x\le3$', '$x\ge3$', '$\varnothing$']
      correta: B
      resolucao: |
        $(x-3)^2\ge0$. O produto é $\le0$ quando $x+1\le0$ ou quando $(x-3)^2=0$, isto é, $x=3$.

    - enunciado: O lucro de uma empresa é $L(x)=25x-4000$ reais para $x$ unidades vendidas. Ela tem lucro não negativo quando vende pelo menos
      opcoes: ['$160$ unidades', '$170$ unidades', '$180$ unidades', '$200$ unidades', '$250$ unidades']
      correta: A
      resolucao: |
        $25x-4000\ge0\Rightarrow x\ge160$.

    - enunciado: O conjunto solução de $\dfrac3{x-2}<1$ é
      opcoes: ['$]2,\,5[$', '$]-\infty,\,5[$', '$]5,\,+\infty[$', '$]-\infty,\,2]$', '$]-\infty,\,2[\ \cup\ ]5,\,+\infty[$']
      correta: E
      resolucao: |
        $\dfrac{3-(x-2)}{x-2}<0\Rightarrow\dfrac{5-x}{x-2}<0$: negativo para $x<2$ e para $x>5$.

    - enunciado: A soma dos números inteiros que satisfazem $(x+3)(x-2)\le0$ é
      opcoes: ['$-6$', '$-5$', '$-3$', '$0$', '$3$']
      correta: C
      resolucao: |
        Solução: $-3\le x\le2$. Soma: $-3-2-1+0+1+2=-3$.

    - enunciado: O conjunto solução de $(x-1)(x-2)(x-3)\ge0$ é
      opcoes: ['$[1,\,3]$', '$[1,\,2]\ \cup\ [3,\,+\infty[$', '$]-\infty,\,1]\ \cup\ [2,\,3]$', '$[3,\,+\infty[$', '$\mathbb{R}$']
      correta: B
      resolucao: |
        Sinais, da direita para a esquerda: $+$ depois de $3$, $-$ entre $2$ e $3$, $+$ entre $1$ e $2$, $-$ antes de $1$. Incluem-se as raízes.

    - enunciado: As funções $f(x)=2x-3$ e $g(x)=-x+6$ têm o mesmo sinal, ambas não nulas, exatamente para
      opcoes: ['$x>6$', '$x<\tfrac32$', '$x>\tfrac32$', '$x<\tfrac32$ ou $x>6$', '$\tfrac32<x<6$']
      correta: E
      resolucao: |
        $f>0$ para $x>\tfrac32$ e $g>0$ para $x<6$: ambas positivas em $]\tfrac32,6[$. Ambas negativas exigiria $x<\tfrac32$ e $x>6$, o que é impossível.

    - enunciado: O conjunto solução de $\dfrac x{x-1}\ge0$ é
      opcoes: ['$[0,\,1[$', '$]0,\,1]$', '$]-\infty,\,0[\ \cup\ ]1,\,+\infty[$', '$]-\infty,\,0]\ \cup\ ]1,\,+\infty[$', '$]-\infty,\,0]\ \cup\ [1,\,+\infty[$']
      correta: D
      resolucao: |
        Positivo fora de $[0,1]$; o $0$ entra (zera a fração) e o $1$ não.

    - enunciado: O conjunto solução de $\dfrac{x-4}{x^2+1}<0$ é formado pelos $x$ tais que
      opcoes: ['$x<4$', '$x>4$', '$x<-1$', '$-1<x<1$', '$x\in\mathbb{R}$']
      correta: A
      resolucao: |
        $x^2+1>0$ sempre, então o sinal é o do numerador: $x-4<0\Rightarrow x<4$.

    - enunciado: O maior número inteiro que satisfaz $\dfrac{2x-1}{x+3}<1$ é
      opcoes: ['$1$', '$2$', '$3$', '$4$', '$5$']
      correta: C
      resolucao: |
        $\dfrac{2x-1-(x+3)}{x+3}<0\Rightarrow\dfrac{x-4}{x+3}<0\Rightarrow -3<x<4$. O maior inteiro é $3$.

    - enunciado: Sendo $a<b$, o conjunto solução de $(x-a)(b-x)>0$ é
      opcoes: ['$x<a$', '$x>b$', '$x<a$ ou $x>b$', '$x=a$ ou $x=b$', '$a<x<b$']
      correta: E
      resolucao: |
        $x-a>0$ para $x>a$ e $b-x>0$ para $x<b$. Os dois são positivos entre $a$ e $b$.

    - enunciado: A quantidade de números inteiros que satisfazem $\dfrac{x+4}{3-x}\ge0$ é
      opcoes: ['$7$', '$8$', '$9$', '$10$', '$11$']
      correta: A
      resolucao: |
        Solução: $-4\le x<3$. Inteiros: $-4,-3,-2,-1,0,1,2$, ou seja, $7$.

    - enunciado: Uma fábrica tem receita $R(x)=50x$ e custo $C(x)=30x+1200$, em reais, e produz no máximo $100$ unidades por mês. Ela tem lucro positivo exatamente quando
      opcoes: ['$x>60$', '$x\ge60$', '$0<x<60$', '$60<x\le100$', '$x>100$']
      correta: D
      resolucao: |
        $20x-1200>0\Rightarrow x>60$, respeitando o limite de $100$ unidades.

    - enunciado: Para $x\neq-3$, o conjunto solução de $\dfrac{x^2-9}{x+3}\le0$ é
      opcoes: ['$x\le3$', '$x<3$', '$x\le3$ e $x\neq-3$', '$-3<x\le3$', '$x\ge3$']
      correta: C
      resolucao: |
        $\dfrac{(x-3)(x+3)}{x+3}=x-3$ para $x\neq-3$. Então $x-3\le0$, sem esquecer que $-3$ está fora do domínio.

    - enunciado: A inequação $kx-6\ge0$, na incógnita $x$, tem conjunto solução $[3,\,+\infty[$. O valor de $k$ é
      opcoes: ['$1$', '$2$', '$3$', '$6$', '$-2$']
      correta: B
      resolucao: |
        Para obter "$x\ge\ldots$", é preciso $k>0$, e então $x\ge\tfrac6k=3\Rightarrow k=2$.
