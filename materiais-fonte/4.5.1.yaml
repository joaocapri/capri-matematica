# Aula 4.5.1 — Geometria plana: polígonos, ângulos e diagonais
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: polígonos convexos e nomes; soma dos ângulos internos (n − 2)·180° e dos externos (360°); ângulos interno e
# externo do polígono regular; diagonais d = n(n − 3)/2 e diagonais por vértice; diagonais pelo centro; pavimentação com
# polígonos regulares; giros de um robô; no máximo três ângulos internos agudos. Quadriláteros notáveis ficam para a 4.5.2.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Os polígonos são convexos. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Complete o quadro com a soma $S_i$ dos ângulos internos e o número $d$ de diagonais.'
      tabela:
        cabecalho: ['$n$', '$S_i$', '$d$']
        linhas:
        - ['$7$', '${{900°}}$', '${{14}}$']
        - ['$9$', '${{1260°}}$', '${{27}}$']
        - ['$10$', '${{1440°}}$', '${{35}}$']
        - ['$12$', '${{1800°}}$', '${{54}}$']
      resolucao: |
        $S_i = (n - 2) \cdot 180°$ e $d = \tfrac{n(n - 3)}{2}$. Ex.: $n = 9$: $7 \cdot 180° = 1260°$ e $\tfrac{9 \cdot 6}{2} = 27$.
      resposta: '$900°, 14$; $1260°, 27$; $1440°, 35$; $1800°, 54$'
    - enunciado: 'Complete o quadro com os ângulos interno $a_i$ e externo $a_e$ de cada polígono regular.'
      tabela:
        cabecalho: ['$n$', '$a_i$', '$a_e$']
        linhas:
        - ['$5$', '${{108°}}$', '${{72°}}$']
        - ['$8$', '${{135°}}$', '${{45°}}$']
        - ['$10$', '${{144°}}$', '${{36°}}$']
        - ['$12$', '${{150°}}$', '${{30°}}$']
      resolucao: |
        $a_e = \tfrac{360°}{n}$ e $a_i = 180° - a_e$.
      resposta: '$108°, 72°$; $135°, 45°$; $144°, 36°$; $150°, 30°$'
    - enunciado: 'Complete com o número de lados.'
      itens:
      - 'Polígono com $S_i = 1080°$: {{8}}'
      - 'Polígono regular com $a_e = 24°$: {{15}}'
      - 'Polígono regular com $a_i = 140°$: {{9}}'
      espaco_item: 10
      resolucao: |
        (a) $(n - 2) \cdot 180 = 1080$, $n = 8$. (b) $\tfrac{360}{24} = 15$. (c) $a_e = 40°$, $n = \tfrac{360}{40} = 9$.
      resposta: '$8$; $15$; $9$'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'A soma dos ângulos externos de qualquer polígono convexo é $360°$.'
      - 'Todo polígono com todos os lados iguais é regular.'
      - 'O triângulo não tem diagonais.'
      - 'De cada vértice de um hexágono saem 3 diagonais.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) (F) O losango tem lados iguais, mas, em geral, ângulos diferentes. (V) $\tfrac{3 \cdot 0}{2} = 0$. (V) $n - 3 = 3$.
      resposta: V, F, V, V
    - enunciado: 'Na figura, os ângulos internos do pentágono medem $100°$, $120°$, $95°$, $110°$ e $x$. Determine $x$.'
      figura:
        tikz: |
          \begin{scope}[scale=.75]
          \draw[ink, line width=1pt, fill=lilas!25] (0,0) -- (3,0) -- (3.8,1.8) -- (1.6,3.2) -- (-0.6,1.6) -- cycle;
          \node[font=\scriptsize] at (0.4,0.3) {$110°$};
          \node[font=\scriptsize] at (2.65,0.3) {$100°$};
          \node[font=\scriptsize] at (3.2,1.75) {$120°$};
          \node[font=\scriptsize] at (1.6,2.75) {$95°$};
          \node[font=\scriptsize] at (-0.05,1.55) {$x$};
          \end{scope}
      espaco: 8
      resolucao: |
        $S_i = 3 \cdot 180° = 540°$: $x = 540° - 425° = 115°$.
      resposta: '$115°$'
    - enunciado: 'Associe cada polígono ao seu número de lados.'
      esquerda:
      - 'pentágono'
      - 'hexágono'
      - 'heptágono'
      - 'octógono'
      - 'decágono'
      - 'dodecágono'
      direita:
      - '$8$ lados'
      - '$12$ lados'
      - '$5$ lados'
      - '$10$ lados'
      - '$7$ lados'
      - '$6$ lados'
      resolucao: |
        Os nomes vêm dos prefixos gregos: penta (5), hexa (6), hepta (7), octo (8), deca (10), dodeca (12).
      resposta: 'De cima para baixo: 4, 6, 1, 5, 3, 2'
    - enunciado: 'Num polígono de 11 lados, quantas diagonais saem de cada vértice, e em quantos triângulos elas dividem o polígono?'
      espaco: 8
      resolucao: |
        $n - 3 = 8$ diagonais, que dividem o polígono em $n - 2 = 9$ triângulos.
      resposta: '8 diagonais; 9 triângulos'
  - nome: Nível 2
    questoes:
    - texto: |
        Para achar o ângulo externo do octógono regular, Dudu fez $\frac{1080°}{8} = 135°$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 10
      resolucao: |
        $1080°$ é a soma dos ângulos internos: $135°$ é o ângulo interno. O externo é $\tfrac{360°}{8} = 45°$ (e $135° + 45° = 180°$).
      resposta: '$45°$'
    - enunciado: 'Determine o polígono cujo número de diagonais é o triplo do número de lados.'
      espaco: 10
      resolucao: |
        $\tfrac{n(n - 3)}{2} = 3n$: $n - 3 = 6$, $n = 9$ (eneágono, 27 diagonais).
      resposta: '$n = 9$'
    - enunciado: 'Num polígono regular, o ângulo interno é o quádruplo do externo. Quantos lados ele tem?'
      espaco: 10
      resolucao: |
        $a_i + a_e = 180°$ e $a_i = 4a_e$: $a_e = 36°$, $n = 10$.
      resposta: '10'
    - enunciado: 'Um piso pode ser coberto só com ladrilhos de um polígono regular quando o ângulo interno divide $360°$ exatamente (os ladrilhos se encaixam em torno de cada vértice). Complete.'
      tabela:
        cabecalho: ['Polígono regular', '$a_i$', 'Cobre o piso sozinho?']
        linhas:
        - ['triângulo', '${{60°}}$', '{{sim}}']
        - ['quadrado', '${{90°}}$', '{{sim}}']
        - ['pentágono', '${{108°}}$', '{{não}}']
        - ['hexágono', '${{120°}}$', '{{sim}}']
        - ['octógono', '${{135°}}$', '{{não}}']
      resolucao: |
        $\tfrac{360}{60} = 6$, $\tfrac{360}{90} = 4$, $\tfrac{360}{120} = 3$ (inteiros); $\tfrac{360}{108}$ e $\tfrac{360}{135}$ não são inteiros.
      resposta: '$60°$, sim; $90°$, sim; $108°$, não; $120°$, sim; $135°$, não'
    - enunciado: 'No hexágono regular $ABCDEF$, calcule os ângulos $B\hat{A}C$ e $A\hat{C}D$.'
      espaco: 12
      resolucao: |
        O triângulo $ABC$ é isósceles ($AB = BC$), com $\hat{B} = 120°$: $B\hat{A}C = 30°$. Em $C$: $B\hat{C}D = 120°$ e $B\hat{C}A = 30°$, logo $A\hat{C}D = 90°$.
      resposta: '$30°$ e $90°$'
    - enunciado: 'Um robô percorre o contorno de um polígono regular e gira $40°$ em cada vértice. Quantos lados tem o polígono?'
      espaco: 8
      resolucao: |
        Cada giro é um ângulo externo, e os giros somam $360°$: $n = \tfrac{360}{40} = 9$.
      resposta: '9'
    - enunciado: 'Somando todos os ângulos internos de um polígono menos um, obteve-se $1000°$. Determine o número de lados e o ângulo que ficou de fora.'
      espaco: 12
      resolucao: |
        $S_i = 1000° + x$, com $0° < x < 180°$, e $S_i$ múltiplo de $180°$. O único é $1080°$: $n = 8$ e $x = 80°$.
      resposta: '$n = 8$; $80°$'
    - enunciado: 'Num dodecágono regular, quantas diagonais passam pelo centro? Quantas são as diagonais ao todo?'
      espaco: 10
      resolucao: |
        Cada diagonal pelo centro liga vértices opostos: $\tfrac{12}{2} = 6$. Total: $\tfrac{12 \cdot 9}{2} = 54$.
      resposta: '6; 54'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que $S_i = (n - 2) \cdot 180°$ e que a soma dos ângulos externos é $360°$.'
      espaco: 14
      resolucao: |
        As $n - 3$ diagonais de um vértice dividem o polígono em $n - 2$ triângulos, cujos ângulos formam os ângulos internos: $S_i = (n - 2) \cdot 180°$. Em cada vértice, interno e externo somam $180°$: $S_i + S_e = n \cdot 180°$, logo $S_e = 360°$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que o número de diagonais de um polígono de $n$ lados é $\frac{n(n - 3)}{2}$.'
      espaco: 12
      resolucao: |
        De cada vértice saem $n - 3$ diagonais (não vai a si mesmo nem aos dois vizinhos). São $n(n - 3)$ contagens, mas cada diagonal foi contada duas vezes (uma por extremo): $\tfrac{n(n - 3)}{2}$.
      resposta: 'Ver resolução'
    - enunciado: 'Dois polígonos regulares têm $n$ e $n + 2$ lados, e os seus ângulos externos diferem de $6°$. Determine os dois polígonos.'
      espaco: 12
      resolucao: |
        $\tfrac{360}{n} - \tfrac{360}{n + 2} = 6$: $720 = 6n(n + 2)$, $n^2 + 2n - 120 = 0$, $n = 10$. Decágono e dodecágono.
      resposta: 'decágono e dodecágono'
    - enunciado: 'Mostre que dois octógonos regulares e um quadrado, de mesmo lado, se encaixam em torno de um ponto, sem sobras nem sobreposições.'
      espaco: 10
      resolucao: |
        $135° + 135° + 90° = 360°$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que um polígono convexo tem, no máximo, três ângulos internos agudos.'
      espaco: 12
      resolucao: |
        Se o interno é agudo, o externo correspondente é maior que $90°$. Quatro externos maiores que $90°$ somariam mais de $360°$, mas a soma de todos os externos é exatamente $360°$. Então há no máximo três.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Um piso foi revestido com ladrilhos em forma de octógonos regulares, todos de mesmo lado, como na figura. Os octógonos não cobrem tudo: entre eles sobram espaços, que serão preenchidos com outros ladrilhos, também de faces regulares e de mesmo lado. O fornecedor quer saber o ângulo interno do ladrilho que preenche esses espaços.
    figura:
      tikz: |
        \begin{scope}[scale=.55]
        \foreach \dx/\dy in {0/0, 2.4142/0, 0/2.4142, 2.4142/2.4142} {
          \draw[ink, line width=.9pt, fill=lilas!30, shift={(\dx,\dy)}] (0.7071,0) -- (1.7071,0) -- (2.4142,0.7071) -- (2.4142,1.7071) -- (1.7071,2.4142) -- (0.7071,2.4142) -- (0,1.7071) -- (0,0.7071) -- cycle;
        }
        \draw[ink, line width=.9pt, fill=lima!40] (1.7071,2.4142) -- (2.4142,1.7071) -- (3.1213,2.4142) -- (2.4142,3.1213) -- cycle;
        \end{scope}
    enunciado: |
      O ângulo interno do ladrilho que preenche os espaços mede
    opcoes: ['$45°$', '$60°$', '$90°$', '$120°$', '$135°$']
    correta: C
    resolucao: |
      O ângulo interno do octógono regular é $\tfrac{6 \cdot 180°}{8} = 135°$. Em torno de um vértice, dois octógonos ocupam $270°$, e sobram $90°$: o ladrilho é um quadrado.

  - estilo: Fuvest
    enunciado: |
      O número de diagonais de um polígono convexo de 20 lados é
    opcoes: ['$190$', '$170$', '$340$', '$180$', '$200$']
    correta: B
    resolucao: |
      $\tfrac{20 \cdot 17}{2} = 170$.

  - estilo: Unicamp
    enunciado: |
      O polígono regular cujo ângulo externo mede $30°$ é o
    opcoes: ['decágono.', 'dodecágono.', 'octógono.', 'hexágono.']
    correta: B
    resolucao: |
      $n = \tfrac{360°}{30°} = 12$.

  - estilo: UEM
    enunciado: |
      Considere polígonos convexos. Assinale o que for correto.
    proposicoes:
    - 'A soma dos ângulos internos de um octógono é $1080°$.'
    - 'O ângulo interno do hexágono regular mede $120°$.'
    - 'A soma dos ângulos externos de qualquer polígono convexo é $360°$.'
    - 'O decágono tem 35 diagonais.'
    - 'Todo polígono com todos os ângulos iguais é regular.'
    corretas: [1, 2, 3, 4]
    resolucao: |
      01) $6 \cdot 180°$. 02) $\tfrac{4 \cdot 180°}{6}$. 04) Correta. 08) $\tfrac{10 \cdot 7}{2}$. 16) Incorreta: o retângulo tem ângulos iguais e pode ter lados diferentes.
      Soma: $01 + 02 + 04 + 08 = 15$.

  - estilo: Enem
    texto: |
      Uma loja vende ladrilhos em forma de polígonos regulares, todos com o mesmo lado. Um cliente quer cobrir o piso usando um único tipo de ladrilho, sem cortes, sem sobras e sem sobreposições: em torno de cada vértice, os ângulos dos ladrilhos devem completar exatamente $360°$. O quadro mostra os modelos disponíveis.
    tabela:
      cabecalho: ['Ladrilho', 'Ângulo interno']
      linhas:
      - ['triângulo', '$60°$']
      - ['quadrado', '$90°$']
      - ['pentágono', '$108°$']
      - ['hexágono', '$120°$']
      - ['octógono', '$135°$']
    enunciado: |
      Podem ser usados, cada um sozinho,
    opcoes: ['apenas o quadrado.', 'o quadrado e o hexágono, apenas.', 'o triângulo, o quadrado e o pentágono, apenas.', 'o quadrado, o hexágono e o octógono, apenas.', 'o triângulo, o quadrado e o hexágono, apenas.']
    correta: E
    resolucao: |
      O ângulo interno precisa dividir $360°$: $360 \div 60 = 6$, $360 \div 90 = 4$, $360 \div 120 = 3$. Para $108°$ e $135°$, a divisão não é exata.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir sobre polígonos convexos.
    afirmativas:
    - 'A soma dos ângulos internos de um heptágono é $900°$.'
    - 'O ângulo externo do octógono regular mede $45°$.'
    - 'Um polígono com 9 diagonais é um hexágono.'
    - 'Existe polígono regular com ângulo interno de $100°$.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'II e IV, apenas.', 'I, II e III, apenas.', 'III e IV, apenas.', 'I, II, III e IV.']
    correta: C
    resolucao: |
      I. $5 \cdot 180°$. II. $\tfrac{360°}{8}$. III. $\tfrac{6 \cdot 3}{2} = 9$. IV. Incorreta: o externo seria $80°$, e $\tfrac{360}{80} = 4{,}5$ não é inteiro.

  - estilo: Unesp
    enunciado: |
      A soma dos ângulos internos de um polígono convexo é $1440°$. O número de diagonais desse polígono é
    opcoes: ['$35$', '$10$', '$44$', '$27$', '$20$']
    correta: A
    resolucao: |
      $(n - 2) \cdot 180 = 1440$: $n = 10$, e $d = \tfrac{10 \cdot 7}{2} = 35$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      A figura mostra um hexágono regular $ABCDEF$ e as diagonais $AC$ e $AD$.
    figura:
      tikz: |
        \begin{scope}[scale=1.2]
        \draw[ink, line width=1pt, fill=lilas!20] (-1,0) -- (-0.5,-0.866) -- (0.5,-0.866) -- (1,0) -- (0.5,0.866) -- (-0.5,0.866) -- cycle;
        \draw[roxo, line width=1pt] (-1,0) -- (0.5,-0.866) (-1,0) -- (1,0);
        \node[left, font=\scriptsize] at (-1,0) {$A$};
        \node[below left, font=\scriptsize] at (-0.5,-0.866) {$B$};
        \node[below right, font=\scriptsize] at (0.5,-0.866) {$C$};
        \node[right, font=\scriptsize] at (1,0) {$D$};
        \node[above right, font=\scriptsize] at (0.5,0.866) {$E$};
        \node[above left, font=\scriptsize] at (-0.5,0.866) {$F$};
        \end{scope}
    enunciado: |
      O ângulo $C\hat{A}D$ mede
    opcoes: ['$30°$.', '$60°$.', '$45°$.', '$20°$.']
    correta: A
    resolucao: |
      $B\hat{A}C = 30°$ (triângulo $ABC$ isósceles com $\hat{B} = 120°$), e $AD$ é a bissetriz de $\hat{A} = 120°$ (por simetria): $B\hat{A}D = 60°$. Então $C\hat{A}D = 60° - 30° = 30°$.

  - estilo: Fuvest
    enunciado: |
      Num polígono regular, o ângulo interno é o quádruplo do externo. O número de diagonais desse polígono é
    opcoes: ['$20$', '$27$', '$44$', '$35$', '$54$']
    correta: D
    resolucao: |
      $5a_e = 180°$: $a_e = 36°$, $n = 10$, $d = 35$.

  - estilo: UFSC
    enunciado: |
      Considere o polígono regular cujo ângulo externo mede $20°$. Assinale o que for correto.
    proposicoes:
    - 'O polígono tem 18 lados.'
    - 'O ângulo interno mede $160°$.'
    - 'A soma dos ângulos internos é $2880°$.'
    - 'O polígono tem 135 diagonais.'
    - 'Exatamente 9 diagonais passam pelo centro.'
    - 'De cada vértice saem 16 diagonais.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) $\tfrac{360}{20}$. 02) $180 - 20$. 04) $16 \cdot 180$. 08) $\tfrac{18 \cdot 15}{2}$. 16) Ligam vértices opostos: $\tfrac{18}{2}$. 32) Incorreta: $n - 3 = 15$.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      Um robô de limpeza percorre o contorno de uma área com a forma de um polígono regular, andando em linha reta e girando, sempre para o mesmo lado, $24°$ em cada vértice. Depois de percorrer todos os lados, ele volta ao ponto de partida, virado para a mesma direção em que começou.
    enunciado: |
      O número de lados do polígono é
    opcoes: ['$12$', '$24$', '$18$', '$15$', '$9$']
    correta: D
    resolucao: |
      Os giros são os ângulos externos e somam $360°$: $n = \tfrac{360}{24} = 15$.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir, sobre polígonos convexos.
    afirmacoes:
    - 'A soma dos ângulos externos é $360°$, qualquer que seja o número de lados.'
    - 'A soma dos ângulos internos de um pentágono é $720°$.'
    - 'Um polígono de $n$ lados tem $\frac{n(n - 3)}{2}$ diagonais.'
    - 'O polígono regular de ângulo interno $150°$ tem 10 lados.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – V – F.', 'F – F – V – V.', 'V – F – V – V.', 'V – V – F – F.', 'V – F – V – F.']
    correta: E
    resolucao: |
      (V) (F) $3 \cdot 180° = 540°$. (V) (F) O externo é $30°$: 12 lados.

  - estilo: Enem
    texto: |
      O logotipo de uma empresa é um pentágono regular com as suas cinco diagonais traçadas, que formam uma estrela de cinco pontas, como na figura. Para enviar o arquivo à gráfica, o designer precisa informar a medida do ângulo de cada ponta da estrela.
    figura:
      tikz: |
        \begin{scope}[scale=1.1]
        \draw[ink, line width=1pt, fill=lilas!20] (90:1.5) -- (162:1.5) -- (234:1.5) -- (306:1.5) -- (18:1.5) -- cycle;
        \draw[roxo, line width=1pt] (90:1.5) -- (234:1.5) -- (18:1.5) -- (162:1.5) -- (306:1.5) -- cycle;
        \end{scope}
    enunciado: |
      Cada ponta da estrela mede
    opcoes: ['$36°$', '$72°$', '$108°$', '$54°$', '$60°$']
    correta: A
    resolucao: |
      O ângulo interno do pentágono mede $108°$. As duas diagonais que saem de um vértice formam, com os lados, dois triângulos isósceles de ângulos $108°$, $36°$ e $36°$; sobram, para a ponta, $108° - 36° - 36° = 36°$. (A soma das cinco pontas é $180°$.)

  - estilo: Fuvest
    enunciado: |
      Dois polígonos regulares têm $n$ e $n + 2$ lados, e os seus ângulos externos diferem de $6°$. A soma dos números de lados dos dois polígonos é
    opcoes: ['$18$', '$20$', '$22$', '$24$', '$26$']
    correta: C
    resolucao: |
      $\tfrac{360}{n} - \tfrac{360}{n + 2} = 6$: $n^2 + 2n - 120 = 0$, $n = 10$. Soma $10 + 12 = 22$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Considere polígonos convexos de $n$ lados. Assinale o que for correto.
    proposicoes:
    - 'Um polígono convexo tem, no máximo, três ângulos internos agudos.'
    - 'As diagonais que saem de um vértice dividem o polígono em $n - 2$ triângulos.'
    - 'O ângulo interno de um polígono regular é sempre menor que $180°$.'
    - 'Existe polígono convexo cuja soma dos ângulos internos é $2000°$.'
    - 'O hexágono regular pode ser dividido em seis triângulos equiláteros.'
    corretas: [1, 2, 3, 5]
    resolucao: |
      01) Os externos correspondentes seriam maiores que $90°$, e a soma dos externos é $360°$. 02) Correta. 04) $180° - \tfrac{360°}{n} < 180°$. 08) Incorreta: $2000$ não é múltiplo de $180$. 16) Ligando o centro aos vértices: ângulos de $60°$ no centro e lados iguais ao raio.
      Soma: $01 + 02 + 04 + 16 = 23$.

  - estilo: Fuvest
    enunciado: |
      Somando todos os ângulos internos de um polígono convexo, menos um, obtém-se $1000°$. O ângulo que ficou de fora mede
    opcoes: ['$100°$', '$80°$', '$120°$', '$60°$', '$140°$']
    correta: B
    resolucao: |
      A soma total é múltiplo de $180°$, maior que $1000°$ e menor que $1180°$: $1080°$. O ângulo é $80°$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Um salão tem a forma de um hexágono regular. Para a decoração de uma festa, serão esticados fios de luz ligando cada canto do salão a todos os cantos que não são vizinhos dele, como na figura.
    figura:
      tikz: |
        \begin{scope}[scale=1.2]
        \draw[ink, line width=1pt, fill=lilas!20] (0:1) -- (60:1) -- (120:1) -- (180:1) -- (240:1) -- (300:1) -- cycle;
        \foreach \a/\b in {0/120, 0/180, 0/240, 60/180, 60/240, 60/300, 120/240, 120/300, 180/300} \draw[roxo] (\a:1) -- (\b:1);
        \end{scope}
    enunciado: |
      O número de fios esticados é
    opcoes: ['$6$', '$12$', '$15$', '$9$', '$3$']
    correta: D
    resolucao: |
      São as diagonais: $\tfrac{6 \cdot 3}{2} = 9$.

  - estilo: Unicamp
    enunciado: |
      O número de fios que passam pelo centro do salão é
    opcoes: ['$6$.', '$3$.', '$2$.', '$9$.']
    correta: B
    resolucao: |
      Passam pelo centro as diagonais que ligam cantos opostos: $\tfrac{6}{2} = 3$.

  - estilo: Unesp
    enunciado: |
      O número de diagonais de um polígono convexo é o triplo do número de lados. A soma dos seus ângulos internos é
    opcoes: ['$900°$', '$1080°$', '$1440°$', '$1620°$', '$1260°$']
    correta: E
    resolucao: |
      $\tfrac{n(n - 3)}{2} = 3n$: $n = 9$. $S_i = 7 \cdot 180° = 1260°$.

  - estilo: Fuvest
    enunciado: |
      Em torno de um ponto de um piso, encaixam-se, sem sobras nem sobreposições, um quadrado, um hexágono regular e um terceiro polígono regular, todos de mesmo lado. O terceiro polígono é
    opcoes: ['um dodecágono regular.', 'um octógono regular.', 'um decágono regular.', 'um pentágono regular.', 'outro quadrado.']
    correta: A
    resolucao: |
      $360° - 90° - 120° = 150°$, que é o ângulo interno do polígono regular com externo $30°$: 12 lados.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere polígonos convexos de $n$ lados.'
    itens:
    - 'Prove que a soma dos ângulos externos é $360°$.'
    - 'Prove que um polígono convexo tem, no máximo, três ângulos internos agudos.'
    - 'Mostre, com um exemplo de quadrilátero, que pode haver exatamente três ângulos agudos.'
    espaco: 62
    resolucao: |
      a) Interno e externo somam $180°$ em cada vértice: $S_i + S_e = 180n$, e $S_i = 180(n - 2)$, logo $S_e = 360°$.
      b) Cada interno agudo corresponde a um externo maior que $90°$; quatro deles somariam mais de $360°$.
      c) Tome um triângulo equilátero $ABC$ e um ponto $D$, fora dele, bem perto do ponto médio de $AC$. O quadrilátero $ABCD$ é convexo, tem ângulo de $60°$ em $B$, ângulos pouco maiores que $60°$ (agudos) em $A$ e $C$ e, em $D$, um ângulo pouco menor que $180°$.
    resposta: 'Ver resolução'

  - estilo: Unicamp
    texto: |
      Em pavimentações com polígonos regulares de mesmo lado, os ângulos dos polígonos que se encontram em cada vértice devem somar $360°$.
    enunciado: ''
    itens:
    - 'Mostre que, com um único tipo de polígono regular, só é possível pavimentar com triângulos, quadrados ou hexágonos.'
    - 'Mostre que é possível pavimentar em torno de um vértice com um quadrado e dois octógonos regulares, e também com um triângulo e dois dodecágonos regulares.'
    - 'É possível usar, em torno de um vértice, um pentágono regular e dois polígonos regulares iguais? Se sim, qual?'
    espaco: 62
    resolucao: |
      a) Com $k$ polígonos de $n$ lados: $k\left(180 - \tfrac{360}{n}\right) = 360$, ou $k = \tfrac{2n}{n - 2}$. Inteiro só para $n = 3$ ($k = 6$), $n = 4$ ($k = 4$) e $n = 6$ ($k = 3$).
      b) $90° + 135° + 135° = 360°$ e $60° + 150° + 150° = 360°$.
      c) $108° + 2x = 360°$: $x = 126°$, o que exige externo $54°$ e $n = \tfrac{360}{54}$, não inteiro. Não é possível.
    resposta: 'c) não'

  - estilo: ITA
    enunciado: |
      O número de diagonais de um polígono convexo excede o número de lados em 25. O número de lados é
    opcoes: ['$8$', '$9$', '$10$', '$11$', '$12$']
    correta: C
    espaco: 22
    resolucao: |
      $\tfrac{n(n - 3)}{2} - n = 25$: $n^2 - 5n - 50 = 0$, $n = 10$.
    resposta: 'C'

  - estilo: Unesp
    enunciado: 'Considere o pentágono regular $ABCDE$ e as diagonais $AC$ e $AD$.'
    itens:
    - 'Calcule o ângulo interno do pentágono.'
    - 'Calcule $B\hat{A}C$, $C\hat{A}D$ e $D\hat{A}E$.'
    - 'Calcule os ângulos do triângulo $ACD$ e classifique-o.'
    espaco: 62
    resolucao: |
      a) $\tfrac{540°}{5} = 108°$.
      b) $ABC$ é isósceles com $\hat{B} = 108°$: $B\hat{A}C = 36°$. Por simetria, $D\hat{A}E = 36°$, e $C\hat{A}D = 108° - 72° = 36°$.
      c) $\hat{A} = 36°$; em $C$: $108° - 36° = 72°$; em $D$: $72°$. Triângulo isósceles ($AC = AD$), de ângulos $36°$, $72°$, $72°$.
    resposta: 'b) $36°$ cada; c) $36°, 72°, 72°$'

  - estilo: UFSC
    enunciado: |
      Assinale o que for correto.
    proposicoes:
    - 'O polígono regular de ângulo interno $156°$ tem 15 lados.'
    - 'Um polígono de 11 lados tem 44 diagonais.'
    - 'O número de diagonais que passam pelo centro de um polígono regular de 9 lados é 4.'
    - 'Existe polígono convexo com 4 ângulos internos agudos.'
    - 'A soma dos ângulos internos de um polígono de 13 lados é $1980°$.'
    - 'Com 6 triângulos equiláteros em torno de um ponto, cobre-se o plano ao redor dele.'
    corretas: [1, 2, 5, 6]
    espaco: 22
    resolucao: |
      01) Externo $24°$: $n = 15$. 02) $\tfrac{11 \cdot 8}{2}$. 04) Incorreta: com $n$ ímpar não há vértices opostos, e nenhuma diagonal passa pelo centro. 08) Incorreta: no máximo três. 16) $11 \cdot 180$. 32) $6 \cdot 60° = 360°$.
    resposta: 'Soma 51 (01 + 02 + 16 + 32)'

  - estilo: Fuvest
    enunciado: 'Dois polígonos regulares têm $n$ e $n + 2$ lados, e os seus ângulos externos diferem de $6°$.'
    itens:
    - 'Determine $n$.'
    - 'Calcule os ângulos internos dos dois polígonos.'
    - 'Calcule a diferença entre os números de diagonais dos dois polígonos.'
    espaco: 62
    resolucao: |
      a) $\tfrac{360}{n} - \tfrac{360}{n + 2} = 6$: $n^2 + 2n - 120 = 0$, $n = 10$.
      b) $144°$ e $150°$.
      c) $\tfrac{12 \cdot 9}{2} - \tfrac{10 \cdot 7}{2} = 54 - 35 = 19$.
    resposta: 'a) 10; b) $144°$ e $150°$; c) 19'

  - estilo: Unicamp
    texto: |
      Um drone percorre uma trajetória poligonal: anda em linha reta e, em cada vértice, gira sempre o mesmo ângulo, para a esquerda, até voltar ao ponto de partida, na direção inicial.
    enunciado: ''
    itens:
    - 'Se o giro é de $30°$, quantos segmentos ele percorre até voltar, pela primeira vez, ao início na direção inicial? Que figura descreve?'
    - 'Qual é a soma de todos os giros nesse caso?'
    - 'Se o giro é de $144°$, quantos segmentos ele percorre até voltar? Quantas voltas completas os giros somam? Que figura ele descreve?'
    espaco: 62
    resolucao: |
      a) Volta quando a soma dos giros é um múltiplo de $360°$: $30k = 360$, $k = 12$. Dodecágono regular.
      b) $360°$.
      c) $144k$ múltiplo de $360$: menor $k = 5$ ($720°$, duas voltas). Ele descreve uma estrela de cinco pontas (as pontas medem $180° - 144° = 36°$).
    resposta: 'a) 12, dodecágono; b) $360°$; c) 5 segmentos, 2 voltas, estrela de cinco pontas'

  - estilo: Fuvest
    enunciado: |
      O número de diagonais do polígono regular cujo ângulo interno mede $156°$ é
    opcoes: ['$90$', '$105$', '$75$', '$120$', '$60$']
    correta: A
    espaco: 22
    resolucao: |
      Externo $24°$: $n = 15$, e $d = \tfrac{15 \cdot 12}{2} = 90$.
    resposta: 'A'

  - estilo: Unesp
    enunciado: 'Considere o hexágono regular $ABCDEF$ de lado 2.'
    itens:
    - 'Quantas diagonais ele tem e quantas passam pelo centro?'
    - 'Calcule a medida da diagonal $AC$ e da diagonal $AD$.'
    - 'Calcule o ângulo entre as diagonais $AC$ e $AE$.'
    espaco: 62
    resolucao: |
      a) $\tfrac{6 \cdot 3}{2} = 9$; pelo centro, 3.
      b) O hexágono é formado por seis triângulos equiláteros de lado 2: $AD = 4$. No triângulo $ACD$, retângulo em $C$ ($A\hat{C}D = 90°$): $AC = \sqrt{16 - 4} = 2\sqrt{3}$.
      c) $B\hat{A}C = F\hat{A}E = 30°$: $C\hat{A}E = 120° - 60° = 60°$ (o triângulo $ACE$ é equilátero).
    resposta: 'a) 9 e 3; b) $2\sqrt{3}$ e $4$; c) $60°$'

  - estilo: Fuvest
    enunciado: 'Os ângulos internos de um pentágono convexo estão em progressão aritmética, e o menor mede $90°$.'
    itens:
    - 'Determine a razão da progressão.'
    - 'Determine os cinco ângulos.'
    - 'Mostre que, para qualquer razão positiva, o menor ângulo é menor que $108°$ e o maior é maior que $108°$.'
    espaco: 62
    resolucao: |
      a) $5 \cdot 90 + 10r = 540$: $r = 9°$.
      b) $90°$, $99°$, $108°$, $117°$, $126°$.
      c) Com menor ângulo $a$: $5a + 10r = 540$, $a = 108 - 2r < 108$. O maior é $a + 4r = 108 + 2r > 108$. (O termo do meio é sempre $108°$.)
    resposta: 'a) $9°$; b) $90°, 99°, 108°, 117°, 126°$; c) ver resolução'
