# Fonte das listas em PDF da aula A24 — Forma Fatorada e Canônica
aula: A24

fixacao:
  intro: Resolva na ordem — do aquecimento ao desafio. Forma fatorada — $a(x-x_1)(x-x_2)$ mostra as raízes. Forma canônica — $a(x-x_V)^2+y_V$ mostra o vértice.
  secoes:
    - nome: Aquecimento
      questoes:
        - enunciado: Escreva na forma fatorada.
          itens:
            - $x^2-5x+6$
            - $x^2-9$
            - $2x^2-8x$
          resolucao: |
            (a) Raízes $2$ e $3$ (soma $5$, produto $6$): $(x-2)(x-3)$.
            (b) Diferença de quadrados: $(x-3)(x+3)$.
            (c) Fator comum: $2x(x-4)$.
          resposta: '(a) $(x-2)(x-3)$ \quad (b) $(x-3)(x+3)$ \quad (c) $2x(x-4)$'

        - enunciado: Escreva na forma $a(x-x_1)(x-x_2)$.
          itens:
            - $2x^2-2x-12$
            - $-x^2+4x-3$
          resolucao: |
            (a) $2(x^2-x-6)$, com raízes $3$ e $-2$: $2(x-3)(x+2)$.
            (b) $-(x^2-4x+3)$, com raízes $1$ e $3$: $-(x-1)(x-3)$.
          resposta: '(a) $2(x-3)(x+2)$ \quad (b) $-(x-1)(x-3)$'

        - enunciado: Quais são as raízes de $f(x)=3(x-1)(x+5)$?
          resolucao: |
            O produto zera quando um dos fatores zera: $x=1$ ou $x=-5$.
          resposta: '$1$ e $-5$'

        - enunciado: Escreva $f(x)=x^2-6x+10$ na forma canônica.
          resolucao: |
            Complete o quadrado: $x^2-6x+9+1=(x-3)^2+1$.
          resposta: '$(x-3)^2+1$'

        - enunciado: Escreva $f(x)=x^2+4x-1$ na forma canônica.
          resolucao: |
            $x^2+4x+4-4-1=(x+2)^2-5$.
          resposta: '$(x+2)^2-5$'

        - enunciado: Dê o vértice da parábola de $f(x)=2(x-1)^2+3$ e diga se é ponto de máximo ou de mínimo.
          resolucao: |
            Vértice $(1,3)$. Como $a=2>0$, é ponto de mínimo, com valor mínimo $3$.
          resposta: '$(1,\,3)$; mínimo'

        - enunciado: Desenvolva $f(x)=(x-4)^2-9$ e determine suas raízes.
          resolucao: |
            $x^2-8x+16-9=x^2-8x+7$. Raízes: $(x-4)^2=9\Rightarrow x-4=\pm3\Rightarrow x=7$ ou $x=1$.
          resposta: '$x^2-8x+7$; raízes $1$ e $7$'

    - nome: Treino
      questoes:
        - enunciado: Escreva $f(x)=2x^2-12x+13$ na forma canônica.
          resolucao: |
            $2(x^2-6x)+13=2[(x-3)^2-9]+13=2(x-3)^2-18+13=2(x-3)^2-5$.
          resposta: '$2(x-3)^2-5$'

        - enunciado: Escreva a função quadrática com raízes $2$ e $-3$ e coeficiente $a=1$.
          resolucao: |
            $(x-2)(x+3)=x^2+x-6$.
          resposta: '$f(x)=x^2+x-6$'

        - enunciado: Determine a função quadrática com raízes $1$ e $4$ cujo gráfico passa por $(0,\,8)$.
          resolucao: |
            $f(x)=a(x-1)(x-4)$ e $f(0)=4a=8\Rightarrow a=2$.
            $f(x)=2(x-1)(x-4)=2x^2-10x+8$.
          resposta: '$f(x)=2x^2-10x+8$'

        - enunciado: Escreva a função quadrática com vértice $(2,\,-3)$ e $a=2$ nas formas canônica e geral.
          resolucao: |
            Canônica: $2(x-2)^2-3$. Desenvolvendo: $2(x^2-4x+4)-3=2x^2-8x+5$.
          resposta: '$2(x-2)^2-3=2x^2-8x+5$'

        - enunciado: Use a forma canônica para resolver $(x-1)^2-16=0$.
          resolucao: |
            $(x-1)^2=16\Rightarrow x-1=\pm4\Rightarrow x=5$ ou $x=-3$.
          resposta: '$x=5$ ou $x=-3$'

        - enunciado: Escreva $f(x)=-x^2+6x-5$ na forma canônica e dê seu valor máximo.
          resolucao: |
            $-(x^2-6x)-5=-[(x-3)^2-9]-5=-(x-3)^2+4$. O valor máximo é $4$, em $x=3$.
          resposta: '$-(x-3)^2+4$; máximo $4$'

        - enunciado: Fatore $3x^2-12$.
          resolucao: |
            $3(x^2-4)=3(x-2)(x+2)$.
          resposta: '$3(x-2)(x+2)$'

        - enunciado: Simplifique $\dfrac{x^2-5x+6}{x-2}$, para $x\neq2$.
          resolucao: |
            $\dfrac{(x-2)(x-3)}{x-2}=x-3$.
          resposta: '$x-3$'

    - nome: Desafio
      questoes:
        - enunciado: Uma parábola tem vértice $(1,\,8)$ e uma de suas raízes é $3$. Determine a outra raiz e a lei da função nas formas canônica e fatorada.
          resolucao: |
            As raízes são simétricas em relação a $x=1$: a outra é $-1$.
            $f(x)=a(x-1)^2+8$ e $f(3)=4a+8=0\Rightarrow a=-2$.
            Canônica: $-2(x-1)^2+8$. Fatorada: $-2(x+1)(x-3)$.
          resposta: 'raiz $-1$; \ $-2(x-1)^2+8=-2(x+1)(x-3)$'

        - enunciado: Mostre que $x^2+6x+13>0$ para todo $x$ real.
          resolucao: |
            $x^2+6x+13=(x+3)^2+4$. Como $(x+3)^2\ge0$, temos $(x+3)^2+4\ge4>0$.
          resposta: '$(x+3)^2+4\ge4$'

        - enunciado: Determine $b$ e $c$ para que a parábola de $f(x)=x^2+bx+c$ tenha vértice $(-1,\,4)$.
          resolucao: |
            $f(x)=(x+1)^2+4=x^2+2x+5$.
          resposta: '$b=2$, \ $c=5$'

        - enunciado: Para qual valor de $k$ o vértice da parábola de $f(x)=(x-k)^2+k-2$ está sobre o eixo $x$?
          resolucao: |
            Vértice $(k,\,k-2)$. No eixo $x$: $k-2=0\Rightarrow k=2$.
          resposta: '$k=2$'

        - enunciado: Escreva $f(x)=4x^2-4x-3$ nas formas fatorada e canônica.
          resolucao: |
            $\Delta=16+48=64$; raízes $\tfrac{4\pm8}8$, isto é, $\tfrac32$ e $-\tfrac12$.
            Fatorada: $4\left(x-\tfrac32\right)\left(x+\tfrac12\right)=(2x-3)(2x+1)$.
            Canônica: $4\left(x^2-x\right)-3=4\left(x-\tfrac12\right)^2-1-3=4\left(x-\tfrac12\right)^2-4$.
          resposta: '$(2x-3)(2x+1)$; \ $4\left(x-\tfrac12\right)^2-4$'

vestibular:
  intro: Questões autorais no estilo dos principais vestibulares. Assinale uma única alternativa.
  questoes:
    - enunciado: A forma fatorada de $x^2-7x+10$ é
      opcoes: ['$(x-2)(x-5)$', '$(x+2)(x+5)$', '$(x-1)(x-10)$', '$(x+2)(x-5)$', '$(x-2)(x+5)$']
      correta: A
      resolucao: |
        Raízes com soma $7$ e produto $10$: $2$ e $5$.

    - enunciado: A forma canônica de $f(x)=x^2-8x+20$ é
      opcoes: ['$(x-4)^2+20$', '$(x+4)^2+4$', '$(x-4)^2+4$', '$(x-8)^2+20$', '$(x-4)^2-4$']
      correta: C
      resolucao: |
        $x^2-8x+16+4=(x-4)^2+4$.

    - enunciado: A função quadrática com raízes $3$ e $-1$ cujo gráfico passa por $(0,\,-6)$ é
      opcoes: ['$x^2-2x-3$', '$2x^2-4x-6$', '$2x^2+4x-6$', '$-2x^2+4x+6$', '$6x^2-12x-18$']
      correta: B
      resolucao: |
        $f(x)=a(x-3)(x+1)$ e $f(0)=-3a=-6\Rightarrow a=2$. Então $2(x^2-2x-3)$.

    - enunciado: O vértice da parábola de $f(x)=-3(x+2)^2+5$ é
      opcoes: ['$(2,\,5)$', '$(-2,\,-5)$', '$(2,\,-5)$', '$(5,\,-2)$', '$(-2,\,5)$']
      correta: E
      resolucao: |
        $(x+2)^2=(x-(-2))^2$: $x_V=-2$ e $y_V=5$.

    - enunciado: Para $x\neq\pm3$, a expressão $\dfrac{x^2-9}{x^2-6x+9}$ é igual a
      opcoes: ['$\dfrac{x-3}{x+3}$', '$1$', '$x+3$', '$\dfrac{x+3}{x-3}$', '$-1$']
      correta: D
      resolucao: |
        $\dfrac{(x-3)(x+3)}{(x-3)^2}=\dfrac{x+3}{x-3}$.

    - enunciado: O valor mínimo de $f(x)=2(x-3)^2-7$ é
      opcoes: ['$-14$', '$-7$', '$-3$', '$3$', '$7$']
      correta: B
      resolucao: |
        $2(x-3)^2\ge0$, com mínimo $0$ em $x=3$. Então o mínimo de $f$ é $-7$.

    - enunciado: Uma parábola tem vértice $(1,\,-4)$ e passa pela origem. Sua outra raiz é
      opcoes: ['$2$', '$3$', '$4$', '$6$', '$8$']
      correta: A
      resolucao: |
        As raízes são simétricas em relação a $x=1$; uma delas é $0$, logo a outra é $2$.

    - enunciado: A forma canônica de $f(x)=3x^2+6x+1$ é
      opcoes: ['$3(x+1)^2+1$', '$3(x-1)^2-2$', '$(x+1)^2-2$', '$3(x+1)^2-2$', '$3(x+3)^2-26$']
      correta: D
      resolucao: |
        $3(x^2+2x)+1=3[(x+1)^2-1]+1=3(x+1)^2-2$.

    - enunciado: A função $f(x)=a(x-2)(x-6)$ tem valor máximo igual a $8$. O valor de $a$ é
      opcoes: ['$-4$', '$-3$', '$-2$', '$-1$', '$2$']
      correta: C
      resolucao: |
        $x_V=4$ e $f(4)=a\cdot2\cdot(-2)=-4a=8\Rightarrow a=-2$ (negativo, como deve ser para haver máximo).

    - enunciado: Para $x\neq\pm4$, a expressão $\dfrac{x^2-4x}{x^2-16}$ é igual a
      opcoes: ['$\dfrac x{x-4}$', '$\dfrac{x-4}{x+4}$', '$\dfrac14$', '$-\dfrac x4$', '$\dfrac x{x+4}$']
      correta: E
      resolucao: |
        $\dfrac{x(x-4)}{(x-4)(x+4)}=\dfrac x{x+4}$.

    - enunciado: A parábola de $f(x)=x^2+bx+c$ tem vértice $(3,\,-2)$. O valor de $b+c$ é
      opcoes: ['$1$', '$3$', '$5$', '$7$', '$13$']
      correta: A
      resolucao: |
        $(x-3)^2-2=x^2-6x+7$. Então $b+c=-6+7=1$.

    - enunciado: A forma fatorada de $2x^2+5x-3$ é
      opcoes: ['$(2x+1)(x-3)$', '$(x-1)(2x+3)$', '$(2x-1)(x+3)$', '$(2x-3)(x+1)$', '$(x+1)(x+3)$']
      correta: C
      resolucao: |
        $\Delta=25+24=49$; raízes $\tfrac{-5\pm7}4$, isto é, $\tfrac12$ e $-3$. Então $2\left(x-\tfrac12\right)(x+3)=(2x-1)(x+3)$.

    - enunciado: A parábola de $y=(x-1)^2+k-4$ toca o eixo $x$ em um único ponto quando $k$ vale
      opcoes: ['$-4$', '$0$', '$1$', '$2$', '$4$']
      correta: E
      resolucao: |
        O vértice $(1,\,k-4)$ deve estar no eixo $x$: $k-4=0\Rightarrow k=4$.

    - enunciado: Quanto às raízes reais, a função $f(x)=2(x+1)^2+3$ tem
      opcoes: ['uma única raiz, igual a $-1$', 'nenhuma raiz real', 'duas raízes de sinais opostos', 'duas raízes negativas', 'infinitas raízes']
      correta: B
      resolucao: |
        $f(x)\ge3>0$ para todo $x$: o gráfico nunca toca o eixo $x$.

    - enunciado: A expressão $(x+2)^2-(x-2)^2$ é igual a
      opcoes: ['$0$', '$8$', '$2x^2+8$', '$8x$', '$4x$']
      correta: D
      resolucao: |
        Diferença de quadrados: $[(x+2)-(x-2)][(x+2)+(x-2)]=4\cdot2x=8x$.

    - enunciado: Uma parábola tem raízes $-2$ e $4$, e o vértice tem ordenada $-18$. O valor de $f(0)$ é
      opcoes: ['$-18$', '$-8$', '$8$', '$16$', '$-16$']
      correta: E
      resolucao: |
        $f(x)=a(x+2)(x-4)$; $x_V=1$ e $f(1)=-9a=-18\Rightarrow a=2$. Então $f(0)=2\cdot2\cdot(-4)=-16$.

    - enunciado: Escrevendo $f(x)=x^2-10x+21$ na forma $(x-h)^2+k$, o valor de $h+k$ é
      opcoes: ['$1$', '$5$', '$9$', '$16$', '$26$']
      correta: A
      resolucao: |
        $x^2-10x+25-4=(x-5)^2-4$: $h=5$, $k=-4$ e $h+k=1$.

    - enunciado: A soma das soluções de $(x-3)^2=25$ é
      opcoes: ['$-6$', '$2$', '$6$', '$8$', '$10$']
      correta: C
      resolucao: |
        $x-3=\pm5\Rightarrow x=8$ ou $x=-2$. Soma: $6$.

    - enunciado: Uma parábola tem vértice $(2,\,1)$ e passa por $(0,\,9)$. O valor de $f(3)$ é
      opcoes: ['$1$', '$3$', '$5$', '$9$', '$11$']
      correta: B
      resolucao: |
        $f(x)=a(x-2)^2+1$ e $4a+1=9\Rightarrow a=2$. Então $f(3)=2+1=3$.

    - enunciado: Para $x\neq-2$, a expressão $\dfrac{2x^2-8}{x^2+4x+4}$ é igual a
      opcoes: ['$2$', '$\dfrac{2(x+2)}{x-2}$', '$\dfrac{x-2}{x+2}$', '$\dfrac{2(x-2)}{x+2}$', '$\dfrac2{x+2}$']
      correta: D
      resolucao: |
        $\dfrac{2(x-2)(x+2)}{(x+2)^2}=\dfrac{2(x-2)}{x+2}$.
