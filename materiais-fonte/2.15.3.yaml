# Aula 2.15.3 — Trigonometria: tangente e demais razões
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: tg x = sen x / cos x e o eixo das tangentes; sec, cossec e cotg; onde cada razão não existe;
# sinais por quadrante; valores em arcos notáveis de todos os quadrantes; |sec x| ≥ 1 e |cossec x| ≥ 1;
# tg(x + π) = tg x, tg(−x) = −tg x. As identidades 1 + tg² = sec² etc. ficam para a aula 2.16.1.
padrao: 4

fixacao:
  intro: 'Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Lembre: $\operatorname{tg}x = \frac{\operatorname{sen}x}{\cos x}$, $\sec x = \frac{1}{\cos x}$, $\operatorname{cossec}x = \frac{1}{\operatorname{sen}x}$ e $\operatorname{cotg}x = \frac{\cos x}{\operatorname{sen}x}$. O gabarito resolvido está no final.'
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Complete com os valores.'
      itens:
      - '$\operatorname{tg}120^\circ =$ {{-\sqrt3}}'
      - '$\operatorname{tg}210^\circ =$ {{\sqrt3/3}}'
      - '$\operatorname{tg}330^\circ =$ {{-\sqrt3/3}}'
      - '$\operatorname{tg}180^\circ =$ {{0}}'
      espaco_item: 8
      resolucao: |
        Referências $60^\circ$, $30^\circ$, $30^\circ$. A tangente é negativa no 2º e no 4º Q e positiva no 3º. Em $180^\circ$: $\frac{0}{-1} = 0$.
      resposta: '$-\sqrt3$; $\frac{\sqrt3}{3}$; $-\frac{\sqrt3}{3}$; 0'
    - enunciado: 'Associe cada razão ao seu valor.'
      esquerda:
      - '$\sec 45^\circ$'
      - '$\operatorname{cossec}60^\circ$'
      - '$\operatorname{cotg}30^\circ$'
      - '$\operatorname{tg}30^\circ$'
      - '$\sec 180^\circ$'
      direita:
      - '$-1$'
      - '$\sqrt3$'
      - '$\sqrt2$'
      - '$\frac{\sqrt3}{3}$'
      - '$\frac{2\sqrt3}{3}$'
      resolucao: |
        $\frac{1}{\sqrt2/2} = \sqrt2$; $\frac{1}{\sqrt3/2} = \frac{2\sqrt3}{3}$; $\frac{\sqrt3/2}{1/2} = \sqrt3$; $\frac{1/2}{\sqrt3/2} = \frac{\sqrt3}{3}$; $\frac{1}{-1} = -1$.
      resposta: 'De cima para baixo: 5, 3, 1, 4, 2'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Existe $x$ com $\sec x = \frac12$.'
      - 'No 3º quadrante, a tangente é positiva.'
      - '$\operatorname{cotg}0$ existe.'
      - '$\operatorname{cossec}\pi$ não existe.'
      justificar: true
      espaco: 20
      resolucao: |
        (F) $|\cos x| \le 1$ dá $|\sec x| \ge 1$. (V) $\frac{(-)}{(-)}$. (F) $\operatorname{sen}0 = 0$ no denominador. (V) $\operatorname{sen}\pi = 0$.
      resposta: F, V, F, V
    - enunciado: 'Complete a tabela. Se a razão não existir, escreva "não existe".'
      tabela:
        cabecalho: ['Arco', '$\operatorname{tg}x$', '$\operatorname{cotg}x$']
        linhas:
        - ['$\frac{2\pi}{3}$', '${{-\sqrt3}}$', '${{-\sqrt3/3}}$']
        - ['$\frac{5\pi}{4}$', '${{1}}$', '${{1}}$']
        - ['$\frac{11\pi}{6}$', '${{-\sqrt3/3}}$', '${{-\sqrt3}}$']
        - ['$\pi$', '${{0}}$', '{{não existe}}']
      resolucao: |
        Calcule seno e cosseno pela redução e divida. Em $\pi$, o seno é 0: a cotangente não existe.
      resposta: 'Ver resolução'
    - enunciado: 'Calcule $\sec 120^\circ$.'
      espaco: 8
      resolucao: |
        $\cos 120^\circ = -\frac12$: $\sec 120^\circ = -2$.
      resposta: '$-2$'
    - enunciado: 'Calcule $\operatorname{cossec}225^\circ$.'
      espaco: 8
      resolucao: |
        $\operatorname{sen}225^\circ = -\frac{\sqrt2}{2}$: $\operatorname{cossec}225^\circ = -\frac{2}{\sqrt2} = -\sqrt2$.
      resposta: '$-\sqrt2$'
    - enunciado: 'Qual o sinal de $\operatorname{tg}100^\circ \cdot \operatorname{cotg}200^\circ$?'
      espaco: 8
      resolucao: |
        $\operatorname{tg}100^\circ < 0$ (2º Q) e $\operatorname{cotg}200^\circ > 0$ (3º Q): o produto é negativo.
      resposta: 'Negativo'
  - nome: Nível 2
    questoes:
    - texto: |
        Davi calculou: $\operatorname{tg}150^\circ = \frac{\operatorname{sen}150^\circ}{\cos 150^\circ}$ $= \frac{1/2}{\sqrt3/2} = \frac{\sqrt3}{3}$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 8
      resolucao: |
        No 2º quadrante, $\cos 150^\circ = -\frac{\sqrt3}{2}$. Logo $\operatorname{tg}150^\circ = -\frac{\sqrt3}{3}$.
      resposta: '$-\frac{\sqrt3}{3}$'
    - enunciado: 'Sabendo que $\cos x = -\frac{5}{13}$ e que $x$ está no 3º quadrante, calcule $\operatorname{tg}x$ e $\sec x$.'
      espaco: 10
      resolucao: |
        $\operatorname{sen}^2 x = 1 - \frac{25}{169} = \frac{144}{169}$; no 3º Q, $\operatorname{sen}x = -\frac{12}{13}$. $\operatorname{tg}x = \frac{12}{5}$ e $\sec x = -\frac{13}{5}$.
      resposta: '$\frac{12}{5}$ e $-\frac{13}{5}$'
    - enunciado: 'Para que arcos $x$ a expressão $\sec x + \operatorname{cossec}x$ existe?'
      espaco: 8
      resolucao: |
        É preciso $\cos x \ne 0$ e $\operatorname{sen}x \ne 0$: $x$ não pode estar nos eixos, ou seja, $x \ne \frac{k\pi}{2}$, com $k$ inteiro.
      resposta: '$x \ne \frac{k\pi}{2}$'
    - enunciado: 'O arco $x$ está no 3º quadrante, com $\operatorname{sen}x = -\frac35$ e $\cos x = -\frac45$. Complete.'
      itens:
      - '$\operatorname{tg}x =$ {{3/4}}'
      - '$\operatorname{cotg}x =$ {{4/3}}'
      - '$\operatorname{cossec}x =$ {{-5/3}}'
      espaco_item: 8
      resolucao: |
        $\frac{-3/5}{-4/5} = \frac34$; o inverso é $\frac43$; $\frac{1}{-3/5} = -\frac53$.
      resposta: '$\frac34$; $\frac43$; $-\frac53$'
    - enunciado: 'Calcule $\operatorname{tg}225^\circ + \operatorname{cotg}315^\circ$.'
      espaco: 8
      resolucao: |
        $\operatorname{tg}225^\circ = \operatorname{tg}45^\circ = 1$; $\operatorname{cotg}315^\circ = \frac{\sqrt2/2}{-\sqrt2/2} = -1$. Soma: 0.
      resposta: '0'
    - enunciado: 'Para que valores de $m$ existe $x$ com $\sec x = m - 2$?'
      espaco: 8
      resolucao: |
        $|m - 2| \ge 1$: $m - 2 \le -1$ ou $m - 2 \ge 1$, ou seja, $m \le 1$ ou $m \ge 3$.
      resposta: '$m \le 1$ ou $m \ge 3$'
    - enunciado: 'Simplifique $\operatorname{sen}x \cdot \operatorname{cotg}x \cdot \sec x$, para $x$ fora dos eixos.'
      espaco: 8
      resolucao: |
        $\operatorname{sen}x \cdot \frac{\cos x}{\operatorname{sen}x} \cdot \frac{1}{\cos x} = 1$.
      resposta: '1'
    - enunciado: 'Coloque em ordem crescente: $\operatorname{tg}100^\circ$, $\operatorname{tg}200^\circ$ e $\operatorname{tg}300^\circ$.'
      espaco: 10
      resolucao: |
        $\operatorname{tg}100^\circ = -\operatorname{tg}80^\circ$ (negativo e grande em módulo, perto de $-5{,}7$); $\operatorname{tg}300^\circ = -\sqrt3 \approx -1{,}73$; $\operatorname{tg}200^\circ = \operatorname{tg}20^\circ > 0$. $\operatorname{tg}100^\circ < \operatorname{tg}300^\circ < \operatorname{tg}200^\circ$.
      resposta: '$\operatorname{tg}100^\circ < \operatorname{tg}300^\circ < \operatorname{tg}200^\circ$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que $\operatorname{tg}(x + \pi) = \operatorname{tg}x$, sempre que $\cos x \ne 0$.'
      espaco: 10
      resolucao: |
        $\frac{\operatorname{sen}(x + \pi)}{\cos(x + \pi)} = \frac{-\operatorname{sen}x}{-\cos x} = \operatorname{tg}x$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que $\operatorname{tg}(-x) = -\operatorname{tg}x$, sempre que $\cos x \ne 0$.'
      espaco: 10
      resolucao: |
        $\frac{\operatorname{sen}(-x)}{\cos(-x)} = \frac{-\operatorname{sen}x}{\cos x} = -\operatorname{tg}x$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que $|\sec x| \ge 1$ sempre que $\sec x$ existe.'
      espaco: 10
      resolucao: |
        $0 < |\cos x| \le 1$, logo $|\sec x| = \frac{1}{|\cos x|} \ge 1$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que $\operatorname{tg}x \cdot \operatorname{cotg}x = 1$ sempre que as duas existem.'
      espaco: 10
      resolucao: |
        $\frac{\operatorname{sen}x}{\cos x} \cdot \frac{\cos x}{\operatorname{sen}x} = 1$, com $\operatorname{sen}x \ne 0$ e $\cos x \ne 0$.
      resposta: 'Ver resolução'
    - enunciado: 'P é a extremidade de um arco $x$ do 1º quadrante, e a reta OP corta a reta vertical $x = 1$ (o eixo das tangentes) no ponto T. Prove que a ordenada de T é $\operatorname{tg}x$.'
      espaco: 10
      resolucao: |
        Os triângulos de vértices O, $(\cos x, 0)$, P e O, $(1, 0)$, T são semelhantes: $\frac{y_T}{1} = \frac{\operatorname{sen}x}{\cos x} = \operatorname{tg}x$.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Um holofote está no chão, a 10 m da parede de um prédio. Ele é inclinado de um ângulo $\theta$ em relação ao chão, e o feixe atinge a parede a uma altura de $10\operatorname{tg}\theta$ metros. Para iluminar uma faixa publicitária, o técnico regulou o holofote com $\theta = 60^\circ$.
    enunciado: |
      O feixe atinge a parede a uma altura de
    opcoes: ['$10\sqrt3$ m', '$10$ m', '$\frac{10\sqrt3}{3}$ m', '$20$ m', '$5\sqrt3$ m']
    correta: A
    resolucao: |
      $10 \cdot \operatorname{tg}60^\circ = 10\sqrt3 \approx 17{,}3$ m.

  - estilo: Fuvest
    enunciado: |
      O valor de $\sec 135^\circ \cdot \operatorname{cossec}315^\circ$ é
    opcoes: ['$-2$', '$2$', '$1$', '$-1$', '$\sqrt2$']
    correta: B
    resolucao: |
      $\sec 135^\circ = -\sqrt2$ e $\operatorname{cossec}315^\circ = -\sqrt2$: produto 2.

  - estilo: Unicamp
    enunciado: |
      O valor de $\operatorname{tg}(-240^\circ)$ é
    opcoes: ['$\sqrt3$.', '$\frac{\sqrt3}{3}$.', '$-\sqrt3$.', '$-\frac{\sqrt3}{3}$.']
    correta: C
    resolucao: |
      $-240^\circ + 360^\circ = 120^\circ$: $\operatorname{tg}120^\circ = -\sqrt3$.

  - estilo: UEM
    enunciado: |
      Considere os sinais das razões trigonométricas. Assinale o que for correto.
    proposicoes:
    - '$\operatorname{tg}200^\circ > 0$.'
    - '$\sec 100^\circ < 0$.'
    - '$\operatorname{cossec}300^\circ < 0$.'
    - '$\operatorname{cotg}250^\circ > 0$.'
    - '$\operatorname{tg}160^\circ > 0$.'
    - '$\sec 330^\circ > 0$.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      Secante tem o sinal do cosseno; cossecante, o do seno; tangente e cotangente são positivas no 1º e no 3º Q. 16) Incorreta: $160^\circ$ está no 2º Q.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      A inclinação de uma rampa é a tangente do ângulo que ela forma com o chão, e costuma ser dada em porcentagem. Uma prefeitura vai construir uma rampa e quer o maior ângulo possível, desde que a inclinação não passe de $20\%$. O engenheiro tem o quadro abaixo, com valores aproximados.
    tabela:
      cabecalho: ['Ângulo', '$5^\circ$', '$10^\circ$', '$15^\circ$', '$20^\circ$']
      linhas:
      - ['tangente', '$0{,}09$', '$0{,}18$', '$0{,}27$', '$0{,}36$']
    enunciado: |
      Entre os ângulos do quadro, o engenheiro deve escolher
    opcoes: ['$5^\circ$', '$15^\circ$', '$20^\circ$', '$10^\circ$', '$0^\circ$']
    correta: D
    resolucao: |
      $20\% = 0{,}20$. Só $5^\circ$ e $10^\circ$ ficam abaixo disso; o maior é $10^\circ$.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir.
    afirmativas:
    - '$\operatorname{tg}x = \frac{\operatorname{sen}x}{\cos x}$, sempre que $\cos x \ne 0$.'
    - 'Existe $x$ com $\sec x = 0$.'
    - '$\operatorname{cotg}x$ não existe quando $\operatorname{sen}x = 0$.'
    - 'A tangente é positiva no 1º e no 3º quadrantes.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'II e III, apenas.', 'I e IV, apenas.', 'II, III e IV, apenas.', 'I, III e IV, apenas.']
    correta: E
    resolucao: |
      II. Incorreta: $\frac{1}{\cos x}$ nunca é zero.

  - estilo: Unesp
    enunciado: |
      O valor de $\operatorname{cotg}\frac{7\pi}{6}$ é
    opcoes: ['$\sqrt3$', '$-\sqrt3$', '$\frac{\sqrt3}{3}$', '$-\frac{\sqrt3}{3}$', '$1$']
    correta: A
    resolucao: |
      $\frac{\cos\frac{7\pi}{6}}{\operatorname{sen}\frac{7\pi}{6}} = \frac{-\sqrt3/2}{-1/2} = \sqrt3$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      Na figura, P é a extremidade do arco $\theta$ do 1º quadrante, e a reta OP corta o eixo das tangentes (a reta vertical que toca o ciclo em $(1, 0)$) no ponto $T = (1;\ 0{,}75)$.
    figura:
      tikz: |
        \begin{scope}[scale=.7]
        \draw[mudo, ->] (-2.2,0) -- (2.8,0); \draw[mudo, ->] (0,-2.2) -- (0,2.4);
        \draw[ink, line width=.9pt] (0,0) circle (1.8);
        \draw[lilas, line width=.9pt] (1.8,-1) -- (1.8,2.2);
        \draw[roxo] (0,0) -- (1.8,1.35);
        \fill[roxo] (1.44,1.08) circle (2.2pt) node[above left, font=\small] {P};
        \fill[roxo] (1.8,1.35) circle (2.2pt) node[right, font=\small] {T};
        \draw[roxo, ->] (.45,0) arc (0:37:.45); \node[roxo, font=\scriptsize] at (.7,.22) {$\theta$};
        \end{scope}
    enunciado: |
      Então
    opcoes: ['$\operatorname{tg}\theta = 0{,}75$ e $\cos\theta = 0{,}6$.', '$\operatorname{tg}\theta = 0{,}75$ e $\cos\theta = 0{,}8$.', '$\operatorname{tg}\theta = 0{,}6$ e $\cos\theta = 0{,}8$.', '$\operatorname{tg}\theta = 1{,}25$ e $\cos\theta = 0{,}8$.']
    correta: B
    resolucao: |
      A ordenada de T é a tangente. Com $\operatorname{sen}\theta = 0{,}75\cos\theta$ e $\operatorname{sen}^2\theta + \cos^2\theta = 1$: $1{,}5625\cos^2\theta = 1$, $\cos\theta = 0{,}8$.

  - estilo: Fuvest
    enunciado: |
      Para $x$ fora dos eixos, a expressão $\dfrac{\operatorname{tg}x \cdot \cos x}{\operatorname{sen}x}$ é igual a
    opcoes: ['$\cos x$', '$\operatorname{sen}x$', '$1$', '$\operatorname{tg}x$', '$\sec x$']
    correta: C
    resolucao: |
      $\operatorname{tg}x \cdot \cos x = \operatorname{sen}x$, e $\frac{\operatorname{sen}x}{\operatorname{sen}x} = 1$.

  - estilo: UFSC
    enunciado: |
      Considere um arco $x$ do 2º quadrante com $\operatorname{sen}x = 0{,}6$. Assinale o que for correto.
    proposicoes:
    - '$\operatorname{tg}x = -0{,}75$.'
    - '$\sec x = -1{,}25$.'
    - '$\operatorname{cossec}x = \frac53$.'
    - '$\operatorname{cotg}x = -\frac43$.'
    - '$\operatorname{tg}x \cdot \operatorname{cotg}x = 1$.'
    - '$\sec x > 0$.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      $\cos x = -0{,}8$ (2º Q). 01) $\frac{0{,}6}{-0{,}8}$. 02) $\frac{1}{-0{,}8}$. 32) Incorreta: o cosseno é negativo.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      Num fim de tarde, os raios de sol chegam ao chão formando um ângulo de $30^\circ$ com a horizontal. Um poste vertical de 8 m projeta uma sombra no chão plano. O comprimento da sombra é dado por $8 \cdot \operatorname{cotg}\alpha$, em que $\alpha$ é o ângulo dos raios com o chão. A prefeitura quer saber o comprimento dessa sombra.
    enunciado: |
      A sombra mede
    opcoes: ['$8\sqrt3$ m', '$\frac{8\sqrt3}{3}$ m', '$4$ m', '$16$ m', '$4\sqrt3$ m']
    correta: A
    resolucao: |
      $\operatorname{cotg}30^\circ = \sqrt3$: $8\sqrt3 \approx 13{,}9$ m.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - '$\operatorname{tg}\frac{5\pi}{3} = -\sqrt3$.'
    - '$\sec\frac{3\pi}{4} = \sqrt2$.'
    - '$\operatorname{cotg}\frac{\pi}{2} = 0$.'
    - '$\operatorname{cossec}\frac{7\pi}{6} = -2$.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – F – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – V – F.', 'V – F – V – V.']
    correta: E
    resolucao: |
      $\cos\frac{3\pi}{4} < 0$, logo $\sec\frac{3\pi}{4} = -\sqrt2$. $\operatorname{cotg}\frac{\pi}{2} = \frac01 = 0$. (V) (F) (V) (V)

  - estilo: Enem
    texto: |
      Um aplicativo de astronomia mostra a posição de cinco satélites, P, Q, R, S e T, num círculo de raio 1 centrado na estação. A posição de cada satélite é a extremidade de um arco, como no ciclo trigonométrico. O operador procura o satélite cujo arco tem tangente positiva e seno negativo.
    figura:
      tikz: |
        \begin{scope}[scale=.65]
        \draw[mudo, ->] (-2.2,0) -- (2.4,0); \draw[mudo, ->] (0,-2.2) -- (0,2.4);
        \draw[ink, line width=.9pt] (0,0) circle (1.8);
        \foreach \a/\n in {50/P,130/Q,310/R,230/S,0/T} { \fill[roxo] (\a:1.8) circle (2.2pt); \node[font=\small] at (\a:2.2) {\n}; }
        \end{scope}
    enunciado: |
      Esse satélite é
    opcoes: ['P.', 'Q.', 'R.', 'S.', 'T.']
    correta: D
    resolucao: |
      Tangente positiva: 1º ou 3º Q. Seno negativo: 3º ou 4º Q. Juntos: 3º Q, o ponto S.

  - estilo: Unesp
    enunciado: |
      O valor de $\operatorname{tg}\frac{3\pi}{4} + \sec\frac{2\pi}{3}$ é
    opcoes: ['$3$', '$-3$', '$-1$', '$1$', '$-2$']
    correta: B
    resolucao: |
      $-1 + (-2) = -3$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Considere $x$ real. Assinale o que for correto.
    proposicoes:
    - '$\operatorname{tg}(x + \pi) = \operatorname{tg}x$, sempre que $\cos x \ne 0$.'
    - '$\operatorname{tg}(-x) = -\operatorname{tg}x$, sempre que $\cos x \ne 0$.'
    - '$|\sec x| \ge 1$, sempre que $\cos x \ne 0$.'
    - 'A equação $\operatorname{cossec}x = 0{,}5$ não tem solução.'
    - '$\operatorname{tg}x$ existe para todo $x$ real.'
    - '$\operatorname{cotg}x = \frac{1}{\operatorname{tg}x}$, sempre que as duas existem.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      08) $|\operatorname{cossec}x| \ge 1$. 16) Incorreta: não existe quando $\cos x = 0$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Unicamp
    enunciado: |
      A expressão $\operatorname{tg}x + \operatorname{cotg}x$ existe se, e somente se,
    opcoes: ['$x \ne \frac{k\pi}{2}$, com $k$ inteiro.', '$x \ne k\pi$, com $k$ inteiro.', '$x \ne \frac{\pi}{2} + k\pi$, com $k$ inteiro.', '$x \ne 2k\pi$, com $k$ inteiro.']
    correta: A
    resolucao: |
      Precisa de $\cos x \ne 0$ e $\operatorname{sen}x \ne 0$: $x$ fora dos eixos.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Um farol fica na origem de um sistema de coordenadas, em metros, e a costa é a reta vertical $x = 300$. O feixe de luz gira e, quando faz ângulo $\theta$ com o eixo horizontal (com $-90^\circ < \theta < 90^\circ$), ilumina na costa o ponto $(300,\ 300\operatorname{tg}\theta)$. Ordenada positiva indica norte, e negativa indica sul.
    enunciado: |
      Para $\theta = 30^\circ$, a ordenada do ponto iluminado é
    opcoes: ['$150$', '$300$', '$100\sqrt3$', '$150\sqrt3$', '$300\sqrt3$']
    correta: C
    resolucao: |
      $300 \cdot \frac{\sqrt3}{3} = 100\sqrt3 \approx 173$ m ao norte.

  - estilo: Unesp
    enunciado: |
      Para $\theta = -60^\circ$, a ordenada do ponto iluminado é
    opcoes: ['$300\sqrt3$', '$-100\sqrt3$', '$100\sqrt3$', '$-300\sqrt3$', '$-150$']
    correta: D
    resolucao: |
      $\operatorname{tg}(-60^\circ) = -\sqrt3$: $-300\sqrt3 \approx -520$, ao sul.

  - estilo: Fuvest
    enunciado: |
      O valor de $\sec^2\frac{\pi}{4} + \operatorname{tg}^2\frac{2\pi}{3}$ é
    opcoes: ['$3$', '$4$', '$2$', '$\frac72$', '$5$']
    correta: E
    resolucao: |
      $(\sqrt2)^2 + (-\sqrt3)^2 = 2 + 3 = 5$.

  - estilo: Unesp
    texto: |
      Na figura, P é a extremidade do arco de $120^\circ$, e o prolongamento de PO corta o eixo das tangentes (a reta vertical que toca o ciclo em $(1, 0)$) no ponto T.
    figura:
      tikz: |
        \begin{scope}[scale=.6]
        \draw[mudo, ->] (-2,0) -- (2.4,0); \draw[mudo, ->] (0,-2.4) -- (0,2);
        \draw[ink, line width=.9pt] (0,0) circle (1.2);
        \draw[lilas, line width=.9pt] (1.2,-2.4) -- (1.2,1.6);
        \draw[roxo] (120:1.2) -- (1.2,-2.08);
        \fill[roxo] (120:1.2) circle (2.2pt) node[above left, font=\small] {P};
        \fill[roxo] (1.2,-2.08) circle (2.2pt) node[right, font=\small] {T};
        \end{scope}
    enunciado: |
      A ordenada de T é
    opcoes: ['$\sqrt3$', '$-\sqrt3$', '$-\frac{\sqrt3}{3}$', '$\frac{\sqrt3}{3}$', '$-\frac12$']
    correta: B
    resolucao: |
      A ordenada de T é a tangente do arco: $\operatorname{tg}120^\circ = -\sqrt3$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Sabe-se que $\operatorname{sen}x = -\frac23$ e que $x$ está no 4º quadrante.'
    itens:
    - 'Calcule $\cos x$.'
    - 'Calcule $\operatorname{tg}x$ e $\operatorname{cotg}x$.'
    - 'Calcule $\sec x$ e $\operatorname{cossec}x$.'
    espaco: 62
    resolucao: |
      a) $\cos^2 x = 1 - \frac49 = \frac59$; no 4º Q, $\cos x = \frac{\sqrt5}{3}$.
      b) $\operatorname{tg}x = \frac{-2/3}{\sqrt5/3} = -\frac{2\sqrt5}{5}$; $\operatorname{cotg}x = -\frac{\sqrt5}{2}$.
      c) $\sec x = \frac{3}{\sqrt5} = \frac{3\sqrt5}{5}$; $\operatorname{cossec}x = -\frac32$.
    resposta: 'a) $\frac{\sqrt5}{3}$; b) $-\frac{2\sqrt5}{5}$ e $-\frac{\sqrt5}{2}$; c) $\frac{3\sqrt5}{5}$ e $-\frac32$'

  - estilo: Unicamp
    enunciado: 'P é a extremidade de um arco $x$ do 1º quadrante, e a reta OP corta o eixo das tangentes, a reta vertical $x = 1$, no ponto T.'
    itens:
    - 'Mostre que $T = (1, \operatorname{tg}x)$.'
    - 'Mostre que $OT = \sec x$.'
    - 'Se $OT = 2$, quanto valem $x$ e $\operatorname{tg}x$?'
    espaco: 62
    resolucao: |
      a) Semelhança entre os triângulos O, $(\cos x, 0)$, P e O, $(1, 0)$, T: $\frac{y_T}{1} = \frac{\operatorname{sen}x}{\cos x}$.
      b) Na mesma semelhança, $\frac{OT}{OP} = \frac{1}{\cos x}$, e $OP = 1$.
      c) $\cos x = \frac12$: $x = \frac{\pi}{3}$ e $\operatorname{tg}x = \sqrt3$.
    resposta: 'c) $\frac{\pi}{3}$ e $\sqrt3$'

  - estilo: ITA
    enunciado: |
      O número de valores de $x$ em $[0, 2\pi]$ para os quais $\operatorname{tg}x = \operatorname{cotg}x$ é
    opcoes: ['$4$', '$2$', '$0$', '$8$', '$1$']
    correta: A
    espaco: 22
    resolucao: |
      $\operatorname{tg}x = \frac{1}{\operatorname{tg}x}$ dá $\operatorname{tg}^2 x = 1$, $\operatorname{tg}x = \pm1$: $\frac{\pi}{4}$, $\frac{3\pi}{4}$, $\frac{5\pi}{4}$ e $\frac{7\pi}{4}$.
    resposta: 'A'

  - estilo: Unesp
    enunciado: 'Considere arcos medidos em radianos e use $\pi \approx 3{,}14$.'
    itens:
    - 'Compare $\operatorname{tg}50^\circ$ e $\operatorname{tg}230^\circ$.'
    - 'Dê o sinal de $\operatorname{tg}1$, $\operatorname{tg}2$, $\operatorname{tg}3$ e $\operatorname{tg}4$.'
    - 'Qual é maior: $\operatorname{tg}1$ ou $\operatorname{tg}4$? Justifique.'
    espaco: 62
    resolucao: |
      a) São iguais: $230^\circ = 50^\circ + 180^\circ$.
      b) 1: 1º Q ($+$); 2 e 3: 2º Q ($-$); 4: 3º Q ($+$).
      c) $\operatorname{tg}4 = \operatorname{tg}(4 - \pi) \approx \operatorname{tg}0{,}86$. No 1º quadrante a tangente cresce, e $0{,}86 < 1$: $\operatorname{tg}1$ é maior.
    resposta: 'a) iguais; b) $+, -, -, +$; c) $\operatorname{tg}1$'

  - estilo: UFSC
    enunciado: |
      Considere arcos medidos em radianos. Assinale o que for correto.
    proposicoes:
    - '$\operatorname{tg}1 > 1$.'
    - '$\sec 2 < 0$.'
    - '$\operatorname{cotg}3 < 0$.'
    - '$\operatorname{tg}4 > 0$.'
    - '$\operatorname{cossec}5 > 0$.'
    - '$\operatorname{tg}\left(\frac{\pi}{2} - x\right) = \operatorname{cotg}x$, para $0 < x < \frac{\pi}{2}$.'
    corretas: [1, 2, 3, 4, 6]
    espaco: 22
    resolucao: |
      01) $1 > \frac{\pi}{4}$. 02) e 04) 2º Q. 08) 3º Q. 16) Incorreta: $\frac{3\pi}{2} < 5 < 2\pi$, 4º Q. 32) Seno e cosseno trocam de lugar.
    resposta: 'Soma 47 (01 + 02 + 04 + 08 + 32)'

  - estilo: Fuvest
    enunciado: 'Considere $f(x) = 3 + 2\sec x$, definida para $\cos x \ne 0$.'
    itens:
    - 'Explique por que $\sec x \le -1$ ou $\sec x \ge 1$.'
    - 'Determine o conjunto dos valores de $f$.'
    - 'A equação $f(x) = 3$ tem solução? Justifique.'
    espaco: 62
    resolucao: |
      a) $0 < |\cos x| \le 1$ dá $|\sec x| \ge 1$.
      b) $2\sec x \le -2$ ou $2\sec x \ge 2$: $f(x) \le 1$ ou $f(x) \ge 5$.
      c) Não: seria preciso $\sec x = 0$, e 3 não está no conjunto de valores.
    resposta: 'b) $f \le 1$ ou $f \ge 5$; c) não'

  - estilo: Unicamp
    enunciado: 'Um holofote no chão, a 20 m de um prédio, faz ângulo $\theta$ com o chão ($0 < \theta < 90^\circ$). O feixe atinge a parede na altura $h = 20\operatorname{tg}\theta$.'
    itens:
    - 'Calcule $h$ para $\theta = 30^\circ$, $45^\circ$ e $60^\circ$.'
    - 'Mostre que dobrar o ângulo de $30^\circ$ para $60^\circ$ triplica a altura.'
    - 'O que acontece com $h$ quando $\theta$ se aproxima de $90^\circ$? Por quê?'
    espaco: 62
    resolucao: |
      a) $\frac{20\sqrt3}{3}$, $20$ e $20\sqrt3$ metros.
      b) $\frac{20\sqrt3}{20\sqrt3/3} = 3$.
      c) Cresce sem limite: o cosseno se aproxima de 0 com seno perto de 1, e o feixe fica quase paralelo à parede.
    resposta: 'a) $\frac{20\sqrt3}{3}$, 20 e $20\sqrt3$ m'

  - estilo: Fuvest
    enunciado: |
      Se $\operatorname{tg}x = -\frac34$ e $x$ está no 4º quadrante, então $\sec x + \operatorname{cossec}x$ vale
    opcoes: ['$\frac{5}{12}$', '$-\frac{5}{12}$', '$\frac{35}{12}$', '$-\frac{35}{12}$', '$\frac{1}{12}$']
    correta: B
    espaco: 22
    resolucao: |
      Seno e cosseno são proporcionais a $-3$ e $4$, com $\operatorname{sen}^2 + \cos^2 = 1$: $\operatorname{sen}x = -\frac35$ e $\cos x = \frac45$. $\frac54 - \frac53 = -\frac{5}{12}$.
    resposta: 'B'

  - estilo: Unesp
    enunciado: 'Simplifique as expressões, para $x$ fora dos eixos.'
    itens:
    - '$E_1 = \operatorname{cotg}x \cdot \operatorname{sen}x$.'
    - '$E_2 = \sec x \cdot \cos x + \operatorname{tg}x \cdot \operatorname{cotg}x$.'
    - '$E_3 = (\operatorname{cossec}x - \operatorname{sen}x) \cdot \operatorname{tg}x$.'
    espaco: 62
    resolucao: |
      a) $\frac{\cos x}{\operatorname{sen}x} \cdot \operatorname{sen}x = \cos x$.
      b) $1 + 1 = 2$.
      c) $\frac{1 - \operatorname{sen}^2 x}{\operatorname{sen}x} \cdot \frac{\operatorname{sen}x}{\cos x} = \frac{\cos^2 x}{\cos x} = \cos x$.
    resposta: 'a) $\cos x$; b) 2; c) $\cos x$'

  - estilo: Fuvest
    enunciado: 'Considere $0 \le x < 2\pi$.'
    itens:
    - 'Para que $x$ temos $\operatorname{tg}x > 0$?'
    - 'Para que $x$ a secante e a cossecante existem e têm o mesmo sinal?'
    - 'Resolva $\operatorname{tg}x = -1$.'
    espaco: 62
    resolucao: |
      a) 1º e 3º Q: $0 < x < \frac{\pi}{2}$ ou $\pi < x < \frac{3\pi}{2}$.
      b) Elas têm os sinais do cosseno e do seno, que são iguais no 1º e no 3º Q: o mesmo conjunto do item a.
      c) Referência $\frac{\pi}{4}$, tangente negativa no 2º e no 4º Q: $\frac{3\pi}{4}$ e $\frac{7\pi}{4}$.
    resposta: 'c) $\frac{3\pi}{4}$ e $\frac{7\pi}{4}$'
