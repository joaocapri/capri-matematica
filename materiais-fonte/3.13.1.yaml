# Aula 3.13.1 — Polinômios: definição e identidade
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: o que é polinômio (expoentes naturais), grau, coeficiente dominante, termo independente; valor
# numérico; raiz; P(1) = soma dos coeficientes, P(0) = termo independente, (P(1) ± P(−1))/2; polinômio nulo; discussão do
# grau com parâmetro; polinômios idênticos (comparação de coeficientes); determinar coeficientes por condições;
# decomposição em frações parciais simples. Operações e divisão ficam para 3.13.2–3.13.5.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Considere $P(x) = 3x^4 - 2x^3 + x - 6$. Complete.'
      itens:
      - 'Grau: {{4}}'
      - 'Coeficiente dominante: {{3}}'
      - 'Termo independente: {{-6}}'
      - '$P(1)$: {{-4}}'
      - '$P(-1)$: {{-2}}'
      espaco_item: 8
      resolucao: |
        $P(1) = 3 - 2 + 1 - 6 = -4$; $P(-1) = 3 + 2 - 1 - 6 = -2$.
      resposta: '4; 3; $-6$; $-4$; $-2$'
    - enunciado: 'Associe cada polinômio ao seu grau.'
      esquerda:
      - '$5x^3 - x + 2$'
      - '$7$'
      - '$(x^2 + 1)^2$'
      - '$x(x - 1) - x^2$'
      - '$2x^5 + x^2$'
      direita:
      - '$4$'
      - '$0$'
      - '$5$'
      - '$1$'
      - '$3$'
      resolucao: |
        $(x^2 + 1)^2 = x^4 + 2x^2 + 1$. $x(x - 1) - x^2 = -x$: os termos de grau 2 se cancelam.
      resposta: 'De cima para baixo: 3, 2, 5, 4, 1'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - '$x^2 + \frac{1}{x}$ é um polinômio.'
      - '$P(0)$ é o termo independente de $P$.'
      - 'Se $P(2) = 0$, então 2 é raiz de $P$.'
      - 'O polinômio nulo tem grau 0.'
      justificar: true
      espaco: 20
      resolucao: |
        (F) $\tfrac{1}{x} = x^{-1}$: expoente negativo. (V) Todos os outros termos se anulam. (V) Definição de raiz. (F) Não se define grau para o polinômio nulo; grau 0 é o das constantes não nulas.
      resposta: F, V, V, F
    - enunciado: 'Complete a tabela de valores de $P(x) = x^3 - 4x$.'
      tabela:
        cabecalho: ['$x$', '$-2$', '$-1$', '$0$', '$1$', '$3$']
        linhas:
        - ['$P(x)$', '${{0}}$', '${{3}}$', '${{0}}$', '${{-3}}$', '${{15}}$']
      resolucao: |
        $-8 + 8 = 0$; $-1 + 4 = 3$; $0$; $1 - 4 = -3$; $27 - 12 = 15$.
      resposta: '0; 3; 0; $-3$; 15'
    - enunciado: 'Encontre $a$, $b$ e $c$ para que $ax^2 + (b - 1)x + (c + 2) \equiv 3x^2 + 5$.'
      espaco: 8
      resolucao: |
        $a = 3$; $b - 1 = 0$, $b = 1$; $c + 2 = 5$, $c = 3$.
      resposta: '$a = 3$, $b = 1$, $c = 3$'
    - enunciado: 'O polinômio $P(x) = x^2 + kx - 6$ tem raiz 2. Calcule $k$ e a outra raiz.'
      espaco: 8
      resolucao: |
        $4 + 2k - 6 = 0$: $k = 1$. $x^2 + x - 6 = (x + 3)(x - 2)$: a outra raiz é $-3$.
      resposta: '$k = 1$; $-3$'
    - enunciado: 'Calcule a soma dos coeficientes e o termo independente de $P(x) = (2x - 1)^5$, sem desenvolver.'
      espaco: 8
      resolucao: |
        Soma: $P(1) = 1^5 = 1$. Termo independente: $P(0) = (-1)^5 = -1$.
      resposta: '1 e $-1$'
  - nome: Nível 2
    questoes:
    - texto: |
        Sobre $P(x) = (m - 2)x^3 + 4x^2 - 1$, Gabi afirmou: "o grau de $P$ é 3, qualquer que seja $m$".
      enunciado: 'Encontre o erro e corrija.'
      espaco: 10
      resolucao: |
        Se $m = 2$, o termo de grau 3 some e $P(x) = 4x^2 - 1$ tem grau 2. O grau é 3 só para $m \ne 2$.
      resposta: 'Grau 3 se $m \ne 2$; grau 2 se $m = 2$'
    - enunciado: 'Discuta o grau de $P(x) = (m^2 - 9)x^3 + (m - 3)x^2 + 2x - 1$ conforme $m$.'
      espaco: 12
      resolucao: |
        $m \ne \pm 3$: grau 3. $m = -3$: $P(x) = -6x^2 + 2x - 1$, grau 2. $m = 3$: $P(x) = 2x - 1$, grau 1.
      resposta: '$m \ne \pm 3$: 3; $m = -3$: 2; $m = 3$: 1'
    - enunciado: 'Em $P(x) = x^3 + ax^2 + bx - 4$, sabe-se que $P(1) = 0$ e $P(-1) = -6$. Calcule $a$ e $b$.'
      espaco: 10
      resolucao: |
        $1 + a + b - 4 = 0$: $a + b = 3$. $-1 + a - b - 4 = -6$: $a - b = -1$. Logo $a = 1$, $b = 2$.
      resposta: '$a = 1$, $b = 2$'
    - enunciado: 'Encontre $A$ e $B$ tais que $\frac{5x + 1}{(x - 1)(x + 2)} \equiv \frac{A}{x - 1} + \frac{B}{x + 2}$.'
      espaco: 10
      resolucao: |
        $5x + 1 \equiv A(x + 2) + B(x - 1)$. Com $x = 1$: $6 = 3A$, $A = 2$. Com $x = -2$: $-9 = -3B$, $B = 3$.
      resposta: '$A = 2$, $B = 3$'
    - enunciado: 'Encontre $a$ e $b$ para que $(x + 1)(ax + b) \equiv 2x^2 + 7x + 5$.'
      espaco: 8
      resolucao: |
        $ax^2 + (a + b)x + b$: $a = 2$, $b = 5$, e $a + b = 7$ confere.
      resposta: '$a = 2$, $b = 5$'
    - enunciado: 'Um polinômio de grau 2 satisfaz $P(0) = 3$, $P(1) = 2$ e $P(2) = 5$. Complete.'
      itens:
      - 'Termo independente: {{3}}'
      - 'Coeficiente de $x^2$: {{2}}'
      - 'Coeficiente de $x$: {{-3}}'
      - '$P(3)$: {{12}}'
      espaco_item: 8
      resolucao: |
        $P(x) = ax^2 + bx + 3$: $a + b = -1$ e $4a + 2b = 2$. Logo $a = 2$, $b = -3$, e $P(3) = 18 - 9 + 3 = 12$.
      resposta: '3; 2; $-3$; 12'
    - enunciado: 'Calcule a soma dos coeficientes e o termo independente de $(x^2 - 3x + 1)^{10}$.'
      espaco: 8
      resolucao: |
        $P(1) = (-1)^{10} = 1$; $P(0) = 1^{10} = 1$.
      resposta: '1 e 1'
    - enunciado: 'Encontre $a$, $b$ e $c$ para que $(a - 2)x^2 + (b + a)x + (c - 1)$ seja o polinômio nulo.'
      espaco: 8
      resolucao: |
        Todos os coeficientes nulos: $a = 2$, $b = -2$, $c = 1$.
      resposta: '$a = 2$, $b = -2$, $c = 1$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que, para todo polinômio $P$, $P(1)$ é a soma dos coeficientes e $P(0)$ é o termo independente.'
      espaco: 8
      resolucao: |
        $P(1) = a_n \cdot 1^n + \dots + a_1 \cdot 1 + a_0 = a_n + \dots + a_0$. Em $P(0)$, todos os termos com $x$ se anulam e resta $a_0$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que a soma dos coeficientes dos termos de grau par de $P$ é $\frac{P(1) + P(-1)}{2}$.'
      espaco: 10
      resolucao: |
        Em $P(-1)$, os termos de grau par mantêm o sinal e os de grau ímpar trocam. Sendo $S_p$ e $S_i$ as somas: $P(1) = S_p + S_i$ e $P(-1) = S_p - S_i$. Somando, $2S_p = P(1) + P(-1)$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que o grau de $P + Q$ é no máximo o maior dos graus de $P$ e $Q$, e dê um exemplo em que ele é menor.'
      espaco: 10
      resolucao: |
        Só aparecem potências que estão em $P$ ou em $Q$. Exemplo: $(x^2 + x) + (-x^2 + 1) = x + 1$, de grau 1, embora as parcelas tenham grau 2.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que, se $P(x) = ax + b$ satisfaz $P(1) = P(2)$, então $P$ é constante.'
      espaco: 8
      resolucao: |
        $a + b = 2a + b$: $a = 0$, e $P(x) = b$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que $(x + 1)^3 \equiv x^3 + 3x^2 + 3x + 1$ e confira a soma dos coeficientes calculando $P(1)$.'
      espaco: 10
      resolucao: |
        $(x + 1)^2 = x^2 + 2x + 1$; $(x^2 + 2x + 1)(x + 1) = x^3 + 3x^2 + 3x + 1$. Soma: $1 + 3 + 3 + 1 = 8 = 2^3 = P(1)$.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Uma pequena fábrica estima o seu lucro mensal, em milhares de reais, pelo polinômio $L(x) = -x^2 + 40x - 300$, em que $x$ é a quantidade produzida, em centenas de unidades. O gerente quer saber o lucro previsto para um mês em que forem produzidas 2000 unidades.
    enunciado: |
      O lucro previsto é de
    opcoes: ['$100$ mil reais', '$400$ mil reais', '$300$ mil reais', '$0$', '$1100$ mil reais']
    correta: A
    resolucao: |
      $x = 20$: $L(20) = -400 + 800 - 300 = 100$.

  - estilo: Fuvest
    enunciado: |
      O grau do polinômio $P(x) = (x^3 - 2)^2 - x^6$ é
    opcoes: ['$6$', '$3$', '$0$', '$9$', '$2$']
    correta: B
    resolucao: |
      $x^6 - 4x^3 + 4 - x^6 = -4x^3 + 4$.

  - estilo: Unicamp
    enunciado: |
      Para $P(x) = x^4 - 3x^2 + 2$, o valor de $P(\sqrt{2})$ é
    opcoes: ['$2$.', '$4$.', '$0$.', '$-2$.']
    correta: C
    resolucao: |
      $4 - 6 + 2 = 0$.

  - estilo: UEM
    enunciado: |
      Considere o polinômio $P(x) = 2x^3 - 5x^2 + x + 2$. Assinale o que for correto.
    proposicoes:
    - 'O grau de $P$ é 3.'
    - '$P(0) = 2$.'
    - '1 é raiz de $P$.'
    - '2 é raiz de $P$.'
    - '$P(-1) = 6$.'
    - 'A soma dos coeficientes de $P$ é 0.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) Correta. 02) Termo independente. 04) $2 - 5 + 1 + 2 = 0$. 08) $16 - 20 + 2 + 2 = 0$. 16) Incorreta: $-2 - 5 - 1 + 2 = -6$. 32) $P(1) = 0$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      Um engenheiro descreve o perfil de uma rampa de skate por um polinômio de grau 2, $h(x) = ax^2 + bx + c$, em que $x$ é a distância horizontal e $h$ é a altura, ambas em metros. Ele mediu três pontos do perfil, registrados no quadro, e quer prever a altura da rampa a 3 m do início.
    tabela:
      cabecalho: ['$x$ (m)', '$0$', '$1$', '$2$']
      linhas:
      - ['$h(x)$ (m)', '$1$', '$3$', '$9$']
    enunciado: |
      A altura da rampa a 3 m do início é
    opcoes: ['$15$ m', '$27$ m', '$13$ m', '$19$ m', '$21$ m']
    correta: D
    resolucao: |
      $c = 1$; $a + b = 2$; $4a + 2b = 8$. Logo $a = 2$, $b = 0$: $h(x) = 2x^2 + 1$ e $h(3) = 19$.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir, sobre polinômios.
    afirmativas:
    - '$x^3 - 2x + \sqrt{5}$ é um polinômio.'
    - '$\sqrt{x} + 1$ é um polinômio.'
    - 'O grau do produto de dois polinômios não nulos é a soma dos graus.'
    - 'Para todo polinômio $P$, $P(1)$ é a soma dos seus coeficientes.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'II e III, apenas.', 'II e IV, apenas.', 'I, II e III, apenas.', 'I, III e IV, apenas.']
    correta: E
    resolucao: |
      I. Correta: os coeficientes podem ser irracionais. II. Incorreta: $\sqrt{x} = x^{1/2}$. III. Correta. IV. Correta.

  - estilo: Unesp
    enunciado: |
      Se $(a + b)x + (a - b) \equiv 5x + 1$, então $ab$ vale
    opcoes: ['$6$', '$5$', '$3$', '$-6$', '$1$']
    correta: A
    resolucao: |
      $a + b = 5$ e $a - b = 1$: $a = 3$, $b = 2$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      O quadro mostra três valores de um polinômio $P$ de grau 2.
    tabela:
      cabecalho: ['$x$', '$-1$', '$0$', '$1$']
      linhas:
      - ['$P(x)$', '$6$', '$3$', '$2$']
    enunciado: |
      O valor de $P(3)$ é
    opcoes: ['$3$.', '$6$.', '$9$.', '$12$.']
    correta: B
    resolucao: |
      $P(x) = ax^2 + bx + 3$: $a - b = 3$ e $a + b = -1$, logo $a = 1$, $b = -2$. $P(3) = 9 - 6 + 3 = 6$.

  - estilo: Fuvest
    enunciado: |
      Se $\frac{5x - 2}{x^2 - x} \equiv \frac{A}{x} + \frac{B}{x - 1}$, então $A + B$ vale
    opcoes: ['$3$', '$-5$', '$5$', '$2$', '$7$']
    correta: C
    resolucao: |
      $5x - 2 \equiv A(x - 1) + Bx$. $x = 0$: $A = 2$. $x = 1$: $B = 3$.

  - estilo: UFSC
    enunciado: |
      Considere o polinômio $P(x) = (m - 1)x^3$ $+ (m^2 - 1)x^2 + mx + 4$, com $m$ real. Assinale o que for correto.
    proposicoes:
    - 'Se $m \ne 1$, o grau de $P$ é 3.'
    - 'Se $m = 1$, o grau de $P$ é 1.'
    - 'Se $m = -1$, o grau de $P$ é 3.'
    - '$P(0) = 4$ para todo $m$.'
    - 'Se $m = 1$, então $P(1) = 5$.'
    - 'Existe $m$ para o qual o grau de $P$ é 2.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) O coeficiente de $x^3$ não se anula. 02) $P(x) = x + 4$. 04) $P(x) = -2x^3 - x + 4$. 08) Correta. 16) $1 + 4$. 32) Incorreta: o grau 2 exigiria $m = 1$, mas aí o coeficiente de $x^2$ também se anula.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      De uma folha retangular de papelão de 20 cm por 30 cm, recortam-se quadrados de lado $x$ nos quatro cantos e dobram-se as abas para formar uma caixa sem tampa. O volume da caixa é dado por $V(x) = x(20 - 2x)(30 - 2x)$, que, desenvolvido, é um polinômio em $x$.
    enunciado: |
      Desenvolvido, o polinômio $V(x)$ tem
    opcoes: ['grau 3 e coeficiente dominante 4.', 'grau 3 e coeficiente dominante 1.', 'grau 2 e coeficiente dominante 4.', 'grau 3 e coeficiente dominante 600.', 'grau 2 e coeficiente dominante $-100$.']
    correta: A
    resolucao: |
      $V(x) = 4x^3 - 100x^2 + 600x$: o termo de maior grau vem de $x \cdot (-2x) \cdot (-2x) = 4x^3$.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'As raízes de $x^2 - 5x + 6$ são 2 e 3.'
    - 'O grau de $P + Q$ é sempre o maior dos graus de $P$ e $Q$.'
    - 'Se $ax^2 + bx + c \equiv 0$, então $a = b = c = 0$.'
    - '$(x - 1)(x + 1) \equiv x^2 - 1$.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – F – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – V – F.', 'V – F – V – V.']
    correta: E
    resolucao: |
      (V) $4 - 10 + 6 = 0$ e $9 - 15 + 6 = 0$. (F) Os termos de maior grau podem se cancelar. (V) (V)

  - estilo: Enem
    texto: |
      Num experimento, um estudante registrou os valores de uma grandeza $y$ para alguns valores de $x$ e suspeita que eles seguem um polinômio. Ele montou o quadro abaixo e quer identificar, entre cinco candidatos sugeridos pelo professor, o único que reproduz todos os valores medidos.
    tabela:
      cabecalho: ['$x$', '$0$', '$1$', '$2$', '$3$']
      linhas:
      - ['$y$', '$1$', '$2$', '$9$', '$28$']
    enunciado: |
      O polinômio que reproduz o quadro é
    opcoes: ['$x^2 + 1$.', '$2x^2 - x + 1$.', '$3x^2 - 2x + 1$.', '$x^3 + 1$.', '$x^3 + x + 1$.']
    correta: D
    resolucao: |
      $x^3 + 1$: 1, 2, 9, 28. Os outros falham: $x^2 + 1$ dá 5 em $x = 2$; $2x^2 - x + 1$ dá 7; $3x^2 - 2x + 1$ dá 22 em $x = 3$; $x^3 + x + 1$ dá 3 em $x = 1$.

  - estilo: Unesp
    enunciado: |
      A soma dos coeficientes do polinômio $(3x - 2)^7$ é
    opcoes: ['$0$', '$1$', '$-1$', '$128$', '$2187$']
    correta: B
    resolucao: |
      $P(1) = 1^7 = 1$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Sabe-se que o produto $(x + 2)(ax^2 + bx + c)$ é idêntico ao polinômio $2x^3 + 7x^2 + 7x + 2$. Assinale o que for correto.
    proposicoes:
    - '$a = 2$.'
    - '$b = 3$.'
    - '$c = 1$.'
    - '$a + b + c = 6$.'
    - '1 é raiz de $ax^2 + bx + c$.'
    - '$-2$ é raiz de $2x^3 + 7x^2 + 7x + 2$.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      $ax^3 + (2a + b)x^2 + (2b + c)x + 2c$: $a = 2$, $b = 3$, $c = 1$. 08) Correta. 16) Incorreta: $2 + 3 + 1 = 6 \ne 0$. 32) O fator $x + 2$ se anula.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Unicamp
    enunciado: |
      O polinômio $P(x) = x^2 + bx + c$ satisfaz $P(1) = 0$ e $P(0) = -3$. O valor de $P(2)$ é
    opcoes: ['$5$.', '$3$.', '$-3$.', '$0$.']
    correta: A
    resolucao: |
      $c = -3$ e $1 + b - 3 = 0$: $b = 2$. $P(2) = 4 + 4 - 3 = 5$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Um aplicativo de entregas calcula o preço do frete, em reais, pelo polinômio $F(d) = 0{,}002d^2 + 0{,}5d + 10$, em que $d$ é a distância percorrida, em quilômetros. O termo independente corresponde a uma taxa cobrada em toda entrega, e os outros termos dependem da distância.
    enunciado: |
      O frete de uma entrega de 100 km custa
    opcoes: ['R\$\,60,00', 'R\$\,70,00', 'R\$\,80,00', 'R\$\,90,00', 'R\$\,100,00']
    correta: C
    resolucao: |
      $0{,}002 \cdot 10\,000 + 50 + 10 = 20 + 50 + 10 = 80$.

  - estilo: Unesp
    enunciado: |
      A taxa cobrada em toda entrega, independentemente da distância, é
    opcoes: ['R\$\,0,00', 'R\$\,0,50', 'R\$\,2,00', 'R\$\,10,00', 'R\$\,20,00']
    correta: D
    resolucao: |
      É o termo independente: $F(0) = 10$.

  - estilo: Fuvest
    enunciado: |
      A soma dos coeficientes dos termos de grau par do polinômio $(2x - 1)^4$ é
    opcoes: ['$1$', '$81$', '$40$', '$-40$', '$41$']
    correta: E
    resolucao: |
      $P(1) = 1$ e $P(-1) = 81$: $\tfrac{1 + 81}{2} = 41$.

  - estilo: Unesp
    texto: |
      A figura mostra o gráfico de um polinômio $P(x) = x^3 + ax^2 + bx + c$, que corta o eixo $x$ nos pontos de abscissas $-1$, $1$ e $3$ e o eixo $y$ no ponto de ordenada 3.
    figura:
      tikz: |
        \begin{scope}[scale=.7]
        \draw[mudo, ->] (-2,0) -- (4,0) node[right, font=\scriptsize] {$x$};
        \draw[mudo, ->] (0,-2) -- (0,2) node[above, font=\scriptsize] {$y$};
        \draw[roxo, line width=1pt, domain=-1.35:3.35, samples=60] plot (\x, {0.4*(\x+1)*(\x-1)*(\x-3)});
        \foreach \t in {-1, 1, 3} \fill[ink] (\t,0) circle (1.5pt) node[below, font=\scriptsize] {$\t$};
        \fill[ink] (0,1.2) circle (1.5pt) node[right, font=\scriptsize] {$3$};
        \end{scope}
    enunciado: |
      O valor de $c$ é
    opcoes: ['$-3$', '$3$', '$1$', '$-1$', '$0$']
    correta: B
    resolucao: |
      $c = P(0) = 3$. (De fato, $P(x) = (x + 1)(x - 1)(x - 3) = x^3 - 3x^2 - x + 3$.)

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Um polinômio $P(x) = ax^3 + bx^2 + cx + d$ satisfaz $P(0) = 1$, $P(1) = 0$, $P(-1) = 4$ e $P(2) = 1$.'
    itens:
    - 'Monte o sistema e calcule $a$, $b$, $c$ e $d$.'
    - 'Qual é o grau de $P$? Explique por que ele não é 3.'
    - 'Encontre as raízes de $P$.'
    espaco: 62
    resolucao: |
      a) $d = 1$; $a + b + c = -1$; $-a + b - c = 3$; $8a + 4b + 2c = 0$. Somando as duas do meio: $b = 1$, $a + c = -2$. Da última: $4a + c = -2$. Logo $a = 0$, $c = -2$.
      b) $P(x) = x^2 - 2x + 1$: o coeficiente de $x^3$ deu 0, então o grau é 2.
      c) $(x - 1)^2$: raiz 1 (dupla).
    resposta: 'a) $a = 0$, $b = 1$, $c = -2$, $d = 1$; b) 2; c) 1'

  - estilo: Unicamp
    enunciado: 'Considere $\frac{3x + 5}{x^2 + 4x + 3}$.'
    itens:
    - 'Fatore o denominador.'
    - 'Encontre $A$ e $B$ tais que a fração seja idêntica a $\frac{A}{x + 1} + \frac{B}{x + 3}$.'
    - 'Confira a identidade para $x = 1$.'
    espaco: 62
    resolucao: |
      a) $(x + 1)(x + 3)$.
      b) $3x + 5 \equiv A(x + 3) + B(x + 1)$. $x = -1$: $2 = 2A$, $A = 1$. $x = -3$: $-4 = -2B$, $B = 2$.
      c) $\tfrac{8}{8} = 1$ e $\tfrac{1}{2} + \tfrac{2}{4} = 1$.
    resposta: 'a) $(x + 1)(x + 3)$; b) $A = 1$, $B = 2$'

  - estilo: ITA
    enunciado: |
      Um polinômio $P$ satisfaz $P(x + 1) - P(x) = 2x + 1$ para todo $x$ e $P(0) = 0$. O valor de $P(10)$ é
    opcoes: ['$100$', '$110$', '$121$', '$90$', '$55$']
    correta: A
    espaco: 22
    resolucao: |
      $P(1) = P(0) + 1$, $P(2) = P(1) + 3$, ..., $P(10) = 1 + 3 + \dots + 19 = 100$. De fato, $P(x) = x^2$.
    resposta: 'A'

  - estilo: Unesp
    texto: |
      De uma folha de papelão de 20 cm por 30 cm, recortam-se quadrados de lado $x$ nos cantos e dobram-se as abas, formando uma caixa sem tampa.
    enunciado: ''
    itens:
    - 'Escreva o volume $V(x)$ como polinômio desenvolvido.'
    - 'Para quais valores de $x$ a caixa existe?'
    - 'Calcule $V(5)$ pelas duas formas (fatorada e desenvolvida).'
    espaco: 62
    resolucao: |
      a) $x(20 - 2x)(30 - 2x) = 4x^3 - 100x^2 + 600x$.
      b) $0 < x < 10$.
      c) $5 \cdot 10 \cdot 20 = 1000$; $500 - 2500 + 3000 = 1000$ cm³.
    resposta: 'a) $4x^3 - 100x^2 + 600x$; b) $0 < x < 10$; c) 1000 cm³'

  - estilo: UFSC
    enunciado: |
      Considere polinômios com coeficientes reais. Assinale o que for correto.
    proposicoes:
    - 'Se $P$ e $Q$ são não nulos, o grau de $P \cdot Q$ é a soma dos graus.'
    - '$x^2 + \frac{2}{x}$ não é polinômio.'
    - 'A soma dos coeficientes de $(x - 1)^{10}$ é 0.'
    - 'Se $P(a) = 0$, então $a$ é raiz de $P$.'
    - 'Dois polinômios de grau 2 que coincidem em dois valores de $x$ são idênticos.'
    - 'O termo independente de $(x + 2)^5$ é 32.'
    corretas: [1, 2, 3, 4, 6]
    espaco: 22
    resolucao: |
      01) Correta. 02) Correta. 04) $P(1) = 0$. 08) Definição. 16) Incorreta: $x^2$ e $2x^2 - 3x + 2$ coincidem em $x = 1$ e em $x = 2$, mas são diferentes. 32) $P(0) = 2^5$.
    resposta: 'Soma 47 (01 + 02 + 04 + 08 + 32)'

  - estilo: Fuvest
    enunciado: 'Considere $P(x) = (a^2 - 4)x^3 + (a + 2)x^2 + (a - 2)x + 1$, com $a$ real.'
    itens:
    - 'Para quais valores de $a$ o grau de $P$ é 3?'
    - 'Determine o grau de $P$ para $a = 2$ e para $a = -2$.'
    - 'Para quais valores de $a$ o número 1 é raiz de $P$?'
    espaco: 62
    resolucao: |
      a) $a^2 \ne 4$: $a \ne \pm 2$.
      b) $a = 2$: $4x^2 + 1$, grau 2. $a = -2$: $-4x + 1$, grau 1.
      c) $P(1) = a^2 - 4 + a + 2 + a - 2 + 1 = a^2 + 2a - 3 = 0$: $a = 1$ ou $a = -3$.
    resposta: 'a) $a \ne \pm 2$; b) 2 e 1; c) $a = 1$ ou $a = -3$'

  - estilo: Unicamp
    enunciado: 'Considere $P(x) = (x^2 - x - 1)^5$.'
    itens:
    - 'Calcule a soma dos coeficientes.'
    - 'Calcule $P(-1)$.'
    - 'Calcule a soma dos coeficientes de grau par e a dos de grau ímpar.'
    espaco: 62
    resolucao: |
      a) $P(1) = (-1)^5 = -1$.
      b) $(1 + 1 - 1)^5 = 1$.
      c) Pares: $\tfrac{-1 + 1}{2} = 0$; ímpares: $\tfrac{-1 - 1}{2} = -1$.
    resposta: 'a) $-1$; b) 1; c) 0 e $-1$'

  - estilo: Fuvest
    enunciado: |
      Se $x^3 + 1 \equiv (x + 1)(x^2 + ax + b)$, então $a + b$ vale
    opcoes: ['$2$', '$-2$', '$0$', '$1$', '$-1$']
    correta: C
    espaco: 22
    resolucao: |
      $x^3 + (a + 1)x^2 + (a + b)x + b$: $a = -1$, $b = 1$.
    resposta: 'C'

  - estilo: Unesp
    enunciado: 'Um polinômio $P$ de grau 2 satisfaz $P(1) = 2$, $P(2) = 5$ e $P(3) = 10$.'
    itens:
    - 'Escreva o sistema para os coeficientes de $P(x) = ax^2 + bx + c$.'
    - 'Resolva o sistema e escreva $P$.'
    - 'Calcule $P(10)$.'
    espaco: 62
    resolucao: |
      a) $a + b + c = 2$; $4a + 2b + c = 5$; $9a + 3b + c = 10$.
      b) Subtraindo: $3a + b = 3$ e $5a + b = 5$: $a = 1$, $b = 0$, $c = 1$. $P(x) = x^2 + 1$.
      c) $101$.
    resposta: 'b) $x^2 + 1$; c) 101'

  - estilo: Fuvest
    enunciado: 'Procura-se um polinômio $P$ de grau 2 com $P(0) = 0$ e $P(x) - P(x - 1) = x$ para todo $x$.'
    itens:
    - 'Escrevendo $P(x) = ax^2 + bx$, encontre $a$ e $b$.'
    - 'Prove que $P(n) = 1 + 2 + \dots + n$ para todo $n$ natural.'
    - 'Calcule $1 + 2 + \dots + 100$.'
    espaco: 62
    resolucao: |
      a) $P(x) - P(x - 1) = a(2x - 1) + b = 2ax - a + b \equiv x$: $a = \tfrac{1}{2}$, $b = \tfrac{1}{2}$. $P(x) = \tfrac{x^2 + x}{2}$.
      b) Somando $P(k) - P(k - 1) = k$ de $k = 1$ a $n$, os termos se cancelam: $P(n) - P(0) = 1 + \dots + n$.
      c) $P(100) = \tfrac{10\,100}{2} = 5050$.
    resposta: 'a) $\frac{1}{2}$ e $\frac{1}{2}$; c) 5050'
