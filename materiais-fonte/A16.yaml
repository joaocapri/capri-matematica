# Fonte das listas em PDF da aula A16 — Gráficos e Coeficientes
aula: A16

fixacao:
  intro: Resolva na ordem — do aquecimento ao desafio. O gráfico de $f(x)=ax+b$ é uma reta; $a>0$ sobe, $a<0$ desce, e $b$ marca onde ela corta o eixo $y$.
  secoes:
    - nome: Aquecimento
      questoes:
        - enunciado: Diga se cada função é crescente ou decrescente e em que ponto seu gráfico corta o eixo $y$.
          itens:
            - $f(x)=2x-3$
            - $f(x)=-x+4$
            - $f(x)=\tfrac12x$
          resolucao: |
            O sinal de $a$ decide o crescimento, e o eixo $y$ é cortado em $(0,b)$.
            (a) Crescente; $(0,-3)$. (b) Decrescente; $(0,4)$. (c) Crescente; $(0,0)$.
          resposta: '(a) cresc.; $(0,-3)$ \quad (b) decresc.; $(0,4)$ \quad (c) cresc.; $(0,0)$'

        - enunciado: Determine os pontos em que o gráfico de $f(x)=3x-6$ corta os eixos.
          resolucao: |
            Eixo $y$: $x=0\Rightarrow(0,-6)$. Eixo $x$: $3x-6=0\Rightarrow(2,0)$.
          resposta: '$(0,-6)$ e $(2,0)$'

        - enunciado: Calcule o coeficiente angular da reta que passa por $(1,\,2)$ e $(4,\,11)$.
          resolucao: |
            $a=\dfrac{\Delta y}{\Delta x}=\dfrac{11-2}{4-1}=3$.
          resposta: '$3$'

        - enunciado: Calcule os pontos do gráfico de $f(x)=-2x+4$ para $x=0,1,2,3$ e diga onde ele corta o eixo $x$.
          resolucao: |
            $(0,4)$, $(1,2)$, $(2,0)$ e $(3,-2)$. A reta corta o eixo $x$ em $(2,0)$.
          resposta: '$(0,4),(1,2),(2,0),(3,-2)$; raiz em $x=2$'

        - enunciado: Os pontos $A(1,5)$, $B(3,9)$ e $C(5,13)$ estão alinhados? Justifique.
          resolucao: |
            Inclinação de $AB$: $\tfrac{9-5}{3-1}=2$. Inclinação de $BC$: $\tfrac{13-9}{5-3}=2$.
            Mesma inclinação e um ponto comum: sim, estão alinhados.
          resposta: 'sim (inclinação $2$ nos dois trechos)'

        - enunciado: Determine a função afim cujo gráfico passa por $(0,\,2)$ e $(3,\,0)$.
          resolucao: |
            $b=2$ e $a=\dfrac{0-2}{3-0}=-\dfrac23$.
          resposta: '$f(x)=-\tfrac23x+2$'

        - enunciado: Dê os sinais de $a$ e $b$ para a reta $y=ax+b$ em cada caso.
          itens:
            - Crescente e corta o eixo $y$ acima da origem.
            - Decrescente e passa pela origem.
            - Decrescente e corta o eixo $y$ abaixo da origem.
          resolucao: |
            (a) $a>0$ e $b>0$. (b) $a<0$ e $b=0$. (c) $a<0$ e $b<0$.
          resposta: '(a) $a>0,\ b>0$ \quad (b) $a<0,\ b=0$ \quad (c) $a<0,\ b<0$'

    - nome: Treino
      questoes:
        - enunciado: Determine a reta paralela a $y=2x+1$ que passa pelo ponto $(3,\,4)$.
          resolucao: |
            Retas paralelas têm o mesmo coeficiente angular: $y=2x+b$. Então $4=6+b\Rightarrow b=-2$.
          resposta: '$y=2x-2$'

        - enunciado: Determine o ponto de interseção dos gráficos de $f(x)=x+3$ e $g(x)=-2x+9$.
          resolucao: |
            $x+3=-2x+9\Rightarrow 3x=6\Rightarrow x=2$, e $y=5$.
          resposta: '$(2,\,5)$'

        - enunciado: Calcule a área do triângulo formado pela reta $y=-2x+6$ e os eixos coordenados.
          resolucao: |
            A reta corta os eixos em $(3,0)$ e $(0,6)$. Área: $\dfrac{3\cdot6}2=9$.
          resposta: '$9$'

        - enunciado: Para quais valores de $k$ a função $f(x)=(2k-4)x+1$ é crescente?
          resolucao: |
            $2k-4>0\Rightarrow k>2$.
          resposta: '$k>2$'

        - enunciado: Determine a função afim cujo gráfico passa por $(2,\,1)$ e é paralelo ao gráfico de $y=-3x+5$.
          resolucao: |
            $a=-3$ e $1=-6+b\Rightarrow b=7$.
          resposta: '$f(x)=-3x+7$'

        - enunciado: Para qual valor de $m$ o gráfico de $f(x)=mx+3$ passa pelo ponto $(2,\,-1)$?
          resolucao: |
            $2m+3=-1\Rightarrow m=-2$.
          resposta: '$m=-2$'

        - enunciado: O gráfico de uma função afim passa por $(-1,\,4)$ e corta o eixo $x$ em $x=3$. Determine a função.
          resolucao: |
            Passa por $(-1,4)$ e $(3,0)$: $a=\dfrac{0-4}{3-(-1)}=-1$. Então $0=-3+b\Rightarrow b=3$.
          resposta: '$f(x)=-x+3$'

        - enunciado: 'Entre as retas $r_1:\,y=2x+1$, $r_2:\,y=-2x+1$, $r_3:\,y=2x-5$ e $r_4:\,y=\tfrac12x$, quais são paralelas?'
          resolucao: |
            Paralelas (distintas) têm o mesmo $a$ e $b$ diferentes: $r_1$ e $r_3$, com $a=2$.
          resposta: '$r_1$ e $r_3$'

    - nome: Desafio
      questoes:
        - enunciado: Calcule a área do triângulo formado pelas retas $y=x+2$, $y=-x+6$ e pelo eixo $x$.
          resolucao: |
            Eixo $x$: $y=x+2$ em $(-2,0)$ e $y=-x+6$ em $(6,0)$. Base: $8$.
            Interseção: $x+2=-x+6\Rightarrow x=2$, $y=4$. Altura: $4$. Área: $\tfrac{8\cdot4}2=16$.
          resposta: '$16$'

        - enunciado: Para qual valor de $k$ as retas $y=(k+1)x+2$ e $y=3x-1$ são paralelas?
          resolucao: |
            $k+1=3\Rightarrow k=2$ (os coeficientes lineares $2$ e $-1$ já são diferentes).
          resposta: '$k=2$'

        - enunciado: O gráfico de $f(x)=ax+b$ passa por $(2,\,5)$ e $(6,\,-3)$. Determine os pontos em que ele corta os eixos e a área do triângulo que forma com eles.
          resolucao: |
            $a=\dfrac{-3-5}{6-2}=-2$ e $5=-4+b\Rightarrow b=9$: $f(x)=-2x+9$.
            Cortes: $(0,9)$ e $(4{,}5;\,0)$. Área: $\dfrac{9\cdot4{,}5}2=20{,}25$.
          resposta: '$(0,9)$ e $(4{,}5;\,0)$; área $20{,}25$'

        - enunciado: Calcule a área do triângulo formado pelas retas $y=2x$, $y=-x+6$ e $y=0$.
          resolucao: |
            $y=2x$ e $y=-x+6$ se cortam em $(2,4)$. No eixo $x$: $(0,0)$ e $(6,0)$.
            Base $6$, altura $4$: área $12$.
          resposta: '$12$'

        - enunciado: Determine $k$ para que os pontos $(1,\,2)$, $(3,\,k)$ e $(6,\,12)$ estejam alinhados.
          resolucao: |
            Inclinação de $(1,2)$ a $(6,12)$: $\tfrac{10}5=2$. De $x=1$ a $x=3$: $k=2+2\cdot2=6$.
          resposta: '$k=6$'

vestibular:
  intro: Questões autorais no estilo dos principais vestibulares. Assinale uma única alternativa.
  questoes:
    - enunciado: O gráfico de $f(x)=-3x+6$ corta o eixo das abscissas no ponto
      opcoes: ['$(2,\,0)$', '$(0,\,6)$', '$(-2,\,0)$', '$(6,\,0)$', '$(0,\,2)$']
      correta: A
      resolucao: |
        $-3x+6=0\Rightarrow x=2$. O ponto $(0,6)$ é o corte com o eixo $y$.

    - enunciado: O coeficiente angular da reta que passa por $(-1,\,3)$ e $(2,\,12)$ é
      opcoes: ['$-3$', '$1$', '$3$', '$4$', '$9$']
      correta: C
      resolucao: |
        $\dfrac{12-3}{2-(-1)}=\dfrac93=3$.

    - enunciado: Se o gráfico de $f(x)=ax+b$ é uma reta decrescente que corta o eixo $y$ abaixo da origem, então
      opcoes: ['$a>0$ e $b>0$', '$a<0$ e $b<0$', '$a>0$ e $b<0$', '$a<0$ e $b>0$', '$a=0$ e $b<0$']
      correta: B
      resolucao: |
        Decrescente: $a<0$. Corta o eixo $y$ em $(0,b)$, abaixo da origem: $b<0$.

    - enunciado: As retas $y=2x-1$ e $y=-x+8$ se cortam no ponto
      opcoes: ['$(5,\,3)$', '$(3,\,-5)$', '$(-3,\,5)$', '$(3,\,5)$', '$(2,\,3)$']
      correta: D
      resolucao: |
        $2x-1=-x+8\Rightarrow x=3$ e $y=5$.

    - enunciado: A área do triângulo formado pela reta $y=-\tfrac x2+4$ e pelos eixos coordenados é
      opcoes: ['$4$', '$8$', '$12$', '$14$', '$16$']
      correta: E
      resolucao: |
        Cortes: $(0,4)$ e $(8,0)$. Área: $\tfrac{8\cdot4}2=16$.

    - enunciado: A reta paralela a $y=4x-1$ que passa pelo ponto $(1,\,6)$ tem equação
      opcoes: ['$y=4x+1$', '$y=4x+2$', '$y=-4x+10$', '$y=4x+6$', '$y=2x+4$']
      correta: B
      resolucao: |
        Mesmo coeficiente angular: $y=4x+b$, com $6=4+b\Rightarrow b=2$.

    - enunciado: A função $f(x)=(3-m)x+2$ é crescente se, e somente se,
      opcoes: ['$m>3$', '$m=3$', '$m<3$', '$m>-3$', '$m<-3$']
      correta: C
      resolucao: |
        $3-m>0\Rightarrow m<3$.

    - enunciado: Os pontos $(0,\,1)$, $(2,\,k)$ e $(4,\,9)$ estão alinhados. O valor de $k$ é
      opcoes: ['$5$', '$6$', '$7$', '$8$', '$9$']
      correta: A
      resolucao: |
        Inclinação: $\tfrac{9-1}{4}=2$. Em $x=2$: $1+2\cdot2=5$ (é o ponto médio).

    - enunciado: O gráfico de uma função linear passa pelo ponto $(3,\,-6)$. O valor de $f(-4)$ é
      opcoes: ['$-8$', '$-2$', '$2$', '$4$', '$8$']
      correta: E
      resolucao: |
        Linear: $f(x)=ax$, com $3a=-6\Rightarrow a=-2$. Então $f(-4)=8$.

    - enunciado: O plano A de uma operadora custa $30+0{,}5x$ reais e o plano B custa $50+0{,}3x$ reais, em que $x$ é o número de minutos. Os gráficos dos dois custos se cortam no ponto
      opcoes: ['$(40,\,50)$', '$(80,\,100)$', '$(50,\,55)$', '$(100,\,80)$', '$(100,\,60)$']
      correta: D
      resolucao: |
        $30+0{,}5x=50+0{,}3x\Rightarrow 0{,}2x=20\Rightarrow x=100$. Custo: $30+50=80$.

    - enunciado: Uma função afim decrescente tem $f(0)=4$ e raiz $x=2$. Seu coeficiente angular é
      opcoes: ['$-4$', '$-2$', '$-\dfrac12$', '$\dfrac12$', '$2$']
      correta: B
      resolucao: |
        A reta passa por $(0,4)$ e $(2,0)$: $a=\dfrac{0-4}{2-0}=-2$.

    - enunciado: A reta que passa por $(1,\,1)$ e $(3,\,7)$ corta o eixo $x$ no ponto de abscissa
      opcoes: ['$-2$', '$-\dfrac23$', '$\dfrac13$', '$\dfrac23$', '$2$']
      correta: D
      resolucao: |
        $a=3$ e $y=3x-2$. Raiz: $3x-2=0\Rightarrow x=\tfrac23$.

    - enunciado: A área do triângulo formado pelas retas $y=x$, $y=-x+4$ e pelo eixo $x$ é
      opcoes: ['$2$', '$3$', '$4$', '$6$', '$8$']
      correta: C
      resolucao: |
        As retas se cortam em $(2,2)$. No eixo $x$: $(0,0)$ e $(4,0)$. Base $4$, altura $2$: área $4$.

    - enunciado: A reta $y=(2k-1)x+3$ é paralela à reta $y=5x$ quando $k$ vale
      opcoes: ['$3$', '$4$', '$5$', '$6$', '$9$']
      correta: A
      resolucao: |
        $2k-1=5\Rightarrow k=3$.

    - enunciado: O custo total de produção de $x$ unidades de um produto é $C(x)=12x+30$, em reais. No gráfico de $C$, o coeficiente linear $30$ representa
      opcoes: ['o preço de cada unidade', 'a quantidade produzida', 'o lucro da empresa', 'a receita total', 'o custo fixo']
      correta: E
      resolucao: |
        É o valor de $C(0)$: o custo mesmo sem produzir nada, ou seja, o custo fixo. O $12$ é o custo por unidade.

    - enunciado: A reta $r$ passa por $(0,\,2)$ e $(2,\,0)$, e a reta $s$ passa por $(0,\,-1)$ e $(1,\,1)$. As retas se cortam em
      opcoes: ['$(0,\,2)$', '$(2,\,0)$', '$(1,\,1)$', '$(-1,\,3)$', '$(1,\,-1)$']
      correta: C
      resolucao: |
        $r:\ y=-x+2$ e $s:\ y=2x-1$. Igualando: $3x=3\Rightarrow x=1$, $y=1$.

    - enunciado: As retas $y=3x+1$ e $y=3x-4$ são
      opcoes: ['concorrentes', 'paralelas distintas', 'coincidentes', 'perpendiculares', 'concorrentes no ponto $(0,\,1)$']
      correta: B
      resolucao: |
        Mesmo coeficiente angular ($3$) e coeficientes lineares diferentes: paralelas distintas.

    - enunciado: A reta que passa por $(2,\,3)$ e corta o eixo $y$ no ponto $(0,\,7)$ corta o eixo $x$ no ponto de abscissa
      opcoes: ['$3{,}5$', '$4$', '$5$', '$7$', '$14$']
      correta: A
      resolucao: |
        $a=\tfrac{3-7}{2-0}=-2$ e $y=-2x+7$. Raiz: $x=3{,}5$.

    - enunciado: O gráfico de $g$ é obtido deslocando o gráfico de $f(x)=2x$ três unidades para cima. A raiz de $g$ é
      opcoes: ['$\dfrac32$', '$3$', '$-3$', '$0$', '$-\dfrac32$']
      correta: E
      resolucao: |
        $g(x)=2x+3$. Raiz: $2x+3=0\Rightarrow x=-\tfrac32$.

    - enunciado: Sejam $A(0,\,0)$, $B(4,\,0)$ e $C$ o ponto de interseção das retas $y=2x$ e $y=-x+6$. A área do triângulo $ABC$ é
      opcoes: ['$4$', '$6$', '$7$', '$8$', '$12$']
      correta: D
      resolucao: |
        $2x=-x+6\Rightarrow C=(2,4)$. Base $AB=4$, altura $4$: área $8$.
