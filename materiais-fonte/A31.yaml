# A31 — Equações Logarítmicas
aula: A31

fixacao:
  intro: Resolva na ordem — do aquecimento ao desafio. Antes de tudo, escreva as condições de existência; no final, descarte as soluções que não as cumprem.
  secoes:
    - nome: Aquecimento
      questoes:
        - enunciado: Resolva.
          itens:
            - $\log_2(x+3)=4$
            - $\log_3(2x-1)=2$
          resolucao: |
            (a) $x+3=2^4=16\Rightarrow x=13$. (b) $2x-1=9\Rightarrow x=5$. Ambos deixam o logaritmando positivo.
          resposta: '(a) $13$ \quad (b) $5$'

        - enunciado: Resolva $\log(x^2)=2$.
          resolucao: |
            $x^2=100\Rightarrow x=\pm10$. Os dois servem, pois $x^2>0$.
          resposta: '$\{-10,\,10\}$'

        - enunciado: Resolva $\log_x 16=2$.
          resolucao: |
            $x^2=16$, com $x>0$ e $x\neq1$: $x=4$ (o $-4$ não serve como base).
          resposta: '$x=4$'

        - enunciado: Resolva $\log_5(x^2-4x)=1$.
          resolucao: |
            $x^2-4x=5\Rightarrow x=5$ ou $x=-1$. Em ambos, $x^2-4x=5>0$: as duas servem.
          resposta: '$\{-1,\,5\}$'

        - enunciado: Resolva $\log(x+2)=\log(2x-3)$.
          resolucao: |
            Condições: $x>\tfrac32$. \ $x+2=2x-3\Rightarrow x=5$, que serve.
          resposta: '$x=5$'

        - enunciado: Resolva $\log_2(x-1)+\log_2(x+1)=3$.
          resolucao: |
            Condição: $x>1$. \ $(x-1)(x+1)=8\Rightarrow x^2=9\Rightarrow x=\pm3$. Só $x=3$ serve.
          resposta: '$x=3$'

        - enunciado: Resolva $\log_3(\log_2 x)=1$.
          resolucao: |
            $\log_2 x=3\Rightarrow x=8$.
          resposta: '$x=8$'

    - nome: Treino
      questoes:
        - enunciado: Resolva $\log_3 x+\log_3(x-8)=2$.
          resolucao: |
            Condição: $x>8$. \ $x(x-8)=9\Rightarrow x^2-8x-9=0\Rightarrow x=9$ ou $x=-1$. Só $x=9$ serve.
          resposta: '$x=9$'

        - enunciado: Resolva $(\log_2 x)^2-3\log_2 x+2=0$.
          resolucao: |
            Com $t=\log_2 x$: $t^2-3t+2=0\Rightarrow t=1$ ou $t=2$. Então $x=2$ ou $x=4$.
          resposta: '$\{2,\,4\}$'

        - enunciado: Resolva $\log_2(x+1)-\log_2(x-2)=2$.
          resolucao: |
            Condição: $x>2$. \ $\dfrac{x+1}{x-2}=4\Rightarrow x+1=4x-8\Rightarrow x=3$.
          resposta: '$x=3$'

        - enunciado: Resolva $\log x+\log(x-21)=2$.
          resolucao: |
            Condição: $x>21$. \ $x^2-21x-100=0\Rightarrow x=25$ ou $x=-4$. Só $x=25$ serve.
          resposta: '$x=25$'

        - enunciado: Resolva $\log_2(x^2-x)=1$.
          resolucao: |
            $x^2-x=2\Rightarrow x=2$ ou $x=-1$. Nos dois casos, $x^2-x=2>0$.
          resposta: '$\{-1,\,2\}$'

        - enunciado: Resolva $2\log x=\log(3x+4)$.
          resolucao: |
            Condições: $x>0$. \ $\log x^2=\log(3x+4)\Rightarrow x^2-3x-4=0\Rightarrow x=4$ ou $x=-1$. Só $x=4$ serve.
          resposta: '$x=4$'

        - enunciado: Resolva $\log_x(3x-2)=2$.
          resolucao: |
            $x^2=3x-2\Rightarrow x=1$ ou $x=2$. Como a base não pode ser $1$, fica $x=2$.
          resposta: '$x=2$'

        - enunciado: Resolva $\log_2 x+\log_4 x=6$.
          resolucao: |
            $\log_4 x=\tfrac12\log_2 x$: $\tfrac32\log_2 x=6\Rightarrow\log_2 x=4\Rightarrow x=16$.
          resposta: '$x=16$'

    - nome: Desafio
      questoes:
        - enunciado: Resolva $(\log x)^2-\log x^2=3$.
          resolucao: |
            $\log x^2=2\log x$. Com $t=\log x$: $t^2-2t-3=0\Rightarrow t=3$ ou $t=-1$. Então $x=1000$ ou $x=\tfrac1{10}$.
          resposta: '$\left\{\tfrac1{10},\,1000\right\}$'

        - enunciado: Resolva $\log_2 x+\log_4 x+\log_{16}x=7$.
          resolucao: |
            Tudo na base $2$: $\left(1+\tfrac12+\tfrac14\right)\log_2 x=7\Rightarrow\tfrac74\log_2 x=7\Rightarrow\log_2 x=4$.
          resposta: '$x=16$'

        - enunciado: Resolva $x^{\log x}=10\,000$.
          resolucao: |
            Aplicando $\log$ dos dois lados: $(\log x)^2=4\Rightarrow\log x=\pm2\Rightarrow x=100$ ou $x=\tfrac1{100}$.
          resposta: '$\left\{\tfrac1{100},\,100\right\}$'

        - enunciado: Resolva $2^x=5$ usando $\log2=0{,}301$.
          resolucao: |
            $x=\log_2 5=\dfrac{\log5}{\log2}=\dfrac{0{,}699}{0{,}301}\approx2{,}32$.
          resposta: '$x\approx2{,}32$'

        - enunciado: Resolva $\log_2(4^x-12)=x$.
          resolucao: |
            $4^x-12=2^x$. Com $t=2^x>0$: $t^2-t-12=0\Rightarrow t=4$ (ou $-3$, descartado). Então $x=2$, e $16-12=4>0$.
          resposta: '$x=2$'

vestibular:
  intro: Questões autorais no estilo dos principais vestibulares. Quando necessário, use $\log2=0{,}301$, $\log3=0{,}477$ e $\log7=0{,}845$.
  questoes:
    - enunciado: A solução de $\log_2(x-1)=3$ é
      opcoes: ['$7$', '$8$', '$9$', '$10$', '$4$']
      correta: C
      resolucao: |
        $x-1=8\Rightarrow x=9$.

    - enunciado: A solução de $\log_3(x+1)+\log_3(x-1)=1$ é
      opcoes: ['$2$', '$-2$ e $2$', '$\sqrt3$', '$4$', '$3$']
      correta: A
      resolucao: |
        $x^2-1=3\Rightarrow x=\pm2$; só $x=2$ satisfaz $x>1$.

    - enunciado: A soma das soluções de $\log(x^2-15)=1$ é
      opcoes: ['$10$', '$5$', '$25$', '$-5$', '$0$']
      correta: E
      resolucao: |
        $x^2=25\Rightarrow x=\pm5$; ambas servem ($x^2-15=10>0$). Soma: $0$.

    - enunciado: A solução de $\log_2 x+\log_2(x+2)=3$ é
      opcoes: ['$-4$', '$2$', '$4$', '$-4$ e $2$', '$6$']
      correta: B
      resolucao: |
        $x^2+2x-8=0\Rightarrow x=2$ ou $x=-4$; só $x=2$ serve.

    - enunciado: A solução de $\log_x 27=3$ é
      opcoes: ['$9$', '$3$', '$-3$', '$81$', '$\dfrac13$']
      correta: B
      resolucao: |
        $x^3=27\Rightarrow x=3$.

    - enunciado: A soma das soluções de $(\log_3 x)^2-5\log_3 x+6=0$ é
      opcoes: ['$5$', '$6$', '$12$', '$36$', '$243$']
      correta: D
      resolucao: |
        $\log_3 x=2$ ou $3$: $x=9$ ou $x=27$. Soma: $36$. (A alternativa A soma os logaritmos.)

    - enunciado: A solução de $\log(x+7)-\log(x-2)=1$ é
      opcoes: ['$1$', '$2$', '$3$', '$4$', '$5$']
      correta: C
      resolucao: |
        $x+7=10(x-2)\Rightarrow 9x=27\Rightarrow x=3$.

    - enunciado: O produto das soluções de $\log_5(x^2-2x)=\log_5 3$ é
      opcoes: ['$-3$', '$3$', '$-1$', '$2$', '$-2$']
      correta: A
      resolucao: |
        $x^2-2x-3=0\Rightarrow x=3$ ou $x=-1$; ambos dão $x^2-2x=3>0$. Produto: $-3$.

    - enunciado: A solução de $2\log_2 x=\log_2(x+6)$ é
      opcoes: ['$-2$', '$-2$ e $3$', '$2$', '$6$', '$3$']
      correta: E
      resolucao: |
        $x^2=x+6\Rightarrow x=3$ ou $x=-2$; só $x=3$ satisfaz $x>0$.

    - enunciado: A solução de $\log_2(\log_3 x)=1$ é
      opcoes: ['$3$', '$6$', '$8$', '$9$', '$27$']
      correta: D
      resolucao: |
        $\log_3 x=2\Rightarrow x=9$.

    - enunciado: A solução de $\log_x(x+6)=2$ é
      opcoes: ['$-2$', '$2$', '$6$', '$-2$ e $3$', '$3$']
      correta: E
      resolucao: |
        $x^2=x+6\Rightarrow x=3$ ou $x=-2$; a base deve ser positiva: $x=3$.

    - enunciado: A soma das soluções de $(\log x)^2=\log x^2$ é
      opcoes: ['$2$', '$101$', '$100$', '$10$', '$110$']
      correta: B
      resolucao: |
        $t^2=2t\Rightarrow t=0$ ou $t=2$: $x=1$ ou $x=100$. Soma: $101$.

    - enunciado: A solução de $\log_2 x+\log_4 x=3$ é
      opcoes: ['$2$', '$4$', '$8$', '$16$', '$\sqrt2$']
      correta: B
      resolucao: |
        $\tfrac32\log_2 x=3\Rightarrow\log_2 x=2\Rightarrow x=4$.

    - enunciado: A solução de $3^x=7$ é, aproximadamente,
      opcoes: ['$1{,}77$', '$2{,}33$', '$0{,}57$', '$1{,}43$', '$2{,}10$']
      correta: A
      resolucao: |
        $x=\dfrac{\log7}{\log3}=\dfrac{0{,}845}{0{,}477}\approx1{,}77$.

    - enunciado: A solução de $\log(2x)+\log(x-3)=\log20$ é
      opcoes: ['$-2$', '$2$', '$5$', '$10$', '$-2$ e $5$']
      correta: C
      resolucao: |
        $2x(x-3)=20\Rightarrow x^2-3x-10=0\Rightarrow x=5$ ou $x=-2$; só $x=5$ serve.

    - enunciado: A solução de $\log_2(x+4)-\log_2 x=2$ é
      opcoes: ['$\dfrac43$', '$4$', '$\dfrac34$', '$2$', '$\dfrac12$']
      correta: A
      resolucao: |
        $x+4=4x\Rightarrow x=\tfrac43$.

    - enunciado: Uma população cresce $5\%$ ao ano, ou seja, $P(t)=P_0\cdot1{,}05^t$. Usando $\log1{,}05\approx0{,}0212$, ela dobrará em aproximadamente
      opcoes: ['$10$ anos', '$12{,}5$ anos', '$14{,}2$ anos', '$20$ anos', '$40$ anos']
      correta: C
      resolucao: |
        $t=\dfrac{\log2}{\log1{,}05}\approx\dfrac{0{,}301}{0{,}0212}\approx14{,}2$. (A alternativa D seria com crescimento linear.)

    - enunciado: A solução de $\log_3 x+\log_3 9=5$ é
      opcoes: ['$3$', '$9$', '$81$', '$27$', '$243$']
      correta: D
      resolucao: |
        $\log_3 x+2=5\Rightarrow\log_3 x=3\Rightarrow x=27$.

    - enunciado: A solução de $\log_{1/2}(x-1)=-3$ é
      opcoes: ['$7$', '$\dfrac98$', '$-7$', '$\dfrac78$', '$9$']
      correta: E
      resolucao: |
        $x-1=\left(\tfrac12\right)^{-3}=8\Rightarrow x=9$.

    - enunciado: A solução de $\log_2(4^x-12)=x$ é
      opcoes: ['$1$', '$3$', '$4$', '$2$', '$12$']
      correta: D
      resolucao: |
        $4^x-12=2^x$. Com $t=2^x$: $t^2-t-12=0\Rightarrow t=4\Rightarrow x=2$.
