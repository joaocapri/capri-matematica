# Aula 3.9.1 — Geometria analítica: retas paralelas e concorrentes
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: posição relativa de duas retas (concorrentes, paralelas distintas, coincidentes) pelos coeficientes;
# ponto de interseção (sistema); reta paralela por um ponto; retas com parâmetro; triângulos formados por retas.
# Perpendicularismo (3.9.2), ângulo entre retas (3.9.3) e distância de ponto a reta (3.9.4) ficam para outras aulas.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Compare as retas $r$: $y = 2x + 1$ e $s$: $y = 2x - 3$, completando.'
      itens:
      - '$m_r = {{2}}$ e $m_s = {{2}}$'
      - '$n_r = {{1}}$ e $n_s = {{-3}}$'
      - 'Então $r$ e $s$ são {{paralelas distintas}}.'
      resolucao: |
        Mesmo coeficiente angular e coeficientes lineares diferentes: as retas têm a mesma inclinação e cortam o eixo $y$ em pontos diferentes.
      resposta: '$2$ e $2$; $1$ e $-3$; paralelas distintas'
    - enunciado: 'Complete o quadro com a posição relativa de cada par de retas $r$ e $s$: C (concorrentes), P (paralelas distintas) ou I (coincidentes).'
      tabela:
        cabecalho: ['$r$', '$s$', 'Posição']
        linhas:
        - ['$y = 4x - 1$', '$y = -x + 4$', '{{C}}']
        - ['$y = -3x + 2$', '$6x + 2y - 4 = 0$', '{{I}}']
        - ['$x - 2y + 1 = 0$', '$y = \frac{x}{2} + 5$', '{{P}}']
        - ['$x = 3$', '$y = 3$', '{{C}}']
      resolucao: |
        1º: $4 \neq -1$. 2º: $2y = -6x + 4$, $y = -3x + 2$, a mesma reta. 3º: $y = \tfrac{x}{2} + \tfrac{1}{2}$: mesmo $m$, $n$ diferente. 4º: uma vertical e uma horizontal se cortam em $(3, 3)$.
      resposta: 'C, I, P, C'
    - enunciado: 'Determine o ponto de interseção das retas.'
      itens:
      - '$y = 3x - 2$ e $y = -2x + 8$'
      - '$2x + y = 7$ e $x - y = -1$'
      espaco_item: 14
      resolucao: |
        (a) $3x - 2 = -2x + 8$: $x = 2$ e $y = 4$. Ponto $(2, 4)$.
        (b) Somando: $3x = 6$, $x = 2$ e $y = 3$. Ponto $(2, 3)$.
      resposta: '(a) $(2, 4)$ (b) $(2, 3)$'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Duas retas com o mesmo coeficiente linear são paralelas.'
      - 'Retas paralelas distintas não têm ponto comum.'
      - 'Duas retas verticais distintas são paralelas.'
      - 'Se o sistema formado pelas equações de duas retas é possível e determinado, as retas são concorrentes.'
      justificar: true
      espaco: 20
      resolucao: |
        (F) Elas se cortam no eixo $y$, em $(0, n)$; paralelas têm o mesmo coeficiente angular. (V)
        (V) $x = a$ e $x = b$, com $a \neq b$, nunca se cortam. (V) Solução única é um único ponto comum.
      resposta: F, V, V, V
    - enunciado: 'Escreva a equação da reta que passa pelo ponto dado e é paralela à reta dada.'
      itens:
      - 'Ponto $(1, 2)$; reta $y = 4x - 3$.'
      - 'Ponto $(0, -2)$; reta $3x - y + 5 = 0$.'
      - 'Ponto $(5, -1)$; eixo $x$.'
      espaco_item: 10
      resolucao: |
        A paralela tem o mesmo coeficiente angular. (a) $y - 2 = 4(x - 1)$, $y = 4x - 2$. (b) $m = 3$: $y = 3x - 2$. (c) $y = -1$.
      resposta: '(a) $y = 4x - 2$ (b) $y = 3x - 2$ (c) $y = -1$'
    - enunciado: 'Associe cada par de retas à sua posição relativa (uma posição pode ser usada mais de uma vez).'
      esquerda:
      - 'concorrentes'
      - 'paralelas distintas'
      - 'coincidentes'
      direita:
      - '$y = x + 1$ e $y = -x + 1$'
      - '$y = 5x$ e $y = 5x - 5$'
      - '$x + y = 4$ e $3x + 3y = 12$'
      - '$2x - y = 0$ e $4x - 2y = 1$'
      - '$y = 7$ e $x = -2$'
      resolucao: |
        1º: $m$ diferentes. 2º: mesmo $m$, $n$ diferente. 3º: a 2ª é o triplo da 1ª. 4º: $y = 2x$ e $y = 2x - \tfrac{1}{2}$. 5º: horizontal e vertical.
      resposta: 'De cima para baixo: 1, 2, 3, 2, 1'
    - enunciado: 'Em que ponto a reta $y = -2x + 6$ corta a reta $y = x$?'
      espaco: 12
      resolucao: |
        $x = -2x + 6$: $x = 2$. Ponto $(2, 2)$.
      resposta: '$(2, 2)$'
  - nome: Nível 2
    questoes:
    - texto: |
        Bia disse que as retas $y = 3x + 2$ e $y = -x + 2$ são paralelas, “porque as duas têm o número 2”.
      enunciado: 'Corrija Bia.'
      espaco: 12
      resolucao: |
        O 2 é o coeficiente linear: as duas cortam o eixo $y$ no mesmo ponto, $(0, 2)$. Como os coeficientes angulares são diferentes (3 e $-1$), elas são concorrentes, justamente em $(0, 2)$.
      resposta: 'Concorrentes em $(0, 2)$'
    - enunciado: 'Determine $k$ para que a reta $y = (k - 1)x + 3$ seja paralela à reta $y = 5x - 2$. Elas podem ser coincidentes?'
      espaco: 12
      resolucao: |
        Paralelas: $k - 1 = 5$, $k = 6$. Não podem coincidir, porque os coeficientes lineares (3 e $-2$) são diferentes.
      resposta: '$k = 6$; não'
    - enunciado: 'Considere as retas $r$: $kx + 2y - 4 = 0$ e $s$: $3x + y + 1 = 0$. Para que valores de $k$ elas são paralelas? E concorrentes?'
      espaco: 14
      resolucao: |
        $m_r = -\tfrac{k}{2}$ e $m_s = -3$. Paralelas: $k = 6$ (e são distintas: $3x + y - 2 = 0$ e $3x + y + 1 = 0$). Concorrentes: $k \neq 6$.
      resposta: 'Paralelas para $k = 6$; concorrentes para $k \neq 6$'
    - enunciado: 'As retas $r$: $y = x$, $s$: $y = -x + 6$ e $t$: $y = 0$ formam um triângulo.'
      itens:
      - 'Determine os vértices do triângulo.'
      - 'Calcule a sua área.'
      espaco_item: 12
      resolucao: |
        (a) $r \cap t$: $(0, 0)$. $s \cap t$: $(6, 0)$. $r \cap s$: $x = -x + 6$, $(3, 3)$.
        (b) Base 6 e altura 3: área 9.
      resposta: '(a) $(0, 0)$, $(6, 0)$, $(3, 3)$ (b) $9$'
    - enunciado: 'Os pontos $A(0, 0)$, $B(4, 1)$ e $D(1, 3)$ são vértices do paralelogramo $ABCD$. Escreva a reta por $B$ paralela a $AD$ e a reta por $D$ paralela a $AB$, e determine $C$ como a interseção delas.'
      espaco: 20
      resolucao: |
        $m_{AD} = 3$: por $B$, $y - 1 = 3(x - 4)$, $y = 3x - 11$. $m_{AB} = \tfrac{1}{4}$: por $D$, $y - 3 = \tfrac{1}{4}(x - 1)$.
        Igualando: $3x - 11 = 3 + \tfrac{x - 1}{4}$, $12x - 44 = 11 + x$, $x = 5$ e $y = 4$. $C(5, 4)$. (Confere: $B + D - A = (5, 4)$.)
      resposta: '$C(5, 4)$'
    - enunciado: 'Complete o quadro com o ponto em que cada reta corta a reta $y = 2x - 1$.'
      tabela:
        cabecalho: ['Reta', 'Interseção']
        linhas:
        - ['$y = 5$', '$({{3}}, {{5}})$']
        - ['$x = -1$', '$({{-1}}, {{-3}})$']
        - ['$y = -x + 2$', '$({{1}}, {{1}})$']
        - ['$x + y = 8$', '$({{3}}, {{5}})$']
      resolucao: |
        $2x - 1 = 5$: $x = 3$. $x = -1$: $y = -3$. $2x - 1 = -x + 2$: $x = 1$. $x + 2x - 1 = 8$: $x = 3$.
      resposta: '$(3, 5)$, $(-1, -3)$, $(1, 1)$, $(3, 5)$'
    - enunciado: 'Duas empresas de táxi cobram, por uma corrida de $d$ km, os preços $p_A = 2d + 5$ e $p_B = 1{,}5d + 8$, em reais.'
      itens:
      - 'Para que distância os preços são iguais? Qual é esse preço?'
      - 'Qual empresa é mais barata numa corrida de 10 km?'
      espaco_item: 12
      resolucao: |
        (a) $2d + 5 = 1{,}5d + 8$: $d = 6$ km, com preço R\$\,17,00 (o ponto de interseção das retas).
        (b) $p_A = 25$ e $p_B = 23$: a empresa B. Depois de 6 km, a reta de B (menos inclinada) fica abaixo da de A.
      resposta: '(a) 6 km, R\$\,17,00 (b) B'
    - enunciado: 'Determine $k$ para que as retas $x + y = 4$, $x - y = 2$ e $kx + y = 7$ passem por um mesmo ponto.'
      espaco: 12
      resolucao: |
        As duas primeiras se cortam em $(3, 1)$. A terceira passa por ele se $3k + 1 = 7$: $k = 2$.
      resposta: '$k = 2$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Discuta a posição relativa das retas $r$: $ax + 2y = 4$ e $s$: $2x + ay = 4$ conforme o valor real de $a$.'
      espaco: 20
      resolucao: |
        O sistema tem determinante $a^2 - 4$. Se $a \neq \pm 2$: concorrentes.
        $a = 2$: $x + y = 2$ nas duas, coincidentes. $a = -2$: $-x + y = 2$ e $x - y = 2$, isto é, $-x + y = -2$: paralelas distintas.
      resposta: '$a \neq \pm 2$: concorrentes; $a = 2$: coincidentes; $a = -2$: paralelas distintas'
    - enunciado: 'Determine as retas paralelas a $2x - y + 3 = 0$ que formam com os eixos um triângulo de área 4.'
      espaco: 18
      resolucao: |
        Paralelas: $2x - y + c = 0$. Cortam os eixos em $\left(-\tfrac{c}{2}, 0\right)$ e $(0, c)$. Área $\tfrac{1}{2} \cdot \tfrac{|c|}{2} \cdot |c| = \tfrac{c^2}{4} = 4$: $c = \pm 4$.
        Retas: $2x - y + 4 = 0$ e $2x - y - 4 = 0$.
      resposta: '$2x - y + 4 = 0$ e $2x - y - 4 = 0$'
    - enunciado: 'Considere o quadrilátero de vértices $A(0, 0)$, $B(6, 0)$, $C(5, 3)$ e $D(1, 3)$.'
      itens:
      - 'Mostre que $AB$ e $DC$ são paralelos e que $AD$ e $BC$ não são. Que quadrilátero é esse?'
      - 'Calcule a sua área.'
      espaco_item: 14
      resolucao: |
        (a) $AB$ e $DC$ são horizontais ($m = 0$). $m_{AD} = 3$ e $m_{BC} = \tfrac{3}{-1} = -3$: não paralelos. É um trapézio (isósceles, pois $AD = BC = \sqrt{10}$).
        (b) Bases 6 e 4, altura 3: $\tfrac{(6 + 4) \cdot 3}{2} = 15$.
      resposta: '(a) trapézio (b) $15$'
    - enunciado: 'No triângulo de vértices $A(0, 0)$, $B(8, 0)$ e $C(2, 6)$, sejam $M$ e $N$ os pontos médios de $AC$ e $BC$. Mostre que $MN$ é paralelo a $AB$ e mede a metade de $AB$.'
      espaco: 16
      resolucao: |
        $M(1, 3)$ e $N(5, 3)$. $MN$ é horizontal, como $AB$: são paralelos. $MN = 4 = \tfrac{8}{2}$.
      resposta: 'Ver resolução'
    - enunciado: 'Para que valores de $n$ a reta $y = 2x + n$ corta o segmento de extremos $(0, 0)$ e $(4, 0)$?'
      espaco: 16
      resolucao: |
        A reta corta o eixo $x$ em $x = -\tfrac{n}{2}$. É preciso $0 \le -\tfrac{n}{2} \le 4$, isto é, $-8 \le n \le 0$.
      resposta: '$-8 \le n \le 0$'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      No mapa de um bairro, com eixos em centenas de metros, duas ruas retas estão representadas pelas retas da figura, de equações $y = \frac{x}{2} + 1$ (rua A) e $y = -x + 7$ (rua B). A prefeitura vai instalar um semáforo no cruzamento das duas ruas.
    figura:
      tikz: |
        \begin{scope}[scale=.5]
        \draw[step=1, gray!25, very thin] (0,0) grid (8,8);
        \draw[-latex, ink!60] (-0.3,0) -- (8.4,0) node[right, font=\scriptsize] {$x$};
        \draw[-latex, ink!60] (0,-0.3) -- (0,8.4) node[above, font=\scriptsize] {$y$};
        \draw[roxo, line width=1pt] (0,1) -- (8,5) node[right, font=\scriptsize] {A};
        \draw[ink, line width=1pt] (0,7) -- (7,0) node[below, font=\scriptsize] {B};
        \end{scope}
    enunciado: |
      As coordenadas do semáforo são
    opcoes: ['$(3, 4)$', '$(2, 5)$', '$(6, 1)$', '$(4, 3)$', '$(4, 4)$']
    correta: D
    resolucao: |
      $\tfrac{x}{2} + 1 = -x + 7$: $\tfrac{3x}{2} = 6$, $x = 4$ e $y = 3$.

  - estilo: Fuvest
    enunciado: |
      As retas $y = 2x - 1$ e $4x - 2y + 3 = 0$ são
    opcoes: ['concorrentes.', 'paralelas distintas.', 'coincidentes.', 'concorrentes no ponto $(0, -1)$.', 'concorrentes no ponto $(1, 1)$.']
    correta: B
    resolucao: |
      A segunda é $y = 2x + \tfrac{3}{2}$: mesmo coeficiente angular e coeficiente linear diferente.

  - estilo: Unicamp
    enunciado: |
      A reta que passa por $(2, 3)$ e é paralela à reta $2x + y - 5 = 0$ tem equação
    opcoes: ['$y = -2x + 7$.', '$y = 2x - 1$.', '$y = -2x + 5$.', '$y = -\frac{x}{2} + 4$.']
    correta: A
    resolucao: |
      $m = -2$. $y - 3 = -2(x - 2)$: $y = -2x + 7$. $y = -2x + 5$ é a própria reta dada.

  - estilo: UEM
    enunciado: |
      Considere as retas $r$: $2x - y + 1 = 0$, $s$: $y = 2x - 3$ e $t$: $x + y - 7 = 0$. Assinale o que for correto.
    proposicoes:
    - 'As retas $r$ e $s$ são paralelas distintas.'
    - 'As retas $r$ e $t$ se cortam no ponto $(2, 5)$.'
    - 'As retas $s$ e $t$ se cortam no ponto $\left(\frac{10}{3}, \frac{11}{3}\right)$.'
    - 'As retas $r$ e $s$ têm um ponto comum.'
    - 'A reta paralela a $t$ que passa pela origem é $x + y = 0$.'
    corretas: [1, 2, 3, 5]
    resolucao: |
      $r$: $y = 2x + 1$. 01) Correta. 02) $4 - 5 + 1 = 0$ e $2 + 5 - 7 = 0$. 04) $2x - 3 = 7 - x$, $x = \tfrac{10}{3}$, $y = \tfrac{11}{3}$.
      08) Incorreta: são paralelas distintas. 16) Correta.
      Soma: $01 + 02 + 04 + 16 = 23$.

  - estilo: Unesp
    texto: |
      A figura mostra as retas $y = \frac{x}{2} + 2$ e $y = \frac{x}{2} - 1$.
    figura:
      tikz: |
        \begin{scope}[scale=.5]
        \draw[step=1, gray!25, very thin] (-2,-2) grid (6,5);
        \draw[-latex, ink!60] (-2.3,0) -- (6.4,0) node[right, font=\scriptsize] {$x$};
        \draw[-latex, ink!60] (0,-2.3) -- (0,5.4) node[above, font=\scriptsize] {$y$};
        \draw[roxo, line width=1pt] (-2,1) -- (6,5);
        \draw[ink, line width=1pt] (-2,-2) -- (6,2);
        \end{scope}
    enunciado: |
      O sistema formado pelas equações dessas retas é
    opcoes: ['possível e determinado, com solução $(0, 2)$.', 'possível e indeterminado.', 'impossível.', 'possível e determinado, com solução $(2, 0)$.', 'homogêneo.']
    correta: C
    resolucao: |
      Mesmo coeficiente angular e coeficientes lineares diferentes: paralelas distintas, sem ponto comum. O sistema é impossível.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir sobre retas do plano.
    afirmativas:
    - 'Duas retas com coeficientes angulares diferentes são concorrentes.'
    - 'Duas retas com o mesmo coeficiente linear são coincidentes.'
    - 'As retas $x = 2$ e $x = -5$ são paralelas.'
    - 'As retas $3x - 6y + 9 = 0$ e $x - 2y + 3 = 0$ são coincidentes.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'II e III, apenas.', 'II e IV, apenas.', 'I, III e IV, apenas.', 'I, II, III e IV.']
    correta: D
    resolucao: |
      I. Correta. II. Incorreta: só se cortam no eixo $y$ (a não ser que tenham também o mesmo $m$). III. Correta: verticais distintas.
      IV. Correta: a primeira é o triplo da segunda.

  - estilo: Fuvest
    enunciado: |
      As retas $y = 3x - 5$ e $y = -2x + 5$ se cortam no ponto
    opcoes: ['$(1, -2)$', '$(1, 3)$', '$(-2, 9)$', '$(2, 11)$', '$(2, 1)$']
    correta: E
    resolucao: |
      $3x - 5 = -2x + 5$: $x = 2$ e $y = 1$.

  # ---------------- Nível 2 ----------------
  - estilo: Enem
    texto: |
      Uma locadora oferece dois planos de aluguel de carro por um dia, com os valores do quadro. Em cada plano, o custo é uma função do 1º grau da distância percorrida, e os gráficos dos dois planos são retas. Um cliente quer saber a partir de que distância compensa escolher o plano B.
    tabela:
      cabecalho: ['Plano', 'Valor fixo', 'Por km']
      linhas:
      - ['A', 'R\$\,50,00', 'R\$\,0,80']
      - ['B', 'R\$\,80,00', 'R\$\,0,50']
    enunciado: |
      Os dois planos custam o mesmo valor para uma distância de
    opcoes: ['60 km.', '80 km.', '100 km.', '120 km.', '150 km.']
    correta: C
    resolucao: |
      $50 + 0{,}8d = 80 + 0{,}5d$: $0{,}3d = 30$, $d = 100$ km. A partir daí, o plano B (reta menos inclinada) fica mais barato.

  - estilo: Unicamp
    enunciado: |
      As retas $(k - 2)x + y = 3$ e $3x + y = 1$ são paralelas para $k$ igual a
    opcoes: ['$1$.', '$3$.', '$-1$.', '$5$.']
    correta: D
    resolucao: |
      Coeficientes angulares: $-(k - 2)$ e $-3$. Iguais: $k = 5$ (e são distintas: $3x + y = 3$ e $3x + y = 1$).

  - estilo: UFPR
    enunciado: |
      Considere as retas $r$: $y = -x + 4$, $s$: $x - y = 2$ e $t$: $y = -x$. Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'As retas $r$ e $s$ se cortam no ponto $(3, 1)$.'
    - 'As retas $r$ e $t$ são paralelas.'
    - 'As retas $s$ e $t$ se cortam no ponto $(1, -1)$.'
    - 'O triângulo formado por $r$, $s$ e o eixo $y$ tem área 18.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – F – V – F.', 'V – V – V – F.', 'F – V – V – F.', 'V – V – F – V.', 'V – V – V – V.']
    correta: B
    resolucao: |
      (V) $3 + 1 = 4$ e $3 - 1 = 2$. (V) Ambas com $m = -1$. (V) $x + x = 2$, $x = 1$.
      (F) Vértices $(0, 4)$, $(0, -2)$ e $(3, 1)$: base 6 no eixo $y$ e altura 3, área 9.

  - estilo: UFSC
    enunciado: |
      Considere as retas $r$: $ax + y = 2$ e $s$: $4x + ay = 4$, em que $a$ é real. Assinale o que for correto.
    proposicoes:
    - 'Para $a = 0$, as retas são concorrentes.'
    - 'Para $a = 2$, as retas são coincidentes.'
    - 'Para $a = -2$, as retas são paralelas distintas.'
    - 'Para $a = 1$, as retas se cortam no ponto $\left(\frac{2}{3}, \frac{4}{3}\right)$.'
    - 'Para $a = 3$, as retas são paralelas.'
    corretas: [1, 2, 3, 4]
    resolucao: |
      Determinante do sistema: $a^2 - 4$. 01) $y = 2$ e $x = 1$: concorrentes. 02) $2x + y = 2$ e $4x + 2y = 4$. 04) $-2x + y = 2$ e $4x - 2y = 4$, isto é, $-2x + y = -2$.
      08) $x + y = 2$ e $4x + y = 4$: $x = \tfrac{2}{3}$, $y = \tfrac{4}{3}$. 16) Incorreta: $a^2 - 4 = 5 \neq 0$, concorrentes.
      Soma: $01 + 02 + 04 + 08 = 15$.

  - estilo: Fuvest
    enunciado: |
      A reta paralela a $3x - 4y + 1 = 0$ que passa pelo ponto de interseção das retas $x + y = 5$ e $x - y = 1$ é
    opcoes: ['$3x - 4y - 1 = 0$', '$3x - 4y + 1 = 0$', '$4x + 3y - 18 = 0$', '$3x + 4y - 17 = 0$', '$x - y - 1 = 0$']
    correta: A
    resolucao: |
      Interseção: $(3, 2)$. Paralela: $3x - 4y + c = 0$, com $9 - 8 + c = 0$, $c = -1$.

  - estilo: Unesp
    texto: |
      Uma ferrovia retilínea está representada, num mapa com eixos em quilômetros, pela reta $y = 0{,}5x + 1$. Uma nova ferrovia será construída paralela a ela, passando pela cidade localizada no ponto $(6, 0)$, e cruzará a rodovia representada pela reta $x = 10$.
    enunciado: |
      O cruzamento da nova ferrovia com a rodovia ficará no ponto
    opcoes: ['$(10, 6)$', '$(10, 2)$', '$(10, 5)$', '$(10, 8)$', '$(10, 3)$']
    correta: B
    resolucao: |
      Nova ferrovia: $y - 0 = 0{,}5(x - 6)$, $y = 0{,}5x - 3$. Com $x = 10$: $y = 2$. $(10, 6)$ é o cruzamento da ferrovia antiga.

  - estilo: Enem
    texto: |
      Dois carros saem de uma mesma cidade pela mesma estrada, no mesmo sentido. O carro A parte do quilômetro 0 a 60 km/h, e o carro B, ao mesmo tempo, parte do quilômetro 120 a 40 km/h. As posições dos carros em função do tempo são representadas por duas retas, e o encontro acontece no ponto em que elas se cortam.
    enunciado: |
      O carro A alcança o carro B depois de
    opcoes: ['2 horas.', '3 horas.', '4 horas.', '5 horas.', '6 horas.']
    correta: E
    resolucao: |
      $s_A = 60t$ e $s_B = 120 + 40t$. $60t = 120 + 40t$: $t = 6$ h (no km 360).

  # ---------------- Nível 3 ----------------
  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Um terreno triangular é limitado por três cercas retas, representadas num mapa, com eixos em dezenas de metros, pelas retas $r$: $y = x + 1$, $s$: $y = -x + 7$ e $t$: $y = 1$. Os vértices do terreno são os pontos de encontro das cercas, duas a duas.
    enunciado: |
      Os vértices do terreno são
    opcoes: ['$(0, 1)$, $(6, 1)$ e $(3, 4)$.', '$(1, 0)$, $(6, 1)$ e $(3, 4)$.', '$(0, 1)$, $(7, 1)$ e $(3, 4)$.', '$(0, 1)$, $(6, 1)$ e $(4, 3)$.', '$(-1, 0)$, $(7, 0)$ e $(3, 4)$.']
    correta: A
    resolucao: |
      $r \cap t$: $x + 1 = 1$, $(0, 1)$. $s \cap t$: $-x + 7 = 1$, $(6, 1)$. $r \cap s$: $x + 1 = -x + 7$, $(3, 4)$.

  - estilo: Unicamp
    enunciado: |
      A área do terreno, em unidades do mapa, é
    opcoes: ['$9$.', '$18$.', '$12$.', '$6$.']
    correta: A
    resolucao: |
      Base de $(0, 1)$ a $(6, 1)$: 6. Altura: $4 - 1 = 3$. Área $\tfrac{6 \cdot 3}{2} = 9$ (isto é, 900 m²).

  - estilo: UEM
    enunciado: |
      Considere retas do plano cartesiano. Assinale o que for correto.
    proposicoes:
    - 'Se duas retas não verticais têm $m_1 = m_2$ e $n_1 \neq n_2$, elas são paralelas distintas.'
    - 'Duas retas concorrentes têm exatamente um ponto comum.'
    - 'As retas $a_1 x + b_1 y + c_1 = 0$ e $a_2 x + b_2 y + c_2 = 0$, com $\frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2}$, são coincidentes.'
    - 'Toda reta vertical é paralela ao eixo $x$.'
    - 'Três retas distintas sempre determinam um triângulo.'
    corretas: [1, 2, 3]
    resolucao: |
      01) Correta. 02) Correta. 04) Correta: uma equação é múltipla da outra.
      08) Incorreta: é paralela ao eixo $y$ (ou é o próprio eixo). 16) Incorreta: podem ser paralelas ou passar pelo mesmo ponto.
      Soma: $01 + 02 + 04 = 7$.

  - estilo: Fuvest
    enunciado: |
      As retas $x + y = 2$, $x - y = 0$ e $kx + 2y = 5$ passam por um mesmo ponto se, e somente se, $k$ é igual a
    opcoes: ['$1$', '$2$', '$3$', '$4$', '$5$']
    correta: C
    resolucao: |
      As duas primeiras se cortam em $(1, 1)$. Então $k + 2 = 5$, $k = 3$.

  - estilo: Enem
    texto: |
      Na planta de um loteamento, com eixos em dezenas de metros, a rua principal está na reta $r$, mostrada na figura. Uma cerca reta será construída paralela à rua, passando pelo poste $P(4, 1)$, e o engenheiro precisa saber em que ponto ela vai cruzar o córrego que corre ao longo do eixo $x$.
    figura:
      tikz: |
        \begin{scope}[scale=.5]
        \draw[step=1, gray!25, very thin] (-1,-1) grid (6,7);
        \draw[-latex, ink!60] (-1.3,0) -- (6.4,0) node[right, font=\scriptsize] {$x$};
        \draw[-latex, ink!60] (0,-1.3) -- (0,7.4) node[above, font=\scriptsize] {$y$};
        \draw[roxo, line width=1pt] (-0.5,-1) -- (3.5,7) node[right, font=\scriptsize] {$r$};
        \fill[roxo] (1,2) circle (3.5pt) node[right, font=\scriptsize] {$(1, 2)$};
        \fill[ink] (4,1) circle (3.5pt) node[right, font=\scriptsize] {$P$};
        \end{scope}
    enunciado: |
      A cerca cruzará o eixo $x$ no ponto de abscissa
    opcoes: ['$2$', '$3$', '$3{,}5$', '$4$', '$7$']
    correta: C
    resolucao: |
      A reta $r$ passa pela origem e por $(1, 2)$: $m = 2$. Cerca: $y - 1 = 2(x - 4)$, $y = 2x - 7$. Com $y = 0$: $x = 3{,}5$.

  - estilo: Fuvest
    enunciado: |
      A reta $r$: $y = mx + 1$ é paralela à reta que passa por $(1, 2)$ e $(3, 8)$. Então $r$ passa pelo ponto
    opcoes: ['$(1, 3)$', '$(2, 5)$', '$(3, 8)$', '$(2, 7)$', '$(0, 3)$']
    correta: D
    resolucao: |
      $m = \tfrac{6}{2} = 3$: $r$ é $y = 3x + 1$. Com $x = 2$: $y = 7$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'As retas $r$: $x - y + 1 = 0$, $s$: $x + 2y - 8 = 0$ e $t$: $2x + y - 13 = 0$ determinam um triângulo.'
    itens:
    - 'Determine os vértices do triângulo.'
    - 'Calcule a sua área.'
    - 'Escreva a equação da reta que passa pelo vértice $r \cap s$ e é paralela a $t$.'
    espaco: 62
    resolucao: |
      a) $r \cap s$: $x = y - 1$, $3y - 9 = 0$: $(2, 3)$. $s \cap t$: $x = 8 - 2y$, $16 - 3y = 13$: $(6, 1)$. $r \cap t$: $y = x + 1$, $3x = 12$: $(4, 5)$.
      b) $D = 2 \cdot (1 - 5) + 6 \cdot (5 - 3) + 4 \cdot (3 - 1) = 12$: área 6.
      c) $2x + y + c = 0$ por $(2, 3)$: $c = -7$. Reta $2x + y - 7 = 0$.
    resposta: 'a) $(2, 3)$, $(6, 1)$, $(4, 5)$; b) $6$; c) $2x + y - 7 = 0$'

  - estilo: Unicamp
    texto: |
      Uma empresa tem custo mensal $C = 2000 + 15q$ e receita $R = 40q$, em reais, sendo $q$ o número de unidades vendidas. Os gráficos de $C$ e $R$ em função de $q$ são retas.
    enunciado: ''
    itens:
    - 'Determine o ponto em que as retas se cortam e explique o seu significado.'
    - 'Qual é o lucro com 120 unidades vendidas?'
    - 'Se o preço de venda caísse para R\$\,15,00, o que aconteceria com as retas? A empresa teria lucro com alguma quantidade?'
    espaco: 62
    resolucao: |
      a) $40q = 2000 + 15q$: $q = 80$, com $C = R = 3200$. A partir de 80 unidades a empresa passa a ter lucro (é o ponto de equilíbrio).
      b) $R - C = 4800 - 3800 = 1000$ reais.
      c) $R = 15q$ ficaria paralela a $C = 2000 + 15q$, sempre 2000 abaixo. As retas nunca se cortariam: prejuízo de R\$\,2\,000,00 para qualquer quantidade.
    resposta: 'a) $q = 80$; b) R\$\,1\,000,00; c) retas paralelas; nunca há lucro'

  - estilo: ITA
    enunciado: |
      O número de valores reais de $a$ para os quais as retas $ax + 2y = 1$ e $8x + ay = 2$ são coincidentes é
    opcoes: ['$0$', '$1$', '$2$', '$3$', 'infinito']
    correta: B
    espaco: 22
    resolucao: |
      É preciso $\tfrac{a}{8} = \tfrac{2}{a} = \tfrac{1}{2}$. Da última igualdade, $a = 4$, e então $\tfrac{2}{4} = \tfrac{1}{2}$ também vale. Com $a = -4$, $\tfrac{a}{8} = -\tfrac{1}{2} \neq \tfrac{1}{2}$: as retas ficam paralelas distintas. Só um valor.
    resposta: 'B'

  - estilo: Unesp
    enunciado: 'Considere o triângulo de vértices $A(0, 0)$, $B(2b, 0)$ e $C(2c, 2d)$, com $b > 0$ e $d > 0$.'
    itens:
    - 'Determine os pontos médios $M$ de $AC$ e $N$ de $BC$.'
    - 'Mostre que o segmento $MN$ é paralelo a $AB$.'
    - 'Mostre que $MN$ mede a metade de $AB$.'
    espaco: 62
    resolucao: |
      a) $M(c, d)$ e $N(b + c, d)$.
      b) $M$ e $N$ têm a mesma ordenada $d$: $MN$ é horizontal, como $AB$.
      c) $MN = (b + c) - c = b$ e $AB = 2b$.
    resposta: 'a) $M(c, d)$, $N(b + c, d)$; b) e c) Ver resolução'

  - estilo: UFSC
    enunciado: |
      Considere as retas $r$: $y = 2x + 1$ e $s$: $y = kx + 3$, em que $k$ é real. Assinale o que for correto.
    proposicoes:
    - 'Para $k = 2$, as retas são paralelas.'
    - 'Para $k = 0$, as retas se cortam no ponto $(1, 3)$.'
    - 'Para $k \neq 2$, as retas se cortam num ponto de abscissa $\frac{2}{2 - k}$.'
    - 'Para algum valor de $k$, as retas são coincidentes.'
    - 'Para $k = 4$, as retas se cortam no ponto $(-1, -1)$.'
    - 'Para $k = 1$, o ponto de interseção está no 1º quadrante.'
    corretas: [1, 2, 3, 5, 6]
    espaco: 22
    resolucao: |
      $2x + 1 = kx + 3 \iff (2 - k)x = 2$. 01) Correta (e distintas). 02) $x = 1$, $y = 3$. 04) Correta. 08) Incorreta: os coeficientes lineares 1 e 3 são diferentes.
      16) $x = \tfrac{2}{-2} = -1$, $y = -1$. 32) $x = 2$, $y = 5$.
    resposta: 'Soma 55 (01 + 02 + 04 + 16 + 32)'

  - estilo: Fuvest
    enunciado: 'Os lados de um paralelogramo estão sobre as retas $y = 0$, $y = 4$, $y = 2x$ e $y = 2x - 6$.'
    itens:
    - 'Identifique os pares de lados paralelos.'
    - 'Determine os quatro vértices.'
    - 'Calcule a área do paralelogramo.'
    espaco: 62
    resolucao: |
      a) $y = 0$ e $y = 4$ (horizontais); $y = 2x$ e $y = 2x - 6$ (coeficiente angular 2).
      b) $y = 0$ com $y = 2x$: $(0, 0)$; com $y = 2x - 6$: $(3, 0)$. $y = 4$ com $y = 2x$: $(2, 4)$; com $y = 2x - 6$: $(5, 4)$.
      c) Base 3 (sobre $y = 0$) e altura 4: área 12.
    resposta: 'b) $(0, 0)$, $(3, 0)$, $(5, 4)$, $(2, 4)$; c) $12$'

  - estilo: Unicamp
    texto: |
      Um ônibus sai de uma rodoviária às 8 h, a 60 km/h. Às 9 h, um carro sai da mesma rodoviária, pela mesma estrada e no mesmo sentido, a 80 km/h. Seja $t$ o tempo, em horas, contado a partir das 8 h.
    enunciado: ''
    itens:
    - 'Escreva as posições $s_O$ e $s_C$ (em km) do ônibus e do carro, para $t \ge 1$.'
    - 'Determine a que horas e em que quilômetro o carro alcança o ônibus.'
    - 'Se o carro andasse a 60 km/h, o que aconteceria com as retas? Ele alcançaria o ônibus?'
    espaco: 62
    resolucao: |
      a) $s_O = 60t$ e $s_C = 80(t - 1)$.
      b) $60t = 80t - 80$: $t = 4$, isto é, às 12 h, no km 240.
      c) $s_C = 60(t - 1) = 60t - 60$, paralela a $s_O$ e sempre 60 km atrás: nunca o alcançaria.
    resposta: 'a) $s_O = 60t$, $s_C = 80(t - 1)$; b) às 12 h, km 240; c) retas paralelas; não'

  - estilo: Fuvest
    enunciado: |
      A reta paralela ao eixo $x$ que passa pela interseção das retas $2x - y = 1$ e $x + y = 5$ tem equação
    opcoes: ['$y = 3$', '$x = 2$', '$y = 2$', '$x = 3$', '$y = x + 1$']
    correta: A
    espaco: 22
    resolucao: |
      Somando: $3x = 6$, $x = 2$ e $y = 3$. A reta horizontal por $(2, 3)$ é $y = 3$; $x = 2$ seria a vertical.
    resposta: 'A'

  - estilo: Unesp
    texto: |
      Um aluno afirmou que as retas $2x + 3y = 6$ e $4x + 6y = 15$ são coincidentes, “porque os coeficientes de $x$ e de $y$ são proporcionais”.
    enunciado: ''
    itens:
    - 'Escreva as duas retas na forma reduzida.'
    - 'Classifique corretamente a posição relativa das retas.'
    - 'Que número deveria estar no lugar do 15 para que as retas fossem coincidentes?'
    espaco: 62
    resolucao: |
      a) $y = -\tfrac{2}{3}x + 2$ e $y = -\tfrac{2}{3}x + \tfrac{5}{2}$.
      b) Mesmo coeficiente angular, coeficientes lineares diferentes: paralelas distintas. Para coincidirem, os termos independentes também precisariam estar na mesma proporção.
      c) $4x + 6y = 12$, o dobro da primeira equação.
    resposta: 'a) Ver resolução; b) paralelas distintas; c) $12$'

  - estilo: Fuvest
    enunciado: 'Considere o triângulo de vértices $(0, 0)$, $(4, 0)$ e $(0, 4)$ e as retas $y = 2x + n$.'
    itens:
    - 'Para que valor de $n$ a reta passa por cada um dos três vértices?'
    - 'Para que valores de $n$ a reta tem algum ponto em comum com o triângulo? Justifique.'
    - 'Para $n = 0$, calcule o comprimento do trecho da reta que fica dentro do triângulo.'
    espaco: 62
    resolucao: |
      a) $(0, 0)$: $n = 0$. $(4, 0)$: $n = -8$. $(0, 4)$: $n = 4$.
      b) As retas são todas paralelas; ao variar $n$, a reta se desloca. Ela começa a tocar o triângulo em $(4, 0)$, com $n = -8$, e deixa de tocar depois de $(0, 4)$, com $n = 4$: $-8 \le n \le 4$.
      c) $y = 2x$ sai de $(0, 0)$ e encontra o lado $x + y = 4$ em $3x = 4$: $\left(\tfrac{4}{3}, \tfrac{8}{3}\right)$. Comprimento $\sqrt{\tfrac{16}{9} + \tfrac{64}{9}} = \tfrac{4\sqrt{5}}{3}$.
    resposta: 'a) $0$, $-8$, $4$; b) $-8 \le n \le 4$; c) $\frac{4\sqrt{5}}{3}$'
