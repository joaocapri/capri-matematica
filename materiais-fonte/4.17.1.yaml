# Aula 4.17.1 — Geometria espacial: esfera, área e volume
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: A = 4πr², V = 4πr³/3; secção plana (círculo de raio √(R² − d²)) e círculo máximo; hemisfério
# (área total 3πr², volume 2πr³/3); relação V = A·r/3; esfera e cilindro circunscrito (Arquimedes); fusão e
# reaproveitamento de material; água deslocada; variação de raio. Fuso, cunha, calota e inscrições ficam para 4.17.2–4.17.4.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Use $A = 4\pi r^2$ e $V = \frac{4\pi r^3}{3}$, e deixe as respostas em função de $\pi$, salvo indicação. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Uma esfera tem raio 6. Complete.'
      itens:
      - 'Área da superfície: {{144\pi}}'
      - 'Volume: {{288\pi}}'
      - 'Área do círculo máximo: {{36\pi}}'
      - 'Raio da secção feita por um plano a 4 do centro: {{2\sqrt{5}}}'
      espaco_item: 8
      resolucao: |
        $4\pi \cdot 36$; $\tfrac{4\pi \cdot 216}{3}$; $\pi \cdot 36$; $\sqrt{36 - 16} = \sqrt{20}$.
      resposta: '$144\pi$; $288\pi$; $36\pi$; $2\sqrt{5}$'
    - enunciado: 'Associe cada raio ao volume da esfera.'
      esquerda:
      - '$r = 1$'
      - '$r = 3$'
      - '$r = \frac{1}{2}$'
      - '$r = 2$'
      - '$r = \sqrt{3}$'
      direita:
      - '$36\pi$'
      - '$\frac{\pi}{6}$'
      - '$4\sqrt{3}\,\pi$'
      - '$\frac{4\pi}{3}$'
      - '$\frac{32\pi}{3}$'
      resolucao: |
        $\tfrac{4\pi}{3}r^3$: $r^3 = 1$, $27$, $\tfrac{1}{8}$, $8$ e $3\sqrt{3}$.
      resposta: 'De cima para baixo: 2, 3, 5, 1, 4'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'A área da superfície de uma esfera de raio $r$ é $\pi r^2$.'
      - 'Dobrando o raio de uma esfera, o volume fica multiplicado por 8.'
      - 'Toda secção plana de uma esfera é um círculo.'
      - 'O círculo máximo de uma esfera tem raio igual ao diâmetro da esfera.'
      justificar: true
      espaco: 20
      resolucao: |
        (F) $\pi r^2$ é a área do círculo máximo; a esfera tem $4\pi r^2$. (V) $2^3$. (V) (F) Tem o mesmo raio da esfera.
      resposta: F, V, V, F
    - enunciado: 'Complete para esferas de raio $r$.'
      tabela:
        cabecalho: ['$r$', 'Área', 'Volume']
        linhas:
        - ['$5$', '${{100\pi}}$', '${{\frac{500\pi}{3}}}$']
        - ['$10$', '${{400\pi}}$', '${{\frac{4000\pi}{3}}}$']
        - ['${{4}}$', '$64\pi$', '${{\frac{256\pi}{3}}}$']
        - ['${{3}}$', '${{36\pi}}$', '$36\pi$']
      resolucao: |
        $4\pi r^2 = 64\pi$ dá $r = 4$; $\tfrac{4\pi r^3}{3} = 36\pi$ dá $r^3 = 27$, $r = 3$.
      resposta: '$100\pi$, $\frac{500\pi}{3}$; $400\pi$, $\frac{4000\pi}{3}$; 4, $\frac{256\pi}{3}$; 3, $36\pi$'
    - enunciado: 'Na figura, um plano a 8 do centro $O$ de uma esfera determina uma secção de raio 6. Calcule o raio e a área da esfera.'
      figura:
        tikz: |
          \begin{scope}[scale=.9]
          \draw[ink, line width=1pt] (0,0) circle (1.5);
          \draw[ink, line width=.8pt] (0,1.2) ellipse (0.9 and 0.18);
          \fill[ink] (0,0) circle (1.5pt);
          \node[below, font=\scriptsize] at (0,0) {$O$};
          \draw[roxo, dashed] (0,0) -- (0,1.2);
          \draw[roxo, line width=1pt] (0,0) -- (0.9,1.2);
          \draw[roxo] (0,1.2) -- (0.9,1.2);
          \node[left, font=\scriptsize] at (0,0.6) {$8$};
          \node[above, font=\scriptsize] at (0.45,1.25) {$6$};
          \node[right, font=\scriptsize] at (0.5,0.5) {$R$};
          \end{scope}
      espaco: 8
      resolucao: |
        $R = \sqrt{64 + 36} = 10$; $A = 400\pi$.
      resposta: '$R = 10$; $400\pi$'
    - enunciado: 'Uma bola de basquete tem 24 cm de diâmetro. Calcule a área da superfície e o volume, com $\pi \approx 3{,}14$.'
      espaco: 10
      resolucao: |
        $r = 12$: $A = 576\pi \approx 1808{,}6$ cm²; $V = 2304\pi \approx 7234{,}6$ cm³.
      resposta: '$\approx 1808{,}6$ cm²; $\approx 7234{,}6$ cm³'
    - enunciado: 'Um hemisfério maciço (meia esfera) tem raio 3. Calcule a área total (incluindo a base plana) e o volume.'
      espaco: 8
      resolucao: |
        Área: $\tfrac{4\pi \cdot 9}{2} + \pi \cdot 9 = 27\pi$. Volume: $\tfrac{36\pi}{2} = 18\pi$.
      resposta: '$27\pi$; $18\pi$'
  - nome: Nível 2
    questoes:
    - texto: |
        Lia calculou o volume de uma esfera de raio 3 assim: $V = \frac{4\pi \cdot 3^2}{3} = 12\pi$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 8
      resolucao: |
        O raio vai ao cubo no volume: $V = \tfrac{4\pi \cdot 27}{3} = 36\pi$.
      resposta: '$36\pi$'
    - enunciado: 'Uma esfera maciça de chumbo de raio 6 é derretida, e com o chumbo fazem-se esferas de raio 2. Quantas esferas são obtidas? Por quanto fica multiplicada a área total?'
      espaco: 10
      resolucao: |
        $\left(\tfrac{6}{2}\right)^3 = 27$ esferas. Área: $27 \cdot 16\pi = 432\pi = 3 \cdot 144\pi$: triplica.
      resposta: '27; 3'
    - enunciado: 'Uma esfera de raio 4 está inscrita num cilindro (raio 4, altura 8). Complete.'
      itens:
      - 'Volume da esfera: {{\frac{256\pi}{3}}}'
      - 'Volume do cilindro: {{128\pi}}'
      - 'Razão entre os volumes da esfera e do cilindro: {{\frac{2}{3}}}'
      - 'Área lateral do cilindro: {{64\pi}}'
      espaco_item: 8
      resolucao: |
        $\tfrac{4\pi \cdot 64}{3}$; $\pi \cdot 16 \cdot 8$; razão $\tfrac{2}{3}$; $2\pi \cdot 4 \cdot 8 = 64\pi$, igual à área da esfera.
      resposta: '$\frac{256\pi}{3}$; $128\pi$; $\frac{2}{3}$; $64\pi$'
    - enunciado: 'Um copo cilíndrico de 5 cm de raio tem água. Uma bolinha maciça de 3 cm de raio é mergulhada totalmente. Quanto sobe o nível da água?'
      espaco: 10
      resolucao: |
        Volume da bolinha $36\pi$: $25\pi h = 36\pi$, $h = 1{,}44$ cm.
      resposta: '1,44 cm'
    - enunciado: 'Uma esfera tem volume $972\pi$. Calcule o raio e a área.'
      espaco: 8
      resolucao: |
        $\tfrac{4r^3}{3} = 972$: $r^3 = 729$, $r = 9$. $A = 324\pi$.
      resposta: '9; $324\pi$'
    - enunciado: 'Um plano a 5 do centro de uma esfera de raio 13 determina uma secção. Calcule o raio, a área e o perímetro da secção.'
      espaco: 8
      resolucao: |
        $\sqrt{169 - 25} = 12$; área $144\pi$; perímetro $24\pi$.
      resposta: '12; $144\pi$; $24\pi$'
    - enunciado: 'Um tanque esférico de 2 m de diâmetro será pintado por fora. Cada litro de tinta cobre 4 m². Quantos litros são necessários, com $\pi \approx 3{,}14$?'
      espaco: 8
      resolucao: |
        $A = 4\pi \cdot 1 \approx 12{,}56$ m²; $\tfrac{12{,}56}{4} = 3{,}14$ L.
      resposta: '3,14 L'
    - enunciado: 'A área de uma esfera é numericamente igual ao seu volume. Calcule o raio.'
      espaco: 8
      resolucao: |
        $4\pi r^2 = \tfrac{4\pi r^3}{3}$: $r = 3$.
      resposta: '3'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que, para qualquer esfera, $V = \frac{A \cdot r}{3}$.'
      espaco: 8
      resolucao: |
        $\tfrac{4\pi r^2 \cdot r}{3} = \tfrac{4\pi r^3}{3}$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que a secção de uma esfera de raio $R$ por um plano a uma distância $d < R$ do centro é um círculo de raio $\sqrt{R^2 - d^2}$.'
      espaco: 12
      resolucao: |
        Seja $C$ o pé da perpendicular do centro $O$ ao plano. Para $P$ na secção, $OP = R$ e o triângulo $OCP$ é retângulo em $C$: $CP = \sqrt{R^2 - d^2}$, constante. Logo os pontos da secção estão à mesma distância de $C$.
      resposta: 'Ver resolução'
    - enunciado: 'Uma esfera de raio $r$ está inscrita num cilindro de raio $r$ e altura $2r$. Prove que o volume da esfera é $\frac{2}{3}$ do volume do cilindro e que a área da esfera é igual à área lateral do cilindro.'
      espaco: 10
      resolucao: |
        $\tfrac{4\pi r^3/3}{2\pi r^3} = \tfrac{2}{3}$; $2\pi r \cdot 2r = 4\pi r^2$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que um hemisfério maciço de raio $r$ tem área total $3\pi r^2$ e volume $\frac{2\pi r^3}{3}$.'
      espaco: 8
      resolucao: |
        Metade da superfície, $2\pi r^2$, mais a base plana, $\pi r^2$. Metade do volume, $\tfrac{2\pi r^3}{3}$.
      resposta: 'Ver resolução'
    - enunciado: 'Uma esfera de raio $r$ é derretida e transformada em esferas de raio $\frac{r}{n}$. Prove que se obtêm $n^3$ esferas e que a área total fica multiplicada por $n$.'
      espaco: 10
      resolucao: |
        Cada esfera pequena tem $\tfrac{1}{n^3}$ do volume: $n^3$ esferas. Área: $n^3 \cdot 4\pi\tfrac{r^2}{n^2} = n \cdot 4\pi r^2$.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Uma indústria armazena gás num reservatório esférico, como o da figura, com 5 m de raio interno. Para controlar o estoque, o técnico responsável precisa saber a capacidade do reservatório, em metros cúbicos. Use 3 como aproximação para $\pi$.
    figura:
      tikz: |
        \begin{scope}[scale=.6]
        \shade[ball color=lilas!40] (0,1.6) circle (1.2);
        \draw[ink, line width=1pt] (0,1.6) circle (1.2);
        \draw[ink, dashed] (-1.2,1.6) arc (180:0:1.2 and 0.3);
        \draw[ink] (-1.2,1.6) arc (180:360:1.2 and 0.3);
        \draw[ink, line width=1pt] (-0.7,0.62) -- (-0.9,0) (0.7,0.62) -- (0.9,0) (-0.15,0.4) -- (-0.15,0) (0.15,0.4) -- (0.15,0);
        \draw[ink, line width=1pt] (-1.2,0) -- (1.2,0);
        \end{scope}
    enunciado: |
      A capacidade do reservatório é
    opcoes: ['$500$ m³', '$300$ m³', '$1500$ m³', '$100$ m³', '$375$ m³']
    correta: A
    resolucao: |
      $V = \tfrac{4\pi \cdot 125}{3} \approx \tfrac{4 \cdot 3 \cdot 125}{3} = 500$ m³.

  - estilo: Fuvest
    enunciado: |
      A área da superfície de uma esfera de raio 7 é
    opcoes: ['$49\pi$', '$196\pi$', '$\frac{1372\pi}{3}$', '$98\pi$', '$28\pi$']
    correta: B
    resolucao: |
      $4\pi \cdot 49 = 196\pi$.

  - estilo: Unicamp
    enunciado: |
      Uma esfera tem volume $288\pi$. A área da sua superfície é
    opcoes: ['$36\pi$.', '$72\pi$.', '$144\pi$.', '$288\pi$.']
    correta: C
    resolucao: |
      $\tfrac{4r^3}{3} = 288$: $r^3 = 216$, $r = 6$. $A = 144\pi$.

  - estilo: UEM
    enunciado: |
      Uma esfera de raio 10 é cortada por um plano a 6 do centro. Assinale o que for correto.
    proposicoes:
    - 'A secção tem raio 8.'
    - 'A secção tem área $64\pi$.'
    - 'A área da superfície da esfera é $400\pi$.'
    - 'O volume da esfera é $\frac{4000\pi}{3}$.'
    - 'A secção tem raio 4.'
    - 'O círculo máximo da esfera tem área $100\pi$.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) $\sqrt{100 - 36}$. 02) $\pi \cdot 64$. 04) $4\pi \cdot 100$. 08) $\tfrac{4\pi \cdot 1000}{3}$. 16) Incorreta: é 8. 32) $\pi \cdot 100$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      Uma sorveteria vende sorvete em potes cilíndricos de 6 cm de raio e 10 cm de altura, totalmente cheios. Cada bola servida no balcão é uma esfera de 2 cm de raio. O gerente quer saber quantas bolas completas, no máximo, podem ser servidas com o sorvete de um pote. Use 3 como aproximação para $\pi$.
    enunciado: |
      O número máximo de bolas completas é
    opcoes: ['$34$', '$11$', '$45$', '$33$', '$30$']
    correta: D
    resolucao: |
      Pote $\pi \cdot 36 \cdot 10 = 360\pi$; bola $\tfrac{4\pi \cdot 8}{3} = \tfrac{32\pi}{3}$. $\tfrac{360 \cdot 3}{32} = 33{,}75$: 33 bolas.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir, sobre uma esfera de raio $r$.
    afirmativas:
    - 'A área da superfície é $4\pi r^2$.'
    - 'O volume é $\frac{4\pi r^3}{3}$.'
    - 'Dobrando o raio, o volume fica multiplicado por 4.'
    - 'Toda secção plana da esfera é um círculo.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'I e III, apenas.', 'III e IV, apenas.', 'II, III e IV, apenas.', 'I, II e IV, apenas.']
    correta: E
    resolucao: |
      I. Correta. II. Correta. III. Incorreta: por 8. IV. Correta.

  - estilo: Unesp
    enunciado: |
      Uma esfera tem área de superfície $100\pi$. O seu raio é
    opcoes: ['$5$', '$10$', '$25$', '$\sqrt{10}$', '$2{,}5$']
    correta: A
    resolucao: |
      $4r^2 = 100$: $r = 5$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      O recipiente cilíndrico da figura, de 6 cm de raio interno, contém água. Uma bola maciça de 3 cm de raio é colocada nele e fica totalmente submersa.
    figura:
      tikz: |
        \begin{scope}[scale=.7]
        \fill[lilas!25] (-1.2,0) -- (-1.2,1.8) arc (180:360:1.2 and 0.3) -- (1.2,0) arc (360:180:1.2 and 0.3);
        \draw[ink, line width=.6pt, fill=lilas!40] (0,1.8) ellipse (1.2 and 0.3);
        \draw[ink, line width=1pt] (-1.2,0) -- (-1.2,2.6) (1.2,0) -- (1.2,2.6);
        \draw[ink, line width=1pt] (0,2.6) ellipse (1.2 and 0.3);
        \draw[ink, line width=1pt] (-1.2,0) arc (180:360:1.2 and 0.3);
        \draw[ink, line width=1pt, fill=lilas!60] (0,0.65) circle (0.6);
        \node[right, font=\scriptsize] at (1.2,2.6) {$6$};
        \node[font=\scriptsize] at (0,0.65) {$3$};
        \end{scope}
    enunciado: |
      O nível da água sobe
    opcoes: ['$\frac{1}{2}$ cm.', '$1$ cm.', '$3$ cm.', '$\frac{4}{3}$ cm.']
    correta: B
    resolucao: |
      Volume da bola $\tfrac{4\pi \cdot 27}{3} = 36\pi$. $\pi \cdot 36 \cdot h = 36\pi$: $h = 1$ cm.

  - estilo: Fuvest
    enunciado: |
      Uma esfera maciça de raio $r$ é derretida, e o material é moldado num cilindro de mesmo raio $r$. A altura do cilindro é
    opcoes: ['$r$', '$2r$', '$\frac{4r}{3}$', '$\frac{3r}{4}$', '$\frac{2r}{3}$']
    correta: C
    resolucao: |
      $\pi r^2 h = \tfrac{4\pi r^3}{3}$: $h = \tfrac{4r}{3}$.

  - estilo: UFSC
    enunciado: |
      Uma esfera de raio $r$ está inscrita num cilindro de raio $r$ e altura $2r$. Assinale o que for correto.
    proposicoes:
    - 'O volume do cilindro é $2\pi r^3$.'
    - 'O volume da esfera é $\frac{2}{3}$ do volume do cilindro.'
    - 'A área da esfera é igual à área lateral do cilindro.'
    - 'A área da esfera é $\frac{2}{3}$ da área total do cilindro.'
    - 'O cone de mesma base e mesma altura do cilindro tem metade do volume da esfera.'
    - 'O volume da esfera é metade do volume do cilindro.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) $\pi r^2 \cdot 2r$. 02) $\tfrac{4\pi r^3/3}{2\pi r^3}$. 04) $2\pi r \cdot 2r$. 08) $\tfrac{4\pi r^2}{6\pi r^2}$. 16) Cone $\tfrac{2\pi r^3}{3}$. 32) Incorreta: é $\tfrac{2}{3}$.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      Um tanque esférico com 6 m de diâmetro será pintado por fora com uma demão de tinta anticorrosiva. Cada lata de tinta rende 20 m² e só é vendida inteira. O responsável pela manutenção precisa saber quantas latas comprar. Use 3 como aproximação para $\pi$.
    enunciado: |
      O número mínimo de latas é
    opcoes: ['$6$', '$5$', '$11$', '$22$', '$4$']
    correta: A
    resolucao: |
      $A = 4 \cdot 3 \cdot 9 = 108$ m²; $\tfrac{108}{20} = 5{,}4$: 6 latas.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'A esfera de raio 1 tem volume $\frac{4\pi}{3}$.'
    - 'Triplicando o raio de uma esfera, o volume fica multiplicado por 9.'
    - 'Um plano a 3 do centro de uma esfera de raio 5 determina uma secção de raio 4.'
    - 'Um hemisfério maciço de raio 2 tem área total $12\pi$.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – F – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – V – F.', 'V – F – V – V.']
    correta: E
    resolucao: |
      (V) (F) Por 27. (V) $\sqrt{25 - 9}$. (V) $3\pi \cdot 4$.

  - estilo: Enem
    texto: |
      Uma loja vende cinco modelos de luminária esférica de vidro, que serão preenchidas com gel decorativo. O quadro mostra o diâmetro interno e o preço de cada modelo. O decorador quer o modelo com o maior volume interno por real gasto. Use 3 como aproximação para $\pi$.
    tabela:
      cabecalho: ['Modelo', 'Diâmetro (cm)', 'Preço (R\$)']
      linhas:
      - ['L1', '$10$', '$5{,}00$']
      - ['L2', '$12$', '$8{,}00$']
      - ['L3', '$14$', '$14{,}00$']
      - ['L4', '$16$', '$18{,}00$']
      - ['L5', '$20$', '$40{,}00$']
    enunciado: |
      O modelo escolhido deve ser o
    opcoes: ['L1.', 'L2.', 'L3.', 'L4.', 'L5.']
    correta: D
    resolucao: |
      Com $\pi = 3$, $V = 4r^3$: 500; 864; 1372; 2048; 4000 cm³. Por real: 100; 108; 98; $\approx 113{,}8$; 100.

  - estilo: Unesp
    enunciado: |
      Uma esfera tem volume $\frac{4000\pi}{3}$. A área da sua superfície é
    opcoes: ['$100\pi$', '$400\pi$', '$200\pi$', '$40\pi$', '$1600\pi$']
    correta: B
    resolucao: |
      $r^3 = 1000$: $r = 10$, $A = 400\pi$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Uma esfera maciça de chumbo de raio 6 será derretida e o chumbo reaproveitado. Assinale o que for correto.
    proposicoes:
    - 'É possível fazer exatamente 27 esferas de raio 2.'
    - 'A área total dessas 27 esferas é o triplo da área da esfera original.'
    - 'É possível fazer um cilindro de raio 6 e altura 8.'
    - 'É possível fazer um cone de raio 6 e altura 24.'
    - 'É possível fazer exatamente 8 esferas de raio 2.'
    - 'O volume da esfera original é $288\pi$.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      $V = 288\pi$. 01) $27 \cdot \tfrac{32\pi}{3}$. 02) $27 \cdot 16\pi = 432\pi = 3 \cdot 144\pi$. 04) $\pi \cdot 36 \cdot 8$. 08) $\tfrac{\pi \cdot 36 \cdot 24}{3}$. 16) Incorreta: sobraria chumbo. 32) Correta.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Unicamp
    enunciado: |
      O volume de uma esfera aumentou 33,1\%. O raio aumentou
    opcoes: ['$10\%$.', '$33{,}1\%$.', '$11\%$.', '$21\%$.']
    correta: A
    resolucao: |
      $k^3 = 1{,}331$: $k = 1{,}1$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Uma bola de futebol oficial tem cerca de 22 cm de diâmetro. Um fabricante quer estimar a área de couro sintético usada na superfície de cada bola e o volume de ar dentro dela, desprezando a espessura do material e as costuras. Use 3 como aproximação para $\pi$.
    enunciado: |
      A área da superfície da bola é, aproximadamente,
    opcoes: ['$484$ cm²', '$726$ cm²', '$1452$ cm²', '$5808$ cm²', '$363$ cm²']
    correta: C
    resolucao: |
      $r = 11$: $4 \cdot 3 \cdot 121 = 1452$ cm².

  - estilo: Unesp
    enunciado: |
      O volume de ar dentro da bola é, aproximadamente,
    opcoes: ['$1{,}3$ L', '$10{,}6$ L', '$4{,}0$ L', '$5{,}3$ L', '$21{,}3$ L']
    correta: D
    resolucao: |
      $\tfrac{4 \cdot 3 \cdot 1331}{3} = 5324$ cm³ $\approx 5{,}3$ L.

  - estilo: Fuvest
    enunciado: |
      A razão entre a área da superfície e o volume de uma esfera de raio $r$ é
    opcoes: ['$\frac{r}{3}$', '$3r$', '$\frac{1}{r}$', '$\frac{4}{3r}$', '$\frac{3}{r}$']
    correta: E
    resolucao: |
      $\tfrac{4\pi r^2}{4\pi r^3/3} = \tfrac{3}{r}$.

  - estilo: Unesp
    texto: |
      O silo da figura é formado por um cilindro de 3 m de raio e 10 m de altura, coberto por um hemisfério de mesmo raio.
    figura:
      tikz: |
        \begin{scope}[scale=.5]
        \draw[ink, line width=1pt] (-1,0) -- (-1,3.3) (1,0) -- (1,3.3);
        \draw[ink, line width=1pt] (-1,3.3) arc (180:0:1);
        \draw[ink, dashed] (-1,3.3) arc (180:0:1 and 0.25);
        \draw[ink] (-1,3.3) arc (180:360:1 and 0.25);
        \draw[ink, line width=1pt] (-1,0) arc (180:360:1 and 0.25);
        \draw[ink, dashed] (1,0) arc (0:180:1 and 0.25);
        \node[right, font=\scriptsize] at (1,1.6) {$10$};
        \draw[mudo] (0,3.3) -- (1,3.3);
        \node[above, font=\scriptsize] at (0.5,3.3) {$3$};
        \end{scope}
    enunciado: |
      O volume do silo é
    opcoes: ['$90\pi$ m³', '$108\pi$ m³', '$126\pi$ m³', '$144\pi$ m³', '$99\pi$ m³']
    correta: B
    resolucao: |
      Cilindro $\pi \cdot 9 \cdot 10 = 90\pi$; hemisfério $\tfrac{2\pi \cdot 27}{3} = 18\pi$. Total $108\pi$ m³.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere um hemisfério de raio $R$ e, ao lado dele, um cilindro de raio $R$ e altura $R$ do qual se retirou um cone de mesma base e mesma altura, com o vértice no centro da base de baixo (a "anticlépsidra").'
    itens:
    - 'Prove que um plano horizontal a uma altura $h$ da base corta o hemisfério num círculo de área $\pi(R^2 - h^2)$.'
    - 'Prove que esse mesmo plano corta o segundo sólido numa coroa de área $\pi(R^2 - h^2)$.'
    - 'Use o princípio de Cavalieri para concluir que o volume da esfera é $\frac{4\pi R^3}{3}$.'
    espaco: 62
    resolucao: |
      a) A secção tem raio $\sqrt{R^2 - h^2}$.
      b) O cilindro dá um círculo de raio $R$, e o cone retirado, um círculo de raio $h$ (o cone tem raio igual à altura): coroa $\pi R^2 - \pi h^2$.
      c) Secções de mesma área em todas as alturas: $V_{\text{hemisfério}} = \pi R^3 - \tfrac{\pi R^3}{3} = \tfrac{2\pi R^3}{3}$, e a esfera tem o dobro.
    resposta: 'c) $\frac{4\pi R^3}{3}$'

  - estilo: Unicamp
    enunciado: 'Uma casca esférica tem raio interno $r$ e espessura $e$.'
    itens:
    - 'Escreva o volume exato da casca.'
    - 'Mostre que, para $e$ muito pequeno, esse volume é aproximadamente $4\pi r^2 e$ (área vezes espessura).'
    - 'Para $r = 10$ cm e $e = 0{,}1$ cm, calcule o volume exato e o aproximado, em função de $\pi$.'
    espaco: 62
    resolucao: |
      a) $\tfrac{4\pi}{3}[(r + e)^3 - r^3] = \tfrac{4\pi}{3}(3r^2 e + 3re^2 + e^3)$.
      b) $= 4\pi r^2 e + 4\pi r e^2 + \tfrac{4\pi e^3}{3}$; os dois últimos termos são muito menores que o primeiro.
      c) Exato: $\tfrac{4\pi}{3}(1030{,}301 - 1000) = 40{,}4\pi$ (aproximadamente). Aproximado: $40\pi$.
    resposta: 'c) $\approx 40{,}4\pi$ e $40\pi$ cm³'

  - estilo: ITA
    enunciado: |
      Uma esfera e um cubo têm a mesma área de superfície. A razão entre o volume da esfera e o volume do cubo é
    opcoes: ['$\sqrt{\frac{6}{\pi}}$', '$\frac{\pi}{6}$', '$1$', '$\sqrt{\frac{\pi}{6}}$', '$\frac{6}{\pi}$']
    correta: A
    espaco: 22
    resolucao: |
      $4\pi r^2 = 6a^2$: $r = a\sqrt{\tfrac{3}{2\pi}}$. $\tfrac{V_e}{V_c} = \tfrac{4\pi}{3} \cdot \left(\tfrac{3}{2\pi}\right)^{3/2} = \tfrac{4\pi}{3} \cdot \tfrac{3}{2\pi}\sqrt{\tfrac{3}{2\pi}} = 2\sqrt{\tfrac{3}{2\pi}} = \sqrt{\tfrac{6}{\pi}}$.
    resposta: 'A'

  - estilo: Unesp
    texto: |
      Um tanque de combustível tem a forma de um cilindro de 1 m de raio e 4 m de comprimento, com um hemisfério de mesmo raio em cada ponta.
    enunciado: ''
    itens:
    - 'Calcule o volume do tanque, em função de $\pi$.'
    - 'Calcule a área externa do tanque, em função de $\pi$.'
    - 'Com $\pi \approx 3{,}14$, calcule a capacidade em litros.'
    espaco: 62
    resolucao: |
      a) Cilindro $4\pi$; dois hemisférios formam uma esfera, $\tfrac{4\pi}{3}$. Total $\tfrac{16\pi}{3}$ m³.
      b) Lateral $2\pi \cdot 1 \cdot 4 = 8\pi$; esfera $4\pi$. Total $12\pi$ m².
      c) $\tfrac{16 \cdot 3{,}14}{3} \approx 16{,}75$ m³ $\approx 16\,750$ L.
    resposta: 'a) $\frac{16\pi}{3}$ m³; b) $12\pi$ m²; c) $\approx 16\,750$ L'

  - estilo: UFSC
    enunciado: |
      Considere esferas de raio $r$. Assinale o que for correto.
    proposicoes:
    - 'Para $r = 4$, a área é $64\pi$.'
    - 'O volume é $\frac{A \cdot r}{3}$, sendo $A$ a área.'
    - 'Um hemisfério maciço de raio $r$ tem área total $3\pi r^2$.'
    - 'Dobrando o raio, a área fica multiplicada por 8.'
    - 'Uma esfera de raio 3 fica inscrita num cubo de aresta 6.'
    - 'Um plano a uma distância $r$ do centro é tangente à esfera.'
    corretas: [1, 2, 3, 5, 6]
    espaco: 22
    resolucao: |
      01) $4\pi \cdot 16$. 02) Correta. 04) $2\pi r^2 + \pi r^2$. 08) Incorreta: por 4. 16) O diâmetro é igual à aresta. 32) Toca a esfera num só ponto.
    resposta: 'Soma 55 (01 + 02 + 04 + 16 + 32)'

  - estilo: Fuvest
    enunciado: 'Uma esfera de raio 10 é cortada por planos paralelos.'
    itens:
    - 'Calcule os raios das secções a 6 e a 8 do centro.'
    - 'Calcule as áreas dessas secções.'
    - 'A que distância do centro a secção tem metade da área do círculo máximo?'
    espaco: 62
    resolucao: |
      a) $\sqrt{100 - 36} = 8$ e $\sqrt{100 - 64} = 6$.
      b) $64\pi$ e $36\pi$.
      c) $\pi(100 - d^2) = 50\pi$: $d^2 = 50$, $d = 5\sqrt{2}$.
    resposta: 'a) 8 e 6; b) $64\pi$ e $36\pi$; c) $5\sqrt{2}$'

  - estilo: Unicamp
    enunciado: 'Considere a Terra como uma esfera de 6400 km de raio e use $\pi \approx 3{,}14$.'
    itens:
    - 'Calcule a área da superfície da Terra, em notação científica.'
    - 'Cerca de 71\% dessa superfície é coberta por oceanos. Estime essa área.'
    - 'O raio da Lua é cerca de $\frac{1}{4}$ do raio da Terra. Que fração do volume da Terra tem a Lua?'
    espaco: 62
    resolucao: |
      a) $4 \cdot 3{,}14 \cdot 6400^2 \approx 5{,}1 \cdot 10^8$ km².
      b) $0{,}71 \cdot 5{,}14 \cdot 10^8 \approx 3{,}7 \cdot 10^8$ km².
      c) $\left(\tfrac{1}{4}\right)^3 = \tfrac{1}{64}$.
    resposta: 'a) $\approx 5{,}1 \cdot 10^8$ km²; b) $\approx 3{,}7 \cdot 10^8$ km²; c) $\frac{1}{64}$'

  - estilo: Fuvest
    enunciado: |
      Um cilindro equilátero (altura igual ao diâmetro) tem o mesmo volume de uma esfera de raio $R$. O raio do cilindro é
    opcoes: ['$R$', '$\frac{2R}{3}$', '$R\sqrt[3]{\frac{2}{3}}$', '$R\sqrt{\frac{2}{3}}$', '$\frac{R}{2}$']
    correta: C
    espaco: 22
    resolucao: |
      $\pi \rho^2 \cdot 2\rho = \tfrac{4\pi R^3}{3}$: $\rho^3 = \tfrac{2R^3}{3}$.
    resposta: 'C'

  - estilo: Unesp
    enunciado: 'Um copo cilíndrico de 4 cm de raio interno contém água. Colocam-se nele bolinhas maciças de 1 cm de raio, que afundam.'
    itens:
    - 'Calcule o volume de cada bolinha.'
    - 'Quanto sobe o nível da água com 6 bolinhas?'
    - 'Quantas bolinhas são necessárias para o nível subir 2 cm?'
    espaco: 62
    resolucao: |
      a) $\tfrac{4\pi}{3}$ cm³.
      b) $6 \cdot \tfrac{4\pi}{3} = 8\pi$; $16\pi h = 8\pi$, $h = 0{,}5$ cm.
      c) $16\pi \cdot 2 = 32\pi$; $\tfrac{32\pi}{4\pi/3} = 24$ bolinhas.
    resposta: 'a) $\frac{4\pi}{3}$ cm³; b) 0,5 cm; c) 24'

  - estilo: Fuvest
    enunciado: 'Uma esfera maciça de raio $R$ é derretida e transformada em $n$ esferas iguais.'
    itens:
    - 'Prove que o raio de cada esfera é $\frac{R}{\sqrt[3]{n}}$.'
    - 'Prove que a área total fica multiplicada por $\sqrt[3]{n}$.'
    - 'Para $R = 6$ e $n = 27$, calcule o raio das esferas e a área total delas.'
    espaco: 62
    resolucao: |
      a) $n \cdot \tfrac{4\pi \rho^3}{3} = \tfrac{4\pi R^3}{3}$: $\rho^3 = \tfrac{R^3}{n}$.
      b) $n \cdot 4\pi \tfrac{R^2}{n^{2/3}} = n^{1/3} \cdot 4\pi R^2$.
      c) $\rho = 2$; área $27 \cdot 16\pi = 432\pi$, o triplo de $144\pi$.
    resposta: 'c) 2; $432\pi$'
