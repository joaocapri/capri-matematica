# A26 — Equações e Inequações Exponenciais
aula: A26

fixacao:
  intro: Resolva na ordem — do aquecimento ao desafio. Iguale as bases e compare os expoentes; em inequações com base entre $0$ e $1$, o sinal se inverte.
  secoes:
    - nome: Aquecimento
      questoes:
        - enunciado: Resolva.
          itens:
            - $2^x=32$
            - $3^x=\tfrac19$
            - $5^{x-1}=125$
          resolucao: |
            (a) $2^x=2^5\Rightarrow x=5$. (b) $3^x=3^{-2}\Rightarrow x=-2$. (c) $x-1=3\Rightarrow x=4$.
          resposta: '(a) $5$ \quad (b) $-2$ \quad (c) $4$'

        - enunciado: Resolva $4^x=8$.
          resolucao: |
            Base $2$: $2^{2x}=2^3\Rightarrow x=\tfrac32$.
          resposta: '$x=\tfrac32$'

        - enunciado: Resolva $9^{x+1}=27^x$.
          resolucao: |
            Base $3$: $3^{2x+2}=3^{3x}\Rightarrow 2x+2=3x\Rightarrow x=2$.
          resposta: '$x=2$'

        - enunciado: Resolva $\left(\tfrac12\right)^x=16$.
          resolucao: |
            $2^{-x}=2^4\Rightarrow x=-4$.
          resposta: '$x=-4$'

        - enunciado: Resolva $2^{x^2-3x}=\tfrac14$.
          resolucao: |
            $x^2-3x=-2\Rightarrow x^2-3x+2=0\Rightarrow x=1$ ou $x=2$.
          resposta: '$\{1,\,2\}$'

        - enunciado: Resolva as inequações.
          itens:
            - $2^x>8$
            - $\left(\tfrac13\right)^x\ge9$
          resolucao: |
            (a) Base $>1$, mantém o sinal: $x>3$.
            (b) $\left(\tfrac13\right)^x\ge\left(\tfrac13\right)^{-2}$, base entre $0$ e $1$, inverte: $x\le-2$.
          resposta: '(a) $x>3$ \quad (b) $x\le-2$'

        - enunciado: Resolva $7^{x^2-4}=1$.
          resolucao: |
            $1=7^0$: $x^2-4=0\Rightarrow x=\pm2$.
          resposta: '$\{-2,\,2\}$'

    - nome: Treino
      questoes:
        - enunciado: Resolva $4^x-6\cdot2^x+8=0$.
          resolucao: |
            Com $y=2^x$: $y^2-6y+8=0\Rightarrow y=2$ ou $y=4$. Então $x=1$ ou $x=2$.
          resposta: '$\{1,\,2\}$'

        - enunciado: Resolva $9^x-4\cdot3^x+3=0$.
          resolucao: |
            Com $y=3^x$: $y^2-4y+3=0\Rightarrow y=1$ ou $y=3$. Então $x=0$ ou $x=1$.
          resposta: '$\{0,\,1\}$'

        - enunciado: Resolva $2^{x+1}+2^x=24$.
          resolucao: |
            $2\cdot2^x+2^x=3\cdot2^x=24\Rightarrow 2^x=8\Rightarrow x=3$.
          resposta: '$x=3$'

        - enunciado: Resolva $3^{x+2}-3^x=72$.
          resolucao: |
            $9\cdot3^x-3^x=8\cdot3^x=72\Rightarrow 3^x=9\Rightarrow x=2$.
          resposta: '$x=2$'

        - enunciado: Resolva $5^{2x-1}<5^{x+3}$.
          resolucao: |
            Base $>1$: $2x-1<x+3\Rightarrow x<4$.
          resposta: '$x<4$'

        - enunciado: Resolva $(0{,}5)^{x-2}>(0{,}5)^4$.
          resolucao: |
            Base entre $0$ e $1$, inverte: $x-2<4\Rightarrow x<6$.
          resposta: '$x<6$'

        - enunciado: Resolva $2^{x^2}<16$.
          resolucao: |
            $x^2<4\Rightarrow -2<x<2$.
          resposta: '$]-2,\,2[$'

        - enunciado: Uma população de bactérias é $N(t)=500\cdot2^{t/3}$, com $t$ em horas. A partir de quando ela passa a ter pelo menos $8\,000$ bactérias?
          resolucao: |
            $2^{t/3}\ge16=2^4\Rightarrow \tfrac t3\ge4\Rightarrow t\ge12$ h.
          resposta: '$t\ge12$ h'

    - nome: Desafio
      questoes:
        - enunciado: Resolva $4^x-3\cdot2^x-4=0$.
          resolucao: |
            $y=2^x$: $y^2-3y-4=0\Rightarrow y=4$ ou $y=-1$ (descartado, pois $2^x>0$). Então $x=2$.
          resposta: '$x=2$'

        - enunciado: Resolva $25^x-6\cdot5^x+5\le0$.
          resolucao: |
            $y=5^x$: $y^2-6y+5\le0\Rightarrow 1\le y\le5\Rightarrow 0\le x\le1$.
          resposta: '$[0,\,1]$'

        - enunciado: Resolva $\left(\tfrac12\right)^{x^2-x}\ge\tfrac14$.
          resolucao: |
            $\tfrac14=\left(\tfrac12\right)^2$. Base entre $0$ e $1$, inverte: $x^2-x\le2\Rightarrow -1\le x\le2$.
          resposta: '$[-1,\,2]$'

        - enunciado: Resolva o sistema $\begin{cases}2^{x+y}=32\\ 3^{x-y}=27\end{cases}$
          resolucao: |
            $x+y=5$ e $x-y=3$. Então $x=4$ e $y=1$.
          resposta: '$(4,\,1)$'

        - enunciado: Resolva $3^{x+1}+3^{x-1}=30$.
          resolucao: |
            $3^x\left(3+\tfrac13\right)=\tfrac{10}3\cdot3^x=30\Rightarrow 3^x=9\Rightarrow x=2$.
          resposta: '$x=2$'

vestibular:
  intro: Questões autorais no estilo dos principais vestibulares. Assinale uma única alternativa.
  questoes:
    - enunciado: A solução de $3^{x+1}=81$ é
      opcoes: ['$2$', '$3$', '$4$', '$5$', '$27$']
      correta: B
      resolucao: |
        $81=3^4$: $x+1=4\Rightarrow x=3$.

    - enunciado: A solução de $8^x=\tfrac14$ é
      opcoes: ['$-\dfrac23$', '$-\dfrac32$', '$-2$', '$\dfrac23$', '$-\dfrac12$']
      correta: A
      resolucao: |
        $2^{3x}=2^{-2}\Rightarrow x=-\tfrac23$.

    - enunciado: A soma das soluções de $2^{x^2-5x+6}=1$ é
      opcoes: ['$1$', '$6$', '$-5$', '$0$', '$5$']
      correta: E
      resolucao: |
        $x^2-5x+6=0\Rightarrow x=2$ ou $x=3$. Soma: $5$.

    - enunciado: A soma das soluções de $4^x-5\cdot2^x+4=0$ é
      opcoes: ['$1$', '$4$', '$5$', '$0$', '$2$']
      correta: E
      resolucao: |
        $2^x=1$ ou $2^x=4$: $x=0$ ou $x=2$. Soma: $2$.

    - enunciado: O conjunto solução de $\left(\tfrac12\right)^x>8$ é
      opcoes: ['$x>3$', '$x<3$', '$x>-3$', '$x<-3$', '$x<\tfrac18$']
      correta: D
      resolucao: |
        $2^{-x}>2^3\Rightarrow -x>3\Rightarrow x<-3$.

    - enunciado: O conjunto solução de $3^{2x-1}\le27$ é
      opcoes: ['$x\le1$', '$x\ge2$', '$x\le2$', '$x\le3$', '$x\ge1$']
      correta: C
      resolucao: |
        $2x-1\le3\Rightarrow x\le2$.

    - enunciado: A solução de $5^x+5^{x+1}=150$ é
      opcoes: ['$1$', '$3$', '$5$', '$25$', '$2$']
      correta: E
      resolucao: |
        $5^x(1+5)=150\Rightarrow 5^x=25\Rightarrow x=2$.

    - enunciado: A solução de $9^x=3^{x+4}$ é
      opcoes: ['$1$', '$2$', '$3$', '$4$', '$8$']
      correta: D
      resolucao: |
        $3^{2x}=3^{x+4}\Rightarrow 2x=x+4\Rightarrow x=4$.

    - enunciado: A solução de $2^x\cdot4^x=64$ é
      opcoes: ['$2$', '$1$', '$3$', '$6$', '$8$']
      correta: A
      resolucao: |
        $2^x\cdot2^{2x}=2^{3x}=2^6\Rightarrow x=2$.

    - enunciado: A quantidade de números inteiros $x$ tais que $2<2^x<64$ é
      opcoes: ['$3$', '$4$', '$5$', '$6$', '$62$']
      correta: B
      resolucao: |
        $2^1<2^x<2^6\Rightarrow 1<x<6$: inteiros $2,3,4,5$.

    - enunciado: Uma população de microrganismos é $N(t)=100\cdot3^t$, com $t$ em horas. Ela chega a $8\,100$ após
      opcoes: ['$2$ h', '$3$ h', '$4$ h', '$27$ h', '$81$ h']
      correta: C
      resolucao: |
        $3^t=81=3^4\Rightarrow t=4$.

    - enunciado: O produto das soluções de $25^x-30\cdot5^x+125=0$ é
      opcoes: ['$2$', '$3$', '$5$', '$25$', '$125$']
      correta: A
      resolucao: |
        $5^x=5$ ou $5^x=25$: $x=1$ ou $x=2$. Produto: $2$.

    - enunciado: O conjunto solução de $(0{,}2)^{x-1}\le(0{,}2)^3$ é
      opcoes: ['$x\le4$', '$x\le3$', '$x\ge3$', '$x<4$', '$x\ge4$']
      correta: E
      resolucao: |
        Base entre $0$ e $1$, inverte: $x-1\ge3\Rightarrow x\ge4$.

    - enunciado: A solução de $4^x-2^{x+2}=32$ é
      opcoes: ['$2$', '$3$', '$4$', '$5$', '$8$']
      correta: B
      resolucao: |
        $y=2^x$: $y^2-4y-32=0\Rightarrow y=8$ (ou $-4$, descartado). Então $x=3$.

    - enunciado: O produto das soluções de $2^{x^2}=256$ é
      opcoes: ['$-8$', '$8$', '$-4$', '$0$', '$-16$']
      correta: A
      resolucao: |
        $x^2=8\Rightarrow x=\pm2\sqrt2$. Produto: $-8$.

    - enunciado: A quantidade de números inteiros que satisfazem $\left(\tfrac13\right)^{x^2-4}>1$ é
      opcoes: ['$1$', '$2$', '$3$', '$4$', '$5$']
      correta: C
      resolucao: |
        $1=\left(\tfrac13\right)^0$; base entre $0$ e $1$, inverte: $x^2-4<0\Rightarrow -2<x<2$. Inteiros: $-1,0,1$.

    - enunciado: A população de uma cidade é $P(t)=2000\cdot2^{t/10}$, com $t$ em anos. Ela chegará a $16\,000$ habitantes após
      opcoes: ['$8$ anos', '$10$ anos', '$20$ anos', '$30$ anos', '$80$ anos']
      correta: D
      resolucao: |
        $2^{t/10}=8=2^3\Rightarrow t=30$.

    - enunciado: A solução de $3^{x+1}+3^{x-1}=90$ é
      opcoes: ['$1$', '$2$', '$3$', '$4$', '$9$']
      correta: C
      resolucao: |
        $3^x\left(3+\tfrac13\right)=90\Rightarrow 3^x=27\Rightarrow x=3$.

    - enunciado: A solução de $2^{3x-2}=\sqrt2$ é
      opcoes: ['$\dfrac12$', '$\dfrac23$', '$\dfrac34$', '$\dfrac56$', '$1$']
      correta: D
      resolucao: |
        $3x-2=\tfrac12\Rightarrow 3x=\tfrac52\Rightarrow x=\tfrac56$.

    - enunciado: A quantidade de um medicamento no sangue cai pela metade a cada $4$ horas. Partindo de $400$ mg, a quantidade chega a $25$ mg após
      opcoes: ['$4$ h', '$8$ h', '$12$ h', '$15$ h', '$16$ h']
      correta: E
      resolucao: |
        $400\cdot\left(\tfrac12\right)^{t/4}=25\Rightarrow\left(\tfrac12\right)^{t/4}=\tfrac1{16}=\left(\tfrac12\right)^4\Rightarrow t=16$ h.
