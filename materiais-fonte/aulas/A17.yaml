# Roteiro de gravação da aula A17 — Raízes, discriminante, soma e produto
# Lacunas: {{resposta}}. Respostas conferidas por cálculo.
aula: A17
objetivos:
  - Encontrar os zeros de uma função quadrática
  - Prever quantos zeros existem só olhando o $\Delta$
  - Usar soma e produto para achar raízes de cabeça
  - Ler os zeros no gráfico da parábola

abertura:
  titulo: Quando a bola volta ao chão?
  texto: |
    Uma bola é chutada para cima. A altura dela, em metros, $t$ segundos depois do chute, é
    $h(t)=-5t^2+20t$.
    A bola está no chão quando a altura vale {{zero}}.
  pergunta: Em que instante a bola volta a tocar o chão?

blocos:
  - tipo: teoria
    titulo: O que é zero de uma função
    texto: |
      Os zeros (ou raízes) de $f$ são os valores de $x$ em que {{$f(x)=0$}}.
      No gráfico, são os pontos em que a parábola {{corta o eixo $x$}}.
      Para achar os zeros de $f(x)=ax^2+bx+c$, resolvemos a equação do 2º grau.
    formulas:
      - 'f(x)=0\iff ax^2+bx+c=0'
    dica: Antes de qualquer fórmula, tente {{fatorar}}. Se der, é o caminho mais rápido.

  - tipo: exemplo
    titulo: Zeros por fatoração
    enunciado: Encontre os zeros de $f(x)=x^2-5x+6$ e marque-os no eixo $x$.
    resposta: '$x^2-5x+6=(x-2)(x-3)$, então os zeros são $x=2$ e $x=3$.'

  - tipo: teoria
    titulo: A fórmula resolutiva, passo a passo
    texto: |
      1. Identifique {{$a$, $b$ e $c$}}.
      2. Calcule o discriminante $\Delta$.
      3. Substitua na fórmula e separe os dois sinais.
    formulas:
      - '\Delta={{b^2-4ac}}'
      - 'x=\dfrac{-b\pm\sqrt{\Delta}}{ {{2a}} }'
    atencao: Se $b=-7$, então $-b$ vale {{$+7$}} e $b^2$ vale {{$+49$}}.

  - tipo: exemplo
    titulo: Bhaskara sem tropeçar nos sinais
    enunciado: Encontre os zeros de $f(x)=2x^2-7x+3$.
    resposta: '$a=2,\ b=-7,\ c=3$; $\Delta=49-24=25$; $x=\dfrac{7\pm5}{4}$, logo $x=3$ ou $x=\tfrac12$.'

  - tipo: teoria
    titulo: O delta conta os cortes no eixo x
    texto: |
      O sinal de $\Delta$ diz quantas vezes a parábola toca o eixo $x$.
      $\Delta>0$: {{dois zeros reais}}, a parábola corta o eixo em dois pontos.
      $\Delta=0$: {{um zero real (duplo)}}, a parábola só encosta no eixo.
      $\Delta<0$: {{nenhum zero real}}, a parábola não toca o eixo.
    dica: Desenhe as três situações no quadro ao lado, com $a>0$.

  - tipo: exemplo
    titulo: Quando há dois zeros?
    enunciado: Para que valores de $k$ a função $f(x)=x^2-6x+k$ tem dois zeros reais distintos?
    resposta: '$\Delta=36-4k>0\Rightarrow k<9$.'

  - tipo: teoria
    titulo: Soma e produto, o atalho
    texto: |
      Sendo $x_1$ e $x_2$ os zeros de $f(x)=ax^2+bx+c$, a soma e o produto saem direto dos coeficientes.
      Quando as raízes são inteiras, procure dois números com essa soma e esse produto.
    formulas:
      - 'x_1+x_2={{-\dfrac{b}{a}}}'
      - 'x_1\cdot x_2={{\dfrac{c}{a}}}'
    atencao: A soma é $-b/a$, com {{sinal trocado}}. O produto não troca o sinal.

  - tipo: exemplo
    titulo: Raízes de cabeça
    enunciado: |
      (a) Encontre os zeros de $f(x)=x^2-7x+10$ usando soma e produto.
      (b) Escreva uma função quadrática com $a=1$ cujos zeros sejam $-2$ e $5$.
    resposta: '(a) $S=7$ e $P=10$: os zeros são $2$ e $5$. (b) $S=3$ e $P=-10$: $f(x)=x^2-3x-10$.'

  - tipo: exercicios
    itens:
      - enunciado: Encontre os zeros de $f(x)=x^2-9$.
        resposta: '$x=-3$ e $x=3$.'
      - enunciado: Encontre os zeros de $f(x)=-x^2+4x+5$.
        resposta: '$\Delta=16+20=36$; $x=\dfrac{-4\pm6}{-2}$, logo $x=-1$ ou $x=5$.'

  - tipo: exercicios
    itens:
      - enunciado: Quantos zeros reais tem $f(x)=3x^2-2x+1$?
        resposta: '$\Delta=4-12=-8<0$: nenhum zero real.'
      - enunciado: Calcule a soma e o produto dos zeros de $f(x)=2x^2-8x+6$ e descubra os zeros.
        resposta: '$S=4$ e $P=3$, logo os zeros são $1$ e $3$.'

  - tipo: retorno
    titulo: Quando a bola volta ao chão?
    texto: |
      A altura da bola é $h(t)=-5t^2+20t$. Encontre os zeros de $h$ e explique o que cada um significa.
    resposta: '$-5t(t-4)=0$, então $t=0$ (momento do chute) ou $t=4$. A bola volta ao chão após $4$ segundos.'

resumo:
  - 'Zeros de $f$: os valores de $x$ em que {{$f(x)=0$}}; no gráfico, onde a parábola {{corta o eixo $x$}}.'
  - 'Fórmula resolutiva: $\Delta={{b^2-4ac}}$ e $x=\dfrac{-b\pm\sqrt\Delta}{2a}$.'
  - '$\Delta>0$: {{dois}} zeros reais; $\Delta=0$: {{um (duplo)}}; $\Delta<0$: {{nenhum}}.'
  - 'Soma: $x_1+x_2={{-b/a}}$. Produto: $x_1x_2={{c/a}}$.'
