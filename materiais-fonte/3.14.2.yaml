# Aula 3.14.2 — Polinômios: multiplicidade de raízes
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: multiplicidade lida na forma fatorada; soma das multiplicidades = grau; raiz dupla/tripla por
# divisões sucessivas (Briot); parâmetros para raiz dupla; montar polinômio com multiplicidades dadas; gráfico
# (atravessa em multiplicidade ímpar, encosta em multiplicidade par); estudo de sinal e inequações produto.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. A multiplicidade de uma raiz $r$ é o número de vezes que o fator $x - r$ aparece na forma fatorada. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Considere $P(x) = (x + 3)^2(x - 1)(x - 2)^3$. Complete.'
      itens:
      - 'Multiplicidade da raiz $-3$: {{2}}'
      - 'Multiplicidade da raiz 1: {{1}}'
      - 'Multiplicidade da raiz 2: {{3}}'
      - 'Grau de $P$: {{6}}'
      - '$P(0)$: {{72}}'
      espaco_item: 8
      resolucao: |
        Os expoentes dos fatores dão as multiplicidades; o grau é $2 + 1 + 3 = 6$. $P(0) = 9 \cdot (-1) \cdot (-8) = 72$.
      resposta: '2; 1; 3; 6; 72'
    - enunciado: 'Associe cada polinômio à descrição das suas raízes reais.'
      esquerda:
      - '$(x - 2)^2$'
      - '$x^3 - 6x^2 + 12x - 8$'
      - '$x^2 - 4$'
      - '$x^4 - 4x^2$'
      - '$(x^2 - 4)^2$'
      direita:
      - '2 e $-2$, ambas duplas'
      - '2, tripla'
      - '0 dupla; 2 e $-2$ simples'
      - '2, dupla'
      - '2 e $-2$, ambas simples'
      resolucao: |
        $x^3 - 6x^2 + 12x - 8 = (x - 2)^3$; $x^4 - 4x^2 = x^2(x - 2)(x + 2)$; $(x^2 - 4)^2 = (x - 2)^2(x + 2)^2$.
      resposta: 'De cima para baixo: 5, 2, 4, 1, 3'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'A soma das multiplicidades de todas as raízes complexas de um polinômio é o seu grau.'
      - 'Numa raiz dupla, o gráfico atravessa o eixo $x$.'
      - 'Se $r$ é raiz dupla de $P$, então $(x - r)^2$ divide $P$.'
      - '$x^2(x - 1)$ tem três raízes distintas.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) (F) Encosta e volta: o sinal não muda. (V) (F) Tem duas distintas, 0 (dupla) e 1.
      resposta: V, F, V, F
    - enunciado: 'Complete a tabela.'
      tabela:
        cabecalho: ['Polinômio', 'Raízes distintas', 'Soma das multiplicidades']
        linhas:
        - ['$(x - 1)^2(x + 4)$', '${{2}}$', '${{3}}$']
        - ['$x^3(x - 2)^2$', '${{2}}$', '${{5}}$']
        - ['$(x^2 - 9)^3$', '${{2}}$', '${{6}}$']
        - ['$(x + 1)^4$', '${{1}}$', '${{4}}$']
      resolucao: |
        A soma das multiplicidades é o grau. Em $(x^2 - 9)^3 = (x - 3)^3(x + 3)^3$: duas raízes, cada uma tripla.
      resposta: '2, 3; 2, 5; 2, 6; 1, 4'
    - enunciado: 'Escreva o polinômio de coeficiente dominante 1 e grau 4 que tem 2 como raiz tripla e $-1$ como raiz simples.'
      espaco: 8
      resolucao: |
        $(x - 2)^3(x + 1)$.
      resposta: '$(x - 2)^3(x + 1)$'
    - enunciado: 'Mostre, com o dispositivo de Briot-Ruffini, que 1 é raiz dupla de $x^3 - x^2 - x + 1$ e fatore o polinômio.'
      espaco: 10
      resolucao: |
        $1, -1, -1, 1$ com 1: 1, 0, $-1$, 0. De novo, $1, 0, -1$ com 1: 1, 1, 0. Sobra $x + 1$ (que não se anula em 1): $(x - 1)^2(x + 1)$.
      resposta: '$(x - 1)^2(x + 1)$'
    - enunciado: 'Descreva o gráfico de $P(x) = (x + 1)^2(x - 3)$ perto de $x = -1$ e de $x = 3$, e diga onde $P$ é negativo.'
      espaco: 10
      resolucao: |
        Em $-1$ (dupla), encosta no eixo e volta; em 3 (simples), atravessa. Como $(x + 1)^2 \ge 0$, o sinal é o de $x - 3$: $P < 0$ para $x < 3$, $x \ne -1$.
      resposta: '$P < 0$ para $x < 3$, $x \ne -1$'
  - nome: Nível 2
    questoes:
    - texto: |
        Lara disse que $x^4 - 2x^2 + 1$ tem quatro raízes distintas: $1$, $-1$, $1$ e $-1$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 8
      resolucao: |
        $x^4 - 2x^2 + 1 = (x^2 - 1)^2 = (x - 1)^2(x + 1)^2$: são duas raízes distintas, 1 e $-1$, cada uma dupla.
      resposta: '1 e $-1$, ambas duplas'
    - enunciado: 'Encontre $a$ e $b$ para que 1 seja raiz dupla de $x^3 + ax + b$.'
      espaco: 12
      resolucao: |
        Briot com 1 em $1, 0, a, b$: 1, 1, $1 + a$, $1 + a + b$. De novo com 1 em $1, 1, 1 + a$: 1, 2, $3 + a$. Restos nulos: $a = -3$, $b = 2$. $(x - 1)^2(x + 2)$.
      resposta: '$a = -3$, $b = 2$'
    - enunciado: 'Qual a multiplicidade da raiz 2 em $x^4 - 6x^3 + 12x^2 - 8x$?'
      espaco: 8
      resolucao: |
        $x(x^3 - 6x^2 + 12x - 8) = x(x - 2)^3$: multiplicidade 3.
      resposta: '3'
    - enunciado: 'O gráfico de um polinômio $P$ de grau 3 e coeficiente dominante 1 encosta no eixo $x$ em $x = -2$ e atravessa em $x = 1$. Escreva $P$ desenvolvido.'
      espaco: 8
      resolucao: |
        $P = (x + 2)^2(x - 1) = x^3 + 3x^2 - 4$.
      resposta: '$x^3 + 3x^2 - 4$'
    - enunciado: 'Resolva a inequação $(x - 1)^2(x + 3) < 0$.'
      espaco: 8
      resolucao: |
        $(x - 1)^2 \ge 0$ e se anula em 1. O produto é negativo quando $x + 3 < 0$: $x < -3$.
      resposta: '$x < -3$'
    - enunciado: 'Para $P(x) = x^5 - 2x^4 + x^3$, complete.'
      itens:
      - 'Forma fatorada: {{x^3(x - 1)^2}}'
      - 'Multiplicidade de 0: {{3}}'
      - 'Multiplicidade de 1: {{2}}'
      espaco_item: 8
      resolucao: |
        $x^3(x^2 - 2x + 1) = x^3(x - 1)^2$.
      resposta: '$x^3(x - 1)^2$; 3; 2'
    - enunciado: 'Resolva a inequação $(x - 2)^4(x + 1)^3 > 0$.'
      espaco: 8
      resolucao: |
        $(x - 2)^4 > 0$ para $x \ne 2$, e $(x + 1)^3$ tem o sinal de $x + 1$. Solução: $x > -1$ e $x \ne 2$.
      resposta: '$x > -1$ e $x \ne 2$'
    - enunciado: 'Um polinômio de grau 3 e coeficiente dominante 1 tem 3 como raiz dupla e $P(0) = -18$. Encontre a outra raiz.'
      espaco: 8
      resolucao: |
        $P = (x - 3)^2(x - s)$; $P(0) = 9 \cdot (-s) = -18$: $s = 2$.
      resposta: '2'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que, se $r$ é raiz de multiplicidade exatamente $m$ de $P$, então $(x - r)^m$ divide $P$ e $(x - r)^{m+1}$ não divide.'
      espaco: 10
      resolucao: |
        $P = (x - r)^m Q$ com $Q(r) \ne 0$. Se $(x - r)^{m+1}$ dividisse $P$, cancelando $(x - r)^m$ teríamos $x - r$ dividindo $Q$, e $Q(r) = 0$: contradição.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que, numa raiz $r$ de multiplicidade par, o polinômio não muda de sinal ao passar por $r$.'
      espaco: 10
      resolucao: |
        $P = (x - r)^{2k}Q$ com $Q(r) \ne 0$. Perto de $r$, $Q$ tem o sinal de $Q(r)$, e $(x - r)^{2k} > 0$ dos dois lados: o sinal de $P$ é o mesmo antes e depois de $r$.
      resposta: 'Ver resolução'
    - enunciado: 'Sendo $P = (x - r)Q$, prove que $r$ é raiz pelo menos dupla de $P$ se, e somente se, $Q(r) = 0$.'
      espaco: 10
      resolucao: |
        Se $Q(r) = 0$, $Q = (x - r)Q_2$ e $P = (x - r)^2 Q_2$. Se $P = (x - r)^2 S$, então $(x - r)Q = (x - r)^2 S$, logo $Q = (x - r)S$ e $Q(r) = 0$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que, se $r$ tem multiplicidade $m$ em $P$ e multiplicidade $k$ em $Q$, então tem multiplicidade $m + k$ em $P \cdot Q$.'
      espaco: 10
      resolucao: |
        $P = (x - r)^m A$ e $Q = (x - r)^k B$, com $A(r), B(r) \ne 0$. $PQ = (x - r)^{m+k}AB$ e $(AB)(r) = A(r)B(r) \ne 0$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que o polinômio de grau 5, coeficiente dominante 2, com 0 como raiz tripla e 1 como raiz dupla é $2x^5 - 4x^4 + 2x^3$.'
      espaco: 8
      resolucao: |
        $2x^3(x - 1)^2 = 2x^3(x^2 - 2x + 1) = 2x^5 - 4x^4 + 2x^3$.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Num software de gráficos, um estudante desenhou um polinômio de grau 4 e coeficiente dominante 1. Ele observou que o gráfico, mostrado na figura, encosta no eixo $x$ em $x = -2$, sem atravessá-lo, e atravessa o eixo em $x = 1$ e em $x = 3$. Agora ele quer a expressão do polinômio.
    figura:
      tikz: |
        \begin{scope}[scale=.7]
        \draw[mudo, ->] (-3.3,0) -- (3.9,0) node[right, font=\scriptsize] {$x$};
        \draw[mudo, ->] (0,-1.1) -- (0,1.7) node[above, font=\scriptsize] {$y$};
        \draw[roxo, line width=1pt, domain=-3:3.4, samples=70] plot (\x, {0.05*(\x+2)*(\x+2)*(\x-1)*(\x-3)});
        \foreach \t in {-2, 1, 3} \fill[ink] (\t,0) circle (1.5pt) node[below, font=\scriptsize] {$\t$};
        \end{scope}
    enunciado: |
      O polinômio desenhado é
    opcoes: ['$(x + 2)^2(x - 1)(x - 3)$', '$(x - 2)^2(x + 1)(x + 3)$', '$(x + 2)(x - 1)^2(x - 3)$', '$(x + 2)(x - 1)(x - 3)$', '$(x + 2)^3(x - 1)(x - 3)$']
    correta: A
    resolucao: |
      Encostar em $-2$ indica multiplicidade par; atravessar em 1 e 3, ímpar. Com grau 4: $(x + 2)^2(x - 1)(x - 3)$.

  - estilo: Fuvest
    enunciado: |
      A multiplicidade da raiz 1 no polinômio $(x^2 - 1)^3(x - 1)$ é
    opcoes: ['$3$', '$4$', '$1$', '$6$', '$7$']
    correta: B
    resolucao: |
      $(x - 1)^3(x + 1)^3(x - 1) = (x - 1)^4(x + 1)^3$.

  - estilo: Unicamp
    enunciado: |
      O número de raízes distintas de $x^4 - 8x^2 + 16$ é
    opcoes: ['$4$.', '$1$.', '$2$.', '$0$.']
    correta: C
    resolucao: |
      $(x^2 - 4)^2 = (x - 2)^2(x + 2)^2$.

  - estilo: UEM
    enunciado: |
      Considere $P(x) = x^4 - 4x^3 + 4x^2$. Assinale o que for correto.
    proposicoes:
    - '0 é raiz dupla de $P$.'
    - '2 é raiz dupla de $P$.'
    - 'O grau de $P$ é 4.'
    - '$P(x) \ge 0$ para todo $x$ real.'
    - 'O gráfico de $P$ atravessa o eixo $x$ em $x = 2$.'
    - '$P(1) = 1$.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      $P = x^2(x - 2)^2 = [x(x - 2)]^2$. 08) É um quadrado. 16) Incorreta: raiz dupla, o gráfico encosta. 32) $1 \cdot 1$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      Um engenheiro estuda a função $P(x) = (x - 1)^2(x - 4)$ no intervalo de $x = 0$ a $x = 5$ e montou o quadro com alguns valores. Ele quer descrever em quais pontos desse intervalo a função assume valores negativos.
    tabela:
      cabecalho: ['$x$', '$0$', '$1$', '$2$', '$3$', '$4$', '$5$']
      linhas:
      - ['$P(x)$', '$-4$', '$0$', '$-2$', '$-4$', '$0$', '$16$']
    enunciado: |
      No intervalo estudado, $P(x) < 0$ exatamente para
    opcoes: ['$x < 1$', '$1 < x < 4$', '$x > 4$', '$x < 4$ e $x \ne 1$', '$x \ne 1$ e $x \ne 4$']
    correta: D
    resolucao: |
      $(x - 1)^2 \ge 0$, nulo em 1; o sinal é o de $x - 4$. Em 1 (raiz dupla) o gráfico só encosta no eixo.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir, sobre multiplicidade de raízes.
    afirmativas:
    - 'A soma das multiplicidades de todas as raízes complexas é o grau do polinômio.'
    - 'Numa raiz dupla, o gráfico atravessa o eixo $x$.'
    - 'Se 3 é raiz dupla de $P$, então $(x - 3)^2$ divide $P$.'
    - 'Numa raiz de multiplicidade ímpar, o gráfico atravessa o eixo $x$.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'I e III, apenas.', 'II e IV, apenas.', 'II, III e IV, apenas.', 'I, III e IV, apenas.']
    correta: E
    resolucao: |
      I. Correta. II. Incorreta: encosta. III. Correta. IV. Correta.

  - estilo: Unesp
    enunciado: |
      Um polinômio tem 2 como raiz tripla, $-1$ como raiz dupla e 0 como raiz simples. O menor grau possível desse polinômio é
    opcoes: ['$6$', '$3$', '$5$', '$4$', '$7$']
    correta: A
    resolucao: |
      $3 + 2 + 1 = 6$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      A figura mostra o gráfico de um polinômio $P$ de grau 3 e coeficiente dominante 1, que encosta no eixo $x$ em $x = 1$ e o atravessa em $x = -2$.
    figura:
      tikz: |
        \begin{scope}[scale=.7]
        \draw[mudo, ->] (-2.8,0) -- (2.3,0) node[right, font=\scriptsize] {$x$};
        \draw[mudo, ->] (0,-0.9) -- (0,1.6) node[above, font=\scriptsize] {$y$};
        \draw[roxo, line width=1pt, domain=-2.3:1.95, samples=60] plot (\x, {0.25*(\x-1)*(\x-1)*(\x+2)});
        \foreach \t in {-2, 1} \fill[ink] (\t,0) circle (1.5pt) node[below, font=\scriptsize] {$\t$};
        \end{scope}
    enunciado: |
      O valor de $P(0)$ é
    opcoes: ['$-2$.', '$2$.', '$4$.', '$1$.']
    correta: B
    resolucao: |
      $P = (x - 1)^2(x + 2)$: $P(0) = 1 \cdot 2 = 2$.

  - estilo: Fuvest
    enunciado: |
      Para que 2 seja raiz dupla de $x^3 + ax^2 + b$, o valor de $a + b$ deve ser
    opcoes: ['$-1$', '$7$', '$1$', '$4$', '$-3$']
    correta: C
    resolucao: |
      Briot com 2: 1, $2 + a$, $4 + 2a$, $8 + 4a + b$. De novo: 1, $4 + a$, $12 + 4a$. Restos nulos: $a = -3$, $b = 4$. ($P = (x - 2)^2(x + 1)$.)

  - estilo: UFSC
    enunciado: |
      Considere $P(x) = (x + 1)^3(x - 3)^2$. Assinale o que for correto.
    proposicoes:
    - 'O grau de $P$ é 5.'
    - '$-1$ é raiz tripla de $P$.'
    - '3 é raiz dupla de $P$.'
    - 'O gráfico de $P$ atravessa o eixo $x$ em $x = -1$.'
    - 'O gráfico de $P$ encosta no eixo $x$ em $x = 3$, sem atravessá-lo.'
    - '$P(0) = -9$.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) $3 + 2$. 02) e 04) Expoentes. 08) Multiplicidade ímpar. 16) Multiplicidade par. 32) Incorreta: $1 \cdot 9 = 9$.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      A altura de um drone, em metros, durante um teste de $t = 0$ a $t = 6$ segundos, é modelada por $h(t) = t(t - 4)^2$. O engenheiro notou que $h(4) = 0$ e quer interpretar o que acontece com o drone nesse instante, usando a multiplicidade da raiz 4.
    enunciado: |
      No instante $t = 4$ s, o drone
    opcoes: ['toca o solo e volta a subir, pois 4 é raiz dupla.', 'atravessa o nível do solo, pois 4 é raiz simples.', 'fica abaixo do solo logo depois, pois 4 é raiz dupla.', 'está no ponto mais alto do voo.', 'decola pela primeira vez.']
    correta: A
    resolucao: |
      Raiz dupla: $h$ se anula sem mudar de sinal. Como $h \ge 0$ perto de 4, o drone encosta no solo e volta a subir.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'Em $(x - 2)^2(x + 1)$, o número 2 é raiz dupla.'
    - 'O polinômio $x^3$ tem três raízes distintas.'
    - 'As raízes 1 e $-1$ de $x^4 - 1$ são simples.'
    - 'Numa raiz dupla, o gráfico encosta no eixo $x$ sem atravessá-lo.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – F – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – V – F.', 'V – F – V – V.']
    correta: E
    resolucao: |
      (V) (F) Só 0, tripla. (V) $x^4 - 1 = (x - 1)(x + 1)(x^2 + 1)$. (V)

  - estilo: Enem
    texto: |
      Um professor escreveu cinco polinômios no quadro e pediu aos alunos que indicassem aquele em que o número 2 é raiz tripla. Para isso, eles podem fatorar cada polinômio ou fazer divisões sucessivas por $x - 2$ e contar quantas são exatas.
    tabela:
      cabecalho: ['Nome', 'Polinômio']
      linhas:
      - ['T1', '$(x - 2)(x^2 - 4)$']
      - ['T2', '$(x^2 - 4x + 4)(x + 2)$']
      - ['T3', '$x^3 - 8$']
      - ['T4', '$x^3 - 6x^2 + 12x - 8$']
      - ['T5', '$(x - 2)(x^2 + 4)$']
    enunciado: |
      O polinômio em que 2 é raiz tripla é
    opcoes: ['T1.', 'T2.', 'T3.', 'T4.', 'T5.']
    correta: D
    resolucao: |
      T1 e T2: $(x - 2)^2(x + 2)$, dupla. T3 e T5: simples. T4: $(x - 2)^3$.

  - estilo: Unesp
    enunciado: |
      A soma das multiplicidades de todas as raízes complexas de $(x^2 + 1)^2(x - 5)^3$ é
    opcoes: ['$5$', '$7$', '$3$', '$6$', '$2$']
    correta: B
    resolucao: |
      É o grau: $4 + 3 = 7$ ($i$ e $-i$ são duplas, 5 é tripla).

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Considere $P(x) = x^4 - 2x^3 + 2x - 1$. Assinale o que for correto.
    proposicoes:
    - '1 é raiz tripla de $P$.'
    - '$-1$ é raiz simples de $P$.'
    - '$P(0) = -1$.'
    - 'O grau de $P$ é 4.'
    - 'Todas as raízes de $P$ são distintas.'
    - '$P(2) = 3$.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      Briot com 1 três vezes: o quociente final é $x + 1$, e $P = (x - 1)^3(x + 1)$. 16) Incorreta. 32) $1 \cdot 3$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Unicamp
    enunciado: |
      O conjunto solução de $(x - 2)^4(x + 1)^3 > 0$ é
    opcoes: ['$x > -1$ e $x \ne 2$.', '$x > 2$.', '$-1 < x < 2$.', '$x < -1$.']
    correta: A
    resolucao: |
      O fator de expoente par é positivo fora de 2; o sinal é o de $x + 1$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Num trabalho de grupo, os alunos receberam o polinômio $P(x) = x^4 - 6x^3 + 9x^2$ e deviam descrever as suas raízes, com multiplicidades, e o seu sinal. Eles começaram colocando $x^2$ em evidência e reconhecendo um quadrado perfeito no que sobrou.
    enunciado: |
      As raízes de $P$ são
    opcoes: ['0 simples e 3 tripla.', '0 e 3, ambas simples.', '0 e 3, ambas duplas.', '3 dupla, apenas.', '0 dupla e 3 simples.']
    correta: C
    resolucao: |
      $x^2(x^2 - 6x + 9) = x^2(x - 3)^2$.

  - estilo: Unesp
    enunciado: |
      $P(x) < 0$ para
    opcoes: ['$0 < x < 3$', '$x < 0$', '$x > 3$', 'nenhum valor real de $x$', '$x \ne 0$ e $x \ne 3$']
    correta: D
    resolucao: |
      $P = [x(x - 3)]^2 \ge 0$ para todo $x$.

  - estilo: Fuvest
    enunciado: |
      Um polinômio $P$ de grau 3 e coeficiente dominante 1 tem $-1$ como raiz dupla e $P(1) = 12$. A terceira raiz de $P$ é
    opcoes: ['$2$', '$1$', '$-1$', '$3$', '$-2$']
    correta: E
    resolucao: |
      $P = (x + 1)^2(x - s)$; $P(1) = 4(1 - s) = 12$: $s = -2$.

  - estilo: Unesp
    texto: |
      A figura mostra o gráfico de um polinômio $P$ de grau 4 e coeficiente dominante 1, que encosta no eixo $x$ em $x = 0$ e o atravessa em $x = -1$ e em $x = 2$.
    figura:
      tikz: |
        \begin{scope}[scale=.75]
        \draw[mudo, ->] (-1.8,0) -- (2.8,0) node[right, font=\scriptsize] {$x$};
        \draw[mudo, ->] (0,-1.1) -- (0,1.3) node[above, font=\scriptsize] {$y$};
        \draw[roxo, line width=1pt, domain=-1.25:2.3, samples=70] plot (\x, {0.35*\x*\x*(\x+1)*(\x-2)});
        \foreach \t in {-1, 2} \fill[ink] (\t,0) circle (1.5pt) node[below, font=\scriptsize] {$\t$};
        \end{scope}
    enunciado: |
      O valor de $P(1)$ é
    opcoes: ['$2$', '$-2$', '$0$', '$-1$', '$1$']
    correta: B
    resolucao: |
      $P = x^2(x + 1)(x - 2)$: $P(1) = 1 \cdot 2 \cdot (-1) = -2$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Procuram-se os valores de $k$ para os quais $x^3 - 3x + k$ tem uma raiz dupla.'
    itens:
    - 'Escrevendo $x^3 - 3x + k = (x - r)^2(x - s)$, compare coeficientes e prove que $s = -2r$ e $r^2 = 1$.'
    - 'Encontre os possíveis valores de $k$.'
    - 'Fatore o polinômio em cada caso.'
    espaco: 62
    resolucao: |
      a) $(x - r)^2(x - s) = x^3 - (2r + s)x^2 + (r^2 + 2rs)x - r^2 s$. Sem termo em $x^2$: $s = -2r$. Coeficiente de $x$: $r^2 - 4r^2 = -3$, $r^2 = 1$.
      b) $k = -r^2 s = 2r^3$: $k = 2$ ($r = 1$) ou $k = -2$ ($r = -1$).
      c) $x^3 - 3x + 2 = (x - 1)^2(x + 2)$; $x^3 - 3x - 2 = (x + 1)^2(x - 2)$.
    resposta: 'b) $k = \pm 2$'

  - estilo: Unicamp
    enunciado: 'Considere $P(x) = x^3 - 5x^2 + 8x + m$.'
    itens:
    - 'Encontre $m$ para que 2 seja raiz de $P$.'
    - 'Com esse $m$, mostre que 2 é raiz dupla.'
    - 'Verifique se 2 é raiz tripla e fatore $P$.'
    espaco: 62
    resolucao: |
      a) $8 - 20 + 16 + m = 0$: $m = -4$.
      b) Briot com 2: 1, $-3$, 2, 0. Em $1, -3, 2$ com 2: 1, $-1$, 0. Exata de novo: dupla.
      c) Sobra $x - 1$, que não se anula em 2: não é tripla. $P = (x - 2)^2(x - 1)$.
    resposta: 'a) $m = -4$; c) $(x - 2)^2(x - 1)$'

  - estilo: ITA
    enunciado: |
      A soma dos valores de $m$ para os quais $x^3 - 6x^2 + 9x + m$ tem uma raiz dupla é
    opcoes: ['$-4$', '$4$', '$0$', '$-8$', '$8$']
    correta: A
    resolucao: |
      Com $(x - r)^2(x - s)$: $2r + s = 6$ e $r^2 + 2rs = 9$, logo $r^2 - 4r + 3 = 0$, $r = 1$ ou $r = 3$. $m = -r^2 s$: $-4$ ($r = 1$, $s = 4$) ou $0$ ($r = 3$, $s = 0$). Soma $-4$.
    espaco: 22
    resposta: 'A'

  - estilo: Unesp
    texto: |
      A altura de um drone, em metros, num teste de $t = 0$ a $t = 6$ segundos, é $h(t) = t(t - 4)^2$.
    enunciado: ''
    itens:
    - 'Dê as raízes de $h$ e as suas multiplicidades.'
    - 'Prove que $h(t) \ge 0$ no intervalo do teste e interprete o instante $t = 4$.'
    - 'Calcule a altura em $t = 2$ s e em $t = 6$ s.'
    espaco: 62
    resolucao: |
      a) 0 (simples) e 4 (dupla).
      b) $t \ge 0$ e $(t - 4)^2 \ge 0$. Em $t = 4$, a raiz dupla indica que o drone toca o solo e volta a subir.
      c) $h(2) = 2 \cdot 4 = 8$ m; $h(6) = 6 \cdot 4 = 24$ m.
    resposta: 'c) 8 m e 24 m'

  - estilo: UFSC
    enunciado: |
      Considere multiplicidades de raízes. Assinale o que for correto.
    proposicoes:
    - 'A soma das multiplicidades de todas as raízes complexas de um polinômio é o seu grau.'
    - 'O gráfico de $(x - 3)^4$ encosta no eixo $x$ em $x = 3$.'
    - '$x^3 - 3x + 2$ tem 1 como raiz dupla.'
    - 'A multiplicidade de 0 em $x^2(x + 1)$ é 2.'
    - '$(x - 1)^3 \ge 0$ para todo $x$ real.'
    - '1 é raiz de multiplicidade 4 de $(x^2 - 2x + 1)^2$.'
    corretas: [1, 2, 3, 4, 6]
    espaco: 22
    resolucao: |
      01) Correta. 02) Expoente par. 04) $(x - 1)^2(x + 2)$. 08) Correta. 16) Incorreta: é negativo para $x < 1$. 32) $[(x - 1)^2]^2$.
    resposta: 'Soma 47 (01 + 02 + 04 + 08 + 32)'

  - estilo: Fuvest
    enunciado: 'Considere a inequação $(x + 2)^3(x - 1)^2(x - 4) \le 0$.'
    itens:
    - 'Dê as raízes do primeiro membro e as suas multiplicidades.'
    - 'Monte o quadro de sinais, lembrando o que acontece em raízes de multiplicidade par e ímpar.'
    - 'Resolva a inequação.'
    espaco: 62
    resolucao: |
      a) $-2$ (tripla), 1 (dupla), 4 (simples).
      b) Para $x > 4$, positivo. O sinal troca em 4 e em $-2$ (multiplicidades ímpares) e não troca em 1. Fica: positivo para $x < -2$, negativo em $(-2, 4)$ (nulo em 1), positivo para $x > 4$.
      c) $-2 \le x \le 4$.
    resposta: 'c) $-2 \le x \le 4$'

  - estilo: Unicamp
    enunciado: 'O gráfico de um polinômio $P$ de grau 4 e coeficiente dominante 1 encosta no eixo $x$ em $x = 1$ e o atravessa em $x = -1$ e em $x = 3$.'
    itens:
    - 'Escreva $P$ na forma fatorada.'
    - 'Calcule $P(0)$ e $P(2)$.'
    - 'Para quais $x$ o polinômio é negativo?'
    espaco: 62
    resolucao: |
      a) $(x - 1)^2(x + 1)(x - 3)$.
      b) $P(0) = 1 \cdot 1 \cdot (-3) = -3$; $P(2) = 1 \cdot 3 \cdot (-1) = -3$.
      c) O sinal é o de $(x + 1)(x - 3)$ fora de 1: negativo para $-1 < x < 3$, $x \ne 1$.
    resposta: 'b) $-3$ e $-3$; c) $-1 < x < 3$ e $x \ne 1$'

  - estilo: Fuvest
    enunciado: |
      A multiplicidade da raiz $-1$ no polinômio $x^5 + 3x^4 + 3x^3 + x^2$ é
    opcoes: ['$1$', '$2$', '$3$', '$4$', '$5$']
    correta: C
    espaco: 22
    resolucao: |
      $x^2(x^3 + 3x^2 + 3x + 1) = x^2(x + 1)^3$.
    resposta: 'C'

  - estilo: Unesp
    enunciado: 'Sejam $P(x) = (x - 1)^2(x + 2)$ e $Q(x) = (x - 1)(x - 3)$.'
    itens:
    - 'Dê a multiplicidade de 1 em $P \cdot Q$.'
    - 'Dê as raízes de $P^2$ com as multiplicidades.'
    - 'Escreva o polinômio de menor grau, com coeficiente dominante 1, que é divisível por $P$ e por $Q$.'
    espaco: 62
    resolucao: |
      a) $2 + 1 = 3$.
      b) 1 (multiplicidade 4) e $-2$ (multiplicidade 2).
      c) Precisa ter 1 com multiplicidade 2, $-2$ e 3: $(x - 1)^2(x + 2)(x - 3)$.
    resposta: 'a) 3; b) 1 (4) e $-2$ (2); c) $(x - 1)^2(x + 2)(x - 3)$'

  - estilo: Fuvest
    enunciado: 'Considere polinômios da forma $x^4 + ax^2 + b$.'
    itens:
    - 'Encontre $a$ e $b$ para que 1 e $-1$ sejam raízes duplas.'
    - 'Prove que $x^4 - 2c^2x^2 + c^4$, com $c \ne 0$, tem $c$ e $-c$ como raízes duplas.'
    - 'Descreva o gráfico de $x^4 - 8x^2 + 16$ perto das suas raízes.'
    espaco: 62
    resolucao: |
      a) $(x - 1)^2(x + 1)^2 = (x^2 - 1)^2 = x^4 - 2x^2 + 1$: $a = -2$, $b = 1$.
      b) $(x^2 - c^2)^2 = (x - c)^2(x + c)^2$.
      c) $c = 2$: o gráfico encosta no eixo em $x = 2$ e em $x = -2$, sem atravessar; o polinômio nunca é negativo.
    resposta: 'a) $a = -2$, $b = 1$'
