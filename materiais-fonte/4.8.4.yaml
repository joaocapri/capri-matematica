# Aula 4.8.4 — Geometria plana: comprimento da circunferência e de arcos
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: C = 2πr = πd; comprimento de arco em graus e em radianos (ℓ = rθ); voltas de rodas; engrenagens e polias
# (o contato percorre o mesmo comprimento); pistas de atletismo (diferença entre raias); ponteiros de relógio; perímetros de
# figuras com arcos (setor, triângulo de Reuleaux); correias; Eratóstenes; corda em volta da Terra; moedas que rolam.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Deixe as respostas em função de $\pi$, salvo indicação. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Complete o quadro.'
      tabela:
        cabecalho: ['Raio', 'Diâmetro', 'Comprimento']
        linhas:
        - ['$4$', '${{8}}$', '${{8\pi}}$']
        - ['${{7{,}5}}$', '$15$', '${{15\pi}}$']
        - ['$2{,}5$', '${{5}}$', '${{5\pi}}$']
        - ['${{9}}$', '${{18}}$', '$18\pi$']
      resolucao: |
        $C = 2\pi r = \pi d$.
      resposta: '$8, 8\pi$; $7{,}5, 15\pi$; $5, 5\pi$; $9, 18$'
    - enunciado: 'Numa circunferência de raio 12, associe cada arco ao seu comprimento.'
      esquerda:
      - 'arco de $90°$'
      - 'arco de $60°$'
      - 'arco de $30°$'
      - 'arco de $150°$'
      - 'arco de 1 radiano'
      direita:
      - '$2\pi$'
      - '$12$'
      - '$6\pi$'
      - '$10\pi$'
      - '$4\pi$'
      resolucao: |
        A circunferência mede $24\pi$: $\tfrac{1}{4}$, $\tfrac{1}{6}$, $\tfrac{1}{12}$ e $\tfrac{5}{12}$ dela. Em radianos, $\ell = r\theta = 12$.
      resposta: 'De cima para baixo: 3, 5, 1, 4, 2'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Dobrando o raio, o comprimento da circunferência dobra.'
      - 'A razão entre o comprimento e o diâmetro é a mesma para todas as circunferências.'
      - 'Um arco de 1 radiano tem comprimento igual ao raio.'
      - 'O comprimento de um arco é medido em unidades quadradas, como cm².'
      justificar: true
      espaco: 20
      resolucao: |
        (V) $2\pi(2r) = 2 \cdot 2\pi r$. (V) É $\pi$. (V) $\ell = r \cdot 1$. (F) É um comprimento: cm, m.
      resposta: V, V, V, F
    - enunciado: 'Uma roda de bicicleta tem 60 cm de diâmetro. Complete, usando $\pi \approx 3{,}14$ quando necessário.'
      itens:
      - 'Comprimento de uma volta: {{60\pi}} cm'
      - 'Valor aproximado de uma volta: {{188{,}4}} cm'
      - 'Número de voltas para percorrer 471 m: {{250}}'
      espaco_item: 10
      resolucao: |
        $C = 60\pi \approx 188{,}4$ cm. $\tfrac{47\,100}{188{,}4} = 250$ voltas.
      resposta: '$60\pi$; 188,4; 250'
    - enunciado: 'Calcule o comprimento do arco e o perímetro do setor circular da figura, de raio 9 e ângulo central $80°$.'
      figura:
        tikz: |
          \begin{scope}[scale=.16]
          \fill[lilas!35] (0,0) -- (9,0) arc (0:80:9) -- cycle;
          \draw[ink, line width=1pt] (0,0) -- (9,0) arc (0:80:9) -- cycle;
          \draw[mudo] (2,0) arc (0:80:2);
          \node[font=\scriptsize] at (40:3.4) {$80°$};
          \node[below, font=\scriptsize] at (4.5,0) {$9$};
          \end{scope}
      espaco: 8
      resolucao: |
        $\ell = \tfrac{80}{360} \cdot 18\pi = 4\pi$. Perímetro: $18 + 4\pi$.
      resposta: '$4\pi$; $18 + 4\pi$'
    - enunciado: 'Num círculo de raio 6, um arco mede $5\pi$. Calcule o ângulo central em graus.'
      espaco: 8
      resolucao: |
        $\tfrac{\alpha}{360} \cdot 12\pi = 5\pi$: $\alpha = 150°$.
      resposta: '$150°$'
    - enunciado: 'Um arco de 14 cm está numa circunferência de raio 4 cm. Calcule o ângulo central em radianos.'
      espaco: 8
      resolucao: |
        $\theta = \tfrac{\ell}{r} = \tfrac{14}{4} = 3{,}5$ rad.
      resposta: '3,5 rad'
  - nome: Nível 2
    questoes:
    - texto: |
        Para o comprimento de uma circunferência de diâmetro 8, Duda fez $2\pi \cdot 8 = 16\pi$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 10
      resolucao: |
        A fórmula $2\pi r$ usa o raio, 4: $C = 8\pi$ (ou $\pi d$).
      resposta: '$8\pi$'
    - enunciado: 'Numa pista, as curvas são semicircunferências. Na raia interna, o raio é 36 m; na vizinha, 37,2 m. Quantos metros a mais percorre, numa volta completa, o atleta da raia externa? ($\pi \approx 3{,}14$)'
      espaco: 12
      resolucao: |
        As retas são iguais; nas duas curvas (uma circunferência inteira), a diferença é $2\pi(37{,}2 - 36) = 2{,}4\pi \approx 7{,}54$ m.
      resposta: '$2{,}4\pi \approx 7{,}54$ m'
    - enunciado: 'Duas polias, de diâmetros 30 cm e 12 cm, estão ligadas por uma correia. A maior gira a 100 voltas por minuto. A quantas voltas por minuto gira a menor?'
      espaco: 10
      resolucao: |
        A correia percorre o mesmo comprimento nas duas: $100 \cdot 30\pi = n \cdot 12\pi$, $n = 250$.
      resposta: '250'
    - enunciado: 'Uma figura é formada por um quadrado de lado 10 e um semicírculo construído para fora sobre um dos lados. Calcule o perímetro.'
      espaco: 8
      resolucao: |
        Três lados do quadrado e meia circunferência de raio 5: $30 + 5\pi$.
      resposta: '$30 + 5\pi$'
    - enunciado: 'A circunferência da Terra mede cerca de 40 000 km. Complete o quadro com o comprimento do arco de meridiano correspondente a cada ângulo central.'
      tabela:
        cabecalho: ['Ângulo central', 'Arco (km)']
        linhas:
        - ['$90°$', '${{10\,000}}$']
        - ['$45°$', '${{5\,000}}$']
        - ['$9°$', '${{1\,000}}$']
        - ['$1°$', 'cerca de ${{111}}$']
      resolucao: |
        Arco $= \tfrac{\alpha}{360} \cdot 40\,000$. Para $1°$: $\tfrac{40\,000}{360} \approx 111$ km.
      resposta: '10 000; 5 000; 1 000; 111'
    - enunciado: 'O ponteiro dos minutos de um relógio mede 15 cm. Que distância percorre a sua ponta em 20 minutos?'
      espaco: 8
      resolucao: |
        Em 20 min, $\tfrac{1}{3}$ de volta: $\tfrac{30\pi}{3} = 10\pi$ cm.
      resposta: '$10\pi$ cm'
    - enunciado: 'Numa circunferência de raio 6, uma corda determina um arco de $60°$. Compare o comprimento da corda com o do arco ($\pi \approx 3{,}14$).'
      espaco: 10
      resolucao: |
        O triângulo formado com o centro é equilátero: corda 6. Arco $\tfrac{12\pi}{6} = 2\pi \approx 6{,}28$, um pouco maior que a corda.
      resposta: 'corda 6; arco $2\pi \approx 6{,}28$'
    - enunciado: 'Quantas voltas dá uma roda de 70 cm de diâmetro para percorrer 1,1 km? Use $\pi \approx \frac{22}{7}$.'
      espaco: 10
      resolucao: |
        $C = \tfrac{22}{7} \cdot 70 = 220$ cm. $\tfrac{110\,000}{220} = 500$ voltas.
      resposta: '500'
  - nome: Nível 3
    questoes:
    - enunciado: 'Mostre que o comprimento de um arco de ângulo central $\theta$, em radianos, numa circunferência de raio $r$, é $\ell = r\theta$.'
      espaco: 12
      resolucao: |
        O comprimento do arco é proporcional ao ângulo. A volta inteira, $2\pi$ rad, mede $2\pi r$: $\ell = \tfrac{\theta}{2\pi} \cdot 2\pi r = r\theta$.
      resposta: 'Ver resolução'
    - enunciado: 'Duas polias iguais, de raio 10 cm, têm os centros a 50 cm de distância e estão ligadas por uma correia aberta. Calcule o comprimento da correia.'
      espaco: 12
      resolucao: |
        Os trechos retos são paralelos à linha dos centros e medem 50 cm cada. Cada polia é abraçada em meia volta: dois arcos de $10\pi$. Total: $100 + 20\pi$ cm.
      resposta: '$100 + 20\pi$ cm'
    - enunciado: 'Uma corda justa envolve o equador da Terra. Aumentando o seu comprimento em 2 m e mantendo-a circular e concêntrica, a que altura do chão ela fica? Mostre que a resposta não depende do raio da Terra.'
      espaco: 12
      resolucao: |
        $2\pi(R + h) = 2\pi R + 2$: $h = \tfrac{2}{2\pi} = \tfrac{1}{\pi} \approx 0{,}32$ m. O raio $R$ se cancela.
      resposta: '$\frac{1}{\pi} \approx 0{,}32$ m'
    - enunciado: 'O triângulo de Reuleaux é formado por três arcos de circunferência de raio $a$, com centros nos vértices de um triângulo equilátero de lado $a$, cada um ligando os outros dois vértices. Calcule o perímetro e compare com o de uma circunferência de diâmetro $a$.'
      espaco: 12
      resolucao: |
        Cada arco tem $60°$: $\tfrac{2\pi a}{6} = \tfrac{\pi a}{3}$. Perímetro $\pi a$, igual ao de uma circunferência de diâmetro $a$.
      resposta: '$\pi a$; iguais'
    - enunciado: 'Eratóstenes observou que, ao meio-dia, os raios de Sol formavam ângulo de $7{,}2°$ com a vertical em Alexandria e ficavam verticais em Siena, a cerca de 800 km ao sul. Estime a circunferência da Terra.'
      espaco: 12
      resolucao: |
        Os raios de Sol são paralelos: o ângulo central entre as cidades é $7{,}2°$, que é $\tfrac{1}{50}$ de $360°$. Circunferência $\approx 50 \cdot 800 = 40\,000$ km.
      resposta: '40 000 km'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Numa bicicleta, a coroa (presa aos pedais) tem 48 dentes e a catraca (presa à roda traseira) tem 16 dentes, ligadas pela corrente. A roda tem 66 cm de diâmetro. A cada volta completa dos pedais, a corrente faz a catraca, e com ela a roda, girar um certo número de voltas. Use $\pi \approx 3{,}14$.
    enunciado: |
      A distância percorrida pela bicicleta a cada volta dos pedais é, aproximadamente,
    opcoes: ['$2{,}1$ m', '$6{,}2$ m', '$4{,}1$ m', '$9{,}9$ m', '$3{,}1$ m']
    correta: B
    resolucao: |
      Uma volta da coroa passa 48 dentes pela corrente, que fazem a catraca dar $\tfrac{48}{16} = 3$ voltas. A roda percorre $3 \cdot 66\pi \approx 621{,}7$ cm $\approx 6{,}2$ m.

  - estilo: Fuvest
    enunciado: |
      O comprimento de um arco de $40°$ numa circunferência de raio 9 é
    opcoes: ['$2\pi$', '$4\pi$', '$\pi$', '$9\pi$', '$40\pi$']
    correta: A
    resolucao: |
      $\tfrac{40}{360} \cdot 18\pi = 2\pi$.

  - estilo: Unicamp
    enunciado: |
      Um arco de circunferência tem comprimento igual ao raio. O ângulo central correspondente mede
    opcoes: ['$1$ rad.', '$\pi$ rad.', '$2$ rad.', '$\frac{1}{2}$ rad.']
    correta: A
    resolucao: |
      $\theta = \tfrac{\ell}{r} = 1$ rad (cerca de $57°$).

  - estilo: UEM
    enunciado: |
      Considere circunferências e arcos. Assinale o que for correto.
    proposicoes:
    - 'A razão entre o comprimento e o diâmetro de qualquer circunferência é $\pi$.'
    - 'Dobrando o raio, o comprimento da circunferência dobra.'
    - 'Um arco de $60°$ numa circunferência de raio 6 mede $2\pi$.'
    - 'Um arco de 2 radianos numa circunferência de raio 5 mede 10.'
    - 'Uma semicircunferência tem comprimento igual ao diâmetro.'
    corretas: [1, 2, 3, 4]
    resolucao: |
      01) Definição de $\pi$. 02) $C = 2\pi r$. 04) $\tfrac{12\pi}{6}$. 08) $r\theta$. 16) Incorreta: mede $\pi r$, maior que $2r$.
      Soma: $01 + 02 + 04 + 08 = 15$.

  - estilo: Enem
    texto: |
      Numa pista de atletismo, as curvas são semicircunferências e as retas são iguais em todas as raias, como na figura. Na raia 1, o raio da curva é 36,5 m; cada raia tem 1,22 m de largura. Para que os atletas das raias 1 e 2 corram a mesma distância numa volta, a largada da raia 2 é adiantada. Use $\pi \approx 3{,}14$.
    figura:
      tikz: |
        \begin{scope}[scale=.5]
        \draw[ink, line width=1pt] (0,-1) -- (3,-1) arc (-90:90:1) -- (0,1) arc (90:270:1);
        \draw[roxo, line width=1pt] (0,-1.35) -- (3,-1.35) arc (-90:90:1.35) -- (0,1.35) arc (90:270:1.35);
        \end{scope}
    enunciado: |
      O adiantamento da largada da raia 2 deve ser de, aproximadamente,
    opcoes: ['$3{,}83$ m', '$1{,}22$ m', '$7{,}66$ m', '$15{,}32$ m', '$2{,}44$ m']
    correta: C
    resolucao: |
      As duas curvas formam uma circunferência. A diferença é $2\pi \cdot 1{,}22 \approx 7{,}66$ m.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir.
    afirmativas:
    - 'Uma roda de 30 cm de raio, em 10 voltas, percorre $6\pi$ m.'
    - 'Um arco de 2 radianos numa circunferência de raio 7 mede 14.'
    - 'Em 15 minutos, a ponta de um ponteiro de minutos de 12 cm percorre $6\pi$ cm.'
    - 'O perímetro de um semicírculo de raio 5 é $5\pi$.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'II e IV, apenas.', 'III e IV, apenas.', 'I, II e III, apenas.', 'I, II, III e IV.']
    correta: D
    resolucao: |
      I. $10 \cdot 60\pi$ cm $= 6\pi$ m. II. $7 \cdot 2$. III. $\tfrac{24\pi}{4}$. IV. Incorreta: falta o diâmetro, $5\pi + 10$.

  - estilo: Unesp
    enunciado: |
      Uma circunferência tem 31,4 cm de comprimento. Com $\pi \approx 3{,}14$, o seu diâmetro mede
    opcoes: ['$5$ cm', '$31{,}4$ cm', '$20$ cm', '$3{,}14$ cm', '$10$ cm']
    correta: E
    resolucao: |
      $\pi d = 31{,}4$: $d = 10$ cm.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      Na figura, as engrenagens $A$ e $B$, de raios 12 cm e 4 cm, giram encostadas, sem deslizar.
    figura:
      tikz: |
        \begin{scope}[scale=.08]
        \draw[ink, line width=1pt, fill=lilas!25] (0,0) circle (12);
        \draw[ink, line width=1pt, fill=lima!40] (16,0) circle (4);
        \fill[ink] (0,0) circle (15pt) (16,0) circle (12pt);
        \node[font=\scriptsize] at (0,-5) {$A$};
        \node[font=\scriptsize] at (16,-6.5) {$B$};
        \end{scope}
    enunciado: |
      Quando $A$ dá 5 voltas, $B$ dá
    opcoes: ['$15$ voltas.', '$5$ voltas.', '$3$ voltas.', '$60$ voltas.']
    correta: A
    resolucao: |
      O contato percorre o mesmo comprimento: $5 \cdot 24\pi = n \cdot 8\pi$, $n = 15$.

  - estilo: Fuvest
    enunciado: |
      Numa circunferência de raio 10, uma corda determina um arco de $60°$. A diferença entre o comprimento do arco e o da corda é
    opcoes: ['$\frac{10\pi}{3}$', '$\frac{10\pi}{3} - 10$', '$10\pi - 10$', '$\frac{20\pi}{3} - 10$', '$10 - \frac{10\pi}{3}$']
    correta: B
    resolucao: |
      Arco $\tfrac{20\pi}{6} = \tfrac{10\pi}{3}$; a corda forma triângulo equilátero com o centro: 10.

  - estilo: UFSC
    enunciado: |
      Duas polias, de diâmetros 40 cm e 10 cm, estão ligadas por uma correia que não desliza. Assinale o que for correto.
    proposicoes:
    - 'Para cada volta da polia maior, a menor dá 4 voltas.'
    - 'O comprimento da circunferência da polia maior é $40\pi$ cm.'
    - 'Se a maior gira a 60 voltas por minuto, a menor gira a 240 voltas por minuto.'
    - 'Um ponto da correia tem a mesma velocidade quando passa por uma ou pela outra polia.'
    - 'A polia menor gira mais devagar que a maior.'
    - 'Com a maior a 60 voltas por minuto, um ponto da correia percorre $2400\pi$ cm por minuto.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) $\tfrac{40\pi}{10\pi}$. 02) $\pi d$. 04) $60 \cdot 4$. 08) A correia não desliza. 16) Incorreta: gira mais depressa. 32) $60 \cdot 40\pi$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      No século III a.C., Eratóstenes observou que, ao meio-dia de certo dia, os raios de Sol eram verticais em Siena, enquanto em Alexandria, cerca de 800 km ao norte, formavam ângulo de $7{,}2°$ com a vertical. Supondo os raios paralelos, ele estimou a circunferência da Terra.
    enunciado: |
      A estimativa obtida com esses dados é de
    opcoes: ['$5\,760$ km', '$111$ km', '$40\,000$ km', '$28\,800$ km', '$4\,000$ km']
    correta: C
    resolucao: |
      O ângulo central entre as cidades é $7{,}2° = \tfrac{360°}{50}$: circunferência $50 \cdot 800 = 40\,000$ km.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'O comprimento da circunferência é diretamente proporcional ao raio.'
    - 'Um arco de $90°$ numa circunferência de raio 8 mede $4\pi$.'
    - 'Uma roda de 50 cm de diâmetro, em 100 voltas, percorre 50 m.'
    - 'Um radiano é maior que um grau.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – V – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – F – V.', 'V – V – F – F.']
    correta: D
    resolucao: |
      (V) $C = 2\pi r$. (V) $\tfrac{16\pi}{4}$. (F) $100 \cdot 50\pi$ cm $= 50\pi$ m $\approx 157$ m. (V) Cerca de $57°$.

  - estilo: Enem
    texto: |
      O velocímetro de um carro calcula a velocidade pelo número de voltas das rodas e foi calibrado para pneus de 60 cm de diâmetro. Trocando os pneus por outros de diâmetro maior, a velocidade real fica maior que a indicada. O quadro mostra os pneus disponíveis.
    tabela:
      cabecalho: ['Pneu', 'Diâmetro (cm)']
      linhas:
      - ['P1', '$60$']
      - ['P2', '$62$']
      - ['P3', '$64$']
      - ['P4', '$66$']
      - ['P5', '$70$']
    enunciado: |
      O pneu com o qual a velocidade real é 10\% maior que a indicada é o
    opcoes: ['P1.', 'P2.', 'P3.', 'P4.', 'P5.']
    correta: D
    resolucao: |
      Com o mesmo número de voltas, a distância é proporcional ao diâmetro: $60 \cdot 1{,}1 = 66$ cm.

  - estilo: Unesp
    enunciado: |
      O ponteiro dos minutos de um relógio mede 9 cm. Em 40 minutos, a sua ponta percorre
    opcoes: ['$6\pi$ cm', '$18\pi$ cm', '$9\pi$ cm', '$24\pi$ cm', '$12\pi$ cm']
    correta: E
    resolucao: |
      $\tfrac{40}{60} \cdot 18\pi = 12\pi$ cm.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Uma corda justa envolve o equador de uma esfera de raio $R$. Ela é aumentada e mantida circular e concêntrica. Assinale o que for correto.
    proposicoes:
    - 'O comprimento inicial da corda é $2\pi R$.'
    - 'Aumentando o raio da corda em 1 m, o comprimento aumenta $2\pi$ m.'
    - 'O aumento do item anterior não depende de $R$.'
    - 'Se a corda em volta da Terra ganhar 10 m, ela ficará a cerca de 10 cm do chão.'
    - 'Para ficar 1 m acima, a corda precisa de um aumento maior em volta da Terra que em volta de uma bola de tênis.'
    corretas: [1, 2, 3]
    resolucao: |
      01) Correta. 02) $2\pi(R + 1) - 2\pi R$. 04) Correta. 08) Incorreta: $h = \tfrac{10}{2\pi} \approx 1{,}6$ m. 16) Incorreta: o aumento é $2\pi$ m nos dois casos.
      Soma: $01 + 02 + 04 = 07$.

  - estilo: Unicamp
    enunciado: |
      O triângulo de Reuleaux é formado por três arcos de raio 6, com centros nos vértices de um triângulo equilátero de lado 6. O seu perímetro é
    opcoes: ['$3\pi$.', '$6\pi$.', '$12\pi$.', '$18$.']
    correta: B
    resolucao: |
      Três arcos de $60°$ e raio 6: $3 \cdot \tfrac{12\pi}{6} = 6\pi$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Duas polias iguais, de 10 cm de raio, têm os centros a 50 cm de distância e são ligadas por uma correia aberta, como na figura. A correia abraça cada polia em meia volta. Use $\pi \approx 3{,}14$.
    figura:
      tikz: |
        \begin{scope}[scale=.06]
        \draw[ink, line width=1pt, fill=lilas!25] (0,0) circle (10) (50,0) circle (10);
        \fill[ink] (0,0) circle (15pt) (50,0) circle (15pt);
        \draw[roxo, line width=1.3pt] (0,10) -- (50,10) arc (90:-90:10) -- (0,-10) arc (270:90:10);
        \end{scope}
    enunciado: |
      O comprimento da correia é, aproximadamente,
    opcoes: ['$131{,}4$ cm', '$120{,}0$ cm', '$162{,}8$ cm', '$100{,}0$ cm', '$225{,}6$ cm']
    correta: C
    resolucao: |
      Dois trechos retos de 50 cm e duas meias voltas, que formam uma circunferência de raio 10: $100 + 20\pi \approx 162{,}8$ cm.

  - estilo: Unesp
    enunciado: |
      Quando cada polia dá 13 voltas, a correia completa, aproximadamente,
    opcoes: ['$13$ voltas.', '$3$ voltas.', '$8$ voltas.', '$2{,}6$ voltas.', '$5$ voltas.']
    correta: E
    resolucao: |
      A correia avança $13 \cdot 20\pi \approx 816{,}4$ cm; $\tfrac{816{,}4}{162{,}8} \approx 5{,}0$ voltas.

  - estilo: Fuvest
    enunciado: |
      Uma moeda rola, sem deslizar, em volta de outra moeda igual, que está fixa, até voltar à posição inicial. O número de voltas que a moeda móvel dá em torno do seu próprio centro é
    opcoes: ['$1$', '$2$', '$3$', '$\frac{1}{2}$', '$4$']
    correta: B
    resolucao: |
      O centro da moeda móvel descreve uma circunferência de raio $2r$, de comprimento $4\pi r$. Ela gira $\tfrac{4\pi r}{2\pi r} = 2$ voltas.

  - estilo: Unesp
    texto: |
      A figura é formada por um quadrado de lado 4 e por quatro semicírculos construídos para fora sobre os lados.
    figura:
      tikz: |
        \begin{scope}[scale=.3]
        \fill[lilas!35] (0,0) arc (180:360:2) arc (-90:90:2) arc (0:180:2) arc (90:270:2);
        \draw[ink, line width=1pt] (0,0) arc (180:360:2) arc (-90:90:2) arc (0:180:2) arc (90:270:2);
        \draw[mudo, dashed] (0,0) rectangle (4,4);
        \end{scope}
    enunciado: |
      O perímetro da figura é
    opcoes: ['$8\pi$', '$16 + 8\pi$', '$4\pi$', '$16\pi$', '$16$']
    correta: A
    resolucao: |
      O contorno é formado só pelos quatro semicírculos de raio 2: $4 \cdot 2\pi = 8\pi$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere uma circunferência de raio $r$ e um arco de ângulo central $\theta$, em radianos.'
    itens:
    - 'Mostre que o comprimento do arco é $\ell = r\theta$.'
    - 'Mostre que a área do setor correspondente é $\frac{\ell r}{2}$.'
    - 'Um setor tem perímetro 20 e raio 5. Calcule o ângulo, o arco e a área.'
    espaco: 62
    resolucao: |
      a) Proporcionalidade: $\tfrac{\theta}{2\pi} \cdot 2\pi r$.
      b) A área é $\tfrac{r^2\theta}{2} = \tfrac{r \cdot r\theta}{2} = \tfrac{\ell r}{2}$.
      c) $2 \cdot 5 + \ell = 20$: $\ell = 10$, $\theta = 2$ rad, área $\tfrac{10 \cdot 5}{2} = 25$.
    resposta: 'c) 2 rad; 10; 25'

  - estilo: Unicamp
    texto: |
      Uma corda justa envolve o equador da Terra (raio de cerca de 6400 km). Depois, ela é alongada e erguida igualmente em todos os pontos, ficando circular e concêntrica.
    enunciado: ''
    itens:
    - 'Quanto é preciso acrescentar à corda para que fique 1 m acima do chão?'
    - 'E se a corda envolvesse uma bola de futebol de 11 cm de raio?'
    - 'Com 1 m a mais de corda, um gato passaria por baixo dela em volta da Terra? Justifique.'
    espaco: 62
    resolucao: |
      a) $2\pi(R + 1) - 2\pi R = 2\pi \approx 6{,}28$ m.
      b) O mesmo, $2\pi$ m: o acréscimo não depende do raio.
      c) A altura seria $\tfrac{1}{2\pi} \approx 0{,}16$ m $= 16$ cm: um gato pequeno, agachado, passaria.
    resposta: 'a) $2\pi$ m; b) $2\pi$ m; c) altura $\approx 16$ cm'

  - estilo: ITA
    enunciado: |
      Uma moeda de raio $r$ rola, sem deslizar, por fora de uma moeda fixa de raio $2r$, até voltar à posição inicial. O número de voltas que ela dá em torno do seu próprio centro é
    opcoes: ['$2$', '$4$', '$3$', '$1$', '$\frac{3}{2}$']
    correta: C
    espaco: 22
    resolucao: |
      O centro da moeda móvel percorre uma circunferência de raio $3r$: $\tfrac{2\pi \cdot 3r}{2\pi r} = 3$ voltas.
    resposta: 'C'

  - estilo: Unesp
    texto: |
      Numa bicicleta, a coroa tem 44 dentes, a catraca tem 11 dentes e a roda tem 70 cm de diâmetro. Use $\pi \approx 3{,}14$.
    enunciado: ''
    itens:
    - 'Quantas voltas a roda dá a cada volta dos pedais?'
    - 'Que distância a bicicleta percorre a cada volta dos pedais?'
    - 'Quantas voltas dos pedais, aproximadamente, são necessárias para percorrer 1 km?'
    espaco: 62
    resolucao: |
      a) $\tfrac{44}{11} = 4$.
      b) $4 \cdot 70\pi = 280\pi \approx 879{,}2$ cm $\approx 8{,}8$ m.
      c) $\tfrac{1000}{8{,}792} \approx 113{,}7$: cerca de 114 voltas.
    resposta: 'a) 4; b) $\approx 8{,}8$ m; c) $\approx 114$'

  - estilo: UFSC
    enunciado: |
      Assinale o que for correto.
    proposicoes:
    - 'Um arco de 3 radianos numa circunferência de raio 4 mede 12.'
    - 'Se uma engrenagem de 30 dentes engrena com uma de 12 dentes, 2 voltas da maior correspondem a 5 voltas da menor.'
    - 'Em 1 hora, a ponta de um ponteiro de minutos de 10 cm percorre $20\pi$ cm.'
    - 'O perímetro de um setor de $90°$ e raio 4 é $8 + 2\pi$.'
    - 'O triângulo de Reuleaux de largura $a$ tem perímetro $3a$.'
    - 'A diferença entre os comprimentos de duas circunferências concêntricas de raios 5 e 3 é $4\pi$.'
    corretas: [1, 2, 3, 4, 6]
    espaco: 22
    resolucao: |
      01) $4 \cdot 3$. 02) $2 \cdot 30 = 5 \cdot 12$ dentes. 04) Uma volta. 08) $2 \cdot 4 + \tfrac{8\pi}{4}$. 16) Incorreta: $\pi a$. 32) $2\pi(5 - 3)$.
    resposta: 'Soma 47 (01 + 02 + 04 + 08 + 32)'

  - estilo: Fuvest
    enunciado: 'Duas polias, de raios 15 cm e 5 cm, têm os centros a 20 cm de distância e estão ligadas por uma correia aberta.'
    itens:
    - 'Calcule cada trecho reto da correia.'
    - 'Mostre que os trechos retos formam ângulo de $30°$ com a reta dos centros e calcule os arcos abraçados por cada polia, em graus.'
    - 'Calcule o comprimento da correia.'
    espaco: 62
    resolucao: |
      a) Tangente comum externa: $\sqrt{400 - 100} = 10\sqrt{3}$ cm.
      b) No triângulo retângulo de hipotenusa 20 e cateto $15 - 5 = 10$, o ângulo oposto ao cateto 10 é $30°$. A maior é abraçada em $180° + 2 \cdot 30° = 240°$; a menor, em $120°$.
      c) $2 \cdot 10\sqrt{3} + \tfrac{240}{360} \cdot 30\pi + \tfrac{120}{360} \cdot 10\pi = 20\sqrt{3} + 20\pi + \tfrac{10\pi}{3} = 20\sqrt{3} + \tfrac{70\pi}{3} \approx 107{,}9$ cm.
    resposta: 'a) $10\sqrt{3}$ cm; b) $240°$ e $120°$; c) $20\sqrt{3} + \frac{70\pi}{3} \approx 107{,}9$ cm'

  - estilo: Unicamp
    texto: |
      Eratóstenes estimou a circunferência da Terra comparando a sombra do Sol em duas cidades, Siena e Alexandria, aproximadamente no mesmo meridiano.
    enunciado: ''
    itens:
    - 'Explique por que o ângulo que os raios de Sol formam com a vertical em Alexandria, quando são verticais em Siena, é igual ao ângulo central entre as cidades.'
    - 'Com ângulo de $7{,}2°$ e distância de 800 km, estime a circunferência e o raio da Terra ($\pi \approx 3{,}14$).'
    - 'Se a distância real fosse 850 km, com o mesmo ângulo, qual seria a estimativa?'
    espaco: 62
    resolucao: |
      a) Os raios de Sol são paralelos; a vertical de cada cidade passa pelo centro da Terra. O ângulo em Alexandria e o ângulo central são alternos internos.
      b) $\tfrac{360}{7{,}2} = 50$: circunferência $40\,000$ km; raio $\tfrac{40\,000}{6{,}28} \approx 6370$ km.
      c) $50 \cdot 850 = 42\,500$ km.
    resposta: 'b) 40 000 km e $\approx 6370$ km; c) 42 500 km'

  - estilo: Fuvest
    enunciado: |
      Um arco de 9 cm corresponde a um ângulo central de 1,5 radiano. O raio da circunferência é
    opcoes: ['$6$ cm', '$13{,}5$ cm', '$4{,}5$ cm', '$3$ cm', '$9$ cm']
    correta: A
    espaco: 22
    resolucao: |
      $r = \tfrac{\ell}{\theta} = \tfrac{9}{1{,}5} = 6$ cm.
    resposta: 'A'

  - estilo: Unesp
    texto: |
      Numa pista, as retas medem 100 m e as curvas são semicircunferências. Na raia 1, o raio é 36 m; cada raia tem 1,22 m de largura. Use $\pi \approx 3{,}14$.
    enunciado: ''
    itens:
    - 'Calcule o comprimento de uma volta na raia 1.'
    - 'Calcule quanto a mais mede uma volta na raia 8 que na raia 1.'
    - 'Numa prova de 200 m com uma única curva, de quanto deve ser o adiantamento da raia 8 em relação à raia 1?'
    espaco: 62
    resolucao: |
      a) $200 + 2\pi \cdot 36 = 200 + 72\pi \approx 426{,}1$ m.
      b) O raio da raia 8 é $36 + 7 \cdot 1{,}22 = 44{,}54$: diferença $2\pi \cdot 8{,}54 \approx 53{,}6$ m.
      c) Meia circunferência: $\pi \cdot 8{,}54 \approx 26{,}8$ m.
    resposta: 'a) $\approx 426{,}1$ m; b) $\approx 53{,}6$ m; c) $\approx 26{,}8$ m'

  - estilo: Fuvest
    enunciado: 'Uma moeda de raio $r$ rola, sem deslizar, mantendo contato com uma moeda fixa de raio $R$.'
    itens:
    - 'Rolando ao longo de uma reta, quantas voltas a moeda dá ao percorrer uma distância $d$?'
    - 'Rolando por fora da moeda fixa, mostre que ela dá $\frac{R + r}{r}$ voltas até voltar à posição inicial.'
    - 'Rolando por dentro de um anel de raio $R$, quantas voltas ela dá? Calcule para $R = 3r$.'
    espaco: 62
    resolucao: |
      a) $\tfrac{d}{2\pi r}$.
      b) O número de voltas é a distância percorrida pelo centro dividida por $2\pi r$. Por fora, o centro descreve uma circunferência de raio $R + r$: $\tfrac{2\pi(R + r)}{2\pi r}$.
      c) Por dentro, o centro descreve raio $R - r$: $\tfrac{R - r}{r}$ voltas; para $R = 3r$, 2 voltas.
    resposta: 'a) $\frac{d}{2\pi r}$; c) $\frac{R - r}{r}$; 2'
