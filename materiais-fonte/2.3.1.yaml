# Fonte das listas em PDF da aula 2.3.1 — Função quadrática: definição e concavidade
aula: '2.3.1'

fixacao:
  intro: Resolva na ordem — do fácil ao difícil. Em $f(x)=ax^2+bx+c$, com $a\neq0$, o sinal de $a$ decide a concavidade e $c=f(0)$ é onde a parábola corta o eixo $y$.
  secoes:
    - nome: Aquecimento
      questoes:
        - enunciado: Identifique os coeficientes $a$, $b$ e $c$ de cada função.
          itens:
            - $f(x)=2x^2-3x+1$
            - $f(x)=-x^2+5$
            - $f(x)=\tfrac12x^2-4x$
            - $f(x)=(x-1)(x+3)$
          resolucao: |
            (a) $a=2$, $b=-3$, $c=1$. (b) $a=-1$, $b=0$, $c=5$. (c) $a=\tfrac12$, $b=-4$, $c=0$.
            (d) Desenvolvendo: $x^2+2x-3$, então $a=1$, $b=2$, $c=-3$.
          resposta: '(a) $2,-3,1$ \quad (b) $-1,0,5$ \quad (c) $\tfrac12,-4,0$ \quad (d) $1,2,-3$'

        - enunciado: Diga quais funções são quadráticas.
          itens:
            - $f(x)=3x^2-x$
            - $f(x)=2x+1$
            - $f(x)=(x+1)^2-x^2$
            - $f(x)=5-x^2$
          resolucao: |
            (a) Sim. (b) Não: é afim. (c) Não: $(x+1)^2-x^2=2x+1$, o termo $x^2$ se cancela. (d) Sim, com $a=-1$.
          resposta: '(a) sim \quad (b) não \quad (c) não \quad (d) sim'

        - enunciado: Indique a concavidade da parábola de cada função.
          itens:
            - $f(x)=3x^2-x$
            - $f(x)=-2x^2+4$
            - $f(x)=x^2-6x+9$
          resolucao: |
            $a>0$: para cima; $a<0$: para baixo.
            (a) Para cima. (b) Para baixo. (c) Para cima.
          resposta: '(a) para cima \quad (b) para baixo \quad (c) para cima'

        - enunciado: Dada $f(x)=x^2-4x+3$, calcule $f(0)$, $f(1)$, $f(-2)$ e $f(4)$.
          resolucao: |
            $f(0)=3$; \ $f(1)=1-4+3=0$; \ $f(-2)=4+8+3=15$; \ $f(4)=16-16+3=3$.
          resposta: '$3$; \ $0$; \ $15$; \ $3$'

        - enunciado: Em que ponto o gráfico de $f(x)=-2x^2+3x-7$ corta o eixo $y$?
          resolucao: |
            No eixo $y$, $x=0$: $f(0)=c=-7$.
          resposta: '$(0,\,-7)$'

        - enunciado: Considere $f(x)=(m-3)x^2+2x-1$. Determine $m$ para que
          itens:
            - $f$ seja quadrática;
            - a parábola tenha concavidade para cima.
          resolucao: |
            (a) $m-3\neq0\Rightarrow m\neq3$. (b) $m-3>0\Rightarrow m>3$.
          resposta: '(a) $m\neq3$ \quad (b) $m>3$'

        - enunciado: A área de um quadrado de lado $x+2$ é $A(x)=(x+2)^2$. Escreva $A(x)$ na forma $ax^2+bx+c$ e calcule $A(3)$.
          resolucao: |
            $A(x)=x^2+4x+4$, com $a=1$, $b=4$, $c=4$. \ $A(3)=25$.
          resposta: '$x^2+4x+4$; \ $25$'

    - nome: Treino
      questoes:
        - enunciado: A parábola de $f(x)=x^2+bx+c$ passa por $(0,\,5)$ e $(1,\,8)$. Determine $b$ e $c$.
          resolucao: |
            $f(0)=c=5$. \ $f(1)=1+b+5=8\Rightarrow b=2$.
          resposta: '$b=2$, \ $c=5$'

        - enunciado: Determine $f(x)=ax^2+bx+c$ sabendo que $f(0)=1$, $f(1)=4$ e $f(-1)=0$.
          resolucao: |
            $c=1$; \ $a+b+1=4$ e $a-b+1=0$. Somando: $2a=2\Rightarrow a=1$; então $b=2$.
          resposta: '$f(x)=x^2+2x+1$'

        - enunciado: Para quais valores de $k$ a parábola de $f(x)=(2k-6)x^2+x$ tem concavidade para baixo?
          resolucao: |
            $2k-6<0\Rightarrow k<3$.
          resposta: '$k<3$'

        - enunciado: Dada $f(x)=x^2-2x$, determine $x$ tal que $f(x)=8$.
          resolucao: |
            $x^2-2x-8=0\Rightarrow(x-4)(x+2)=0$. Logo, $x=4$ ou $x=-2$.
          resposta: '$x=4$ ou $x=-2$'

        - enunciado: Determine os pontos em que o gráfico de $f(x)=x^2-9$ corta o eixo $x$.
          resolucao: |
            $x^2=9\Rightarrow x=\pm3$.
          resposta: '$(-3,\,0)$ e $(3,\,0)$'

        - enunciado: Determine os zeros de $f(x)=2x^2-8x$.
          resolucao: |
            $2x(x-4)=0\Rightarrow x=0$ ou $x=4$.
          resposta: '$0$ e $4$'

        - enunciado: A altura, em metros, de uma bola lançada para cima é $h(t)=-5t^2+30t$, em que $t$ é o tempo em segundos.
          itens:
            - Qual é a altura em $t=2$ s?
            - Em que instantes a bola está no chão?
          resolucao: |
            (a) $h(2)=-20+60=40$ m.
            (b) $-5t(t-6)=0\Rightarrow t=0$ (lançamento) ou $t=6$ s (queda).
          resposta: '(a) $40$ m \quad (b) $t=0$ e $t=6$ s'

        - enunciado: A parábola de $f(x)=ax^2+3$ passa pelo ponto $(2,\,15)$. Determine $a$ e a concavidade.
          resolucao: |
            $4a+3=15\Rightarrow a=3>0$: concavidade para cima.
          resposta: '$a=3$; para cima'

    - nome: Desafio
      questoes:
        - enunciado: Determine a função quadrática cujo gráfico passa por $(0,\,-3)$, $(1,\,0)$ e $(3,\,0)$, e diga sua concavidade.
          resolucao: |
            $c=-3$; \ $a+b-3=0$ e $9a+3b-3=0\Rightarrow 3a+b=1$.
            Subtraindo $a+b=3$: $2a=-2\Rightarrow a=-1$ e $b=4$.
          resposta: '$f(x)=-x^2+4x-3$; para baixo'

        - enunciado: O número de diagonais de um polígono convexo de $n$ lados é $d(n)=\dfrac{n(n-3)}2$.
          itens:
            - Calcule $d(10)$.
            - Qual polígono tem $20$ diagonais?
          resolucao: |
            (a) $d(10)=\tfrac{10\cdot7}2=35$.
            (b) $n(n-3)=40\Rightarrow n^2-3n-40=0\Rightarrow(n-8)(n+5)=0$, então $n=8$: o octógono.
          resposta: '(a) $35$ \quad (b) octógono ($n=8$)'

        - enunciado: Para $f(x)=x^2$, mostre que $f(x+1)-f(x)=2x+1$ e use isso para calcular $f(11)-f(10)$.
          resolucao: |
            $(x+1)^2-x^2=x^2+2x+1-x^2=2x+1$. Com $x=10$: $21$ (confira: $121-100$).
          resposta: '$2x+1$; \ $21$'

        - enunciado: A função $f(x)=x^2+bx+c$ satisfaz $f(1)=0$ e $f(5)=0$. Determine $b$ e $c$.
          resolucao: |
            $1+b+c=0$ e $25+5b+c=0$. Subtraindo: $24+4b=0\Rightarrow b=-6$; então $c=5$.
            De fato, $x^2-6x+5=(x-1)(x-5)$.
          resposta: '$b=-6$, \ $c=5$'

        - enunciado: Um retângulo tem perímetro $20$ cm e um dos lados mede $x$ cm. Escreva sua área $A(x)$, identifique a concavidade do gráfico e calcule $A(3)$.
          resolucao: |
            O outro lado mede $10-x$, então $A(x)=x(10-x)=-x^2+10x$.
            $a=-1<0$: concavidade para baixo. \ $A(3)=21$ cm².
          resposta: '$A(x)=-x^2+10x$; para baixo; $21$ cm²'

vestibular:
  intro: Questões autorais no estilo dos principais vestibulares. Assinale uma única alternativa.
  questoes:
    - enunciado: Das funções abaixo, a única quadrática é
      opcoes: ['$f(x)=2x+3$', '$f(x)=x^3-x$', '$f(x)=3-2x^2$', '$f(x)=\dfrac1{x^2}$', '$f(x)=(x+1)^2-x^2$']
      correta: C
      resolucao: |
        $3-2x^2$ tem grau $2$, com $a=-2$. Em E, o $x^2$ se cancela e sobra $2x+1$.

    - enunciado: Escrevendo $f(x)=(2x-1)(x+3)$ na forma $ax^2+bx+c$, o valor de $a+b+c$ é
      opcoes: ['$2$', '$4$', '$6$', '$8$', '$10$']
      correta: B
      resolucao: |
        $a+b+c=f(1)=(2-1)(1+3)=4$. (Desenvolvendo: $2x^2+5x-3$.)

    - enunciado: Se $f(x)=x^2-5x+6$, então $f(-1)$ vale
      opcoes: ['$12$', '$14$', '$16$', '$18$', '$20$']
      correta: A
      resolucao: |
        $1+5+6=12$.

    - enunciado: A função $f(x)=(k^2-4)x^2+3x$ é quadrática se, e somente se,
      opcoes: ['$k=2$', '$k\neq2$', '$k>2$', '$k\neq2$ e $k\neq-2$', 'para qualquer $k$ real']
      correta: D
      resolucao: |
        É preciso $k^2-4\neq0$, ou seja, $k\neq\pm2$.

    - enunciado: A parábola de $f(x)=-3x^2+2x-5$
      opcoes: ['corta o eixo $y$ em $(0,5)$ e tem concavidade para cima', 'corta o eixo $y$ em $(0,-5)$ e tem concavidade para cima', 'corta o eixo $y$ em $(0,5)$ e tem concavidade para baixo', 'corta o eixo $y$ em $(-5,0)$ e tem concavidade para baixo', 'corta o eixo $y$ em $(0,-5)$ e tem concavidade para baixo']
      correta: E
      resolucao: |
        $c=-5$ e $a=-3<0$.

    - enunciado: Uma função $f(x)=ax^2+bx+c$ satisfaz $f(0)=2$, $f(1)=3$ e $f(2)=8$. O valor de $f(3)$ é
      opcoes: ['$11$', '$14$', '$17$', '$20$', '$23$']
      correta: C
      resolucao: |
        $c=2$; $a+b=1$; $4a+2b=6\Rightarrow 2a+b=3$. Então $a=2$, $b=-1$ e $f(3)=18-3+2=17$.

    - enunciado: A altura de uma bola, em metros, é $h(t)=-5t^2+20t+1$, com $t$ em segundos. No instante $t=1$ s, a bola está a uma altura de
      opcoes: ['$6$ m', '$11$ m', '$15$ m', '$16$ m', '$21$ m']
      correta: D
      resolucao: |
        $-5+20+1=16$ m.

    - enunciado: 'O conjunto dos zeros de $f(x)=x^2-7x$ é'
      opcoes: ['$\{7\}$', '$\{0,\,7\}$', '$\{-7,\,0\}$', '$\{-7,\,7\}$', '$\{0\}$']
      correta: B
      resolucao: |
        $x(x-7)=0\Rightarrow x=0$ ou $x=7$. Não divida por $x$: isso faria perder a raiz $0$.

    - enunciado: A parábola de $f(x)=mx^2+x-2$ passa pelo ponto $(2,\,8)$. O valor de $m$ é
      opcoes: ['$-2$', '$0$', '$\dfrac12$', '$1$', '$2$']
      correta: E
      resolucao: |
        $4m+2-2=8\Rightarrow m=2$.

    - enunciado: Em uma reunião com $n$ pessoas, cada uma cumprimenta todas as outras uma única vez, e o total de apertos de mão é $\dfrac{n(n-1)}2$. Com $12$ pessoas, o total é
      opcoes: ['$66$', '$72$', '$78$', '$132$', '$144$']
      correta: A
      resolucao: |
        $\tfrac{12\cdot11}2=66$.

    - enunciado: A parábola de $f(x)=x^2+bx+c$ passa por $(0,\,4)$ e $(2,\,0)$. O valor de $f(5)$ é
      opcoes: ['$4$', '$9$', '$14$', '$16$', '$29$']
      correta: B
      resolucao: |
        $c=4$ e $4+2b+4=0\Rightarrow b=-4$. Então $f(x)=x^2-4x+4$ e $f(5)=9$.

    - enunciado: A parábola de $f(x)=(5-2m)x^2+1$ tem concavidade para baixo se, e somente se,
      opcoes: ['$m<\tfrac52$', '$m=\tfrac52$', '$m>2$', '$m<0$', '$m>\tfrac52$']
      correta: E
      resolucao: |
        $5-2m<0\Rightarrow m>\tfrac52$.

    - enunciado: Um terreno retangular tem um lado $5$ m maior que o outro e área de $84\ \text{m}^2$. Seu perímetro é
      opcoes: ['$38$ m', '$40$ m', '$42$ m', '$44$ m', '$84$ m']
      correta: A
      resolucao: |
        $x(x+5)=84\Rightarrow x^2+5x-84=0\Rightarrow(x-7)(x+12)=0$, então $x=7$. Lados $7$ e $12$: perímetro $38$ m.

    - enunciado: Se $f(x)=2x^2-3x+k$ e $f(2)=7$, então $k$ vale
      opcoes: ['$1$', '$2$', '$3$', '$5$', '$7$']
      correta: D
      resolucao: |
        $8-6+k=7\Rightarrow k=5$.

    - enunciado: 'Sendo $f(x)=x^2-6x+5$, o conjunto dos valores de $x$ para os quais $f(x)=-3$ é'
      opcoes: ['$\{-2,\,-4\}$', '$\{1,\,5\}$', '$\{2,\,4\}$', '$\{3\}$', '$\varnothing$']
      correta: C
      resolucao: |
        $x^2-6x+8=0\Rightarrow(x-2)(x-4)=0$. A alternativa B traz os zeros de $f$, não a resposta.

    - enunciado: O número de diagonais de um polígono convexo de $n$ lados é $\dfrac{n(n-3)}2$. Um dodecágono ($12$ lados) tem
      opcoes: ['$24$ diagonais', '$36$ diagonais', '$48$ diagonais', '$50$ diagonais', '$54$ diagonais']
      correta: E
      resolucao: |
        $\tfrac{12\cdot9}2=54$.

    - enunciado: Para $f(x)=x^2+3x$, a expressão $f(x+1)-f(x)$ é igual a
      opcoes: ['$2x+1$', '$2x+4$', '$x+4$', '$2x+3$', '$4$']
      correta: B
      resolucao: |
        $(x+1)^2+3(x+1)-x^2-3x=2x+1+3=2x+4$.

    - enunciado: A parábola de $f(x)=ax^2+bx+c$ tem concavidade para baixo e corta o eixo $y$ acima da origem. Então
      opcoes: ['$a>0$ e $c>0$', '$a>0$ e $c<0$', '$a<0$ e $c<0$', '$a<0$ e $c>0$', '$a=0$ e $c>0$']
      correta: D
      resolucao: |
        Concavidade para baixo: $a<0$. Corte com o eixo $y$ em $(0,c)$, acima da origem: $c>0$.

    - enunciado: Um retângulo tem perímetro $40$ m e um dos lados mede $x$ m. Para $x=5$, sua área é
      opcoes: ['$25\ \text{m}^2$', '$50\ \text{m}^2$', '$75\ \text{m}^2$', '$100\ \text{m}^2$', '$175\ \text{m}^2$']
      correta: C
      resolucao: |
        $A(x)=x(20-x)$ e $A(5)=5\cdot15=75$.

    - enunciado: Uma função quadrática tem zeros $2$ e $3$, e $f(0)=12$. Escrita como $ax^2+bx+c$, o coeficiente $b$ vale
      opcoes: ['$-10$', '$-5$', '$5$', '$10$', '$12$']
      correta: A
      resolucao: |
        $f(x)=a(x-2)(x-3)$ e $f(0)=6a=12\Rightarrow a=2$. Então $f(x)=2x^2-10x+12$.
