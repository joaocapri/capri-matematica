# Aula 2.14.2 — Trigonometria: ciclo trigonométrico e arcos côngruos
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: ciclo de raio 1, origem em (1, 0), sentido anti-horário positivo; quadrantes; arcos côngruos
# (diferença de voltas inteiras); primeira determinação; expressão geral; arcos negativos; pontos determinados por
# x = a + k·(2π/n) (polígonos regulares); simetrias x ↔ −x, π − x, π + x.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Dois arcos são côngruos quando têm a mesma extremidade no ciclo, isto é, diferem por um número inteiro de voltas ($360^\circ$ ou $2\pi$). A primeira determinação positiva fica em $[0^\circ, 360^\circ)$. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Dê a primeira determinação positiva de cada arco.'
      itens:
      - '$1\,000^\circ$: {{280°}}'
      - '$-150^\circ$: {{210°}}'
      - '$\frac{17\pi}{4}$: {{\pi/4}}'
      - '$-\frac{7\pi}{3}$: {{5\pi/3}}'
      espaco_item: 8
      resolucao: |
        $1\,000 - 2 \cdot 360 = 280$; $-150 + 360 = 210$; $\frac{17\pi}{4} - 4\pi = \frac{\pi}{4}$; $-\frac{7\pi}{3} + 4\pi = \frac{5\pi}{3}$.
      resposta: '$280^\circ$; $210^\circ$; $\frac{\pi}{4}$; $\frac{5\pi}{3}$'
    - enunciado: 'Associe cada arco à posição da sua extremidade no ciclo.'
      esquerda:
      - '$200^\circ$'
      - '$100^\circ$'
      - '$\frac{7\pi}{4}$'
      - '$400^\circ$'
      - '$\frac{3\pi}{2}$'
      direita:
      - '1º quadrante'
      - 'sobre um eixo'
      - '3º quadrante'
      - '4º quadrante'
      - '2º quadrante'
      resolucao: |
        $200^\circ$: 3º Q; $100^\circ$: 2º Q; $\frac{7\pi}{4} = 315^\circ$: 4º Q; $400^\circ \equiv 40^\circ$: 1º Q; $\frac{3\pi}{2} = 270^\circ$: eixo vertical.
      resposta: 'De cima para baixo: 4, 5, 1, 3, 2'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Arcos côngruos diferem por um múltiplo de $360^\circ$.'
      - '$30^\circ$ e $390^\circ$ têm a mesma extremidade.'
      - '$-90^\circ$ e $90^\circ$ são côngruos.'
      - 'Um arco negativo é percorrido no sentido horário.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) (V) Diferem por $360^\circ$. (F) Diferem por $180^\circ$: extremidades opostas. (V)
      resposta: V, V, F, V
    - enunciado: 'Complete a tabela.'
      tabela:
        cabecalho: ['Arco', 'Voltas completas', '1ª determinação']
        linhas:
        - ['$1\,470^\circ$', '${{4}}$', '${{30^\circ}}$']
        - ['$2\,000^\circ$', '${{5}}$', '${{200^\circ}}$']
        - ['$\frac{25\pi}{6}$', '${{2}}$', '${{\pi/6}}$']
        - ['$\frac{31\pi}{4}$', '${{3}}$', '${{7\pi/4}}$']
      resolucao: |
        $1\,470 = 4 \cdot 360 + 30$; $2\,000 = 5 \cdot 360 + 200$; $\frac{25\pi}{6} = 4\pi + \frac{\pi}{6}$; $\frac{31\pi}{4} = 6\pi + \frac{7\pi}{4}$.
      resposta: '4 e $30^\circ$; 5 e $200^\circ$; 2 e $\frac{\pi}{6}$; 3 e $\frac{7\pi}{4}$'
    - enunciado: 'Escreva a expressão geral dos arcos côngruos a $135^\circ$.'
      espaco: 8
      resolucao: |
        $x = 135^\circ + k \cdot 360^\circ$, $k$ inteiro.
      resposta: '$135^\circ + k \cdot 360^\circ$'
    - enunciado: 'Quais destes arcos são côngruos a $60^\circ$: $420^\circ$, $-300^\circ$, $780^\circ$, $240^\circ$?'
      espaco: 8
      resolucao: |
        $420 - 60 = 360$; $-300 - 60 = -360$; $780 - 60 = 720$: os três primeiros. $240 - 60 = 180$ não é múltiplo de 360.
      resposta: '$420^\circ$, $-300^\circ$ e $780^\circ$'
    - enunciado: 'Em que quadrante fica a extremidade de cada arco: $\frac{\pi}{3}$, $\frac{2\pi}{3}$, $\frac{4\pi}{3}$, $\frac{5\pi}{3}$?'
      espaco: 8
      resolucao: |
        $60^\circ$, $120^\circ$, $240^\circ$, $300^\circ$: 1º, 2º, 3º e 4º quadrantes.
      resposta: '1º, 2º, 3º e 4º'
  - nome: Nível 2
    questoes:
    - texto: |
        Bia disse que a primeira determinação positiva de $-50^\circ$ é $50^\circ$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 8
      resolucao: |
        Trocar o sinal reflete o ponto no eixo horizontal; não é o mesmo ponto. Some uma volta: $-50^\circ + 360^\circ = 310^\circ$.
      resposta: '$310^\circ$'
    - enunciado: 'Quantos pontos distintos do ciclo são extremidades dos arcos $x = \frac{k\pi}{2}$, $k$ inteiro? Quais são?'
      espaco: 8
      resolucao: |
        $0$, $\frac{\pi}{2}$, $\pi$, $\frac{3\pi}{2}$ e depois repete: 4 pontos, os encontros do ciclo com os eixos.
      resposta: '4 pontos'
    - enunciado: 'Quantos pontos distintos determina a expressão $x = \frac{\pi}{6} + \frac{k\pi}{3}$? Que polígono eles formam?'
      espaco: 8
      resolucao: |
        Passo de $60^\circ$: 6 pontos ($30^\circ$, $90^\circ$, …, $330^\circ$), vértices de um hexágono regular.
      resposta: '6; hexágono regular'
    - enunciado: 'Para o arco de $2\,025^\circ$, complete.'
      itens:
      - 'Voltas completas: {{5}}'
      - '1ª determinação: {{225°}}'
      - 'Quadrante: {{3º}}'
      espaco_item: 8
      resolucao: |
        $2\,025 = 5 \cdot 360 + 225$.
      resposta: '5; $225^\circ$; 3º'
    - enunciado: 'Dê, entre $0^\circ$ e $360^\circ$, os arcos simétricos de $40^\circ$ em relação ao eixo vertical, à origem e ao eixo horizontal.'
      espaco: 10
      resolucao: |
        Eixo vertical: $180^\circ - 40^\circ = 140^\circ$. Origem: $180^\circ + 40^\circ = 220^\circ$. Eixo horizontal: $360^\circ - 40^\circ = 320^\circ$.
      resposta: '$140^\circ$, $220^\circ$ e $320^\circ$'
    - enunciado: 'Quais arcos do intervalo $[0, 4\pi]$ têm a mesma extremidade que $\frac{7\pi}{6}$?'
      espaco: 8
      resolucao: |
        $\frac{7\pi}{6}$ e $\frac{7\pi}{6} + 2\pi = \frac{19\pi}{6}$.
      resposta: '$\frac{7\pi}{6}$ e $\frac{19\pi}{6}$'
    - enunciado: 'Um hexágono regular está inscrito no ciclo, com um vértice em $(1, 0)$. Escreva a expressão geral dos arcos com extremidade nos vértices.'
      espaco: 8
      resolucao: |
        Os vértices ficam a cada $\frac{2\pi}{6}$: $x = \frac{k\pi}{3}$.
      resposta: '$x = \frac{k\pi}{3}$'
    - enunciado: 'Um quadrado está inscrito no ciclo, com um vértice na extremidade do arco $\frac{\pi}{4}$. Escreva a expressão geral dos vértices.'
      espaco: 8
      resolucao: |
        Passo de $\frac{2\pi}{4}$: $x = \frac{\pi}{4} + \frac{k\pi}{2}$.
      resposta: '$x = \frac{\pi}{4} + \frac{k\pi}{2}$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que dois arcos $\alpha$ e $\beta$ têm a mesma extremidade se, e somente se, $\alpha - \beta = 2k\pi$, com $k$ inteiro.'
      espaco: 10
      resolucao: |
        Somar $2\pi$ é dar uma volta e voltar ao mesmo ponto; logo arcos que diferem por $2k\pi$ coincidem. Reciprocamente, se coincidem, a diferença é o que se percorreu entre um e outro partindo do mesmo ponto e voltando a ele: um número inteiro de voltas.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que $x = a + \frac{2k\pi}{n}$ ($k$ inteiro, $n \ge 3$) determina exatamente $n$ pontos, vértices de um polígono regular.'
      espaco: 10
      resolucao: |
        Para $k = 0, 1, \dots, n - 1$, os arcos estão em $[a, a + 2\pi)$ e são distintos. Para $k = n$ volta-se ao primeiro, e cada $k$ é côngruo a um desses. Pontos consecutivos distam o mesmo ângulo, $\frac{2\pi}{n}$: polígono regular.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que as extremidades dos arcos $x$ e $-x$ são simétricas em relação ao eixo horizontal.'
      espaco: 10
      resolucao: |
        Os dois percorrem o mesmo ângulo a partir de $(1, 0)$, um no sentido anti-horário e outro no horário: são reflexões um do outro no eixo horizontal.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que as extremidades de $x$ e $\pi - x$ são simétricas em relação ao eixo vertical.'
      espaco: 10
      resolucao: |
        $\pi - x$ parte de $(-1, 0)$, que é o simétrico de $(1, 0)$, e volta $x$ no sentido horário: é a reflexão do percurso de $x$ no eixo vertical.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que as extremidades de $x$ e $\pi + x$ são simétricas em relação à origem.'
      espaco: 10
      resolucao: |
        Somar $\pi$ é dar meia volta: o ponto vai para o lado oposto do diâmetro que passa por ele, que é o seu simétrico em relação ao centro.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Num parque, um brinquedo giratório tem uma cadeira marcada que começa na posição de partida. Durante o passeio, o brinquedo gira, sempre no mesmo sentido, um total de $1\,140^\circ$ e para. O operador quer saber, em relação à posição de partida, onde a cadeira marcada parou.
    enunciado: |
      A cadeira parou a um ângulo, no sentido do giro, de
    opcoes: ['$60^\circ$', '$30^\circ$', '$120^\circ$', '$300^\circ$', '$0^\circ$']
    correta: A
    resolucao: |
      $1\,140 = 3 \cdot 360 + 60$: três voltas completas e mais $60^\circ$.

  - estilo: Fuvest
    enunciado: |
      A primeira determinação positiva do arco de $-1\,210^\circ$ é
    opcoes: ['$130^\circ$', '$230^\circ$', '$310^\circ$', '$50^\circ$', '$210^\circ$']
    correta: B
    resolucao: |
      $-1\,210 + 4 \cdot 360 = 230$.

  - estilo: Unicamp
    enunciado: |
      O arco $\frac{23\pi}{6}$ é côngruo a
    opcoes: ['$\frac{\pi}{6}$.', '$\frac{5\pi}{6}$.', '$\frac{11\pi}{6}$.', '$\frac{7\pi}{6}$.']
    correta: C
    resolucao: |
      $\frac{23\pi}{6} - 2\pi = \frac{11\pi}{6}$.

  - estilo: UEM
    enunciado: |
      Considere o ciclo trigonométrico. Assinale o que for correto.
    proposicoes:
    - '$750^\circ$ é côngruo a $30^\circ$.'
    - 'O arco $-\frac{\pi}{4}$ tem extremidade no 4º quadrante.'
    - '$\frac{13\pi}{3}$ é côngruo a $\frac{\pi}{3}$.'
    - 'Os arcos $\frac{2\pi}{3}$ e $-\frac{4\pi}{3}$ são côngruos.'
    - 'O arco $\frac{5\pi}{2}$ tem extremidade no 2º quadrante.'
    - 'A expressão $x = k\pi$ ($k$ inteiro) determina 2 pontos do ciclo.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      08) Diferem por $2\pi$. 16) Incorreta: $\frac{5\pi}{2} \equiv \frac{\pi}{2}$, sobre o eixo. 32) $0$ e $\pi$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      Num teste de qualidade, cinco motores de brinquedo, P1 a P5, fizeram um braço girar sempre no mesmo sentido. O quadro mostra o ângulo total girado por cada um até parar. O técnico quer saber qual braço parou exatamente na posição em que tinha começado.
    tabela:
      cabecalho: ['Motor', 'P1', 'P2', 'P3', 'P4', 'P5']
      linhas:
      - ['Ângulo girado', '$1\,000^\circ$', '$1\,260^\circ$', '$1\,500^\circ$', '$1\,800^\circ$', '$2\,100^\circ$']
    enunciado: |
      O braço que parou na posição inicial foi o do motor
    opcoes: ['P1.', 'P2.', 'P3.', 'P4.', 'P5.']
    correta: D
    resolucao: |
      Precisa ser múltiplo de $360^\circ$: $1\,800 = 5 \cdot 360$.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir, sobre o ciclo trigonométrico.
    afirmativas:
    - '$400^\circ$ e $40^\circ$ são arcos côngruos.'
    - 'O arco $\frac{3\pi}{4}$ tem extremidade no 3º quadrante.'
    - 'A primeira determinação positiva de $-90^\circ$ é $270^\circ$.'
    - 'A expressão $x = \frac{\pi}{2} + k\pi$ determina 2 pontos do ciclo.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'I e III, apenas.', 'II e IV, apenas.', 'II, III e IV, apenas.', 'I, III e IV, apenas.']
    correta: E
    resolucao: |
      II. Incorreta: $135^\circ$, 2º quadrante. IV. $(0, 1)$ e $(0, -1)$.

  - estilo: Unesp
    enunciado: |
      A expressão $x = \frac{k\pi}{4}$, com $k$ inteiro, determina no ciclo trigonométrico quantos pontos distintos?
    opcoes: ['$8$', '$4$', '$2$', '$16$', '$6$']
    correta: A
    resolucao: |
      Passo de $45^\circ$: $\frac{360}{45} = 8$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      No ciclo trigonométrico da figura, o ponto P é a extremidade de um arco de $150^\circ$.
    figura:
      tikz: |
        \begin{scope}[scale=.65]
        \draw[mudo, ->] (-2.2,0) -- (2.4,0); \draw[mudo, ->] (0,-2.2) -- (0,2.4);
        \draw[ink, line width=.9pt] (0,0) circle (1.8);
        \fill[ink] (1.8,0) circle (1.5pt) node[below right, font=\scriptsize] {$(1, 0)$};
        \fill[roxo] (150:1.8) circle (2.2pt) node[above left, font=\small] {P};
        \draw[roxo] (0,0) -- (150:1.8);
        \draw[roxo, ->] (.5,0) arc (0:150:.5);
        \end{scope}
    enunciado: |
      Também tem extremidade em P o arco
    opcoes: ['$-\frac{5\pi}{6}$.', '$\frac{17\pi}{6}$.', '$\frac{7\pi}{6}$.', '$-\frac{\pi}{6}$.']
    correta: B
    resolucao: |
      $150^\circ = \frac{5\pi}{6}$ e $\frac{17\pi}{6} = 2\pi + \frac{5\pi}{6}$.

  - estilo: Fuvest
    enunciado: |
      As extremidades dos arcos $x = \frac{\pi}{3} + \frac{k\pi}{2}$, $k$ inteiro, são os vértices de um
    opcoes: ['triângulo equilátero', 'hexágono regular', 'quadrado', 'octógono regular', 'retângulo que não é quadrado']
    correta: C
    resolucao: |
      Passo de $\frac{\pi}{2}$: 4 pontos igualmente espaçados.

  - estilo: UFSC
    enunciado: |
      Considere o arco de $1\,845^\circ$. Assinale o que for correto.
    proposicoes:
    - '$1\,845^\circ = 5 \cdot 360^\circ + 45^\circ$.'
    - 'A sua primeira determinação positiva é $45^\circ$.'
    - 'A sua extremidade está no 1º quadrante.'
    - 'Ele é côngruo a $-315^\circ$.'
    - 'Em radianos, ele mede $\frac{41\pi}{4}$.'
    - 'A sua extremidade é o ponto $(0, 1)$.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      08) $45 - 360 = -315$. 16) $\frac{1\,845}{180} = \frac{41}{4}$. 32) Incorreta: $(0, 1)$ é a extremidade de $90^\circ$.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      Numa manobra famosa do skate, o "900", o skatista sobe na rampa e gira o corpo, no ar, um total de $900^\circ$ em torno de um eixo vertical, sempre no mesmo sentido, antes de voltar à rampa. Um juiz quer saber para que lado o skatista fica virado ao terminar o giro, em relação a como estava ao começar.
    enunciado: |
      Ao terminar o giro, o skatista fica
    opcoes: ['virado para o lado oposto ao inicial.', 'virado para o mesmo lado inicial.', 'virado $90^\circ$ em relação ao inicial.', 'virado $270^\circ$ em relação ao inicial.', 'virado $45^\circ$ em relação ao inicial.']
    correta: A
    resolucao: |
      $900 = 2 \cdot 360 + 180$: duas voltas e meia.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'O arco $\frac{7\pi}{4}$ tem extremidade no 4º quadrante.'
    - 'O arco $-\frac{3\pi}{4}$ tem extremidade no 2º quadrante.'
    - '$9\pi$ é côngruo a $\pi$.'
    - 'A extremidade de $-\frac{\pi}{2}$ é o ponto $(0, -1)$.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – F – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – V – F.', 'V – F – V – V.']
    correta: E
    resolucao: |
      (V) (F) $-135^\circ \equiv 225^\circ$, 3º quadrante. (V) $9\pi - \pi = 8\pi$. (V)

  - estilo: Enem
    texto: |
      Para testar uma bicicleta, um técnico marca a válvula do pneu dianteiro, que começa na posição P da figura, a mais à direita da roda. Com a bicicleta de cabeça para baixo, ele gira a roda, no sentido indicado, um total de $2\,130^\circ$. A figura mostra cinco posições marcadas na roda.
    figura:
      tikz: |
        \begin{scope}[scale=.6]
        \draw[ink, line width=1.2pt] (0,0) circle (2);
        \draw[mudo] (0,0) circle (.25);
        \foreach \a/\n in {0/P,60/Q,150/R,240/T,330/S} { \fill[roxo] (\a:2) circle (2.2pt); \node[font=\small] at (\a:2.45) {\n}; }
        \draw[roxo, ->] (20:1.4) arc (20:70:1.4);
        \end{scope}
    enunciado: |
      Ao final, a válvula estará na posição
    opcoes: ['P.', 'Q.', 'R.', 'S.', 'T.']
    correta: D
    resolucao: |
      $2\,130 = 5 \cdot 360 + 330$: a válvula para a $330^\circ$ de P, na posição S.

  - estilo: Unesp
    enunciado: |
      A primeira determinação positiva do arco $-\frac{19\pi}{4}$ é
    opcoes: ['$\frac{3\pi}{4}$', '$\frac{5\pi}{4}$', '$\frac{7\pi}{4}$', '$\frac{\pi}{4}$', '$\frac{3\pi}{2}$']
    correta: B
    resolucao: |
      $-\frac{19\pi}{4} + 6\pi = \frac{5\pi}{4}$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Considere expressões de arcos no ciclo trigonométrico, com $k$ inteiro. Assinale o que for correto.
    proposicoes:
    - '$x = \frac{2k\pi}{3}$ determina os vértices de um triângulo equilátero.'
    - '$x = \frac{\pi}{4} + k\pi$ determina dois pontos diametralmente opostos.'
    - 'As extremidades de $x$ e $-x$ são simétricas em relação ao eixo horizontal.'
    - 'As extremidades de $x$ e $\pi - x$ são simétricas em relação ao eixo vertical.'
    - 'As extremidades de $x$ e $\pi + x$ são simétricas em relação ao eixo vertical.'
    - 'O arco $100\pi$ é côngruo a $0$.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      16) Incorreta: $x$ e $\pi + x$ são simétricos em relação à origem. 32) 50 voltas.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Unicamp
    enunciado: |
      O número de arcos côngruos a $\frac{\pi}{6}$ no intervalo $[0, 10\pi]$ é
    opcoes: ['$5$.', '$4$.', '$6$.', '$10$.']
    correta: A
    resolucao: |
      $\frac{\pi}{6} + 2k\pi \le 10\pi$ para $k = 0, 1, 2, 3, 4$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        A antena de um radar gira sempre no mesmo sentido, o anti-horário, partindo da direção leste, que corresponde ao ângulo $0^\circ$ do ciclo trigonométrico. Um sistema registra o ângulo total girado desde que o radar foi ligado. Num certo instante, o registro marcava $2\,400^\circ$.
    enunciado: |
      Nesse instante, a antena apontava para a direção que forma, com o leste, um ângulo (no sentido anti-horário) de
    opcoes: ['$60^\circ$', '$120^\circ$', '$240^\circ$', '$300^\circ$', '$40^\circ$']
    correta: C
    resolucao: |
      $2\,400 = 6 \cdot 360 + 240$.

  - estilo: Unesp
    enunciado: |
      Essa direção corresponde, no ciclo trigonométrico, a um ponto
    opcoes: ['do 1º quadrante', 'do 2º quadrante', 'sobre um dos eixos', 'do 3º quadrante', 'do 4º quadrante']
    correta: D
    resolucao: |
      $180^\circ < 240^\circ < 270^\circ$.

  - estilo: Fuvest
    enunciado: |
      A soma dos arcos do intervalo $[0, 2\pi)$ da forma $x = \frac{\pi}{8} + \frac{k\pi}{2}$ é
    opcoes: ['$2\pi$', '$3\pi$', '$\frac{\pi}{2}$', '$4\pi$', '$\frac{7\pi}{2}$']
    correta: E
    resolucao: |
      $\frac{\pi}{8} + \frac{5\pi}{8} + \frac{9\pi}{8} + \frac{13\pi}{8} = \frac{28\pi}{8}$.

  - estilo: Unesp
    texto: |
      A figura mostra um pentágono regular inscrito no ciclo trigonométrico, com um vértice no ponto $(0, 1)$.
    figura:
      tikz: |
        \begin{scope}[scale=.6]
        \draw[mudo, ->] (-2.2,0) -- (2.4,0); \draw[mudo, ->] (0,-2.2) -- (0,2.4);
        \draw[mudo] (0,0) circle (1.8);
        \draw[roxo, line width=1pt] (90:1.8) -- (162:1.8) -- (234:1.8) -- (306:1.8) -- (18:1.8) -- cycle;
        \foreach \a in {90,162,234,306,18} \fill[ink] (\a:1.8) circle (1.6pt);
        \end{scope}
    enunciado: |
      Os arcos com extremidade nos vértices são dados por ($k$ inteiro)
    opcoes: ['$x = \frac{2k\pi}{5}$', '$x = \frac{\pi}{2} + \frac{2k\pi}{5}$', '$x = \frac{\pi}{2} + \frac{k\pi}{5}$', '$x = \frac{\pi}{5} + \frac{2k\pi}{5}$', '$x = \frac{k\pi}{5}$']
    correta: B
    resolucao: |
      Um vértice em $\frac{\pi}{2}$ e passo $\frac{2\pi}{5}$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere os conjuntos de arcos $A: x = \frac{k\pi}{2}$ e $B: x = \frac{\pi}{4} + \frac{k\pi}{2}$, com $k$ inteiro.'
    itens:
    - 'Liste os pontos de A e de B no intervalo $[0, 2\pi)$.'
    - 'Mostre que a união de A e B é dada por uma única expressão. Qual polígono ela forma?'
    - 'Quais arcos de A também são da forma $\frac{k\pi}{3}$? Escreva a expressão geral deles.'
    espaco: 62
    resolucao: |
      a) A: $0$, $\frac{\pi}{2}$, $\pi$, $\frac{3\pi}{2}$. B: $\frac{\pi}{4}$, $\frac{3\pi}{4}$, $\frac{5\pi}{4}$, $\frac{7\pi}{4}$.
      b) Juntos, vão de $\frac{\pi}{4}$ em $\frac{\pi}{4}$: $x = \frac{k\pi}{4}$, octógono regular.
      c) Múltiplos comuns de $\frac{\pi}{2}$ e $\frac{\pi}{3}$: $x = k\pi$ (os pontos $(1, 0)$ e $(-1, 0)$).
    resposta: 'b) $x = \frac{k\pi}{4}$; c) $x = k\pi$'

  - estilo: Unicamp
    enunciado: 'Dois corredores giram numa pista circular, no mesmo sentido. A parte do ângulo 0 com $\frac{\pi}{6}$ rad/s; B parte do ângulo $\pi$ com $\frac{\pi}{4}$ rad/s.'
    itens:
    - 'Escreva os ângulos de A e de B no instante $t$ (em segundos).'
    - 'Que condição sobre esses ângulos indica que os dois se encontram?'
    - 'Em que instante eles se encontram pela primeira vez? Em que ponto da pista?'
    espaco: 62
    resolucao: |
      a) $\frac{\pi t}{6}$ e $\pi + \frac{\pi t}{4}$.
      b) Os arcos devem ser côngruos: $\pi + \frac{\pi t}{4} - \frac{\pi t}{6} = 2k\pi$.
      c) $\frac{\pi t}{12} = (2k - 1)\pi$: $t = 12(2k - 1)$, o primeiro é $t = 12$ s. A está em $2\pi$: o ponto de partida de A.
    resposta: 'c) 12 s, no ponto de partida de A'

  - estilo: ITA
    enunciado: |
      O número de pontos distintos do ciclo trigonométrico que são extremidades de arcos da forma $\frac{k\pi}{3}$ ou da forma $\frac{k\pi}{2}$ ($k$ inteiro) é
    opcoes: ['$8$', '$10$', '$6$', '$12$', '$4$']
    correta: A
    espaco: 22
    resolucao: |
      6 pontos da primeira forma e 4 da segunda; em comum, $0$ e $\pi$. Total: $6 + 4 - 2 = 8$.
    resposta: 'A'

  - estilo: Unesp
    enunciado: 'Um relógio é colocado sobre o ciclo trigonométrico, com o 12 no arco $\frac{\pi}{2}$ e o 3 no arco 0. O ponteiro das horas anda no sentido horário.'
    itens:
    - 'Mostre que, às $h$ horas em ponto, o ponteiro das horas indica o arco $\frac{\pi}{2} - \frac{h\pi}{6}$.'
    - 'Dê a primeira determinação positiva do arco indicado às 8 h.'
    - 'Que hora em ponto corresponde ao arco $\frac{2\pi}{3}$?'
    espaco: 62
    resolucao: |
      a) Cada hora é $\frac{2\pi}{12} = \frac{\pi}{6}$, no sentido negativo, a partir de $\frac{\pi}{2}$.
      b) $\frac{\pi}{2} - \frac{4\pi}{3} = -\frac{5\pi}{6}$, côngruo a $\frac{7\pi}{6}$.
      c) $\frac{\pi}{2} - \frac{h\pi}{6} = \frac{2\pi}{3} + 2k\pi$: $h = -1 - 12k$, ou seja, 11 h.
    resposta: 'b) $\frac{7\pi}{6}$; c) 11 h'

  - estilo: UFSC
    enunciado: |
      Considere arcos do ciclo trigonométrico, com $k$ inteiro. Assinale o que for correto.
    proposicoes:
    - '$x = \frac{\pi}{3} + \frac{2k\pi}{3}$ determina os vértices de um triângulo equilátero.'
    - 'O arco $1\,000\pi$ é côngruo a $0$.'
    - 'O arco $-\frac{17\pi}{6}$ é côngruo a $\frac{7\pi}{6}$.'
    - '$x = \frac{k\pi}{6}$ determina os vértices de um dodecágono regular.'
    - 'O arco de 11 rad tem extremidade no 1º quadrante.'
    - 'Se $a$ e $b$ são côngruos, então $a - b$ é múltiplo de $2\pi$.'
    corretas: [1, 2, 3, 4, 6]
    espaco: 22
    resolucao: |
      04) $-\frac{17\pi}{6} + 4\pi = \frac{7\pi}{6}$. 16) Incorreta: $11 - 2\pi \approx 4{,}717$ passa um pouco de $\frac{3\pi}{2} \approx 4{,}712$: 4º quadrante.
    resposta: 'Soma 47 (01 + 02 + 04 + 08 + 32)'

  - estilo: Fuvest
    enunciado: 'Considere os arcos de $k$ radianos, com $k$ inteiro ($0, 1, 2, 3, \dots$).'
    itens:
    - 'Prove que dois desses arcos, $k$ e $m$, com $k \ne m$, nunca têm a mesma extremidade. (Use que $\pi$ é irracional.)'
    - 'Conclua quantos pontos do ciclo eles determinam.'
    - 'Em que quadrante fica a extremidade do arco de 10 rad? Use $\pi \approx 3{,}14$.'
    espaco: 62
    resolucao: |
      a) Se tivessem, $k - m = 2n\pi$ com $n \ne 0$ inteiro, e $\pi = \frac{k - m}{2n}$ seria racional.
      b) Infinitos pontos, todos distintos.
      c) $10 - 2\pi \approx 3{,}72$, entre $\pi \approx 3{,}14$ e $\frac{3\pi}{2} \approx 4{,}71$: 3º quadrante.
    resposta: 'b) infinitos; c) 3º quadrante'

  - estilo: Unicamp
    enunciado: 'Um hexágono regular está inscrito no ciclo trigonométrico, com um vértice no arco $\frac{\pi}{6}$.'
    itens:
    - 'Escreva a expressão geral dos vértices e liste-os em $[0, 2\pi)$.'
    - 'Quais vértices estão sobre os eixos?'
    - 'Calcule a área do hexágono.'
    espaco: 62
    resolucao: |
      a) $x = \frac{\pi}{6} + \frac{k\pi}{3}$: $\frac{\pi}{6}$, $\frac{\pi}{2}$, $\frac{5\pi}{6}$, $\frac{7\pi}{6}$, $\frac{3\pi}{2}$, $\frac{11\pi}{6}$.
      b) $\frac{\pi}{2}$ e $\frac{3\pi}{2}$: os pontos $(0, 1)$ e $(0, -1)$.
      c) Seis triângulos equiláteros de lado 1: $6 \cdot \frac{\sqrt3}{4} = \frac{3\sqrt3}{2}$.
    resposta: 'b) $\frac{\pi}{2}$ e $\frac{3\pi}{2}$; c) $\frac{3\sqrt3}{2}$'

  - estilo: Fuvest
    enunciado: |
      No intervalo $[-2\pi, 2\pi]$, o número de arcos côngruos a $\frac{5\pi}{3}$ é
    opcoes: ['$1$', '$2$', '$3$', '$4$', '$0$']
    correta: B
    espaco: 22
    resolucao: |
      $\frac{5\pi}{3}$ e $\frac{5\pi}{3} - 2\pi = -\frac{\pi}{3}$.
    resposta: 'B'

  - estilo: Unesp
    enunciado: 'A válvula de uma roda está, no início, na extremidade do arco $\frac{\pi}{2}$. A roda gira $750^\circ$ no sentido horário.'
    itens:
    - 'Escreva o arco final da válvula (em graus) e a sua primeira determinação positiva.'
    - 'Em que quadrante a válvula termina?'
    - 'Quanto a roda deveria girar, no mínimo, no sentido anti-horário, para chegar à mesma posição final?'
    espaco: 62
    resolucao: |
      a) $90^\circ - 750^\circ = -660^\circ$, côngruo a $-660 + 720 = 60^\circ$.
      b) 1º quadrante.
      c) De $90^\circ$ a $60^\circ$ no sentido anti-horário: $330^\circ$.
    resposta: 'a) $60^\circ$; b) 1º; c) $330^\circ$'

  - estilo: Fuvest
    enunciado: 'Considere, com $k$ inteiro, os conjuntos $P: x = \frac{2k\pi}{5}$, $Q: x = \frac{\pi}{5} + \frac{2k\pi}{5}$ e $R: x = \frac{k\pi}{5}$.'
    itens:
    - 'Quantos pontos tem cada conjunto?'
    - 'Mostre que P e Q não têm pontos em comum.'
    - 'Mostre que a união de P e Q é R. Que polígonos aparecem?'
    espaco: 62
    resolucao: |
      a) P e Q: 5 pontos cada; R: 10.
      b) Um ponto comum exigiria $\frac{2k\pi}{5} - \frac{\pi}{5} - \frac{2m\pi}{5} = 2n\pi$, ou seja, $2(k - m) - 1 = 10n$: par igual a ímpar, impossível.
      c) P são os múltiplos pares de $\frac{\pi}{5}$ e Q os ímpares: juntos, todos. Dois pentágonos regulares que formam os vértices de um decágono regular.
    resposta: 'a) 5, 5 e 10'
