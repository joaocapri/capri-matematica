# Fonte das listas em PDF da aula A15 — Função do 1º Grau - Definição e Elementos
aula: A15

fixacao:
  intro: Resolva na ordem — do aquecimento ao desafio. Em $f(x)=ax+b$, $a$ é a taxa de variação e $b$ é o valor inicial, $f(0)$.
  secoes:
    - nome: Aquecimento
      questoes:
        - enunciado: Identifique os coeficientes $a$ e $b$ de cada função.
          itens:
            - $f(x)=3x-5$
            - $f(x)=-\tfrac x2+4$
            - $f(x)=7x$
            - $f(x)=2-5x$
          resolucao: |
            Compare com $f(x)=ax+b$; cuidado com a ordem dos termos.
            (a) $a=3$, $b=-5$. (b) $a=-\tfrac12$, $b=4$. (c) $a=7$, $b=0$. (d) $a=-5$, $b=2$.
          resposta: '(a) $3;-5$ \quad (b) $-\tfrac12;\,4$ \quad (c) $7;\,0$ \quad (d) $-5;\,2$'

        - enunciado: Dada $f(x)=4x-3$, calcule $f(0)$, $f(2)$ e $f\!\left(-\tfrac12\right)$.
          resolucao: |
            $f(0)=-3$; \ $f(2)=8-3=5$; \ $f\!\left(-\tfrac12\right)=-2-3=-5$.
          resposta: '$-3$; \ $5$; \ $-5$'

        - enunciado: Determine a raiz (zero) de cada função.
          itens:
            - $f(x)=2x-8$
            - $f(x)=-3x+6$
            - $f(x)=5x+2$
          resolucao: |
            Faça $f(x)=0$, ou use $x=-\tfrac ba$.
            (a) $x=4$. (b) $x=2$. (c) $x=-\tfrac25$.
          resposta: '(a) $4$ \quad (b) $2$ \quad (c) $-\tfrac25$'

        - enunciado: Para $f(x)=3x+1$, calcule a taxa de variação entre $x=1$ e $x=4$, isto é, $\dfrac{f(4)-f(1)}{4-1}$.
          resolucao: |
            $f(4)=13$ e $f(1)=4$: $\dfrac{13-4}{3}=3$, que é exatamente o coeficiente $a$.
          resposta: '$3$'

        - enunciado: Determine a função afim com coeficiente angular $a=2$ tal que $f(3)=11$.
          resolucao: |
            $f(x)=2x+b$ e $6+b=11\Rightarrow b=5$.
          resposta: '$f(x)=2x+5$'

        - enunciado: Classifique cada função como identidade, linear, constante ou afim (não linear).
          itens:
            - $f(x)=x$
            - $f(x)=-4x$
            - $f(x)=6$
            - $f(x)=2x+1$
          resolucao: |
            (a) Identidade ($a=1$, $b=0$). (b) Linear ($b=0$). (c) Constante ($a=0$). (d) Afim, com $a\neq0$ e $b\neq0$.
          resposta: '(a) identidade \quad (b) linear \quad (c) constante \quad (d) afim'

        - enunciado: Um reservatório começa com $500$ L de água e perde $20$ L por minuto. Escreva o volume $V(t)$ após $t$ minutos e determine em quanto tempo ele esvazia.
          resolucao: |
            $V(t)=500-20t$. Esvazia quando $V(t)=0$: $20t=500\Rightarrow t=25$ min.
          resposta: '$V(t)=500-20t$; \ $25$ min'

    - nome: Treino
      questoes:
        - enunciado: Determine a função afim $f$ tal que $f(1)=4$ e $f(3)=10$.
          resolucao: |
            $a=\dfrac{10-4}{3-1}=3$. Então $3+b=4\Rightarrow b=1$.
          resposta: '$f(x)=3x+1$'

        - enunciado: O gráfico de $f(x)=ax+b$ passa pelos pontos $(-2,\,7)$ e $(2,\,-1)$. Determine $f$.
          resolucao: |
            $a=\dfrac{-1-7}{2-(-2)}=-2$. Com $(2,-1)$: $-4+b=-1\Rightarrow b=3$.
          resposta: '$f(x)=-2x+3$'

        - enunciado: Considere $f(x)=(k-2)x+5$. Determine $k$ para que
          itens:
            - $f$ seja constante;
            - $f$ seja crescente.
          resolucao: |
            (a) $k-2=0\Rightarrow k=2$. (b) $k-2>0\Rightarrow k>2$.
          resposta: '(a) $k=2$ \quad (b) $k>2$'

        - enunciado: Para $f(x)=2x-3$, calcule $\dfrac{f(a+h)-f(a)}{h}$, com $h\neq0$.
          resolucao: |
            $f(a+h)-f(a)=2(a+h)-3-(2a-3)=2h$. Dividindo por $h$: $2$.
            Na função afim, a taxa de variação é sempre o coeficiente $a$.
          resposta: '$2$'

        - enunciado: Uma corrida de aplicativo custa $C(x)=5+2{,}4x$ reais, em que $x$ é a distância em km. Interprete os números $5$ e $2{,}4$ e calcule $C(10)$.
          resolucao: |
            $5$ é o valor fixo (cobrado mesmo sem andar); $2{,}4$ é o acréscimo por km rodado.
            $C(10)=5+24=29$ reais.
          resposta: 'fixo R\$\,5; R\$\,2{,}40 por km; R\$\,29{,}00'

        - enunciado: Uma função afim tem $f(0)=-4$ e raiz $x=2$. Determine $f$ e calcule $f(5)$.
          resolucao: |
            $b=-4$ e $2a-4=0\Rightarrow a=2$. Então $f(x)=2x-4$ e $f(5)=6$.
          resposta: '$f(x)=2x-4$; \ $f(5)=6$'

        - enunciado: 'Uma função afim tem os valores da tabela: para $x=0,1,2,3$, temos $y=7,4,1,-2$. Determine a lei da função e sua raiz.'
          resolucao: |
            $y$ diminui $3$ a cada unidade de $x$: $a=-3$; e $b=f(0)=7$.
            $f(x)=-3x+7$, com raiz $x=\tfrac73$.
          resposta: '$f(x)=-3x+7$; \ raiz $\tfrac73$'

        - enunciado: Para $f(x)=3x+2$ e $g(x)=-x+6$, determine $x$ tal que $f(x)=g(x)$ e o valor comum.
          resolucao: |
            $3x+2=-x+6\Rightarrow 4x=4\Rightarrow x=1$. Valor: $f(1)=5$.
          resposta: '$x=1$; valor $5$'

    - nome: Desafio
      questoes:
        - enunciado: Uma função afim satisfaz $f(x+1)-f(x)=5$ para todo $x$ e $f(0)=2$. Determine $f$ e calcule $f(10)$.
          resolucao: |
            $f(x+1)-f(x)=a$, logo $a=5$; e $b=f(0)=2$. Então $f(x)=5x+2$ e $f(10)=52$.
          resposta: '$f(x)=5x+2$; \ $f(10)=52$'

        - enunciado: Sabendo que $f$ é afim e $f(2x+1)=6x+5$, determine $f(x)$.
          resolucao: |
            Com $t=2x+1$: $x=\tfrac{t-1}2$ e $6x+5=3(t-1)+5=3t+2$. Logo, $f(x)=3x+2$.
          resposta: '$f(x)=3x+2$'

        - enunciado: Determine a função afim $f(x)=ax+b$, com $a>0$, tal que $f(f(x))=4x+9$.
          resolucao: |
            $f(f(x))=a(ax+b)+b=a^2x+ab+b$. Então $a^2=4$, com $a>0$: $a=2$.
            E $2b+b=9\Rightarrow b=3$.
          resposta: '$f(x)=2x+3$'

        - enunciado: A conversão de Celsius para Fahrenheit é $F=1{,}8C+32$.
          itens:
            - Quanto vale, em $^\circ$F, a temperatura de $25\ ^\circ$C?
            - Em qual temperatura as duas escalas marcam o mesmo número?
          resolucao: |
            (a) $F=45+32=77\ ^\circ$F.
            (b) $C=1{,}8C+32\Rightarrow -0{,}8C=32\Rightarrow C=-40$. Logo, $-40\ ^\circ$C $=-40\ ^\circ$F.
          resposta: '(a) $77\ ^\circ$F \quad (b) $-40$'

        - enunciado: Uma função afim satisfaz $f(1)+f(2)=13$ e $f(3)=11$. Determine $f$.
          resolucao: |
            $(a+b)+(2a+b)=13\Rightarrow 3a+2b=13$ e $3a+b=11$.
            Subtraindo: $b=2$; então $a=3$.
          resposta: '$f(x)=3x+2$'

vestibular:
  intro: Questões autorais no estilo dos principais vestibulares. Assinale uma única alternativa.
  questoes:
    - enunciado: Uma função afim $f$ satisfaz $f(0)=3$ e $f(2)=11$. Então $f(x)$ é
      opcoes: ['$4x-3$', '$3x+4$', '$4x+3$', '$8x+3$', '$2x+7$']
      correta: C
      resolucao: |
        $b=3$ e $2a+3=11\Rightarrow a=4$.

    - enunciado: A raiz da função $f(x)=-2x+9$ é
      opcoes: ['$-\dfrac92$', '$\dfrac92$', '$-2$', '$9$', '$\dfrac29$']
      correta: B
      resolucao: |
        $-2x+9=0\Rightarrow x=\tfrac92$.

    - enunciado: Das funções abaixo, a única linear é
      opcoes: ['$f(x)=-5x$', '$f(x)=5x+1$', '$f(x)=5$', '$f(x)=x^2$', '$f(x)=\dfrac1x$']
      correta: A
      resolucao: |
        Função linear é a afim com $b=0$, ou seja, $f(x)=ax$, com $a\neq0$.

    - enunciado: Para $f(x)=3x-4$, o valor de $f(5)-f(2)$ é
      opcoes: ['$3$', '$5$', '$7$', '$9$', '$11$']
      correta: D
      resolucao: |
        $f(5)-f(2)=a\cdot(5-2)=3\cdot3=9$ (ou: $11-2=9$).

    - enunciado: Um plano de celular custa R\$\,49{,}90 por mês mais R\$\,0{,}15 por mensagem enviada. Em um mês com $120$ mensagens, o valor da conta será
      opcoes: ['R\$\,18{,}00', 'R\$\,49{,}90', 'R\$\,59{,}90', 'R\$\,64{,}90', 'R\$\,67{,}90']
      correta: E
      resolucao: |
        $49{,}90+0{,}15\cdot120=49{,}90+18=67{,}90$.

    - enunciado: O gráfico de uma função afim passa por $(1,\,2)$ e $(3,\,8)$. O valor de $f(5)$ é
      opcoes: ['$10$', '$12$', '$14$', '$16$', '$18$']
      correta: C
      resolucao: |
        $a=\tfrac{8-2}{3-1}=3$ e $f(x)=3x-1$. Então $f(5)=14$.

    - enunciado: Uma caixa-d'água tem $1\,200$ L e é esvaziada à vazão constante de $40$ L por minuto. Ela ficará vazia após
      opcoes: ['$12$ min', '$20$ min', '$24$ min', '$30$ min', '$40$ min']
      correta: D
      resolucao: |
        $V(t)=1200-40t=0\Rightarrow t=30$ min.

    - enunciado: Uma função afim tem taxa de variação $-3$ e $f(2)=7$. O valor de $f(0)$ é
      opcoes: ['$1$', '$13$', '$16$', '$19$', '$22$']
      correta: B
      resolucao: |
        $f(x)=-3x+b$ e $-6+b=7\Rightarrow b=13$. Logo, $f(0)=13$.

    - enunciado: A função $f(x)=(m-3)x+2$ é decrescente se, e somente se,
      opcoes: ['$m>3$', '$m=3$', '$m\ge3$', '$m>0$', '$m<3$']
      correta: E
      resolucao: |
        Decrescente exige coeficiente angular negativo: $m-3<0\Rightarrow m<3$.

    - enunciado: A bateria de um celular está em $100\%$ e descarrega $8$ pontos percentuais por hora, de forma linear. Ela chegará a $20\%$ após
      opcoes: ['$10$ h', '$11$ h', '$12$ h', '$12{,}5$ h', '$15$ h']
      correta: A
      resolucao: |
        $100-8t=20\Rightarrow 8t=80\Rightarrow t=10$ h. (A alternativa D é o tempo até $0\%$.)

    - enunciado: Sendo $f(x)=2x+b$ e $f(f(1))=13$, o valor de $b$ é
      opcoes: ['$2$', '$3$', '$4$', '$5$', '$6$']
      correta: B
      resolucao: |
        $f(1)=2+b$ e $f(2+b)=4+2b+b=4+3b=13\Rightarrow b=3$.

    - enunciado: A conversão de Celsius para Fahrenheit é dada por $F=1{,}8C+32$. A temperatura, em $^\circ$C, para a qual o valor em $^\circ$F é o dobro do valor em $^\circ$C é
      opcoes: ['$32$', '$40$', '$80$', '$120$', '$160$']
      correta: E
      resolucao: |
        $2C=1{,}8C+32\Rightarrow 0{,}2C=32\Rightarrow C=160$ (e $F=320$).

    - enunciado: Uma função afim $f(x)=ax+b$ satisfaz $f(-1)=1$ e $f(1)=5$. O produto $a\cdot b$ é
      opcoes: ['$6$', '$8$', '$10$', '$12$', '$15$']
      correta: A
      resolucao: |
        Somando $-a+b=1$ e $a+b=5$: $b=3$; então $a=2$. Produto: $6$.

    - enunciado: Uma função afim satisfaz $f(2)=11$ e $f(5)=20$. O valor de $f(8)$ é
      opcoes: ['$23$', '$26$', '$27$', '$29$', '$32$']
      correta: D
      resolucao: |
        A cada $3$ unidades em $x$, $f$ aumenta $9$. De $5$ para $8$: $20+9=29$.

    - enunciado: Os gráficos de $f(x)=3x+2$ e $g(x)=-2x+12$ se cortam no ponto $(x,\,y)$. O valor de $x+y$ é
      opcoes: ['$6$', '$8$', '$10$', '$12$', '$14$']
      correta: C
      resolucao: |
        $3x+2=-2x+12\Rightarrow x=2$ e $y=8$. Soma: $10$.

    - enunciado: Uma função linear $f$ satisfaz $f(3)=12$. O valor de $f(-2)$ é
      opcoes: ['$8$', '$4$', '$0$', '$-4$', '$-8$']
      correta: E
      resolucao: |
        Linear: $f(x)=ax$. $3a=12\Rightarrow a=4$, então $f(-2)=-8$.

    - enunciado: Um vendedor recebe R\$\,1\,500{,}00 fixos mais $4\%$ do valor que vende no mês. Para receber R\$\,2\,700{,}00, ele precisa vender
      opcoes: ['R\$\,25\,000{,}00', 'R\$\,30\,000{,}00', 'R\$\,35\,000{,}00', 'R\$\,40\,000{,}00', 'R\$\,67\,500{,}00']
      correta: B
      resolucao: |
        $1500+0{,}04v=2700\Rightarrow 0{,}04v=1200\Rightarrow v=30\,000$.

    - enunciado: Uma função afim $f(x)=ax+b$, com $a>0$, satisfaz $f(f(x))=9x-8$. O valor de $f(2)$ é
      opcoes: ['$1$', '$2$', '$3$', '$4$', '$8$']
      correta: D
      resolucao: |
        $a^2=9$, com $a>0$: $a=3$. E $ab+b=4b=-8\Rightarrow b=-2$. Então $f(x)=3x-2$ e $f(2)=4$.

    - enunciado: Uma vela de $30$ cm queima $2$ cm a cada $15$ minutos, de forma constante. Ela terá $12$ cm de altura após
      opcoes: ['$1$ h $30$ min', '$2$ h', '$2$ h $15$ min', '$2$ h $30$ min', '$3$ h']
      correta: C
      resolucao: |
        Precisa queimar $18$ cm, ou seja, $9$ blocos de $15$ min: $135$ min $=2$ h $15$ min.

    - enunciado: Uma função afim satisfaz $f(1)+f(2)+f(3)=27$ e $f(5)=15$. O valor de $f(0)$ é
      opcoes: ['$5$', '$6$', '$7$', '$9$', '$15$']
      correta: A
      resolucao: |
        $6a+3b=27\Rightarrow 2a+b=9$ e $5a+b=15$. Subtraindo: $3a=6\Rightarrow a=2$ e $b=5=f(0)$.
