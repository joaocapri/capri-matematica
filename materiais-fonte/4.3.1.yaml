# Aula 4.3.1 — Geometria plana: congruência de triângulos
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: definição e correspondência de elementos; casos LAL, ALA, LLL e LAAo; caso especial do triângulo retângulo
# (hipotenusa e cateto); AAA e ALL não garantem congruência; aplicações: isósceles, paralelogramo, mediatriz, bissetriz,
# medição de distâncias inacessíveis. Semelhança fica para a 4.3.3.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Marcas iguais numa figura indicam medidas iguais. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Indique o caso de congruência (LAL, ALA, LLL ou LAAo) garantido por cada conjunto de dados, ou escreva "não garante".'
      itens:
      - 'Os três lados: {{LLL}}'
      - 'Dois lados e o ângulo entre eles: {{LAL}}'
      - 'Dois ângulos e o lado entre eles: {{ALA}}'
      - 'Dois ângulos e o lado oposto a um deles: {{LAAo}}'
      - 'Os três ângulos: {{não garante}}'
      resolucao: |
        Os quatro casos garantem a congruência. Três ângulos iguais garantem só a mesma forma (semelhança), não o mesmo tamanho.
      resposta: 'LLL; LAL; ALA; LAAo; não garante'
    - enunciado: 'Os triângulos $ABC$ e $DEF$ são congruentes, com $A \leftrightarrow D$, $B \leftrightarrow E$ e $C \leftrightarrow F$. Sabendo que $AB = 7$, $BC = 9$, $AC = 5$ e $\hat{E} = 70°$, complete.'
      itens:
      - '$DE = {{7}}$'
      - '$EF = {{9}}$'
      - '$DF = {{5}}$'
      - '$\hat{B} = {{70°}}$'
      colunas: 2
      resolucao: |
        Cada elemento corresponde ao de mesma posição: $AB \leftrightarrow DE$, $BC \leftrightarrow EF$, $AC \leftrightarrow DF$ e $\hat{B} \leftrightarrow \hat{E}$.
      resposta: '$7$; $9$; $5$; $70°$'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Dois triângulos com os três ângulos respectivamente iguais são congruentes.'
      - 'No caso LAL, o ângulo deve ser o formado pelos dois lados.'
      - 'Dois triângulos com os três lados respectivamente iguais são congruentes.'
      - 'Dois triângulos retângulos com hipotenusas iguais e um cateto igual são congruentes.'
      justificar: true
      espaco: 20
      resolucao: |
        (F) Podem ter tamanhos diferentes (um é ampliação do outro). (V) (V) Caso LLL. (V) Pelo teorema de Pitágoras, o outro cateto também é igual, e vale LLL.
      resposta: F, V, V, V
    - enunciado: 'No quadrilátero da figura, $AB = AD$ e $CB = CD$. Qual caso garante que os triângulos $ABC$ e $ADC$ são congruentes? O que se conclui sobre os ângulos $B\hat{A}C$ e $D\hat{A}C$?'
      figura:
        tikz: |
          \begin{scope}[scale=.75]
          \draw[ink, line width=1pt, fill=lilas!25] (0,3) node[above, font=\scriptsize] {$A$} -- (-1.6,1.2) node[left, font=\scriptsize] {$B$} -- (0,-1.5) node[below, font=\scriptsize] {$C$} -- (1.6,1.2) node[right, font=\scriptsize] {$D$} -- cycle;
          \draw[roxo, dashed] (0,3) -- (0,-1.5);
          \draw[ink] (-0.92,2.02) -- (-0.68,2.18) (0.68,2.18) -- (0.92,2.02);
          \draw[ink] (-0.95,-0.05) -- (-0.7,0.1) (-0.88,-0.17) -- (-0.63,-0.02) (0.7,0.1) -- (0.95,-0.05) (0.63,-0.02) -- (0.88,-0.17);
          \end{scope}
      espaco: 12
      resolucao: |
        $AB = AD$, $CB = CD$ e $AC$ é comum: caso LLL. Os ângulos correspondentes são iguais: $B\hat{A}C = D\hat{A}C$, ou seja, $AC$ é bissetriz de $B\hat{A}D$.
      resposta: 'LLL; são iguais'
    - enunciado: 'Os triângulos $ABC$ e $DEF$ são congruentes ($A \leftrightarrow D$, $B \leftrightarrow E$, $C \leftrightarrow F$), com $AB = 2x + 1$ e $DE = 3x - 4$. Determine $x$ e $AB$.'
      espaco: 10
      resolucao: |
        Lados correspondentes são iguais: $2x + 1 = 3x - 4$, $x = 5$ e $AB = 11$.
      resposta: '$x = 5$; $AB = 11$'
    - enunciado: 'Na figura, os segmentos $AB$ e $CD$ se cortam em $M$, ponto médio de ambos, e $AC = 6$ cm. Qual caso garante que os triângulos $AMC$ e $BMD$ são congruentes? Quanto mede $BD$?'
      figura:
        tikz: |
          \begin{scope}[scale=.85]
          \draw[ink, line width=1pt] (0,0) node[below left, font=\scriptsize] {$A$} -- (4,2) node[above right, font=\scriptsize] {$B$};
          \draw[ink, line width=1pt] (0,2) node[above left, font=\scriptsize] {$C$} -- (4,0) node[below right, font=\scriptsize] {$D$};
          \draw[roxo, line width=1pt] (0,0) -- (0,2) (4,2) -- (4,0);
          \fill[ink] (2,1) circle (2pt) node[below=2pt, font=\scriptsize] {$M$};
          \draw[ink] (0.95,0.38) -- (1.05,0.62) (2.95,1.38) -- (3.05,1.62);
          \draw[ink] (0.9,1.6) -- (1.0,1.36) (1.05,1.64) -- (1.15,1.4) (2.85,0.6) -- (2.95,0.36) (3.0,0.64) -- (3.1,0.4);
          \end{scope}
      espaco: 10
      resolucao: |
        $AM = MB$, $CM = MD$, e os ângulos em $M$ são opostos pelo vértice: caso LAL. Então $BD = AC = 6$ cm.
      resposta: 'LAL; $BD = 6$ cm'
    - enunciado: 'O ponto $P$ está na mediatriz do segmento $AB$, com $PA = 3x - 1$ e $PB = x + 7$. Complete.'
      itens:
      - '$x = {{4}}$'
      - '$PA = {{11}}$'
      colunas: 2
      resolucao: |
        Os pontos da mediatriz são equidistantes de $A$ e $B$ (os triângulos $PMA$ e $PMB$, com $M$ ponto médio, são congruentes por LAL): $3x - 1 = x + 7$, $x = 4$ e $PA = 11$.
      resposta: '$x = 4$; $PA = 11$'
  - nome: Nível 2
    questoes:
    - texto: |
        Os triângulos $ABC$ e $DEF$ têm $AB = DE = 5$, $BC = EF = 7$ e $\hat{A} = \hat{D} = 40°$. Bia concluiu que eles são congruentes "pelo caso LAL".
      enunciado: 'O raciocínio está correto? Explique.'
      espaco: 12
      resolucao: |
        Não. No caso LAL, o ângulo precisa ser o formado pelos dois lados (aqui seria $\hat{B}$). O ângulo $\hat{A}$ é oposto a $BC$: são dois lados e um ângulo não incluído (ALL), que não garante congruência. Com esses dados, há dois triângulos diferentes possíveis.
      resposta: 'Não; ALL não é caso de congruência'
    - enunciado: 'Para medir a largura de um rio, uma pessoa em $A$ mira uma árvore $B$ na outra margem, com $AB$ perpendicular à margem. Ela anda 40 m pela margem até $C$, crava uma estaca, anda mais 40 m até $D$ e, de lá, caminha perpendicularmente à margem, afastando-se do rio, até o ponto $E$ em que $E$, $C$ e $B$ ficam alinhados. Ela mede $DE = 35$ m. Qual é a largura $AB$? Justifique.'
      espaco: 14
      resolucao: |
        Os triângulos $ABC$ e $DEC$ têm $AC = DC = 40$ m, ângulos retos em $A$ e $D$ e ângulos opostos pelo vértice em $C$: caso ALA. Então $AB = DE = 35$ m.
      resposta: '35 m'
    - enunciado: 'No triângulo isósceles $ABC$, $AB = AC$, e $M$ é o ponto médio de $BC$. Prove, por congruência, que $\hat{B} = \hat{C}$ e que $AM$ é perpendicular a $BC$.'
      espaco: 14
      resolucao: |
        $AB = AC$, $BM = MC$ e $AM$ comum: os triângulos $ABM$ e $ACM$ são congruentes (LLL). Então $\hat{B} = \hat{C}$ e $A\hat{M}B = A\hat{M}C$; como esses dois somam $180°$, cada um mede $90°$.
      resposta: 'Ver resolução'
    - enunciado: 'No quadrilátero $ABCD$, $AB$ é paralelo a $CD$ e $AB = CD = 8$ cm, e $BC = 5$ cm. Prove que $AD = BC$ e calcule o perímetro.'
      espaco: 14
      resolucao: |
        Trace a diagonal $AC$. Os triângulos $ABC$ e $CDA$ têm $AB = CD$, $B\hat{A}C = D\hat{C}A$ (alternos internos, pois $AB \parallel CD$) e $AC$ comum: LAL. Então $AD = CB = 5$ cm. Perímetro $8 + 5 + 8 + 5 = 26$ cm.
      resposta: '26 cm'
    - enunciado: 'Em cada item, indique o caso de congruência garantido pelos dados ou escreva "não garante".'
      itens:
      - '$AB = DE$, $BC = EF$, $\hat{B} = \hat{E}$: {{LAL}}'
      - '$\hat{A} = \hat{D}$, $\hat{B} = \hat{E}$, $\hat{C} = \hat{F}$: {{não garante}}'
      - '$AB = DE$, $\hat{A} = \hat{D}$, $\hat{B} = \hat{E}$: {{ALA}}'
      - '$AB = DE$, $BC = EF$, $\hat{A} = \hat{D}$: {{não garante}}'
      - '$\hat{A} = \hat{D}$, $\hat{B} = \hat{E}$, $BC = EF$: {{LAAo}}'
      resolucao: |
        Na linha 4, $\hat{A}$ não está entre $AB$ e $BC$ (seria ALL). Na linha 5, $BC$ é oposto a $\hat{A}$.
      resposta: 'LAL; não garante; ALA; não garante; LAAo'
    - enunciado: 'O ponto $P$ está na bissetriz de um ângulo, e as distâncias de $P$ aos lados do ângulo são $2y + 1$ e $9$ (em cm). Determine $y$ e justifique por congruência.'
      espaco: 12
      resolucao: |
        Os triângulos retângulos formados por $P$, o vértice e os pés das perpendiculares têm a hipotenusa comum e ângulos iguais no vértice: caso LAAo. As distâncias são iguais: $2y + 1 = 9$, $y = 4$.
      resposta: '$y = 4$'
    - enunciado: 'Os triângulos $ABC$ e $DEF$ são congruentes ($A \leftrightarrow D$, $B \leftrightarrow E$, $C \leftrightarrow F$), com $AB = x + y$, $DE = 10$, $BC = x - y$ e $EF = 4$. Determine $x$ e $y$.'
      espaco: 10
      resolucao: |
        $x + y = 10$ e $x - y = 4$: $x = 7$, $y = 3$.
      resposta: '$x = 7$, $y = 3$'
    - enunciado: 'Uma pipa tem a forma do quadrilátero $ABCD$, com $AB = AD$ e $CB = CD$, $\hat{A} = 80°$ e $\hat{C} = 50°$. Calcule $\hat{B}$ e $\hat{D}$.'
      espaco: 10
      resolucao: |
        Os triângulos $ABC$ e $ADC$ são congruentes (LLL), então $\hat{B} = \hat{D}$. A soma dos ângulos do quadrilátero é $360°$: $2\hat{B} = 360° - 130°$, $\hat{B} = \hat{D} = 115°$.
      resposta: '$115°$ e $115°$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que as diagonais de um paralelogramo se cortam ao meio.'
      espaco: 14
      resolucao: |
        Seja $ABCD$ o paralelogramo, com diagonais $AC$ e $BD$ cortando-se em $O$. Os lados opostos são iguais ($AB = CD$, por congruência de $ABC$ e $CDA$). Nos triângulos $AOB$ e $COD$: $AB = CD$, $O\hat{A}B = O\hat{C}D$ e $O\hat{B}A = O\hat{D}C$ (alternos internos): ALA. Logo $AO = OC$ e $BO = OD$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que, se um triângulo $ABC$ tem $\hat{B} = \hat{C}$, então $AB = AC$.'
      espaco: 14
      resolucao: |
        Trace a bissetriz de $\hat{A}$, que corta $BC$ em $D$. Os triângulos $ABD$ e $ACD$ têm $B\hat{A}D = C\hat{A}D$, $\hat{B} = \hat{C}$ e o lado $AD$ comum (oposto a $\hat{B}$ e a $\hat{C}$): LAAo. Então $AB = AC$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que todo ponto da bissetriz de um ângulo está à mesma distância dos dois lados do ângulo.'
      espaco: 12
      resolucao: |
        Seja $P$ na bissetriz do ângulo de vértice $O$, e $E$, $F$ os pés das perpendiculares de $P$ aos lados. Os triângulos $OEP$ e $OFP$ têm ângulos retos em $E$ e $F$, ângulos iguais em $O$ e a hipotenusa $OP$ comum: LAAo. Então $PE = PF$.
      resposta: 'Ver resolução'
    - enunciado: 'No quadrado $ABCD$, os pontos $E$ (em $BC$) e $F$ (em $CD$) são tais que $BE = CF$. Prove que $AE = BF$.'
      espaco: 14
      resolucao: |
        Nos triângulos $ABE$ e $BCF$: $AB = BC$ (lados do quadrado), $\hat{B} = \hat{C} = 90°$ e $BE = CF$. Caso LAL: $AE = BF$.
      resposta: 'Ver resolução'
    - enunciado: 'No triângulo equilátero $ABC$, os pontos $D$, $E$ e $F$ estão em $AB$, $BC$ e $CA$, com $AD = BE = CF$. Prove que o triângulo $DEF$ é equilátero.'
      espaco: 14
      resolucao: |
        Seja $\ell$ o lado e $k = AD = BE = CF$. Então $DB = EC = FA = \ell - k$. Os triângulos $ADF$, $BED$ e $CFE$ têm dois lados $k$ e $\ell - k$ formando ângulos de $60°$: são congruentes (LAL). Então $DF = ED = FE$.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Para medir a largura de um rio sem atravessá-lo, uma equipe usou o método da figura. De $A$, na margem, mirou uma árvore $B$ na outra margem, com $AB$ perpendicular à margem. Andou 40 m pela margem até $C$, mais 40 m até $D$ e, a partir de $D$, caminhou perpendicularmente à margem, afastando-se do rio, até o ponto $E$ de onde viu $C$ e $B$ alinhados. Mediu $DE = 35$ m.
    figura:
      tikz: |
        \begin{scope}[scale=.62]
        \fill[lilas!35] (-0.8,0.3) rectangle (4.8,2.6);
        \draw[ink] (-0.8,0.3) -- (4.8,0.3);
        \draw[ink] (-0.8,2.6) -- (4.8,2.6);
        \fill[lima!70!black] (0,3) circle (4pt) node[above, font=\scriptsize] {$B$};
        \draw[roxo, line width=1pt] (0,3) -- (0,0.3) node[below left, font=\scriptsize] {$A$} -- (4,0.3) node[above right, font=\scriptsize] {$D$} -- (4,-2.4) node[below, font=\scriptsize] {$E$} -- cycle;
        \fill[ink] (2,0.3) circle (2.5pt) node[above, font=\scriptsize] {$C$};
        \node[font=\scriptsize] at (1,-0.05) {40 m};
        \node[font=\scriptsize] at (3,0.6) {40 m};
        \node[font=\scriptsize, right] at (4,-1.05) {35 m};
        \end{scope}
    enunciado: |
      A largura do rio, $AB$, é de
    opcoes: ['$40$ m', '$70$ m', '$80$ m', '$35$ m', '$75$ m']
    correta: D
    resolucao: |
      Os triângulos $ABC$ e $DEC$ têm $AC = DC$, ângulos retos em $A$ e $D$ e ângulos opostos pelo vértice em $C$: são congruentes (ALA). Então $AB = DE = 35$ m.

  - estilo: Fuvest
    enunciado: |
      Os triângulos $ABC$ e $PQR$ têm $AB = PQ$, $\hat{A} = \hat{P}$ e $\hat{B} = \hat{Q}$. Pode-se garantir que eles são congruentes pelo caso
    opcoes: ['LAL', 'ALA', 'LLL', 'LAAo', 'nenhum: não se pode garantir']
    correta: B
    resolucao: |
      O lado $AB$ fica entre os ângulos $\hat{A}$ e $\hat{B}$: caso ALA.

  - estilo: Unicamp
    enunciado: |
      Os triângulos $ABC$ e $PQR$ são congruentes, com $A \leftrightarrow P$, $B \leftrightarrow Q$ e $C \leftrightarrow R$. Se $BC = 12$, então
    opcoes: ['$PQ = 12$.', '$QR = 12$.', '$PR = 12$.', 'nada se pode afirmar sobre os lados de $PQR$.']
    correta: B
    resolucao: |
      $BC$ liga os vértices correspondentes a $Q$ e $R$: $QR = 12$.

  - estilo: UEM
    enunciado: |
      Considere os casos de congruência de triângulos. Assinale o que for correto.
    proposicoes:
    - 'Dois lados e o ângulo formado por eles, respectivamente iguais, garantem a congruência.'
    - 'Dois ângulos e o lado entre eles, respectivamente iguais, garantem a congruência.'
    - 'Três lados respectivamente iguais garantem a congruência.'
    - 'Três ângulos respectivamente iguais garantem a congruência.'
    - 'Dois triângulos retângulos com hipotenusas iguais e um cateto igual são congruentes.'
    corretas: [1, 2, 3, 5]
    resolucao: |
      01) LAL. 02) ALA. 04) LLL. 08) Incorreta: os triângulos podem ter tamanhos diferentes. 16) Correta (caso especial do triângulo retângulo).
      Soma: $01 + 02 + 04 + 16 = 23$.

  - estilo: Enem
    texto: |
      Uma pipa tem a forma do quadrilátero $ABCD$ da figura, em que as varetas $AB$ e $AD$ têm o mesmo comprimento, assim como $CB$ e $CD$. A vareta central, ao longo de $AC$, é a que dá equilíbrio à pipa. O fabricante quer saber qual propriedade a pipa sempre tem, qualquer que seja o tamanho das varetas.
    figura:
      tikz: |
        \begin{scope}[scale=.7]
        \draw[ink, line width=1pt, fill=lilas!30] (0,3) node[above, font=\scriptsize] {$A$} -- (-1.6,1.2) node[left, font=\scriptsize] {$B$} -- (0,-1.5) node[below, font=\scriptsize] {$C$} -- (1.6,1.2) node[right, font=\scriptsize] {$D$} -- cycle;
        \draw[roxo, line width=1pt] (0,3) -- (0,-1.5);
        \draw[ink!60, dashed] (-1.6,1.2) -- (1.6,1.2);
        \end{scope}
    enunciado: |
      Pode-se garantir que
    opcoes: ['a diagonal $AC$ é bissetriz dos ângulos $\hat{A}$ e $\hat{C}$.', 'as diagonais têm o mesmo comprimento.', 'os quatro lados são iguais.', 'a diagonal $BD$ é bissetriz dos ângulos $\hat{B}$ e $\hat{D}$.', 'os ângulos $\hat{A}$ e $\hat{C}$ são iguais.']
    correta: A
    resolucao: |
      $ABC$ e $ADC$ são congruentes (LLL: $AB = AD$, $CB = CD$, $AC$ comum). Então $B\hat{A}C = D\hat{A}C$ e $B\hat{C}A = D\hat{C}A$. As outras propriedades valem só em casos particulares (losango, quadrado).

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir.
    afirmativas:
    - 'Dois triângulos congruentes têm a mesma área.'
    - 'Dois triângulos de mesma área são congruentes.'
    - 'Dois triângulos equiláteros de mesmo lado são congruentes.'
    - 'Dois triângulos isósceles de bases iguais são congruentes.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'II e IV, apenas.', 'I e III, apenas.', 'I, III e IV, apenas.', 'I, II, III e IV.']
    correta: C
    resolucao: |
      I. Correta. II. Incorreta: base 4 e altura 3 dá a mesma área que base 6 e altura 2. III. Correta (LLL). IV. Incorreta: os lados iguais podem ter medidas diferentes.

  - estilo: Unesp
    enunciado: |
      Os triângulos $ABC$ e $DEF$ são congruentes ($A \leftrightarrow D$, $B \leftrightarrow E$, $C \leftrightarrow F$), com $AB = 3x - 5$ e $DE = x + 7$. A medida de $AB$ é
    opcoes: ['$6$', '$7$', '$11$', '$19$', '$13$']
    correta: E
    resolucao: |
      $3x - 5 = x + 7$: $x = 6$ e $AB = 13$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      Na figura, os segmentos $AB$ e $CD$ se cortam em $M$, que é ponto médio de ambos. Sabe-se que $AC = 2y + 3$ e $BD = 15$.
    figura:
      tikz: |
        \begin{scope}[scale=.85]
        \draw[ink, line width=1pt] (0,0) node[below left, font=\scriptsize] {$A$} -- (4,2) node[above right, font=\scriptsize] {$B$};
        \draw[ink, line width=1pt] (0,2) node[above left, font=\scriptsize] {$C$} -- (4,0) node[below right, font=\scriptsize] {$D$};
        \draw[roxo, line width=1pt] (0,0) -- (0,2) (4,2) -- (4,0);
        \fill[ink] (2,1) circle (2pt) node[below=2pt, font=\scriptsize] {$M$};
        \end{scope}
    enunciado: |
      O valor de $y$ é
    opcoes: ['$7{,}5$.', '$9$.', '$6$.', '$12$.']
    correta: C
    resolucao: |
      $AMC$ e $BMD$ são congruentes (LAL: $AM = MB$, $CM = MD$ e ângulos opostos pelo vértice). $2y + 3 = 15$: $y = 6$.

  - estilo: Fuvest
    enunciado: |
      Nos triângulos $ABC$ e $DEF$, $AB = DE$, $AC = DF$ e $\hat{A} = \hat{D}$. Eles são congruentes pelo caso
    opcoes: ['LAL', 'ALA', 'LLL', 'LAAo', 'nenhum: não se pode garantir']
    correta: A
    resolucao: |
      O ângulo $\hat{A}$ é formado pelos lados $AB$ e $AC$: caso LAL.

  - estilo: UFSC
    enunciado: |
      No paralelogramo $ABCD$, as diagonais se cortam em $O$. Assinale o que for correto.
    proposicoes:
    - 'Os triângulos $ABC$ e $CDA$ são congruentes.'
    - '$AO = OC$.'
    - '$AB = CD$.'
    - 'Os triângulos $AOB$ e $COD$ são congruentes.'
    - 'As diagonais têm sempre o mesmo comprimento.'
    - 'As diagonais são sempre perpendiculares.'
    corretas: [1, 2, 3, 4]
    resolucao: |
      01) LAL (ou ALA), com $AC$ comum e ângulos alternos. 02) As diagonais se cortam ao meio. 04) Consequência de 01. 08) ALA, com ângulos alternos internos.
      16) e 32) Incorretas: valem só no retângulo e no losango, respectivamente.
      Soma: $01 + 02 + 04 + 08 = 15$.

  - estilo: Enem
    texto: |
      Um serralheiro produz peças triangulares iguais a um molde. Para conferir cada peça, ele mede apenas três elementos (lados ou ângulos) e compara com o molde. Ele sabe que alguns conjuntos de medidas garantem que a peça é igual ao molde e que outros não garantem.
    enunciado: |
      O único conjunto que NÃO garante que a peça é igual ao molde é
    opcoes: ['os três lados.', 'dois lados e o ângulo entre eles.', 'dois ângulos e o lado entre eles.', 'dois ângulos e o lado oposto a um deles.', 'os três ângulos.']
    correta: E
    resolucao: |
      Os quatro primeiros são os casos LLL, LAL, ALA e LAAo. Com os três ângulos iguais, a peça pode ser uma ampliação ou redução do molde.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'Se $ABC$ e $DEF$ são congruentes, eles têm o mesmo perímetro.'
    - 'Se dois triângulos têm os três ângulos respectivamente iguais, eles são congruentes.'
    - 'Todo ponto da mediatriz de $AB$ está à mesma distância de $A$ e de $B$.'
    - 'Todo ponto da bissetriz de um ângulo está à mesma distância dos lados do ângulo.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – V – F.', 'V – F – V – F.', 'F – F – V – V.', 'V – F – V – V.', 'V – V – F – V.']
    correta: D
    resolucao: |
      (V) (F) Garantem só semelhança. (V) Congruência LAL com o ponto médio. (V) Congruência LAAo dos triângulos retângulos.

  - estilo: Enem
    texto: |
      No logotipo da figura, $ABCD$ é um quadrado, e os pontos $E$ e $F$, nos lados $BC$ e $CD$, foram marcados de modo que $BE = CF$. O designer traçou os segmentos $AE$ e $BF$ e quer saber o ângulo entre eles, que, segundo ele, não muda quando $E$ e $F$ se deslocam mantendo $BE = CF$.
    figura:
      tikz: |
        \begin{scope}[scale=.85]
        \draw[ink, line width=1pt, fill=lilas!20] (0,0) node[below left, font=\scriptsize] {$A$} -- (3,0) node[below right, font=\scriptsize] {$B$} -- (3,3) node[above right, font=\scriptsize] {$C$} -- (0,3) node[above left, font=\scriptsize] {$D$} -- cycle;
        \draw[roxo, line width=1pt] (0,0) -- (3,1) node[right, font=\scriptsize] {$E$};
        \draw[roxo, line width=1pt] (3,0) -- (2,3) node[above, font=\scriptsize] {$F$};
        \end{scope}
    enunciado: |
      O ângulo entre os segmentos $AE$ e $BF$ mede
    opcoes: ['$45°$', '$60°$', '$90°$', '$120°$', 'um valor que depende da posição de $E$']
    correta: C
    resolucao: |
      $ABE$ e $BCF$ são congruentes (LAL: $AB = BC$, ângulos retos, $BE = CF$), então $B\hat{A}E = C\hat{B}F$. Como $B\hat{A}E + A\hat{E}B = 90°$, também $C\hat{B}F + A\hat{E}B = 90°$, e no triângulo formado por $B$, $E$ e o encontro dos segmentos, o terceiro ângulo é $90°$.

  - estilo: Fuvest
    enunciado: |
      Os triângulos $ABC$ e $DEF$ são congruentes ($A \leftrightarrow D$, $B \leftrightarrow E$, $C \leftrightarrow F$), com $AB = x + y$, $DE = 10$, $BC = x - y$ e $EF = 4$. O produto $x \cdot y$ é
    opcoes: ['$10$', '$21$', '$40$', '$24$', '$16$']
    correta: B
    resolucao: |
      $x + y = 10$ e $x - y = 4$: $x = 7$, $y = 3$, produto $21$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Considere triângulos isósceles e congruência. Assinale o que for correto.
    proposicoes:
    - 'Num triângulo isósceles, a mediana relativa à base é também altura.'
    - 'Se um triângulo tem dois ângulos iguais, ele é isósceles.'
    - 'Todo triângulo com os três ângulos iguais é equilátero.'
    - 'Num triângulo isósceles não equilátero, a bissetriz de um ângulo da base é também mediana.'
    - 'Dois triângulos retângulos com hipotenusas iguais são congruentes.'
    corretas: [1, 2, 3]
    resolucao: |
      01) Congruência LLL das metades. 02) Congruência LAAo com a bissetriz do terceiro ângulo. 04) Aplicando 02 duas vezes. 08) Incorreta: isso só vale para a bissetriz do ângulo do vértice. 16) Incorreta: os catetos podem ser diferentes.
      Soma: $01 + 02 + 04 = 7$.

  - estilo: Fuvest
    enunciado: |
      No triângulo equilátero $ABC$, os pontos $D$, $E$ e $F$ estão nos lados $AB$, $BC$ e $CA$, com $AD = BE = CF$. O triângulo $DEF$ é
    opcoes: ['equilátero.', 'isósceles, mas não equilátero.', 'retângulo.', 'escaleno.', 'obtusângulo.']
    correta: A
    resolucao: |
      Os triângulos $ADF$, $BED$ e $CFE$ têm lados $AD = BE = CF$ e $AF = BD = CE$, com ângulo de $60°$ entre eles: são congruentes (LAL), e $DF = ED = FE$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Para medir a distância entre duas árvores, $A$ e $B$, separadas por um lago, um topógrafo fixou uma estaca $C$ de onde via as duas. Prolongou $AC$ até $D$, com $CD = AC$, e $BC$ até $E$, com $CE = BC$, como na figura. Depois mediu $DE = 45$ m.
    figura:
      tikz: |
        \begin{scope}[scale=.75]
        \fill[lilas!40] (0.2,1.2) ellipse (0.7 and 0.9);
        \fill[lima!70!black] (0,0) circle (3pt) node[below left, font=\scriptsize] {$A$};
        \fill[lima!70!black] (0.6,2.4) circle (3pt) node[above left, font=\scriptsize] {$B$};
        \draw[roxo, line width=1pt] (0,0) -- (4,2) node[right, font=\scriptsize] {$D$};
        \draw[roxo, line width=1pt] (0.6,2.4) -- (3.4,-0.4) node[below right, font=\scriptsize] {$E$};
        \draw[ink, line width=1pt] (4,2) -- (3.4,-0.4);
        \fill[ink] (2,1) circle (2.5pt) node[above=2pt, font=\scriptsize] {$C$};
        \end{scope}
    enunciado: |
      A distância entre as árvores é de
    opcoes: ['$22{,}5$ m', '$90$ m', '$30$ m', '$45$ m', '$60$ m']
    correta: D
    resolucao: |
      $ACB$ e $DCE$ são congruentes: $AC = DC$, $BC = EC$ e ângulos opostos pelo vértice em $C$. Então $AB = DE = 45$ m.

  - estilo: Unicamp
    enunciado: |
      A congruência dos triângulos $ACB$ e $DCE$ é garantida pelo caso
    opcoes: ['LAL.', 'ALA.', 'LLL.', 'LAAo.']
    correta: A
    resolucao: |
      Dois lados ($AC = DC$ e $BC = EC$) e o ângulo formado por eles em $C$ (opostos pelo vértice): LAL.

  - estilo: Unesp
    enunciado: |
      O ponto $P$ está na mediatriz do segmento $AB$, com $PA = 2x + 3$ e $PB = 5x - 9$. A medida de $PA$ é
    opcoes: ['$4$', '$8$', '$3$', '$15$', '$11$']
    correta: E
    resolucao: |
      $2x + 3 = 5x - 9$: $x = 4$, $PA = 11$.

  - estilo: Fuvest
    enunciado: |
      No quadrilátero $ABCD$, $AB = AD$, $CB = CD$, $B\hat{A}D = 70°$ e $B\hat{C}D = 40°$. O ângulo $A\hat{B}C$ mede
    opcoes: ['$110°$', '$125°$', '$135°$', '$120°$', '$145°$']
    correta: B
    resolucao: |
      $ABC$ e $ADC$ são congruentes (LLL), então $\hat{B} = \hat{D}$. Com a soma $360°$: $2\hat{B} = 360° - 110°$, $\hat{B} = 125°$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Seja $ABCD$ um paralelogramo ($AB \parallel CD$ e $AD \parallel BC$), com diagonais $AC$ e $BD$ que se cortam em $O$.'
    itens:
    - 'Prove que os triângulos $ABC$ e $CDA$ são congruentes.'
    - 'Conclua que os lados opostos e os ângulos opostos são iguais.'
    - 'Prove que $O$ é o ponto médio das duas diagonais.'
    espaco: 62
    resolucao: |
      a) $AC$ é comum; $B\hat{A}C = D\hat{C}A$ (alternos, $AB \parallel CD$) e $B\hat{C}A = D\hat{A}C$ (alternos, $AD \parallel BC$): ALA.
      b) Então $AB = CD$, $BC = DA$ e $\hat{B} = \hat{D}$. Usando a outra diagonal, também $\hat{A} = \hat{C}$.
      c) Nos triângulos $AOB$ e $COD$: $AB = CD$, $O\hat{A}B = O\hat{C}D$ e $O\hat{B}A = O\hat{D}C$ (alternos): ALA. Logo $AO = OC$ e $BO = OD$.
    resposta: 'Ver resolução'

  - estilo: Unicamp
    texto: |
      Para medir a largura $AB$ de um rio, sendo $B$ uma árvore na outra margem e $AB$ perpendicular à margem, uma pessoa anda $a$ metros pela margem, de $A$ até $C$, e mais $a$ metros, até $D$. De $D$, ela segue perpendicularmente à margem, afastando-se do rio, até $E$, onde vê $C$ e $B$ alinhados.
    enunciado: ''
    itens:
    - 'Prove que os triângulos $ABC$ e $DEC$ são congruentes e indique o caso.'
    - 'Se $DE = 28$ m, qual é a largura do rio?'
    - 'Se a pessoa andasse $a$ metros de $A$ até $C$, mas $2a$ metros de $C$ até $D$, o método ainda daria $AB = DE$? Justifique.'
    espaco: 62
    resolucao: |
      a) $AC = CD = a$, ângulos retos em $A$ e $D$ e ângulos opostos pelo vértice em $C$: ALA.
      b) $AB = DE = 28$ m.
      c) Não: os ângulos continuariam iguais, mas $AC \neq CD$, e não haveria congruência. O triângulo $DEC$ seria uma ampliação de $ABC$ (com $DE = 2AB$).
    resposta: 'a) ALA; b) 28 m; c) não'

  - estilo: ITA
    enunciado: |
      Considere os seguintes conjuntos de dados, iguais em dois triângulos: LLL, LAL, ALA, AAA, ALL (dois lados e um ângulo oposto a um deles), LAAo e, para triângulos retângulos, hipotenusa e um cateto. O número desses conjuntos que garantem a congruência é
    opcoes: ['$3$', '$4$', '$5$', '$6$', '$7$']
    correta: C
    espaco: 22
    resolucao: |
      Garantem: LLL, LAL, ALA, LAAo e hipotenusa-cateto (5). Não garantem: AAA (só semelhança) e ALL (pode haver dois triângulos).
    resposta: 'C'

  - estilo: Unesp
    enunciado: 'No quadrado $ABCD$, os pontos $E$ (em $BC$) e $F$ (em $CD$) são tais que $BE = CF$. Os segmentos $AE$ e $BF$ se cortam em $P$.'
    itens:
    - 'Prove que $AE = BF$.'
    - 'Prove que $AE$ e $BF$ são perpendiculares.'
    - 'Se o lado do quadrado mede 4 e $BE = 1$, use coordenadas, com $A = (0, 0)$ e $B = (4, 0)$, para confirmar os itens a) e b).'
    espaco: 62
    resolucao: |
      a) $ABE$ e $BCF$: $AB = BC$, $\hat{B} = \hat{C} = 90°$, $BE = CF$. LAL: $AE = BF$.
      b) Da congruência, $B\hat{A}E = C\hat{B}F$. No triângulo $ABE$, $B\hat{A}E + B\hat{E}A = 90°$; então $P\hat{B}E + P\hat{E}B = 90°$, e $B\hat{P}E = 90°$.
      c) $C = (4, 4)$, $E = (4, 1)$, $F = (3, 4)$. $AE = \sqrt{17} = BF$. Direções: $(4, 1)$ e $(-1, 4)$, com produto escalar $-4 + 4 = 0$.
    resposta: 'Ver resolução'

  - estilo: UFSC
    enunciado: |
      Assinale o que for correto.
    proposicoes:
    - 'Triângulos congruentes têm a mesma área.'
    - 'Triângulos de mesmo perímetro são congruentes.'
    - 'Dois triângulos retângulos com os catetos respectivamente iguais são congruentes.'
    - 'Dois triângulos isósceles com os lados iguais de mesma medida e o mesmo ângulo do vértice são congruentes.'
    - 'Dois triângulos com dois lados iguais e um ângulo não formado por eles igual são sempre congruentes.'
    - 'Todo ponto da bissetriz de um ângulo está à mesma distância dos seus lados.'
    corretas: [1, 3, 4, 6]
    espaco: 22
    resolucao: |
      01) Correta. 02) Incorreta: $3, 4, 5$ e $4, 4, 4$. 04) LAL (o ângulo reto fica entre os catetos). 08) LAL. 16) Incorreta: é o caso ALL. 32) LAAo.
    resposta: 'Soma 45 (01 + 04 + 08 + 32)'

  - estilo: Fuvest
    enunciado: 'No triângulo equilátero $ABC$ de lado $\ell$, os pontos $D$, $E$ e $F$ estão em $AB$, $BC$ e $CA$, com $AD = BE = CF = k$.'
    itens:
    - 'Prove que os triângulos $ADF$, $BED$ e $CFE$ são congruentes.'
    - 'Conclua que $DEF$ é equilátero.'
    - 'Para que valor de $k$ os vértices de $DEF$ são os pontos médios dos lados de $ABC$? Quanto mede, então, o lado de $DEF$?'
    espaco: 62
    resolucao: |
      a) Em cada um, os lados que partem do vértice do triângulo maior medem $k$ e $\ell - k$, com ângulo de $60°$ entre eles: LAL.
      b) Os terceiros lados, $DF$, $ED$ e $FE$, são correspondentes e iguais.
      c) $k = \tfrac{\ell}{2}$. Então $ADF$ é equilátero de lado $\tfrac{\ell}{2}$ (dois lados $\tfrac{\ell}{2}$ com $60°$ entre eles), e $DF = \tfrac{\ell}{2}$.
    resposta: 'c) $k = \frac{\ell}{2}$; lado $\frac{\ell}{2}$'

  - estilo: Unicamp
    texto: |
      Uma plataforma pantográfica (como a de um macaco de carro) tem duas barras de mesmo comprimento, $AB$ e $CD$, articuladas no ponto $M$, que é o ponto médio de ambas. As pontas $A$ e $C$ apoiam-se no chão, e as pontas $B$ e $D$ sustentam a plataforma.
    enunciado: ''
    itens:
    - 'Prove que os triângulos $AMC$ e $BMD$ são congruentes.'
    - 'Conclua que a distância entre $B$ e $D$ é igual à distância entre $A$ e $C$.'
    - 'Prove que a plataforma $BD$ fica paralela ao chão $AC$, qualquer que seja a abertura das barras.'
    espaco: 62
    resolucao: |
      a) $AM = MB$, $CM = MD$ e $A\hat{M}C = B\hat{M}D$ (opostos pelo vértice): LAL.
      b) $BD = AC$, por correspondência.
      c) Da congruência, $M\hat{A}C = M\hat{B}D$. Esses ângulos são alternos internos em relação às retas $AC$ e $BD$ cortadas pela transversal $AB$; pela recíproca, $BD \parallel AC$.
    resposta: 'Ver resolução'

  - estilo: Fuvest
    enunciado: |
      No quadrilátero $ABCD$, $AB = AD$, $CB = CD$, $\hat{A} = 80°$ e $\hat{C} = 50°$. O ângulo $\hat{B}$ mede
    opcoes: ['$100°$', '$115°$', '$130°$', '$125°$', '$105°$']
    correta: B
    espaco: 22
    resolucao: |
      $ABC$ e $ADC$ são congruentes (LLL): $\hat{B} = \hat{D}$. $2\hat{B} = 360° - 130°$: $\hat{B} = 115°$.
    resposta: 'B'

  - estilo: Unesp
    enunciado: 'No triângulo $ABC$, $\hat{B} = \hat{C}$.'
    itens:
    - 'Prove, traçando a bissetriz de $\hat{A}$, que $AB = AC$.'
    - 'Se $\hat{A} = x$ e $\hat{B} = \hat{C} = 2x + 10°$, determine os ângulos.'
    - 'Se, além disso, $AB = 3y - 2$ e $AC = y + 8$, determine $AB$.'
    espaco: 62
    resolucao: |
      a) A bissetriz corta $BC$ em $D$. $ABD$ e $ACD$: $B\hat{A}D = C\hat{A}D$, $\hat{B} = \hat{C}$ e $AD$ comum: LAAo. Logo $AB = AC$.
      b) $x + 2(2x + 10) = 180$: $x = 32°$; $\hat{B} = \hat{C} = 74°$.
      c) $3y - 2 = y + 8$: $y = 5$, $AB = 13$.
    resposta: 'b) $32°$, $74°$, $74°$; c) $13$'

  - estilo: Fuvest
    enunciado: 'Considere o segmento de extremos $A(0, 4)$ e $B(6, 2)$.'
    itens:
    - 'Prove, por congruência, que todo ponto da mediatriz de $AB$ está à mesma distância de $A$ e de $B$.'
    - 'Prove a recíproca: se $PA = PB$, então $P$ está na mediatriz de $AB$.'
    - 'Determine o ponto do eixo $x$ que está à mesma distância de $A$ e de $B$.'
    espaco: 62
    resolucao: |
      a) Seja $M$ o ponto médio e $P$ na mediatriz. $PMA$ e $PMB$: $MA = MB$, ângulos retos em $M$, $PM$ comum: LAL. $PA = PB$.
      b) Se $PA = PB$, os triângulos $PMA$ e $PMB$ têm os três lados iguais (LLL): os ângulos em $M$ são iguais e suplementares, logo retos, e $PM$ é a mediatriz.
      c) $P = (x, 0)$: $x^2 + 16 = (x - 6)^2 + 4$, $12x = 24$, $x = 2$. $P = (2, 0)$.
    resposta: 'c) $(2, 0)$'
