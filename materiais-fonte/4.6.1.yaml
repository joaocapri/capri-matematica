# Aula 4.6.1 — Geometria plana: polígonos regulares inscritos e circunscritos
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: raio R da circunscrita e apótema (raio r da inscrita); lado e apótema do triângulo equilátero, do quadrado e
# do hexágono regular inscritos (R√3 e R/2; R√2 e R√2/2; R e R√3/2); polígonos circunscritos a uma circunferência de raio r;
# R = 2r no triângulo equilátero; distância entre lados paralelos do hexágono; área A = p·a; octógono e dodecágono (lados
# por Pitágoras) no nível 3. Comprimento da circunferência fica para a 4.8.4.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. R é o raio da circunferência circunscrita ao polígono e a, o apótema. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Uma circunferência tem raio $R = 8$. Complete o quadro com o lado e o apótema de cada polígono regular inscrito nela.'
      tabela:
        cabecalho: ['Polígono', 'Lado', 'Apótema']
        linhas:
        - ['triângulo', '${{8\sqrt{3}}}$', '${{4}}$']
        - ['quadrado', '${{8\sqrt{2}}}$', '${{4\sqrt{2}}}$']
        - ['hexágono', '${{8}}$', '${{4\sqrt{3}}}$']
      resolucao: |
        Triângulo: $\ell = R\sqrt{3}$, $a = \tfrac{R}{2}$. Quadrado: $\ell = R\sqrt{2}$, $a = \tfrac{\ell}{2}$. Hexágono: $\ell = R$, $a = \tfrac{R\sqrt{3}}{2}$.
      resposta: '$8\sqrt{3}$, $4$; $8\sqrt{2}$, $4\sqrt{2}$; $8$, $4\sqrt{3}$'
    - enunciado: 'Associe cada medida de um polígono inscrito numa circunferência de raio $R$ à sua expressão.'
      esquerda:
      - 'lado do triângulo equilátero'
      - 'lado do quadrado'
      - 'lado do hexágono regular'
      - 'apótema do triângulo equilátero'
      - 'apótema do quadrado'
      - 'apótema do hexágono regular'
      direita:
      - '$R$'
      - '$\frac{R\sqrt{2}}{2}$'
      - '$R\sqrt{3}$'
      - '$\frac{R}{2}$'
      - '$\frac{R\sqrt{3}}{2}$'
      - '$R\sqrt{2}$'
      resolucao: |
        São as seis fórmulas da aula; todas saem de triângulos formados pelo centro, um vértice e o ponto médio de um lado.
      resposta: 'De cima para baixo: 3, 5, 1, 4, 6, 2'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'O lado do hexágono regular inscrito é igual ao raio da circunferência.'
      - 'O apótema de um polígono regular é igual ao raio da circunferência circunscrita.'
      - 'O apótema de um polígono regular é o raio da circunferência inscrita nele.'
      - 'No triângulo equilátero, o raio da circunscrita é o dobro do raio da inscrita.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) (F) O apótema é menor que $R$: vai do centro ao meio do lado, e não ao vértice. (V) A circunferência inscrita toca os lados nos pontos médios. (V) $R = 2a$.
      resposta: V, F, V, V
    - enunciado: 'Um quadrado está inscrito numa circunferência de raio 5. Complete.'
      itens:
      - 'Lado do quadrado: {{5\sqrt{2}}}'
      - 'Diagonal do quadrado: {{10}}'
      - 'Apótema do quadrado: {{\frac{5\sqrt{2}}{2}}}'
      espaco_item: 10
      resolucao: |
        A diagonal é um diâmetro: $10$. Lado $\tfrac{10}{\sqrt{2}} = 5\sqrt{2}$; apótema, metade do lado.
      resposta: '$5\sqrt{2}$; $10$; $\frac{5\sqrt{2}}{2}$'
    - enunciado: 'Um hexágono regular tem lado 10. Calcule o raio da circunferência circunscrita e o apótema.'
      espaco: 8
      resolucao: |
        O hexágono se divide em seis triângulos equiláteros de lado 10: $R = 10$, e o apótema é a altura de um deles, $\tfrac{10\sqrt{3}}{2} = 5\sqrt{3}$.
      resposta: '$R = 10$; $a = 5\sqrt{3}$'
    - enunciado: 'O triângulo equilátero da figura tem lado 9 e está inscrito na circunferência de centro $O$. Calcule o raio $R$ e o apótema.'
      figura:
        tikz: |
          \begin{scope}[scale=1]
          \draw[mudo, line width=.8pt] (0,0) circle (1.2);
          \draw[ink, line width=1pt, fill=lilas!25] (90:1.2) -- (210:1.2) -- (330:1.2) -- cycle;
          \fill[ink] (0,0) circle (1.2pt);
          \draw[roxo, line width=.9pt] (0,0) -- (270:0.6);
          \node[right, font=\scriptsize] at (0.05,0.08) {$O$};
          \end{scope}
      espaco: 8
      resolucao: |
        $\ell = R\sqrt{3}$: $R = \tfrac{9}{\sqrt{3}} = 3\sqrt{3}$, e $a = \tfrac{R}{2} = \tfrac{3\sqrt{3}}{2}$.
      resposta: '$R = 3\sqrt{3}$; $a = \frac{3\sqrt{3}}{2}$'
    - enunciado: 'Um quadrado tem lado 8. Calcule os raios das circunferências inscrita e circunscrita a ele.'
      espaco: 8
      resolucao: |
        Inscrita: metade do lado, $4$. Circunscrita: metade da diagonal, $\tfrac{8\sqrt{2}}{2} = 4\sqrt{2}$.
      resposta: '$4$ e $4\sqrt{2}$'
  - nome: Nível 2
    questoes:
    - texto: |
        Para o hexágono regular inscrito numa circunferência de raio 6, Caio escreveu: “o lado é 6, então o apótema também é 6”.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 10
      resolucao: |
        O que mede 6 é o lado e o raio. O apótema é a altura de um triângulo equilátero de lado 6: $3\sqrt{3}$.
      resposta: '$3\sqrt{3}$'
    - enunciado: 'Os três polígonos estão inscritos numa circunferência de raio 12. Complete.'
      tabela:
        cabecalho: ['Polígono', 'Lado', 'Perímetro']
        linhas:
        - ['triângulo', '${{12\sqrt{3}}}$', '${{36\sqrt{3}}}$']
        - ['quadrado', '${{12\sqrt{2}}}$', '${{48\sqrt{2}}}$']
        - ['hexágono', '${{12}}$', '${{72}}$']
      resolucao: |
        Lados $R\sqrt{3}$, $R\sqrt{2}$ e $R$; perímetros, $3\ell$, $4\ell$ e $6\ell$.
      resposta: '$12\sqrt{3}$, $36\sqrt{3}$; $12\sqrt{2}$, $48\sqrt{2}$; $12$, $72$'
    - enunciado: 'Um hexágono regular está circunscrito a uma circunferência de raio 6. Calcule o lado e o perímetro do hexágono.'
      espaco: 10
      resolucao: |
        O raio da inscrita é o apótema: $\tfrac{\ell\sqrt{3}}{2} = 6$, $\ell = \tfrac{12}{\sqrt{3}} = 4\sqrt{3}$. Perímetro $24\sqrt{3}$.
      resposta: '$4\sqrt{3}$; $24\sqrt{3}$'
    - enunciado: 'Um triângulo equilátero está circunscrito a uma circunferência de raio 2. Calcule a altura e o lado do triângulo.'
      espaco: 10
      resolucao: |
        O centro divide a altura em $r$ e $2r$: $h = 3r = 6$. Lado: $\tfrac{\ell\sqrt{3}}{2} = 6$, $\ell = 4\sqrt{3}$.
      resposta: '$h = 6$; $\ell = 4\sqrt{3}$'
    - enunciado: 'Numa circunferência de raio $r$, um quadrado está inscrito e outro está circunscrito. Calcule a razão entre os lados (circunscrito para inscrito).'
      espaco: 10
      resolucao: |
        Circunscrito: lado $2r$. Inscrito: lado $r\sqrt{2}$. Razão $\tfrac{2r}{r\sqrt{2}} = \sqrt{2}$.
      resposta: '$\sqrt{2}$'
    - enunciado: 'A área de um polígono regular é o semiperímetro vezes o apótema. Calcule a área de um hexágono regular de lado 6.'
      espaco: 10
      resolucao: |
        Semiperímetro $18$, apótema $3\sqrt{3}$: $A = 18 \cdot 3\sqrt{3} = 54\sqrt{3}$.
      resposta: '$54\sqrt{3}$'
    - enunciado: 'Um triângulo equilátero tem altura 12. Complete.'
      itens:
      - 'Raio da circunscrita: {{8}}'
      - 'Raio da inscrita: {{4}}'
      - 'Lado: {{8\sqrt{3}}}'
      espaco_item: 10
      resolucao: |
        O centro divide a altura na razão $2 : 1$: $R = 8$, $r = 4$. Lado: $R\sqrt{3} = 8\sqrt{3}$.
      resposta: '$8$; $4$; $8\sqrt{3}$'
    - enunciado: 'Uma porca sextavada tem a forma de um hexágono regular de lado 8 mm. A chave que a gira deve ter a abertura igual à distância entre dois lados paralelos. Calcule essa distância ($\sqrt{3} \approx 1{,}73$).'
      espaco: 10
      resolucao: |
        É o dobro do apótema: $2 \cdot \tfrac{8\sqrt{3}}{2} = 8\sqrt{3} \approx 13{,}8$ mm.
      resposta: '$8\sqrt{3} \approx 13{,}8$ mm'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que o lado do hexágono regular inscrito numa circunferência é igual ao raio.'
      espaco: 12
      resolucao: |
        Ligando o centro a dois vértices consecutivos, o ângulo central é $\tfrac{360°}{6} = 60°$. O triângulo é isósceles (dois raios) com ângulo de $60°$ entre os lados iguais; os outros dois medem $60°$: é equilátero, e o lado do hexágono é igual a $R$.
      resposta: 'Ver resolução'
    - enunciado: 'Deduza o lado e o apótema do triângulo equilátero inscrito numa circunferência de raio $R$.'
      espaco: 14
      resolucao: |
        O centro é o baricentro: está a $\tfrac{2}{3}$ da altura a partir do vértice. Então $R = \tfrac{2}{3}h$ e $a = \tfrac{1}{3}h = \tfrac{R}{2}$. Com $h = R + \tfrac{R}{2} = \tfrac{3R}{2}$ e $h = \tfrac{\ell\sqrt{3}}{2}$: $\ell = R\sqrt{3}$.
      resposta: '$\ell = R\sqrt{3}$; $a = \frac{R}{2}$'
    - enunciado: 'Deduza o lado e o apótema do quadrado inscrito numa circunferência de raio $R$.'
      espaco: 12
      resolucao: |
        A diagonal é um diâmetro: $\ell\sqrt{2} = 2R$, $\ell = R\sqrt{2}$. O apótema é metade do lado: $\tfrac{R\sqrt{2}}{2}$.
      resposta: '$\ell = R\sqrt{2}$; $a = \frac{R\sqrt{2}}{2}$'
    - enunciado: 'Numa circunferência de raio $R$, um triângulo equilátero está inscrito e outro está circunscrito. Prove que o lado do circunscrito é o dobro do lado do inscrito.'
      espaco: 12
      resolucao: |
        Inscrito: $\ell = R\sqrt{3}$. No circunscrito, $R$ é o raio da inscrita, isto é, o apótema: $R = \tfrac{L\sqrt{3}}{6}$, $L = \tfrac{6R}{\sqrt{3}} = 2R\sqrt{3} = 2\ell$.
      resposta: 'Ver resolução'
    - enunciado: 'Seja $AC$ um lado do quadrado inscrito numa circunferência de centro $O$ e raio $R$, e $B$ o ponto médio do arco $AC$. Mostre que $AB$, lado do octógono regular inscrito, mede $R\sqrt{2 - \sqrt{2}}$.'
      espaco: 14
      resolucao: |
        Seja $H$ o ponto médio de $AC$: $AH = \tfrac{R\sqrt{2}}{2}$ e $OH = \tfrac{R\sqrt{2}}{2}$ (apótema do quadrado). $B$ está na reta $OH$: $HB = R - \tfrac{R\sqrt{2}}{2}$. No triângulo $AHB$: $AB^2 = \tfrac{R^2}{2} + R^2\left(1 - \sqrt{2} + \tfrac{1}{2}\right) = R^2(2 - \sqrt{2})$.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Porcas sextavadas têm a forma de um hexágono regular. A chave de boca que gira uma porca é identificada pela distância entre dois lados paralelos da porca, em milímetros, como indica a figura. Um mecânico precisa da chave para uma porca cujo lado mede 10 mm. Use $\sqrt{3} \approx 1{,}73$.
    figura:
      tikz: |
        \begin{scope}[scale=1]
        \draw[ink, line width=1pt, fill=lilas!25] (0:1) -- (60:1) -- (120:1) -- (180:1) -- (240:1) -- (300:1) -- cycle;
        \draw[mudo, fill=white] (0,0) circle (0.45);
        \draw[roxo, <->, line width=.8pt] (1.35,-0.866) -- (1.35,0.866);
        \draw[mudo, dashed] (0.5,0.866) -- (1.45,0.866) (0.5,-0.866) -- (1.45,-0.866);
        \node[right, font=\scriptsize] at (1.4,0) {chave};
        \end{scope}
    enunciado: |
      A medida da chave é, aproximadamente,
    opcoes: ['$20{,}0$ mm', '$17{,}3$ mm', '$10{,}0$ mm', '$8{,}7$ mm', '$15{,}0$ mm']
    correta: B
    resolucao: |
      A distância entre lados paralelos é o dobro do apótema: $2 \cdot \tfrac{10\sqrt{3}}{2} = 10\sqrt{3} \approx 17{,}3$ mm.

  - estilo: Fuvest
    enunciado: |
      O lado do quadrado inscrito numa circunferência de raio $4\sqrt{2}$ mede
    opcoes: ['$8$', '$4$', '$4\sqrt{2}$', '$16$', '$8\sqrt{2}$']
    correta: A
    resolucao: |
      $\ell = R\sqrt{2} = 4\sqrt{2} \cdot \sqrt{2} = 8$.

  - estilo: Unicamp
    enunciado: |
      O lado do triângulo equilátero inscrito numa circunferência de raio 10 mede
    opcoes: ['$5\sqrt{3}$.', '$20$.', '$10\sqrt{3}$.', '$15$.']
    correta: C
    resolucao: |
      $\ell = R\sqrt{3} = 10\sqrt{3}$.

  - estilo: UEM
    enunciado: |
      Considere polígonos regulares inscritos numa circunferência de raio 6. Assinale o que for correto.
    proposicoes:
    - 'O lado do hexágono mede 6.'
    - 'O lado do quadrado mede $6\sqrt{2}$.'
    - 'O apótema do triângulo equilátero mede 3.'
    - 'O apótema do hexágono mede $3\sqrt{2}$.'
    - 'O perímetro do triângulo equilátero é $18\sqrt{3}$.'
    corretas: [1, 2, 3, 5]
    resolucao: |
      01) $\ell = R$. 02) $R\sqrt{2}$. 04) $\tfrac{R}{2}$. 08) Incorreta: $\tfrac{6\sqrt{3}}{2} = 3\sqrt{3}$. 16) $3 \cdot 6\sqrt{3}$.
      Soma: $01 + 02 + 04 + 16 = 23$.

  - estilo: Enem
    texto: |
      Um vidraceiro recebeu uma placa de vidro circular com 1,2 m de diâmetro, que sobrou de outro serviço. Um cliente quer um tampo quadrado, o maior possível, cortado dessa placa. Para fazer o orçamento, o vidraceiro precisa saber a medida do lado do tampo. Use $\sqrt{2} \approx 1{,}41$.
    enunciado: |
      O lado do tampo mede, aproximadamente,
    opcoes: ['$0{,}60$ m', '$1{,}20$ m', '$0{,}42$ m', '$0{,}85$ m', '$1{,}70$ m']
    correta: D
    resolucao: |
      O maior quadrado é o inscrito, com $R = 0{,}6$ m: $\ell = 0{,}6\sqrt{2} \approx 0{,}85$ m.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir.
    afirmativas:
    - 'O apótema do hexágono regular inscrito numa circunferência de raio $R$ é $\frac{R\sqrt{3}}{2}$.'
    - 'O lado do triângulo equilátero circunscrito a uma circunferência de raio $r$ é $2r\sqrt{3}$.'
    - 'O lado do quadrado circunscrito a uma circunferência de raio $r$ é $r\sqrt{2}$.'
    - 'Em todo triângulo equilátero, o raio da circunscrita é o dobro do raio da inscrita.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'III e IV, apenas.', 'II, III e IV, apenas.', 'I e III, apenas.', 'I, II e IV, apenas.']
    correta: E
    resolucao: |
      I. Correta. II. $r$ é o apótema: $\tfrac{\ell\sqrt{3}}{6} = r$, $\ell = 2r\sqrt{3}$. III. Incorreta: o lado é o diâmetro, $2r$. IV. Correta.

  - estilo: Unesp
    enunciado: |
      O lado de um hexágono regular circunscrito a uma circunferência de raio 3 mede
    opcoes: ['$3$', '$\sqrt{3}$', '$2\sqrt{3}$', '$6$', '$3\sqrt{3}$']
    correta: C
    resolucao: |
      O raio é o apótema: $\tfrac{\ell\sqrt{3}}{2} = 3$, $\ell = 2\sqrt{3}$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      Na figura, o quadrado está inscrito na circunferência maior, e a circunferência menor está inscrita no quadrado.
    figura:
      tikz: |
        \begin{scope}[scale=1]
        \draw[ink, line width=1pt] (0,0) circle (1.2);
        \draw[ink, line width=1pt, fill=lilas!25] (45:1.2) -- (135:1.2) -- (225:1.2) -- (315:1.2) -- cycle;
        \draw[roxo, line width=1pt, fill=white] (0,0) circle (0.8485);
        \end{scope}
    enunciado: |
      A razão entre o raio da circunferência menor e o da maior é
    opcoes: ['$\frac{\sqrt{2}}{2}$.', '$\frac{1}{2}$.', '$\frac{\sqrt{3}}{2}$.', '$\frac{\sqrt{3}}{3}$.']
    correta: A
    resolucao: |
      O raio menor é o apótema do quadrado inscrito: $\tfrac{R\sqrt{2}}{2}$. A razão é $\tfrac{\sqrt{2}}{2}$.

  - estilo: Fuvest
    enunciado: |
      A altura de um triângulo equilátero mede 9. O raio da circunferência circunscrita a ele mede
    opcoes: ['$3$', '$4{,}5$', '$9$', '$6$', '$3\sqrt{3}$']
    correta: D
    resolucao: |
      O centro está a $\tfrac{2}{3}$ da altura, a partir do vértice: $R = 6$.

  - estilo: UFSC
    enunciado: |
      O hexágono regular $ABCDEF$ está inscrito numa circunferência de raio 4. Assinale o que for correto.
    proposicoes:
    - 'O lado $AB$ mede 4.'
    - 'A diagonal $AC$ mede $4\sqrt{3}$.'
    - 'A diagonal $AD$ mede 8.'
    - 'O apótema mede $2\sqrt{2}$.'
    - 'O triângulo $ACE$ é equilátero e tem perímetro $12\sqrt{3}$.'
    - 'A distância entre dois lados paralelos é $4\sqrt{3}$.'
    corretas: [1, 2, 3, 5, 6]
    resolucao: |
      01) $\ell = R$. 02) $AC$ é o lado do triângulo equilátero inscrito, $R\sqrt{3}$. 04) $AD$ é um diâmetro. 08) Incorreta: $\tfrac{4\sqrt{3}}{2} = 2\sqrt{3}$. 16) $3 \cdot 4\sqrt{3}$. 32) $2 \cdot 2\sqrt{3}$.
      Soma: $01 + 02 + 04 + 16 + 32 = 55$.

  - estilo: Enem
    texto: |
      O logotipo de uma escola é formado por um círculo externo de raio 3 cm, um triângulo equilátero inscrito nele e um círculo interno, inscrito no triângulo, como na figura. O círculo interno será recortado em metal dourado, e a oficina precisa saber o diâmetro dele.
    figura:
      tikz: |
        \begin{scope}[scale=1]
        \draw[ink, line width=1pt] (0,0) circle (1.2);
        \draw[ink, line width=1pt, fill=lilas!25] (90:1.2) -- (210:1.2) -- (330:1.2) -- cycle;
        \draw[roxo, line width=1pt, fill=lima!40] (0,0) circle (0.6);
        \end{scope}
    enunciado: |
      O diâmetro do círculo interno é
    opcoes: ['$1{,}5$ cm', '$6$ cm', '$2\sqrt{3}$ cm', '$3\sqrt{3}$ cm', '$3$ cm']
    correta: E
    resolucao: |
      No triângulo equilátero, $r = \tfrac{R}{2} = 1{,}5$ cm. O diâmetro é $3$ cm.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'O lado do quadrado inscrito numa circunferência de raio 3 é $3\sqrt{2}$.'
    - 'O apótema do triângulo equilátero inscrito numa circunferência de raio 8 é 4.'
    - 'O lado do hexágono regular circunscrito a uma circunferência de raio 3 é 3.'
    - 'O quadrado circunscrito a uma circunferência de raio 5 tem perímetro 40.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – V – F.', 'V – V – F – V.', 'F – V – F – V.', 'V – F – F – V.', 'V – V – F – F.']
    correta: B
    resolucao: |
      (V) $R\sqrt{2}$. (V) $\tfrac{R}{2}$. (F) $3$ é o apótema: $\ell = 2\sqrt{3}$. (V) Lado $10$.

  - estilo: Enem
    texto: |
      Um canteiro tem a forma de um hexágono regular de lado 2 m e será coberto com grama. O paisagista calcula a área de um polígono regular multiplicando o semiperímetro pelo apótema. A grama é vendida por metro quadrado, e ele precisa da área para fazer o pedido. Use $\sqrt{3} \approx 1{,}7$.
    enunciado: |
      A área do canteiro é, aproximadamente,
    opcoes: ['$10{,}2$ m²', '$12{,}0$ m²', '$6{,}8$ m²', '$20{,}4$ m²', '$5{,}1$ m²']
    correta: A
    resolucao: |
      Semiperímetro $6$ m, apótema $\tfrac{2\sqrt{3}}{2} = \sqrt{3}$ m: $A = 6\sqrt{3} \approx 10{,}2$ m².

  - estilo: Unesp
    enunciado: |
      Numa circunferência, um triângulo equilátero está inscrito e outro está circunscrito. A razão entre o perímetro do inscrito e o do circunscrito é
    opcoes: ['$\frac{1}{3}$', '$\frac{\sqrt{3}}{2}$', '$\frac{1}{2}$', '$\frac{1}{4}$', '$\frac{2}{3}$']
    correta: C
    resolucao: |
      Inscrito: $\ell = R\sqrt{3}$. Circunscrito: $R$ é o apótema, $L = 2R\sqrt{3}$. Razão $\tfrac{1}{2}$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Numa circunferência de raio $r$, um quadrado está inscrito e outro está circunscrito. Assinale o que for correto.
    proposicoes:
    - 'O lado do quadrado inscrito é $r\sqrt{2}$.'
    - 'O lado do quadrado circunscrito é $2r$.'
    - 'A razão entre os perímetros, do circunscrito para o inscrito, é 2.'
    - 'A diagonal do quadrado inscrito mede $r$.'
    - 'O apótema do quadrado circunscrito é $r$.'
    corretas: [1, 2, 5]
    resolucao: |
      01) A diagonal é o diâmetro. 02) O lado é o diâmetro. 04) Incorreta: $\tfrac{2r}{r\sqrt{2}} = \sqrt{2}$. 08) Incorreta: mede $2r$. 16) Correta.
      Soma: $01 + 02 + 16 = 19$.

  - estilo: Unicamp
    enunciado: |
      O lado do octógono regular inscrito numa circunferência de raio $R$ mede
    opcoes: ['$R\sqrt{2}$.', '$R\sqrt{2 - \sqrt{2}}$.', '$\frac{R\sqrt{2}}{2}$.', '$R\sqrt{2 + \sqrt{2}}$.']
    correta: B
    resolucao: |
      Sejam $AC$ um lado do quadrado inscrito, $H$ o seu ponto médio e $B$ o ponto médio do arco $AC$; $AB$ é o lado do octógono. $AH = \tfrac{R\sqrt{2}}{2}$ e $HB = R - \tfrac{R\sqrt{2}}{2}$. Então $AB^2 = R^2(2 - \sqrt{2})$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Uma designer cria peças planas inscritas em círculos de raio $R = 6$ cm. O quadro mostra o polígono regular de cada peça e as expressões do lado e do apótema em função de $R$. Use $\sqrt{3} \approx 1{,}73$.
    tabela:
      cabecalho: ['Peça', 'Polígono', 'Lado', 'Apótema']
      linhas:
      - ['P1', 'triângulo', '$R\sqrt{3}$', '$\frac{R}{2}$']
      - ['P2', 'quadrado', '$R\sqrt{2}$', '$\frac{R\sqrt{2}}{2}$']
      - ['P3', 'hexágono', '$R$', '$\frac{R\sqrt{3}}{2}$']
    enunciado: |
      O perímetro da peça P1 é, aproximadamente,
    opcoes: ['$18{,}0$ cm', '$10{,}4$ cm', '$20{,}8$ cm', '$31{,}1$ cm', '$36{,}0$ cm']
    correta: D
    resolucao: |
      Lado $6\sqrt{3}$; perímetro $18\sqrt{3} \approx 31{,}1$ cm.

  - estilo: Unicamp
    enunciado: |
      A razão entre o apótema da peça P3 e o apótema da peça P1 é
    opcoes: ['$\frac{\sqrt{3}}{2}$.', '$\sqrt{3}$.', '$2$.', '$\frac{\sqrt{3}}{3}$.']
    correta: B
    resolucao: |
      $\tfrac{R\sqrt{3}/2}{R/2} = \sqrt{3}$.

  - estilo: Fuvest
    enunciado: |
      Um triângulo equilátero e um hexágono regular estão inscritos na mesma circunferência. A razão entre o perímetro do triângulo e o do hexágono é
    opcoes: ['$\frac{1}{2}$', '$\sqrt{3}$', '$\frac{\sqrt{3}}{3}$', '$2$', '$\frac{\sqrt{3}}{2}$']
    correta: E
    resolucao: |
      $\tfrac{3R\sqrt{3}}{6R} = \tfrac{\sqrt{3}}{2}$.

  - estilo: Unesp
    texto: |
      A figura mostra um hexágono regular de lado 4 e as circunferências inscrita e circunscrita a ele.
    figura:
      tikz: |
        \begin{scope}[scale=1]
        \draw[ink, line width=1pt] (0,0) circle (1.2);
        \draw[ink, line width=1pt, fill=lilas!25] (0:1.2) -- (60:1.2) -- (120:1.2) -- (180:1.2) -- (240:1.2) -- (300:1.2) -- cycle;
        \draw[roxo, line width=1pt] (0,0) circle (1.0392);
        \end{scope}
    enunciado: |
      A diferença entre os raios das duas circunferências é
    opcoes: ['$4 - 2\sqrt{3}$', '$2\sqrt{3} - 2$', '$2$', '$4 - \sqrt{3}$', '$\sqrt{3}$']
    correta: A
    resolucao: |
      $R = 4$ (o lado) e $r = \tfrac{4\sqrt{3}}{2} = 2\sqrt{3}$ (o apótema). Diferença $4 - 2\sqrt{3}$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere uma circunferência de centro $O$ e raio $R$.'
    itens:
    - 'Deduza o lado e o apótema do hexágono regular inscrito.'
    - 'Deduza o lado e o apótema do quadrado inscrito.'
    - 'Deduza o lado e o apótema do triângulo equilátero inscrito.'
    espaco: 62
    resolucao: |
      a) O ângulo central é $60°$: os seis triângulos são equiláteros, $\ell = R$, e o apótema é a altura de um deles, $\tfrac{R\sqrt{3}}{2}$.
      b) A diagonal é um diâmetro: $\ell\sqrt{2} = 2R$, $\ell = R\sqrt{2}$; apótema $\tfrac{\ell}{2} = \tfrac{R\sqrt{2}}{2}$.
      c) O centro é o baricentro: $R = \tfrac{2h}{3}$ e $a = \tfrac{h}{3} = \tfrac{R}{2}$. Como $h = \tfrac{3R}{2} = \tfrac{\ell\sqrt{3}}{2}$, $\ell = R\sqrt{3}$.
    resposta: 'a) $R$, $\frac{R\sqrt{3}}{2}$; b) $R\sqrt{2}$, $\frac{R\sqrt{2}}{2}$; c) $R\sqrt{3}$, $\frac{R}{2}$'

  - estilo: Unicamp
    texto: |
      Uma circunferência de raio $r$ está inscrita num polígono regular quando é tangente a todos os lados; então, $r$ é o apótema do polígono.
    enunciado: ''
    itens:
    - 'Calcule, em função de $r$, o lado do triângulo equilátero, do quadrado e do hexágono regular circunscritos à circunferência.'
    - 'Para cada um desses polígonos, calcule a razão entre o lado do circunscrito e o lado do inscrito na mesma circunferência.'
    - 'Qual das três razões é a menor? Interprete: o que acontece com essa razão quando o número de lados aumenta?'
    espaco: 62
    resolucao: |
      a) Triângulo: $\tfrac{\ell\sqrt{3}}{6} = r$, $\ell = 2r\sqrt{3}$. Quadrado: $\ell = 2r$. Hexágono: $\tfrac{\ell\sqrt{3}}{2} = r$, $\ell = \tfrac{2r\sqrt{3}}{3}$.
      b) Triângulo: $\tfrac{2r\sqrt{3}}{r\sqrt{3}} = 2$. Quadrado: $\tfrac{2r}{r\sqrt{2}} = \sqrt{2} \approx 1{,}41$. Hexágono: $\tfrac{2r\sqrt{3}/3}{r} \approx 1{,}15$.
      c) A do hexágono. Com mais lados, os dois polígonos ficam cada vez mais parecidos com a circunferência, e a razão se aproxima de 1.
    resposta: 'a) $2r\sqrt{3}$, $2r$, $\frac{2r\sqrt{3}}{3}$; b) $2$, $\sqrt{2}$, $\frac{2\sqrt{3}}{3}$; c) hexágono'

  - estilo: ITA
    enunciado: |
      O lado do dodecágono regular inscrito numa circunferência de raio 2 mede
    opcoes: ['$\sqrt{3} - 1$', '$2 - \sqrt{3}$', '$\sqrt{6} - \sqrt{2}$', '$\sqrt{6} + \sqrt{2}$', '$2\sqrt{3} - 2$']
    correta: C
    espaco: 22
    resolucao: |
      Sejam $AC$ um lado do hexágono inscrito, $H$ o seu ponto médio e $B$ o ponto médio do arco $AC$; $AB$ é o lado do dodecágono. $AH = 1$ e $HB = 2 - \sqrt{3}$ (raio menos apótema). $\ell^2 = 1 + (2 - \sqrt{3})^2 = 8 - 4\sqrt{3} = (\sqrt{6} - \sqrt{2})^2$.
    resposta: 'C'

  - estilo: Unesp
    enunciado: 'Um hexágono regular tem lado 8.'
    itens:
    - 'Calcule o raio da circunferência circunscrita e o apótema.'
    - 'Calcule a área do hexágono, usando $A = p \cdot a$ (semiperímetro vezes apótema).'
    - 'Calcule a razão entre os raios das circunferências inscrita e circunscrita.'
    espaco: 62
    resolucao: |
      a) $R = 8$, $a = 4\sqrt{3}$.
      b) $p = 24$: $A = 24 \cdot 4\sqrt{3} = 96\sqrt{3}$.
      c) $\tfrac{4\sqrt{3}}{8} = \tfrac{\sqrt{3}}{2}$.
    resposta: 'a) 8 e $4\sqrt{3}$; b) $96\sqrt{3}$; c) $\frac{\sqrt{3}}{2}$'

  - estilo: UFSC
    enunciado: |
      Considere um triângulo equilátero de lado 12 e as circunferências inscrita e circunscrita a ele. Assinale o que for correto.
    proposicoes:
    - 'A altura do triângulo mede $6\sqrt{3}$.'
    - 'O raio da circunferência circunscrita mede $4\sqrt{3}$.'
    - 'O raio da circunferência inscrita mede $3\sqrt{3}$.'
    - 'O raio da circunscrita é o triplo do raio da inscrita.'
    - 'O quadrado inscrito na circunferência circunscrita ao triângulo tem lado $4\sqrt{6}$.'
    - 'A distância do centro a um vértice é o dobro da distância do centro a um lado.'
    corretas: [1, 2, 5, 6]
    espaco: 22
    resolucao: |
      01) $\tfrac{12\sqrt{3}}{2}$. 02) $\tfrac{2}{3}h$. 04) Incorreta: $\tfrac{h}{3} = 2\sqrt{3}$. 08) Incorreta: é o dobro. 16) $4\sqrt{3} \cdot \sqrt{2}$. 32) $R = 2r$.
    resposta: 'Soma 51 (01 + 02 + 16 + 32)'

  - estilo: Fuvest
    enunciado: 'Seja $AC$ um lado do quadrado inscrito numa circunferência de centro $O$ e raio $R$, $H$ o ponto médio de $AC$ e $B$ o ponto médio do arco menor $AC$.'
    itens:
    - 'Mostre que $AB$ é o lado do octógono regular inscrito e calcule $AH$ e $HB$.'
    - 'Prove que $AB = R\sqrt{2 - \sqrt{2}}$.'
    - 'Calcule o apótema do octógono em função de $R$.'
    espaco: 62
    resolucao: |
      a) $B$ divide o arco de $90°$ em dois de $45°$, ângulo central do octógono. $AH = \tfrac{R\sqrt{2}}{2}$ e, como $OH = \tfrac{R\sqrt{2}}{2}$, $HB = R - \tfrac{R\sqrt{2}}{2}$.
      b) $AB^2 = \tfrac{R^2}{2} + R^2\left(1 - \tfrac{\sqrt{2}}{2}\right)^2 = \tfrac{R^2}{2} + R^2\left(\tfrac{3}{2} - \sqrt{2}\right) = R^2(2 - \sqrt{2})$.
      c) $a^2 = R^2 - \tfrac{AB^2}{4} = R^2 \cdot \tfrac{2 + \sqrt{2}}{4}$: $a = \tfrac{R}{2}\sqrt{2 + \sqrt{2}}$.
    resposta: 'c) $\frac{R}{2}\sqrt{2 + \sqrt{2}}$'

  - estilo: Unicamp
    enunciado: 'Seja $AC$ um lado do hexágono regular inscrito numa circunferência de raio 1, e $B$ o ponto médio do arco menor $AC$.'
    itens:
    - 'Mostre que $AB$ é o lado do dodecágono regular inscrito e calcule $AB^2$.'
    - 'Verifique que $AB = \frac{\sqrt{6} - \sqrt{2}}{2}$.'
    - 'Calcule o perímetro do dodecágono e compare com o do hexágono inscrito ($\sqrt{6} \approx 2{,}449$ e $\sqrt{2} \approx 1{,}414$).'
    espaco: 62
    resolucao: |
      a) O arco $AC$ tem $60°$, e $B$ o divide em dois de $30°$. Com $H$ médio de $AC$: $AH = \tfrac{1}{2}$, $HB = 1 - \tfrac{\sqrt{3}}{2}$. $AB^2 = \tfrac{1}{4} + 1 - \sqrt{3} + \tfrac{3}{4} = 2 - \sqrt{3}$.
      b) $\left(\tfrac{\sqrt{6} - \sqrt{2}}{2}\right)^2 = \tfrac{8 - 2\sqrt{12}}{4} = 2 - \sqrt{3}$.
      c) $12 \cdot \tfrac{\sqrt{6} - \sqrt{2}}{2} = 6(\sqrt{6} - \sqrt{2}) \approx 6{,}21$, maior que o perímetro do hexágono, $6$.
    resposta: 'a) $2 - \sqrt{3}$; c) $\approx 6{,}21$ (hexágono: 6)'

  - estilo: Fuvest
    enunciado: |
      Um quadrado e um hexágono regular estão circunscritos a uma mesma circunferência de raio 3. A razão entre o perímetro do quadrado e o do hexágono é
    opcoes: ['$\frac{2\sqrt{3}}{3}$', '$\frac{\sqrt{3}}{2}$', '$\frac{4}{3}$', '$\sqrt{2}$', '$\frac{2}{3}$']
    correta: A
    espaco: 22
    resolucao: |
      Quadrado: lado 6, perímetro 24. Hexágono: $\tfrac{\ell\sqrt{3}}{2} = 3$, $\ell = 2\sqrt{3}$, perímetro $12\sqrt{3}$. Razão $\tfrac{24}{12\sqrt{3}} = \tfrac{2\sqrt{3}}{3}$.
    resposta: 'A'

  - estilo: Unesp
    texto: |
      Uma porca sextavada tem a forma de um hexágono regular. A chave que a gira é identificada pela distância entre dois lados paralelos da porca.
    enunciado: ''
    itens:
    - 'Para uma porca de lado $\ell$, calcule a distância entre lados paralelos e a distância entre vértices opostos.'
    - 'Uma porca é girada por uma chave de 19 mm. Calcule o lado da porca ($\sqrt{3} \approx 1{,}73$).'
    - 'Qual é o menor diâmetro de um furo circular por onde essa porca passe?'
    espaco: 62
    resolucao: |
      a) Lados paralelos: $2 \cdot \tfrac{\ell\sqrt{3}}{2} = \ell\sqrt{3}$. Vértices opostos: $2R = 2\ell$.
      b) $\ell\sqrt{3} = 19$: $\ell = \tfrac{19}{\sqrt{3}} \approx 11{,}0$ mm.
      c) O furo deve conter a circunferência circunscrita: diâmetro $2\ell \approx 22{,}0$ mm.
    resposta: 'a) $\ell\sqrt{3}$ e $2\ell$; b) $\approx 11{,}0$ mm; c) $\approx 22{,}0$ mm'

  - estilo: Fuvest
    enunciado: 'Uma circunferência $C_1$ está inscrita num triângulo equilátero de lado $6\sqrt{3}$. Um quadrado está inscrito em $C_1$, e uma circunferência $C_2$ está inscrita nesse quadrado.'
    itens:
    - 'Calcule o raio de $C_1$.'
    - 'Calcule o lado do quadrado e o raio de $C_2$.'
    - 'Calcule a razão entre os raios de $C_2$ e de $C_1$.'
    espaco: 62
    resolucao: |
      a) Altura $9$; o raio da inscrita é $\tfrac{h}{3} = 3$.
      b) Lado $3\sqrt{2}$; raio de $C_2$: metade do lado, $\tfrac{3\sqrt{2}}{2}$.
      c) $\tfrac{3\sqrt{2}/2}{3} = \tfrac{\sqrt{2}}{2}$.
    resposta: 'a) 3; b) $3\sqrt{2}$ e $\frac{3\sqrt{2}}{2}$; c) $\frac{\sqrt{2}}{2}$'
