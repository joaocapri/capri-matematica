# Aula 4.15.1 — Geometria espacial: cone, elementos e áreas
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: elementos do cone reto (raio r, altura h, geratriz g, eixo, secção meridiana); g² = h² + r²;
# planificação (setor de raio g e arco 2πr, ângulo θ = 360°·r/g); A_L = πrg e A_T = πr(g + r); cone equilátero
# (g = 2r, h = r√3, A_T = 3πr², planificação semicircular); ângulo de abertura; montar um cone a partir de um setor.
# Volume fica para a 4.15.2.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Deixe as respostas em função de $\pi$, salvo indicação. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Um cone reto tem raio 7 e altura 24. Complete.'
      itens:
      - 'Geratriz: {{25}}'
      - 'Área lateral: {{175\pi}}'
      - 'Área da base: {{49\pi}}'
      - 'Área total: {{224\pi}}'
      espaco_item: 8
      resolucao: |
        $g = \sqrt{576 + 49} = 25$; $A_L = \pi \cdot 7 \cdot 25$; $A_b = 49\pi$; $A_T = 175\pi + 49\pi$.
      resposta: '25; $175\pi$; $49\pi$; $224\pi$'
    - enunciado: 'Associe cada elemento do cone reto à sua descrição.'
      esquerda:
      - 'geratriz'
      - 'raio da base'
      - 'altura'
      - 'secção meridiana'
      - 'planificação da superfície lateral'
      direita:
      - 'setor circular'
      - 'triângulo isósceles obtido cortando o cone por um plano que contém o eixo'
      - 'distância do vértice ao plano da base'
      - 'segmento do vértice a um ponto da circunferência da base'
      - 'distância do centro da base a um ponto da circunferência da base'
      resolucao: |
        Altura, raio e geratriz formam um triângulo retângulo: $g^2 = h^2 + r^2$.
      resposta: 'De cima para baixo: 5, 4, 3, 1, 2'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Num cone reto, a geratriz é maior que a altura.'
      - 'A área lateral de um cone é $\pi r h$.'
      - 'No cone equilátero, a secção meridiana é um triângulo equilátero.'
      - 'A superfície lateral de um cone, planificada, é um triângulo.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) É a hipotenusa. (F) É $\pi r g$, com a geratriz. (V) Os lados são $g$, $g$ e $2r = g$. (F) É um setor circular.
      resposta: V, F, V, F
    - enunciado: 'Complete para cones de raio $r$ e geratriz $g$.'
      tabela:
        cabecalho: ['$r$', '$g$', '$A_L$', '$A_T$']
        linhas:
        - ['$2$', '$5$', '${{10\pi}}$', '${{14\pi}}$']
        - ['$3$', '$7$', '${{21\pi}}$', '${{30\pi}}$']
        - ['$5$', '$9$', '${{45\pi}}$', '${{70\pi}}$']
        - ['$1$', '$4$', '${{4\pi}}$', '${{5\pi}}$']
      resolucao: |
        $A_L = \pi r g$ e $A_T = \pi r(g + r)$.
      resposta: '$10\pi$, $14\pi$; $21\pi$, $30\pi$; $45\pi$, $70\pi$; $4\pi$, $5\pi$'
    - enunciado: 'No cone da figura, $h = 15$ e $r = 8$. Calcule a geratriz e a área lateral.'
      figura:
        tikz: |
          \begin{scope}[scale=.8]
          \draw[ink, line width=1pt] (-1.6,0) -- (0,3) -- (1.6,0);
          \draw[ink, line width=1pt] (-1.6,0) arc (180:360:1.6 and 0.4);
          \draw[ink, dashed] (1.6,0) arc (0:180:1.6 and 0.4);
          \draw[roxo, dashed] (0,0) -- (0,3);
          \draw[roxo, line width=1pt] (0,0) -- (1.6,0);
          \node[left, font=\scriptsize] at (0,1.4) {$h$};
          \node[below, font=\scriptsize] at (0.8,0) {$r$};
          \node[right, font=\scriptsize] at (0.9,1.5) {$g$};
          \end{scope}
      espaco: 8
      resolucao: |
        $g = \sqrt{225 + 64} = 17$; $A_L = \pi \cdot 8 \cdot 17 = 136\pi$.
      resposta: '$g = 17$; $136\pi$'
    - enunciado: 'A superfície lateral de um cone, planificada, é um setor circular de raio 12 e ângulo $120°$. Calcule o raio da base e a área lateral.'
      espaco: 10
      resolucao: |
        O arco mede $\tfrac{120}{360} \cdot 2\pi \cdot 12 = 8\pi = 2\pi r$: $r = 4$. $A_L = \pi \cdot 4 \cdot 12 = 48\pi$ (a área do setor).
      resposta: '$r = 4$; $48\pi$'
    - enunciado: 'Um cone equilátero tem raio 4. Calcule a geratriz, a altura e a área total.'
      espaco: 10
      resolucao: |
        $g = 2r = 8$; $h = \sqrt{64 - 16} = 4\sqrt{3}$; $A_T = \pi \cdot 4 \cdot 12 = 48\pi$.
      resposta: '8; $4\sqrt{3}$; $48\pi$'
  - nome: Nível 2
    questoes:
    - texto: |
        Para um cone de raio 5 e altura 12, Caio calculou a área lateral: $A_L = \pi \cdot 5 \cdot 12 = 60\pi$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 10
      resolucao: |
        A área lateral usa a geratriz, não a altura: $g = \sqrt{144 + 25} = 13$ e $A_L = 65\pi$.
      resposta: '$65\pi$'
    - enunciado: 'Complete com o ângulo $\theta$ do setor da planificação lateral, que é $\theta = 360° \cdot \frac{r}{g}$.'
      tabela:
        cabecalho: ['$r$', '$g$', '$\theta$']
        linhas:
        - ['$3$', '$9$', '${{120°}}$']
        - ['$4$', '$6$', '${{240°}}$']
        - ['$5$', '$20$', '${{90°}}$']
        - ['$2$', '$12$', '${{60°}}$']
      resolucao: |
        O arco do setor ($\tfrac{\theta}{360°} \cdot 2\pi g$) é o contorno da base ($2\pi r$).
      resposta: '$120°$; $240°$; $90°$; $60°$'
    - enunciado: 'Um chapéu de festa é um cone de papel, sem base, com 10 cm de raio e 24 cm de altura. Calcule a área de papel, com $\pi \approx 3{,}14$.'
      espaco: 10
      resolucao: |
        $g = \sqrt{576 + 100} = 26$ cm; $A_L = 260\pi \approx 816{,}4$ cm².
      resposta: '$\approx 816{,}4$ cm²'
    - enunciado: 'Um cone tem raio 5 e área total $75\pi$. Calcule a geratriz e a altura, e mostre que o cone é equilátero.'
      espaco: 10
      resolucao: |
        $5(g + 5) = 75$: $g = 10 = 2r$, logo é equilátero. $h = \sqrt{100 - 25} = 5\sqrt{3}$.
      resposta: '$g = 10$; $h = 5\sqrt{3}$'
    - enunciado: 'Com um setor circular de raio 8 igual a $\frac{3}{4}$ de um círculo, monta-se um cone. Calcule o raio da base, a altura e a área lateral.'
      espaco: 10
      resolucao: |
        Arco $\tfrac{3}{4} \cdot 16\pi = 12\pi = 2\pi r$: $r = 6$. $h = \sqrt{64 - 36} = 2\sqrt{7}$. $A_L = \pi \cdot 6 \cdot 8 = 48\pi$.
      resposta: '6; $2\sqrt{7}$; $48\pi$'
    - enunciado: 'Um cone tem raio 5 e altura 5. Calcule a geratriz, a área lateral e o ângulo de abertura (no vértice da secção meridiana).'
      espaco: 10
      resolucao: |
        $g = 5\sqrt{2}$; $A_L = 25\sqrt{2}\,\pi$. A altura forma $45°$ com cada geratriz: abertura de $90°$.
      resposta: '$5\sqrt{2}$; $25\sqrt{2}\,\pi$; $90°$'
    - enunciado: 'Um triângulo retângulo de catetos 9 e 12 gira em torno do cateto de 12. Calcule a área total do cone gerado.'
      espaco: 10
      resolucao: |
        $r = 9$, $h = 12$, $g = 15$: $A_T = \pi \cdot 9 \cdot (15 + 9) = 216\pi$.
      resposta: '$216\pi$'
    - enunciado: 'Num cone, a área lateral é o dobro da área da base. Calcule $\frac{g}{r}$ e o ângulo do setor da planificação.'
      espaco: 10
      resolucao: |
        $\pi r g = 2\pi r^2$: $\tfrac{g}{r} = 2$. $\theta = 360° \cdot \tfrac{1}{2} = 180°$.
      resposta: '2; $180°$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que a área lateral de um cone de raio $r$ e geratriz $g$ é $\pi r g$, usando a planificação.'
      espaco: 12
      resolucao: |
        A planificação é um setor de raio $g$ e arco $2\pi r$. A área do setor é proporcional ao arco: $\tfrac{2\pi r}{2\pi g} \cdot \pi g^2 = \pi r g$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que o ângulo do setor da planificação lateral é $\theta = 360° \cdot \frac{r}{g}$.'
      espaco: 10
      resolucao: |
        O arco do setor é o contorno da base: $\tfrac{\theta}{360°} \cdot 2\pi g = 2\pi r$, logo $\theta = 360° \cdot \tfrac{r}{g}$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que um cone equilátero de raio $r$ tem altura $r\sqrt{3}$ e área total $3\pi r^2$.'
      espaco: 10
      resolucao: |
        $g = 2r$: $h = \sqrt{4r^2 - r^2} = r\sqrt{3}$. $A_T = \pi r(2r + r) = 3\pi r^2$.
      resposta: 'Ver resolução'
    - enunciado: 'Um setor circular de raio $R$ e ângulo $\theta$ é enrolado para formar a superfície lateral de um cone. Prove que a altura do cone é $R\sqrt{1 - \left(\frac{\theta}{360°}\right)^2}$.'
      espaco: 12
      resolucao: |
        A geratriz é $R$ e o raio é $r = R \cdot \tfrac{\theta}{360°}$. $h = \sqrt{R^2 - r^2} = R\sqrt{1 - \left(\tfrac{\theta}{360°}\right)^2}$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que, em qualquer cone reto, a área lateral é maior que a área da base.'
      espaco: 8
      resolucao: |
        $\tfrac{A_L}{A_b} = \tfrac{\pi r g}{\pi r^2} = \tfrac{g}{r} > 1$, pois a geratriz é a hipotenusa do triângulo de catetos $h$ e $r$.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Uma gráfica produz chapéus de aniversário em forma de cone, sem base, como na figura. Cada chapéu tem 9 cm de raio na abertura e 12 cm de altura. Para orçar o papel, a gráfica precisa da área de cada chapéu, desprezando as sobreposições da colagem. Use 3 como aproximação para $\pi$.
    figura:
      tikz: |
        \begin{scope}[scale=.6]
        \fill[lilas!35] (-1.5,0) -- (0,2.4) -- (1.5,0) arc (360:180:1.5 and 0.35);
        \draw[ink, line width=1pt] (-1.5,0) -- (0,2.4) -- (1.5,0);
        \draw[ink, line width=1pt] (0,0) ellipse (1.5 and 0.35);
        \fill[roxo] (0,2.4) circle (2.5pt);
        \end{scope}
    enunciado: |
      A área de papel de cada chapéu é
    opcoes: ['$405$ cm²', '$324$ cm²', '$540$ cm²', '$243$ cm²', '$675$ cm²']
    correta: A
    resolucao: |
      $g = \sqrt{144 + 81} = 15$ cm. $A_L = \pi \cdot 9 \cdot 15 = 135\pi \approx 405$ cm².

  - estilo: Fuvest
    enunciado: |
      A geratriz de um cone reto de raio 9 e altura 40 mede
    opcoes: ['$49$', '$41$', '$31$', '$\sqrt{1519}$', '$45$']
    correta: B
    resolucao: |
      $\sqrt{1600 + 81} = \sqrt{1681} = 41$.

  - estilo: Unicamp
    enunciado: |
      A área total de um cone equilátero de raio 2 é
    opcoes: ['$8\pi$.', '$4\pi$.', '$12\pi$.', '$16\pi$.']
    correta: C
    resolucao: |
      $g = 4$: $A_T = \pi \cdot 2 \cdot (4 + 2) = 12\pi$.

  - estilo: UEM
    enunciado: |
      Considere um cone reto de raio 12 e altura 5. Assinale o que for correto.
    proposicoes:
    - 'A geratriz mede 13.'
    - 'A área lateral é $156\pi$.'
    - 'A área total é $300\pi$.'
    - 'A secção meridiana tem área 60.'
    - 'O cone é equilátero.'
    - 'A secção meridiana tem perímetro 50.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) $\sqrt{25 + 144}$. 02) $\pi \cdot 12 \cdot 13$. 04) $156\pi + 144\pi$. 08) Triângulo de base 24 e altura 5. 16) Incorreta: $g \ne 2r$. 32) $13 + 13 + 24$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      Uma tenda de acampamento tem a forma de um cone reto, sem piso, com 2,4 m de raio na base e 3,2 m de altura. O fabricante quer saber quanto tecido é usado em cada tenda, desconsiderando costuras e a abertura da porta. Use 3 como aproximação para $\pi$.
    enunciado: |
      A área de tecido de cada tenda é
    opcoes: ['$46{,}08$ m²', '$23{,}04$ m²', '$57{,}6$ m²', '$28{,}8$ m²', '$38{,}4$ m²']
    correta: D
    resolucao: |
      $g = \sqrt{3{,}2^2 + 2{,}4^2} = 4$ m. $A_L = \pi \cdot 2{,}4 \cdot 4 = 9{,}6\pi \approx 28{,}8$ m².

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir, sobre um cone reto de raio $r$, altura $h$ e geratriz $g$.
    afirmativas:
    - '$g^2 = h^2 + r^2$.'
    - 'A área lateral é $\pi r h$.'
    - 'A superfície lateral, planificada, é um setor circular de raio $g$.'
    - 'Se $g = 2r$, a secção meridiana é um triângulo equilátero.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'II e III, apenas.', 'II e IV, apenas.', 'I, II e III, apenas.', 'I, III e IV, apenas.']
    correta: E
    resolucao: |
      I. Correta. II. Incorreta: é $\pi r g$. III. Correta. IV. Correta: lados $g$, $g$ e $2r = g$.

  - estilo: Unesp
    enunciado: |
      Um setor circular de raio 6 e ângulo central de $120°$ é enrolado para formar a superfície lateral de um cone. O raio da base do cone é
    opcoes: ['$2$', '$3$', '$4$', '$6$', '$1$']
    correta: A
    resolucao: |
      Arco $\tfrac{1}{3} \cdot 12\pi = 4\pi = 2\pi r$: $r = 2$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      A figura mostra a planificação de um cone reto: um setor circular de raio 9 e ângulo de $240°$ e o círculo da base.
    figura:
      tikz: |
        \begin{scope}[scale=.2]
        \draw[ink, line width=1pt, fill=lilas!30] (0,0) -- (150:9) arc (150:390:9) -- cycle;
        \draw[ink, line width=1pt, fill=lilas!15] (0,-15) circle (6);
        \draw[roxo] (150:2) arc (150:390:2);
        \node[font=\scriptsize] at (270:3.6) {$240°$};
        \node[above, font=\scriptsize] at (150:4.5) {$9$};
        \end{scope}
    enunciado: |
      A área total do cone é
    opcoes: ['$54\pi$.', '$90\pi$.', '$81\pi$.', '$117\pi$.']
    correta: B
    resolucao: |
      $r = 9 \cdot \tfrac{240}{360} = 6$. $A_T = \pi \cdot 6 \cdot (9 + 6) = 90\pi$.

  - estilo: Fuvest
    enunciado: |
      A secção meridiana de um cone reto de raio 4 é um triângulo retângulo. A área lateral do cone é
    opcoes: ['$16\pi$', '$32\pi$', '$16\sqrt{2}\,\pi$', '$8\sqrt{2}\,\pi$', '$32\sqrt{2}\,\pi$']
    correta: C
    resolucao: |
      O ângulo reto fica no vértice, e cada geratriz forma $45°$ com o eixo: $h = r = 4$, $g = 4\sqrt{2}$. $A_L = 16\sqrt{2}\,\pi$.

  - estilo: UFSC
    enunciado: |
      Considere um cone equilátero de raio $r$. Assinale o que for correto.
    proposicoes:
    - 'A geratriz mede $2r$.'
    - 'A altura mede $r\sqrt{3}$.'
    - 'A área lateral é $2\pi r^2$.'
    - 'A área total é $3\pi r^2$.'
    - 'A superfície lateral, planificada, é um semicírculo.'
    - 'O ângulo de abertura do cone é de $90°$.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) Definição. 02) $\sqrt{4r^2 - r^2}$. 04) $\pi r \cdot 2r$. 08) $2\pi r^2 + \pi r^2$. 16) $\theta = 360° \cdot \tfrac{r}{2r} = 180°$. 32) Incorreta: a secção meridiana é equilátera, abertura de $60°$.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      Uma fábrica produz casquinhas de sorvete em forma de cone, sem base. Cada casquinha tem 3 cm de raio na boca e geratriz de 10 cm. A massa é espalhada sobre a forma numa camada que corresponde a 0,5 g de massa por centímetro quadrado de superfície. Use 3 como aproximação para $\pi$.
    enunciado: |
      A quantidade de massa de cada casquinha é
    opcoes: ['$45$ g', '$90$ g', '$58{,}5$ g', '$27$ g', '$15$ g']
    correta: A
    resolucao: |
      $A_L = \pi \cdot 3 \cdot 10 = 30\pi \approx 90$ cm²; massa $90 \cdot 0{,}5 = 45$ g.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'Um cone de raio 8 e altura 15 tem geratriz 17.'
    - 'Esse mesmo cone tem área lateral $120\pi$.'
    - 'Um semicírculo de raio 10, enrolado, forma a superfície lateral de um cone de raio 5.'
    - 'A altura de um cone reto é sempre maior que o raio da base.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – F – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – V – F.', 'V – F – V – F.']
    correta: E
    resolucao: |
      (V) $\sqrt{225 + 64}$. (F) É $\pi \cdot 8 \cdot 17 = 136\pi$. (V) Arco $10\pi = 2\pi r$. (F) Por exemplo, raio 12 e altura 5.

  - estilo: Enem
    texto: |
      Um designer vai produzir cúpulas de luminária em forma de superfície lateral de cone, em chapa metálica, e quer o modelo que gasta menos material. O quadro mostra o raio da boca e a geratriz de cada modelo, em centímetros.
    tabela:
      cabecalho: ['Modelo', 'Raio', 'Geratriz']
      linhas:
      - ['L1', '$10$', '$30$']
      - ['L2', '$12$', '$24$']
      - ['L3', '$15$', '$18$']
      - ['L4', '$9$', '$32$']
      - ['L5', '$8$', '$35$']
    enunciado: |
      O modelo que gasta menos material é o
    opcoes: ['L1.', 'L2.', 'L4.', 'L3.', 'L5.']
    correta: D
    resolucao: |
      $A_L = \pi r g$: L1 $300\pi$; L2 $288\pi$; L3 $270\pi$; L4 $288\pi$; L5 $280\pi$.

  - estilo: Unesp
    enunciado: |
      Um cone reto tem raio 5 e área lateral $65\pi$. A sua altura é
    opcoes: ['$13$', '$12$', '$8$', '$\sqrt{194}$', '$10$']
    correta: B
    resolucao: |
      $\pi \cdot 5 \cdot g = 65\pi$: $g = 13$. $h = \sqrt{169 - 25} = 12$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Um setor circular de raio 20 e ângulo central de $216°$ é enrolado para formar a superfície lateral de um cone. Assinale o que for correto.
    proposicoes:
    - 'O raio da base do cone é 12.'
    - 'A altura do cone é 16.'
    - 'A área lateral do cone é $240\pi$.'
    - 'A área total do cone é $384\pi$.'
    - 'O arco do setor mede $12\pi$.'
    - 'A secção meridiana do cone tem área 192.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) $20 \cdot \tfrac{216}{360}$. 02) $\sqrt{400 - 144}$. 04) $\pi \cdot 12 \cdot 20$. 08) $240\pi + 144\pi$. 16) Incorreta: é $2\pi \cdot 12 = 24\pi$. 32) $\tfrac{24 \cdot 16}{2}$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Unicamp
    enunciado: |
      Um cone reto tem raio 5 e geratriz 15. O ângulo central do setor circular obtido ao planificar a sua superfície lateral é
    opcoes: ['$120°$.', '$60°$.', '$150°$.', '$90°$.']
    correta: A
    resolucao: |
      $360° \cdot \tfrac{5}{15} = 120°$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Uma torre de observação tem o telhado em forma de superfície lateral de cone, com 6 m de raio na base e 2,5 m de altura. O telhado será coberto com uma manta impermeável, e a empresa contratada cobra R\$\,40,00 por metro quadrado de manta aplicada. Use 3 como aproximação para $\pi$.
    enunciado: |
      A área do telhado é
    opcoes: ['$108$ m²', '$45$ m²', '$117$ m²', '$225$ m²', '$78$ m²']
    correta: C
    resolucao: |
      $g = \sqrt{2{,}5^2 + 6^2} = 6{,}5$ m. $A_L = \pi \cdot 6 \cdot 6{,}5 = 39\pi \approx 117$ m².

  - estilo: Unesp
    enunciado: |
      O valor cobrado pela aplicação da manta no telhado é
    opcoes: ['R\$\,4\,320,00', 'R\$\,1\,800,00', 'R\$\,9\,000,00', 'R\$\,4\,680,00', 'R\$\,3\,120,00']
    correta: D
    resolucao: |
      $117 \cdot 40 = 4680$ reais.

  - estilo: Fuvest
    enunciado: |
      A superfície lateral de um cone reto, planificada, é um semicírculo. O ângulo de abertura do cone, no vértice da secção meridiana, mede
    opcoes: ['$30°$', '$45°$', '$90°$', '$120°$', '$60°$']
    correta: E
    resolucao: |
      $\tfrac{\theta}{360°} = \tfrac{r}{g} = \tfrac{1}{2}$: $g = 2r$. A secção meridiana é equilátera: abertura de $60°$.

  - estilo: Unesp
    texto: |
      No cone reto da figura, a geratriz mede 10 e forma um ângulo de $60°$ com o plano da base.
    figura:
      tikz: |
        \begin{scope}[scale=.8]
        \draw[ink, line width=1pt] (-1.6,0) -- (0,2.77) -- (1.6,0);
        \draw[ink, line width=1pt] (-1.6,0) arc (180:360:1.6 and 0.4);
        \draw[ink, dashed] (1.6,0) arc (0:180:1.6 and 0.4);
