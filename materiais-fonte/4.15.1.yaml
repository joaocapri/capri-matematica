    enunciado: |
      A área total do cone é
    opcoes: ['$50\pi$', '$75\pi$', '$100\pi$', '$25\pi$', '$150\pi$']
    correta: B
    resolucao: |
      $r = 10\cos 60° = 5$. $A_T = \pi \cdot 5 \cdot (10 + 5) = 75\pi$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere um cone reto de raio $r$ e geratriz $g$ e a planificação da sua superfície lateral.'
    itens:
    - 'Prove que a planificação é um setor de ângulo $\theta = 360° \cdot \frac{r}{g}$.'
    - 'Prove que a área lateral é $\pi r g$.'
    - 'Para $r = 4$ e $g = 10$, calcule $\theta$ e a área total.'
    espaco: 62
    resolucao: |
      a) Ao enrolar o setor, o arco vira o contorno da base: $\tfrac{\theta}{360°} \cdot 2\pi g = 2\pi r$.
      b) Área do setor: $\tfrac{\theta}{360°} \cdot \pi g^2 = \tfrac{r}{g} \cdot \pi g^2 = \pi r g$.
      c) $\theta = 144°$; $A_T = 40\pi + 16\pi = 56\pi$.
    resposta: 'c) $144°$ e $56\pi$'

  - estilo: Unicamp
    enunciado: 'Considere um cone equilátero de raio $r$.'
    itens:
    - 'Calcule a altura e a área total.'
    - 'Calcule a razão entre a área total e a área lateral.'
    - 'Se a área total é $27\pi$, calcule o raio e a altura.'
    espaco: 62
    resolucao: |
      a) $g = 2r$, $h = r\sqrt{3}$; $A_T = 3\pi r^2$.
      b) $\tfrac{3\pi r^2}{2\pi r^2} = \tfrac{3}{2}$.
      c) $3\pi r^2 = 27\pi$: $r = 3$ e $h = 3\sqrt{3}$.
    resposta: 'a) $r\sqrt{3}$ e $3\pi r^2$; b) $\frac{3}{2}$; c) 3 e $3\sqrt{3}$'

  - estilo: ITA
    enunciado: |
      A razão entre a área total e a área da base de um cone reto é 4. O ângulo central do setor obtido ao planificar a superfície lateral desse cone mede
    opcoes: ['$120°$', '$90°$', '$60°$', '$180°$', '$135°$']
    correta: A
    espaco: 22
    resolucao: |
      $\tfrac{\pi r(g + r)}{\pi r^2} = \tfrac{g + r}{r} = 4$: $g = 3r$. $\theta = 360° \cdot \tfrac{1}{3} = 120°$.
    resposta: 'A'

  - estilo: Unesp
    texto: |
      Para fazer um funil, recorta-se de um disco de papel de 12 cm de raio um setor de $90°$ e enrola-se o restante do disco, unindo as bordas, até formar a superfície lateral de um cone.
    enunciado: ''
    itens:
    - 'Calcule o raio da boca do funil.'
    - 'Calcule a altura do funil.'
    - 'Calcule a área de papel do funil e a área da boca.'
    espaco: 62
    resolucao: |
      a) Sobra um setor de $270°$: $r = 12 \cdot \tfrac{270}{360} = 9$ cm.
      b) $h = \sqrt{144 - 81} = 3\sqrt{7}$ cm.
      c) $A_L = \pi \cdot 9 \cdot 12 = 108\pi$ cm²; boca $81\pi$ cm².
    resposta: 'a) 9 cm; b) $3\sqrt{7}$ cm; c) $108\pi$ e $81\pi$ cm²'

  - estilo: UFSC
    enunciado: |
      Considere cones retos de raio $r$, altura $h$ e geratriz $g$. Assinale o que for correto.
    proposicoes:
    - 'A área lateral é sempre maior que a área da base.'
    - 'Se $h = r$, a abertura do cone é de $90°$.'
    - 'Um setor de $90°$ e raio 8 forma um cone de raio 2.'
    - 'Se a geratriz dobra e o raio se mantém, a área total dobra.'
    - 'Um cone de raio 7 e altura 24 tem área total $224\pi$.'
    - 'O ângulo do setor da planificação é sempre menor que $360°$.'
    corretas: [1, 2, 3, 5, 6]
    espaco: 22
    resolucao: |
      01) $\tfrac{g}{r} > 1$. 02) A geratriz forma $45°$ com o eixo. 04) $8 \cdot \tfrac{90}{360} = 2$. 08) Incorreta: só a lateral dobra; a base não muda. 16) $\pi \cdot 7 \cdot (25 + 7)$. 32) $\theta = 360° \cdot \tfrac{r}{g}$, com $r < g$.
    resposta: 'Soma 55 (01 + 02 + 04 + 16 + 32)'

  - estilo: Fuvest
    enunciado: 'Num cone reto, a área lateral é $k$ vezes a área da base, com $k > 1$.'
    itens:
    - 'Prove que $g = kr$ e que $h = r\sqrt{k^2 - 1}$.'
    - 'Prove que o ângulo do setor da planificação é $\frac{360°}{k}$.'
    - 'Para $k = 3$ e $r = 2$, calcule $h$, o ângulo do setor e a área total.'
    espaco: 62
    resolucao: |
      a) $\pi r g = k\pi r^2$: $g = kr$. $h = \sqrt{k^2r^2 - r^2} = r\sqrt{k^2 - 1}$.
      b) $\theta = 360° \cdot \tfrac{r}{kr} = \tfrac{360°}{k}$.
      c) $h = 4\sqrt{2}$; $\theta = 120°$; $A_T = \pi \cdot 2 \cdot (6 + 2) = 16\pi$.
    resposta: 'c) $4\sqrt{2}$, $120°$ e $16\pi$'

  - estilo: Unicamp
    enunciado: 'Num cone reto de geratriz $g$, cada geratriz forma um ângulo $\alpha$ com o eixo.'
    itens:
    - 'Prove que $r = g\operatorname{sen}\alpha$ e $h = g\cos\alpha$.'
    - 'Prove que a área lateral é $\pi g^2 \operatorname{sen}\alpha$.'
    - 'Para $\alpha = 30°$ e $g = 8$, calcule a área lateral e a área total.'
    espaco: 62
    resolucao: |
      a) No triângulo retângulo de hipotenusa $g$, o raio é o cateto oposto a $\alpha$, e a altura, o adjacente.
      b) $\pi r g = \pi g^2 \operatorname{sen}\alpha$.
      c) $r = 4$: $A_L = 32\pi$; $A_T = 32\pi + 16\pi = 48\pi$.
    resposta: 'c) $32\pi$ e $48\pi$'

  - estilo: Fuvest
    enunciado: |
      A secção meridiana de um cone reto tem área 60, e a altura do cone é 12. A área lateral do cone é
    opcoes: ['$60\pi$', '$25\pi$', '$65\pi$', '$90\pi$', '$130\pi$']
    correta: C
    espaco: 22
    resolucao: |
      $\tfrac{2r \cdot 12}{2} = 60$: $r = 5$, $g = 13$. $A_L = 65\pi$.
    resposta: 'C'

  - estilo: Unesp
    enunciado: 'Uma formiga está no ponto $A$ da borda da base de um cone reto de raio 2 e geratriz 6 e quer chegar, andando sobre a superfície lateral, ao ponto médio $M$ da geratriz diametralmente oposta a $A$.'
    itens:
    - 'Calcule o ângulo do setor da planificação lateral.'
    - 'Explique por que, na planificação, o ângulo entre a geratriz de $A$ e a de $M$ é $60°$.'
    - 'Calcule o comprimento do menor caminho de $A$ até $M$.'
    espaco: 62
    resolucao: |
      a) $360° \cdot \tfrac{2}{6} = 120°$.
      b) Pontos diametralmente opostos dividem a circunferência da base ao meio; no setor, isso corresponde à metade de $120°$.
      c) No setor, $VA = 6$, $VM = 3$ e ângulo de $60°$: $AM^2 = 36 + 9 - 2 \cdot 6 \cdot 3 \cdot \tfrac{1}{2} = 27$, $AM = 3\sqrt{3}$.
    resposta: 'a) $120°$; c) $3\sqrt{3}$'

  - estilo: Fuvest
    enunciado: 'Um cone reto de raio 5 e geratriz 13 é cortado por um plano paralelo à base, na metade da altura.'
    itens:
    - 'Calcule a área lateral do cone original.'
    - 'Prove que o cone menor tem raio e geratriz iguais à metade dos originais e calcule a sua área lateral.'
    - 'Calcule a área lateral da parte de baixo (sem as bases).'
    espaco: 62
    resolucao: |
      a) $65\pi$.
      b) O cone menor é semelhante ao original, de razão $\tfrac{1}{2}$ (razão das alturas): raio $\tfrac{5}{2}$, geratriz $\tfrac{13}{2}$, área lateral $\tfrac{65\pi}{4}$.
      c) $65\pi - \tfrac{65\pi}{4} = \tfrac{195\pi}{4}$.
    resposta: 'a) $65\pi$; b) $\frac{65\pi}{4}$; c) $\frac{195\pi}{4}$'
