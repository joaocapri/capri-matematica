# Aula 4.2.1 — Geometria plana: triângulos, classificação e ângulos
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: classificação quanto aos lados e aos ângulos; condição de existência (desigualdade triangular);
# soma dos ângulos internos; ângulo externo; soma dos externos; triângulo isósceles (ângulos da base); maior lado oposto
# ao maior ângulo; estrela de cinco pontas; ângulo entre bissetrizes. Cevianas e pontos notáveis ficam para a 4.2.2.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Classifique cada triângulo quanto aos ângulos (acutângulo, retângulo ou obtusângulo), dados os seus ângulos internos.'
      tabela:
        cabecalho: ['Ângulos', 'Classificação']
        linhas:
        - ['$50°$, $60°$, $70°$', '{{acutângulo}}']
        - ['$90°$, $30°$, $60°$', '{{retângulo}}']
        - ['$100°$, $45°$, $35°$', '{{obtusângulo}}']
        - ['$60°$, $60°$, $60°$', '{{acutângulo}}']
      resolucao: |
        Acutângulo: três ângulos agudos. Retângulo: um ângulo reto. Obtusângulo: um ângulo obtuso.
      resposta: 'acutângulo; retângulo; obtusângulo; acutângulo'
    - enunciado: 'Classifique quanto aos lados (equilátero, isósceles ou escaleno) ou escreva "não existe", se as medidas não formam triângulo.'
      tabela:
        cabecalho: ['Lados', 'Classificação']
        linhas:
        - ['$7$, $7$, $7$', '{{equilátero}}']
        - ['$5$, $5$, $8$', '{{isósceles}}']
        - ['$4$, $6$, $9$', '{{escaleno}}']
        - ['$2$, $3$, $6$', '{{não existe}}']
      resolucao: |
        Para existir, cada lado deve ser menor que a soma dos outros dois (basta testar o maior). $9 < 4 + 6$ funciona; $6 > 2 + 3$ não.
      resposta: 'equilátero; isósceles; escaleno; não existe'
    - enunciado: 'Determine o que se pede, completando.'
      itens:
      - 'Dois ângulos medem $48°$ e $77°$; o terceiro mede {{55°}}.'
      - 'Num triângulo retângulo, um ângulo agudo mede $34°$; o outro mede {{56°}}.'
      - 'Os ângulos medem $x$, $2x$ e $3x$; o maior mede {{90°}}.'
      resolucao: |
        A soma é $180°$. (a) $180 - 125 = 55$. (b) $90 - 34 = 56$. (c) $6x = 180$, $x = 30°$: $30°$, $60°$ e $90°$.
      resposta: '$55°$; $56°$; $90°$'
    - enunciado: 'Na figura, determine o ângulo externo $x$.'
      figura:
        tikz: |
          \begin{scope}[scale=.9]
          \draw[ink, line width=1pt, fill=lilas!25] (0,0) -- (3.2,0) -- (2.346,2.346) -- cycle;
          \draw[ink, dashed] (2.346,2.346) -- (3.0,3.0);
          \node[font=\scriptsize] at (0.65,0.25) {$45°$};
          \node[font=\scriptsize] at (2.75,0.3) {$70°$};
          \draw[roxo] (2.346,2.346) ++(-70:.45) arc (-70:45:.45);
          \node[font=\scriptsize, roxo] at (3.05,2.25) {$x$};
          \end{scope}
      itens:
      - '$x = {{115°}}$'
      resolucao: |
        O ângulo externo é a soma dos dois internos não adjacentes: $45° + 70° = 115°$.
      resposta: '$115°$'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Um triângulo pode ter dois ângulos retos.'
      - 'Todo triângulo equilátero é isósceles.'
      - 'Num triângulo isósceles, os ângulos da base são iguais.'
      - 'Existe triângulo com lados $2$, $3$ e $5$.'
      justificar: true
      espaco: 20
      resolucao: |
        (F) Dois retos já somam $180°$. (V) Tem (pelo menos) dois lados iguais. (V) (F) $5 = 2 + 3$: os pontos ficariam alinhados.
      resposta: F, V, V, F
    - enunciado: 'Num triângulo isósceles, determine:'
      itens:
      - 'os ângulos da base, se o ângulo do vértice mede $40°$;'
      - 'o ângulo do vértice, se cada ângulo da base mede $35°$.'
      espaco_item: 10
      resolucao: |
        (a) $\tfrac{180 - 40}{2} = 70°$ cada. (b) $180 - 70 = 110°$.
      resposta: '(a) $70°$ e $70°$ (b) $110°$'
    - enunciado: 'Dois lados de um triângulo medem 4 cm e 7 cm. Quais são os valores inteiros possíveis para o terceiro lado?'
      espaco: 10
      resolucao: |
        $7 - 4 < x < 7 + 4$: $3 < x < 11$. Inteiros: $4, 5, 6, 7, 8, 9, 10$ (sete valores).
      resposta: '$4$ a $10$ (7 valores)'
  - nome: Nível 2
    questoes:
    - texto: |
        Os ângulos de um triângulo medem $2x$, $3x$ e $4x$. Ana escreveu $9x = 360°$ e respondeu $x = 40°$.
      enunciado: 'Encontre o erro e determine os ângulos.'
      espaco: 10
      resolucao: |
        A soma dos internos é $180°$ ($360°$ é a soma dos externos): $9x = 180°$, $x = 20°$. Ângulos: $40°$, $60°$ e $80°$.
      resposta: '$40°$, $60°$, $80°$'
    - enunciado: 'Na figura, $AB = AC$. Determine $x$ e os três ângulos do triângulo.'
      figura:
        tikz: |
          \begin{scope}[scale=.55]
          \draw[ink, line width=1pt, fill=lilas!25] (0,0) node[below left, font=\scriptsize] {$B$} -- (3,0) node[below right, font=\scriptsize] {$C$} -- (1.5,5.231) node[above, font=\scriptsize] {$A$} -- cycle;
          \draw[ink] (0.65,2.55) -- (0.9,2.5) (2.1,2.5) -- (2.35,2.55);
          \node[font=\scriptsize] at (1.5,4.3) {$x$};
          \node[font=\scriptsize] at (0.95,0.4) {$2x + 10°$};
          \end{scope}
      espaco: 10
      resolucao: |
        Os ângulos da base são iguais: $B = C = 2x + 10$. $x + 2(2x + 10) = 180$: $5x = 160$, $x = 32°$. Ângulos: $A = 32°$, $B = C = 74°$.
      resposta: '$x = 32°$; $32°$, $74°$, $74°$'
    - enunciado: 'Os ângulos internos de um triângulo medem $50°$, $60°$ e $70°$. Calcule os três ângulos externos e a soma deles.'
      espaco: 10
      resolucao: |
        Cada externo é o suplemento do interno: $130°$, $120°$ e $110°$. Soma $360°$ (vale para qualquer triângulo: $3 \cdot 180° - 180°$).
      resposta: '$130°$, $120°$, $110°$; soma $360°$'
    - enunciado: 'Na figura, $D$ está em $BC$. Determine $A\hat{D}C$ e $D\hat{A}C$.'
      figura:
        tikz: |
          \begin{scope}[scale=.9]
          \draw[ink, line width=1pt, fill=lilas!25] (0,0) node[below left, font=\scriptsize] {$B$} -- (4,0) node[below right, font=\scriptsize] {$C$} -- (2.347,1.97) node[above, font=\scriptsize] {$A$} -- cycle;
          \draw[roxo, line width=1pt] (2.347,1.97) -- (1.63,0) node[below, font=\scriptsize] {$D$};
          \node[font=\scriptsize] at (0.6,0.2) {$40°$};
          \node[font=\scriptsize] at (3.45,0.2) {$50°$};
          \node[font=\scriptsize] at (1.95,1.45) {$30°$};
          \end{scope}
      espaco: 12
      resolucao: |
        $A\hat{D}C$ é externo do triângulo $ABD$: $40° + 30° = 70°$. No triângulo $ADC$: $D\hat{A}C = 180° - 70° - 50° = 60°$.
      resposta: '$70°$ e $60°$'
    - enunciado: 'Um triângulo isósceles tem perímetro 20 cm, e um dos lados mede 8 cm. Quais são as possibilidades para os lados? Verifique se cada uma forma triângulo.'
      espaco: 12
      resolucao: |
        Se 8 é um dos lados iguais: $8, 8, 4$ ($4 < 16$, existe). Se 8 é a base: $6, 6, 8$ ($8 < 12$, existe). Há duas possibilidades.
      resposta: '$8, 8, 4$ ou $6, 6, 8$'
    - enunciado: 'No triângulo $ABC$, $\hat{A} = 50°$, $\hat{B} = 60°$ e $\hat{C} = 70°$. Coloque os lados em ordem crescente.'
      espaco: 10
      resolucao: |
        O maior lado fica oposto ao maior ângulo. Opostos: $BC$ a $\hat{A}$, $AC$ a $\hat{B}$, $AB$ a $\hat{C}$. Ordem: $BC < AC < AB$.
      resposta: '$BC < AC < AB$'
    - enunciado: 'Num triângulo retângulo, um ângulo agudo é o quádruplo do outro. Determine os ângulos agudos.'
      espaco: 10
      resolucao: |
        Os agudos são complementares: $x + 4x = 90°$, $x = 18°$. Ângulos: $18°$ e $72°$.
      resposta: '$18°$ e $72°$'
    - enunciado: 'A tesoura de um telhado é um triângulo isósceles com ângulo de $110°$ no topo. Qual é a inclinação de cada água do telhado, isto é, o ângulo que cada lado inclinado forma com a base?'
      espaco: 10
      resolucao: |
        $\tfrac{180° - 110°}{2} = 35°$.
      resposta: '$35°$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Usando a soma dos ângulos internos, prove que o ângulo externo de um triângulo é igual à soma dos dois ângulos internos não adjacentes.'
      espaco: 12
      resolucao: |
        Em $C$, o externo é $e = 180° - \hat{C}$. Como $\hat{A} + \hat{B} + \hat{C} = 180°$, $180° - \hat{C} = \hat{A} + \hat{B}$. Logo $e = \hat{A} + \hat{B}$.
      resposta: 'Ver resolução'
    - enunciado: 'Na estrela de cinco pontas da figura, mostre que a soma dos ângulos das pontas, $a + b + c + d + e$, é $180°$.'
      figura:
        tikz: |
          \begin{scope}[scale=.75]
          \draw[roxo, line width=1pt] (0,2) -- (-1.176,-1.618) -- (1.902,0.618) -- (-1.902,0.618) -- (1.176,-1.618) -- cycle;
          \node[font=\scriptsize] at (0,1.5) {$a$};
          \node[font=\scriptsize] at (1.35,0.47) {$b$};
          \node[font=\scriptsize] at (0.88,-1.22) {$c$};
          \node[font=\scriptsize] at (-0.88,-1.22) {$d$};
          \node[font=\scriptsize] at (-1.35,0.47) {$e$};
          \end{scope}
      espaco: 16
      resolucao: |
        Da ponta $a$ saem os segmentos que vão às pontas $c$ e $d$. O segmento que liga $b$ a $e$ corta esses dois segmentos em $X$ (no que vai a $d$) e $Y$ (no que vai a $c$), formando o triângulo $aXY$.
        O ângulo em $X$ é externo do triângulo de vértices $X$, $d$ e $b$, cujos ângulos em $d$ e $b$ são as pontas $d$ e $b$: mede $b + d$. Do mesmo modo, o ângulo em $Y$ mede $c + e$.
        No triângulo $aXY$: $a + (b + d) + (c + e) = 180°$.
      resposta: 'Ver resolução'
    - enunciado: 'Num triângulo isósceles, um ângulo externo mede $112°$. Determine os ângulos internos, considerando os dois casos possíveis.'
      espaco: 14
      resolucao: |
        O interno correspondente mede $68°$. Se ele for ângulo da base: base $68°$ e $68°$, vértice $44°$. Se for o ângulo do vértice: base $\tfrac{180 - 68}{2} = 56°$ cada.
      resposta: '$68°, 68°, 44°$ ou $68°, 56°, 56°$'
    - enunciado: 'Quantos triângulos, não congruentes, de lados inteiros e perímetro 12 existem? Liste-os.'
      espaco: 12
      resolucao: |
        Com $a \leq b \leq c$, $a + b + c = 12$ e $a + b > c$: $c < 6$. $c = 5$: $(2, 5, 5)$, $(3, 4, 5)$; $c = 4$: $(4, 4, 4)$. Três triângulos.
      resposta: '3: $(2, 5, 5)$, $(3, 4, 5)$, $(4, 4, 4)$'
    - enunciado: 'As bissetrizes dos ângulos $\hat{B}$ e $\hat{C}$ do triângulo $ABC$ se cortam em $I$. Mostre que $B\hat{I}C = 90° + \frac{\hat{A}}{2}$ e calcule $B\hat{I}C$ para $\hat{A} = 70°$.'
      espaco: 14
      resolucao: |
        No triângulo $BIC$: $B\hat{I}C = 180° - \tfrac{\hat{B}}{2} - \tfrac{\hat{C}}{2} = 180° - \tfrac{180° - \hat{A}}{2} = 90° + \tfrac{\hat{A}}{2}$. Para $\hat{A} = 70°$: $125°$.
      resposta: '$125°$'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      A estrutura do telhado de uma casa é um triângulo isósceles, como na figura. O arquiteto definiu que o ângulo no topo, entre as duas águas do telhado, mede $120°$. Para comprar as telhas certas, o construtor precisa saber a inclinação de cada água, isto é, o ângulo entre cada lado inclinado e a base horizontal.
    figura:
      tikz: |
        \begin{scope}[scale=.8]
        \draw[ink, line width=1.2pt, fill=lilas!30] (0,0) -- (5,0) -- (2.5,1.443) -- cycle;
        \draw[ink!70] (2.5,1.443) ++(-150:.45) arc (-150:-30:.45);
        \node[font=\scriptsize] at (2.5,0.75) {$120°$};
        \end{scope}
    enunciado: |
      A inclinação de cada água do telhado é de
    opcoes: ['$60°$', '$30°$', '$120°$', '$45°$', '$15°$']
    correta: B
    resolucao: |
      Os ângulos da base são iguais: $\tfrac{180° - 120°}{2} = 30°$.

  - estilo: Fuvest
    enunciado: |
      Os ângulos internos de um triângulo são proporcionais a $2$, $3$ e $4$. O maior deles mede
    opcoes: ['$40°$', '$60°$', '$90°$', '$80°$', '$100°$']
    correta: D
    resolucao: |
      $2k + 3k + 4k = 180°$: $k = 20°$. Ângulos $40°$, $60°$ e $80°$.

  - estilo: Unicamp
    enunciado: |
      Entre as ternas a seguir, a única que pode ser formada pelas medidas dos lados de um triângulo é
    opcoes: ['$2$, $3$ e $6$.', '$3$, $4$ e $8$.', '$4$, $5$ e $9$.', '$5$, $6$ e $10$.']
    correta: D
    resolucao: |
      O maior lado deve ser menor que a soma dos outros: $6 > 5$, $8 > 7$, $9 = 9$ falham; $10 < 11$ funciona.

  - estilo: UEM
    enunciado: |
      Considere triângulos e seus ângulos. Assinale o que for correto.
    proposicoes:
    - 'Todo triângulo equilátero é acutângulo.'
    - 'Um triângulo retângulo pode ser isósceles.'
    - 'Um triângulo obtusângulo pode ser equilátero.'
    - 'Cada ângulo externo é igual à soma dos dois ângulos internos não adjacentes.'
    - 'A soma dos três ângulos externos (um em cada vértice) é $360°$.'
    corretas: [1, 2, 4, 5]
    resolucao: |
      01) Ângulos de $60°$. 02) Ângulos $45°$, $45°$ e $90°$. 04) Incorreta: no equilátero, os ângulos medem $60°$. 08) Correta. 16) $3 \cdot 180° - 180° = 360°$.
      Soma: $01 + 02 + 08 + 16 = 27$.

  - estilo: Enem
    texto: |
      Um artesão vai montar peças triangulares de um mosaico unindo três ripas pelas pontas. Ele separou quatro conjuntos de ripas, com os comprimentos do quadro, em centímetros. Algumas combinações não fecham um triângulo, e ele quer saber quais conjuntos aproveitar.
    tabela:
      cabecalho: ['Peça', 'Ripas (cm)']
      linhas:
      - ['1', '$3$, $4$ e $8$']
      - ['2', '$5$, $5$ e $9$']
      - ['3', '$6$, $7$ e $14$']
      - ['4', '$2$, $9$ e $10$']
    enunciado: |
      Formam triângulo
    opcoes: ['apenas a peça 2.', 'apenas as peças 1 e 2.', 'apenas as peças 3 e 4.', 'todas as peças.', 'apenas as peças 2 e 4.']
    correta: E
    resolucao: |
      Peça 1: $8 > 3 + 4$. Peça 2: $9 < 10$. Peça 3: $14 > 13$. Peça 4: $10 < 11$. Só 2 e 4.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir sobre triângulos.
    afirmativas:
    - 'O maior ângulo fica oposto ao maior lado.'
    - 'Um triângulo pode ter dois ângulos obtusos.'
    - 'Os ângulos de um triângulo retângulo isósceles medem $45°$, $45°$ e $90°$.'
    - 'Todo triângulo isósceles é equilátero.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'II e IV, apenas.', 'I e III, apenas.', 'I, III e IV, apenas.', 'I, II, III e IV.']
    correta: C
    resolucao: |
      I. Correta. II. Incorreta: dois obtusos somam mais de $180°$. III. Correta. IV. Incorreta: o isósceles $5, 5, 8$ não é equilátero.

  - estilo: Unesp
    enunciado: |
      Num triângulo $ABC$, o ângulo externo em $C$ mede $130°$ e $\hat{A} = 70°$. Então $\hat{B}$ mede
    opcoes: ['$60°$', '$70°$', '$50°$', '$130°$', '$110°$']
    correta: A
    resolucao: |
      Externo em $C$ = $\hat{A} + \hat{B}$: $130° = 70° + \hat{B}$, $\hat{B} = 60°$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      No triângulo $ABC$ da figura, $AB = AC$ e $\hat{A} = 36°$. O segmento $BD$ é a bissetriz do ângulo $\hat{B}$, com $D$ no lado $AC$.
    figura:
      tikz: |
        \begin{scope}[scale=.75]
        \draw[ink, line width=1pt, fill=lilas!25] (0,0) node[below left, font=\scriptsize] {$B$} -- (2.4,0) node[below right, font=\scriptsize] {$C$} -- (1.2,3.693) node[above, font=\scriptsize] {$A$} -- cycle;
        \draw[roxo, line width=1pt] (0,0) -- (1.942,1.411) node[right, font=\scriptsize] {$D$};
        \node[font=\scriptsize] at (1.2,3.05) {$36°$};
        \end{scope}
    enunciado: |
      O ângulo $B\hat{D}C$ mede
    opcoes: ['$72°$.', '$36°$.', '$108°$.', '$54°$.']
    correta: A
    resolucao: |
      $\hat{B} = \hat{C} = \tfrac{180° - 36°}{2} = 72°$, e $A\hat{B}D = 36°$. $B\hat{D}C$ é externo do triângulo $ABD$: $36° + 36° = 72°$.

  - estilo: Fuvest
    enunciado: |
      Num triângulo isósceles, um dos ângulos mede $100°$. Os outros dois medem
    opcoes: ['$50°$ e $30°$', '$40°$ e $40°$', '$80°$ e $80°$', '$100°$ e $-20°$', '$45°$ e $35°$']
    correta: B
    resolucao: |
      O ângulo de $100°$ é obtuso; não pode ser da base (seriam dois de $100°$). É o do vértice: base $\tfrac{80°}{2} = 40°$ cada.

  - estilo: UFSC
    enunciado: |
      Os ângulos internos de um triângulo medem $x + 10°$, $2x$ e $3x - 10°$. Assinale o que for correto.
    proposicoes:
    - '$x = 30°$.'
    - 'O triângulo é acutângulo.'
    - 'O triângulo é escaleno.'
    - 'O maior ângulo externo mede $120°$.'
    - 'O menor lado é oposto ao ângulo de $80°$.'
    - 'Um dos ângulos externos mede $100°$.'
    corretas: [1, 2, 3, 6]
    resolucao: |
      $6x = 180°$, $x = 30°$: ângulos $40°$, $60°$, $80°$. 01) a 04) Corretas (ângulos diferentes, lados diferentes). 08) Incorreta: o maior externo é o do menor interno, $140°$.
      16) Incorreta: o menor lado é oposto ao menor ângulo ($40°$). 32) $180° - 80°$.
      Soma: $01 + 02 + 04 + 32 = 39$.

  - estilo: Enem
    texto: |
      Uma pessoa caminha em linha reta de uma praça $A$ até uma igreja $B$, vira e segue reto até uma escola $C$, vira de novo e volta reto à praça, de frente para a direção em que começou. Nas duas primeiras viradas, sempre para a esquerda, ela girou $120°$ e $110°$. Para estar virada para a direção inicial, ainda precisa girar, na praça, um certo ângulo.
    enunciado: |
      Ao chegar à escola, a pessoa precisou girar
    opcoes: ['$120°$', '$110°$', '$130°$', '$50°$', '$60°$']
    correta: C
    resolucao: |
      Cada giro é um ângulo externo do triângulo $ABC$, e os três giros completam uma volta: $360° - 120° - 110° = 130°$. (Os ângulos internos são $60°$, $70°$ e $50°$.)

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'A soma dos ângulos internos de qualquer triângulo é $180°$.'
    - 'Todo ângulo externo de um triângulo é obtuso.'
    - 'Não existe triângulo com lados $1$, $2$ e $3$.'
    - 'Num triângulo retângulo, os ângulos agudos são complementares.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – V – F.', 'V – F – V – F.', 'F – F – V – V.', 'V – F – V – V.', 'V – V – F – V.']
    correta: D
    resolucao: |
      (V) (F) Num triângulo obtusângulo, o externo do ângulo obtuso é agudo. (V) $3 = 1 + 2$: os pontos ficariam alinhados. (V) Somam $90°$.

  - estilo: Enem
    texto: |
      Uma estrela de cinco pontas, como a da figura, foi desenhada ligando, com segmentos de reta, cinco pontos de uma circunferência, pulando sempre um ponto. Em geometria, prova-se que a soma dos ângulos das pontas não depende de a estrela ser regular. Uma professora pediu essa soma aos alunos.
    figura:
      tikz: |
        \begin{scope}[scale=.75]
        \draw[gray!40] (0,0) circle (2);
        \draw[roxo, line width=1pt, fill=lilas!20] (0,2) -- (-1.176,-1.618) -- (1.902,0.618) -- (-1.902,0.618) -- (1.176,-1.618) -- cycle;
        \end{scope}
    enunciado: |
      A soma dos ângulos das cinco pontas é
    opcoes: ['$180°$', '$360°$', '$540°$', '$720°$', '$900°$']
    correta: A
    resolucao: |
      No triângulo formado por uma ponta e pelo lado oposto da estrela, os ângulos da base são externos de triângulos menores e valem a soma de duas pontas cada. Assim, as cinco pontas somam $180°$. (Na estrela regular, cada ponta mede $36°$.)

  - estilo: Fuvest
    enunciado: |
      Dois lados de um triângulo medem 7 e 12, e o terceiro tem medida inteira. O número de valores possíveis para o terceiro lado é
    opcoes: ['$11$', '$12$', '$13$', '$18$', '$19$']
    correta: C
    resolucao: |
      $12 - 7 < x < 12 + 7$: $5 < x < 19$, de $6$ a $18$: 13 valores.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Considere um triângulo $ABC$ qualquer. Assinale o que for correto.
    proposicoes:
    - 'Se as bissetrizes de $\hat{B}$ e de $\hat{C}$ se cortam em $I$, então $B\hat{I}C = 90° + \frac{\hat{A}}{2}$.'
    - 'As três bissetrizes internas passam por um mesmo ponto.'
    - 'Se $AB = AC$, a bissetriz de $\hat{A}$ é perpendicular a $BC$.'
    - 'A soma de dois lados pode ser igual ao terceiro lado.'
    - 'Cada ângulo externo é maior que qualquer ângulo interno não adjacente a ele.'
    corretas: [1, 2, 3, 5]
    resolucao: |
      01) $180° - \tfrac{\hat{B} + \hat{C}}{2}$. 02) Correta (é o incentro). 04) Os triângulos $ABD$ e $ACD$ têm ângulos $\tfrac{\hat{A}}{2}$ e $\hat{B} = \hat{C}$, logo os ângulos em $D$ são iguais e suplementares: $90°$. 08) Incorreta: a soma é sempre maior. 16) O externo é a soma dos dois.
      Soma: $01 + 02 + 04 + 16 = 23$.

  - estilo: Fuvest
    enunciado: |
      No triângulo $ABC$, $AB = AC$. O ponto $D$ do lado $AC$ é tal que $AD = BD = BC$. O ângulo $\hat{A}$ mede
    opcoes: ['$30°$', '$36°$', '$45°$', '$54°$', '$72°$']
    correta: B
    resolucao: |
      Seja $\hat{A} = a$. Como $AD = BD$, $A\hat{B}D = a$, e $B\hat{D}C = 2a$ (externo de $ABD$). Como $BD = BC$, $\hat{C} = B\hat{D}C = 2a$. Como $AB = AC$, $\hat{B} = \hat{C} = 2a$. Soma: $a + 2a + 2a = 180°$, $a = 36°$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        A tesoura de um telhado é um triângulo isósceles $ABC$, com $AB = AC$, e o ângulo no topo, $\hat{A}$, mede $100°$. Uma viga vertical $AD$, o pendural, liga o topo ao ponto médio $D$ da base $BC$, como na figura.
    figura:
      tikz: |
        \begin{scope}[scale=.8]
        \draw[ink, line width=1.2pt, fill=lilas!30] (0,0) node[below left, font=\scriptsize] {$B$} -- (5,0) node[below right, font=\scriptsize] {$C$} -- (2.5,2.098) node[above, font=\scriptsize] {$A$} -- cycle;
        \draw[roxo, line width=1.2pt] (2.5,2.098) -- (2.5,0) node[below, font=\scriptsize] {$D$};
        \node[font=\scriptsize] at (2.5,2.45) {$100°$};
        \end{scope}
    enunciado: |
      O ângulo $\hat{B}$, entre a base e a água do telhado, mede
    opcoes: ['$100°$', '$50°$', '$80°$', '$20°$', '$40°$']
    correta: E
    resolucao: |
      $\hat{B} = \hat{C} = \tfrac{180° - 100°}{2} = 40°$.

  - estilo: Unicamp
    enunciado: |
      O ângulo $B\hat{A}D$, entre o pendural e a água $AB$, mede
    opcoes: ['$40°$.', '$100°$.', '$50°$.', '$80°$.']
    correta: C
    resolucao: |
      Os triângulos $ABD$ e $ACD$ têm os três lados iguais ($AB = AC$, $BD = DC$, $AD$ comum), então $B\hat{A}D = D\hat{A}C = 50°$. (Ou: no triângulo $ABD$, com $D$ reto, $90° - 40° = 50°$.)

  - estilo: Unesp
    enunciado: |
      Um triângulo isósceles tem dois lados medindo 4 cm e 9 cm. O seu perímetro é
    opcoes: ['$17$ cm', '$22$ cm', '$13$ cm', '$26$ cm', '$17$ cm ou $22$ cm']
    correta: B
    resolucao: |
      Lados $4, 4, 9$ não formam triângulo ($9 > 8$). Lados $9, 9, 4$ formam: perímetro $22$ cm.

  - estilo: Fuvest
    enunciado: |
      No triângulo $ABC$, $\hat{A} = 50°$. As bissetrizes internas de $\hat{B}$ e de $\hat{C}$ se cortam em $I$. O ângulo $B\hat{I}C$ mede
    opcoes: ['$100°$', '$125°$', '$130°$', '$65°$', '$115°$']
    correta: E
    resolucao: |
      $B\hat{I}C = 180° - \tfrac{\hat{B} + \hat{C}}{2} = 180° - \tfrac{130°}{2} = 115°$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere uma estrela de cinco pontas qualquer, formada por cinco segmentos, com ângulos das pontas $a$, $b$, $c$, $d$ e $e$, nessa ordem ao redor da estrela.'
    itens:
    - 'Mostre que um ângulo da base do triângulo de vértice na ponta $a$ (fechado pelo segmento que liga as pontas $b$ e $e$) mede a soma de duas pontas.'
    - 'Conclua que $a + b + c + d + e = 180°$.'
    - 'Numa estrela, quatro pontas medem $30°$, $40°$, $35°$ e $45°$. Quanto mede a quinta?'
    espaco: 62
    resolucao: |
      a) Os segmentos que saem de $a$ vão até $c$ e até $d$. O segmento de $b$ a $e$ corta-os em $P$ e $Q$. O ângulo em $P$, no triângulo $aPQ$, é externo do triângulo formado pelas pontas $c$ e $e$ e pelo ponto $P$: mede $c + e$. Do mesmo modo, o ângulo em $Q$ mede $b + d$.
      b) No triângulo $aPQ$: $a + (c + e) + (b + d) = 180°$.
      c) $180° - 150° = 30°$.
    resposta: 'c) $30°$'

  - estilo: Unicamp
    texto: |
      Um robô percorre o contorno de um triângulo: anda em linha reta e, em cada vértice, gira para a esquerda antes de seguir pelo próximo lado. Ao voltar ao ponto de partida, ele gira mais uma vez para ficar de frente para a direção inicial.
    enunciado: ''
    itens:
    - 'Explique por que a soma dos três giros é $360°$ e relacione cada giro com o ângulo interno no vértice.'
    - 'Se os ângulos internos em dois vértices medem $50°$ e $65°$, quais são os três giros?'
    - 'É possível que dois giros sejam de $80°$ cada? Justifique.'
    espaco: 62
    resolucao: |
      a) Depois dos três giros, o robô dá uma volta completa: $360°$. Cada giro é o ângulo externo no vértice: $180°$ menos o interno.
      b) O terceiro interno mede $65°$. Giros: $130°$, $115°$ e $115°$.
      c) Não: os internos correspondentes mediriam $100°$ cada, e dois obtusos não cabem num triângulo. (O terceiro giro teria de ser $200°$, maior que $180°$.)
    resposta: 'b) $130°$, $115°$, $115°$; c) não'

  - estilo: ITA
    enunciado: |
      O número de triângulos não congruentes, com lados de medidas inteiras e perímetro 15, é
    opcoes: ['$5$', '$6$', '$7$', '$8$', '$12$']
    correta: C
    espaco: 22
    resolucao: |
      Com $a \leq b \leq c$ e $a + b > c$: $c < 7{,}5$ e $c \geq 5$. $c = 7$: $(1,7,7)$, $(2,6,7)$, $(3,5,7)$, $(4,4,7)$. $c = 6$: $(3,6,6)$, $(4,5,6)$. $c = 5$: $(5,5,5)$. Total 7.
    resposta: 'C'

  - estilo: Unesp
    enunciado: 'No triângulo $ABC$, $I$ é o encontro das bissetrizes internas de $\hat{B}$ e $\hat{C}$, e $E$ é o encontro das bissetrizes externas em $B$ e em $C$.'
    itens:
    - 'Mostre que $B\hat{I}C = 90° + \frac{\hat{A}}{2}$.'
    - 'Mostre que $B\hat{E}C = 90° - \frac{\hat{A}}{2}$.'
    - 'Calcule os dois ângulos para $\hat{A} = 40°$ e verifique que eles são suplementares.'
    espaco: 62
    resolucao: |
      a) No triângulo $BIC$: $180° - \tfrac{\hat{B} + \hat{C}}{2} = 180° - \tfrac{180° - \hat{A}}{2} = 90° + \tfrac{\hat{A}}{2}$.
      b) A bissetriz externa em $B$ forma com $BC$ o ângulo $\tfrac{180° - \hat{B}}{2}$; em $C$, $\tfrac{180° - \hat{C}}{2}$. No triângulo $BEC$: $B\hat{E}C = 180° - \tfrac{360° - \hat{B} - \hat{C}}{2} = \tfrac{\hat{B} + \hat{C}}{2} = 90° - \tfrac{\hat{A}}{2}$.
      c) $110°$ e $70°$, que somam $180°$. (A bissetriz interna e a externa num vértice são perpendiculares.)
    resposta: 'c) $110°$ e $70°$'

  - estilo: UFSC
    enunciado: |
      Assinale o que for correto.
    proposicoes:
    - 'Existe triângulo de lados $3$, $4$ e $5$.'
    - 'Existe triângulo de lados $1$, $1$ e $2$.'
    - 'Um triângulo de ângulos $45°$, $45°$ e $90°$ é isósceles.'
    - 'Se dois ângulos de um triângulo medem $50°$ e $70°$, o maior lado é oposto ao ângulo de $60°$.'
    - 'O ângulo externo num vértice é o suplemento do ângulo interno nesse vértice.'
    - 'Um triângulo pode ter ângulos externos de $100°$, $120°$ e $150°$.'
    corretas: [1, 3, 5]
    espaco: 22
    resolucao: |
      01) $5 < 7$. 02) Incorreta: $2 = 1 + 1$. 04) Dois ângulos iguais. 08) Incorreta: o maior lado é oposto ao maior ângulo, $70°$. 16) Correta.
      32) Incorreta: somariam $370°$, e a soma dos externos é $360°$.
    resposta: 'Soma 21 (01 + 04 + 16)'

  - estilo: Fuvest
    enunciado: 'No triângulo $ABC$, $AB = AC$, e o ponto $D$ do lado $AC$ é tal que $AD = BD = BC$.'
    itens:
    - 'Chamando $\hat{A} = a$, expresse $A\hat{B}D$, $B\hat{D}C$ e $\hat{C}$ em função de $a$.'
    - 'Determine $a$ e os ângulos dos triângulos $ABD$ e $BCD$.'
    - 'Mostre que $BD$ é a bissetriz de $\hat{B}$.'
    espaco: 62
    resolucao: |
      a) $A\hat{B}D = a$ ($AD = BD$); $B\hat{D}C = 2a$ (externo de $ABD$); $\hat{C} = 2a$ ($BD = BC$).
      b) $\hat{B} = \hat{C} = 2a$ e $5a = 180°$: $a = 36°$. $ABD$: $36°$, $36°$, $108°$. $BCD$: $72°$, $72°$, $36°$.
      c) $\hat{B} = 72°$ e $A\hat{B}D = 36°$: $D\hat{B}C = 36°$ também.
    resposta: 'b) $a = 36°$; $ABD$: $36°, 36°, 108°$; $BCD$: $72°, 72°, 36°$'

  - estilo: Unicamp
    texto: |
      Um marceneiro vai fazer uma moldura triangular com uma ripa de 30 cm, outra de 50 cm e uma terceira, de comprimento $x$, que ainda vai cortar.
    enunciado: ''
    itens:
    - 'Quais valores de $x$ permitem fechar o triângulo?'
    - 'Para quais valores de $x$ a moldura é isósceles?'
    - 'Ele quer que o maior ângulo da moldura fique oposto à ripa de 50 cm. Quais valores de $x$ atendem também a isso?'
    espaco: 62
    resolucao: |
      a) $50 - 30 < x < 50 + 30$: $20 < x < 80$.
      b) $x = 30$ ou $x = 50$ (ambos no intervalo).
      c) A ripa de 50 cm deve ser a maior: $x < 50$. Com o item a): $20 < x < 50$ (se $x = 50$, há dois maiores ângulos iguais).
    resposta: 'a) $20 < x < 80$; b) 30 ou 50; c) $20 < x < 50$'

  - estilo: Fuvest
    enunciado: |
      No triângulo $ABC$, o ângulo externo em $A$ é o triplo do ângulo interno em $A$, e $\hat{B} - \hat{C} = 30°$. O ângulo $\hat{C}$ mede
    opcoes: ['$45°$', '$52°30^{\prime}$', '$60°$', '$82°30^{\prime}$', '$67°30^{\prime}$']
    correta: B
    espaco: 22
    resolucao: |
      $\hat{A} + 3\hat{A} = 180°$: $\hat{A} = 45°$. $\hat{B} + \hat{C} = 135°$ e $\hat{B} - \hat{C} = 30°$: $\hat{C} = 52{,}5° = 52°30'$.
    resposta: 'B'

  - estilo: Unesp
    enunciado: 'Os ângulos externos de um triângulo (um em cada vértice) são proporcionais a $3$, $4$ e $5$.'
    itens:
    - 'Determine os ângulos externos e os internos.'
    - 'Classifique o triângulo quanto aos ângulos e quanto aos lados.'
    - 'Coloque os lados em ordem crescente, chamando de $a$, $b$ e $c$ os lados opostos aos ângulos internos em ordem crescente.'
    espaco: 62
    resolucao: |
      a) $12k = 360°$, $k = 30°$: externos $90°$, $120°$, $150°$; internos $90°$, $60°$, $30°$.
      b) Retângulo e escaleno (ângulos diferentes).
      c) O menor lado é oposto ao menor ângulo: $a < b < c$, com $c$ (oposto a $90°$) a hipotenusa.
    resposta: 'a) externos $90°, 120°, 150°$; internos $90°, 60°, 30°$; b) retângulo escaleno'

  - estilo: Fuvest
    enunciado: 'Os lados de um triângulo medem $x$, $x + 3$ e $2x - 1$, com $x$ real.'
    itens:
    - 'Determine os valores de $x$ para os quais o triângulo existe.'
    - 'Para $x = 5$, qual lado é oposto ao maior ângulo?'
    - 'Para que valor de $x$ o triângulo é isósceles?'
    espaco: 62
    resolucao: |
      a) Lados positivos: $x > \tfrac{1}{2}$. Desigualdades: $x + (x + 3) > 2x - 1$ (sempre); $x + (2x - 1) > x + 3$ dá $x > 2$; $(x + 3) + (2x - 1) > x$ dá $x > -1$. Logo $x > 2$.
      b) Lados $5$, $8$, $9$: o maior ângulo é oposto ao lado $9$.
      c) $x = 2x - 1$ dá $x = 1$ (não serve); $x + 3 = 2x - 1$ dá $x = 4$: lados $4$, $7$, $7$. ($x = x + 3$ é impossível.)
    resposta: 'a) $x > 2$; b) o lado $2x - 1 = 9$; c) $x = 4$'
