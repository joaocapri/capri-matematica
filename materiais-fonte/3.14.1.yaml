# Aula 3.14.1 — Equações polinomiais
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: teorema fundamental da álgebra (n raízes complexas contando repetições); forma fatorada
# P = a_n(x − r_1)...(x − r_n); montar polinômio a partir das raízes; baixar o grau com raízes conhecidas (Briot);
# testar candidatos inteiros (divisores do termo independente); equações redutíveis (fator comum, biquadradas);
# raízes não reais por Bhaskara; interseção de gráficos. Multiplicidade, Girard e raízes racionais/complexas em detalhe
# ficam para 3.14.2–3.14.4.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Uma equação polinomial de grau $n$ tem $n$ raízes complexas, contando repetições. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Considere $P(x) = 3(x - 2)(x + 1)(x - 4)$. Complete.'
      itens:
      - 'Grau: {{3}}'
      - 'Raízes: {{2, -1, 4}}'
      - 'Coeficiente dominante: {{3}}'
      - 'Termo independente: {{24}}'
      espaco_item: 8
      resolucao: |
        Na forma fatorada, as raízes anulam cada fator. Termo independente: $P(0) = 3 \cdot (-2) \cdot 1 \cdot (-4) = 24$.
      resposta: '3; $2, -1, 4$; 3; 24'
    - enunciado: 'Associe cada equação ao seu conjunto solução, no universo dos complexos.'
      esquerda:
      - '$x^3 - 4x = 0$'
      - '$x^3 - x^2 = 0$'
      - '$x^4 - 5x^2 + 4 = 0$'
      - '$x^3 + x = 0$'
      - '$(x - 3)^3 = 0$'
      direita:
      - '$\{0, i, -i\}$'
      - '$\{3\}$'
      - '$\{-2, 0, 2\}$'
      - '$\{\pm 1, \pm 2\}$'
      - '$\{0, 1\}$'
      resolucao: |
        $x(x^2 - 4)$; $x^2(x - 1)$; $(x^2 - 1)(x^2 - 4)$; $x(x^2 + 1)$; raiz 3 repetida.
      resposta: 'De cima para baixo: 4, 5, 1, 3, 2'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Uma equação polinomial de grau $n \ge 1$ tem $n$ raízes complexas, contando repetições.'
      - 'Toda equação de grau 3 tem três raízes reais distintas.'
      - 'Se $r$ é raiz de $P$, então $x - r$ divide $P$.'
      - 'Uma equação de grau 4 pode ter 5 raízes distintas.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) Teorema fundamental da álgebra. (F) Por exemplo, $x^3 + x = 0$ tem só uma raiz real. (V) D''Alembert. (F) No máximo 4.
      resposta: V, F, V, F
    - enunciado: 'Complete com o polinômio de coeficiente dominante 1 que tem exatamente as raízes dadas.'
      tabela:
        cabecalho: ['Raízes', 'Polinômio']
        linhas:
        - ['$1$ e $3$', '${{x^2 - 4x + 3}}$']
        - ['$-2$ e $2$', '${{x^2 - 4}}$']
        - ['$0$ e $5$', '${{x^2 - 5x}}$']
        - ['$1$, $2$ e $-3$', '${{x^3 - 7x + 6}}$']
      resolucao: |
        Multiplique os fatores $(x - r)$. No último: $(x - 1)(x - 2)(x + 3) = (x^2 - 3x + 2)(x + 3) = x^3 - 7x + 6$.
      resposta: '$x^2 - 4x + 3$; $x^2 - 4$; $x^2 - 5x$; $x^3 - 7x + 6$'
    - enunciado: 'Verifique que 1 é raiz de $x^3 - 3x^2 - 6x + 8 = 0$ e resolva a equação.'
      espaco: 10
      resolucao: |
        $1 - 3 - 6 + 8 = 0$. Briot com 1: 1, $-2$, $-8$, resto 0. $x^2 - 2x - 8 = (x - 4)(x + 2)$. $S = \{1, 4, -2\}$.
      resposta: '$\{-2, 1, 4\}$'
    - enunciado: 'Resolva $x^4 - 13x^2 + 36 = 0$.'
      espaco: 8
      resolucao: |
        Com $y = x^2$: $y^2 - 13y + 36 = 0$, $y = 4$ ou $y = 9$. $S = \{\pm 2, \pm 3\}$.
      resposta: '$\{\pm 2, \pm 3\}$'
    - enunciado: 'Resolva $x^3 - 8 = 0$ nos complexos.'
      espaco: 10
      resolucao: |
        2 é raiz; Briot: 1, 2, 4. $x^2 + 2x + 4 = 0$: $\Delta = -12$, $x = -1 \pm i\sqrt{3}$.
      resposta: '$\{2, -1 + i\sqrt{3}, -1 - i\sqrt{3}\}$'
  - nome: Nível 2
    questoes:
    - texto: |
        Para resolver $x^3 - 9x = 0$, Caio "cortou" um $x$ dos dois lados, chegou a $x^2 = 9$ e respondeu $S = \{-3, 3\}$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 8
      resolucao: |
        Dividir por $x$ supõe $x \ne 0$ e perde essa raiz. Fatorando: $x(x - 3)(x + 3) = 0$, $S = \{-3, 0, 3\}$.
      resposta: '$\{-3, 0, 3\}$'
    - enunciado: 'Sabendo que $-2$ é raiz de $x^3 + 3x^2 - 4 = 0$, resolva a equação.'
      espaco: 10
      resolucao: |
        Briot com $-2$ em $1, 3, 0, -4$: 1, 1, $-2$, resto 0. $x^2 + x - 2 = (x + 2)(x - 1)$. $S = \{-2, 1\}$ ($-2$ aparece duas vezes).
      resposta: '$\{-2, 1\}$'
    - enunciado: 'Sabendo que 1 e $-1$ são raízes de $x^4 - 2x^3 - 2x^2 + 2x + 1 = 0$, encontre as outras.'
      espaco: 12
      resolucao: |
        Divida por $x^2 - 1$ (ou faça Briot com 1 e com $-1$): quociente $x^2 - 2x - 1$. Raízes $1 \pm \sqrt{2}$.
      resposta: '$1 \pm \sqrt{2}$'
    - enunciado: 'Encontre o polinômio $P$ de grau 3 com raízes 1, 2 e 3 e $P(0) = 12$.'
      espaco: 8
      resolucao: |
        $P = a(x - 1)(x - 2)(x - 3)$; $P(0) = -6a = 12$, $a = -2$. $P(x) = -2(x - 1)(x - 2)(x - 3)$.
      resposta: '$-2(x - 1)(x - 2)(x - 3)$'
    - enunciado: 'Testando divisores de 24, encontre uma raiz inteira de $x^3 + x^2 - 14x - 24 = 0$ e resolva a equação.'
      espaco: 12
      resolucao: |
        $P(-2) = -8 + 4 + 28 - 24 = 0$. Briot: 1, $-1$, $-12$. $x^2 - x - 12 = (x - 4)(x + 3)$. $S = \{-3, -2, 4\}$.
      resposta: '$\{-3, -2, 4\}$'
    - enunciado: 'Encontre os pontos de interseção dos gráficos de $y = x^3$ e $y = x^2 + 2x$.'
      espaco: 10
      resolucao: |
        $x^3 - x^2 - 2x = x(x - 2)(x + 1) = 0$: $x = -1, 0, 2$. Pontos $(-1, -1)$, $(0, 0)$, $(2, 8)$.
      resposta: '$(-1, -1)$, $(0, 0)$, $(2, 8)$'
    - enunciado: 'Resolva $x^3 + 1 = 0$ nos complexos. Complete.'
      itens:
      - 'Raiz real: {{-1}}'
      - 'Quociente da divisão por $x + 1$: {{x^2 - x + 1}}'
      - 'Raízes não reais: {{\frac{1 \pm i\sqrt{3}}{2}}}'
      espaco_item: 8
      resolucao: |
        Briot com $-1$ em $1, 0, 0, 1$: 1, $-1$, 1, resto 0. $x^2 - x + 1 = 0$: $\Delta = -3$.
      resposta: '$-1$; $x^2 - x + 1$; $\frac{1 \pm i\sqrt{3}}{2}$'
    - enunciado: 'Resolva $x^4 - 1 = 0$ nos complexos.'
      espaco: 8
      resolucao: |
        $(x^2 - 1)(x^2 + 1) = 0$: $S = \{1, -1, i, -i\}$.
      resposta: '$\{\pm 1, \pm i\}$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que, se $r$ é raiz de um polinômio $P$ de grau $n$, então $P(x) = (x - r)Q(x)$, com $Q$ de grau $n - 1$.'
      espaco: 10
      resolucao: |
        Pelo teorema do resto, a divisão de $P$ por $x - r$ tem resto $P(r) = 0$. Logo $P = (x - r)Q$, e $\operatorname{gr}Q = n - 1$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que um polinômio não nulo de grau $n$ tem no máximo $n$ raízes distintas.'
      espaco: 10
      resolucao: |
        Cada raiz distinta $r_k$ dá um fator $x - r_k$, e os fatores de raízes distintas aparecem todos na fatoração. Se houvesse $n + 1$ raízes distintas, o produto de $n + 1$ fatores teria grau $n + 1 > n$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que, se $r$ é raiz de $ax^4 + bx^2 + c = 0$, então $-r$ também é.'
      espaco: 8
      resolucao: |
        Só aparecem potências pares: $a(-r)^4 + b(-r)^2 + c = ar^4 + br^2 + c = 0$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que dois polinômios de grau no máximo $n$ que coincidem em $n + 1$ valores distintos de $x$ são idênticos.'
      espaco: 10
      resolucao: |
        $P - Q$ tem grau no máximo $n$ e $n + 1$ raízes distintas. Pelo exercício anterior, só pode ser o polinômio nulo.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que $x^3 - 2 = 0$ tem exatamente uma raiz real.'
      espaco: 10
      resolucao: |
        $x^3$ é crescente, então $x^3 = 2$ tem uma única solução real, $\sqrt[3]{2}$. As outras duas raízes (são três, pelo teorema fundamental) não são reais.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      De uma folha de papelão de 10 cm por 16 cm, recortam-se quadrados de lado $x$ nos cantos e dobram-se as abas, como na figura, formando uma caixa sem tampa de volume $x(10 - 2x)(16 - 2x)$. O fabricante quer uma caixa de 144 cm³ e chegou à equação $x^3 - 13x^2 + 40x - 36 = 0$.
    figura:
      tikz: |
        \begin{scope}[scale=.25]
        \draw[ink, line width=1pt, fill=lilas!20] (0,0) rectangle (16,10);
        \foreach \a/\b in {0/0, 14/0, 0/8, 14/8} \draw[ink, fill=white, dashed] (\a,\b) rectangle (\a+2,\b+2);
        \node[font=\scriptsize] at (1,1) {$x$};
        \node[below, font=\scriptsize] at (8,0) {$16$};
        \node[left, font=\scriptsize] at (0,5) {$10$};
        \end{scope}
    enunciado: |
      O lado do quadrado recortado deve ser
    opcoes: ['$2$ cm', '$9$ cm', '$3$ cm', '$4$ cm', '$1$ cm']
    correta: A
    resolucao: |
      $x = 2$ é raiz ($8 - 52 + 80 - 36 = 0$). Briot: 1, $-11$, 18; $x^2 - 11x + 18 = (x - 2)(x - 9)$. $x = 9$ não serve ($10 - 18 < 0$).

  - estilo: Fuvest
    enunciado: |
      O número de raízes complexas, contando repetições, da equação $x^7 - x = 0$ é
    opcoes: ['$3$', '$7$', '$6$', '$2$', '$1$']
    correta: B
    resolucao: |
      O grau é 7.

  - estilo: Unicamp
    enunciado: |
      O conjunto solução de $x^3 - 4x^2 + 4x = 0$ é
    opcoes: ['$\{0, 4\}$.', '$\{2\}$.', '$\{0, 2\}$.', '$\{0, -2, 2\}$.']
    correta: C
    resolucao: |
      $x(x^2 - 4x + 4) = x(x - 2)^2$.

  - estilo: UEM
    enunciado: |
      Considere a equação $x^3 - 7x^2 + 7x + 15 = 0$. Assinale o que for correto.
    proposicoes:
    - '$-1$ é raiz da equação.'
    - 'O primeiro membro é igual a $(x + 1)(x - 3)(x - 5)$.'
    - 'Todas as raízes são reais.'
    - 'A maior raiz é 5.'
    - 'O valor do primeiro membro em $x = 0$ é $-15$.'
    - 'O valor do primeiro membro em $x = 1$ é 16.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) $-1 - 7 - 7 + 15 = 0$. 02) Briot: 1, $-8$, 15; $x^2 - 8x + 15 = (x - 3)(x - 5)$. 04) e 08) Corretas. 16) Incorreta: é 15. 32) $1 - 7 + 7 + 15$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      Uma pequena indústria modela o lucro mensal, em milhares de reais, por $L(x) = -x^3 + 12x^2 - 20x$, em que $x > 0$ é a produção, em toneladas. O quadro mostra alguns valores calculados. O gerente quer saber para quais produções o lucro é exatamente zero.
    tabela:
      cabecalho: ['$x$', '$1$', '$5$', '$11$']
      linhas:
      - ['$L(x)$', '$-9$', '$75$', '$-99$']
    enunciado: |
      O lucro é zero para as produções de
    opcoes: ['$1$ e $10$ toneladas', '$5$ e $10$ toneladas', '$2$ e $12$ toneladas', '$2$ e $10$ toneladas', '$0$ e $12$ toneladas']
    correta: D
    resolucao: |
      $L(x) = -x(x^2 - 12x + 20) = -x(x - 2)(x - 10)$. Com $x > 0$: 2 e 10 (o quadro confirma a troca de sinal entre 1 e 5 e entre 5 e 11).

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir, sobre equações polinomiais com coeficientes reais.
    afirmativas:
    - 'Uma equação de grau $n \ge 1$ tem $n$ raízes complexas, contando repetições.'
    - 'Toda equação de grau 3 tem pelo menos uma raiz real.'
    - 'Toda equação de grau 2 tem raízes reais.'
    - 'Se 2 é raiz de $P$, então $x - 2$ é fator de $P$.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'I e III, apenas.', 'III e IV, apenas.', 'II, III e IV, apenas.', 'I, II e IV, apenas.']
    correta: E
    resolucao: |
      I. Correta. II. Correta: o gráfico de grau ímpar vai de $-\infty$ a $+\infty$ e corta o eixo $x$. III. Incorreta: $x^2 + 1 = 0$. IV. Correta.

  - estilo: Unesp
    enunciado: |
      O polinômio de coeficiente dominante 1 e grau 2 com raízes 3 e $-4$ é
    opcoes: ['$x^2 + x - 12$', '$x^2 - x - 12$', '$x^2 + 7x - 12$', '$x^2 - x + 12$', '$x^2 + 12$']
    correta: A
    resolucao: |
      $(x - 3)(x + 4)$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      O quadro mostra valores de um polinômio $P$ de grau 3 e coeficiente dominante 1.
    tabela:
      cabecalho: ['$x$', '$-2$', '$0$', '$1$', '$3$']
      linhas:
      - ['$P(x)$', '$0$', '$6$', '$0$', '$0$']
    enunciado: |
      O valor de $P(2)$ é
    opcoes: ['$4$.', '$-4$.', '$0$.', '$6$.']
    correta: B
    resolucao: |
      $P = (x + 2)(x - 1)(x - 3)$ (confere $P(0) = 6$). $P(2) = 4 \cdot 1 \cdot (-1) = -4$.

  - estilo: Fuvest
    enunciado: |
      A soma dos quadrados das raízes de $x^4 - 10x^2 + 9 = 0$ é
    opcoes: ['$10$', '$0$', '$20$', '$9$', '$18$']
    correta: C
    resolucao: |
      $x^2 = 1$ ou $x^2 = 9$: raízes $\pm 1$, $\pm 3$. $1 + 1 + 9 + 9 = 20$.

  - estilo: UFSC
    enunciado: |
      Considere a equação $x^3 - 1 = 0$ no universo dos complexos. Assinale o que for correto.
    proposicoes:
    - '1 é raiz da equação.'
    - 'A equação tem três raízes complexas.'
    - 'A equação tem apenas uma raiz real.'
    - 'As raízes não reais são $\frac{-1 \pm i\sqrt{3}}{2}$.'
    - 'A soma das três raízes é 0.'
    - 'As raízes não reais têm módulo 2.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      Briot com 1: 1, 1, 1. $x^2 + x + 1 = 0$: $\Delta = -3$. 16) $1 + (-1) = 0$. 32) Incorreta: $\left|\tfrac{-1 + i\sqrt{3}}{2}\right| = \sqrt{\tfrac{1}{4} + \tfrac{3}{4}} = 1$.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      Um reservatório tem a forma de um bloco retangular cujo comprimento é 2 m maior que a largura e cuja altura é 1 m menor que a largura. O engenheiro quer um volume de 30 m³ e, chamando a largura de $x$, chegou à equação $x(x + 2)(x - 1) = 30$, isto é, $x^3 + x^2 - 2x - 30 = 0$.
    enunciado: |
      A largura do reservatório deve ser
    opcoes: ['$3$ m', '$2$ m', '$5$ m', '$4$ m', '$6$ m']
    correta: A
    resolucao: |
      $x = 3$: $27 + 9 - 6 - 30 = 0$. Briot: 1, 4, 10; $x^2 + 4x + 10 = 0$ não tem raízes reais. Única solução: 3 m.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'A equação $x^3 = x$ tem três raízes reais.'
    - 'A equação $x^4 + 1 = 0$ tem raiz real.'
    - 'As raízes de $x^2 + 1 = 0$ são $i$ e $-i$.'
    - 'Toda equação de grau 5 com coeficientes reais tem pelo menos uma raiz real.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – F – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – V – F.', 'V – F – V – V.']
    correta: E
    resolucao: |
      (V) $-1$, 0, 1. (F) $x^4 \ge 0$. (V) (V) Grau ímpar.

  - estilo: Enem
    texto: |
      Para resolver $x^3 + 2x^2 - 5x - 6 = 0$, uma estudante testou alguns divisores do termo independente, que são os candidatos a raízes inteiras, e registrou os valores do primeiro membro no quadro. Agora ela quer escrever o conjunto solução.
    tabela:
      cabecalho: ['$x$', '$1$', '$-1$', '$2$', '$-2$', '$3$', '$-3$']
      linhas:
      - ['Valor', '$-8$', '$0$', '$0$', '$4$', '$24$', '$0$']
    enunciado: |
      O conjunto solução da equação é
    opcoes: ['$\{1, -2, 3\}$.', '$\{-1, 2\}$.', '$\{1, 2, 3\}$.', '$\{-3, -1, 2\}$.', '$\{-2, 1, 3\}$.']
    correta: D
    resolucao: |
      Os valores que anulam o primeiro membro são $-1$, 2 e $-3$; como o grau é 3, não há outras raízes.

  - estilo: Unesp
    enunciado: |
      O número de raízes reais da equação $x^3 - 27 = 0$ é
    opcoes: ['$0$', '$1$', '$2$', '$3$', '$27$']
    correta: B
    resolucao: |
      $(x - 3)(x^2 + 3x + 9)$, e $x^2 + 3x + 9$ tem $\Delta = -27 < 0$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Considere a equação $x^4 - 5x^3 + 5x^2 + 5x - 6 = 0$. Assinale o que for correto.
    proposicoes:
    - '1 é raiz.'
    - '$-1$ é raiz.'
    - '2 é raiz.'
    - '3 é raiz.'
    - '0 é raiz.'
    - 'A soma das raízes é 5.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      O primeiro membro é $(x^2 - 1)(x^2 - 5x + 6) = (x - 1)(x + 1)(x - 2)(x - 3)$. 16) Incorreta: o termo independente é $-6 \ne 0$. 32) $1 - 1 + 2 + 3 = 5$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Unicamp
    enunciado: |
      Para que 2 seja raiz de $x^3 + kx^2 - 4 = 0$, o valor de $k$ deve ser
    opcoes: ['$-1$.', '$1$.', '$2$.', '$-2$.']
    correta: A
    resolucao: |
      $8 + 4k - 4 = 0$: $k = -1$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Um biólogo modela a altura de uma muda, em centímetros, $t$ semanas depois do plantio, por $h(t) = t^3 - 6t^2 + 12t$, válido nas primeiras semanas. Ele quer saber quando a muda atinge 8 cm e, para isso, montou a equação $t^3 - 6t^2 + 12t - 8 = 0$.
    enunciado: |
      A muda atinge 8 cm na semana
    opcoes: ['$1$', '$4$', '$2$', '$3$', '$8$']
    correta: C
    resolucao: |
      $t^3 - 6t^2 + 12t - 8 = (t - 2)^3$: $t = 2$.

  - estilo: Unesp
    enunciado: |
      Quantas raízes distintas tem a equação $t^3 - 6t^2 + 12t - 8 = 0$?
    opcoes: ['$3$', '$2$', '$0$', '$1$', '$4$']
    correta: D
    resolucao: |
      Só $t = 2$, que aparece três vezes na fatoração.

  - estilo: Fuvest
    enunciado: |
      Um polinômio $P$ de grau 3 tem raízes 1, $-1$ e 2, e $P(0) = 4$. O valor de $P(3)$ é
    opcoes: ['$8$', '$12$', '$4$', '$24$', '$16$']
    correta: E
    resolucao: |
      $P = a(x - 1)(x + 1)(x - 2)$; $P(0) = 2a = 4$, $a = 2$. $P(3) = 2 \cdot 2 \cdot 4 \cdot 1 = 16$.

  - estilo: Unesp
    texto: |
      A figura mostra os gráficos de $y = x^3$ e da reta $y = 3x + 2$.
    figura:
      tikz: |
        \begin{scope}[scale=.55]
        \draw[mudo, ->] (-2.6,0) -- (3,0) node[right, font=\scriptsize] {$x$};
        \draw[mudo, ->] (0,-2.4) -- (0,3) node[above, font=\scriptsize] {$y$};
        \draw[roxo, line width=1pt, domain=-1.75:1.75, samples=50] plot (\x, {0.3*\x*\x*\x});
        \draw[ink, line width=1pt, domain=-2.4:2.6] plot (\x, {0.3*(3*\x + 2)});
        \end{scope}
    enunciado: |
      As abscissas dos pontos comuns aos dois gráficos são
    opcoes: ['$-2$ e $1$', '$-1$ e $2$', '$1$ e $2$', '$-1$, $1$ e $2$', '$0$ e $2$']
    correta: B
    resolucao: |
      $x^3 - 3x - 2 = 0$: $x = -1$ é raiz; Briot: 1, $-1$, $-2$; $x^2 - x - 2 = (x - 2)(x + 1)$. Raízes $-1$ (dupla, a reta tangencia a curva) e 2.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere a equação $x^4 + x^3 - 7x^2 - x + 6 = 0$.'
    itens:
    - 'Verifique que 1 e $-1$ são raízes.'
    - 'Divida o primeiro membro por $x^2 - 1$.'
    - 'Resolva a equação.'
    espaco: 62
    resolucao: |
      a) $1 + 1 - 7 - 1 + 6 = 0$ e $1 - 1 - 7 + 1 + 6 = 0$.
      b) Quociente $x^2 + x - 6$, resto 0.
      c) $x^2 + x - 6 = (x + 3)(x - 2)$: $S = \{-3, -1, 1, 2\}$.
    resposta: 'c) $\{-3, -1, 1, 2\}$'

  - estilo: Unicamp
    enunciado: 'Considere a equação biquadrada $x^4 + 3x^2 - 4 = 0$.'
    itens:
    - 'Faça $y = x^2$ e resolva a equação em $y$.'
    - 'Encontre as quatro raízes complexas da equação original.'
    - 'Escreva o primeiro membro como produto de dois fatores de grau 2 com coeficientes reais.'
    espaco: 62
    resolucao: |
      a) $y^2 + 3y - 4 = 0$: $y = 1$ ou $y = -4$.
      b) $x^2 = 1$: $\pm 1$. $x^2 = -4$: $\pm 2i$.
      c) $(x^2 - 1)(x^2 + 4)$.
    resposta: 'b) $\pm 1$ e $\pm 2i$; c) $(x^2 - 1)(x^2 + 4)$'

  - estilo: ITA
    enunciado: |
      O número de raízes reais da equação $x^5 - x = 0$ é
    opcoes: ['$5$', '$1$', '$3$', '$2$', '$4$']
    correta: C
    espaco: 22
    resolucao: |
      $x(x^4 - 1) = x(x - 1)(x + 1)(x^2 + 1)$: reais 0, 1 e $-1$.
    resposta: 'C'

  - estilo: Unesp
    texto: |
      De uma folha quadrada de papelão de 12 cm de lado, recortam-se quadrados de lado $x$ nos cantos e dobram-se as abas, formando uma caixa sem tampa de 128 cm³.
    enunciado: ''
    itens:
    - 'Mostre que $x$ satisfaz $x^3 - 12x^2 + 36x - 32 = 0$.'
    - 'Verifique que $x = 2$ é raiz e encontre as outras.'
    - 'Quais valores servem para a caixa? Justifique.'
    espaco: 62
    resolucao: |
      a) $x(12 - 2x)^2 = 128$: $4x^3 - 48x^2 + 144x - 128 = 0$; divida por 4.
      b) $8 - 48 + 72 - 32 = 0$. Briot: 1, $-10$, 16; $(x - 2)(x - 8)$. Raízes 2 (duas vezes) e 8.
      c) Só $x = 2$: com $x = 8$, o lado $12 - 16$ seria negativo.
    resposta: 'b) 2 e 8; c) $x = 2$ cm'

  - estilo: UFSC
    enunciado: |
      Considere equações polinomiais. Assinale o que for correto.
    proposicoes:
    - 'Uma equação de grau 6 tem 6 raízes complexas, contando repetições.'
    - 'As raízes de $x^2 + 4 = 0$ são $\pm 2i$.'
    - '$-2$ é raiz de $x^3 + 8 = 0$.'
    - '$x^4 - 16 = 0$ tem quatro raízes reais.'
    - 'Se 3 é raiz de $P$, então $P(x) = (x - 3)Q(x)$ para algum polinômio $Q$.'
    - '$x^4 - 13x^2 + 36 = 0$ tem quatro raízes reais.'
    corretas: [1, 2, 3, 5, 6]
    espaco: 22
    resolucao: |
      01) Teorema fundamental. 02) Correta. 04) $-8 + 8 = 0$. 08) Incorreta: $(x^2 - 4)(x^2 + 4)$, só $\pm 2$ são reais. 16) D''Alembert. 32) $\pm 2$, $\pm 3$.
    resposta: 'Soma 55 (01 + 02 + 04 + 16 + 32)'

  - estilo: Fuvest
    enunciado: 'Considere a equação $x^3 - 2 = 0$.'
    itens:
    - 'Prove que ela tem exatamente uma raiz real.'
    - 'Encontre as outras duas raízes, dividindo $x^3 - 2$ por $x - \sqrt[3]{2}$.'
    - 'Explique por que toda equação de grau ímpar com coeficientes reais tem pelo menos uma raiz real.'
    espaco: 62
    resolucao: |
      a) $x^3$ é crescente: $x^3 = 2$ só para $x = \sqrt[3]{2}$.
      b) Com $c = \sqrt[3]{2}$: $x^3 - c^3 = (x - c)(x^2 + cx + c^2)$. $x = \tfrac{-c \pm \sqrt{c^2 - 4c^2}}{2} = c \cdot \tfrac{-1 \pm i\sqrt{3}}{2}$.
      c) Para $x$ muito grande o polinômio tem o sinal do coeficiente dominante, e para $x$ muito negativo, o sinal oposto. O gráfico, sem saltos, cruza o eixo $x$.
    resposta: 'b) $\sqrt[3]{2} \cdot \frac{-1 \pm i\sqrt{3}}{2}$'

  - estilo: Unicamp
    enunciado: 'Considere a curva $y = x^3$ e a reta $y = 7x - 6$.'
    itens:
    - 'Escreva a equação que dá as abscissas dos pontos comuns.'
    - 'Verifique que 1 é raiz e resolva a equação.'
    - 'Dê os pontos comuns.'
    espaco: 62
    resolucao: |
      a) $x^3 - 7x + 6 = 0$.
      b) $1 - 7 + 6 = 0$. Briot: 1, 1, $-6$; $x^2 + x - 6 = (x + 3)(x - 2)$. Raízes 1, 2, $-3$.
      c) $(1, 1)$, $(2, 8)$ e $(-3, -27)$.
    resposta: 'c) $(1, 1)$, $(2, 8)$, $(-3, -27)$'

  - estilo: Fuvest
    enunciado: |
      O polinômio de coeficiente dominante 1 e grau 4 cujas raízes são 1, $-1$, $i$ e $-i$ é
    opcoes: ['$x^4 + 1$', '$x^4 - 2x^2 + 1$', '$x^4 + 2x^2 + 1$', '$x^4 - 1$', '$x^4 - x$']
    correta: D
    espaco: 22
    resolucao: |
      $(x^2 - 1)(x^2 + 1) = x^4 - 1$.
    resposta: 'D'

  - estilo: Unesp
    texto: |
      O lucro de uma empresa, em milhares de reais, é zero exatamente quando a produção $x$, em toneladas, satisfaz $x^3 - 9x^2 + 26x - 24 = 0$.
    enunciado: ''
    itens:
    - 'Verifique que $x = 2$ é raiz.'
    - 'Fatore o primeiro membro e resolva a equação.'
    - 'O lucro é dado por $L(x) = -(x^3 - 9x^2 + 26x - 24)$. Ele é positivo para $x = 2{,}5$? E para $x = 3{,}5$?'
    espaco: 62
    resolucao: |
      a) $8 - 36 + 52 - 24 = 0$.
      b) Briot: 1, $-7$, 12. $(x - 2)(x - 3)(x - 4)$: raízes 2, 3, 4.
      c) $L(2{,}5) = -(0{,}5)(-0{,}5)(-1{,}5) = -0{,}375 < 0$. $L(3{,}5) = -(1{,}5)(0{,}5)(-0{,}5) = 0{,}375 > 0$.
    resposta: 'b) 2, 3 e 4; c) não; sim'

  - estilo: Fuvest
    enunciado: 'Sejam $P$ e $Q$ polinômios de grau no máximo $n$.'
    itens:
    - 'Prove que, se $P(x_k) = Q(x_k)$ para $n + 1$ valores distintos $x_k$, então $P \equiv Q$.'
    - 'Um polinômio de grau no máximo 2 vale 5 em $x = 1$, $x = 2$ e $x = 3$. Quem é ele?'
    - 'Encontre o polinômio de grau no máximo 2 que vale 1, 4 e 9 em $x = 1$, 2 e 3.'
    espaco: 62
    resolucao: |
      a) $P - Q$ tem grau no máximo $n$ e $n + 1$ raízes: é o polinômio nulo.
      b) Ele e o polinômio constante 5 coincidem em 3 pontos: é o constante 5.
      c) $x^2$ coincide com ele nos três pontos: é $x^2$.
    resposta: 'b) $P(x) = 5$; c) $x^2$'
