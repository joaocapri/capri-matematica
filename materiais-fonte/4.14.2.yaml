# Aula 4.14.2 — Geometria espacial: sólidos de revolução
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: identificar o sólido gerado pela rotação de uma região plana (retângulo → cilindro; retângulo afastado do
# eixo → cilindro vazado; triângulo retângulo → cone; semicírculo → esfera); volumes por soma e diferença de cilindros
# (e cones, com V = πr²h/3 dado no enunciado); rotação do contorno (superfícies: 2πrℓ e coroas); teorema de Pappus no
# aprofundamento. Cone e esfera em detalhe ficam para 4.15 e 4.17.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Deixe as respostas em função de $\pi$, salvo indicação. Quando aparecer um cone, use $V = \frac{\pi r^2 h}{3}$. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Associe cada rotação, de uma volta completa, ao que ela gera.'
      esquerda:
      - 'retângulo girando em torno de um lado'
      - 'triângulo retângulo girando em torno de um cateto'
      - 'semicírculo girando em torno do diâmetro'
      - 'retângulo girando em torno de uma reta paralela a um lado, fora dele'
      - 'segmento paralelo ao eixo (só a linha)'
      direita:
      - 'esfera'
      - 'cone'
      - 'superfície lateral de um cilindro'
      - 'cilindro vazado (tubo)'
      - 'cilindro'
      resolucao: |
        Girar uma região gera um sólido; girar uma linha gera só uma superfície.
      resposta: 'De cima para baixo: 3, 2, 5, 4, 1'
    - enunciado: 'Um retângulo de lados 3 e 5 gira em torno de um dos lados. Complete.'
      itens:
      - 'Volume, girando em torno do lado de 5: {{45\pi}}'
      - 'Volume, girando em torno do lado de 3: {{75\pi}}'
      - 'Área lateral, girando em torno do lado de 5: {{30\pi}}'
      - 'Área total, girando em torno do lado de 5: {{48\pi}}'
      espaco_item: 8
      resolucao: |
        Em torno do lado de 5: $r = 3$, $h = 5$, $V = 45\pi$, $A_l = 2\pi \cdot 3 \cdot 5 = 30\pi$, $A_T = 30\pi + 2 \cdot 9\pi = 48\pi$. Em torno do lado de 3: $r = 5$, $h = 3$, $V = 75\pi$.
      resposta: '$45\pi$; $75\pi$; $30\pi$; $48\pi$'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Um retângulo girando em torno de um de seus lados gera um cilindro reto.'
      - 'Um retângulo de lados 2 e 4 gera o mesmo volume girando em torno do lado de 2 ou do lado de 4.'
      - 'O contorno de um retângulo girando em torno de um lado gera uma superfície, e não um sólido.'
      - 'Um triângulo retângulo girando em torno da hipotenusa gera um cone.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) (F) Em torno do lado de 4: $\pi \cdot 4 \cdot 4 = 16\pi$; em torno do lado de 2: $\pi \cdot 16 \cdot 2 = 32\pi$. (V) (F) Gera dois cones unidos pela base.
      resposta: V, F, V, F
    - enunciado: 'Um quadrado de lado $L$ gira em torno de um lado. Complete.'
      tabela:
        cabecalho: ['$L$', 'Volume', 'Área total']
        linhas:
        - ['$1$', '${{\pi}}$', '${{4\pi}}$']
        - ['$2$', '${{8\pi}}$', '${{16\pi}}$']
        - ['$3$', '${{27\pi}}$', '${{36\pi}}$']
        - ['$5$', '${{125\pi}}$', '${{100\pi}}$']
      resolucao: |
        Cilindro de $r = h = L$: $V = \pi L^3$ e $A_T = 2\pi L(L + L) = 4\pi L^2$.
      resposta: '$\pi$, $4\pi$; $8\pi$, $16\pi$; $27\pi$, $36\pi$; $125\pi$, $100\pi$'
    - enunciado: 'O retângulo da figura gira em torno do eixo $e$. Calcule o volume do sólido gerado.'
      figura:
        tikz: |
          \begin{scope}[scale=.4]
          \draw[mudo, dashed] (0,-0.6) -- (0,6.8);
          \node[left, font=\scriptsize] at (0,6.5) {$e$};
          \draw[ink, line width=1pt, fill=lilas!30] (1,0) rectangle (3,6);
          \draw[mudo, <->] (0,-0.5) -- (1,-0.5);
          \node[below, font=\scriptsize] at (0.5,-0.5) {$1$};
          \draw[mudo, <->] (1,-0.5) -- (3,-0.5);
          \node[below, font=\scriptsize] at (2,-0.5) {$2$};
          \node[right, font=\scriptsize] at (3,3) {$6$};
          \end{scope}
      espaco: 10
      resolucao: |
        Cilindro vazado de raios 1 e 3 e altura 6: $V = \pi(9 - 1) \cdot 6 = 48\pi$.
      resposta: '$48\pi$'
    - enunciado: 'Um triângulo retângulo de catetos 3 e 4 gira em torno do cateto de 4. Calcule o volume do cone gerado.'
      espaco: 8
      resolucao: |
        $r = 3$, $h = 4$: $V = \tfrac{\pi \cdot 9 \cdot 4}{3} = 12\pi$.
      resposta: '$12\pi$'
    - enunciado: 'Um segmento de 5 cm, paralelo a um eixo e a 2 cm dele, gira em torno do eixo. Calcule a área da superfície gerada.'
      espaco: 8
      resolucao: |
        É a superfície lateral de um cilindro de raio 2 e altura 5: $2\pi \cdot 2 \cdot 5 = 20\pi$ cm².
      resposta: '$20\pi$ cm²'
  - nome: Nível 2
    questoes:
    - texto: |
        Lia girou um retângulo de lados 4 e 10 em torno do lado de 10 e calculou $V = \pi \cdot 10^2 \cdot 4 = 400\pi$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 10
      resolucao: |
        O lado que está no eixo é a altura; o outro é o raio: $r = 4$, $h = 10$, $V = 160\pi$.
      resposta: '$160\pi$'
    - enunciado: 'A região da figura gira em torno do eixo $e$. Calcule o volume do sólido gerado.'
      figura:
        tikz: |
          \begin{scope}[scale=.4]
          \draw[mudo, dashed] (0,-0.6) -- (0,5.8);
          \node[left, font=\scriptsize] at (0,5.5) {$e$};
          \draw[ink, line width=1pt, fill=lilas!30] (0,0) -- (4,0) -- (4,2) -- (2,2) -- (2,5) -- (0,5) -- cycle;
          \node[below, font=\scriptsize] at (2,0) {$4$};
          \node[right, font=\scriptsize] at (4,1) {$2$};
          \node[above, font=\scriptsize] at (1,5) {$2$};
          \node[right, font=\scriptsize] at (2,3.5) {$3$};
          \end{scope}
      espaco: 10
      resolucao: |
        Dois cilindros empilhados: $r = 4$, $h = 2$ e $r = 2$, $h = 3$. $V = 32\pi + 12\pi = 44\pi$.
      resposta: '$44\pi$'
    - enunciado: 'Um cano tem 1 m de comprimento, raio externo de 5 cm e raio interno de 4 cm. Calcule o volume de material, com $\pi \approx 3{,}14$.'
      espaco: 10
      resolucao: |
        $\pi(25 - 16) \cdot 100 = 900\pi \approx 2826$ cm³.
      resposta: '$900\pi \approx 2826$ cm³'
    - enunciado: 'Um retângulo de lados 6 e 4 gira em torno da reta que passa pelos pontos médios dos lados de 6. Calcule o volume gerado.'
      espaco: 10
      resolucao: |
        Cada metade gira sobre a outra: o sólido é o cilindro de raio 3 e altura 4. $V = 36\pi$.
      resposta: '$36\pi$'
    - enunciado: 'Um retângulo de lados $a$ e $b$ gira em torno de um lado. Complete com os volumes.'
      tabela:
        cabecalho: ['$a$', '$b$', 'Em torno de $a$', 'Em torno de $b$']
        linhas:
        - ['$1$', '$4$', '${{16\pi}}$', '${{4\pi}}$']
        - ['$2$', '$3$', '${{18\pi}}$', '${{12\pi}}$']
        - ['$2$', '$6$', '${{72\pi}}$', '${{24\pi}}$']
      resolucao: |
        Em torno de $a$: $r = b$, $V = \pi b^2 a$. Em torno de $b$: $V = \pi a^2 b$.
      resposta: '$16\pi$, $4\pi$; $18\pi$, $12\pi$; $72\pi$, $24\pi$'
    - enunciado: 'No retângulo $OABC$ da figura, o lado $OC$ está sobre o eixo. O triângulo $OAB$ gira em torno do eixo. Calcule o volume gerado.'
      figura:
        tikz: |
          \begin{scope}[scale=.4]
          \draw[mudo, dashed] (0,-0.6) -- (0,6.8);
          \fill[lilas!40] (0,0) -- (4,0) -- (4,6) -- cycle;
          \draw[ink, line width=1pt] (0,0) rectangle (4,6) (0,0) -- (4,6);
          \node[below left, font=\scriptsize] at (0,0) {$O$};
          \node[below right, font=\scriptsize] at (4,0) {$A$};
          \node[above right, font=\scriptsize] at (4,6) {$B$};
          \node[above left, font=\scriptsize] at (0,6) {$C$};
          \node[below, font=\scriptsize] at (2,0) {$4$};
          \node[right, font=\scriptsize] at (4,3) {$6$};
          \end{scope}
      espaco: 10
      resolucao: |
        O retângulo gera o cilindro de $r = 4$, $h = 6$ ($96\pi$); o triângulo $OBC$ gera um cone de mesma base e altura ($32\pi$). Sobra $96\pi - 32\pi = 64\pi$.
      resposta: '$64\pi$'
    - enunciado: 'O contorno de um retângulo de lados 3 e 5 gira em torno do lado de 5. Calcule a área da superfície gerada.'
      espaco: 10
      resolucao: |
        O lado sobre o eixo não gera nada; o lado oposto gera a superfície lateral ($2\pi \cdot 3 \cdot 5 = 30\pi$); os lados de 3 geram dois discos ($9\pi$ cada). Total $48\pi$.
      resposta: '$48\pi$'
    - enunciado: 'Um retângulo gira em torno de um lado e gera um cilindro de volume $20\pi$. Qual o volume gerado se os dois lados forem triplicados?'
      espaco: 8
      resolucao: |
        Raio e altura triplicam: $3^2 \cdot 3 = 27$ vezes. $V = 540\pi$.
      resposta: '$540\pi$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Um retângulo de lados $a$ e $b$ gira em torno do lado $a$ e, depois, em torno do lado $b$. Prove que a razão entre os volumes obtidos é $\frac{b}{a}$.'
      espaco: 10
      resolucao: |
        $\tfrac{\pi b^2 a}{\pi a^2 b} = \tfrac{b}{a}$.
      resposta: 'Ver resolução'
    - enunciado: 'Um retângulo de largura $w$ e altura $h$ gira em torno de uma reta paralela ao lado $h$, a uma distância $d$ do lado mais próximo. Prove que o volume é $2\pi\left(d + \frac{w}{2}\right) \cdot wh$.'
      espaco: 12
      resolucao: |
        $V = \pi h[(d + w)^2 - d^2] = \pi h(2dw + w^2) = 2\pi\left(d + \tfrac{w}{2}\right) wh$.
      resposta: 'Ver resolução'
    - enunciado: 'Um triângulo retângulo de catetos $a$ e $b$ gira em torno do cateto $a$ e, depois, em torno do cateto $b$. Prove que a razão entre os volumes obtidos é $\frac{b}{a}$.'
      espaco: 10
      resolucao: |
        Em torno de $a$: $\tfrac{\pi b^2 a}{3}$. Em torno de $b$: $\tfrac{\pi a^2 b}{3}$. Razão $\tfrac{b}{a}$.
      resposta: 'Ver resolução'
    - enunciado: 'Um triângulo retângulo de catetos $a$, $b$ e hipotenusa $c$ gira em torno da hipotenusa. Prove que o volume é $\frac{\pi a^2 b^2}{3c}$.'
      espaco: 12
      resolucao: |
        São dois cones de raio comum igual à altura relativa à hipotenusa, $r = \tfrac{ab}{c}$, e alturas $h_1 + h_2 = c$. $V = \tfrac{\pi r^2 h_1}{3} + \tfrac{\pi r^2 h_2}{3} = \tfrac{\pi r^2 c}{3} = \tfrac{\pi a^2 b^2}{3c}$.
      resposta: 'Ver resolução'
    - enunciado: 'O contorno de um retângulo de lados $a$ e $b$ gira em torno do lado $a$. Prove que a área da superfície gerada é $2\pi b(a + b)$.'
      espaco: 10
      resolucao: |
        O lado oposto ao eixo gera $2\pi b a$; os dois lados de medida $b$ geram discos de área $\pi b^2$. Total $2\pi ab + 2\pi b^2 = 2\pi b(a + b)$.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Em um programa de modelagem 3D, um desenhista cria peças girando figuras planas em torno de um eixo. Ele desenha um retângulo de 3 cm por 8 cm, com o lado de 8 cm sobre o eixo, como na figura, e manda o programa girá-lo uma volta completa. Use 3 como aproximação para $\pi$.
    figura:
      tikz: |
        \begin{scope}[scale=.25]
        \draw[mudo, dashed] (0,-1) -- (0,9.5);
        \draw[ink, line width=1pt, fill=lilas!30] (0,0) rectangle (3,8);
        \draw[roxo, ->] (0.9,9) arc (0:320:0.9 and 0.35);
        \node[below, font=\scriptsize] at (1.5,0) {$3$};
        \node[right, font=\scriptsize] at (3,4) {$8$};
        \end{scope}
    enunciado: |
      O volume da peça obtida é
    opcoes: ['$216$ cm³', '$576$ cm³', '$72$ cm³', '$144$ cm³', '$432$ cm³']
    correta: A
    resolucao: |
      Cilindro de $r = 3$ e $h = 8$: $\pi \cdot 9 \cdot 8 = 72\pi \approx 216$ cm³.

  - estilo: Fuvest
    enunciado: |
      Um retângulo de lados 2 e 5 gira em torno do lado de 2. O volume do sólido gerado é
    opcoes: ['$20\pi$', '$50\pi$', '$10\pi$', '$100\pi$', '$25\pi$']
    correta: B
    resolucao: |
      $r = 5$, $h = 2$: $V = 50\pi$.

  - estilo: Unicamp
    enunciado: |
      Um quadrado de lado 4 gira em torno de uma reta paralela a um de seus lados, situada fora do quadrado, a uma distância 2 do lado mais próximo. O volume do sólido gerado é
    opcoes: ['$64\pi$.', '$144\pi$.', '$128\pi$.', '$16\pi$.']
    correta: C
    resolucao: |
      Cilindro vazado de raios 2 e 6 e altura 4: $\pi(36 - 4) \cdot 4 = 128\pi$.

  - estilo: UEM
    enunciado: |
      Considere um retângulo de lados 3 e 6 e os sólidos obtidos ao girá-lo em torno de cada um desses lados. Assinale o que for correto.
    proposicoes:
    - 'Girando em torno do lado de 6, o volume é $54\pi$.'
    - 'Girando em torno do lado de 3, o volume é $108\pi$.'
    - 'Girando em torno do lado de 6, a área lateral é $36\pi$.'
    - 'Os dois sólidos têm a mesma área lateral.'
    - 'Os dois sólidos têm o mesmo volume.'
    - 'Girando em torno do lado de 6, a área total é $54\pi$.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) $\pi \cdot 9 \cdot 6$. 02) $\pi \cdot 36 \cdot 3$. 04) $2\pi \cdot 3 \cdot 6$. 08) $2\pi \cdot 6 \cdot 3 = 36\pi$ também. 16) Incorreta. 32) $36\pi + 2 \cdot 9\pi$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      Um cano de PVC tem 2 m de comprimento, diâmetro externo de 10 cm e parede de 1 cm de espessura. Ele pode ser visto como o sólido gerado pela rotação de um retângulo em torno do eixo do cano. Para calcular o custo de produção, a fábrica precisa do volume de PVC de cada cano. Use 3 como aproximação para $\pi$.
    enunciado: |
      O volume de PVC de cada cano é
    opcoes: ['$5\,400$ cm³', '$9\,600$ cm³', '$15\,000$ cm³', '$1\,800$ cm³', '$6\,000$ cm³']
    correta: A
    resolucao: |
      Raios 5 cm e 4 cm, comprimento 200 cm: $\pi(25 - 16) \cdot 200 = 1800\pi \approx 5400$ cm³.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir, sobre sólidos gerados por uma volta completa de uma região plana em torno de um eixo.
    afirmativas:
    - 'Um triângulo retângulo girando em torno de um cateto gera um cone.'
    - 'Um semicírculo girando em torno do seu diâmetro gera uma esfera.'
    - 'Um retângulo girando em torno de uma reta paralela a um lado, sem tocá-lo, gera um cilindro maciço.'
    - 'Um triângulo retângulo girando em torno da hipotenusa gera dois cones de mesma base.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'II e III, apenas.', 'III e IV, apenas.', 'I, II e IV, apenas.', 'I, II, III e IV.']
    correta: D
    resolucao: |
      I. Correta. II. Correta. III. Incorreta: gera um cilindro vazado (tubo). IV. Correta: a altura relativa à hipotenusa é o raio comum.

  - estilo: Unesp
    enunciado: |
      Um triângulo retângulo de catetos 3 e 6 gira em torno do cateto de 6. Sabendo que o volume de um cone é $\frac{\pi r^2 h}{3}$, o volume do sólido gerado é
    opcoes: ['$54\pi$', '$36\pi$', '$12\pi$', '$9\pi$', '$18\pi$']
    correta: E
    resolucao: |
      $r = 3$, $h = 6$: $\tfrac{\pi \cdot 9 \cdot 6}{3} = 18\pi$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      A região da figura gira uma volta completa em torno do eixo $e$.
    figura:
      tikz: |
        \begin{scope}[scale=.3]
        \draw[mudo, dashed] (0,-0.8) -- (0,7);
        \node[left, font=\scriptsize] at (0,6.6) {$e$};
        \draw[ink, line width=1pt, fill=lilas!30] (0,0) -- (6,0) -- (6,2) -- (2,2) -- (2,6) -- (0,6) -- cycle;
        \node[below, font=\scriptsize] at (3,0) {$6$};
        \node[right, font=\scriptsize] at (6,1) {$2$};
        \node[above, font=\scriptsize] at (1,6) {$2$};
        \node[right, font=\scriptsize] at (2,4) {$4$};
        \end{scope}
    enunciado: |
      O volume do sólido gerado é
    opcoes: ['$72\pi$.', '$88\pi$.', '$216\pi$.', '$104\pi$.']
    correta: B
    resolucao: |
      Cilindro de $r = 6$, $h = 2$ ($72\pi$) mais cilindro de $r = 2$, $h = 4$ ($16\pi$): $88\pi$.

  - estilo: Fuvest
    enunciado: |
      Um segmento de medida 6, paralelo a uma reta $e$ e a uma distância 4 dela, gira em torno de $e$. A área da superfície gerada é
    opcoes: ['$24\pi$', '$96\pi$', '$48\pi$', '$16\pi$', '$36\pi$']
    correta: C
    resolucao: |
      Superfície lateral de um cilindro de raio 4 e altura 6: $2\pi \cdot 4 \cdot 6 = 48\pi$.

  - estilo: UFSC
    enunciado: |
      Um retângulo de lados 2 e 5 gira em torno de uma reta paralela ao lado de 5, fora do retângulo, a uma distância 3 do lado mais próximo. Assinale o que for correto.
    proposicoes:
    - 'O volume do sólido gerado é $80\pi$.'
    - 'A superfície lateral externa tem área $50\pi$.'
    - 'A superfície lateral interna tem área $30\pi$.'
    - 'Cada base do sólido é uma coroa circular de área $16\pi$.'
    - 'O volume é igual ao de um cilindro de raio 4 e altura 5.'
    - 'A área total da superfície do sólido é $96\pi$.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      Raios 3 e 5, altura 5. 01) $\pi(25 - 9) \cdot 5$. 02) $2\pi \cdot 5 \cdot 5$. 04) $2\pi \cdot 3 \cdot 5$. 08) $\pi(25 - 9)$. 16) $\pi \cdot 16 \cdot 5 = 80\pi$. 32) Incorreta: $50\pi + 30\pi + 32\pi = 112\pi$.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      Um porta-lápis de madeira é feito num torno: o artesão parte de um cilindro maciço de 5 cm de raio e 10 cm de altura e cava, a partir do topo, um furo cilíndrico de 3 cm de raio e 8 cm de profundidade, com o mesmo eixo. O preço da peça depende do volume de madeira. Use 3 como aproximação para $\pi$.
    enunciado: |
      O volume de madeira do porta-lápis é
    opcoes: ['$534$ cm³', '$750$ cm³', '$216$ cm³', '$480$ cm³', '$600$ cm³']
    correta: A
    resolucao: |
      $\pi \cdot 25 \cdot 10 - \pi \cdot 9 \cdot 8 = 250\pi - 72\pi = 178\pi \approx 534$ cm³.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir, sobre rotações de uma volta completa.
    afirmacoes:
    - 'Um retângulo de lados 2 e 4 girando em torno do lado de 4 gera um sólido de volume $16\pi$.'
    - 'Esse mesmo retângulo, girando em torno do lado de 2, gera o mesmo volume.'
    - 'O contorno de um retângulo girando em torno de um lado gera uma superfície.'
    - 'Um quadrado de lado 1 girando em torno de uma reta paralela a um lado, fora dele e a uma distância 1 desse lado, gera um sólido de volume $3\pi$.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – F – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – V – F.', 'V – F – V – V.']
    correta: E
    resolucao: |
      (V) $\pi \cdot 4 \cdot 4$. (F) $\pi \cdot 16 \cdot 2 = 32\pi$. (V) (V) Raios 1 e 2, altura 1: $\pi(4 - 1) = 3\pi$.

  - estilo: Enem
    texto: |
      Uma oficina produz peças de alumínio girando retângulos em torno de um eixo vertical. O quadro mostra, para cada peça, as medidas do retângulo, em centímetros, e a distância do lado vertical mais próximo até o eixo (distância zero significa que o lado está sobre o eixo). O dono quer saber qual peça gasta mais alumínio.
    tabela:
      cabecalho: ['Peça', 'Largura', 'Altura', 'Distância ao eixo']
      linhas:
      - ['P1', '$2$', '$10$', '$0$']
      - ['P2', '$4$', '$3$', '$0$']
      - ['P3', '$2$', '$5$', '$2$']
      - ['P4', '$1$', '$8$', '$3$']
      - ['P5', '$3$', '$4$', '$0$']
    enunciado: |
      A peça que gasta mais alumínio é a
    opcoes: ['P1.', 'P2.', 'P4.', 'P3.', 'P5.']
    correta: D
    resolucao: |
      P1 $40\pi$; P2 $48\pi$; P3 $\pi(16 - 4) \cdot 5 = 60\pi$; P4 $\pi(16 - 9) \cdot 8 = 56\pi$; P5 $36\pi$.

  - estilo: Unesp
    enunciado: |
      O contorno de um quadrado de lado 3 gira em torno de um de seus lados. A área da superfície gerada é
    opcoes: ['$18\pi$', '$36\pi$', '$27\pi$', '$54\pi$', '$45\pi$']
    correta: B
    resolucao: |
      Superfície lateral $2\pi \cdot 3 \cdot 3 = 18\pi$ e dois discos de $9\pi$: $36\pi$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Um triângulo retângulo de catetos 6 e 8 gira em torno de cada lado. Use $V_{\text{cone}} = \frac{\pi r^2 h}{3}$. Assinale o que for correto.
    proposicoes:
    - 'Em torno do cateto de 8, o volume é $96\pi$.'
    - 'Em torno do cateto de 6, o volume é $128\pi$.'
    - 'Em torno da hipotenusa, obtêm-se dois cones de raio comum 4,8.'
    - 'Em torno da hipotenusa, o volume é $76{,}8\pi$.'
    - 'Os três volumes são iguais.'
    - 'O maior volume é obtido girando em torno do menor cateto.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) $\tfrac{\pi \cdot 36 \cdot 8}{3}$. 02) $\tfrac{\pi \cdot 64 \cdot 6}{3}$. 04) Altura relativa à hipotenusa: $\tfrac{6 \cdot 8}{10} = 4{,}8$. 08) $\tfrac{\pi \cdot 4{,}8^2 \cdot 10}{3} = 76{,}8\pi$. 16) Incorreta. 32) $128\pi$ é o maior.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Unicamp
    enunciado: |
      Um retângulo de lados 8 e 6 gira em torno da reta que passa pelos pontos médios dos lados de 8. O volume do sólido gerado é
    opcoes: ['$96\pi$.', '$384\pi$.', '$192\pi$.', '$48\pi$.']
    correta: A
    resolucao: |
      Cilindro de raio 4 e altura 6: $96\pi$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Uma metalúrgica produz arruelas, peças planas em forma de coroa circular que podem ser vistas como o sólido gerado pela rotação de um retângulo em torno de um eixo paralelo a um de seus lados. Cada arruela tem raio interno de 1 cm, raio externo de 2,5 cm e espessura de 0,4 cm. Use 3 como aproximação para $\pi$.
    enunciado: |
      O volume de cada arruela é
    opcoes: ['$7{,}5$ cm³', '$1{,}2$ cm³', '$6{,}3$ cm³', '$2{,}1$ cm³', '$8{,}4$ cm³']
    correta: C
    resolucao: |
      $\pi(6{,}25 - 1) \cdot 0{,}4 = 2{,}1\pi \approx 6{,}3$ cm³.

  - estilo: Unesp
    enunciado: |
      O aço das arruelas tem densidade de 8 g/cm³. A massa de um lote de 1000 arruelas é
    opcoes: ['$5{,}04$ kg', '$60$ kg', '$504$ kg', '$50{,}4$ kg', '$16{,}8$ kg']
    correta: D
    resolucao: |
      $6{,}3 \cdot 8 \cdot 1000 = 50\,400$ g $= 50{,}4$ kg.

  - estilo: Fuvest
    enunciado: |
      Um retângulo com um lado sobre um eixo é dividido por uma diagonal, e cada triângulo gira em torno do eixo. A razão entre o maior e o menor volume gerado é
    opcoes: ['$1$', '$3$', '$\frac{1}{2}$', '$\frac{3}{2}$', '$2$']
    correta: E
    resolucao: |
      O triângulo com um cateto sobre o eixo gera um cone, $\tfrac{1}{3}$ do cilindro; o outro gera o restante, $\tfrac{2}{3}$. Razão 2.

  - estilo: Unesp
    texto: |
      A região da figura, formada por dois retângulos, gira uma volta completa em torno do eixo $e$.
    figura:
      tikz: |
        \begin{scope}[scale=.3]
        \draw[mudo, dashed] (0,-0.9) -- (0,4.8);
        \node[left, font=\scriptsize] at (0,4.5) {$e$};
        \draw[ink, line width=1pt, fill=lilas!30] (1,0) -- (5,0) -- (5,1) -- (3,1) -- (3,4) -- (1,4) -- cycle;
        \draw[mudo, <->] (0,-0.5) -- (1,-0.5);
        \node[below, font=\scriptsize] at (0.5,-0.5) {$1$};
        \draw[mudo, <->] (1,-0.5) -- (5,-0.5);
        \node[below, font=\scriptsize] at (3,-0.5) {$4$};
        \node[right, font=\scriptsize] at (5,0.5) {$1$};
        \node[above, font=\scriptsize] at (2,4) {$2$};
        \node[right, font=\scriptsize] at (3,2.5) {$3$};
        \end{scope}
    enunciado: |
      O volume do sólido gerado é
    opcoes: ['$32\pi$', '$48\pi$', '$64\pi$', '$100\pi$', '$16\pi$']
    correta: B
    resolucao: |
      Tubo de raios 1 e 3 e altura 4: $\pi(9 - 1) \cdot 4 = 32\pi$. Anel de raios 3 e 5 e altura 1: $\pi(25 - 9) = 16\pi$. Total $48\pi$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Um retângulo de largura $w$ e altura $h$ gira em torno de uma reta paralela ao lado de medida $h$, fora do retângulo, a uma distância $d$ do lado mais próximo.'
    itens:
    - 'Prove que o volume gerado é $\pi h[(d + w)^2 - d^2]$.'
    - 'Prove que esse volume é igual a $2\pi \bar{x} \cdot A$, sendo $A$ a área do retângulo e $\bar{x}$ a distância do centro do retângulo ao eixo.'
    - 'Calcule o volume para $w = 2$, $h = 5$ e $d = 3$ pelas duas fórmulas.'
    espaco: 62
    resolucao: |
      a) Cilindro de raio $d + w$ menos cilindro de raio $d$, ambos de altura $h$.
      b) $\pi h(2dw + w^2) = 2\pi\left(d + \tfrac{w}{2}\right) wh$, com $\bar{x} = d + \tfrac{w}{2}$ e $A = wh$.
      c) $\pi \cdot 5 \cdot (25 - 9) = 80\pi$; $2\pi \cdot 4 \cdot 10 = 80\pi$.
    resposta: 'c) $80\pi$'

  - estilo: Unicamp
    enunciado: 'Um triângulo retângulo tem catetos 5 e 12 e hipotenusa 13. Use $V_{\text{cone}} = \frac{\pi r^2 h}{3}$.'
    itens:
    - 'Calcule o volume gerado pela rotação em torno do cateto de 12.'
    - 'Calcule o volume gerado pela rotação em torno do cateto de 5.'
    - 'Calcule o volume gerado pela rotação em torno da hipotenusa.'
    espaco: 62
    resolucao: |
      a) $r = 5$, $h = 12$: $100\pi$.
      b) $r = 12$, $h = 5$: $240\pi$.
      c) Dois cones de raio $\tfrac{5 \cdot 12}{13} = \tfrac{60}{13}$ e alturas somando 13: $\tfrac{\pi}{3} \cdot \tfrac{3600}{169} \cdot 13 = \tfrac{1200\pi}{13}$.
    resposta: 'a) $100\pi$; b) $240\pi$; c) $\frac{1200\pi}{13}$'

  - estilo: ITA
    enunciado: |
      Um quadrado de lado $a$ gira em torno de uma de suas diagonais. Sabendo que o volume de um cone é $\frac{\pi r^2 h}{3}$, o volume do sólido gerado é
    opcoes: ['$\frac{\pi a^3}{3}$', '$\frac{\pi a^3\sqrt{2}}{3}$', '$\frac{\pi a^3\sqrt{2}}{6}$', '$\frac{\pi a^3}{6}$', '$\pi a^3\sqrt{2}$']
    correta: C
    espaco: 22
    resolucao: |
      Dois cones de raio $\tfrac{a\sqrt{2}}{2}$ (meia diagonal) e altura total $a\sqrt{2}$: $\tfrac{\pi}{3} \cdot \tfrac{a^2}{2} \cdot a\sqrt{2} = \tfrac{\pi a^3\sqrt{2}}{6}$.
    resposta: 'C'

  - estilo: Unesp
    texto: |
      Um copo de madeira é torneado a partir de um cilindro maciço de 4 cm de raio e 10 cm de altura. O artesão cava, a partir do topo e com o mesmo eixo, um furo cilíndrico de 3 cm de raio, deixando um fundo de 1 cm de espessura.
    enunciado: ''
    itens:
    - 'Calcule o volume de madeira do copo, com $\pi \approx 3{,}14$.'
    - 'Calcule a capacidade do copo, em mililitros.'
    - 'Com densidade da madeira de 0,6 g/cm³, calcule a massa do copo.'
    espaco: 62
    resolucao: |
      a) Furo de profundidade 9: $\pi(16 \cdot 10 - 9 \cdot 9) = 79\pi \approx 248{,}1$ cm³.
      b) $81\pi \approx 254{,}3$ cm³ $\approx 254$ mL.
      c) $248{,}1 \cdot 0{,}6 \approx 148{,}8$ g.
    resposta: 'a) $\approx 248{,}1$ cm³; b) $\approx 254$ mL; c) $\approx 149$ g'

  - estilo: UFSC
    enunciado: |
      Considere sólidos e superfícies gerados por uma volta completa em torno de um eixo. Use $V_{\text{cone}} = \frac{\pi r^2 h}{3}$. Assinale o que for correto.
    proposicoes:
    - 'Um retângulo de lados 2 e 6, girando em torno do lado de 6, gera um sólido de volume $24\pi$.'
    - 'Um quadrado de lado 2, girando em torno de uma diagonal, gera um sólido de volume $\frac{4\sqrt{2}\,\pi}{3}$.'
    - 'Um semicírculo girando em torno do seu diâmetro gera uma esfera.'
    - 'O contorno de um retângulo girando em torno de um lado gera um sólido.'
    - 'Um retângulo girando em torno da reta que passa pelos pontos médios de dois lados opostos gera o mesmo sólido que cada metade girando em torno do seu lado sobre o eixo.'
    - 'Um triângulo equilátero de lado 2, girando em torno de uma altura, gera um cone de raio 1 e altura $\sqrt{3}$.'
    corretas: [1, 2, 3, 5, 6]
    espaco: 22
    resolucao: |
      01) $\pi \cdot 4 \cdot 6$. 02) $\tfrac{\pi \cdot 8\sqrt{2}}{6}$. 04) Correta. 08) Incorreta: gera uma superfície. 16) As metades são simétricas em relação ao eixo. 32) A altura divide o triângulo em dois triângulos retângulos de catetos 1 e $\sqrt{3}$.
    resposta: 'Soma 55 (01 + 02 + 04 + 16 + 32)'

  - estilo: Fuvest
    enunciado: 'Um triângulo retângulo de catetos $a$ e $b$ e hipotenusa $c$ gira em torno da hipotenusa.'
    itens:
    - 'Prove que o volume gerado é $\frac{\pi a^2 b^2}{3c}$.'
    - 'Prove que esse volume é menor que o gerado pela rotação em torno do cateto $a$.'
    - 'Para $a = 6$ e $b = 8$, calcule a razão entre o volume em torno da hipotenusa e o volume em torno do cateto de 6.'
    espaco: 62
    resolucao: |
      a) Dois cones de raio $\tfrac{ab}{c}$ (altura relativa à hipotenusa) e alturas somando $c$: $\tfrac{\pi}{3} \cdot \tfrac{a^2b^2}{c^2} \cdot c$.
      b) Em torno de $a$: $\tfrac{\pi b^2 a}{3}$. A razão é $\tfrac{a^2b^2/c}{ab^2} = \tfrac{a}{c} < 1$.
      c) $\tfrac{a}{c} = \tfrac{6}{10} = \tfrac{3}{5}$.
    resposta: 'c) $\frac{3}{5}$'

  - estilo: Unicamp
    enunciado: 'O teorema de Pappus diz que o volume gerado pela rotação de uma região plana de área $A$ em torno de um eixo que não a atravessa é $2\pi \bar{x} A$, sendo $\bar{x}$ a distância do centro de gravidade da região ao eixo.'
    itens:
    - 'Verifique o teorema para um retângulo de lados $r$ e $h$ com o lado $h$ sobre o eixo.'
    - 'Verifique o teorema para um triângulo retângulo de catetos $h$ (sobre o eixo) e $r$, sabendo que o centro de gravidade dista $\frac{r}{3}$ do eixo.'
    - 'Calcule o volume do sólido em forma de boia gerado por um círculo de raio 1 cujo centro está a 3 do eixo.'
    espaco: 62
    resolucao: |
      a) $\bar{x} = \tfrac{r}{2}$, $A = rh$: $2\pi \cdot \tfrac{r}{2} \cdot rh = \pi r^2 h$, o volume do cilindro.
      b) $2\pi \cdot \tfrac{r}{3} \cdot \tfrac{rh}{2} = \tfrac{\pi r^2 h}{3}$, o volume do cone.
      c) $2\pi \cdot 3 \cdot \pi \cdot 1^2 = 6\pi^2$.
    resposta: 'c) $6\pi^2$'

  - estilo: Fuvest
    enunciado: |
      Um quadrado de lado 2 gira em torno de uma reta paralela a um de seus lados, fora dele, a uma distância 2 do lado mais próximo. O sólido gerado tem o mesmo volume de um cilindro de altura 2 e raio
    opcoes: ['$2$', '$4$', '$\sqrt{6}$', '$2\sqrt{3}$', '$3$']
    correta: D
    espaco: 22
    resolucao: |
      Raios 2 e 4: $\pi(16 - 4) \cdot 2 = 24\pi$. $\pi r^2 \cdot 2 = 24\pi$: $r = 2\sqrt{3}$.
    resposta: 'D'

  - estilo: Unesp
    texto: |
      Um rolo de papel tem a forma do sólido gerado pela rotação de um retângulo: raio interno (do tubo de papelão) de 2 cm, raio externo de 6 cm e largura de 10 cm. A folha de papel tem 0,01 cm de espessura.
    enunciado: ''
    itens:
    - 'Calcule o volume de papel do rolo, com $\pi \approx 3{,}14$.'
    - 'Estime o comprimento da folha desenrolada, em metros.'
    - 'Depois de usada metade da folha, qual o raio externo do rolo?'
    espaco: 62
    resolucao: |
      a) $\pi(36 - 4) \cdot 10 = 320\pi \approx 1004{,}8$ cm³.
      b) A folha é um bloco de $10 \times 0{,}01 \times L$: $L = \tfrac{1004{,}8}{0{,}1} \approx 10\,048$ cm $\approx 100$ m.
      c) Sobra $160\pi$: $\pi(R^2 - 4) \cdot 10 = 160\pi$, $R^2 = 20$, $R = 2\sqrt{5} \approx 4{,}47$ cm.
    resposta: 'a) $\approx 1004{,}8$ cm³; b) $\approx 100$ m; c) $2\sqrt{5} \approx 4{,}47$ cm'

  - estilo: Fuvest
    enunciado: 'Considere superfícies geradas pela rotação de segmentos em torno de um eixo $e$, num plano que contém $e$.'
    itens:
    - 'Prove que um segmento de medida $\ell$, paralelo a $e$ e a uma distância $r$ dele, gera uma superfície de área $2\pi r\ell$.'
    - 'Prove que um segmento perpendicular a $e$, com extremidades a distâncias $d_1 < d_2$ de $e$, gera uma coroa de área $\pi(d_2^2 - d_1^2)$.'
    - 'Calcule a área total da superfície do sólido gerado por um retângulo de largura 2 e altura 5, com o lado de 5 paralelo a $e$ e a 3 dele.'
    espaco: 62
    resolucao: |
      a) É a superfície lateral de um cilindro de raio $r$ e altura $\ell$; planificada, é um retângulo de lados $2\pi r$ e $\ell$.
      b) O ponto mais próximo descreve um círculo de raio $d_1$, e o mais distante, de raio $d_2$: a região entre eles é a coroa.
      c) Externa $2\pi \cdot 5 \cdot 5 = 50\pi$; interna $2\pi \cdot 3 \cdot 5 = 30\pi$; duas coroas de $\pi(25 - 9) = 16\pi$. Total $112\pi$.
    resposta: 'c) $112\pi$'
