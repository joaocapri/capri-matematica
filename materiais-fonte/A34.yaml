# Fonte das listas em PDF da aula A34 — Introdução aos Logaritmos
aula: A34

fixacao:
  intro: Resolva na ordem — do aquecimento ao desafio. $\log_a b=x\Leftrightarrow a^x=b$, com $b>0$, $a>0$ e $a\neq1$. O logaritmo é o expoente.
  secoes:
    - nome: Aquecimento
      questoes:
        - enunciado: Calcule.
          itens:
            - $\log_2 8$
            - $\log_3 81$
            - $\log_5 1$
            - $\log 1000$
          resolucao: |
            Pergunte "a base elevada a quanto dá o número?".
            (a) $2^3=8$: $3$. (b) $3^4=81$: $4$. (c) $5^0=1$: $0$. (d) Base $10$: $10^3=1000$, então $3$.
          resposta: '(a) $3$ \quad (b) $4$ \quad (c) $0$ \quad (d) $3$'

        - enunciado: Calcule.
          itens:
            - $\log_2\tfrac14$
            - $\log_{1/2}8$
            - $\log_4 2$
            - $\log_9 27$
          resolucao: |
            (a) $2^{-2}=\tfrac14$: $-2$. (b) $\left(\tfrac12\right)^{-3}=8$: $-3$.
            (c) $4^{1/2}=2$: $\tfrac12$. (d) $9^x=27\Rightarrow 3^{2x}=3^3\Rightarrow x=\tfrac32$.
          resposta: '(a) $-2$ \quad (b) $-3$ \quad (c) $\tfrac12$ \quad (d) $\tfrac32$'

        - enunciado: Escreva na forma de logaritmo.
          itens:
            - $2^5=32$
            - $10^{-2}=0{,}01$
            - $7^0=1$
          resolucao: |
            (a) $\log_2 32=5$. (b) $\log 0{,}01=-2$. (c) $\log_7 1=0$.
          resposta: '(a) $\log_2 32=5$ \quad (b) $\log 0{,}01=-2$ \quad (c) $\log_7 1=0$'

        - enunciado: Calcule usando as consequências da definição.
          itens:
            - $\log_6 6$
            - $3^{\log_3 7}$
            - $\log_5 5^4$
          resolucao: |
            (a) $\log_a a=1$. (b) $a^{\log_a b}=b$: $7$. (c) $\log_a a^n=n$: $4$.
          resposta: '(a) $1$ \quad (b) $7$ \quad (c) $4$'

        - enunciado: Resolva.
          itens:
            - $\log_2 x=5$
            - $\log_x 49=2$
          resolucao: |
            (a) $x=2^5=32$. (b) $x^2=49$ com $x>0$ e $x\neq1$: $x=7$.
          resposta: '(a) $32$ \quad (b) $7$'

        - enunciado: Por que $\log_2(-4)$ e $\log_1 5$ não existem?
          resolucao: |
            $2^x$ é sempre positivo, então nunca dá $-4$.
            $1^x=1$ para todo $x$, então nunca dá $5$. Por isso a base não pode ser $1$.
          resposta: 'logaritmando negativo; base igual a $1$'

        - enunciado: Calcule $\log_3 9+\log_2 16-\log 100$.
          resolucao: |
            $2+4-2=4$.
          resposta: '$4$'

    - nome: Treino
      questoes:
        - enunciado: Resolva $\log_3(x-1)=2$.
          resolucao: |
            $x-1=3^2=9\Rightarrow x=10$ (e $x-1>0$, válido).
          resposta: '$x=10$'

        - enunciado: Resolva $\log_x 8=\tfrac32$.
          resolucao: |
            $x^{3/2}=8\Rightarrow x=8^{2/3}=4$.
          resposta: '$x=4$'

        - enunciado: Determine as condições de existência de $\log_{x-2}(10-x)$.
          resolucao: |
            Logaritmando: $10-x>0\Rightarrow x<10$. Base: $x-2>0$ e $x-2\neq1$, isto é, $x>2$ e $x\neq3$.
          resposta: '$2<x<10$ e $x\neq3$'

        - enunciado: Calcule $\log_{\sqrt2}8$.
          resolucao: |
            $(\sqrt2)^x=8\Rightarrow 2^{x/2}=2^3\Rightarrow x=6$.
          resposta: '$6$'

        - enunciado: Calcule $9^{\log_3 2}$.
          resolucao: |
            $9^{\log_3 2}=\left(3^{\log_3 2}\right)^2=2^2=4$.
          resposta: '$4$'

        - enunciado: Calcule $\log_2(\log_3 81)$.
          resolucao: |
            $\log_3 81=4$ e $\log_2 4=2$.
          resposta: '$2$'

        - enunciado: Se $\log_2 x=-3$, quanto vale $x$? E $\log_{x}64$?
          resolucao: |
            $x=2^{-3}=\tfrac18$. \ $\left(\tfrac18\right)^y=64\Rightarrow 2^{-3y}=2^6\Rightarrow y=-2$.
          resposta: '$x=\tfrac18$; \ $\log_{1/8}64=-2$'

        - enunciado: O pH de uma solução é $\text{pH}=-\log[\text{H}^+]$. Calcule o pH de soluções com $[\text{H}^+]=10^{-3}$ e $[\text{H}^+]=10^{-8}$ mol/L e diga qual é ácida.
          resolucao: |
            $\text{pH}=3$ e $\text{pH}=8$. A primeira é ácida (pH menor que $7$).
          resposta: 'pH $3$ (ácida) e pH $8$'

    - nome: Desafio
      questoes:
        - enunciado: Sabendo que $\log_3 x=2$ e $\log_x y=3$, determine $x$ e $y$.
          resolucao: |
            $x=3^2=9$ e $y=9^3=729$.
          resposta: '$x=9$; \ $y=729$'

        - enunciado: Determine o domínio de $f(x)=\log_x(5-x)$.
          resolucao: |
            $5-x>0\Rightarrow x<5$; base: $x>0$ e $x\neq1$.
          resposta: '$]0,\,1[\ \cup\ ]1,\,5[$'

        - enunciado: Calcule $10^{2+\log 3}$.
          resolucao: |
            $10^2\cdot10^{\log3}=100\cdot3=300$.
          resposta: '$300$'

        - enunciado: Resolva $\log_2(x^2-1)=3$.
          resolucao: |
            $x^2-1=8\Rightarrow x=\pm3$; ambos deixam $x^2-1=8>0$.
          resposta: '$\{-3,\,3\}$'

        - enunciado: O nível sonoro, em decibéis, é $N=10\log\dfrac I{I_0}$. Qual é o nível de um som com $I=10^6\,I_0$? E se a intensidade for multiplicada por $100$?
          resolucao: |
            $N=10\cdot6=60$ dB. Com $I=10^8\,I_0$: $N=80$ dB (multiplicar por $100$ soma $20$ dB).
          resposta: '$60$ dB; \ $80$ dB'

vestibular:
  intro: Questões autorais no estilo dos principais vestibulares. Assinale uma única alternativa.
  questoes:
    - enunciado: O valor de $\log_2 32+\log_3\tfrac1{27}$ é
      opcoes: ['$-2$', '$8$', '$2$', '$3$', '$-8$']
      correta: C
      resolucao: |
        $5+(-3)=2$.

    - enunciado: O valor de $\log 0{,}01$ é
      opcoes: ['$-2$', '$2$', '$-1$', '$0{,}01$', '$-0{,}2$']
      correta: A
      resolucao: |
        $0{,}01=10^{-2}$.

    - enunciado: O valor de $\log_{\sqrt2}8$ é
      opcoes: ['$3$', '$4$', '$\dfrac32$', '$4\sqrt2$', '$6$']
      correta: E
      resolucao: |
        $(\sqrt2)^x=2^{x/2}=2^3\Rightarrow x=6$.

    - enunciado: O valor de $2^{\log_2 5}+\log_5 25$ é
      opcoes: ['$5$', '$7$', '$10$', '$12$', '$27$']
      correta: B
      resolucao: |
        $2^{\log_2 5}=5$ e $\log_5 25=2$. Soma: $7$.

    - enunciado: A expressão $\log_x(5-x)$ está definida se, e somente se,
      opcoes: ['$x<5$', '$0<x<5$', '$x>0$ e $x\neq1$', '$0<x<5$ e $x\neq1$', '$1<x<5$']
      correta: D
      resolucao: |
        Logaritmando positivo ($x<5$) e base positiva e diferente de $1$.

    - enunciado: O valor de $\log_8 4$ é
      opcoes: ['$\dfrac12$', '$\dfrac23$', '$\dfrac32$', '$2$', '$\dfrac34$']
      correta: B
      resolucao: |
        $8^x=4\Rightarrow 2^{3x}=2^2\Rightarrow x=\tfrac23$.

    - enunciado: Se $\log_x 81=4$, então $x$ vale
      opcoes: ['$\dfrac{81}4$', '$9$', '$3$', '$-3$', '$\pm3$']
      correta: C
      resolucao: |
        $x^4=81$, com $x>0$ e $x\neq1$: $x=3$.

    - enunciado: O valor de $10^{2+\log 3}$ é
      opcoes: ['$5$', '$30$', '$103$', '$1000$', '$300$']
      correta: E
      resolucao: |
        $10^2\cdot10^{\log 3}=100\cdot3=300$.

    - enunciado: O valor de $\log_2(\log_3 81)$ é
      opcoes: ['$2$', '$4$', '$1$', '$3$', '$\dfrac12$']
      correta: A
      resolucao: |
        $\log_3 81=4$ e $\log_2 4=2$.

    - enunciado: O pH de uma solução é $\text{pH}=-\log[\text{H}^+]$. Uma solução com $[\text{H}^+]=10^{-5}$ mol/L tem pH
      opcoes: ['$-5$', '$0{,}5$', '$10$', '$5$', '$7$']
      correta: D
      resolucao: |
        $\text{pH}=-(-5)=5$: solução ácida.

    - enunciado: O valor de $\log_{1/3}9$ é
      opcoes: ['$3$', '$2$', '$\dfrac12$', '$-2$', '$-3$']
      correta: D
      resolucao: |
        $\left(\tfrac13\right)^x=9\Rightarrow 3^{-x}=3^2\Rightarrow x=-2$.

    - enunciado: Se $\log_2 x=-3$, então $x$ vale
      opcoes: ['$\dfrac18$', '$-8$', '$-6$', '$8$', '$-\dfrac18$']
      correta: A
      resolucao: |
        $x=2^{-3}=\tfrac18$. Um logaritmo negativo não significa que o número seja negativo.

    - enunciado: O valor de $\log_{25}5$ é
      opcoes: ['$2$', '$5$', '$\dfrac12$', '$-\dfrac12$', '$\dfrac15$']
      correta: C
      resolucao: |
        $25^{1/2}=5$.

    - enunciado: A quantidade de números inteiros $x$ para os quais $\log(x-1)$ e $\log(6-x)$ estão ambos definidos é
      opcoes: ['$6$', '$3$', '$5$', '$2$', '$4$']
      correta: E
      resolucao: |
        $x>1$ e $x<6$: inteiros $2,3,4,5$.

    - enunciado: O nível sonoro é $N=10\log\dfrac I{I_0}$ decibéis. Um som com $I=10^6\,I_0$ tem nível de
      opcoes: ['$6$ dB', '$60$ dB', '$16$ dB', '$600$ dB', '$10^6$ dB']
      correta: B
      resolucao: |
        $N=10\cdot\log10^6=10\cdot6=60$ dB.

    - enunciado: Se $a=\log_2 3$, então $4^a$ vale
      opcoes: ['$6$', '$12$', '$3$', '$8$', '$9$']
      correta: E
      resolucao: |
        $2^a=3$, então $4^a=(2^a)^2=9$.

    - enunciado: Sabendo que $\log_3 x=2$ e $\log_x y=3$, o valor de $y$ é
      opcoes: ['$729$', '$27$', '$81$', '$243$', '$18$']
      correta: A
      resolucao: |
        $x=9$ e $y=9^3=729$.

    - enunciado: O valor de $\log1+\log10+\log100$ é
      opcoes: ['$0$', '$1$', '$2$', '$3$', '$111$']
      correta: D
      resolucao: |
        $0+1+2=3$.

    - enunciado: O valor de $9^{\log_3 2}$ é
      opcoes: ['$2$', '$4$', '$6$', '$8$', '$18$']
      correta: B
      resolucao: |
        $9^{\log_3 2}=\left(3^{\log_3 2}\right)^2=2^2=4$.

    - enunciado: O valor de $\log_{0{,}5}0{,}125$ é
      opcoes: ['$\dfrac14$', '$-3$', '$3$', '$4$', '$-\dfrac13$']
      correta: C
      resolucao: |
        $0{,}5^3=0{,}125$.
