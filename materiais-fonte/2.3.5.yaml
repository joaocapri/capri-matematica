# Fonte das listas em PDF da aula 2.3.5 — Máximos e mínimos
aula: '2.3.5'

fixacao:
  intro: Resolva na ordem — do fácil ao difícil. Roteiro — escreva a grandeza como função quadrática de uma variável, ache $x_V$ e depois calcule o valor ótimo.
  secoes:
    - nome: Aquecimento
      questoes:
        - enunciado: O lucro de uma empresa é $L(x)=-x^2+12x-20$ (em mil reais), para $x$ centenas de unidades. Qual é o lucro máximo e para qual $x$ ele ocorre?
          resolucao: |
            $x_V=6$ e $L(6)=-36+72-20=16$.
          resposta: 'lucro máximo $16$ mil reais, com $x=6$'

        - enunciado: O custo de produção é $C(x)=x^2-10x+40$. Qual é o custo mínimo?
          resolucao: |
            $x_V=5$ e $C(5)=25-50+40=15$.
          resposta: '$15$, para $x=5$'

        - enunciado: A altura de uma bola é $h(t)=-5t^2+30t$, em metros, com $t$ em segundos. Qual é a altura máxima e em que instante ocorre?
          resolucao: |
            $t_V=3$ s e $h(3)=-45+90=45$ m.
          resposta: '$45$ m, em $t=3$ s'

        - enunciado: Dois números somam $20$. Quais são eles se o produto é o maior possível? Qual é esse produto?
          resolucao: |
            $P(x)=x(20-x)=-x^2+20x$, máximo em $x_V=10$. Os números são $10$ e $10$, com produto $100$.
          resposta: '$10$ e $10$; produto $100$'

        - enunciado: Entre os retângulos de perímetro $40$ cm, qual tem a maior área?
          resolucao: |
            Lados $x$ e $20-x$: $A(x)=x(20-x)$, máxima em $x=10$. É o quadrado de lado $10$, com área $100$ cm².
          resposta: 'o quadrado de lado $10$ cm; $100$ cm²'

        - enunciado: A receita de uma loja é $R(p)=p(100-p)$, em que $p$ é o preço. Qual preço dá a maior receita? Qual é essa receita?
          resolucao: |
            $R(p)=-p^2+100p$, máxima em $p_V=50$, com $R(50)=2500$.
          resposta: 'preço $50$; receita $2500$'

        - enunciado: Determine o valor mínimo de $f(x)=x^2-6x$ e onde ele ocorre.
          resolucao: |
            $x_V=3$ e $f(3)=9-18=-9$.
          resposta: '$-9$, em $x=3$'

    - nome: Treino
      questoes:
        - enunciado: Com $60$ m de tela, um fazendeiro vai cercar um terreno retangular encostado em um muro, de modo que só $3$ lados precisam de tela. Quais dimensões dão a maior área?
          resolucao: |
            Lados perpendiculares ao muro: $x$ cada; lado paralelo: $60-2x$.
            $A(x)=x(60-2x)=-2x^2+60x$, máxima em $x_V=15$. Dimensões $15$ m e $30$ m; área $450$ m².
          resposta: '$15$ m por $30$ m; $450$ m²'

        - enunciado: Dois números têm diferença $8$. Quais são eles se o produto é o menor possível?
          resolucao: |
            $P(x)=x(x-8)=x^2-8x$, mínimo em $x_V=4$. Os números são $4$ e $-4$, com produto $-16$.
          resposta: '$4$ e $-4$; produto $-16$'

        - enunciado: Com o ingresso a R\$\,20{,}00, um teatro recebe $300$ pessoas. Cada R\$\,1{,}00 de aumento afasta $10$ pessoas. Qual preço dá a maior arrecadação?
          resolucao: |
            Com $x$ reais de aumento: $R(x)=(20+x)(300-10x)=-10x^2+100x+6000$.
            $x_V=5$: preço R\$\,25{,}00, $250$ pessoas, arrecadação R\$\,6\,250{,}00.
          resposta: 'R\$\,25{,}00 (arrecadação R\$\,6\,250{,}00)'

        - enunciado: O lucro de uma fábrica é $L(x)=-2x^2+120x-1000$ reais. Determine o lucro máximo.
          resolucao: |
            $x_V=\tfrac{-120}{-4}=30$ e $L(30)=-1800+3600-1000=800$.
          resposta: 'R\$\,800{,}00, com $x=30$'

        - enunciado: Dois números positivos somam $16$. Qual é o maior valor possível do produto de um deles pelo triplo do outro?
          resolucao: |
            $P(x)=3x(16-x)=-3x^2+48x$, máximo em $x_V=8$: $P(8)=3\cdot8\cdot8=192$.
          resposta: '$192$'

        - enunciado: A altura de um projétil é $h(t)=-4{,}9t^2+19{,}6t+2$, em metros. Qual é a altura máxima?
          resolucao: |
            $t_V=\tfrac{-19{,}6}{-9{,}8}=2$ s. Então $h(2)=-19{,}6+39{,}2+2=21{,}6$ m.
          resposta: '$21{,}6$ m'

        - enunciado: Dois números somam $10$. Qual é o menor valor possível da soma de seus quadrados?
          resolucao: |
            $S(x)=x^2+(10-x)^2=2x^2-20x+100$, mínimo em $x_V=5$: $S(5)=50$.
          resposta: '$50$'

        - enunciado: Um fazendeiro tem $120$ m de tela para cercar um terreno retangular e dividi-lo em dois currais iguais com uma cerca interna paralela a um dos lados. Qual é a maior área total possível?
          resolucao: |
            Três segmentos de comprimento $x$ e dois de comprimento $y$: $3x+2y=120\Rightarrow y=\tfrac{120-3x}2$.
            $A(x)=x\cdot\tfrac{120-3x}2=-\tfrac32x^2+60x$, máxima em $x_V=20$. Então $y=30$ e $A=600$ m².
          resposta: '$600$ m² ($20$ m por $30$ m)'

    - nome: Desafio
      questoes:
        - enunciado: Um retângulo tem dois lados sobre os catetos de um triângulo retângulo de catetos $6$ e $8$ e o vértice oposto sobre a hipotenusa. Qual é a maior área possível desse retângulo?
          resolucao: |
            Com os catetos sobre os eixos (de $0$ a $6$ e de $0$ a $8$), a hipotenusa é $y=8-\tfrac43x$.
            $A(x)=x\left(8-\tfrac43x\right)=-\tfrac43x^2+8x$, máxima em $x_V=3$, com $y=4$ e $A=12$.
          resposta: '$12$ (retângulo $3\times4$)'

        - enunciado: Uma loja vende $100$ camisetas por mês a R\$\,40{,}00. Para cada R\$\,2{,}00 de desconto, vende $10$ camisetas a mais. Qual preço maximiza a receita?
          resolucao: |
            Com $n$ descontos: $R(n)=(40-2n)(100+10n)=-20n^2+200n+4000$.
            $n_V=5$: preço R\$\,30{,}00, $150$ camisetas, receita R\$\,4\,500{,}00.
          resposta: 'R\$\,30{,}00 (receita R\$\,4\,500{,}00)'

        - enunciado: Determine o valor mínimo de $f(x)=(x-1)(x-5)$ sem desenvolver o produto.
          resolucao: |
            O vértice fica no meio das raízes: $x_V=3$. Então $f(3)=(2)(-2)=-4$.
          resposta: '$-4$'

        - enunciado: Os números reais $x$ e $y$ satisfazem $x+2y=20$. Qual é o maior valor possível de $x\cdot y$?
          resolucao: |
            $x=20-2y$ e $P(y)=(20-2y)y=-2y^2+20y$, máximo em $y_V=5$. Então $x=10$ e $P=50$.
          resposta: '$50$'

        - enunciado: Determine $k$ para que o valor máximo de $f(x)=-x^2+4x+k$ seja $10$.
          resolucao: |
            $x_V=2$ e $f(2)=-4+8+k=4+k=10\Rightarrow k=6$.
          resposta: '$k=6$'

vestibular:
  intro: Questões autorais no estilo dos principais vestibulares. Assinale uma única alternativa.
  questoes:
    - enunciado: A altura de uma bola é $h(t)=-5t^2+20t$, em metros, com $t$ em segundos. A altura máxima atingida é
      opcoes: ['$10$ m', '$20$ m', '$40$ m', '$80$ m', '$100$ m']
      correta: B
      resolucao: |
        $t_V=2$ e $h(2)=-20+40=20$ m.

    - enunciado: O lucro de uma empresa é $L(x)=-x^2+30x-125$ (em mil reais). O lucro máximo é
      opcoes: ['$100$ mil reais', '$125$ mil reais', '$150$ mil reais', '$200$ mil reais', '$225$ mil reais']
      correta: A
      resolucao: |
        $x_V=15$ e $L(15)=-225+450-125=100$. (A alternativa E esquece o $-125$.)

    - enunciado: Dois números somam $30$. O maior valor possível do produto entre eles é
      opcoes: ['$100$', '$150$', '$200$', '$225$', '$900$']
      correta: D
      resolucao: |
        $x(30-x)$ é máximo em $x=15$: $15\cdot15=225$.

    - enunciado: Entre os retângulos de perímetro $48$ cm, a maior área possível é
      opcoes: ['$96\ \text{cm}^2$', '$128\ \text{cm}^2$', '$144\ \text{cm}^2$', '$192\ \text{cm}^2$', '$576\ \text{cm}^2$']
      correta: C
      resolucao: |
        $A(x)=x(24-x)$, máxima em $x=12$: quadrado de área $144\ \text{cm}^2$.

    - enunciado: Com $80$ m de tela, deseja-se cercar um terreno retangular encostado em um muro, usando tela em apenas $3$ lados. A maior área possível é
      opcoes: ['$400\ \text{m}^2$', '$600\ \text{m}^2$', '$640\ \text{m}^2$', '$750\ \text{m}^2$', '$800\ \text{m}^2$']
      correta: E
      resolucao: |
        $A(x)=x(80-2x)$, máxima em $x=20$: $20\cdot40=800\ \text{m}^2$.

    - enunciado: Com ingresso a R\$\,30{,}00, um evento atrai $500$ pessoas; cada R\$\,1{,}00 de aumento afasta $10$ pessoas. O preço que maximiza a arrecadação é
      opcoes: ['R\$\,30{,}00', 'R\$\,32{,}00', 'R\$\,35{,}00', 'R\$\,40{,}00', 'R\$\,50{,}00']
      correta: D
      resolucao: |
        $R(x)=(30+x)(500-10x)=-10x^2+200x+15\,000$, máxima em $x=10$: preço R\$\,40{,}00.

    - enunciado: A altura de um projétil é $h(t)=-5t^2+50t$, em metros. A altura máxima ocorre no instante
      opcoes: ['$2{,}5$ s', '$5$ s', '$10$ s', '$25$ s', '$125$ s']
      correta: B
      resolucao: |
        $t_V=\tfrac{-50}{-10}=5$ s. A alternativa C é o instante em que ele volta ao chão.

    - enunciado: A receita de uma empresa é $R(q)=-2q^2+400q$. A quantidade $q$ que maximiza a receita é
      opcoes: ['$100$', '$150$', '$200$', '$300$', '$400$']
      correta: A
      resolucao: |
        $q_V=\tfrac{-400}{-4}=100$.

    - enunciado: O valor mínimo de $f(x)=x^2-8x+20$ é
      opcoes: ['$0$', '$1$', '$2$', '$3$', '$4$']
      correta: E
      resolucao: |
        $x_V=4$ e $f(4)=16-32+20=4$.

    - enunciado: Dois números têm diferença $10$. O menor valor possível do produto entre eles é
      opcoes: ['$-100$', '$-50$', '$-25$', '$0$', '$25$']
      correta: C
      resolucao: |
        $x(x-10)$ é mínimo em $x=5$: $5\cdot(-5)=-25$.

    - enunciado: Uma janela retangular tem perímetro de $6$ m. Sua maior área possível é
      opcoes: ['$1{,}5\ \text{m}^2$', '$2{,}25\ \text{m}^2$', '$3\ \text{m}^2$', '$4{,}5\ \text{m}^2$', '$9\ \text{m}^2$']
      correta: B
      resolucao: |
        $A(x)=x(3-x)$, máxima em $x=1{,}5$: $1{,}5^2=2{,}25\ \text{m}^2$.

    - enunciado: O custo por unidade de um produto é $C(x)=x^2-40x+500$ reais, em que $x$ é o número de unidades produzidas. O menor custo por unidade possível é
      opcoes: ['R\$\,20{,}00', 'R\$\,40{,}00', 'R\$\,60{,}00', 'R\$\,80{,}00', 'R\$\,100{,}00']
      correta: E
      resolucao: |
        $x_V=20$ e $C(20)=400-800+500=100$. (O $20$ é a quantidade, não o custo.)

    - enunciado: Um retângulo tem dois lados sobre os catetos de um triângulo retângulo de catetos $4$ e $6$ e um vértice sobre a hipotenusa. Sua maior área possível é
      opcoes: ['$3$', '$4$', '$5$', '$6$', '$12$']
      correta: D
      resolucao: |
        Hipotenusa: $y=6-\tfrac32x$. $A(x)=x\left(6-\tfrac32x\right)$, máxima em $x=2$, com $y=3$ e $A=6$.

    - enunciado: Uma loja vende $200$ unidades por mês a R\$\,50{,}00; para cada R\$\,1{,}00 de desconto, vende $10$ unidades a mais. O preço que maximiza a receita é
      opcoes: ['R\$\,35{,}00', 'R\$\,38{,}00', 'R\$\,40{,}00', 'R\$\,45{,}00', 'R\$\,50{,}00']
      correta: A
      resolucao: |
        $R(n)=(50-n)(200+10n)=-10n^2+300n+10\,000$, máxima em $n=15$: preço R\$\,35{,}00.

    - enunciado: O valor máximo de $f(x)=-2x^2+8x+k$ é $11$. Então $k$ vale
      opcoes: ['$1$', '$2$', '$3$', '$5$', '$11$']
      correta: C
      resolucao: |
        $x_V=2$ e $f(2)=-8+16+k=8+k=11\Rightarrow k=3$.

    - enunciado: Dois números somam $8$. O menor valor possível da soma de seus quadrados é
      opcoes: ['$8$', '$16$', '$24$', '$28$', '$32$']
      correta: E
      resolucao: |
        $x^2+(8-x)^2=2x^2-16x+64$, mínima em $x=4$: $16+16=32$.

    - enunciado: Os números reais positivos $x$ e $y$ satisfazem $x+3y=24$. O maior valor possível de $xy$ é
      opcoes: ['$48$', '$54$', '$64$', '$96$', '$144$']
      correta: A
      resolucao: |
        $x=24-3y$ e $xy=24y-3y^2$, máximo em $y=4$. Então $x=12$ e $xy=48$.

    - enunciado: A altura de uma bola é $h(t)=-5t^2+30t+1{,}5$, em metros. A altura máxima é
      opcoes: ['$31{,}5$ m', '$45$ m', '$45{,}5$ m', '$46{,}5$ m', '$91{,}5$ m']
      correta: D
      resolucao: |
        $t_V=3$ e $h(3)=-45+90+1{,}5=46{,}5$ m.

    - enunciado: Com $240$ m de cerca, quer-se fazer um terreno retangular dividido em dois currais iguais por uma cerca interna paralela a um dos lados. A maior área total possível é
      opcoes: ['$1\,200\ \text{m}^2$', '$1\,800\ \text{m}^2$', '$2\,400\ \text{m}^2$', '$3\,600\ \text{m}^2$', '$4\,800\ \text{m}^2$']
      correta: C
      resolucao: |
        $3x+2y=240$ e $A=x\cdot\tfrac{240-3x}2$, máxima em $x=40$. Então $y=60$ e $A=2\,400\ \text{m}^2$.

    - enunciado: O valor mínimo da função $f(x)=(x-2)(x-8)$ é
      opcoes: ['$-16$', '$-9$', '$-5$', '$0$', '$16$']
      correta: B
      resolucao: |
        $x_V=\tfrac{2+8}2=5$ e $f(5)=3\cdot(-3)=-9$.
