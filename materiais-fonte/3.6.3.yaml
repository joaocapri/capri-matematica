# Aula 3.6.3 — Sistemas lineares: escalonamento
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: operações elementares; escalonar e resolver de baixo para cima; 0 = 0 (SPI) e 0 = k (SI);
# solução geral de um SPI; problemas que levam a sistemas escalonáveis. Discussão completa com parâmetro: 3.6.4.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Marque V se a operação nunca muda as soluções de um sistema e F se ela pode mudar.'
      afirmacoes:
      - 'Trocar a ordem de duas equações.'
      - 'Multiplicar uma equação por $0$.'
      - 'Substituir uma equação pela soma dela com o dobro de outra equação.'
      - 'Somar 1 a todos os coeficientes de uma equação.'
      justificar: true
      espaco: 18
      resolucao: |
        (V) As equações continuam as mesmas. (F) A equação vira $0 = 0$ e a informação dela se perde.
        (V) É a operação básica do escalonamento. (F) Isso troca a equação por outra, sem relação com a original.
      resposta: V, F, V, F
    - enunciado: 'Os sistemas já estão escalonados. Resolva-os de baixo para cima.'
      itens:
      - '$\begin{cases} x + 2y - z = 3 \\ y + z = 5 \\ 2z = 6 \end{cases}$'
      - '$\begin{cases} x - y + 2z = 7 \\ 3y - z = 1 \\ -2z = -4 \end{cases}$'
      espaco_item: 20
      resolucao: |
        (a) $z = 3$; $y = 5 - 3 = 2$; $x = 3 - 4 + 3 = 2$. Solução $(2, 2, 3)$.
        (b) $z = 2$; $3y = 3$, $y = 1$; $x = 7 + 1 - 4 = 4$. Solução $(4, 1, 2)$.
      resposta: '(a) $(2, 2, 3)$ (b) $(4, 1, 2)$'
    - enunciado: 'Escalone o sistema $\begin{cases} x + y + z = 6 \\ 2x + 3y + z = 11 \\ x + 2y + 3z = 14 \end{cases}$, completando.'
      itens:
      - '$L_2 - 2L_1$: $\ y - z = {{-1}}$'
      - '$L_3 - L_1$: $\ y + {{2}}z = {{8}}$'
      - 'Subtraindo as duas novas equações: ${{3}}z = 9$, logo $z = {{3}}$, $y = {{2}}$ e $x = {{1}}$.'
      resolucao: |
        $L_2 - 2L_1$: $(2x + 3y + z) - (2x + 2y + 2z) = 11 - 12$, isto é, $y - z = -1$. $L_3 - L_1$: $y + 2z = 8$.
        $(y + 2z) - (y - z) = 8 - (-1)$: $3z = 9$, $z = 3$. Então $y = 2$ e $x = 6 - 2 - 3 = 1$.
      resposta: '$-1$; $2$ e $8$; $3z = 9$, $(1, 2, 3)$'
    - enunciado: 'Ao escalonar sistemas $3 \times 3$, as duas primeiras equações ficaram começando em $x$ e em $y$, sem problemas. Complete o quadro com a classificação, conforme a última equação obtida.'
      tabela:
        cabecalho: ['Última equação', 'Classificação']
        linhas:
        - ['$0z = 0$', '{{SPI}}']
        - ['$0z = 4$', '{{SI}}']
        - ['$5z = 10$', '{{SPD}}']
        - ['$0z = -1$', '{{SI}}']
      espaco: 18
      resolucao: |
        $0z = 0$ vale para todo $z$: a equação some e sobram duas equações com três incógnitas (SPI).
        $0z = k$ com $k \neq 0$ nunca vale (SI). $5z = 10$ dá $z = 2$, e as de cima dão $y$ e $x$ únicos (SPD).
      resposta: 'SPI, SI, SPD, SI'
    - enunciado: 'Escalone e resolva o sistema $\begin{cases} x + 3y = 5 \\ 2x + 5y = 8 \end{cases}$.'
      espaco: 16
      resolucao: |
        $L_2 - 2L_1$: $-y = -2$, $y = 2$. Então $x = 5 - 6 = -1$. Solução $(-1, 2)$.
      resposta: '$(-1, 2)$'
    - enunciado: 'Associe cada sistema escalonado à sua classificação (uma classificação pode ser usada mais de uma vez).'
      esquerda:
      - 'SPD'
      - 'SPI'
      - 'SI'
      direita:
      - '$x + y + z = 3$, $\ y - z = 1$, $\ 2z = 4$'
      - '$x + y + z = 3$, $\ y - z = 1$, $\ 0z = 0$'
      - '$x + y + z = 3$, $\ y - z = 1$, $\ 0z = 2$'
      - '$x + 2y = 4$, $\ 0y = 0$'
      - '$x - y + z = 1$, $\ y + 2z = 3$'
      resolucao: |
        1º: $z = 2$, depois $y$ e $x$: única. 2º e 4º: a última equação some e sobra incógnita livre. 3º: $0 = 2$ é falso.
        5º: duas equações, três incógnitas e nenhuma contradição: $z$ fica livre.
      resposta: 'De cima para baixo: 1, 2, 3, 2, 2'
    - enunciado: 'Resolva por escalonamento o sistema $\begin{cases} x + y + z = 2 \\ x + 2y + 2z = 3 \\ x + 2y + 3z = 5 \end{cases}$.'
      espaco: 18
      resolucao: |
        $L_2 - L_1$: $y + z = 1$. $L_3 - L_2$: $z = 2$. Então $y = -1$ e $x = 2 + 1 - 2 = 1$. Solução $(1, -1, 2)$.
      resposta: '$(1, -1, 2)$'
  - nome: Nível 2
    questoes:
    - enunciado: 'Resolva por escalonamento $\begin{cases} 2x + y - z = 1 \\ x - y + 2z = 5 \\ 3x + 2y + z = 10 \end{cases}$. Dica: comece trocando a 1ª e a 2ª equações.'
      espaco: 24
      resolucao: |
        Com $L_1$: $x - y + 2z = 5$. $L_2 - 2L_1$: $3y - 5z = -9$. $L_3 - 3L_1$: $5y - 5z = -5$, ou $y - z = -1$.
        De $y = z - 1$: $3z - 3 - 5z = -9$, $z = 3$, $y = 2$ e $x = 5 + 2 - 6 = 1$. Solução $(1, 2, 3)$.
      resposta: '$(1, 2, 3)$'
    - texto: |
        Ao escalonar $\begin{cases} x + y + z = 1 \\ 2x + 2y + 2z = 2 \\ x - y + z = 3 \end{cases}$, Téo fez $L_2 - 2L_1$, obteve $0 = 0$ e escreveu: “apareceu uma linha de zeros, então o sistema é impossível”.
      enunciado: 'Corrija a conclusão de Téo, classifique o sistema e escreva as suas soluções.'
      espaco: 20
      resolucao: |
        $0 = 0$ é sempre verdade: a equação apenas some. Impossível seria $0 = k$, com $k \neq 0$.
        Sobram $x + y + z = 1$ e $x - y + z = 3$. Subtraindo: $2y = -2$, $y = -1$ e $x + z = 2$. SPI, com soluções $(2 - t, -1, t)$.
      resposta: 'SPI; $(2 - t, -1, t)$'
    - enunciado: 'Escalone e classifique.'
      itens:
      - '$\begin{cases} x + 2y - z = 1 \\ 2x + 5y + z = 4 \\ x + 3y + 2z = 3 \end{cases}$'
      - '$\begin{cases} x + 2y - z = 1 \\ 2x + 5y + z = 4 \\ x + 3y + 2z = 5 \end{cases}$'
      espaco_item: 22
      resolucao: |
        (a) $L_2 - 2L_1$: $y + 3z = 2$. $L_3 - L_1$: $y + 3z = 2$. Subtraindo: $0 = 0$. SPI: $y = 2 - 3z$ e $x = 1 - 2y + z = -3 + 7z$.
        (b) As mesmas contas dão $y + 3z = 2$ e $y + 3z = 4$; subtraindo: $0 = 2$. SI.
      resposta: '(a) SPI (b) SI'
    - enunciado: 'Um cofre tem 30 moedas de R\$\,0,10, de R\$\,0,25 e de R\$\,0,50, num total de R\$\,8,20. Há 4 moedas de R\$\,0,10 a mais que de R\$\,0,25. Monte o sistema, escalone e determine quantas moedas há de cada tipo.'
      espaco: 24
      resolucao: |
        $a + b + c = 30$, $10a + 25b + 50c = 820$ (em centavos), ou $2a + 5b + 10c = 164$, e $a - b = 4$.
        Com $a = b + 4$: $2b + c = 26$ e $7b + 10c = 156$. Então $c = 26 - 2b$ e $7b + 260 - 20b = 156$: $b = 8$, $a = 12$ e $c = 10$.
      resposta: '12 de R\$\,0,10, 8 de R\$\,0,25 e 10 de R\$\,0,50'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Se no escalonamento aparece $0 = 0$, o sistema é impossível.'
      - 'Um sistema escalonado com 3 equações e 3 incógnitas, cada uma com uma incógnita a menos que a de cima, é SPD.'
      - 'Um sistema escalonado com 2 equações e 3 incógnitas, sem equação do tipo $0 = k$ ($k \neq 0$), é SPI.'
      - 'No escalonamento, pode-se dividir uma equação por 2.'
      justificar: true
      espaco: 22
      resolucao: |
        (F) $0 = 0$ é sempre verdade e só elimina a equação. (V) A última dá $z$, a do meio dá $y$ e a primeira dá $x$, cada um único.
        (V) Uma incógnita fica livre. (V) Dividir por 2 é multiplicar por $\tfrac{1}{2}$, um número não nulo.
      resposta: F, V, V, V
    - enunciado: 'Resolva o sistema escalonado $\begin{cases} x + y + z + w = 10 \\ y + z + w = 9 \\ z + w = 7 \\ w = 4 \end{cases}$.'
      espaco: 14
      resolucao: |
        $w = 4$; $z = 3$; $y = 9 - 7 = 2$; $x = 10 - 9 = 1$. Solução $(1, 2, 3, 4)$.
      resposta: '$(1, 2, 3, 4)$'
    - enunciado: 'O sistema $\begin{cases} x - y + z = 2 \\ 2x - y + 3z = 7 \end{cases}$ tem duas equações e três incógnitas.'
      itens:
      - 'Escalone e escreva $x$ e $y$ em função de $z$.'
      - 'Dê a solução em que $z = 1$ e a solução em que $x = 1$.'
      espaco_item: 18
      resolucao: |
        (a) $L_2 - 2L_1$: $y + z = 3$, então $y = 3 - z$ e $x = 2 + y - z = 5 - 2z$.
        (b) $z = 1$: $(3, 2, 1)$. $x = 1$: $5 - 2z = 1$, $z = 2$ e $y = 1$: $(1, 1, 2)$.
      resposta: '(a) $x = 5 - 2z$, $y = 3 - z$ (b) $(3, 2, 1)$ e $(1, 1, 2)$'
    - texto: |
        Os preços de três compras numa feira estão no quadro, com $m$, $b$ e $u$ os preços do quilo de maçã, banana e uva.
      tabela:
        cabecalho: ['Compra', 'Total']
        linhas:
        - ['1 kg de cada fruta', 'R\$\,21,00']
        - ['2 kg de maçã e 1 kg de banana', 'R\$\,16,00']
        - ['2 kg de banana e 1 kg de uva', 'R\$\,19,00']
      enunciado: 'Monte o sistema, escalone e determine o preço do quilo de cada fruta.'
      espaco: 22
      resolucao: |
        $m + b + u = 21$, $2m + b = 16$, $2b + u = 19$. $L_2 - 2L_1$: $-b - 2u = -26$, ou $b + 2u = 26$. Com $L_3$: $u = 19 - 2b$, e então $b + 38 - 4b = 26$, $b = 4$.
        $u = 11$ e $m = 6$.
      resposta: 'Maçã R\$\,6,00, banana R\$\,4,00 e uva R\$\,11,00'
  - nome: Nível 3
    questoes:
    - enunciado: 'Considere o sistema $\begin{cases} x + y + z = 1 \\ x + 2y + 3z = 2 \\ 2x + 3y + az = b \end{cases}$.'
      itens:
      - 'Escalone o sistema até a última equação ficar só com $z$.'
      - 'Classifique o sistema conforme os valores de $a$ e $b$.'
      espaco_item: 24
      resolucao: |
        (a) $L_2 - L_1$: $y + 2z = 1$. $L_3 - 2L_1$: $y + (a - 2)z = b - 2$. Subtraindo as duas: $(a - 4)z = b - 3$.
        (b) $a \neq 4$: SPD. $a = 4$ e $b = 3$: $0 = 0$, SPI. $a = 4$ e $b \neq 3$: $0 = b - 3 \neq 0$, SI.
      resposta: '(a) $(a - 4)z = b - 3$ (b) $a \neq 4$: SPD; $a = 4$ e $b = 3$: SPI; $a = 4$ e $b \neq 3$: SI'
    - enunciado: 'Considere o sistema $\begin{cases} x + 2y + 3z = 6 \\ 4x + 5y + 6z = 15 \\ 7x + 8y + 9z = 24 \end{cases}$.'
      itens:
      - 'Escalone e classifique o sistema.'
      - 'Escreva as soluções em função de $z = t$.'
      - 'Mostre que toda solução satisfaz $x + y + z = 3$.'
      espaco_item: 18
      resolucao: |
        (a) $L_2 - 4L_1$: $-3y - 6z = -9$, ou $y + 2z = 3$. $L_3 - 7L_1$: $-6y - 12z = -18$, ou $y + 2z = 3$. Uma delas vira $0 = 0$: SPI.
        (b) $y = 3 - 2t$ e $x = 6 - 2(3 - 2t) - 3t = t$. Soluções $(t, 3 - 2t, t)$.
        (c) $t + (3 - 2t) + t = 3$.
      resposta: '(a) SPI (b) $(t, 3 - 2t, t)$ (c) Ver resolução'
    - enunciado: 'Determine a parábola $y = ax^2 + bx + c$ que passa por $(-1, 8)$, $(1, 2)$ e $(2, 2)$, montando e escalonando um sistema.'
      espaco: 24
      resolucao: |
        $a - b + c = 8$, $a + b + c = 2$, $4a + 2b + c = 2$. $L_2 - L_1$: $2b = -6$, $b = -3$.
        Então $a + c = 5$ e $4a + c = 8$: $a = 1$ e $c = 4$. A parábola é $y = x^2 - 3x + 4$.
      resposta: '$y = x^2 - 3x + 4$'
    - enunciado: 'Uma lanchonete anotou: 1 suco, 1 pão e 1 bolo custam R\$\,12,00; 2 sucos, 1 pão e 3 bolos custam R\$\,25,00; 3 sucos, 2 pães e 4 bolos custam R\$\,36,00. Escalone o sistema e mostre que alguma anotação está errada. Que valor no lugar de R\$\,36,00 tornaria as anotações compatíveis?'
      espaco: 24
      resolucao: |
        $s + p + b = 12$, $2s + p + 3b = 25$, $3s + 2p + 4b = 36$. $L_2 - 2L_1$: $-p + b = 1$. $L_3 - 3L_1$: $-p + b = 0$. Subtraindo: $0 = 1$, SI.
        A 3ª compra é a soma das duas primeiras: deveria custar $12 + 25 = 37$ reais.
      resposta: 'SI; R\$\,37,00'
    - enunciado: 'Escalone o sistema homogêneo $\begin{cases} x + y - z = 0 \\ 2x - y + z = 0 \\ x - 2y + 2z = 0 \end{cases}$, mostre que ele tem infinitas soluções e escreva todas.'
      espaco: 22
      resolucao: |
        $L_2 - 2L_1$: $-3y + 3z = 0$. $L_3 - L_1$: $-3y + 3z = 0$. Uma vira $0 = 0$: SPI.
        $y = z$ e $x = -y + z = 0$. Soluções $(0, t, t)$.
      resposta: '$(0, t, t)$, $t$ real'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Em uma gincana escolar, as provas são de três tipos, A, B e C, e cada tipo vale uma quantidade fixa de pontos. O quadro mostra quantas provas de cada tipo três equipes venceram e quantos pontos cada uma fez. Para descobrir o valor de cada prova, um aluno montou um sistema linear e o resolveu por escalonamento.
    tabela:
      cabecalho: ['Equipe', 'A', 'B', 'C', 'Pontos']
      linhas:
      - ['Azul', '1', '1', '1', '12']
      - ['Verde', '2', '1', '0', '14']
      - ['Amarela', '1', '0', '2', '11']
    enunciado: |
      Uma prova do tipo C vale
    opcoes: ['$2$ pontos.', '$3$ pontos.', '$4$ pontos.', '$5$ pontos.', '$6$ pontos.']
    correta: B
    resolucao: |
      $a + b + c = 12$, $2a + b = 14$, $a + 2c = 11$. $L_2 - 2L_1$: $-b - 2c = -10$, ou $b + 2c = 10$. $L_3 - L_1$: $-b + c = -1$.
      Subtraindo essas duas: $3c = 9$, $c = 3$. Então $b = 4$ e $a = 5$.

  - estilo: Fuvest
    enunciado: |
      Se $(x, y, z)$ é a solução do sistema escalonado $\begin{cases} x - y + z = 2 \\ 2y + z = 7 \\ 3z = 9 \end{cases}$, então $x + y + z$ é igual a
    opcoes: ['$2$', '$3$', '$4$', '$5$', '$6$']
    correta: E
    resolucao: |
      $z = 3$; $2y = 4$, $y = 2$; $x = 2 + 2 - 3 = 1$. Soma: $6$.

  - estilo: Unicamp
    enunciado: |
      Ao escalonar um sistema linear $3 \times 3$, obteve-se uma equação $0x + 0y + 0z = 0$, e as outras duas equações, não nulas, não apresentaram contradição. Esse sistema é
    opcoes: ['impossível.', 'possível e determinado.', 'possível e indeterminado.', 'homogêneo.']
    correta: C
    resolucao: |
      A equação $0 = 0$ some. Sobram duas equações com três incógnitas e nenhuma contradição: há infinitas soluções.

  - estilo: UEM
    enunciado: |
      Considere as operações usadas para escalonar um sistema linear. Assinale o que for correto.
    proposicoes:
    - 'Trocar duas equações de lugar não altera as soluções.'
    - 'Multiplicar uma equação por $-3$ não altera as soluções.'
    - 'Substituir uma equação pelo seu quadrado não altera as soluções.'
    - 'Substituir $L_2$ por $L_2 - 5L_1$ não altera as soluções.'
    - 'Apagar uma equação do tipo $0 = 0$ não altera as soluções.'
    - 'Apagar uma equação do tipo $0 = 3$ não altera as soluções.'
    corretas: [1, 2, 4, 5]
    resolucao: |
      01) Correta. 02) Correta: $-3 \neq 0$. 04) Incorreta: a equação deixa de ser linear e pode ganhar soluções.
      08) Correta. 16) Correta: $0 = 0$ não restringe nada. 32) Incorreta: $0 = 3$ mostra que não há solução; apagá-la mudaria a conclusão.
      Soma: $01 + 02 + 08 + 16 = 27$.

  - estilo: Unesp
    texto: |
      Na figura, cada círculo esconde um número, e o número escrito em cada lado do triângulo é a soma dos números dos dois círculos que ele liga.
    figura:
      tikz: |
        \begin{scope}[scale=.9]
        \coordinate (A) at (0,0); \coordinate (B) at (3.6,0); \coordinate (C) at (1.8,2.8);
        \draw[ink, line width=1pt] (A) -- (B) -- (C) -- cycle;
        \node[font=\small, below] at (1.8,0) {$10$};
        \node[font=\small, left] at (0.75,1.5) {$9$};
        \node[font=\small, right] at (2.85,1.5) {$11$};
        \filldraw[fill=roxo!12, draw=roxo, line width=1pt] (A) circle (0.42) node[font=\small] {$x$};
        \filldraw[fill=roxo!12, draw=roxo, line width=1pt] (B) circle (0.42) node[font=\small] {$z$};
        \filldraw[fill=roxo!12, draw=roxo, line width=1pt] (C) circle (0.42) node[font=\small] {$y$};
        \end{scope}
    enunciado: |
      O maior dos três números escondidos é
    opcoes: ['$3$', '$4$', '$5$', '$6$', '$7$']
    correta: D
    resolucao: |
      $x + y = 9$, $y + z = 11$ e $x + z = 10$. Somando as três: $2(x + y + z) = 30$, logo $x + y + z = 15$.
      Então $z = 15 - 9 = 6$, $x = 15 - 11 = 4$ e $y = 5$. O maior é 6.

  - estilo: UEL
    enunciado: |
      Considere o sistema escalonado $\begin{cases} x + y + z = 4 \\ y - z = 0 \\ 0z = 0 \end{cases}$ e as afirmativas a seguir.
    afirmativas:
    - 'O sistema é possível e indeterminado.'
    - 'O terno $(2, 1, 1)$ é solução.'
    - 'O terno $(4, 0, 0)$ é solução.'
    - 'O sistema tem exatamente duas soluções.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'I, II e III, apenas.', 'II e III, apenas.', 'I e IV, apenas.', 'II, III e IV, apenas.']
    correta: B
    resolucao: |
      I. Correta: $0z = 0$ some, e $z$ fica livre. II. Correta: $4 = 4$ e $0 = 0$. III. Correta: $4 = 4$ e $0 = 0$.
      IV. Incorreta: as soluções são $(4 - 2t, t, t)$, infinitas.

  - estilo: Fuvest
    enunciado: |
      Escalonando o sistema $\begin{cases} x + y = 5 \\ 2x + 3y = 12 \end{cases}$, obtém-se a solução $(x, y)$. O produto $xy$ é
    opcoes: ['$2$', '$3$', '$4$', '$5$', '$6$']
    correta: E
    resolucao: |
      $L_2 - 2L_1$: $y = 2$; então $x = 3$. Produto: $6$.

  # ---------------- Nível 2 ----------------
  - estilo: Enem
    texto: |
      Um artesão produz colares, pulseiras e brincos. O quadro mostra quanto de cada material vai em cada peça e quanto material ele tem em estoque. Ele quer usar todo o estoque e, para descobrir quantas peças de cada tipo fazer, montou um sistema linear e o escalonou.
    tabela:
      cabecalho: ['Material', 'Colar', 'Pulseira', 'Brinco', 'Estoque']
      linhas:
      - ['Contas', '10', '4', '2', '50']
      - ['Fio (dm)', '4', '2', '1', '22']
      - ['Fechos', '1', '1', '2', '11']
    enunciado: |
      O número de pulseiras que ele deve produzir é
    opcoes: ['$2$', '$3$', '$4$', '$5$', '$6$']
    correta: C
    resolucao: |
      $10c + 4p + 2b = 50$, ou $5c + 2p + b = 25$; $4c + 2p + b = 22$; $c + p + 2b = 11$.
      $L_1 - L_2$: $c = 3$. Então $2p + b = 10$ e $p + 2b = 8$: $p = 4$ e $b = 2$.

  - estilo: Unicamp
    enunciado: |
      O sistema escalonado $\begin{cases} x + y + z = 1 \\ y + 2z = 2 \\ (k - 3)z = k - 3 \end{cases}$ é possível e indeterminado se, e somente se,
    opcoes: ['$k = 3$.', '$k \neq 3$.', '$k = 0$.', '$k = 1$.']
    correta: A
    resolucao: |
      Para $k = 3$, a última equação é $0z = 0$ e some: SPI. Para $k \neq 3$, $z = 1$ e o sistema é SPD.

  - estilo: UFPR
    enunciado: |
      Considere o sistema $\begin{cases} x + y + z = 3 \\ x + 2y + 3z = 6 \\ 2x + 3y + 4z = 9 \end{cases}$. Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'O sistema é possível e determinado.'
    - '$(1, 1, 1)$ é solução do sistema.'
    - '$(0, 3, 0)$ é solução do sistema.'
    - 'Toda solução do sistema tem $x = z$.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – F – F.', 'F – V – F – V.', 'V – F – V – V.', 'F – V – V – V.', 'F – F – V – F.']
    correta: D
    resolucao: |
      $L_2 - L_1$: $y + 2z = 3$; $L_3 - 2L_1$: $y + 2z = 3$. Uma vira $0 = 0$: SPI (F).
      Soluções: $y = 3 - 2z$ e $x = 3 - y - z = z$. (V) $z = 1$. (V) $z = 0$. (V) $x = z$.

  - estilo: UFSC
    enunciado: |
      Considere o sistema $\begin{cases} x + 2y + z = 4 \\ 2x + 5y + 3z = 9 \\ x + 3y + 2z = k \end{cases}$, em que $k$ é real. Assinale o que for correto.
    proposicoes:
    - 'Para $k = 5$, o sistema é possível e indeterminado.'
    - 'Para $k = 4$, o sistema é impossível.'
    - 'Existe um valor de $k$ para o qual o sistema é possível e determinado.'
    - 'Para $k = 5$, o terno $(1, 1, 1)$ é solução.'
    - 'Para $k = 5$, toda solução satisfaz $y + z = 1$.'
    - 'Para $k = 5$, o terno $(1, 2, -1)$ é solução.'
    corretas: [1, 2, 5, 6]
    resolucao: |
      $L_2 - 2L_1$: $y + z = 1$. $L_3 - L_1$: $y + z = k - 4$. Se $k = 5$, as duas coincidem: SPI (01 e 16 corretas). Se $k \neq 5$: $0 = k - 5 \neq 0$, SI (02 correta, 04 incorreta).
      08) Incorreta: $2 + 5 + 3 = 10 \neq 9$. 32) Correta: $1 + 4 - 1 = 4$, $2 + 10 - 3 = 9$, $1 + 6 - 2 = 5$.
      Soma: $01 + 02 + 16 + 32 = 51$.

  - estilo: Fuvest
    enunciado: |
      Se $(x, y, z)$ é a solução de $\begin{cases} x + y + z = 0 \\ x + 2y + 4z = 3 \\ x + 3y + 9z = 8 \end{cases}$, então $x + 2y + 3z$ é igual a
    opcoes: ['$-1$', '$0$', '$1$', '$2$', '$3$']
    correta: D
    resolucao: |
      $L_2 - L_1$: $y + 3z = 3$. $L_3 - L_2$: $y + 5z = 5$. Subtraindo: $2z = 2$, $z = 1$, $y = 0$ e $x = -1$.
      $x + 2y + 3z = -1 + 0 + 3 = 2$.

  - estilo: Unesp
    texto: |
      Um número de três algarismos tem as seguintes propriedades: a soma dos algarismos é 12; o algarismo das centenas é igual à soma dos outros dois; e, invertendo a ordem dos algarismos, obtém-se um número 198 unidades menor que o original.
    enunciado: |
      Esse número é
    opcoes: ['$624$.', '$642$.', '$426$.', '$615$.', '$633$.']
    correta: A
    resolucao: |
      Com algarismos $c$, $d$, $u$: $c + d + u = 12$ e $c = d + u$, logo $2c = 12$ e $c = 6$.
      $(100c + 10d + u) - (100u + 10d + c) = 99(c - u) = 198$: $c - u = 2$, $u = 4$ e $d = 2$. O número é 624.
      615 e 633 satisfazem as duas primeiras condições, mas não a terceira.

  - estilo: Enem
    texto: |
      Uma pessoa pagou uma conta de R\$\,50,00 usando exatamente 15 cédulas, entre cédulas de R\$\,2,00, R\$\,5,00 e R\$\,10,00. Com essas duas informações, monta-se um sistema de duas equações e três incógnitas, que tem infinitas soluções reais. Como as quantidades de cédulas são números naturais, porém, as possibilidades ficam bem restritas.
    enunciado: |
      A quantidade de cédulas de R\$\,5,00 usadas foi
    opcoes: ['$2$', '$3$', '$4$', '$5$', '$6$']
    correta: C
    resolucao: |
      $a + b + c = 15$ e $2a + 5b + 10c = 50$. Escalonando ($L_2 - 2L_1$): $3b + 8c = 20$.
      $c = 0$ dá $b = \tfrac{20}{3}$; $c = 1$ dá $b = 4$; $c = 2$ dá $b = \tfrac{4}{3}$. Só serve $c = 1$, $b = 4$ e $a = 10$.

  # ---------------- Nível 3 ----------------
  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Uma torrefação vai preparar 10 kg de um café especial misturando três tipos de grão, A, B e C, cujos preços por quilo estão no quadro. O custo total dos grãos deve ser exatamente R\$\,300,00. Com $a$, $b$ e $c$ as quantidades, em quilogramas, de cada tipo, o gerente montou um sistema com essas duas condições.
      tabela:
        cabecalho: ['Grão', 'Preço por kg']
        linhas:
        - ['A', 'R\$\,20,00']
        - ['B', 'R\$\,30,00']
        - ['C', 'R\$\,40,00']
    enunciado: |
      O sistema montado pelo gerente é
    opcoes: ['impossível.', 'possível e determinado.', 'possível e indeterminado, e toda solução tem $a = b$.', 'homogêneo.', 'possível e indeterminado, e toda solução tem $a = c$.']
    correta: E
    resolucao: |
      $a + b + c = 10$ e $20a + 30b + 40c = 300$, ou $2a + 3b + 4c = 30$. $L_2 - 2L_1$: $b + 2c = 10$.
      Então $b = 10 - 2c$ e $a = 10 - b - c = c$. Duas equações, três incógnitas: SPI, sempre com $a = c$.

  - estilo: Unicamp
    enunciado: |
      Se o gerente decidir usar 2 kg do grão C, a quantidade do grão A será
    opcoes: ['$1$ kg.', '$2$ kg.', '$4$ kg.', '$6$ kg.']
    correta: B
    resolucao: |
      $a = c = 2$ kg (e $b = 10 - 4 = 6$ kg). Conferência: $40 + 180 + 80 = 300$.

  - estilo: UEM
    enunciado: |
      Considere o escalonamento de sistemas lineares. Assinale o que for correto.
    proposicoes:
    - 'Se o escalonamento produz a equação $0 = 5$, o sistema é impossível.'
    - 'Se o escalonamento produz a equação $0 = 0$, o sistema é impossível.'
    - 'Um sistema $3 \times 3$ escalonado em que $x$, $y$ e $z$ aparecem com coeficiente não nulo nos três degraus é possível e determinado.'
    - 'Um sistema com 2 equações e 3 incógnitas pode ser possível e determinado.'
    - 'Sistemas que diferem apenas pela ordem das equações têm as mesmas soluções.'
    corretas: [1, 3, 5]
    resolucao: |
      01) Correta. 02) Incorreta: $0 = 0$ é sempre verdade. 04) Correta: obtêm-se $z$, depois $y$, depois $x$, cada um único.
      08) Incorreta: sobra sempre uma incógnita livre (ou o sistema é SI). 16) Correta.
      Soma: $01 + 04 + 16 = 21$.

  - estilo: Fuvest
    enunciado: |
      O sistema $\begin{cases} x + y + z = 1 \\ x - y + z = 3 \\ x + 3y + az = b \end{cases}$ é possível e indeterminado se, e somente se,
    opcoes: ['$a = 1$ e $b = -1$', '$a = 1$ e $b \neq -1$', '$a \neq 1$', '$a = -1$ e $b = 1$', '$b = -1$']
    correta: A
    resolucao: |
      $L_2 - L_1$: $-2y = 2$, $y = -1$. $L_3 - L_1$: $2y + (a - 1)z = b - 1$, isto é, $(a - 1)z = b + 1$.
      $a \neq 1$: SPD. $a = 1$ e $b = -1$: $0 = 0$, SPI. $a = 1$ e $b \neq -1$: SI.

  - estilo: Enem
    texto: |
      No basquete, uma cesta pode valer 1, 2 ou 3 pontos, conforme o quadro. Em uma partida, um jogador acertou 20 cestas e marcou 40 pontos. O número de cestas de 2 pontos foi o dobro do número de cestas de 3 pontos. Um analista montou um sistema com essas informações para descobrir quantas cestas de cada tipo o jogador fez.
    tabela:
      cabecalho: ['Cesta', 'Pontos']
      linhas:
      - ['Lance livre', '1']
      - ['Dentro do arco', '2']
      - ['De fora do arco', '3']
    enunciado: |
      O número de cestas de 3 pontos desse jogador foi
    opcoes: ['$4$', '$5$', '$6$', '$8$', '$10$']
    correta: B
    resolucao: |
      $a + b + c = 20$, $a + 2b + 3c = 40$ e $b = 2c$. Substituindo: $a + 3c = 20$ e $a + 7c = 40$. Subtraindo: $4c = 20$, $c = 5$.
      Então $b = 10$ e $a = 5$. 10 é o número de cestas de 2 pontos.

  - estilo: Fuvest
    enunciado: |
      O sistema $\begin{cases} x + y + z = 3 \\ 2x + 2y + 2z = 6 \\ 3x + 3y + 3z = k \end{cases}$ é impossível se, e somente se,
    opcoes: ['$k = 9$', '$k = 3$', '$k \neq 3$', 'nenhum valor de $k$', '$k \neq 9$']
    correta: E
    resolucao: |
      $L_2 - 2L_1$: $0 = 0$. $L_3 - 3L_1$: $0 = k - 9$. O sistema é SI quando $k \neq 9$ (e SPI quando $k = 9$).

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere o sistema $\begin{cases} x + 2y + z = 3 \\ 2x + 5y + 4z = 8 \\ x + 4y + az = b \end{cases}$, com $a$ e $b$ reais.'
    itens:
    - 'Escalone o sistema até a última equação ficar só com $z$.'
    - 'Classifique o sistema conforme os valores de $a$ e $b$.'
    - 'Para $a = 5$ e $b = 7$, escreva todas as soluções.'
    espaco: 62
    resolucao: |
      a) $L_2 - 2L_1$: $y + 2z = 2$. $L_3 - L_1$: $2y + (a - 1)z = b - 3$. Subtraindo o dobro da anterior: $(a - 5)z = b - 7$.
      b) $a \neq 5$: SPD. $a = 5$ e $b = 7$: SPI. $a = 5$ e $b \neq 7$: SI.
      c) $z = t$, $y = 2 - 2t$ e $x = 3 - 2(2 - 2t) - t = 3t - 1$. Soluções $(3t - 1, 2 - 2t, t)$.
    resposta: 'a) $(a - 5)z = b - 7$; b) $a \neq 5$: SPD; $a = 5$, $b = 7$: SPI; $a = 5$, $b \neq 7$: SI; c) $(3t - 1, 2 - 2t, t)$'

  - estilo: Unicamp
    texto: |
      Procura-se um polinômio $p(x) = ax^3 + bx^2 + cx + d$ tal que $p(0) = 1$, $p(1) = 2$, $p(-1) = 4$ e $p(2) = 7$.
    enunciado: ''
    itens:
    - 'Escreva o sistema linear nas incógnitas $a$, $b$, $c$ e $d$.'
    - 'Resolva o sistema por escalonamento e mostre que, na verdade, $p$ tem grau 2.'
    - 'Calcule $p(3)$.'
    espaco: 62
    resolucao: |
      a) $d = 1$; $a + b + c + d = 2$; $-a + b - c + d = 4$; $8a + 4b + 2c + d = 7$.
      b) Com $d = 1$: $a + b + c = 1$, $-a + b - c = 3$ e $8a + 4b + 2c = 6$. Somando as duas primeiras: $2b = 4$, $b = 2$. Então $a + c = -1$ e $8a + 2c = -2$, ou $4a + c = -1$. Subtraindo: $3a = 0$, $a = 0$ e $c = -1$. Assim $p(x) = 2x^2 - x + 1$, de grau 2.
      c) $p(3) = 18 - 3 + 1 = 16$.
    resposta: 'a) Ver resolução; b) $p(x) = 2x^2 - x + 1$; c) $16$'

  - estilo: ITA
    enunciado: |
      O número de ternos $(x, y, z)$ de números naturais que satisfazem $\begin{cases} x + y + z = 10 \\ x - y + z = 4 \end{cases}$ é
    opcoes: ['$6$', '$7$', '$8$', '$9$', 'infinito']
    correta: C
    espaco: 22
    resolucao: |
      Subtraindo: $2y = 6$, $y = 3$. Sobra $x + z = 7$: $x = 0, 1, \dots, 7$, com $z = 7 - x$. São 8 ternos.
      Nos reais o sistema seria SPI, com infinitas soluções; com naturais, são só 8.
    resposta: 'C'

  - estilo: Unesp
    texto: |
      Três pacotes, A, B e C, foram pesados aos pares e depois os três juntos. Os resultados, em quilogramas, foram: A e B, 10; B e C, 14; A e C, 12; A, B e C, 20.
    enunciado: ''
    itens:
    - 'Escreva o sistema com as quatro medições e mostre, por escalonamento, que ele é impossível.'
    - 'Desprezando a última medição, determine as massas dos três pacotes.'
    - 'Que valor da última medição tornaria o sistema possível?'
    espaco: 62
    resolucao: |
      a) $a + b = 10$, $b + c = 14$, $a + c = 12$, $a + b + c = 20$. Somando as três primeiras: $2(a + b + c) = 36$, isto é, $a + b + c = 18$. Com a quarta: $0 = 20 - 18 = 2$, SI.
      b) $a + b + c = 18$: $c = 8$, $a = 4$ e $b = 6$.
      c) $18$ kg.
    resposta: 'a) Ver resolução; b) $a = 4$, $b = 6$, $c = 8$ kg; c) $18$ kg'

  - estilo: UFSC
    enunciado: |
      Considere o sistema homogêneo $\begin{cases} x + y + z = 0 \\ x + 2y + 3z = 0 \\ x + 3y + kz = 0 \end{cases}$, em que $k$ é real. Assinale o que for correto.
    proposicoes:
    - 'Para $k \neq 5$, a única solução é a nula.'
    - 'Para $k = 5$, o sistema é possível e indeterminado.'
    - 'Para $k = 5$, o terno $(1, -2, 1)$ é solução.'
    - 'Para $k = 5$, o terno $(1, 2, 1)$ é solução.'
    - 'Para qualquer $k$, o sistema é possível.'
    - 'Para $k = 5$, toda solução satisfaz $x = z$.'
    corretas: [1, 2, 3, 5, 6]
    espaco: 22
    resolucao: |
      $L_2 - L_1$: $y + 2z = 0$. $L_3 - L_1$: $2y + (k - 1)z = 0$. Subtraindo o dobro da anterior: $(k - 5)z = 0$.
      01) Correta: $z = 0$, $y = 0$, $x = 0$. 02) Correta. 04) Correta: $0$, $0$ e $1 - 6 + 5 = 0$. 08) Incorreta: $1 + 2 + 1 \neq 0$.
      16) Correta: todo homogêneo admite a nula. 32) Correta: $y = -2z$ e $x = -y - z = z$.
    resposta: 'Soma 55 (01 + 02 + 04 + 16 + 32)'

  - estilo: Fuvest
    enunciado: 'Considere o sistema $\begin{cases} x + y + z + w = 4 \\ x + 2y + 3z + 4w = 10 \\ x + 3y + 6z + 10w = 20 \\ x + 4y + 10z + 20w = 35 \end{cases}$.'
    itens:
    - 'Fazendo $L_2 - L_1$, $L_3 - L_2$ e $L_4 - L_3$, escreva as três novas equações.'
    - 'Continue o escalonamento e classifique o sistema.'
    - 'Determine a solução.'
    espaco: 62
    resolucao: |
      a) $y + 2z + 3w = 6$; $y + 3z + 6w = 10$; $y + 4z + 10w = 15$.
      b) Subtraindo, de novo, cada uma da seguinte: $z + 3w = 4$ e $z + 4w = 5$; e então $w = 1$. O sistema fica escalonado com 4 equações e 4 incógnitas, sem contradição: SPD.
      c) $w = 1$, $z = 1$, $y = 6 - 2 - 3 = 1$ e $x = 1$. Solução $(1, 1, 1, 1)$.
    resposta: 'a) Ver resolução; b) SPD; c) $(1, 1, 1, 1)$'

  - estilo: Unicamp
    texto: |
      Um problema chinês clássico, do século V, diz: um galo custa 5 moedas, uma galinha custa 3 moedas e 3 pintinhos custam 1 moeda. Com 100 moedas compram-se exatamente 100 aves. Quantas são de cada tipo?
    enunciado: ''
    itens:
    - 'Monte o sistema com $g$ galos, $h$ galinhas e $p$ pintinhos e classifique-o (nos reais).'
    - 'Escalone e escreva $h$ e $p$ em função de $g$.'
    - 'Determine todas as soluções com pelo menos uma ave de cada tipo.'
    espaco: 62
    resolucao: |
      a) $g + h + p = 100$ e $5g + 3h + \tfrac{p}{3} = 100$, ou $15g + 9h + p = 300$. Duas equações e três incógnitas: SPI.
      b) $L_2 - L_1$: $14g + 8h = 200$, isto é, $7g + 4h = 100$. Então $h = 25 - \tfrac{7g}{4}$ e $p = 100 - g - h = 75 + \tfrac{3g}{4}$.
      c) $g$ precisa ser múltiplo de 4, com $g \ge 1$ e $h \ge 1$: $g = 4$, $8$ ou $12$. Soluções: $(4, 18, 78)$, $(8, 11, 81)$ e $(12, 4, 84)$.
    resposta: 'a) SPI; b) $h = 25 - \frac{7g}{4}$, $p = 75 + \frac{3g}{4}$; c) $(4, 18, 78)$, $(8, 11, 81)$, $(12, 4, 84)$'

  - estilo: Fuvest
    enunciado: |
      Se $(x, y, z)$ é a solução de $\begin{cases} x + 2y + 3z = 14 \\ 2x + 3y + z = 11 \\ 3x + y + 2z = 11 \end{cases}$, então $z$ é igual a
    opcoes: ['$1$', '$2$', '$3$', '$4$', '$6$']
    correta: C
    espaco: 22
    resolucao: |
      $L_2 - 2L_1$: $-y - 5z = -17$. $L_3 - 3L_1$: $-5y - 7z = -31$. Da primeira, $y = 17 - 5z$; na segunda: $-85 + 25z - 7z = -31$, $18z = 54$, $z = 3$.
      Então $y = 2$ e $x = 1$. (6 é o valor de $x + y + z$.)
    resposta: 'C'

  - estilo: Unesp
    texto: |
      Para resolver $\begin{cases} x + y = 3 \\ x - y = 1 \end{cases}$, um estudante trocou, ao mesmo tempo, $L_1$ por $L_1 - L_2$ e $L_2$ por $L_2 - L_1$. Obteve $2y = 2$ e $-2y = -2$ e concluiu: “sobrou só a incógnita $y$, e $x$ pode ser qualquer número; o sistema é possível e indeterminado”.
    enunciado: ''
    itens:
    - 'Mostre que o sistema original tem uma única solução.'
    - 'Explique por que as duas operações feitas ao mesmo tempo mudaram o sistema.'
    - 'Diga como o escalonamento deveria ter sido feito.'
    espaco: 62
    resolucao: |
      a) $L_2 - L_1$: $-2y = -2$, $y = 1$, e $x = 2$. Solução única $(2, 1)$.
      b) As duas novas equações vieram do mesmo par e são proporcionais ($-2y = -2$ é a outra multiplicada por $-1$). A informação sobre $x$ sumiu: nenhuma das equações originais ficou no sistema.
      c) Troca-se uma equação de cada vez e mantém-se a outra: por exemplo, $L_1$ fica e $L_2$ vira $L_2 - L_1$.
    resposta: 'a) $(2, 1)$; b) e c) Ver resolução'

  - estilo: Fuvest
    texto: |
      Uma ração deve ter exatamente 10 kg e 40 unidades de proteína, usando três ingredientes, A, B e C. Cada quilo de A, B e C fornece 2, 5 e 6 unidades de proteína e custa R\$\,3,00, R\$\,6,00 e R\$\,6,00, respectivamente.
    enunciado: ''
    itens:
    - 'Monte o sistema com as quantidades $a$, $b$ e $c$, em kg, e escreva $a$ e $b$ em função de $c$.'
    - 'Mostre que o custo da ração é $50 - c$ reais.'
    - 'Com quantidades não negativas, qual é o menor custo possível? Que quantidades o produzem?'
    espaco: 62
    resolucao: |
      a) $a + b + c = 10$ e $2a + 5b + 6c = 40$. $L_2 - 2L_1$: $3b + 4c = 20$, $b = \tfrac{20 - 4c}{3}$; e $a = 10 - b - c = \tfrac{10 + c}{3}$.
      b) $3a + 6b + 6c = (10 + c) + 2(20 - 4c) + 6c = 50 - c$.
      c) O custo diminui quando $c$ aumenta. Com $b \ge 0$, $c \le 5$. Para $c = 5$: $b = 0$, $a = 5$ e custo R\$\,45,00.
    resposta: 'a) $a = \frac{10 + c}{3}$, $b = \frac{20 - 4c}{3}$; b) Ver resolução; c) R\$\,45,00, com $a = 5$, $b = 0$, $c = 5$'
