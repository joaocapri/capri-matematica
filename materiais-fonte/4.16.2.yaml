# Aula 4.16.2 — Geometria espacial: tronco de cone
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: tronco de cone reto (raios R e r, altura h, geratriz g); g² = h² + (R − r)²;
# V = πh/3 (R² + Rr + r²); A_L = πg(R + r); A_T; secção meridiana (trapézio isósceles); tronco como diferença de cones
# (semelhança); altura do cone original; planificação (setor de coroa); recipientes (copos, baldes, cúpulas).
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Use $V = \frac{\pi h}{3}(R^2 + Rr + r^2)$ e $A_L = \pi g(R + r)$, e deixe as respostas em função de $\pi$, salvo indicação. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Um tronco de cone tem raios 6 e 2 e altura 3. Complete.'
      itens:
      - 'Geratriz: {{5}}'
      - 'Volume: {{52\pi}}'
      - 'Área lateral: {{40\pi}}'
      - 'Área total: {{80\pi}}'
      espaco_item: 8
      resolucao: |
        $g = \sqrt{9 + 16} = 5$; $V = \tfrac{3\pi}{3}(36 + 12 + 4) = 52\pi$; $A_L = \pi \cdot 5 \cdot 8 = 40\pi$; $A_T = 40\pi + 36\pi + 4\pi = 80\pi$.
      resposta: '5; $52\pi$; $40\pi$; $80\pi$'
    - enunciado: 'Associe cada elemento do tronco de cone de raios $R$ e $r$, altura $h$ e geratriz $g$ à sua expressão.'
      esquerda:
      - 'volume'
      - 'área lateral'
      - 'geratriz'
      - 'área total'
      - 'secção meridiana'
      direita:
      - 'trapézio isósceles de bases $2R$ e $2r$'
      - '$\pi g(R + r)$'
      - '$\frac{\pi h}{3}(R^2 + Rr + r^2)$'
      - '$\sqrt{h^2 + (R - r)^2}$'
      - '$\pi g(R + r) + \pi R^2 + \pi r^2$'
      resolucao: |
        A geratriz sai do trapézio retângulo de bases $R$ e $r$ e altura $h$.
      resposta: 'De cima para baixo: 5, 2, 1, 3, 4'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'O volume de um tronco de cone é o volume do cone maior menos o do cone menor.'
      - 'A geratriz do tronco satisfaz $g^2 = h^2 + (R + r)^2$.'
      - 'A secção meridiana de um tronco de cone reto é um trapézio isósceles.'
      - 'O volume do tronco é $\pi h \cdot \frac{R^2 + r^2}{2}$.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) (F) É $(R - r)^2$. (V) (F) É $\tfrac{\pi h}{3}(R^2 + Rr + r^2)$.
      resposta: V, F, V, F
    - enunciado: 'Complete com o volume de cada tronco de cone.'
      tabela:
        cabecalho: ['$R$', '$r$', '$h$', '$V$']
        linhas:
        - ['$4$', '$2$', '$3$', '${{28\pi}}$']
        - ['$5$', '$1$', '$6$', '${{62\pi}}$']
        - ['$6$', '$3$', '$1$', '${{21\pi}}$']
        - ['$3$', '$3$', '$5$', '${{45\pi}}$']
      resolucao: |
        $\pi(16 + 8 + 4)$; $2\pi(25 + 5 + 1)$; $\tfrac{\pi}{3}(36 + 18 + 9)$; $\tfrac{5\pi}{3} \cdot 27$ (com $R = r$, é um cilindro).
      resposta: '$28\pi$; $62\pi$; $21\pi$; $45\pi$'
    - enunciado: 'O tronco de cone da figura tem raios 7 e 2 e altura 12. Calcule a geratriz e o volume.'
      figura:
        tikz: |
          \begin{scope}[scale=.8]
          \draw[ink, line width=1pt] (-1.6,0) -- (-0.6,2.4) (1.6,0) -- (0.6,2.4);
          \draw[ink, line width=1pt] (0,2.4) ellipse (0.6 and 0.15);
          \draw[ink, line width=1pt] (-1.6,0) arc (180:360:1.6 and 0.4);
          \draw[ink, dashed] (1.6,0) arc (0:180:1.6 and 0.4);
          \draw[roxo, dashed] (0,0) -- (0,2.4);
          \draw[roxo, line width=1pt] (0,0) -- (1.6,0) (0,2.4) -- (0.6,2.4);
          \node[below, font=\scriptsize] at (0.8,0) {$7$};
          \node[above, font=\scriptsize] at (0.3,2.5) {$2$};
          \node[left, font=\scriptsize] at (0,1.2) {$12$};
          \end{scope}
      espaco: 8
      resolucao: |
        $g = \sqrt{144 + 25} = 13$; $V = \tfrac{12\pi}{3}(49 + 14 + 4) = 268\pi$.
      resposta: '$g = 13$; $268\pi$'
    - enunciado: 'Um copo tem a forma de tronco de cone, com 4 cm de raio na boca, 3 cm de raio no fundo e 6 cm de altura. Calcule a sua capacidade, com $\pi \approx 3{,}14$.'
      espaco: 8
      resolucao: |
        $V = \tfrac{6\pi}{3}(16 + 12 + 9) = 74\pi \approx 232{,}4$ cm³.
      resposta: '$\approx 232{,}4$ cm³'
    - enunciado: 'Um tronco de cone tem raios 10 e 4 e geratriz 10. Calcule a área lateral e a altura.'
      espaco: 8
      resolucao: |
        $A_L = \pi \cdot 10 \cdot 14 = 140\pi$. $h = \sqrt{100 - 36} = 8$.
      resposta: '$140\pi$; 8'
  - nome: Nível 2
    questoes:
    - texto: |
        Para um tronco de cone de raios 8 e 2 e altura 8, Lucas calculou a geratriz: $g = \sqrt{8^2 + (8 + 2)^2} = \sqrt{164}$.
      enunciado: 'Encontre o erro, corrija e calcule a área lateral.'
      espaco: 10
      resolucao: |
        No trapézio retângulo da secção, o cateto horizontal é $R - r = 6$: $g = \sqrt{64 + 36} = 10$. $A_L = \pi \cdot 10 \cdot 10 = 100\pi$.
      resposta: '$g = 10$; $100\pi$'
    - enunciado: 'Um cone de raio 9 e altura 12 é cortado por um plano paralelo à base, a 4 do vértice. Complete.'
      itens:
      - 'Raio do cone menor: {{3}}'
      - 'Volume do cone original: {{324\pi}}'
      - 'Volume do cone menor: {{12\pi}}'
      - 'Volume do tronco: {{312\pi}}'
      espaco_item: 8
      resolucao: |
        $k = \tfrac{1}{3}$: $r = 3$. $\tfrac{\pi \cdot 81 \cdot 12}{3} = 324\pi$; $\tfrac{324\pi}{27} = 12\pi$; tronco $312\pi$. Pela fórmula: $\tfrac{8\pi}{3}(81 + 27 + 9) = 312\pi$.
      resposta: '3; $324\pi$; $12\pi$; $312\pi$'
    - enunciado: 'A cúpula de um abajur é a superfície lateral de um tronco de cone de raios 15 cm e 9 cm e altura 8 cm. Calcule a área de tecido, com $\pi \approx 3{,}14$.'
      espaco: 10
      resolucao: |
        $g = \sqrt{64 + 36} = 10$ cm. $A_L = \pi \cdot 10 \cdot 24 = 240\pi \approx 753{,}6$ cm².
      resposta: '$\approx 753{,}6$ cm²'
    - enunciado: 'Um copo em forma de tronco de cone tem 4 cm de raio na boca, 3 cm no fundo e 12 cm de altura. Calcule a capacidade e o volume de água quando ela atinge a metade da altura.'
      espaco: 12
      resolucao: |
        $V = \tfrac{12\pi}{3}(16 + 12 + 9) = 148\pi$. Na metade da altura, o raio é 3,5: $\tfrac{6\pi}{3}(9 + 10{,}5 + 12{,}25) = 63{,}5\pi$, menos da metade.
      resposta: '$148\pi$; $63{,}5\pi$'
    - enunciado: 'Um tronco de cone tem volume $104\pi$ e raios 6 e 2. Calcule a altura.'
      espaco: 8
      resolucao: |
        $\tfrac{\pi h}{3}(36 + 12 + 4) = \tfrac{52\pi h}{3} = 104\pi$: $h = 6$.
      resposta: '6'
    - enunciado: 'Um tronco de cone tem raios 6 e 4 e altura 5. Calcule a altura do cone do qual ele foi obtido.'
      espaco: 8
      resolucao: |
        $k = \tfrac{4}{6} = \tfrac{2}{3}$: o cone retirado tem altura $\tfrac{2H}{3}$, e $H - \tfrac{2H}{3} = 5$: $H = 15$.
      resposta: '15'
    - enunciado: 'Um tronco de cone tem raios 4 e 2 e geratriz 4. Calcule a geratriz do cone original, o ângulo do setor da sua planificação e a área lateral do tronco.'
      espaco: 12
      resolucao: |
        $k = \tfrac{1}{2}$: o cone original tem geratriz $G$ com $G - \tfrac{G}{2} = 4$, $G = 8$. $\theta = 360° \cdot \tfrac{4}{8} = 180°$. A planificação do tronco é meia coroa de raios 8 e 4: $\tfrac{64\pi - 16\pi}{2} = 24\pi = \pi \cdot 4 \cdot 6$.
      resposta: '8; $180°$; $24\pi$'
    - enunciado: 'A secção meridiana de um tronco de cone é um trapézio isósceles de bases 12 e 6 e lados oblíquos 5. Calcule o volume do tronco.'
      espaco: 10
      resolucao: |
        $R = 6$, $r = 3$, $g = 5$: $h = \sqrt{25 - 9} = 4$. $V = \tfrac{4\pi}{3}(36 + 18 + 9) = 84\pi$.
      resposta: '$84\pi$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove a fórmula $V = \frac{\pi h}{3}(R^2 + Rr + r^2)$, completando o tronco com o cone menor, de altura $x$.'
      espaco: 14
      resolucao: |
        Semelhança: $\tfrac{x}{x + h} = \tfrac{r}{R}$, logo $x = \tfrac{hr}{R - r}$. $V = \tfrac{\pi}{3}[R^2(x + h) - r^2 x] = \tfrac{\pi}{3}[R^2 h + x(R^2 - r^2)] = \tfrac{\pi}{3}[R^2 h + hr(R + r)]$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que a área lateral do tronco é $\pi g(R + r)$, como diferença das áreas laterais de dois cones.'
      espaco: 14
      resolucao: |
        Sejam $G$ e $G - g$ as geratrizes dos cones. Semelhança: $\tfrac{G - g}{G} = \tfrac{r}{R}$, logo $G = \tfrac{gR}{R - r}$. $A_L = \pi R G - \pi r(G - g) = \pi G(R - r) + \pi r g = \pi g R + \pi g r$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que a fórmula do volume do tronco dá o volume do cilindro quando $r = R$ e o do cone quando $r = 0$.'
      espaco: 8
      resolucao: |
        $r = R$: $\tfrac{\pi h}{3} \cdot 3R^2 = \pi R^2 h$. $r = 0$: $\tfrac{\pi h}{3} R^2$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que, cortando um cone por um plano paralelo à base na metade da altura, o tronco tem $\frac{7}{8}$ do volume do cone.'
      espaco: 10
      resolucao: |
        Com $R$, $r = \tfrac{R}{2}$ e altura $\tfrac{H}{2}$: $V = \tfrac{\pi H}{6}\left(R^2 + \tfrac{R^2}{2} + \tfrac{R^2}{4}\right) = \tfrac{\pi H}{6} \cdot \tfrac{7R^2}{4} = \tfrac{7}{8} \cdot \tfrac{\pi R^2 H}{3}$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que a área da secção meridiana de um tronco de cone é $(R + r)h$.'
      espaco: 8
      resolucao: |
        É um trapézio de bases $2R$ e $2r$ e altura $h$: $\tfrac{(2R + 2r)h}{2}$.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Um balde tem a forma de tronco de cone, como na figura, com 15 cm de raio na boca, 10 cm de raio no fundo e 30 cm de altura. O dono de uma lavanderia quer saber quantos litros de água o balde comporta quando está cheio até a borda. Use 3 como aproximação para $\pi$.
    figura:
      tikz: |
        \begin{scope}[scale=.6]
        \draw[ink, line width=1pt] (-1.4,2.4) -- (-0.9,0) (1.4,2.4) -- (0.9,0);
        \draw[ink, line width=1pt, fill=lilas!20] (0,2.4) ellipse (1.4 and 0.35);
        \draw[ink, line width=1pt] (-0.9,0) arc (180:360:0.9 and 0.22);
        \draw[ink, dashed] (0.9,0) arc (0:180:0.9 and 0.22);
        \draw[mudo, line width=.8pt] (-1.4,2.4) arc (180:0:1.4 and 1.1);
        \end{scope}
    enunciado: |
      A capacidade do balde é
    opcoes: ['$14{,}25$ L', '$42{,}75$ L', '$20{,}25$ L', '$6{,}75$ L', '$9{,}00$ L']
    correta: A
    resolucao: |
      $V = \tfrac{30\pi}{3}(225 + 150 + 100) = 4750\pi \approx 14\,250$ cm³ $= 14{,}25$ L.

  - estilo: Fuvest
    enunciado: |
      A geratriz de um tronco de cone de raios 9 e 4 e altura 12 mede
    opcoes: ['$\sqrt{313}$', '$13$', '$15$', '$12$', '$\sqrt{153}$']
    correta: B
    resolucao: |
      $\sqrt{144 + (9 - 4)^2} = \sqrt{169} = 13$.

  - estilo: Unicamp
    enunciado: |
      O volume de um tronco de cone de raios 4 e 1 e altura 9 é
    opcoes: ['$21\pi$.', '$153\pi$.', '$63\pi$.', '$51\pi$.']
    correta: C
    resolucao: |
      $\tfrac{9\pi}{3}(16 + 4 + 1) = 63\pi$.

  - estilo: UEM
    enunciado: |
      Considere um tronco de cone de raios 10 e 4 e altura 8. Assinale o que for correto.
    proposicoes:
    - 'A geratriz do tronco mede 10.'
    - 'A área lateral é $140\pi$.'
    - 'A área total é $256\pi$.'
    - 'O volume é $416\pi$.'
    - 'O cone do qual o tronco foi obtido tem altura 12.'
    - 'A secção meridiana tem área 112.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) $\sqrt{64 + 36}$. 02) $\pi \cdot 10 \cdot 14$. 04) $140\pi + 100\pi + 16\pi$. 08) $\tfrac{8\pi}{3}(100 + 40 + 16)$. 16) Incorreta: $k = 0{,}4$, $H - 0{,}4H = 8$, $H = \tfrac{40}{3}$. 32) $(10 + 4) \cdot 8$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      A cúpula de uma luminária de teto é a superfície lateral de um tronco de cone, aberta em cima e embaixo, com 20 cm de raio na borda inferior, 12 cm de raio na borda superior e 15 cm de altura. Ela será revestida por fora com papel decorativo. Use 3 como aproximação para $\pi$.
    enunciado: |
      A área de papel necessária é
    opcoes: ['$1440$ cm²', '$2496$ cm²', '$960$ cm²', '$1632$ cm²', '$3264$ cm²']
    correta: D
    resolucao: |
      $g = \sqrt{225 + 64} = 17$ cm. $A_L = \pi \cdot 17 \cdot 32 = 544\pi \approx 1632$ cm².

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir, sobre um tronco de cone de raios $R$ e $r$, altura $h$ e geratriz $g$.
    afirmativas:
    - '$g^2 = h^2 + (R - r)^2$.'
    - 'A área lateral é $\pi g(R + r)$.'
    - 'O volume é $\pi h \cdot \frac{R^2 + r^2}{2}$.'
    - 'A secção meridiana é um trapézio isósceles.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'I e III, apenas.', 'III e IV, apenas.', 'II, III e IV, apenas.', 'I, II e IV, apenas.']
    correta: E
    resolucao: |
      I. Correta. II. Correta. III. Incorreta: $V = \tfrac{\pi h}{3}(R^2 + Rr + r^2)$. IV. Correta.

  - estilo: Unesp
    enunciado: |
      Um cone de volume $96\pi$ é cortado por um plano paralelo à base, na metade da altura. O volume do tronco obtido é
    opcoes: ['$84\pi$', '$48\pi$', '$12\pi$', '$72\pi$', '$90\pi$']
    correta: A
    resolucao: |
      O cone menor tem $\tfrac{96\pi}{8} = 12\pi$; tronco $84\pi$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      O copo da figura tem a forma de tronco de cone, com 5 cm de raio na boca, 2 cm de raio no fundo e 9 cm de altura.
    figura:
      tikz: |
        \begin{scope}[scale=.6]
        \draw[ink, line width=1pt] (-1.5,2.7) -- (-0.6,0) (1.5,2.7) -- (0.6,0);
        \draw[ink, line width=1pt] (0,2.7) ellipse (1.5 and 0.35);
        \draw[ink, line width=1pt] (-0.6,0) arc (180:360:0.6 and 0.15);
        \draw[ink, dashed] (0.6,0) arc (0:180:0.6 and 0.15);
        \draw[mudo, dashed] (0,0) -- (0,2.7) (0,2.7) -- (1.5,2.7) (0,0) -- (0.6,0);
        \node[above, font=\scriptsize] at (0.75,2.75) {$5$};
        \node[below, font=\scriptsize] at (0.3,-0.15) {$2$};
        \node[left, font=\scriptsize] at (0,1.3) {$9$};
        \end{scope}
    enunciado: |
      A capacidade do copo é
    opcoes: ['$39\pi$ cm³.', '$117\pi$ cm³.', '$225\pi$ cm³.', '$87\pi$ cm³.']
    correta: B
    resolucao: |
      $\tfrac{9\pi}{3}(25 + 10 + 4) = 117\pi$ cm³.

  - estilo: Fuvest
    enunciado: |
      Um tronco de cone tem raios 6 e 3 e geratriz 5. A sua área total é
    opcoes: ['$45\pi$', '$81\pi$', '$90\pi$', '$54\pi$', '$126\pi$']
    correta: C
    resolucao: |
      $A_L = \pi \cdot 5 \cdot 9 = 45\pi$; bases $36\pi + 9\pi$. Total $90\pi$.

  - estilo: UFSC
    enunciado: |
      Um cone de raio 12 e altura 16 é cortado por um plano paralelo à base, a 8 do vértice. Assinale o que for correto.
    proposicoes:
    - 'O cone menor tem raio 6.'
    - 'O tronco tem geratriz 10.'
    - 'O tronco tem volume $672\pi$.'
    - 'O tronco tem área lateral $180\pi$.'
    - 'A área lateral do tronco é $\frac{3}{4}$ da área lateral do cone original.'
    - 'O tronco tem metade do volume do cone original.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      $k = \tfrac{1}{2}$. 01) $12 \cdot \tfrac{1}{2}$. 02) Geratriz do cone 20, metade fica no tronco. 04) Cone $\tfrac{\pi \cdot 144 \cdot 16}{3} = 768\pi$; tronco $\tfrac{7}{8} \cdot 768\pi$. 08) $\pi \cdot 10 \cdot 18$. 16) Cone $\pi \cdot 12 \cdot 20 = 240\pi$, e $\tfrac{180}{240} = \tfrac{3}{4}$. 32) Incorreta: $\tfrac{7}{8}$.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      Uma cafeteria serve café em copos descartáveis em forma de tronco de cone, com 4 cm de raio na boca, 3 cm de raio no fundo e 9 cm de altura. O gerente quer saber o volume de um copo cheio até a borda para calcular o rendimento de cada garrafa. Use 3 como aproximação para $\pi$.
    enunciado: |
      O volume de um copo cheio é
    opcoes: ['$333$ mL', '$999$ mL', '$441$ mL', '$243$ mL', '$300$ mL']
    correta: A
    resolucao: |
      $V = \tfrac{9\pi}{3}(16 + 12 + 9) = 111\pi \approx 333$ cm³ $= 333$ mL.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'Um tronco de cone de raios 5 e 2 e altura 4 tem geratriz 5.'
    - 'Esse mesmo tronco tem área lateral $15\pi$.'
    - 'Se os dois raios do tronco são iguais, a fórmula do volume dá o volume de um cilindro.'
    - 'Cortando um cone na metade da altura, o tronco obtido tem $\frac{7}{8}$ do volume do cone.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – F – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – V – F.', 'V – F – V – V.']
    correta: E
    resolucao: |
      (V) $\sqrt{16 + 9}$. (F) É $\pi \cdot 5 \cdot 7 = 35\pi$. (V) $\tfrac{\pi h}{3} \cdot 3R^2$. (V) $1 - \tfrac{1}{8}$.

  - estilo: Enem
    texto: |
      Uma fábrica de vasos plásticos vai escolher, entre cinco moldes em forma de tronco de cone, o de maior capacidade. O quadro mostra o raio da boca, o raio do fundo e a altura de cada molde, em decímetros. Moldes com os dois raios iguais têm a forma de um cilindro.
    tabela:
      cabecalho: ['Molde', 'Raio da boca', 'Raio do fundo', 'Altura']
      linhas:
      - ['M1', '$5$', '$3$', '$6$']
      - ['M2', '$6$', '$2$', '$6$']
      - ['M3', '$4$', '$4$', '$6$']
      - ['M4', '$7$', '$1$', '$6$']
      - ['M5', '$5$', '$5$', '$4$']
    enunciado: |
      O molde de maior capacidade é o
    opcoes: ['M1.', 'M2.', 'M3.', 'M4.', 'M5.']
    correta: D
    resolucao: |
      Em dm³: M1 $2\pi \cdot 49 = 98\pi$; M2 $2\pi \cdot 52 = 104\pi$; M3 $96\pi$; M4 $2\pi \cdot 57 = 114\pi$; M5 $100\pi$.

  - estilo: Unesp
    enunciado: |
      Um tronco de cone tem volume $56\pi$ e raios 4 e 2. A sua altura é
    opcoes: ['$4$', '$6$', '$8$', '$3$', '$\frac{14}{3}$']
    correta: B
    resolucao: |
      $\tfrac{\pi h}{3}(16 + 8 + 4) = \tfrac{28\pi h}{3} = 56\pi$: $h = 6$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Considere um tronco de cone de raios 8 e 5 e altura 4. Assinale o que for correto.
    proposicoes:
    - 'A geratriz mede 5.'
    - 'O volume é $172\pi$.'
    - 'A área lateral é $65\pi$.'
    - 'A área total é $154\pi$.'
    - 'O cone do qual o tronco foi obtido tem altura 12.'
    - 'A secção meridiana tem área 52.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) $\sqrt{16 + 9}$. 02) $\tfrac{4\pi}{3}(64 + 40 + 25)$. 04) $\pi \cdot 5 \cdot 13$. 08) $65\pi + 64\pi + 25\pi$. 16) Incorreta: $k = \tfrac{5}{8}$, $H - \tfrac{5H}{8} = 4$, $H = \tfrac{32}{3}$. 32) $(8 + 5) \cdot 4$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Unicamp
    enunciado: |
      Um tronco de cone tem raios 9 e 6 e altura 4. A altura do cone do qual ele foi obtido é
    opcoes: ['$12$.', '$8$.', '$10$.', '$6$.']
    correta: A
    resolucao: |
      $k = \tfrac{6}{9} = \tfrac{2}{3}$: $H - \tfrac{2H}{3} = 4$, $H = 12$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Um cinema vende pipoca em baldes de papelão em forma de tronco de cone, com 10 cm de raio na boca, 6 cm de raio no fundo e 15 cm de altura. O balde é vendido cheio até a borda, e o cinema calcula o preço a partir do volume de pipoca. Use 3 como aproximação para $\pi$.
    enunciado: |
      O volume de pipoca de um balde cheio é
    opcoes: ['$3{,}2$ L', '$8{,}82$ L', '$2{,}94$ L', '$4{,}5$ L', '$1{,}96$ L']
    correta: C
    resolucao: |
      $V = \tfrac{15\pi}{3}(100 + 60 + 36) = 980\pi \approx 2940$ cm³ $= 2{,}94$ L.

  - estilo: Unesp
    enunciado: |
      Se o cinema cobra R\$\,10,00 por litro de pipoca, o preço do balde cheio é
    opcoes: ['R\$\,19,60', 'R\$\,32,00', 'R\$\,88,20', 'R\$\,29,40', 'R\$\,45,00']
    correta: D
    resolucao: |
      $2{,}94 \cdot 10 = 29{,}40$ reais.

  - estilo: Fuvest
    enunciado: |
      Um tronco de cone tem raio maior igual ao dobro do raio menor $r$. A razão entre o volume do tronco e o volume do cilindro de raio $r$ e mesma altura é
    opcoes: ['$2$', '$\frac{4}{3}$', '$3$', '$\frac{5}{3}$', '$\frac{7}{3}$']
    correta: E
    resolucao: |
      $\tfrac{\tfrac{\pi h}{3}(4r^2 + 2r^2 + r^2)}{\pi r^2 h} = \tfrac{7}{3}$.

  - estilo: Unesp
    texto: |
      A figura mostra a secção meridiana de um tronco de cone: um trapézio isósceles de bases 16 e 6 e altura 12.
    figura:
      tikz: |
        \begin{scope}[scale=.16]
        \draw[ink, line width=1pt, fill=lilas!25] (0,0) -- (16,0) -- (11,12) -- (5,12) -- cycle;
        \draw[mudo, dashed] (8,0) -- (8,12);
        \node[below, font=\scriptsize] at (8,0) {$16$};
        \node[above, font=\scriptsize] at (8,12) {$6$};
        \node[right, font=\scriptsize] at (8,6) {$12$};
        \end{scope}
    enunciado: |
      A área lateral do tronco é
    opcoes: ['$286\pi$', '$143\pi$', '$110\pi$', '$216\pi$', '$121\pi$']
    correta: B
    resolucao: |
      $R = 8$, $r = 3$: $g = \sqrt{144 + 25} = 13$. $A_L = \pi \cdot 13 \cdot 11 = 143\pi$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Um tronco de cone tem raios $R > r$ e altura $h$. Complete-o com o cone menor, de altura $x$.'
    itens:
    - 'Prove que $x = \frac{hr}{R - r}$.'
    - 'Prove que $V = \frac{\pi h}{3}(R^2 + Rr + r^2)$.'
    - 'Calcule o volume para $R = 5$, $r = 2$ e $h = 6$.'
    espaco: 62
    resolucao: |
      a) Semelhança: $\tfrac{x}{x + h} = \tfrac{r}{R}$, ou seja, $xR = xr + hr$.
      b) $V = \tfrac{\pi}{3}[R^2(x + h) - r^2 x] = \tfrac{\pi}{3}[R^2 h + x(R - r)(R + r)] = \tfrac{\pi}{3}[R^2 h + hr(R + r)]$.
      c) $2\pi(25 + 10 + 4) = 78\pi$.
    resposta: 'c) $78\pi$'

  - estilo: Unicamp
    enunciado: 'Um tronco de cone tem raios $R > r$ e geratriz $g$.'
    itens:
    - 'Prove que a geratriz do cone original é $G = \frac{gR}{R - r}$.'
    - 'Prove que a área lateral do tronco é $\pi g(R + r)$.'
    - 'Para $R = 9$, $r = 3$ e altura 8, calcule $g$, $G$ e a área lateral.'
    espaco: 62
    resolucao: |
      a) Semelhança: $\tfrac{G - g}{G} = \tfrac{r}{R}$, logo $G(R - r) = gR$.
      b) $\pi R G - \pi r(G - g) = \pi G(R - r) + \pi r g = \pi g R + \pi g r$.
      c) $g = \sqrt{64 + 36} = 10$; $G = 15$; $A_L = 120\pi$.
    resposta: 'c) 10; 15; $120\pi$'

  - estilo: ITA
    enunciado: |
      Um cone de raio $R$ é cortado por um plano paralelo à base, de modo que o tronco e o cone menor têm volumes iguais. O raio $r$ da secção é
    opcoes: ['$\frac{R}{2}$', '$\frac{R\sqrt{2}}{2}$', '$\frac{R\sqrt[3]{4}}{2}$', '$\frac{2R}{3}$', '$\frac{R\sqrt[3]{2}}{2}$']
    correta: C
    espaco: 22
    resolucao: |
      O cone menor tem metade do volume: $k^3 = \tfrac{1}{2}$, $k = \tfrac{1}{\sqrt[3]{2}} = \tfrac{\sqrt[3]{4}}{2}$, e $r = kR$.
    resposta: 'C'

  - estilo: Unesp
    texto: |
      Um copo plástico tem a forma de tronco de cone, com 7 cm de raio na boca, 4 cm de raio no fundo e 4 cm de altura.
    enunciado: ''
    itens:
    - 'Calcule a capacidade do copo.'
    - 'Calcule a área de plástico (lateral e fundo).'
    - 'Calcule o volume de água quando ela atinge a metade da altura e compare com a metade da capacidade.'
    espaco: 62
    resolucao: |
      a) $\tfrac{4\pi}{3}(49 + 28 + 16) = 124\pi$ cm³.
      b) $g = \sqrt{16 + 9} = 5$: lateral $\pi \cdot 5 \cdot 11 = 55\pi$; fundo $16\pi$; total $71\pi$ cm².
      c) Na metade da altura, o raio é 5,5: $\tfrac{2\pi}{3}(16 + 22 + 30{,}25) = 45{,}5\pi < 62\pi$.
    resposta: 'a) $124\pi$ cm³; b) $71\pi$ cm²; c) $45{,}5\pi$ cm³'

  - estilo: UFSC
    enunciado: |
      Considere troncos de cone de raios $R$ e $r$, altura $h$ e geratriz $g$. Assinale o que for correto.
    proposicoes:
    - 'Se $R = r$, o tronco é um cilindro.'
    - '$g^2 = h^2 + (R - r)^2$.'
    - 'O tronco de raios 4 e 2 e altura 3 tem volume $28\pi$.'
    - 'O volume é $\pi h \cdot \frac{R^2 + r^2}{2}$.'
    - 'O tronco de raios 4 e 1 e altura 4 tem área lateral $25\pi$.'
    - 'Cortando um cone na metade da altura, o tronco tem $\frac{7}{8}$ do volume do cone.'
    corretas: [1, 2, 3, 5, 6]
    espaco: 22
    resolucao: |
      01) Correta. 02) Correta. 04) $\pi(16 + 8 + 4)$. 08) Incorreta. 16) $g = 5$: $\pi \cdot 5 \cdot 5$. 32) $1 - \tfrac{1}{8}$.
    resposta: 'Soma 55 (01 + 02 + 04 + 16 + 32)'

  - estilo: Fuvest
    enunciado: 'Dois planos paralelos à base dividem a altura de um cone em três partes iguais.'
    itens:
    - 'Prove que os volumes das partes, do vértice para a base, estão na razão $1 : 7 : 19$.'
    - 'Prove que as áreas laterais das partes estão na razão $1 : 3 : 5$.'
    - 'Para um cone de volume $270\pi$ e área lateral $135\pi$, calcule o volume e a área lateral da parte do meio.'
    espaco: 62
    resolucao: |
      a) Cones de razões $\tfrac{1}{3}$, $\tfrac{2}{3}$ e 1: volumes $\tfrac{1}{27}$, $\tfrac{8}{27}$ e 1 do total; diferenças $1 : 7 : 19$.
      b) Áreas laterais na razão $k^2$: $\tfrac{1}{9}$, $\tfrac{4}{9}$ e 1; diferenças $1 : 3 : 5$.
      c) $270\pi \cdot \tfrac{7}{27} = 70\pi$; $135\pi \cdot \tfrac{3}{9} = 45\pi$.
    resposta: 'c) $70\pi$ e $45\pi$'

  - estilo: Unicamp
    enunciado: 'A superfície lateral de um tronco de cone de raios 6 e 4 e geratriz 4 é planificada.'
    itens:
    - 'Calcule a geratriz do cone original.'
    - 'Calcule o ângulo do setor e descreva a planificação do tronco.'
    - 'Calcule a área da planificação e confira com $\pi g(R + r)$.'
    espaco: 62
    resolucao: |
      a) $k = \tfrac{4}{6}$: $G - \tfrac{2G}{3} = 4$, $G = 12$.
      b) $\theta = 360° \cdot \tfrac{6}{12} = 180°$. É meia coroa circular de raios 12 e 8.
      c) $\tfrac{144\pi - 64\pi}{2} = 40\pi = \pi \cdot 4 \cdot 10$.
    resposta: 'a) 12; b) $180°$; c) $40\pi$'

  - estilo: Fuvest
    enunciado: |
      Um tronco de cone de raios 4 e 2 tem o mesmo volume que um cilindro de mesma altura. O raio do cilindro é
    opcoes: ['$3$', '$\sqrt{10}$', '$\frac{2\sqrt{21}}{3}$', '$\sqrt{7}$', '$2\sqrt{3}$']
    correta: C
    espaco: 22
    resolucao: |
      $\pi \rho^2 h = \tfrac{\pi h}{3}(16 + 8 + 4)$: $\rho^2 = \tfrac{28}{3}$, $\rho = \tfrac{2\sqrt{21}}{3}$.
    resposta: 'C'

  - estilo: Unesp
    texto: |
      A cúpula de um abajur é a superfície lateral de um tronco de cone de 20 cm de raio embaixo, 8 cm em cima e 16 cm de altura.
    enunciado: ''
    itens:
    - 'Calcule a área da cúpula, com $\pi \approx 3{,}14$.'
    - 'Com 10\% a mais de tecido para as costuras, quanto tecido comprar?'
    - 'Calcule o ângulo do setor do cone do qual a cúpula faz parte.'
    espaco: 62
    resolucao: |
      a) $g = \sqrt{256 + 144} = 20$; $A_L = \pi \cdot 20 \cdot 28 = 560\pi \approx 1758{,}4$ cm².
      b) $1758{,}4 \cdot 1{,}1 \approx 1934{,}2$ cm².
      c) $k = 0{,}4$: $G - 0{,}4G = 20$, $G = \tfrac{100}{3}$. $\theta = 360° \cdot \tfrac{20}{100/3} = 216°$.
    resposta: 'a) $\approx 1758{,}4$ cm²; b) $\approx 1934$ cm²; c) $216°$'

  - estilo: Fuvest
    enunciado: 'Considere um tronco de cone de raios $R > r$ e altura $h$.'
    itens:
    - 'Prove que o volume do tronco está entre $\pi r^2 h$ e $\pi R^2 h$.'
    - 'Prove que o volume do tronco é maior que o do cilindro de raio $\frac{R + r}{2}$ e altura $h$, mostrando que a diferença é $\frac{\pi h (R - r)^2}{12}$.'
    - 'Calcule essa diferença para $R = 7$, $r = 1$ e $h = 4$.'
    espaco: 62
    resolucao: |
      a) $3r^2 < R^2 + Rr + r^2 < 3R^2$; multiplique por $\tfrac{\pi h}{3}$.
      b) $\tfrac{\pi h}{3}(R^2 + Rr + r^2) - \tfrac{\pi h}{4}(R^2 + 2Rr + r^2) = \tfrac{\pi h}{12}(R^2 - 2Rr + r^2)$.
      c) $\tfrac{4\pi \cdot 36}{12} = 12\pi$.
    resposta: 'c) $12\pi$'
