# Aula 2.13.1 — Trigonometria: lei dos senos
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: a/sen A = b/sen B = c/sen C = 2R; calcular lado com dois ângulos e um lado; calcular ângulo
# (inclusive o caso ambíguo, com duas respostas); raio da circunferência circunscrita; sen(180° − x) = sen x
# para ângulos obtusos (120°, 135°, 150°); distâncias inacessíveis.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Em todo triângulo, $\frac{a}{\operatorname{sen}A} = \frac{b}{\operatorname{sen}B} = \frac{c}{\operatorname{sen}C} = 2R$, em que $R$ é o raio da circunferência circunscrita. Lembre que $\operatorname{sen}(180^\circ - x) = \operatorname{sen}x$. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Num triângulo ABC, $A = 45^\circ$, $B = 30^\circ$ e $b = 6$. Complete.'
      itens:
      - '$C =$ {{105°}}'
      - '$a =$ {{6\sqrt2}}'
      - '$2R =$ {{12}}'
      espaco_item: 8
      resolucao: |
        $C = 180^\circ - 75^\circ$. $\frac{a}{\sqrt2/2} = \frac{6}{1/2} = 12$: $a = 6\sqrt2$ e $2R = 12$.
      resposta: '$105^\circ$; $6\sqrt2$; 12'
    - enunciado: 'Associe cada triângulo ao raio $R$ da circunferência circunscrita a ele.'
      esquerda:
      - 'lado 10 oposto a $30^\circ$'
      - 'lado 6 oposto a $90^\circ$'
      - 'lado $4\sqrt3$ oposto a $60^\circ$'
      - 'lado $5\sqrt2$ oposto a $45^\circ$'
      - 'lado 2 oposto a $30^\circ$'
      direita:
      - '$R = 4$'
      - '$R = 10$'
      - '$R = 2$'
      - '$R = 5$'
      - '$R = 3$'
      resolucao: |
        $2R = \frac{\text{lado}}{\operatorname{sen}(\text{ângulo oposto})}$: $\frac{10}{1/2} = 20$; $\frac{6}{1} = 6$; $\frac{4\sqrt3}{\sqrt3/2} = 8$; $\frac{5\sqrt2}{\sqrt2/2} = 10$; $\frac{2}{1/2} = 4$.
      resposta: 'De cima para baixo: 3, 1, 5, 4, 2'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Em todo triângulo, o maior lado fica oposto ao maior ângulo.'
      - 'Em todo triângulo, $\frac{a}{b} = \frac{A}{B}$.'
      - '$\operatorname{sen}150^\circ = \operatorname{sen}30^\circ$.'
      - 'A lei dos senos só vale para triângulos retângulos.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) (F) Os lados são proporcionais aos senos, não aos ângulos. (V) Ângulos suplementares têm o mesmo seno. (F) Vale para todo triângulo.
      resposta: V, F, V, F
    - enunciado: 'Complete a tabela com a medida de $b$.'
      tabela:
        cabecalho: ['$A$', '$B$', '$a$', '$b$']
        linhas:
        - ['$30^\circ$', '$45^\circ$', '$10$', '${{10\sqrt2}}$']
        - ['$60^\circ$', '$30^\circ$', '$6\sqrt3$', '${{6}}$']
        - ['$45^\circ$', '$60^\circ$', '$4\sqrt2$', '${{4\sqrt3}}$']
        - ['$90^\circ$', '$30^\circ$', '$14$', '${{7}}$']
      resolucao: |
        $b = \frac{a\operatorname{sen}B}{\operatorname{sen}A}$ em cada linha.
      resposta: '$10\sqrt2$; 6; $4\sqrt3$; 7'
    - enunciado: 'Num triângulo, $a = 3$, $b = 3\sqrt2$ e $A = 30^\circ$. Sabendo que $B$ é agudo, calcule $B$.'
      espaco: 8
      resolucao: |
        $\operatorname{sen}B = \frac{3\sqrt2 \cdot \frac12}{3} = \frac{\sqrt2}{2}$: $B = 45^\circ$.
      resposta: '$45^\circ$'
    - enunciado: 'Um triângulo tem um ângulo de $120^\circ$ oposto a um lado de medida 9. Calcule o raio da circunferência circunscrita.'
      espaco: 8
      resolucao: |
        $2R = \frac{9}{\operatorname{sen}120^\circ} = \frac{9}{\sqrt3/2} = 6\sqrt3$: $R = 3\sqrt3$.
      resposta: '$3\sqrt3$'
    - enunciado: 'Os ângulos de um triângulo medem $30^\circ$, $60^\circ$ e $90^\circ$. Em que razão estão os lados opostos a eles?'
      espaco: 8
      resolucao: |
        Proporcionais aos senos: $\frac12 : \frac{\sqrt3}{2} : 1 = 1 : \sqrt3 : 2$.
      resposta: '$1 : \sqrt3 : 2$'
  - nome: Nível 2
    questoes:
    - texto: |
        Num triângulo, Léo escreveu: "$\frac{a}{b} = \frac{\operatorname{sen}B}{\operatorname{sen}A}$".
      enunciado: 'Encontre o erro e corrija.'
      espaco: 8
      resolucao: |
        Ele inverteu: da lei dos senos, $\frac{a}{b} = \frac{\operatorname{sen}A}{\operatorname{sen}B}$. O lado maior acompanha o seno maior.
      resposta: '$\frac{a}{b} = \frac{\operatorname{sen}A}{\operatorname{sen}B}$'
    - enunciado: 'Dois pontos A e B, numa margem de um rio, distam 100 m. Uma árvore C, na outra margem, é vista com $C\hat{A}B = 75^\circ$ e $C\hat{B}A = 60^\circ$. Calcule a distância AC.'
      espaco: 12
      resolucao: |
        $C = 45^\circ$. $\frac{AC}{\operatorname{sen}60^\circ} = \frac{100}{\operatorname{sen}45^\circ}$: $AC = \frac{100\sqrt3/2}{\sqrt2/2} = 50\sqrt6 \approx 122{,}5$ m.
      resposta: '$50\sqrt6 \approx 122{,}5$ m'
    - enunciado: 'Num triângulo, $a = 8$, $A = 30^\circ$ e $B = 120^\circ$. Calcule $b$ e $c$.'
      espaco: 10
      resolucao: |
        $C = 30^\circ$. $b = \frac{8\operatorname{sen}120^\circ}{\operatorname{sen}30^\circ} = 8\sqrt3$; como $C = A$, $c = a = 8$.
      resposta: '$b = 8\sqrt3$, $c = 8$'
    - enunciado: 'Um triângulo está inscrito numa circunferência de raio 5, com $A = 30^\circ$ e $B = 45^\circ$. Complete.'
      itens:
      - '$a =$ {{5}}'
      - '$b =$ {{5\sqrt2}}'
      - '$C =$ {{105°}}'
      espaco_item: 8
      resolucao: |
        $a = 2R\operatorname{sen}A = 10 \cdot \frac12$; $b = 10 \cdot \frac{\sqrt2}{2}$.
      resposta: '5; $5\sqrt2$; $105^\circ$'
    - enunciado: 'Num triângulo, $a = 2b$ e $B = 30^\circ$. Calcule o ângulo $A$.'
      espaco: 8
      resolucao: |
        $\operatorname{sen}A = \frac{a\operatorname{sen}B}{b} = 2 \cdot \frac12 = 1$: $A = 90^\circ$.
      resposta: '$90^\circ$'
    - enunciado: 'Num triângulo, $A = B = 30^\circ$ e $c = 6\sqrt3$. Calcule o perímetro.'
      espaco: 10
      resolucao: |
        $C = 120^\circ$. $a = b = \frac{6\sqrt3 \cdot \frac12}{\sqrt3/2} = 6$. Perímetro: $12 + 6\sqrt3$.
      resposta: '$12 + 6\sqrt3$'
    - enunciado: 'Num triângulo, $a = 5$, $b = 5\sqrt2$ e $A = 30^\circ$. Mostre que há dois triângulos possíveis e dê $B$ e $C$ em cada um.'
      espaco: 12
      resolucao: |
        $\operatorname{sen}B = \frac{5\sqrt2 \cdot \frac12}{5} = \frac{\sqrt2}{2}$: $B = 45^\circ$ ($C = 105^\circ$) ou $B = 135^\circ$ ($C = 15^\circ$). Nos dois casos $A + B < 180^\circ$.
      resposta: '$45^\circ$ e $105^\circ$, ou $135^\circ$ e $15^\circ$'
    - enunciado: 'Num triângulo, o lado oposto ao ângulo de $30^\circ$ mede 7. Qual o diâmetro da circunferência circunscrita?'
      espaco: 8
      resolucao: |
        $2R = \frac{7}{1/2} = 14$.
      resposta: '14'
  - nome: Nível 3
    questoes:
    - enunciado: 'Num triângulo ABC acutângulo, trace a altura relativa ao lado AB e prove que $\frac{a}{\operatorname{sen}A} = \frac{b}{\operatorname{sen}B}$.'
      espaco: 10
      resolucao: |
        A altura $h$ por C forma dois triângulos retângulos: $h = b\operatorname{sen}A$ e $h = a\operatorname{sen}B$. Igualando, $\frac{a}{\operatorname{sen}A} = \frac{b}{\operatorname{sen}B}$.
      resposta: 'Ver resolução'
    - enunciado: 'Num triângulo acutângulo inscrito numa circunferência de raio $R$, prove que $\frac{a}{\operatorname{sen}A} = 2R$.'
      espaco: 10
      resolucao: |
        Trace o diâmetro BD. O ângulo $B\hat{D}C$ enxerga o mesmo arco que $A$, logo mede $A$, e o triângulo BCD é retângulo em C (inscrito num semicírculo). Então $\operatorname{sen}A = \frac{a}{2R}$.
      resposta: 'Ver resolução'
    - enunciado: 'Use a lei dos senos para provar que, se $a = b$, então $A = B$.'
      espaco: 10
      resolucao: |
        $\operatorname{sen}A = \operatorname{sen}B$, então $B = A$ ou $B = 180^\circ - A$. O segundo caso daria $A + B = 180^\circ$, impossível num triângulo. Logo $A = B$.
      resposta: 'Ver resolução'
    - enunciado: 'Sabendo que a área de um triângulo é $\frac{1}{2}ab\operatorname{sen}C$, prove que ela também é $\frac{abc}{4R}$.'
      espaco: 10
      resolucao: |
        Da lei dos senos, $\operatorname{sen}C = \frac{c}{2R}$. Substituindo: $\frac12 ab \cdot \frac{c}{2R} = \frac{abc}{4R}$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que, se um lado de um triângulo inscrito mede exatamente o raio $R$, o ângulo oposto a ele mede $30^\circ$ ou $150^\circ$.'
      espaco: 10
      resolucao: |
        $\operatorname{sen}A = \frac{a}{2R} = \frac{R}{2R} = \frac12$: $A = 30^\circ$ ou $A = 150^\circ$.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Dois postos de observação, A e B, ficam no litoral, a 2 km um do outro. Um navio N é avistado de A sob um ângulo de $45^\circ$ com a linha AB e, de B, sob um ângulo de $105^\circ$, como mostra a figura. A guarda costeira quer saber a distância do posto B até o navio. Use $\sqrt2 \approx 1{,}41$.
    figura:
      tikz: |
        \begin{scope}[scale=.55]
        \draw[mudo] (-.8,0) -- (6.2,0);
        \draw[ink, line width=.9pt] (0,0) -- (3.2,0) -- (4.37,4.37) -- cycle;
        \fill[ink] (0,0) circle (1.6pt) node[below, font=\small] {A};
        \fill[ink] (3.2,0) circle (1.6pt) node[below, font=\small] {B};
        \fill[roxo] (4.37,4.37) circle (2pt) node[above right, font=\small] {N};
        \node[below, font=\small] at (1.6,0) {$2$ km};
        \draw[roxo] (.9,0) arc (0:45:.9); \node[roxo, font=\scriptsize] at (1.4,.42) {$45^\circ$};
        \draw[roxo] (3.2,0) ++(75:.6) arc (75:180:.6); \node[roxo, font=\scriptsize] at (2.75,.62) {$105^\circ$};
        \end{scope}
    enunciado: |
      A distância de B até o navio é de, aproximadamente,
    opcoes: ['$2{,}82$ km', '$2$ km', '$1{,}41$ km', '$3{,}46$ km', '$4$ km']
    correta: A
    resolucao: |
      $N = 30^\circ$. $\frac{BN}{\operatorname{sen}45^\circ} = \frac{2}{\operatorname{sen}30^\circ}$: $BN = 2\sqrt2 \approx 2{,}82$ km.

  - estilo: Fuvest
    enunciado: |
      Num triângulo ABC, $A = 60^\circ$, $B = 45^\circ$ e $a = 6$. A medida de $b$ é
    opcoes: ['$3\sqrt2$', '$2\sqrt6$', '$6\sqrt2$', '$\sqrt6$', '$4\sqrt3$']
    correta: B
    resolucao: |
      $b = \frac{6 \cdot \frac{\sqrt2}{2}}{\frac{\sqrt3}{2}} = \frac{6\sqrt2}{\sqrt3} = 2\sqrt6$.

  - estilo: Unicamp
    enunciado: |
      Num triângulo, o lado oposto a um ângulo de $60^\circ$ mede 12. O raio da circunferência circunscrita mede
    opcoes: ['$4$.', '$12$.', '$4\sqrt3$.', '$8\sqrt3$.']
    correta: C
    resolucao: |
      $2R = \frac{12}{\sqrt3/2} = 8\sqrt3$: $R = 4\sqrt3$.

  - estilo: UEM
    enunciado: |
      Num triângulo ABC, $A = 30^\circ$, $B = 45^\circ$ e $a = 2$. Seja $R$ o raio da circunferência circunscrita. Assinale o que for correto.
    proposicoes:
    - '$C = 105^\circ$.'
    - '$b = 2\sqrt2$.'
    - '$2R = 4$.'
    - '$R = 2$.'
    - '$b < a$.'
    - 'O maior lado do triângulo é $c$.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      02) $b = \frac{2 \cdot \frac{\sqrt2}{2}}{\frac12}$. 04) $\frac{2}{1/2}$. 16) Incorreta: $2\sqrt2 > 2$. 32) $C$ é o maior ângulo.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      Um terreno tem forma de triângulo. Um dos lados mede 50 m e é oposto a um ângulo de $35^\circ$; outro lado é oposto a um ângulo de $80^\circ$. O corretor precisa da medida desse segundo lado para o anúncio e consultou o quadro de senos aproximados abaixo.
    tabela:
      cabecalho: ['Ângulo', '$35^\circ$', '$65^\circ$', '$80^\circ$']
      linhas:
      - ['seno', '$0{,}57$', '$0{,}91$', '$0{,}98$']
    enunciado: |
      O lado oposto ao ângulo de $80^\circ$ mede, aproximadamente,
    opcoes: ['$29$ m', '$45$ m', '$80$ m', '$86$ m', '$98$ m']
    correta: D
    resolucao: |
      $\frac{x}{0{,}98} = \frac{50}{0{,}57}$: $x = \frac{50 \cdot 0{,}98}{0{,}57} \approx 86$ m.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir, sobre um triângulo de lados $a$, $b$, $c$, ângulos opostos $A$, $B$, $C$ e circunferência circunscrita de raio $R$.
    afirmativas:
    - '$\frac{a}{\operatorname{sen}A} = \frac{b}{\operatorname{sen}B} = \frac{c}{\operatorname{sen}C}$.'
    - 'A razão $\frac{a}{\operatorname{sen}A}$ é igual a $R$.'
    - '$\operatorname{sen}120^\circ = \operatorname{sen}60^\circ$.'
    - 'Ao maior ângulo opõe-se o maior lado.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'I e III, apenas.', 'II e IV, apenas.', 'II, III e IV, apenas.', 'I, III e IV, apenas.']
    correta: E
    resolucao: |
      II. Incorreta: a razão é $2R$. As demais estão corretas.

  - estilo: Unesp
    enunciado: |
      Num triângulo, o lado oposto ao ângulo de $30^\circ$ mede 5. O diâmetro da circunferência circunscrita mede
    opcoes: ['$10$', '$5$', '$20$', '$5\sqrt3$', '$10\sqrt3$']
    correta: A
    resolucao: |
      $2R = \frac{5}{1/2} = 10$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      No triângulo ABC da figura, $AB = 10$, o ângulo em B mede $60^\circ$ e o ângulo em C mede $45^\circ$.
    figura:
      tikz: |
        \begin{scope}[scale=.6]
        \draw[ink, line width=.9pt] (0,0) -- (6.83,0) -- (2.5,4.33) -- cycle;
        \node[below left, font=\small] at (0,0) {B}; \node[below right, font=\small] at (6.83,0) {C}; \node[above, font=\small] at (2.5,4.33) {A};
        \node[left, font=\small] at (1.2,2.3) {$10$};
        \draw[roxo] (.9,0) arc (0:60:.9); \node[roxo, font=\scriptsize] at (1.4,.55) {$60^\circ$};
        \draw[roxo] (5.73,0) arc (180:135:1.1); \node[roxo, font=\scriptsize] at (5.25,.38) {$45^\circ$};
        \end{scope}
    enunciado: |
      A medida de AC é
    opcoes: ['$5\sqrt2$.', '$5\sqrt6$.', '$10\sqrt3$.', '$5\sqrt3$.']
    correta: B
    resolucao: |
      $\frac{AC}{\operatorname{sen}60^\circ} = \frac{10}{\operatorname{sen}45^\circ}$: $AC = \frac{10\sqrt3}{\sqrt2} = 5\sqrt6$.

  - estilo: Fuvest
    enunciado: |
      Num triângulo, $\operatorname{sen}A$, $\operatorname{sen}B$ e $\operatorname{sen}C$ estão na razão $3 : 5 : 7$, e o perímetro é 30. O maior lado mede
    opcoes: ['$7$', '$10$', '$14$', '$15$', '$21$']
    correta: C
    resolucao: |
      Os lados são proporcionais aos senos: $3k + 5k + 7k = 30$, $k = 2$. Maior lado: 14.

  - estilo: UFSC
    enunciado: |
      Um triângulo ABC está inscrito numa circunferência de raio 6, com $A = 30^\circ$ e $B = 60^\circ$. Assinale o que for correto.
    proposicoes:
    - '$a = 6$.'
    - '$b = 6\sqrt3$.'
    - '$C = 90^\circ$.'
    - 'O lado $c$ é um diâmetro da circunferência.'
    - 'A área do triângulo é $18\sqrt3$.'
    - 'O perímetro do triângulo é 24.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) $12 \cdot \frac12$. 02) $12 \cdot \frac{\sqrt3}{2}$. 08) $c = 12\operatorname{sen}90^\circ = 12$. 16) $\frac{6 \cdot 6\sqrt3}{2}$. 32) Incorreta: $18 + 6\sqrt3$.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      Duas torres de vigilância florestal, A e B, distam 3 km. Do alto da torre B, o vigia vê um foco de incêndio F numa direção perpendicular à linha AB; da torre A, o mesmo foco é visto sob um ângulo de $60^\circ$ com a linha AB. Os bombeiros querem saber a distância da torre A até o foco.
    enunciado: |
      Essa distância é de
    opcoes: ['$6$ km', '$3$ km', '$3\sqrt3$ km', '$1{,}5$ km', '$4{,}5$ km']
    correta: A
    resolucao: |
      $F = 30^\circ$ e $B = 90^\circ$: $\frac{AF}{\operatorname{sen}90^\circ} = \frac{3}{\operatorname{sen}30^\circ}$, $AF = 6$ km.

  - estilo: UFPR
    enunciado: |
      Num triângulo ABC, $a = 6$ e $A = 30^\circ$. Seja $R$ o raio da circunferência circunscrita. Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - '$2R = 12$.'
    - 'Se $b = 6$, então $B = 60^\circ$.'
    - 'Se $B = 90^\circ$, então $b = 12$.'
    - 'Nenhum lado do triângulo mede mais que 12.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – F – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – V – F.', 'V – F – V – V.']
    correta: E
    resolucao: |
      (V) (F) $\operatorname{sen}B = \frac12$ e $B = 30^\circ$. (V) $b = 2R$. (V) Cada lado é $2R\operatorname{sen}$, e o seno não passa de 1.

  - estilo: Enem
    texto: |
      Um barco navega em linha reta e passa pelos pontos A e B, distantes 4 km. Em A, o comandante mede $30^\circ$ entre a rota e a direção de um farol F; em B, o ângulo entre o prolongamento da rota e a direção do farol é de $60^\circ$, de modo que $A\hat{B}F = 120^\circ$, como na figura. Use $\sqrt3 \approx 1{,}73$.
    figura:
      tikz: |
        \begin{scope}[scale=.5]
        \draw[mudo, dashed] (-.5,0) -- (10,0);
        \draw[ink, line width=.9pt] (0,0) -- (4,0) -- (6,3.46) -- cycle;
        \fill[ink] (0,0) circle (1.6pt) node[below, font=\small] {A};
        \fill[ink] (4,0) circle (1.6pt) node[below, font=\small] {B};
        \fill[roxo] (6,3.46) circle (2.2pt) node[above, font=\small] {F};
        \node[below, font=\small] at (2,0) {$4$ km};
        \draw[roxo] (1.2,0) arc (0:30:1.2); \node[roxo, font=\scriptsize] at (1.75,.38) {$30^\circ$};
        \draw[roxo] (4.8,0) arc (0:60:.8); \node[roxo, font=\scriptsize] at (5.35,.5) {$60^\circ$};
        \end{scope}
    enunciado: |
      A distância de A até o farol é de, aproximadamente,
    opcoes: ['$4$ km', '$2$ km', '$8$ km', '$6{,}9$ km', '$3{,}5$ km']
    correta: D
    resolucao: |
      $F = 30^\circ$. $\frac{AF}{\operatorname{sen}120^\circ} = \frac{4}{\operatorname{sen}30^\circ}$: $AF = 4\sqrt3 \approx 6{,}9$ km.

  - estilo: Unesp
    enunciado: |
      Num triângulo, $\frac{a}{\operatorname{sen}A} = 10$ e $\operatorname{sen}B = 0{,}6$. A medida de $b$ é
    opcoes: ['$16$', '$6$', '$\frac{50}{3}$', '$0{,}6$', '$60$']
    correta: B
    resolucao: |
      $b = 10 \cdot 0{,}6 = 6$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Considere um triângulo ABC, de lados $a$, $b$, $c$ opostos a $A$, $B$, $C$, inscrito numa circunferência de raio $R$. Assinale o que for correto.
    proposicoes:
    - '$\frac{a}{\operatorname{sen}A} = 2R$.'
    - 'Se $A = 90^\circ$, então $a = 2R$.'
    - '$\operatorname{sen}(180^\circ - x) = \operatorname{sen}x$.'
    - 'Se $a = \sqrt2\,b$ e $B = 30^\circ$, então $\operatorname{sen}A = \frac{\sqrt2}{2}$.'
    - 'Todo triângulo com dois lados iguais tem os três ângulos iguais.'
    - 'Se $\operatorname{sen}A = \operatorname{sen}B$, então $A = B$.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      08) $\operatorname{sen}A = \sqrt2 \cdot \frac12$. 16) Incorreta: só dois ângulos são iguais. 32) $A + B = 180^\circ$ é impossível.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Unicamp
    enunciado: |
      Os ângulos de um triângulo estão na razão $1 : 2 : 3$ e o menor lado mede 5. O perímetro do triângulo é
    opcoes: ['$15 + 5\sqrt3$.', '$15$.', '$10 + 5\sqrt3$.', '$15\sqrt3$.']
    correta: A
    resolucao: |
      Ângulos $30^\circ$, $60^\circ$, $90^\circ$; lados na razão $1 : \sqrt3 : 2$: 5, $5\sqrt3$ e 10.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Um terreno triangular ABC fica entre três ruas. O lado BC mede 40 m, e os ângulos internos em A, B e C medem $45^\circ$, $60^\circ$ e $75^\circ$. O arquiteto quer a medida do lado AC e o raio da circunferência que passa pelos três vértices, onde pretende instalar um sistema de irrigação. Use $\sqrt2 \approx 1{,}41$ e $\sqrt6 \approx 2{,}45$.
    enunciado: |
      O lado AC mede, aproximadamente,
    opcoes: ['$40$ m', '$34{,}6$ m', '$49$ m', '$56{,}6$ m', '$69{,}3$ m']
    correta: C
    resolucao: |
      $\frac{AC}{\operatorname{sen}60^\circ} = \frac{40}{\operatorname{sen}45^\circ}$: $AC = 20\sqrt6 \approx 49$ m.

  - estilo: Unesp
    enunciado: |
      O raio da circunferência que passa pelos três vértices mede, aproximadamente,
    opcoes: ['$20$ m', '$40$ m', '$56{,}6$ m', '$28{,}2$ m', '$34{,}6$ m']
    correta: D
    resolucao: |
      $2R = \frac{40}{\operatorname{sen}45^\circ} = 40\sqrt2$: $R = 20\sqrt2 \approx 28{,}2$ m.

  - estilo: Fuvest
    enunciado: |
      Num triângulo, $a = \sqrt3$, $b = 1$ e $B = 30^\circ$. Os possíveis valores de $A$ são
    opcoes: ['apenas $60^\circ$', 'apenas $120^\circ$', '$45^\circ$ ou $135^\circ$', '$30^\circ$ ou $150^\circ$', '$60^\circ$ ou $120^\circ$']
    correta: E
    resolucao: |
      $\operatorname{sen}A = \sqrt3 \cdot \frac12 = \frac{\sqrt3}{2}$: $60^\circ$ ou $120^\circ$; os dois somam menos de $180^\circ$ com $B$.

  - estilo: Unesp
    texto: |
      A figura mostra um triângulo ABC inscrito numa circunferência de centro O, com $BC = 8$ e o ângulo em A de $45^\circ$.
    figura:
      tikz: |
        \begin{scope}[scale=.5]
        \draw[mudo] (0,0) circle (2.83);
        \fill[ink] (0,0) circle (1.3pt) node[right, font=\scriptsize] {O};
        \draw[ink, line width=.9pt] (-2,-2) -- (2,-2) -- (-.9,2.68) -- cycle;
        \node[below left, font=\small] at (-2,-2) {B}; \node[below right, font=\small] at (2,-2) {C}; \node[above, font=\small] at (-.9,2.68) {A};
        \node[below, font=\small] at (0,-2) {$8$};
        \node[roxo, font=\scriptsize] at (-.85,1.75) {$45^\circ$};
        \end{scope}
    enunciado: |
      O raio da circunferência mede
    opcoes: ['$8$', '$4\sqrt2$', '$8\sqrt2$', '$4$', '$2\sqrt2$']
    correta: B
    resolucao: |
      $2R = \frac{8}{\operatorname{sen}45^\circ} = 8\sqrt2$: $R = 4\sqrt2$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Dois pontos A e B, numa margem retilínea de um rio, distam 200 m. Uma árvore C, na outra margem, é vista com $C\hat{A}B = 30^\circ$ e $C\hat{B}A = 120^\circ$.'
    itens:
    - 'Calcule o ângulo em C e a distância BC.'
    - 'Calcule AC pela lei dos senos.'
    - 'Calcule a largura do rio (distância de C à reta AB).'
    espaco: 62
    resolucao: |
      a) $C = 30^\circ = A$: o triângulo é isósceles e $BC = AB = 200$ m.
      b) $\frac{AC}{\operatorname{sen}120^\circ} = \frac{200}{\operatorname{sen}30^\circ}$: $AC = 200\sqrt3 \approx 346$ m.
      c) A perpendicular por C forma com BC um ângulo externo de $60^\circ$ em B: largura $= 200\operatorname{sen}60^\circ = 100\sqrt3 \approx 173$ m.
    resposta: 'a) $30^\circ$ e 200 m; b) $200\sqrt3$ m; c) $100\sqrt3$ m'

  - estilo: Unicamp
    enunciado: 'Num triângulo ABC, $A = 120^\circ$ e $b = c = 4$.'
    itens:
    - 'Calcule $B$ e $C$.'
    - 'Calcule $a$ pela lei dos senos.'
    - 'Calcule o raio da circunferência circunscrita.'
    espaco: 62
    resolucao: |
      a) Isósceles: $B = C = 30^\circ$.
      b) $a = \frac{4\operatorname{sen}120^\circ}{\operatorname{sen}30^\circ} = 4\sqrt3$.
      c) $2R = \frac{4}{\operatorname{sen}30^\circ} = 8$: $R = 4$.
    resposta: 'a) $30^\circ$; b) $4\sqrt3$; c) 4'

  - estilo: ITA
    enunciado: |
      Num triângulo ABC, $a = 4$, $b = 4\sqrt3$ e $A = 30^\circ$. A soma dos valores possíveis de $C$ é
    opcoes: ['$120^\circ$', '$90^\circ$', '$60^\circ$', '$150^\circ$', '$180^\circ$']
    correta: A
    espaco: 22
    resolucao: |
      $\operatorname{sen}B = \frac{4\sqrt3 \cdot \frac12}{4} = \frac{\sqrt3}{2}$: $B = 60^\circ$ ($C = 90^\circ$) ou $B = 120^\circ$ ($C = 30^\circ$). Soma: $120^\circ$.
    resposta: 'A'

  - estilo: Unesp
    enunciado: 'O triângulo de lados 13, 14 e 15 tem área 84.'
    itens:
    - 'Usando $\text{área} = \frac12 ab\operatorname{sen}C$ e a lei dos senos, mostre que $\text{área} = \frac{abc}{4R}$.'
    - 'Calcule o raio $R$ da circunferência circunscrita a esse triângulo.'
    - 'Calcule o seno do ângulo oposto ao lado 14.'
    espaco: 62
    resolucao: |
      a) $\operatorname{sen}C = \frac{c}{2R}$: $\frac12 ab \cdot \frac{c}{2R} = \frac{abc}{4R}$.
      b) $84 = \frac{13 \cdot 14 \cdot 15}{4R}$: $R = \frac{2\,730}{336} = \frac{65}{8}$.
      c) $\operatorname{sen}B = \frac{14}{2R} = \frac{14}{65/4} = \frac{56}{65}$.
    resposta: 'b) $\frac{65}{8}$; c) $\frac{56}{65}$'

  - estilo: UFSC
    enunciado: |
      Considere triângulos inscritos numa circunferência de raio $R$. Assinale o que for correto.
    proposicoes:
    - 'O lado oposto ao ângulo $A$ mede $2R\operatorname{sen}A$.'
    - 'Se um lado é um diâmetro, o triângulo é retângulo.'
    - 'Se $a = R$, então $A = 30^\circ$ ou $A = 150^\circ$.'
    - 'Se $A = 30^\circ$, $B = 60^\circ$ e $a = 3$, então $c = 6$.'
    - 'Se $a = b$, então $\operatorname{sen}A = 2\operatorname{sen}B$.'
    - '$\operatorname{sen}A + \operatorname{sen}B > \operatorname{sen}C$.'
    corretas: [1, 2, 3, 4, 6]
    espaco: 22
    resolucao: |
      02) $\operatorname{sen}A = 1$. 04) $\operatorname{sen}A = \frac12$. 08) $C = 90^\circ$ e $c = 2R = 6$. 16) Incorreta: os senos são iguais. 32) Dividindo $a + b > c$ por $2R$.
    resposta: 'Soma 47 (01 + 02 + 04 + 08 + 32)'

  - estilo: Fuvest
    enunciado: 'Duas estações de radar, A e B, distam 10 km numa costa retilínea. Um navio S é visto com $S\hat{A}B = 45^\circ$ e $S\hat{B}A = 75^\circ$. Use $\operatorname{sen}75^\circ = \frac{\sqrt6 + \sqrt2}{4}$.'
    itens:
    - 'Calcule o ângulo em S e a distância BS.'
    - 'Calcule a distância AS.'
    - 'Calcule a distância do navio até a costa, na forma exata.'
    espaco: 62
    resolucao: |
      a) $S = 60^\circ$. $BS = \frac{10\operatorname{sen}45^\circ}{\operatorname{sen}60^\circ} = \frac{10\sqrt6}{3} \approx 8{,}2$ km.
      b) $AS = \frac{10\operatorname{sen}75^\circ}{\operatorname{sen}60^\circ} = \frac{5(\sqrt6 + \sqrt2)}{\sqrt3} = 5\sqrt2 + \frac{5\sqrt6}{3} \approx 11{,}2$ km.
      c) $BS\operatorname{sen}75^\circ = \frac{10\sqrt6}{3} \cdot \frac{\sqrt6 + \sqrt2}{4} = \frac{5(3 + \sqrt3)}{3} \approx 7{,}9$ km.
    resposta: 'c) $\frac{5(3 + \sqrt3)}{3}$ km'

  - estilo: Unicamp
    enunciado: 'Quer-se construir um triângulo com $b = 10$, $A = 30^\circ$ e o lado $a$ escolhido.'
    itens:
    - 'Calcule a distância do vértice C à reta que contém o lado AB.'
    - 'Para que valores de $a$ não existe triângulo? Para qual existe um só, retângulo?'
    - 'Para que valores de $a$ existem dois triângulos diferentes? E para quais existe exatamente um?'
    espaco: 62
    resolucao: |
      a) $h = 10\operatorname{sen}30^\circ = 5$.
      b) $a < 5$: o lado não alcança a reta; $a = 5$: um só, retângulo em B.
      c) $5 < a < 10$: a circunferência de centro C e raio $a$ corta a reta em dois pontos do mesmo lado de A, dois triângulos. $a \ge 10$: exatamente um.
    resposta: 'b) $a < 5$; $a = 5$; c) $5 < a < 10$; $a \ge 10$'

  - estilo: Fuvest
    enunciado: |
      Um triângulo está inscrito numa circunferência de raio 7, com $A = 30^\circ$ e $B = 45^\circ$. A medida de $b$ é
    opcoes: ['$7$', '$7\sqrt2$', '$14$', '$7\sqrt3$', '$14\sqrt2$']
    correta: B
    espaco: 22
    resolucao: |
      $b = 2R\operatorname{sen}B = 14 \cdot \frac{\sqrt2}{2} = 7\sqrt2$.
    resposta: 'B'

  - estilo: Unesp
    enunciado: 'De um ponto A no chão, o topo T de uma torre é visto sob $30^\circ$. Andando 20 m até um ponto B, em direção à torre, o ângulo passa a $60^\circ$.'
    itens:
    - 'Calcule os ângulos do triângulo ABT.'
    - 'Use a lei dos senos para calcular BT.'
    - 'Calcule a altura da torre.'
    espaco: 62
    resolucao: |
      a) $A = 30^\circ$; o ângulo em B é $180^\circ - 60^\circ = 120^\circ$; em T, $30^\circ$.
      b) $\frac{BT}{\operatorname{sen}30^\circ} = \frac{20}{\operatorname{sen}30^\circ}$: $BT = 20$ m.
      c) $h = BT\operatorname{sen}60^\circ = 10\sqrt3 \approx 17{,}3$ m.
    resposta: 'b) 20 m; c) $10\sqrt3$ m'

  - estilo: Fuvest
    enunciado: 'Seja ABC um triângulo inscrito numa circunferência de raio $R$, com o ângulo $A$ obtuso.'
    itens:
    - 'Trace o diâmetro BD e mostre que $B\hat{D}C = 180^\circ - A$.'
    - 'Conclua que $a = 2R\operatorname{sen}A$ também neste caso.'
    - 'Calcule $a$ para $R = 10$ e $A = 135^\circ$.'
    espaco: 62
    resolucao: |
      a) A e D estão em lados opostos de BC: ABDC é inscrito e seus ângulos opostos somam $180^\circ$.
      b) BCD é retângulo em C: $a = 2R\operatorname{sen}(180^\circ - A) = 2R\operatorname{sen}A$.
      c) $a = 20 \cdot \frac{\sqrt2}{2} = 10\sqrt2$.
    resposta: 'c) $10\sqrt2$'
