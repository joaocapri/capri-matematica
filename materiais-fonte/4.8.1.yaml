# Aula 4.8.1 — Geometria plana: circunferência, elementos e tangência
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: raio, corda, diâmetro, arco; distância do centro à corda (a perpendicular divide a corda ao meio); posições
# relativas de reta e circunferência e de duas circunferências; tangente perpendicular ao raio; tangentes de um ponto externo;
# teorema de Pitot; segmentos tangentes no triângulo (p − a) e raio da inscrita no triângulo retângulo; tangentes comuns
# externa e interna (correias); horizonte. Ângulos na circunferência ficam para a 4.8.2.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Associe cada elemento à sua descrição.'
      esquerda:
      - 'raio'
      - 'corda'
      - 'diâmetro'
      - 'reta secante'
      - 'reta tangente'
      - 'reta exterior'
      direita:
      - 'corda que passa pelo centro'
      - 'reta com um único ponto em comum com a circunferência'
      - 'segmento do centro a um ponto da circunferência'
      - 'reta sem pontos em comum com a circunferência'
      - 'segmento com extremos na circunferência'
      - 'reta que corta a circunferência em dois pontos'
      resolucao: |
        O diâmetro é a corda que passa pelo centro e mede $2r$; as retas se classificam pelo número de pontos comuns: 2, 1 ou 0.
      resposta: 'De cima para baixo: 3, 5, 1, 6, 2, 4'
    - enunciado: 'Sendo $r$ o raio e $d$ a distância do centro à reta, complete com secante, tangente ou exterior.'
      tabela:
        cabecalho: ['$r$', '$d$', 'Posição da reta']
        linhas:
        - ['$5$', '$3$', '{{secante}}']
        - ['$5$', '$5$', '{{tangente}}']
        - ['$4$', '$7$', '{{exterior}}']
        - ['$6$', '$0$', '{{secante}}']
      resolucao: |
        $d < r$: secante; $d = r$: tangente; $d > r$: exterior. Com $d = 0$, a reta passa pelo centro.
      resposta: 'secante; tangente; exterior; secante'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'A reta tangente é perpendicular ao raio no ponto de tangência.'
      - 'Os dois segmentos tangentes traçados de um ponto externo têm a mesma medida.'
      - 'Toda corda passa pelo centro.'
      - 'O diâmetro é a maior corda.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) (V) (F) Só o diâmetro passa pelo centro. (V) Uma corda de distância $d$ ao centro mede $2\sqrt{r^2 - d^2} \le 2r$.
      resposta: V, V, F, V
    - enunciado: 'Numa circunferência de raio 10, complete.'
      itens:
      - 'Corda a 6 do centro: metade da corda {{8}}'
      - 'Corda a 6 do centro: corda {{16}}'
      - 'Corda de medida 12: distância ao centro {{8}}'
      espaco_item: 10
      resolucao: |
        A perpendicular do centro divide a corda ao meio: $\left(\tfrac{c}{2}\right)^2 + d^2 = r^2$. (a) $\sqrt{100 - 36} = 8$. (b) $16$. (c) $\sqrt{100 - 36} = 8$.
      resposta: '8; 16; 8'
    - enunciado: 'Na figura, $PT$ é tangente à circunferência de centro $O$ e raio 8, e $PO = 17$. Calcule $PT$.'
      figura:
        tikz: |
          \begin{scope}[scale=.12]
          \draw[ink, line width=1pt] (0,0) circle (8);
          \fill[ink] (0,0) circle (6pt);
          \coordinate (T) at (3.765,7.059);
          \draw[roxo, line width=1pt] (17,0) -- (T);
          \draw[ink] (0,0) -- (T) (0,0) -- (17,0);
          \node[below, font=\scriptsize] at (0,0) {$O$};
          \node[right, font=\scriptsize] at (17,0) {$P$};
          \node[above, font=\scriptsize] at (T) {$T$};
          \end{scope}
      espaco: 8
      resolucao: |
        $OT \perp PT$: $PT = \sqrt{289 - 64} = 15$.
      resposta: '15'
    - enunciado: 'Duas circunferências têm raios 5 e 3, e $d$ é a distância entre os centros. Complete com a posição relativa.'
      itens:
      - '$d = 10$: {{exteriores}}'
      - '$d = 8$: {{tangentes externas}}'
      - '$d = 4$: {{secantes}}'
      - '$d = 2$: {{tangentes internas}}'
      - '$d = 1$: {{interiores (uma dentro da outra)}}'
      espaco_item: 8
      resolucao: |
        Compare $d$ com $R + r = 8$ e $R - r = 2$: maior que 8, exteriores; igual a 8, tangentes externas; entre 2 e 8, secantes; igual a 2, tangentes internas; menor que 2, uma dentro da outra.
      resposta: 'exteriores; tangentes externas; secantes; tangentes internas; interiores'
    - enunciado: 'O quadrilátero $ABCD$ está circunscrito a uma circunferência, com $AB = 10$, $BC = 13$ e $CD = 12$. Calcule $DA$.'
      espaco: 8
      resolucao: |
        Teorema de Pitot: $AB + CD = BC + DA$. $22 = 13 + DA$: $DA = 9$.
      resposta: '9'
  - nome: Nível 2
    questoes:
    - texto: |
        De um ponto $P$ a 25 cm do centro de uma circunferência de raio 7 cm, Gui calculou o segmento tangente como $\sqrt{25^2 + 7^2}$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 10
      resolucao: |
        A hipotenusa do triângulo retângulo é $PO = 25$, não o segmento tangente: $\sqrt{625 - 49} = 24$ cm.
      resposta: '24 cm'
    - enunciado: 'De um ponto $P$ traçam-se as tangentes $PA$ e $PB$ a uma circunferência de centro $O$, com $A\hat{P}B = 60°$ e $PA = 9$. Calcule o raio e $PO$.'
      espaco: 12
      resolucao: |
        $PO$ é bissetriz: no triângulo retângulo $PAO$, $A\hat{P}O = 30°$. $r = 9\operatorname{tg}30° = 3\sqrt{3}$ e $PO = 2r = 6\sqrt{3}$ (cateto oposto a $30°$ é metade da hipotenusa).
      resposta: '$r = 3\sqrt{3}$; $PO = 6\sqrt{3}$'
    - enunciado: 'A circunferência inscrita no triângulo $ABC$, de lados $AB = 13$, $BC = 14$ e $CA = 15$, toca os lados nos pontos $D \in BC$, $E \in CA$ e $F \in AB$. Complete.'
      itens:
      - '$AF = AE =$ {{7}}'
      - '$BF = BD =$ {{6}}'
      - '$CD = CE =$ {{8}}'
      espaco_item: 8
      resolucao: |
        Com $AF = AE = x$, $BF = BD = y$, $CD = CE = z$: $x + y = 13$, $y + z = 14$, $z + x = 15$. Somando, $x + y + z = 21$ (semiperímetro): $x = 7$, $y = 6$, $z = 8$.
      resposta: '7; 6; 8'
    - enunciado: 'Duas circunferências, de raios 10 e 17, têm os centros a 21 de distância. Calcule a corda comum.'
      espaco: 12
      resolucao: |
        A corda comum é perpendicular à linha dos centros e dividida ao meio por ela. Com meia corda $h$: $\sqrt{100 - h^2} + \sqrt{289 - h^2} = 21$; $h = 8$ dá $6 + 15 = 21$. Corda $16$.
      resposta: '16'
    - enunciado: 'Duas circunferências exteriores têm raios 9 e 4, e os centros estão a 13 de distância. Calcule o segmento de tangente comum externa entre os pontos de tangência.'
      espaco: 10
      resolucao: |
        Transladando a tangente até o centro menor, forma-se um triângulo retângulo de hipotenusa 13 e cateto $9 - 4 = 5$: $\sqrt{169 - 25} = 12$.
      resposta: '12'
    - enunciado: 'Duas circunferências exteriores têm raios 5 e 3, e os centros estão a 17 de distância. Calcule o segmento de tangente comum interna entre os pontos de tangência.'
      espaco: 10
      resolucao: |
        Agora o cateto é a soma dos raios: $\sqrt{289 - 64} = 15$.
      resposta: '15'
    - enunciado: 'Calcule o raio da circunferência inscrita num triângulo retângulo de catetos 9 e 12.'
      espaco: 10
      resolucao: |
        Hipotenusa 15. Do vértice do ângulo reto, as tangentes medem $r$ (forma-se um quadrado): $r = \tfrac{9 + 12 - 15}{2} = 3$.
      resposta: '3'
    - enunciado: 'Duas circunferências concêntricas têm raios $R$ e 6. Uma corda de 16 da maior é tangente à menor. Calcule $R$.'
      espaco: 8
      resolucao: |
        O raio da menor, no ponto de tangência, divide a corda ao meio: $R = \sqrt{36 + 64} = 10$.
      resposta: '10'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que os segmentos tangentes traçados de um ponto externo $P$ a uma circunferência de centro $O$ têm a mesma medida.'
      espaco: 12
      resolucao: |
        Sejam $A$ e $B$ os pontos de tangência. Os triângulos $PAO$ e $PBO$ são retângulos em $A$ e $B$, têm a hipotenusa $PO$ comum e $OA = OB$. Pelo caso especial (hipotenusa e cateto), são congruentes: $PA = PB$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove o teorema de Pitot: num quadrilátero circunscrito a uma circunferência, $AB + CD = BC + DA$.'
      espaco: 12
      resolucao: |
        Sejam $a$, $b$, $c$, $d$ os segmentos tangentes que partem de $A$, $B$, $C$, $D$. Cada lado é a soma de dois: $AB = a + b$, $BC = b + c$, $CD = c + d$, $DA = d + a$. Então $AB + CD = a + b + c + d = BC + DA$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que a perpendicular traçada do centro a uma corda divide essa corda ao meio.'
      espaco: 12
      resolucao: |
        Seja $M$ o pé da perpendicular de $O$ à corda $AB$. Os triângulos $OMA$ e $OMB$ são retângulos em $M$, com $OM$ comum e $OA = OB$: são congruentes, e $MA = MB$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que, num triângulo retângulo de catetos $b$ e $c$ e hipotenusa $a$, o raio da circunferência inscrita é $r = \frac{b + c - a}{2}$.'
      espaco: 12
      resolucao: |
        Os raios aos pontos de tangência nos catetos formam, com o vértice do ângulo reto, um quadrado de lado $r$: os segmentos tangentes desse vértice medem $r$. Os outros vértices dão $b - r$ e $c - r$, que somam a hipotenusa: $(b - r) + (c - r) = a$.
      resposta: 'Ver resolução'
    - enunciado: 'Duas circunferências exteriores têm raios $R$ e $r$ e centros a distância $d$. Prove que o segmento de tangente comum externa mede $\sqrt{d^2 - (R - r)^2}$.'
      espaco: 12
      resolucao: |
        Os raios aos pontos de tangência são paralelos (ambos perpendiculares à tangente). Pelo centro menor, traçando a paralela à tangente, forma-se um retângulo e um triângulo retângulo de hipotenusa $d$ e cateto $R - r$; o outro cateto é igual ao segmento tangente.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Uma correia aberta liga duas polias de raios 15 cm e 6 cm, cujos centros estão a 41 cm de distância, como na figura. Os dois trechos retos da correia são tangentes às duas polias. Para o projeto, o técnico precisa da medida total desses dois trechos retos.
    figura:
      tikz: |
        \begin{scope}[scale=.06]
        \draw[ink, line width=1pt, fill=lilas!25] (0,0) circle (15);
        \draw[ink, line width=1pt, fill=lilas!25] (41,0) circle (6);
        \fill[ink] (0,0) circle (12pt) (41,0) circle (12pt);
        \draw[roxo, line width=1.2pt] (3.29,14.63) -- (42.32,5.85) (3.29,-14.63) -- (42.32,-5.85);
        \end{scope}
    enunciado: |
      A medida total dos trechos retos é
    opcoes: ['$40$ cm', '$41$ cm', '$80$ cm', '$82$ cm', '$76$ cm']
    correta: C
    resolucao: |
      Cada trecho é tangente comum externa: $\sqrt{41^2 - (15 - 6)^2} = \sqrt{1681 - 81} = 40$ cm. Os dois: 80 cm.

  - estilo: Fuvest
    enunciado: |
      De um ponto a 26 cm do centro de uma circunferência de raio 10 cm traça-se uma tangente. O segmento tangente mede
    opcoes: ['$24$ cm', '$16$ cm', '$28$ cm', '$36$ cm', '$20$ cm']
    correta: A
    resolucao: |
      $\sqrt{676 - 100} = 24$ cm.

  - estilo: Unicamp
    enunciado: |
      Numa circunferência de raio 13, uma corda mede 24. A distância da corda ao centro é
    opcoes: ['$5$.', '$12$.', '$13$.', '$7$.']
    correta: A
    resolucao: |
      Meia corda 12: $\sqrt{169 - 144} = 5$.

  - estilo: UEM
    enunciado: |
      Considere circunferências e retas no plano. Assinale o que for correto.
    proposicoes:
    - 'O diâmetro é a maior corda de uma circunferência.'
    - 'A reta tangente é perpendicular ao raio no ponto de tangência.'
    - 'Uma reta a distância 3 do centro de uma circunferência de raio 5 é tangente a ela.'
    - 'Circunferências de raios 4 e 6, com centros a 10 de distância, são tangentes externas.'
    - 'Os dois segmentos tangentes traçados de um ponto externo têm a mesma medida.'
    corretas: [1, 2, 4, 5]
    resolucao: |
      01) Correta. 02) Correta. 04) Incorreta: $3 < 5$, secante. 08) $4 + 6 = 10$. 16) Correta.
      Soma: $01 + 02 + 08 + 16 = 27$.

  - estilo: Enem
    texto: |
      Um disco de 30 cm de raio está encostado, ao mesmo tempo, no chão e numa parede vertical, num canto da sala, como na figura. Um técnico quer saber a menor distância entre o canto (encontro da parede com o chão) e a borda do disco. Use $\sqrt{2} \approx 1{,}41$.
    figura:
      tikz: |
        \begin{scope}[scale=.04]
        \draw[ink, line width=1.2pt] (0,45) -- (0,0) -- (70,0);
        \draw[ink, line width=1pt, fill=lilas!30] (30,30) circle (30);
        \fill[ink] (30,30) circle (25pt);
        \draw[roxo, line width=1pt] (0,0) -- (8.79,8.79);
        \draw[mudo, dashed] (8.79,8.79) -- (30,30);
        \end{scope}
    enunciado: |
      Essa distância é, aproximadamente,
    opcoes: ['$12{,}6$ cm', '$12{,}3$ cm', '$30{,}0$ cm', '$42{,}3$ cm', '$17{,}7$ cm']
    correta: B
    resolucao: |
      O centro está a 30 cm do chão e da parede: dista $30\sqrt{2} \approx 42{,}3$ cm do canto. Tirando o raio: $42{,}3 - 30 = 12{,}3$ cm.

  - estilo: UEL
    enunciado: |
      Duas circunferências têm raios 3 e 5. Considere as afirmativas sobre a posição relativa, conforme a distância $d$ entre os centros.
    afirmativas:
    - 'Se $d = 8$, são tangentes externas.'
    - 'Se $d = 2$, são tangentes internas.'
    - 'Se $d = 1$, são secantes.'
    - 'Se $d = 6$, são secantes.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'III e IV, apenas.', 'I, II e III, apenas.', 'I, II e IV, apenas.', 'I, II, III e IV.']
    correta: D
    resolucao: |
      $R + r = 8$ e $R - r = 2$. I. Correta. II. Correta. III. Incorreta: $1 < 2$, a menor fica dentro da maior, sem contato. IV. $2 < 6 < 8$.

  - estilo: Unesp
    enunciado: |
      Um quadrilátero $ABCD$ está circunscrito a uma circunferência, com $AB = 11$, $BC = 8$ e $CD = 14$. O perímetro do quadrilátero é
    opcoes: ['$33$', '$44$', '$48$', '$52$', '$50$']
    correta: E
    resolucao: |
      Pitot: $DA = 11 + 14 - 8 = 17$. Perímetro $11 + 8 + 14 + 17 = 50$ (o dobro de $AB + CD$).

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      Na figura, $PA$ e $PB$ são tangentes à circunferência de centro $O$ e raio 4, e $A\hat{P}B = 60°$.
    figura:
      tikz: |
        \begin{scope}[scale=.8]
        \draw[ink, line width=1pt] (0,0) circle (1);
        \fill[ink] (0,0) circle (1.2pt);
        \draw[roxo, line width=1pt] (0.5,0.866) -- (2,0) -- (0.5,-0.866);
        \draw[ink] (0.5,0.866) -- (0,0) -- (0.5,-0.866);
        \draw[mudo, dashed] (0,0) -- (2,0);
        \node[left, font=\scriptsize] at (0,0) {$O$};
        \node[right, font=\scriptsize] at (2,0) {$P$};
        \node[above, font=\scriptsize] at (0.5,0.866) {$A$};
        \node[below, font=\scriptsize] at (0.5,-0.866) {$B$};
        \end{scope}
    enunciado: |
      A medida de $PA$ é
    opcoes: ['$4\sqrt{3}$.', '$8$.', '$4$.', '$8\sqrt{3}$.']
    correta: A
    resolucao: |
      $PO$ é bissetriz: $A\hat{P}O = 30°$ e $PO = 2 \cdot OA = 8$. $PA = \sqrt{64 - 16} = 4\sqrt{3}$.

  - estilo: Fuvest
    enunciado: |
      A circunferência inscrita num triângulo de lados 7, 8 e 9 toca o lado de medida 9 num ponto. A distância desse ponto ao vértice comum aos lados 9 e 7 é
    opcoes: ['$3$', '$4$', '$4{,}5$', '$5$', '$6$']
    correta: B
    resolucao: |
      Semiperímetro 12. O segmento tangente de um vértice é $p$ menos o lado oposto a ele. O vértice comum aos lados 9 e 7 é oposto ao lado 8: $12 - 8 = 4$.

  - estilo: UFSC
    enunciado: |
      Duas circunferências têm raios 10 e 17, e os centros estão a 21 de distância. Assinale o que for correto.
    proposicoes:
    - 'As circunferências são secantes.'
    - 'A corda comum mede 16.'
    - 'A corda comum é perpendicular à reta que passa pelos centros.'
    - 'A distância do centro da circunferência menor à corda comum é 6.'
    - 'O segmento de tangente comum externa entre os pontos de tangência mede $14\sqrt{2}$.'
    - 'As circunferências são tangentes internamente.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) $17 - 10 < 21 < 27$. 02) Meia corda 8: $6 + 15 = 21$. 04) A reta dos centros é eixo de simetria. 08) $\sqrt{100 - 64}$. 16) $\sqrt{441 - 49} = \sqrt{392}$. 32) Incorreta.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      Do alto de um farol, um observador avista o horizonte no mar. A linha de visada até o horizonte é tangente à superfície da Terra, considerada uma esfera de raio 6400 km. Os olhos do observador estão a 80 m acima do nível do mar, e ele quer saber a que distância está o horizonte.
    enunciado: |
      A distância do observador ao horizonte é, aproximadamente,
    opcoes: ['$16$ km', '$80$ km', '$32$ km', '$64$ km', '$6{,}4$ km']
    correta: C
    resolucao: |
      Triângulo retângulo com hipotenusa $6400 + 0{,}08$ e cateto $6400$: $d^2 = 2 \cdot 6400 \cdot 0{,}08 + 0{,}08^2 \approx 1024$, $d \approx 32$ km.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'Uma reta tangente tem um único ponto em comum com a circunferência.'
    - 'Se a distância do centro à reta é maior que o raio, a reta é secante.'
    - 'Duas circunferências cuja distância entre os centros é a soma dos raios são tangentes externas.'
    - 'Num quadrilátero circunscrito a uma circunferência, as somas dos lados opostos são iguais.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – V – F.', 'V – F – V – V.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – F – V.']
    correta: B
    resolucao: |
      (V) (F) É exterior. (V) (V) Teorema de Pitot.

  - estilo: Enem
    texto: |
      Um projetista posiciona pares de discos circulares numa placa. O quadro mostra, para cada par, o raio maior $R$, o raio menor $r$ e a distância $d$ entre os centros, em centímetros. Ele precisa do par em que um disco toca o outro por dentro, num único ponto.
    tabela:
      cabecalho: ['Par', '$R$', '$r$', '$d$']
      linhas:
      - ['P1', '$5$', '$3$', '$8$']
      - ['P2', '$6$', '$2$', '$3$']
      - ['P3', '$7$', '$4$', '$3$']
      - ['P4', '$5$', '$5$', '$12$']
      - ['P5', '$6$', '$3$', '$9{,}5$']
    enunciado: |
      O par procurado é o
    opcoes: ['P1.', 'P2.', 'P3.', 'P4.', 'P5.']
    correta: C
    resolucao: |
      Tangência interna: $d = R - r$. P3: $7 - 4 = 3$. (P1 é tangência externa; P2 tem um disco dentro do outro sem contato; P4 e P5 são exteriores.)

  - estilo: Unesp
    enunciado: |
      O raio da circunferência inscrita num triângulo retângulo de catetos 20 e 21 é
    opcoes: ['$4$', '$5$', '$7$', '$6$', '$8$']
    correta: D
    resolucao: |
      Hipotenusa 29: $r = \tfrac{20 + 21 - 29}{2} = 6$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      A circunferência inscrita no triângulo $ABC$, de lados $AB = 13$, $BC = 14$ e $CA = 15$, toca $BC$ em $D$, $CA$ em $E$ e $AB$ em $F$. Assinale o que for correto.
    proposicoes:
    - 'O semiperímetro do triângulo é 21.'
    - '$AF = AE = 7$.'
    - '$BD = 6$.'
    - '$CD = 9$.'
    - 'O raio da circunferência inscrita é 4.'
    corretas: [1, 2, 3, 5]
    resolucao: |
      01) $\tfrac{42}{2}$. 02) $21 - 14$. 04) $21 - 15$. 08) Incorreta: $21 - 13 = 8$. 16) Área 84 (Heron): $r = \tfrac{84}{21}$.
      Soma: $01 + 02 + 04 + 16 = 23$.

  - estilo: Unicamp
    enunciado: |
      Duas circunferências exteriores têm raios 6 e 2, e os centros estão a 10 de distância. O segmento de tangente comum interna, entre os pontos de tangência, mede
    opcoes: ['$6$.', '$8$.', '$2\sqrt{21}$.', '$10$.']
    correta: A
    resolucao: |
      $\sqrt{100 - (6 + 2)^2} = 6$. (A externa mediria $\sqrt{100 - 16} = 2\sqrt{21}$.)

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Duas polias, de raios 21 cm e 3 cm, têm os centros a 30 cm de distância. Elas podem ser ligadas por uma correia aberta, cujos trechos retos são tangentes comuns externas, como na figura, ou por uma correia cruzada, cujos trechos retos são tangentes comuns internas.
    figura:
      tikz: |
        \begin{scope}[scale=.05]
        \draw[ink, line width=1pt, fill=lilas!25] (0,0) circle (21);
        \draw[ink, line width=1pt, fill=lilas!25] (30,0) circle (3);
        \fill[ink] (0,0) circle (15pt) (30,0) circle (15pt);
        \draw[roxo, line width=1.2pt] (12.6,16.8) -- (31.8,2.4) (12.6,-16.8) -- (31.8,-2.4);
        \end{scope}
    enunciado: |
      Na correia aberta, cada trecho reto mede
    opcoes: ['$18$ cm', '$30$ cm', '$20$ cm', '$26$ cm', '$24$ cm']
    correta: E
    resolucao: |
      $\sqrt{30^2 - (21 - 3)^2} = \sqrt{900 - 324} = 24$ cm.

  - estilo: Unesp
    enunciado: |
      Na correia cruzada, cada trecho reto mede
    opcoes: ['$24$ cm', '$12$ cm', '$20$ cm', '$18$ cm', '$15$ cm']
    correta: D
    resolucao: |
      $\sqrt{30^2 - (21 + 3)^2} = \sqrt{900 - 576} = 18$ cm.

  - estilo: Fuvest
    enunciado: |
      Duas circunferências concêntricas têm raios $R$ e 5. Uma corda de 24 da maior é tangente à menor. O valor de $R$ é
    opcoes: ['$12$', '$17$', '$29$', '$\sqrt{119}$', '$13$']
    correta: E
    resolucao: |
      $R^2 = 5^2 + 12^2 = 169$: $R = 13$.

  - estilo: Unesp
    texto: |
      Na figura, a circunferência está inscrita no trapézio isósceles cujas bases medem 18 e 8.
    figura:
      tikz: |
        \begin{scope}[scale=.15]
        \draw[ink, line width=1pt, fill=lilas!20] (0,0) -- (18,0) -- (13,12) -- (5,12) -- cycle;
        \draw[roxo, line width=1pt] (9,6) circle (6);
        \fill[ink] (9,6) circle (8pt);
        \end{scope}
    enunciado: |
      O raio da circunferência é
    opcoes: ['$5$', '$6$', '$12$', '$13$', '$6{,}5$']
    correta: B
    resolucao: |
      Pitot: as laterais somam $18 + 8 = 26$, cada uma 13. Projeção $\tfrac{18 - 8}{2} = 5$; altura $\sqrt{169 - 25} = 12 = 2r$: $r = 6$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere uma circunferência de centro $O$.'
    itens:
    - 'Prove que uma reta perpendicular ao raio $OT$ no ponto $T$ só tem o ponto $T$ em comum com a circunferência.'
    - 'Prove que os dois segmentos tangentes traçados de um ponto externo têm a mesma medida.'
    - 'Prove o teorema de Pitot para um quadrilátero circunscrito.'
    espaco: 62
    resolucao: |
      a) Para qualquer ponto $X \ne T$ da reta, $OX$ é hipotenusa do triângulo retângulo $OTX$: $OX > OT = r$. Logo $X$ está fora da circunferência.
      b) $PAO$ e $PBO$ são retângulos, com hipotenusa comum $PO$ e $OA = OB$: congruentes, e $PA = PB$.
      c) Cada lado é a soma de dois segmentos tangentes de vértices vizinhos; $AB + CD$ e $BC + DA$ somam os quatro segmentos.
    resposta: 'Ver resolução'

  - estilo: Unicamp
    texto: |
      Considere a Terra como uma esfera de raio $R = 6400$ km. Um observador com os olhos a altura $h$ acima do mar avista o horizonte ao longo de uma reta tangente à superfície.
    enunciado: ''
    itens:
    - 'Mostre que a distância ao horizonte é $d = \sqrt{2Rh + h^2}$.'
    - 'Calcule $d$ para uma pessoa na praia, com $h = 1{,}8$ m (despreze $h^2$).'
    - 'A que altura, aproximadamente, deve estar o observador para avistar o horizonte a 48 km?'
    espaco: 62
    resolucao: |
      a) O raio ao ponto de tangência é perpendicular à visada: $(R + h)^2 = R^2 + d^2$, $d^2 = 2Rh + h^2$.
      b) $d \approx \sqrt{2 \cdot 6400 \cdot 0{,}0018} = \sqrt{23{,}04} = 4{,}8$ km.
      c) $2 \cdot 6400 \cdot h \approx 48^2 = 2304$: $h \approx 0{,}18$ km $= 180$ m.
    resposta: 'b) 4,8 km; c) $\approx 180$ m'

  - estilo: ITA
    enunciado: |
      Uma circunferência de raio 2 é tangente aos dois lados de um ângulo de $60°$. Uma segunda circunferência, maior, também é tangente aos dois lados do ângulo e tangente externamente à primeira. O raio da segunda é
    opcoes: ['$4$', '$6$', '$8$', '$3$', '$2 + 2\sqrt{3}$']
    correta: B
    espaco: 22
    resolucao: |
      Os centros estão na bissetriz, que faz $30°$ com cada lado: um centro de raio $\rho$ dista $\tfrac{\rho}{\operatorname{sen}30°} = 2\rho$ do vértice. Tangência: $2r_2 - 2 \cdot 2 = 2 + r_2$, $r_2 = 6$.
    resposta: 'B'

  - estilo: Unesp
    enunciado: 'A circunferência de centro $I$ está inscrita no triângulo $ABC$, de lados $AB = 13$, $BC = 14$ e $CA = 15$.'
    itens:
    - 'Calcule os segmentos tangentes que partem de cada vértice.'
    - 'Calcule o raio, usando a área do triângulo.'
    - 'Calcule a distância $AI$.'
    espaco: 62
    resolucao: |
      a) $p = 21$: de $A$, $21 - 14 = 7$; de $B$, $21 - 15 = 6$; de $C$, $21 - 13 = 8$.
      b) Heron: área 84; $r = \tfrac{84}{21} = 4$.
      c) No triângulo retângulo formado por $A$, $I$ e o ponto de tangência em $AB$: $AI = \sqrt{7^2 + 4^2} = \sqrt{65}$.
    resposta: 'a) 7, 6, 8; b) 4; c) $\sqrt{65}$'

  - estilo: UFSC
    enunciado: |
      Assinale o que for correto.
    proposicoes:
    - 'De um ponto a 25 do centro de uma circunferência de raio 7, o segmento tangente mede 24.'
    - 'Numa circunferência em que uma corda de 10 está a 12 do centro, o raio é 13.'
    - 'Circunferências de raios 2 e 7, com centros a 5 de distância, são tangentes internas.'
    - 'Um triângulo retângulo de hipotenusa 10 com circunferência inscrita de raio 2 tem perímetro 24.'
    - 'O segmento de tangente comum externa a circunferências de raios 5 e 2, com centros a 5 de distância, mede 4.'
    - 'Circunferências de raios 3 e 4, com centros a 8 de distância, são secantes.'
    corretas: [1, 2, 3, 4, 5]
    espaco: 22
    resolucao: |
      01) $\sqrt{625 - 49}$. 02) $\sqrt{25 + 144}$. 04) $7 - 2 = 5$. 08) $b + c = a + 2r = 14$; perímetro $24$. 16) $\sqrt{25 - 9}$. 32) Incorreta: $8 > 7$, exteriores.
    resposta: 'Soma 31 (01 + 02 + 04 + 08 + 16)'

  - estilo: Fuvest
    enunciado: 'Duas circunferências exteriores têm raios $R$ e $r$ ($R > r$) e centros a distância $d$.'
    itens:
    - 'Prove que o segmento de tangente comum externa mede $\sqrt{d^2 - (R - r)^2}$.'
    - 'Prove que o segmento de tangente comum interna mede $\sqrt{d^2 - (R + r)^2}$.'
    - 'Para $R = 9$, $r = 1$ e $d = 10$, calcule os dois segmentos e interprete o resultado da tangente interna.'
    espaco: 62
    resolucao: |
      a) Os raios aos pontos de tangência são paralelos. A paralela à tangente pelo centro menor forma um triângulo retângulo de hipotenusa $d$ e cateto $R - r$.
      b) Agora os raios estão em lados opostos da tangente; a paralela pelo centro menor forma um triângulo retângulo de cateto $R + r$.
      c) Externa: $\sqrt{100 - 64} = 6$. Interna: $\sqrt{100 - 100} = 0$: com $d = R + r$, as circunferências são tangentes externas, e as duas tangentes internas se reduzem à tangente no ponto de contato.
    resposta: 'c) 6 e 0'

  - estilo: Unicamp
    enunciado: 'Um trapézio isósceles de bases $B$ e $b$ está circunscrito a uma circunferência de raio $r$.'
    itens:
    - 'Mostre que cada lateral mede $\frac{B + b}{2}$.'
    - 'Para $B = 16$ e $b = 4$, calcule as laterais, a altura e o raio.'
    - 'Prove que, em geral, a altura é $\sqrt{Bb}$.'
    espaco: 62
    resolucao: |
      a) Pitot: as laterais, iguais, somam $B + b$.
      b) Laterais 10; projeção $\tfrac{16 - 4}{2} = 6$; altura $\sqrt{100 - 36} = 8$; raio 4.
      c) $h^2 = \left(\tfrac{B + b}{2}\right)^2 - \left(\tfrac{B - b}{2}\right)^2 = Bb$.
    resposta: 'b) 10, 8 e 4'

  - estilo: Fuvest
    enunciado: |
      Um quadrilátero $ABCD$ circunscrito a uma circunferência tem perímetro 40, $AB = 12$ e $BC = 7$. A medida de $DA$ é
    opcoes: ['$13$', '$8$', '$12$', '$7$', '$21$']
    correta: A
    espaco: 22
    resolucao: |
      Pitot: $AB + CD = BC + DA = 20$. Então $DA = 20 - 7 = 13$ (e $CD = 8$).
    resposta: 'A'

  - estilo: Unesp
    enunciado: 'Duas circunferências concêntricas têm raios $R$ e $r$, e uma corda $AB$ da maior é tangente à menor.'
    itens:
    - 'Mostre que $\left(\frac{AB}{2}\right)^2 = R^2 - r^2$.'
    - 'Para $R = 13$ e $r = 5$, calcule $AB$.'
    - 'Mostre que a área da coroa é $\pi\left(\frac{AB}{2}\right)^2$ e calcule-a nesse caso.'
    espaco: 62
    resolucao: |
      a) O raio da menor no ponto de tangência $T$ é perpendicular a $AB$ e o divide ao meio: no triângulo $OTA$, $R^2 = r^2 + \left(\tfrac{AB}{2}\right)^2$.
      b) $\tfrac{AB}{2} = 12$, $AB = 24$.
      c) $\pi(R^2 - r^2) = \pi\left(\tfrac{AB}{2}\right)^2 = 144\pi$.
    resposta: 'b) 24; c) $144\pi$'

  - estilo: Fuvest
    enunciado: 'Considere um triângulo retângulo de catetos $b$, $c$ e hipotenusa $a$, e a circunferência inscrita de raio $r$.'
    itens:
    - 'Prove que $r = \frac{b + c - a}{2}$.'
    - 'Prove que também $r = \frac{bc}{a + b + c}$.'
    - 'Calcule $r$ para o triângulo de catetos 9 e 40 pelas duas fórmulas.'
    espaco: 62
    resolucao: |
      a) Do vértice do ângulo reto, as tangentes medem $r$; dos outros vértices, $b - r$ e $c - r$, que somam $a$.
      b) A área é $\tfrac{bc}{2}$ e também $p \cdot r = \tfrac{a + b + c}{2} r$.
      c) Hipotenusa 41: $\tfrac{9 + 40 - 41}{2} = 4$ e $\tfrac{360}{90} = 4$.
    resposta: 'c) 4'
