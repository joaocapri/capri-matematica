    enunciado: |
      O número de cubos da escultura é
    opcoes: ['$9$', '$15$', '$13$', '$11$', '$12$']
    correta: C
    resolucao: |
      $3 + 2 + 1 + 2 + 0 + 1 + 1 + 1 + 2 = 13$.

  - estilo: Unesp
    enunciado: |
      Na vista frontal da escultura, as alturas das colunas, da esquerda para a direita, são
    opcoes: ['$1$, $1$ e $2$', '$3$, $2$ e $1$', '$6$, $3$ e $4$', '$3$, $2$ e $2$', '$2$, $2$ e $3$']
    correta: D
    resolucao: |
      Cada coluna mostra a maior pilha: $\max(3, 2, 1) = 3$, $\max(2, 0, 1) = 2$, $\max(1, 1, 2) = 2$.

  - estilo: Fuvest
    enunciado: |
      O número de planificações distintas de um cubo (desconsiderando rotações e reflexões) é
    opcoes: ['$6$', '$8$', '$24$', '$16$', '$11$']
    correta: E
    resolucao: |
      São 11 arranjos de seis quadrados que, dobrados, formam um cubo.

  - estilo: Unesp
    texto: |
      A figura mostra a planificação de uma pirâmide regular de base quadrada: um quadrado de lado 6 e quatro triângulos isósceles de altura 5 relativa à base.
    figura:
