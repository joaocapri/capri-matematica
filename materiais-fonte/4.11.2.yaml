aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere um cone de raio $r$, altura $h$ e geratriz $g$.'
    itens:
    - 'Mostre que o ângulo do setor da planificação lateral é $\frac{r}{g} \cdot 360°$.'
    - 'Calcule esse ângulo para $r = 5$ e $h = 12$.'
    - 'Que relação entre $r$ e $h$ faz o setor ser um semicírculo?'
    espaco: 62
    resolucao: |
      a) O arco do setor, de raio $g$, mede $2\pi r$; a fração da volta é $\tfrac{2\pi r}{2\pi g}$.
      b) $g = 13$: $\tfrac{5}{13} \cdot 360° \approx 138{,}5°$.
      c) $g = 2r$: $h^2 = 4r^2 - r^2$, $h = r\sqrt{3}$.
    resposta: 'b) $\frac{1800°}{13} \approx 138{,}5°$; c) $h = r\sqrt{3}$'

  - estilo: Unicamp
    texto: |
      Uma formiga anda sobre a superfície de uma caixa de dimensões $a \le b \le c$, de um vértice até o vértice oposto.
    enunciado: ''
    itens:
    - 'Mostre que os caminhos que atravessam duas faces vizinhas medem $\sqrt{(a + b)^2 + c^2}$, $\sqrt{(a + c)^2 + b^2}$ ou $\sqrt{(b + c)^2 + a^2}$.'
    - 'Prove que o menor é $\sqrt{(a + b)^2 + c^2}$.'
    - 'Calcule para a caixa de dimensões 3, 4 e 12.'
    espaco: 62
    resolucao: |
      a) Abrindo as duas faces num retângulo, um lado é a dimensão comum às duas e o outro é a soma das outras duas.
      b) Os quadrados dos três valores são $a^2 + b^2 + c^2 + 2ab$, $\ldots + 2ac$ e $\ldots + 2bc$. O menor produto é $ab$.
      c) $\sqrt{7^2 + 12^2} = \sqrt{193}$.
    resposta: 'c) $\sqrt{193}$'

  - estilo: ITA
    enunciado: |
      Um setor circular de raio 12 e ângulo de $90°$ é enrolado, sem sobreposição, formando a superfície lateral de um cone. A altura desse cone é
    opcoes: ['$3\sqrt{15}$', '$9$', '$3$', '$12$', '$6\sqrt{3}$']
    correta: A
    espaco: 22
    resolucao: |
      $\tfrac{r}{12} \cdot 360° = 90°$: $r = 3$. $h = \sqrt{144 - 9} = \sqrt{135} = 3\sqrt{15}$.
    resposta: 'A'

  - estilo: Unesp
    texto: |
      Num dado, os números de faces opostas somam 7. Considere a planificação em cruz: uma fila de quatro quadrados, com um quadrado acima e outro abaixo do segundo quadrado da fila.
    enunciado: ''
    itens:
    - 'Explique por que o quadrado de cima e o de baixo são faces opostas.'
    - 'Se a fila tem, na ordem, 1, 2, $x$ e $y$, calcule $x$ e $y$.'
    - 'O quadrado de cima é o 3. Qual é o de baixo?'
    espaco: 62
    resolucao: |
      a) Eles se dobram sobre lados opostos do segundo quadrado da fila e ficam um de cada lado do cubo, separados por ele.
      b) Na fila, faces a duas posições são opostas: $x = 7 - 1 = 6$ e $y = 7 - 2 = 5$.
      c) $7 - 3 = 4$.
    resposta: 'b) $x = 6$, $y = 5$; c) 4'

  - estilo: UFSC
    enunciado: |
      Considere planificações e vistas. Assinale o que for correto.
    proposicoes:
    - 'Um setor de $180°$ e raio 10, enrolado, forma um cone de raio 5.'
    - 'A planificação de um tetraedro regular pode ser um triângulo equilátero de lado igual ao dobro da aresta.'
    - 'O menor caminho sobre um cubo de aresta 1 entre vértices opostos mede $\sqrt{3}$.'
    - 'A vista frontal de uma pirâmide regular de base quadrada, em pé, é um triângulo.'
    - 'A superfície lateral de um prisma hexagonal se planifica em 6 retângulos.'
    - 'Toda vista de um cilindro é um retângulo.'
    corretas: [1, 2, 4, 5]
    espaco: 22
    resolucao: |
      01) $\tfrac{r}{10} \cdot 360° = 180°$. 02) Dobrando pelas bases médias. 04) Incorreta: $\sqrt{3}$ atravessa o interior; pela superfície, $\sqrt{5}$. 08) Correta. 16) Correta. 32) Incorreta: a vista na direção do eixo é um círculo.
    resposta: 'Soma 27 (01 + 02 + 08 + 16)'

  - estilo: Fuvest
    texto: |
      Uma pirâmide regular de base quadrada tem aresta da base 10 e altura 12.
    enunciado: ''
    itens:
    - 'Calcule a altura dos triângulos da planificação (apótema da pirâmide).'
    - 'Calcule a aresta lateral.'
    - 'Calcule a área total de papel da planificação.'
    espaco: 62
    resolucao: |
      a) $\sqrt{12^2 + 5^2} = 13$.
      b) $\sqrt{13^2 + 5^2} = \sqrt{194}$.
      c) $100 + 4 \cdot \tfrac{10 \cdot 13}{2} = 360$.
    resposta: 'a) 13; b) $\sqrt{194}$; c) 360'

  - estilo: Unicamp
    texto: |
      Um cilindro tem raio 3 e altura 8. Uma fita é enrolada na superfície lateral, dando uma volta completa, de um ponto da borda inferior até o ponto da borda superior exatamente acima dele.
    enunciado: ''
    itens:
    - 'Desenhe (descreva) a fita na planificação lateral.'
    - 'Calcule o comprimento mínimo da fita.'
    - 'E se a fita desse duas voltas completas?'
    espaco: 62
    resolucao: |
      a) Na planificação, um retângulo de $6\pi$ por 8; a fita é a diagonal.
      b) $\sqrt{36\pi^2 + 64}$.
      c) Duas planificações lado a lado: $\sqrt{144\pi^2 + 64}$.
    resposta: 'b) $\sqrt{36\pi^2 + 64}$; c) $\sqrt{144\pi^2 + 64}$'

  - estilo: Fuvest
    enunciado: |
      Um setor de $240°$ e raio 9 é enrolado, sem sobreposição, formando a superfície lateral de um cone. O raio da base do cone é
    opcoes: ['$6$', '$3$', '$9$', '$4{,}5$', '$12$']
    correta: A
    espaco: 22
    resolucao: |
      $\tfrac{r}{9} \cdot 360° = 240°$: $r = 6$.
    resposta: 'A'

  - estilo: Unesp
    texto: |
      A vista superior de uma pilha de cubos iguais de aresta 1 mostra, em cada posição de uma grade $2 \times 2$, as alturas 3 e 1 (linha de trás) e 2 e 2 (linha da frente).
    enunciado: ''
    itens:
    - 'Quantos cubos há?'
    - 'Descreva as vistas frontal e lateral direita (alturas das colunas).'
    - 'Calcule o volume e a área da vista superior.'
    espaco: 62
    resolucao: |
      a) $3 + 1 + 2 + 2 = 8$.
      b) Frontal: colunas da esquerda e da direita com alturas $\max(3, 2) = 3$ e $\max(1, 2) = 2$. Lateral direita (olhando da direita, a coluna da frente fica à esquerda): $\max(2, 2) = 2$ e $\max(3, 1) = 3$.
      c) Volume 8; a vista superior é o quadrado $2 \times 2$, de área 4.
    resposta: 'a) 8; c) 8 e 4'

  - estilo: Fuvest
    enunciado: 'Considere planificações do cubo.'
    itens:
    - 'Explique por que nenhuma planificação do cubo tem 5 quadrados numa mesma fila.'
    - 'Explique por que nenhuma planificação contém um bloco $2 \times 2$ de quadrados.'
    - 'Desenhe (descreva) duas planificações diferentes com uma fila de 4 quadrados.'
    espaco: 62
    resolucao: |
      a) Numa fila, as faces 1 e 3 são opostas e as faces 1 e 5 coincidiriam no mesmo lugar ao dobrar (a fila de 4 já dá a volta completa).
      b) Os quatro quadrados se encontram num vértice da planificação; ao dobrar, três faces cobrem os $360°$ e a quarta sobraria (num vértice do cubo há só 3 faces).
      c) A cruz (um quadrado acima e um abaixo do segundo) e o “T” deslocado (um quadrado acima do primeiro e outro abaixo do quarto), entre outras.
    resposta: 'Ver resolução'
