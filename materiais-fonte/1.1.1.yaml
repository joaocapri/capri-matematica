padrao: 3
fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. O gabarito resolvido está no final.
  secoes:
    - nome: Nível 1
      questoes:
        - enunciado: 'Complete a tabela. Lembre: sinais iguais no produto dão resultado positivo; sinais diferentes, negativo.'
          tabela:
            cabecalho: ['$a$', '$b$', '$a+b$', '$a\cdot b$']
            linhas:
              - ['$-7$', '$3$', '{{-4}}', '{{-21}}']
              - ['$-4$', '$-6$', '{{-10}}', '{{24}}']
              - ['$5$', '$-8$', '{{-3}}', '{{-40}}']
              - ['$-9$', '$-1$', '{{-10}}', '{{9}}']
          resolucao: |
            Na soma de sinais diferentes, subtraia os valores absolutos e fique com o sinal do maior: $-7+3=-4$, $5+(-8)=-3$.
            Na soma de sinais iguais, some e mantenha o sinal: $-4+(-6)=-10$, $-9+(-1)=-10$.
            No produto: $(-7)\cdot3=-21$, $(-4)(-6)=24$, $5\cdot(-8)=-40$, $(-9)(-1)=9$.
          resposta: '$-4,\,-21$; $\ -10,\,24$; $\ -3,\,-40$; $\ -10,\,9$'
        - enunciado: 'Marque V (verdadeiro) ou F (falso).'
          afirmacoes:
            - 'Todo número natural também é um número inteiro.'
            - 'O produto de dois números inteiros negativos é negativo.'
            - '$-3$ é maior que $-8$.'
            - 'A diferença entre dois números naturais é sempre um número natural.'
            - 'O zero é um número natural.'
          justificar: true
          espaco: 16
          resolucao: |
            (V) $\mathbb{N}\subset\mathbb{Z}$. (F) Negativo vezes negativo dá positivo: $(-2)(-3)=6$.
            (V) Na reta, $-3$ fica à direita de $-8$. (F) $3-5=-2$ não é natural. (V) No Brasil, $\mathbb{N}=\{0,1,2,\dots\}$.
          resposta: 'V, F, V, F, V'
        - enunciado: 'Calcule.'
          itens: ['$-8+15$', '$-6-9$', '$14-(-5)$', '$-20+(-7)$']
          colunas: 2
          espaco_item: 12
          resolucao: |
            (a) $15-8=7$. (b) $-(6+9)=-15$. (c) Subtrair $-5$ é somar $5$: $14+5=19$. (d) $-20-7=-27$.
          resposta: '(a) $7$ (b) $-15$ (c) $19$ (d) $-27$'
        - enunciado: 'Sem fazer a conta inteira, descubra o sinal de cada resultado e associe.'
          esquerda: ['resultado positivo', 'resultado negativo', 'resultado igual a zero']
          direita: ['$(-3)\cdot(-7)$', '$(-18):3$', '$-5+5$', '$(-4)\cdot(-2)\cdot(-1)$', '$0\cdot(-9)$', '$(-24):(-6)$']
          resolucao: |
            Conte os fatores negativos: número par dá positivo, ímpar dá negativo. Qualquer produto com $0$ é zero.
            $(-3)(-7)=21$; $(-18):3=-6$; $-5+5=0$; $(-4)(-2)(-1)=-8$; $0\cdot(-9)=0$; $(-24):(-6)=4$.
          resposta: 'De cima para baixo: $1,\ 2,\ 3,\ 2,\ 3,\ 1$'
        - enunciado: 'Escreva os números $-5,\ 3,\ -12,\ 0,\ 7,\ -1$ em ordem crescente: $\ {{-12}}<{{-5}}<{{-1}}<{{0}}<{{3}}<{{7}}$'
          resolucao: |
            Na reta numérica, quanto mais à esquerda, menor. Entre negativos, o de maior valor absoluto é o menor.
          resposta: '$-12<-5<-1<0<3<7$'
        - enunciado: 'Na reta numérica, qual é a distância entre:'
          itens: ['$-7$ e $5$', '$-9$ e $-2$']
          colunas: 2
          espaco_item: 14
          resolucao: |
            Distância é o maior menos o menor. (a) $5-(-7)=12$. (b) $-2-(-9)=7$.
          resposta: '(a) $12$ (b) $7$'
        - enunciado: 'Às 6 h, um termômetro marcava $-4\ ^\circ\text{C}$. Até o meio-dia, a temperatura subiu $11\ ^\circ\text{C}$ e, até a noite, caiu $9\ ^\circ\text{C}$. Qual era a temperatura à noite?'
          espaco: 20
          resolucao: |
            $-4+11=7$ ao meio-dia; $7-9=-2$ à noite.
          resposta: '$-2\ ^\circ\text{C}$'
    - nome: Nível 2
      questoes:
        - enunciado: 'Calcule.'
          itens: ['$(-3)\cdot(+4)\cdot(-5)$', '$(-2)\cdot(-3)\cdot(-4)$', '$(-72):(-8)$', '$56:(-7)$']
          colunas: 2
          espaco_item: 12
          resolucao: |
            (a) Dois negativos: positivo, $3\cdot4\cdot5=60$. (b) Três negativos: negativo, $-24$.
            (c) Sinais iguais: $9$. (d) Sinais diferentes: $-8$.
          resposta: '(a) $60$ (b) $-24$ (c) $9$ (d) $-8$'
        - enunciado: 'Calcule $-3\cdot(-4)-12:(-3)+(-5)$ completando os passos. Multiplicações e divisões vêm antes.'
          itens:
            - '$-3\cdot(-4)={{12}}$'
            - '$12:(-3)={{-4}}$'
            - '$12-({{-4}})+(-5)={{11}}$'
          resolucao: |
            $-3\cdot(-4)=12$ e $12:(-3)=-4$. Depois: $12-(-4)+(-5)=12+4-5=11$.
          resposta: '$11$'
        - texto: |
            Pedro calculou assim: $-2-3\cdot(-4)=-5\cdot(-4)=20$.
          enunciado: 'Encontre o erro de Pedro e faça a conta corretamente.'
          espaco: 22
          resolucao: |
            Pedro fez a subtração antes da multiplicação. O certo é multiplicar primeiro: $-3\cdot(-4)=12$.
            Então $-2+12=10$.
          resposta: 'O erro foi a ordem das operações; o resultado é $10$'
        - enunciado: 'Ana tinha R\$\,250,00 na conta. Pagou três boletos de R\$\,120,00 cada e depois recebeu um Pix de R\$\,80,00. Qual é o saldo final da conta? O que esse sinal significa?'
          espaco: 22
          resolucao: |
            $250-3\cdot120+80=250-360+80=-30$.
            O saldo negativo indica que Ana está devendo R\$\,30,00 ao banco.
          resposta: '$-30$ reais (Ana deve R\$\,30,00)'
        - enunciado: 'Num quadrado mágico, a soma de cada linha, de cada coluna e de cada diagonal é a mesma. Complete o quadrado abaixo, em que essa soma é $-3$.'
          tabela:
            linhas:
              - ['$2$', '{{-5}}', '$0$']
              - ['{{-3}}', '$-1$', '$1$']
              - ['$-2$', '$3$', '{{-4}}']
          resolucao: |
            1ª linha: $2+x+0=-3$, logo $x=-5$. 2ª linha: $y-1+1=-3$, logo $y=-3$. 3ª linha: $-2+3+z=-3$, logo $z=-4$.
            Confira as colunas: $2-3-2=-3$, $-5-1+3=-3$, $0+1-4=-3$.
          resposta: 'Os números que faltam são $-5$, $-3$ e $-4$'
        - enunciado: 'Descubra o número $x$ em cada caso.'
          itens: ['$x+(-7)=-2$', '$x-9=-15$', '$-4x=28$', '$x:(-3)=6$']
          colunas: 2
          espaco_item: 12
          resolucao: |
            (a) $x=-2+7=5$. (b) $x=-15+9=-6$. (c) $x=28:(-4)=-7$. (d) $x=6\cdot(-3)=-18$.
          resposta: '(a) $5$ (b) $-6$ (c) $-7$ (d) $-18$'
        - enunciado: 'Num prédio, o térreo é o andar $0$ e os subsolos são $-1$, $-2$ e $-3$. Uma pessoa está no $-2$, sobe $9$ andares e depois desce $4$.'
          itens: ['Em que andar ela está?', 'Quantos andares separam o $7^\circ$ andar do $3^\circ$ subsolo?']
          resolucao: |
            (a) $-2+9-4=3$: ela está no $3^\circ$ andar.
            (b) $7-(-3)=10$ andares.
          resposta: '(a) $3^\circ$ andar (b) $10$ andares'
        - enunciado: 'A soma de dois números inteiros é $-3$ e o produto é $-40$. Quais são esses números?'
          espaco: 22
          resolucao: |
            O produto negativo diz que os sinais são diferentes; a soma negativa, que o negativo tem o maior valor absoluto.
            Pares com produto $40$: $1\cdot40$, $2\cdot20$, $4\cdot10$, $5\cdot8$. A diferença $3$ aparece em $5$ e $8$: os números são $5$ e $-8$.
          resposta: '$5$ e $-8$'
    - nome: Nível 3
      questoes:
        - enunciado: 'Num quiz de 20 questões, cada acerto vale $+5$ pontos, cada erro vale $-3$ e questão em branco vale $0$.'
          itens: ['Bia acertou $12$ e errou $6$. Quantos pontos fez?', 'Caio respondeu todas e fez $36$ pontos. Quantas acertou?']
          colunas: 2
          espaco_item: 26
          resolucao: |
            (a) $12\cdot5+6\cdot(-3)=60-18=42$ pontos.
            (b) Com $a$ acertos e $20-a$ erros: $5a-3(20-a)=36\iff 8a-60=36\iff a=12$. (Tentativas também funcionam: $12$ acertos e $8$ erros dão $60-24=36$.)
          resposta: '(a) $42$ pontos (b) $12$ acertos'
        - enunciado: 'O produto de cinco números inteiros, todos diferentes de zero, é negativo. Quantos desses números podem ser negativos? Explique.'
          espaco: 22
          resolucao: |
            Cada par de negativos dá um produto positivo. Para o resultado ser negativo, sobra um negativo sem par: a quantidade de negativos é ímpar.
            Logo, podem ser $1$, $3$ ou $5$ números negativos.
          resposta: '$1$, $3$ ou $5$ (uma quantidade ímpar)'
        - enunciado: 'Observe a sequência $-20,\ -17,\ -14,\ -11,\ \dots$, em que cada termo é o anterior mais $3$.'
          itens: ['Qual é o $10^\circ$ termo?', 'Qual é o primeiro termo positivo, e que posição ele ocupa?']
          colunas: 2
          espaco_item: 22
          resolucao: |
            (a) Do $1^\circ$ ao $10^\circ$ termo somamos $3$ nove vezes: $-20+27=7$.
            (b) $-20+3\cdot6=-2$ (7º termo) e $-20+3\cdot7=1$ (8º termo). O primeiro positivo é $1$, na $8^\text{a}$ posição.
          resposta: '(a) $7$ (b) $1$, no $8^\circ$ termo'
        - enunciado: 'Tóquio está $9$ horas adiantada em relação ao horário de Greenwich, e São Paulo está $3$ horas atrasada. Quando são $20$ h de uma segunda-feira em São Paulo, que horas são em Tóquio?'
          espaco: 22
          resolucao: |
            A diferença entre as cidades é $9-(-3)=12$ horas, com Tóquio à frente.
            $20+12=32$, ou seja, $8$ h do dia seguinte.
          resposta: '$8$ h de terça-feira'
        - texto: |
            A tabela mostra as temperaturas mínima e máxima de uma cidade serrana em quatro dias de inverno.
          tabela:
            cabecalho: ['Dia', 'Mínima ($^\circ$C)', 'Máxima ($^\circ$C)']
            linhas:
              - ['Segunda', '$-6$', '$4$']
              - ['Terça', '$-2$', '$9$']
              - ['Quarta', '$-11$', '$1$']
              - ['Quinta', '$3$', '$12$']
          enunciado: 'Responda.'
          itens: ['Em que dia a variação entre mínima e máxima foi maior? De quanto?', 'Qual é a diferença entre a maior máxima e a menor mínima dos quatro dias?']
          resolucao: |
            (a) Variações: $4-(-6)=10$, $9-(-2)=11$, $1-(-11)=12$, $12-3=9$. A maior foi na quarta, $12\ ^\circ$C.
            (b) $12-(-11)=23\ ^\circ$C.
          resposta: '(a) Quarta, $12\ ^\circ$C (b) $23\ ^\circ$C'
vestibular:
  intro: Questões autorais no estilo dos vestibulares e do Enem, das diretas às com mais leitura. Nas objetivas, assinale uma alternativa. Nas somatórias, some os números das proposições corretas.
  questoes:
    - enunciado: 'O valor de $(-3)\cdot(-4)-(-5)\cdot2$ é'
      opcoes: ['$-22$', '$-2$', '$2$', '$12$', '$22$']
      correta: E
      resolucao: |
        $(-3)(-4)=12$ e $(-5)\cdot2=-10$. Então $12-(-10)=22$.
    - texto: |
        Em uma cidade da Serra Catarinense, o termômetro marcava $-7\ ^\circ$C às 5 h da manhã. Até o meio-dia, a temperatura subiu $15\ ^\circ$C e, ao longo da tarde e da noite, caiu $10\ ^\circ$C.
      enunciado: 'A temperatura registrada à noite foi de'
      opcoes: ['$-12\ ^\circ$C', '$-8\ ^\circ$C', '$-2\ ^\circ$C', '$2\ ^\circ$C', '$8\ ^\circ$C']
      correta: C
      resolucao: |
        $-7+15=8$ ao meio-dia e $8-10=-2$ à noite.
    - enunciado: 'Assinale a igualdade verdadeira.'
      opcoes: ['$-5-3=-2$', '$(-6):(-2)=-3$', '$(-4)\cdot(-5)=20$', '$-7+10=-3$', '$0-(-4)=-4$']
      correta: C
      resolucao: |
        Negativo vezes negativo é positivo: $(-4)(-5)=20$. As outras: $-8$, $3$, $3$ e $4$.
    - texto: |
        Num campeonato escolar de futebol, o saldo de gols de um time é a diferença entre os gols marcados e os gols sofridos. A tabela mostra os números de cinco times ao fim da primeira fase.
      tabela:
        cabecalho: ['Time', 'Gols marcados', 'Gols sofridos']
        linhas:
          - ['A', '$12$', '$15$']
          - ['B', '$9$', '$4$']
          - ['C', '$7$', '$11$']
          - ['D', '$10$', '$10$']
          - ['E', '$6$', '$8$']
      enunciado: 'O time com o menor saldo de gols é o'
      opcoes: ['time A', 'time B', 'time C', 'time D', 'time E']
      correta: C
      resolucao: |
        Saldos: A: $-3$; B: $5$; C: $-4$; D: $0$; E: $-2$. O menor é $-4$, do time C.
    - enunciado: 'Sobre os números inteiros, assinale o que for correto.'
      proposicoes:
      - '$-8<-3$.'
      - 'O oposto de $-6$ é $6$.'
      - 'O módulo de $-9$ é $-9$.'
      - 'O produto de dois números negativos é positivo.'
      - 'A soma de dois números negativos pode ser positiva.'
      corretas: [1, 2, 4]
      resolucao: |
        01: $-8$ está à esquerda de $-3$. 02: o oposto troca o sinal. 04 errada: $|-9|=9$, módulo é distância e não é negativo.
        08 correta. 16 errada: somar negativos dá negativo. Soma: $01+02+08=11$.
    - texto: |
        Um prédio comercial tem três subsolos de garagem, numerados $-1$, $-2$ e $-3$, o térreo (andar $0$) e $12$ andares. Um entregador estaciona no $-3$, sobe $11$ andares, desce $5$ para uma segunda entrega e, por fim, sobe mais $4$.
      enunciado: 'A última entrega foi feita no andar'
      opcoes: ['$4$', '$5$', '$6$', '$7$', '$8$']
      correta: D
      resolucao: |
        $-3+11-5+4=7$.
    - enunciado: 'Se $a=-2$, $b=3$ e $c=-4$, o valor de $a\cdot b-c$ é'
      opcoes: ['$-10$', '$-2$', '$2$', '$10$', '$24$']
      correta: B
      resolucao: |
        $a\cdot b=-6$ e $-6-(-4)=-6+4=-2$.
    - texto: |
        Joana acompanha a conta da sua confeitaria pelo aplicativo do banco. No início do mês, o saldo era de R\$\,340,00. Depois vieram as movimentações abaixo, nesta ordem.
      tabela:
        cabecalho: ['Movimentação', 'Valor (R\$)']
        linhas:
          - ['Compra de farinha e açúcar', '$-180$']
          - ['Conta de luz', '$-95$']
          - ['Encomenda de bolo', '$+120$']
          - ['Aluguel do forno', '$-230$']
      enunciado: 'Ao final, o saldo da conta era de'
      opcoes: ['$-45$ reais', '$-15$ reais', '$15$ reais', '$45$ reais', '$85$ reais']
      correta: A
      resolucao: |
        $340-180-95+120-230=-45$. A conta ficou negativa em R\$\,45,00.
    - texto: |
        Numa gincana de perguntas com $15$ questões, cada acerto vale $+4$ pontos, cada erro vale $-2$ pontos e cada questão deixada em branco vale $0$. Bia acertou $9$ questões, errou $4$ e deixou $2$ em branco.
      enunciado: 'Assinale o que for correto.'
      proposicoes:
      - 'Bia fez $28$ pontos.'
      - 'Se tivesse deixado em branco as $4$ que errou, Bia teria feito $36$ pontos.'
      - 'Quem erra todas as questões termina com $-30$ pontos.'
      - 'É possível terminar a gincana com exatamente $-1$ ponto.'
      - 'Quem acerta $10$ e erra $5$ faz $30$ pontos.'
      corretas: [1, 2, 3, 5]
      resolucao: |
        01: $9\cdot4-4\cdot2=36-8=28$. 02: $9\cdot4=36$. 04: $15\cdot(-2)=-30$.
        08 errada: $+4$, $-2$ e $0$ são pares, então toda pontuação é par. 16: $40-10=30$. Soma: $01+02+04+16=23$.
    - texto: |
        O horário de Brasília está $3$ horas atrasado em relação ao horário de Greenwich, e o de Tóquio, $9$ horas adiantado. Um voo sai do Rio de Janeiro às $22$ h de um sábado, pelo horário de Brasília, e chega a Tóquio $24$ horas depois, contando a escala.
      enunciado: 'Pelo horário de Tóquio, o voo chega às'
      opcoes: ['$10$ h de domingo', '$22$ h de domingo', '$7$ h de segunda-feira', '$10$ h de segunda-feira', '$22$ h de segunda-feira']
      correta: D
      resolucao: |
        Tóquio está $9-(-3)=12$ horas à frente. Na partida, em Tóquio são $22+12=34$ h de sábado, ou seja, $10$ h de domingo.
        Somando as $24$ horas de viagem: $10$ h de segunda-feira.
    - enunciado: 'O resultado de $-2-3\cdot(-4)+18:(-6)$ é'
      opcoes: ['$-23$', '$-13$', '$3$', '$7$', '$17$']
      correta: D
      resolucao: |
        Primeiro multiplicação e divisão: $-3\cdot(-4)=12$ e $18:(-6)=-3$. Depois: $-2+12-3=7$.
    - texto: |
        Na reta numérica abaixo, os pontos $P$ e $Q$ correspondem aos números $-7$ e $5$. Um ponto $M$ será marcado exatamente no meio do caminho entre $P$ e $Q$.
      figura:
        tikz: |
          \draw[-latex,ink!70] (-0.4,0) -- (6.6,0);
          \foreach \x/\n in {0/-7,0.5/-6,1/-5,1.5/-4,2/-3,2.5/-2,3/-1,3.5/0,4/1,4.5/2,5/3,5.5/4,6/5} {\draw[ink!60] (\x,0.08) -- (\x,-0.08);}
          \node[below,font=\scriptsize] at (0,-0.1) {$-7$};
          \node[below,font=\scriptsize] at (3.5,-0.1) {$0$};
          \node[below,font=\scriptsize] at (6,-0.1) {$5$};
          \fill[roxo] (0,0) circle (1.6pt) node[above=2pt,font=\scriptsize] {$P$};
          \fill[roxo] (6,0) circle (1.6pt) node[above=2pt,font=\scriptsize] {$Q$};
      enunciado: 'O ponto $M$ corresponde ao número'
      opcoes: ['$-2$', '$-1$', '$0$', '$1$', '$6$']
      correta: B
      resolucao: |
        A distância de $P$ a $Q$ é $5-(-7)=12$. A metade é $6$: $M=-7+6=-1$.
    - texto: |
        Durante um exercício conjunto da Marinha e da Aeronáutica, um avião de patrulha voava a $9\,000$ m de altitude enquanto um submarino navegava a $450$ m abaixo do nível do mar, exatamente na mesma vertical.
      enunciado: 'A distância vertical entre o avião e o submarino era de'
      opcoes: ['$8\,550$ m', '$8\,950$ m', '$9\,045$ m', '$9\,450$ m', '$9\,900$ m']
      correta: D
      resolucao: |
        Altitudes: $9\,000$ e $-450$. Distância: $9\,000-(-450)=9\,450$ m.
    - enunciado: 'Considere $a=-5$ e $b=3$. Assinale o que for correto.'
      proposicoes:
      - '$a+b=-2$.'
      - '$a-b=-8$.'
      - '$b-a=2$.'
      - '$a\cdot b=-15$.'
      - '$a\cdot a=-25$.'
      - '$(a+b)\cdot(a-b)=16$.'
      corretas: [1, 2, 4, 6]
      resolucao: |
        01: $-5+3=-2$. 02: $-5-3=-8$. 04 errada: $3-(-5)=8$. 08: $-15$.
        16 errada: $(-5)(-5)=25$. 32: $(-2)(-8)=16$. Soma: $01+02+08+32=43$.
    - enunciado: 'O produto de dois números inteiros negativos e consecutivos é $72$. A soma desses números é'
      opcoes: ['$-17$', '$-15$', '$-1$', '$1$', '$17$']
      correta: A
      resolucao: |
        $8\cdot9=72$; como os dois são negativos, são $-8$ e $-9$. A soma é $-17$.
    - texto: |
        A amplitude térmica de um dia é a diferença entre a temperatura máxima e a mínima. A tabela traz os registros de cinco cidades num mesmo dia de julho.
      tabela:
        cabecalho: ['Cidade', 'Mínima ($^\circ$C)', 'Máxima ($^\circ$C)']
        linhas:
          - ['Urubici (SC)', '$-4$', '$15$']
          - ['Gramado (RS)', '$-1$', '$17$']
          - ['São Joaquim (SC)', '$-6$', '$11$']
          - ['Curitiba (PR)', '$2$', '$20$']
          - ['Campos do Jordão (SP)', '$-3$', '$14$']
      enunciado: 'A maior amplitude térmica do dia foi registrada em'
      opcoes: ['Urubici', 'Gramado', 'São Joaquim', 'Curitiba', 'Campos do Jordão']
      correta: A
      resolucao: |
        Amplitudes: $15-(-4)=19$; $17-(-1)=18$; $11-(-6)=17$; $20-2=18$; $14-(-3)=17$. A maior é $19$, em Urubici.
    - texto: |
        Num jogo de calculadora, cada jogador recebe um número e faz, nesta ordem: multiplica por $-3$, soma $8$, divide por $-7$ e, por fim, subtrai $4$. Lucas recebeu o número $5$.
      enunciado: 'O resultado final de Lucas foi'
      opcoes: ['$-5$', '$-3$', '$-1$', '$1$', '$3$']
      correta: B
      resolucao: |
        $5\cdot(-3)=-15$; $-15+8=-7$; $-7:(-7)=1$; $1-4=-3$.
    - texto: |
        Uma pequena empresa registrou, em milhares de reais, os seguintes resultados trimestrais no último ano (valores positivos são lucro; negativos, prejuízo): $1^\circ$ trimestre, $+35$; $2^\circ$, $-12$; $3^\circ$, $-28$; $4^\circ$, $+17$.
      enunciado: 'Assinale o que for correto.'
      proposicoes:
      - 'O resultado do ano foi um lucro de $12$ mil reais.'
      - 'O pior resultado foi o do $3^\circ$ trimestre.'
      - 'Do $2^\circ$ para o $3^\circ$ trimestre, o resultado variou $-16$ mil reais.'
      - 'O resultado do primeiro semestre foi negativo.'
      - 'Se o $4^\circ$ trimestre tivesse prejuízo de $17$ mil reais, o resultado do ano seria $-22$ mil reais.'
      corretas: [1, 2, 3, 5]
      resolucao: |
        01: $35-12-28+17=12$. 02: $-28$ é o menor. 04: $-28-(-12)=-16$. 08 errada: $35-12=23>0$.
        16: $35-12-28-17=-22$. Soma: $01+02+04+16=23$.
    - enunciado: 'Quantos números inteiros existem entre $-7$ e $5$, sem contar $-7$ e $5$?'
      opcoes: ['$2$', '$10$', '$11$', '$12$', '$13$']
      correta: C
      resolucao: |
        São $-6,-5,\dots,-1,0,1,\dots,4$: seis negativos, o zero e quatro positivos, $11$ números.
    - enunciado: 'Um número inteiro $x$, multiplicado por $-4$ e somado a $9$, resulta em $37$. O valor de $x$ é'
      opcoes: ['$-15$', '$-12$', '$-11$', '$-9$', '$-7$']
      correta: E
      resolucao: |
        $-4x+9=37\Rightarrow -4x=28\Rightarrow x=-7$. Conferindo: $-4\cdot(-7)+9=28+9=37$.
aprofundamento:
  intro: Questões mais puxadas, no estilo das segundas fases e das olimpíadas. Escreva o raciocínio, não só a resposta.
  questoes:
    - enunciado: 'O produto de três números inteiros consecutivos é $-120$. Quais são esses números?'
      resolucao: |
        O produto é negativo, então há um ou três fatores negativos; com consecutivos e sem o zero, os três são negativos.
        $4\cdot5\cdot6=120$, logo os números são $-6$, $-5$ e $-4$.
      resposta: '$-6$, $-5$ e $-4$'
    - enunciado: 'Encontre todos os pares de números inteiros $(x,\,y)$ tais que $x\cdot y=-6$ e $x+y=1$.'
      resolucao: |
        Pares com produto $-6$: $(1,-6)$, $(-1,6)$, $(2,-3)$, $(-2,3)$ e as trocas de ordem.
        A soma é $1$ só em $(-2,3)$ e $(3,-2)$.
      resposta: '$(-2,\,3)$ e $(3,\,-2)$'
    - enunciado: 'Quantos números inteiros $n$ satisfazem $-15<3n\le12$?'
      resolucao: |
        Dividindo por $3$: $-5<n\le4$. São $-4,-3,\dots,3,4$: $9$ números.
      resposta: '$9$'
    - enunciado: 'Calcule $S=1-2+3-4+5-6+\dots+99-100$.'
      resolucao: |
        Agrupe de dois em dois: $(1-2)+(3-4)+\dots+(99-100)$. São $50$ grupos, cada um igual a $-1$.
        $S=-50$.
      resposta: '$-50$'
    - enunciado: 'A soma de cinco números inteiros consecutivos é $-35$. Qual é o maior deles?'
      resolucao: |
        O termo do meio é a média: $-35:5=-7$. Os números são $-9,-8,-7,-6,-5$. O maior é $-5$.
      resposta: '$-5$'
    - enunciado: 'O produto de $2026$ números inteiros é igual a $1$. A soma desses números pode ser zero? Justifique.'
      espaco: 34
      resolucao: |
        Se o produto é $1$, cada número é $1$ ou $-1$ (qualquer outro inteiro deixaria o produto com valor absoluto maior que $1$).
        Para a soma dar zero, seriam $1013$ números $-1$ e $1013$ números $1$. Mas $1013$ é ímpar, e um número ímpar de fatores $-1$ dá produto $-1$.
        Logo, a soma não pode ser zero.
      resposta: 'Não: seriam $1013$ fatores $-1$, e o produto daria $-1$'
    - enunciado: 'Às $18$ h, a temperatura de uma cidade era de $13\ ^\circ$C e passou a cair $3\ ^\circ$C por hora, sem parar. A que horas ela chegou a $-8\ ^\circ$C?'
      resolucao: |
        A queda total é $13-(-8)=21\ ^\circ$C. A $3\ ^\circ$C por hora, são $7$ horas.
        $18+7=25$, ou seja, $1$ h da manhã do dia seguinte.
      resposta: '$1$ h da manhã'
    - enunciado: 'Os números inteiros de $-4$ a $4$ foram colocados no quadrado abaixo, cada um uma vez, de modo que todas as linhas, colunas e diagonais têm a mesma soma. Qual é essa soma? Complete o quadrado.'
      tabela:
        linhas:
          - ['$3$', '{{-4}}', '$1$']
          - ['{{-2}}', '$0$', '{{2}}']
          - ['{{-1}}', '$4$', '{{-3}}']
      espaco: 14
      resolucao: |
        A soma de todos os números de $-4$ a $4$ é $0$; divididos em $3$ linhas de mesma soma, cada linha soma $0$.
        1ª linha: $3+x+1=0$, $x=-4$. 2ª coluna confere: $-4+0+4=0$. Diagonal: $3+0+z=0$, $z=-3$; outra diagonal: $1+0+w=0$, $w=-1$.
        3ª linha: $-1+4-3=0$. 2ª linha: $-2+0+2=0$.
      resposta: 'Soma $0$; faltam $-4$, $-2$, $2$, $-1$ e $-3$'
    - enunciado: 'Sem calcular, determine o sinal de cada produto e justifique.'
      itens: ['$(-1)\cdot(-2)\cdot(-3)\cdots(-15)$', '$(-1)\cdot(-2)\cdot(-3)\cdots(-20)$']
      colunas: 2
      espaco_item: 20
      resolucao: |
        (a) São $15$ fatores negativos, quantidade ímpar: produto negativo.
        (b) São $20$ fatores negativos, quantidade par: produto positivo.
      resposta: '(a) negativo (b) positivo'
    - enunciado: 'Na divisão de um número inteiro $n$ por $-7$, o quociente é $12$ e o resto é $3$ (o resto fica entre $0$ e $6$). Qual é o número $n$?'
      resolucao: |
        Dividendo $=$ divisor $\times$ quociente $+$ resto: $n=(-7)\cdot12+3=-84+3=-81$.
      resposta: '$n=-81$'
