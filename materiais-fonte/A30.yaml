# Fonte das listas em PDF da aula A30 — Equações Modulares
aula: A30

fixacao:
  intro: Resolva na ordem — do aquecimento ao desafio. $|A|=k$ com $k\ge0$ vira $A=k$ ou $A=-k$. Quando o outro lado tem $x$, confira se ele não fica negativo.
  secoes:
    - nome: Aquecimento
      questoes:
        - enunciado: Resolva em $\mathbb{R}$.
          itens:
            - $|x|=7$
            - $|x|=0$
            - $|x|=-3$
          resolucao: |
            (a) $x=\pm7$. (b) $x=0$. (c) Módulo nunca é negativo: $\varnothing$.
          resposta: '(a) $\{-7,7\}$ \quad (b) $\{0\}$ \quad (c) $\varnothing$'

        - enunciado: Resolva $|x-4|=2$.
          resolucao: |
            $x-4=2\Rightarrow x=6$ ou $x-4=-2\Rightarrow x=2$. Ou seja: os números a distância $2$ de $4$.
          resposta: '$\{2,\,6\}$'

        - enunciado: Resolva $|2x-3|=7$.
          resolucao: |
            $2x-3=7\Rightarrow x=5$ ou $2x-3=-7\Rightarrow x=-2$.
          resposta: '$\{-2,\,5\}$'

        - enunciado: Resolva $|3x+1|=0$.
          resolucao: |
            Módulo zero só quando o conteúdo é zero: $3x+1=0\Rightarrow x=-\tfrac13$.
          resposta: '$\left\{-\tfrac13\right\}$'

        - enunciado: Resolva $|x+5|=-1$.
          resolucao: |
            O módulo nunca é negativo: não há solução.
          resposta: '$\varnothing$'

        - enunciado: Resolva $|x-1|=|x+3|$.
          resolucao: |
            $x-1=x+3$ é impossível; $x-1=-(x+3)\Rightarrow 2x=-2\Rightarrow x=-1$.
            ($-1$ é o ponto médio entre $1$ e $-3$.)
          resposta: '$\{-1\}$'

        - enunciado: Resolva $|5-x|=3$.
          resolucao: |
            $5-x=3\Rightarrow x=2$ ou $5-x=-3\Rightarrow x=8$.
          resposta: '$\{2,\,8\}$'

    - nome: Treino
      questoes:
        - enunciado: Resolva $|x+1|=|2x-4|$.
          resolucao: |
            $x+1=2x-4\Rightarrow x=5$ ou $x+1=-(2x-4)\Rightarrow 3x=3\Rightarrow x=1$.
          resposta: '$\{1,\,5\}$'

        - enunciado: Resolva $|x-2|=2x-1$.
          resolucao: |
            Condição: $2x-1\ge0\Rightarrow x\ge\tfrac12$.
            $x-2=2x-1\Rightarrow x=-1$ (não serve). $x-2=-(2x-1)\Rightarrow 3x=3\Rightarrow x=1$ (serve).
          resposta: '$\{1\}$'

        - enunciado: Resolva $|3x-1|=x+5$.
          resolucao: |
            Condição: $x\ge-5$. $3x-1=x+5\Rightarrow x=3$. $3x-1=-x-5\Rightarrow x=-1$. Ambos servem.
          resposta: '$\{-1,\,3\}$'

        - enunciado: Resolva $|x|^2-5|x|+6=0$.
          resolucao: |
            Com $y=|x|$: $y^2-5y+6=0\Rightarrow y=2$ ou $y=3$. Então $x=\pm2$ ou $x=\pm3$.
          resposta: '$\{-3,-2,2,3\}$'

        - enunciado: Resolva $|x^2-4|=5$.
          resolucao: |
            $x^2-4=5\Rightarrow x=\pm3$. \ $x^2-4=-5\Rightarrow x^2=-1$: sem solução real.
          resposta: '$\{-3,\,3\}$'

        - enunciado: Resolva $x^2-|x|-12=0$.
          resolucao: |
            Como $x^2=|x|^2$: $|x|^2-|x|-12=0\Rightarrow|x|=4$ ou $|x|=-3$ (descartado). Então $x=\pm4$.
          resposta: '$\{-4,\,4\}$'

        - enunciado: Resolva $|2x+1|=|x-4|$.
          resolucao: |
            $2x+1=x-4\Rightarrow x=-5$. \ $2x+1=-(x-4)\Rightarrow 3x=3\Rightarrow x=1$.
          resposta: '$\{-5,\,1\}$'

        - enunciado: Resolva $|x-3|=3-x$.
          resolucao: |
            $|A|=-A$ exatamente quando $A\le0$: $x-3\le0\Rightarrow x\le3$.
          resposta: '$]-\infty,\,3]$'

    - nome: Desafio
      questoes:
        - enunciado: Resolva $|x-1|+|x-3|=6$.
          resolucao: |
            $x\ge3$: $2x-4=6\Rightarrow x=5$. \ $1\le x<3$: $2=6$, impossível. \ $x<1$: $-2x+4=6\Rightarrow x=-1$.
          resposta: '$\{-1,\,5\}$'

        - enunciado: Resolva $|x^2-5x|=6$.
          resolucao: |
            $x^2-5x-6=0\Rightarrow x=6$ ou $x=-1$. \ $x^2-5x+6=0\Rightarrow x=2$ ou $x=3$.
          resposta: '$\{-1,\,2,\,3,\,6\}$'

        - enunciado: Resolva $\big||x|-2\big|=1$.
          resolucao: |
            $|x|-2=1\Rightarrow|x|=3$, ou $|x|-2=-1\Rightarrow|x|=1$. Então $x=\pm3$ ou $x=\pm1$.
          resposta: '$\{-3,-1,1,3\}$'

        - enunciado: Resolva $|x+2|+|x-2|=4$.
          resolucao: |
            A soma das distâncias de $x$ até $-2$ e até $2$ é $4$, a distância entre esses pontos, exatamente quando $x$ está entre eles.
          resposta: '$[-2,\,2]$'

        - enunciado: Resolva $|x-1|=2x+4$.
          resolucao: |
            Condição: $2x+4\ge0\Rightarrow x\ge-2$.
            $x-1=2x+4\Rightarrow x=-5$ (não serve). \ $1-x=2x+4\Rightarrow x=-1$ (serve).
          resposta: '$\{-1\}$'

vestibular:
  intro: Questões autorais no estilo dos principais vestibulares. Assinale uma única alternativa.
  questoes:
    - enunciado: A soma das raízes da equação $|x-5|=3$ é
      opcoes: ['$3$', '$6$', '$8$', '$10$', '$16$']
      correta: D
      resolucao: |
        As raízes são $2$ e $8$. Soma: $10$.

    - enunciado: O produto das raízes da equação $|2x+4|=6$ é
      opcoes: ['$-5$', '$-1$', '$1$', '$5$', '$-10$']
      correta: A
      resolucao: |
        $2x+4=6\Rightarrow x=1$; $2x+4=-6\Rightarrow x=-5$. Produto: $-5$.

    - enunciado: 'O conjunto solução de $|x|=x-2$ é'
      opcoes: ['$\{1\}$', '$\{-1\}$', '$\{2\}$', '$\varnothing$', '$\mathbb{R}$']
      correta: D
      resolucao: |
        $x\ge0$: $x=x-2$, impossível. $x<0$: $-x=x-2\Rightarrow x=1$, que contradiz $x<0$. Não há solução.

    - enunciado: A solução da equação $|x-2|=|x+4|$ é
      opcoes: ['$x=1$', '$x=-1$', '$x=3$', '$x=-3$', '$x=2$']
      correta: B
      resolucao: |
        $x-2=-(x+4)\Rightarrow 2x=-2\Rightarrow x=-1$ (ponto médio entre $2$ e $-4$).

    - enunciado: O número de soluções reais da equação $|x|^2-7|x|+10=0$ é
      opcoes: ['$0$', '$1$', '$2$', '$3$', '$4$']
      correta: E
      resolucao: |
        $|x|=2$ ou $|x|=5$: $x=\pm2$ ou $x=\pm5$.

    - enunciado: A soma das soluções de $|3x-6|=x+2$ é
      opcoes: ['$1$', '$3$', '$4$', '$5$', '$6$']
      correta: D
      resolucao: |
        $3x-6=x+2\Rightarrow x=4$; $3x-6=-x-2\Rightarrow x=1$. Ambas tornam $x+2>0$. Soma: $5$.

    - enunciado: A quantidade de números inteiros que satisfazem $|x-3|+|x+1|=4$ é
      opcoes: ['$2$', '$5$', '$3$', '$4$', 'infinita']
      correta: B
      resolucao: |
        A soma das distâncias até $3$ e até $-1$ é $4$ (a distância entre eles) exatamente para $-1\le x\le3$. Inteiros: $-1,0,1,2,3$.

    - enunciado: 'O conjunto solução de $|x^2-1|=3$ é'
      opcoes: ['$\{-2,\,2\}$', '$\{2\}$', '$\{-2,\,-\sqrt2,\,\sqrt2,\,2\}$', '$\{4\}$', '$\varnothing$']
      correta: A
      resolucao: |
        $x^2-1=3\Rightarrow x=\pm2$. A outra possibilidade, $x^2-1=-3$, dá $x^2=-2$, sem solução real.

    - enunciado: 'O conjunto solução de $|x-4|=2x+1$ é'
      opcoes: ['$\{-5\}$', '$\{1,\,-5\}$', '$\{1\}$', '$\{5\}$', '$\varnothing$']
      correta: C
      resolucao: |
        $x-4=2x+1\Rightarrow x=-5$, mas aí $2x+1=-9<0$: não serve. $4-x=2x+1\Rightarrow x=1$: serve.

    - enunciado: A soma das soluções de $\big||x-1|-3\big|=2$ é
      opcoes: ['$0$', '$2$', '$4$', '$6$', '$8$']
      correta: C
      resolucao: |
        $|x-1|=5$ ou $|x-1|=1$: $x\in\{6,-4,2,0\}$. Soma: $4$.

    - enunciado: O número de soluções reais da equação $|x^2-3x|=2$ é
      opcoes: ['$1$', '$2$', '$3$', '$4$', '$6$']
      correta: D
      resolucao: |
        $x^2-3x-2=0$ tem $\Delta=17>0$ (duas raízes). $x^2-3x+2=0$ dá $1$ e $2$. Total: $4$ soluções.

    - enunciado: A distância de um número $x$ até $7$ é o dobro da sua distância até $1$. A soma dos possíveis valores de $x$ é
      opcoes: ['$-2$', '$2$', '$3$', '$-5$', '$8$']
      correta: A
      resolucao: |
        $|x-7|=2|x-1|$: $x-7=2x-2\Rightarrow x=-5$ ou $x-7=-2x+2\Rightarrow x=3$. Soma: $-2$.

    - enunciado: O produto das soluções de $|x|+|x-4|=10$ é
      opcoes: ['$-21$', '$-10$', '$21$', '$-12$', '$14$']
      correta: A
      resolucao: |
        $x\ge4$: $2x-4=10\Rightarrow x=7$. $x<0$: $4-2x=10\Rightarrow x=-3$. Entre $0$ e $4$, a soma vale $4$. Produto: $-21$.

    - enunciado: A soma das soluções de $|2x-1|=|x+2|$ é
      opcoes: ['$3$', '$\dfrac83$', '$\dfrac{10}3$', '$\dfrac73$', '$2$']
      correta: B
      resolucao: |
        $2x-1=x+2\Rightarrow x=3$; $2x-1=-x-2\Rightarrow x=-\tfrac13$. Soma: $\tfrac83$.

    - enunciado: As raízes da equação $|x-a|=3$ são $2$ e $8$. O valor de $a$ é
      opcoes: ['$3$', '$4$', '$5$', '$6$', '$10$']
      correta: C
      resolucao: |
        As raízes são $a\pm3$, simétricas em relação a $a$: $a=\tfrac{2+8}2=5$.

    - enunciado: A equação $|x+1|=k$ tem exatamente uma solução real se, e somente se,
      opcoes: ['$k>0$', '$k<0$', '$k=1$', '$k=-1$', '$k=0$']
      correta: E
      resolucao: |
        Se $k>0$, há duas soluções; se $k<0$, nenhuma; se $k=0$, só $x=-1$.

    - enunciado: O número de soluções reais da equação $|x^2-4|=4$ é
      opcoes: ['$1$', '$2$', '$3$', '$4$', '$5$']
      correta: C
      resolucao: |
        $x^2-4=4\Rightarrow x=\pm2\sqrt2$; $x^2-4=-4\Rightarrow x=0$. São $3$ soluções.

    - enunciado: O produto das soluções de $|5-2x|=x+1$ é
      opcoes: ['$\dfrac43$', '$6$', '$\dfrac{22}3$', '$8$', '$-8$']
      correta: D
      resolucao: |
        $5-2x=x+1\Rightarrow x=\tfrac43$; $5-2x=-x-1\Rightarrow x=6$. Ambas deixam $x+1>0$. Produto: $8$.

    - enunciado: 'O conjunto solução de $|x-2|=x-2$ é'
      opcoes: ['$\{2\}$', '$[2,\,+\infty[$', '$]-\infty,\,2]$', '$\varnothing$', '$\mathbb{R}$']
      correta: B
      resolucao: |
        $|A|=A$ exatamente quando $A\ge0$: $x\ge2$.

    - enunciado: A temperatura $T$, em $^\circ$C, de um forno oscila entre dois valores extremos, que são as soluções da equação $|T-180|=12$. A diferença entre a maior e a menor temperatura é
      opcoes: ['$6\ ^\circ$C', '$12\ ^\circ$C', '$18\ ^\circ$C', '$36\ ^\circ$C', '$24\ ^\circ$C']
      correta: E
      resolucao: |
        $T=192$ ou $T=168$. Diferença: $24\ ^\circ$C.
