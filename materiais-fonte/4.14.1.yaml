# Aula 4.14.1 — Cilindro
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Complete o quadro para cilindros circulares retos de raio $r$ e altura $h$ (deixe as respostas em função de $\pi$).'
      tabela:
        cabecalho: ['$r$', '$h$', 'Área da base', 'Área lateral', 'Volume']
        linhas:
        - ['2', '5', '{{4\pi}}', '{{20\pi}}', '{{20\pi}}']
        - ['3', '4', '{{9\pi}}', '{{24\pi}}', '{{36\pi}}']
        - ['1', '10', '{{\pi}}', '{{20\pi}}', '{{10\pi}}']
        - ['5', '2', '{{25\pi}}', '{{20\pi}}', '{{50\pi}}']
      resolucao: |
        Área da base $\pi r^2$, área lateral $2\pi r h$, volume $\pi r^2 h$.
        Repare que cilindros diferentes podem ter a mesma área lateral ($20\pi$) e volumes bem diferentes.
      resposta: '$4\pi, 20\pi, 20\pi$; $9\pi, 24\pi, 36\pi$; $\pi, 20\pi, 10\pi$; $25\pi, 20\pi, 50\pi$'
    - enunciado: 'Associe cada elemento do cilindro circular reto à sua descrição.'
      esquerda:
      - 'raio'
      - 'altura'
      - 'geratriz'
      - 'secção meridiana'
      direita:
      - 'distância entre os planos das bases'
      - 'retângulo obtido ao cortar o cilindro por um plano que contém o eixo'
      - 'segmento paralelo ao eixo, com extremos nas circunferências das bases'
      - 'metade do diâmetro da base'
      resolucao: |
        No cilindro reto, a geratriz tem o mesmo comprimento da altura, mas é um segmento da superfície lateral. A secção meridiana tem lados $2r$ e $h$.
      resposta: 'De cima para baixo: 2, 4, 3, 1'
    - enunciado: 'Um cilindro tem raio 3 e altura 7. Complete o cálculo das áreas pela planificação.'
      itens:
      - 'A superfície lateral vira um retângulo de {{6\pi}} por {{7}}.'
      - 'Área lateral: {{42\pi}}'
      - 'Área total: $42\pi + 2\cdot 9\pi =$ {{60\pi}}'
      resolucao: |
        Um lado do retângulo é o comprimento da circunferência da base, $2\pi\cdot 3 = 6\pi$; o outro é a altura. Área lateral $6\pi\cdot 7 = 42\pi$; total $42\pi + 18\pi = 60\pi$.
      resposta: '$6\pi$ por 7; $42\pi$; $60\pi$'
    - enunciado: 'Calcule a capacidade de cada cilindro em litros. Use $\pi \approx 3$ e lembre que 1 dm³ = 1 L.'
      itens:
      - '$r = 1$ dm e $h = 4$ dm'
      - '$r = 10$ cm e $h = 20$ cm'
      - 'diâmetro 2 m e $h = 1$ m'
      - '$r = 5$ cm e $h = 8$ cm'
      colunas: 2
      espaco_item: 16
      resolucao: |
        (a) $3\cdot 1\cdot 4 = 12$ dm³ = 12 L. (b) $3\cdot 100\cdot 20 = 6\,000$ cm³ = 6 L.
        (c) $r = 1$ m: $3$ m³ = 3 000 L. (d) $3\cdot 25\cdot 8 = 600$ cm³ = 0,6 L.
      resposta: '(a) 12 L (b) 6 L (c) 3 000 L (d) 0,6 L'
    - enunciado: 'Um cilindro equilátero tem raio 4 cm. Calcule sua área total e seu volume.'
      espaco: 26
      resolucao: |
        Equilátero: $h = 2r = 8$. Área total: $2\pi\cdot 4\cdot 8 + 2\pi\cdot 16 = 96\pi$ cm². Volume: $\pi\cdot 16\cdot 8 = 128\pi$ cm³.
      resposta: '$96\pi$ cm² e $128\pi$ cm³'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Num cilindro equilátero, a secção meridiana é um quadrado.'
      - 'Se o raio de um cilindro dobra e a altura se mantém, o volume dobra.'
      - 'A área lateral de um cilindro de raio $r$ e altura $h$ é $2\pi r h$.'
      - 'Um cilindro de raio 2 e altura 3 tem volume maior que um de raio 3 e altura 2.'
      justificar: true
      espaco: 18
      resolucao: |
        (V) Os lados são $2r$ e $h = 2r$. (F) O volume fica multiplicado por 4, pois depende de $r^2$.
        (V) É a área do retângulo da planificação. (F) $12\pi < 18\pi$.
      resposta: V, F, V, F
    - enunciado: 'Calcule o raio da base de cada cilindro.'
      itens:
      - 'volume $45\pi$ e altura 5'
      - 'área lateral $24\pi$ e altura 4'
      - 'área da base $49\pi$'
      - 'circunferência da base com comprimento $10\pi$'
      colunas: 2
      espaco_item: 15
      resolucao: |
        (a) $r^2\cdot 5 = 45$, $r = 3$. (b) $2r\cdot 4 = 24$, $r = 3$. (c) $r^2 = 49$, $r = 7$. (d) $2r = 10$, $r = 5$.
      resposta: '(a) 3 (b) 3 (c) 7 (d) 5'
  - nome: Nível 2
    questoes:
    - texto: |
        Lia calculou o volume de uma lata com 8 cm de diâmetro e 10 cm de altura assim: $V = \pi\cdot 8^2\cdot 10 = 640\pi$ cm³.
      enunciado: 'Encontre o erro de Lia e calcule o volume correto.'
      espaco: 24
      resolucao: |
        Lia usou o diâmetro no lugar do raio. Com $r = 4$: $V = \pi\cdot 16\cdot 10 = 160\pi$ cm³ (um quarto do valor dela).
      resposta: 'Usou o diâmetro; $160\pi$ cm³'
    - enunciado: 'Compare os cilindros A (raio 2, altura 9) e B (raio 3, altura 4).'
      itens:
      - 'Qual tem o maior volume?'
      - 'Qual tem a maior área lateral?'
      espaco_item: 15
      resolucao: |
        (a) $V_A = \pi\cdot 4\cdot 9 = 36\pi$ e $V_B = \pi\cdot 9\cdot 4 = 36\pi$: os volumes são iguais.
        (b) $A_A = 2\pi\cdot 2\cdot 9 = 36\pi$ e $A_B = 2\pi\cdot 3\cdot 4 = 24\pi$: A tem a maior área lateral.
      resposta: '(a) iguais, $36\pi$ (b) A'
    - enunciado: 'Uma lata de tinta cilíndrica tem 20 cm de diâmetro e 30 cm de altura. Use $\pi \approx 3{,}14$.'
      itens:
      - 'Calcule a capacidade da lata em litros.'
      - 'Se cada litro de tinta pinta 5 m² de parede, quantos metros quadrados a lata cheia pinta?'
      espaco_item: 15
      resolucao: |
        (a) $3{,}14\cdot 10^2\cdot 30 = 9\,420$ cm³ = 9,42 L. (b) $9{,}42\cdot 5 = 47{,}1$ m².
      resposta: '(a) 9,42 L (b) 47,1 m²'
    - enunciado: 'Complete: o que acontece com o volume de um cilindro em cada mudança?'
      tabela:
        cabecalho: ['Raio', 'Altura', 'Volume fica']
        linhas:
        - ['$\times 2$', 'igual', '$\times$ {{4}}']
        - ['igual', '$\times 3$', '$\times$ {{3}}']
        - ['$\times 2$', '$\div 2$', '$\times$ {{2}}']
        - ['$\times 3$', '$\div 9$', '$\times$ {{1}}']
      resolucao: |
        $V = \pi r^2 h$: o raio entra ao quadrado. $2^2 = 4$; $3$; $4\cdot\frac12 = 2$; $9\cdot\frac19 = 1$ (o volume não muda).
      resposta: '4; 3; 2; 1'
    - enunciado: 'Um cilindro tem área lateral $60\pi$ cm² e volume $150\pi$ cm³. Determine o raio e a altura.'
      espaco: 26
      resolucao: |
        $\frac{V}{A_L} = \frac{\pi r^2 h}{2\pi r h} = \frac r2 = \frac{150}{60}$, logo $r = 5$ cm. Então $2\pi\cdot 5\cdot h = 60\pi$ e $h = 6$ cm.
      resposta: '$r = 5$ cm e $h = 6$ cm'
    - enunciado: 'Em um aquário cilíndrico com 10 cm de raio interno, uma pedra é colocada e fica submersa; o nível da água sobe 0,5 cm. Qual é o volume da pedra? Use $\pi \approx 3{,}14$.'
      espaco: 22
      resolucao: |
        O volume da pedra é o da água deslocada: $3{,}14\cdot 100\cdot 0{,}5 = 157$ cm³.
      resposta: '157 cm³'
    - enunciado: 'A secção meridiana de um cilindro tem área 48 cm², e a altura do cilindro é 8 cm. Calcule:'
      itens:
      - 'o raio da base;'
      - 'o volume;'
      - 'a área total.'
      colunas: 3
      espaco_item: 15
      resolucao: |
        (a) A secção é um retângulo $2r$ por $8$: $16r = 48$, $r = 3$ cm. (b) $\pi\cdot 9\cdot 8 = 72\pi$ cm³. (c) $2\pi\cdot 3\cdot 8 + 2\pi\cdot 9 = 66\pi$ cm².
      resposta: '(a) 3 cm (b) $72\pi$ cm³ (c) $66\pi$ cm²'
    - enunciado: 'Uma caixa-d’água cilíndrica de 1 000 litros tem 0,5 m de raio interno. Qual é a sua altura interna? Use $\pi \approx 3$.'
      espaco: 22
      resolucao: |
        1 000 L = 1 m³. $3\cdot 0{,}25\cdot h = 1 \Rightarrow h = \frac43 \approx 1{,}33$ m.
      resposta: '$\frac43 \approx 1{,}33$ m'
  - nome: Nível 3
    questoes:
    - enunciado: 'Um retângulo de 4 dm por 10 dm pode ser enrolado de dois modos para formar a superfície lateral de um cilindro. Calcule o volume de cada cilindro e diga qual é o maior.'
      espaco: 32
      resolucao: |
        Altura 10: $2\pi r = 4$, $r = \frac2\pi$ e $V = \pi\cdot\frac{4}{\pi^2}\cdot 10 = \frac{40}{\pi}$ dm³.
        Altura 4: $2\pi r = 10$, $r = \frac5\pi$ e $V = \pi\cdot\frac{25}{\pi^2}\cdot 4 = \frac{100}{\pi}$ dm³. O segundo (mais baixo e mais largo) é o maior.
      resposta: '$\frac{40}{\pi}$ e $\frac{100}{\pi}$ dm³; o de altura 4'
    - enunciado: 'Um cilindro está inscrito em um cubo de aresta $a$ (as bases estão em duas faces opostas). Calcule a razão entre a área lateral do cilindro e a soma das áreas das quatro faces laterais do cubo.'
      espaco: 26
      resolucao: |
        $r = \frac a2$ e $h = a$: área lateral $2\pi\cdot\frac a2\cdot a = \pi a^2$. Faces laterais do cubo: $4a^2$. Razão: $\frac{\pi}{4}$.
      resposta: '$\frac{\pi}{4}$'
    - enunciado: 'Um cano tem 2 m de comprimento, diâmetro externo de 6 cm e diâmetro interno de 4 cm. Calcule o volume de material do cano, em função de $\pi$.'
      espaco: 24
      resolucao: |
        Raios 3 cm e 2 cm, comprimento 200 cm: $\pi(9 - 4)\cdot 200 = 1\,000\pi$ cm³.
      resposta: '$1\,000\pi$ cm³'
    - enunciado: 'A área total de um cilindro é o dobro da sua área lateral. Mostre que a altura é igual ao raio e calcule o raio, sabendo que o volume é $8\pi$.'
      espaco: 30
      resolucao: |
        $2\pi r h + 2\pi r^2 = 2\cdot 2\pi r h \Rightarrow 2\pi r^2 = 2\pi r h \Rightarrow h = r$. Então $\pi r^3 = 8\pi$ e $r = 2$.
      resposta: '$h = r$; $r = 2$'
    - enunciado: 'Um copo cilíndrico com 4 cm de raio interno e 12 cm de altura está com água até $\frac34$ da altura. Cubos de gelo com 2 cm de aresta são colocados e ficam submersos. Quantos cubos cabem sem que a água transborde? Use $\pi \approx 3$.'
      espaco: 28
      resolucao: |
        Faltam 3 cm de altura: $3\cdot 16\cdot 3 = 144$ cm³ livres. Cada cubo desloca $2^3 = 8$ cm³. $\frac{144}{8} = 18$: com 18 cubos a água chega exatamente à borda; o 19º faz transbordar.
      resposta: '18 cubos'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Uma família de quatro pessoas mora em uma casa abastecida por uma caixa-d’água cilíndrica, com 2 m de diâmetro interno e 1,5 m de altura. Em uma semana de falta de abastecimento, a caixa estava cheia no início e a família manteve o consumo médio de 150 litros de água por pessoa por dia, sem nenhuma reposição.
    enunciado: |
      Utilize 3 como aproximação para $\pi$ e lembre que 1 m³ corresponde a 1 000 litros.
      Por quantos dias completos a água da caixa foi suficiente para atender a família?
    opcoes: ['7', '8', '15', '30', '45']
    correta: A
    resolucao: |
      Raio $= 1$ m. Volume $= \pi r^2 h = 3\cdot 1^2\cdot 1{,}5 = 4{,}5$ m³ $= 4\,500$ L.
      Consumo diário: $4\cdot 150 = 600$ L. $\dfrac{4\,500}{600} = 7{,}5$: são 7 dias completos.
      Usar o diâmetro como raio dá 18 m³ e 30 dias; arredondar 7,5 para cima dá 8, mas no 8º dia a água acaba no meio do dia.

  - estilo: Fuvest
    enunciado: |
      Um cilindro circular reto tem raio da base igual a 3 cm e altura igual a 8 cm. A área total da superfície desse cilindro, em cm², é
    opcoes: ['$48\pi$', '$57\pi$', '$66\pi$', '$72\pi$', '$75\pi$']
    correta: C
    resolucao: |
      Área lateral: $2\pi r h = 2\pi\cdot 3\cdot 8 = 48\pi$. Duas bases: $2\pi r^2 = 18\pi$.
      Total: $66\pi$ cm². ($57\pi$ conta só uma base, como num copo sem tampa.)

  - estilo: Unicamp
    enunciado: |
      Um cilindro equilátero tem volume igual a $16\pi$ cm³. A área lateral desse cilindro é igual a
    opcoes: ['$8\pi$ cm².', '$16\pi$ cm².', '$24\pi$ cm².', '$32\pi$ cm².']
    correta: B
    resolucao: |
      No cilindro equilátero, $h = 2r$ (a secção meridiana é um quadrado). $\pi r^2\cdot 2r = 16\pi \Rightarrow r^3 = 8 \Rightarrow r = 2$ e $h = 4$.
      Área lateral: $2\pi\cdot 2\cdot 4 = 16\pi$ cm².

  - estilo: Enem
    texto: |
      Uma indústria de alimentos vende um molho de tomate em embalagem cilíndrica que custa R\$ 4,00. Para o lançamento de uma versão “família”, a empresa vai usar uma nova embalagem, também cilíndrica, com o dobro do raio da base e metade da altura da embalagem atual. O preço será proporcional à quantidade de molho, e as duas embalagens são vendidas completamente cheias.
    enunciado: |
      O preço da embalagem “família” será de
    opcoes: ['R\$ 2,00.', 'R\$ 4,00.', 'R\$ 8,00.', 'R\$ 12,00.', 'R\$ 16,00.']
    correta: C
    resolucao: |
      $V_{\text{nova}} = \pi(2r)^2\cdot\dfrac{h}{2} = 2\pi r^2 h = 2V$. O volume dobra, então o preço também: R\$ 8,00.
      Quem dobra o raio sem elevar ao quadrado acha que o volume não muda (R\$ 4,00); quem esquece de reduzir a altura encontra R\$ 16,00.

  - estilo: UEM
    enunciado: |
      Considere um cilindro circular reto com raio da base 2 cm e altura 5 cm. Assinale o que for correto.
    proposicoes:
    - 'O volume do cilindro é $20\pi$ cm³.'
    - 'A área lateral do cilindro é $20\pi$ cm².'
    - 'A secção meridiana do cilindro é um retângulo de área 20 cm².'
    - 'O cilindro é equilátero.'
    - 'A área total do cilindro é $24\pi$ cm².'
    corretas: [1, 2, 3]
    resolucao: |
      01) Correta: $\pi\cdot 4\cdot 5$. 02) Correta: $2\pi\cdot 2\cdot 5$.
      04) Correta: a secção meridiana tem lados $2r = 4$ e $h = 5$.
      08) Incorreta: seria preciso $h = 2r = 4$.
      16) Incorreta: $20\pi + 2\cdot 4\pi = 28\pi$ cm².

  - estilo: Unesp
    texto: |
      A figura mostra a planificação da superfície de um cilindro circular reto: um retângulo de 18,84 cm por 10 cm e dois círculos iguais, que correspondem às bases.
    figura:
      tikz: |
        \begin{scope}[scale=.42]
        \draw[ink, line width=.8pt, fill=lilas!40] (0,0) rectangle (9.42,5);
        \draw[ink, line width=.8pt, fill=lima!35] (4.71,6.5) circle (1.5);
        \draw[ink, line width=.8pt, fill=lima!35] (4.71,-1.5) circle (1.5);
        \draw[latex-latex, mudo] (0.15,2.5) -- (9.27,2.5) node[pos=.25, above, font=\scriptsize, text=ink] {18,84 cm};
        \draw[latex-latex, mudo] (9.9,0) -- (9.9,5) node[midway, right, font=\scriptsize, text=ink] {10 cm};
        \end{scope}
    enunciado: |
      Utilizando 3,14 como aproximação para $\pi$, o volume desse cilindro, em cm³, é
    opcoes: ['28,26.', '94,2.', '141,3.', '188,4.', '282,6.']
    correta: E
    resolucao: |
      O comprimento do retângulo é o perímetro da base: $2\pi r = 18{,}84 \Rightarrow r = \dfrac{18{,}84}{6{,}28} = 3$ cm. A altura é 10 cm.
      $V = 3{,}14\cdot 3^2\cdot 10 = 282{,}6$ cm³. (28,26 é a área da base e 188,4, a área lateral.)

  - estilo: Fuvest
    enunciado: |
      Um copo cilíndrico, com raio interno de 4 cm, contém água. Uma pedra é colocada no copo, fica totalmente submersa, e o nível da água sobe 1,5 cm, sem transbordar. O volume da pedra, em cm³, é
    opcoes: ['$1{,}5\pi$', '$6\pi$', '$12\pi$', '$16\pi$', '$24\pi$']
    correta: E
    resolucao: |
      O volume da pedra é o volume de água deslocado: um cilindro de raio 4 cm e altura 1,5 cm.
      $V = \pi\cdot 4^2\cdot 1{,}5 = 24\pi$ cm³. ($6\pi$ usa $r^2$ como $2r$.)

  # ---------------- Nível 2 ----------------
  - estilo: Enem
    texto: |
      Em um supermercado, o mesmo extrato de tomate é vendido em cinco latas cilíndricas de tamanhos diferentes, todas completamente cheias. O quadro mostra as medidas internas de cada lata e o seu preço.
    tabela:
      cabecalho: ['Lata', 'Raio (cm)', 'Altura (cm)', 'Preço (R\$)']
      linhas:
      - ['A', '3', '10', '2,70']
      - ['B', '4', '8', '3,60']
      - ['C', '6', '5', '5,40']
      - ['D', '2', '18', '2,00']
      - ['E', '5', '6', '4,05']
    enunciado: |
      Utilize 3 como aproximação para $\pi$.
      Um cliente quer comprar a lata em que o preço por centímetro cúbico de extrato é o menor. Ele deve escolher a lata
    opcoes: ['A.', 'B.', 'C.', 'D.', 'E.']
    correta: E
    resolucao: |
      Volumes ($3r^2h$): A: 270; B: 384; C: 540; D: 216; E: 450 cm³.
      Preço por cm³ (em centavos): A: 1,000; B: 0,9375; C: 1,000; D: $\approx 0{,}926$; E: 0,900. A mais vantajosa é a E.
      A lata C, a maior, não é a mais barata por cm³.

  - estilo: UEL
    enunciado: |
      A secção meridiana de um cilindro circular reto é um quadrado de área 36 cm². Considere as afirmativas a seguir.
    afirmativas:
    - 'O raio da base do cilindro mede 3 cm.'
    - 'A área lateral do cilindro é $36\pi$ cm².'
    - 'O volume do cilindro é $108\pi$ cm³.'
    - 'A área total do cilindro é $54\pi$ cm².'
    comando: 'Assinale a alternativa correta.'
    opcoes:
    - 'Somente as afirmativas I e II são corretas.'
    - 'Somente as afirmativas I e III são corretas.'
    - 'Somente as afirmativas III e IV são corretas.'
    - 'Somente as afirmativas I, II e IV são corretas.'
    - 'Somente as afirmativas II, III e IV são corretas.'
    correta: D
    resolucao: |
      Secção meridiana quadrada: $2r = h$ e $(2r)^2 = 36$, logo $2r = 6$, $r = 3$ e $h = 6$ (cilindro equilátero).
      I. Correta. II. Correta: $2\pi\cdot 3\cdot 6 = 36\pi$. III. Incorreta: $\pi\cdot 9\cdot 6 = 54\pi$. IV. Correta: $36\pi + 2\cdot 9\pi = 54\pi$.

  - estilo: UFSC
    enunciado: |
      Considere um cilindro circular reto $C$, de raio $r$ e altura $h$, e o cilindro $C^\prime$ obtido de $C$ dobrando-se o raio e mantendo-se a altura. Assinale o que for correto.
    proposicoes:
    - 'O volume de $C^\prime$ é o dobro do volume de $C$.'
    - 'A área lateral de $C^\prime$ é o dobro da área lateral de $C$.'
    - 'A área da base de $C^\prime$ é o quádruplo da área da base de $C$.'
    - 'Se $C$ é equilátero, então a secção meridiana de $C^\prime$ é um quadrado.'
    - 'A razão entre o volume e a área lateral de $C^\prime$ é o dobro da mesma razão calculada para $C$.'
    corretas: [2, 3, 5]
    resolucao: |
      01) Incorreta: $\pi(2r)^2h = 4\pi r^2h$, o quádruplo.
      02) Correta: $2\pi(2r)h = 2\cdot 2\pi rh$. 04) Correta: $\pi(2r)^2 = 4\pi r^2$.
      08) Incorreta: se $h = 2r$, a secção de $C^\prime$ tem lados $4r$ e $2r$.
      16) Correta: $\dfrac{V}{A_L} = \dfrac{\pi r^2h}{2\pi rh} = \dfrac{r}{2}$, que dobra quando $r$ dobra.

  - estilo: Unicamp
    enunciado: |
      Um rolo de papel-toalha tem a forma de um cilindro com 20 cm de altura e 12 cm de diâmetro. O papel está enrolado em torno de um tubo de papelão, também cilíndrico, com 4 cm de diâmetro. O volume ocupado pelo papel é igual a
    opcoes: ['$160\pi$ cm³.', '$320\pi$ cm³.', '$480\pi$ cm³.', '$640\pi$ cm³.']
    correta: D
    resolucao: |
      Raios: 6 cm e 2 cm. O papel ocupa a diferença entre os dois cilindros: $\pi(6^2 - 2^2)\cdot 20 = 640\pi$ cm³.
      Subtrair os raios antes de elevar ao quadrado, $\pi(6-2)^2\cdot 20 = 320\pi$, é o erro mais comum.

  - estilo: Enem
    texto: |
      Uma escola instalou um reservatório cilíndrico, com raio interno de 2 m, para captar água da chuva usada na limpeza dos pátios. Em um dia sem chuva, o reservatório, inicialmente vazio, passou a ser abastecido por uma bomba com vazão constante de 300 litros por minuto, até que a água atingisse 1,5 m de altura.
    enunciado: |
      Utilize 3 como aproximação para $\pi$.
      O tempo necessário para que a água atinja essa altura é de
    opcoes: ['20 minutos.', '1 hora.', '1 hora e 30 minutos.', '2 horas.', '4 horas.']
    correta: B
    resolucao: |
      Volume de água: $3\cdot 2^2\cdot 1{,}5 = 18$ m³ $= 18\,000$ L. Tempo: $\dfrac{18\,000}{300} = 60$ minutos, ou 1 hora.
      Tomar 2 m como diâmetro (raio 1 m) dá 15 minutos; tomar 4 m como raio dá 4 horas.

  - estilo: UFPR
    enunciado: |
      Considerando cilindros circulares retos, identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'A planificação da superfície lateral de um cilindro é um retângulo.'
    - 'Se a altura de um cilindro dobra e o raio se mantém, o volume dobra.'
    - 'Se o raio de um cilindro dobra e a altura se mantém, a área total dobra.'
    - 'Todo cilindro equilátero de raio $r$ tem área total igual a $6\pi r^2$.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – F – F – V.', 'F – V – F – V.', 'V – V – V – F.', 'V – F – V – V.', 'V – V – F – V.']
    correta: E
    resolucao: |
      (V) Um lado é a altura e o outro, o perímetro $2\pi r$ da base.
      (V) $V = \pi r^2h$ é proporcional a $h$.
      (F) $\dfrac{2\pi(2r)h + 2\pi(2r)^2}{2\pi rh + 2\pi r^2} = \dfrac{2(h + 2r)}{h + r}$, que só seria 2 se $r = 0$.
      (V) Com $h = 2r$: $2\pi r\cdot 2r + 2\pi r^2 = 6\pi r^2$.

  - estilo: Unesp
    texto: |
      Uma peça de madeira tem a forma de um cubo de 6 cm de aresta. Um artesão torneou a peça e obteve o maior cilindro circular reto possível, cujas bases estão contidas em duas faces opostas do cubo, como mostra a figura.
    figura:
      tikz: |
        \begin{scope}[scale=.5]
        % cubo em perspectiva cavaleira (aresta 6, profundidade 2,1 x 1,2)
        \draw[ink!40, dashed] (0,0) -- (2.1,1.2) -- (8.1,1.2) (2.1,1.2) -- (2.1,7.2);
        % cilindro: eixo vertical pelo centro das faces de baixo e de cima
        \fill[lilas!55] (1.05,0.6) rectangle (7.05,6.6);
        \fill[lilas!55] (4.05,0.6) ellipse (3 and .62);
        \fill[lima!45] (4.05,6.6) ellipse (3 and .62);
        \draw[roxo, line width=.8pt] (4.05,6.6) ellipse (3 and .62);
        \draw[roxo, line width=.8pt] (1.05,0.6) -- (1.05,6.6) (7.05,0.6) -- (7.05,6.6);
        \draw[roxo, line width=.8pt] (1.05,0.6) arc (180:360:3 and .62);
        \draw[roxo, dashed] (1.05,0.6) arc (180:0:3 and .62);
        \draw[ink, line width=.7pt] (0,0) rectangle (6,6) (0,6) -- (2.1,7.2) -- (8.1,7.2) -- (6,6) (8.1,7.2) -- (8.1,1.2) -- (6,0);
        \node[below, font=\tiny] at (3,0) {6 cm};
        \end{scope}
    enunciado: |
      A razão entre o volume do cilindro e o volume do cubo original é
    opcoes: ['$\dfrac{\pi}{6}$', '$\dfrac{\pi}{4}$', '$\dfrac{\pi}{3}$', '$\dfrac{\pi}{2}$', '$\dfrac{3\pi}{4}$']
    correta: B
    resolucao: |
      O maior cilindro tem diâmetro igual à aresta: $r = 3$ cm e $h = 6$ cm. $V_{\text{cil}} = \pi\cdot 9\cdot 6 = 54\pi$ e $V_{\text{cubo}} = 216$.
      Razão: $\dfrac{54\pi}{216} = \dfrac{\pi}{4}$ (a mesma razão entre o círculo e o quadrado em que ele está inscrito).

  # ---------------- Nível 3 ----------------
  - estilo: Fuvest
    enunciado: |
      Em um cilindro circular reto, a área lateral é igual à soma das áreas das duas bases. Se o volume desse cilindro é $27\pi$ cm³, a sua altura, em centímetros, é
    opcoes: ['$\dfrac{3}{2}$', '$2$', '$\dfrac{9}{4}$', '$3$', '$9$']
    correta: D
    resolucao: |
      $2\pi rh = 2\pi r^2 \Rightarrow h = r$. Então $\pi r^2\cdot r = 27\pi \Rightarrow r = 3$ e $h = 3$ cm.

  - estilo: UEM
    enunciado: |
      Um tanque cilíndrico vertical, com raio interno de 1 m e altura de 3 m, contém água até $\frac{2}{3}$ de sua altura. Considere 3,14 como aproximação para $\pi$. Assinale o que for correto.
    proposicoes:
    - 'A área da base do tanque é 6,28 m².'
    - 'O tanque contém 6 280 litros de água.'
    - 'Para encher completamente o tanque, faltam 3 140 litros de água.'
    - 'Se toda a água for transferida para um tanque cilíndrico vertical de raio interno 2 m, a altura da água nesse tanque será 0,5 m.'
    - 'A área da parede lateral do tanque que está em contato com a água é 6,28 m².'
    corretas: [2, 3, 4]
    resolucao: |
      01) Incorreta: $3{,}14\cdot 1^2 = 3{,}14$ m².
      02) Correta: água até 2 m: $3{,}14\cdot 2 = 6{,}28$ m³.
      04) Correta: falta 1 m de altura: $3{,}14$ m³ $= 3\,140$ L.
      08) Correta: $h = \dfrac{6{,}28}{3{,}14\cdot 4} = 0{,}5$ m.
      16) Incorreta: $2\cdot 3{,}14\cdot 1\cdot 2 = 12{,}56$ m².

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Uma empresa de bebidas vai lançar um suco em lata de alumínio. O projeto inicial prevê uma lata cilíndrica fechada, com 6 cm de diâmetro e 12 cm de altura, como na figura. Para os cálculos, os engenheiros desprezam a espessura do alumínio e utilizam 3 como aproximação para $\pi$.
      figura:
        tikz: |
          \begin{scope}[scale=.36]
          \fill[lilas!45] (-3,0) rectangle (3,12);
          \fill[lilas!45] (0,0) ellipse (3 and .9);
          \fill[lima!45] (0,12) ellipse (3 and .9);
          \draw[ink, line width=.8pt] (0,12) ellipse (3 and .9);
          \draw[ink, line width=.8pt] (-3,0) -- (-3,12) (3,0) -- (3,12);
          \draw[ink, line width=.8pt] (-3,0) arc (180:360:3 and .9);
          \draw[ink!50, dashed] (-3,0) arc (180:0:3 and .9);
          \draw[latex-latex, mudo] (-3,13.6) -- (3,13.6) node[midway, above, font=\tiny] {6 cm};
          \draw[latex-latex, mudo] (4.1,0) -- (4.1,12) node[midway, right, font=\tiny] {12 cm};
          \end{scope}
    enunciado: |
      A quantidade de alumínio necessária para fabricar uma lata, em centímetro quadrado, corresponde à área total da superfície do cilindro. Essa área é
    opcoes: ['216.', '243.', '270.', '324.', '432.']
    correta: C
    resolucao: |
      Raio 3 cm. Lateral: $2\cdot 3\cdot 3\cdot 12 = 216$ cm²; duas tampas: $2\cdot 3\cdot 3^2 = 54$ cm². Total: 270 cm².
      243 conta só uma tampa; 324 é o volume (em cm³), não a área.

  - estilo: Unicamp
    enunciado: |
      Por questões de design, a empresa decidiu que a lata terá 8 cm de diâmetro, mantendo o mesmo volume do projeto inicial. A altura da nova lata será igual a
    opcoes: ['$6{,}75$ cm.', '$9$ cm.', '$10{,}5$ cm.', '$16$ cm.']
    correta: A
    resolucao: |
      Volume inicial: $3\cdot 3^2\cdot 12 = 324$ cm³. Com raio 4: $3\cdot 16\cdot h = 324 \Rightarrow h = 6{,}75$ cm.
      9 cm supõe que altura e diâmetro sejam inversamente proporcionais, o que não vale: o volume depende do quadrado do raio.

  - estilo: UFPR
    enunciado: |
      Uma folha retangular de 3 dm por 6 dm pode ser enrolada de dois modos para formar a superfície lateral de um cilindro: juntando os lados de 3 dm (cilindro de altura 6 dm) ou juntando os lados de 6 dm (cilindro de altura 3 dm). Considere as afirmações:
    afirmativas:
    - 'Os dois cilindros têm a mesma área lateral.'
    - 'O volume do cilindro de altura 3 dm é o dobro do volume do cilindro de altura 6 dm.'
    - 'O raio da base do cilindro de altura 6 dm mede $\frac{3}{\pi}$ dm.'
    - 'Nenhum dos dois cilindros é equilátero.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I, II e IV, apenas.', 'I e II, apenas.', 'I e III, apenas.', 'II e IV, apenas.', 'I, II, III e IV.']
    correta: A
    resolucao: |
      I. Correta: as duas são a própria folha, de 18 dm².
      Altura 6: $2\pi r = 3 \Rightarrow r = \dfrac{3}{2\pi}$ e $V = \pi\dfrac{9}{4\pi^2}\cdot 6 = \dfrac{27}{2\pi}$. Altura 3: $2\pi r = 6 \Rightarrow r = \dfrac{3}{\pi}$ e $V = \pi\dfrac{9}{\pi^2}\cdot 3 = \dfrac{27}{\pi}$.
      II. Correta. III. Incorreta: o raio é $\dfrac{3}{2\pi}$. IV. Correta: $2r = \dfrac{3}{\pi} \ne 6$ e $2r = \dfrac{6}{\pi} \ne 3$.

  - estilo: Fuvest
    enunciado: |
      Uma barra cilíndrica maciça de metal, com 2 cm de raio e 30 cm de comprimento, é derretida, e todo o metal é usado para cunhar moedas cilíndricas com 1 cm de raio e 2 mm de espessura. Desprezando perdas, o número de moedas obtidas é
    opcoes: ['60', '150', '300', '600', '1 200']
    correta: D
    resolucao: |
      Barra: $\pi\cdot 2^2\cdot 30 = 120\pi$ cm³. Moeda: $\pi\cdot 1^2\cdot 0{,}2 = 0{,}2\pi$ cm³ (2 mm $= 0{,}2$ cm).
      Número de moedas: $\dfrac{120\pi}{0{,}2\pi} = 600$. Esquecer de elevar a razão dos raios ao quadrado leva a 300.

aprofundamento:
  questoes:
  - estilo: Unicamp
    texto: |
      Um caminhão transporta combustível em um tanque cilíndrico deitado, isto é, com o eixo na horizontal. O tanque tem raio interno de 1 m e comprimento de 4 m.
    enunciado: ''
    itens:
    - 'Calcule a capacidade total do tanque, em metro cúbico, usando 3,14 para $\pi$.'
    - 'Calcule o volume de combustível quando a altura do líquido, medida a partir do ponto mais baixo do tanque, é 1 m.'
    - 'Calcule o volume de combustível quando essa altura é 1,5 m. Dê a resposta exata e um valor aproximado (use $\sqrt{3} \approx 1{,}73$).'
    espaco: 64
    resolucao: |
      a) $\pi\cdot 1^2\cdot 4 \approx 12{,}56$ m³.
      b) Com altura 1 m (igual ao raio), o líquido ocupa metade do tanque: $2\pi \approx 6{,}28$ m³.
      c) A parte vazia, na secção transversal, é um segmento circular de altura $0{,}5$ m. A corda fica a $0{,}5$ m do centro, então o ângulo central é $120^\circ$ e o segmento tem área $\dfrac{\pi}{3} - \dfrac{\sqrt{3}}{4}$. O líquido ocupa $\pi - \dfrac{\pi}{3} + \dfrac{\sqrt{3}}{4} = \dfrac{2\pi}{3} + \dfrac{\sqrt{3}}{4}$ da secção. Volume: $4\left(\dfrac{2\pi}{3} + \dfrac{\sqrt{3}}{4}\right) = \dfrac{8\pi}{3} + \sqrt{3} \approx 10{,}1$ m³.
    resposta: 'a) $\approx 12{,}56$ m³; b) $2\pi \approx 6{,}28$ m³; c) $\frac{8\pi}{3} + \sqrt{3} \approx 10{,}1$ m³'

  - estilo: Fuvest
    enunciado: |
      Um cilindro circular reto de raio $r$ e altura $h$ tem área total igual a $24\pi$.
    itens:
    - 'Para $r = 2$, determine $h$ e o volume do cilindro. Que nome especial recebe esse cilindro?'
    - 'Exprima o volume $V$ do cilindro em função de $r$ e indique os valores possíveis de $r$.'
    - 'Determine os valores de $r$ para os quais o volume é $11\pi$.'
    espaco: 62
    resolucao: |
      a) $2\pi r(r + h) = 24\pi \Rightarrow r(r + h) = 12$. Com $r = 2$: $h = 4$ e $V = 16\pi$. Como $h = 2r$, é um cilindro equilátero.
      b) $h = \dfrac{12}{r} - r$, então $V = \pi r^2\left(\dfrac{12}{r} - r\right) = \pi(12r - r^3)$, com $0 < r < 2\sqrt{3}$ (para que $h > 0$).
      c) $12r - r^3 = 11 \Rightarrow r^3 - 12r + 11 = 0 \Rightarrow (r - 1)(r^2 + r - 11) = 0$. Então $r = 1$ ou $r = \dfrac{-1 + 3\sqrt{5}}{2}$ ($\approx 2{,}85$, menor que $2\sqrt{3}$). Os dois servem.
    resposta: 'a) $h = 4$, $V = 16\pi$, equilátero; b) $V = \pi(12r - r^3)$, $0 < r < 2\sqrt{3}$; c) $r = 1$ ou $r = \frac{-1 + 3\sqrt{5}}{2}$'

  - estilo: ITA
    enunciado: |
      Um prisma hexagonal regular tem aresta da base igual a 2 e altura igual a 6. Considere o cilindro inscrito nesse prisma e o cilindro circunscrito a ele, ambos com a mesma altura do prisma. A razão entre o volume do cilindro inscrito e o volume do cilindro circunscrito é
    opcoes: ['$\dfrac{1}{2}$', '$\dfrac{\sqrt{3}}{2}$', '$\dfrac{3}{4}$', '$\dfrac{4}{5}$', '$\dfrac{\sqrt{3}}{3}$']
    correta: C
    espaco: 22
    resolucao: |
      No hexágono regular de lado 2, o raio da circunferência inscrita é o apótema, $\sqrt{3}$, e o da circunscrita é o próprio lado, 2.
      Com a mesma altura, a razão dos volumes é a razão das áreas das bases: $\dfrac{(\sqrt{3})^2}{2^2} = \dfrac{3}{4}$. ($\dfrac{\sqrt{3}}{2}$ é a razão dos raios.)
    resposta: 'C'

  - estilo: Unesp
    texto: |
      Um recipiente cilíndrico, com raio interno de 5 cm e altura interna de 12 cm, contém água até 8 cm de altura. Peças metálicas maciças em forma de cubo, com 4 cm de aresta, serão colocadas uma a uma no recipiente, e todas ficam totalmente submersas. Use 3,14 para $\pi$.
    enunciado: ''
    itens:
    - 'Calcule o volume de água no recipiente.'
    - 'Calcule a altura da água, com uma casa decimal, depois que a primeira peça é colocada.'
    - 'Qual é o maior número de peças que pode ser colocado sem que a água transborde?'
    espaco: 58
    resolucao: |
      a) $3{,}14\cdot 25\cdot 8 = 628$ cm³.
      b) Cada peça desloca $4^3 = 64$ cm³. Subida: $\dfrac{64}{3{,}14\cdot 25} = \dfrac{64}{78{,}5} \approx 0{,}8$ cm. Nova altura: $\approx 8{,}8$ cm.
      c) Até a borda faltam 4 cm de altura, ou $78{,}5\cdot 4 = 314$ cm³. Como $\dfrac{314}{64} \approx 4{,}9$, cabem 4 peças; a 5ª faz a água transbordar. (Os cubos cabem: a diagonal de dois cubos lado a lado, $\sqrt{8^2 + 4^2} \approx 8{,}9$ cm, é menor que o diâmetro de 10 cm.)
    resposta: 'a) 628 cm³; b) $\approx 8{,}8$ cm; c) 4 peças'

  - estilo: UFSC
    enunciado: |
      A secção meridiana de um cilindro circular reto tem perímetro 24 cm e área 32 cm². Assinale o que for correto.
    proposicoes:
    - 'Existem exatamente dois cilindros com essas propriedades.'
    - 'Um desses cilindros é equilátero.'
    - 'O de maior volume tem volume $64\pi$ cm³.'
    - 'Os dois cilindros têm a mesma área lateral.'
    - 'A área total do cilindro de raio 2 cm é $40\pi$ cm².'
    - 'A razão entre o maior e o menor volume é 4.'
    corretas: [1, 3, 4, 5]
    espaco: 22
    resolucao: |
      Lados da secção: $2r$ e $h$, com $2r + h = 12$ e $2r\cdot h = 32$: são as raízes de $t^2 - 12t + 32 = 0$, ou seja, 4 e 8.
      Casos: $r = 2$, $h = 8$ ($V = 32\pi$) ou $r = 4$, $h = 4$ ($V = 64\pi$).
      01) Correta. 02) Incorreta: nenhum tem $h = 2r$. 04) Correta. 08) Correta: as duas valem $32\pi$ (é sempre $\pi\cdot 2r\cdot h$).
      16) Correta: $32\pi + 8\pi$. 32) Incorreta: a razão é 2.
    resposta: 'Soma 29 (01 + 04 + 08 + 16)'

  - estilo: Fuvest
    enunciado: |
      Um copo cilíndrico, com raio interno de 3 cm e altura interna de 10 cm, está completamente cheio de água. O copo é inclinado lentamente, e a água escorre até que a superfície da água passe exatamente pela borda superior, de um lado, e pela borda do fundo, do lado oposto. O volume de água que permanece no copo, em cm³, é
    opcoes: ['$15\pi$', '$30\pi$', '$45\pi$', '$60\pi$', '$90\pi$']
    correta: C
    espaco: 22
    resolucao: |
      O plano que passa por uma borda superior e pela borda oposta do fundo divide o cilindro em duas partes congruentes (uma é a rotação de $180^\circ$ da outra em torno do centro do cilindro). Fica metade da água: $\dfrac{\pi\cdot 9\cdot 10}{2} = 45\pi$ cm³.
    resposta: 'C'

  - estilo: Unicamp
    texto: |
      Um cano de PVC tem 6 m de comprimento, diâmetro externo de 10 cm e parede com 0,5 cm de espessura. Use 3,14 para $\pi$.
    enunciado: ''
    itens:
    - 'Calcule o volume de PVC usado na fabricação do cano, em centímetro cúbico, em função de $\pi$.'
    - 'Calcule quantos litros de água cabem no interior do cano.'
    - 'Sabendo que a densidade do PVC é 1,4 g/cm³, calcule a massa do cano, em quilograma, com duas casas decimais.'
    espaco: 58
    resolucao: |
      a) Raio externo 5 cm, raio interno $4{,}5$ cm, comprimento 600 cm: $\pi(25 - 20{,}25)\cdot 600 = 2\,850\pi$ cm³.
      b) $3{,}14\cdot 20{,}25\cdot 600 = 38\,151$ cm³ $\approx 38{,}15$ L.
      c) $2\,850\cdot 3{,}14\cdot 1{,}4 = 12\,528{,}6$ g $\approx 12{,}53$ kg.
    resposta: 'a) $2\,850\pi$ cm³; b) $\approx 38{,}15$ L; c) $\approx 12{,}53$ kg'

  - estilo: ITA
    enunciado: |
      Um cilindro circular reto tem raio da base 4 e volume numericamente igual à sua área total. A altura desse cilindro é
    opcoes: ['$2$', '$\dfrac{8}{3}$', '$4$', '$6$', '$8$']
    correta: C
    espaco: 22
    resolucao: |
      $\pi r^2h = 2\pi r(r + h) \Rightarrow rh = 2r + 2h$. Com $r = 4$: $4h = 8 + 2h \Rightarrow h = 4$.
    resposta: 'C'

  - estilo: Fuvest
    texto: |
      Uma formiga caminha sobre a superfície lateral de um cilindro circular reto com 3 cm de raio e $4\pi$ cm de altura. Ela parte de um ponto $A$ da circunferência da base inferior.
    enunciado: ''
    itens:
    - 'Calcule a área lateral do cilindro.'
    - 'Calcule o comprimento do menor caminho, sobre a superfície lateral, de $A$ até o ponto $B$ da base superior diametralmente oposto ao ponto que está exatamente acima de $A$.'
    - 'Calcule o comprimento do menor caminho que sai de $A$, dá exatamente uma volta completa em torno do cilindro e termina no ponto da base superior que está exatamente acima de $A$.'
    espaco: 62
    resolucao: |
      a) $2\pi\cdot 3\cdot 4\pi = 24\pi^2$ cm².
      b) Planificando, o caminho mais curto é a hipotenusa de um triângulo retângulo com catetos $4\pi$ (altura) e meia volta, $\pi r = 3\pi$: $\sqrt{(3\pi)^2 + (4\pi)^2} = 5\pi$ cm.
      c) Agora o cateto horizontal é a volta inteira, $2\pi r = 6\pi$: $\sqrt{(6\pi)^2 + (4\pi)^2} = 2\pi\sqrt{13}$ cm.
    resposta: 'a) $24\pi^2$ cm²; b) $5\pi$ cm; c) $2\pi\sqrt{13}$ cm'

  - estilo: Unesp
    texto: |
      Uma piscina infantil de plástico tem a forma de um cilindro circular reto com 3 m de diâmetro e 0,8 m de altura. Ela será cheia até 80\% da altura com uma mangueira de vazão constante de 15 litros por minuto. O fabricante do produto de limpeza recomenda 4 mL de cloro para cada 1 000 litros de água. Use 3,14 para $\pi$.
    enunciado: ''
    itens:
    - 'Calcule o volume de água, em litros, na piscina cheia até o nível previsto.'
    - 'Calcule, aproximadamente, a quantidade de cloro recomendada.'
    - 'Calcule o tempo necessário para encher a piscina até o nível previsto, em horas e minutos.'
    espaco: 58
    resolucao: |
      a) Altura da água: $0{,}8\cdot 0{,}8 = 0{,}64$ m. $3{,}14\cdot 1{,}5^2\cdot 0{,}64 = 4{,}5216$ m³ $= 4\,521{,}6$ L.
      b) $\dfrac{4\,521{,}6}{1\,000}\cdot 4 \approx 18$ mL.
      c) $\dfrac{4\,521{,}6}{15} \approx 301$ minutos, ou cerca de 5 horas e 1 minuto.
    resposta: 'a) 4 521,6 L; b) $\approx 18$ mL; c) $\approx$ 5 h 1 min'
