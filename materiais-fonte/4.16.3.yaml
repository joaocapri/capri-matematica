# Aula 4.16.3 — Geometria espacial: semelhança de sólidos
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: sólidos semelhantes e razão linear k; áreas na razão k² e volumes (e massas, com mesmo material) na
# razão k³; passar de uma razão a outra (k = √(razão das áreas) = ∛(razão dos volumes)); maquetes e escalas; tinta
# (área) × material (volume); cortes paralelos à base; razão superfície/volume; quais sólidos são sempre semelhantes.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Se a razão linear entre dois sólidos semelhantes é $k$, as áreas estão na razão $k^2$ e os volumes na razão $k^3$. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Um sólido maciço é ampliado, sem mudar a forma nem o material, com razão linear $\frac{3}{2}$. Complete com as medidas do sólido ampliado.'
      itens:
      - 'Uma aresta de 4 cm passa a medir: {{6}} cm'
      - 'Uma face de 20 cm² passa a ter: {{45}} cm²'
      - 'O volume de 16 cm³ passa a ser: {{54}} cm³'
      - 'A massa de 200 g passa a ser: {{675}} g'
      espaco_item: 8
      resolucao: |
        $4 \cdot \tfrac{3}{2} = 6$; $20 \cdot \tfrac{9}{4} = 45$; $16 \cdot \tfrac{27}{8} = 54$; massa como o volume: $200 \cdot \tfrac{27}{8} = 675$.
      resposta: '6; 45; 54; 675'
    - enunciado: 'Associe cada razão linear $k$ à razão entre os volumes.'
      esquerda:
      - '$k = 2$'
      - '$k = \frac{1}{2}$'
      - '$k = 4$'
      - '$k = 10$'
      - '$k = \frac{3}{2}$'
      direita:
      - '$64$'
      - '$\frac{27}{8}$'
      - '$1000$'
      - '$\frac{1}{8}$'
      - '$8$'
      resolucao: |
        A razão dos volumes é $k^3$.
      resposta: 'De cima para baixo: 3, 5, 4, 2, 1'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Dobrando o raio e a altura de um cilindro, o volume dobra.'
      - 'Dois cubos quaisquer são semelhantes.'
      - 'Dois cilindros quaisquer são semelhantes.'
      - 'Se as áreas de dois sólidos semelhantes estão na razão 9, os volumes estão na razão 27.'
      justificar: true
      espaco: 20
      resolucao: |
        (F) Fica multiplicado por $2^3 = 8$. (V) A razão das arestas vale para tudo. (F) Raio 1 e altura 1 não é semelhante a raio 1 e altura 5. (V) $k = 3$.
      resposta: F, V, F, V
    - enunciado: 'Complete para dois sólidos semelhantes.'
      tabela:
        cabecalho: ['Razão linear', 'Razão das áreas', 'Razão dos volumes']
        linhas:
        - ['$5$', '${{25}}$', '${{125}}$']
        - ['$\frac{1}{3}$', '${{\frac{1}{9}}}$', '${{\frac{1}{27}}}$']
        - ['${{7}}$', '$49$', '${{343}}$']
        - ['${{\frac{2}{3}}}$', '${{\frac{4}{9}}}$', '$\frac{8}{27}$']
      resolucao: |
        $k$, $k^2$ e $k^3$. Da área para $k$: raiz quadrada; do volume para $k$: raiz cúbica.
      resposta: '25, 125; $\frac{1}{9}$, $\frac{1}{27}$; 7, 343; $\frac{2}{3}$, $\frac{4}{9}$'
    - enunciado: 'Os dois cones da figura são semelhantes, de alturas 4 e 6. O menor tem volume 16. Calcule o volume do maior.'
      figura:
        tikz: |
          \begin{scope}[scale=.5]
          \draw[ink, line width=1pt] (-1,0) -- (0,2.67) -- (1,0);
          \draw[ink, line width=1pt] (-1,0) arc (180:360:1 and 0.25);
          \draw[ink, dashed] (1,0) arc (0:180:1 and 0.25);
          \node[left, font=\scriptsize] at (-0.6,1.3) {$4$};
          \draw[ink, line width=1pt] (2.5,0) -- (4,4) -- (5.5,0);
          \draw[ink, line width=1pt] (2.5,0) arc (180:360:1.5 and 0.37);
          \draw[ink, dashed] (5.5,0) arc (0:180:1.5 and 0.37);
          \node[right, font=\scriptsize] at (4.9,2) {$6$};
          \end{scope}
      espaco: 8
      resolucao: |
        $k = \tfrac{6}{4} = \tfrac{3}{2}$: $16 \cdot \tfrac{27}{8} = 54$.
      resposta: '54'
    - enunciado: 'A maquete de uma casa, na escala 1 : 50, tem piso de 12 cm² num dos cômodos e volume interno total de 400 cm³. Calcule a área real desse piso, em m², e o volume real, em m³.'
      espaco: 10
      resolucao: |
        Áreas: $\times 2500$: $30\,000$ cm² $= 3$ m². Volumes: $\times 125\,000$: $5 \cdot 10^7$ cm³ $= 50$ m³.
      resposta: '3 m² e 50 m³'
    - enunciado: 'Uma miniatura de 10 cm de altura de uma estátua maciça tem 60 g. Quanto pesa a estátua, de 1,5 m de altura e do mesmo material?'
      espaco: 8
      resolucao: |
        $k = 15$: $60 \cdot 15^3 = 202\,500$ g $= 202{,}5$ kg.
      resposta: '202,5 kg'
  - nome: Nível 2
    questoes:
    - texto: |
        Pedro leu que a área da superfície de um sólido ficou 9 vezes maior numa ampliação sem mudar a forma e concluiu que o volume também ficou 9 vezes maior.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 10
      resolucao: |
        Áreas na razão $k^2 = 9$ dão $k = 3$, e o volume fica $3^3 = 27$ vezes maior.
      resposta: '27 vezes'
    - enunciado: 'Duas garrafas semelhantes têm alturas de 20 cm e 30 cm. A menor tem capacidade de 400 mL e rótulo de 60 cm². Calcule a capacidade e a área do rótulo da maior.'
      espaco: 10
      resolucao: |
        $k = \tfrac{3}{2}$: $400 \cdot \tfrac{27}{8} = 1350$ mL; $60 \cdot \tfrac{9}{4} = 135$ cm².
      resposta: '1350 mL e 135 cm²'
    - enunciado: 'Uma estátua foi pintada com 2 L de tinta. Uma réplica do mesmo material tem $\frac{1}{3}$ das dimensões. Quanta tinta pinta a réplica? Que fração da massa da estátua ela tem?'
      espaco: 10
      resolucao: |
        Tinta acompanha a área: $2 \cdot \tfrac{1}{9} = \tfrac{2}{9}$ L. Massa acompanha o volume: $\tfrac{1}{27}$.
      resposta: '$\frac{2}{9}$ L; $\frac{1}{27}$'
    - enunciado: 'Duas pirâmides semelhantes têm volumes 16 e 54. A área total da menor é 40. Complete.'
      itens:
      - 'Razão linear (maior para menor): {{\frac{3}{2}}}'
      - 'Razão das áreas: {{\frac{9}{4}}}'
      - 'Área total da maior: {{90}}'
      espaco_item: 8
      resolucao: |
        $k^3 = \tfrac{54}{16} = \tfrac{27}{8}$: $k = \tfrac{3}{2}$; $k^2 = \tfrac{9}{4}$; $40 \cdot \tfrac{9}{4} = 90$.
      resposta: '$\frac{3}{2}$; $\frac{9}{4}$; 90'
    - enunciado: 'Uma laranja tem raio 20\% maior que outra, de mesma forma. Por quanto ficam multiplicados o volume de suco e a área da casca?'
      espaco: 8
      resolucao: |
        $k = 1{,}2$: suco $\times 1{,}2^3 = 1{,}728$; casca $\times 1{,}2^2 = 1{,}44$.
      resposta: '1,728 e 1,44'
    - enunciado: 'Uma caixa de 20 cm por 10 cm por 5 cm é ampliada, sem mudar a forma, até ter área total 2,25 vezes maior. Calcule as novas dimensões e o novo volume.'
      espaco: 10
      resolucao: |
        $k^2 = 2{,}25$: $k = 1{,}5$. Dimensões 30, 15 e 7,5 cm; volume $1000 \cdot 3{,}375 = 3375$ cm³.
      resposta: '30, 15 e 7,5 cm; 3375 cm³'
    - enunciado: 'Duas estátuas semelhantes, do mesmo material, têm massas de 16 kg e 54 kg. A menor tem 1,2 m de altura. Qual a altura da maior?'
      espaco: 8
      resolucao: |
        $k^3 = \tfrac{54}{16} = \tfrac{27}{8}$: $k = \tfrac{3}{2}$. Altura $1{,}8$ m.
      resposta: '1,8 m'
    - enunciado: 'Uma embalagem é ampliada em 20\% em todas as dimensões. O material (área) e o conteúdo (volume) crescem quanto, em porcentagem? O custo do material por unidade de volume aumenta ou diminui?'
      espaco: 10
      resolucao: |
        Área $\times 1{,}44$ (+44\%); volume $\times 1{,}728$ (+72,8\%). Material por volume: $\tfrac{1{,}44}{1{,}728} \approx 0{,}83$, diminui.
      resposta: '+44\%, +72,8\%; diminui'
  - nome: Nível 3
    questoes:
    - enunciado: 'Dois cilindros são semelhantes, de razão $k$: o segundo tem raio $kr$ e altura $kh$. Prove que as áreas totais estão na razão $k^2$ e os volumes na razão $k^3$.'
      espaco: 10
      resolucao: |
        $2\pi(kr)(kr + kh) = k^2 \cdot 2\pi r(r + h)$; $\pi(kr)^2(kh) = k^3 \cdot \pi r^2 h$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que, se dois sólidos semelhantes têm volumes na razão $q$, as suas áreas estão na razão $q^{2/3}$.'
      espaco: 8
      resolucao: |
        $k^3 = q$: $k = q^{1/3}$ e $k^2 = q^{2/3}$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que um plano paralelo à base de um cone de altura $H$, a uma distância $d$ do vértice, determina um cone semelhante ao original, de razão $\frac{d}{H}$.'
      espaco: 10
      resolucao: |
        Na secção meridiana, os triângulos do cone menor e do original têm o ângulo do vértice em comum e bases paralelas: são semelhantes, de razão $\tfrac{d}{H}$. Logo raio e altura do cone menor são $\tfrac{d}{H}$ dos originais.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que, entre sólidos semelhantes de razão $k$, a razão entre a área da superfície e o volume fica dividida por $k$.'
      espaco: 8
      resolucao: |
        $\tfrac{k^2 A}{k^3 V} = \tfrac{1}{k} \cdot \tfrac{A}{V}$. Sólidos maiores têm menos superfície por unidade de volume.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que dois cubos quaisquer são semelhantes, mas que dois paralelepípedos retângulos podem não ser.'
      espaco: 8
      resolucao: |
        Cubos de arestas $a$ e $b$: todas as medidas ficam multiplicadas por $\tfrac{b}{a}$. Paralelepípedos $1 \times 1 \times 1$ e $1 \times 1 \times 2$: as razões entre arestas correspondentes seriam 1 e 2, diferentes.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Uma marca de perfumes vende o mesmo produto em dois frascos semelhantes, como na figura: o menor tem 8 cm de altura e capacidade de 50 mL, e o maior tem 12 cm de altura. Os dois frascos são vendidos cheios, e o fabricante quer imprimir no rótulo a capacidade do frasco maior.
    figura:
      tikz: |
        \begin{scope}[scale=.3]
        \draw[ink, line width=1pt, fill=lilas!25] (0,0) rectangle (4,6);
        \draw[ink, line width=1pt, fill=lilas!40] (1.4,6) rectangle (2.6,8);
        \draw[ink, line width=1pt, fill=lilas!25] (6,0) rectangle (12,9);
        \draw[ink, line width=1pt, fill=lilas!40] (8.1,9) rectangle (9.9,12);
        \end{scope}
    enunciado: |
      A capacidade do frasco maior é
    opcoes: ['$168{,}75$ mL', '$75$ mL', '$112{,}5$ mL', '$100$ mL', '$225$ mL']
    correta: A
    resolucao: |
      $k = \tfrac{12}{8} = \tfrac{3}{2}$: $50 \cdot \tfrac{27}{8} = 168{,}75$ mL.

  - estilo: Fuvest
    enunciado: |
      Dois cones semelhantes têm alturas na razão $\frac{2}{5}$. A razão entre os seus volumes é
    opcoes: ['$\frac{4}{25}$', '$\frac{8}{125}$', '$\frac{2}{5}$', '$\frac{6}{15}$', '$\frac{16}{625}$']
    correta: B
    resolucao: |
      $\left(\tfrac{2}{5}\right)^3$.

  - estilo: Unicamp
    enunciado: |
      Um reservatório tem capacidade de 2000 m³. Uma maquete dele, na escala 1 : 100, tem capacidade de
    opcoes: ['$20$ L.', '$0{,}2$ L.', '$2$ L.', '$200$ L.']
    correta: C
    resolucao: |
      Volumes na razão $\tfrac{1}{10^6}$: $0{,}002$ m³ $= 2$ L.

  - estilo: UEM
    enunciado: |
      Dois cilindros semelhantes, do mesmo material, têm raios 2 e 5, e o menor tem altura 4 e massa 80 g. Assinale o que for correto.
    proposicoes:
    - 'O cilindro maior tem altura 10.'
    - 'O cilindro maior tem volume $250\pi$.'
    - 'O cilindro maior tem área lateral $100\pi$.'
    - 'As áreas totais estão na razão $\frac{25}{4}$.'
    - 'Os volumes estão na razão $\frac{5}{2}$.'
    - 'O cilindro maior tem massa de 1250 g.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      $k = \tfrac{5}{2}$. 01) $4k$. 02) $\pi \cdot 25 \cdot 10$. 04) $2\pi \cdot 5 \cdot 10$. 08) $k^2$. 16) Incorreta: $k^3 = \tfrac{125}{8}$. 32) $80 \cdot \tfrac{125}{8}$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      Uma escultura de bronze maciço, com 2 m de altura, tem massa de 800 kg. Para uma exposição itinerante, um ateliê fará uma réplica do mesmo material e com a mesma forma, mas com apenas 50 cm de altura, e precisa estimar a massa da réplica para planejar o transporte.
    enunciado: |
      A massa da réplica é
    opcoes: ['$200$ kg', '$50$ kg', '$100$ kg', '$12{,}5$ kg', '$25$ kg']
    correta: D
    resolucao: |
      $k = \tfrac{0{,}5}{2} = \tfrac{1}{4}$: $800 \cdot \tfrac{1}{64} = 12{,}5$ kg.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir, sobre sólidos semelhantes.
    afirmativas:
    - 'Dois cubos quaisquer são semelhantes.'
    - 'Dois cilindros quaisquer são semelhantes.'
    - 'Se a razão linear é $k$, a razão entre as áreas é $k^2$.'
    - 'Se as áreas estão na razão 16, os volumes estão na razão 64.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'II e III, apenas.', 'II e IV, apenas.', 'I, II e III, apenas.', 'I, III e IV, apenas.']
    correta: E
    resolucao: |
      I. Correta. II. Incorreta: a razão raio/altura pode mudar. III. Correta. IV. Correta: $k = 4$, $k^3 = 64$.

  - estilo: Unesp
    enunciado: |
      As áreas totais de dois sólidos semelhantes estão na razão $\frac{25}{9}$. A razão entre os volumes é
    opcoes: ['$\frac{125}{27}$', '$\frac{25}{9}$', '$\frac{5}{3}$', '$\frac{625}{81}$', '$\frac{75}{27}$']
    correta: A
    resolucao: |
      $k = \tfrac{5}{3}$: $k^3 = \tfrac{125}{27}$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      As duas pirâmides quadrangulares regulares da figura são semelhantes, com arestas da base 4 e 6. A menor tem volume 32.
    figura:
      tikz: |
        \begin{scope}[scale=.45]
        \draw[ink, line width=1pt] (0,0) -- (2,0) -- (2.7,0.6) (0,0) -- (1.35,2.4) -- (2,0) (1.35,2.4) -- (2.7,0.6);
        \draw[ink, dashed] (0,0) -- (0.7,0.6) -- (2.7,0.6) (0.7,0.6) -- (1.35,2.4);
        \node[below, font=\scriptsize] at (1,0) {$4$};
        \draw[ink, line width=1pt] (4,0) -- (7,0) -- (8.05,0.9) (4,0) -- (6.02,3.6) -- (7,0) (6.02,3.6) -- (8.05,0.9);
        \draw[ink, dashed] (4,0) -- (5.05,0.9) -- (8.05,0.9) (5.05,0.9) -- (6.02,3.6);
        \node[below, font=\scriptsize] at (5.5,0) {$6$};
        \end{scope}
    enunciado: |
      O volume da pirâmide maior é
    opcoes: ['$48$.', '$108$.', '$72$.', '$216$.']
    correta: B
    resolucao: |
      $k = \tfrac{3}{2}$: $32 \cdot \tfrac{27}{8} = 108$.

  - estilo: Fuvest
    enunciado: |
      Dois sólidos semelhantes têm volumes 8 e 27. Se a área total do menor é 12, a do maior é
    opcoes: ['$18$', '$40{,}5$', '$27$', '$36$', '$12$']
    correta: C
    resolucao: |
      $k = \tfrac{3}{2}$, $k^2 = \tfrac{9}{4}$: $12 \cdot \tfrac{9}{4} = 27$.

  - estilo: UFSC
    enunciado: |
      Uma caixa-d'água cilíndrica tem 2 m de raio e 3 m de altura. Uma maquete dela é feita na escala 1 : 20. Assinale o que for correto.
    proposicoes:
    - 'O raio da maquete é 10 cm.'
    - 'A altura da maquete é 15 cm.'
    - 'A capacidade real é 8000 vezes a da maquete.'
    - 'A área lateral real é 400 vezes a da maquete.'
    - 'A capacidade da maquete é $1{,}5\pi$ litros.'
    - 'A área lateral real é 20 vezes a da maquete.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) $\tfrac{200}{20}$. 02) $\tfrac{300}{20}$. 04) $20^3$. 08) $20^2$. 16) $\pi \cdot 100 \cdot 15 = 1500\pi$ cm³. 32) Incorreta: é 400.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      Numa feira, uma melancia grande, com o dobro do diâmetro de uma pequena e a mesma forma, custa 5 vezes o preço da pequena. Um cliente quer decidir qual compra é mais vantajosa, considerando que a quantidade de polpa é proporcional ao volume da fruta.
    enunciado: |
      A melancia grande é
    opcoes: ['mais vantajosa, pois tem 8 vezes a polpa por 5 vezes o preço.', 'menos vantajosa, pois tem 4 vezes a polpa por 5 vezes o preço.', 'igualmente vantajosa, pois tem 5 vezes a polpa.', 'menos vantajosa, pois tem 2 vezes a polpa por 5 vezes o preço.', 'mais vantajosa, pois tem 6 vezes a polpa por 5 vezes o preço.']
    correta: A
    resolucao: |
      $k = 2$: o volume fica multiplicado por 8.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir, sobre sólidos semelhantes.
    afirmacoes:
    - 'Se a razão linear é 3, as áreas estão na razão 9.'
    - 'Para dobrar o volume, basta dobrar todas as dimensões.'
    - 'O volume real de um objeto é 1000 vezes o da sua maquete na escala 1 : 10.'
    - 'Se duas peças semelhantes, do mesmo material, têm massas de 2 kg e 16 kg, a altura da maior é o dobro da altura da menor.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – F – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – V – F.', 'V – F – V – V.']
    correta: E
    resolucao: |
      (V) (F) Dobrar as dimensões multiplica o volume por 8; para dobrá-lo, $k = \sqrt[3]{2}$. (V) $10^3$. (V) $k^3 = 8$, $k = 2$.

  - estilo: Enem
    texto: |
      Um sabão em pó é vendido em cinco caixas semelhantes. O quadro mostra, para cada tamanho, a razão linear em relação à caixa P e o preço. O comprador quer o tamanho com o menor preço por unidade de volume, sabendo que todas vêm cheias.
    tabela:
      cabecalho: ['Tamanho', 'Razão linear', 'Preço (R\$)']
      linhas:
      - ['P', '$1$', '$4{,}00$']
      - ['M', '$1{,}2$', '$6{,}50$']
      - ['G', '$1{,}5$', '$12{,}00$']
      - ['GG', '$2$', '$26{,}00$']
      - ['XG', '$2{,}5$', '$56{,}00$']
    enunciado: |
      O tamanho mais econômico é o
    opcoes: ['P.', 'M.', 'G.', 'GG.', 'XG.']
    correta: D
    resolucao: |
      Volumes relativos $k^3$: 1; 1,728; 3,375; 8; 15,625. Preço por volume: 4; $\approx 3{,}76$; $\approx 3{,}56$; $3{,}25$; $\approx 3{,}58$.

  - estilo: Unesp
    enunciado: |
      Uma peça é ampliada, sem mudar a forma, e a sua área total fica 2,25 vezes maior. A razão linear da ampliação é
    opcoes: ['$2{,}25$', '$1{,}5$', '$3{,}375$', '$1{,}125$', '$0{,}75$']
    correta: B
    resolucao: |
      $k^2 = 2{,}25$: $k = 1{,}5$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Um cone de volume 250 é cortado por um plano paralelo à base, a $\frac{3}{5}$ da altura a partir do vértice. Assinale o que for correto.
    proposicoes:
    - 'O cone menor obtido é semelhante ao original, de razão $\frac{3}{5}$.'
    - 'O cone menor tem volume 54.'
    - 'O tronco tem volume 196.'
    - 'As áreas laterais do cone menor e do original estão na razão $\frac{9}{25}$.'
    - 'A área da secção é $\frac{3}{5}$ da área da base.'
    - 'O tronco tem mais de $\frac{3}{4}$ do volume do cone.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) Correta. 02) $250 \cdot \tfrac{27}{125}$. 04) $250 - 54$. 08) $k^2$. 16) Incorreta: $\tfrac{9}{25}$. 32) $\tfrac{196}{250} = 0{,}784$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Unicamp
    enunciado: |
      Um recipiente cônico, com o vértice para baixo, recebe água. Para que a água ocupe $\frac{1}{8}$ da capacidade, ela deve atingir, em relação à altura total, a fração
    opcoes: ['$\frac{1}{2}$.', '$\frac{1}{8}$.', '$\frac{1}{4}$.', '$\frac{1}{3}$.']
    correta: A
    resolucao: |
      A água forma um cone semelhante: $k^3 = \tfrac{1}{8}$, $k = \tfrac{1}{2}$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
