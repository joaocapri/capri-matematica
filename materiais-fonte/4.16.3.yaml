aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Dois paralelepípedos retângulos são semelhantes, de razão $k$: as arestas do segundo são $ka$, $kb$ e $kc$.'
    itens:
    - 'Prove que as áreas totais estão na razão $k^2$.'
    - 'Prove que os volumes estão na razão $k^3$.'
    - 'Se o primeiro tem arestas 2, 3 e 6 e o segundo tem volume 288, calcule as arestas e a área total do segundo.'
    espaco: 62
    resolucao: |
      a) $2(k^2ab + k^2bc + k^2ac) = k^2 \cdot 2(ab + bc + ac)$.
      b) $(ka)(kb)(kc) = k^3 abc$.
      c) $36k^3 = 288$: $k = 2$. Arestas 4, 6 e 12; área $2(24 + 72 + 48) = 288$.
    resposta: 'c) 4, 6 e 12; 288'

  - estilo: Unicamp
    enunciado: 'A resistência de um osso é proporcional à área da sua secção transversal, e o peso de um animal é proporcional ao seu volume.'
    itens:
    - 'Num animal ampliado com razão linear $k$, por quanto ficam multiplicados a resistência dos ossos e o peso?'
    - 'Prove que a razão peso/resistência fica multiplicada por $k$.'
    - 'Por que um animal 10 vezes maior, com as mesmas proporções, teria problemas para se sustentar?'
    espaco: 62
    resolucao: |
      a) Resistência $\times k^2$; peso $\times k^3$.
      b) $\tfrac{k^3}{k^2} = k$.
      c) Cada centímetro quadrado de osso suportaria 10 vezes mais carga. Por isso animais grandes têm ossos proporcionalmente mais grossos.
    resposta: 'a) $k^2$ e $k^3$; c) carga 10 vezes maior por área de osso'

  - estilo: ITA
    enunciado: |
      Um recipiente cônico, com o vértice para baixo, é enchido com vazão constante. A água atinge a metade da altura em 4 minutos. O tempo que ainda falta para o recipiente ficar cheio é
    opcoes: ['$4$ min', '$28$ min', '$32$ min', '$12$ min', '$8$ min']
    correta: B
    espaco: 22
    resolucao: |
      Na metade da altura, a água forma um cone semelhante de razão $\tfrac{1}{2}$: $\tfrac{1}{8}$ da capacidade em 4 min. Enche em 32 min; faltam 28.
    resposta: 'B'

  - estilo: Unesp
    texto: |
      Uma piscina de 10 m por 5 m e 2 m de profundidade é representada por uma maquete na escala 1 : 50.
    enunciado: ''
    itens:
    - 'Calcule as dimensões da maquete.'
    - 'Calcule a capacidade da maquete e da piscina e a razão entre elas.'
    - 'A maquete foi pintada por dentro com 30 mL de tinta. Quanta tinta pinta a piscina?'
    espaco: 62
    resolucao: |
      a) 20 cm, 10 cm e 4 cm.
      b) Maquete $800$ cm³ $= 0{,}8$ L; piscina $100$ m³ $= 100\,000$ L. Razão $50^3 = 125\,000$.
      c) Áreas $\times 2500$: $75\,000$ mL $= 75$ L.
    resposta: 'a) 20, 10 e 4 cm; b) 0,8 L e 100 000 L; c) 75 L'

  - estilo: UFSC
    enunciado: |
      Considere sólidos semelhantes. Assinale o que for correto.
    proposicoes:
    - 'Dois cubos quaisquer são semelhantes.'
    - 'Dois cones equiláteros quaisquer são semelhantes.'
    - 'Dois cilindros quaisquer são semelhantes.'
    - 'Se as áreas estão na razão $\frac{4}{9}$, os volumes estão na razão $\frac{8}{27}$.'
    - 'Para sólidos semelhantes do mesmo material, as massas estão na razão do cubo da razão linear.'
    - 'Dobrando todas as dimensões, a área total fica multiplicada por 4.'
    corretas: [1, 2, 4, 5, 6]
    espaco: 22
    resolucao: |
      01) Correta. 02) A geratriz é sempre o dobro do raio: a forma é a mesma. 04) Incorreta. 08) $k = \tfrac{2}{3}$. 16) A massa acompanha o volume. 32) $2^2$.
    resposta: 'Soma 59 (01 + 02 + 08 + 16 + 32)'

  - estilo: Fuvest
    enunciado: 'Dois cones semelhantes têm volumes na razão $\frac{8}{27}$, e a diferença entre as suas alturas é 5.'
    itens:
    - 'Calcule a razão linear.'
    - 'Calcule as duas alturas.'
    - 'Se a área lateral do menor é $40\pi$, calcule a do maior.'
    espaco: 62
    resolucao: |
      a) $k = \tfrac{2}{3}$.
      b) $H - \tfrac{2H}{3} = 5$: $H = 15$ e $h = 10$.
      c) $40\pi \cdot \tfrac{9}{4} = 90\pi$.
    resposta: 'a) $\frac{2}{3}$; b) 10 e 15; c) $90\pi$'

  - estilo: Unicamp
    enunciado: 'Um fabricante aumenta em 10\% todas as dimensões de uma embalagem, sem mudar a forma.'
    itens:
    - 'Em que porcentagem aumenta a quantidade de material (área)?'
    - 'Em que porcentagem aumenta o conteúdo (volume)?'
    - 'Se o custo da embalagem é proporcional à área, o custo por unidade de conteúdo aumenta ou diminui? Em quanto, aproximadamente?'
    espaco: 62
    resolucao: |
      a) $1{,}1^2 = 1{,}21$: 21\%.
      b) $1{,}1^3 = 1{,}331$: 33,1\%.
      c) $\tfrac{1{,}21}{1{,}331} \approx 0{,}909$: diminui cerca de 9\%.
    resposta: 'a) 21\%; b) 33,1\%; c) diminui cerca de 9\%'

  - estilo: Fuvest
    enunciado: |
      Dois sólidos semelhantes têm volumes 64 e 125. Se a área total do menor é 48, a do maior é
    opcoes: ['$60$', '$93{,}75$', '$75$', '$80$', '$62{,}5$']
    correta: C
    espaco: 22
    resolucao: |
      $k = \tfrac{5}{4}$, $k^2 = \tfrac{25}{16}$: $48 \cdot \tfrac{25}{16} = 75$.
    resposta: 'C'

  - estilo: Unesp
    enunciado: 'Duas jarras de vidro semelhantes têm alturas de 16 cm e 20 cm. A menor tem capacidade de 1,28 L e usa 640 cm² de vidro.'
    itens:
    - 'Calcule a capacidade da maior.'
    - 'Calcule a área de vidro da maior.'
    - 'Se o preço é proporcional à área de vidro e a menor custa R\$\,32,00, quanto custa a maior? Qual delas tem o menor preço por litro?'
    espaco: 62
    resolucao: |
      a) $k = \tfrac{5}{4}$: $1{,}28 \cdot \tfrac{125}{64} = 2{,}5$ L.
      b) $640 \cdot \tfrac{25}{16} = 1000$ cm².
      c) $32 \cdot \tfrac{25}{16} = 50$ reais. Por litro: $\tfrac{32}{1{,}28} = 25$ e $\tfrac{50}{2{,}5} = 20$: a maior.
    resposta: 'a) 2,5 L; b) 1000 cm²; c) R\$\,50,00; a maior'

  - estilo: Fuvest
    enunciado: 'A maquete de um prédio, na escala 1 : 200, tem 60 cm de altura, volume de 9 L e área de fachada de 0,24 m².'
    itens:
    - 'Calcule a altura real do prédio.'
    - 'Calcule o volume real, em m³.'
    - 'Calcule a área real da fachada.'
    espaco: 62
    resolucao: |
      a) $0{,}6 \cdot 200 = 120$ m.
      b) $9 \cdot 200^3 = 72 \cdot 10^6$ L $= 72\,000$ m³.
      c) $0{,}24 \cdot 200^2 = 9600$ m².
    resposta: 'a) 120 m; b) 72 000 m³; c) 9600 m²'
