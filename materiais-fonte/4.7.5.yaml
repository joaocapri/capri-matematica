aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Num quadrado de lado $2a$, traçam-se quatro semicírculos internos, cada um com diâmetro num lado.'
    itens:
    - 'Calcule a área de uma pétala (região comum a dois semicírculos vizinhos).'
    - 'Calcule a área total das quatro pétalas.'
    - 'Mostre, usando áreas, que os quatro semicírculos cobrem todo o quadrado.'
    espaco: 62
    resolucao: |
      a) A pétala são dois segmentos de um quarto de círculo de raio $a$: $2\left(\tfrac{\pi a^2}{4} - \tfrac{a^2}{2}\right) = \tfrac{\pi a^2}{2} - a^2$.
      b) $2\pi a^2 - 4a^2$.
      c) A área coberta é a soma dos semicírculos menos as sobreposições (as pétalas, cobertas duas vezes): $4 \cdot \tfrac{\pi a^2}{2} - (2\pi a^2 - 4a^2) = 4a^2$, a área do quadrado.
    resposta: 'a) $\frac{\pi a^2}{2} - a^2$; b) $2\pi a^2 - 4a^2$'

  - estilo: Unicamp
    texto: |
      Uma janela normanda é um retângulo de largura $2r$ e altura $h$, com um semicírculo de raio $r$ em cima. O contorno da janela (os três lados do retângulo e o arco) mede $4 + \pi$ metros.
    enunciado: ''
    itens:
    - 'Escreva $h$ em função de $r$.'
    - 'Escreva a área da janela em função de $r$.'
    - 'Determine $r$ e $h$ para que a área seja máxima, e calcule essa área.'
    espaco: 62
    resolucao: |
      a) $2r + 2h + \pi r = 4 + \pi$: $h = \tfrac{4 + \pi - (2 + \pi)r}{2}$.
      b) $A = 2rh + \tfrac{\pi r^2}{2} = (4 + \pi)r - (2 + \pi)r^2 + \tfrac{\pi r^2}{2} = (4 + \pi)r - \left(2 + \tfrac{\pi}{2}\right)r^2$.
      c) Parábola de vértice em $r = \tfrac{4 + \pi}{2(2 + \pi/2)} = 1$; então $h = 1$ e $A = 4 + \pi - 2 - \tfrac{\pi}{2} = 2 + \tfrac{\pi}{2}$ m².
    resposta: 'c) $r = h = 1$ m; $2 + \frac{\pi}{2}$ m²'

  - estilo: ITA
    enunciado: |
      Num quadrado de lado 1, traçam-se quatro quartos de círculo de raio 1, com centros nos vértices. A área da região central, comum aos quatro, é
    opcoes: ['$\frac{\pi}{4}$', '$1 - \frac{\sqrt{3}}{4}$', '$1 + \frac{\pi}{3} - \sqrt{3}$', '$\frac{\pi}{3} - \frac{\sqrt{3}}{2}$', '$\pi - 3$']
    correta: C
    espaco: 22
    resolucao: |
      Com o quadrado de vértices $(0, 0)$, $(1, 0)$, $(1, 1)$ e $(0, 1)$, os arcos de centros vizinhos se cortam em pontos como $\left(\tfrac{1}{2}, \tfrac{\sqrt{3}}{2}\right)$ (vértice de um triângulo equilátero sobre um lado). Os quatro pontos desse tipo formam um quadrado de diagonal $\sqrt{3} - 1$ e área $\tfrac{(\sqrt{3} - 1)^2}{2} = 2 - \sqrt{3}$. Cada lado dele é corda de um arco de $30°$ e raio 1, e os quatro segmentos somam $4\left(\tfrac{\pi}{12} - \tfrac{1}{4}\right) = \tfrac{\pi}{3} - 1$. Total: $1 + \tfrac{\pi}{3} - \sqrt{3}$.
    resposta: 'C'

  - estilo: Unesp
    texto: |
      Um quadro retangular de 60 cm por 40 cm receberá uma moldura de largura constante $x$ cm em toda a volta.
    enunciado: ''
    itens:
    - 'Escreva a área da moldura em função de $x$.'
    - 'Determine $x$ para que a moldura tenha a mesma área do quadro.'
    - 'Nesse caso, calcule o perímetro externo da moldura.'
    espaco: 62
    resolucao: |
      a) $(60 + 2x)(40 + 2x) - 2400 = 4x^2 + 200x$.
      b) $4x^2 + 200x = 2400$: $x^2 + 50x - 600 = 0$, $x = 10$ cm.
      c) Por fora: $80 \times 60$, perímetro $280$ cm.
    resposta: 'a) $4x^2 + 200x$; b) 10 cm; c) 280 cm'

  - estilo: UFSC
    enunciado: |
      Assinale o que for correto.
    proposicoes:
    - 'Num quadrado de lado 2 com quatro semicírculos internos sobre os lados, as pétalas somam $2\pi - 4$.'
    - 'A lúnula de Hipócrates construída sobre a corda de um quarto de círculo de raio 2 tem área 2.'
    - 'A região comum aos quatro quartos de círculo de raio 1, centrados nos vértices de um quadrado de lado 1, tem área $\frac{\pi}{4}$.'
    - 'A “folha” comum a dois quartos de círculo de raio 2, centrados em vértices opostos de um quadrado de lado 2, tem área $2\pi - 4$.'
    - 'Um círculo de raio 1 tem área maior que a de um quadrado de lado 1,8.'
    - 'Um retângulo de $4 \times 2$ com dois semicírculos de diâmetro 2 acoplados aos lados menores tem área $8 + \pi$.'
    corretas: [1, 2, 4, 6]
    espaco: 22
    resolucao: |
      01) Correta. 02) Correta. 04) Incorreta: $1 + \tfrac{\pi}{3} - \sqrt{3}$. 08) Dois segmentos de $\pi - 2$. 16) Incorreta: $\pi < 3{,}24$. 32) Os dois semicírculos formam um círculo de raio 1.
    resposta: 'Soma 43 (01 + 02 + 08 + 32)'

  - estilo: Fuvest
    enunciado: 'Num quarto de círculo de centro $O$ e raio $r$, a corda $AB$ une as extremidades do arco, e sobre ela se traça, para fora, um semicírculo.'
    itens:
    - 'Calcule a área do segmento circular limitado pelo arco $AB$ do quarto de círculo e pela corda $AB$.'
    - 'Calcule a área do semicírculo de diâmetro $AB$.'
    - 'Prove que a lúnula tem área igual à do triângulo $OAB$.'
    espaco: 62
    resolucao: |
      a) $\tfrac{\pi r^2}{4} - \tfrac{r^2}{2}$.
      b) $AB = r\sqrt{2}$: $\tfrac{1}{2}\pi\left(\tfrac{r\sqrt{2}}{2}\right)^2 = \tfrac{\pi r^2}{4}$.
      c) Lúnula $=$ semicírculo $-$ segmento $= \tfrac{\pi r^2}{4} - \tfrac{\pi r^2}{4} + \tfrac{r^2}{2} = \tfrac{r^2}{2}$, a área de $OAB$.
    resposta: 'c) $\frac{r^2}{2}$'

  - estilo: Unicamp
    texto: |
      O piso de uma sala em L é um retângulo de 8 m por 6 m do qual falta um canto retangular de 3 m por 2 m.
    enunciado: ''
    itens:
    - 'Calcule a área do piso.'
    - 'Quantas lajotas quadradas de 30 cm de lado são necessárias, comprando 10\% a mais para perdas?'
    - 'Calcule o comprimento do rodapé, que contorna toda a sala, e explique por que ele é igual ao perímetro do retângulo de 8 m por 6 m.'
    espaco: 62
    resolucao: |
      a) $48 - 6 = 42$ m².
      b) $\tfrac{42}{0{,}09} \approx 466{,}7$; com 10\% a mais, $\approx 513{,}3$: 514 lajotas.
      c) Os dois lados do canto retirado, juntos, substituem exatamente os pedaços que faltam dos lados do retângulo: $2(8 + 6) = 28$ m.
    resposta: 'a) 42 m²; b) 514; c) 28 m'

  - estilo: Fuvest
    enunciado: |
      A região de um círculo de raio 2 que fica fora do quadrado inscrito nele tem área
    opcoes: ['$4\pi - 8$', '$4\pi - 4$', '$2\pi - 4$', '$4\pi - 16$', '$\pi - 2$']
    correta: A
    espaco: 22
    resolucao: |
      O quadrado inscrito tem diagonal 4 e área $\tfrac{16}{2} = 8$: $4\pi - 8$.
    resposta: 'A'

  - estilo: Unesp
    texto: |
      Num quadrado de lado $2r$, está inscrito um círculo de raio $r$. Em cada canto, um círculo menor é tangente a dois lados do quadrado e ao círculo inscrito.
    enunciado: ''
    itens:
    - 'Calcule a área da região de um canto, fora do círculo inscrito.'
    - 'Calcule o raio dos círculos menores.'
    - 'Para $r = 1$, que fração da região de um canto o círculo menor ocupa? ($\pi \approx 3{,}14$ e $\sqrt{2} \approx 1{,}414$)'
    espaco: 62
    resolucao: |
      a) $\tfrac{(4 - \pi)r^2}{4}$.
      b) Na diagonal: $x\sqrt{2} + x + r = r\sqrt{2}$, $x = r(3 - 2\sqrt{2})$.
      c) $x \approx 0{,}172$: área $\pi x^2 \approx 0{,}093$; o canto tem $\approx 0{,}215$. Fração $\approx 0{,}43$.
    resposta: 'a) $\frac{(4 - \pi)r^2}{4}$; b) $r(3 - 2\sqrt{2})$; c) $\approx 43\%$'

  - estilo: Fuvest
    enunciado: 'No triângulo retângulo $ABC$, de catetos 6 e 8, são traçados semicírculos sobre os três lados: os dos catetos para fora e o da hipotenusa para o lado do vértice $C$ do ângulo reto.'
    itens:
    - 'Calcule as áreas dos três semicírculos.'
    - 'Calcule a área da figura formada pelo triângulo e pelos dois semicírculos dos catetos.'
    - 'Calcule a soma das áreas das duas lúnulas (partes dos semicírculos dos catetos fora do semicírculo da hipotenusa).'
    espaco: 62
    resolucao: |
      a) $\tfrac{9\pi}{2}$, $8\pi$ e $\tfrac{25\pi}{2}$.
      b) $24 + \tfrac{9\pi}{2} + 8\pi = 24 + \tfrac{25\pi}{2}$.
      c) A mesma figura é o semicírculo da hipotenusa mais as lúnulas: lúnulas $= 24 + \tfrac{25\pi}{2} - \tfrac{25\pi}{2} = 24$.
    resposta: 'a) $\frac{9\pi}{2}$, $8\pi$, $\frac{25\pi}{2}$; b) $24 + \frac{25\pi}{2}$; c) 24'
