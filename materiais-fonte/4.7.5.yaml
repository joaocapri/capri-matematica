# Aula 4.7.5 — Geometria plana: áreas de figuras compostas
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: dividir e somar, completar e subtrair; figuras com semicírculos e quadrantes; sobreposições; molduras e
# faixas; revestimento com lajotas; polígonos em malha quadriculada; regiões clássicas (folha, pétalas, lúnula de Hipócrates,
# círculo no canto); janela normanda (otimização) no aprofundamento.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Deixe as respostas em função de $\pi$, salvo indicação. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Calcule a área da figura em L, de duas maneiras: dividindo em retângulos e completando o retângulo.'
      figura:
        tikz: |
          \begin{scope}[scale=.25]
          \draw[ink, line width=1pt, fill=lilas!25] (0,0) -- (12,0) -- (12,5) -- (7,5) -- (7,9) -- (0,9) -- cycle;
          \node[below, font=\scriptsize] at (6,0) {$12$};
          \node[left, font=\scriptsize] at (0,4.5) {$9$};
          \node[above, font=\scriptsize] at (3.5,9) {$7$};
          \node[right, font=\scriptsize] at (12,2.5) {$5$};
          \end{scope}
      espaco: 10
      resolucao: |
        Dividindo: $12 \cdot 5 + 7 \cdot 4 = 60 + 28 = 88$. Completando: $12 \cdot 9 - 5 \cdot 4 = 108 - 20 = 88$.
      resposta: '88'
    - enunciado: 'Complete com a área de cada figura composta.'
      itens:
      - 'Retângulo $6 \times 4$ com um triângulo de base 6 e altura 3 sobre o lado de medida 6: {{33}}'
      - 'Quadrado de lado 8 com um semicírculo de diâmetro 8 sobre um lado: {{64 + 8\pi}}'
      - 'Retângulo $10 \times 6$ com um furo circular de raio 2: {{60 - 4\pi}}'
      espaco_item: 10
      resolucao: |
        $24 + 9$; $64 + \tfrac{16\pi}{2}$; $60 - 4\pi$.
      resposta: '$33$; $64 + 8\pi$; $60 - 4\pi$'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Pode-se achar a área de uma figura completando-a até uma figura conhecida e subtraindo o que sobra.'
      - 'Se duas figuras se sobrepõem, a área coberta por elas é a soma das duas áreas.'
      - 'Recortando uma figura e rearrumando as peças, sem sobreposição, a área não muda.'
      - 'O perímetro de uma figura composta é a soma dos perímetros das partes.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) (F) A parte comum seria contada duas vezes; é preciso subtraí-la uma vez. (V) (F) Os lados internos, de contato entre as partes, não fazem parte do contorno.
      resposta: V, F, V, F
    - enunciado: 'A cruz da figura é formada por 5 quadrados de lado 3. Complete.'
      figura:
        tikz: |
          \begin{scope}[scale=.25]
          \draw[ink, line width=1pt, fill=lilas!25] (3,0) -- (6,0) -- (6,3) -- (9,3) -- (9,6) -- (6,6) -- (6,9) -- (3,9) -- (3,6) -- (0,6) -- (0,3) -- (3,3) -- cycle;
          \draw[mudo, dashed] (3,3) -- (6,3) -- (6,6) -- (3,6) -- cycle;
          \node[below, font=\scriptsize] at (4.5,0) {$3$};
          \end{scope}
      itens:
      - 'Área: {{45}}'
      - 'Perímetro: {{36}}'
      espaco_item: 8
      resolucao: |
        Área $5 \cdot 9 = 45$. O contorno tem 12 segmentos de medida 3: $36$.
      resposta: '45; 36'
    - enunciado: 'Uma janela é um retângulo de 1,2 m de largura por 1 m de altura, com um semicírculo de diâmetro 1,2 m em cima. Calcule a área de vidro.'
      espaco: 8
      resolucao: |
        $1{,}2 \cdot 1 + \tfrac{\pi \cdot 0{,}6^2}{2} = 1{,}2 + 0{,}18\pi$ m² ($\approx 1{,}77$ m²).
      resposta: '$1{,}2 + 0{,}18\pi$ m²'
    - enunciado: 'Um quadro de 50 cm por 40 cm tem uma moldura de 5 cm de largura em toda a volta. Complete.'
      itens:
      - 'Área do quadro com a moldura: {{3000}} cm²'
      - 'Área do quadro: {{2000}} cm²'
      - 'Área da moldura: {{1000}} cm²'
      espaco_item: 8
      resolucao: |
        Por fora, $60 \times 50 = 3000$; quadro $2000$; moldura $1000$.
      resposta: '3000; 2000; 1000'
    - enunciado: 'De um quadrado de lado 6 retiram-se quatro quartos de círculo de raio 3, com centros nos vértices. Calcule a área que sobra.'
      espaco: 8
      resolucao: |
        Os quatro quartos formam um círculo de raio 3: $36 - 9\pi$.
      resposta: '$36 - 9\pi$'
  - nome: Nível 2
    questoes:
    - texto: |
        Dois retângulos de $8 \times 3$ se cruzam formando um sinal de mais, com o centro comum. Pedro disse que a área do sinal é $24 + 24 = 48$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 10
      resolucao: |
        O quadrado central $3 \times 3$ pertence aos dois retângulos e foi contado duas vezes: $48 - 9 = 39$.
      resposta: '39'
    - enunciado: 'Calcule a área do pentágono da figura.'
      figura:
        tikz: |
          \begin{scope}[scale=.25]
          \draw[ink, line width=1pt, fill=lilas!25] (0,0) -- (10,0) -- (10,4) -- (6,7) -- (0,7) -- cycle;
          \draw[mudo, dashed] (6,7) -- (10,7) -- (10,4);
          \node[below, font=\scriptsize] at (5,0) {$10$};
          \node[left, font=\scriptsize] at (0,3.5) {$7$};
          \node[right, font=\scriptsize] at (10,2) {$4$};
          \node[above, font=\scriptsize] at (3,7) {$6$};
          \end{scope}
      espaco: 10
      resolucao: |
        Completando o retângulo $10 \times 7$, sobra um triângulo retângulo de catetos 4 e 3: $70 - 6 = 64$.
      resposta: '64'
    - enunciado: 'Um campo é formado por um retângulo de 100 m por 60 m e por dois semicírculos de diâmetro 60 m, um em cada lado menor. Calcule a área.'
      espaco: 10
      resolucao: |
        Os dois semicírculos formam um círculo de raio 30: $6000 + 900\pi$ m².
      resposta: '$6000 + 900\pi$ m²'
    - enunciado: 'Num quadrado de lado 8, traçam-se dois semicírculos internos, de diâmetro 8, sobre dois lados opostos. Calcule a área do quadrado fora dos semicírculos.'
      espaco: 10
      resolucao: |
        Os semicírculos têm raio 4 e não se sobrepõem (tocam-se no centro); juntos formam um círculo de área $16\pi$. Sobra $64 - 16\pi$.
      resposta: '$64 - 16\pi$'
    - enunciado: 'Os cômodos serão revestidos com lajotas quadradas de 40 cm de lado. Complete o quadro.'
      tabela:
        cabecalho: ['Cômodo', 'Dimensões (m)', 'Área (m²)', 'Lajotas']
        linhas:
        - ['sala', '$4 \times 5$', '${{20}}$', '${{125}}$']
        - ['quarto', '$3 \times 3{,}2$', '${{9{,}6}}$', '${{60}}$']
        - ['cozinha', '$2{,}4 \times 3$', '${{7{,}2}}$', '${{45}}$']
      resolucao: |
        Cada lajota cobre $0{,}16$ m²: $\tfrac{20}{0{,}16} = 125$, $\tfrac{9{,}6}{0{,}16} = 60$, $\tfrac{7{,}2}{0{,}16} = 45$.
      resposta: '20, 125; 9,6, 60; 7,2, 45'
    - enunciado: 'No quadrado $ABCD$ de lado 6, traçam-se os arcos de centros $A$ e $C$ e raio 6, que passam por $B$ e $D$. Calcule a área da região comum aos dois quartos de círculo (a “folha”).'
      espaco: 12
      resolucao: |
        Cada quarto de círculo tem $9\pi$; tirando o triângulo $ABD$ (18), sobra um segmento $9\pi - 18$. A folha são dois segmentos: $18\pi - 36$.
      resposta: '$18\pi - 36$'
    - enunciado: 'Calcule a área da figura formada por um triângulo retângulo de catetos 6 e 8 e um semicírculo construído para fora sobre a hipotenusa.'
      figura:
        tikz: |
          \begin{scope}[scale=.2]
          \draw[ink, line width=1pt, fill=lilas!25] (0,0) -- (8,0) arc (-36.87:143.13:5) -- cycle;
          \draw[ink] (8,0) -- (0,6);
          \draw[mudo] (0,1) -- (1,1) -- (1,0);
          \node[below, font=\scriptsize] at (4,0) {$8$};
          \node[left, font=\scriptsize] at (0,3) {$6$};
          \end{scope}
      espaco: 10
      resolucao: |
        Hipotenusa 10, raio 5. $24 + \tfrac{25\pi}{2}$.
      resposta: '$24 + \frac{25\pi}{2}$'
    - enunciado: 'Um canteiro tem a forma da região entre dois quartos de círculo concêntricos, de raios 10 m e 6 m. Calcule a área.'
      espaco: 8
      resolucao: |
        $\tfrac{\pi(100 - 36)}{4} = 16\pi$ m².
      resposta: '$16\pi$ m²'
  - nome: Nível 3
    questoes:
    - enunciado: 'Num quarto de círculo de centro $O$ e raio 2, a corda $AB$ une as extremidades do arco. Sobre $AB$, para fora, traça-se um semicírculo. Prove que a lúnula (a parte do semicírculo fora do quarto de círculo) tem área igual à do triângulo $OAB$.'
      espaco: 14
      resolucao: |
        $AB = 2\sqrt{2}$: o semicírculo tem raio $\sqrt{2}$ e área $\pi$. O segmento do quarto de círculo é $\pi - 2$. Lúnula: $\pi - (\pi - 2) = 2$, que é a área de $OAB$.
      resposta: 'área 2'
    - enunciado: 'Num quadrado de lado 2, traçam-se quatro semicírculos internos, de diâmetro igual ao lado, sobre os quatro lados. Calcule a área total das quatro “pétalas” (regiões cobertas por dois semicírculos).'
      espaco: 14
      resolucao: |
        Cada pétala é formada por dois segmentos de um quarto de círculo de raio 1: $2\left(\tfrac{\pi}{4} - \tfrac{1}{2}\right) = \tfrac{\pi}{2} - 1$. As quatro: $2\pi - 4$.
      resposta: '$2\pi - 4$'
    - enunciado: 'Um círculo de raio $r$ está inscrito num quadrado. Calcule a área de cada um dos quatro cantos do quadrado fora do círculo.'
      espaco: 10
      resolucao: |
        $\tfrac{(2r)^2 - \pi r^2}{4} = \tfrac{(4 - \pi)r^2}{4}$.
      resposta: '$\frac{(4 - \pi)r^2}{4}$'
    - enunciado: 'Na malha quadriculada de lado 1, o quadrilátero tem vértices nos pontos $(0, 0)$, $(6, 1)$, $(4, 5)$ e $(1, 4)$. Calcule a área completando o retângulo.'
      figura:
        tikz: |
          \begin{scope}[scale=.35]
          \draw[mudo!50, very thin] (0,0) grid (6,5);
          \draw[ink, line width=1pt, fill=lilas!35] (0,0) -- (6,1) -- (4,5) -- (1,4) -- cycle;
          \end{scope}
      espaco: 14
      resolucao: |
        Retângulo $6 \times 5 = 30$. Fora do quadrilátero: triângulos de áreas $3$ (embaixo), $4$ (à direita), $1{,}5$ e $2$ (à esquerda e em cima) e o quadradinho $1$ do canto. $30 - 11{,}5 = 18{,}5$.
      resposta: '18,5'
    - enunciado: 'Num quadrado de lado 2, com o círculo inscrito de raio 1, um círculo menor fica num canto, tangente aos dois lados e ao círculo inscrito. Calcule o raio do círculo menor.'
      espaco: 14
      resolucao: |
        Os centros estão na diagonal. Do vértice ao centro maior: $\sqrt{2}$. Do vértice ao centro menor: $x\sqrt{2}$. Tangência: $x\sqrt{2} + x + 1 = \sqrt{2}$, $x = \tfrac{\sqrt{2} - 1}{\sqrt{2} + 1} = 3 - 2\sqrt{2}$.
      resposta: '$3 - 2\sqrt{2}$'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      A planta de um apartamento tem a forma da figura, com as medidas em metros. O proprietário vai trocar todo o piso, e a empresa contratada cobra R\$\,40,00 por metro quadrado, já incluindo o material e a mão de obra.
    figura:
      tikz: |
        \begin{scope}[scale=.2]
        \draw[ink, line width=1pt, fill=lilas!25] (0,0) -- (10,0) -- (10,6) -- (6,6) -- (6,9) -- (0,9) -- cycle;
        \node[below, font=\scriptsize] at (5,0) {$10$};
        \node[left, font=\scriptsize] at (0,4.5) {$9$};
        \node[above, font=\scriptsize] at (3,9) {$6$};
        \node[right, font=\scriptsize] at (10,3) {$6$};
        \end{scope}
    enunciado: |
      O valor do serviço é
    opcoes: ['R\$\,3\,600,00', 'R\$\,3\,120,00', 'R\$\,2\,400,00', 'R\$\,2\,880,00', 'R\$\,4\,200,00']
    correta: B
    resolucao: |
      $10 \cdot 6 + 6 \cdot 3 = 78$ m²; $78 \cdot 40 = 3120$ reais.

  - estilo: Fuvest
    enunciado: |
      Uma figura é formada por um quadrado de lado 6 e por um triângulo equilátero construído para fora sobre um dos lados. A área da figura é
    opcoes: ['$36 + 9\sqrt{3}$', '$36 + 18\sqrt{3}$', '$45\sqrt{3}$', '$36 + 6\sqrt{3}$', '$54$']
    correta: A
    resolucao: |
      $36 + \tfrac{36\sqrt{3}}{4} = 36 + 9\sqrt{3}$.

  - estilo: Unicamp
    enunciado: |
      De um retângulo de 8 por 6 retiram-se dois semicírculos de diâmetro 6, um em cada lado menor, para dentro. A área que sobra é
    opcoes: ['$48 - 18\pi$.', '$48 - 6\pi$.', '$48 - 9\pi$.', '$48 - 36\pi$.']
    correta: C
    resolucao: |
      Os dois semicírculos de raio 3 formam um círculo de área $9\pi$ (cabem, pois $3 + 3 \le 8$).

  - estilo: UEM
    enunciado: |
      Considere áreas de figuras compostas. Assinale o que for correto.
    proposicoes:
    - 'Um retângulo de $10 \times 4$ com um semicírculo de diâmetro 4 acoplado a um lado menor tem área $40 + 2\pi$.'
    - 'Um quadrado de lado 4 do qual se retiram quatro quartos de círculo de raio 2, com centros nos vértices, tem área $16 - 4\pi$.'
    - 'Uma cruz formada por 5 quadrados de lado 2 tem área 20.'
    - 'A cruz do item anterior tem perímetro 20.'
    - 'Uma moldura de largura 1 em volta de um quadro de $4 \times 3$ tem área 18.'
    corretas: [1, 2, 3, 5]
    resolucao: |
      01) $40 + \tfrac{4\pi}{2}$. 02) Os quartos formam um círculo de raio 2. 04) $5 \cdot 4$. 08) Incorreta: 12 segmentos de 2, perímetro 24. 16) $6 \cdot 5 - 12$.
      Soma: $01 + 02 + 04 + 16 = 23$.

  - estilo: Enem
    texto: |
      Uma janela tem a forma de um retângulo de 1,6 m de largura por 1,2 m de altura, com um semicírculo de 1,6 m de diâmetro em cima, como na figura. Toda a janela será fechada com vidro, cobrado por metro quadrado. Use $\pi \approx 3{,}14$.
    figura:
      tikz: |
        \begin{scope}[scale=.9]
        \draw[ink, line width=1pt, fill=lilas!25] (0,0) -- (1.6,0) -- (1.6,1.2) arc (0:180:0.8) -- cycle;
        \draw[ink] (0,1.2) -- (1.6,1.2);
        \node[below, font=\scriptsize] at (0.8,0) {1,6 m};
        \node[left, font=\scriptsize] at (0,0.6) {1,2 m};
        \end{scope}
    enunciado: |
      A área de vidro é, aproximadamente,
    opcoes: ['$1{,}92$ m²', '$3{,}93$ m²', '$2{,}42$ m²', '$2{,}92$ m²', '$4{,}93$ m²']
    correta: D
    resolucao: |
      $1{,}6 \cdot 1{,}2 + \tfrac{\pi \cdot 0{,}8^2}{2} = 1{,}92 + 0{,}32\pi \approx 1{,}92 + 1{,}00 = 2{,}92$ m².

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir.
    afirmativas:
    - 'Para cobrir 12 m² com lajotas quadradas de 30 cm de lado, bastam 120 lajotas.'
    - 'Um retângulo de $8 \times 5$ do qual se retira um quadrado de $2 \times 2$ de um canto tem área 36.'
    - 'A região entre um círculo de raio 3 e o quadrado circunscrito a ele tem área $36 - 9\pi$.'
    - 'Dois quadrados de lado 4 que se sobrepõem numa região de área 4 cobrem, juntos, área 28.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'I e III, apenas.', 'II e IV, apenas.', 'I, II e III, apenas.', 'II, III e IV, apenas.']
    correta: E
    resolucao: |
      I. Incorreta: $\tfrac{12}{0{,}09} \approx 133{,}3$, são necessárias 134. II. $40 - 4$. III. Quadrado de lado 6. IV. $16 + 16 - 4$.

  - estilo: Unesp
    enunciado: |
      O número de lajotas quadradas de 25 cm de lado necessárias para cobrir um piso de 5 m por 4 m, sem perdas, é
    opcoes: ['$320$', '$80$', '$200$', '$400$', '$250$']
    correta: A
    resolucao: |
      $\tfrac{20}{0{,}0625} = 320$ (ou $20 \cdot 16$ lajotas por fileira).

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      Na figura, $ABCD$ é um quadrado de lado 4, e os arcos $BD$ têm centros em $A$ e em $C$.
    figura:
      tikz: |
        \begin{scope}[scale=.45]
        \fill[lilas!45] (4,0) arc (0:90:4) arc (180:270:4) -- cycle;
        \draw[ink, line width=1pt] (0,0) -- (4,0) -- (4,4) -- (0,4) -- cycle;
        \draw[roxo, line width=1pt] (4,0) arc (0:90:4);
        \draw[roxo, line width=1pt] (0,4) arc (180:270:4);
        \node[below left, font=\scriptsize] at (0,0) {$A$};
        \node[below right, font=\scriptsize] at (4,0) {$B$};
        \node[above right, font=\scriptsize] at (4,4) {$C$};
        \node[above left, font=\scriptsize] at (0,4) {$D$};
        \end{scope}
    enunciado: |
      A área da região sombreada é
    opcoes: ['$8\pi - 16$.', '$4\pi - 8$.', '$16 - 4\pi$.', '$8\pi - 8$.']
    correta: A
    resolucao: |
      Cada quarto de círculo tem $4\pi$; menos o triângulo de área 8, cada segmento tem $4\pi - 8$. A região são dois segmentos: $8\pi - 16$.

  - estilo: Fuvest
    texto: |
      Num quadrado de lado 2, traçam-se quatro semicírculos internos, cada um com diâmetro num lado, como na figura.
    figura:
      tikz: |
        \begin{scope}[scale=.8]
        \begin{scope}
        \clip (1,0) circle (1);
        \fill[lilas!50] (2,1) circle (1);
        \fill[lilas!50] (0,1) circle (1);
        \end{scope}
        \begin{scope}
        \clip (1,2) circle (1);
        \fill[lilas!50] (2,1) circle (1);
        \fill[lilas!50] (0,1) circle (1);
        \end{scope}
        \draw[ink, line width=1pt] (0,0) rectangle (2,2);
        \draw[roxo] (0,0) arc (180:0:1);
        \draw[roxo] (2,2) arc (0:-180:1);
        \draw[roxo] (0,0) arc (-90:90:1);
        \draw[roxo] (2,2) arc (90:270:1);
        \end{scope}
    enunciado: |
      A área total das quatro pétalas sombreadas é
    opcoes: ['$\pi - 2$', '$2\pi - 4$', '$4 - \pi$', '$2\pi - 2$', '$\pi$']
    correta: B
    resolucao: |
      Cada pétala são dois segmentos de um quarto de círculo de raio 1: $2\left(\tfrac{\pi}{4} - \tfrac{1}{2}\right)$. Quatro pétalas: $2\pi - 4$.

  - estilo: UFSC
    enunciado: |
      Um campo é formado por um retângulo de 80 m por 40 m e por dois semicírculos de diâmetro 40 m, um em cada lado menor. Assinale o que for correto.
    proposicoes:
    - 'A área do retângulo é 3200 m².'
    - 'Os dois semicírculos, juntos, têm área $400\pi$ m².'
    - 'A área do campo é $(3200 + 400\pi)$ m².'
    - 'Com $\pi \approx 3{,}14$, a área do campo é maior que 4000 m².'
    - 'Se o retângulo tivesse o dobro da largura e os semicírculos acompanhassem, a área dobraria.'
    - 'Uma faixa de 2 m de largura em toda a volta, por fora do campo, tem área $(320 + 84\pi)$ m².'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) $80 \cdot 40$. 02) Círculo de raio 20. 04) Soma. 08) $3200 + 1256 = 4456$. 16) Incorreta: o retângulo dobra, mas os semicírculos (raio dobrado) quadruplicam. 32) Por fora: $80 \cdot 44 + 484\pi$; menos $3200 + 400\pi$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      Um azulejo quadrado de 20 cm de lado tem quatro quartos de círculo de 10 cm de raio pintados de azul, com centros nos vértices, como na figura; o restante do azulejo é branco. A fábrica quer saber a área branca de cada azulejo. Use $\pi \approx 3{,}14$.
    figura:
      tikz: |
        \begin{scope}[scale=.8]
        \fill[white] (0,0) rectangle (2,2);
        \fill[roxo!45] (0,0) -- (1,0) arc (0:90:1) -- cycle;
        \fill[roxo!45] (2,0) -- (2,1) arc (90:180:1) -- cycle;
        \fill[roxo!45] (2,2) -- (1,2) arc (180:270:1) -- cycle;
        \fill[roxo!45] (0,2) -- (0,1) arc (270:360:1) -- cycle;
        \draw[ink, line width=1pt] (0,0) rectangle (2,2);
        \end{scope}
    enunciado: |
      A área branca é, aproximadamente,
    opcoes: ['$314$ cm²', '$43$ cm²', '$86$ cm²', '$100$ cm²', '$157$ cm²']
    correta: C
    resolucao: |
      Os quatro quartos formam um círculo de raio 10: $400 - 100\pi \approx 400 - 314 = 86$ cm².

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'A área de um semicírculo de diâmetro 10 é $12{,}5\pi$.'
