# Aula 4.17.2 — Geometria espacial: partes da esfera
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: fuso esférico (área α/360°·4πR²) e cunha esférica (volume α/360°·4πR³/3, área total com os dois
# semicírculos); calota esférica (área 2πRh, com r² = h(2R − h)); segmento esférico de uma base (volume πh²(3R − h)/3);
# hemisfério como caso particular; zona esférica (2πRh); aplicações (gomos, tigelas, aquários, calotas polares).
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Use fuso $= \frac{\alpha}{360°} \cdot 4\pi R^2$, cunha $= \frac{\alpha}{360°} \cdot \frac{4\pi R^3}{3}$, calota $= 2\pi R h$ e segmento $= \frac{\pi h^2 (3R - h)}{3}$. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Numa esfera de raio 6, complete.'
      itens:
      - 'Área do fuso de $60°$: {{24\pi}}'
      - 'Volume da cunha de $60°$: {{48\pi}}'
      - 'Área do fuso de $90°$: {{36\pi}}'
      - 'Volume da cunha de $120°$: {{96\pi}}'
      espaco_item: 8
      resolucao: |
        Esfera: área $144\pi$ e volume $288\pi$. $60°$ é $\tfrac{1}{6}$: $24\pi$ e $48\pi$. $90°$ é $\tfrac{1}{4}$: $36\pi$. $120°$ é $\tfrac{1}{3}$: $96\pi$.
      resposta: '$24\pi$; $48\pi$; $36\pi$; $96\pi$'
    - enunciado: 'Associe cada parte da esfera de raio $R$ à sua fórmula.'
      esquerda:
      - 'área do fuso de ângulo $\alpha$'
      - 'volume da cunha de ângulo $\alpha$'
      - 'área da calota de altura $h$'
      - 'volume do segmento de altura $h$'
      - 'volume do hemisfério'
      direita:
      - '$2\pi R h$'
      - '$\frac{2\pi R^3}{3}$'
      - '$\frac{\alpha}{360°} \cdot 4\pi R^2$'
      - '$\frac{\pi h^2 (3R - h)}{3}$'
      - '$\frac{\alpha}{360°} \cdot \frac{4\pi R^3}{3}$'
      resolucao: |
        Fuso e cunha são proporcionais ao ângulo. O hemisfério é o segmento de altura $R$: $\tfrac{\pi R^2 \cdot 2R}{3}$.
      resposta: 'De cima para baixo: 3, 5, 1, 4, 2'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'O fuso de $180°$ é metade da superfície da esfera.'
      - 'A área de uma calota é $\pi r^2$, sendo $r$ o raio da sua base.'
      - 'A calota de altura $2R$ é a superfície inteira da esfera.'
      - 'A cunha de $30°$ tem $\frac{1}{30}$ do volume da esfera.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) (F) Essa é a área do círculo da base; a calota tem $2\pi R h$. (V) $2\pi R \cdot 2R = 4\pi R^2$. (F) Tem $\tfrac{30}{360} = \tfrac{1}{12}$.
      resposta: V, F, V, F
    - enunciado: 'Numa esfera de raio 10, complete com a área da calota de altura $h$.'
      tabela:
        cabecalho: ['$h$', 'Área da calota']
        linhas:
        - ['$1$', '${{20\pi}}$']
        - ['$5$', '${{100\pi}}$']
        - ['$10$', '${{200\pi}}$']
        - ['$20$', '${{400\pi}}$']
      resolucao: |
        $2\pi \cdot 10 \cdot h = 20\pi h$. Com $h = 10$, é um hemisfério; com $h = 20$, a esfera toda.
      resposta: '$20\pi$; $100\pi$; $200\pi$; $400\pi$'
    - enunciado: 'Na figura, um plano a 3 do centro $O$ de uma esfera de raio 5 separa uma calota de altura $h$. Calcule $h$, o raio da base, a área da calota e o volume do segmento.'
      figura:
        tikz: |
          \begin{scope}[scale=.9]
          \fill[lilas!40] (36.87:1.5) arc (36.87:143.13:1.5) -- cycle;
          \draw[ink, line width=1pt] (0,0) circle (1.5);
          \draw[ink, line width=.8pt] (0,0.9) ellipse (1.2 and 0.2);
          \fill[ink] (0,0) circle (1.5pt);
          \node[below, font=\scriptsize] at (0,0) {$O$};
          \draw[roxo, dashed] (0,0) -- (0,0.9);
          \draw[roxo, line width=1pt] (0,0.9) -- (0,1.5);
          \node[left, font=\scriptsize] at (0,0.45) {$3$};
          \node[right, font=\scriptsize] at (0,1.2) {$h$};
          \end{scope}
      espaco: 10
      resolucao: |
        $h = 5 - 3 = 2$; raio da base $\sqrt{25 - 9} = 4$; área $2\pi \cdot 5 \cdot 2 = 20\pi$; volume $\tfrac{\pi \cdot 4 \cdot (15 - 2)}{3} = \tfrac{52\pi}{3}$.
      resposta: '$h = 2$; 4; $20\pi$; $\frac{52\pi}{3}$'
    - enunciado: 'Uma laranja esférica de 6 cm de raio tem 12 gomos iguais. Calcule o volume e a área de casca de cada gomo, com $\pi \approx 3{,}14$.'
      espaco: 10
      resolucao: |
        Cada gomo é uma cunha de $30°$: volume $\tfrac{288\pi}{12} = 24\pi \approx 75{,}4$ cm³; casca $\tfrac{144\pi}{12} = 12\pi \approx 37{,}7$ cm².
      resposta: '$\approx 75{,}4$ cm³; $\approx 37{,}7$ cm²'
    - enunciado: 'Um fuso de uma esfera de raio 5 tem área $10\pi$. Calcule o ângulo do fuso.'
      espaco: 8
      resolucao: |
        Esfera: $100\pi$. $\tfrac{\alpha}{360°} = \tfrac{10}{100}$: $\alpha = 36°$.
      resposta: '$36°$'
  - nome: Nível 2
    questoes:
    - texto: |
        Um plano a 5 do centro de uma esfera de raio 13 determina uma secção de raio 12. Ana disse que a calota menor tem área $\pi \cdot 12^2 = 144\pi$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 10
      resolucao: |
        $144\pi$ é a área do círculo da secção. A calota tem altura $13 - 5 = 8$ e área $2\pi \cdot 13 \cdot 8 = 208\pi$.
      resposta: '$208\pi$'
    - enunciado: 'Uma esfera de raio 10 é cortada por um plano a 6 do centro. Complete.'
      itens:
      - 'Altura do segmento menor: {{4}}'
      - 'Volume do segmento menor: {{\frac{416\pi}{3}}}'
      - 'Volume do segmento maior: {{\frac{3584\pi}{3}}}'
      - 'Soma dos dois volumes: {{\frac{4000\pi}{3}}}'
      espaco_item: 8
      resolucao: |
        $h = 4$: $\tfrac{\pi \cdot 16 \cdot 26}{3}$. $h = 16$: $\tfrac{\pi \cdot 256 \cdot 14}{3}$. A soma é o volume da esfera.
      resposta: '4; $\frac{416\pi}{3}$; $\frac{3584\pi}{3}$; $\frac{4000\pi}{3}$'
    - enunciado: 'Que fração da superfície de uma esfera é ocupada pela calota de altura $\frac{R}{2}$?'
      espaco: 8
      resolucao: |
        $\tfrac{2\pi R \cdot R/2}{4\pi R^2} = \tfrac{1}{4}$.
      resposta: '$\frac{1}{4}$'
    - enunciado: 'Uma tigela hemisférica de 10 cm de raio tem água até 6 cm de profundidade. Calcule o volume de água, com $\pi \approx 3{,}14$.'
      espaco: 10
      resolucao: |
        Segmento de altura 6: $\tfrac{\pi \cdot 36 \cdot (30 - 6)}{3} = 288\pi \approx 904{,}3$ cm³.
      resposta: '$288\pi \approx 904{,}3$ cm³'
    - enunciado: 'A região da Terra ao norte da latitude $60°$ N é uma calota. Com $\sqrt{3} \approx 1{,}73$, que porcentagem da superfície terrestre ela ocupa?'
      espaco: 10
      resolucao: |
        O plano da latitude $60°$ está a $R\operatorname{sen}60°$ do centro: $h = R\left(1 - \tfrac{\sqrt{3}}{2}\right) \approx 0{,}135R$. Fração $\tfrac{h}{2R} \approx 0{,}0675$, cerca de 6,7\%.
      resposta: '$\approx 6{,}7\%$'
    - enunciado: 'Um queijo esférico de 6 cm de raio é cortado numa fatia em forma de cunha de $45°$. Calcule o volume e a área total da fatia (casca e as duas faces planas).'
      espaco: 10
      resolucao: |
        Volume $\tfrac{288\pi}{8} = 36\pi$. Casca $\tfrac{144\pi}{8} = 18\pi$; faces: dois semicírculos de raio 6, $36\pi$. Total $54\pi$.
      resposta: '$36\pi$; $54\pi$'
    - enunciado: 'Um plano divide a superfície de uma esfera de raio 5 em duas calotas de áreas na razão $1 : 4$. A que distância do centro está o plano?'
      espaco: 10
      resolucao: |
        As áreas são proporcionais às alturas: $h_1 + h_2 = 10$ e $h_2 = 4h_1$, logo $h_1 = 2$. Distância $5 - 2 = 3$.
      resposta: '3'
    - enunciado: 'Verifique que a fórmula do segmento, com $h = R$, dá o volume do hemisfério, e com $h = 2R$, o da esfera.'
      espaco: 8
      resolucao: |
        $h = R$: $\tfrac{\pi R^2 \cdot 2R}{3} = \tfrac{2\pi R^3}{3}$. $h = 2R$: $\tfrac{\pi \cdot 4R^2 \cdot R}{3} = \tfrac{4\pi R^3}{3}$.
      resposta: 'Ver resolução'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que a área de um fuso de ângulo $\alpha$ (em graus) numa esfera de raio $R$ é $\frac{\alpha}{360°} \cdot 4\pi R^2$.'
      espaco: 8
      resolucao: |
        Fusos de mesmo ângulo são congruentes (um é a rotação do outro em torno do eixo), e $\tfrac{360°}{\alpha}$ deles cobrem a esfera, quando a divisão é exata; em geral, a área é proporcional ao ângulo.
      resposta: 'Ver resolução'
    - enunciado: 'Numa calota de altura $h$ e base de raio $r$, numa esfera de raio $R$, prove que $r^2 = h(2R - h)$ e que $2\pi R h = \pi(r^2 + h^2)$.'
      espaco: 12
      resolucao: |
        O plano da base está a $R - h$ do centro: $r^2 = R^2 - (R - h)^2 = 2Rh - h^2$. Então $r^2 + h^2 = 2Rh$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que os dois segmentos em que um plano divide uma esfera, de alturas $h$ e $2R - h$, têm volumes que somam $\frac{4\pi R^3}{3}$.'
      espaco: 14
      resolucao: |
        $\tfrac{\pi}{3}[h^2(3R - h) + (2R - h)^2(R + h)]$. Como $(2R - h)^2(R + h) = 4R^3 - 3Rh^2 + h^3$ e $h^2(3R - h) = 3Rh^2 - h^3$, a soma é $\tfrac{\pi}{3} \cdot 4R^3$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que uma cunha de ângulo $\alpha$ numa esfera de raio $R$ tem área total $\frac{\alpha}{360°} \cdot 4\pi R^2 + \pi R^2$.'
      espaco: 8
      resolucao: |
        A superfície da cunha é o fuso mais duas faces planas, cada uma um semicírculo de raio $R$ (área $\tfrac{\pi R^2}{2}$).
      resposta: 'Ver resolução'
    - enunciado: 'Dois planos paralelos, a distâncias $a$ e $b$ do centro ($0 \le a < b \le R$, do mesmo lado), cortam uma esfera de raio $R$. Prove que a faixa de superfície entre eles tem área $2\pi R(b - a)$, que não depende de onde estão os planos, mas só da distância entre eles.'
      espaco: 10
      resolucao: |
        A faixa é a calota de altura $R - a$ menos a de altura $R - b$: $2\pi R(R - a) - 2\pi R(R - b) = 2\pi R(b - a)$.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Uma bola de praia, como a da figura, tem 40 cm de diâmetro e é formada por 6 gomos iguais de plástico colorido, cada um com a forma de um fuso esférico. O fabricante quer saber a área de plástico de cada gomo, desprezando as emendas. Use 3 como aproximação para $\pi$.
    figura:
      tikz: |
        \begin{scope}[scale=.7]
        \fill[lilas!40] (0,-1.5) arc (-90:90:0.75 and 1.5) arc (90:-90:1.3 and 1.5);
        \fill[lilas!40] (0,1.5) arc (90:270:0.75 and 1.5) arc (270:90:1.3 and 1.5);
        \draw[ink, line width=1pt] (0,0) circle (1.5);
        \draw[ink] (0,0) ellipse (0.75 and 1.5) (0,0) ellipse (1.3 and 1.5);
        \fill[ink] (0,1.5) circle (1.5pt) (0,-1.5) circle (1.5pt);
        \end{scope}
    enunciado: |
      A área de plástico de cada gomo é
    opcoes: ['$800$ cm²', '$1200$ cm²', '$4800$ cm²', '$600$ cm²', '$400$ cm²']
    correta: A
    resolucao: |
      Esfera: $4 \cdot 3 \cdot 400 = 4800$ cm²; cada gomo $\tfrac{4800}{6} = 800$ cm².

  - estilo: Fuvest
    enunciado: |
      O volume de uma cunha esférica de $45°$ numa esfera de raio 4 é
    opcoes: ['$\frac{8\pi}{3}$', '$\frac{32\pi}{3}$', '$\frac{64\pi}{3}$', '$8\pi$', '$\frac{256\pi}{3}$']
    correta: B
    resolucao: |
      $\tfrac{1}{8} \cdot \tfrac{256\pi}{3} = \tfrac{32\pi}{3}$.

  - estilo: Unicamp
    enunciado: |
      Numa esfera de raio 7, a calota de altura 3 tem área
    opcoes: ['$21\pi$.', '$63\pi$.', '$42\pi$.', '$9\pi$.']
    correta: C
    resolucao: |
      $2\pi \cdot 7 \cdot 3 = 42\pi$.

  - estilo: UEM
    enunciado: |
      Uma esfera de raio 10 é cortada por um plano a 8 do centro. Assinale o que for correto.
    proposicoes:
    - 'A secção tem raio 6.'
    - 'A calota menor tem altura 2.'
    - 'A calota menor tem área $40\pi$.'
    - 'A calota maior tem área $360\pi$.'
    - 'A calota menor tem a mesma área da secção, $36\pi$.'
    - 'O segmento menor tem volume $\frac{112\pi}{3}$.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) $\sqrt{100 - 64}$. 02) $10 - 8$. 04) $2\pi \cdot 10 \cdot 2$. 08) $400\pi - 40\pi$. 16) Incorreta: $40\pi \ne 36\pi$. 32) $\tfrac{\pi \cdot 4 \cdot 28}{3}$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      Uma tigela tem a forma de um hemisfério de 12 cm de raio interno. Uma cozinheira coloca água na tigela até a profundidade de 6 cm, medida no centro, e quer saber quantos litros de água usou na receita. Use 3 como aproximação para $\pi$.
    enunciado: |
      O volume de água na tigela é
    opcoes: ['$2{,}16$ L', '$3{,}46$ L', '$0{,}54$ L', '$1{,}08$ L', '$1{,}73$ L']
    correta: D
    resolucao: |
      Segmento de altura 6: $\tfrac{\pi \cdot 36 \cdot (36 - 6)}{3} = 360\pi \approx 1080$ cm³ $= 1{,}08$ L.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir, sobre partes de uma esfera de raio $R$.
    afirmativas:
    - 'O fuso de $90°$ tem $\frac{1}{4}$ da área da esfera.'
    - 'A cunha de $60°$ tem $\frac{1}{6}$ do volume da esfera.'
    - 'A calota de altura $h$ tem área $\pi h^2$.'
    - 'O hemisfério é o segmento esférico de altura $R$.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'I e III, apenas.', 'III e IV, apenas.', 'II, III e IV, apenas.', 'I, II e IV, apenas.']
    correta: E
    resolucao: |
      I. Correta. II. Correta. III. Incorreta: $2\pi R h$. IV. Correta.

  - estilo: Unesp
    enunciado: |
      A área de um fuso esférico de $30°$ numa esfera de raio 6 é
    opcoes: ['$12\pi$', '$24\pi$', '$6\pi$', '$36\pi$', '$48\pi$']
    correta: A
    resolucao: |
      $\tfrac{1}{12} \cdot 144\pi = 12\pi$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      Na figura, um plano a 8 do centro de uma esfera de raio 17 determina uma secção e separa uma calota.
    figura:
      tikz: |
        \begin{scope}[scale=.9]
        \fill[lilas!40] (28.07:1.53) arc (28.07:151.93:1.53) -- cycle;
        \draw[ink, line width=1pt] (0,0) circle (1.53);
        \draw[ink, line width=.8pt] (0,0.72) ellipse (1.35 and 0.22);
        \fill[ink] (0,0) circle (1.5pt);
        \draw[roxo, dashed] (0,0) -- (0,0.72);
        \draw[roxo] (0,0) -- (1.35,0.72);
        \node[left, font=\scriptsize] at (0,0.36) {$8$};
        \node[below right, font=\scriptsize] at (0.6,0.36) {$17$};
        \end{scope}
    enunciado: |
      A área da calota menor é
    opcoes: ['$225\pi$.', '$306\pi$.', '$578\pi$.', '$270\pi$.']
    correta: B
    resolucao: |
      Altura $17 - 8 = 9$: $2\pi \cdot 17 \cdot 9 = 306\pi$.

  - estilo: Fuvest
    enunciado: |
      A razão entre a área de uma calota de altura $\frac{R}{3}$ e a área da esfera de raio $R$ é
    opcoes: ['$\frac{1}{3}$', '$\frac{1}{9}$', '$\frac{1}{6}$', '$\frac{1}{4}$', '$\frac{2}{9}$']
    correta: C
    resolucao: |
      $\tfrac{2\pi R \cdot R/3}{4\pi R^2} = \tfrac{1}{6}$.

  - estilo: UFSC
    enunciado: |
      Uma laranja esférica de 6 cm de raio tem 12 gomos iguais, em forma de cunha esférica. Assinale o que for correto.
    proposicoes:
    - 'Cada gomo é uma cunha de $30°$.'
    - 'Cada gomo tem volume $24\pi$ cm³.'
    - 'Cada gomo tem $12\pi$ cm² de casca.'
    - 'Cada gomo, separado, tem área total (casca e faces planas) de $48\pi$ cm².'
    - 'A soma das áreas totais dos 12 gomos separados é $576\pi$ cm².'
    - 'A soma das áreas totais dos 12 gomos separados é igual à área da esfera.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) $\tfrac{360°}{12}$. 02) $\tfrac{288\pi}{12}$. 04) $\tfrac{144\pi}{12}$. 08) $12\pi + 36\pi$. 16) $12 \cdot 48\pi$. 32) Incorreta: $576\pi > 144\pi$.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      A cúpula de um observatório tem a forma de um hemisfério de 5 m de raio. Ela será pintada por fora com tinta refletora, e cada lata, vendida inteira, cobre 18 m². O responsável pela obra quer saber quantas latas comprar. Use 3 como aproximação para $\pi$.
    enunciado: |
      O número mínimo de latas é
    opcoes: ['$9$', '$17$', '$8$', '$5$', '$25$']
    correta: A
    resolucao: |
      $2\pi R^2 = 2 \cdot 3 \cdot 25 = 150$ m²; $\tfrac{150}{18} \approx 8{,}3$: 9 latas.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir, sobre uma esfera de raio $R$.
    afirmacoes:
    - 'A calota de altura $\frac{R}{2}$ tem $\frac{1}{4}$ da área da esfera.'
    - 'A cunha de $72°$ tem $\frac{1}{4}$ do volume da esfera.'
    - 'Os dois segmentos em que um plano divide a esfera têm volumes que somam o volume da esfera.'
    - 'Para $R = 3$, o fuso de $120°$ tem área $12\pi$.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – F – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – V – F.', 'V – F – V – V.']
    correta: E
    resolucao: |
      (V) $\tfrac{R/2}{2R}$. (F) $\tfrac{72}{360} = \tfrac{1}{5}$. (V) (V) $\tfrac{1}{3} \cdot 36\pi$.

  - estilo: Enem
    texto: |
      Na Terra, considerada esférica, a região ao norte de uma latitude $\varphi$ é uma calota cuja base está a $R\operatorname{sen}\varphi$ do centro. Um estudante quer descobrir a latitude que delimita uma calota com exatamente $\frac{1}{4}$ da superfície terrestre e montou o quadro com alguns valores de seno.
    tabela:
      cabecalho: ['$\varphi$', '$15°$', '$30°$', '$45°$', '$60°$', '$75°$']
      linhas:
      - ['$\operatorname{sen}\varphi$', '$0{,}26$', '$0{,}50$', '$0{,}71$', '$0{,}87$', '$0{,}97$']
    enunciado: |
      A latitude procurada é
    opcoes: ['$45°$.', '$60°$.', '$75°$.', '$30°$.', '$15°$.']
    correta: D
    resolucao: |
      $\tfrac{h}{2R} = \tfrac{1}{4}$: $h = \tfrac{R}{2}$. Então $R - R\operatorname{sen}\varphi = \tfrac{R}{2}$, $\operatorname{sen}\varphi = 0{,}5$, $\varphi = 30°$.

  - estilo: Unesp
    enunciado: |
      Numa esfera de raio 5, o segmento esférico de altura 3 tem volume
    opcoes: ['$12\pi$', '$36\pi$', '$45\pi$', '$30\pi$', '$\frac{100\pi}{3}$']
    correta: B
    resolucao: |
      $\tfrac{\pi \cdot 9 \cdot (15 - 3)}{3} = 36\pi$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Considere uma esfera de raio 9 e uma cunha esférica de $40°$. Assinale o que for correto.
    proposicoes:
    - 'O volume da cunha é $108\pi$.'
    - 'O fuso correspondente tem área $36\pi$.'
    - 'A área total da cunha é $117\pi$.'
    - 'Nove cunhas iguais a essa formam a esfera.'
    - 'O fuso tem $\frac{1}{4}$ da área da esfera.'
    - 'A cunha tem $\frac{1}{9}$ do volume da esfera.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      Esfera: $324\pi$ de área e $972\pi$ de volume; $40°$ é $\tfrac{1}{9}$. 01) $\tfrac{972\pi}{9}$. 02) $\tfrac{324\pi}{9}$. 04) $36\pi + 81\pi$. 08) Correta. 16) Incorreta. 32) Correta.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Unicamp
    enunciado: |
      Um plano divide a superfície de uma esfera de raio 6 em duas calotas cujas áreas estão na razão $1 : 2$. A distância do plano ao centro é
    opcoes: ['$2$.', '$3$.', '$4$.', '$1$.']
    correta: A
    resolucao: |
      Alturas proporcionais às áreas: $h_1 + h_2 = 12$, $h_2 = 2h_1$: $h_1 = 4$. Distância $6 - 4 = 2$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Um aquário esférico de vidro tem 15 cm de raio interno e está apoiado numa base. Ele contém água até a altura de 10 cm, medida a partir do ponto mais baixo do vidro. O dono quer saber o volume de água e a área de vidro em contato com a água. Use 3 como aproximação para $\pi$.
    enunciado: |
      O volume de água no aquário é
    opcoes: ['$4{,}5$ L', '$13{,}5$ L', '$3{,}5$ L', '$7$ L', '$2{,}5$ L']
    correta: C
    resolucao: |
      Segmento de altura 10: $\tfrac{\pi \cdot 100 \cdot (45 - 10)}{3} = \tfrac{3500\pi}{3} \approx 3500$ cm³ $= 3{,}5$ L.

  - estilo: Unesp
    enunciado: |
      A área de vidro em contato com a água é
    opcoes: ['$450$ cm²', '$2700$ cm²', '$300$ cm²', '$900$ cm²', '$1350$ cm²']
    correta: D
    resolucao: |
      Calota de altura 10: $2\pi \cdot 15 \cdot 10 = 300\pi \approx 900$ cm².

  - estilo: Fuvest
    enunciado: |
      Uma cunha esférica de ângulo $\alpha$, numa esfera de raio $R$, tem área total (fuso e duas faces planas) igual à área da esfera. Então $\alpha$ mede
    opcoes: ['$90°$', '$120°$', '$180°$', '$240°$', '$270°$']
    correta: E
    resolucao: |
      $\tfrac{\alpha}{360°} \cdot 4\pi R^2 + \pi R^2 = 4\pi R^2$: $\tfrac{\alpha}{360°} = \tfrac{3}{4}$, $\alpha = 270°$.

  - estilo: Unesp
    texto: |
      A tigela hemisférica da figura tem 10 cm de raio interno e contém água até a profundidade de 5 cm.
    figura:
      tikz: |
        \begin{scope}[scale=.9]
        \fill[lilas!40] (210:1.5) arc (210:330:1.5) -- cycle;
        \draw[ink, line width=.6pt, fill=lilas!25] (0,-0.75) ellipse (1.299 and 0.22);
        \draw[ink, line width=1pt] (180:1.5) arc (180:360:1.5);
        \draw[ink, line width=1pt] (0,0) ellipse (1.5 and 0.3);
        \draw[mudo] (0,0) -- (1.5,0);
        \node[above, font=\scriptsize] at (0.75,0) {$10$};
        \draw[mudo, <->] (1.8,-0.75) -- (1.8,-1.5);
        \node[right, font=\scriptsize] at (1.8,-1.1) {$5$};
        \end{scope}
    enunciado: |
      O volume de água na tigela é
    opcoes: ['$\frac{250\pi}{3}$ cm³', '$\frac{625\pi}{3}$ cm³', '$250\pi$ cm³', '$\frac{2000\pi}{3}$ cm³', '$125\pi$ cm³']
    correta: B
    resolucao: |
      Segmento de altura 5: $\tfrac{\pi \cdot 25 \cdot (30 - 5)}{3} = \tfrac{625\pi}{3}$ cm³.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Uma calota de altura $h$ numa esfera de raio $R$ tem base de raio $r$.'
    itens:
    - 'Prove que $r^2 = h(2R - h)$.'
    - 'Prove que a área da calota, $2\pi R h$, também pode ser escrita como $\pi(r^2 + h^2)$.'
    - 'Para uma calota com base de raio 12 e altura 8, calcule o raio da esfera e a área da calota.'
    espaco: 62
    resolucao: |
      a) O plano da base está a $R - h$ do centro: $r^2 = R^2 - (R - h)^2$.
      b) $r^2 + h^2 = 2Rh$.
      c) $144 = 8(2R - 8)$: $R = 13$. Área $\pi(144 + 64) = 208\pi$.
    resposta: 'c) 13 e $208\pi$'

  - estilo: Unicamp
    enunciado: 'Um plano divide uma esfera de raio $R$ em dois segmentos, de alturas $h$ e $2R - h$.'
    itens:
    - 'Verifique que, com $h = R$, a fórmula do segmento dá o volume do hemisfério.'
    - 'Prove que os volumes dos dois segmentos somam $\frac{4\pi R^3}{3}$.'
    - 'Para $R = 6$ e $h = 3$, calcule os dois volumes.'
    espaco: 62
    resolucao: |
      a) $\tfrac{\pi R^2 (3R - R)}{3} = \tfrac{2\pi R^3}{3}$.
      b) $h^2(3R - h) + (2R - h)^2(R + h) = (3Rh^2 - h^3) + (4R^3 - 3Rh^2 + h^3) = 4R^3$.
      c) $\tfrac{\pi \cdot 9 \cdot 15}{3} = 45\pi$ e $\tfrac{\pi \cdot 81 \cdot 9}{3} = 243\pi$ (soma $288\pi$).
    resposta: 'c) $45\pi$ e $243\pi$'

  - estilo: ITA
    enunciado: |
      Numa esfera de raio $R$, uma calota tem área igual ao triplo da área do círculo da sua base. A altura da calota é
    opcoes: ['$\frac{R}{2}$', '$R$', '$\frac{4R}{3}$', '$\frac{3R}{2}$', '$\frac{2R}{3}$']
    correta: C
    espaco: 22
    resolucao: |
      $2\pi R h = 3\pi h(2R - h)$: $2R = 6R - 3h$, $h = \tfrac{4R}{3}$.
    resposta: 'C'

  - estilo: Unesp
    texto: |
      Uma tigela hemisférica tem 12 cm de raio interno e recebe água.
    enunciado: ''
    itens:
    - 'Escreva o volume de água em função da profundidade $h$.'
    - 'Calcule o volume para $h = 6$ cm.'
    - 'Que fração da capacidade da tigela corresponde a essa água?'
    espaco: 62
    resolucao: |
      a) $V(h) = \tfrac{\pi h^2 (36 - h)}{3}$.
      b) $\tfrac{\pi \cdot 36 \cdot 30}{3} = 360\pi$ cm³.
      c) Capacidade $\tfrac{2\pi \cdot 1728}{3} = 1152\pi$; fração $\tfrac{360}{1152} = \tfrac{5}{16}$.
    resposta: 'a) $\frac{\pi h^2(36 - h)}{3}$; b) $360\pi$ cm³; c) $\frac{5}{16}$'

  - estilo: UFSC
    enunciado: |
      Considere uma esfera de raio $R$. Assinale o que for correto.
    proposicoes:
    - 'O fuso de $90°$ tem $\frac{1}{4}$ da área da esfera.'
    - 'A calota de altura $h$ tem área $2\pi R h$.'
    - 'A cunha de $45°$ tem $\frac{1}{8}$ do volume da esfera.'
    - 'A calota de altura $R$ tem área $2\pi R^2$.'
    - 'O segmento de altura $\frac{R}{2}$ tem $\frac{1}{8}$ do volume da esfera.'
    - 'Calotas de mesma altura em esferas de mesmo raio têm a mesma área.'
    corretas: [1, 2, 3, 4, 6]
    espaco: 22
    resolucao: |
      01) Correta. 02) Correta. 04) Correta. 08) Hemisfério. 16) Incorreta: $\tfrac{\pi (R^2/4)(5R/2)}{3} = \tfrac{5\pi R^3}{24}$, que é $\tfrac{5}{32}$ da esfera. 32) Correta.
    resposta: 'Soma 47 (01 + 02 + 04 + 08 + 32)'

  - estilo: Fuvest
    enunciado: 'Considere a Terra uma esfera de 6400 km de raio e use $\pi \approx 3{,}14$ e $\sqrt{3} \approx 1{,}732$.'
    itens:
    - 'A Terra é dividida em 24 fusos horários iguais. Calcule a área de cada fuso.'
    - 'Calcule a altura e a área da calota ao norte da latitude $60°$ N.'
    - 'Que porcentagem da superfície terrestre está ao norte de $60°$ N?'
    espaco: 62
    resolucao: |
      a) $\tfrac{4 \cdot 3{,}14 \cdot 6400^2}{24} \approx 2{,}14 \cdot 10^7$ km².
      b) $h = 6400(1 - 0{,}866) \approx 857$ km; área $2 \cdot 3{,}14 \cdot 6400 \cdot 857 \approx 3{,}45 \cdot 10^7$ km².
      c) $\tfrac{h}{2R} \approx \tfrac{857}{12\,800} \approx 6{,}7\%$.
    resposta: 'a) $\approx 2{,}14 \cdot 10^7$ km²; b) $\approx 857$ km e $\approx 3{,}45 \cdot 10^7$ km²; c) $\approx 6{,}7\%$'

  - estilo: Unicamp
    enunciado: 'Uma esfera de 10 cm de raio é fatiada por planos paralelos igualmente espaçados, em 5 fatias de 4 cm de espessura.'
    itens:
    - 'Prove que a faixa de superfície entre dois planos paralelos a distâncias $a < b$ do centro, do mesmo lado, tem área $2\pi R(b - a)$.'
    - 'Calcule a área de casca de cada uma das 5 fatias.'
    - 'As fatias têm o mesmo volume? Justifique comparando a fatia do meio com uma das pontas.'
    espaco: 62
    resolucao: |
      a) É a calota de altura $R - a$ menos a de altura $R - b$.
      b) Todas têm $2\pi \cdot 10 \cdot 4 = 80\pi$ cm².
      c) Não. Ponta: segmento de altura 4, $\tfrac{\pi \cdot 16 \cdot 26}{3} = \tfrac{416\pi}{3} \approx 139\pi$. Meio: entre $-2$ e $2$, é a esfera menos dois segmentos de altura 8: $\tfrac{4000\pi}{3} - 2 \cdot \tfrac{\pi \cdot 64 \cdot 22}{3} = \tfrac{1184\pi}{3} \approx 395\pi$.
    resposta: 'b) $80\pi$ cm² cada; c) não'

  - estilo: Fuvest
    enunciado: |
      Um fuso esférico tem área igual à área de um círculo máximo da mesma esfera. O ângulo do fuso é
    opcoes: ['$45°$', '$60°$', '$120°$', '$90°$', '$180°$']
    correta: D
    espaco: 22
    resolucao: |
      $\tfrac{\alpha}{360°} \cdot 4\pi R^2 = \pi R^2$: $\alpha = 90°$.
    resposta: 'D'

  - estilo: Unesp
    enunciado: 'Uma lente de vidro tem a forma de um segmento esférico de 1 cm de altura, cortado de uma esfera de 5 cm de raio.'
    itens:
    - 'Calcule o raio da base plana da lente.'
    - 'Calcule o volume da lente.'
    - 'Com densidade do vidro de 2,5 g/cm³ e $\pi \approx 3{,}14$, calcule a massa da lente.'
    espaco: 62
    resolucao: |
      a) $r^2 = 1 \cdot (10 - 1) = 9$: $r = 3$ cm.
      b) $\tfrac{\pi \cdot 1 \cdot (15 - 1)}{3} = \tfrac{14\pi}{3}$ cm³.
      c) $\tfrac{14 \cdot 3{,}14}{3} \cdot 2{,}5 \approx 36{,}6$ g.
    resposta: 'a) 3 cm; b) $\frac{14\pi}{3}$ cm³; c) $\approx 36{,}6$ g'

  - estilo: Fuvest
    enunciado: 'Considere uma cunha esférica de ângulo $\alpha$ numa esfera de raio $R$.'
    itens:
    - 'Escreva o volume da cunha.'
    - 'Prove que a área total da cunha é $\frac{\alpha}{360°} \cdot 4\pi R^2 + \pi R^2$.'
    - 'Para $R = 6$ e $\alpha = 60°$, calcule o volume e a área total.'
    espaco: 62
    resolucao: |
      a) $\tfrac{\alpha}{360°} \cdot \tfrac{4\pi R^3}{3}$.
      b) Fuso mais dois semicírculos de raio $R$.
      c) $V = 48\pi$; área $24\pi + 36\pi = 60\pi$.
    resposta: 'c) $48\pi$ e $60\pi$'
