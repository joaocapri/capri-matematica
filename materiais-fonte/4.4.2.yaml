# Aula 4.4.2 — Geometria plana: relações métricas no triângulo retângulo
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: altura h relativa à hipotenusa a e projeções m (do cateto b) e n (do cateto c); h² = mn, b² = am, c² = an,
# ah = bc, a = m + n e Pitágoras; semelhança dos três triângulos; triângulo inscrito na semicircunferência; média geométrica;
# distância de um vértice à diagonal do retângulo; 1/h² = 1/b² + 1/c².
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Em todas as questões, $a$ é a hipotenusa, $b$ e $c$ são os catetos, $h$ é a altura relativa à hipotenusa, e $m$ e $n$ são as projeções de $b$ e de $c$ sobre a hipotenusa. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Complete o quadro com a altura $h$ e a hipotenusa $a$, dadas as projeções.'
      tabela:
        cabecalho: ['$m$', '$n$', '$h$', '$a$']
        linhas:
        - ['$16$', '$1$', '${{4}}$', '${{17}}$']
        - ['$12$', '$3$', '${{6}}$', '${{15}}$']
        - ['$18$', '$2$', '${{6}}$', '${{20}}$']
        - ['$20$', '$5$', '${{10}}$', '${{25}}$']
      resolucao: |
        $h^2 = mn$ e $a = m + n$. $\sqrt{16} = 4$; $\sqrt{36} = 6$; $\sqrt{36} = 6$; $\sqrt{100} = 10$.
      resposta: '$4, 17$; $6, 15$; $6, 20$; $10, 25$'
    - enunciado: 'Na figura, $a = 25$ e $n = 9$. Complete.'
      figura:
        tikz: |
          \begin{scope}[scale=.85]
          \draw[ink, line width=1pt, fill=lilas!25] (0,0) node[below left, font=\scriptsize] {$B$} -- (5.2,0) node[below right, font=\scriptsize] {$C$} -- (1.6,2.4) node[above, font=\scriptsize] {$A$} -- cycle;
          \draw[roxo, line width=1pt] (1.6,2.4) -- (1.6,0) node[below, font=\scriptsize] {$H$};
          \draw[roxo] (1.6,0.22) -- (1.82,0.22) -- (1.82,0);
          \node[font=\scriptsize, above left] at (0.8,1.2) {$c$};
          \node[font=\scriptsize, above right] at (3.4,1.2) {$b$};
          \node[font=\scriptsize, right] at (1.6,1.1) {$h$};
          \node[font=\scriptsize, below] at (0.8,0) {$n$};
          \node[font=\scriptsize, below] at (3.4,0) {$m$};
          \end{scope}
      itens:
      - '$c = {{15}}$'
      - '$m = {{16}}$'
      - '$b = {{20}}$'
      - '$h = {{12}}$'
      colunas: 2
      espaco_item: 10
      resolucao: |
        $c^2 = an = 225$; $m = a - n = 16$; $b^2 = am = 400$; $h^2 = mn = 144$ (ou $h = \tfrac{bc}{a} = \tfrac{300}{25}$).
      resposta: '$15$; $16$; $20$; $12$'
    - enunciado: 'Os catetos de um triângulo retângulo medem 9 e 12. Complete.'
      itens:
      - '$a = {{15}}$'
      - '$h = {{7{,}2}}$'
      - 'Projeção do cateto 12: {{9{,}6}}'
      - 'Projeção do cateto 9: {{5{,}4}}'
      colunas: 2
      espaco_item: 10
      resolucao: |
        $a = \sqrt{81 + 144} = 15$. $h = \tfrac{9 \cdot 12}{15} = 7{,}2$. Projeções: $\tfrac{144}{15} = 9{,}6$ e $\tfrac{81}{15} = 5{,}4$.
      resposta: '$15$; $7{,}2$; $9{,}6$; $5{,}4$'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - '$h^2 = m \cdot n$.'
      - '$b^2 = a \cdot m$, em que $m$ é a projeção de $b$.'
      - '$a \cdot h = b \cdot c$.'
      - '$h = m + n$.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) (V) (V) A área calculada de dois jeitos. (F) $m + n = a$.
      resposta: V, V, V, F
    - enunciado: 'Os catetos de um triângulo retângulo medem 5 e 12. Calcule a altura relativa à hipotenusa.'
      espaco: 10
      resolucao: |
        $a = 13$ e $ah = bc$: $h = \tfrac{60}{13} \approx 4{,}6$.
      resposta: '$\frac{60}{13}$'
    - enunciado: 'A altura relativa à hipotenusa mede 6 e uma das projeções mede 9. Complete.'
      itens:
      - 'Outra projeção: {{4}}'
      - '$a = {{13}}$'
      colunas: 2
      espaco_item: 10
      resolucao: |
        $36 = 9n$: $n = 4$. $a = 9 + 4 = 13$.
      resposta: '$4$; $13$'
    - enunciado: 'Associe cada relação ao uso mais direto.'
      esquerda:
      - '$h^2 = mn$'
      - '$b^2 = am$'
      - '$ah = bc$'
      - '$a^2 = b^2 + c^2$'
      direita:
      - 'Calcular a altura a partir das duas projeções.'
      - 'Calcular um cateto a partir da hipotenusa e da projeção dele.'
      - 'Calcular a altura a partir dos catetos e da hipotenusa.'
      - 'Calcular a hipotenusa a partir dos catetos.'
      resolucao: |
        Cada relação liga exatamente os dados citados.
      resposta: 'De cima para baixo: 1, 2, 3, 4'
  - nome: Nível 2
    questoes:
    - texto: |
        Num triângulo retângulo, $a = 10$ e a projeção do cateto $c$ é $n = 3{,}6$. Ari escreveu $b^2 = a \cdot n = 36$ e concluiu que $b = 6$.
      enunciado: 'Encontre o erro e calcule os dois catetos.'
      espaco: 12
      resolucao: |
        Cada cateto se relaciona com a sua projeção vizinha: $c^2 = an = 36$, $c = 6$. Para $b$: $m = 10 - 3{,}6 = 6{,}4$, $b^2 = 64$, $b = 8$.
      resposta: '$c = 6$, $b = 8$'
    - enunciado: 'Um ponto $P$ de uma semicircunferência de diâmetro $AB = 13$ projeta-se sobre $AB$ no ponto $H$, com $AH = 4$. Sabendo que todo triângulo inscrito numa semicircunferência, com um lado no diâmetro, é retângulo, calcule $PH$.'
      espaco: 12
      resolucao: |
        O triângulo $APB$ é retângulo em $P$, e $PH$ é a altura relativa à hipotenusa $AB$, com projeções $4$ e $9$: $PH^2 = 36$, $PH = 6$.
      resposta: '$PH = 6$'
    - enunciado: 'A hipotenusa de um triângulo retângulo mede 20 e a altura relativa a ela mede 9,6. Calcule os catetos.'
      espaco: 14
      resolucao: |
        $bc = ah = 192$ e $b^2 + c^2 = 400$. $(b + c)^2 = 400 + 384 = 784$, $b + c = 28$. Com $bc = 192$: catetos $12$ e $16$.
      resposta: '12 e 16'
    - enunciado: 'Complete o quadro, sendo $m$ a projeção de $b$ e $n$ a de $c$.'
      tabela:
        cabecalho: ['$b$', '$c$', '$a$', '$h$', '$m$', '$n$']
        linhas:
        - ['$4$', '$3$', '${{5}}$', '${{2{,}4}}$', '${{3{,}2}}$', '${{1{,}8}}$']
        - ['$20$', '$15$', '${{25}}$', '${{12}}$', '${{16}}$', '${{9}}$']
        - ['$16$', '$12$', '${{20}}$', '${{9{,}6}}$', '${{12{,}8}}$', '${{7{,}2}}$']
      resolucao: |
        $a$ por Pitágoras; $h = \tfrac{bc}{a}$; $m = \tfrac{b^2}{a}$; $n = \tfrac{c^2}{a}$.
      resposta: '$5; 2{,}4; 3{,}2; 1{,}8$ / $25; 12; 16; 9$ / $20; 9{,}6; 12{,}8; 7{,}2$'
    - enunciado: 'As duas águas de um telhado formam ângulo reto no topo. A largura da casa (vão entre os apoios) é de 10 m, e uma das águas mede 6 m. Calcule a outra água e a altura do telhado.'
      espaco: 12
      resolucao: |
        As águas são catetos e o vão é a hipotenusa: outra água $\sqrt{100 - 36} = 8$ m. Altura $h = \tfrac{6 \cdot 8}{10} = 4{,}8$ m.
      resposta: '8 m; 4,8 m'
    - enunciado: 'Num triângulo retângulo, uma projeção é o quádruplo da outra e a altura relativa à hipotenusa mede 8. Calcule as projeções e a hipotenusa.'
      espaco: 12
      resolucao: |
        $m = 4n$: $4n^2 = 64$, $n = 4$, $m = 16$, $a = 20$.
      resposta: '$4$ e $16$; $a = 20$'
    - enunciado: 'A hipotenusa de um triângulo retângulo mede 50 e um cateto mede 30. Calcule a projeção desse cateto, a outra projeção, o outro cateto e a altura.'
      espaco: 12
      resolucao: |
        $30^2 = 50n$: $n = 18$. $m = 32$. $b^2 = 50 \cdot 32 = 1600$, $b = 40$. $h = \tfrac{30 \cdot 40}{50} = 24$.
      resposta: '$18$; $32$; $40$; $24$'
    - enunciado: 'Mostre que $a \cdot h = b \cdot c$, calculando a área do triângulo de dois modos.'
      espaco: 10
      resolucao: |
        Com base $a$ e altura $h$: área $\tfrac{ah}{2}$. Com base $b$ e altura $c$ (os catetos são perpendiculares): área $\tfrac{bc}{2}$. Igualando, $ah = bc$.
      resposta: 'Ver resolução'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que $h^2 = mn$ usando a semelhança dos triângulos $ABH$ e $CAH$ (com $H$ o pé da altura relativa à hipotenusa $BC$).'
      espaco: 14
      resolucao: |
        Os dois são retângulos em $H$, e $B\hat{A}H = \hat{C}$ (ambos complementam $\hat{B}$). Então são semelhantes (AA): $\tfrac{BH}{AH} = \tfrac{AH}{HC}$, ou $\tfrac{n}{h} = \tfrac{h}{m}$, isto é, $h^2 = mn$.
      resposta: 'Ver resolução'
    - enunciado: 'Explique como construir, com régua e compasso, um segmento de medida $\sqrt{xy}$ a partir de segmentos $x$ e $y$. Aplique para $x = 2$ e $y = 8$.'
      espaco: 14
      resolucao: |
        Coloque $x$ e $y$ em sequência numa reta, formando $AB = x + y$ com $H$ entre eles. Trace a semicircunferência de diâmetro $AB$ e a perpendicular a $AB$ por $H$, que corta a semicircunferência em $P$. Pela relação $h^2 = mn$, $PH = \sqrt{xy}$. Para $2$ e $8$: $\sqrt{16} = 4$.
      resposta: '$4$'
    - enunciado: 'Prove que $\frac{1}{h^2} = \frac{1}{b^2} + \frac{1}{c^2}$.'
      espaco: 12
      resolucao: |
        $h = \tfrac{bc}{a}$, logo $\tfrac{1}{h^2} = \tfrac{a^2}{b^2c^2} = \tfrac{b^2 + c^2}{b^2c^2} = \tfrac{1}{c^2} + \tfrac{1}{b^2}$.
      resposta: 'Ver resolução'
    - enunciado: 'Num triângulo retângulo, a hipotenusa mede 25 e a altura relativa a ela mede 12. Calcule as projeções e os catetos.'
      espaco: 12
      resolucao: |
        $m + n = 25$ e $mn = 144$: $m$ e $n$ são raízes de $t^2 - 25t + 144 = 0$, $9$ e $16$. Catetos $\sqrt{25 \cdot 9} = 15$ e $\sqrt{25 \cdot 16} = 20$.
      resposta: 'projeções 9 e 16; catetos 15 e 20'
    - enunciado: 'No retângulo $ABCD$, $AB = 8$ e $BC = 6$. Calcule a distância de $B$ à diagonal $AC$ e os segmentos em que o pé dessa perpendicular divide $AC$.'
      espaco: 12
      resolucao: |
        No triângulo $ABC$, retângulo em $B$, $AC = 10$ e a distância é a altura: $\tfrac{8 \cdot 6}{10} = 4{,}8$. Projeções: $\tfrac{64}{10} = 6{,}4$ (junto a $A$) e $\tfrac{36}{10} = 3{,}6$ (junto a $C$).
      resposta: '$4{,}8$; $6{,}4$ e $3{,}6$'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      O telhado de um galpão tem duas águas planas que se encontram no topo formando um ângulo reto, como na figura. O vão entre as paredes, que é a base do triângulo, mede 10 m, e uma das águas mede 6 m. O construtor precisa saber a altura do topo do telhado em relação à base para encomendar a viga central.
    figura:
      tikz: |
        \begin{scope}[scale=.45]
        \fill[lilas!40] (0,0) -- (10,0) -- (3.6,4.8) -- cycle;
        \draw[ink, line width=1.2pt] (0,0) -- (10,0) -- (3.6,4.8) -- cycle;
        \draw[roxo, dashed] (3.6,4.8) -- (3.6,0);
        \node[font=\scriptsize, above left] at (1.8,2.4) {6 m};
        \node[font=\scriptsize, below] at (5,0) {10 m};
        \end{scope}
    enunciado: |
      A altura do topo do telhado em relação à base é
    opcoes: ['$5$ m', '$4{,}8$ m', '$3{,}6$ m', '$6{,}4$ m', '$2{,}4$ m']
    correta: B
    resolucao: |
      A outra água mede $\sqrt{100 - 36} = 8$ m. A altura relativa à hipotenusa: $h = \tfrac{6 \cdot 8}{10} = 4{,}8$ m.

  - estilo: Fuvest
    enunciado: |
      As projeções dos catetos de um triângulo retângulo sobre a hipotenusa medem 3 e 12. A altura relativa à hipotenusa mede
    opcoes: ['$6$', '$7{,}5$', '$15$', '$36$', '$4$']
    correta: A
    resolucao: |
      $h^2 = 3 \cdot 12 = 36$: $h = 6$.

  - estilo: Unicamp
    enunciado: |
      Num triângulo retângulo, a hipotenusa mede 25 e a projeção de um dos catetos sobre ela mede 16. Esse cateto mede
    opcoes: ['$20$.', '$16$.', '$15$.', '$12$.']
    correta: A
    resolucao: |
      $b^2 = 25 \cdot 16 = 400$: $b = 20$.

  - estilo: UEM
    enunciado: |
      Considere o triângulo retângulo de catetos 15 e 20. Assinale o que for correto.
    proposicoes:
    - 'A hipotenusa mede 25.'
    - 'A altura relativa à hipotenusa mede 12.'
    - 'As projeções dos catetos sobre a hipotenusa medem 9 e 16.'
    - 'O quadrado da altura é igual ao produto das projeções.'
    - 'A área do triângulo é 300.'
    corretas: [1, 2, 3, 4]
    resolucao: |
      01) $\sqrt{225 + 400}$. 02) $\tfrac{300}{25}$. 04) $\tfrac{225}{25}$ e $\tfrac{400}{25}$. 08) $144 = 9 \cdot 16$. 16) Incorreta: $\tfrac{15 \cdot 20}{2} = 150$.
      Soma: $01 + 02 + 04 + 08 = 15$.

  - estilo: Enem
    texto: |
      Uma fábrica produz peças em forma de triângulo retângulo, identificadas pelas medidas, em centímetros, das projeções dos catetos sobre a hipotenusa. Para embalar, interessa a altura relativa à hipotenusa, pois a peça fica apoiada pela hipotenusa. O quadro mostra quatro modelos.
    tabela:
      cabecalho: ['Peça', 'Projeções (cm)']
      linhas:
      - ['1', '$2$ e $18$']
      - ['2', '$4$ e $16$']
      - ['3', '$5$ e $5$']
      - ['4', '$1$ e $36$']
    enunciado: |
      A peça com a maior altura relativa à hipotenusa é
    opcoes: ['a peça 1.', 'a peça 4.', 'a peça 2.', 'a peça 3.', 'a peça 1 ou a 4, que empatam.']
    correta: C
    resolucao: |
      $h = \sqrt{mn}$: $\sqrt{36} = 6$; $\sqrt{64} = 8$; $\sqrt{25} = 5$; $\sqrt{36} = 6$. A maior é a da peça 2.

  - estilo: UEL
    enunciado: |
      Considere um triângulo retângulo de hipotenusa $a$, catetos $b$ e $c$, altura $h$ relativa à hipotenusa e projeções $m$ e $n$. Considere as afirmativas a seguir.
    afirmativas:
    - '$h^2 = mn$.'
    - '$a = m + n$.'
    - '$bc = ah$.'
    - '$h = \frac{b + c}{2}$.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'II e IV, apenas.', 'I, II e III, apenas.', 'III e IV, apenas.', 'I, II, III e IV.']
    correta: C
    resolucao: |
      I, II e III. Corretas. IV. Incorreta: com catetos 3 e 4, $h = 2{,}4 \neq 3{,}5$.

  - estilo: Unesp
    enunciado: |
      Os catetos de um triângulo retângulo medem 12 e 16. A altura relativa à hipotenusa mede
    opcoes: ['$10$', '$12$', '$14$', '$9{,}6$', '$8$']
    correta: D
    resolucao: |
      $a = 20$ e $h = \tfrac{12 \cdot 16}{20} = 9{,}6$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      Na figura, $AB = 10$ é o diâmetro da semicircunferência, $P$ é um ponto dela e $H$ é o pé da perpendicular traçada de $P$ a $AB$, com $AH = 2$. Todo triângulo inscrito numa semicircunferência, com um lado no diâmetro, é retângulo.
    figura:
      tikz: |
        \begin{scope}[scale=.4]
        \draw[ink, line width=1pt] (0,0) node[below, font=\scriptsize] {$A$} -- (10,0) node[below, font=\scriptsize] {$B$};
        \draw[ink, line width=1pt] (10,0) arc (0:180:5);
        \draw[roxo, line width=1pt] (0,0) -- (2,4) node[above left, font=\scriptsize] {$P$} -- (10,0);
        \draw[roxo, dashed] (2,4) -- (2,0) node[below, font=\scriptsize] {$H$};
        \end{scope}
    enunciado: |
      A medida de $PH$ é
    opcoes: ['$4$.', '$5$.', '$16$.', '$10$.']
    correta: A
    resolucao: |
      O triângulo $APB$ é retângulo em $P$, e $PH$ é a altura relativa à hipotenusa: $PH^2 = 2 \cdot 8 = 16$, $PH = 4$.

  - estilo: Fuvest
    enunciado: |
      A hipotenusa de um triângulo retângulo mede 20 e a altura relativa a ela mede 9,6. O perímetro do triângulo é
    opcoes: ['$28$', '$40$', '$44$', '$46$', '$48$']
    correta: E
    resolucao: |
      $bc = 192$ e $b^2 + c^2 = 400$: $(b + c)^2 = 784$, $b + c = 28$. Perímetro $48$.

  - estilo: UFSC
    enunciado: |
      As projeções dos catetos de um triângulo retângulo sobre a hipotenusa medem 32 e 18. Assinale o que for correto.
    proposicoes:
    - 'A hipotenusa mede 50.'
    - 'A altura relativa à hipotenusa mede 24.'
    - 'O cateto cuja projeção mede 32 mede 40.'
    - 'O cateto cuja projeção mede 18 mede 30.'
    - 'A área do triângulo é 600.'
    - 'O perímetro do triângulo é 100.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) $32 + 18$. 02) $\sqrt{576}$. 04) $\sqrt{50 \cdot 32} = 40$. 08) $\sqrt{50 \cdot 18} = 30$. 16) $\tfrac{30 \cdot 40}{2}$. 32) Incorreta: $50 + 40 + 30 = 120$.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      Duas ruas retas e perpendiculares se cruzam no ponto $A$. Uma avenida reta corta as duas ruas, a 300 m e a 400 m de $A$, formando um triângulo. Uma pessoa em $A$ quer chegar à avenida pelo caminho mais curto possível, que é o segmento perpendicular à avenida.
    enunciado: |
      O comprimento desse caminho é
    opcoes: ['$350$ m', '$300$ m', '$500$ m', '$240$ m', '$200$ m']
    correta: D
    resolucao: |
      O caminho é a altura relativa à hipotenusa: $\sqrt{300^2 + 400^2} = 500$ e $h = \tfrac{300 \cdot 400}{500} = 240$ m.

  - estilo: UFPR
    enunciado: |
      Num triângulo retângulo, traça-se a altura relativa à hipotenusa. Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'Os dois triângulos menores formados são semelhantes ao triângulo original.'
    - 'O quadrado de cada cateto é igual ao produto da hipotenusa pela projeção do outro cateto.'
    - '$\frac{1}{h^2} = \frac{1}{b^2} + \frac{1}{c^2}$.'
    - 'A altura relativa à hipotenusa é sempre a metade da hipotenusa.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – V – F.', 'V – F – V – F.', 'F – F – V – V.', 'V – F – V – V.', 'V – V – F – F.']
    correta: B
    resolucao: |
      (V) (F) É a projeção do próprio cateto. (V) (F) Só no triângulo retângulo isósceles.

  - estilo: Enem
    texto: |
      Um terreno retangular mede 40 m por 30 m e será dividido por uma cerca reta ao longo de uma diagonal. Um cano de água sairá do canto $B$, que não está na diagonal, e irá até a cerca pelo caminho mais curto, perpendicular a ela, como na figura.
    figura:
      tikz: |
        \begin{scope}[scale=.8]
        \fill[lima!20] (0,0) rectangle (4,3);
        \draw[ink, line width=1pt] (0,0) node[below left, font=\scriptsize] {$A$} rectangle (4,3);
        \node[below right, font=\scriptsize] at (4,0) {$B$};
        \draw[ink, line width=1.2pt] (0,0) -- (4,3);
        \draw[roxo, line width=1.2pt] (4,0) -- (2.56,1.92);
        \node[font=\scriptsize, below] at (2,0) {40 m};
        \node[font=\scriptsize, right] at (4,1.5) {30 m};
        \end{scope}
    enunciado: |
      O comprimento do cano é
    opcoes: ['$25$ m', '$20$ m', '$35$ m', '$30$ m', '$24$ m']
    correta: E
    resolucao: |
      A diagonal mede 50 m e é a hipotenusa do triângulo retângulo de catetos 40 e 30. O cano é a altura: $\tfrac{40 \cdot 30}{50} = 24$ m.

  - estilo: Fuvest
    enunciado: |
      Num triângulo retângulo, uma projeção dos catetos sobre a hipotenusa é o quádruplo da outra, e a altura relativa à hipotenusa mede 8. A hipotenusa mede
    opcoes: ['$16$', '$20$', '$24$', '$32$', '$10$']
    correta: B
    resolucao: |
      $4n \cdot n = 64$: $n = 4$, $m = 16$, $a = 20$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Considere um triângulo retângulo de hipotenusa $a$, catetos $b$ e $c$, altura $h$ relativa à hipotenusa e projeções $m$ (de $b$) e $n$ (de $c$). Assinale o que for correto.
    proposicoes:
    - '$h^2 = mn$.'
    - '$b^2 + c^2 = a(m + n)$.'
    - 'Se $m = n$, o triângulo é isósceles.'
    - '$h \leq \frac{a}{2}$.'
    - 'Se $b = 2c$, então $m = 2n$.'
    corretas: [1, 2, 3, 4]
    resolucao: |
      01) Correta. 02) $am + an = a(m + n) = a^2$. 04) $b^2 = am = an = c^2$. 08) $h = \sqrt{mn} \leq \tfrac{m + n}{2}$ (média geométrica não supera a aritmética). 16) Incorreta: $\tfrac{m}{n} = \tfrac{b^2}{c^2} = 4$.
      Soma: $01 + 02 + 04 + 08 = 15$.

  - estilo: Fuvest
    enunciado: |
      A hipotenusa de um triângulo retângulo mede 25 e a altura relativa a ela mede 12. A menor projeção de um cateto sobre a hipotenusa mede
    opcoes: ['$12$', '$16$', '$9$', '$13$', '$8$']
    correta: C
    resolucao: |
      $m + n = 25$ e $mn = 144$: $9$ e $16$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Um parque tem a forma do triângulo $ABC$, retângulo em $A$, e um caminho reto $AH$ liga $A$ ao lado $BC$, perpendicular a ele, como na figura. O ponto $H$ fica a 9 m de $B$ e a 16 m de $C$.
    figura:
      tikz: |
        \begin{scope}[scale=.85]
        \fill[lima!25] (0,0) -- (5,0) -- (1.8,2.4) -- cycle;
        \draw[ink, line width=1pt] (0,0) node[below left, font=\scriptsize] {$B$} -- (5,0) node[below right, font=\scriptsize] {$C$} -- (1.8,2.4) node[above, font=\scriptsize] {$A$} -- cycle;
        \draw[roxo, line width=1.2pt] (1.8,2.4) -- (1.8,0) node[below, font=\scriptsize] {$H$};
        \node[font=\scriptsize, below] at (0.9,0) {9 m};
        \node[font=\scriptsize, below] at (3.4,0) {16 m};
        \end{scope}
    enunciado: |
      O comprimento do caminho $AH$ é
    opcoes: ['$25$ m', '$15$ m', '$20$ m', '$12$ m', '$144$ m']
    correta: D
    resolucao: |
      $AH^2 = 9 \cdot 16 = 144$: $AH = 12$ m.

  - estilo: Unicamp
    enunciado: |
      O lado $AB$ do parque mede
    opcoes: ['$20$ m.', '$15$ m.', '$12$ m.', '$9$ m.']
    correta: B
    resolucao: |
      $AB^2 = BC \cdot BH = 25 \cdot 9 = 225$: $AB = 15$ m.

  - estilo: Unesp
    enunciado: |
      Num triângulo retângulo, a hipotenusa mede 15 e a projeção de um cateto sobre ela mede 5,4. Esse cateto mede
    opcoes: ['$12$', '$6$', '$10$', '$8{,}1$', '$9$']
    correta: E
    resolucao: |
      $c^2 = 15 \cdot 5{,}4 = 81$: $c = 9$.

  - estilo: Fuvest
    enunciado: |
      Os catetos de um triângulo retângulo medem 10 e 24. A altura relativa à hipotenusa mede
    opcoes: ['$13$', '$10$', '$\frac{120}{13}$', '$17$', '$\frac{60}{13}$']
    correta: C
    resolucao: |
      $a = 26$ e $h = \tfrac{10 \cdot 24}{26} = \tfrac{120}{13}$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'No triângulo $ABC$, retângulo em $A$, $H$ é o pé da altura relativa à hipotenusa $BC = a$, com $BH = n$, $HC = m$, $AH = h$, $AB = c$ e $AC = b$.'
    itens:
    - 'Prove que os triângulos $HBA$, $HAC$ e $ABC$ são semelhantes.'
    - 'Deduza $c^2 = an$, $b^2 = am$ e $h^2 = mn$.'
    - 'Somando as duas primeiras relações, deduza o teorema de Pitágoras.'
    espaco: 62
    resolucao: |
      a) Todos têm um ângulo reto. $HBA$ e $ABC$ têm $\hat{B}$ comum; $HAC$ e $ABC$ têm $\hat{C}$ comum (caso AA). Logo os três são semelhantes.
      b) De $HBA \sim ABC$: $\tfrac{BH}{BA} = \tfrac{BA}{BC}$, $c^2 = an$. De $HAC \sim ABC$: $\tfrac{CH}{CA} = \tfrac{CA}{CB}$, $b^2 = am$. De $HBA \sim HAC$: $\tfrac{BH}{AH} = \tfrac{AH}{CH}$, $h^2 = mn$.
      c) $b^2 + c^2 = a(m + n) = a \cdot a = a^2$.
    resposta: 'Ver resolução'

  - estilo: Unicamp
    texto: |
      Dados dois segmentos de medidas $x$ e $y$, quer-se construir com régua e compasso um segmento de medida $\sqrt{xy}$ (a média geométrica de $x$ e $y$).
    enunciado: ''
    itens:
    - 'Descreva a construção usando uma semicircunferência e justifique-a com as relações métricas.'
    - 'Usando $x = 1$, explique como construir um segmento de medida $\sqrt{y}$ para qualquer $y$ dado.'
    - 'Para $x = 3$ e $y = 12$, qual é a medida obtida? E a altura máxima possível de um ponto da semicircunferência acima do diâmetro?'
    espaco: 62
    resolucao: |
      a) Marque $AH = x$ e $HB = y$ em linha reta, trace a semicircunferência de diâmetro $AB$ e a perpendicular a $AB$ por $H$, que a corta em $P$. O triângulo $APB$ é retângulo em $P$, e $PH$ é a altura relativa à hipotenusa: $PH^2 = xy$.
      b) Com $AH = 1$ e $HB = y$: $PH = \sqrt{y}$.
      c) $\sqrt{36} = 6$. A altura máxima é o raio, $\tfrac{3 + 12}{2} = 7{,}5$, atingida quando $H$ é o centro (média aritmética $\geq$ geométrica).
    resposta: 'c) 6; 7,5'

  - estilo: ITA
    enunciado: |
      Num triângulo retângulo, a hipotenusa mede 13 e a altura relativa a ela mede 6. O menor cateto mede
    opcoes: ['$2\sqrt{13}$', '$3\sqrt{13}$', '$6$', '$4$', '$\sqrt{13}$']
    correta: A
    espaco: 22
    resolucao: |
      $m + n = 13$ e $mn = 36$: projeções $4$ e $9$. O menor cateto é o da projeção 4: $\sqrt{13 \cdot 4} = 2\sqrt{13}$.
    resposta: 'A'

  - estilo: Unesp
    enunciado: 'No retângulo $ABCD$, $AB = 8$ e $BC = 6$. Sejam $E$ e $F$ os pés das perpendiculares traçadas de $B$ e de $D$ à diagonal $AC$.'
    itens:
    - 'Calcule $BE$.'
    - 'Calcule $AE$ e $CF$.'
    - 'Calcule $EF$.'
    espaco: 62
    resolucao: |
      a) No triângulo $ABC$, retângulo em $B$, com $AC = 10$: $BE = \tfrac{8 \cdot 6}{10} = 4{,}8$.
      b) $AE = \tfrac{AB^2}{AC} = 6{,}4$. Por simetria (o triângulo $CDA$ é congruente a $ABC$), $CF = 6{,}4$.
      c) $E$ fica a $6{,}4$ de $A$ e $F$ a $6{,}4$ de $C$, isto é, a $3{,}6$ de $A$: $EF = 6{,}4 - 3{,}6 = 2{,}8$.
    resposta: 'a) 4,8; b) 6,4 e 6,4; c) 2,8'

  - estilo: UFSC
    enunciado: |
      Considere um triângulo retângulo com hipotenusa $a$, catetos $b$ e $c$, altura $h$ e projeções $m$ (de $b$) e $n$ (de $c$). Assinale o que for correto.
    proposicoes:
    - '$\frac{m}{n} = \frac{b^2}{c^2}$.'
    - 'Se $b = 3$ e $c = 4$, então $h = 2{,}4$.'
    - '$h = \frac{bc}{a}$.'
    - 'Se $m = 9$ e $n = 4$, então $b = 3\sqrt{13}$.'
    - 'A altura relativa à hipotenusa é maior que cada cateto.'
    - 'Se o triângulo é isósceles, então $h = \frac{a}{2}$.'
    corretas: [1, 2, 3, 4, 6]
    espaco: 22
    resolucao: |
      01) $\tfrac{am}{an}$. 02) $\tfrac{12}{5}$. 04) De $ah = bc$. 08) $b^2 = 13 \cdot 9 = 117$, $b = 3\sqrt{13}$. 16) Incorreta: a altura é cateto dos triângulos menores, que têm os catetos originais como hipotenusa. 32) $m = n = \tfrac{a}{2}$ e $h = \sqrt{mn}$.
    resposta: 'Soma 47 (01 + 02 + 04 + 08 + 32)'

  - estilo: Fuvest
    enunciado: 'Um triângulo retângulo tem perímetro 30 e altura relativa à hipotenusa igual a $\frac{60}{13}$.'
    itens:
    - 'Mostre que $(b + c)^2 = a^2 + 2ah$.'
    - 'Usando $b + c = 30 - a$, determine $a$.'
    - 'Determine os catetos.'
    espaco: 62
    resolucao: |
      a) $(b + c)^2 = b^2 + c^2 + 2bc = a^2 + 2ah$.
      b) $(30 - a)^2 = a^2 + \tfrac{120}{13}a$: $900 - 60a = \tfrac{120}{13}a$, $900 = \tfrac{900}{13}a$, $a = 13$.
      c) $b + c = 17$ e $bc = ah = 60$: catetos $5$ e $12$.
    resposta: 'b) $a = 13$; c) 5 e 12'

  - estilo: Unicamp
    texto: |
      Para estimar a altura de uma torre, uma pessoa se afasta dela até que, olhando para o topo e para a base, as duas linhas de visada formem um ângulo reto no seu olho. O olho está a 1,5 m do chão, e a pessoa está a 6 m da torre.
    enunciado: ''
    itens:
    - 'Faça um esboço e identifique o triângulo retângulo, a sua hipotenusa e a altura relativa a ela.'
    - 'Calcule a altura da torre.'
    - 'Se a pessoa estivesse a 9 m da torre, com o mesmo ângulo reto, qual seria a altura da torre?'
    espaco: 62
    resolucao: |
      a) O triângulo tem vértices no olho, no topo e na base da torre, com ângulo reto no olho; a hipotenusa é a própria torre. A altura relativa a ela é o segmento horizontal do olho à torre (6 m), e as projeções são 1,5 m (abaixo do nível do olho) e $x$ (acima).
      b) $6^2 = 1{,}5 \cdot x$: $x = 24$. Torre de $1{,}5 + 24 = 25{,}5$ m.
      c) $81 = 1{,}5x$, $x = 54$: $55{,}5$ m.
    resposta: 'b) 25,5 m; c) 55,5 m'

  - estilo: Fuvest
    enunciado: |
      Os catetos de um triângulo retângulo medem $1$ e $\sqrt{3}$. A altura relativa à hipotenusa mede
    opcoes: ['$\frac{\sqrt{3}}{2}$', '$\frac{1}{2}$', '$2$', '$\sqrt{3}$', '$\frac{3}{4}$']
    correta: A
    espaco: 22
    resolucao: |
      $\tfrac{1}{h^2} = 1 + \tfrac{1}{3} = \tfrac{4}{3}$: $h = \tfrac{\sqrt{3}}{2}$. (Ou: $a = 2$ e $h = \tfrac{1 \cdot \sqrt{3}}{2}$.)
    resposta: 'A'

  - estilo: Unesp
    enunciado: 'Num triângulo retângulo de hipotenusa 50, a razão entre os catetos é $\frac{b}{c} = \frac{3}{4}$.'
    itens:
    - 'Calcule os catetos.'
    - 'Calcule as projeções e mostre que $\frac{m}{n} = \left(\frac{b}{c}\right)^2$.'
    - 'Calcule a altura relativa à hipotenusa de dois modos diferentes.'
    espaco: 62
    resolucao: |
      a) $b = 3k$, $c = 4k$, $25k^2 = 2500$, $k = 10$: $b = 30$, $c = 40$.
      b) $m = \tfrac{900}{50} = 18$ e $n = \tfrac{1600}{50} = 32$; $\tfrac{18}{32} = \tfrac{9}{16} = \left(\tfrac{3}{4}\right)^2$.
      c) $\tfrac{bc}{a} = \tfrac{1200}{50} = 24$ e $\sqrt{mn} = \sqrt{576} = 24$.
    resposta: 'a) 30 e 40; b) 18 e 32; c) 24'

  - estilo: Fuvest
    enunciado: 'Um ponto $P$ percorre uma semicircunferência de diâmetro $AB = 10$, e $H$ é o pé da perpendicular de $P$ a $AB$, com $AH = x$.'
    itens:
    - 'Mostre que $PH^2 = x(10 - x)$.'
    - 'Determine $x$ para que $PH = 4$.'
    - 'Qual é o maior valor de $PH$ e onde está $P$ nesse caso?'
    espaco: 62
    resolucao: |
      a) $APB$ é retângulo em $P$, e $PH$ é a altura com projeções $x$ e $10 - x$.
      b) $x(10 - x) = 16$: $x^2 - 10x + 16 = 0$, $x = 2$ ou $x = 8$.
      c) $x(10 - x)$ é máximo em $x = 5$ (vértice da parábola): $PH^2 = 25$, $PH = 5$, com $P$ no ponto mais alto, acima do centro.
    resposta: 'b) 2 ou 8; c) 5, acima do centro'
