# Aula 4.12.2 — Geometria espacial: volume de prismas
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: V = A_b·h (cubo a³, paralelepípedo abc, prismas triangulares e hexagonais); unidades de volume e de
# capacidade (1 dm³ = 1 L; 1 m³ = 1000 L); princípio de Cavalieri e prisma oblíquo; deslocamento de água; vazão e tempo de
# enchimento; piscina de fundo inclinado; caixa obtida recortando os cantos de uma folha; semelhança (volumes na razão k³).
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Complete com o volume de cada prisma reto.'
      itens:
      - 'Cubo de aresta 4: {{64}}'
      - 'Paralelepípedo de dimensões 5, 3 e 2: {{30}}'
      - 'Prisma de base triangular retângula, de catetos 6 e 8, e altura 10: {{240}}'
      - 'Prisma hexagonal regular de aresta da base 2 e altura 10: {{60\sqrt{3}}}'
      espaco_item: 8
      resolucao: |
        $V = A_b \cdot h$: $4^3$; $5 \cdot 3 \cdot 2$; $24 \cdot 10$; base $6 \cdot \sqrt{3}$, vezes 10.
      resposta: '64; 30; 240; $60\sqrt{3}$'
    - enunciado: 'Associe as medidas equivalentes.'
      esquerda:
      - '1 m³'
      - '1 dm³'
      - '1 cm³'
      - '500 mL'
      - '2,5 m³'
      direita:
      - '0,5 dm³'
      - '2500 L'
      - '1 L'
      - '1000 L'
      - '1 mL'
      resolucao: |
        1 dm³ é um cubo de 10 cm de aresta, com 1000 cm³: é 1 L. Então 1 cm³ = 1 mL e 1 m³ = 1000 dm³ = 1000 L.
      resposta: 'De cima para baixo: 4, 5, 2, 1, 3'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'O volume de um cubo de aresta $a$ é $6a^2$.'
      - 'Dobrando todas as arestas de um prisma, o volume fica 8 vezes maior.'
      - 'Um prisma reto e um oblíquo, de mesma base e mesma altura, têm o mesmo volume.'
      - '1 m³ corresponde a 100 litros.'
      justificar: true
      espaco: 20
      resolucao: |
        (F) É $a^3$; $6a^2$ é a área. (V) $2^3 = 8$. (V) Princípio de Cavalieri. (F) São 1000 litros.
      resposta: F, V, V, F
    - enunciado: 'Uma caixa-d''água tem a forma de um paralelepípedo de 2 m por 1,5 m de base e 1 m de altura. Complete.'
      itens:
      - 'Volume: {{3}} m³'
      - 'Capacidade: {{3000}} litros'
      - 'Altura da água com 1200 litros: {{0{,}4}} m'
      espaco_item: 8
      resolucao: |
        $2 \cdot 1{,}5 \cdot 1 = 3$ m³ $= 3000$ L. Com 1,2 m³: $h = \tfrac{1{,}2}{3} = 0{,}4$ m.
      resposta: '3; 3000; 0,4'
    - enunciado: 'A figura mostra o corte lateral de uma piscina de 10 m de comprimento, com profundidades de 1 m e 2 m nas extremidades. A largura é 5 m. Calcule o volume.'
      figura:
        tikz: |
          \begin{scope}[scale=.3]
          \fill[lilas!30] (0,0) -- (10,0) -- (10,-2) -- (0,-1) -- cycle;
          \draw[ink, line width=1pt] (0,0.4) -- (0,-1) -- (10,-2) -- (10,0.4);
          \draw[roxo] (0,0) -- (10,0);
          \node[left, font=\scriptsize] at (0,-0.5) {1 m};
          \node[right, font=\scriptsize] at (10,-1) {2 m};
          \node[above, font=\scriptsize] at (5,0) {10 m};
          \end{scope}
      espaco: 8
      resolucao: |
        A piscina é um prisma cuja base é o trapézio do corte: $\tfrac{(1 + 2) \cdot 10}{2} = 15$ m². Volume $15 \cdot 5 = 75$ m³.
      resposta: '75 m³'
    - enunciado: 'Um aquário de 50 cm por 30 cm de base tem água até 30 cm de altura. Calcule quantos litros de água há nele e o volume de uma pedra que, mergulhada, faz a água subir 2 cm.'
      espaco: 10
      resolucao: |
        $50 \cdot 30 \cdot 30 = 45\,000$ cm³ $= 45$ L. Pedra: $50 \cdot 30 \cdot 2 = 3000$ cm³ $= 3$ L.
      resposta: '45 L; 3000 cm³'
    - enunciado: 'Um cubo tem volume 343 cm³. Calcule a aresta e a área total.'
      espaco: 8
      resolucao: |
        $a^3 = 343$: $a = 7$ cm. Área $6 \cdot 49 = 294$ cm².
      resposta: '7 cm; 294 cm²'
  - nome: Nível 2
    questoes:
    - texto: |
        Lia disse: “se eu dobrar a aresta de um cubo, o volume também dobra”.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 10
      resolucao: |
        $(2a)^3 = 8a^3$: o volume fica 8 vezes maior. (A área fica 4 vezes maior.)
      resposta: '8 vezes'
    - enunciado: 'De uma folha de 30 cm por 20 cm recortam-se, nos quatro cantos, quadrados de 5 cm de lado, e as abas são dobradas para formar uma caixa sem tampa. Calcule o volume.'
      espaco: 10
      resolucao: |
        Base $(30 - 10) \times (20 - 10) = 20 \times 10$; altura 5: $V = 1000$ cm³.
      resposta: '1000 cm³'
    - enunciado: 'Um prisma oblíquo tem base de área 15 e arestas laterais de 10, inclinadas $30°$ em relação à base. Calcule o volume.'
      espaco: 10
      resolucao: |
        Altura $10\operatorname{sen}30° = 5$. Pelo princípio de Cavalieri, $V = A_b \cdot h = 75$.
      resposta: '75'
    - enunciado: 'Uma piscina de 8 m por 4 m, com 1,5 m de profundidade, é enchida por uma bomba de 2000 litros por hora. Em quanto tempo ela enche?'
      espaco: 10
      resolucao: |
        $8 \cdot 4 \cdot 1{,}5 = 48$ m³ $= 48\,000$ L: $\tfrac{48\,000}{2000} = 24$ h.
      resposta: '24 h'
    - enunciado: 'Complete o quadro para cubos.'
      tabela:
        cabecalho: ['Aresta', 'Área total', 'Volume']
        linhas:
        - ['$2$', '${{24}}$', '${{8}}$']
        - ['$3$', '${{54}}$', '${{27}}$']
        - ['${{4}}$', '$96$', '${{64}}$']
        - ['${{5}}$', '${{150}}$', '$125$']
      resolucao: |
        Área $6a^2$; volume $a^3$.
      resposta: '24, 8; 54, 27; 4, 64; 5, 150'
    - enunciado: 'Um prisma hexagonal regular tem aresta da base 4 e altura 10. Calcule o volume.'
      espaco: 8
      resolucao: |
        Base $6 \cdot \tfrac{16\sqrt{3}}{4} = 24\sqrt{3}$; $V = 240\sqrt{3}$.
      resposta: '$240\sqrt{3}$'
    - enunciado: 'Duas caixas são semelhantes, e as arestas da maior são o triplo das da menor. Quantas vezes o volume da maior é o da menor? E a área?'
      espaco: 8
      resolucao: |
        Volume: $3^3 = 27$ vezes. Área: $3^2 = 9$ vezes.
      resposta: '27 e 9'
    - enunciado: 'Um galpão tem a forma de um prisma cuja frente é um retângulo de 6 m de largura e 3 m de altura, encimado por um triângulo de 2 m de altura. O comprimento é 10 m. Calcule o volume.'
      espaco: 10
      resolucao: |
        Área da frente: $6 \cdot 3 + \tfrac{6 \cdot 2}{2} = 24$ m². $V = 24 \cdot 10 = 240$ m³.
      resposta: '240 m³'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que, se todas as arestas de um prisma são multiplicadas por $k$, o volume fica multiplicado por $k^3$.'
      espaco: 10
      resolucao: |
        A base é uma figura semelhante, de área multiplicada por $k^2$; a altura é multiplicada por $k$. $V^{\prime} = k^2A_b \cdot kh = k^3 V$.
      resposta: 'Ver resolução'
    - enunciado: 'Explique, pelo princípio de Cavalieri, por que um prisma oblíquo tem o mesmo volume que um prisma reto de mesma base e mesma altura.'
      espaco: 12
      resolucao: |
        Apoie os dois no mesmo plano. Todo plano paralelo à base corta cada um numa figura congruente à base, de mesma área. Sólidos de mesma altura com secções de mesma área em todos os níveis têm o mesmo volume.
      resposta: 'Ver resolução'
    - enunciado: 'As faces de um paralelepípedo retângulo têm áreas 6, 8 e 12. Calcule o volume sem achar as dimensões.'
      espaco: 10
      resolucao: |
        $(ab)(bc)(ac) = (abc)^2 = 6 \cdot 8 \cdot 12 = 576$: $V = 24$.
      resposta: '24'
    - enunciado: 'Mostre que o volume de um cubo de diagonal $d$ é $\frac{d^3\sqrt{3}}{9}$.'
      espaco: 10
      resolucao: |
        $a = \tfrac{d}{\sqrt{3}}$: $V = \tfrac{d^3}{3\sqrt{3}} = \tfrac{d^3\sqrt{3}}{9}$.
      resposta: 'Ver resolução'
    - enunciado: 'Um paralelepípedo retângulo é cortado por um plano que passa por duas arestas opostas. Prove que ficam dois prismas triangulares de mesmo volume e calcule-o para as dimensões 6, 4 e 5.'
      espaco: 12
      resolucao: |
        O plano diagonal divide cada base retangular em dois triângulos congruentes. Os dois prismas têm bases congruentes e a mesma altura: volumes iguais, metade do total. $\tfrac{6 \cdot 4 \cdot 5}{2} = 60$.
      resposta: '60'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      O reservatório de água de um sítio tem a forma de um paralelepípedo de 3 m de comprimento, 2 m de largura e 1,5 m de altura. A família consome, em média, 600 litros de água por dia. Num período sem chuva, o reservatório cheio não recebe mais água.
    enunciado: |
      O reservatório cheio abastece a família por
    opcoes: ['$9$ dias', '$15$ dias', '$10$ dias', '$90$ dias', '$5$ dias']
    correta: B
    resolucao: |
      $3 \cdot 2 \cdot 1{,}5 = 9$ m³ $= 9000$ L. $\tfrac{9000}{600} = 15$ dias.

  - estilo: Fuvest
    enunciado: |
      O volume de um cubo cuja diagonal mede $5\sqrt{3}$ é
    opcoes: ['$125$', '$150$', '$75$', '$25$', '$375\sqrt{3}$']
    correta: A
    resolucao: |
      Aresta 5: $5^3 = 125$.

  - estilo: Unicamp
    enunciado: |
      O volume de um prisma triangular regular de aresta da base 4 e altura 10 é
    opcoes: ['$40\sqrt{3}$.', '$80\sqrt{3}$.', '$160$.', '$20\sqrt{3}$.']
    correta: A
    resolucao: |
      Base $\tfrac{16\sqrt{3}}{4} = 4\sqrt{3}$; $V = 40\sqrt{3}$.

  - estilo: UEM
    enunciado: |
      Considere volumes de prismas e unidades de capacidade. Assinale o que for correto.
    proposicoes:
    - '1 m³ corresponde a 1000 litros.'
    - 'Um cubo de 3 dm de aresta tem capacidade de 27 litros.'
    - 'O volume de um paralelepípedo de dimensões 2, 3 e 4 é 24.'
    - 'Dobrando todas as arestas de um prisma, o volume fica 8 vezes maior.'
    - 'Um prisma oblíquo cujas arestas laterais medem 10 tem altura 10.'
    corretas: [1, 2, 3, 4]
    resolucao: |
      01) Correta. 02) $27$ dm³. 04) Correta. 08) $2^3$. 16) Incorreta: a altura é menor que a aresta lateral.
      Soma: $01 + 02 + 04 + 08 = 15$.

  - estilo: Enem
    texto: |
      Uma piscina tem 12 m de comprimento e 6 m de largura. O fundo é inclinado: a profundidade vai de 1 m numa extremidade a 2,5 m na outra, como no corte lateral da figura. O dono quer saber quantos litros de água são necessários para enchê-la.
    figura:
      tikz: |
        \begin{scope}[scale=.25]
        \fill[lilas!30] (0,0) -- (12,0) -- (12,-2.5) -- (0,-1) -- cycle;
        \draw[ink, line width=1pt] (0,0.4) -- (0,-1) -- (12,-2.5) -- (12,0.4);
        \draw[roxo] (0,0) -- (12,0);
        \node[left, font=\scriptsize] at (0,-0.5) {1 m};
        \node[right, font=\scriptsize] at (12,-1.25) {2,5 m};
        \node[above, font=\scriptsize] at (6,0) {12 m};
        \end{scope}
    enunciado: |
      O volume de água para encher a piscina é
    opcoes: ['$72\,000$ L', '$180\,000$ L', '$126\,000$ L', '$252\,000$ L', '$21\,000$ L']
    correta: C
    resolucao: |
      Base trapezoidal: $\tfrac{(1 + 2{,}5) \cdot 12}{2} = 21$ m². $V = 21 \cdot 6 = 126$ m³ $= 126\,000$ L.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir.
    afirmativas:
    - 'Uma caixa de 1 m por 50 cm por 40 cm tem capacidade de 200 litros.'
    - 'Um prisma reto e um oblíquo, de mesma base e mesma altura, têm o mesmo volume.'
    - 'Um cubo de área total 54 tem volume 27.'
    - 'Triplicando a altura de um prisma, mantida a base, o volume fica 9 vezes maior.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'II e IV, apenas.', 'III e IV, apenas.', 'I, II e III, apenas.', 'I, II, III e IV.']
    correta: D
    resolucao: |
      I. $10 \cdot 5 \cdot 4 = 200$ dm³. II. Cavalieri. III. Aresta 3. IV. Incorreta: fica 3 vezes maior.

  - estilo: Unesp
    enunciado: |
      A capacidade de um aquário com a forma de um paralelepípedo de 60 cm por 30 cm por 40 cm é
    opcoes: ['$7{,}2$ L', '$720$ L', '$7200$ L', '$0{,}72$ L', '$72$ L']
    correta: E
    resolucao: |
      $60 \cdot 30 \cdot 40 = 72\,000$ cm³ $= 72$ L.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      Um recipiente com a forma de um paralelepípedo tem base de 20 cm por 15 cm e contém água. Ao mergulhar totalmente um objeto, o nível da água sobe 4 cm, sem transbordar, como na figura.
    figura:
      tikz: |
        \begin{scope}[scale=.12]
        \fill[lilas!30] (0,0) rectangle (20,10);
        \fill[lilas!55] (0,10) rectangle (20,14);
        \draw[ink, line width=1pt] (0,18) -- (0,0) -- (20,0) -- (20,18);
        \draw[roxo, dashed] (0,10) -- (20,10);
        \draw[roxo] (0,14) -- (20,14);
        \fill[ink] (10,4) circle (2.2);
        \node[right, font=\scriptsize] at (20,12) {4 cm};
        \end{scope}
    enunciado: |
      O volume do objeto é
    opcoes: ['$1200$ cm³.', '$300$ cm³.', '$1{,}2$ cm³.', '$4800$ cm³.']
    correta: A
    resolucao: |
      O volume do objeto é o da água deslocada: $20 \cdot 15 \cdot 4 = 1200$ cm³.

  - estilo: Fuvest
    enunciado: |
      De uma cartolina de 40 cm por 30 cm recortam-se, nos cantos, quadrados de 5 cm de lado, e as abas são dobradas para formar uma caixa sem tampa. O volume da caixa é
    opcoes: ['$6000$ cm³', '$3000$ cm³', '$1200$ cm³', '$4500$ cm³', '$1500$ cm³']
    correta: B
    resolucao: |
      Base $30 \times 20$, altura 5: $3000$ cm³.

  - estilo: UFSC
    enunciado: |
      As faces de um paralelepípedo retângulo têm áreas 6, 8 e 12. Assinale o que for correto.
    proposicoes:
    - 'O volume é 24.'
    - 'As dimensões são 2, 3 e 4.'
    - 'A área total é 52.'
    - 'A diagonal mede $\sqrt{29}$.'
    - 'Um cubo de mesmo volume tem aresta 3.'
    - 'Dobrando todas as dimensões, o volume passa a 192.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) $(abc)^2 = 576$. 02) $abc = 24$, $ab = 6$ dá $c = 4$, e assim por diante. 04) $2 \cdot 26$. 08) $\sqrt{4 + 9 + 16}$. 16) Incorreta: $3^3 = 27 \ne 24$. 32) $8 \cdot 24$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      Uma piscina retangular de 10 m por 5 m e 1,6 m de profundidade, com fundo plano, será enchida por uma bomba que fornece 5000 litros de água por hora. O zelador quer programar o desligamento automático da bomba.
    enunciado: |
      O tempo para encher a piscina é
    opcoes: ['$8$ horas', '$10$ horas', '$16$ horas', '$80$ horas', '$32$ horas']
    correta: C
    resolucao: |
      $10 \cdot 5 \cdot 1{,}6 = 80$ m³ $= 80\,000$ L. $\tfrac{80\,000}{5000} = 16$ h.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'O volume de um cubo de aresta $a$ é $a^3$.'
    - '1 litro equivale a 1 cm³.'
    - 'O volume de um prisma hexagonal regular de aresta da base 2 e altura 3 é $18\sqrt{3}$.'
    - 'O volume de um prisma oblíquo é a área da base vezes a altura (perpendicular às bases).'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – V – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – F – V – V.', 'V – V – F – V.']
    correta: D
    resolucao: |
      (V) (F) 1 L $= 1$ dm³ $= 1000$ cm³. (V) $6\sqrt{3} \cdot 3$. (V) Cavalieri.

  - estilo: Enem
    texto: |
      Uma empresa de sucos estuda novas embalagens com a forma de paralelepípedos e quer escolher a que tenha exatamente 1 litro de capacidade. O quadro mostra as dimensões internas, em centímetros, de cinco protótipos.
    tabela:
      cabecalho: ['Embalagem', 'Dimensões (cm)']
      linhas:
      - ['E1', '$10 \times 10 \times 10$']
      - ['E2', '$8 \times 8 \times 15$']
      - ['E3', '$12 \times 6 \times 14$']
      - ['E4', '$9 \times 7 \times 16$']
      - ['E5', '$5 \times 10 \times 19$']
    enunciado: |
      A embalagem com exatamente 1 litro é a
    opcoes: ['E1.', 'E2.', 'E3.', 'E4.', 'E5.']
    correta: A
    resolucao: |
      Volumes: $1000$, $960$, $1008$, $1008$ e $950$ cm³. Só E1 tem 1000 cm³ $= 1$ L.

  - estilo: Unesp
    enunciado: |
      Um prisma hexagonal regular tem aresta da base 2 e altura $10\sqrt{3}$. O seu volume é
    opcoes: ['$60\sqrt{3}$', '$120$', '$60$', '$360$', '$180$']
    correta: E
    resolucao: |
      Base $6\sqrt{3}$; $V = 6\sqrt{3} \cdot 10\sqrt{3} = 180$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Considere um cubo de aresta $a$ e diagonal $d$. Assinale o que for correto.
    proposicoes:
    - 'O volume é $\frac{d^3\sqrt{3}}{9}$.'
    - 'Se $d = 3\sqrt{3}$, o volume é 27.'
    - 'Se a área total é 6, o volume é 1.'
    - 'Para dobrar o volume, a aresta deve ser multiplicada por $\sqrt[3]{2}$.'
    - 'A área total e o volume são numericamente iguais quando $a = 6$.'
    - 'Se a aresta aumenta 10\%, o volume aumenta 30\%.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) $a = \tfrac{d}{\sqrt{3}}$. 02) $a = 3$. 04) $a = 1$. 08) $k^3 = 2$. 16) $6a^2 = a^3$. 32) Incorreta: $1{,}1^3 = 1{,}331$, aumento de 33,1\%.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Unicamp
    enunciado: |
      Um prisma oblíquo tem base de área 15 cm² e arestas laterais de 10 cm, inclinadas $30°$ em relação ao plano da base. O seu volume é
    opcoes: ['$150$ cm³.', '$75$ cm³.', '$75\sqrt{3}$ cm³.', '$50$ cm³.']
    correta: B
    resolucao: |
      Altura $10\operatorname{sen}30° = 5$ cm; $V = 15 \cdot 5 = 75$ cm³.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Um galpão tem a forma de um prisma deitado, cuja frente é um retângulo de 6 m de largura por 3 m de altura, encimado por um triângulo isósceles de 2 m de altura, como na figura. O comprimento do galpão é de 10 m.
    figura:
      tikz: |
        \begin{scope}[scale=.3]
        \draw[ink, line width=1pt, fill=lilas!30] (0,0) -- (6,0) -- (6,3) -- (3,5) -- (0,3) -- cycle;
        \draw[ink, line width=1pt, fill=lilas!15] (6,0) -- (9,2) -- (9,5) -- (6,7) -- (3,5) -- (6,3) -- cycle;
        \draw[ink] (6,3) -- (9,5) (3,5) -- (6,7);
        \end{scope}
    enunciado: |
      O volume interno do galpão é
    opcoes: ['$180$ m³', '$300$ m³', '$240$ m³', '$210$ m³', '$360$ m³']
    correta: C
    resolucao: |
      Frente: $6 \cdot 3 + \tfrac{6 \cdot 2}{2} = 24$ m². $V = 240$ m³.

  - estilo: Unesp
    enunciado: |
      Para a ventilação, todo o ar do galpão deve ser renovado 4 vezes por hora. Cada exaustor renova 480 m³ de ar por hora. O número mínimo de exaustores é
    opcoes: ['$4$', '$1$', '$3$', '$2$', '$5$']
    correta: D
    resolucao: |
      $4 \cdot 240 = 960$ m³ por hora: $\tfrac{960}{480} = 2$ exaustores.

  - estilo: Fuvest
    enunciado: |
      Duas caixas semelhantes têm volumes de 1 L e 8 L. A razão entre a área total da maior e a da menor é
    opcoes: ['$8$', '$2$', '$16$', '$\sqrt{8}$', '$4$']
    correta: E
    resolucao: |
      $k^3 = 8$: $k = 2$; áreas na razão $k^2 = 4$.

  - estilo: Unesp
    texto: |
      A figura mostra uma peça maciça, um prisma cuja base é o perfil em L: um retângulo de $4 \times 1$ com um retângulo de $1 \times 2$ sobre uma ponta. A profundidade da peça é 5 (medidas em cm).
    figura:
      tikz: |
        \begin{scope}[scale=.45]
        \draw[ink, line width=1pt, fill=lilas!30] (0,0) -- (4,0) -- (4,1) -- (1,1) -- (1,3) -- (0,3) -- cycle;
        \draw[ink, line width=1pt] (4,0) -- (5.5,1) -- (5.5,2) -- (4,1) (5.5,2) -- (2.5,2) -- (1,1) (2.5,2) -- (2.5,4) -- (1,3) (2.5,4) -- (1.5,4) -- (0,3);
        \end{scope}
    enunciado: |
      O volume da peça é
    opcoes: ['$20$ cm³', '$30$ cm³', '$40$ cm³', '$35$ cm³', '$25$ cm³']
    correta: B
    resolucao: |
      Área do L: $4 \cdot 1 + 1 \cdot 2 = 6$ cm². $V = 6 \cdot 5 = 30$ cm³.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere prismas de base com área $A_b$ e altura $h$.'
    itens:
    - 'Explique, pelo princípio de Cavalieri, por que o volume de qualquer prisma é $A_b \cdot h$, partindo do paralelepípedo retângulo.'
    - 'Um prisma oblíquo tem base quadrada de lado 6 e arestas laterais de 10 inclinadas $60°$. Calcule o volume.'
    - 'Calcule o volume de um prisma reto de mesma base cuja área lateral é igual à do prisma oblíquo do item b), sabendo que, no oblíquo, duas faces são retângulos e duas são paralelogramos com ângulo de $60°$.'
    espaco: 62
    resolucao: |
      a) Um paralelepípedo retângulo de base com área $A_b$ e altura $h$ tem volume $A_b h$. Qualquer prisma de mesma altura, com base de mesma área, tem secções paralelas de mesma área em todos os níveis: mesmo volume.
      b) $h = 10\operatorname{sen}60° = 5\sqrt{3}$; $V = 36 \cdot 5\sqrt{3} = 180\sqrt{3}$.
      c) Área lateral do oblíquo: $2 \cdot 60 + 2 \cdot 6 \cdot 5\sqrt{3} = 120 + 60\sqrt{3}$. Reto: $24H = 120 + 60\sqrt{3}$, $H = 5 + \tfrac{5\sqrt{3}}{2}$; $V = 36H = 180 + 90\sqrt{3}$.
    resposta: 'b) $180\sqrt{3}$; c) $180 + 90\sqrt{3}$'

  - estilo: Unicamp
    texto: |
      De uma folha de 30 cm por 20 cm recortam-se, nos quatro cantos, quadrados de lado $x$, e as abas são dobradas para formar uma caixa sem tampa.
    enunciado: ''
    itens:
    - 'Escreva o volume $V(x)$ e dê os valores possíveis de $x$.'
    - 'Calcule $V(2)$, $V(4)$ e $V(5)$.'
    - 'Qual dos três dá a maior caixa? E a área de papel usada muda com $x$?'
    espaco: 62
    resolucao: |
      a) $V(x) = x(30 - 2x)(20 - 2x)$, com $0 < x < 10$.
      b) $V(2) = 2 \cdot 26 \cdot 16 = 832$; $V(4) = 4 \cdot 22 \cdot 12 = 1056$; $V(5) = 5 \cdot 20 \cdot 10 = 1000$ (cm³).
      c) $x = 4$. A área usada é $600 - 4x^2$: diminui quando $x$ aumenta.
    resposta: 'b) 832, 1056, 1000; c) $x = 4$'

  - estilo: ITA
    enunciado: |
      Um tanque tem a forma de um cubo. Quando se retiram 18 litros de água, o nível baixa 2 cm. A aresta do tanque mede
    opcoes: ['$3\sqrt{10}$ dm', '$9$ dm', '$90$ cm', '$30$ cm', '$\sqrt{90}$ cm']
    correta: A
    espaco: 22
    resolucao: |
      $a^2 \cdot 0{,}2$ dm $= 18$ dm³: $a^2 = 90$ dm², $a = 3\sqrt{10}$ dm.
    resposta: 'A'

  - estilo: Unesp
    texto: |
      Um aquário tem base de 40 cm por 25 cm e 30 cm de altura; a água está a 20 cm do fundo.
    enunciado: ''
    itens:
    - 'Quantos litros de água há no aquário?'
    - 'São colocadas 5 bolinhas maciças de 500 cm³ cada. Quanto sobe o nível?'
    - 'Quantas bolinhas iguais, no máximo, podem ser colocadas sem a água transbordar?'
    espaco: 62
    resolucao: |
      a) $40 \cdot 25 \cdot 20 = 20\,000$ cm³ $= 20$ L.
      b) $2500 = 1000 \cdot \Delta h$: sobe 2,5 cm.
      c) Cabem mais 10 cm: $10\,000$ cm³, isto é, 20 bolinhas.
    resposta: 'a) 20 L; b) 2,5 cm; c) 20'

  - estilo: UFSC
    enunciado: |
      Considere volumes de prismas. Assinale o que for correto.
    proposicoes:
    - 'O volume de um prisma é a área da base vezes a altura.'
    - '1000 litros correspondem a 1 m³.'
    - 'Um cubo de área total 150 tem volume 125.'
    - 'Aumentando 10\% todas as arestas de um prisma, o volume aumenta 33,1\%.'
    - 'Dois prismas de mesma base e mesma área lateral têm o mesmo volume.'
    - 'A caixa sem tampa obtida de uma folha de $30 \times 20$, recortando quadrados de lado 5 nos cantos, tem volume 1000.'
    corretas: [1, 2, 3, 4, 6]
    espaco: 22
    resolucao: |
      01) Correta. 02) Correta. 04) Aresta 5. 08) $1{,}1^3 = 1{,}331$. 16) Incorreta: um reto e um oblíquo podem ter a mesma área lateral e alturas diferentes. 32) $5 \cdot 20 \cdot 10$.
    resposta: 'Soma 47 (01 + 02 + 04 + 08 + 32)'

  - estilo: Fuvest
    texto: |
      Uma maquete de um edifício foi feita na escala 1 : 50.
    enunciado: ''
    itens:
    - 'Qual é a razão entre as áreas e entre os volumes da maquete e do edifício?'
    - 'Uma caixa-d''água da maquete tem 80 cm³. Qual é a capacidade da caixa real, em litros?'
    - 'O piso de um salão real tem 200 m². Qual é a área na maquete, em cm²?'
    espaco: 62
    resolucao: |
      a) $\tfrac{1}{2500}$ e $\tfrac{1}{125\,000}$.
      b) $80 \cdot 125\,000 = 10\,000\,000$ cm³ $= 10\,000$ L.
      c) $\tfrac{200}{2500} = 0{,}08$ m² $= 800$ cm².
    resposta: 'b) 10 000 L; c) 800 cm²'

  - estilo: Unicamp
    texto: |
      Uma piscina tem 12 m de comprimento e 6 m de largura, com o fundo inclinado de 1 m a 2,5 m de profundidade.
    enunciado: ''
    itens:
    - 'Calcule o volume da piscina.'
    - 'Uma bomba enche 9 m³ por hora. Em quanto tempo enche a piscina?'
    - 'Calcule a área a ser revestida com azulejos (paredes e fundo), com $\sqrt{146{,}25} \approx 12{,}1$.'
    espaco: 62
    resolucao: |
      a) Base trapezoidal $\tfrac{3{,}5 \cdot 12}{2} = 21$; $V = 126$ m³.
      b) $\tfrac{126}{9} = 14$ h.
      c) Paredes laterais: $2 \cdot 21 = 42$; cabeceiras: $6 \cdot 1 + 6 \cdot 2{,}5 = 21$; fundo: $6 \cdot \sqrt{12^2 + 1{,}5^2} \approx 72{,}6$. Total $\approx 135{,}6$ m².
    resposta: 'a) 126 m³; b) 14 h; c) $\approx 135{,}6$ m²'

  - estilo: Fuvest
    enunciado: |
      A diagonal de um cubo de volume 64 mede
    opcoes: ['$4\sqrt{3}$', '$8$', '$4\sqrt{2}$', '$12$', '$16$']
    correta: A
    espaco: 22
    resolucao: |
      Aresta 4: diagonal $4\sqrt{3}$.
    resposta: 'A'

  - estilo: Unesp
    texto: |
      Um lápis sem ponta tem a forma de um prisma hexagonal regular, com aresta da base de 4 mm e comprimento de 180 mm. Use $\sqrt{3} \approx 1{,}73$.
    enunciado: ''
    itens:
    - 'Calcule a área da base.'
    - 'Calcule o volume, em mm³ e em cm³.'
    - 'Se a madeira tem densidade de 0,6 g/cm³, qual é a massa aproximada do lápis (desconsidere o grafite)?'
    espaco: 62
    resolucao: |
      a) $6 \cdot \tfrac{16\sqrt{3}}{4} = 24\sqrt{3} \approx 41{,}5$ mm².
      b) $24\sqrt{3} \cdot 180 = 4320\sqrt{3} \approx 7474$ mm³ $\approx 7{,}5$ cm³.
      c) $7{,}5 \cdot 0{,}6 \approx 4{,}5$ g.
    resposta: 'a) $24\sqrt{3}$ mm²; b) $\approx 7{,}5$ cm³; c) $\approx 4{,}5$ g'

  - estilo: Fuvest
    enunciado: 'Um cubo de aresta $a$ é cortado pelo plano que contém duas arestas opostas (o plano diagonal).'
    itens:
    - 'Prove que o cubo fica dividido em dois prismas triangulares iguais.'
    - 'Calcule o volume de cada um para $a = 6$.'
    - 'Calcule a área total de cada prisma para $a = 6$.'
    espaco: 62
    resolucao: |
      a) O plano corta cada face de base pela diagonal, em dois triângulos retângulos congruentes; os dois prismas têm bases congruentes e a mesma altura.
      b) $\tfrac{216}{2} = 108$.
      c) Duas bases de $18$ (36), duas faces $6 \times 6$ (72) e o retângulo diagonal $6 \times 6\sqrt{2}$ ($36\sqrt{2}$): $108 + 36\sqrt{2}$.
    resposta: 'b) 108; c) $108 + 36\sqrt{2}$'
