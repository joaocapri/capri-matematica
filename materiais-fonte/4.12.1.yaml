aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere prismas retos e paralelepípedos retângulos.'
    itens:
    - 'Prove que a área lateral de um prisma reto é o perímetro da base vezes a altura.'
    - 'Prove que, num paralelepípedo retângulo, $(a + b + c)^2 = d^2 + A_T$.'
    - 'Um paralelepípedo tem $a + b + c = 14$ e diagonal 10. Calcule a área total.'
    espaco: 62
    resolucao: |
      a) As faces laterais são retângulos de altura $h$ e bases iguais aos lados da base: somando, $P \cdot h$.
      b) Desenvolvendo o quadrado: $a^2 + b^2 + c^2 + 2(ab + bc + ac)$.
      c) $196 - 100 = 96$.
    resposta: 'c) 96'

  - estilo: Unicamp
    texto: |
      Um prisma oblíquo tem base quadrada de lado 6 e arestas laterais de 10, inclinadas $30°$ em relação ao plano da base, num plano paralelo a duas faces laterais.
    enunciado: ''
    itens:
    - 'Calcule a altura do prisma.'
    - 'Calcule a área lateral.'
    - 'Compare com a área lateral de um prisma reto de mesma base e mesma altura.'
    espaco: 62
    resolucao: |
      a) $10\operatorname{sen}30° = 5$.
      b) Duas faces retangulares $6 \times 10$ (60 cada) e duas em paralelogramo de lados 6 e 10, com altura relativa ao lado 6 igual a 5 (30 cada): $A_l = 180$.
      c) Reto de altura 5: $24 \cdot 5 = 120$. O oblíquo tem área lateral maior.
    resposta: 'a) 5; b) 180; c) 120, menor'

  - estilo: ITA
    enunciado: |
      As faces de um paralelepípedo retângulo têm áreas 6, 8 e 12. A diagonal do paralelepípedo mede
    opcoes: ['$\sqrt{29}$', '$\sqrt{26}$', '$\sqrt{52}$', '$13$', '$5$']
    correta: A
    espaco: 22
    resolucao: |
      $ab = 6$, $ac = 8$, $bc = 12$: $(abc)^2 = 576$, $abc = 24$. Então $a = 2$, $b = 3$, $c = 4$ e $d = \sqrt{4 + 9 + 16} = \sqrt{29}$.
    resposta: 'A'

  - estilo: Unesp
    texto: |
      Um cubo de madeira de aresta 3 é pintado por fora e depois cortado em 27 cubinhos de aresta 1.
    enunciado: ''
    itens:
    - 'Quantos cubinhos ficam com 3, 2, 1 e 0 faces pintadas?'
    - 'Confira que o total de faces pintadas dos cubinhos é igual à área do cubo original.'
    - 'Generalize para um cubo de aresta $n$ cortado em $n^3$ cubinhos: quantos não têm face pintada?'
    espaco: 62
    resolucao: |
      a) 3 faces: os 8 cantos. 2 faces: 1 por aresta, 12. 1 face: 1 por face, 6. 0 faces: o central, 1. ($8 + 12 + 6 + 1 = 27$.)
      b) $8 \cdot 3 + 12 \cdot 2 + 6 \cdot 1 = 54 = 6 \cdot 9$.
      c) Os do interior formam um cubo de aresta $n - 2$: $(n - 2)^3$.
    resposta: 'a) 8, 12, 6, 1; c) $(n - 2)^3$'

  - estilo: UFSC
    enunciado: |
      Considere prismas e as suas áreas. Assinale o que for correto.
    proposicoes:
    - 'A área total de um cubo de aresta $a$ é $6a^2$.'
    - 'Dobrando a aresta de um cubo, a área total fica 4 vezes maior.'
    - 'Um paralelepípedo de dimensões 1, 2 e 3 tem área total 22.'
    - 'Um prisma hexagonal regular de aresta da base $\ell$ e altura $h$ tem área total $6\ell h + 3\sqrt{3}\,\ell^2$.'
    - 'Um prisma reto e um oblíquo, de mesma base e mesma altura, têm a mesma área lateral.'
    - 'Um cubo de diagonal $\sqrt{3}$ tem área total 6.'
    corretas: [1, 2, 3, 4, 6]
    espaco: 22
    resolucao: |
      01) Correta. 02) $(2a)^2 = 4a^2$. 04) $2(2 + 6 + 3)$. 08) $6\ell h + 2 \cdot \tfrac{6\ell^2\sqrt{3}}{4}$. 16) Incorreta: a do oblíquo é maior. 32) Aresta 1.
    resposta: 'Soma 47 (01 + 02 + 04 + 08 + 32)'

  - estilo: Fuvest
    enunciado: 'Considere os paralelepípedos retângulos com soma das dimensões $a + b + c = s$ fixa.'
    itens:
    - 'Mostre que $A_T = s^2 - d^2$.'
    - 'Prove que $a^2 + b^2 + c^2 \ge \frac{s^2}{3}$, com igualdade só se $a = b = c$.'
    - 'Conclua qual tem a maior área total e calcule essa área para $s = 12$.'
    espaco: 62
    resolucao: |
      a) Da relação $(a + b + c)^2 = d^2 + A_T$.
      b) $3(a^2 + b^2 + c^2) - (a + b + c)^2 = (a - b)^2 + (b - c)^2 + (a - c)^2 \ge 0$.
      c) $d^2$ mínimo no cubo: $A_T$ máxima, $s^2 - \tfrac{s^2}{3} = \tfrac{2s^2}{3}$. Para $s = 12$: cubo de aresta 4, área 96.
    resposta: 'c) o cubo; 96'

  - estilo: Unicamp
    texto: |
      Uma barraca tem a forma de um prisma triangular deitado: a frente e o fundo são triângulos isósceles de base 3 m e altura 2 m, e o comprimento é 4 m.
    enunciado: ''
    itens:
    - 'Calcule o lado inclinado do triângulo.'
    - 'Calcule a área de lona sem o piso.'
    - 'Calcule a área total, com o piso.'
    espaco: 62
    resolucao: |
      a) $\sqrt{1{,}5^2 + 2^2} = 2{,}5$ m.
      b) Faces inclinadas $2 \cdot 2{,}5 \cdot 4 = 20$; frente e fundo $2 \cdot 3 = 6$. Total 26 m².
      c) Piso $3 \cdot 4 = 12$: 38 m².
    resposta: 'a) 2,5 m; b) 26 m²; c) 38 m²'

  - estilo: Fuvest
    enunciado: |
      Um cubo tem área total 216. A sua diagonal mede
    opcoes: ['$6\sqrt{3}$', '$6\sqrt{2}$', '$36$', '$18$', '$12$']
    correta: A
    espaco: 22
    resolucao: |
      $6a^2 = 216$: $a = 6$; diagonal $6\sqrt{3}$.
    resposta: 'A'

  - estilo: Unesp
    enunciado: 'Um prisma hexagonal regular tem aresta da base 3 e altura 8.'
    itens:
    - 'Calcule a área de uma base e a área total.'
    - 'Calcule a maior diagonal do prisma.'
    - 'Calcule a diagonal que liga um vértice de uma base ao vértice da outra base que está a dois vértices de distância (diagonal menor).'
    espaco: 62
    resolucao: |
      a) $6 \cdot \tfrac{9\sqrt{3}}{4} = \tfrac{27\sqrt{3}}{2}$; $A_T = 18 \cdot 8 + 27\sqrt{3} = 144 + 27\sqrt{3}$.
      b) Diagonal maior da base 6: $\sqrt{36 + 64} = 10$.
      c) Diagonal menor da base $3\sqrt{3}$: $\sqrt{27 + 64} = \sqrt{91}$.
    resposta: 'a) $\frac{27\sqrt{3}}{2}$ e $144 + 27\sqrt{3}$; b) 10; c) $\sqrt{91}$'

  - estilo: Fuvest
    enunciado: 'Um cubo de aresta 3 é formado por 27 cubinhos de aresta 1. Retira-se um único cubinho da superfície.'
    itens:
    - 'Qual é a área total se o cubinho retirado for de um canto?'
    - 'E se for do meio de uma aresta?'
    - 'E se for do centro de uma face?'
    espaco: 62
    resolucao: |
      Saem as faces expostas do cubinho e aparecem as faces dos vizinhos que ficavam encostadas nele.
      a) Canto: sai 3, entra 3: 54.
      b) Meio de aresta: sai 2, entra 4: 56.
      c) Centro de face: sai 1, entra 5: 58.
    resposta: 'a) 54; b) 56; c) 58'
