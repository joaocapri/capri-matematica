# Aula 2.12.1 — Trigonometria: razões trigonométricas no triângulo retângulo
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: seno, cosseno e tangente de ângulo agudo; cateto oposto e adjacente; calcular lados com as
# razões (valores aproximados dados no enunciado); ângulos complementares; sen² + cos² = 1 e tg = sen/cos como
# consequências de Pitágoras. Os ângulos notáveis (30°, 45°, 60°) ficam para a aula 2.12.2.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Para um ângulo agudo $\alpha$ de um triângulo retângulo, $\operatorname{sen}\alpha = \frac{\text{oposto}}{\text{hipotenusa}}$, $\cos\alpha = \frac{\text{adjacente}}{\text{hipotenusa}}$ e $\operatorname{tg}\alpha = \frac{\text{oposto}}{\text{adjacente}}$. Use os valores aproximados dados em cada questão. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'No triângulo retângulo da figura, complete.'
      figura:
        tikz: |
          \begin{scope}[scale=.5]
          \draw[ink, line width=.9pt] (0,0) -- (6,0) -- (6,3.2) -- cycle;
          \draw[ink] (5.6,0) -- (5.6,.4) -- (6,.4);
          \node[below, font=\small] at (3,0) {$15$};
          \node[right, font=\small] at (6,1.6) {$8$};
          \node[above left, font=\small] at (3,1.6) {$17$};
          \draw[roxo] (1.1,0) arc (0:28:1.1); \node[roxo, font=\small] at (1.6,.32) {$\alpha$};
          \end{scope}
      itens:
      - '$\operatorname{sen}\alpha =$ {{8/17}}'
      - '$\cos\alpha =$ {{15/17}}'
      - '$\operatorname{tg}\alpha =$ {{8/15}}'
      espaco_item: 8
      resolucao: |
        Oposto a $\alpha$: 8; adjacente: 15; hipotenusa: 17.
      resposta: '$\frac{8}{17}$; $\frac{15}{17}$; $\frac{8}{15}$'
    - texto: |
        Num triângulo retângulo de catetos 7 e 24 e hipotenusa 25, $\alpha$ é o ângulo oposto ao cateto 7 e $\beta$ é o outro ângulo agudo.
      enunciado: 'Associe cada expressão ao seu valor.'
      esquerda:
      - '$\operatorname{sen}\alpha$'
      - '$\cos\alpha$'
      - '$\operatorname{tg}\alpha$'
      - '$\operatorname{tg}\beta$'
      - '$\operatorname{sen}\alpha + \cos\alpha$'
      direita:
      - '$\frac{24}{7}$'
      - '$\frac{31}{25}$'
      - '$\frac{7}{25}$'
      - '$\frac{24}{25}$'
      - '$\frac{7}{24}$'
      resolucao: |
        $\operatorname{sen}\alpha = \frac{7}{25}$, $\cos\alpha = \frac{24}{25}$, $\operatorname{tg}\alpha = \frac{7}{24}$; para $\beta$ o oposto é 24: $\operatorname{tg}\beta = \frac{24}{7}$. A soma é $\frac{31}{25}$.
      resposta: 'De cima para baixo: 4, 5, 1, 2, 3'
    - enunciado: 'Marque V (verdadeiro) ou F (falso). Os ângulos são agudos.'
      afirmacoes:
      - '$\operatorname{sen}\alpha = \cos(90^\circ - \alpha)$.'
      - 'A tangente de um ângulo agudo é sempre menor que 1.'
      - 'O seno de um ângulo agudo é sempre menor que 1.'
      - 'Se dobrarmos os lados do triângulo, o seno de $\alpha$ dobra.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) O oposto a $\alpha$ é o adjacente ao complementar. (F) Se o oposto é maior que o adjacente, passa de 1. (V) O cateto é menor que a hipotenusa. (F) A razão não muda.
      resposta: V, F, V, F
    - enunciado: 'Num triângulo retângulo com um ângulo de $25^\circ$, use $\operatorname{sen}25^\circ \approx 0{,}42$ e $\cos 25^\circ \approx 0{,}91$ e complete a tabela.'
      tabela:
        cabecalho: ['Hipotenusa', 'Cateto oposto a $25^\circ$', 'Cateto adjacente a $25^\circ$']
        linhas:
        - ['$50$', '${{21}}$', '${{45{,}5}}$']
        - ['$20$', '${{8{,}4}}$', '${{18{,}2}}$']
        - ['$100$', '${{42}}$', '${{91}}$']
        - ['$10$', '${{4{,}2}}$', '${{9{,}1}}$']
      resolucao: |
        Oposto $=$ hipotenusa $\cdot \operatorname{sen}25^\circ$; adjacente $=$ hipotenusa $\cdot \cos 25^\circ$.
      resposta: '21 e 45,5; 8,4 e 18,2; 42 e 91; 4,2 e 9,1'
    - enunciado: 'A hipotenusa de um triângulo retângulo mede 15 e um dos ângulos agudos mede $52^\circ$. Calcule o cateto adjacente a esse ângulo. Use $\cos 52^\circ \approx 0{,}62$.'
      espaco: 8
      resolucao: |
        $x = 15 \cdot 0{,}62 = 9{,}3$.
      resposta: '$\approx 9{,}3$'
    - enunciado: 'Um ângulo agudo de $35^\circ$ tem cateto adjacente de 20 cm. Calcule o cateto oposto. Use $\operatorname{tg}35^\circ \approx 0{,}70$.'
      espaco: 8
      resolucao: |
        $\operatorname{tg}35^\circ = \frac{x}{20}$: $x = 20 \cdot 0{,}70 = 14$ cm.
      resposta: '$\approx 14$ cm'
    - enunciado: 'Sabendo que $\operatorname{sen}20^\circ \approx 0{,}34$ e $\cos 20^\circ \approx 0{,}94$, dê $\cos 70^\circ$ e $\operatorname{sen}70^\circ$. Justifique.'
      espaco: 8
      resolucao: |
        $20^\circ$ e $70^\circ$ são complementares: $\cos 70^\circ = \operatorname{sen}20^\circ \approx 0{,}34$ e $\operatorname{sen}70^\circ = \cos 20^\circ \approx 0{,}94$.
      resposta: '$0{,}34$ e $0{,}94$'
  - nome: Nível 2
    questoes:
    - texto: |
        Num triângulo retângulo de catetos 20 e 21 e hipotenusa 29, Bia disse que a tangente do ângulo oposto ao cateto 20 é $\frac{20}{29}$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 8
      resolucao: |
        Ela dividiu pela hipotenusa (isso é o seno). A tangente é oposto sobre adjacente: $\frac{20}{21}$.
      resposta: '$\frac{20}{21}$'
    - enunciado: 'Um ângulo agudo $\alpha$ tem $\operatorname{sen}\alpha = \frac{9}{41}$. Calcule $\cos\alpha$ e $\operatorname{tg}\alpha$.'
      espaco: 10
      resolucao: |
        Oposto 9 e hipotenusa 41: adjacente $= \sqrt{41^2 - 9^2} = \sqrt{1600} = 40$. $\cos\alpha = \frac{40}{41}$, $\operatorname{tg}\alpha = \frac{9}{40}$.
      resposta: '$\frac{40}{41}$ e $\frac{9}{40}$'
    - enunciado: 'Um prédio projeta uma sombra de 24 m quando os raios do Sol fazem $58^\circ$ com o chão. Calcule a altura do prédio. Use $\operatorname{tg}58^\circ \approx 1{,}6$.'
      espaco: 8
      resolucao: |
        $h = 24 \cdot 1{,}6 = 38{,}4$ m.
      resposta: '$\approx 38{,}4$ m'
    - enunciado: 'Um triângulo retângulo tem hipotenusa 37 e um cateto 12. Sendo $\alpha$ o ângulo oposto ao cateto 12, complete.'
      itens:
      - 'Outro cateto: {{35}}'
      - '$\operatorname{sen}\alpha =$ {{12/37}}'
      - '$\cos\alpha =$ {{35/37}}'
      - '$\operatorname{tg}\alpha =$ {{12/35}}'
      espaco_item: 8
      resolucao: |
        $\sqrt{37^2 - 12^2} = \sqrt{1225} = 35$.
      resposta: '35; $\frac{12}{37}$; $\frac{35}{37}$; $\frac{12}{35}$'
    - enunciado: 'Um ângulo agudo tem $\operatorname{tg}\alpha = 2$. Calcule $\operatorname{sen}\alpha$ e $\cos\alpha$.'
      espaco: 10
      resolucao: |
        Catetos 2 (oposto) e 1 (adjacente), hipotenusa $\sqrt{5}$: $\operatorname{sen}\alpha = \frac{2\sqrt{5}}{5}$, $\cos\alpha = \frac{\sqrt{5}}{5}$.
      resposta: '$\frac{2\sqrt5}{5}$ e $\frac{\sqrt5}{5}$'
    - enunciado: 'A 50 m da base de uma torre, uma pessoa com os olhos a 1,7 m do chão vê o topo sob um ângulo de $31^\circ$ com a horizontal. Calcule a altura da torre. Use $\operatorname{tg}31^\circ \approx 0{,}6$.'
      espaco: 10
      resolucao: |
        Acima dos olhos: $50 \cdot 0{,}6 = 30$ m. Altura: $30 + 1{,}7 = 31{,}7$ m.
      resposta: '$\approx 31{,}7$ m'
    - enunciado: 'Num triângulo retângulo, um ângulo agudo $\alpha$ tem $\operatorname{sen}\alpha = 2\cos\alpha$. Calcule $\operatorname{tg}\alpha$.'
      espaco: 8
      resolucao: |
        $\operatorname{tg}\alpha = \frac{\operatorname{sen}\alpha}{\cos\alpha} = 2$.
      resposta: '2'
    - enunciado: 'Uma rampa de 8 m de comprimento faz $12^\circ$ com o chão. Que altura ela vence? Use $\operatorname{sen}12^\circ \approx 0{,}21$.'
      espaco: 8
      resolucao: |
        A rampa é a hipotenusa: $h = 8 \cdot 0{,}21 = 1{,}68$ m.
      resposta: '$\approx 1{,}68$ m'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que $\operatorname{sen}^2\alpha + \cos^2\alpha = 1$ para todo ângulo agudo $\alpha$.'
      espaco: 10
      resolucao: |
        Com catetos $b$ (oposto) e $c$ (adjacente) e hipotenusa $a$: $\frac{b^2}{a^2} + \frac{c^2}{a^2} = \frac{b^2 + c^2}{a^2} = 1$, por Pitágoras.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que $\operatorname{tg}\alpha = \frac{\operatorname{sen}\alpha}{\cos\alpha}$.'
      espaco: 10
      resolucao: |
        $\frac{\operatorname{sen}\alpha}{\cos\alpha} = \frac{b/a}{c/a} = \frac{b}{c} = \operatorname{tg}\alpha$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que, para todo ângulo agudo, $\operatorname{sen}\alpha < \operatorname{tg}\alpha$.'
      espaco: 10
      resolucao: |
        $\operatorname{tg}\alpha = \frac{\operatorname{sen}\alpha}{\cos\alpha}$ e $0 < \cos\alpha < 1$; dividir um número positivo por algo menor que 1 aumenta o número.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que o seno de um ângulo agudo $\alpha$ não depende do tamanho do triângulo retângulo escolhido.'
      espaco: 10
      resolucao: |
        Dois triângulos retângulos com o ângulo $\alpha$ têm os três ângulos iguais, logo são semelhantes: os lados correspondentes são proporcionais e a razão oposto/hipotenusa é a mesma.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que $\operatorname{tg}\alpha \cdot \operatorname{tg}(90^\circ - \alpha) = 1$.'
      espaco: 10
      resolucao: |
        O oposto a $\alpha$ é o adjacente a $90^\circ - \alpha$ e vice-versa: $\frac{b}{c} \cdot \frac{c}{b} = 1$.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Para facilitar o acesso de cadeirantes, um condomínio construiu uma rampa reta que vence um desnível de 1,2 m. Medida no chão, a projeção horizontal da rampa tem 15 m, como mostra a figura. A inclinação de uma rampa costuma ser informada pela tangente do ângulo que ela faz com o chão.
    figura:
      tikz: |
        \begin{scope}[scale=.55]
        \fill[lilas] (0,0) -- (8,0) -- (8,1.6) -- cycle;
        \draw[ink, line width=.9pt] (0,0) -- (8,0) -- (8,1.6) -- cycle;
        \draw[ink] (7.7,0) -- (7.7,.3) -- (8,.3);
        \node[below, font=\small] at (4,0) {$15$ m};
        \node[right, font=\small] at (8,.8) {$1{,}2$ m};
        \draw[roxo] (1.4,0) arc (0:11.3:1.4); \node[roxo, font=\small] at (1.95,.18) {$\alpha$};
        \end{scope}
    enunciado: |
      A tangente do ângulo $\alpha$ de inclinação da rampa é
    opcoes: ['$0{,}08$', '$0{,}8$', '$12{,}5$', '$0{,}12$', '$0{,}015$']
    correta: A
    resolucao: |
      $\operatorname{tg}\alpha = \frac{1{,}2}{15} = 0{,}08$.

  - estilo: Fuvest
    enunciado: |
      Num triângulo retângulo de catetos 9 e 40 e hipotenusa 41, o cosseno do ângulo oposto ao cateto 9 é
    opcoes: ['$\frac{9}{41}$', '$\frac{40}{41}$', '$\frac{9}{40}$', '$\frac{40}{9}$', '$\frac{41}{40}$']
    correta: B
    resolucao: |
      O adjacente a esse ângulo é 40: $\frac{40}{41}$.

  - estilo: Unicamp
    enunciado: |
      Num triângulo retângulo de hipotenusa 50, um ângulo agudo $\alpha$ tem $\operatorname{sen}\alpha = 0{,}28$. O cateto oposto a $\alpha$ mede
    opcoes: ['$12$.', '$10$.', '$14$.', '$16$.']
    correta: C
    resolucao: |
      $50 \cdot 0{,}28 = 14$.

  - estilo: UEM
    enunciado: |
      Um triângulo retângulo tem catetos 11 e 60 e hipotenusa 61. Seja $\alpha$ o ângulo oposto ao cateto 11 e $\beta$ o outro ângulo agudo. Assinale o que for correto.
    proposicoes:
    - '$\operatorname{sen}\alpha = \frac{11}{61}$.'
    - '$\cos\alpha = \frac{60}{61}$.'
    - '$\operatorname{tg}\alpha = \frac{11}{60}$.'
    - '$\operatorname{sen}\alpha = \cos\beta$.'
    - '$\operatorname{tg}\alpha \cdot \operatorname{tg}\beta = 2$.'
    - '$\operatorname{sen}^2\alpha + \cos^2\alpha = 1$.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) a 04) Definições; o oposto a $\alpha$ é o adjacente a $\beta$. 16) Incorreta: $\frac{11}{60} \cdot \frac{60}{11} = 1$. 32) $\frac{121 + 3600}{3721} = 1$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      Num campeonato de pipas, os juízes estimam a altura de cada pipa pelo comprimento da linha esticada e pelo ângulo que ela faz com o chão. Uma pipa está presa a 50 m de linha, esticada, que forma $55^\circ$ com o chão. O quadro traz valores aproximados que os juízes usam.
    tabela:
      cabecalho: ['Ângulo', 'seno', 'cosseno', 'tangente']
      linhas:
      - ['$25^\circ$', '$0{,}42$', '$0{,}91$', '$0{,}47$']
      - ['$35^\circ$', '$0{,}57$', '$0{,}82$', '$0{,}70$']
      - ['$55^\circ$', '$0{,}82$', '$0{,}57$', '$1{,}43$']
      - ['$65^\circ$', '$0{,}91$', '$0{,}42$', '$2{,}14$']
    enunciado: |
      Desprezando a altura de quem segura a linha, a pipa está a uma altura de, aproximadamente,
    opcoes: ['$28{,}5$ m', '$35$ m', '$25$ m', '$41$ m', '$71{,}5$ m']
    correta: D
    resolucao: |
      A linha é a hipotenusa e a altura é o cateto oposto a $55^\circ$: $50 \cdot 0{,}82 = 41$ m.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir, sobre ângulos agudos de um triângulo retângulo.
    afirmativas:
    - 'O seno de um ângulo agudo está entre 0 e 1.'
    - 'A tangente de um ângulo agudo pode ser maior que 1.'
    - 'Quanto maior o ângulo agudo, maior o seu cosseno.'
    - '$\operatorname{sen}\alpha = \cos(90^\circ - \alpha)$.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'I e III, apenas.', 'II e IV, apenas.', 'II, III e IV, apenas.', 'I, II e IV, apenas.']
    correta: E
    resolucao: |
      I. Correta. II. Correta: basta o oposto ser maior que o adjacente. III. Incorreta: o cosseno diminui. IV. Correta.

  - estilo: Unesp
    enunciado: |
      Num triângulo retângulo, um ângulo agudo $\alpha$ tem $\operatorname{tg}\alpha = 0{,}75$ e cateto adjacente 16. A hipotenusa mede
    opcoes: ['$20$', '$12$', '$25$', '$28$', '$15$']
    correta: A
    resolucao: |
      Oposto: $16 \cdot 0{,}75 = 12$. Hipotenusa: $\sqrt{256 + 144} = 20$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      No triângulo retângulo da figura, a hipotenusa mede 85 e o cateto oposto ao ângulo $\theta$ mede 13.
    figura:
      tikz: |
        \begin{scope}[scale=.55]
        \draw[ink, line width=.9pt] (0,0) -- (7,0) -- (7,1.4) -- cycle;
        \draw[ink] (6.7,0) -- (6.7,.3) -- (7,.3);
        \node[right, font=\small] at (7,.7) {$13$};
        \node[above left, font=\small] at (3.5,.7) {$85$};
        \draw[roxo] (1.5,0) arc (0:11.3:1.5); \node[roxo, font=\small] at (2.05,.2) {$\theta$};
        \end{scope}
    enunciado: |
      O valor de $\operatorname{tg}\theta$ é
    opcoes: ['$\frac{13}{85}$.', '$\frac{13}{84}$.', '$\frac{84}{85}$.', '$\frac{84}{13}$.']
    correta: B
    resolucao: |
      Adjacente: $\sqrt{85^2 - 13^2} = \sqrt{7056} = 84$. $\operatorname{tg}\theta = \frac{13}{84}$.

  - estilo: Fuvest
    enunciado: |
      Se $\alpha$ é agudo e $\operatorname{sen}\alpha = \frac{2}{3}$, então $\operatorname{tg}\alpha$ vale
    opcoes: ['$\frac{\sqrt5}{3}$', '$\frac{3}{2}$', '$\frac{2\sqrt5}{5}$', '$\frac{\sqrt5}{2}$', '$\frac{2}{3}$']
    correta: C
    resolucao: |
      Oposto 2, hipotenusa 3, adjacente $\sqrt{5}$: $\operatorname{tg}\alpha = \frac{2}{\sqrt5} = \frac{2\sqrt5}{5}$.

  - estilo: UFSC
    enunciado: |
      Uma escada de 7,5 m está apoiada numa parede vertical, com o pé a 2,1 m da parede. Seja $\alpha$ o ângulo entre a escada e o chão e $\beta$ o ângulo entre a escada e a parede. Assinale o que for correto.
    proposicoes:
    - 'A escada toca a parede a 7,2 m do chão.'
    - '$\cos\alpha = 0{,}28$.'
    - '$\operatorname{sen}\alpha = 0{,}96$.'
    - '$\operatorname{tg}\alpha = \frac{24}{7}$.'
    - '$\operatorname{sen}\beta = 0{,}28$.'
    - '$\operatorname{tg}\alpha < 1$.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) $\sqrt{56{,}25 - 4{,}41} = \sqrt{51{,}84} = 7{,}2$. 02) $\frac{2{,}1}{7{,}5}$. 04) $\frac{7{,}2}{7{,}5}$. 08) $\frac{7{,}2}{2{,}1} = \frac{24}{7}$. 16) $\beta$ é complementar de $\alpha$. 32) Incorreta.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      Logo após decolar, um avião sobe em linha reta, formando um ângulo de $15^\circ$ com a pista. Um passageiro curioso quer saber a que altura o avião estará depois de percorrer 2 km nessa trajetória. Ele encontrou no celular que $\operatorname{sen}15^\circ \approx 0{,}26$ e $\cos 15^\circ \approx 0{,}97$.
    enunciado: |
      A altura do avião, nesse momento, será de aproximadamente
    opcoes: ['$520$ m', '$260$ m', '$1\,940$ m', '$540$ m', '$2\,000$ m']
    correta: A
    resolucao: |
      A trajetória é a hipotenusa: $2\,000 \cdot 0{,}26 = 520$ m.

  - estilo: UFPR
    enunciado: |
      Um triângulo retângulo tem catetos 16 e 63 e hipotenusa 65. Sendo $\alpha$ o ângulo oposto ao cateto 16, identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - '$\operatorname{sen}\alpha = \frac{16}{65}$.'
    - '$\cos\alpha = \frac{16}{63}$.'
    - '$\operatorname{tg}\alpha = \frac{16}{63}$.'
    - '$\operatorname{sen}\alpha < \operatorname{tg}\alpha$.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – F – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – V – F.', 'V – F – V – V.']
    correta: E
    resolucao: |
      (V) (F) $\cos\alpha = \frac{63}{65}$. (V) (V) $\frac{16}{65} < \frac{16}{63}$.

  - estilo: Enem
    texto: |
      Para medir a largura de um rio sem atravessá-lo, um topógrafo fica no ponto A de uma margem, exatamente em frente a uma árvore T da outra margem. Ele anda 40 m pela margem até o ponto B e mede o ângulo $A\hat{B}T = 62^\circ$, como na figura. Ele usa $\operatorname{tg}62^\circ \approx 1{,}88$.
    figura:
      tikz: |
        \begin{scope}[scale=.55]
        \fill[lilas] (-.6,0) rectangle (5.2,2.8);
        \draw[ink, line width=.8pt] (-.6,0) -- (5.2,0);
        \draw[ink, line width=.8pt] (-.6,2.8) -- (5.2,2.8);
        \draw[roxo, line width=.9pt] (0,0) -- (0,2.8) -- (4,0) -- cycle;
        \draw[ink] (0,.3) -- (.3,.3) -- (.3,0);
        \fill[ink] (0,0) circle (1.6pt) node[below, font=\small] {A};
        \fill[ink] (4,0) circle (1.6pt) node[below, font=\small] {B};
        \fill[lima!80!black] (0,2.8) circle (2.2pt) node[above, font=\small] {T};
        \node[below, font=\small] at (2,0) {$40$ m};
        \draw[roxo] (3.3,0) arc (180:145:.7); \node[roxo, font=\scriptsize] at (3.05,.32) {$62^\circ$};
        \end{scope}
    enunciado: |
      A largura do rio é de, aproximadamente,
    opcoes: ['$37{,}6$ m', '$45{,}2$ m', '$62$ m', '$75{,}2$ m', '$80$ m']
    correta: D
    resolucao: |
      No triângulo retângulo em A: $\operatorname{tg}62^\circ = \frac{AT}{40}$, $AT = 40 \cdot 1{,}88 = 75{,}2$ m.

  - estilo: Unesp
    enunciado: |
      Se $\alpha$ é agudo e $\operatorname{sen}\alpha = \frac{15}{17}$, então $\operatorname{tg}\alpha$ vale
    opcoes: ['$\frac{8}{15}$', '$\frac{15}{8}$', '$\frac{17}{8}$', '$\frac{8}{17}$', '$\frac{17}{15}$']
    correta: B
    resolucao: |
      Adjacente $\sqrt{289 - 225} = 8$: $\operatorname{tg}\alpha = \frac{15}{8}$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Sejam $\alpha$ e $\beta$ ângulos agudos. Assinale o que for correto.
    proposicoes:
    - '$\operatorname{sen}\alpha = \cos(90^\circ - \alpha)$.'
    - '$\operatorname{tg}\alpha \cdot \operatorname{tg}(90^\circ - \alpha) = 1$.'
    - '$\operatorname{sen}^2\alpha + \cos^2\alpha = 1$.'
    - 'Se $\alpha < \beta$, então $\operatorname{sen}\alpha < \operatorname{sen}\beta$.'
    - 'Se $\alpha < \beta$, então $\operatorname{tg}\alpha > \operatorname{tg}\beta$.'
    - '$\cos\alpha = \frac{\operatorname{sen}\alpha}{\operatorname{tg}\alpha}$.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) a 04) Corretas (com a hipotenusa fixa, o oposto cresce com o ângulo). 16) Incorreta: a tangente também cresce. 32) De $\operatorname{tg} = \frac{\operatorname{sen}}{\cos}$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Unicamp
    enunciado: |
      Num triângulo retângulo, um ângulo agudo $\alpha$ tem $\operatorname{tg}\alpha = \frac{1}{3}$ e cateto adjacente 9. O perímetro do triângulo é
    opcoes: ['$12 + 3\sqrt{10}$.', '$12 + \sqrt{10}$.', '$15$.', '$9 + 3\sqrt{10}$.']
    correta: A
    resolucao: |
      Oposto 3, hipotenusa $\sqrt{81 + 9} = 3\sqrt{10}$. Perímetro: $12 + 3\sqrt{10}$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Do alto de um farol de 40 m de altura, o faroleiro avista um barco sob um ângulo de depressão de $20^\circ$, isto é, a linha de visada desce $20^\circ$ abaixo da horizontal. Ele usa os valores aproximados $\operatorname{sen}20^\circ \approx 0{,}34$, $\cos 20^\circ \approx 0{,}94$ e $\operatorname{tg}20^\circ \approx 0{,}36$ e despreza a própria altura.
    enunciado: |
      A distância horizontal da base do farol até o barco é de, aproximadamente,
    opcoes: ['$14{,}4$ m', '$42{,}6$ m', '$111$ m', '$124$ m', '$37{,}6$ m']
    correta: C
    resolucao: |
      No ponto do barco, o ângulo de elevação até o topo é $20^\circ$: $\operatorname{tg}20^\circ = \frac{40}{d}$, $d = \frac{40}{0{,}36} \approx 111$ m.

  - estilo: Unesp
    enunciado: |
      A distância, em linha reta, do topo do farol até o barco é de, aproximadamente,
    opcoes: ['$111$ m', '$40$ m', '$85$ m', '$118$ m', '$136$ m']
    correta: D
    resolucao: |
      Hipotenusa: $\operatorname{sen}20^\circ = \frac{40}{x}$, $x = \frac{40}{0{,}34} \approx 118$ m.

  - estilo: Fuvest
    enunciado: |
      No triângulo ABC, retângulo em C, vale $\operatorname{sen}\hat{A} = 2 \operatorname{sen}\hat{B}$. Então $\operatorname{tg}\hat{A}$ é igual a
    opcoes: ['$\frac{1}{2}$', '$\sqrt{3}$', '$\sqrt{5}$', '$\frac{2}{\sqrt5}$', '$2$']
    correta: E
    resolucao: |
      $\hat{A}$ e $\hat{B}$ são complementares: $\operatorname{sen}\hat{B} = \cos\hat{A}$. Logo $\operatorname{sen}\hat{A} = 2\cos\hat{A}$ e $\operatorname{tg}\hat{A} = 2$.

  - estilo: Unesp
    texto: |
      A figura mostra um retângulo de lados 30 cm e 16 cm e uma de suas diagonais, que forma o ângulo $\theta$ com o lado maior.
    figura:
      tikz: |
        \begin{scope}[scale=.6]
        \draw[ink, line width=.9pt] (0,0) rectangle (6,3.2);
        \draw[roxo, line width=.9pt] (0,0) -- (6,3.2);
        \node[below, font=\small] at (3,0) {$30$ cm};
        \node[right, font=\small] at (6,1.6) {$16$ cm};
        \draw[roxo] (1.1,0) arc (0:28:1.1); \node[roxo, font=\small] at (1.6,.32) {$\theta$};
        \end{scope}
    enunciado: |
      O valor de $\operatorname{sen}\theta$ é
    opcoes: ['$\frac{8}{15}$', '$\frac{8}{17}$', '$\frac{15}{17}$', '$\frac{17}{8}$', '$\frac{15}{8}$']
    correta: B
    resolucao: |
      Diagonal: $\sqrt{900 + 256} = 34$. $\operatorname{sen}\theta = \frac{16}{34} = \frac{8}{17}$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'De um ponto A no chão, o topo de um prédio é visto sob um ângulo $\alpha$ com $\operatorname{tg}\alpha = 0{,}5$. Andando 20 m em direção ao prédio, até o ponto B, o ângulo passa a ser $\beta$, com $\operatorname{tg}\beta = 0{,}75$.'
    itens:
    - 'Sendo $h$ a altura do prédio e $d$ a distância de B até a base, escreva $h$ em função de $d$ de dois modos.'
    - 'Calcule $d$ e $h$.'
    - 'Calcule a distância de A até o topo do prédio.'
    espaco: 62
    resolucao: |
      a) $h = 0{,}75\,d$ e $h = 0{,}5\,(d + 20)$.
      b) $0{,}75\,d = 0{,}5\,d + 10$: $d = 40$ m e $h = 30$ m.
      c) $\sqrt{60^2 + 30^2} = 30\sqrt{5} \approx 67$ m.
    resposta: 'b) $d = 40$ m, $h = 30$ m; c) $30\sqrt5$ m'

  - estilo: Unicamp
    enunciado: 'Uma norma de acessibilidade limita a inclinação das rampas a $\operatorname{tg}\alpha = \frac{1}{12}$ (cerca de 8,33\%).'
    itens:
    - 'Qual o menor comprimento horizontal de uma rampa que vence um desnível de 0,9 m?'
    - 'Com essa inclinação máxima, calcule $\operatorname{sen}\alpha$.'
    - 'Calcule o comprimento da rampa (a hipotenusa) no item a).'
    espaco: 62
    resolucao: |
      a) $\frac{0{,}9}{x} = \frac{1}{12}$: $x = 10{,}8$ m.
      b) Catetos 1 e 12, hipotenusa $\sqrt{145}$: $\operatorname{sen}\alpha = \frac{1}{\sqrt{145}} = \frac{\sqrt{145}}{145}$.
      c) $\sqrt{10{,}8^2 + 0{,}9^2} = 0{,}9\sqrt{145} \approx 10{,}84$ m.
    resposta: 'a) 10,8 m; c) $\approx 10{,}84$ m'

  - estilo: ITA
    enunciado: |
      Se $\alpha$ é um ângulo agudo com $\operatorname{sen}\alpha + \cos\alpha = \frac{7}{5}$, então $\operatorname{sen}\alpha \cdot \cos\alpha$ vale
    opcoes: ['$\frac{12}{25}$', '$\frac{24}{25}$', '$\frac{7}{10}$', '$\frac{1}{2}$', '$\frac{6}{25}$']
    correta: A
    espaco: 22
    resolucao: |
      $(\operatorname{sen}\alpha + \cos\alpha)^2 = 1 + 2\operatorname{sen}\alpha\cos\alpha = \frac{49}{25}$, logo $\operatorname{sen}\alpha\cos\alpha = \frac{12}{25}$.
    resposta: 'A'

  - estilo: Unesp
    enunciado: 'O triângulo ABC é retângulo em A, com $AB = 20$, $AC = 21$ e $BC = 29$. AH é a altura relativa à hipotenusa.'
    itens:
    - 'Escreva $\operatorname{sen}\hat{B}$ usando o triângulo ABC e usando o triângulo ABH.'
    - 'Calcule AH.'
    - 'Calcule BH usando $\cos\hat{B}$.'
    espaco: 62
    resolucao: |
      a) $\operatorname{sen}\hat{B} = \frac{AC}{BC} = \frac{21}{29}$ e, em ABH (retângulo em H), $\operatorname{sen}\hat{B} = \frac{AH}{AB}$.
      b) $AH = 20 \cdot \frac{21}{29} = \frac{420}{29}$.
      c) $\cos\hat{B} = \frac{20}{29}$ e $BH = AB\cos\hat{B} = \frac{400}{29}$.
    resposta: 'b) $\frac{420}{29}$; c) $\frac{400}{29}$'

  - estilo: UFSC
    enunciado: |
      Um triângulo retângulo tem hipotenusa 10 e um ângulo agudo de $35^\circ$. Use $\operatorname{sen}35^\circ \approx 0{,}57$, $\cos 35^\circ \approx 0{,}82$ e $\operatorname{tg}35^\circ \approx 0{,}70$. Assinale o que for correto.
    proposicoes:
    - 'O cateto oposto ao ângulo de $35^\circ$ mede cerca de 5,7.'
    - 'O cateto adjacente ao ângulo de $35^\circ$ mede cerca de 8,2.'
    - 'A área do triângulo é cerca de 23,4.'
    - 'O outro ângulo agudo mede $55^\circ$ e $\operatorname{sen}55^\circ \approx 0{,}82$.'
    - '$\operatorname{tg}55^\circ \approx 0{,}70$.'
    - 'O perímetro do triângulo é cerca de 23,9.'
    corretas: [1, 2, 3, 4, 6]
    espaco: 22
    resolucao: |
      01) $10 \cdot 0{,}57$. 02) $10 \cdot 0{,}82$. 04) $\frac{5{,}7 \cdot 8{,}2}{2} \approx 23{,}4$. 08) Complementar. 16) Incorreta: $\operatorname{tg}55^\circ = \frac{8{,}2}{5{,}7} \approx 1{,}43$. 32) $5{,}7 + 8{,}2 + 10$.
    resposta: 'Soma 47 (01 + 02 + 04 + 08 + 32)'

  - estilo: Fuvest
    enunciado: 'Seja $\alpha$ um ângulo agudo de um triângulo retângulo.'
    itens:
    - 'Prove que $\operatorname{sen}\alpha + \cos\alpha > 1$.'
    - 'Prove que $(\operatorname{sen}\alpha + \cos\alpha)^2 = 1 + 2\operatorname{sen}\alpha\cos\alpha$.'
    - 'Se $\operatorname{sen}\alpha\cos\alpha = \frac{120}{289}$, calcule $\operatorname{sen}\alpha + \cos\alpha$ e os dois valores possíveis de $\operatorname{sen}\alpha$.'
    espaco: 62
    resolucao: |
      a) Com catetos $b$, $c$ e hipotenusa $a$: $\frac{b + c}{a} > 1$, pela desigualdade triangular ($b + c > a$).
      b) Desenvolvendo e usando $\operatorname{sen}^2\alpha + \cos^2\alpha = 1$.
      c) $(\operatorname{sen}\alpha + \cos\alpha)^2 = 1 + \frac{240}{289} = \frac{529}{289}$: soma $\frac{23}{17}$. Soma $\frac{23}{17}$ e produto $\frac{120}{289}$: $\frac{8}{17}$ e $\frac{15}{17}$; $\operatorname{sen}\alpha$ é um deles.
    resposta: 'c) $\frac{23}{17}$; $\frac{8}{17}$ ou $\frac{15}{17}$'

  - estilo: Unicamp
    enunciado: 'Uma escada rolante de 15 m de comprimento liga dois pisos de um shopping, separados por 6 m de altura.'
    itens:
    - 'Calcule o seno do ângulo $\alpha$ que a escada faz com o piso.'
    - 'Calcule a projeção horizontal da escada.'
    - 'Calcule $\operatorname{tg}\alpha$, na forma exata.'
    espaco: 62
    resolucao: |
      a) $\operatorname{sen}\alpha = \frac{6}{15} = 0{,}4$.
      b) $\sqrt{225 - 36} = \sqrt{189} = 3\sqrt{21} \approx 13{,}7$ m.
      c) $\frac{6}{3\sqrt{21}} = \frac{2}{\sqrt{21}} = \frac{2\sqrt{21}}{21}$.
    resposta: 'a) 0,4; b) $3\sqrt{21}$ m; c) $\frac{2\sqrt{21}}{21}$'

  - estilo: Fuvest
    enunciado: |
      ABCD é um quadrado e M é o ponto médio do lado BC. Sendo $\alpha$ o ângulo $M\hat{A}B$, o valor de $\cos\alpha$ é
    opcoes: ['$\frac{\sqrt5}{5}$', '$\frac{2\sqrt5}{5}$', '$\frac{1}{2}$', '$2$', '$\frac{\sqrt5}{2}$']
    correta: B
    espaco: 22
    resolucao: |
      Com lado 2: $AB = 2$, $BM = 1$, $AM = \sqrt{5}$. $\cos\alpha = \frac{2}{\sqrt5} = \frac{2\sqrt5}{5}$.
    resposta: 'B'

  - estilo: Unesp
    enunciado: 'Um topógrafo está no ponto A de uma margem retilínea, em frente a uma árvore T da outra margem. Andando 30 m pela margem até B, ele vê a árvore com $\operatorname{tg}(A\hat{B}T) = 2{,}5$.'
    itens:
    - 'Calcule a largura do rio.'
    - 'Andando mais 30 m, até C, qual será $\operatorname{tg}(A\hat{C}T)$?'
    - 'Calcule a distância de B até a árvore.'
    espaco: 62
    resolucao: |
      a) $AT = 30 \cdot 2{,}5 = 75$ m.
      b) $\frac{75}{60} = 1{,}25$.
      c) $\sqrt{30^2 + 75^2} = \sqrt{6525} = 15\sqrt{29} \approx 80{,}8$ m.
    resposta: 'a) 75 m; b) 1,25; c) $15\sqrt{29}$ m'

  - estilo: Fuvest
    enunciado: 'Num triângulo de lados $a$ e $b$, o ângulo entre eles, $C$, é agudo.'
    itens:
    - 'Traçando a altura relativa ao lado $a$, prove que ela mede $b\operatorname{sen}C$.'
    - 'Conclua que a área do triângulo é $\frac{1}{2}ab\operatorname{sen}C$.'
    - 'Calcule a área para $a = 8$, $b = 5$ e $\operatorname{sen}C = 0{,}6$.'
    espaco: 62
    resolucao: |
      a) A altura forma, com o lado $b$, um triângulo retângulo de hipotenusa $b$ em que a altura é o cateto oposto a $C$: $h = b\operatorname{sen}C$.
      b) Área $= \frac{a \cdot h}{2} = \frac{1}{2}ab\operatorname{sen}C$.
      c) $\frac{1}{2} \cdot 8 \cdot 5 \cdot 0{,}6 = 12$.
    resposta: 'c) 12'
