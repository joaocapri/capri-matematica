padrao: 3
fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. O gabarito resolvido está no final.
  secoes:
    - nome: Fácil
      questoes:
        - enunciado: 'Calcule $18-6:2+4\cdot3$ completando os passos. Primeiro multiplicações e divisões, depois somas e subtrações.'
          itens:
            - '$6:2={{3}}$'
            - '$4\cdot3={{12}}$'
            - '$18-3+12={{27}}$'
          resolucao: |
            $6:2=3$ e $4\cdot3=12$. Depois, da esquerda para a direita: $18-3+12=27$.
          resposta: '$27$'
        - enunciado: 'Calcule.'
          itens: ['$20-4\cdot3$', '$36:4\cdot3$', '$7+8:2-1$', '$50-2\cdot(3+7)$']
          colunas: 2
          espaco_item: 12
          resolucao: |
            (a) $20-12=8$. (b) Divisão e multiplicação na ordem em que aparecem: $9\cdot3=27$.
            (c) $7+4-1=10$. (d) Parênteses primeiro: $50-2\cdot10=30$.
          resposta: '(a) $8$ (b) $27$ (c) $10$ (d) $30$'
        - enunciado: 'Marque V (verdadeiro) ou F (falso).'
          afirmacoes:
            - 'Em $10-3+2$, faz-se primeiro a subtração, e o resultado é $9$.'
            - '$24:4\cdot2=3$.'
            - 'A multiplicação deve ser feita sempre antes da divisão.'
            - '$5+3\cdot2=16$.'
            - '$(5+3)\cdot2=16$.'
          justificar: true
          espaco: 16
          resolucao: |
            (V) Somas e subtrações seguem da esquerda para a direita: $7+2=9$.
            (F) $24:4=6$ e $6\cdot2=12$. (F) Multiplicação e divisão têm a mesma prioridade: faz-se a que aparece primeiro.
            (F) $5+6=11$. (V) $8\cdot2=16$.
          resposta: 'V, F, F, F, V'
        - enunciado: 'Associe cada expressão ao seu valor.'
          esquerda: ['$12$', '$20$', '$6$']
          direita: ['$4\cdot(2+3)$', '$4\cdot2+4$', '$30:5$', '$(8+4):2$', '$3+3\cdot3$', '$2\cdot(4+6)$']
          resolucao: |
            $4\cdot5=20$; $8+4=12$; $30:5=6$; $12:2=6$; $3+9=12$; $2\cdot10=20$.
          resposta: 'De cima para baixo: $2,\ 1,\ 3,\ 3,\ 1,\ 2$'
        - enunciado: 'Coloque um par de parênteses em cada expressão para que a igualdade fique verdadeira.'
          itens: ['$2+3\cdot4=20$', '$24:4+2=4$', '$10-4-2=8$', '$3\cdot5-2+1=12$']
          colunas: 2
          espaco_item: 10
          resolucao: |
            (a) $(2+3)\cdot4=20$. (b) $24:(4+2)=4$. (c) $10-(4-2)=8$. (d) $3\cdot(5-2+1)=12$.
          resposta: '(a) $(2+3)\cdot4$ (b) $24:(4+2)$ (c) $10-(4-2)$ (d) $3\cdot(5-2+1)$'
        - enunciado: 'Calcule $\{10+[3\cdot(8-5)-4]\}:3$, de dentro para fora.'
          resolucao: |
            Parênteses: $8-5=3$. Colchetes: $3\cdot3-4=5$. Chaves: $10+5=15$. Por fim, $15:3=5$.
          resposta: '$5$'
        - enunciado: 'Lucas comprou $3$ cadernos de R\$\,12,00 e $2$ canetas de R\$\,4,00 e pagou com uma nota de R\$\,50,00. Escreva uma única expressão que dá o troco e calcule.'
          espaco: 22
          resolucao: |
            Gasto: $3\cdot12+2\cdot4=36+8=44$. Troco: $50-(3\cdot12+2\cdot4)=50-44=6$.
          resposta: '$50-(3\cdot12+2\cdot4)=6$ reais'
    - nome: Médio
      questoes:
        - enunciado: 'Complete a tabela com o valor de cada expressão.'
          tabela:
            cabecalho: ['Expressão', 'Valor']
            linhas:
              - ['$2\cdot[15-(4+3)]$', '{{16}}']
              - ['$40:[2\cdot(9-4)]$', '{{4}}']
              - ['$\{3+[12:(5-2)]\}\cdot2$', '{{14}}']
              - ['$100-\{20+[6\cdot(7-2)]\}$', '{{50}}']
          resolucao: |
            $2\cdot[15-7]=16$; $40:[2\cdot5]=40:10=4$; $\{3+[12:3]\}\cdot2=7\cdot2=14$; $100-\{20+30\}=50$.
          resposta: '$16$; $\ 4$; $\ 14$; $\ 50$'
        - texto: |
            Júlia calculou assim: $48:2\cdot(3+1)=48:8=6$.
          enunciado: 'Encontre o erro de Júlia e calcule corretamente.'
          espaco: 20
          resolucao: |
            Depois dos parênteses fica $48:2\cdot4$. Divisão e multiplicação têm a mesma prioridade e são feitas da esquerda para a direita: $48:2=24$ e $24\cdot4=96$.
            Júlia multiplicou antes de dividir.
          resposta: 'O resultado é $96$'
        - enunciado: 'Calcule $-3\cdot[-2+(-4):2]-(-5)$.'
          resolucao: |
            $(-4):2=-2$. Colchetes: $-2+(-2)=-4$. Depois: $-3\cdot(-4)=12$ e $12-(-5)=17$.
          resposta: '$17$'
        - enunciado: 'Um cinema tem $12$ fileiras com $15$ lugares cada. Numa sessão, $4$ fileiras ficaram vazias e, nas outras, sobraram $3$ lugares em cada fileira. Escreva uma expressão para o número de espectadores e calcule.'
          espaco: 22
          resolucao: |
            Fileiras ocupadas: $12-4=8$. Pessoas por fileira: $15-3=12$. Total: $(12-4)\cdot(15-3)=8\cdot12=96$.
          resposta: '$(12-4)\cdot(15-3)=96$ espectadores'
        - enunciado: 'Calcule.'
          itens: ['$7-[4-(2-9)]$', '$\{-6+[5\cdot(-2)+4]\}:(-4)$']
          colunas: 2
          espaco_item: 18
          resolucao: |
            (a) $2-9=-7$; $4-(-7)=11$; $7-11=-4$.
            (b) $5\cdot(-2)+4=-6$; $-6+(-6)=-12$; $-12:(-4)=3$.
          resposta: '(a) $-4$ (b) $3$'
        - enunciado: 'Usando os números $2$, $3$, $4$ e $6$, cada um uma única vez, e as operações que quiser (com parênteses), escreva uma expressão que valha $24$.'
          espaco: 16
          resolucao: |
            Há várias respostas. Exemplos: $(3-2)\cdot4\cdot6=24$ e $(6-3)\cdot4\cdot2=24$.
            Confira se a sua usa cada número exatamente uma vez.
          resposta: 'Exemplo: $(3-2)\cdot4\cdot6=24$'
        - enunciado: 'Mariana tinha R\$\,80,00, gastou metade num livro e depois R\$\,12,00 num lanche. Quais expressões calculam quanto sobrou? Justifique e dê o valor.'
          itens: ['$80:2-12$', '$(80-12):2$', '$80-80:2-12$']
          resolucao: |
            (a) Sobra metade, $40$, menos $12$: $28$. Serve.
            (b) Tira o lanche antes de dividir: $68:2=34$. Não serve, pois a ordem dos gastos foi outra.
            (c) $80-40-12=28$. Serve.
          resposta: '(a) e (c); sobraram R\$\,28,00'
        - enunciado: 'Calcule $2\cdot\{-3+[8-2\cdot(-1)]\}$.'
          resolucao: |
            $2\cdot(-1)=-2$; $8-(-2)=10$; $-3+10=7$; $2\cdot7=14$.
          resposta: '$14$'
    - nome: Difícil
      questoes:
        - enunciado: 'Coloque um único par de parênteses na expressão $2+3\cdot4-1\cdot5$ de modo a obter o maior resultado possível. Qual é esse resultado?'
          espaco: 24
          resolucao: |
            Testando: $(2+3)\cdot4-1\cdot5=15$; $\ 2+3\cdot(4-1)\cdot5=47$; $\ 2+(3\cdot4-1)\cdot5=57$; $\ (2+3\cdot4-1)\cdot5=13\cdot5=65$.
            O maior é $65$.
          resposta: '$(2+3\cdot4-1)\cdot5=65$'
        - enunciado: 'Pensei num número, multipliquei por $4$, somei $6$, dividi o resultado por $2$ e, por fim, subtraí o número que pensei. Deu $8$. Em que número pensei?'
          espaco: 24
          resolucao: |
            Com o número $x$: $(4x+6):2-x=2x+3-x=x+3$. Se $x+3=8$, então $x=5$.
            Conferindo: $5\cdot4=20$, $26$, $13$, $13-5=8$.
          resposta: '$5$'
        - enunciado: 'Calcule $1000-\{100-[10-(1-0)]\}$.'
          resolucao: |
            $1-0=1$; $10-1=9$; $100-9=91$; $1000-91=909$.
          resposta: '$909$'
        - enunciado: 'Calcule $[(2+4)\cdot(9-5)]:[(15-3\cdot3)+2]$.'
          resolucao: |
            Numerador: $6\cdot4=24$. Denominador: $15-9+2=8$. Resultado: $24:8=3$.
          resposta: '$3$'
        - enunciado: 'Uma escola comprou $6$ caixas com $24$ lápis e $4$ caixas com $36$ lápis e dividiu todos igualmente entre $9$ turmas. Escreva uma expressão e calcule quantos lápis cada turma recebeu.'
          espaco: 24
          resolucao: |
            $(6\cdot24+4\cdot36):9=(144+144):9=288:9=32$.
          resposta: '$32$ lápis por turma'
vestibular:
  intro: Questões autorais no estilo dos vestibulares e do Enem, das diretas às com mais leitura. Nas objetivas, assinale uma alternativa. Nas somatórias, some os números das proposições corretas.
  questoes:
    - enunciado: 'O valor da expressão $18-6:3+2\cdot5$ é'
      opcoes: ['$14$', '$20$', '$24$', '$26$', '$30$']
      correta: D
      resolucao: |
        $6:3=2$ e $2\cdot5=10$. Então $18-2+10=26$.
    - enunciado: 'O valor de $\{20-[8+(6-2)\cdot2]\}:2$ é'
      opcoes: ['$2$', '$4$', '$6$', '$8$', '$10$']
      correta: A
      resolucao: |
        $(6-2)\cdot2=8$; $8+8=16$; $20-16=4$; $4:2=2$.
    - texto: |
        Uma família foi ao cinema: dois adultos pagaram inteira, de R\$\,30,00, e três estudantes pagaram meia-entrada. Na saída, compraram um combo de pipoca de R\$\,28,00. O pai pagou tudo com duas notas de R\$\,100,00.
      enunciado: 'O troco recebido foi de'
      opcoes: ['R\$\,47,00', 'R\$\,52,00', 'R\$\,57,00', 'R\$\,62,00', 'R\$\,67,00']
      correta: E
      resolucao: |
        Gasto: $2\cdot30+3\cdot15+28=60+45+28=133$. Troco: $200-133=67$.
    - enunciado: 'A expressão $48:4\cdot2-6$ vale'
      opcoes: ['$0$', '$6$', '$18$', '$24$', '$30$']
      correta: C
      resolucao: |
        Divisão e multiplicação da esquerda para a direita: $48:4=12$, $12\cdot2=24$, $24-6=18$.
    - enunciado: 'Assinale o que for correto.'
      proposicoes:
      - '$5+3\cdot2=11$.'
      - '$20:5\cdot2=2$.'
      - '$(8-3)\cdot(2+1)=15$.'
      - '$7-(3-5)=5$.'
      - '$3\cdot[2+(4-1)]=15$.'
      corretas: [1, 3, 5]
      resolucao: |
        01: $5+6=11$. 02 errada: $4\cdot2=8$. 04: $5\cdot3=15$. 08 errada: $7-(-2)=9$. 16: $3\cdot5=15$.
        Soma: $01+04+16=21$.
    - texto: |
        Uma lanchonete de escola usa a tabela de preços abaixo. Um grupo de amigos pediu $3$ pastéis, $2$ sucos e $1$ açaí e usou um cupom de R\$\,10,00 de desconto no total.
      tabela:
        cabecalho: ['Produto', 'Preço (R\$)']
        linhas:
          - ['Suco', '$7$']
          - ['Pastel', '$9$']
          - ['Açaí', '$15$']
      enunciado: 'O grupo pagou'
      opcoes: ['R\$\,46,00', 'R\$\,51,00', 'R\$\,56,00', 'R\$\,61,00', 'R\$\,66,00']
      correta: A
      resolucao: |
        $3\cdot9+2\cdot7+15-10=27+14+15-10=46$.
    - texto: |
        Calculadoras simples fazem as operações na ordem em que são digitadas; as científicas respeitam a prioridade da multiplicação. Ana digitou a sequência $5+3\times4=$ em uma calculadora simples, e Beto digitou a mesma sequência em uma científica.
      enunciado: 'A diferença entre o resultado de Ana e o de Beto é'
      opcoes: ['$0$', '$12$', '$15$', '$17$', '$32$']
      correta: C
      resolucao: |
        Simples: $5+3=8$ e $8\cdot4=32$. Científica: $5+12=17$. Diferença: $32-17=15$.
    - enunciado: 'O valor de $2\cdot[3-(-4):2]-5$ é'
      opcoes: ['$-5$', '$-1$', '$1$', '$5$', '$15$']
      correta: D
      resolucao: |
        $(-4):2=-2$; $3-(-2)=5$; $2\cdot5=10$; $10-5=5$.
    - texto: |
        Paulo trabalha $6$ horas por dia, $5$ dias por semana, e recebe R\$\,25,00 por hora. Toda semana, ele gasta R\$\,180,00 com transporte e R\$\,120,00 com alimentação.
      enunciado: 'Assinale o que for correto.'
      proposicoes:
      - 'Paulo recebe R\$\,750,00 por semana.'
      - 'Depois desses gastos, sobram R\$\,450,00 por semana.'
      - 'Em $4$ semanas, sobram R\$\,1\,800,00.'
      - 'Se trabalhasse $8$ horas por dia, receberia R\$\,1\,000,00 por semana.'
      - 'A expressão $6\cdot5\cdot25-180+120$ representa quanto sobra por semana.'
      corretas: [1, 2, 3, 4]
      resolucao: |
        01: $6\cdot5\cdot25=750$. 02: $750-(180+120)=450$. 04: $4\cdot450=1\,800$. 08: $8\cdot5\cdot25=1\,000$.
        16 errada: a alimentação também é gasto; o certo é $6\cdot5\cdot25-180-120$. Soma: $01+02+04+08=15$.
    - texto: |
        Um estacionamento cobra R\$\,12,00 pela primeira hora e R\$\,5,00 por hora adicional, sendo que qualquer fração de hora adicional é cobrada como hora inteira. Um carro entrou às 13 h 10 min e saiu às 17 h 30 min.
      enunciado: 'O valor cobrado foi'
      opcoes: ['R\$\,22,00', 'R\$\,27,00', 'R\$\,30,00', 'R\$\,32,00', 'R\$\,37,00']
      correta: D
      resolucao: |
        Permanência: $4$ h $20$ min. Depois da primeira hora, restam $3$ h $20$ min, cobradas como $4$ horas.
        Total: $12+4\cdot5=32$.
    - enunciado: 'Qual das expressões abaixo vale $24$?'
      opcoes: ['$2+2\cdot6$', '$(2+2)\cdot6$', '$2\cdot2+6\cdot2$', '$24:2\cdot6$', '$2+(2\cdot6)$']
      correta: B
      resolucao: |
        $4\cdot6=24$. As outras valem $14$, $16$, $72$ e $14$.
    - texto: |
        Em uma aula, o professor desenhou uma “máquina” de operações: o número que entra passa pelas três etapas, na ordem indicada pelas setas.
      figura:
        tikz: |
          \tikzset{caixa/.style={draw=roxo,line width=.7pt,rounded corners=3pt,minimum width=11mm,minimum height=7mm,font=\small}}
          \node[font=\small] (e) at (0,0) {$18$};
          \node[caixa] (a) at (1.6,0) {$\times\,3$};
          \node[caixa] (b) at (3.2,0) {$-\,4$};
          \node[caixa] (c) at (4.8,0) {$:\,5$};
          \node[font=\small] (s) at (6.3,0) {?};
          \draw[-latex,ink!70] (e) -- (a); \draw[-latex,ink!70] (a) -- (b); \draw[-latex,ink!70] (b) -- (c); \draw[-latex,ink!70] (c) -- (s);
      enunciado: 'Se entrar o número $18$, sairá o número'
      opcoes: ['$6$', '$7$', '$8$', '$9$', '$10$']
      correta: E
      resolucao: |
        $18\cdot3=54$; $54-4=50$; $50:5=10$.
    - texto: |
        Uma conta de energia é calculada assim: uma taxa fixa de R\$\,15,00, mais R\$\,0,80 por kWh consumido, mais um adicional de bandeira tarifária de R\$\,6,00 a cada $100$ kWh. Uma residência consumiu $150$ kWh no mês.
      enunciado: 'O valor da conta foi de'
      opcoes: ['R\$\,129,00', 'R\$\,135,00', 'R\$\,138,00', 'R\$\,141,00', 'R\$\,144,00']
      correta: E
      resolucao: |
        $15+150\cdot0{,}80+1{,}5\cdot6=15+120+9=144$.
    - enunciado: 'Considere $A=3+4\cdot(5-2)$ e $B=(3+4)\cdot5-2$. Assinale o que for correto.'
      proposicoes:
      - '$A=15$.'
      - '$B=33$.'
      - '$A+B=48$.'
      - '$2\cdot A=21$.'
      - '$B:3=11$.'
      - '$A>B$.'
      corretas: [1, 2, 3, 5]
      resolucao: |
        $A=3+12=15$ e $B=35-2=33$. 04: $48$. 08 errada: $30$. 16: $11$. 32 errada: $15<33$.
        Soma: $01+02+04+16=23$.
    - texto: |
        Dona Rosa faz $4$ bolos por dia para vender por fatia. Cada bolo rende $12$ fatias, vendidas a R\$\,6,00 cada, e custa R\$\,30,00 para ser produzido. Ela vende todas as fatias todos os dias.
      enunciado: 'Em $5$ dias de trabalho, o lucro de Dona Rosa é de'
      opcoes: ['R\$\,720,00', 'R\$\,840,00', 'R\$\,960,00', 'R\$\,1\,080,00', 'R\$\,1\,440,00']
      correta: B
      resolucao: |
        Por dia: $4\cdot12\cdot6-4\cdot30=288-120=168$. Em $5$ dias: $5\cdot168=840$.
    - texto: |
        Uma operadora oferece dois planos de celular. Uma cliente usa, em média, $180$ minutos de ligação por mês.
      tabela:
        cabecalho: ['Plano', 'Como é cobrado']
        linhas:
          - ['A', 'R\$\,40,00 fixos, com $100$ minutos; cada minuto a mais custa R\$\,0,50']
          - ['B', 'R\$\,70,00 fixos, com minutos ilimitados']
      enunciado: 'Para essa cliente,'
      opcoes: ['o plano B é mais barato, com diferença de R\$\,10,00', 'o plano A é mais barato, com diferença de R\$\,10,00', 'o plano A é mais barato, com diferença de R\$\,30,00', 'o plano B é mais barato, com diferença de R\$\,30,00', 'os dois planos custam o mesmo']
      correta: A
      resolucao: |
        Plano A: $40+(180-100)\cdot0{,}50=40+40=80$. Plano B: $70$. O B é mais barato, por R\$\,10,00.
    - enunciado: 'O valor de $1-\{2-[3-(4-5)]\}$ é'
      opcoes: ['$-3$', '$-1$', '$1$', '$3$', '$5$']
      correta: D
      resolucao: |
        $4-5=-1$; $3-(-1)=4$; $2-4=-2$; $1-(-2)=3$.
    - texto: |
        Uma escola vai levar todos os alunos de $3$ turmas de $32$ alunos e de $2$ turmas de $26$ alunos a uma feira de ciências. Cada ônibus tem $44$ lugares, só podem ser contratados ônibus inteiros e cada um custa R\$\,888,00. O custo total será dividido igualmente entre os alunos.
      enunciado: 'Assinale o que for correto.'
      proposicoes:
      - 'Vão à feira $148$ alunos.'
      - 'Bastam $3$ ônibus.'
      - 'O custo total dos ônibus é R\$\,3\,552,00.'
      - 'Cada aluno pagará R\$\,24,00.'
      - 'Sobrarão $28$ lugares vazios.'
      corretas: [1, 3, 4, 5]
      resolucao: |
        01: $3\cdot32+2\cdot26=96+52=148$. 02 errada: $3\cdot44=132<148$; são necessários $4$ ônibus.
        04: $4\cdot888=3\,552$. 08: $3\,552:148=24$. 16: $4\cdot44-148=28$. Soma: $01+04+08+16=29$.
    - enunciado: 'Se $a=2$ e $b=-3$, o valor de $a\cdot(b-a)-(a-b):5$ é'
      opcoes: ['$-13$', '$-11$', '$-9$', '$-1$', '$9$']
      correta: B
      resolucao: |
        $b-a=-5$ e $a\cdot(b-a)=-10$. $a-b=5$ e $5:5=1$. Resultado: $-10-1=-11$.
    - texto: |
        A fatura do cartão de crédito de Marcos traz compras de R\$\,250,00, R\$\,180,00 e R\$\,70,00. Também traz o saldo de R\$\,120,00 que ele deixou de pagar no mês anterior, com R\$\,18,00 de juros, e um estorno (devolução) de R\$\,45,00 de uma compra cancelada.
      enunciado: 'O valor total dessa fatura é'
      opcoes: ['R\$\,548,00', 'R\$\,563,00', 'R\$\,593,00', 'R\$\,638,00', 'R\$\,683,00']
      correta: C
      resolucao: |
        $250+180+70+120+18-45=593$. O estorno é descontado.
aprofundamento:
  intro: Questões mais puxadas, no estilo das segundas fases e das olimpíadas. Escreva o raciocínio, não só a resposta.
  questoes:
    - enunciado: 'Coloque quantos pares de parênteses quiser na expressão $1+2\cdot3+4\cdot5$ para obter o maior resultado possível. Qual é esse resultado?'
      resolucao: |
        Somar antes de multiplicar aumenta o resultado. Testando: $(1+2)\cdot(3+4)\cdot5=3\cdot7\cdot5=105$; $\ ((1+2)\cdot3+4)\cdot5=65$; $\ 1+2\cdot(3+4)\cdot5=71$; $\ (1+2\cdot3+4)\cdot5=55$.
        O maior é $105$.
      resposta: '$(1+2)\cdot(3+4)\cdot5=105$'
    - enunciado: 'Usando exatamente quatro algarismos $4$, as quatro operações e parênteses, escreva expressões que valham $0$, $1$, $2$, $3$, $4$ e $5$.'
      espaco: 40
      resolucao: |
        Exemplos: $0=44-44$; $\ 1=44:44$; $\ 2=4:4+4:4$; $\ 3=(4+4+4):4$; $\ 4=4+(4-4)\cdot4$; $\ 5=(4\cdot4+4):4$. Há outras respostas.
      resposta: 'Exemplo: $44-44$, $44:44$, $4:4+4:4$, $(4+4+4):4$, $4+(4-4)\cdot4$, $(4\cdot4+4):4$'
    - enunciado: 'Calcule $2026\cdot2025-2025\cdot2024$ sem fazer as multiplicações.'
      resolucao: |
        Coloque $2025$ em evidência: $2025\cdot(2026-2024)=2025\cdot2=4050$.
      resposta: '$4050$'
    - enunciado: 'Calcule $(2+4+6+\dots+100)-(1+3+5+\dots+99)$.'
      resolucao: |
        Há $50$ pares e $50$ ímpares. Emparelhe: $(2-1)+(4-3)+\dots+(100-99)$, $50$ parcelas iguais a $1$.
        O resultado é $50$.
      resposta: '$50$'
    - enunciado: 'Descubra $x$ “desfazendo” as operações: $3\cdot[2\cdot(x-4)+5]-7=26$.'
      resolucao: |
        Somando $7$: $3\cdot[\dots]=33$, logo $[\dots]=11$. Tirando $5$: $2\cdot(x-4)=6$, logo $x-4=3$ e $x=7$.
      resposta: '$x=7$'
    - enunciado: 'Calcule $\{[(-2)\cdot3+10]:(-4)-3\}\cdot(-5)$.'
      resolucao: |
        $(-2)\cdot3+10=4$; $4:(-4)=-1$; $-1-3=-4$; $-4\cdot(-5)=20$.
      resposta: '$20$'
    - enunciado: 'Calcule de cabeça, usando a propriedade distributiva ou reagrupando fatores.'
      itens: ['$37\cdot99+37$', '$125\cdot32$']
      colunas: 2
      espaco_item: 20
      resolucao: |
        (a) $37\cdot99+37\cdot1=37\cdot100=3700$.
        (b) $125\cdot32=125\cdot8\cdot4=1000\cdot4=4000$.
      resposta: '(a) $3700$ (b) $4000$'
    - enunciado: 'Colocando no máximo um par de parênteses em $2\cdot3+4\cdot5$, quantos resultados diferentes é possível obter? Liste-os.'
      espaco: 34
      resolucao: |
        Sem parênteses (ou com parênteses que não mudam nada): $26$.
        $(2\cdot3+4)\cdot5=50$; $\ 2\cdot(3+4)\cdot5=70$; $\ 2\cdot(3+4\cdot5)=46$.
        São $4$ resultados: $26$, $46$, $50$ e $70$.
      resposta: '$4$ resultados: $26$, $46$, $50$ e $70$'
    - enunciado: 'A operação $\star$ é definida por $a\star b=2a-b$. Calcule $(3\star4)\star(1\star5)$.'
      resolucao: |
        $3\star4=6-4=2$ e $1\star5=2-5=-3$. Então $2\star(-3)=4-(-3)=7$.
      resposta: '$7$'
    - enunciado: '“Pense num número, some $5$, multiplique por $2$, subtraia $4$, divida por $2$ e subtraia o número que pensou.” Mostre que o resultado é sempre $3$.'
      espaco: 34
      resolucao: |
        Com o número $x$: $[(x+5)\cdot2-4]:2-x=(2x+6):2-x=x+3-x=3$.
        Não depende de $x$: sempre dá $3$.
      resposta: 'A expressão se reduz a $3$ para qualquer $x$'
