# Aula 4.10.1 — Geometria espacial: perpendicularidade e projeções
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: reta perpendicular a plano (critério das duas concorrentes); planos perpendiculares; projeção ortogonal de
# ponto, de segmento (ℓ·cos θ) e de figura plana (A·cos θ); distâncias (ponto–plano, planos paralelos, reversas no cubo,
# ponto–reta pelo teorema das três perpendiculares); ângulo entre reta e plano e entre planos; diagonais do cubo e do
# paralelepípedo. Convenção do cubo ABCDEFGH: base ABCD, com E, F, G, H acima de A, B, C, D.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. No cubo $ABCDEFGH$, a base é $ABCD$ e $E$, $F$, $G$, $H$ ficam acima de $A$, $B$, $C$, $D$. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Associe cada conceito à sua descrição.'
      esquerda:
      - 'projeção ortogonal de um ponto num plano'
      - 'distância de um ponto a um plano'
      - 'reta perpendicular a um plano'
      - 'ângulo entre uma reta e um plano'
      - 'distância entre dois planos paralelos'
      direita:
      - 'ângulo entre a reta e a sua projeção no plano'
      - 'medida do segmento perpendicular do ponto ao plano'
      - 'distância de um ponto qualquer de um deles ao outro'
      - 'pé da perpendicular traçada do ponto ao plano'
      - 'reta perpendicular a duas retas concorrentes do plano'
      resolucao: |
        A perpendicular é a ferramenta central: dá a projeção (o pé), a distância (a medida) e o critério para uma reta ser perpendicular a um plano.
      resposta: 'De cima para baixo: 4, 2, 5, 1, 3'
    - enunciado: 'Um segmento de comprimento $\ell$ forma o ângulo $\theta$ com um plano. Complete com o comprimento da sua projeção ortogonal, $\ell\cos\theta$.'
      tabela:
        cabecalho: ['$\ell$', '$\theta$', 'Projeção']
        linhas:
        - ['$10$', '$60°$', '${{5}}$']
        - ['$8$', '$30°$', '${{4\sqrt{3}}}$']
        - ['$6$', '$45°$', '${{3\sqrt{2}}}$']
        - ['$12$', '$90°$', '${{0}}$']
        - ['$7$', '$0°$', '${{7}}$']
      resolucao: |
        A projeção é o cateto adjacente a $\theta$ no triângulo retângulo formado pelo segmento, pela projeção e pela diferença de alturas.
      resposta: '5; $4\sqrt{3}$; $3\sqrt{2}$; 0; 7'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Uma reta perpendicular a uma única reta de um plano é perpendicular ao plano.'
      - 'Uma reta perpendicular a duas retas concorrentes de um plano é perpendicular ao plano.'
      - 'A projeção ortogonal de um segmento nunca é maior que o segmento.'
      - 'Dois planos perpendiculares a um terceiro são paralelos entre si.'
      justificar: true
      espaco: 20
      resolucao: |
        (F) No cubo, $AF \perp AD$, mas $AF$ é inclinada em relação à base. (V) É o critério de perpendicularidade. (V) $\ell\cos\theta \le \ell$. (F) As faces $ABFE$ e $ADHE$ são perpendiculares à base e se cortam.
      resposta: F, V, V, F
    - enunciado: 'Num cubo de aresta 6, complete.'
      itens:
      - 'Diagonal de uma face: {{6\sqrt{2}}}'
      - 'Diagonal do cubo: {{6\sqrt{3}}}'
      - 'Distância entre duas faces opostas: {{6}}'
      espaco_item: 8
      resolucao: |
        Face: $\sqrt{36 + 36}$. Cubo: a aresta vertical é perpendicular à diagonal da base, $\sqrt{72 + 36} = 6\sqrt{3}$. Faces opostas: a aresta.
      resposta: '$6\sqrt{2}$; $6\sqrt{3}$; 6'
    - enunciado: 'Na figura, $PO$ é perpendicular ao plano $\alpha$, com $PO = 8$, e o ponto $A$ do plano está a 6 de $O$. Calcule $PA$ e indique a projeção de $PA$ em $\alpha$.'
      figura:
        tikz: |
          \begin{scope}[scale=.8]
          \draw[ink, line width=1pt, fill=lilas!20] (0,0) -- (3.4,0) -- (4.2,1.2) -- (0.8,1.2) -- cycle;
          \coordinate (O) at (1.6,0.6);
          \coordinate (A) at (3.2,0.5);
          \coordinate (P) at (1.6,2.4);
          \draw[roxo, line width=1pt] (P) -- (O) (P) -- (A);
          \draw[ink, dashed] (O) -- (A);
          \fill[ink] (O) circle (1.3pt) (A) circle (1.3pt) (P) circle (1.3pt);
          \node[left, font=\scriptsize] at (O) {$O$};
          \node[below, font=\scriptsize] at (A) {$A$};
          \node[above, font=\scriptsize] at (P) {$P$};
          \node[font=\scriptsize] at (0.45,0.2) {$\alpha$};
          \end{scope}
      espaco: 8
      resolucao: |
        $PO$ é perpendicular a $OA$ (que está no plano): $PA = \sqrt{64 + 36} = 10$. A projeção de $PA$ é $OA$.
      resposta: '$PA = 10$; projeção $OA$'
    - enunciado: 'Os extremos de um segmento $AB$ de 13 cm estão, do mesmo lado de um plano, a 2 cm e 7 cm dele. Calcule o comprimento da projeção de $AB$ no plano.'
      espaco: 10
      resolucao: |
        A diferença das alturas é 5 cm: projeção $\sqrt{169 - 25} = 12$ cm.
      resposta: '12 cm'
    - enunciado: 'Num cubo, calcule a tangente do ângulo que a diagonal $AG$ forma com o plano da base.'
      espaco: 10
      resolucao: |
        A projeção de $AG$ na base é a diagonal $AC = a\sqrt{2}$, e $CG = a$ é perpendicular à base: $\operatorname{tg}\theta = \tfrac{a}{a\sqrt{2}} = \tfrac{\sqrt{2}}{2}$.
      resposta: '$\frac{\sqrt{2}}{2}$'
  - nome: Nível 2
    questoes:
    - texto: |
        Num cubo $ABCDEFGH$, Rafa disse: “$AF$ é perpendicular a $AD$, e $AD$ está na base; logo, $AF$ é perpendicular à base”.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 10
      resolucao: |
        Ser perpendicular a uma só reta do plano não basta. $AF$ também deveria ser perpendicular a outra reta concorrente da base, como $AB$, mas forma $45°$ com ela. $AF$ é inclinada; a perpendicular à base por $A$ é $AE$.
      resposta: 'Ver resolução'
    - enunciado: 'O ponto $P$ está a 4 do plano $\alpha$, e $O$ é a sua projeção. Uma reta $r$ de $\alpha$ está a 3 de $O$. Calcule a distância de $P$ a $r$.'
      espaco: 12
      resolucao: |
        Seja $M$ o pé da perpendicular de $O$ a $r$. Pelo teorema das três perpendiculares, $PM \perp r$: a distância é $PM = \sqrt{16 + 9} = 5$.
      resposta: '5'
    - enunciado: 'Num cubo de aresta 5, calcule a distância entre as retas reversas $AB$ e $CG$.'
      espaco: 10
      resolucao: |
        A aresta $BC$ é perpendicular a $AB$ e a $CG$ e corta as duas: é a perpendicular comum. Distância 5.
      resposta: '5'
    - enunciado: 'Um triângulo de área 20 está num plano que forma $60°$ com o plano horizontal. Calcule a área da sua projeção ortogonal no plano horizontal.'
      espaco: 8
      resolucao: |
        $A^{\prime} = A\cos\theta = 20 \cdot \tfrac{1}{2} = 10$.
      resposta: '10'
    - enunciado: 'Complete o quadro para cubos de aresta $a$.'
      tabela:
        cabecalho: ['$a$', 'Diagonal da face', 'Diagonal do cubo']
        linhas:
        - ['$2$', '${{2\sqrt{2}}}$', '${{2\sqrt{3}}}$']
        - ['$4$', '${{4\sqrt{2}}}$', '${{4\sqrt{3}}}$']
        - ['$\sqrt{3}$', '${{\sqrt{6}}}$', '${{3}}$']
      resolucao: |
        Face: $a\sqrt{2}$. Cubo: $a\sqrt{3}$.
      resposta: '$2\sqrt{2}$, $2\sqrt{3}$; $4\sqrt{2}$, $4\sqrt{3}$; $\sqrt{6}$, 3'
    - enunciado: 'Um paralelepípedo retângulo tem arestas 3, 4 e 12, com a de 12 vertical. Calcule a diagonal, a sua projeção na base e o seno do ângulo que ela forma com a base.'
      espaco: 12
      resolucao: |
        Projeção: diagonal da base, $\sqrt{9 + 16} = 5$. Diagonal: $\sqrt{25 + 144} = 13$. $\operatorname{sen}\theta = \tfrac{12}{13}$.
      resposta: '13; 5; $\frac{12}{13}$'
    - enunciado: 'No cubo $ABCDEFGH$, calcule o ângulo entre os planos $ABCD$ e $ABGH$.'
      espaco: 10
      resolucao: |
        Os planos se cortam em $AB$. $BC \perp AB$ está em $ABCD$, e $BG \perp AB$ está em $ABGH$: o ângulo é $C\hat{B}G$, entre a aresta e a diagonal da face $BCGF$: $45°$.
      resposta: '$45°$'
    - enunciado: 'Num cubo de aresta 4, calcule a distância do vértice $B$ ao plano diagonal $ACGE$.'
      espaco: 10
      resolucao: |
        $BD \perp AC$ e $BD \perp AE$: $BD$ é perpendicular ao plano $ACGE$, que ela corta no centro $O$ da base. Distância $BO = \tfrac{4\sqrt{2}}{2} = 2\sqrt{2}$.
      resposta: '$2\sqrt{2}$'
  - nome: Nível 3
    questoes:
    - enunciado: 'O ponto $P$ não está no plano $\alpha$, e $O$ é a sua projeção ortogonal. Prove que $PO$ é menor que qualquer outro segmento $PA$, com $A$ em $\alpha$.'
      espaco: 10
      resolucao: |
        Para $A \ne O$, o triângulo $POA$ é retângulo em $O$, e $PA$ é a hipotenusa: $PA > PO$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove o teorema das três perpendiculares: se $PO \perp \alpha$, $r$ é uma reta de $\alpha$ e $OM \perp r$ com $M \in r$, então $PM \perp r$.'
      espaco: 14
      resolucao: |
        $r$ é perpendicular a $OM$ e a $PO$ (pois $PO$ é perpendicular a todas as retas de $\alpha$). Como $OM$ e $PO$ são concorrentes, $r$ é perpendicular ao plano $POM$ e, portanto, a $PM$, que está nesse plano.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que a projeção ortogonal de um segmento de comprimento $\ell$, que forma o ângulo $\theta$ com o plano, mede $\ell\cos\theta$.'
      espaco: 12
      resolucao: |
        Sejam $A^{\prime}$ e $B^{\prime}$ as projeções de $A$ e $B$. Pela paralela a $A^{\prime}B^{\prime}$ por $A$, forma-se um triângulo retângulo de hipotenusa $AB$, cateto paralelo e igual a $A^{\prime}B^{\prime}$ e ângulo $\theta$ entre eles: $A^{\prime}B^{\prime} = \ell\cos\theta$.
      resposta: 'Ver resolução'
    - enunciado: 'Um triângulo tem um lado $b$ sobre a reta de interseção de dois planos, que formam o ângulo $\theta$, e altura $h$ relativa a esse lado. Prove que a área da projeção dele no outro plano é $A\cos\theta$.'
      espaco: 12
      resolucao: |
        O lado $b$ não muda. A altura, perpendicular à reta de interseção, projeta-se numa perpendicular a ela, de medida $h\cos\theta$. Área da projeção: $\tfrac{b \cdot h\cos\theta}{2} = A\cos\theta$.
      resposta: 'Ver resolução'
    - enunciado: 'No cubo $ABCDEFGH$, prove que a diagonal $AG$ é perpendicular à diagonal de face $BD$.'
      espaco: 12
      resolucao: |
        $BD \perp AC$ (diagonais do quadrado) e $BD \perp AE$ (aresta perpendicular à base). Como $AC$ e $AE$ são concorrentes, $BD$ é perpendicular ao plano $ACGE$ e, portanto, a $AG$, que está nele.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Uma torre vertical de 24 m será estaiada por três cabos esticados do seu topo até pontos do chão plano, cada um a 7 m da base da torre, como na figura. A empresa precisa saber o comprimento total de cabo, desconsiderando as amarrações.
    figura:
      tikz: |
        \begin{scope}[scale=.08]
        \draw[ink, line width=1pt] (-12,0) -- (12,0);
        \draw[ink, line width=1.5pt] (0,0) -- (0,24);
        \draw[roxo, line width=1pt] (0,24) -- (7,0) (0,24) -- (-7,0);
        \draw[mudo] (0,2) -- (2,2) -- (2,0);
        \node[left, font=\scriptsize] at (0,12) {24 m};
        \node[below, font=\scriptsize] at (3.5,0) {7 m};
        \end{scope}
    enunciado: |
      O comprimento total de cabo é
    opcoes: ['$31$ m', '$75$ m', '$93$ m', '$25$ m', '$72$ m']
    correta: B
    resolucao: |
      A torre é perpendicular ao chão: cada cabo mede $\sqrt{576 + 49} = 25$ m. Total $75$ m.

  - estilo: Fuvest
    enunciado: |
      A diagonal de um cubo de aresta 4 mede
    opcoes: ['$4\sqrt{3}$', '$4\sqrt{2}$', '$12$', '$8$', '$2\sqrt{3}$']
    correta: A
    resolucao: |
      $a\sqrt{3} = 4\sqrt{3}$.

  - estilo: Unicamp
    enunciado: |
      Um segmento de 10 cm forma ângulo de $30°$ com um plano. A sua projeção ortogonal no plano mede
    opcoes: ['$5\sqrt{3}$ cm.', '$5$ cm.', '$10$ cm.', '$10\sqrt{3}$ cm.']
    correta: A
    resolucao: |
      $10\cos30° = 5\sqrt{3}$ cm.

  - estilo: UEM
    enunciado: |
      Considere retas e planos perpendiculares. Assinale o que for correto.
    proposicoes:
    - 'Uma reta perpendicular a um plano é perpendicular a todas as retas do plano que passam pelo seu pé.'
    - 'A projeção ortogonal, num plano, de um segmento perpendicular a ele é um ponto.'
    - 'Dois planos distintos perpendiculares a uma mesma reta são paralelos.'
    - 'Duas retas distintas perpendiculares a um mesmo plano são paralelas.'
    - 'A projeção ortogonal de um segmento tem sempre o mesmo comprimento que ele.'
    corretas: [1, 2, 3, 4]
    resolucao: |
      01) Correta. 02) Os dois extremos têm a mesma projeção. 04) Correta. 08) Correta. 16) Incorreta: mede $\ell\cos\theta$.
      Soma: $01 + 02 + 04 + 08 = 15$.

  - estilo: Enem
    texto: |
      Uma rampa reta de 10 m de comprimento forma ângulo de $30°$ com o piso horizontal, como na figura. Na planta baixa do prédio, que é uma projeção ortogonal no plano do piso, a rampa aparece como um segmento. O arquiteto precisa saber o comprimento desse segmento. Use $\sqrt{3} \approx 1{,}73$.
    figura:
      tikz: |
        \begin{scope}[scale=.25]
        \draw[ink, line width=1pt] (-1,0) -- (10,0);
        \draw[roxo, line width=1.2pt] (0,0) -- (8.66,5);
        \draw[mudo, dashed] (8.66,5) -- (8.66,0);
        \draw[mudo] (2,0) arc (0:30:2);
        \node[font=\scriptsize] at (3.2,0.8) {$30°$};
        \node[above left, font=\scriptsize] at (4.3,2.5) {10 m};
        \end{scope}
    enunciado: |
      Na planta, a rampa mede, aproximadamente,
    opcoes: ['$5{,}00$ m', '$10{,}00$ m', '$8{,}65$ m', '$7{,}07$ m', '$11{,}55$ m']
    correta: C
    resolucao: |
      $10\cos30° = 5\sqrt{3} \approx 8{,}65$ m.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir.
    afirmativas:
    - 'Se a reta $r$ é perpendicular ao plano $\alpha$, então $r$ é ortogonal a todas as retas de $\alpha$.'
    - 'Dois planos perpendiculares a um terceiro são paralelos entre si.'
    - 'A distância de um ponto a um plano é a medida do segmento perpendicular do ponto ao plano.'
    - 'A projeção ortogonal de um triângulo num plano pode ser um segmento.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'II e III, apenas.', 'II e IV, apenas.', 'I, III e IV, apenas.', 'I, II, III e IV.']
    correta: D
    resolucao: |
      I. Correta. II. Incorreta: duas faces vizinhas de um cubo, perpendiculares à base, se cortam. III. Correta. IV. Correta, se o plano do triângulo for perpendicular ao de projeção.

  - estilo: Unesp
    enunciado: |
      A diagonal de um paralelepípedo retângulo de arestas 2, 3 e 6 mede
    opcoes: ['$11$', '$\sqrt{13}$', '$6\sqrt{2}$', '$5$', '$7$']
    correta: E
    resolucao: |
      $\sqrt{4 + 9 + 36} = 7$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      Na figura, $ABCDEFGH$ é um cubo, e $AG$ é uma diagonal.
    figura:
      tikz: |
        \begin{scope}[scale=.8]
        \draw[ink, line width=1pt] (0,0) -- (2,0) -- (2,2) -- (0,2) -- cycle;
        \draw[ink, line width=1pt] (2,0) -- (2.8,0.6) -- (2.8,2.6) -- (0.8,2.6) -- (0,2) (2,2) -- (2.8,2.6);
        \draw[ink, dashed] (0,0) -- (0.8,0.6) -- (2.8,0.6) (0.8,0.6) -- (0.8,2.6);
        \draw[roxo, line width=1pt] (0,0) -- (2.8,2.6);
        \draw[roxo, dashed] (0,0) -- (2.8,0.6);
        \node[below left, font=\scriptsize] at (0,0) {$A$};
        \node[right, font=\scriptsize] at (2.8,0.6) {$C$};
        \node[above right, font=\scriptsize] at (2.8,2.6) {$G$};
        \end{scope}
    enunciado: |
      A tangente do ângulo que $AG$ forma com o plano da base $ABCD$ é
    opcoes: ['$\frac{\sqrt{2}}{2}$.', '$1$.', '$\sqrt{2}$.', '$\frac{\sqrt{3}}{3}$.']
    correta: A
    resolucao: |
      A projeção de $AG$ é $AC = a\sqrt{2}$, e $CG = a$: $\operatorname{tg}\theta = \tfrac{a}{a\sqrt{2}}$.

  - estilo: Fuvest
    enunciado: |
      O ponto $P$ está a 12 de um plano, e $O$ é a sua projeção nele. Uma reta do plano passa a 5 de $O$. A distância de $P$ a essa reta é
    opcoes: ['$17$', '$13$', '$12$', '$\sqrt{119}$', '$7$']
    correta: B
    resolucao: |
      Teorema das três perpendiculares: a distância é $\sqrt{144 + 25} = 13$.

  - estilo: UFSC
    enunciado: |
      Considere o cubo $ABCDEFGH$ de aresta 6 (base $ABCD$; $E$, $F$, $G$, $H$ acima de $A$, $B$, $C$, $D$). Assinale o que for correto.
    proposicoes:
    - 'A diagonal do cubo mede $6\sqrt{3}$.'
    - 'A distância entre as retas reversas $AB$ e $CG$ é 6.'
    - 'A projeção ortogonal de $AG$ no plano $ABCD$ é $AC$, que mede $6\sqrt{2}$.'
    - 'A tangente do ângulo entre $AG$ e o plano $ABCD$ é $\frac{\sqrt{2}}{2}$.'
    - 'O ângulo entre os planos $ABCD$ e $ABGH$ mede $45°$.'
    - 'A distância de $B$ ao plano $ACGE$ é 6.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) $a\sqrt{3}$. 02) Perpendicular comum $BC$. 04) $CG \perp$ base. 08) $\tfrac{6}{6\sqrt{2}}$. 16) Ângulo $C\hat{B}G$. 32) Incorreta: metade de $BD$, $3\sqrt{2}$.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      Um painel solar retangular de 2 m por 1,5 m está instalado num suporte, formando ângulo de $60°$ com o chão horizontal. Ao meio-dia, com o Sol a pino, os raios são verticais, e a sombra do painel no chão é a sua projeção ortogonal. O jardineiro quer saber a área sombreada.
    enunciado: |
      A área da sombra é
    opcoes: ['$3{,}0$ m²', '$2{,}6$ m²', '$1{,}5$ m²', '$0{,}75$ m²', '$1{,}0$ m²']
    correta: C
    resolucao: |
      $A\cos60° = 3 \cdot \tfrac{1}{2} = 1{,}5$ m².

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'Uma reta perpendicular a duas retas concorrentes de um plano é perpendicular ao plano.'
    - 'Uma reta perpendicular a uma única reta de um plano é perpendicular ao plano.'
    - 'Duas retas distintas perpendiculares a um mesmo plano são paralelas.'
    - 'A projeção ortogonal de um segmento oblíquo ao plano é menor que o segmento.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – V – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – F – V – V.', 'V – V – F – V.']
    correta: D
    resolucao: |
      (V) Critério. (F) Não basta uma. (V) (V) $\ell\cos\theta < \ell$ para $0° < \theta$.

  - estilo: Enem
    texto: |
      Uma norma de acessibilidade exige que rampas tenham inclinação de no máximo 8{,}33\%, isto é, desnível dividido pela projeção horizontal da rampa. Um engenheiro mediu cinco rampas de uma escola: o comprimento da rampa (inclinada) e o desnível, em metros.
    tabela:
      cabecalho: ['Rampa', 'Comprimento (m)', 'Desnível (m)']
      linhas:
      - ['R1', '$5{,}0$', '$0{,}45$']
      - ['R2', '$4{,}0$', '$0{,}40$']
      - ['R3', '$6{,}5$', '$0{,}50$']
      - ['R4', '$3{,}0$', '$0{,}30$']
      - ['R5', '$5{,}2$', '$0{,}50$']
    enunciado: |
      A única rampa que atende à norma é a
    opcoes: ['R3.', 'R1.', 'R2.', 'R4.', 'R5.']
    correta: A
    resolucao: |
      Projeção $\sqrt{c^2 - d^2}$. R1: $\tfrac{0{,}45}{4{,}98} \approx 9{,}0\%$. R2: $\tfrac{0{,}40}{3{,}98} \approx 10{,}1\%$. R3: $\tfrac{0{,}50}{6{,}48} \approx 7{,}7\%$. R4: $\approx 10{,}1\%$. R5: $\tfrac{0{,}50}{5{,}18} \approx 9{,}7\%$.

  - estilo: Unesp
    enunciado: |
      Um ponto $P$ está a 8 de um plano, e um segmento $PA$, com $A$ no plano, mede 17. A projeção de $PA$ no plano mede
    opcoes: ['$9$', '$25$', '$8$', '$12$', '$15$']
    correta: E
    resolucao: |
      $\sqrt{289 - 64} = 15$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      O triângulo equilátero $ABC$, de lado 6, está num plano $\alpha$, e o ponto $P$, fora de $\alpha$, tem $PA = PB = PC = 5$. Assinale o que for correto.
    proposicoes:
    - 'A projeção de $P$ em $\alpha$ é o centro do triângulo.'
    - 'O centro do triângulo dista $2\sqrt{3}$ de cada vértice.'
    - 'A distância de $P$ ao plano $\alpha$ é $\sqrt{13}$.'
    - 'Se fosse $PA = PB = PC = 4$, a distância de $P$ a $\alpha$ seria 2.'
    - 'A distância de $P$ a $\alpha$ é 5.'
    corretas: [1, 2, 3, 4]
    resolucao: |
      01) A projeção $O$ tem $OA = OB = OC$ (triângulos retângulos com hipotenusas iguais e cateto $PO$ comum). 02) $R = \tfrac{6}{\sqrt{3}} = 2\sqrt{3}$. 04) $\sqrt{25 - 12}$. 08) $\sqrt{16 - 12}$. 16) Incorreta.
      Soma: $01 + 02 + 04 + 08 = 15$.

  - estilo: Unicamp
    enunciado: |
      Um hexágono regular de área $24\sqrt{3}$ está num plano que forma $60°$ com o plano horizontal. A área da sua projeção ortogonal no plano horizontal é
    opcoes: ['$24\sqrt{3}$.', '$12\sqrt{3}$.', '$12$.', '$36$.']
    correta: B
    resolucao: |
      $24\sqrt{3} \cdot \cos60° = 12\sqrt{3}$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Uma água de telhado é um retângulo de 8 m por 5 m, inclinado $30°$ em relação ao plano horizontal, com o lado de 8 m na horizontal, como na figura. A área coberta no chão é a projeção ortogonal do telhado. Use $\sqrt{3} \approx 1{,}73$.
    figura:
      tikz: |
        \begin{scope}[scale=.3]
        \fill[lilas!35] (0,0) -- (8,0) -- (10.6,2.5) -- (2.6,2.5) -- cycle;
        \draw[ink, line width=1pt] (0,0) -- (8,0) -- (10.6,2.5) -- (2.6,2.5) -- cycle;
        \draw[mudo, dashed] (0,0) -- (0,-1.8) -- (8,-1.8) -- (8,0);
        \node[below, font=\scriptsize] at (4,0) {8 m};
        \node[right, font=\scriptsize] at (9.3,1.1) {5 m};
        \end{scope}
    enunciado: |
      A área coberta no chão é, aproximadamente,
    opcoes: ['$40{,}0$ m²', '$20{,}0$ m²', '$34{,}6$ m²', '$23{,}1$ m²', '$46{,}2$ m²']
    correta: C
    resolucao: |
      $40\cos30° = 20\sqrt{3} \approx 34{,}6$ m².

  - estilo: Unicamp
    enunciado: |
      O desnível entre a borda mais alta e a mais baixa dessa água do telhado é
    opcoes: ['$5$ m.', '$4{,}3$ m.', '$4$ m.', '$2{,}5$ m.']
    correta: D
    resolucao: |
      O lado de 5 m é inclinado $30°$: desnível $5\operatorname{sen}30° = 2{,}5$ m.

  - estilo: Fuvest
    enunciado: |
      Num cubo de aresta 3, a distância do vértice $A$ à reta que contém a diagonal $BH$ é
    opcoes: ['$3$', '$\sqrt{3}$', '$3\sqrt{2}$', '$\frac{3\sqrt{2}}{2}$', '$\sqrt{6}$']
    correta: E
    resolucao: |
      O triângulo $ABH$ é retângulo em $A$ ($AB \perp$ face $ADHE$), com catetos $AB = 3$ e $AH = 3\sqrt{2}$ e hipotenusa $BH = 3\sqrt{3}$. A distância pedida é a altura relativa à hipotenusa: $\tfrac{3 \cdot 3\sqrt{2}}{3\sqrt{3}} = \sqrt{6}$.

  - estilo: Unesp
    texto: |
      Na figura, as arestas $OA$, $OB$ e $OC$ do tetraedro $OABC$ são perpendiculares duas a duas e medem 2.
    figura:
      tikz: |
        \begin{scope}[scale=.9]
        \coordinate (O) at (0,0);
        \coordinate (A) at (-0.9,-0.7);
        \coordinate (B) at (1.6,0);
        \coordinate (C) at (0,1.6);
        \draw[roxo, line width=1pt, fill=lilas!30] (A) -- (B) -- (C) -- cycle;
        \draw[ink, line width=1pt] (O) -- (A) (O) -- (B) (O) -- (C);
        \node[above left, font=\scriptsize] at (O) {$O$};
        \node[below left, font=\scriptsize] at (A) {$A$};
        \node[right, font=\scriptsize] at (B) {$B$};
        \node[above, font=\scriptsize] at (C) {$C$};
        \end{scope}
    enunciado: |
      A área do triângulo $ABC$ é
    opcoes: ['$4\sqrt{3}$', '$2\sqrt{3}$', '$6$', '$2$', '$\sqrt{3}$']
    correta: B
    resolucao: |
      Cada lado de $ABC$ é hipotenusa de um triângulo retângulo isósceles de catetos 2: $2\sqrt{2}$. Equilátero: $\tfrac{8\sqrt{3}}{4} = 2\sqrt{3}$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Seja $PO$ perpendicular ao plano $\alpha$, com $O \in \alpha$, e $r$ uma reta de $\alpha$ que não passa por $O$.'
    itens:
    - 'Prove que, se $OM \perp r$ com $M \in r$, então $PM \perp r$ (teorema das três perpendiculares).'
    - 'Prove a recíproca: se $PM \perp r$, com $M \in r$, então $OM \perp r$.'
    - 'Para $PO = 6$ e $PM = 10$, calcule a distância de $O$ a $r$.'
    espaco: 62
    resolucao: |
      a) $r \perp OM$ e $r \perp PO$ ($PO$ é perpendicular a toda reta de $\alpha$). Então $r$ é perpendicular ao plano $POM$ e a $PM$.
      b) $r \perp PM$ e $r \perp PO$, concorrentes: $r$ é perpendicular ao plano $POM$ e a $OM$.
      c) $OM = \sqrt{100 - 36} = 8$.
    resposta: 'c) 8'

  - estilo: Unicamp
    texto: |
      Dois planos, $\alpha$ e $\beta$, formam um ângulo $\theta$. Figuras de $\alpha$ são projetadas ortogonalmente em $\beta$.
    enunciado: ''
    itens:
    - 'Mostre que um segmento de $\alpha$ perpendicular à reta $\alpha \cap \beta$ se projeta com comprimento multiplicado por $\cos\theta$, e um segmento paralelo a ela não muda.'
    - 'Conclua que um retângulo de $\alpha$ com um lado paralelo a $\alpha \cap \beta$ se projeta com área multiplicada por $\cos\theta$.'
    - 'Um telhado de 60 m² tem inclinação de $30°$. Calcule a área coberta, em função de $\sqrt{3}$.'
    espaco: 62
    resolucao: |
      a) O segmento perpendicular à interseção forma o ângulo $\theta$ com $\beta$: projeção $\ell\cos\theta$. O paralelo à interseção é paralelo a $\beta$ e se projeta em tamanho real.
      b) Os lados medem $a$ (paralelo) e $b\cos\theta$: área $ab\cos\theta$.
      c) $60 \cdot \tfrac{\sqrt{3}}{2} = 30\sqrt{3}$ m².
    resposta: 'c) $30\sqrt{3}$ m²'

  - estilo: ITA
    enunciado: |
      Num cubo de aresta 4, a distância entre a diagonal $AG$ e a aresta $BF$, que são reversas, é
    opcoes: ['$2\sqrt{2}$', '$4$', '$2$', '$4\sqrt{2}$', '$2\sqrt{3}$']
    correta: A
    espaco: 22
    resolucao: |
      $BF$ é paralela ao plano $ACGE$, que contém $AG$. A distância é a de $B$ a esse plano: $BD \perp ACGE$, e a distância é metade de $BD$, $\tfrac{4\sqrt{2}}{2} = 2\sqrt{2}$.
    resposta: 'A'

  - estilo: Unesp
    enunciado: 'Um paralelepípedo retângulo $ABCDEFGH$ tem $AB = 3$, $BC = 4$ e $AE = 12$ (base $ABCD$; $E$, $F$, $G$, $H$ acima de $A$, $B$, $C$, $D$).'
    itens:
    - 'Calcule a diagonal $AG$.'
    - 'Calcule o cosseno do ângulo entre $AG$ e o plano da base.'
    - 'Calcule a distância do vértice $B$ ao plano diagonal $ACGE$.'
    espaco: 62
    resolucao: |
      a) $\sqrt{9 + 16 + 144} = 13$.
      b) A projeção é $AC = 5$: $\cos\theta = \tfrac{5}{13}$.
      c) A perpendicular de $B$ a $AC$, na base, também é perpendicular a $AE$, logo ao plano: é a altura do triângulo $ABC$ relativa a $AC$, $\tfrac{3 \cdot 4}{5} = 2{,}4$.
    resposta: 'a) 13; b) $\frac{5}{13}$; c) 2,4'

  - estilo: UFSC
    enunciado: |
      Considere retas, planos e projeções no espaço. Assinale o que for correto.
    proposicoes:
    - 'Duas retas distintas perpendiculares a um mesmo plano são paralelas.'
    - 'Dois planos distintos perpendiculares a uma mesma reta são paralelos.'
    - 'Se dois planos são perpendiculares, toda reta de um é perpendicular ao outro.'
    - 'Por um ponto passa uma única reta perpendicular a um plano dado.'
    - 'A projeção ortogonal de um quadrado de área 16, num plano que forma $60°$ com o dele, tem área 8.'
    - 'A distância entre as retas reversas $AB$ e $CG$ de um cubo de aresta 5 é $5\sqrt{2}$.'
    corretas: [1, 2, 4, 5]
    espaco: 22
    resolucao: |
      01) Correta. 02) Correta. 04) Incorreta: no cubo, as faces $ABCD$ e $ABFE$ são perpendiculares, e $AB$ não é perpendicular a $ABFE$. 08) Correta. 16) $16 \cdot \tfrac{1}{2}$. 32) Incorreta: é a aresta $BC = 5$.
    resposta: 'Soma 27 (01 + 02 + 08 + 16)'

  - estilo: Fuvest
    enunciado: 'Considere o cubo $ABCDEFGH$ de aresta $a$.'
    itens:
    - 'Prove que $BD$ é perpendicular ao plano $ACGE$.'
    - 'Conclua que a diagonal $AG$ é perpendicular a $BD$.'
    - 'Calcule a distância de $B$ ao plano $ACGE$ e a distância entre as retas $AG$ e $BF$.'
    espaco: 62
    resolucao: |
      a) $BD \perp AC$ (diagonais do quadrado) e $BD \perp AE$ (aresta perpendicular à base); $AC$ e $AE$ são concorrentes.
      b) $AG$ está no plano $ACGE$.
      c) $\tfrac{BD}{2} = \tfrac{a\sqrt{2}}{2}$. Como $BF \parallel ACGE$ e $AG$ está nesse plano, a distância entre as retas é a mesma: $\tfrac{a\sqrt{2}}{2}$.
    resposta: 'c) $\frac{a\sqrt{2}}{2}$ e $\frac{a\sqrt{2}}{2}$'

  - estilo: Unicamp
    enunciado: 'O triângulo equilátero $ABC$, de lado 6, está num plano $\alpha$, e o ponto $P$ tem $PA = PB = PC = 5$.'
    itens:
    - 'Prove que a projeção $O$ de $P$ em $\alpha$ é o centro do triângulo.'
    - 'Calcule $PO$.'
    - 'Calcule o cosseno do ângulo que $PA$ forma com o plano $\alpha$.'
    espaco: 62
    resolucao: |
      a) $POA$, $POB$ e $POC$ são retângulos em $O$, com $PO$ comum e hipotenusas iguais: $OA = OB = OC$, e $O$ é o circuncentro, que no equilátero é o centro.
      b) $OA = 2\sqrt{3}$: $PO = \sqrt{25 - 12} = \sqrt{13}$.
      c) A projeção de $PA$ é $OA$: $\cos\theta = \tfrac{2\sqrt{3}}{5}$.
    resposta: 'b) $\sqrt{13}$; c) $\frac{2\sqrt{3}}{5}$'

  - estilo: Fuvest
    enunciado: |
      Um painel retangular de 3 m² é inclinado $45°$ em relação ao chão. A área da sua projeção ortogonal no chão é
    opcoes: ['$\frac{3\sqrt{2}}{2}$ m²', '$3$ m²', '$1{,}5$ m²', '$3\sqrt{2}$ m²', '$\frac{3\sqrt{3}}{2}$ m²']
    correta: A
    espaco: 22
    resolucao: |
      $3\cos45° = \tfrac{3\sqrt{2}}{2}$ m².
    resposta: 'A'

  - estilo: Unesp
    enunciado: 'No tetraedro $OABC$, as arestas $OA$, $OB$ e $OC$ são perpendiculares duas a duas e medem 2.'
    itens:
    - 'Calcule os lados do triângulo $ABC$ e a sua área $S$.'
    - 'Calcule as áreas $S_1$, $S_2$, $S_3$ das outras três faces.'
    - 'Verifique que $S^2 = S_1^2 + S_2^2 + S_3^2$ (uma versão espacial do teorema de Pitágoras).'
    espaco: 62
    resolucao: |
      a) Cada lado: $\sqrt{4 + 4} = 2\sqrt{2}$. Equilátero: $S = \tfrac{8\sqrt{3}}{4} = 2\sqrt{3}$.
      b) Triângulos retângulos de catetos 2: $S_1 = S_2 = S_3 = 2$.
      c) $S^2 = 12$ e $4 + 4 + 4 = 12$.
    resposta: 'a) $2\sqrt{2}$; $2\sqrt{3}$; b) 2 cada'

  - estilo: Fuvest
    enunciado: 'O ponto $P$ está a 5 do plano $\alpha$, e $O$ é a sua projeção.'
    itens:
    - 'Prove que, para todo $A \ne O$ em $\alpha$, $PA > PO$.'
    - 'Descreva o conjunto dos pontos de $\alpha$ que estão a 13 de $P$.'
    - 'Calcule a área da região de $\alpha$ formada pelos pontos a no máximo 13 de $P$.'
    espaco: 62
    resolucao: |
      a) $POA$ é retângulo em $O$, e $PA$ é a hipotenusa.
      b) $PA = 13$ equivale a $OA = \sqrt{169 - 25} = 12$: circunferência de centro $O$ e raio 12.
      c) Círculo de raio 12: $144\pi$.
    resposta: 'b) circunferência de centro $O$ e raio 12; c) $144\pi$'
