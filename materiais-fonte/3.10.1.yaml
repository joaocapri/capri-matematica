# Aula 3.10.1 — Geometria analítica: equação da circunferência
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: equação reduzida (x − a)² + (y − b)² = r²; equação geral x² + y² + Dx + Ey + F = 0;
# completar quadrados; condição para a equação geral ser circunferência; circunferência por diâmetro, por três pontos,
# tangente aos eixos. Posições relativas de ponto e reta (3.10.2) e tangentes e duas circunferências (3.10.3) ficam para depois.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Escreva a equação reduzida da circunferência de centro $(2, -3)$ e raio 4, completando.'
      itens:
      - '$(x - {{2}})^2 + (y + {{3}})^2 = {{16}}$'
      resolucao: |
        $(x - a)^2 + (y - b)^2 = r^2$ com $a = 2$, $b = -3$ e $r = 4$: $(x - 2)^2 + (y + 3)^2 = 16$. O sinal dentro do parêntese é o oposto da coordenada do centro.
      resposta: '$(x - 2)^2 + (y + 3)^2 = 16$'
    - enunciado: 'Complete o quadro com o centro e o raio de cada circunferência.'
      tabela:
        cabecalho: ['Equação', 'Centro', 'Raio']
        linhas:
        - ['$(x - 1)^2 + (y - 4)^2 = 9$', '$({{1}}, {{4}})$', '${{3}}$']
        - ['$(x + 2)^2 + y^2 = 5$', '$({{-2}}, {{0}})$', '${{\sqrt{5}}}$']
        - ['$x^2 + (y + 3)^2 = 49$', '$({{0}}, {{-3}})$', '${{7}}$']
        - ['$x^2 + y^2 = \frac{1}{4}$', '$({{0}}, {{0}})$', '${{\frac{1}{2}}}$']
      resolucao: |
        O raio é a raiz quadrada do segundo membro. $(x + 2)^2$ indica abscissa $-2$; $y^2 = (y - 0)^2$ indica ordenada 0.
      resposta: '$(1, 4)$ e $3$; $(-2, 0)$ e $\sqrt{5}$; $(0, -3)$ e $7$; $(0, 0)$ e $\frac{1}{2}$'
    - enunciado: 'Escreva a equação reduzida de cada circunferência.'
      itens:
      - 'Centro $(0, 0)$ e raio 5.'
      - 'Centro $(-1, 2)$ e raio 3.'
      - 'Centro $(3, 0)$, passando pela origem.'
      espaco_item: 10
      resolucao: |
        (a) $x^2 + y^2 = 25$. (b) $(x + 1)^2 + (y - 2)^2 = 9$. (c) O raio é a distância do centro à origem, 3: $(x - 3)^2 + y^2 = 9$.
      resposta: '(a) $x^2 + y^2 = 25$ (b) $(x + 1)^2 + (y - 2)^2 = 9$ (c) $(x - 3)^2 + y^2 = 9$'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'A circunferência $(x - 2)^2 + (y + 1)^2 = 9$ tem centro $(2, -1)$.'
      - 'A circunferência $x^2 + y^2 = 16$ tem raio 16.'
      - 'Toda equação da forma $x^2 + y^2 + Dx + Ey + F = 0$ representa uma circunferência.'
      - 'A circunferência $x^2 + y^2 - 6x = 0$ passa pela origem.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) (F) O raio é $\sqrt{16} = 4$. (F) Completando quadrados, o segundo membro pode ser zero (um ponto) ou negativo (nenhum ponto).
        (V) $(0, 0)$ satisfaz: $0 + 0 - 0 = 0$.
      resposta: V, F, F, V
    - enunciado: 'Completando quadrados, determine o centro e o raio.'
      itens:
      - '$x^2 + y^2 - 6x + 4y - 3 = 0$'
      - '$x^2 + y^2 + 8y = 0$'
      espaco_item: 14
      resolucao: |
        (a) $(x^2 - 6x + 9) + (y^2 + 4y + 4) = 3 + 9 + 4$: $(x - 3)^2 + (y + 2)^2 = 16$. Centro $(3, -2)$, raio 4.
        (b) $x^2 + (y^2 + 8y + 16) = 16$: $x^2 + (y + 4)^2 = 16$. Centro $(0, -4)$, raio 4.
      resposta: '(a) $(3, -2)$ e $4$ (b) $(0, -4)$ e $4$'
    - enunciado: 'Associe cada equação à sua descrição (uma descrição pode ser usada mais de uma vez).'
      esquerda:
      - 'circunferência com centro na origem'
      - 'circunferência com centro no eixo $x$, fora da origem'
      - 'circunferência com centro no eixo $y$, fora da origem'
      - 'não representa circunferência'
      direita:
      - '$x^2 + y^2 = 7$'
      - '$(x - 5)^2 + y^2 = 4$'
      - '$x^2 + y^2 - 2y = 0$'
      - '$x^2 + y^2 + 4 = 0$'
      - '$x^2 + y^2 + 6x = 0$'
      resolucao: |
        3º: $x^2 + (y - 1)^2 = 1$, centro $(0, 1)$. 4º: $x^2 + y^2 = -4$, impossível. 5º: $(x + 3)^2 + y^2 = 9$, centro $(-3, 0)$.
      resposta: 'De cima para baixo: 1, 2, 3, 4, 2'
    - enunciado: 'Verifique quais pontos pertencem à circunferência $(x - 1)^2 + (y - 2)^2 = 25$.'
      itens:
      - '$(4, 6)$'
      - '$(6, 2)$'
      - '$(0, 0)$'
      espaco_item: 8
      resolucao: |
        (a) $9 + 16 = 25$: pertence. (b) $25 + 0 = 25$: pertence. (c) $1 + 4 = 5 \neq 25$: não pertence.
      resposta: '(a) sim (b) sim (c) não'
  - nome: Nível 2
    questoes:
    - texto: |
        Para a circunferência $(x + 3)^2 + (y - 1)^2 = 4$, Ana disse: “o centro é $(3, -1)$ e o raio é 4”.
      enunciado: 'Corrija Ana.'
      espaco: 10
      resolucao: |
        Ela trocou os sinais do centro e esqueceu a raiz do raio. $(x + 3) = (x - (-3))$ e $(y - 1)$: centro $(-3, 1)$. Raio $\sqrt{4} = 2$.
      resposta: 'Centro $(-3, 1)$, raio $2$'
    - enunciado: 'Os pontos $A(-1, 2)$ e $B(5, 10)$ são extremos de um diâmetro de uma circunferência.'
      itens:
      - 'Determine o centro e o raio.'
      - 'Escreva as equações reduzida e geral.'
      espaco_item: 14
      resolucao: |
        (a) Centro: ponto médio $(2, 6)$. Raio: metade de $AB = \sqrt{36 + 64} = 10$, isto é, 5.
        (b) $(x - 2)^2 + (y - 6)^2 = 25$. Desenvolvendo: $x^2 + y^2 - 4x - 12y + 15 = 0$.
      resposta: '(a) $(2, 6)$ e $5$ (b) $x^2 + y^2 - 4x - 12y + 15 = 0$'
    - enunciado: 'Determine a equação da circunferência que passa por $(0, 0)$, $(6, 0)$ e $(0, 8)$.'
      espaco: 16
      resolucao: |
        Os três pontos formam um triângulo retângulo em $(0, 0)$; a hipotenusa, de $(6, 0)$ a $(0, 8)$, é um diâmetro. Centro $(3, 4)$, raio 5.
        $(x - 3)^2 + (y - 4)^2 = 25$, ou $x^2 + y^2 - 6x - 8y = 0$.
      resposta: '$x^2 + y^2 - 6x - 8y = 0$'
    - enunciado: 'Considere a equação $x^2 + y^2 - 4x + 2y + k = 0$.'
      itens:
      - 'Para que valores de $k$ ela representa uma circunferência?'
      - 'Para que valor de $k$ o raio é 2?'
      espaco_item: 12
      resolucao: |
        $(x - 2)^2 + (y + 1)^2 = 5 - k$. (a) É circunferência se $5 - k > 0$: $k < 5$. (b) $5 - k = 4$: $k = 1$.
      resposta: '(a) $k < 5$ (b) $k = 1$'
    - enunciado: 'Complete o quadro com o centro e o raio de cada circunferência.'
      tabela:
        cabecalho: ['Equação geral', 'Centro', 'Raio']
        linhas:
        - ['$x^2 + y^2 - 2x - 4y - 4 = 0$', '$({{1}}, {{2}})$', '${{3}}$']
        - ['$x^2 + y^2 + 6x - 8y = 0$', '$({{-3}}, {{4}})$', '${{5}}$']
        - ['$x^2 + y^2 - 10y + 9 = 0$', '$({{0}}, {{5}})$', '${{4}}$']
      resolucao: |
        Centro $\left(-\tfrac{D}{2}, -\tfrac{E}{2}\right)$ e $r^2 = a^2 + b^2 - F$: $1 + 4 + 4 = 9$; $9 + 16 - 0 = 25$; $0 + 25 - 9 = 16$.
      resposta: '$(1, 2)$ e $3$; $(-3, 4)$ e $5$; $(0, 5)$ e $4$'
    - enunciado: 'Uma circunferência tem centro na reta $y = x$ e passa pelos pontos $(0, 0)$ e $(4, 0)$. Determine a sua equação.'
      espaco: 14
      resolucao: |
        O centro é equidistante de $(0, 0)$ e $(4, 0)$: está na mediatriz $x = 2$. Na reta $y = x$: centro $(2, 2)$. Raio $\sqrt{4 + 4} = 2\sqrt{2}$.
        $(x - 2)^2 + (y - 2)^2 = 8$.
      resposta: '$(x - 2)^2 + (y - 2)^2 = 8$'
    - enunciado: 'Uma antena em $(3, 4)$ alcança até 5 km de distância (eixos em km). A borda da região de alcance é uma circunferência.'
      itens:
      - 'Escreva a equação dessa circunferência.'
      - 'Determine os pontos em que ela corta os eixos.'
      espaco_item: 14
      resolucao: |
        (a) $(x - 3)^2 + (y - 4)^2 = 25$.
        (b) Eixo $x$ ($y = 0$): $(x - 3)^2 = 9$, $x = 0$ ou $x = 6$. Eixo $y$ ($x = 0$): $(y - 4)^2 = 16$, $y = 0$ ou $y = 8$. Pontos $(0, 0)$, $(6, 0)$ e $(0, 8)$.
      resposta: '(a) $(x - 3)^2 + (y - 4)^2 = 25$ (b) $(0, 0)$, $(6, 0)$, $(0, 8)$'
    - enunciado: 'Marque V se a equação representa uma circunferência e F se não representa.'
      afirmacoes:
      - '$x^2 + 2y^2 = 4$'
      - '$x^2 + y^2 + xy = 1$'
      - '$2x^2 + 2y^2 - 8 = 0$'
      - '$x^2 - y^2 = 1$'
      justificar: true
      espaco: 18
      resolucao: |
        (F) Coeficientes de $x^2$ e $y^2$ diferentes (é uma elipse). (F) Aparece o termo $xy$.
        (V) Dividindo por 2: $x^2 + y^2 = 4$, raio 2. (F) O sinal de $y^2$ é negativo (hipérbole).
      resposta: F, F, V, F
  - nome: Nível 3
    questoes:
    - enunciado: 'Mostre que $x^2 + y^2 + Dx + Ey + F = 0$ pode ser escrita como $\left(x + \frac{D}{2}\right)^2 + \left(y + \frac{E}{2}\right)^2 = \frac{D^2 + E^2 - 4F}{4}$ e conclua quando ela representa uma circunferência.'
      espaco: 18
      resolucao: |
        $x^2 + Dx = \left(x + \tfrac{D}{2}\right)^2 - \tfrac{D^2}{4}$ e $y^2 + Ey = \left(y + \tfrac{E}{2}\right)^2 - \tfrac{E^2}{4}$. Substituindo e passando os termos: $\left(x + \tfrac{D}{2}\right)^2 + \left(y + \tfrac{E}{2}\right)^2 = \tfrac{D^2 + E^2 - 4F}{4}$.
        É circunferência se $D^2 + E^2 - 4F > 0$, com centro $\left(-\tfrac{D}{2}, -\tfrac{E}{2}\right)$.
      resposta: '$D^2 + E^2 - 4F > 0$'
    - enunciado: 'Determine a circunferência do 1º quadrante, tangente aos dois eixos, cujo centro está na reta $x + y = 6$.'
      espaco: 14
      resolucao: |
        Tangente aos dois eixos no 1º quadrante: centro $(a, a)$ e raio $a$. Na reta: $2a = 6$, $a = 3$. $(x - 3)^2 + (y - 3)^2 = 9$.
      resposta: '$(x - 3)^2 + (y - 3)^2 = 9$'
    - enunciado: 'A circunferência de centro $(1, -2)$ passa por $(4, 2)$. Determine a sua equação e os pontos dela que têm abscissa 1.'
      espaco: 14
      resolucao: |
        Raio $\sqrt{9 + 16} = 5$: $(x - 1)^2 + (y + 2)^2 = 25$. Com $x = 1$: $(y + 2)^2 = 25$, $y = 3$ ou $y = -7$. Pontos $(1, 3)$ e $(1, -7)$ (extremos do diâmetro vertical).
      resposta: '$(1, 3)$ e $(1, -7)$'
    - enunciado: 'Determine os pontos da circunferência $x^2 + y^2 = 25$ cuja abscissa é o dobro da ordenada.'
      espaco: 12
      resolucao: |
        $x = 2y$: $4y^2 + y^2 = 25$, $y^2 = 5$, $y = \pm\sqrt{5}$. Pontos $(2\sqrt{5}, \sqrt{5})$ e $(-2\sqrt{5}, -\sqrt{5})$.
      resposta: '$(2\sqrt{5}, \sqrt{5})$ e $(-2\sqrt{5}, -\sqrt{5})$'
    - enunciado: 'Para a circunferência $x^2 + y^2 - 6x + 8y = 0$, determine o centro, o raio, o comprimento e a área do círculo. Mostre que ela passa pela origem.'
      espaco: 14
      resolucao: |
        $(x - 3)^2 + (y + 4)^2 = 25$: centro $(3, -4)$, raio 5. Comprimento $10\pi$ e área $25\pi$. Não há termo independente, então $(0, 0)$ satisfaz a equação.
      resposta: '$(3, -4)$; $5$; $10\pi$; $25\pi$'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Num jardim, um aspersor fica no ponto $(4, 3)$ de um sistema de eixos em metros e molha uma região circular de 5 m de raio. A figura mostra a borda da região molhada. O jardineiro quer cadastrar essa borda num aplicativo de irrigação, que pede a equação da circunferência.
    figura:
      tikz: |
        \begin{scope}[scale=.36]
        \draw[step=1, gray!25, very thin] (-2,-3) grid (10,9);
        \draw[-latex, ink!60] (-2.3,0) -- (10.4,0) node[right, font=\scriptsize] {$x$};
        \draw[-latex, ink!60] (0,-3.3) -- (0,9.4) node[above, font=\scriptsize] {$y$};
        \draw[roxo, line width=1pt] (4,3) circle (5);
        \fill[roxo] (4,3) circle (5pt);
        \draw[roxo, dashed] (4,3) -- (9,3) node[midway, above, font=\scriptsize] {$5$};
        \end{scope}
    enunciado: |
      A equação da borda da região molhada é
    opcoes: ['$(x - 4)^2 + (y - 3)^2 = 25$', '$(x + 4)^2 + (y + 3)^2 = 25$', '$(x - 4)^2 + (y - 3)^2 = 5$', '$(x - 3)^2 + (y - 4)^2 = 25$', '$x^2 + y^2 = 25$']
    correta: A
    resolucao: |
      Centro $(4, 3)$ e raio 5: $(x - 4)^2 + (y - 3)^2 = 5^2$. A alternativa C esquece de elevar o raio ao quadrado.

  - estilo: Fuvest
    enunciado: |
      O raio da circunferência $x^2 + y^2 - 6x + 2y - 6 = 0$ é
    opcoes: ['$\sqrt{6}$', '$4$', '$6$', '$8$', '$16$']
    correta: B
    resolucao: |
      $(x - 3)^2 + (y + 1)^2 = 6 + 9 + 1 = 16$: raio 4.

  - estilo: Unicamp
    enunciado: |
      O centro da circunferência $x^2 + y^2 + 4x - 10y + 4 = 0$ é
    opcoes: ['$(-2, 5)$.', '$(2, -5)$.', '$(4, -10)$.', '$(-4, 10)$.']
    correta: A
    resolucao: |
      $(x + 2)^2 + (y - 5)^2 = 25$: centro $(-2, 5)$ (e raio 5).

  - estilo: UEM
    enunciado: |
      Considere a circunferência $\lambda$: $(x - 1)^2 + (y + 2)^2 = 25$. Assinale o que for correto.
    proposicoes:
    - 'O centro de $\lambda$ é $(1, -2)$.'
    - 'O raio de $\lambda$ é 5.'
    - 'O ponto $(4, 2)$ pertence a $\lambda$.'
    - 'Uma equação geral de $\lambda$ é $x^2 + y^2 - 2x + 4y - 20 = 0$.'
    - 'A circunferência $\lambda$ passa pela origem.'
    corretas: [1, 2, 3, 4]
    resolucao: |
      04) $9 + 16 = 25$. 08) $x^2 - 2x + 1 + y^2 + 4y + 4 = 25$. 16) Incorreta: $1 + 4 = 5 \neq 25$.
      Soma: $01 + 02 + 04 + 08 = 15$.

  - estilo: Unesp
    texto: |
      A figura mostra uma circunferência de centro $C(-1, 2)$ que passa pelo ponto $P(2, 6)$.
    figura:
      tikz: |
        \begin{scope}[scale=.33]
        \draw[step=1, gray!25, very thin] (-7,-4) grid (5,8);
        \draw[-latex, ink!60] (-7.3,0) -- (5.4,0) node[right, font=\scriptsize] {$x$};
        \draw[-latex, ink!60] (0,-4.3) -- (0,8.4) node[above, font=\scriptsize] {$y$};
        \draw[roxo, line width=1pt] (-1,2) circle (5);
        \fill[roxo] (-1,2) circle (5pt) node[below left, font=\scriptsize] {$C$};
        \fill[ink] (2,6) circle (5pt) node[above right, font=\scriptsize] {$P$};
        \draw[ink, dashed] (-1,2) -- (2,6);
        \end{scope}
    enunciado: |
      Uma equação dessa circunferência é
    opcoes: ['$x^2 + y^2 - 2x + 4y - 20 = 0$', '$x^2 + y^2 + 2x - 4y + 5 = 0$', '$x^2 + y^2 + 2x - 4y - 25 = 0$', '$x^2 + y^2 - 20 = 0$', '$x^2 + y^2 + 2x - 4y - 20 = 0$']
    correta: E
    resolucao: |
      Raio $CP = \sqrt{9 + 16} = 5$. $(x + 1)^2 + (y - 2)^2 = 25$: $x^2 + 2x + 1 + y^2 - 4y + 4 = 25$, ou $x^2 + y^2 + 2x - 4y - 20 = 0$.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir.
    afirmativas:
    - 'A equação $x^2 + y^2 = 0$ representa apenas a origem.'
    - 'A equação $x^2 + y^2 + 1 = 0$ não representa ponto algum do plano.'
    - 'A circunferência de centro $(2, 0)$ e raio 2 passa pela origem.'
    - 'A circunferência $x^2 + y^2 - 4x = 0$ tem raio 4.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'II e IV, apenas.', 'I, II e III, apenas.', 'III e IV, apenas.', 'I, II, III e IV.']
    correta: C
    resolucao: |
      I. Correta: soma de quadrados nula. II. Correta: $x^2 + y^2 = -1$ é impossível. III. Correta: a distância do centro à origem é 2.
      IV. Incorreta: $(x - 2)^2 + y^2 = 4$, raio 2.

  - estilo: Fuvest
    enunciado: |
      A circunferência que tem como diâmetro o segmento de extremos $A(1, 1)$ e $B(7, 9)$ tem equação
    opcoes: ['$(x - 4)^2 + (y - 5)^2 = 100$', '$(x - 4)^2 + (y - 5)^2 = 25$', '$(x - 4)^2 + (y - 5)^2 = 10$', '$(x + 4)^2 + (y + 5)^2 = 25$', '$(x - 3)^2 + (y - 4)^2 = 25$']
    correta: B
    resolucao: |
      Centro: ponto médio $(4, 5)$. $AB = \sqrt{36 + 64} = 10$, raio 5. A alternativa A usa o diâmetro como raio.

  # ---------------- Nível 2 ----------------
  - estilo: Enem
    texto: |
      Um sistema de alarme usa três sensores de presença. Cada um detecta movimento dentro de um círculo, e o quadro mostra a equação da borda de cada região, num sistema de eixos em metros. O técnico quer saber qual sensor tem o maior alcance, isto é, o maior raio.
    tabela:
      cabecalho: ['Sensor', 'Borda da região']
      linhas:
      - ['A', '$x^2 + y^2 = 16$']
      - ['B', '$(x - 6)^2 + y^2 = 9$']
      - ['C', '$x^2 + y^2 - 4y - 21 = 0$']
    enunciado: |
      O sensor de maior alcance e o seu raio são
    opcoes: ['A, com raio 4.', 'B, com raio 3.', 'C, com raio 5.', 'C, com raio 21.', 'A, com raio 16.']
    correta: C
    resolucao: |
      A: raio 4. B: raio 3. C: $x^2 + (y - 2)^2 = 21 + 4 = 25$, raio 5.

  - estilo: Unicamp
    enunciado: |
      A equação $x^2 + y^2 - 2x + 6y + k = 0$ representa uma circunferência se, e somente se,
    opcoes: ['$k < 10$.', '$k > 10$.', '$k < 0$.', '$k \neq 10$.']
    correta: A
    resolucao: |
      $(x - 1)^2 + (y + 3)^2 = 10 - k$, que deve ser positivo: $k < 10$.

  - estilo: UFPR
    enunciado: |
      Considere a circunferência $\lambda$: $x^2 + y^2 - 8x - 6y = 0$. Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'A circunferência $\lambda$ passa pela origem.'
    - 'O centro de $\lambda$ é $(4, 3)$.'
    - 'A circunferência $\lambda$ corta o eixo $x$ no ponto $(8, 0)$.'
    - 'O comprimento de $\lambda$ é $25\pi$.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – F – V – F.', 'F – V – V – F.', 'V – V – F – V.', 'V – V – V – F.', 'V – V – V – V.']
    correta: D
    resolucao: |
      $(x - 4)^2 + (y - 3)^2 = 25$. (V) Sem termo independente. (V) (V) $y = 0$: $x^2 - 8x = 0$, $x = 0$ ou $8$. (F) Raio 5, comprimento $10\pi$.

  - estilo: UFSC
    enunciado: |
      Considere a circunferência $\lambda$: $x^2 + y^2 + 4x - 2y - 4 = 0$. Assinale o que for correto.
    proposicoes:
    - 'O centro de $\lambda$ é $(-2, 1)$.'
    - 'O raio de $\lambda$ é 3.'
    - 'A circunferência $\lambda$ corta o eixo $y$ em dois pontos.'
    - 'O ponto $(1, 1)$ pertence a $\lambda$.'
    - 'A área do círculo limitado por $\lambda$ é $9\pi$.'
    - 'A circunferência $\lambda$ não corta o eixo $x$.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      $(x + 2)^2 + (y - 1)^2 = 9$. 04) $x = 0$: $(y - 1)^2 = 5$, duas soluções. 08) $9 + 0 = 9$. 16) $\pi \cdot 9$.
      32) Incorreta: $y = 0$ dá $(x + 2)^2 = 8$, dois pontos.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Fuvest
    enunciado: |
      O raio da circunferência que passa pelos pontos $(0, 0)$, $(8, 0)$ e $(0, 6)$ é
    opcoes: ['$2$', '$3$', '$4$', '$4{,}5$', '$5$']
    correta: E
    resolucao: |
      O ângulo em $(0, 0)$ é reto, então a hipotenusa, de $(8, 0)$ a $(0, 6)$, com comprimento 10, é um diâmetro. Raio 5.

  - estilo: Unesp
    texto: |
      Uma pista de corrida circular foi representada num sistema de eixos, em metros, pela equação $x^2 + y^2 - 20x - 10y + 25 = 0$. Um atleta quer saber quantos metros percorre em cada volta completa.
    enunciado: |
      O comprimento de uma volta é
    opcoes: ['$10\pi$ m.', '$20\pi$ m.', '$100\pi$ m.', '$25\pi$ m.', '$5\pi$ m.']
    correta: B
    resolucao: |
      $(x - 10)^2 + (y - 5)^2 = 100 + 25 - 25 = 100$: raio 10, comprimento $2\pi \cdot 10 = 20\pi \approx 63$ m. $100\pi$ é a área.

  - estilo: Enem
    texto: |
      Uma praça circular tem o centro na origem de um sistema de eixos em metros. Um poste de iluminação foi instalado exatamente na borda da praça, no ponto $(6, 8)$. A prefeitura vai trocar o piso de toda a praça e precisa da sua área (use $\pi \approx 3{,}14$).
    enunciado: |
      A área da praça é de aproximadamente
    opcoes: ['100 m².', '157 m².', '200 m².', '250 m².', '314 m².']
    correta: E
    resolucao: |
      Raio $\sqrt{36 + 64} = 10$ m. Área $\pi \cdot 100 \approx 314$ m².

  # ---------------- Nível 3 ----------------
  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Um celular recebe sinal de duas antenas, A, no ponto $(0, 0)$, e B, no ponto $(8, 0)$, num mapa com eixos em quilômetros. Pela intensidade dos sinais, o sistema estima que o celular está a 5 km de cada antena. Assim, ele está nos pontos comuns às circunferências $x^2 + y^2 = 25$ e $(x - 8)^2 + y^2 = 25$.
    enunciado: |
      As posições possíveis do celular são
    opcoes: ['$(3, 4)$ ou $(3, -4)$.', '$(4, 3)$ ou $(4, -3)$.', '$(4, 0)$.', '$(5, 0)$ ou $(3, 0)$.', '$(4, 5)$ ou $(4, -5)$.']
    correta: B
    resolucao: |
      Subtraindo as equações: $x^2 - (x - 8)^2 = 0$, $16x - 64 = 0$, $x = 4$. Então $16 + y^2 = 25$, $y = \pm 3$.

  - estilo: Unicamp
    enunciado: |
      Sabendo que o celular também está a 5 km de uma terceira antena, C, no ponto $(0, 6)$, ele está em
    opcoes: ['$(4, 3)$.', '$(4, -3)$.', '$(0, 0)$.', '$(8, 6)$.']
    correta: A
    resolucao: |
      Distância de $(4, 3)$ a $C$: $\sqrt{16 + 9} = 5$. De $(4, -3)$ a $C$: $\sqrt{16 + 81} = \sqrt{97}$.

  - estilo: UEM
    enunciado: |
      Considere equações de circunferências. Assinale o que for correto.
    proposicoes:
    - 'Na equação $(x - a)^2 + (y - b)^2 = r^2$, com $r > 0$, o ponto $(a, b)$ é o centro.'
    - 'Se $D^2 + E^2 - 4F < 0$, a equação $x^2 + y^2 + Dx + Ey + F = 0$ não representa ponto algum.'
    - 'Se a equação $x^2 + y^2 + Dx + Ey = 0$ representa uma circunferência, ela passa pela origem.'
    - 'A equação $2x^2 + 2y^2 - 8x = 0$ não representa circunferência, porque os coeficientes de $x^2$ e $y^2$ não são 1.'
    - 'A circunferência $x^2 + y^2 = r^2$ tem comprimento $2\pi r$.'
    corretas: [1, 2, 3, 5]
    resolucao: |
      01) Correta. 02) Correta: o segundo membro, depois de completar quadrados, fica negativo. 04) Correta.
      08) Incorreta: dividindo por 2, $(x - 2)^2 + y^2 = 4$. 16) Correta.
      Soma: $01 + 02 + 04 + 16 = 23$.

  - estilo: Fuvest
    enunciado: |
      A circunferência de centro $(3, -4)$ que passa pela origem tem equação
    opcoes: ['$x^2 + y^2 + 6x - 8y = 0$', '$x^2 + y^2 - 6x + 8y - 25 = 0$', '$x^2 + y^2 - 3x + 4y = 0$', '$x^2 + y^2 - 6x + 8y = 0$', '$x^2 + y^2 = 25$']
    correta: D
    resolucao: |
      Raio 5: $(x - 3)^2 + (y + 4)^2 = 25$, isto é, $x^2 - 6x + 9 + y^2 + 8y + 16 = 25$: $x^2 + y^2 - 6x + 8y = 0$.

  - estilo: Enem
    texto: |
      Um paisagista desenhou um canteiro circular numa planta quadriculada, em que cada lado de quadradinho mede 1 m, como na figura. Ele precisa da área do canteiro para calcular a quantidade de terra adubada.
    figura:
      tikz: |
        \begin{scope}[scale=.42]
        \draw[step=1, gray!25, very thin] (0,0) grid (9,8);
        \draw[-latex, ink!60] (-0.3,0) -- (9.4,0) node[right, font=\scriptsize] {$x$};
        \draw[-latex, ink!60] (0,-0.3) -- (0,8.4) node[above, font=\scriptsize] {$y$};
        \fill[roxo!15] (5,4) circle (3);
        \draw[roxo, line width=1pt] (5,4) circle (3);
        \fill[roxo] (5,4) circle (4pt);
        \end{scope}
    enunciado: |
      A área do canteiro é
    opcoes: ['$3\pi$ m².', '$6\pi$ m².', '$9\pi$ m².', '$18\pi$ m².', '$36\pi$ m².']
    correta: C
    resolucao: |
      Pela figura, o centro é $(5, 4)$ e o círculo vai de $x = 2$ a $x = 8$: raio 3. Área $9\pi \approx 28$ m². $6\pi$ é o comprimento da borda.

  - estilo: Fuvest
    enunciado: |
      Os valores reais de $k$ para os quais a circunferência $x^2 + y^2 - 2kx + 4y + k^2 = 0$ tem raio 2 são
    opcoes: ['apenas $k = 0$', 'apenas $k = 2$', '$k = 2$ ou $k = -2$', 'todos os números reais', 'nenhum número real']
    correta: D
    resolucao: |
      $(x - k)^2 + (y + 2)^2 = k^2 + 4 - k^2 = 4$. O raio é 2 para qualquer $k$; só o centro, $(k, -2)$, se desloca.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere os pontos $A(1, 1)$, $B(5, 1)$ e $C(5, 5)$.'
    itens:
    - 'Usando mediatrizes, determine o centro da circunferência que passa por $A$, $B$ e $C$.'
    - 'Escreva a equação dessa circunferência.'
    - 'Verifique se $D(1, 5)$ também pertence a ela e explique o resultado.'
    espaco: 62
    resolucao: |
      a) Mediatriz de $AB$: $x = 3$. Mediatriz de $BC$: $y = 3$. Centro $(3, 3)$.
      b) Raio $\sqrt{4 + 4} = 2\sqrt{2}$: $(x - 3)^2 + (y - 3)^2 = 8$.
      c) $4 + 4 = 8$: pertence. $ABCD$ é um quadrado, e os quatro vértices estão na mesma circunferência, de centro no encontro das diagonais.
    resposta: 'a) $(3, 3)$; b) $(x - 3)^2 + (y - 3)^2 = 8$; c) sim'

  - estilo: Unicamp
    texto: |
      Três torres de transmissão estão nos pontos $(0, 0)$, $(6, 0)$ e $(6, 8)$ de um mapa com eixos em quilômetros. Quer-se instalar um repetidor no ponto equidistante das três, que é o centro da circunferência que passa por elas.
    enunciado: ''
    itens:
    - 'Substituindo os três pontos em $x^2 + y^2 + Dx + Ey + F = 0$, determine $D$, $E$ e $F$.'
    - 'Determine o centro e o raio.'
    - 'Uma quarta torre está em $(0, 8)$. Ela também fica a essa distância do repetidor?'
    espaco: 62
    resolucao: |
      a) $(0, 0)$: $F = 0$. $(6, 0)$: $36 + 6D = 0$, $D = -6$. $(6, 8)$: $100 - 36 + 8E = 0$, $E = -8$.
      b) $(x - 3)^2 + (y - 4)^2 = 25$: centro $(3, 4)$, raio 5 km.
      c) $(0 - 3)^2 + (8 - 4)^2 = 25$: sim (as quatro torres são vértices de um retângulo).
    resposta: 'a) $D = -6$, $E = -8$, $F = 0$; b) $(3, 4)$, 5 km; c) sim'

  - estilo: ITA
    enunciado: |
      A equação $x^2 + y^2 + mx + 2y + m = 0$ representa uma circunferência se, e somente se,
    opcoes: ['$m \neq 2$', '$m > 2$', '$m < 2$', '$m$ é qualquer real', '$m \neq 0$ e $m \neq 4$']
    correta: A
    espaco: 22
    resolucao: |
      $D^2 + E^2 - 4F = m^2 + 4 - 4m = (m - 2)^2 > 0 \iff m \neq 2$. Para $m = 2$, a equação representa só o ponto $(-1, -1)$.
    resposta: 'A'

  - estilo: Unesp
    texto: |
      Um aluno afirmou que a equação $x^2 + y^2 - 4x + 6y + 20 = 0$ representa a circunferência de centro $(2, -3)$ e raio $\sqrt{20}$.
    enunciado: ''
    itens:
    - 'Complete quadrados na equação.'
    - 'Explique por que a equação não representa circunferência alguma.'
    - 'Que valor deveria estar no lugar do 20 para que a equação representasse a circunferência de centro $(2, -3)$ e raio 3?'
    espaco: 62
    resolucao: |
      a) $(x - 2)^2 + (y + 3)^2 = -20 + 4 + 9 = -7$.
      b) Uma soma de quadrados não pode ser negativa: nenhum ponto satisfaz a equação. O aluno usou o termo independente como se fosse $r^2$.
      c) $4 + 9 - F = 9$: $F = 4$.
    resposta: 'a) $(x - 2)^2 + (y + 3)^2 = -7$; b) Ver resolução; c) $4$'

  - estilo: UFSC
    enunciado: |
      Considere as circunferências $\lambda_k$: $x^2 + y^2 - 2kx = 0$, com $k \neq 0$. Assinale o que for correto.
    proposicoes:
    - 'Para $k = 3$, o centro é $(3, 0)$.'
    - 'Todas as circunferências $\lambda_k$ passam pela origem.'
    - 'Para $k = -2$, o raio é $-2$.'
    - 'Todas as circunferências $\lambda_k$ têm centro no eixo $x$.'
    - 'Para $k = 5$, a circunferência passa pelo ponto $(10, 0)$.'
    - 'Para $k = 1$, o ponto $(1, 1)$ pertence à circunferência.'
    corretas: [1, 2, 4, 5, 6]
    espaco: 22
    resolucao: |
      $(x - k)^2 + y^2 = k^2$: centro $(k, 0)$ e raio $|k|$. 01), 02), 08) Corretas. 04) Incorreta: o raio é 2.
      16) $100 - 100 = 0$. 32) $1 + 1 - 2 = 0$.
    resposta: 'Soma 59 (01 + 02 + 08 + 16 + 32)'

  - estilo: Fuvest
    enunciado: 'Procuram-se as circunferências tangentes aos dois eixos coordenados, com centro no 1º quadrante, que passam pelo ponto $(2, 1)$.'
    itens:
    - 'Explique por que o centro é da forma $(a, a)$ e o raio é $a$.'
    - 'Monte e resolva a equação em $a$.'
    - 'Escreva as equações das circunferências.'
    espaco: 62
    resolucao: |
      a) Tangente ao eixo $x$: a distância do centro ao eixo, que é a ordenada, é igual ao raio. Tangente ao eixo $y$: a abscissa também. Então centro $(a, a)$ e raio $a > 0$.
      b) $(2 - a)^2 + (1 - a)^2 = a^2$: $a^2 - 6a + 5 = 0$, $a = 1$ ou $a = 5$.
      c) $(x - 1)^2 + (y - 1)^2 = 1$ e $(x - 5)^2 + (y - 5)^2 = 25$.
    resposta: 'c) $(x - 1)^2 + (y - 1)^2 = 1$ e $(x - 5)^2 + (y - 5)^2 = 25$'

  - estilo: Unicamp
    texto: |
      Um ponto $P$ gira em torno do ponto $C(2, 1)$, sempre a 5 m de distância. A sua posição no instante $t$ é $x = 2 + 5\cos t$ e $y = 1 + 5\operatorname{sen} t$.
    enunciado: ''
    itens:
    - 'Mostre que, em todo instante, $P$ está na circunferência $(x - 2)^2 + (y - 1)^2 = 25$.'
    - 'Escreva a equação geral dessa circunferência.'
    - 'Determine os pontos em que a trajetória corta o eixo $x$.'
    espaco: 62
    resolucao: |
      a) $(x - 2)^2 + (y - 1)^2 = 25\cos^2 t + 25\operatorname{sen}^2 t = 25$.
      b) $x^2 + y^2 - 4x - 2y - 20 = 0$.
      c) $y = 0$: $(x - 2)^2 = 24$, $x = 2 \pm 2\sqrt{6}$. Pontos $(2 + 2\sqrt{6}, 0)$ e $(2 - 2\sqrt{6}, 0)$.
    resposta: 'b) $x^2 + y^2 - 4x - 2y - 20 = 0$; c) $(2 \pm 2\sqrt{6}, 0)$'

  - estilo: Fuvest
    enunciado: |
      A área do círculo limitado pela circunferência $x^2 + y^2 - 4x + 6y - 3 = 0$ é
    opcoes: ['$3\pi$', '$4\pi$', '$13\pi$', '$16\pi$', '$64\pi$']
    correta: D
    espaco: 22
    resolucao: |
      $(x - 2)^2 + (y + 3)^2 = 3 + 4 + 9 = 16$: raio 4, área $16\pi$. Quem usa $r^2 = 3$ ou $r^2 = 13$ erra o completamento.
    resposta: 'D'

  - estilo: Unesp
    enunciado: 'Considere as circunferências $\lambda_1$: $x^2 + y^2 - 2x - 4y + 1 = 0$ e $\lambda_2$: $x^2 + y^2 - 2x - 4y - 11 = 0$.'
    itens:
    - 'Determine o centro e o raio de cada uma.'
    - 'Mostre que elas são concêntricas.'
    - 'Calcule a área da coroa circular entre elas.'
    espaco: 62
    resolucao: |
      a) $\lambda_1$: $(x - 1)^2 + (y - 2)^2 = 4$, centro $(1, 2)$, raio 2. $\lambda_2$: $(x - 1)^2 + (y - 2)^2 = 16$, centro $(1, 2)$, raio 4.
      b) Mesmo centro (as equações só diferem no termo independente).
      c) $\pi(16 - 4) = 12\pi$.
    resposta: 'a) $(1, 2)$; raios 2 e 4; c) $12\pi$'

  - estilo: Fuvest
    enunciado: 'Considere $A(-2, 0)$ e $B(2, 0)$ e os pontos $P(x, y)$ tais que $PA^2 + PB^2 = 26$.'
    itens:
    - 'Verifique que $(3, 0)$ e $(0, 3)$ satisfazem a condição.'
    - 'Mostre que a condição equivale a $x^2 + y^2 = 9$.'
    - 'Descreva o conjunto desses pontos.'
    espaco: 62
    resolucao: |
      a) $(3, 0)$: $25 + 1 = 26$. $(0, 3)$: $(4 + 9) + (4 + 9) = 26$.
      b) $(x + 2)^2 + y^2 + (x - 2)^2 + y^2 = 2x^2 + 2y^2 + 8 = 26$, isto é, $x^2 + y^2 = 9$.
      c) A circunferência de centro na origem (ponto médio de $AB$) e raio 3.
    resposta: 'c) circunferência de centro $(0, 0)$ e raio 3'
