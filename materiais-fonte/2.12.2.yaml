# Aula 2.12.2 — Trigonometria: ângulos notáveis e aplicações
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: seno, cosseno e tangente de 30°, 45° e 60° (dedução pelo triângulo equilátero e pelo quadrado);
# expressões com esses valores; alturas e distâncias (ângulo de elevação e de depressão); problemas com duas
# observações; figuras planas com ângulos notáveis (triângulo equilátero, hexágono, losango, trapézio).
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Quando precisar, use $\sqrt2 \approx 1{,}41$ e $\sqrt3 \approx 1{,}73$. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Complete a tabela dos ângulos notáveis.'
      tabela:
        cabecalho: ['', '$30^\circ$', '$45^\circ$', '$60^\circ$']
        linhas:
        - ['seno', '${{1/2}}$', '${{\sqrt2/2}}$', '${{\sqrt3/2}}$']
        - ['cosseno', '${{\sqrt3/2}}$', '${{\sqrt2/2}}$', '${{1/2}}$']
        - ['tangente', '${{\sqrt3/3}}$', '${{1}}$', '${{\sqrt3}}$']
      resolucao: |
        Os senos crescem ($\frac{1}{2}$, $\frac{\sqrt2}{2}$, $\frac{\sqrt3}{2}$) e os cossenos são os mesmos na ordem inversa; a tangente é seno sobre cosseno.
      resposta: 'sen: $\frac12$, $\frac{\sqrt2}{2}$, $\frac{\sqrt3}{2}$; cos: na ordem inversa; tg: $\frac{\sqrt3}{3}$, 1, $\sqrt3$'
    - enunciado: 'Associe cada expressão ao seu valor.'
      esquerda:
      - '$\operatorname{sen}30^\circ + \cos 60^\circ$'
      - '$\operatorname{tg}60^\circ \cdot \cos 60^\circ$'
      - '$\operatorname{sen}^2 45^\circ$'
      - '$2\operatorname{sen}45^\circ$'
      - '$2\cos 30^\circ$'
      direita:
      - '$\sqrt2$'
      - '$1$'
      - '$\sqrt3$'
      - '$\frac{1}{2}$'
      - '$\frac{\sqrt3}{2}$'
      resolucao: |
        $\frac12 + \frac12 = 1$; $\sqrt3 \cdot \frac12 = \frac{\sqrt3}{2}$; $\left(\frac{\sqrt2}{2}\right)^2 = \frac12$; $2 \cdot \frac{\sqrt2}{2} = \sqrt2$; $2 \cdot \frac{\sqrt3}{2} = \sqrt3$.
      resposta: 'De cima para baixo: 4, 1, 5, 3, 2'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - '$\operatorname{sen}30^\circ = \cos 60^\circ$.'
      - '$\operatorname{tg}45^\circ = 1$.'
      - '$\operatorname{sen}60^\circ = 2\operatorname{sen}30^\circ$.'
      - '$\operatorname{tg}30^\circ = \frac{\operatorname{sen}30^\circ}{\cos 30^\circ}$.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) Complementares. (V) (F) $\frac{\sqrt3}{2} \ne 1$: o seno não é proporcional ao ângulo. (V)
      resposta: V, V, F, V
    - enunciado: 'Complete.'
      itens:
      - 'Hipotenusa 14 e ângulo de $30^\circ$: cateto oposto ao $30^\circ$ = {{7}}'
      - 'No mesmo triângulo, cateto adjacente ao $30^\circ$ = {{7\sqrt3}}'
      - 'Triângulo retângulo isósceles de catetos 9: hipotenusa = {{9\sqrt2}}'
      espaco_item: 8
      resolucao: |
        $14 \cdot \frac12 = 7$; $14 \cdot \frac{\sqrt3}{2} = 7\sqrt3$; os ângulos agudos são de $45^\circ$: $\frac{9}{\cos 45^\circ} = 9\sqrt2$.
      resposta: '7; $7\sqrt3$; $9\sqrt2$'
    - enunciado: 'A rampa de um escorregador tem 4 m e faz $60^\circ$ com o chão. A que altura fica o topo da rampa?'
      espaco: 8
      resolucao: |
        $h = 4\operatorname{sen}60^\circ = 2\sqrt3 \approx 3{,}46$ m.
      resposta: '$2\sqrt3 \approx 3{,}46$ m'
    - enunciado: 'Uma pipa está presa a 30 m de linha esticada, que forma $45^\circ$ com o chão. Desprezando a altura de quem segura, calcule a altura da pipa.'
      espaco: 8
      resolucao: |
        $30\operatorname{sen}45^\circ = 15\sqrt2 \approx 21{,}2$ m.
      resposta: '$15\sqrt2 \approx 21{,}2$ m'
    - enunciado: 'A 12 m de uma árvore, uma pessoa vê o topo sob um ângulo de elevação de $30^\circ$. Desprezando a altura da pessoa, calcule a altura da árvore.'
      espaco: 8
      resolucao: |
        $h = 12\operatorname{tg}30^\circ = 12 \cdot \frac{\sqrt3}{3} = 4\sqrt3 \approx 6{,}9$ m.
      resposta: '$4\sqrt3 \approx 6{,}9$ m'
  - nome: Nível 2
    questoes:
    - texto: |
        Davi escreveu na prova: "$\operatorname{tg}60^\circ = \frac{\sqrt3}{2}$".
      enunciado: 'Encontre o erro e corrija.'
      espaco: 8
      resolucao: |
        $\frac{\sqrt3}{2}$ é o seno de $60^\circ$. A tangente é $\frac{\sqrt3/2}{1/2} = \sqrt3$.
      resposta: '$\sqrt3$'
    - enunciado: 'Use o seno de $60^\circ$ para calcular a altura de um triângulo equilátero de lado 10.'
      espaco: 8
      resolucao: |
        A altura é cateto oposto ao ângulo de $60^\circ$ num triângulo de hipotenusa 10: $10 \cdot \frac{\sqrt3}{2} = 5\sqrt3$.
      resposta: '$5\sqrt3$'
    - enunciado: 'De um ponto A, o topo de uma torre é visto a $30^\circ$. Andando 20 m em direção à torre, o ângulo passa a $60^\circ$. Calcule a altura da torre.'
      espaco: 12
      resolucao: |
        Com $d$ a distância final: $h = d\sqrt3$ e $h = (d + 20)\frac{\sqrt3}{3}$. Então $3d = d + 20$, $d = 10$ e $h = 10\sqrt3 \approx 17{,}3$ m.
      resposta: '$10\sqrt3$ m'
    - enunciado: 'A diagonal de um retângulo mede 12 e forma $30^\circ$ com a base. Complete.'
      itens:
      - 'Base: {{6\sqrt3}}'
      - 'Altura: {{6}}'
      - 'Área: {{36\sqrt3}}'
      espaco_item: 8
      resolucao: |
        Base $= 12\cos 30^\circ$ e altura $= 12\operatorname{sen}30^\circ$.
      resposta: '$6\sqrt3$; 6; $36\sqrt3$'
    - enunciado: 'Calcule $(\operatorname{sen}30^\circ + \cos 30^\circ)^2$.'
      espaco: 8
      resolucao: |
        $\left(\frac{1 + \sqrt3}{2}\right)^2 = \frac{4 + 2\sqrt3}{4} = 1 + \frac{\sqrt3}{2}$.
      resposta: '$1 + \frac{\sqrt3}{2}$'
    - enunciado: 'Um trapézio isósceles tem bases 10 e 4, e os ângulos da base maior medem $60^\circ$. Calcule a altura e os lados não paralelos.'
      espaco: 10
      resolucao: |
        Cada projeção lateral mede $\frac{10 - 4}{2} = 3$. Altura $= 3\operatorname{tg}60^\circ = 3\sqrt3$; lado $= \frac{3}{\cos 60^\circ} = 6$.
      resposta: 'Altura $3\sqrt3$; lados 6'
    - enunciado: 'Um poste de 6 m projeta sombra quando o Sol está a $30^\circ$ acima do horizonte. Calcule o comprimento da sombra.'
      espaco: 8
      resolucao: |
        $\operatorname{tg}30^\circ = \frac{6}{s}$: $s = \frac{6}{\sqrt3/3} = 6\sqrt3 \approx 10{,}4$ m.
      resposta: '$6\sqrt3 \approx 10{,}4$ m'
    - enunciado: 'Um losango tem lado 8 e um ângulo interno de $60^\circ$. Calcule as diagonais.'
      espaco: 10
      resolucao: |
        A diagonal menor fecha um triângulo equilátero: 8. A maior é o dobro da altura desse triângulo: $2 \cdot 4\sqrt3 = 8\sqrt3$.
      resposta: '8 e $8\sqrt3$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Dividindo um triângulo equilátero de lado 2 por uma altura, deduza $\operatorname{sen}30^\circ$, $\cos 30^\circ$ e $\operatorname{tg}30^\circ$.'
      espaco: 10
      resolucao: |
        A altura divide o lado em 1 e 1 e mede $\sqrt{4 - 1} = \sqrt3$. No triângulo de hipotenusa 2, o ângulo de $30^\circ$ tem oposto 1 e adjacente $\sqrt3$: $\frac12$, $\frac{\sqrt3}{2}$, $\frac{\sqrt3}{3}$.
      resposta: 'Ver resolução'
    - enunciado: 'Usando a diagonal de um quadrado de lado 1, deduza $\operatorname{sen}45^\circ$, $\cos 45^\circ$ e $\operatorname{tg}45^\circ$.'
      espaco: 10
      resolucao: |
        A diagonal mede $\sqrt2$ e forma $45^\circ$ com os lados: $\operatorname{sen}45^\circ = \cos 45^\circ = \frac{1}{\sqrt2} = \frac{\sqrt2}{2}$ e $\operatorname{tg}45^\circ = 1$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que $\operatorname{tg}30^\circ \cdot \operatorname{tg}60^\circ = 1$ sem usar os valores da tabela.'
      espaco: 10
      resolucao: |
        No mesmo triângulo retângulo, o oposto a $30^\circ$ é o adjacente a $60^\circ$ e vice-versa: o produto é $\frac{b}{c} \cdot \frac{c}{b} = 1$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que $\operatorname{sen}^2 30^\circ + \operatorname{sen}^2 60^\circ = 1$ de dois modos: com os valores e sem eles.'
      espaco: 10
      resolucao: |
        Com os valores: $\frac14 + \frac34 = 1$. Sem eles: $\operatorname{sen}60^\circ = \cos 30^\circ$, então a soma é $\operatorname{sen}^2 30^\circ + \cos^2 30^\circ = 1$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que, num triângulo retângulo com um ângulo de $30^\circ$, o cateto oposto a esse ângulo mede metade da hipotenusa.'
      espaco: 10
      resolucao: |
        Refletindo o triângulo no cateto adjacente ao $30^\circ$, forma-se um triângulo de ângulos $60^\circ$, $60^\circ$ e $60^\circ$: equilátero, de lado igual à hipotenusa. O cateto oposto é metade de um de seus lados.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Num resgate, o braço da escada de um caminhão de bombeiros tem 20 m e foi erguido até formar $60^\circ$ com a horizontal, como na figura. A base do braço fica a 2 m do chão. Os bombeiros precisam saber a que altura do chão chega a ponta da escada. Use $\sqrt3 \approx 1{,}73$.
    figura:
      tikz: |
        \begin{scope}[scale=.42]
        \fill[lilas] (-1.5,0) rectangle (2,1);
        \draw[ink] (-1.5,0) rectangle (2,1);
        \draw[mudo] (-2,0) -- (6,0);
        \draw[roxo, line width=1.2pt] (1,1) -- (4.5,7.06);
        \draw[mudo, dashed] (1,1) -- (5,1); \draw[mudo, dashed] (4.5,7.06) -- (4.5,0);
        \draw[roxo] (2,1) arc (0:60:1); \node[roxo, font=\scriptsize] at (2.35,1.65) {$60^\circ$};
        \node[left, font=\small] at (2.6,4.4) {$20$ m};
        \node[right, font=\scriptsize] at (4.5,.5) {$2$ m};
        \end{scope}
    enunciado: |
      A ponta da escada fica a uma altura de, aproximadamente,
    opcoes: ['$19{,}3$ m', '$12$ m', '$17{,}3$ m', '$22$ m', '$21{,}3$ m']
    correta: A
    resolucao: |
      $20\operatorname{sen}60^\circ \approx 17{,}3$ m, mais 2 m.

  - estilo: Fuvest
    enunciado: |
      O valor de $\operatorname{sen}30^\circ \cos 60^\circ + \operatorname{sen}60^\circ \cos 30^\circ$ é
    opcoes: ['$\frac{1}{2}$', '$1$', '$\frac{\sqrt3}{2}$', '$\frac{3}{4}$', '$\sqrt3$']
    correta: B
    resolucao: |
      $\frac14 + \frac34 = 1$.

  - estilo: Unicamp
    enunciado: |
      A hipotenusa de um triângulo retângulo isósceles mede 10. Cada cateto mede
    opcoes: ['$5$.', '$10\sqrt2$.', '$5\sqrt2$.', '$2\sqrt5$.']
    correta: C
    resolucao: |
      $10\cos 45^\circ = 5\sqrt2$.

  - estilo: UEM
    enunciado: |
      Considere os valores das razões trigonométricas dos ângulos notáveis. Assinale o que for correto.
    proposicoes:
    - '$\operatorname{sen}30^\circ = \frac{1}{2}$.'
    - '$\cos 45^\circ = \frac{\sqrt2}{2}$.'
    - '$\operatorname{tg}60^\circ = \sqrt3$.'
    - '$\operatorname{sen}60^\circ = \cos 30^\circ$.'
    - '$\operatorname{tg}30^\circ = \sqrt3$.'
    - '$\operatorname{sen}^2 60^\circ + \cos^2 60^\circ = 1$.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      16) Incorreta: $\operatorname{tg}30^\circ = \frac{\sqrt3}{3}$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      Um telhado de duas águas cobre um galpão de 8 m de largura. As duas águas são iguais e cada uma forma $30^\circ$ com a horizontal, como mostra a figura. Para comprar as telhas, o mestre de obras precisa do comprimento de cada água, do beiral até a cumeeira. Use $\sqrt3 \approx 1{,}73$.
    figura:
      tikz: |
        \begin{scope}[scale=.55]
        \fill[lilas] (0,0) -- (8,0) -- (4,2.31) -- cycle;
        \draw[ink, line width=.9pt] (0,0) -- (8,0) -- (4,2.31) -- cycle;
        \draw[mudo, dashed] (4,0) -- (4,2.31);
        \node[below, font=\small] at (4,0) {$8$ m};
        \draw[roxo] (1.1,0) arc (0:30:1.1); \node[roxo, font=\scriptsize] at (1.75,.32) {$30^\circ$};
        \draw[roxo] (6.9,0) arc (180:150:1.1); \node[roxo, font=\scriptsize] at (6.25,.32) {$30^\circ$};
        \end{scope}
    enunciado: |
      Cada água do telhado mede, aproximadamente,
    opcoes: ['$2{,}31$ m', '$4$ m', '$8$ m', '$4{,}62$ m', '$6{,}93$ m']
    correta: D
    resolucao: |
      $\cos 30^\circ = \frac{4}{x}$: $x = \frac{8\sqrt3}{3} \approx 4{,}62$ m.

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir.
    afirmativas:
    - '$\operatorname{tg}45^\circ = 1$.'
    - '$\operatorname{sen}30^\circ = 2\cos 60^\circ$.'
    - '$\cos 30^\circ = \operatorname{sen}60^\circ$.'
    - '$\operatorname{tg}60^\circ = 3\operatorname{tg}30^\circ$.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'I e III, apenas.', 'II e IV, apenas.', 'II, III e IV, apenas.', 'I, III e IV, apenas.']
    correta: E
    resolucao: |
      II. Incorreta: $2\cos 60^\circ = 1$. IV. $3 \cdot \frac{\sqrt3}{3} = \sqrt3$.

  - estilo: Unesp
    enunciado: |
      Um avião decola e sobe em linha reta, sob um ângulo constante de $30^\circ$ com a pista. Depois de percorrer 1 200 m nessa trajetória, sua altura é
    opcoes: ['$600$ m', '$1\,200$ m', '$600\sqrt3$ m', '$400\sqrt3$ m', '$300$ m']
    correta: A
    resolucao: |
      $1\,200\operatorname{sen}30^\circ = 600$ m.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      No triângulo ABC da figura, AH é a altura relativa ao lado BC e mede 6. Os ângulos em B e em C medem $45^\circ$ e $30^\circ$.
    figura:
      tikz: |
        \begin{scope}[scale=.42]
        \draw[ink, line width=.9pt] (0,0) -- (16.4,0) -- (6,6) -- cycle;
        \draw[mudo, dashed] (6,6) -- (6,0); \draw[mudo] (6,.5) -- (6.5,.5) -- (6.5,0);
        \node[below left, font=\small] at (0,0) {B}; \node[below right, font=\small] at (16.4,0) {C};
        \node[above, font=\small] at (6,6) {A}; \node[below, font=\small] at (6,0) {H};
        \node[right, font=\small] at (6,3) {$6$};
        \draw[roxo] (1.3,0) arc (0:45:1.3); \node[roxo, font=\scriptsize] at (2.15,.55) {$45^\circ$};
        \draw[roxo] (14.6,0) arc (180:150:1.8); \node[roxo, font=\scriptsize] at (13.6,.5) {$30^\circ$};
        \end{scope}
    enunciado: |
      A medida de BC é
    opcoes: ['$12$.', '$6 + 6\sqrt3$.', '$6\sqrt3$.', '$12\sqrt3$.']
    correta: B
    resolucao: |
      $BH = 6$ e $HC = \frac{6}{\operatorname{tg}30^\circ} = 6\sqrt3$.

  - estilo: Fuvest
    enunciado: |
      De um ponto A, no chão, avista-se o topo de uma torre sob um ângulo de $30^\circ$. Andando 20 m em direção à torre, chega-se a um ponto B, de onde o topo é visto sob $45^\circ$. A altura da torre, em metros, é
    opcoes: ['$10(\sqrt3 - 1)$', '$20$', '$10(\sqrt3 + 1)$', '$20\sqrt3$', '$10\sqrt3$']
    correta: C
    resolucao: |
      $h = d$ e $h = (d + 20)\frac{\sqrt3}{3}$: $d\sqrt3 = d + 20$, $h = d = 10(\sqrt3 + 1)$.

  - estilo: UFSC
    enunciado: |
      Considere um triângulo equilátero de lado 6. Assinale o que for correto.
    proposicoes:
    - 'A altura do triângulo mede $3\sqrt3$.'
    - 'A área do triângulo é $9\sqrt3$.'
    - 'Uma altura divide o triângulo em dois triângulos retângulos de ângulos agudos $30^\circ$ e $60^\circ$.'
    - '$\operatorname{sen}60^\circ$ é a razão entre a altura e o lado.'
    - 'O raio da circunferência inscrita mede $\sqrt3$.'
    - 'O perímetro do triângulo é $6\sqrt3$.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) $6\operatorname{sen}60^\circ$. 02) $\frac{6 \cdot 3\sqrt3}{2}$. 16) Um terço da altura. 32) Incorreta: 18.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      Num parque de aventura, uma tirolesa usa um cabo reto de 50 m, esticado entre o alto de uma plataforma e um ponto mais baixo do terreno. O cabo forma $30^\circ$ com a horizontal. O instrutor quer informar aos visitantes o desnível vencido na descida, isto é, a diferença de altura entre as duas pontas do cabo.
    enunciado: |
      O desnível é de
    opcoes: ['$25$ m', '$43{,}3$ m', '$50$ m', '$28{,}9$ m', '$12{,}5$ m']
    correta: A
    resolucao: |
      $50\operatorname{sen}30^\circ = 25$ m.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - '$\operatorname{sen}45^\circ = \cos 45^\circ$.'
    - '$\operatorname{tg}30^\circ > \operatorname{tg}60^\circ$.'
    - '$2\operatorname{sen}30^\circ = 1$.'
    - '$\operatorname{sen}60^\circ = \sqrt3 \cos 60^\circ$.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – F – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – V – F.', 'V – F – V – V.']
    correta: E
    resolucao: |
      (V) (F) $\frac{\sqrt3}{3} < \sqrt3$. (V) (V) $\sqrt3 \cdot \frac12 = \frac{\sqrt3}{2}$.

  - estilo: Enem
    texto: |
      Para estimar a altura de um morro, um topógrafo se posicionou num ponto do terreno plano a 200 m, na horizontal, da vertical que passa pelo cume. Dali, ele viu o cume sob um ângulo de elevação de $60^\circ$, como mostra a figura. Ele desprezou a altura do aparelho e usou $\sqrt3 \approx 1{,}73$.
    figura:
      tikz: |
        \begin{scope}[scale=.5]
        \fill[lilas] (1.8,0) .. controls (3.2,.6) and (4,4.2) .. (4.6,5.2) .. controls (5.4,4.2) and (6.5,1) .. (9,0) -- cycle;
        \draw[ink] (1.8,0) .. controls (3.2,.6) and (4,4.2) .. (4.6,5.2) .. controls (5.4,4.2) and (6.5,1) .. (9,0);
        \draw[mudo] (-4,0) -- (9,0);
        \draw[roxo, line width=.9pt] (-3,0) -- (4.6,5.2);
        \draw[mudo, dashed] (4.6,5.2) -- (4.6,0);
        \fill[ink] (-3,0) circle (2pt);
        \node[below, font=\small] at (.8,0) {$200$ m};
        \draw[roxo] (-2,0) arc (0:55:1); \node[roxo, font=\scriptsize] at (-1.55,.62) {$60^\circ$};
        \end{scope}
    enunciado: |
      A altura do morro, em relação ao terreno, é de aproximadamente
    opcoes: ['$115$ m', '$200$ m', '$231$ m', '$346$ m', '$400$ m']
    correta: D
    resolucao: |
      $h = 200\operatorname{tg}60^\circ = 200\sqrt3 \approx 346$ m.

  - estilo: Unesp
    enunciado: |
      A área de um triângulo retângulo de hipotenusa 8 com um ângulo agudo de $30^\circ$ é
    opcoes: ['$16\sqrt3$', '$8\sqrt3$', '$16$', '$4\sqrt3$', '$32$']
    correta: B
    resolucao: |
      Catetos 4 e $4\sqrt3$: área $8\sqrt3$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Um losango tem lado 10 e um ângulo interno de $60^\circ$. Assinale o que for correto.
    proposicoes:
    - 'A diagonal menor mede 10.'
    - 'A diagonal maior mede $10\sqrt3$.'
    - 'A área do losango é $50\sqrt3$.'
    - 'A altura do losango mede $5\sqrt3$.'
    - 'O perímetro do losango é $40\sqrt3$.'
    - 'As diagonais do losango são perpendiculares.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) Equilátero. 02) $2 \cdot 5\sqrt3$. 04) $\frac{10 \cdot 10\sqrt3}{2}$. 08) $10\operatorname{sen}60^\circ$. 16) Incorreta: 40.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Unicamp
    enunciado: |
      O valor de $\operatorname{sen}^2 30^\circ + \cos^2 45^\circ + \operatorname{tg}^2 60^\circ$ é
    opcoes: ['$\frac{15}{4}$.', '$3$.', '$\frac{13}{4}$.', '$\frac{7}{2}$.']
    correta: A
    resolucao: |
      $\frac14 + \frac12 + 3 = \frac{15}{4}$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Uma ladeira reta de uma cidade tem inclinação de $30^\circ$ em relação à horizontal. Um ciclista sobe 400 m dessa ladeira, medidos ao longo da própria rua, e um aplicativo de treino quer registrar quanto ele subiu e quanto avançou na horizontal. Use $\sqrt3 \approx 1{,}73$.
    enunciado: |
      O desnível vencido pelo ciclista foi de
    opcoes: ['$400$ m', '$346$ m', '$200$ m', '$231$ m', '$100$ m']
    correta: C
    resolucao: |
      $400\operatorname{sen}30^\circ = 200$ m.

  - estilo: Unesp
    enunciado: |
      O deslocamento horizontal do ciclista foi de, aproximadamente,
    opcoes: ['$200$ m', '$231$ m', '$400$ m', '$346$ m', '$800$ m']
    correta: D
    resolucao: |
      $400\cos 30^\circ = 200\sqrt3 \approx 346$ m.

  - estilo: Fuvest
    enunciado: |
      No triângulo ABC, os ângulos B e C medem $45^\circ$ e $30^\circ$, e AC mede 8. A medida de AB é
    opcoes: ['$4$', '$8\sqrt2$', '$4\sqrt3$', '$8$', '$4\sqrt2$']
    correta: E
    resolucao: |
      Altura por A: $8\operatorname{sen}30^\circ = 4$; $AB = \frac{4}{\operatorname{sen}45^\circ} = 4\sqrt2$.

  - estilo: Unesp
    texto: |
      A figura mostra um hexágono regular de lado 4 e uma de suas diagonais menores.
    figura:
      tikz: |
        \begin{scope}[scale=.55]
        \draw[ink, line width=.9pt] (0:2) -- (60:2) -- (120:2) -- (180:2) -- (240:2) -- (300:2) -- cycle;
        \draw[roxo, line width=1pt] (60:2) -- (180:2);
        \node[right, font=\small] at (330:1.85) {$4$};
        \end{scope}
    enunciado: |
      A medida dessa diagonal é
    opcoes: ['$8$', '$4\sqrt3$', '$4\sqrt2$', '$6$', '$2\sqrt3$']
    correta: B
    resolucao: |
      Triângulo isósceles de lados 4 e ângulo de $120^\circ$: $2 \cdot 4\operatorname{sen}60^\circ = 4\sqrt3$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Dois observadores, A e B, estão em lados opostos de uma torre, alinhados com a base, a 100 m um do outro. A vê o topo sob $30^\circ$ e B, sob $60^\circ$.'
    itens:
    - 'Escreva as distâncias de A e de B até a base em função da altura $h$.'
    - 'Calcule $h$.'
    - 'Calcule as duas distâncias.'
    espaco: 62
    resolucao: |
      a) $d_A = \frac{h}{\operatorname{tg}30^\circ} = h\sqrt3$ e $d_B = \frac{h}{\operatorname{tg}60^\circ} = \frac{h\sqrt3}{3}$.
      b) $h\sqrt3 + \frac{h\sqrt3}{3} = \frac{4h\sqrt3}{3} = 100$: $h = 25\sqrt3 \approx 43{,}3$ m.
      c) $d_A = 75$ m e $d_B = 25$ m.
    resposta: 'b) $25\sqrt3$ m; c) 75 m e 25 m'

  - estilo: Unicamp
    enunciado: 'Considere um hexágono regular de lado 6.'
    itens:
    - 'Calcule sua área, dividindo-o em triângulos equiláteros.'
    - 'Calcule a diagonal maior e a diagonal menor.'
    - 'Calcule o apótema (distância do centro a um lado).'
    espaco: 62
    resolucao: |
      a) Seis triângulos de lado 6 e altura $3\sqrt3$: $6 \cdot \frac{6 \cdot 3\sqrt3}{2} = 54\sqrt3$.
      b) Maior: 12. Menor: $2 \cdot 6\operatorname{sen}60^\circ = 6\sqrt3$.
      c) A altura de um dos triângulos: $3\sqrt3$.
    resposta: 'a) $54\sqrt3$; b) 12 e $6\sqrt3$; c) $3\sqrt3$'

  - estilo: ITA
    enunciado: |
      O valor de $(\operatorname{sen}45^\circ + \cos 45^\circ)^2 + (\operatorname{tg}60^\circ - \operatorname{tg}30^\circ)^2$ é
    opcoes: ['$\frac{10}{3}$', '$3$', '$\frac{8}{3}$', '$4$', '$\frac{7}{3}$']
    correta: A
    espaco: 22
    resolucao: |
      $(\sqrt2)^2 + \left(\frac{2\sqrt3}{3}\right)^2 = 2 + \frac43 = \frac{10}{3}$.
    resposta: 'A'

  - estilo: Unesp
    enunciado: 'Um triângulo isósceles tem os dois lados iguais medindo 10 e o ângulo entre eles de $120^\circ$.'
    itens:
    - 'Quanto medem os ângulos da base?'
    - 'Calcule a altura relativa à base e a base.'
    - 'Calcule a área.'
    espaco: 62
    resolucao: |
      a) $\frac{180^\circ - 120^\circ}{2} = 30^\circ$ cada.
      b) Altura $= 10\operatorname{sen}30^\circ = 5$; meia base $= 10\cos 30^\circ = 5\sqrt3$, base $10\sqrt3$.
      c) $\frac{10\sqrt3 \cdot 5}{2} = 25\sqrt3$.
    resposta: 'b) 5 e $10\sqrt3$; c) $25\sqrt3$'

  - estilo: UFSC
    enunciado: |
      Assinale o que for correto.
    proposicoes:
    - '$\operatorname{sen}30^\circ + \operatorname{sen}60^\circ > 1$.'
    - '$\operatorname{tg}30^\circ \cdot \operatorname{tg}60^\circ = 1$.'
    - '$\cos^2 30^\circ - \operatorname{sen}^2 30^\circ = \frac{1}{2}$.'
    - '$2\operatorname{sen}30^\circ\cos 30^\circ = \operatorname{sen}60^\circ$.'
    - 'O seno do dobro de $30^\circ$ é o dobro de $\operatorname{sen}30^\circ$.'
    - '$\sqrt2 \operatorname{sen}45^\circ = 1$.'
    corretas: [1, 2, 3, 4, 6]
    espaco: 22
    resolucao: |
      01) $\frac{1 + \sqrt3}{2} \approx 1{,}37$. 02) Correta. 04) $\frac34 - \frac14$. 08) $2 \cdot \frac12 \cdot \frac{\sqrt3}{2} = \frac{\sqrt3}{2}$. 16) Incorreta: $\frac{\sqrt3}{2} \ne 1$. 32) $\sqrt2 \cdot \frac{\sqrt2}{2} = 1$.
    resposta: 'Soma 47 (01 + 02 + 04 + 08 + 32)'

  - estilo: Fuvest
    enunciado: 'Um avião voa em linha reta e horizontal, a 3 000 m de altura, aproximando-se de um observador no chão. Num instante, o observador o vê sob ângulo de elevação de $30^\circ$; 20 segundos depois, sob $60^\circ$.'
    itens:
    - 'Calcule a distância horizontal do avião ao observador em cada instante.'
    - 'Calcule a distância percorrida nesses 20 s.'
    - 'Estime a velocidade do avião em km/h. Use $\sqrt3 \approx 1{,}73$.'
    espaco: 62
    resolucao: |
      a) $\frac{3\,000}{\operatorname{tg}30^\circ} = 3\,000\sqrt3$ m e $\frac{3\,000}{\operatorname{tg}60^\circ} = 1\,000\sqrt3$ m.
      b) $2\,000\sqrt3 \approx 3\,460$ m.
      c) $\frac{3\,460}{20} = 173$ m/s $\approx 623$ km/h.
    resposta: 'b) $2\,000\sqrt3$ m; c) cerca de 620 km/h'

  - estilo: Unicamp
    enunciado: 'Considere um triângulo equilátero de lado $\ell$.'
    itens:
    - 'Mostre que sua altura mede $\frac{\ell\sqrt3}{2}$.'
    - 'Mostre que sua área é $\frac{\ell^2\sqrt3}{4}$.'
    - 'Sabendo que o centro do triângulo fica a $\frac{1}{3}$ da altura a partir de cada lado, calcule o raio das circunferências inscrita e circunscrita.'
    espaco: 62
    resolucao: |
      a) $h = \ell\operatorname{sen}60^\circ = \frac{\ell\sqrt3}{2}$.
      b) $\frac{\ell \cdot h}{2} = \frac{\ell^2\sqrt3}{4}$.
      c) Inscrita: $\frac{h}{3} = \frac{\ell\sqrt3}{6}$; circunscrita: $\frac{2h}{3} = \frac{\ell\sqrt3}{3}$.
    resposta: 'c) $\frac{\ell\sqrt3}{6}$ e $\frac{\ell\sqrt3}{3}$'

  - estilo: Fuvest
    enunciado: |
      No triângulo ABC, retângulo em A, o ângulo B mede $60^\circ$ e a altura AH, relativa à hipotenusa, mede 6. A hipotenusa BC mede
    opcoes: ['$12$', '$8\sqrt3$', '$6\sqrt3$', '$16$', '$4\sqrt3$']
    correta: B
    espaco: 22
    resolucao: |
      $AB = \frac{6}{\operatorname{sen}60^\circ} = 4\sqrt3$ e $AC = \frac{6}{\operatorname{sen}30^\circ} = 12$. $BC = \sqrt{48 + 144} = 8\sqrt3$.
    resposta: 'B'

  - estilo: Unesp
    enunciado: 'Um poste de 10 m projeta uma sombra no chão plano. Às 9 h, o Sol está a $30^\circ$ acima do horizonte; ao meio-dia, a $60^\circ$.'
    itens:
    - 'Calcule o comprimento da sombra às 9 h.'
    - 'Calcule o comprimento da sombra ao meio-dia.'
    - 'Quanto a sombra encolheu? Dê o valor exato e o aproximado.'
    espaco: 62
    resolucao: |
      a) $\frac{10}{\operatorname{tg}30^\circ} = 10\sqrt3 \approx 17{,}3$ m.
      b) $\frac{10}{\operatorname{tg}60^\circ} = \frac{10\sqrt3}{3} \approx 5{,}8$ m.
      c) $\frac{20\sqrt3}{3} \approx 11{,}5$ m.
    resposta: 'c) $\frac{20\sqrt3}{3} \approx 11{,}5$ m'

  - estilo: Fuvest
    enunciado: 'Seja ABC um triângulo retângulo em C, com $\hat{B} = 30^\circ$ e $AC = 1$. Prolongue CB até D, de modo que $BD = BA$.'
    itens:
    - 'Calcule BC e AB e mostre que o ângulo $A\hat{D}C$ mede $15^\circ$.'
    - 'Conclua que $\operatorname{tg}15^\circ = 2 - \sqrt3$ e que $\operatorname{tg}75^\circ = 2 + \sqrt3$.'
    - 'Mostre que $AD = \sqrt6 + \sqrt2$ e calcule $\operatorname{sen}15^\circ$.'
    espaco: 62
    resolucao: |
      a) $BC = \sqrt3$ e $AB = 2$. O triângulo ABD é isósceles com ângulo externo de $30^\circ$ em B, então $\hat{D} = 15^\circ$.
      b) $\operatorname{tg}15^\circ = \frac{AC}{CD} = \frac{1}{2 + \sqrt3} = 2 - \sqrt3$; $75^\circ$ é o complementar: $\operatorname{tg}75^\circ = \frac{1}{\operatorname{tg}15^\circ} = 2 + \sqrt3$.
      c) $AD^2 = 1 + (2 + \sqrt3)^2 = 8 + 4\sqrt3 = (\sqrt6 + \sqrt2)^2$. $\operatorname{sen}15^\circ = \frac{1}{\sqrt6 + \sqrt2} = \frac{\sqrt6 - \sqrt2}{4}$.
    resposta: 'b) $2 - \sqrt3$ e $2 + \sqrt3$; c) $\frac{\sqrt6 - \sqrt2}{4}$'
