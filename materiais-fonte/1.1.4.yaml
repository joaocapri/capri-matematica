padrao: 3
fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Simplifique sempre os resultados. O gabarito resolvido está no final.
  secoes:
    - nome: Fácil
      questoes:
        - enunciado: 'Com denominadores iguais, some ou subtraia os numeradores e mantenha o denominador. Complete.'
          itens:
            - '$\tfrac27+\tfrac37={{\tfrac57}}$'
            - '$\tfrac59-\tfrac29={{\tfrac39}}={{\tfrac13}}$'
            - '$\tfrac38+\tfrac18={{\tfrac48}}={{\tfrac12}}$'
          resolucao: |
            $\tfrac{2+3}{7}=\tfrac57$; $\ \tfrac{5-2}{9}=\tfrac39=\tfrac13$; $\ \tfrac{3+1}{8}=\tfrac48=\tfrac12$.
          resposta: '$\tfrac57$; $\ \tfrac13$; $\ \tfrac12$'
        - enunciado: 'Calcule. Primeiro deixe as frações com o mesmo denominador.'
          itens: ['$\tfrac12+\tfrac13$', '$\tfrac34-\tfrac16$', '$\tfrac25+\tfrac3{10}$', '$\tfrac56-\tfrac14$']
          colunas: 2
          espaco_item: 16
          resolucao: |
            (a) $\tfrac36+\tfrac26=\tfrac56$. (b) $\tfrac9{12}-\tfrac2{12}=\tfrac7{12}$.
            (c) $\tfrac4{10}+\tfrac3{10}=\tfrac7{10}$. (d) $\tfrac{10}{12}-\tfrac3{12}=\tfrac7{12}$.
          resposta: '(a) $\tfrac56$ (b) $\tfrac7{12}$ (c) $\tfrac7{10}$ (d) $\tfrac7{12}$'
        - enunciado: 'Complete a tabela. Para dividir, multiplique pelo inverso da segunda fração.'
          tabela:
            cabecalho: ['$a$', '$b$', '$a\cdot b$', '$a:b$']
            linhas:
              - ['$\tfrac23$', '$\tfrac34$', '{{\tfrac12}}', '{{\tfrac89}}']
              - ['$\tfrac56$', '$\tfrac25$', '{{\tfrac13}}', '{{\tfrac{25}{12}}}']
              - ['$\tfrac37$', '$3$', '{{\tfrac97}}', '{{\tfrac17}}']
          resolucao: |
            $\tfrac23\cdot\tfrac34=\tfrac6{12}=\tfrac12$; $\ \tfrac23\cdot\tfrac43=\tfrac89$.
            $\tfrac56\cdot\tfrac25=\tfrac{10}{30}=\tfrac13$; $\ \tfrac56\cdot\tfrac52=\tfrac{25}{12}$.
            $\tfrac37\cdot3=\tfrac97$; $\ \tfrac37\cdot\tfrac13=\tfrac17$.
          resposta: '$\tfrac12,\tfrac89$; $\ \tfrac13,\tfrac{25}{12}$; $\ \tfrac97,\tfrac17$'
        - enunciado: 'Marque V (verdadeiro) ou F (falso).'
          afirmacoes:
            - '$\tfrac12+\tfrac13=\tfrac25$.'
            - '$\tfrac23\cdot\tfrac32=1$.'
            - 'Dividir por $\tfrac12$ é o mesmo que multiplicar por $2$.'
            - '$\tfrac34$ de $20$ é $15$.'
            - 'A metade de $\tfrac12$ é $1$.'
          justificar: true
          espaco: 16
          resolucao: |
            (F) Não se somam denominadores: $\tfrac36+\tfrac26=\tfrac56$. (V) Uma fração vezes a inversa dá $1$.
            (V) O inverso de $\tfrac12$ é $2$. (V) $20:4\cdot3=15$. (F) $\tfrac12\cdot\tfrac12=\tfrac14$.
          resposta: 'F, V, V, V, F'
        - enunciado: 'Associe cada operação ao seu resultado.'
          esquerda: ['$\tfrac14$', '$\tfrac12$', '$\tfrac34$']
          direita: ['$\tfrac12\cdot\tfrac12$', '$\tfrac14+\tfrac14$', '$1-\tfrac14$', '$\tfrac38:\tfrac34$', '$\tfrac12+\tfrac14$', '$\tfrac34\cdot\tfrac13$']
          resolucao: |
            $\tfrac14$; $\ \tfrac24=\tfrac12$; $\ \tfrac34$; $\ \tfrac38\cdot\tfrac43=\tfrac12$; $\ \tfrac34$; $\ \tfrac3{12}=\tfrac14$.
          resposta: 'De cima para baixo: $1,\ 2,\ 3,\ 2,\ 3,\ 1$'
        - enunciado: 'Calcule.'
          itens: ['$\tfrac23$ de $60$', '$\tfrac35$ de $45$', '$\tfrac58$ de $120$', '$\tfrac14$ de $\tfrac13$']
          colunas: 2
          espaco_item: 12
          resolucao: |
            “De” indica multiplicação. (a) $60:3\cdot2=40$. (b) $45:5\cdot3=27$. (c) $120:8\cdot5=75$. (d) $\tfrac14\cdot\tfrac13=\tfrac1{12}$.
          resposta: '(a) $40$ (b) $27$ (c) $75$ (d) $\tfrac1{12}$'
        - enunciado: 'Bia leu $\tfrac13$ de um livro na segunda-feira e $\tfrac25$ na terça. Que fração do livro ela já leu? Quanto falta?'
          espaco: 22
          resolucao: |
            $\tfrac13+\tfrac25=\tfrac5{15}+\tfrac6{15}=\tfrac{11}{15}$. Falta $1-\tfrac{11}{15}=\tfrac4{15}$.
          resposta: 'Leu $\tfrac{11}{15}$; faltam $\tfrac4{15}$'
    - nome: Médio
      questoes:
        - enunciado: 'Calcule $\tfrac23+\tfrac54-\tfrac16$ completando os passos.'
          itens:
            - 'O menor denominador comum de $3$, $4$ e $6$ é ${{12}}$.'
            - '$\tfrac23=\dfrac{ {{8}} }{12}$, $\ \tfrac54=\dfrac{ {{15}} }{12}$, $\ \tfrac16=\dfrac{ {{2}} }{12}$'
            - 'Resultado: $\dfrac{ {{21}} }{12}={{\tfrac74}}$'
          resolucao: |
            $\tfrac8{12}+\tfrac{15}{12}-\tfrac2{12}=\tfrac{21}{12}=\tfrac74$.
          resposta: '$\tfrac74$'
        - enunciado: 'Calcule.'
          itens: ['$\left(\tfrac12+\tfrac13\right)\cdot\tfrac65$', '$\tfrac34:\left(\tfrac12-\tfrac18\right)$']
          colunas: 2
          espaco_item: 20
          resolucao: |
            (a) $\tfrac56\cdot\tfrac65=1$. (b) $\tfrac12-\tfrac18=\tfrac38$ e $\tfrac34:\tfrac38=\tfrac34\cdot\tfrac83=2$.
          resposta: '(a) $1$ (b) $2$'
        - texto: |
            Léo fez assim: $\tfrac23+\tfrac14=\tfrac{2+1}{3+4}=\tfrac37$.
          enunciado: 'Explique o erro de Léo e faça a conta certa.'
          espaco: 22
          resolucao: |
            Não se somam os denominadores: os pedaços têm tamanhos diferentes. É preciso igualar os denominadores.
            $\tfrac8{12}+\tfrac3{12}=\tfrac{11}{12}$. Repare que $\tfrac37$ é menor que $\tfrac23$, o que já mostra que está errado.
          resposta: '$\tfrac{11}{12}$'
        - enunciado: 'Calcule e dê a resposta na forma mista.'
          itens: ['$2\tfrac12+1\tfrac34$', '$3\tfrac13-1\tfrac12$']
          colunas: 2
          espaco_item: 20
          resolucao: |
            (a) $\tfrac52+\tfrac74=\tfrac{10}4+\tfrac74=\tfrac{17}4=4\tfrac14$.
            (b) $\tfrac{10}3-\tfrac32=\tfrac{20}6-\tfrac96=\tfrac{11}6=1\tfrac56$.
          resposta: '(a) $4\tfrac14$ (b) $1\tfrac56$'
        - enunciado: 'Uma caixa-d’água estava com $\tfrac34$ da capacidade e recebeu mais $\tfrac16$ da capacidade. Que fração ficou cheia? Que fração ainda falta para encher?'
          resolucao: |
            $\tfrac34+\tfrac16=\tfrac9{12}+\tfrac2{12}=\tfrac{11}{12}$. Falta $\tfrac1{12}$.
          resposta: '$\tfrac{11}{12}$; falta $\tfrac1{12}$'
        - enunciado: 'Uma receita para $4$ pessoas leva $\tfrac23$ de xícara de leite. Quanto leite é preciso para $6$ pessoas?'
          resolucao: |
            Para $6$ pessoas, a receita é multiplicada por $\tfrac64=\tfrac32$: $\tfrac23\cdot\tfrac32=1$ xícara.
          resposta: '$1$ xícara'
        - enunciado: 'Quantos copos de $\tfrac14$ de litro dá para encher com $3\tfrac12$ litros de suco?'
          resolucao: |
            $3\tfrac12=\tfrac72$ e $\tfrac72:\tfrac14=\tfrac72\cdot4=14$ copos.
          resposta: '$14$ copos'
        - enunciado: 'Num terreno, $\tfrac25$ da área foram construídos, e $\tfrac13$ do restante virou jardim. Que fração do terreno é jardim? Que fração ficou livre?'
          resolucao: |
            Restante: $1-\tfrac25=\tfrac35$. Jardim: $\tfrac13$ de $\tfrac35=\tfrac15$.
            Livre: $1-\tfrac25-\tfrac15=\tfrac25$.
          resposta: 'Jardim $\tfrac15$; livre $\tfrac25$'
    - nome: Difícil
      questoes:
        - enunciado: 'Calcule $\left[\tfrac12+\tfrac13\cdot\left(\tfrac34-\tfrac12\right)\right]:\tfrac58$.'
          resolucao: |
            $\tfrac34-\tfrac12=\tfrac14$; $\ \tfrac13\cdot\tfrac14=\tfrac1{12}$; $\ \tfrac12+\tfrac1{12}=\tfrac7{12}$.
            $\tfrac7{12}:\tfrac58=\tfrac7{12}\cdot\tfrac85=\tfrac{56}{60}=\tfrac{14}{15}$.
          resposta: '$\tfrac{14}{15}$'
        - enunciado: 'Numa herança, João recebeu $\tfrac13$, Maria recebeu $\tfrac14$ e Pedro recebeu o restante, que foi R\$\,25\,000,00. Qual era o valor total da herança?'
          resolucao: |
            João e Maria: $\tfrac13+\tfrac14=\tfrac7{12}$. Pedro: $\tfrac5{12}$, que valem $25\,000$.
            $\tfrac1{12}$ vale $5\,000$, e o total é $12\cdot5\,000=60\,000$.
          resposta: 'R\$\,60\,000,00'
        - enunciado: 'A torneira A enche um tanque sozinha em $3$ horas, e a torneira B, em $6$ horas. Que fração do tanque as duas enchem juntas em $1$ hora? Em quanto tempo enchem o tanque juntas?'
          resolucao: |
            Em $1$ hora: $\tfrac13+\tfrac16=\tfrac12$ do tanque. Logo, juntas enchem em $2$ horas.
          resposta: '$\tfrac12$ por hora; $2$ horas'
        - enunciado: 'Use que $\tfrac1{n(n+1)}=\tfrac1n-\tfrac1{n+1}$ para calcular $\tfrac1{1\cdot2}+\tfrac1{2\cdot3}+\tfrac1{3\cdot4}+\tfrac1{4\cdot5}$.'
          resolucao: |
            $\left(1-\tfrac12\right)+\left(\tfrac12-\tfrac13\right)+\left(\tfrac13-\tfrac14\right)+\left(\tfrac14-\tfrac15\right)$.
            Os termos do meio se cancelam: $1-\tfrac15=\tfrac45$.
          resposta: '$\tfrac45$'
        - enunciado: 'Somando $\tfrac23$ de um número com $\tfrac14$ desse mesmo número, obtemos $33$. Que número é esse?'
          resolucao: |
            $\tfrac23+\tfrac14=\tfrac{11}{12}$. Se $\tfrac{11}{12}$ do número valem $33$, $\tfrac1{12}$ vale $3$, e o número é $36$.
          resposta: '$36$'
vestibular:
  intro: Questões autorais no estilo dos vestibulares e do Enem, das diretas às com mais leitura. Nas objetivas, assinale uma alternativa. Nas somatórias, some os números das proposições corretas.
  questoes:
    - enunciado: 'O valor de $\tfrac12+\tfrac23-\tfrac14$ é'
      opcoes: ['$\tfrac13$', '$\tfrac7{12}$', '$\tfrac34$', '$\tfrac{11}{12}$', '$\tfrac{13}{12}$']
      correta: D
      resolucao: |
        $\tfrac6{12}+\tfrac8{12}-\tfrac3{12}=\tfrac{11}{12}$.
    - enunciado: 'O valor de $\tfrac23\cdot\tfrac94:\tfrac32$ é'
      opcoes: ['$\tfrac13$', '$\tfrac12$', '$\tfrac23$', '$\tfrac34$', '$1$']
      correta: E
      resolucao: |
        $\tfrac23\cdot\tfrac94=\tfrac{18}{12}=\tfrac32$ e $\tfrac32:\tfrac32=1$.
    - texto: |
        Numa escola com $120$ alunos, uma pesquisa mostrou que $\tfrac25$ dos alunos vão de ônibus, $\tfrac13$ vão a pé e os demais são levados de carro.
      enunciado: 'O número de alunos que vão de carro é'
      opcoes: ['$16$', '$20$', '$24$', '$28$', '$32$']
      correta: E
      resolucao: |
        Ônibus e a pé: $\tfrac25+\tfrac13=\tfrac{11}{15}$. De carro: $\tfrac4{15}$ de $120=32$.
    - texto: |
        Numa festa de aniversário, sobrou uma pizza inteira. Ana comeu $\tfrac14$ dessa pizza e, depois, Bia comeu $\tfrac13$ da mesma pizza. O restante foi guardado na geladeira.
      enunciado: 'A fração da pizza guardada na geladeira foi'
      opcoes: ['$\tfrac27$', '$\tfrac5{12}$', '$\tfrac7{12}$', '$\tfrac12$', '$\tfrac23$']
      correta: B
      resolucao: |
        Comeram $\tfrac3{12}+\tfrac4{12}=\tfrac7{12}$; sobrou $\tfrac5{12}$.
    - enunciado: 'Assinale o que for correto.'
      proposicoes:
      - '$\tfrac13+\tfrac16=\tfrac12$.'
      - '$\tfrac34-\tfrac12=\tfrac14$.'
      - '$\tfrac25\cdot\tfrac52=1$.'
      - '$\tfrac12:\tfrac14=\tfrac18$.'
      - '$\tfrac23$ de $\tfrac34$ é igual a $\tfrac12$.'
      corretas: [1, 2, 3, 5]
      resolucao: |
        01: $\tfrac26+\tfrac16=\tfrac36$. 02: $\tfrac34-\tfrac24$. 04: inversos. 08 errada: $\tfrac12\cdot4=2$. 16: $\tfrac6{12}=\tfrac12$.
        Soma: $01+02+04+16=23$.
    - texto: |
        Uma receita de bolo para $4$ porções usa os ingredientes da tabela. Uma confeiteira quer fazer a mesma receita para $6$ porções, mantendo as proporções.
      tabela:
        cabecalho: ['Ingrediente', 'Para 4 porções']
        linhas:
          - ['Farinha', '$\tfrac34$ de xícara']
          - ['Açúcar', '$\tfrac12$ xícara']
          - ['Leite', '$\tfrac23$ de xícara']
      enunciado: 'A quantidade de farinha para $6$ porções é'
      opcoes: ['$1$ xícara', '$1\tfrac18$ xícara', '$1\tfrac14$ xícara', '$1\tfrac12$ xícara', '$2$ xícaras']
      correta: B
      resolucao: |
        Multiplica-se por $\tfrac64=\tfrac32$: $\tfrac34\cdot\tfrac32=\tfrac98=1\tfrac18$.
    - enunciado: 'O valor de $\left(1-\tfrac13\right)\cdot\left(1-\tfrac14\right)\cdot\left(1-\tfrac15\right)$ é'
      opcoes: ['$\tfrac15$', '$\tfrac25$', '$\tfrac12$', '$\tfrac35$', '$\tfrac45$']
      correta: B
      resolucao: |
        $\tfrac23\cdot\tfrac34\cdot\tfrac45=\tfrac{24}{60}=\tfrac25$. Repare como os termos se cancelam.
    - texto: |
        O tanque de uma moto tem capacidade de $50$ litros e estava com $\tfrac35$ da capacidade. Numa viagem, a moto gastou $\tfrac23$ do combustível que havia no tanque.
      enunciado: 'Ao final da viagem, restaram no tanque'
      opcoes: ['$10$ L', '$15$ L', '$20$ L', '$25$ L', '$30$ L']
      correta: A
      resolucao: |
        No início: $\tfrac35\cdot50=30$ L. Gastou $\tfrac23\cdot30=20$ L. Restaram $10$ L.
    - texto: |
        Uma herança de R\$\,180\,000,00 foi dividida assim: o filho mais velho recebeu $\tfrac13$, o filho do meio, $\tfrac14$, e o caçula, $\tfrac16$. O restante foi doado a uma instituição de caridade.
      enunciado: 'Assinale o que for correto.'
      proposicoes:
      - 'O filho mais velho recebeu R\$\,60\,000,00.'
      - 'O filho do meio recebeu R\$\,45\,000,00.'
      - 'O caçula recebeu R\$\,36\,000,00.'
      - 'A doação correspondeu a $\tfrac14$ da herança.'
      - 'A doação foi de R\$\,45\,000,00.'
      corretas: [1, 2, 4, 5]
      resolucao: |
        01: $180\,000:3$. 02: $180\,000:4$. 04 errada: $180\,000:6=30\,000$.
        08: $1-\left(\tfrac4{12}+\tfrac3{12}+\tfrac2{12}\right)=\tfrac3{12}=\tfrac14$. 16: $180\,000:4=45\,000$. Soma: $01+02+08+16=27$.
    - texto: |
        Um retângulo foi dividido ao meio, e a metade da esquerda foi pintada de roxo claro. Depois, a parte roxa foi dividida em três partes iguais, e uma delas foi pintada de roxo escuro, como mostra a figura.
      figura:
        tikz: |
          \draw[roxo!70] (0,0) rectangle (4,1.8);
          \fill[roxo!25] (0,0) rectangle (2,1.8);
          \fill[roxo!70] (0,1.2) rectangle (2,1.8);
          \draw[roxo!70] (2,0) -- (2,1.8); \draw[roxo!70] (0,0.6) -- (2,0.6); \draw[roxo!70] (0,1.2) -- (2,1.2);
      enunciado: 'A parte pintada de roxo escuro corresponde a que fração do retângulo?'
      opcoes: ['$\tfrac1{12}$', '$\tfrac1{10}$', '$\tfrac18$', '$\tfrac16$', '$\tfrac13$']
      correta: D
      resolucao: |
        É $\tfrac13$ de $\tfrac12$: $\tfrac13\cdot\tfrac12=\tfrac16$.
    - enunciado: 'O inverso de $2\tfrac13$ é'
      opcoes: ['$\tfrac17$', '$\tfrac27$', '$\tfrac13$', '$\tfrac37$', '$\tfrac73$']
      correta: D
      resolucao: |
        $2\tfrac13=\tfrac73$, cujo inverso é $\tfrac37$.
    - texto: |
        Um corredor amador decidiu completar uma maratona de $42$ km. Na primeira hora, percorreu $\tfrac37$ do percurso. Na segunda hora, percorreu $\tfrac13$ do que ainda faltava.
      enunciado: 'Após duas horas, ainda faltavam'
      opcoes: ['$16$ km', '$18$ km', '$24$ km', '$26$ km', '$34$ km']
      correta: A
      resolucao: |
        1ª hora: $\tfrac37\cdot42=18$ km; faltavam $24$ km. 2ª hora: $\tfrac13\cdot24=8$ km. Faltavam $16$ km.
    - texto: |
        Leo tem um plano de celular com $12$ GB de internet por mês. A tabela mostra que fração do pacote ele usou em cada uma das três primeiras semanas.
      tabela:
        cabecalho: ['Semana', 'Fração do pacote usada']
        linhas:
          - ['1ª', '$\tfrac14$']
          - ['2ª', '$\tfrac13$']
          - ['3ª', '$\tfrac16$']
      enunciado: 'Para a última semana do mês, restam'
      opcoes: ['$1$ GB', '$1{,}5$ GB', '$2$ GB', '$2{,}5$ GB', '$3$ GB']
      correta: E
      resolucao: |
        Usou $\tfrac3{12}+\tfrac4{12}+\tfrac2{12}=\tfrac9{12}=\tfrac34$. Restam $\tfrac14$ de $12=3$ GB.
    - enunciado: 'Sendo $x=\tfrac34$ e $y=\tfrac12$, assinale o que for correto.'
      proposicoes:
      - '$x+y=\tfrac54$.'
      - '$x-y=\tfrac14$.'
      - '$x\cdot y=\tfrac36$.'
      - '$x:y=\tfrac23$.'
      - '$y:x=\tfrac23$.'
      - '$(x+y)\cdot y=\tfrac54$.'
      corretas: [1, 2, 5]
      resolucao: |
        01: $\tfrac34+\tfrac24$. 02: $\tfrac34-\tfrac24$. 04 errada: $\tfrac38$. 08 errada: $\tfrac34\cdot2=\tfrac32$.
        16: $\tfrac12\cdot\tfrac43=\tfrac23$. 32 errada: $\tfrac54\cdot\tfrac12=\tfrac58$. Soma: $01+02+16=19$.
    - enunciado: 'O valor de $\dfrac{1}{\tfrac12+\tfrac13}$ é'
      opcoes: ['$\tfrac56$', '$\tfrac65$', '$5$', '$6$', '$\tfrac16$']
      correta: B
      resolucao: |
        $\tfrac12+\tfrac13=\tfrac56$, e $1:\tfrac56=\tfrac65$.
    - texto: |
        Para encher a piscina de um clube, são usadas duas bombas. Sozinha, a bomba A enche a piscina em $4$ horas; sozinha, a bomba B enche em $6$ horas. Num dia de manutenção, as duas foram ligadas juntas com a piscina vazia.
      enunciado: 'A piscina ficou cheia em'
      opcoes: ['$2$ h', '$2$ h $24$ min', '$2$ h $30$ min', '$5$ h', '$10$ h']
      correta: B
      resolucao: |
        Por hora: $\tfrac14+\tfrac16=\tfrac5{12}$. Tempo: $\tfrac{12}5$ h $=2{,}4$ h $=2$ h $24$ min.
    - texto: |
        Marta recebe R\$\,3\,000,00 por mês. Ela gasta $\tfrac14$ do salário com aluguel e $\tfrac15$ do que sobra com alimentação. Do dinheiro que resta depois disso, ela guarda $\tfrac13$ na poupança.
      enunciado: 'Marta guarda na poupança, por mês,'
      opcoes: ['R\$\,450,00', 'R\$\,500,00', 'R\$\,600,00', 'R\$\,750,00', 'R\$\,900,00']
      correta: C
      resolucao: |
        Aluguel $750$; sobram $2\,250$. Alimentação: $\tfrac15\cdot2\,250=450$; restam $1\,800$. Poupança: $\tfrac13\cdot1\,800=600$.
    - texto: |
        Um artesão tinha uma corda de $12$ m. Primeiro, cortou e usou $\tfrac23$ da corda. Depois, do pedaço que sobrou, usou $\tfrac34$.
      enunciado: 'Assinale o que for correto.'
      proposicoes:
      - 'No primeiro corte, ele usou $8$ m.'
      - 'Depois do primeiro corte, restaram $4$ m.'
      - 'No segundo uso, ele gastou $3$ m.'
      - 'Sobrou $\tfrac14$ da corda original.'
      - 'Sobrou $1$ m de corda.'
      - 'Ao todo, ele usou $\tfrac{11}{12}$ da corda.'
      corretas: [1, 2, 3, 5, 6]
      resolucao: |
        01: $\tfrac23\cdot12=8$. 02: $12-8=4$. 04: $\tfrac34\cdot4=3$. 16: sobrou $1$ m.
        08 errada: $1$ m é $\tfrac1{12}$ da corda. 32: usou $11$ m, $\tfrac{11}{12}$. Soma: $01+02+04+16+32=55$.
    - enunciado: 'O valor de $\tfrac12+\tfrac14+\tfrac18+\tfrac1{16}$ é'
      opcoes: ['$\tfrac12$', '$\tfrac78$', '$\tfrac{15}{16}$', '$1$', '$\tfrac{31}{32}$']
      correta: C
      resolucao: |
        $\tfrac8{16}+\tfrac4{16}+\tfrac2{16}+\tfrac1{16}=\tfrac{15}{16}$. Falta só $\tfrac1{16}$ para completar $1$.
    - texto: |
        Numa escola, $\tfrac35$ dos alunos são meninas. Uma triagem de saúde mostrou que $\tfrac13$ das meninas e $\tfrac12$ dos meninos usam óculos.
      enunciado: 'A fração dos alunos da escola que usam óculos é'
      opcoes: ['$\tfrac25$', '$\tfrac7{15}$', '$\tfrac12$', '$\tfrac8{15}$', '$\tfrac35$']
      correta: A
      resolucao: |
        Meninas de óculos: $\tfrac13\cdot\tfrac35=\tfrac15$. Meninos: $\tfrac25$ dos alunos, e $\tfrac12\cdot\tfrac25=\tfrac15$.
        Total: $\tfrac15+\tfrac15=\tfrac25$.
aprofundamento:
  intro: Questões mais puxadas, no estilo das segundas fases e das olimpíadas. Escreva o raciocínio, não só a resposta.
  questoes:
    - enunciado: 'Calcule $\tfrac1{1\cdot2}+\tfrac1{2\cdot3}+\tfrac1{3\cdot4}+\dots+\tfrac1{99\cdot100}$.'
      resolucao: |
        Cada parcela é $\tfrac1n-\tfrac1{n+1}$. Somando, quase tudo se cancela: $1-\tfrac1{100}=\tfrac{99}{100}$.
      resposta: '$\tfrac{99}{100}$'
    - enunciado: 'Calcule $\left(1+\tfrac12\right)\left(1+\tfrac13\right)\left(1+\tfrac14\right)\cdots\left(1+\tfrac1{99}\right)$.'
      resolucao: |
        O produto é $\tfrac32\cdot\tfrac43\cdot\tfrac54\cdots\tfrac{100}{99}$. Cada numerador cancela o denominador seguinte.
        Sobra $\tfrac{100}{2}=50$.
      resposta: '$50$'
    - enunciado: 'Os egípcios escreviam frações como somas de frações de numerador $1$, todas diferentes. Escreva assim:'
      itens: ['$\tfrac56$', '$\tfrac7{12}$']
      colunas: 2
      espaco_item: 22
      resolucao: |
        (a) $\tfrac56=\tfrac36+\tfrac26=\tfrac12+\tfrac13$.
        (b) $\tfrac7{12}=\tfrac4{12}+\tfrac3{12}=\tfrac13+\tfrac14$.
      resposta: '(a) $\tfrac12+\tfrac13$ (b) $\tfrac13+\tfrac14$'
    - enunciado: 'Determine $x$ tal que $\dfrac1x+\dfrac1{2x}=\dfrac14$.'
      resolucao: |
        $\tfrac1x+\tfrac1{2x}=\tfrac2{2x}+\tfrac1{2x}=\tfrac3{2x}$. Se $\tfrac3{2x}=\tfrac14$, então $2x=12$ e $x=6$.
      resposta: '$x=6$'
    - enunciado: 'Um tanque estava com $\tfrac13$ da capacidade. Depois de receber $60$ litros, ficou com $\tfrac34$ da capacidade. Qual é a capacidade do tanque?'
      resolucao: |
        Os $60$ L correspondem a $\tfrac34-\tfrac13=\tfrac5{12}$ da capacidade. Então $\tfrac1{12}$ vale $12$ L, e a capacidade é $144$ L.
      resposta: '$144$ litros'
    - enunciado: 'Ana faz um trabalho sozinha em $3$ dias, Bia em $6$ dias e Caio em $2$ dias. Trabalhando os três juntos, no mesmo ritmo, em quanto tempo fazem o trabalho?'
      resolucao: |
        Por dia: $\tfrac13+\tfrac16+\tfrac12=\tfrac26+\tfrac16+\tfrac36=1$. Os três juntos fazem o trabalho inteiro em $1$ dia.
      resposta: '$1$ dia'
    - enunciado: 'Calcule $1+\cfrac{1}{1+\cfrac{1}{1+\cfrac12}}$, de baixo para cima.'
      espaco: 34
      resolucao: |
        $1+\tfrac12=\tfrac32$; $\ \tfrac1{3/2}=\tfrac23$; $\ 1+\tfrac23=\tfrac53$; $\ \tfrac1{5/3}=\tfrac35$; $\ 1+\tfrac35=\tfrac85$.
      resposta: '$\tfrac85$'
    - enunciado: 'Qual número está exatamente no meio do caminho entre $\tfrac13$ e $\tfrac12$ na reta numérica?'
      resolucao: |
        É a média: $\left(\tfrac13+\tfrac12\right):2=\tfrac56\cdot\tfrac12=\tfrac5{12}$.
        Conferindo: $\tfrac4{12}$, $\tfrac5{12}$, $\tfrac6{12}$.
      resposta: '$\tfrac5{12}$'
    - texto: |
        Um mercador deixou $17$ camelos para três filhos: o primeiro ficaria com $\tfrac12$, o segundo com $\tfrac13$ e o terceiro com $\tfrac19$ dos camelos. Como $17$ não se divide por $2$, $3$ nem $9$, um sábio emprestou o próprio camelo: com $18$, os filhos levaram $9$, $6$ e $2$, e o sábio pegou seu camelo de volta.
      enunciado: 'Explique, com frações, por que o truque funcionou e sobrou exatamente o camelo do sábio.'
      espaco: 40
      resolucao: |
        As frações do testamento somam $\tfrac12+\tfrac13+\tfrac19=\tfrac{9+6+2}{18}=\tfrac{17}{18}$, que é menos que o todo.
        Com $18$ camelos, as partes são $9$, $6$ e $2$, que somam $17$. Sobra $\tfrac1{18}$ de $18$, ou seja, $1$ camelo: o do sábio.
      resposta: 'As frações somam $\tfrac{17}{18}$, e não $1$'
    - enunciado: 'Uma garrafa tem $2\tfrac14$ litros de refrigerante. Quantos copos de $\tfrac38$ de litro ela enche completamente? Sobra algo?'
      resolucao: |
        $2\tfrac14=\tfrac94$ e $\tfrac94:\tfrac38=\tfrac94\cdot\tfrac83=6$. Enche exatamente $6$ copos, sem sobra.
      resposta: '$6$ copos, sem sobra'
