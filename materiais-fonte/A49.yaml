# Fonte das listas em PDF da aula A49 — Soma da PG finita
# Matemática em LaTeX. Todas as respostas foram conferidas por cálculo independente.
aula: A49

fixacao:
  intro: Resolva na ordem — do aquecimento ao desafio. Com $q\neq1$, $S_n=a_1\dfrac{q^n-1}{q-1}$. Em juros compostos, os montantes ano a ano formam uma P.G. de razão $1+i$.
  secoes:
    - nome: Aquecimento
      questoes:
        - enunciado: Calcule a soma dos $6$ primeiros termos da P.G. $(2,\ 6,\ 18,\ \dots)$.
          resolucao: |
            $S_6=2\cdot\tfrac{3^6-1}{3-1}=2\cdot\tfrac{728}{2}=728$.
          resposta: '$728$'

        - enunciado: Calcule $1+2+4+8+\dots+512$.
          resolucao: |
            P.G. de razão $2$ com $512=2^9$: são $10$ termos.
            $S_{10}=\tfrac{2^{10}-1}{2-1}=1023$.
          resposta: '$1023$'

        - enunciado: Calcule a soma dos $5$ primeiros termos da P.G. $(48,\ 24,\ 12,\ \dots)$.
          resolucao: |
            $q=\tfrac12$: $S_5=48\cdot\dfrac{1-\left(\frac12\right)^5}{1-\frac12}=96\cdot\tfrac{31}{32}=93$.
            Confira: $48+24+12+6+3=93$.
          resposta: '$93$'

        - enunciado: Calcule $3+3^2+3^3+\dots+3^6$.
          resolucao: |
            $a_1=3$, $q=3$, $6$ termos: $S_6=3\cdot\tfrac{3^6-1}{2}=3\cdot364=1092$.
          resposta: '$1092$'

        - enunciado: Em uma P.G., $a_1=5$ e $q=2$. Calcule a soma dos $8$ primeiros termos.
          resolucao: |
            $S_8=5\cdot\tfrac{2^8-1}{2-1}=5\cdot255=1275$.
          resposta: '$1275$'

        - enunciado: Calcule a soma dos $6$ primeiros termos da P.G. $(1,\ -2,\ 4,\ -8,\ \dots)$.
          resolucao: |
            $q=-2$: $S_6=\tfrac{(-2)^6-1}{-2-1}=\tfrac{63}{-3}=-21$.
          resposta: '$-21$'

        - enunciado: Calcule o produto dos $5$ primeiros termos da P.G. $(1,\ 2,\ 4,\ \dots)$.
          resolucao: |
            $1\cdot2\cdot4\cdot8\cdot16=2^{0+1+2+3+4}=2^{10}=1024$.
          resposta: '$1024$'

    - nome: Treino
      questoes:
        - enunciado: Quantos termos da P.G. $(3,\ 6,\ 12,\ \dots)$ devem ser somados para que a soma seja $765$?
          resolucao: |
            $3\cdot\tfrac{2^n-1}{1}=765\Rightarrow 2^n-1=255\Rightarrow 2^n=256\Rightarrow n=8$.
          resposta: '$8$ termos'

        - enunciado: A soma dos $n$ primeiros termos de uma P.G. é $S_n=3^n-1$. Determine $a_1$ e a razão.
          resolucao: |
            $a_1=S_1=2$. \ $S_2=8\Rightarrow a_2=8-2=6$.
            $q=\tfrac{6}{2}=3$.
          resposta: '$a_1=2$; \ $q=3$'

        - enunciado: Na lenda do tabuleiro de xadrez, coloca-se $1$ grão de trigo na $1^{\text{a}}$ casa, $2$ na $2^{\text{a}}$, $4$ na $3^{\text{a}}$, e assim por diante, sempre dobrando.
          itens:
            - Quantos grãos há, ao todo, nas $10$ primeiras casas?
            - Escreva o total de grãos nas $64$ casas como uma potência de $2$ menos $1$.
          resolucao: |
            (a) $1+2+\dots+2^9=2^{10}-1=1023$.
            (b) $1+2+\dots+2^{63}=2^{64}-1$.
          resposta: '(a) $1023$ \quad (b) $2^{64}-1$'

        - enunciado: Joana depositou R\$ 100,00 no primeiro mês e, a cada mês seguinte, depositou o dobro do mês anterior. Quanto ela depositou, ao todo, em $8$ meses?
          resolucao: |
            $S_8=100\cdot\tfrac{2^8-1}{2-1}=100\cdot255=25\,500$.
          resposta: 'R\$ 25.500,00'

        - enunciado: Em uma P.G. de $7$ termos, o termo central é $a_4=3$. Calcule o produto dos $7$ termos.
          resolucao: |
            Termos equidistantes dos extremos têm produto igual ao quadrado do termo central: $a_1a_7=a_2a_6=a_3a_5=a_4^2$.
            $P_7=a_4^7=3^7=2187$.
          resposta: '$2187$'

        - enunciado: Um capital de R\$ 2.000,00 é aplicado a juros compostos de $5\%$ ao ano. Os montantes ano a ano formam uma P.G. Calcule o montante após $3$ anos.
          resolucao: |
            $M_3=2000\cdot1{,}05^3=2000\cdot1{,}157625=2315{,}25$.
          resposta: 'R\$ 2.315,25'

        - enunciado: Uma bola cai de $10$ m de altura e, a cada quique, sobe metade da altura de que caiu. Que distância ela percorre até tocar o chão pela $4^{\text{a}}$ vez?
          resolucao: |
            Desce $10$; depois sobe e desce $5$, $2{,}5$ e $1{,}25$.
            $10+2\,(5+2{,}5+1{,}25)=10+17{,}5=27{,}5$ m.
          resposta: '$27{,}5$ m'

        - enunciado: Uma P.G. de termos positivos tem $a_1=1$ e a soma dos $3$ primeiros termos é $13$. Calcule a soma dos $6$ primeiros termos.
          resolucao: |
            $1+q+q^2=13\Rightarrow q^2+q-12=0\Rightarrow q=3$ (termos positivos).
            $S_6=\tfrac{3^6-1}{2}=364$.
          resposta: '$364$'

    - nome: Desafio
      questoes:
        - enunciado: Uma pessoa envia uma mensagem a $3$ amigos (1ª rodada). Na rodada seguinte, cada pessoa que recebeu envia a mensagem a $3$ pessoas novas, e assim por diante. Ao fim da $6^{\text{a}}$ rodada, quantas pessoas receberam a mensagem?
          resolucao: |
            Recebem $3,\ 9,\ 27,\ \dots,\ 3^6$ pessoas por rodada.
            $S_6=3\cdot\tfrac{3^6-1}{2}=1092$.
          resposta: '$1092$ pessoas'

        - enunciado: Na P.G. $(2,\ 4,\ 8,\ \dots)$, seja $P_n$ o produto dos $n$ primeiros termos. Mostre que $P_n=2^{\frac{n(n+1)}{2}}$ e determine $n$ para que $P_n=2^{55}$.
          resolucao: |
            $P_n=2^1\cdot2^2\cdots2^n=2^{1+2+\dots+n}=2^{\frac{n(n+1)}{2}}$.
            $\tfrac{n(n+1)}{2}=55\Rightarrow n^2+n-110=0\Rightarrow n=10$.
          resposta: '$n=10$'

        - enunciado: Deduza a soma $S=1+3+9+\dots+3^9$ multiplicando $S$ por $3$ e subtraindo as duas expressões.
          resolucao: |
            $3S=3+9+\dots+3^9+3^{10}$.
            $3S-S=3^{10}-1\Rightarrow S=\tfrac{3^{10}-1}{2}=\tfrac{59\,048}{2}=29\,524$.
          resposta: '$29\,524$'

        - enunciado: No início de cada ano, durante $3$ anos, uma pessoa deposita R\$ 500,00 em uma aplicação que rende $10\%$ ao ano (juros compostos). Quanto ela terá ao fim do $3^\circ$ ano?
          resolucao: |
            O $1^\circ$ depósito rende por $3$ anos, o $2^\circ$ por $2$ e o $3^\circ$ por $1$:
            $500\cdot1{,}1+500\cdot1{,}1^2+500\cdot1{,}1^3=550+605+665{,}50=1820{,}50$.
            Como P.G.: $550\cdot\tfrac{1{,}1^3-1}{0{,}1}=550\cdot3{,}31=1820{,}50$.
          resposta: 'R\$ 1.820,50'

        - enunciado: Uma P.G. de razão $2$ tem $10$ termos e a soma deles é $3069$. Calcule o primeiro e o último termo.
          resolucao: |
            $a_1\cdot\tfrac{2^{10}-1}{1}=3069\Rightarrow 1023\,a_1=3069\Rightarrow a_1=3$.
            $a_{10}=3\cdot2^9=1536$.
          resposta: '$a_1=3$; \ $a_{10}=1536$'

vestibular:
  intro: Questões autorais no estilo dos principais vestibulares. Assinale uma única alternativa.
  questoes:
    - enunciado: A soma dos $8$ primeiros termos da P.G. $(1,\ 3,\ 9,\ \dots)$ é
      opcoes: ['$1093$', '$2187$', '$3280$', '$6560$', '$9840$']
      correta: C
      resolucao: |
        $S_8=\tfrac{3^8-1}{3-1}=\tfrac{6560}{2}=3280$.

    - enunciado: O valor de $2+4+8+\dots+1024$ é
      opcoes: ['$1023$', '$2046$', '$2048$', '$4094$', '$4096$']
      correta: B
      resolucao: |
        São $10$ termos: $2\cdot\tfrac{2^{10}-1}{1}=2046$.

    - enunciado: A soma dos $6$ primeiros termos da P.G. $(64,\ 32,\ 16,\ \dots)$ é
      opcoes: ['$62$', '$63$', '$124$', '$126$', '$128$']
      correta: D
      resolucao: |
        $64+32+16+8+4+2=126$, ou $64\cdot\dfrac{1-\left(\frac12\right)^6}{\frac12}=128\cdot\tfrac{63}{64}=126$.

    - enunciado: Para que a soma dos primeiros termos da P.G. $(2,\ 4,\ 8,\ \dots)$ seja $510$, devemos somar
      opcoes: ['$8$ termos', '$9$ termos', '$10$ termos', '$128$ termos', '$255$ termos']
      correta: A
      resolucao: |
        $2(2^n-1)=510\Rightarrow 2^n=256\Rightarrow n=8$.

    - enunciado: A soma dos $n$ primeiros termos de uma P.G. é $S_n=5(2^n-1)$. O quarto termo dessa P.G. é
      opcoes: ['$10$', '$15$', '$20$', '$35$', '$40$']
      correta: E
      resolucao: |
        $a_4=S_4-S_3=75-35=40$.

    - enunciado: No tabuleiro de xadrez da lenda, cada casa recebe o dobro de grãos da anterior, começando com $1$ grão. O total de grãos nas $64$ casas é
      opcoes: ['$2^{64}-1$', '$2^{64}$', '$2^{65}-1$', '$2^{63}$', '$64^2$']
      correta: A
      resolucao: |
        $1+2+\dots+2^{63}=\tfrac{2^{64}-1}{2-1}=2^{64}-1$.

    - enunciado: O produto dos $5$ primeiros termos da P.G. $(3,\ 6,\ 12,\ \dots)$ é
      opcoes: ['$6^5$', '$12^4$', '$12^5$', '$3^5\cdot2^{15}$', '$48^5$']
      correta: C
      resolucao: |
        Com $5$ termos, o central é $a_3=12$ e $P_5=a_3^5=12^5$.

    - enunciado: R\$ 5.000,00 são aplicados a juros compostos de $10\%$ ao ano. Após $2$ anos, o montante é
      opcoes: ['R\$ 6.000,00', 'R\$ 6.050,00', 'R\$ 6.100,00', 'R\$ 6.655,00', 'R\$ 10.000,00']
      correta: B
      resolucao: |
        $5000\cdot1{,}1^2=5000\cdot1{,}21=6050$.

    - enunciado: Uma bola é largada de $8$ m de altura e, a cada quique, sobe $\tfrac34$ da altura de que caiu. Até tocar o chão pela $3^{\text{a}}$ vez, ela percorre
      opcoes: ['$20$ m', '$24$ m', '$26$ m', '$29$ m', '$32$ m']
      correta: D
      resolucao: |
        Desce $8$; sobe e desce $6$; sobe e desce $4{,}5$.
        $8+2\,(6+4{,}5)=29$ m.

    - enunciado: A soma dos $5$ primeiros termos da P.G. $(1,\ -3,\ 9,\ \dots)$ é
      opcoes: ['$-61$', '$-20$', '$20$', '$41$', '$61$']
      correta: E
      resolucao: |
        $\tfrac{(-3)^5-1}{-3-1}=\tfrac{-244}{-4}=61$. Confira: $1-3+9-27+81=61$.

    - enunciado: Uma pessoa envia uma mensagem a $2$ amigos (1ª rodada); na rodada seguinte, cada pessoa que recebeu envia a mensagem a $2$ pessoas novas, e assim por diante. Ao fim da $7^{\text{a}}$ rodada, o total de pessoas que receberam a mensagem é
      opcoes: ['$128$', '$254$', '$256$', '$510$', '$512$']
      correta: B
      resolucao: |
        $2+4+\dots+2^7=2\cdot\tfrac{2^7-1}{1}=254$.

    - enunciado: Uma P.G. tem $4$ termos, razão $3$ e soma $200$. O último termo é
      opcoes: ['$135$', '$150$', '$160$', '$180$', '$405$']
      correta: A
      resolucao: |
        $a_1\cdot\tfrac{3^4-1}{2}=40a_1=200\Rightarrow a_1=5$; \ $a_4=5\cdot27=135$.

    - enunciado: Uma pessoa deposita R\$ 100,00 no fim de cada mês em uma aplicação de $1\%$ ao mês (juros compostos). Logo após o $3^\circ$ depósito, o saldo é
      opcoes: ['R\$ 300,00', 'R\$ 303,00', 'R\$ 303,01', 'R\$ 306,04', 'R\$ 309,09']
      correta: C
      resolucao: |
        $100\cdot1{,}01^2+100\cdot1{,}01+100=102{,}01+101+100=303{,}01$.

    - enunciado: Em uma P.G. de termos positivos com $9$ termos, o termo central é $a_5=2$. O produto dos $9$ termos é
      opcoes: ['$18$', '$81$', '$256$', '$512$', '$1024$']
      correta: D
      resolucao: |
        $P_9=a_5^9=2^9=512$.

    - enunciado: O valor de $\tfrac12+\tfrac14+\tfrac18+\dots+\tfrac1{1024}$ é
      opcoes: ['$\tfrac1{1024}$', '$\tfrac12$', '$\tfrac{255}{256}$', '$\tfrac{511}{512}$', '$\tfrac{1023}{1024}$']
      correta: E
      resolucao: |
        São $10$ termos: $\tfrac12\cdot\dfrac{1-\left(\frac12\right)^{10}}{1-\frac12}=1-\tfrac1{1024}=\tfrac{1023}{1024}$.

    - enunciado: Um atleta corre $1$ km no primeiro dia e, a cada dia, corre $10\%$ a mais que no dia anterior. Usando $1{,}1^5\approx1{,}61$, nos $5$ primeiros dias ele corre, ao todo, aproximadamente
      opcoes: ['$5{,}5$ km', '$6{,}1$ km', '$6{,}5$ km', '$8{,}05$ km', '$16{,}1$ km']
      correta: B
      resolucao: |
        $S_5=1\cdot\tfrac{1{,}1^5-1}{0{,}1}\approx\tfrac{0{,}61}{0{,}1}=6{,}1$ km.

    - enunciado: O produto dos $n$ primeiros termos da P.G. $(2,\ 4,\ 8,\ \dots)$ é $2^{36}$. O valor de $n$ é
      opcoes: ['$8$', '$9$', '$12$', '$18$', '$36$']
      correta: A
      resolucao: |
        $2^{1+2+\dots+n}=2^{\frac{n(n+1)}2}=2^{36}\Rightarrow n(n+1)=72\Rightarrow n=8$.

    - enunciado: O valor de $n$ para o qual $3+3^2+3^3+\dots+3^n=120$ é
      opcoes: ['$1$', '$2$', '$3$', '$4$', '$5$']
      correta: D
      resolucao: |
        $3\cdot\tfrac{3^n-1}{2}=120\Rightarrow 3^n-1=80\Rightarrow 3^n=81\Rightarrow n=4$.

    - enunciado: No tabuleiro de xadrez da lenda, a $k$-ésima casa recebe $2^{k-1}$ grãos. A primeira casa em que o total acumulado de grãos passa de $1000$ é a
      opcoes: ['$8^{\text{a}}$', '$9^{\text{a}}$', '$10^{\text{a}}$', '$11^{\text{a}}$', '$500^{\text{a}}$']
      correta: C
      resolucao: |
        Até a casa $k$, o total é $2^k-1$. $2^9-1=511$ não passa; $2^{10}-1=1023$ passa.

    - enunciado: Uma fábrica produziu $1000$ peças em janeiro e aumentou a produção em $20\%$ a cada mês. Usando $1{,}2^6\approx2{,}99$, a produção total no primeiro semestre foi de aproximadamente
      opcoes: ['$2990$ peças', '$6000$ peças', '$7200$ peças', '$8970$ peças', '$9950$ peças']
      correta: E
      resolucao: |
        $S_6=1000\cdot\tfrac{1{,}2^6-1}{0{,}2}\approx1000\cdot\tfrac{1{,}99}{0{,}2}=9950$.
