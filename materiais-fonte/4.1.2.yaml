aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Uma poligonal sai de um ponto $A$ da reta $r$ e chega a um ponto $B$ da reta $s$, paralela a $r$, fazendo dois bicos: o primeiro aponta para a direita e mede $x$; o segundo aponta para a esquerda e mede $y$. O primeiro segmento forma $a$ com $r$, e o último forma $b$ com $s$.'
    itens:
    - 'Traçando paralelas pelos vértices, mostre que $x = a + c$ e $y = c + b$, em que $c$ é o ângulo do segmento do meio com essas paralelas.'
    - 'Conclua que $x + b = y + a$ (a soma dos ângulos que apontam para um lado é igual à soma dos que apontam para o outro).'
    - 'Calcule $x$ para $a = 32°$, $y = 70°$ e $b = 26°$.'
    espaco: 62
    resolucao: |
      a) No primeiro bico, a paralela pelo vértice divide $x$ em uma parte igual a $a$ (alternos internos com $r$) e outra igual a $c$. No segundo, a paralela divide $y$ em $c$ (alternos internos com a paralela anterior) e $b$.
      b) $x - y = a - b$, isto é, $x + b = y + a$.
      c) $x + 26 = 70 + 32$: $x = 76°$.
    resposta: 'c) $x = 76°$'

  - estilo: Unicamp
    texto: |
      Num periscópio, a luz entra na horizontal, atinge um espelho inclinado de $45°$, sobe na vertical e atinge um segundo espelho, paralelo ao primeiro, saindo de novo na horizontal. Em cada reflexão, os raios incidente e refletido formam ângulos iguais com o espelho.
    enunciado: ''
    itens:
    - 'Mostre que, no primeiro espelho, o raio refletido forma $90°$ com o incidente.'
    - 'Mostre que o raio vertical forma $45°$ com o segundo espelho.'
    - 'Conclua que o raio que sai é paralelo ao que entrou e tem o mesmo sentido.'
    espaco: 62
    resolucao: |
      a) O raio horizontal forma $45°$ com o espelho, e o refletido também: os três ângulos em torno do ponto, de um lado do espelho, somam $180°$, e o ângulo entre os raios é $180° - 45° - 45° = 90°$.
      b) Os espelhos são paralelos, e o raio vertical é uma transversal a eles: ele forma $45°$ com o primeiro e, por alternos internos, $45°$ com o segundo.
      c) Pelo item a) aplicado ao segundo espelho, o raio que sai forma $90°$ com o vertical: é horizontal, logo paralelo ao que entrou. Como os espelhos são paralelos, o segundo desvia a luz para o lado oposto ao do primeiro, e ela volta ao sentido original.
    resposta: 'Ver resolução'

  - estilo: ITA
    enunciado: |
      Duas retas paralelas são cortadas por uma transversal, que não é perpendicular a elas. As bissetrizes dos quatro ângulos internos (os dois de cada cruzamento que ficam entre as paralelas) determinam um quadrilátero. Esse quadrilátero é
    opcoes: ['um quadrado.', 'um retângulo que não é quadrado.', 'um losango que não é quadrado.', 'um trapézio que não é paralelogramo.', 'um paralelogramo sem ângulo reto.']
    correta: B
    espaco: 22
    resolucao: |
      Em cada cruzamento, os dois ângulos internos são adjacentes suplementares: as bissetrizes são perpendiculares (ângulos retos nos cruzamentos). Nos outros dois vértices, encontram-se bissetrizes de colaterais internos: também $90°$. Os quatro ângulos são retos: retângulo. Os lados que partem de um cruzamento medem $d\cos\tfrac{\alpha}{2}$ e $d\operatorname{sen}\tfrac{\alpha}{2}$ ($d$ é a distância entre os cruzamentos), diferentes se $\alpha \neq 90°$.
    resposta: 'B'

  - estilo: Unesp
    enunciado: 'Pelo vértice $A$ de um triângulo $ABC$, trace a reta $r$ paralela a $BC$.'
    itens:
    - 'Usando ângulos alternos internos, mostre que $\hat{A} + \hat{B} + \hat{C} = 180°$.'
    - 'Mostre que o ângulo externo em $C$ (adjacente a $\hat{C}$) é igual a $\hat{A} + \hat{B}$.'
    - 'Num triângulo, $\hat{A} = 2x$, $\hat{B} = 3x$ e o ângulo externo em $C$ mede $125°$. Determine os três ângulos internos.'
    espaco: 62
    resolucao: |
      a) A reta $r$ forma com $AB$ um ângulo igual a $\hat{B}$ e com $AC$ um ângulo igual a $\hat{C}$ (alternos internos, com as transversais $AB$ e $AC$). Esses dois ângulos e $\hat{A}$ formam um ângulo raso em $A$: $\hat{A} + \hat{B} + \hat{C} = 180°$.
      b) O externo em $C$ é $180° - \hat{C} = \hat{A} + \hat{B}$.
      c) $5x = 125°$, $x = 25°$: $\hat{A} = 50°$, $\hat{B} = 75°$, $\hat{C} = 55°$.
    resposta: 'c) $50°$, $75°$ e $55°$'

  - estilo: UFSC
    enunciado: |
      Considere duas retas paralelas cortadas por uma transversal, num mesmo plano. Assinale o que for correto.
    proposicoes:
    - 'Se a transversal é perpendicular a uma das paralelas, é perpendicular à outra.'
    - 'Os oito ângulos formados somam $720°$.'
    - 'Entre os oito ângulos, há no máximo dois valores distintos.'
    - 'Se dois ângulos colaterais internos são congruentes, cada um mede $45°$.'
    - 'Dois ângulos alternos internos são sempre suplementares.'
    - 'As bissetrizes de dois ângulos colaterais externos são perpendiculares.'
    corretas: [1, 2, 3, 6]
    espaco: 22
    resolucao: |
      01) Correspondentes ao ângulo reto. 02) $2 \cdot 360°$. 04) Um ângulo e o seu suplemento. 08) Incorreta: somam $180°$, então medem $90°$.
      16) Incorreta: são congruentes (suplementares só se forem retos). 32) Os colaterais externos somam $180°$, e as metades, $90°$.
    resposta: 'Soma 39 (01 + 02 + 04 + 32)'

  - estilo: Fuvest
    enunciado: 'Duas paralelas são cortadas por uma transversal. Dois ângulos correspondentes medem $3a - b$ e $2a + 10°$, e um colateral interno a um deles mede $a + b$.'
    itens:
    - 'Escreva o sistema de equações que traduz o enunciado.'
    - 'Determine $a$ e $b$.'
    - 'Quais são as medidas dos oito ângulos?'
    espaco: 62
    resolucao: |
      a) Correspondentes iguais: $3a - b = 2a + 10$. Colaterais suplementares: $(a + b) + (2a + 10) = 180$.
      b) $a - b = 10$ e $3a + b = 170$: $4a = 180$, $a = 45°$, $b = 35°$.
      c) Os correspondentes medem $100°$, e o colateral, $80°$: quatro ângulos de $100°$ e quatro de $80°$.
    resposta: 'b) $a = 45°$, $b = 35°$; c) quatro de $100°$ e quatro de $80°$'

  - estilo: Unicamp
    texto: |
      Por volta de 240 a.C., Eratóstenes estimou a circunferência da Terra. Ao meio-dia do solstício de verão, em Siena, o Sol ficava a pino (raios verticais); no mesmo instante, em Alexandria, uma haste vertical fazia sombra, e os raios formavam com ela um ângulo de $7{,}2°$. Os raios do Sol chegam à Terra praticamente paralelos.
    enunciado: ''
    itens:
    - 'A haste de Alexandria aponta para o centro da Terra, assim como a direção vertical em Siena. Explique por que o ângulo entre essas duas direções, no centro da Terra, também mede $7{,}2°$.'
    - 'Que fração da volta completa corresponde a $7{,}2°$?'
    - 'Se a distância de Siena a Alexandria fosse de 800 km, qual seria a circunferência da Terra?'
    espaco: 62
    resolucao: |
      a) O raio que chega a Siena segue a vertical até o centro. Ele e o raio que chega a Alexandria são paralelos, cortados pela reta da haste de Alexandria (que passa pelo centro): o ângulo no topo da haste e o ângulo no centro são alternos internos, logo iguais.
      b) $\tfrac{7{,}2}{360} = \tfrac{1}{50}$.
      c) $50 \cdot 800 = 40\,000$ km.
    resposta: 'b) $\frac{1}{50}$; c) 40 000 km'

  - estilo: Fuvest
    enunciado: |
      Uma poligonal liga duas paralelas $r$ e $s$, fazendo dois bicos. O primeiro segmento forma $30°$ com $r$; o primeiro bico, que aponta para a direita, mede $100°$; o último segmento forma $40°$ com $s$. O segundo bico, que aponta para a esquerda, mede
    opcoes: ['$70°$', '$90°$', '$100°$', '$110°$', '$130°$']
    correta: D
    espaco: 22
    resolucao: |
      O segmento do meio forma $c$ com as paralelas: $100° = 30° + c$, $c = 70°$. Segundo bico: $c + 40° = 110°$.
