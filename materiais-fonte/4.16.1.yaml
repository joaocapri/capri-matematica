aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Um tronco de pirâmide tem bases de áreas $A_B$ e $A_b$ e altura $h$. Complete-o com a pirâmide menor, de altura $x$.'
    itens:
    - 'Prove que $x = \frac{h\sqrt{A_b}}{\sqrt{A_B} - \sqrt{A_b}}$.'
    - 'Prove que $V = \frac{h}{3}\left(A_B + A_b + \sqrt{A_B A_b}\right)$.'
    - 'Calcule o volume para $A_B = 49$, $A_b = 16$ e $h = 6$.'
    espaco: 62
    resolucao: |
      a) Semelhança: $\tfrac{x}{x + h} = \sqrt{\tfrac{A_b}{A_B}}$, ou seja, $x\sqrt{A_B} = (x + h)\sqrt{A_b}$.
      b) $V = \tfrac{A_B(x + h) - A_b x}{3} = \tfrac{A_B h + x(A_B - A_b)}{3}$, e $x(A_B - A_b) = h\sqrt{A_b}(\sqrt{A_B} + \sqrt{A_b}) = h(\sqrt{A_B A_b} + A_b)$.
      c) $2(49 + 16 + 28) = 186$.
    resposta: 'c) 186'

  - estilo: Unicamp
    enunciado: 'Dois planos paralelos à base dividem a altura de uma pirâmide em três partes iguais.'
    itens:
    - 'Prove que os volumes das três partes, de cima para baixo, estão na razão $1 : 7 : 19$.'
    - 'Que fração da pirâmide é a parte do meio?'
    - 'Se a pirâmide tem volume 810, calcule os três volumes.'
    espaco: 62
    resolucao: |
      a) As pirâmides de razões $\tfrac{1}{3}$, $\tfrac{2}{3}$ e 1 têm volumes $\tfrac{1}{27}V$, $\tfrac{8}{27}V$ e $V$. As partes: $\tfrac{1}{27}V$, $\tfrac{7}{27}V$ e $\tfrac{19}{27}V$.
      b) $\tfrac{7}{27}$.
      c) 30, 210 e 570.
    resposta: 'b) $\frac{7}{27}$; c) 30, 210 e 570'

  - estilo: ITA
    enunciado: |
      Um plano paralelo à base divide a superfície lateral de uma pirâmide em duas partes de mesma área. A razão entre o volume da pirâmide menor assim obtida e o volume da pirâmide original é
    opcoes: ['$\frac{1}{2}$', '$\frac{\sqrt{2}}{4}$', '$\frac{1}{4}$', '$\frac{\sqrt{2}}{2}$', '$\frac{1}{8}$']
    correta: B
    espaco: 22
    resolucao: |
      Áreas na razão $k^2 = \tfrac{1}{2}$: $k = \tfrac{\sqrt{2}}{2}$. Volumes: $k^3 = \tfrac{2\sqrt{2}}{8} = \tfrac{\sqrt{2}}{4}$.
    resposta: 'B'

  - estilo: Unesp
    texto: |
      Uma floreira tem a parte interna em forma de tronco de pirâmide quadrangular regular, com boca de 60 cm de lado, fundo de 30 cm de lado e 30 cm de profundidade.
    enunciado: ''
    itens:
    - 'Calcule a capacidade da floreira, em litros.'
    - 'Calcule o volume de terra quando ela atinge 15 cm de altura a partir do fundo.'
    - 'Calcule a aresta lateral do tronco, com $\sqrt{6} \approx 2{,}45$.'
    espaco: 62
    resolucao: |
      a) $\tfrac{30}{3}(3600 + 900 + 1800) = 63\,000$ cm³ $= 63$ L.
      b) O lado cresce 1 cm por centímetro de altura: a 15 cm, mede 45 cm. $\tfrac{15}{3}(900 + 2025 + 1350) = 21\,375$ cm³ $\approx 21{,}4$ L.
      c) As semidiagonais das bases diferem $\tfrac{(60 - 30)\sqrt{2}}{2} = 15\sqrt{2}$: $\sqrt{900 + 450} = 15\sqrt{6} \approx 36{,}8$ cm.
    resposta: 'a) 63 L; b) $\approx 21{,}4$ L; c) $\approx 36{,}8$ cm'

  - estilo: UFSC
    enunciado: |
      Considere pirâmides e troncos de pirâmide. Assinale o que for correto.
    proposicoes:
    - 'Cortando uma pirâmide na metade da altura, a pirâmide menor tem $\frac{1}{8}$ do volume.'
    - 'Nesse mesmo corte, o tronco tem $\frac{7}{8}$ do volume.'
    - 'Nesse mesmo corte, a secção tem metade da área da base.'
    - 'O volume de um tronco é $\frac{h}{3}\left(A_B + A_b + \sqrt{A_B A_b}\right)$.'
    - 'Um tronco de bases de áreas 4 e 1 e altura 3 tem volume 7.'
    - 'As faces laterais de um tronco de pirâmide regular são trapézios isósceles congruentes.'
    corretas: [1, 2, 4, 5, 6]
    espaco: 22
    resolucao: |
      01) $\left(\tfrac{1}{2}\right)^3$. 02) $1 - \tfrac{1}{8}$. 04) Incorreta: $\tfrac{1}{4}$. 08) Correta. 16) $1 \cdot (4 + 1 + 2)$. 32) Correta.
    resposta: 'Soma 59 (01 + 02 + 08 + 16 + 32)'

  - estilo: Fuvest
    enunciado: 'Um tronco de pirâmide quadrangular regular tem bases de lados $L$ e $\ell$ e altura $h$.'
    itens:
    - 'Prove que o apótema do tronco é $a = \sqrt{h^2 + \left(\frac{L - \ell}{2}\right)^2}$.'
    - 'Prove que a área lateral é $2(L + \ell)a$.'
    - 'Para $L = 16$, $\ell = 4$ e $h = 8$, calcule o apótema, a área total e o volume.'
    espaco: 62
    resolucao: |
      a) Trapézio retângulo de bases $\tfrac{L}{2}$ e $\tfrac{\ell}{2}$ e altura $h$, com lado oblíquo $a$.
      b) Quatro trapézios de bases $L$ e $\ell$ e altura $a$: $4 \cdot \tfrac{(L + \ell)a}{2}$.
      c) $a = \sqrt{64 + 36} = 10$; $A_T = 400 + 256 + 16 = 672$; $V = \tfrac{8}{3}(256 + 16 + 64) = 896$.
    resposta: 'c) 10; 672; 896'

  - estilo: Unicamp
    enunciado: 'Um tronco de pirâmide quadrangular regular tem bases de lados 12 e 8 e altura 3.'
    itens:
    - 'Calcule a altura da pirâmide da qual ele foi obtido.'
    - 'Calcule os volumes da pirâmide original e da pirâmide retirada.'
    - 'Calcule o volume do tronco pela diferença e confira com a fórmula.'
    espaco: 62
    resolucao: |
      a) $k = \tfrac{8}{12} = \tfrac{2}{3}$: $H - \tfrac{2H}{3} = 3$, $H = 9$.
      b) Original $\tfrac{144 \cdot 9}{3} = 432$; retirada $\tfrac{64 \cdot 6}{3} = 128$.
      c) $432 - 128 = 304$; fórmula: $\tfrac{3}{3}(144 + 64 + 96) = 304$.
    resposta: 'a) 9; b) 432 e 128; c) 304'

  - estilo: Fuvest
    enunciado: |
      Um tronco de pirâmide tem volume 126 e bases de áreas 36 e 9. A sua altura é
    opcoes: ['$4$', '$5$', '$6$', '$7$', '$\frac{14}{3}$']
    correta: C
    espaco: 22
    resolucao: |
      $\tfrac{h}{3}(36 + 9 + 18) = 21h = 126$: $h = 6$.
    resposta: 'C'

  - estilo: Unesp
    texto: |
      Um copo tem a parte interna em forma de tronco de pirâmide quadrangular regular, com fundo de 6 cm de lado, boca de 8 cm de lado e 9 cm de altura.
    enunciado: ''
    itens:
    - 'Calcule a capacidade do copo.'
    - 'Calcule o volume de água quando ela atinge a metade da altura.'
    - 'Explique por que, com água até a metade da altura, o copo está com menos da metade da capacidade.'
    espaco: 62
    resolucao: |
      a) $\tfrac{9}{3}(36 + 64 + 48) = 444$ cm³.
      b) Na metade da altura, o lado é 7: $\tfrac{4{,}5}{3}(36 + 49 + 42) = 190{,}5$ cm³.
      c) A parte de baixo é a mais estreita: as secções abaixo da metade têm área menor que as de cima. De fato, $190{,}5 < 222$.
    resposta: 'a) 444 cm³; b) 190,5 cm³'

  - estilo: Fuvest
    enunciado: 'Um tronco de pirâmide hexagonal regular tem bases de lados 4 e 2 e altura 3.'
    itens:
    - 'Calcule as áreas das bases.'
    - 'Calcule o apótema do tronco e a área lateral.'
    - 'Calcule o volume.'
    espaco: 62
    resolucao: |
      a) $\tfrac{3 \cdot 16\sqrt{3}}{2} = 24\sqrt{3}$ e $\tfrac{3 \cdot 4\sqrt{3}}{2} = 6\sqrt{3}$.
      b) Apótemas das bases $2\sqrt{3}$ e $\sqrt{3}$: $a = \sqrt{9 + 3} = 2\sqrt{3}$. $A_L = 6 \cdot \tfrac{(4 + 2) \cdot 2\sqrt{3}}{2} = 36\sqrt{3}$.
      c) $\sqrt{24\sqrt{3} \cdot 6\sqrt{3}} = \sqrt{432} = 12\sqrt{3}$: $V = 1 \cdot (24\sqrt{3} + 6\sqrt{3} + 12\sqrt{3}) = 42\sqrt{3}$.
    resposta: 'a) $24\sqrt{3}$ e $6\sqrt{3}$; b) $2\sqrt{3}$ e $36\sqrt{3}$; c) $42\sqrt{3}$'
