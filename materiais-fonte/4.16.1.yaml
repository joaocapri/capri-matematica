# Aula 4.16.1 — Geometria espacial: tronco de pirâmide
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: plano paralelo à base e semelhança (razões k, k², k³); tronco = pirâmide maior − pirâmide menor;
# V = h/3 (A_B + A_b + √(A_B·A_b)); tronco de pirâmide regular: faces trapézios isósceles, apótema do tronco
# a² = h² + (m_B − m_b)², área lateral (P + p)·a/2, aresta lateral; altura da pirâmide original. Tronco de cone na 4.16.2.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. Use $V = \frac{h}{3}\left(A_B + A_b + \sqrt{A_B A_b}\right)$ ou a diferença entre as pirâmides. O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Um tronco de pirâmide quadrangular regular tem bases de lados 10 e 4 e altura 4. Complete.'
      itens:
      - 'Volume: {{208}}'
      - 'Apótema do tronco (altura de uma face lateral): {{5}}'
      - 'Área lateral: {{140}}'
      - 'Área total: {{256}}'
      espaco_item: 8
      resolucao: |
        $V = \tfrac{4}{3}(100 + 16 + 40) = 208$. Os apótemas das bases são 5 e 2: $a = \sqrt{16 + 9} = 5$. $A_L = 4 \cdot \tfrac{(10 + 4) \cdot 5}{2} = 140$; $A_T = 140 + 116$.
      resposta: '208; 5; 140; 256'
    - enunciado: 'Um plano paralelo à base de uma pirâmide determina uma pirâmide menor, semelhante, de razão $k$ (razão entre as alturas). Associe cada $k$ à razão entre os volumes.'
      esquerda:
      - '$k = \frac{1}{2}$'
      - '$k = \frac{1}{3}$'
      - '$k = \frac{2}{3}$'
      - '$k = \frac{3}{4}$'
      - '$k = \frac{2}{5}$'
      direita:
      - '$\frac{27}{64}$'
      - '$\frac{1}{27}$'
      - '$\frac{1}{8}$'
      - '$\frac{8}{125}$'
      - '$\frac{8}{27}$'
      resolucao: |
        Os volumes estão na razão $k^3$.
      resposta: 'De cima para baixo: 4, 2, 1, 5, 3'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Um plano paralelo à base, na metade da altura, divide a pirâmide em duas partes de mesmo volume.'
      - 'O volume do tronco é o volume da pirâmide maior menos o da pirâmide menor.'
      - 'As duas bases de um tronco de pirâmide são polígonos semelhantes.'
      - 'As faces laterais de um tronco de pirâmide regular são retângulos.'
      justificar: true
      espaco: 20
      resolucao: |
        (F) A pirâmide menor tem $\tfrac{1}{8}$ do volume, e o tronco, $\tfrac{7}{8}$. (V) (V) Razão $k$. (F) São trapézios isósceles.
      resposta: F, V, V, F
    - enunciado: 'Uma pirâmide de volume 640 é cortada por um plano paralelo à base, com razão $k$ entre as alturas da pirâmide menor e da original. Complete.'
      tabela:
        cabecalho: ['$k$', 'Pirâmide menor', 'Tronco']
        linhas:
        - ['$\frac{1}{2}$', '${{80}}$', '${{560}}$']
        - ['$\frac{1}{4}$', '${{10}}$', '${{630}}$']
        - ['$\frac{3}{4}$', '${{270}}$', '${{370}}$']
      resolucao: |
        Pirâmide menor: $640k^3$; tronco: $640 - 640k^3$.
      resposta: '80, 560; 10, 630; 270, 370'
    - enunciado: 'O tronco de pirâmide quadrangular regular da figura tem bases de lados 6 e 3 e altura 2. Calcule o volume.'
      figura:
        tikz: |
          \begin{scope}[scale=.8]
          \draw[ink, line width=1pt] (0,0) -- (3,0) -- (4,1) (0,0) -- (1,2.05) (3,0) -- (2.5,2.05) (4,1) -- (3,2.55);
          \draw[ink, line width=1pt] (1,2.05) -- (2.5,2.05) -- (3,2.55) -- (1.5,2.55) -- cycle;
          \draw[ink, dashed] (0,0) -- (1,1) -- (4,1) (1,1) -- (1.5,2.55);
          \draw[roxo, dashed] (2,0.5) -- (2,2.3);
          \node[below, font=\scriptsize] at (1.5,0) {$6$};
          \node[above, font=\scriptsize] at (2.25,2.55) {$3$};
          \node[right, font=\scriptsize] at (2,1.2) {$2$};
          \end{scope}
      espaco: 8
      resolucao: |
        $V = \tfrac{2}{3}(36 + 9 + 18) = 42$.
      resposta: '42'
    - enunciado: 'Um tronco de pirâmide tem bases de áreas 25 e 9 e altura 6. Calcule o volume.'
      espaco: 8
      resolucao: |
        $V = \tfrac{6}{3}(25 + 9 + 15) = 98$.
      resposta: '98'
    - enunciado: 'Uma pirâmide de altura 12 tem base de área 144. Um plano paralelo à base, a 4 do vértice, determina uma secção. Calcule a área da secção.'
      espaco: 8
      resolucao: |
        Razão $\tfrac{4}{12} = \tfrac{1}{3}$: área $\tfrac{144}{9} = 16$.
      resposta: '16'
  - nome: Nível 2
    questoes:
    - texto: |
        Para um tronco de bases de áreas 36 e 4 e altura 6, Davi calculou $V = 6 \cdot \frac{36 + 4}{2} = 120$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 10
      resolucao: |
        O tronco não é um prisma com a média das bases. $V = \tfrac{6}{3}(36 + 4 + 12) = 104$.
      resposta: '104'
    - enunciado: 'Um tronco de pirâmide quadrangular regular tem bases de lados 12 e 6 e altura 4. Calcule o apótema do tronco, a aresta lateral e a área lateral.'
      espaco: 12
      resolucao: |
        Apótemas das bases 6 e 3: $a = \sqrt{16 + 9} = 5$. Na face (trapézio de bases 12 e 6), a aresta é $\sqrt{25 + 9} = \sqrt{34}$. $A_L = 4 \cdot \tfrac{18 \cdot 5}{2} = 180$.
      resposta: '5; $\sqrt{34}$; 180'
    - enunciado: 'Uma pirâmide de altura 9 tem base de área 81. Um plano paralelo à base, a 3 da base, corta a pirâmide. Complete.'
      itens:
      - 'Razão de semelhança entre a pirâmide menor e a original: {{\frac{2}{3}}}'
      - 'Volume da pirâmide original: {{243}}'
      - 'Volume da pirâmide menor: {{72}}'
      - 'Volume do tronco: {{171}}'
      espaco_item: 8
      resolucao: |
        A pirâmide menor tem altura 6: $k = \tfrac{2}{3}$. Original $\tfrac{81 \cdot 9}{3} = 243$; menor $243 \cdot \tfrac{8}{27} = 72$; tronco $171$.
      resposta: '$\frac{2}{3}$; 243; 72; 171'
    - enunciado: 'Uma floreira tem a forma de tronco de pirâmide quadrangular regular, com boca de 40 cm de lado, fundo de 20 cm de lado e 30 cm de altura. Calcule a capacidade em litros.'
      espaco: 10
      resolucao: |
        $V = \tfrac{30}{3}(1600 + 400 + 800) = 28\,000$ cm³ $= 28$ L.
      resposta: '28 L'
    - enunciado: 'Uma pirâmide quadrangular regular tem aresta da base 8 e altura 12. Um plano paralelo à base, a 9 do vértice, a corta. Calcule o volume do tronco de duas maneiras.'
      espaco: 12
      resolucao: |
        $k = \tfrac{3}{4}$: a base menor tem lado 6 e o tronco, altura 3. Diferença: $256 - 256 \cdot \tfrac{27}{64} = 256 - 108 = 148$. Fórmula: $\tfrac{3}{3}(64 + 36 + 48) = 148$.
      resposta: '148'
    - enunciado: 'Um tronco de pirâmide triangular regular tem bases de lados 6 e 3 e altura 4. Calcule o volume.'
      espaco: 10
      resolucao: |
        $A_B = 9\sqrt{3}$, $A_b = \tfrac{9\sqrt{3}}{4}$, $\sqrt{A_B A_b} = \tfrac{9\sqrt{3}}{2}$. $V = \tfrac{4}{3} \cdot 9\sqrt{3}\left(1 + \tfrac{1}{4} + \tfrac{1}{2}\right) = 21\sqrt{3}$.
      resposta: '$21\sqrt{3}$'
    - enunciado: 'Um tronco de pirâmide tem volume 84 e bases de áreas 36 e 9. Calcule a altura.'
      espaco: 8
      resolucao: |
        $\tfrac{h}{3}(36 + 9 + 18) = 21h = 84$: $h = 4$.
      resposta: '4'
    - enunciado: 'Um plano paralelo à base separa de uma pirâmide uma pirâmide menor com $\frac{1}{27}$ do volume. A que fração da altura, a partir do vértice, está o plano? Qual a razão entre a área da secção e a da base?'
      espaco: 8
      resolucao: |
        $k^3 = \tfrac{1}{27}$: $k = \tfrac{1}{3}$. Áreas: $k^2 = \tfrac{1}{9}$.
      resposta: '$\frac{1}{3}$; $\frac{1}{9}$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Uma pirâmide de altura $H$ e base de área $A$ é cortada por um plano paralelo à base, a uma distância $d$ do vértice. Prove que a secção tem área $A\left(\frac{d}{H}\right)^2$ e que a pirâmide menor tem volume $V\left(\frac{d}{H}\right)^3$.'
      espaco: 12
      resolucao: |
        A pirâmide menor é semelhante à original, de razão $k = \tfrac{d}{H}$: comprimentos ficam multiplicados por $k$, áreas por $k^2$ e volumes por $k^3$ (área da base $\times k^2$ e altura $\times k$).
      resposta: 'Ver resolução'
    - enunciado: 'Prove a fórmula $V = \frac{h}{3}\left(A_B + A_b + \sqrt{A_B A_b}\right)$ para um tronco de altura $h$, completando-o com a pirâmide menor, de altura $x$.'
      espaco: 14
      resolucao: |
        Semelhança: $\tfrac{\sqrt{A_b}}{\sqrt{A_B}} = \tfrac{x}{x + h}$, logo $x = \tfrac{h\sqrt{A_b}}{\sqrt{A_B} - \sqrt{A_b}}$. $V = \tfrac{A_B(x + h) - A_b x}{3} = \tfrac{A_B h + x(A_B - A_b)}{3}$. Como $x(A_B - A_b) = h\sqrt{A_b}(\sqrt{A_B} + \sqrt{A_b}) = h(\sqrt{A_B A_b} + A_b)$, vem a fórmula.
      resposta: 'Ver resolução'
    - enunciado: 'Num tronco de pirâmide quadrangular regular de bases de lados $L$ e $\ell$ e altura $h$, prove que o apótema do tronco é $a = \sqrt{h^2 + \left(\frac{L - \ell}{2}\right)^2}$.'
      espaco: 12
      resolucao: |
        Corte pelo plano que contém a altura e os apótemas das bases: obtém-se um trapézio retângulo de bases $\tfrac{L}{2}$ e $\tfrac{\ell}{2}$, altura $h$ e lado oblíquo $a$. Pitágoras: $a^2 = h^2 + \left(\tfrac{L - \ell}{2}\right)^2$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que a área lateral de um tronco de pirâmide regular é $\frac{(P + p)\,a}{2}$, sendo $P$ e $p$ os perímetros das bases e $a$ o apótema do tronco.'
      espaco: 10
      resolucao: |
        As $n$ faces são trapézios isósceles congruentes, de bases $L$ e $\ell$ e altura $a$: $n \cdot \tfrac{(L + \ell)a}{2} = \tfrac{(nL + n\ell)a}{2}$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que o plano paralelo à base que divide uma pirâmide de altura $H$ em duas partes de mesmo volume está a $\frac{H}{\sqrt[3]{2}}$ do vértice.'
      espaco: 10
      resolucao: |
        A pirâmide menor deve ter metade do volume: $k^3 = \tfrac{1}{2}$, $k = \tfrac{1}{\sqrt[3]{2}}$, e a distância ao vértice é $kH$.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      Um vaso de concreto tem a parte interna em forma de tronco de pirâmide quadrangular regular, como na figura, com a boca de 60 cm de lado, o fundo de 30 cm de lado e 40 cm de profundidade. O paisagista precisa saber quanta terra cabe no vaso para encomendar o substrato.
    figura:
      tikz: |
        \begin{scope}[scale=.7]
        \fill[lilas!25] (0.75,0) -- (2.25,0) -- (2.75,0.5) -- (4,3.3) -- (1,3.3) -- (0,2.3) -- cycle;
        \draw[ink, line width=1pt] (0,2.3) -- (3,2.3) -- (4,3.3) -- (1,3.3) -- cycle;
        \draw[ink, line width=1pt] (0.75,0) -- (2.25,0) -- (2.75,0.5) (0,2.3) -- (0.75,0) (3,2.3) -- (2.25,0) (4,3.3) -- (2.75,0.5);
        \draw[ink, dashed] (0.75,0) -- (1.25,0.5) -- (2.75,0.5) (1.25,0.5) -- (1,3.3);
        \end{scope}
    enunciado: |
      A capacidade do vaso é
    opcoes: ['$84$ L', '$252$ L', '$90$ L', '$63$ L', '$108$ L']
    correta: A
    resolucao: |
      $V = \tfrac{40}{3}(3600 + 900 + 1800) = 84\,000$ cm³ $= 84$ L.

  - estilo: Fuvest
    enunciado: |
      Um tronco de pirâmide tem bases de áreas 50 e 8 e altura 6. O seu volume é
    opcoes: ['$174$', '$156$', '$116$', '$348$', '$468$']
    correta: B
    resolucao: |
      $\tfrac{6}{3}(50 + 8 + 20) = 156$.

  - estilo: Unicamp
    enunciado: |
      Uma pirâmide de volume 500 é cortada por um plano paralelo à base, a $\frac{2}{5}$ da altura a partir do vértice. O volume do tronco obtido é
    opcoes: ['$32$.', '$300$.', '$468$.', '$200$.']
    correta: C
    resolucao: |
      Pirâmide menor: $500 \cdot \tfrac{8}{125} = 32$. Tronco: $468$.

  - estilo: UEM
    enunciado: |
      Considere um tronco de pirâmide quadrangular regular de bases de lados 8 e 2 e altura 4. Assinale o que for correto.
    proposicoes:
    - 'O apótema do tronco mede 5.'
    - 'O volume do tronco é 112.'
    - 'A área lateral do tronco é 100.'
    - 'A área total do tronco é 168.'
    - 'A pirâmide da qual o tronco foi obtido tem altura 6.'
    - 'A aresta lateral do tronco mede $\sqrt{34}$.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) $\sqrt{16 + 3^2}$. 02) $\tfrac{4}{3}(64 + 4 + 16)$. 04) $4 \cdot \tfrac{10 \cdot 5}{2}$. 08) $100 + 64 + 4$. 16) Incorreta: $k = \tfrac{2}{8} = \tfrac{1}{4}$, $H - \tfrac{H}{4} = 4$, $H = \tfrac{16}{3}$. 32) $\sqrt{25 + 9}$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Enem
    texto: |
      Uma confeiteira fez um bolo em forma de tronco de pirâmide quadrangular regular, com a base de baixo de 30 cm de lado, o topo de 20 cm de lado e 12 cm de altura. Ela vai cobrir com glacê o topo e as quatro faces laterais, e precisa saber a área a ser coberta.
    enunciado: |
      A área a ser coberta com glacê é
    opcoes: ['$1300$ cm²', '$2600$ cm²', '$2100$ cm²', '$1700$ cm²', '$1500$ cm²']
    correta: D
    resolucao: |
      Apótema $\sqrt{12^2 + 5^2} = 13$ cm. Laterais $4 \cdot \tfrac{(30 + 20) \cdot 13}{2} = 1300$; topo $400$. Total $1700$ cm².

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir, sobre pirâmides e troncos de pirâmide.
    afirmativas:
    - 'Um plano paralelo à base, na metade da altura, separa uma pirâmide com $\frac{1}{8}$ do volume original.'
    - 'As bases de um tronco de pirâmide são polígonos semelhantes.'
    - 'As faces laterais de um tronco de pirâmide regular são trapézios isósceles.'
    - 'O volume de um tronco de altura $h$ é $h \cdot \frac{A_B + A_b}{2}$.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'I e IV, apenas.', 'II e IV, apenas.', 'III e IV, apenas.', 'I, II e III, apenas.']
    correta: E
    resolucao: |
      I. Correta. II. Correta. III. Correta. IV. Incorreta: $V = \tfrac{h}{3}(A_B + A_b + \sqrt{A_B A_b})$.

  - estilo: Unesp
    enunciado: |
      Um plano paralelo à base de uma pirâmide determina uma pirâmide menor cuja altura é $\frac{3}{5}$ da altura da original. A razão entre os volumes da menor e da original é
    opcoes: ['$\frac{27}{125}$', '$\frac{9}{25}$', '$\frac{3}{5}$', '$\frac{98}{125}$', '$\frac{2}{5}$']
    correta: A
    resolucao: |
      $\left(\tfrac{3}{5}\right)^3$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      A figura mostra um tronco de pirâmide quadrangular regular de bases de lados 14 e 6 e altura 3.
    figura:
      tikz: |
        \begin{scope}[scale=.8]
        \draw[ink, line width=1pt] (0,0) -- (3,0) -- (4,1) (0,0) -- (1,2.05) (3,0) -- (2.5,2.05) (4,1) -- (3,2.55);
        \draw[ink, line width=1pt] (1,2.05) -- (2.5,2.05) -- (3,2.55) -- (1.5,2.55) -- cycle;
        \draw[ink, dashed] (0,0) -- (1,1) -- (4,1) (1,1) -- (1.5,2.55);
        \draw[roxo, dashed] (2,0.5) -- (2,2.3);
        \node[below, font=\scriptsize] at (1.5,0) {$14$};
        \node[above, font=\scriptsize] at (2.25,2.55) {$6$};
        \node[right, font=\scriptsize] at (2,1.2) {$3$};
        \end{scope}
    enunciado: |
      A área lateral do tronco é
    opcoes: ['$160$.', '$200$.', '$232$.', '$400$.']
    correta: B
    resolucao: |
      Apótemas das bases 7 e 3: $a = \sqrt{9 + 16} = 5$. $A_L = 4 \cdot \tfrac{(14 + 6) \cdot 5}{2} = 200$.

  - estilo: Fuvest
    enunciado: |
      Um tronco de pirâmide tem bases de áreas 54 e 6 e altura 9. O seu volume é
    opcoes: ['$270$', '$180$', '$234$', '$702$', '$252$']
    correta: C
    resolucao: |
      $\sqrt{54 \cdot 6} = 18$: $\tfrac{9}{3}(54 + 6 + 18) = 234$.

  - estilo: UFSC
    enunciado: |
      Uma pirâmide quadrangular regular tem aresta da base 12 e altura 12. Um plano paralelo à base, a 8 do vértice, a divide numa pirâmide menor e num tronco. Assinale o que for correto.
    proposicoes:
    - 'A secção tem área 64.'
    - 'A pirâmide menor tem volume $\frac{512}{3}$.'
    - 'O tronco tem volume $\frac{1216}{3}$.'
    - 'O tronco tem altura 4.'
    - 'A secção é um quadrado de lado 8.'
    - 'O tronco tem metade do volume da pirâmide original.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      $k = \tfrac{2}{3}$. 01) $144 \cdot \tfrac{4}{9}$. 02) Original $576$; menor $576 \cdot \tfrac{8}{27}$. 04) $576 - \tfrac{512}{3}$. 08) $12 - 8$. 16) $12 \cdot \tfrac{2}{3}$. 32) Incorreta: $\tfrac{19}{27}$ do volume.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      A caçamba de um caminhão basculante tem a forma de um tronco de pirâmide de bases retangulares semelhantes. O fundo mede 4 m por 2 m, a abertura mede 6 m por 3 m, e a altura é de 1,5 m. A empresa precisa saber o volume de terra transportado com a caçamba cheia até a borda.
    enunciado: |
      O volume da caçamba é
    opcoes: ['$19$ m³', '$39$ m³', '$13$ m³', '$57$ m³', '$26$ m³']
    correta: A
    resolucao: |
      $A_B = 18$, $A_b = 8$, $\sqrt{144} = 12$: $V = \tfrac{1{,}5}{3}(18 + 8 + 12) = 19$ m³.

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'Se a pirâmide menor tem metade da altura da original, a secção tem $\frac{1}{4}$ da área da base.'
    - 'Cortando uma pirâmide a $\frac{1}{3}$ da altura, a partir do vértice, o tronco tem $\frac{2}{3}$ do volume.'
    - 'Um tronco de bases de áreas 9 e 1 e altura 3 tem volume 13.'
    - 'Um tronco de pirâmide quadrangular regular de bases de lados 6 e 2 e altura $2\sqrt{2}$ tem aresta lateral 4.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – F – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – V – V – F.', 'V – F – V – V.']
    correta: E
    resolucao: |
      (V) (F) Tem $\tfrac{26}{27}$. (V) $1 \cdot (9 + 1 + 3)$. (V) As semidiagonais são $3\sqrt{2}$ e $\sqrt{2}$: aresta $\sqrt{8 + 8} = 4$.

  - estilo: Enem
    texto: |
      Uma loja de jardinagem vende cinco modelos de vaso, todos com a parte interna em forma de tronco de pirâmide quadrangular regular, com a boca maior que o fundo. O quadro mostra o lado da boca, o lado do fundo e a profundidade de cada modelo, em decímetros. O cliente quer o vaso de maior capacidade.
    tabela:
      cabecalho: ['Vaso', 'Boca', 'Fundo', 'Profundidade']
      linhas:
      - ['T1', '$6$', '$3$', '$10$']
      - ['T2', '$8$', '$2$', '$9$']
      - ['T3', '$10$', '$2$', '$6$']
      - ['T4', '$9$', '$3$', '$6$']
      - ['T5', '$7$', '$4$', '$9$']
    enunciado: |
      O vaso de maior capacidade é o
    opcoes: ['T1.', 'T2.', 'T4.', 'T5.', 'T3.']
    correta: D
    resolucao: |
      Em dm³: T1 $\tfrac{10}{3} \cdot 63 = 210$; T2 $3 \cdot 84 = 252$; T3 $2 \cdot 124 = 248$; T4 $2 \cdot 117 = 234$; T5 $3 \cdot 93 = 279$.

  - estilo: Unesp
    enunciado: |
      Um tronco de pirâmide tem volume 152 e bases de áreas 36 e 16. A sua altura é
    opcoes: ['$4$', '$6$', '$8$', '$3$', '$\frac{19}{3}$']
    correta: B
    resolucao: |
      $\tfrac{h}{3}(36 + 16 + 24) = \tfrac{76h}{3} = 152$: $h = 6$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Uma pirâmide de volume 540 é cortada por dois planos paralelos à base que dividem a sua altura em três partes iguais. Assinale o que for correto.
    proposicoes:
    - 'A parte de cima, uma pirâmide, tem volume 20.'
    - 'A parte do meio tem volume 140.'
    - 'A parte de baixo tem volume 380.'
    - 'As áreas das duas secções estão na razão 1 para 4.'
    - 'As três partes têm o mesmo volume.'
    - 'A parte de baixo tem mais da metade do volume da pirâmide.'
    corretas: [1, 2, 3, 4, 6]
    resolucao: |
      01) $540 \cdot \tfrac{1}{27}$. 02) $540 \cdot \tfrac{8}{27} - 20 = 160 - 20$. 04) $540 - 160$. 08) $\left(\tfrac{1}{3}\right)^2 : \left(\tfrac{2}{3}\right)^2$. 16) Incorreta. 32) $380 > 270$.
      Soma: $01 + 02 + 04 + 08 + 32 = 47$.

  - estilo: Unicamp
    enunciado: |
      Um tronco de pirâmide quadrangular regular tem bases de lados 9 e 6 e altura 5. A altura da pirâmide da qual ele foi obtido é
