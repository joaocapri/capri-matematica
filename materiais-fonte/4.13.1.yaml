# Aula 4.13.1 — Geometria espacial: pirâmides, elementos e áreas
# Padrão 4: vestibular e aprofundamento no formato das provas reais (modelo: 1.21.3).
# As três listas completas (padrão 4). `estilo` é só controle interno: não é impresso.
# Escopo da aula: elementos (vértice, base, arestas, altura h, apótema da base m, apótema da pirâmide g, aresta lateral);
# pirâmide regular; relações g² = h² + m² e aresta² = g² + (a/2)²; área lateral P·g/2 e área total; tetraedro regular (área
# a²√3, altura a√6/3); pirâmide de faces equiláteras; ângulo entre face e base; secção paralela à base (área na razão k²).
# Volume fica para a 4.13.2.
padrao: 4

fixacao:
  intro: Resolva no espaço de cada questão, na ordem. Nas questões de completar, escreva no traço. $h$ é a altura, $m$ o apótema da base e $g$ o apótema da pirâmide (altura de uma face lateral). O gabarito resolvido está no final.
  secoes:
  - nome: Nível 1
    questoes:
    - enunciado: 'Uma pirâmide quadrangular regular tem aresta da base 8 e altura 3. Complete.'
      itens:
      - 'Apótema da base: {{4}}'
      - 'Apótema da pirâmide: {{5}}'
      - 'Aresta lateral: {{\sqrt{41}}}'
      - 'Área lateral: {{80}}'
      - 'Área total: {{144}}'
      espaco_item: 8
      resolucao: |
        $m = 4$; $g = \sqrt{9 + 16} = 5$; aresta $\sqrt{25 + 16} = \sqrt{41}$; $A_l = 4 \cdot \tfrac{8 \cdot 5}{2} = 80$; $A_T = 80 + 64$.
      resposta: '4; 5; $\sqrt{41}$; 80; 144'
    - enunciado: 'Associe cada elemento de uma pirâmide regular à sua descrição.'
      esquerda:
      - 'altura'
      - 'apótema da pirâmide'
      - 'apótema da base'
      - 'aresta lateral'
      - 'aresta da base'
      direita:
      - 'segmento do vértice a um vértice da base'
      - 'distância do centro da base a um lado dela'
      - 'distância do vértice ao plano da base'
      - 'lado do polígono da base'
      - 'altura de uma face lateral, a partir do vértice'
      resolucao: |
        Altura, apótema da base e apótema da pirâmide formam um triângulo retângulo: $g^2 = h^2 + m^2$.
      resposta: 'De cima para baixo: 4, 3, 1, 5, 2'
    - enunciado: 'Marque V (verdadeiro) ou F (falso).'
      afirmacoes:
      - 'Numa pirâmide regular, a base é um polígono regular e o vértice se projeta no centro da base.'
      - 'O apótema da pirâmide é igual à altura.'
      - 'As faces laterais de uma pirâmide regular são triângulos isósceles congruentes.'
      - 'O tetraedro regular tem as 4 faces triangulares equiláteras.'
      justificar: true
      espaco: 20
      resolucao: |
        (V) (F) O apótema é hipotenusa: $g^2 = h^2 + m^2$, logo $g > h$. (V) (V)
      resposta: V, F, V, V
    - enunciado: 'Complete com a área total de cada tetraedro regular de aresta $a$, que é $a^2\sqrt{3}$.'
      tabela:
        cabecalho: ['$a$', 'Área total']
        linhas:
        - ['$2$', '${{4\sqrt{3}}}$']
        - ['$4$', '${{16\sqrt{3}}}$']
        - ['$\sqrt{3}$', '${{3\sqrt{3}}}$']
        - ['$6$', '${{36\sqrt{3}}}$']
      resolucao: |
        Quatro triângulos equiláteros: $4 \cdot \tfrac{a^2\sqrt{3}}{4} = a^2\sqrt{3}$.
      resposta: '$4\sqrt{3}$; $16\sqrt{3}$; $3\sqrt{3}$; $36\sqrt{3}$'
    - enunciado: 'Na pirâmide regular da figura, $h = 12$ e $m = 5$. Calcule o apótema $g$ da pirâmide.'
      figura:
        tikz: |
          \begin{scope}[scale=.8]
          \draw[ink, line width=1pt] (0,0) -- (3,0) -- (4,1) (0,0) -- (2,3) -- (3,0) (2,3) -- (4,1);
          \draw[ink, dashed] (0,0) -- (1,1) -- (4,1) (1,1) -- (2,3);
          \draw[roxo, dashed] (2,3) -- (2,0.5) -- (1.5,0);
          \draw[roxo, line width=1pt] (2,3) -- (1.5,0);
          \node[right, font=\scriptsize] at (2,1.6) {$h$};
          \node[below right, font=\scriptsize] at (1.75,0.3) {$m$};
          \node[left, font=\scriptsize] at (1.7,1.5) {$g$};
          \end{scope}
      espaco: 8
      resolucao: |
        $g = \sqrt{144 + 25} = 13$.
      resposta: '13'
    - enunciado: 'Uma pirâmide hexagonal regular tem aresta da base 4 e apótema 10. Calcule a área lateral e a área total.'
      espaco: 10
      resolucao: |
        $A_l = 6 \cdot \tfrac{4 \cdot 10}{2} = 120$. Base $6 \cdot \tfrac{16\sqrt{3}}{4} = 24\sqrt{3}$. $A_T = 120 + 24\sqrt{3}$.
      resposta: '120; $120 + 24\sqrt{3}$'
    - enunciado: 'Uma pirâmide triangular regular tem aresta da base 6 e aresta lateral 5. Calcule o apótema da pirâmide e a área lateral.'
      espaco: 10
      resolucao: |
        Na face, triângulo isósceles de lados 5, 5 e 6: altura $\sqrt{25 - 9} = 4$. $A_l = 3 \cdot \tfrac{6 \cdot 4}{2} = 36$.
      resposta: '$g = 4$; 36'
  - nome: Nível 2
    questoes:
    - texto: |
        Para uma pirâmide quadrangular regular de aresta da base 6 e altura 4, Rui calculou $A_l = 4 \cdot \frac{6 \cdot 4}{2} = 48$.
      enunciado: 'Encontre o erro e corrija.'
      espaco: 10
      resolucao: |
        A altura de cada face é o apótema da pirâmide, não a altura do sólido: $g = \sqrt{16 + 9} = 5$ e $A_l = 4 \cdot 15 = 60$.
      resposta: '60'
    - enunciado: 'Um tetraedro regular tem aresta 6. Calcule a altura de uma face e a altura do tetraedro.'
      espaco: 12
      resolucao: |
        Face: $3\sqrt{3}$. O vértice se projeta no baricentro da base, a $\tfrac{2}{3} \cdot 3\sqrt{3} = 2\sqrt{3}$ de cada vértice: $h = \sqrt{36 - 12} = 2\sqrt{6}$.
      resposta: '$3\sqrt{3}$ e $2\sqrt{6}$'
    - enunciado: 'Um telhado de quatro águas tem a forma da superfície lateral de uma pirâmide regular de base quadrada de 8 m de lado e 3 m de altura. Com 20 telhas por metro quadrado, quantas telhas são necessárias?'
      espaco: 10
      resolucao: |
        $g = \sqrt{9 + 16} = 5$ m; área $4 \cdot \tfrac{8 \cdot 5}{2} = 80$ m². Telhas: $1600$.
      resposta: '1600'
    - enunciado: 'Uma pirâmide quadrangular regular tem todas as arestas iguais a 4. Calcule o apótema, a altura e a área total.'
      espaco: 12
      resolucao: |
        Faces equiláteras: $g = 2\sqrt{3}$. $h = \sqrt{12 - 4} = 2\sqrt{2}$. $A_T = 16 + 4 \cdot 4\sqrt{3} = 16 + 16\sqrt{3}$.
      resposta: '$2\sqrt{3}$; $2\sqrt{2}$; $16 + 16\sqrt{3}$'
    - enunciado: 'Complete para pirâmides quadrangulares regulares de aresta da base $a$ e altura $h$.'
      tabela:
        cabecalho: ['$a$', '$h$', '$g$', '$A_l$']
        linhas:
        - ['$6$', '$4$', '${{5}}$', '${{60}}$']
        - ['$10$', '$12$', '${{13}}$', '${{260}}$']
        - ['$16$', '$6$', '${{10}}$', '${{320}}$']
      resolucao: |
        $g = \sqrt{h^2 + (a/2)^2}$ e $A_l = 2ag$.
      resposta: '5, 60; 13, 260; 10, 320'
    - enunciado: 'Uma pirâmide hexagonal regular tem aresta da base 2 e aresta lateral 4. Calcule a altura e o apótema da pirâmide.'
      espaco: 12
      resolucao: |
        O raio da base é 2: $h = \sqrt{16 - 4} = 2\sqrt{3}$. Na face: $g = \sqrt{16 - 1} = \sqrt{15}$.
      resposta: '$2\sqrt{3}$ e $\sqrt{15}$'
    - enunciado: 'Uma pirâmide tem base de área 36. Um plano paralelo à base corta a pirâmide na metade da altura. Calcule a área da secção.'
      espaco: 8
      resolucao: |
        A pirâmide menor é semelhante à original, de razão $\tfrac{1}{2}$: área $\tfrac{36}{4} = 9$.
      resposta: '9'
    - enunciado: 'Uma pirâmide quadrangular regular tem aresta da base 6 e altura $3\sqrt{3}$. Calcule o ângulo entre uma face lateral e a base.'
      espaco: 10
      resolucao: |
        No triângulo de catetos $h$ e $m = 3$: $\operatorname{tg}\theta = \tfrac{3\sqrt{3}}{3} = \sqrt{3}$, $\theta = 60°$.
      resposta: '$60°$'
  - nome: Nível 3
    questoes:
    - enunciado: 'Prove que a área lateral de uma pirâmide regular é $\frac{P \cdot g}{2}$, sendo $P$ o perímetro da base.'
      espaco: 10
      resolucao: |
        As $n$ faces são triângulos congruentes de base igual ao lado $\ell$ e altura $g$: $n \cdot \tfrac{\ell g}{2} = \tfrac{(n\ell)g}{2}$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que a altura de um tetraedro regular de aresta $a$ é $\frac{a\sqrt{6}}{3}$.'
      espaco: 12
      resolucao: |
        O vértice se projeta no centro da base, a $R = \tfrac{a\sqrt{3}}{3}$ de cada vértice. $h^2 = a^2 - \tfrac{a^2}{3} = \tfrac{2a^2}{3}$: $h = \tfrac{a\sqrt{6}}{3}$.
      resposta: 'Ver resolução'
    - enunciado: 'Numa pirâmide regular de aresta da base $a$, prove que $g^2 = h^2 + m^2$ e que a aresta lateral $\ell$ satisfaz $\ell^2 = g^2 + \left(\frac{a}{2}\right)^2$.'
      espaco: 12
      resolucao: |
        A altura é perpendicular à base e, portanto, ao apótema da base: triângulo retângulo de catetos $h$, $m$ e hipotenusa $g$. Na face isósceles, $g$ é perpendicular ao lado da base no seu ponto médio: catetos $g$ e $\tfrac{a}{2}$, hipotenusa $\ell$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que um plano paralelo à base, a uma distância $d$ do vértice, determina uma secção de área $A_b\left(\frac{d}{h}\right)^2$.'
      espaco: 12
      resolucao: |
        O plano determina uma pirâmide menor, semelhante à original, de razão $k = \tfrac{d}{h}$ (razão das alturas). As áreas correspondentes estão na razão $k^2$.
      resposta: 'Ver resolução'
    - enunciado: 'Prove que a área total de uma pirâmide quadrangular regular com todas as arestas iguais a $a$ é $a^2(1 + \sqrt{3})$.'
      espaco: 10
      resolucao: |
        Base $a^2$ e quatro faces equiláteras: $4 \cdot \tfrac{a^2\sqrt{3}}{4} = a^2\sqrt{3}$.
      resposta: 'Ver resolução'

vestibular:
  questoes:
  # ---------------- Nível 1 ----------------
  - estilo: Enem
    texto: |
      A entrada de um museu é uma pirâmide de vidro com base quadrada de 30 m de lado e 20 m de altura, como na figura. As quatro faces laterais são inteiramente de vidro, e a empresa de limpeza cobra pela área de vidro a ser lavada.
    figura:
      tikz: |
        \begin{scope}[scale=.7]
        \draw[ink, line width=1pt, fill=lilas!20] (0,0) -- (3,0) -- (2,2.2) -- cycle;
        \draw[ink, line width=1pt, fill=lilas!35] (3,0) -- (4,1) -- (2,2.2) -- cycle;
        \draw[ink, dashed] (0,0) -- (1,1) -- (4,1) (1,1) -- (2,2.2);
        \end{scope}
    enunciado: |
      A área de vidro é
    opcoes: ['$1200$ m²', '$1500$ m²', '$2400$ m²', '$900$ m²', '$3000$ m²']
    correta: B
    resolucao: |
      Apótema $\sqrt{20^2 + 15^2} = 25$ m. $A_l = 4 \cdot \tfrac{30 \cdot 25}{2} = 1500$ m².

  - estilo: Fuvest
    enunciado: |
      A área total de um tetraedro regular de aresta $2\sqrt{3}$ é
    opcoes: ['$12\sqrt{3}$', '$36$', '$6\sqrt{3}$', '$12$', '$24\sqrt{3}$']
    correta: A
    resolucao: |
      $a^2\sqrt{3} = 12\sqrt{3}$.

  - estilo: Unicamp
    enunciado: |
      Uma pirâmide quadrangular regular tem aresta da base 6 e aresta lateral 5. A sua área lateral é
    opcoes: ['$48$.', '$60$.', '$84$.', '$30$.']
    correta: A
    resolucao: |
      Apótema $\sqrt{25 - 9} = 4$; $A_l = 4 \cdot \tfrac{6 \cdot 4}{2} = 48$.

  - estilo: UEM
    enunciado: |
      Uma pirâmide quadrangular regular tem aresta da base 12 e altura 8. Assinale o que for correto.
    proposicoes:
    - 'O apótema da base mede 6.'
    - 'O apótema da pirâmide mede 10.'
    - 'A área lateral é 240.'
    - 'A área total é 384.'
    - 'A aresta lateral mede 10.'
    corretas: [1, 2, 3, 4]
    resolucao: |
      01) Metade de 12. 02) $\sqrt{64 + 36}$. 04) $4 \cdot 60$. 08) $240 + 144$. 16) Incorreta: $\sqrt{100 + 36} = 2\sqrt{34}$.
      Soma: $01 + 02 + 04 + 08 = 15$.

  - estilo: Enem
    texto: |
      Uma barraca de acampamento tem a forma de uma pirâmide hexagonal regular, como na figura, sem lona no piso. Cada lado da base mede 2 m, e a altura de cada face triangular, medida pela lona do chão até o topo, é de 3 m. O fabricante precisa da área de lona de cada barraca.
    figura:
      tikz: |
        \begin{scope}[scale=.8]
        \foreach \k/\l in {3/4, 4/5, 5/0} \draw[ink, line width=1pt] ({cos(60*\k)},{0.35*sin(60*\k)}) -- ({cos(60*\l)},{0.35*sin(60*\l)});
        \foreach \k/\l in {0/1, 1/2, 2/3} \draw[ink, dashed] ({cos(60*\k)},{0.35*sin(60*\k)}) -- ({cos(60*\l)},{0.35*sin(60*\l)});
        \foreach \k in {0, 3, 4, 5} \draw[ink, line width=1pt] ({cos(60*\k)},{0.35*sin(60*\k)}) -- (0,2);
        \foreach \k in {1, 2} \draw[ink, dashed] ({cos(60*\k)},{0.35*sin(60*\k)}) -- (0,2);
        \end{scope}
    enunciado: |
      A área de lona é
    opcoes: ['$12$ m²', '$36$ m²', '$18$ m²', '$6\sqrt{3}$ m²', '$9$ m²']
    correta: C
    resolucao: |
      $A_l = 6 \cdot \tfrac{2 \cdot 3}{2} = 18$ m².

  - estilo: UEL
    enunciado: |
      Considere as afirmativas a seguir, sobre pirâmides.
    afirmativas:
    - 'Uma pirâmide cuja base tem $n$ lados tem $n$ faces laterais.'
    - 'Numa pirâmide regular, as arestas laterais são congruentes.'
    - 'Numa pirâmide regular, o apótema da pirâmide é maior que a altura.'
    - 'A área lateral de uma pirâmide regular é o perímetro da base vezes a altura, dividido por 2.'
    comando: 'É correto o que se afirma em'
    opcoes: ['I e II, apenas.', 'II e IV, apenas.', 'III e IV, apenas.', 'I, II e III, apenas.', 'I, II, III e IV.']
    correta: D
    resolucao: |
      I. Correta. II. Correta. III. $g^2 = h^2 + m^2$. IV. Incorreta: usa-se o apótema $g$, não a altura.

  - estilo: Unesp
    enunciado: |
      Uma pirâmide triangular regular tem aresta da base 6 e apótema 5. A sua área lateral é
    opcoes: ['$30$', '$90$', '$15$', '$60$', '$45$']
    correta: E
    resolucao: |
      $3 \cdot \tfrac{6 \cdot 5}{2} = 45$.

  # ---------------- Nível 2 ----------------
  - estilo: Unicamp
    texto: |
      A figura mostra uma pirâmide quadrangular regular de aresta da base 10 e altura 12.
    figura:
      tikz: |
        \begin{scope}[scale=.7]
        \draw[ink, line width=1pt, fill=lilas!20] (0,0) -- (3,0) -- (2,3.2) -- cycle;
        \draw[ink, line width=1pt, fill=lilas!35] (3,0) -- (4,1) -- (2,3.2) -- cycle;
        \draw[ink, dashed] (0,0) -- (1,1) -- (4,1) (1,1) -- (2,3.2) (2,3.2) -- (2,0.5);
        \end{scope}
    enunciado: |
      A área total da pirâmide é
    opcoes: ['$360$.', '$260$.', '$460$.', '$300$.']
    correta: A
    resolucao: |
      $g = \sqrt{144 + 25} = 13$; $A_l = 4 \cdot 65 = 260$; $A_T = 260 + 100 = 360$.

  - estilo: Fuvest
    enunciado: |
      A altura de um tetraedro regular de aresta 6 é
    opcoes: ['$3\sqrt{3}$', '$2\sqrt{6}$', '$4\sqrt{2}$', '$6$', '$3\sqrt{2}$']
    correta: B
    resolucao: |
      $\tfrac{a\sqrt{6}}{3} = 2\sqrt{6}$.

  - estilo: UFSC
    enunciado: |
      Uma pirâmide quadrangular regular tem todas as arestas iguais a 4. Assinale o que for correto.
    proposicoes:
    - 'As faces laterais são triângulos equiláteros.'
    - 'O apótema da pirâmide mede $2\sqrt{3}$.'
    - 'A altura mede $2\sqrt{2}$.'
    - 'A área total é $16 + 16\sqrt{3}$.'
    - 'Cada aresta lateral forma ângulo de $45°$ com o plano da base.'
    - 'A área lateral é 64.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) Correta. 02) Altura do equilátero de lado 4. 04) $\sqrt{12 - 4}$. 08) $16 + 4 \cdot 4\sqrt{3}$. 16) A projeção da aresta é a semidiagonal $2\sqrt{2}$, igual à altura. 32) Incorreta: $16\sqrt{3}$.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Enem
    texto: |
      O telhado de uma casa é de quatro águas e tem a forma da superfície lateral de uma pirâmide regular de base quadrada de 12 m de lado, com 2,5 m de altura. O mestre de obras precisa da área do telhado para encomendar as telhas.
    enunciado: |
      A área do telhado é
    opcoes: ['$144$ m²', '$120$ m²', '$156$ m²', '$78$ m²', '$180$ m²']
    correta: C
    resolucao: |
      Apótema $\sqrt{2{,}5^2 + 6^2} = 6{,}5$ m. Área $4 \cdot \tfrac{12 \cdot 6{,}5}{2} = 156$ m².

  - estilo: UFPR
    enunciado: |
      Identifique como verdadeiras (V) ou falsas (F) as afirmativas a seguir.
    afirmacoes:
    - 'As 4 faces de um tetraedro regular são triângulos equiláteros.'
    - 'A altura de uma pirâmide regular é igual ao apótema da pirâmide.'
    - 'As faces laterais de uma pirâmide regular são triângulos isósceles congruentes.'
    - 'Um plano paralelo à base, na metade da altura, determina uma secção com $\frac{1}{4}$ da área da base.'
    comando: 'Assinale a alternativa que apresenta a sequência correta, de cima para baixo.'
    opcoes: ['V – V – V – F.', 'F – F – V – V.', 'V – F – F – V.', 'V – F – V – V.', 'V – V – F – V.']
    correta: D
    resolucao: |
      (V) (F) $g > h$. (V) (V) Razão $\tfrac{1}{2}$, áreas na razão $\tfrac{1}{4}$.

  - estilo: Enem
    texto: |
      Uma fábrica de brinquedos vai produzir pirâmides regulares de papelão (só as faces laterais) e quer o modelo que gasta menos material. O quadro mostra, para cada modelo, a base e o apótema da pirâmide, em centímetros.
    tabela:
      cabecalho: ['Modelo', 'Base', 'Apótema']
      linhas:
      - ['M1', 'quadrado de lado 6', '$5$']
      - ['M2', 'triângulo equilátero de lado 8', '$6$']
      - ['M3', 'hexágono regular de lado 4', '$4$']
      - ['M4', 'quadrado de lado 5', '$6$']
      - ['M5', 'triângulo equilátero de lado 6', '$7$']
    enunciado: |
      O modelo que gasta menos papelão é o
    opcoes: ['M3.', 'M1.', 'M2.', 'M4.', 'M5.']
    correta: A
    resolucao: |
      $A_l = \tfrac{P \cdot g}{2}$: M1 60; M2 72; M3 $\tfrac{24 \cdot 4}{2} = 48$; M4 60; M5 63 (cm²).

  - estilo: Unesp
    enunciado: |
      Uma pirâmide hexagonal regular tem aresta da base 2 e aresta lateral 4. A sua altura é
    opcoes: ['$2$', '$\sqrt{15}$', '$4$', '$2\sqrt{2}$', '$2\sqrt{3}$']
    correta: E
    resolucao: |
      O raio da base é 2: $h = \sqrt{16 - 4} = 2\sqrt{3}$.

  # ---------------- Nível 3 ----------------
  - estilo: UEM
    enunciado: |
      Considere um tetraedro regular de aresta $a$. Assinale o que for correto.
    proposicoes:
    - 'A área total é $a^2\sqrt{3}$.'
    - 'A altura é $\frac{a\sqrt{6}}{3}$.'
    - 'Para $a = 6$, a área total é $36\sqrt{3}$.'
    - 'O apótema (altura de uma face) é $\frac{a\sqrt{3}}{2}$.'
    - 'O vértice se projeta no baricentro da face oposta.'
    - 'A altura é igual à aresta.'
    corretas: [1, 2, 3, 4, 5]
    resolucao: |
      01) 4 faces de $\tfrac{a^2\sqrt{3}}{4}$. 02) $\sqrt{a^2 - \tfrac{a^2}{3}}$. 04) $36\sqrt{3}$. 08) Correta. 16) As arestas laterais iguais projetam-se em segmentos iguais: circuncentro, que é o baricentro. 32) Incorreta.
      Soma: $01 + 02 + 04 + 08 + 16 = 31$.

  - estilo: Unicamp
    enunciado: |
      Uma pirâmide tem base de área 81. Um plano paralelo à base, a $\frac{1}{3}$ da altura a partir do vértice, determina uma secção de área
    opcoes: ['$27$.', '$9$.', '$3$.', '$36$.']
    correta: B
    resolucao: |
      Razão $\tfrac{1}{3}$: área $\tfrac{81}{9} = 9$.

  - estilo: Enem
    texto_comum:
      questoes: 2
      texto: |
        Uma luminária pendente, presa ao teto por um fio, tem a forma de uma pirâmide quadrangular regular aberta embaixo (sem a base) e é feita de chapa metálica pintada. A aresta da base mede 40 cm, e a altura da luminária é de 15 cm.
    enunciado: |
      A área de chapa da luminária é
    opcoes: ['$1200$ cm²', '$1600$ cm²', '$2000$ cm²', '$3600$ cm²', '$2400$ cm²']
    correta: C
    resolucao: |
      Apótema $\sqrt{15^2 + 20^2} = 25$ cm; $4 \cdot \tfrac{40 \cdot 25}{2} = 2000$ cm².

  - estilo: Unesp
    enunciado: |
      A aresta lateral da luminária mede, aproximadamente,
    opcoes: ['$25$ cm', '$28$ cm', '$35$ cm', '$32$ cm', '$40$ cm']
    correta: D
    resolucao: |
      $\sqrt{25^2 + 20^2} = \sqrt{1025} \approx 32$ cm.

  - estilo: Fuvest
    enunciado: |
      Uma pirâmide quadrangular regular tem aresta da base 6 e altura $3\sqrt{3}$. O ângulo entre uma face lateral e o plano da base mede
    opcoes: ['$30°$', '$45°$', '$75°$', '$90°$', '$60°$']
    correta: E
    resolucao: |
      $\operatorname{tg}\theta = \tfrac{h}{m} = \tfrac{3\sqrt{3}}{3} = \sqrt{3}$.

  - estilo: Unesp
    texto: |
      Na figura, a pirâmide tem base retangular de 6 por 8, e o vértice está sobre o centro da base, a 12 de altura.
    figura:
      tikz: |
        \begin{scope}[scale=.25]
        \draw[ink, line width=1pt] (0,0) -- (8,0) -- (10,3) (0,0) -- (5,12) -- (8,0) (5,12) -- (10,3);
        \draw[ink, dashed] (0,0) -- (2,3) -- (10,3) (2,3) -- (5,12) (5,12) -- (5,1.5);
        \end{scope}
    enunciado: |
      Cada aresta lateral mede
    opcoes: ['$12$', '$13$', '$\sqrt{153}$', '$\sqrt{160}$', '$14$']
