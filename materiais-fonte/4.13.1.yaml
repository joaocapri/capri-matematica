      A semidiagonal da base mede 5: $\sqrt{144 + 25} = 13$.

aprofundamento:
  questoes:
  - estilo: Fuvest
    enunciado: 'Considere uma pirâmide regular de base com $n$ lados de medida $a$, altura $h$, apótema da base $m$ e apótema $g$.'
    itens:
    - 'Prove que $A_l = \frac{n a g}{2}$.'
    - 'Prove que $g^2 = h^2 + m^2$.'
    - 'Para a pirâmide hexagonal regular de aresta da base 6 e altura 9, calcule $g$ e $A_l$.'
    espaco: 62
    resolucao: |
      a) $n$ triângulos de base $a$ e altura $g$.
      b) A altura é perpendicular ao plano da base: triângulo retângulo de catetos $h$ e $m$.
      c) $m = 3\sqrt{3}$; $g = \sqrt{81 + 27} = 6\sqrt{3}$; $A_l = \tfrac{6 \cdot 6 \cdot 6\sqrt{3}}{2} = 108\sqrt{3}$.
    resposta: 'c) $6\sqrt{3}$ e $108\sqrt{3}$'

  - estilo: Unicamp
    enunciado: 'Considere um tetraedro regular de aresta $a$.'
    itens:
    - 'Calcule a altura de uma face e a área total.'
    - 'Calcule a altura do tetraedro.'
    - 'Calcule o cosseno do ângulo entre uma aresta lateral e o plano da base.'
    espaco: 62
    resolucao: |
      a) $\tfrac{a\sqrt{3}}{2}$; $a^2\sqrt{3}$.
      b) A projeção do vértice é o centro da base, a $\tfrac{a\sqrt{3}}{3}$ dos vértices: $h = \tfrac{a\sqrt{6}}{3}$.
      c) A projeção da aresta mede $\tfrac{a\sqrt{3}}{3}$: $\cos\theta = \tfrac{\sqrt{3}}{3}$.
    resposta: 'a) $\frac{a\sqrt{3}}{2}$ e $a^2\sqrt{3}$; b) $\frac{a\sqrt{6}}{3}$; c) $\frac{\sqrt{3}}{3}$'

  - estilo: ITA
    enunciado: |
      Uma pirâmide quadrangular regular tem faces laterais equiláteras e área total $4 + 4\sqrt{3}$. A sua altura é
    opcoes: ['$1$', '$2$', '$\sqrt{2}$', '$\sqrt{3}$', '$2\sqrt{2}$']
    correta: C
    espaco: 22
    resolucao: |
      $a^2(1 + \sqrt{3}) = 4(1 + \sqrt{3})$: $a = 2$. Semidiagonal $\sqrt{2}$: $h = \sqrt{4 - 2} = \sqrt{2}$.
    resposta: 'C'

  - estilo: Unesp
    texto: |
      O telhado de quatro águas de uma casa tem a forma da superfície lateral de uma pirâmide regular de base quadrada de 10 m de lado e 1,5 m de altura.
    enunciado: ''
    itens:
    - 'Calcule o apótema da pirâmide e a área do telhado, com $\sqrt{27{,}25} \approx 5{,}22$.'
    - 'Com 16 telhas por metro quadrado e 10\% a mais para perdas, quantas telhas comprar?'
    - 'Calcule a inclinação do telhado, $\frac{h}{m}$, em porcentagem.'
    espaco: 62
    resolucao: |
      a) $g = \sqrt{1{,}5^2 + 5^2} = \sqrt{27{,}25} \approx 5{,}22$ m; área $\approx 4 \cdot \tfrac{10 \cdot 5{,}22}{2} = 104{,}4$ m².
      b) $104{,}4 \cdot 16 \cdot 1{,}1 \approx 1837{,}4$: 1838 telhas.
      c) $\tfrac{1{,}5}{5} = 30\%$.
    resposta: 'a) $\approx 104{,}4$ m²; b) 1838; c) 30\%'

  - estilo: UFSC
    enunciado: |
      Considere pirâmides regulares. Assinale o que for correto.
    proposicoes:
    - 'O apótema da pirâmide é maior que a altura.'
    - 'A aresta lateral é maior que o apótema da pirâmide.'
    - 'Um plano paralelo à base, na metade da altura, determina uma secção com $\frac{1}{4}$ da área da base.'
    - 'Um tetraedro regular de aresta 2 tem área total $4\sqrt{3}$.'
    - 'Uma pirâmide de base hexagonal tem 6 arestas.'
    - 'Uma pirâmide quadrangular regular com todas as arestas iguais a 2 tem área total $4 + 4\sqrt{3}$.'
    corretas: [1, 2, 3, 4, 6]
    espaco: 22
    resolucao: |
      01) $g^2 = h^2 + m^2$. 02) $\ell^2 = g^2 + \tfrac{a^2}{4}$. 04) Razão $\tfrac{1}{2}$. 08) $4\sqrt{3}$. 16) Incorreta: tem 12. 32) $4 + 4 \cdot \sqrt{3}$.
    resposta: 'Soma 47 (01 + 02 + 04 + 08 + 32)'

  - estilo: Fuvest
    enunciado: 'Uma pirâmide de altura 12 tem base de área 64. Um plano paralelo à base corta a pirâmide.'
    itens:
    - 'Prove que a área da secção, a uma distância $d$ do vértice, é $64\left(\frac{d}{12}\right)^2$.'
    - 'A que distância do vértice a secção tem área 16?'
    - 'A que distância da base deve passar o plano para que a secção tenha metade da área da base?'
    espaco: 62
    resolucao: |
      a) A pirâmide menor é semelhante, de razão $\tfrac{d}{12}$.
      b) $\left(\tfrac{d}{12}\right)^2 = \tfrac{1}{4}$: $d = 6$.
      c) $\tfrac{d}{12} = \tfrac{\sqrt{2}}{2}$: $d = 6\sqrt{2}$; distância da base $12 - 6\sqrt{2}$.
    resposta: 'b) 6; c) $12 - 6\sqrt{2}$'

  - estilo: Unicamp
    texto: |
      A entrada de um museu é uma pirâmide de vidro de base quadrada de 30 m de lado e 20 m de altura.
    enunciado: ''
    itens:
    - 'Calcule o apótema e a área de vidro das faces laterais.'
    - 'Calcule a aresta lateral, com $\sqrt{850} \approx 29{,}2$.'
    - 'Calcule a tangente do ângulo entre uma face e o chão.'
    espaco: 62
    resolucao: |
      a) $g = 25$ m; $1500$ m².
      b) Semidiagonal $15\sqrt{2}$: $\sqrt{400 + 450} = \sqrt{850} \approx 29{,}2$ m.
      c) $\tfrac{20}{15} = \tfrac{4}{3}$.
    resposta: 'a) 25 m e 1500 m²; b) $\approx 29{,}2$ m; c) $\frac{4}{3}$'

  - estilo: Fuvest
    enunciado: |
      Uma pirâmide triangular regular tem aresta da base 6 e apótema 5. A sua altura é
    opcoes: ['$\sqrt{22}$', '$4$', '$\sqrt{13}$', '$5$', '$2\sqrt{3}$']
    correta: A
    espaco: 22
    resolucao: |
      Apótema da base (raio da inscrita): $\tfrac{6\sqrt{3}}{6} = \sqrt{3}$. $h = \sqrt{25 - 3} = \sqrt{22}$.
    resposta: 'A'

  - estilo: Unesp
    enunciado: 'Uma pirâmide tem base retangular de 6 por 8, e o vértice está sobre o centro da base, a 12 de altura.'
    itens:
    - 'Calcule as arestas laterais.'
    - 'Calcule as alturas das faces laterais (dois tipos).'
    - 'Calcule a área lateral.'
    espaco: 62
    resolucao: |
      a) $\sqrt{144 + 25} = 13$.
      b) Faces sobre os lados de 8: o centro dista 3 deles, $\sqrt{144 + 9} = 3\sqrt{17}$. Sobre os lados de 6: distância 4, $\sqrt{144 + 16} = 4\sqrt{10}$.
      c) $2 \cdot \tfrac{8 \cdot 3\sqrt{17}}{2} + 2 \cdot \tfrac{6 \cdot 4\sqrt{10}}{2} = 24\sqrt{17} + 24\sqrt{10}$.
    resposta: 'a) 13; b) $3\sqrt{17}$ e $4\sqrt{10}$; c) $24(\sqrt{17} + \sqrt{10})$'

  - estilo: Fuvest
    enunciado: 'Um octaedro regular de aresta $a$ pode ser visto como duas pirâmides quadrangulares regulares coladas pela base.'
    itens:
    - 'Calcule a área total do octaedro.'
    - 'Calcule a altura de cada pirâmide.'
    - 'Calcule a distância entre dois vértices opostos e mostre que ela é a diagonal do quadrado comum.'
    espaco: 62
    resolucao: |
      a) 8 triângulos equiláteros: $2a^2\sqrt{3}$.
      b) Semidiagonal $\tfrac{a\sqrt{2}}{2}$: $h = \sqrt{a^2 - \tfrac{a^2}{2}} = \tfrac{a\sqrt{2}}{2}$.
      c) $2h = a\sqrt{2}$, a diagonal do quadrado de lado $a$.
    resposta: 'a) $2a^2\sqrt{3}$; b) $\frac{a\sqrt{2}}{2}$; c) $a\sqrt{2}$'
