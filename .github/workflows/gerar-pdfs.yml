name: Gerar PDFs das aulas
on:
  push:
    branches: [main]
    paths:
      - 'conteudos/*.json'
      - 'scripts/gerar_pdfs.py'
      - '.github/workflows/gerar-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    name: Lista e gabarito
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências de PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --disable-pip-version-check reportlab==4.4.4
      - name: Validar e gerar PDFs
        run: python scripts/gerar_pdfs.py
      - name: Publicar PDFs na branch principal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdfs/*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: atualiza PDFs das aulas [skip ci]"
            git push
          fi
