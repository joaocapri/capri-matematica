name: Validar layout desktop e celular
on:
  push:
    branches: [main]
    paths:
      - 'assets/site.css'
      - 'assets/site.js'
      - 'tests/browser.cjs'
      - '.github/workflows/testar-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Iniciar servidor local
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/capri-server.log 2>&1 </dev/null &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/capri-server.log
          exit 1
      - name: Testar experiência em navegador real
        run: node tests/browser.cjs
      - name: Guardar capturas para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capri-capturas-desktop-mobile
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
