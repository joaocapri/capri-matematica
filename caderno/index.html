<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbfaf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Caderno | MAT com JOÃO!</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/caderno.css">
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']},startup:{typeset:false}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
<script type="module" src="/assets/caderno.js"></script>
</head>
<body data-ferramenta="caneta">
<header class="cd-bar" id="cd-bar">
  <div class="cd-bar-esq">
    <a class="cd-ib" id="cd-voltar" href="/" aria-label="Voltar para a aula" title="Voltar para a aula">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="cd-titulo"><b id="cd-titulo">Caderno</b><small id="cd-sub"></small></div>
  </div>

  <div class="cd-bar-meio" role="toolbar" aria-label="Ferramentas de escrita">
    <button type="button" class="cd-ib" data-ferramenta="caneta" aria-pressed="true" aria-label="Caneta" title="Caneta (P) · toque de novo para estilo e espessura">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.2-4.6L15.8 4.8a2 2 0 012.8 0l.6.6a2 2 0 010 2.8L8.6 18.8z"/><path d="M13.8 6.8l3.4 3.4"/></svg>
    </button>
    <button type="button" class="cd-ib" data-ferramenta="marca" aria-pressed="false" aria-label="Marca-texto" title="Marca-texto (M)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 15l-3 3h5l1-1"/><path d="M9 15l7.5-7.5a2 2 0 012.8 0l.2.2a2 2 0 010 2.8L12 18z"/><path d="M4 21h16"/></svg>
    </button>
    <button type="button" class="cd-ib" data-ferramenta="borracha" aria-pressed="false" aria-label="Borracha" title="Borracha (E)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20h12"/><path d="M5.6 15.4l8.8-8.8a2 2 0 012.8 0l2.2 2.2a2 2 0 010 2.8L12 19H8.4z"/><path d="M9.6 11.4l5 5"/></svg>
    </button>
    <button type="button" class="cd-ib" id="cd-formas" aria-pressed="false" aria-label="Formas perfeitas" title="Formas perfeitas (F) · ou desenhe e segure no fim">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20.5l6-10 6 10z"/><circle cx="17" cy="7" r="3.5"/></svg>
    </button>
    <span class="cd-sep" aria-hidden="true"></span>
    <button type="button" class="cd-traco" id="cd-traco" aria-haspopup="dialog" aria-expanded="false" aria-controls="cd-painel" title="Cor, estilo e espessura">
      <span class="cd-traco-cor" id="cd-traco-cor"></span><canvas id="cd-traco-amostra" width="44" height="18" aria-hidden="true"></canvas>
    </button>
    <span class="cd-sep" aria-hidden="true"></span>
    <button type="button" class="cd-ib" id="cd-desfazer" aria-label="Desfazer" title="Desfazer (Ctrl+Z)" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>
    </button>
    <button type="button" class="cd-ib" id="cd-refazer" aria-label="Refazer" title="Refazer (Ctrl+Shift+Z)" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg>
    </button>
  </div>

  <div class="cd-bar-dir">
    <button type="button" class="cd-ib" id="cd-mais-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="cd-menu" aria-label="Mais opções" title="Papel, escrever com o dedo, enunciado">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
    </button>
    <button type="button" class="cd-exportar" id="cd-exportar" disabled aria-haspopup="menu" aria-expanded="false" aria-controls="cd-exp-menu" title="Exportar em PDF ou levar para o GoodNotes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg><span>Exportar</span>
    </button>
  </div>

  <section class="cd-pop cd-painel" id="cd-painel" role="dialog" aria-label="Cor, estilo e espessura" hidden>
    <div class="cd-painel-sec"><h2>Cor</h2><div class="cd-painel-cores" id="cd-painel-cores"></div></div>
    <div class="cd-painel-sec" id="cd-estilos-sec"><h2>Estilo da caneta</h2><div class="cd-estilos" id="cd-estilos" role="radiogroup" aria-label="Estilo da caneta"></div></div>
    <div class="cd-painel-sec">
      <h2><span>Espessura</span><output id="cd-esp-valor">0,5 mm</output></h2>
      <input type="range" id="cd-esp" min="0" max="100" step="1" aria-label="Espessura do traço">
      <canvas class="cd-previa" id="cd-previa" aria-hidden="true"></canvas>
    </div>
  </section>

  <section class="cd-pop cd-exp" id="cd-exp-menu" role="menu" aria-label="Exportar" hidden>
    <button type="button" role="menuitem" id="cd-exp-resolvida"><b>Lista resolvida em PDF</b><small>Com tudo o que você escreveu aqui</small></button>
    <button type="button" role="menuitem" id="cd-exp-gn"><b>Levar para o GoodNotes</b><small>A lista em branco, uma questão por página, para resolver lá</small></button>
  </section>

  <section class="cd-pop cd-menu" id="cd-menu" role="menu" aria-label="Mais opções" hidden>
    <label class="cd-menu-item">Papel
      <select id="cd-papel" aria-label="Papel do rascunho">
        <option value="quadriculado">Quadriculado</option>
        <option value="pautado">Pautado</option>
        <option value="pontilhado">Pontilhado</option>
        <option value="liso">Liso</option>
      </select>
    </label>
    <label class="cd-menu-item"><span>Escrever com o dedo<small>Para quem não tem caneta. Dois dedos movem a folha.</small></span><input type="checkbox" id="cd-dedo" role="switch"></label>
    <label class="cd-menu-item"><span>Mostrar o enunciado<small>Desligue para ter a folha toda livre.</small></span><input type="checkbox" id="cd-enun" role="switch" checked></label>
  </section>
</header>

<main class="cd-folha" id="cd-folha" aria-label="Folha de rascunho">
  <canvas id="cd-tela" aria-label="Questão e rascunho. Escreva com a caneta; o dedo move a folha e dois dedos dão zoom."></canvas>
  <canvas id="cd-vivo" aria-hidden="true"></canvas>
  <div class="cd-gab" id="cd-gab" hidden></div>
  <div class="cd-carregando" id="cd-carregando">Abrindo a lista…</div>
</main>

<div class="cd-dica" id="cd-dica" hidden>
  <p><b>A tela toda é a sua folha de rascunho</b>, com a questão no canto. Escreva com a caneta; o dedo arrasta a folha e <b>dois dedos dão zoom</b>.</p>
  <p>Desenhe e <b>segure no fim</b> para a forma ficar perfeita. Terminou? Toque em <b>Conferir</b>.</p>
  <button type="button" id="cd-dica-ok">Começar</button>
</div>

<div class="cd-zoomtag" id="cd-zoomtag" role="group" aria-label="Zoom">
  <button type="button" id="cd-menos" aria-label="Diminuir zoom">−</button>
  <button type="button" id="cd-ajustar" title="Ajustar à tela"><span id="cd-zoom">100%</span></button>
  <button type="button" id="cd-mais" aria-label="Aumentar zoom">+</button>
</div>

<nav class="cd-nav" id="cd-nav" aria-label="Questões" hidden>
  <button type="button" class="cd-nav-seta" id="cd-ant" aria-label="Questão anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button type="button" class="cd-nav-q" id="cd-qbtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="cd-mapa"><b id="cd-qnum">1</b><small id="cd-qinfo">de 20</small></button>
  <button type="button" class="cd-nav-seta" id="cd-prox" aria-label="Próxima questão"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  <button type="button" class="cd-conferir" id="cd-conferir" aria-expanded="false" aria-controls="cd-resp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg><span>Conferir</span></button>
  <section class="cd-pop cd-mapa" id="cd-mapa" role="dialog" aria-label="Ir para a questão" hidden><div class="cd-mapa-grade" id="cd-mapa-grade"></div></section>
</nav>

<aside class="cd-resp" id="cd-resp" aria-label="Resposta e resolução" hidden></aside>
<div class="cd-pronto" id="cd-pronto" role="dialog" aria-label="PDF pronto" hidden>
  <span id="cd-pronto-txt">PDF pronto</span>
  <button type="button" id="cd-pronto-abrir">Abrir</button>
  <button type="button" id="cd-pronto-x" aria-label="Fechar">×</button>
</div>
<p class="cd-status" id="cd-status" role="status" aria-live="polite"></p>
</body>
</html>
